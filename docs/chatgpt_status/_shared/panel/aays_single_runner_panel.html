<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAYS Single Runner Panel</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --ink: #18212f;
      --muted: #627085;
      --line: #d9dee8;
      --ok: #d9f3e3;
      --warn: #fff0c2;
      --bad: #ffe0df;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      justify-content: flex-end;
    }
    main { padding: 16px 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }
    th {
      background: #eef1f6;
      color: #334057;
      font-weight: 650;
      white-space: nowrap;
    }
    tr.ok { background: var(--ok); }
    tr.warn { background: var(--warn); }
    tr.bad { background: var(--bad); }
    .small { color: var(--muted); font-size: 12px; }
    .empty {
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--card);
    }
  </style>
</head>
<body>
  <header>
    <h1>AAYS Single Shared Runner Panel</h1>
    <div class="meta">
      <span id="repo">repo: loading</span>
      <span id="runner">runner: loading</span>
      <span id="updated">updated: loading</span>
    </div>
  </header>
  <main>
    <div id="mount" class="empty">Loading panel index...</div>
  </main>
  <script>
    const sources = [
      "page_status_index_latest.json",
      "/england_map_web/data/runner_panel/page_status_index.json"
    ];
    const menuOrder = new Map([
      ["auto-1.4-readyToSell", 1],
      ["auto-3.5-parcelLabel", 2],
      ["auto-6.7-security", 3],
      ["auto-5.6-gasEmission", 4],
      ["auto-4.6-heightDifferance", 5]
    ]);

    async function loadIndex() {
      let lastError = null;
      for (const source of sources) {
        try {
          const response = await fetch(source, { cache: "no-store" });
          if (response.ok) return response.json();
          lastError = new Error(`${source}: ${response.status}`);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("panel index not found");
    }

    function rowClass(row) {
      const status = String(row.runner_status || row.single_runner_status || "");
      if (status.includes("Problem") || status.includes("blocked")) return "bad";
      if (status.includes("Runner Aktif") || status.includes("active")) return "ok";
      return "warn";
    }

    function render(index) {
      document.getElementById("repo").textContent = `repo: ${index.repo_root || ""}`;
      document.getElementById("runner").textContent = `runner: ${index.single_runner_status || index.single_runner_active}`;
      document.getElementById("updated").textContent = `updated: ${index.updated_at || index.generated_at || ""}`;
      const rows = Array.from(index.pages || []).sort((a, b) => {
        const ao = menuOrder.get(a.display_name) || 1000;
        const bo = menuOrder.get(b.display_name) || 1000;
        return ao - bo || String(a.page_key).localeCompare(String(b.page_key));
      });
      if (!rows.length) {
        document.getElementById("mount").className = "empty";
        document.getElementById("mount").textContent = "No page rows in panel index.";
        return;
      }
      document.getElementById("mount").className = "";
      document.getElementById("mount").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Menu</th>
              <th>Page key</th>
              <th>Status</th>
              <th>Percent</th>
              <th>Final</th>
              <th>Task</th>
              <th>Heartbeat</th>
              <th>Blocker</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr class="${rowClass(row)}">
                <td>${row.display_name || row.menu_name || ""}</td>
                <td>${row.page_key || ""}</td>
                <td>${row.runner_status || row.single_runner_status || ""}</td>
                <td>${Number(row.completion_percent || 0)}%</td>
                <td>${String(row.final_ready || false)}</td>
                <td><div>${row.latest_task_id || ""}</div><div class="small">${row.latest_queue_task || ""}</div></td>
                <td>${row.last_heartbeat_at || row.heartbeat_at || ""}</td>
                <td>${row.latest_blocker || ""}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
    }

    loadIndex().then(render).catch(err => {
      document.getElementById("mount").className = "empty";
      document.getElementById("mount").textContent = `Panel index could not be loaded: ${err.message}`;
    });
  </script>
</body>
</html>
