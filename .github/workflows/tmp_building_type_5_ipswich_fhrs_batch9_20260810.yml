name: tmp building_type_5 Ipswich FHRS batch 9

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_5_ipswich_fhrs_batch9_20260810.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append exactly 50 new Ipswich FHRS evidence features
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import hashlib
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          slot_id = "building_type_5"
          expected_task_id = "building-type-5-england-classification-v1-20260808"
          expected_before = 400
          expected_target = 450
          city = "Ipswich"
          batch_index_expected = 9
          source_name = "Food Standards Agency FHRS daily open data - Ipswich"
          source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS299en-GB.xml"

          shard_path = Path("england_map_web/data/building_type/shards/building_type_5_latest.geojson")
          manifest_path = Path("england_map_web/data/building_type/shards/building_type_5_manifest_latest.json")
          checkpoint_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json")
          status_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json")
          task_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json")
          runner_path = Path("docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json")

          shard = json.loads(shard_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))
          features = shard.get("features") or []
          before = len(features)

          assert task.get("slot_id") == slot_id, f"wrong slot {task.get('slot_id')}"
          assert task.get("task_id") == expected_task_id, "task changed"
          assert task.get("owner") is None, "current_task owner is not null; refusing second owner/task"
          assert status.get("owner") is None, "status owner is not null; refusing second owner/task"
          assert before == expected_before, f"stale shard count {before} != {expected_before}"
          assert int(checkpoint.get("current_feature_count", -1)) == before, "checkpoint/shard count mismatch"
          assert int(checkpoint.get("next_batch_index", -1)) == batch_index_expected, "batch index changed"
          assert int(checkpoint.get("next_target_feature_count", -1)) == expected_target, "target changed"
          assert int(status.get("feature_count_after", -1)) == before, "status/shard count mismatch"
          assert checkpoint.get("fake_data") is False and status.get("fake_data") is False and manifest.get("fake_data") is False, "fake_data guard"
          assert checkpoint.get("final_ready") is False and status.get("final_ready") is False and manifest.get("final_ready") is False, "final_ready guard"
          assert features, "empty shard"

          processed = set()
          for f in features:
              p = f.get("properties") or {}
              for value in (f.get("id"), p.get("parcel_id"), p.get("osm_id")):
                  if value is not None and str(value).strip():
                      processed.add(str(value).strip())

          req = urllib.request.Request(source_url, headers={"User-Agent": "AAYS-building-type/1.0"})
          with urllib.request.urlopen(req, timeout=90) as resp:
              raw = resp.read()
          assert len(raw) > 1000, "FHRS source response unexpectedly small"
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def text(el, wanted):
              for child in el.iter():
                  if local(child.tag) == wanted:
                      return (child.text or "").strip()
              return ""

          def classify(business_type):
              b = business_type.strip().lower()
              if "school" in b or "college" in b or "university" in b:
                  return "education", "P_EDUCATION", "institutional"
              if "hospital" in b or "caring" in b or "childcare" in b:
                  return "healthcare_care", "P_HEALTHCARE", "institutional"
              if "hotel" in b or "bed & breakfast" in b or "guest house" in b:
                  return "hospitality", "C_HOTEL", "commercial"
              if "pub" in b or "bar" in b or "nightclub" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "restaurant" in b or "cafe" in b or "canteen" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "takeaway" in b or "sandwich" in b:
                  return "commercial_hospitality", "C_TAKEAWAY", "commercial"
              if "retailer" in b or "supermarket" in b or "hypermarket" in b:
                  return "commercial_retail", "C_RETAIL", "commercial"
              if "distributor" in b or "transporter" in b:
                  return "warehouse", "C_LOGISTICS", "commercial"
              if "manufacturer" in b or "packer" in b:
                  return "industrial", "I_MANUFACTURING", "industrial"
              return "commercial_other", "C_OTHER", "commercial"

          candidates = []
          for el in root.iter():
              if local(el.tag) != "EstablishmentDetail":
                  continue
              fhrsid = text(el, "FHRSID")
              if not fhrsid:
                  continue
              feature_id = f"IPS_FHRS_{fhrsid}"
              parcel_id = f"IPS_FHRSID_{fhrsid}"
              if feature_id in processed or parcel_id in processed or fhrsid in processed:
                  continue
              la = text(el, "LocalAuthorityName")
              if la and "ipswich" not in la.lower():
                  continue
              business_type = text(el, "BusinessType")
              if not business_type or "mobile caterer" in business_type.lower():
                  continue
              try:
                  lat = float(text(el, "Latitude"))
                  lon = float(text(el, "Longitude"))
              except (TypeError, ValueError):
                  continue
              if not (51.95 <= lat <= 52.15 and 0.90 <= lon <= 1.30):
                  continue
              candidates.append((int(fhrsid) if fhrsid.isdigit() else 10**18, fhrsid, el, lat, lon))

          candidates.sort(key=lambda x: (x[0], x[1]))
          assert len(candidates) >= 50, f"only {len(candidates)} eligible Ipswich FHRS candidates outside already_processed_ids"

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          new_features = []
          new_ids = []
          for _, fhrsid, el, lat, lon in candidates[:50]:
              feature_id = f"IPS_FHRS_{fhrsid}"
              parcel_id = f"IPS_FHRSID_{fhrsid}"
              business_name = text(el, "BusinessName")
              business_type = text(el, "BusinessType")
              business_type_id = text(el, "BusinessTypeID")
              labid = text(el, "LocalAuthorityBusinessID")
              la = text(el, "LocalAuthorityName") or "Ipswich"
              postcode = text(el, "PostCode")
              rating = text(el, "RatingValue")
              rating_date = text(el, "RatingDate")
              primary, code, category = classify(business_type)
              excerpt = (
                  f"FHRSID {fhrsid} | {business_name} | BusinessType {business_type} | "
                  f"LocalAuthority {la} | PostCode {postcode} | coordinates {lat:.6f},{lon:.6f}"
              )
              props = {
                  "parcel_id": parcel_id,
                  "parcel_id_semantics": "stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": None,
                  "slot_id": slot_id,
                  "region": "East of England",
                  "area": city,
                  "local_authority": la,
                  "postcode": postcode,
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "classification_source": "FSA FHRS BusinessType premises-use proxy",
                  "source_url": source_url,
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "source_count": 1,
                  "evidence_level": "D",
                  "evidence_score": 0.55,
                  "confidence_score": 0.55,
                  "confidence": 0.55,
                  "confidence_level_1_to_4": 2,
                  "match_method": "fhrs_business_type_premises_proxy",
                  "evidence_excerpt": excerpt,
                  "source_evidence_excerpt": excerpt,
                  "snapshot_date": now[:10],
                  "geometry_match_method": "source_geocoded_point_only",
                  "address_match_method": "source_record_address",
                  "needs_manual_review": True,
                  "fake_data": False,
                  "final_ready": False,
                  "status": "classified_proxy_only",
                  "limitations": "FHRS BusinessType supports current premises use only; it does not prove cadastral parcel identity or building fabric/type.",
                  "sources": [{
                      "source_name": source_name,
                      "url_or_local_path": source_url,
                      "accessed_at": now,
                      "sha256": source_sha,
                      "sha256_scope": "raw_source_xml",
                      "licence": "FSA FHRS open data terms",
                      "granularity": "food_business_establishment",
                      "fields_used": ["FHRSID", "BusinessName", "BusinessType", "BusinessTypeID", "LocalAuthorityBusinessID", "LocalAuthorityName", "PostCode", "Latitude", "Longitude"],
                      "supports_field": "building_type_primary",
                      "match_method": "fhrs_business_type_premises_proxy",
                      "match_score": 0.55
                  }],
                  "source_record": {
                      "FHRSID": fhrsid,
                      "BusinessName": business_name,
                      "BusinessType": business_type,
                      "BusinessTypeID": business_type_id,
                      "LocalAuthorityBusinessID": labid,
                      "LocalAuthorityName": la,
                      "PostCode": postcode,
                      "RatingValue": rating,
                      "RatingDate": rating_date
                  },
                  "updated_at": now
              }
              new_features.append({"type": "Feature", "id": feature_id, "geometry": {"type": "Point", "coordinates": [lon, lat]}, "properties": props})
              new_ids.append(feature_id)

          assert len(new_features) == 50 and len(set(new_ids)) == 50
          assert not (set(new_ids) & processed), "feature.id collision"
          for feat in new_features:
              p = feat["properties"]
              assert str(p["parcel_id"]) not in processed, "parcel_id collision"
              assert p["osm_id"] is None
              assert p["fake_data"] is False and p["final_ready"] is False
              assert p["evidence_excerpt"] and p["evidence_level"] == "D"
              assert 1 <= int(p["confidence_level_1_to_4"]) <= 4
              assert p["sources"] and p["source_url"] and p["source_hash"]

          shard["features"] = features + new_features
          after = len(shard["features"])
          assert after == expected_target and after == before + 50 and after > before
          if isinstance(shard.get("metadata"), dict):
              shard["metadata"].update({
                  "feature_count": after,
                  "feature_count_before": before,
                  "feature_count_after": after,
                  "last_batch_index": batch_index_expected,
                  "last_batch_city": city,
                  "last_batch_source": source_name,
                  "updated_at": now,
                  "fake_data": False,
                  "final_ready": False
              })
          shard_path.write_text(json.dumps(shard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          output_sha = hashlib.sha256(shard_path.read_bytes()).hexdigest()

          props_all = [(f.get("properties") or {}) for f in shard["features"]]
          ev = Counter(str(p.get("evidence_level") or "U") for p in props_all)
          conf = Counter(str(p.get("confidence_level_1_to_4") or 1) for p in props_all)
          types = Counter(str(p.get("building_type_primary") or "unknown") for p in props_all)
          unknown = types.get("unknown", 0)
          classified = after - unknown

          sources = manifest.get("sources") or []
          sources.append({
              "name": source_name,
              "url": source_url,
              "features_used": 50,
              "accessed_at": now,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "evidence_level": "D",
              "confidence_level_1_to_4": 2,
              "note": "FHRS BusinessType premises-use proxy; not cadastral parcel geometry or building-fabric evidence."
          })
          manifest.update({
              "generated_at": now,
              "total_features": after,
              "feature_count": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": {k: ev.get(k, 0) for k in ["A", "B", "C", "D", "U"]},
              "type_distribution": dict(sorted(types.items())),
              "confidence_level_distribution": {k: conf.get(k, 0) for k in ["1", "2", "3", "4"]},
              "sources": sources,
              "fake_data": False,
              "final_ready": False,
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": 50,
              "last_batch_index": batch_index_expected,
              "last_batch_city": city,
              "last_batch_source": source_name,
              "last_batch_source_sha256": source_sha,
              "geojson_sha256": output_sha,
              "geojson_path": str(shard_path),
              "manifest_updated_at": now,
              "note": "Existing shard preserved; appended 50 Ipswich FHRS records outside all prior feature.id, parcel_id and osm_id values."
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          status.update({
              "state": "IN_PROGRESS",
              "updated_at": now,
              "owner": None,
              "final_ready": False,
              "fake_data": False,
              "classified_count": classified,
              "unknown_count": unknown,
              "total_elements": after,
              "feature_count_before": before,
              "feature_count_after": after,
              "progress_count_delta": 50,
              "next_batch_index": batch_index_expected + 1,
              "next_target_feature_count": after + 50,
              "confidence_distribution": {k: conf.get(k, 0) for k in ["1", "2", "3", "4"]},
              "evidence_distribution": {k: ev.get(k, 0) for k in ["A", "B", "C", "D", "U"]},
              "output_sha256": output_sha,
              "candidate_batch": None,
              "no_progress_reason": None,
              "note": "Batch 9 appended from official Ipswich FHRS records outside all prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.",
              "new_feature_count": 50,
              "last_batch_index": batch_index_expected,
              "last_batch_city": city,
              "last_batch_source": source_name,
              "progress_reason": "50 new Ipswich FHRS premises-use proxy records appended after feature.id/parcel_id/osm_id exclusion"
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          checkpoint.update({
              "first_unverified_step": "AŞAMA_1_OSM_GENISLETME_APPEND_NEW_BATCH_THEN_OPTIONAL_EPC_VOA_HMLR_UPGRADE",
              "first_unverified_step_status": "BATCH_9_APPENDED_50_IPSWICH_FHRS_CONTINUATION_REQUIRED",
              "terminal_status": "IN_PROGRESS",
              "updated_at": now,
              "final_ready": False,
              "state": "IN_PROGRESS",
              "feature_count_before": before,
              "feature_count_after": after,
              "current_feature_count": after,
              "next_batch_index": batch_index_expected + 1,
              "next_target_feature_count": after + 50,
              "last_processed_ids_sample": new_ids[-20:],
              "already_processed_ids_policy": "Treat every existing shard feature.id, properties.parcel_id and properties.osm_id as already_processed_ids; never replay them.",
              "candidate_batch": None,
              "no_progress_reason": None,
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL OSM/EPC/VOA/HMLR CORROBORATION FOR FHRS PROXY RECORDS",
              "fake_data": False,
              "last_batch": {
                  "batch_index": batch_index_expected,
                  "city": city,
                  "source": source_name,
                  "source_url": source_url,
                  "source_sha256": source_sha,
                  "evidence_level": "D",
                  "confidence_level_1_to_4": 2,
                  "added_feature_count": 50,
                  "new_feature_ids": new_ids
              }
          })
          checkpoint["summary"] = dict(checkpoint.get("summary") or {})
          checkpoint["summary"].update({
              "progress_count_delta": 50,
              "new_features_appended": 50,
              "current_feature_count": after
          })
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          runner = {
              "slot_id": slot_id,
              "task_id": expected_task_id,
              "generated_at": now,
              "batch_index": batch_index_expected,
              "city": city,
              "source_name": source_name,
              "source_url": source_url,
              "source_sha256": source_sha,
              "feature_count_before": before,
              "feature_count_after": after,
              "new_feature_count": 50,
              "new_feature_ids": new_ids,
              "evidence_level": "D",
              "confidence_level_1_to_4": 2,
              "match_method": "fhrs_business_type_premises_proxy",
              "limitations": "Premises-use proxy only; cadastral parcel identity and building fabric remain unverified.",
              "already_processed_ids_policy_applied": True,
              "fake_data": False,
              "final_ready": False,
              "output_sha256": output_sha
          }
          runner_path.parent.mkdir(parents=True, exist_ok=True)
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          ids_all = [str(f.get("id")) for f in shard["features"] if f.get("id") is not None]
          assert len(ids_all) == len(set(ids_all)), "duplicate feature.id after append"
          assert len(shard["features"]) == 450
          assert status["feature_count_after"] > status["feature_count_before"]
          assert manifest["fake_data"] is False and manifest["final_ready"] is False
          assert status["fake_data"] is False and status["final_ready"] is False
          assert checkpoint["fake_data"] is False and checkpoint["final_ready"] is False
          print(f"SUCCESS before={before} after={after} added=50 source_sha={source_sha} candidates={len(candidates)}")
          PY

      - name: Commit verified append and remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp_building_type_5_ipswich_fhrs_batch9_20260810.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add england_map_web/data/building_type/shards/building_type_5_latest.geojson \
                  england_map_web/data/building_type/shards/building_type_5_manifest_latest.json \
                  docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json \
                  .github/workflows/tmp_building_type_5_ipswich_fhrs_batch9_20260810.yml
          git commit -m "data(building_type_5): append batch 9 Ipswich FHRS features"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then
              git merge --abort || true
              echo "merge conflict; refusing to overwrite concurrent changes"
              exit 1
            fi
          done
          exit 1

      - name: Remove temporary workflow after failed append
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          git checkout -B cleanup origin/codex/aays-single-runner-v5-20260706
          if [ -f .github/workflows/tmp_building_type_5_ipswich_fhrs_batch9_20260810.yml ]; then
            rm .github/workflows/tmp_building_type_5_ipswich_fhrs_batch9_20260810.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/tmp_building_type_5_ipswich_fhrs_batch9_20260810.yml
            git commit -m "chore: remove failed building_type_5 Ipswich batch 9 workflow"
            git push origin HEAD:codex/aays-single-runner-v5-20260706 || true
          fi
