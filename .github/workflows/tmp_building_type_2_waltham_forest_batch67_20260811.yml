name: tmp building_type_2 Waltham Forest FHRS continuation batch 67

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_waltham_forest_batch67_20260811.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new Waltham Forest FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:.github/workflows/tmp_building_type_2_waltham_forest_batch57_20260810.yml > /tmp/template.yml
          python3 <<'PY'
          from pathlib import Path
          text=Path('/tmp/template.yml').read_text(encoding='utf-8')
          anchor='      - name: Append exactly 50 new Waltham Forest FHRS continuation features'
          marker="          python3 <<'PY'\n"
          a=text.index(anchor); start=text.index(marker,a)+len(marker); end=text.index("\n          PY",start)
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())+'\n'
          replacements=[
            ('BEFORE=2800; TARGET=2850; BATCH=57; NEXT_BATCH=58; NEXT_TARGET=2900','BEFORE=3300; TARGET=3350; BATCH=67; NEXT_BATCH=68; NEXT_TARGET=3400'),
            ('Batch 57 appended from official Waltham Forest FHRS continuation records','Batch 67 appended from official Waltham Forest FHRS continuation records'),
            ('BATCH_57_APPENDED_50_WALTHAM_FOREST_FHRS_CONTINUATION_REQUIRED','BATCH_67_APPENDED_50_WALTHAM_FOREST_FHRS_CONTINUATION_REQUIRED'),
            ('feature_count 2800 -> 2850','feature_count 3300 -> 3350'),
            ("Sonraki adim batch 58: mevcut 2850 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 2850 kaydi tekrar isleme.","Sonraki adim batch 68: mevcut 3350 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 3350 kaydi tekrar isleme.")
          ]
          for old,new in replacements:
              if old not in body: raise AssertionError(f'missing replacement token: {old}')
              body=body.replace(old,new)

          old='assert int(s.get("features_used",0))==50\n        s.update({"name":SOURCE,"features_used":100'
          new='assert int(s.get("features_used",0))==100\n        s.update({"name":SOURCE,"features_used":150'
          assert old in body, 'missing Waltham Forest cumulative source token'
          body=body.replace(old,new,1)

          required=['CITY="Waltham Forest"','FHRS531en-GB.xml','BEFORE=3300; TARGET=3350; BATCH=67; NEXT_BATCH=68; NEXT_TARGET=3400','processed_fhrs_ids','features_used":150','evidence_excerpt','"evidence_level":"D"','"confidence_level_1_to_4":2','"fake_data":False','"final_ready":False']
          missing=[x for x in required if x not in body]
          assert not missing, missing
          exec(compile(body,'<building_type_2_waltham_forest_batch67>','exec'),{'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          URL='https://ratings.food.gov.uk/api/open-data-files/FHRS531en-GB.xml'
          shard=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json').read_text())
          checkpoint=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json').read_text())
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json').read_text())
          runner=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json').read_text())
          assert len(shard.get('features') or [])==3350
          assert manifest.get('feature_count_before')==3300 and manifest.get('feature_count_after')==3350 and manifest.get('added_feature_count')==50
          assert checkpoint.get('current_feature_count')==3350 and checkpoint.get('next_batch_index')==68 and checkpoint.get('next_target_feature_count')==3400
          assert status.get('current_feature_count')==3350 and runner.get('feature_count_before')==3300 and runner.get('feature_count_after')==3350 and runner.get('added_feature_count')==50
          assert task.get('owner') is None and task.get('task_id')=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          assert runner.get('already_processed_ids_policy_applied') is True and runner.get('city')=='Waltham Forest'
          ids=list(runner.get('new_feature_ids') or []); assert len(ids)==50 and len(set(ids))==50
          new=[f for f in shard['features'] if f.get('id') in set(ids)]; assert len(new)==50 and len(runner.get('records') or [])==50
          assert len({f.get('id') for f in shard['features']})==len(shard['features'])
          assert len({(f.get('properties') or {}).get('parcel_id') for f in new})==50
          assert len({str((f.get('properties') or {}).get('fhrs_id')) for f in new})==50
          for f in new:
              p=f.get('properties') or {}
              assert p.get('evidence_excerpt') and p.get('source_evidence_excerpt') and p.get('sources') and p.get('source_hash')
              assert p.get('source_url')==URL and p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2 and p.get('confidence_score')==0.55
              assert p.get('needs_manual_review') is True and p.get('fake_data') is False and p.get('final_ready') is False
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]
          assert len(src)==1 and src[0].get('features_used')==150
          print('validated building_type_2 3300->3350 with 50 new Waltham Forest FHRS continuation features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r path; do ok=0; for expected in "${paths[@]}"; do [[ "$path" == "$expected" ]] && ok=1; done; [[ "$ok" == 1 ]] || { echo "unexpected staged path: $path"; exit 1; }; done < <(git diff --cached --name-only)
          git commit -m "data(building_type_2): append Waltham Forest FHRS batch 67 3300->3350"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; URL='https://ratings.food.gov.uk/api/open-data-files/FHRS531en-GB.xml'
          def load(p): return json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==3350 and manifest['feature_count_before']==3300 and manifest['feature_count_after']==3350 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==3350 and checkpoint['next_batch_index']==68 and checkpoint['next_target_feature_count']==3400 and status['current_feature_count']==3350
          assert runner['city']=='Waltham Forest' and len(runner['new_feature_ids'])==50 and runner.get('already_processed_ids_policy_applied') is True and task['owner'] is None
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          ids=set(runner['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]
          assert len(batch)==50 and all((f.get('properties') or {}).get('evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('source_evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('evidence_level')=='D' for f in batch)
          assert all((f.get('properties') or {}).get('confidence_level_1_to_4')==2 for f in batch)
          assert all((f.get('properties') or {}).get('fake_data') is False and (f.get('properties') or {}).get('final_ready') is False for f in batch)
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]
          assert len(src)==1 and src[0].get('features_used')==150
          print('remote readback verified building_type_2 3300->3350 batch67 Waltham Forest FHRS final_ready=false')
          PY
