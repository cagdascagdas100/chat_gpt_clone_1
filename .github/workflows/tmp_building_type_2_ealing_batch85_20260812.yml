name: tmp building_type_2 Ealing FHRS continuation batch 85

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_ealing_batch85_20260812.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new Ealing FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:.github/workflows/tmp_building_type_2_ealing_batch69_20260811.yml > /tmp/ealing69.yml
          git show HEAD:.github/workflows/tmp_building_type_2_bexley_batch38_20260810.yml > /tmp/template.yml
          python3 <<'PY'
          from pathlib import Path
          text=Path('/tmp/ealing69.yml').read_text(encoding='utf-8')
          anchor='      - name: Append exactly 50 new Ealing FHRS features'
          marker="          python3 <<'PY'\n"
          a=text.index(anchor); start=text.index(marker,a)+len(marker); end=text.index("\n          PY",start)
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())+'\n'
          replacements=[
            ('BEFORE=3400; TARGET=3450; BATCH=69; NEXT_BATCH=70; NEXT_TARGET=3500','BEFORE=4200; TARGET=4250; BATCH=85; NEXT_BATCH=86; NEXT_TARGET=4300'),
            ('Batch 69 appended from official Ealing FHRS continuation records','Batch 85 appended from official Ealing FHRS continuation records'),
            ('BATCH_69_APPENDED_50_EALING_FHRS_CONTINUATION_REQUIRED','BATCH_85_APPENDED_50_EALING_FHRS_CONTINUATION_REQUIRED'),
            ('feature_count 3400 -> 3450','feature_count 4200 -> 4250'),
            ("Sonraki adim batch 70: mevcut 3450 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 3450 kaydi tekrar isleme.",
             "Sonraki adim batch 86: mevcut 4250 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 4250 kaydi tekrar isleme."),
            ('new=\'assert int(s.get("features_used",0))==100\\n        s.update({"name":SOURCE,"features_used":150\'',
             'new=\'assert int(s.get("features_used",0))==150\\n        s.update({"name":SOURCE,"features_used":200\''),
            ('features_used":150','features_used":200'),
            ('<building_type_2_ealing_batch69>','<building_type_2_ealing_batch85>')
          ]
          for old,new in replacements:
              if old not in body:
                  raise AssertionError(f'missing batch85 transform token: {old}')
              body=body.replace(old,new)
          required=['BEFORE=4200; TARGET=4250; BATCH=85; NEXT_BATCH=86; NEXT_TARGET=4300',
                    'BATCH_85_APPENDED_50_EALING_FHRS_CONTINUATION_REQUIRED',
                    'feature_count 4200 -> 4250',
                    'Sonraki adim batch 86:',
                    'features_used":200',
                    'processed_fhrs_ids',
                    'evidence_excerpt',
                    '"evidence_level":"D"',
                    '"confidence_level_1_to_4":2',
                    '"fake_data":False',
                    '"final_ready":False']
          missing=[x for x in required if x not in body]
          assert not missing, missing
          exec(compile(body,'<building_type_2_ealing_batch85_wrapper>','exec'),{'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          URL='https://ratings.food.gov.uk/api/open-data-files/FHRS509en-GB.xml'
          shard=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json').read_text())
          checkpoint=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json').read_text())
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json').read_text())
          runner=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json').read_text())
          assert len(shard.get('features') or [])==4250
          assert manifest.get('feature_count_before')==4200 and manifest.get('feature_count_after')==4250 and manifest.get('added_feature_count')==50
          assert checkpoint.get('current_feature_count')==4250 and checkpoint.get('next_batch_index')==86 and checkpoint.get('next_target_feature_count')==4300
          assert status.get('current_feature_count')==4250 and runner.get('feature_count_before')==4200 and runner.get('feature_count_after')==4250 and runner.get('added_feature_count')==50
          assert task.get('owner') is None and task.get('task_id')=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner,task):
              assert o.get('fake_data') is False and o.get('final_ready') is False
          assert runner.get('already_processed_ids_policy_applied') is True and runner.get('city')=='Ealing'
          ids=list(runner.get('new_feature_ids') or []); assert len(ids)==50 and len(set(ids))==50
          new=[f for f in shard['features'] if f.get('id') in set(ids)]; assert len(new)==50 and len(runner.get('records') or [])==50
          assert len({f.get('id') for f in shard['features']})==len(shard['features'])
          source_rows=[f for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL]
          assert len(source_rows)==200
          assert len({(f.get('properties') or {}).get('parcel_id') for f in new})==50
          assert len({str((f.get('properties') or {}).get('fhrs_id')) for f in new})==50
          for f in new:
              p=f.get('properties') or {}
              assert p.get('evidence_excerpt') and p.get('source_evidence_excerpt') and p.get('sources') and p.get('source_hash')
              assert p.get('source_url')==URL and p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2 and p.get('confidence_score')==0.55
              assert p.get('needs_manual_review') is True and p.get('fake_data') is False and p.get('final_ready') is False
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]
          assert len(src)==1 and src[0].get('features_used')==200
          print('validated building_type_2 4200->4250 with 50 new Ealing FHRS continuation features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r path; do
            ok=0
            for expected in "${paths[@]}"; do [[ "$path" == "$expected" ]] && ok=1; done
            [[ "$ok" == 1 ]] || { echo "unexpected staged path: $path"; exit 1; }
          done < <(git diff --cached --name-only)
          git commit -m "data(building_type_2): append Ealing FHRS batch 85 4200->4250"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then
              git merge --abort || true
              exit 1
            fi
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'
          URL='https://ratings.food.gov.uk/api/open-data-files/FHRS509en-GB.xml'
          def load(p): return json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==4250
          assert manifest['feature_count_before']==4200 and manifest['feature_count_after']==4250 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==4250 and checkpoint['next_batch_index']==86 and checkpoint['next_target_feature_count']==4300
          assert status['current_feature_count']==4250
          assert runner['city']=='Ealing' and len(runner['new_feature_ids'])==50 and runner.get('already_processed_ids_policy_applied') is True
          assert task['owner'] is None and task['task_id']=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner,task):
              assert o.get('fake_data') is False and o.get('final_ready') is False
          ids=set(runner['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]
          assert len(batch)==50
          assert all((f.get('properties') or {}).get('evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('source_evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('evidence_level')=='D' for f in batch)
          assert all((f.get('properties') or {}).get('confidence_level_1_to_4')==2 for f in batch)
          source_rows=[f for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL]
          assert len(source_rows)==200
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]
          assert len(src)==1 and src[0].get('features_used')==200
          print('remote readback verified building_type_2 4200->4250 batch85 Ealing FHRS final_ready=false')
          PY
