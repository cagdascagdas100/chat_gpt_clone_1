name: tmp building_type_9 Halifax batch 22

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_9_halifax_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-9-continuation
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'run guarded building_type_9 Halifax batch 22')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 unseen evidence-backed Halifax buildings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-slot-runner'
          git config user.email 'aays-slot-runner@users.noreply.github.com'
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          python3 - <<'PY'
          import collections, datetime as dt, hashlib, json, pathlib, time, urllib.request
          import xml.etree.ElementTree as ET

          SLOT='building_type_9'
          TASK='building-type-9-england-classification-v1-20260808'
          CONT='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          BEFORE=1050; TARGET=1100; BATCH=22
          CITY='Halifax'; GRID='HALIFAX_CENTRAL_01'
          BASE='https://api.openstreetmap.org/api/0.6/map'
          ALT='https://www.openstreetmap.org/api/0.6/map'
          BBOXES=[
            '-1.9100,53.7000,-1.8800,53.7250','-1.8800,53.7000,-1.8500,53.7250',
            '-1.8500,53.7000,-1.8200,53.7250','-1.8200,53.7000,-1.7900,53.7250',
            '-1.9100,53.7250,-1.8800,53.7500','-1.8800,53.7250,-1.8500,53.7500',
            '-1.8500,53.7250,-1.8200,53.7500','-1.8200,53.7250,-1.7900,53.7500',
            '-1.9100,53.7500,-1.8800,53.7750','-1.8800,53.7500,-1.8500,53.7750',
            '-1.8500,53.7500,-1.8200,53.7750','-1.8200,53.7500,-1.7900,53.7750']

          GEO=pathlib.Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          MAN=pathlib.Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          RUN=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          STA=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          CP=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          CT=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json')
          load=lambda p: json.loads(p.read_text(encoding='utf-8'))
          task,cp,man,sta,geo=load(CT),load(CP),load(MAN),load(STA),load(GEO)
          feats=geo.get('features') or []

          assert task.get('slot_id')==SLOT and task.get('task_id')==TASK and task.get('continuation_key')==CONT
          assert task.get('owner') is None and task.get('fake_data') is False
          assert cp.get('current_feature_count')==BEFORE and cp.get('feature_count_after')==BEFORE
          assert cp.get('next_batch_index')==BATCH and cp.get('next_target_feature_count')==TARGET
          assert len(feats)==BEFORE and man.get('feature_count',man.get('total_features'))==BEFORE
          assert all(x.get('fake_data') is False for x in (cp,man,sta))
          assert all(x.get('final_ready') is not True for x in (cp,man,sta))
          assert not any('halifax' in str(s.get('name','')).lower() for s in man.get('sources',[]) if isinstance(s,dict))

          already=set(); id_owner={}
          for i,f in enumerate(feats):
            p=f.get('properties') or {}
            vals={str(v).strip() for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v is not None and str(v).strip()}
            for v in vals:
              if v in id_owner and id_owner[v]!=i:
                raise AssertionError(f'preexisting duplicate identifier {v}')
              id_owner[v]=i; already.add(v)
          already_count=len(already)

          def fetch_tile(bbox):
            attempts=[f'{BASE}?bbox={bbox}',f'{ALT}?bbox={bbox}',f'{BASE}?bbox={bbox}']
            errors=[]
            for n,url in enumerate(attempts):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'AAYS-building-type-9/1.7 ODbL evidence collection'})
                with urllib.request.urlopen(req,timeout=75) as r: raw=r.read()
                if not raw: raise RuntimeError('empty OSM response')
                ET.fromstring(raw)
                return raw,url,errors
              except Exception as e:
                errors.append(str(e))
                if n<2: time.sleep(2*(n+1))
            return None,None,errors

          raws=[]; urls=[]; failed=[]
          for bbox in BBOXES:
            raw,url,errors=fetch_tile(bbox)
            if raw is None:
              failed.append({'bbox':bbox,'errors':errors})
              continue
            raws.append(raw); urls.append(url); time.sleep(.4)
          if not raws:
            raise SystemExit('OSM_SOURCE_READ_FAILED: no Halifax tile succeeded')
          source_sha=hashlib.sha256(b'\n--AAYS-TILE--\n'.join(raws)).hexdigest()
          query_sha=hashlib.sha256('\n'.join(urls).encode()).hexdigest()

          nodes={}; node_tags={}; ways={}
          for raw in raws:
            root=ET.fromstring(raw)
            for n in root.findall('node'):
              nid=n.attrib['id']; nodes[nid]=(float(n.attrib['lon']),float(n.attrib['lat']))
              tags={t.attrib['k']:t.attrib.get('v','') for t in n.findall('tag')}
              if tags: node_tags[nid]=tags
            for w in root.findall('way'):
              wid=w.attrib['id']; tags={t.attrib['k']:t.attrib.get('v','') for t in w.findall('tag')}
              refs=[nd.attrib.get('ref') for nd in w.findall('nd') if nd.attrib.get('ref')]
              ways[wid]=(tags,refs)

          bmap={'apartments':'residential_apartments','house':'residential_house','detached':'residential_detached',
                'semidetached_house':'residential_semi_detached','terrace':'residential_other','residential':'residential_other',
                'bungalow':'residential_house','commercial':'commercial_other','retail':'commercial_retail','supermarket':'commercial_retail',
                'office':'office','industrial':'industrial','warehouse':'warehouse','hotel':'hotel_or_hospitality',
                'hospital':'hospital_or_healthcare','school':'education','university':'education','college':'education',
                'kindergarten':'education','church':'religious_or_community','cathedral':'religious_or_community',
                'mosque':'religious_or_community','synagogue':'religious_or_community','temple':'religious_or_community',
                'civic':'public_infrastructure','public':'public_infrastructure','transportation':'public_infrastructure','train_station':'public_infrastructure'}
          amap={'school':'education','college':'education','university':'education','kindergarten':'education',
                'hospital':'hospital_or_healthcare','clinic':'hospital_or_healthcare','doctors':'hospital_or_healthcare',
                'dentist':'hospital_or_healthcare','place_of_worship':'religious_or_community','community_centre':'religious_or_community',
                'townhall':'public_infrastructure','library':'public_infrastructure','police':'public_infrastructure','fire_station':'public_infrastructure'}
          def classify(tags):
            b=(tags.get('building') or '').strip().lower()
            if b in bmap: return bmap[b],'osm_explicit_building_tag'
            if not b: return None,None
            if tags.get('shop'): return 'commercial_retail','osm_building_plus_shop_tag'
            if tags.get('office'): return 'office','osm_building_plus_office_tag'
            a=(tags.get('amenity') or '').strip().lower()
            if a in amap: return amap[a],'osm_building_plus_amenity_tag'
            if (tags.get('tourism') or '').strip().lower() in ('hotel','hostel','guest_house'):
              return 'hotel_or_hospitality','osm_building_plus_tourism_tag'
            return None,None
          def excerpt(kind,oid,tags):
            parts=[f'OSM {kind}/{oid}']
            for k in ['building','name','amenity','shop','office','tourism','addr:city','addr:postcode','addr:street','addr:housenumber']:
              if tags.get(k): parts.append(f'{k}={tags[k]}')
            return ' | '.join(parts)[:600]

          candidates=[]
          for nid,tags in node_tags.items():
            primary,method=classify(tags)
            if primary:
              lon,lat=nodes[nid]; candidates.append(('node',int(nid),lon,lat,tags,primary,method))
          for wid,(tags,refs) in ways.items():
            primary,method=classify(tags)
            if not primary: continue
            coords=[nodes[r] for r in refs if r in nodes]
            if not coords: continue
            candidates.append(('way',int(wid),sum(x for x,_ in coords)/len(coords),sum(y for _,y in coords)/len(coords),tags,primary,method))
          candidates.sort(key=lambda x:(x[0],x[1]))

          selected=[]; staged=set()
          for kind,oid_i,lon,lat,tags,primary,method in candidates:
            oid=str(oid_i); fid=f'ENG_OSM_{kind}_{oid}'; osm=f'{kind}/{oid}'
            ids={fid,osm}
            if ids & already or ids & staged: continue
            staged.update(ids)
            src={'source_name':'OpenStreetMap API 0.6','url_or_local_path':f'https://www.openstreetmap.org/{kind}/{oid}',
                 'sha256':source_sha,'licence':'ODbL 1.0','granularity':'building_point_or_way_center',
                 'fields_used':['building','amenity','shop','office','tourism'],'supports_field':'building_type_primary','match_method':method}
            rec={'id':fid,'parcel_id':fid,'osm_id':osm,'building_type_primary':primary,'source':'OpenStreetMap API 0.6',
                 'source_url':src['url_or_local_path'],'source_hash':source_sha,'query_sha256':query_sha,'sources':[src],
                 'evidence_excerpt':excerpt(kind,oid,tags),'evidence_level':'B','confidence_level_1_to_4':3,'match_method':method}
            props=dict(rec); props.update({'slot_id':SLOT,'city':CITY,'grid_id':GRID,'region':'North East & Yorkshire','local_authority':'Calderdale',
                                           'confidence':3,'confidence_score':0.75,'fake_data':False})
            feat={'type':'Feature','id':fid,'geometry':{'type':'Point','coordinates':[round(lon,7),round(lat,7)]},'properties':props}
            selected.append((feat,rec))
            if len(selected)==50: break
          if len(selected)<50:
            raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(selected)} unseen evidence-backed Halifax records')

          newf=[x[0] for x in selected]; records=[x[1] for x in selected]; newids=[f['id'] for f in newf]
          assert len(newids)==50 and len(set(newids))==50
          feats.extend(newf); geo['features']=feats; AFTER=len(feats)
          assert AFTER==TARGET and AFTER>BEFORE
          now=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          type_dist=collections.Counter(); ev_dist=collections.Counter(); conf_dist=collections.Counter()
          for f in feats:
            p=f.get('properties') or {}
            bt=str(p.get('building_type_primary') or 'unknown'); type_dist[bt]+=1
            ev=str(p.get('evidence_level') or 'U'); ev_dist[ev]+=1
            cl=p.get('confidence_level_1_to_4',p.get('confidence',1)); conf_dist[str(cl)]+=1
          unknown=type_dist.get('unknown',0); classified=AFTER-unknown

          geo_text=json.dumps(geo,ensure_ascii=False,indent=2)+'\n'; GEO.write_text(geo_text,encoding='utf-8')
          geo_sha=hashlib.sha256(geo_text.encode()).hexdigest()

          man['generated_at']=now; man['total_features']=AFTER; man['feature_count']=AFTER; man['classified']=classified; man['unknown']=unknown
          man['evidence_distribution']={k:int(ev_dist.get(k,0)) for k in ['A','B','C','D','U']}
          man['confidence_level_distribution']={k:int(conf_dist.get(k,0)) for k in ['1','2','3','4']}
          man['type_distribution']=dict(sorted(type_dist.items()))
          man.setdefault('sources',[]).append({'name':'OpenStreetMap API 0.6 - Halifax batch 22','url':BASE,'license':'ODbL 1.0','features_used':50,
            'accessed_at':now,'source_sha256':source_sha,'source_hash_method':'sha256_concatenated_successful_osm_xml_tiles','query_sha256':query_sha,
            'query_urls':urls,'failed_tile_count':len(failed),'grid_id':GRID,'note':'50 new evidence-backed semantic building records from runtime-only OSM XML tiles; no raw source committed.'})
          man.update({'fake_data':False,'final_ready':False,
            'note':'Existing 1050-feature shard preserved; appended 50 Halifax OSM API records outside feature.id/parcel_id/osm_id already_processed_ids.',
            'geojson_sha256':geo_sha,'geojson_path':str(GEO),'manifest_updated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,
            'added_feature_count':50,'last_batch_city':CITY,'last_batch_source':'OpenStreetMap API 0.6 map endpoint','last_batch_source_sha256':source_sha,
            'last_batch_query_sha256':query_sha,'last_batch_grid':GRID})
          MAN.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sta.update({'state':'IN_PROGRESS','updated_at':now,'classified_count':classified,'unknown_count':unknown,'total_elements':AFTER,
            'confidence_distribution':{k:int(conf_dist.get(k,0)) for k in ['1','2','3','4']},
            'evidence_distribution':{k:int(ev_dist.get(k,0)) for k in ['A','B','C','D','U']},
            'output_sha256':geo_sha,'note':'Batch 22 appended 50 new Halifax OSM API evidence-backed building features; no fake rows.',
            'fake_data':False,'final_ready':False,'feature_count_before':BEFORE,'feature_count_after':AFTER,'current_feature_count':AFTER,
            'next_batch_index':23,'next_target_feature_count':1150,'last_batch_city':CITY,'last_batch_grid':GRID,
            'last_batch_source_sha256':source_sha,'last_batch_query_sha256':query_sha,'owner_claim_created':False,'progress':True})
          STA.write_text(json.dumps(sta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp['updated_at']=now; cp['first_unverified_step_status']='BATCH_022_APPENDED_50_HALIFAX_OSM_FEATURES_CONTINUATION_REQUIRED'; cp['state']='IN_PROGRESS'
          cp.setdefault('summary',{})['new_features_appended']=int(cp.get('summary',{}).get('new_features_appended',0))+50
          cp.update({'feature_count_before':BEFORE,'feature_count_after':AFTER,'current_feature_count':AFTER,'next_batch_index':23,'next_target_feature_count':1150,
            'last_processed_ids_sample':newids[-20:],'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION',
            'fake_data':False,'final_ready':False,'processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],
            'last_batch':{'batch_index':BATCH,'city':CITY,'grid_id':GRID,'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE,
              'source_sha256':source_sha,'query_sha256':query_sha,'evidence_level':'B','confidence_level_1_to_4':3,'added_feature_count':50,'new_feature_ids':newids},
            'next_city_index':23})
          CP.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          runner={'slot_id':SLOT,'continuation_key':CONT,'batch_index':BATCH,'city':CITY,'grid_id':GRID,'generated_at':now,
            'feature_count_before':BEFORE,'feature_count_after':AFTER,'added_feature_count':50,'progress':True,
            'already_processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],'already_processed_id_count_before':already_count,
            'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE,'source_urls':urls,'source_sha256':source_sha,'query_sha256':query_sha,
            'evidence_level_new_features':{'B':50},'confidence_level_new_features':{'3':50},'new_feature_ids':newids,'records':records,
            'fake_data':False,'owner_claim_created':False,'raw_source_committed':False,'failed_source_tiles':failed,
            'limitation':'OSM building identities with node or way-center geometry; not cadastral parcel polygons. EPC/VOA/HMLR corroboration remains pending.'}
          RUN.parent.mkdir(parents=True,exist_ok=True); RUN.write_text(json.dumps(runner,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'before':BEFORE,'after':AFTER,'added':50,'already_ids':already_count,'source_sha256':source_sha,'query_sha256':query_sha,'failed_tiles':len(failed)}))
          PY

      - name: Validate, guard remote state, self-delete, commit and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_halifax_20260810.yml'
          GEO='england_map_web/data/building_type/shards/building_type_9_latest.geojson'
          MAN='england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'
          RUN='docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json'
          STA='docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'
          CP='docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'
          CT='docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'
          python3 - <<'PY'
          import json, pathlib
          paths={k:pathlib.Path(v) for k,v in {
            'geo':'england_map_web/data/building_type/shards/building_type_9_latest.geojson',
            'man':'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json',
            'run':'docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json',
            'sta':'docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json',
            'cp':'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'}.items()}
          d={k:json.loads(p.read_text()) for k,p in paths.items()}
          assert len(d['geo']['features'])==1100
          assert d['cp']['feature_count_before']==1050 and d['cp']['feature_count_after']==1100 and d['cp']['current_feature_count']==1100
          assert d['cp']['last_batch']['batch_index']==22 and d['cp']['last_batch']['city']=='Halifax' and d['cp']['last_batch']['added_feature_count']==50
          assert d['man']['total_features']==1100 and d['sta']['total_elements']==1100
          assert d['run']['added_feature_count']==50 and len(d['run']['records'])==50
          assert all(r.get('source_url') and r.get('source_hash') and r.get('sources') and r.get('evidence_excerpt') and r.get('evidence_level')=='B' and r.get('confidence_level_1_to_4')==3 for r in d['run']['records'])
          seen={}
          for i,f in enumerate(d['geo']['features']):
            p=f.get('properties') or {}
            for v in {str(x).strip() for x in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if x is not None and str(x).strip()}:
              assert v not in seen or seen[v]==i, f'duplicate identifier {v}'
              seen[v]=i
          assert all(x.get('fake_data') is False for x in (d['man'],d['sta'],d['cp'],d['run']))
          assert all(x.get('final_ready') is not True for x in (d['man'],d['sta'],d['cp']))
          PY
          git fetch origin "$BRANCH"
          git show "origin/$BRANCH:$CP" > /tmp/remote_cp.json
          git show "origin/$BRANCH:$CT" > /tmp/remote_ct.json
          python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json')); task=json.load(open('/tmp/remote_ct.json'))
          assert cp.get('current_feature_count')==1050 and cp.get('next_batch_index')==22 and cp.get('next_target_feature_count')==1100
          assert task.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and task.get('owner') is None
          PY
          rm -f "$WF"
          git add "$GEO" "$MAN" "$RUN" "$STA" "$CP" "$WF"
          git commit -m 'building_type_9: append batch 22 Halifax OSM API features'
          ok=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:$CP" > /tmp/remote_cp_retry.json
            python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp_retry.json'))
          assert cp.get('current_feature_count')==1050 and cp.get('next_batch_index')==22, 'same-slot remote state advanced; abort rebase'
          PY
            git rebase "origin/$BRANCH"
          done
          test "$ok" = 1

      - name: Verify remote slot9 readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          for item in \
            'england_map_web/data/building_type/shards/building_type_9_latest.geojson:/tmp/g.json' \
            'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json:/tmp/m.json' \
            'docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json:/tmp/r.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json:/tmp/s.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json:/tmp/c.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json:/tmp/t.json'; do
            src="${item%%:*}"; dst="${item#*:}"; git show "origin/$BRANCH:$src" > "$dst"
          done
          python3 - <<'PY'
          import json
          g=json.load(open('/tmp/g.json')); m=json.load(open('/tmp/m.json')); r=json.load(open('/tmp/r.json')); s=json.load(open('/tmp/s.json')); c=json.load(open('/tmp/c.json')); t=json.load(open('/tmp/t.json'))
          assert len(g['features'])==1100
          assert c['feature_count_before']==1050 and c['feature_count_after']==1100 and c['current_feature_count']==1100 and c['next_batch_index']==23 and c['next_target_feature_count']==1150
          assert c['last_batch']['city']=='Halifax' and c['last_batch']['added_feature_count']==50
          assert m['total_features']==1100 and s['total_elements']==1100 and r['feature_count_after']==1100 and len(r['records'])==50
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          assert all(x.get('fake_data') is False for x in (m,r,s,c)) and all(x.get('final_ready') is not True for x in (m,s,c))
          print('REMOTE_READBACK_OK building_type_9 1050->1100 Halifax batch22')
          PY
