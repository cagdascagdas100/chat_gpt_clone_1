name: security_public_safety_2 Wave135 official service revision lineage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/aays-triggers/security_public_safety_2_wave135.trigger.json

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave135
  cancel-in-progress: false

jobs:
  publish-official-service-revision-lineage:
    if: github.head_ref == 'audit/security-public-safety-2-wave135-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests pyshp shapely pyproj

      - name: Verify runner syntax
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave135_official_service_revision_metadata_lineage_20260801.py

      - name: Run official internet evidence audit
        env:
          AAYS_SOURCE_HEAD: d3063ae6ed2913637106673e6c7f7cf3b7e566a3
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave135_official_service_revision_metadata_lineage_20260801.py

      - name: Strict fail-closed validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_service_revision_metadata_lineage_wave135_latest.json')
          h = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_service_revision_metadata_lineage_wave135.html')
          s = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave135_status_latest.json')
          e = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave135_evidence_latest.json')
          q = Path('docs/chatgpt_status/aays1/queue/0148_security_public_safety_2_wave135_official_service_revision_metadata_lineage_20260801.v3.task.json')
          for path in (p, h, s, e, q):
              assert path.exists() and path.stat().st_size > 0, path
          data = json.loads(p.read_text())
          result = data['result']
          assert data['fake_data'] is False
          assert data['continuation_key'] == '42ba3283ebfb94fc3dc4c1bcda65e5235e296838c0a485d8694a3f3bd0d0a15d'
          assert result['official_item_metadata_successes'] >= 4
          assert result['official_service_metadata_successes'] >= 4
          assert result['official_layer_metadata_successes'] >= 4
          assert result['current_exact_code_hits'] >= 4
          assert result['historic_moment_queries'] >= 4
          assert result['completed_or_fail_closed_operations'] == result['total_operations']
          assert result['blocked_operations'] == 0
          assert result['stuck_pending_operations'] == 0
          assert json.loads(q.read_text())['state'] == 'COMPLETED_PUBLISHED'
          assert 'İşlem günlüğü' in h.read_text()
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit and publish canonical outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_service_revision_metadata_lineage_wave135_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_service_revision_metadata_lineage_wave135.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave135_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave135_evidence_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0148_security_public_safety_2_wave135_official_service_revision_metadata_lineage_20260801.v3.task.json
          git commit -m 'security_public_safety_2: publish Wave135 service revision lineage'
          published=false
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              published=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Remote canonical readback
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          remote_head=$(git rev-parse origin/codex/aays-single-runner-v5-20260706)
          for path in \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_service_revision_metadata_lineage_wave135_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_service_revision_metadata_lineage_wave135.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave135_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave135_evidence_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0148_security_public_safety_2_wave135_official_service_revision_metadata_lineage_20260801.v3.task.json; do
            local_sha=$(sha256sum "$path" | cut -d' ' -f1)
            remote_sha=$(git show "origin/codex/aays-single-runner-v5-20260706:$path" | sha256sum | cut -d' ' -f1)
            test "$local_sha" = "$remote_sha"
            echo "REMOTE_READBACK $path $remote_sha"
          done
          echo "CANONICAL_REMOTE_HEAD=$remote_head"
