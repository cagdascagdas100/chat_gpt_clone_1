name: AAYS building_type_3 batch64 Dover once

"on":
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-3-batch54-slough-once.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aays-building-type-3-canonical-writer
  cancel-in-progress: false

jobs:
  append-dover-batch64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Hydrate fresh branch head
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-3-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin codex/aays-single-runner-v5-20260706

      - name: Append Dover batch 64
        env:
          TASK: building-type-3-england-classification-v1-20260808
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
          BEFORE: "7900"
          BATCH: "64"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, datetime as dt, hashlib, json, os, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SLOT="building_type_3"; TASK=os.environ["TASK"]; CONT=os.environ["CONT"]
          BEFORE=int(os.environ["BEFORE"]); BATCH=int(os.environ["BATCH"])
          CITY="Dover"; AUTH="Dover"; GRID="Dover 51.1050,1.2600,51.1650,1.3600"
          ENDPOINT="https://api.openstreetmap.org/api/0.6/map"
          NOW=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          P={
            "shard":Path("england_map_web/data/building_type/shards/building_type_3_latest.geojson"),
            "manifest":Path("england_map_web/data/building_type/shards/building_type_3_manifest_latest.json"),
            "class":Path("docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json"),
            "status":Path("docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json"),
            "cp":Path("docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json"),
            "task":Path("docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json")}
          def load(k): return json.loads(P[k].read_text(encoding="utf-8"))
          def dump(k,o): P[k].write_text(json.dumps(o,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          sh,mf,st,cp,tk=load("shard"),load("manifest"),load("status"),load("cp"),load("task")
          assert cp.get("slot_id")==SLOT and cp.get("continuation_key")==CONT
          assert cp.get("current_feature_count")==BEFORE and cp.get("next_batch_index")==BATCH
          assert tk.get("task_id")==TASK and tk.get("continuation_key")==CONT
          assert tk.get("owner") is None and st.get("owner") is None
          assert st.get("current_feature_count")==BEFORE and len(sh.get("features",[]))==BEFORE
          assert cp.get("blocker") is None and CITY not in cp.get("attempted_cities",[])
          assert cp.get("fake_data") is False and st.get("fake_data") is False
          assert cp.get("final_ready") is False and st.get("final_ready") is False and tk.get("final_ready") is False

          processed=set()
          for f in sh["features"]:
            if f.get("id") is not None: processed.add(str(f["id"]))
            p=f.get("properties") or {}
            for k in ("parcel_id","osm_id"):
              if p.get(k) is not None: processed.add(str(p[k]))

          direct={
            "detached":("residential_detached","R_DET","residential"),"semidetached_house":("residential_semi_detached","R_SEMI","residential"),
            "semi":("residential_semi_detached","R_SEMI","residential"),"terrace":("residential_terrace","R_TERRACE","residential"),
            "house":("residential_house","R_HOUSE","residential"),"bungalow":("residential_bungalow","R_BUNGALOW","residential"),
            "apartments":("flat_or_apartment","R_FLAT","residential"),"residential":("residential","R_RES","residential"),
            "retail":("commercial_retail","C_RETAIL","commercial"),"commercial":("commercial_other","C_OTHER","commercial"),
            "office":("commercial_office","C_OFFICE","commercial"),"industrial":("industrial","I_IND","industrial"),
            "warehouse":("warehouse","I_WARE","industrial"),"garage":("workshop_or_garage","I_GARAGE","industrial"),
            "garages":("workshop_or_garage","I_GARAGE","industrial"),"school":("education","P_EDU","public"),
            "college":("education","P_EDU","public"),"university":("education","P_EDU","public"),
            "church":("religious_or_community","P_RELIG","public"),"chapel":("religious_or_community","P_RELIG","public"),
            "cathedral":("religious_or_community","P_RELIG","public"),"hospital":("hospital_or_healthcare","P_HEALTH","public"),
            "hotel":("hotel_or_hospitality","C_HOSPITALITY","commercial"),"barn":("agricultural","A_AGRI","agricultural"),
            "farm_auxiliary":("agricultural","A_AGRI","agricultural"),"cowshed":("agricultural","A_AGRI","agricultural"),
            "stable":("agricultural","A_AGRI","agricultural"),"greenhouse":("agricultural","A_AGRI","agricultural"),
            "shed":("other_building","X_OTHER","other"),"outbuilding":("other_building","X_OTHER","other"),
            "roof":("other_building","X_OTHER","other"),"carport":("other_building","X_OTHER","other")}
          def classify(t):
            b=(t.get("building") or "").lower().strip()
            if b in direct:
              typ,code,cat=direct[b]; return typ,code,cat,.86,3,"B",f"building={b}"
            if b=="yes":
              if t.get("shop"): return "commercial_retail","C_RETAIL","commercial",.72,2,"C",f"building=yes; shop={t['shop']}"
              if t.get("office"): return "commercial_office","C_OFFICE","commercial",.72,2,"C",f"building=yes; office={t['office']}"
              if t.get("industrial"): return "industrial","I_IND","industrial",.72,2,"C",f"building=yes; industrial={t['industrial']}"
              if t.get("tourism") in ("hotel","guest_house","hostel","motel"): return "hotel_or_hospitality","C_HOSPITALITY","commercial",.72,2,"C",f"building=yes; tourism={t['tourism']}"
              if t.get("amenity") in ("hospital","clinic","doctors","dentist","pharmacy"): return "hospital_or_healthcare","P_HEALTH","public",.72,2,"C",f"building=yes; amenity={t['amenity']}"
              if t.get("amenity") in ("school","college","university","kindergarten"): return "education","P_EDU","public",.72,2,"C",f"building=yes; amenity={t['amenity']}"
              return "unknown","U_UNKNOWN","unknown",0.0,1,"U","building=yes without type-specific supporting tag"
            return "unknown","U_UNKNOWN","unknown",0.0,1,"U",f"unmapped building={b or 'missing'}"

          def fetch_tile(w,s,e,n):
            url=ENDPOINT+"?"+urllib.parse.urlencode({"bbox":f"{w:.4f},{s:.4f},{e:.4f},{n:.4f}"})
            req=urllib.request.Request(url,headers={"User-Agent":"AAYS-building-type-3-batch64/1.0"})
            last=None
            for i in range(3):
              try:
                with urllib.request.urlopen(req,timeout=90) as r: body=r.read()
                if not body: raise RuntimeError("empty OSM response")
                return url,body
              except Exception as exc:
                last=exc
                if i<2: time.sleep(3*(i+1))
            raise RuntimeError(f"OSM fetch failed after 3 tries: {last}")

          cand=[]; seen=set(); urls=[]; agg=hashlib.sha256(); s=51.1050
          while s<51.1650-1e-9 and len(cand)<220:
            n=min(s+.0100,51.1650); w=1.2600
            while w<1.3600-1e-9 and len(cand)<220:
              e=min(w+.0125,1.3600); url,body=fetch_tile(w,s,e,n); urls.append(url); agg.update(body)
              tile=hashlib.sha256(body).hexdigest(); root=ET.fromstring(body)
              nodes={x.attrib["id"]:(float(x.attrib["lon"]),float(x.attrib["lat"])) for x in root.findall("node")}
              for way in root.findall("way"):
                wid=way.attrib.get("id"); tags={t.attrib.get("k",""):t.attrib.get("v","") for t in way.findall("tag")}
                if not wid or wid in seen or not tags.get("building"): continue
                fid=f"ENG_OSM_way_{wid}"; oid=f"way/{wid}"
                if fid in processed or oid in processed: continue
                coords=[nodes[r] for r in [nd.attrib.get("ref") for nd in way.findall("nd")] if r in nodes]
                if not coords: continue
                seen.add(wid); cand.append({"wid":wid,"fid":fid,"oid":oid,"tags":tags,"url":url,"sha":tile,
                  "geometry":{"type":"Point","coordinates":[sum(x for x,_ in coords)/len(coords),sum(y for _,y in coords)/len(coords)]}})
              w=round(e,4)
            s=round(n,4)
          if len(cand)<50: raise SystemExit(f"NO_PROGRESS: only {len(cand)} unprocessed Dover building ways; canonical files unchanged")
          selected=sorted(cand,key=lambda c:(0 if classify(c["tags"])[0]!="unknown" else 1,int(c["wid"])))[:50]

          ev=collections.Counter(); conf=collections.Counter(); types=collections.Counter(); records=[]; feats=[]; ids=[]; parcels=[]; osms=[]
          for c in selected:
            t=c["tags"]; typ,code,cat,score,level,evidence,match=classify(t)
            fields=[k for k in ("building","shop","office","tourism","amenity","industrial","name","addr:street","addr:postcode","addr:city") if t.get(k)]
            excerpt=" | ".join(f"{k}={t[k]}" for k in fields)[:600] or match
            element=f"https://www.openstreetmap.org/way/{c['wid']}"
            src={"source_name":"OpenStreetMap API 0.6 map","url_or_local_path":c["url"],"element_url":element,"accessed_at":NOW,
              "sha256":c["sha"],"licence":"ODbL 1.0","granularity":"building_way_centroid","fields_used":fields or ["building"],
              "supports_field":"building_type_primary","match_method":match,"match_score":score}
            r={"feature_id":c["fid"],"parcel_id":c["fid"],"osm_id":c["oid"],"slot_id":SLOT,"region":"South East","area":CITY,
              "local_authority":AUTH,"postcode":t.get("addr:postcode",""),"building_type_primary":typ,"building_type_code":code,
              "building_category":cat,"confidence_score":score,"confidence_level_1_to_4":level,"evidence_level":evidence,"source_count":1,
              "source_url":element,"source_hash":c["sha"],"match_method":match,"evidence_excerpt":excerpt,"source_evidence_excerpt":excerpt,
              "sources":[src],"geometry_match_method":"osm_way_centroid","address_match_method":"osm_tags_only",
              "limitations":"OSM-only classification; no EPC/VOA/HMLR corroboration in this batch.",
              "needs_manual_review":evidence in ("U","D"),"fake_data":False,"final_ready":False,"updated_at":NOW,"geometry":c["geometry"]}
            records.append(r); feats.append({"type":"Feature","id":c["fid"],"geometry":c["geometry"],"properties":{k:v for k,v in r.items() if k!="geometry"}})
            ev[evidence]+=1; conf[str(level)]+=1; types[typ]+=1; ids.append(c["fid"]); parcels.append(c["fid"]); osms.append(c["oid"])
          assert len(ids)==len(parcels)==len(osms)==50 and len(set(ids))==len(set(parcels))==len(set(osms))==50
          assert not(set(ids)&processed) and not(set(parcels)&processed) and not(set(osms)&processed)

          sh["features"].extend(feats); AFTER=len(sh["features"]); assert AFTER==BEFORE+50 and AFTER>BEFORE
          sh.update({"updated_at":NOW,"latest_batch":CITY,"last_batch_index":BATCH,"fake_data":False,"final_ready":False})
          source_sha=agg.hexdigest(); classified=sum(v for k,v in types.items() if k!="unknown"); unknown=types.get("unknown",0)
          batch={"batch_index":BATCH,"batch_name":CITY,"city":CITY,"grid_bbox":GRID,"source":"OpenStreetMap API 0.6 map","endpoint":ENDPOINT,
            "source_url":ENDPOINT,"source_sha256":source_sha,"features_used":50,"added_feature_count":50,"classified_added":classified,
            "unknown_added":unknown,"accessed_at":NOW,"evidence_level_distribution":dict(ev),"confidence_level_distribution":dict(conf),
            "building_type_distribution":dict(types),"new_feature_ids":ids,"new_parcel_ids":parcels,"new_osm_ids":osms,"fetched_urls":urls,
            "raw_source_stored_in_git":False}
          mf.update({"generated_at":NOW,"total_features":AFTER,"feature_count":AFTER,"feature_count_before":BEFORE,"feature_count_after":AFTER,
            "added_feature_count":50,"classified":int(mf.get("classified",0))+classified,"unknown":int(mf.get("unknown",0))+unknown,
            "fake_data":False,"final_ready":False,"last_batch_index":BATCH,"last_batch_name":CITY,"last_batch":batch})
          for k,v in ev.items(): mf.setdefault("evidence_distribution",{})[k]=int(mf["evidence_distribution"].get(k,0))+v
          for k,v in conf.items(): mf.setdefault("confidence_level_distribution",{})[k]=int(mf["confidence_level_distribution"].get(k,0))+v
          for k,v in types.items(): mf.setdefault("type_distribution",{})[k]=int(mf["type_distribution"].get(k,0))+v
          mf.setdefault("sources",[]).append({"name":f"OpenStreetMap API 0.6 map - {CITY} batch {BATCH}","url":ENDPOINT,"features_used":50,
            "accessed_at":NOW,"source_sha256":source_sha,"source_hash_method":"sha256_concatenated_raw_osm_xml_tiles","license":"ODbL 1.0",
            "evidence_level_distribution":dict(ev),"confidence_level_distribution":dict(conf),"grid_bbox":GRID,
            "raw_source_stored_in_git":False,"note":"50 new Dover OSM building ways after feature.id/parcel_id/osm_id exclusion; raw XML runtime-only."})
          cl={"schema_version":3,"slot_id":SLOT,"task_id":TASK,"continuation_key":CONT,"generated_at":NOW,"state":"IN_PROGRESS",
            "batch_index":BATCH,"batch_name":CITY,"feature_count_before":BEFORE,"feature_count_after":AFTER,"added_feature_count":50,
            "classified_added":classified,"unknown_added":unknown,"classified_count_after":mf["classified"],"unknown_count_after":mf["unknown"],
            "source":"OpenStreetMap API 0.6 map","endpoint":ENDPOINT,"source_sha256":source_sha,
            "evidence_level_distribution":dict(ev),"confidence_level_distribution":dict(conf),"building_type_distribution":dict(types),
            "records":records,"fake_data":False,"final_ready":False}
          cp.update({"first_unverified_step_status":f"BATCH_{BATCH}_APPENDED_50_DOVER_OSM_CONTINUATION_REQUIRED",
            "terminal_status":"IN_PROGRESS","updated_at":NOW,"final_ready":False,"state":"IN_PROGRESS","feature_count_before":BEFORE,
            "feature_count_after":AFTER,"current_feature_count":AFTER,"next_batch_index":BATCH+1,"next_target_feature_count":AFTER+300,
            "last_processed_ids_sample":ids[-20:],"attempted_new_city_batch":CITY,
            "source_access_evidence":{"osm_api":"Live OSM API 0.6 map tiles succeeded","endpoint":ENDPOINT,"source_sha256":source_sha,"raw_source_stored_in_git":False},
            "blocker":None,"blocker_reason":"","next_required_action":f"APPEND_ONLY_BATCH_{BATCH+1}_NEW_SOUTH_EAST_CITY_GRID_DO_NOT_REPROCESS_EXISTING_IDS",
            "fake_data":False,"last_batch_name":CITY,"last_batch_new_features":50,"last_batch_evidence":batch,"candidate_batch":None,
            "no_progress_reason":None,"new_features_added_this_attempt":50,"progress_counted":True})
          cp.setdefault("summary",{}).update({"current_feature_count":AFTER,"new_features_added_this_attempt":50,"progress_counted":True})
          cities=cp.setdefault("attempted_cities",[])
          if CITY not in cities: cities.append(CITY)
          st.update({"state":"IN_PROGRESS","updated_at":NOW,"owner":None,"final_ready":False,"classified_count":mf["classified"],
            "unknown_count":mf["unknown"],"total_elements":AFTER,"feature_count_before":BEFORE,"feature_count_after":AFTER,"new_features_added":50,
            "progress_counted":True,"next_batch_index":BATCH+1,"next_target_feature_count":AFTER+300,
            "confidence_distribution":dict(mf.get("confidence_level_distribution",{})),"evidence_distribution":dict(mf.get("evidence_distribution",{})),
            "blocker":None,"blocker_reason":"","note":f"Batch {BATCH} appended 50 new Dover OSM evidence-backed features outside all prior feature.id/parcel_id/osm_id values; same task/continuation retained.",
            "current_feature_count":AFTER,"fake_data":False,"total_features":AFTER,"classified":mf["classified"],"unknown":mf["unknown"],
            "confidence_level_distribution":dict(mf.get("confidence_level_distribution",{})),"progress_count_delta":50,"new_feature_count":50,
            "last_batch_city":CITY,"last_batch_name":CITY,"last_batch_new_features":50,"last_batch_added_feature_count":50,
            "last_batch_source":"OpenStreetMap API 0.6 map","last_batch_evidence_distribution":dict(ev),
            "last_batch_confidence_distribution":dict(conf),"last_batch_index":BATCH,"candidate_batch":None,"no_progress_reason":None,
            "progress_reason":"50 new Dover OSM records appended after processed-ID exclusion","last_batch":batch,"last_batch_evidence":batch})
          tk.update({"updated_at":NOW,"owner":None,"fake_data":False,"final_ready":False,"last_batch_index":BATCH,"last_batch_name":CITY,
            "last_batch_added_feature_count":50,"next_batch_index":BATCH+1,"next_target_feature_count":AFTER+300})
          tk.setdefault("progress",{}).update({"completed_count":AFTER,"target_count":AFTER+300})
          dump("shard",sh)
          st["output_sha256"]=hashlib.sha256(P["shard"].read_bytes()).hexdigest()
          dump("manifest",mf); dump("class",cl); dump("status",st); dump("cp",cp); dump("task",tk)
          print(f"BATCH64_BUILD_OK before={BEFORE} after={AFTER} new=50 evidence={dict(ev)} confidence={dict(conf)} types={dict(types)}")
          PY

      - name: Guard, commit and push six canonical files
        env:
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
          BEFORE: "7900"
          BATCH: "64"
        run: |
          set -euo pipefail
          BR=codex/aays-single-runner-v5-20260706
          CP=docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json
          git fetch origin "$BR"; git show "origin/$BR:$CP" > /tmp/remote_cp.json
          python3 - <<'PY'
          import json, os
          cp=json.load(open('/tmp/remote_cp.json'))
          assert cp.get('continuation_key')==os.environ['CONT']
          assert cp.get('current_feature_count')==int(os.environ['BEFORE'])
          assert cp.get('next_batch_index')==int(os.environ['BATCH'])
          assert cp.get('blocker') is None
          PY
          FILES=(england_map_web/data/building_type/shards/building_type_3_latest.geojson england_map_web/data/building_type/shards/building_type_3_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json)
          git add "${FILES[@]}"; test -n "$(git diff --cached --name-only)"
          git commit -m "data(building_type_3): append Dover batch 64"
          for attempt in 1 2 3; do
            if git push origin HEAD:"$BR"; then exit 0; fi
            git pull --rebase origin "$BR"; sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback acceptance gate
        env:
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
        run: |
          set -euo pipefail
          BR=codex/aays-single-runner-v5-20260706; git fetch origin "$BR"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          br='origin/codex/aays-single-runner-v5-20260706'
          paths={'cp':'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json','status':'docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json','task':'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json','manifest':'england_map_web/data/building_type/shards/building_type_3_manifest_latest.json','class':'docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json','shard':'england_map_web/data/building_type/shards/building_type_3_latest.geojson'}
          def raw(p): return subprocess.check_output(['git','show',f'{br}:{p}'])
          def remote(p): return json.loads(raw(p))
          cp=remote(paths['cp']); st=remote(paths['status']); tk=remote(paths['task']); mf=remote(paths['manifest']); cl=remote(paths['class'])
          shard_bytes=raw(paths['shard']); sh=json.loads(shard_bytes); cont=os.environ['CONT']
          assert cp['continuation_key']==st['continuation_key']==tk['continuation_key']==mf['continuation_key']==cl['continuation_key']==cont
          assert cp['feature_count_before']==7900 and cp['feature_count_after']==7950 and cp['current_feature_count']==7950
          assert st['feature_count_before']==7900 and st['feature_count_after']==7950 and st['current_feature_count']==7950
          assert mf['feature_count_before']==7900 and mf['feature_count_after']==7950 and mf['total_features']==7950
          assert cl['feature_count_before']==7900 and cl['feature_count_after']==7950 and cl['added_feature_count']==50 and len(cl.get('records',[]))==50
          assert len(sh.get('features',[]))==7950 and cp.get('progress_counted') is True and st.get('progress_counted') is True
          assert st.get('output_sha256')==hashlib.sha256(shard_bytes).hexdigest()
          assert cp.get('fake_data') is False and st.get('fake_data') is False and mf.get('fake_data') is False and cl.get('fake_data') is False
          assert cp.get('final_ready') is False and st.get('final_ready') is False and tk.get('final_ready') is False and mf.get('final_ready') is False and cl.get('final_ready') is False
          assert cp.get('next_batch_index')==65 and cp.get('next_target_feature_count')==8250
          assert cp.get('last_batch_name')=='Dover' and cl.get('batch_name')=='Dover'
          old=sh.get('features',[])[:-50]; processed=set()
          for f in old:
            if f.get('id') is not None: processed.add(str(f['id']))
            p=f.get('properties') or {}
            for k in ('parcel_id','osm_id'):
              if p.get(k) is not None: processed.add(str(p[k]))
          ids=[]; parcels=[]; osms=[]
          for f in sh.get('features',[])[-50:]:
            p=f.get('properties') or {}; ids.append(str(f.get('id'))); parcels.append(str(p.get('parcel_id'))); osms.append(str(p.get('osm_id')))
            assert p.get('area')=='Dover' and p.get('local_authority')=='Dover'
            assert p.get('sources') and p.get('source_url') and p.get('source_hash') and p.get('match_method')
            assert p.get('evidence_excerpt') is not None and p.get('evidence_level') in ('B','C','D','U')
            assert p.get('confidence_level_1_to_4') in (1,2,3,4) and p.get('fake_data') is False and p.get('final_ready') is False
          assert len(set(ids))==len(set(parcels))==len(set(osms))==50
          assert not(set(ids)&processed) and not(set(parcels)&processed) and not(set(osms)&processed)
          print('REMOTE_READBACK_OK before=7900 after=7950 new=50 batch=64 city=Dover hash_ok=1')
          PY
