name: AAYS building_type_3 batch83 Pulborough once

"on":
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-3-batch54-slough-once.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aays-building-type-3-canonical-writer
  cancel-in-progress: false

jobs:
  append-pulborough-batch83:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Hydrate fresh branch head
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-3-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin codex/aays-single-runner-v5-20260706

      - name: Render and append Pulborough batch 83
        env:
          TASK: building-type-3-england-classification-v1-20260808
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
          BEFORE: "8850"
          BATCH: "83"
        run: |
          set -euo pipefail
          git show 85afcced674698bd92ca2a670f436c258fac7092:.github/workflows/aays-building-type-3-batch54-slough-once.yml > /tmp/old_bt3.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/old_bt3.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n\n      - name: Guard", start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())+'\n'
          script=script.replace('CITY="Deal"; AUTH="Dover"; GRID="Deal 51.1850,1.3650,51.2350,1.4300"','CITY="Pulborough"; AUTH="Horsham"; GRID="Pulborough 50.9400,-0.5350,50.9800,-0.4750"')
          script=script.replace('WEST,SOUTH,EAST,NORTH=1.3650,51.1850,1.4300,51.2350','WEST,SOUTH,EAST,NORTH=-0.5350,50.9400,-0.4750,50.9800')
          script=script.replace('AAYS-building-type-3-batch68/1.0','AAYS-building-type-3-batch83/1.0')
          script=script.replace('Deal','Pulborough').replace('Dover','Horsham').replace('BATCH68','BATCH83').replace('_DEAL_','_PULBOROUGH_')
          required=['CITY="Pulborough"','AUTH="Horsham"','Pulborough 50.9400,-0.5350,50.9800,-0.4750','WEST,SOUTH,EAST,NORTH=-0.5350,50.9400,-0.4750,50.9800','AAYS-building-type-3-batch83/1.0']
          for literal in required:
              if literal not in script: raise SystemExit(f'FAIL_CLOSED required literal missing: {literal}')
          for literal in ['CITY="Deal"','AUTH="Dover"','AAYS-building-type-3-batch68/1.0']:
              if literal in script: raise SystemExit(f'FAIL_CLOSED stale literal remains: {literal}')
          Path('/tmp/run_bt3_batch83.py').write_text(script,encoding='utf-8')
          PY
          python3 /tmp/run_bt3_batch83.py

      - name: Guard, commit and push six canonical files
        env:
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
          BEFORE: "8850"
          BATCH: "83"
        run: |
          set -euo pipefail
          BR=codex/aays-single-runner-v5-20260706
          CP=docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json
          ST=docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json
          TK=docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json
          git fetch origin "$BR"
          git show "origin/$BR:$CP" > /tmp/remote_cp.json
          git show "origin/$BR:$ST" > /tmp/remote_st.json
          git show "origin/$BR:$TK" > /tmp/remote_tk.json
          python3 - <<'PY'
          import json, os
          cp=json.load(open('/tmp/remote_cp.json')); st=json.load(open('/tmp/remote_st.json')); tk=json.load(open('/tmp/remote_tk.json'))
          assert cp.get('continuation_key')==tk.get('continuation_key')==st.get('continuation_key')==os.environ['CONT']
          assert cp.get('current_feature_count')==int(os.environ['BEFORE']) and cp.get('next_batch_index')==int(os.environ['BATCH'])
          assert st.get('current_feature_count')==int(os.environ['BEFORE'])
          assert tk.get('task_id')=='building-type-3-england-classification-v1-20260808'
          assert tk.get('owner') is None and st.get('owner') is None and cp.get('blocker') is None
          assert cp.get('fake_data') is False and st.get('fake_data') is False and tk.get('fake_data') is False
          assert cp.get('final_ready') is False and st.get('final_ready') is False and tk.get('final_ready') is False
          PY
          FILES=(england_map_web/data/building_type/shards/building_type_3_latest.geojson england_map_web/data/building_type/shards/building_type_3_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json)
          git add "${FILES[@]}"
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m "data(building_type_3): append Pulborough batch 83"
          for attempt in 1 2 3; do
            git fetch origin "$BR"
            if git rebase "origin/$BR" && git push origin HEAD:"$BR"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback acceptance gate
        env:
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
        run: |
          set -euo pipefail
          BR=codex/aays-single-runner-v5-20260706
          git fetch origin "$BR"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          br='origin/codex/aays-single-runner-v5-20260706'
          paths={'cp':'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json','status':'docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json','task':'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json','manifest':'england_map_web/data/building_type/shards/building_type_3_manifest_latest.json','class':'docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json','shard':'england_map_web/data/building_type/shards/building_type_3_latest.geojson'}
          def raw(p): return subprocess.check_output(['git','show',f'{br}:{p}'])
          def read(p): return json.loads(raw(p))
          cp=read(paths['cp']); st=read(paths['status']); tk=read(paths['task']); mf=read(paths['manifest']); cl=read(paths['class']); shard_bytes=raw(paths['shard']); sh=json.loads(shard_bytes); cont=os.environ['CONT']
          assert cp['continuation_key']==st['continuation_key']==tk['continuation_key']==mf['continuation_key']==cl['continuation_key']==cont
          assert cp['feature_count_before']==8850 and cp['feature_count_after']==8900 and cp['current_feature_count']==8900
          assert st['feature_count_before']==8850 and st['feature_count_after']==8900 and st['current_feature_count']==8900
          assert mf['feature_count_before']==8850 and mf['feature_count_after']==8900 and mf['total_features']==8900
          assert cl['feature_count_before']==8850 and cl['feature_count_after']==8900 and cl['added_feature_count']==50 and len(cl.get('records',[]))==50
          assert len(sh.get('features',[]))==8900 and cp.get('progress_counted') is True and st.get('progress_counted') is True
          assert st.get('output_sha256')==hashlib.sha256(shard_bytes).hexdigest()
          assert cp.get('next_batch_index')==84 and cp.get('next_target_feature_count')==9200
          assert cp.get('last_batch_name')=='Pulborough' and cl.get('batch_name')=='Pulborough' and mf.get('last_batch_name')=='Pulborough'
          assert tk.get('progress',{}).get('completed_count')==8900 and tk.get('owner') is None
          for obj in (cp,st,tk,mf,cl):
              assert obj.get('fake_data') is False and obj.get('final_ready') is False
          old=sh.get('features',[])[:-50]; processed=set()
          for f in old:
              if f.get('id') is not None: processed.add(str(f['id']))
              p=f.get('properties') or {}
              for k in ('parcel_id','osm_id'):
                  if p.get(k) is not None: processed.add(str(p[k]))
          ids=[]; parcels=[]; osms=[]
          for f in sh.get('features',[])[-50:]:
              p=f.get('properties') or {}; ids.append(str(f.get('id'))); parcels.append(str(p.get('parcel_id'))); osms.append(str(p.get('osm_id')))
              assert p.get('area')=='Pulborough' and p.get('local_authority')=='Horsham'
              assert p.get('sources') and p.get('source_url') and p.get('source_hash') and p.get('match_method')
              assert p.get('evidence_excerpt') is not None and p.get('evidence_level') in ('B','C','D','U')
              assert p.get('confidence_level_1_to_4') in (1,2,3,4)
              assert p.get('fake_data') is False and p.get('final_ready') is False
          assert len(set(ids))==len(set(parcels))==len(set(osms))==50
          assert not(set(ids)&processed) and not(set(parcels)&processed) and not(set(osms)&processed)
          print('REMOTE_READBACK_OK before=8850 after=8900 new=50 batch=83 city=Pulborough hash_ok=1')
          PY
