name: AAYS building_type_3 batch55 Windsor once

"on":
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/aays-building-type-3-batch54-slough-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aays-building-type-3-canonical-writer
  cancel-in-progress: false

jobs:
  append-windsor-batch55:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Hydrate fresh branch head
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-3-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin codex/aays-single-runner-v5-20260706

      - name: Fetch Windsor OSM evidence and append exactly 50 new features
        env:
          EXPECTED_TASK: building-type-3-england-classification-v1-20260808
          EXPECTED_CONTINUATION: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
          EXPECTED_COUNT: "7450"
          EXPECTED_BATCH: "55"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SLOT = "building_type_3"
          TASK = os.environ["EXPECTED_TASK"]
          CONT = os.environ["EXPECTED_CONTINUATION"]
          BEFORE = int(os.environ["EXPECTED_COUNT"])
          BATCH = int(os.environ["EXPECTED_BATCH"])
          CITY = "Windsor"
          LOCAL_AUTHORITY = "Windsor and Maidenhead"
          GRID = "Windsor 51.4550,-0.6400,51.4850,-0.5700"
          ENDPOINT = "https://api.openstreetmap.org/api/0.6/map"
          NOW = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          shard_p = Path("england_map_web/data/building_type/shards/building_type_3_latest.geojson")
          manifest_p = Path("england_map_web/data/building_type/shards/building_type_3_manifest_latest.json")
          class_p = Path("docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json")
          status_p = Path("docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json")
          checkpoint_p = Path("docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json")
          task_p = Path("docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json")

          def load(p):
              with p.open("r", encoding="utf-8") as f:
                  return json.load(f)

          def dump(p, obj):
              with p.open("w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          shard = load(shard_p)
          manifest = load(manifest_p)
          status = load(status_p)
          checkpoint = load(checkpoint_p)
          task = load(task_p)

          # Same task/checkpoint only; never claim a second owner.
          assert checkpoint.get("slot_id") == SLOT
          assert checkpoint.get("continuation_key") == CONT
          assert checkpoint.get("current_feature_count") == BEFORE
          assert checkpoint.get("next_batch_index") == BATCH
          assert task.get("task_id") == TASK
          assert task.get("continuation_key") == CONT
          assert task.get("owner") is None
          assert status.get("owner") is None
          assert status.get("current_feature_count") == BEFORE
          assert len(shard.get("features", [])) == BEFORE

          # Every current feature.id, parcel_id and osm_id is already processed.
          processed = set()
          for f in shard["features"]:
              if f.get("id") is not None:
                  processed.add(str(f["id"]))
              p = f.get("properties") or {}
              if p.get("parcel_id") is not None:
                  processed.add(str(p["parcel_id"]))
              if p.get("osm_id") is not None:
                  processed.add(str(p["osm_id"]))

          direct = {
              "detached": ("residential_detached", "R_DET", "residential"),
              "semidetached_house": ("residential_semi_detached", "R_SEMI", "residential"),
              "semi": ("residential_semi_detached", "R_SEMI", "residential"),
              "terrace": ("residential_terrace", "R_TERRACE", "residential"),
              "house": ("residential_house", "R_HOUSE", "residential"),
              "bungalow": ("residential_bungalow", "R_BUNGALOW", "residential"),
              "apartments": ("flat_or_apartment", "R_FLAT", "residential"),
              "residential": ("residential", "R_RES", "residential"),
              "retail": ("commercial_retail", "C_RETAIL", "commercial"),
              "commercial": ("commercial_other", "C_OTHER", "commercial"),
              "office": ("commercial_office", "C_OFFICE", "commercial"),
              "industrial": ("industrial", "I_IND", "industrial"),
              "warehouse": ("warehouse", "I_WARE", "industrial"),
              "garage": ("workshop_or_garage", "I_GARAGE", "industrial"),
              "garages": ("workshop_or_garage", "I_GARAGE", "industrial"),
              "school": ("education", "P_EDU", "public"),
              "college": ("education", "P_EDU", "public"),
              "university": ("education", "P_EDU", "public"),
              "church": ("religious_or_community", "P_RELIG", "public"),
              "chapel": ("religious_or_community", "P_RELIG", "public"),
              "cathedral": ("religious_or_community", "P_RELIG", "public"),
              "hospital": ("hospital_or_healthcare", "P_HEALTH", "public"),
              "hotel": ("hotel_or_hospitality", "C_HOSPITALITY", "commercial"),
              "barn": ("agricultural", "A_AGRI", "agricultural"),
              "farm_auxiliary": ("agricultural", "A_AGRI", "agricultural"),
              "cowshed": ("agricultural", "A_AGRI", "agricultural"),
              "stable": ("agricultural", "A_AGRI", "agricultural"),
              "greenhouse": ("agricultural", "A_AGRI", "agricultural"),
              "shed": ("other_building", "X_OTHER", "other"),
              "outbuilding": ("other_building", "X_OTHER", "other"),
              "roof": ("other_building", "X_OTHER", "other"),
              "carport": ("other_building", "X_OTHER", "other"),
          }

          def classify(tags):
              b = (tags.get("building") or "").strip().lower()
              if b in direct:
                  t, code, cat = direct[b]
                  return t, code, cat, 0.86, 3, "B", f"building={b}"
              if b == "yes":
                  if tags.get("shop"):
                      return "commercial_retail", "C_RETAIL", "commercial", 0.72, 2, "C", f"building=yes; shop={tags['shop']}"
                  if tags.get("office"):
                      return "commercial_office", "C_OFFICE", "commercial", 0.72, 2, "C", f"building=yes; office={tags['office']}"
                  if tags.get("tourism") in ("hotel", "guest_house", "hostel", "motel"):
                      return "hotel_or_hospitality", "C_HOSPITALITY", "commercial", 0.72, 2, "C", f"building=yes; tourism={tags['tourism']}"
                  if tags.get("amenity") in ("hospital", "clinic", "doctors", "dentist", "pharmacy"):
                      return "hospital_or_healthcare", "P_HEALTH", "public", 0.72, 2, "C", f"building=yes; amenity={tags['amenity']}"
                  if tags.get("amenity") in ("school", "college", "university", "kindergarten"):
                      return "education", "P_EDU", "public", 0.72, 2, "C", f"building=yes; amenity={tags['amenity']}"
                  if tags.get("industrial"):
                      return "industrial", "I_IND", "industrial", 0.72, 2, "C", f"building=yes; industrial={tags['industrial']}"
                  return "unknown", "U_UNKNOWN", "unknown", 0.0, 1, "U", "building=yes without type-specific supporting tag"
              # Unmapped explicit building value is real building evidence, but subtype is not asserted.
              return "unknown", "U_UNKNOWN", "unknown", 0.0, 1, "U", f"unmapped building={b or 'missing'}"

          def fetch_tile(w, s, e, n):
              bbox = f"{w:.4f},{s:.4f},{e:.4f},{n:.4f}"
              url = ENDPOINT + "?" + urllib.parse.urlencode({"bbox": bbox})
              req = urllib.request.Request(url, headers={"User-Agent": "AAYS-building-type-3-batch55/1.0"})
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          body = r.read()
                      if not body:
                          raise RuntimeError("empty OSM response")
                      return url, body
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(3 * (attempt + 1))
              raise RuntimeError(f"OSM fetch failed after 3 tries for {url}: {last}")

          candidates = []
          seen_way = set()
          fetched_urls = []
          aggregate_hash = hashlib.sha256()
          south, north = 51.4550, 51.4850
          west, east = -0.6400, -0.5700
          lat_step, lon_step = 0.0100, 0.0200
          s = south
          while s < north - 1e-9 and len(candidates) < 160:
              n = min(s + lat_step, north)
              w = west
              while w < east - 1e-9 and len(candidates) < 160:
                  e = min(w + lon_step, east)
                  url, body = fetch_tile(w, s, e, n)
                  fetched_urls.append(url)
                  aggregate_hash.update(body)
                  tile_sha = hashlib.sha256(body).hexdigest()
                  root = ET.fromstring(body)
                  nodes = {el.attrib["id"]: (float(el.attrib["lon"]), float(el.attrib["lat"])) for el in root.findall("node")}
                  for way in root.findall("way"):
                      wid = way.attrib.get("id")
                      if not wid or wid in seen_way:
                          continue
                      tags = {t.attrib.get("k", ""): t.attrib.get("v", "") for t in way.findall("tag")}
                      if not tags.get("building"):
                          continue
                      fid = f"ENG_OSM_way_{wid}"
                      osm_id = f"way/{wid}"
                      if fid in processed or osm_id in processed:
                          continue
                      refs = [nd.attrib.get("ref") for nd in way.findall("nd")]
                      coords = [nodes[r] for r in refs if r in nodes]
                      if not coords:
                          continue
                      lon = sum(x for x, _ in coords) / len(coords)
                      lat = sum(y for _, y in coords) / len(coords)
                      seen_way.add(wid)
                      candidates.append({"wid": wid, "fid": fid, "osm_id": osm_id, "tags": tags,
                                         "geometry": {"type": "Point", "coordinates": [lon, lat]},
                                         "tile_url": url, "tile_sha": tile_sha})
                  w = round(e, 4)
              s = round(n, 4)

          if len(candidates) < 50:
              raise SystemExit(f"NO_PROGRESS: only {len(candidates)} unprocessed Windsor building ways; canonical files unchanged")

          # Prefer evidence that can support a specific building type.
          def priority(c):
              typ = classify(c["tags"])[0]
              return (0 if typ != "unknown" else 1, int(c["wid"]))
          selected = sorted(candidates, key=priority)[:50]

          new_records = []
          new_features = []
          ev = collections.Counter()
          conf = collections.Counter()
          types = collections.Counter()
          new_ids = []
          new_parcels = []
          new_osms = []

          for c in selected:
              tags = c["tags"]
              typ, code, cat, score, conf_level, evidence, match = classify(tags)
              fields = [k for k in ("building", "shop", "office", "tourism", "amenity", "industrial", "name", "addr:street", "addr:postcode", "addr:city") if tags.get(k)]
              excerpt = " | ".join(f"{k}={tags[k]}" for k in fields)[:600] or match
              source_url = f"https://www.openstreetmap.org/way/{c['wid']}"
              source = {
                  "source_name": "OpenStreetMap API 0.6 map",
                  "url_or_local_path": c["tile_url"],
                  "element_url": source_url,
                  "accessed_at": NOW,
                  "sha256": c["tile_sha"],
                  "licence": "ODbL 1.0",
                  "granularity": "building_way_centroid",
                  "fields_used": fields or ["building"],
                  "supports_field": "building_type_primary",
                  "match_method": match,
                  "match_score": score,
              }
              record = {
                  "feature_id": c["fid"],
                  "parcel_id": c["fid"],
                  "osm_id": c["osm_id"],
                  "slot_id": SLOT,
                  "region": "South East",
                  "area": CITY,
                  "local_authority": LOCAL_AUTHORITY,
                  "postcode": tags.get("addr:postcode", ""),
                  "building_type_primary": typ,
                  "building_type_code": code,
                  "building_category": cat,
                  "confidence_score": score,
                  "confidence_level_1_to_4": conf_level,
                  "evidence_level": evidence,
                  "source_count": 1,
                  "source_url": source_url,
                  "source_hash": c["tile_sha"],
                  "match_method": match,
                  "evidence_excerpt": excerpt,
                  "source_evidence_excerpt": excerpt,
                  "sources": [source],
                  "geometry_match_method": "osm_way_centroid",
                  "address_match_method": "osm_tags_only",
                  "limitations": "OSM-only classification; no EPC/VOA/HMLR type corroboration in this batch.",
                  "needs_manual_review": evidence in ("U", "D"),
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": NOW,
                  "geometry": c["geometry"],
              }
              new_records.append(record)
              props = {k: v for k, v in record.items() if k != "geometry"}
              new_features.append({"type": "Feature", "id": c["fid"], "geometry": c["geometry"], "properties": props})
              ev[evidence] += 1
              conf[str(conf_level)] += 1
              types[typ] += 1
              new_ids.append(c["fid"])
              new_parcels.append(c["fid"])
              new_osms.append(c["osm_id"])

          assert len(new_ids) == len(new_parcels) == len(new_osms) == 50
          assert len(set(new_ids)) == len(set(new_parcels)) == len(set(new_osms)) == 50
          assert not (set(new_ids) & processed)
          assert not (set(new_parcels) & processed)
          assert not (set(new_osms) & processed)

          shard["features"].extend(new_features)
          AFTER = len(shard["features"])
          assert AFTER == BEFORE + 50
          shard["updated_at"] = NOW
          shard["latest_batch"] = CITY
          shard["last_batch_index"] = BATCH

          source_sha = aggregate_hash.hexdigest()
          classified_added = sum(v for k, v in types.items() if k != "unknown")
          unknown_added = types.get("unknown", 0)
          batch_meta = {
              "batch_index": BATCH,
              "batch_name": CITY,
              "city": CITY,
              "grid_bbox": GRID,
              "source": "OpenStreetMap API 0.6 map",
              "endpoint": ENDPOINT,
              "source_url": ENDPOINT,
              "source_sha256": source_sha,
              "features_used": 50,
              "added_feature_count": 50,
              "classified_added": classified_added,
              "unknown_added": unknown_added,
              "accessed_at": NOW,
              "evidence_level_distribution": dict(ev),
              "confidence_level_distribution": dict(conf),
              "building_type_distribution": dict(types),
              "new_feature_ids": new_ids,
              "new_parcel_ids": new_parcels,
              "new_osm_ids": new_osms,
              "fetched_urls": fetched_urls,
              "raw_source_stored_in_git": False,
          }

          manifest["generated_at"] = NOW
          manifest["total_features"] = AFTER
          manifest["feature_count"] = AFTER
          manifest["feature_count_before"] = BEFORE
          manifest["feature_count_after"] = AFTER
          manifest["added_feature_count"] = 50
          manifest["classified"] = int(manifest.get("classified", 0)) + classified_added
          manifest["unknown"] = int(manifest.get("unknown", 0)) + unknown_added
          for k, v in ev.items():
              manifest.setdefault("evidence_distribution", {})[k] = int(manifest["evidence_distribution"].get(k, 0)) + v
          for k, v in conf.items():
              manifest.setdefault("confidence_level_distribution", {})[k] = int(manifest["confidence_level_distribution"].get(k, 0)) + v
          for k, v in types.items():
              manifest.setdefault("type_distribution", {})[k] = int(manifest["type_distribution"].get(k, 0)) + v
          manifest.setdefault("sources", []).append({
              "name": f"OpenStreetMap API 0.6 map - {CITY} batch {BATCH}",
              "url": ENDPOINT,
              "features_used": 50,
              "accessed_at": NOW,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_concatenated_raw_osm_xml_tiles",
              "license": "ODbL 1.0",
              "evidence_level_distribution": dict(ev),
              "confidence_level_distribution": dict(conf),
              "grid_bbox": GRID,
              "raw_source_stored_in_git": False,
              "note": "50 new Windsor OSM building ways after feature.id/parcel_id/osm_id exclusion; raw XML runtime-only."
          })
          manifest["last_batch_index"] = BATCH
          manifest["last_batch_name"] = CITY
          manifest["last_batch"] = batch_meta

          classification = {
              "schema_version": 3,
              "slot_id": SLOT,
              "task_id": TASK,
              "continuation_key": CONT,
              "generated_at": NOW,
              "state": "IN_PROGRESS",
              "batch_index": BATCH,
              "batch_name": CITY,
              "feature_count_before": BEFORE,
              "feature_count_after": AFTER,
              "added_feature_count": 50,
              "classified_added": classified_added,
              "unknown_added": unknown_added,
              "classified_count_after": manifest["classified"],
              "unknown_count_after": manifest["unknown"],
              "source": "OpenStreetMap API 0.6 map",
              "endpoint": ENDPOINT,
              "source_sha256": source_sha,
              "evidence_level_distribution": dict(ev),
              "confidence_level_distribution": dict(conf),
              "building_type_distribution": dict(types),
              "records": new_records,
              "fake_data": False,
              "final_ready": False,
          }

          checkpoint["first_unverified_step_status"] = f"BATCH_{BATCH}_APPENDED_50_{CITY.upper()}_OSM_CONTINUATION_REQUIRED"
          checkpoint["updated_at"] = NOW
          checkpoint["final_ready"] = False
          checkpoint["state"] = "IN_PROGRESS"
          checkpoint["terminal_status"] = "IN_PROGRESS"
          checkpoint.setdefault("summary", {})["current_feature_count"] = AFTER
          checkpoint["summary"]["new_features_added_this_attempt"] = 50
          checkpoint["summary"]["progress_counted"] = True
          checkpoint["feature_count_before"] = BEFORE
          checkpoint["feature_count_after"] = AFTER
          checkpoint["current_feature_count"] = AFTER
          checkpoint["next_batch_index"] = BATCH + 1
          checkpoint["next_target_feature_count"] = AFTER + 300
          checkpoint["last_processed_ids_sample"] = new_ids[-20:]
          checkpoint["attempted_new_city_batch"] = CITY
          checkpoint["source_access_evidence"] = {"osm_api": "Live OSM API 0.6 map tiles succeeded", "endpoint": ENDPOINT, "source_sha256": source_sha, "raw_source_stored_in_git": False}
          checkpoint["blocker"] = None
          checkpoint["blocker_reason"] = ""
          checkpoint["next_required_action"] = f"APPEND_ONLY_BATCH_{BATCH+1}_NEW_SOUTH_EAST_CITY_GRID_DO_NOT_REPROCESS_EXISTING_IDS"
          checkpoint["fake_data"] = False
          checkpoint["last_batch_name"] = CITY
          checkpoint["last_batch_new_features"] = 50
          checkpoint["last_batch_evidence"] = batch_meta
          checkpoint["candidate_batch"] = None
          checkpoint["no_progress_reason"] = None
          checkpoint["new_features_added_this_attempt"] = 50
          checkpoint["progress_counted"] = True
          if CITY not in checkpoint.setdefault("attempted_cities", []):
              checkpoint["attempted_cities"].append(CITY)

          status["state"] = "IN_PROGRESS"
          status["status"] = "in_progress"
          status["panel_status"] = "DEVAM"
          status["updated_at"] = NOW
          status["owner"] = None
          status["final_ready"] = False
          status["fake_data"] = False
          status["classified_count"] = manifest["classified"]
          status["classified"] = manifest["classified"]
          status["unknown_count"] = manifest["unknown"]
          status["unknown"] = manifest["unknown"]
          status["total_elements"] = AFTER
          status["total_features"] = AFTER
          status["current_feature_count"] = AFTER
          status["feature_count_before"] = BEFORE
          status["feature_count_after"] = AFTER
          status["new_features_added"] = 50
          status["new_feature_count"] = 50
          status["progress_count_delta"] = 50
          status["progress_counted"] = True
          status["next_batch_index"] = BATCH + 1
          status["next_target_feature_count"] = AFTER + 300
          status["confidence_distribution"] = dict(manifest["confidence_level_distribution"])
          status["confidence_level_distribution"] = dict(manifest["confidence_level_distribution"])
          status["evidence_distribution"] = dict(manifest["evidence_distribution"])
          status["blocker"] = None
          status["blocker_reason"] = ""
          status["note"] = f"Batch {BATCH} appended 50 new Windsor OSM evidence-backed features outside all prior feature.id/parcel_id/osm_id values; same task/continuation retained."
          status["last_batch_city"] = CITY
          status["last_batch_added_feature_count"] = 50
          status["last_batch_source"] = "OpenStreetMap API 0.6 map"
          status["last_batch_evidence_distribution"] = dict(ev)
          status["last_batch_confidence_distribution"] = dict(conf)
          status["last_batch_index"] = BATCH
          status["last_batch_name"] = CITY
          status["last_batch_new_features"] = 50
          status["last_batch"] = batch_meta
          status["last_batch_evidence"] = batch_meta
          status["candidate_batch"] = None
          status["no_progress_reason"] = None
          status["progress_reason"] = "50 new Windsor OSM records appended after processed-ID exclusion"
          status.setdefault("summary", {})["current_feature_count"] = AFTER
          status["summary"]["new_features_added_this_attempt"] = 50
          status["summary"]["progress_counted"] = True

          task["updated_at"] = NOW
          task["owner"] = None
          task["final_ready"] = False
          task["fake_data"] = False
          task.setdefault("progress", {})["completed_count"] = AFTER
          task["progress"]["target_count"] = AFTER + 300
          task["last_batch_index"] = BATCH
          task["last_batch_name"] = CITY
          task["last_batch_added_feature_count"] = 50
          task["next_batch_index"] = BATCH + 1
          task["next_target_feature_count"] = AFTER + 300

          dump(shard_p, shard)
          shard_sha = hashlib.sha256(shard_p.read_bytes()).hexdigest()
          manifest["output_sha256"] = shard_sha
          status["output_sha256"] = shard_sha
          dump(manifest_p, manifest)
          dump(class_p, classification)
          dump(status_p, status)
          dump(checkpoint_p, checkpoint)
          dump(task_p, task)

          # Local acceptance gate.
          assert AFTER > BEFORE and AFTER == 7500
          assert load(checkpoint_p)["feature_count_after"] > load(checkpoint_p)["feature_count_before"]
          assert load(checkpoint_p)["fake_data"] is False and load(checkpoint_p)["final_ready"] is False
          assert classification["fake_data"] is False and classification["final_ready"] is False
          assert len(classification["records"]) == 50
          assert all(r["sources"] and r["evidence_excerpt"] and r["evidence_level"] in ("B", "C", "D", "U") and r["confidence_level_1_to_4"] in (1,2,3,4) and r["fake_data"] is False for r in classification["records"])
          print(json.dumps({"before": BEFORE, "after": AFTER, "added": 50, "city": CITY, "classified_added": classified_added, "unknown_added": unknown_added, "evidence": dict(ev), "confidence": dict(conf), "types": dict(types), "source_sha256": source_sha, "fetched_tiles": len(fetched_urls)}, sort_keys=True))
          PY

      - name: Remote checkpoint guard then commit and push six canonical files
        run: |
          set -euo pipefail
          BRANCH=codex/aays-single-runner-v5-20260706
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            python3 - <<'PY'
          import json, subprocess
          base='origin/codex/aays-single-runner-v5-20260706:'
          cp=json.loads(subprocess.check_output(['git','show',base+'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json'], text=True))
          task=json.loads(subprocess.check_output(['git','show',base+'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json'], text=True))
