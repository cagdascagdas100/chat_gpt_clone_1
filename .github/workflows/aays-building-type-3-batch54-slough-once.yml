name: AAYS building_type_3 batch57 Bracknell once

"on":
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-3-batch54-slough-once.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aays-building-type-3-canonical-writer
  cancel-in-progress: false

jobs:
  append-bracknell-batch57:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Hydrate fresh branch head
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-3-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin codex/aays-single-runner-v5-20260706

      - name: Append Bracknell batch 57
        env:
          TASK: building-type-3-england-classification-v1-20260808
          CONT: 03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e
          BEFORE: "7550"
          BATCH: "57"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, datetime as dt, hashlib, json, os, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SLOT="building_type_3"
          TASK=os.environ["TASK"]
          CONT=os.environ["CONT"]
          BEFORE=int(os.environ["BEFORE"])
          BATCH=int(os.environ["BATCH"])
          CITY="Bracknell"
          AUTH="Bracknell Forest"
          GRID="Bracknell 51.3900,-0.7900,51.4300,-0.7000"
          ENDPOINT="https://api.openstreetmap.org/api/0.6/map"
          NOW=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          P={
            "shard":Path("england_map_web/data/building_type/shards/building_type_3_latest.geojson"),
            "manifest":Path("england_map_web/data/building_type/shards/building_type_3_manifest_latest.json"),
            "class":Path("docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json"),
            "status":Path("docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json"),
            "cp":Path("docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json"),
            "task":Path("docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json")}
          def load(k): return json.loads(P[k].read_text(encoding="utf-8"))
          def dump(k,o): P[k].write_text(json.dumps(o,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          sh,mf,st,cp,tk=load("shard"),load("manifest"),load("status"),load("cp"),load("task")
          assert cp.get("slot_id")==SLOT and cp.get("continuation_key")==CONT
          assert cp.get("current_feature_count")==BEFORE and cp.get("next_batch_index")==BATCH
          assert tk.get("task_id")==TASK and tk.get("continuation_key")==CONT
          assert tk.get("owner") is None and st.get("owner") is None and st.get("current_feature_count")==BEFORE
          assert len(sh.get("features",[]))==BEFORE

          processed=set()
          for f in sh["features"]:
            if f.get("id") is not None: processed.add(str(f["id"]))
            p=f.get("properties") or {}
            for k in ("parcel_id","osm_id"):
              if p.get(k) is not None: processed.add(str(p[k]))

          direct={
            "detached":("residential_detached","R_DET","residential"),
            "semidetached_house":("residential_semi_detached","R_SEMI","residential"),
            "semi":("residential_semi_detached","R_SEMI","residential"),
            "terrace":("residential_terrace","R_TERRACE","residential"),
            "house":("residential_house","R_HOUSE","residential"),
            "bungalow":("residential_bungalow","R_BUNGALOW","residential"),
            "apartments":("flat_or_apartment","R_FLAT","residential"),
            "residential":("residential","R_RES","residential"),
            "retail":("commercial_retail","C_RETAIL","commercial"),
            "commercial":("commercial_other","C_OTHER","commercial"),
            "office":("commercial_office","C_OFFICE","commercial"),
            "industrial":("industrial","I_IND","industrial"),
            "warehouse":("warehouse","I_WARE","industrial"),
            "garage":("workshop_or_garage","I_GARAGE","industrial"),
            "garages":("workshop_or_garage","I_GARAGE","industrial"),
            "school":("education","P_EDU","public"),
            "college":("education","P_EDU","public"),
            "university":("education","P_EDU","public"),
            "church":("religious_or_community","P_RELIG","public"),
            "chapel":("religious_or_community","P_RELIG","public"),
            "cathedral":("religious_or_community","P_RELIG","public"),
            "hospital":("hospital_or_healthcare","P_HEALTH","public"),
            "hotel":("hotel_or_hospitality","C_HOSPITALITY","commercial"),
            "barn":("agricultural","A_AGRI","agricultural"),
            "farm_auxiliary":("agricultural","A_AGRI","agricultural"),
            "cowshed":("agricultural","A_AGRI","agricultural"),
            "stable":("agricultural","A_AGRI","agricultural"),
            "greenhouse":("agricultural","A_AGRI","agricultural"),
            "shed":("other_building","X_OTHER","other"),
            "outbuilding":("other_building","X_OTHER","other"),
            "roof":("other_building","X_OTHER","other"),
            "carport":("other_building","X_OTHER","other")}

          def classify(t):
            b=(t.get("building") or "").lower().strip()
            if b in direct:
              typ,code,cat=direct[b]
              return typ,code,cat,.86,3,"B",f"building={b}"
            if b=="yes":
              if t.get("shop"): return "commercial_retail","C_RETAIL","commercial",.72,2,"C",f"building=yes; shop={t['shop']}"
              if t.get("office"): return "commercial_office","C_OFFICE","commercial",.72,2,"C",f"building=yes; office={t['office']}"
              if t.get("industrial"): return "industrial","I_IND","industrial",.72,2,"C",f"building=yes; industrial={t['industrial']}"
              if t.get("tourism") in ("hotel","guest_house","hostel","motel"): return "hotel_or_hospitality","C_HOSPITALITY","commercial",.72,2,"C",f"building=yes; tourism={t['tourism']}"
              if t.get("amenity") in ("hospital","clinic","doctors","dentist","pharmacy"): return "hospital_or_healthcare","P_HEALTH","public",.72,2,"C",f"building=yes; amenity={t['amenity']}"
              if t.get("amenity") in ("school","college","university","kindergarten"): return "education","P_EDU","public",.72,2,"C",f"building=yes; amenity={t['amenity']}"
              return "unknown","U_UNKNOWN","unknown",0.0,1,"U","building=yes without type-specific supporting tag"
            return "unknown","U_UNKNOWN","unknown",0.0,1,"U",f"unmapped building={b or 'missing'}"

          def fetch_tile(w,s,e,n):
            url=ENDPOINT+"?"+urllib.parse.urlencode({"bbox":f"{w:.4f},{s:.4f},{e:.4f},{n:.4f}"})
            req=urllib.request.Request(url,headers={"User-Agent":"AAYS-building-type-3-batch57/1.0"})
            last=None
            for i in range(3):
              try:
                with urllib.request.urlopen(req,timeout=90) as r: body=r.read()
                if not body: raise RuntimeError("empty OSM response")
                return url,body
              except Exception as exc:
                last=exc
                if i<2: time.sleep(3*(i+1))
            raise RuntimeError(f"OSM fetch failed after 3 tries: {last}")

          cand=[]; seen=set(); urls=[]; agg=hashlib.sha256(); s=51.3900
          while s<51.4300-1e-9 and len(cand)<180:
            n=min(s+.0100,51.4300); w=-.7900
            while w<-.7000-1e-9 and len(cand)<180:
              e=min(w+.0150,-.7000)
              url,body=fetch_tile(w,s,e,n); urls.append(url); agg.update(body)
              tile=hashlib.sha256(body).hexdigest(); root=ET.fromstring(body)
              nodes={x.attrib["id"]:(float(x.attrib["lon"]),float(x.attrib["lat"])) for x in root.findall("node")}
              for way in root.findall("way"):
                wid=way.attrib.get("id")
                tags={t.attrib.get("k",""):t.attrib.get("v","") for t in way.findall("tag")}
                if not wid or wid in seen or not tags.get("building"): continue
                fid=f"ENG_OSM_way_{wid}"; oid=f"way/{wid}"
                if fid in processed or oid in processed: continue
                coords=[nodes[r] for r in [nd.attrib.get("ref") for nd in way.findall("nd")] if r in nodes]
                if not coords: continue
                seen.add(wid)
                cand.append({"wid":wid,"fid":fid,"oid":oid,"tags":tags,"url":url,"sha":tile,
                  "geometry":{"type":"Point","coordinates":[sum(x for x,_ in coords)/len(coords),sum(y for _,y in coords)/len(coords)]}})
              w=round(e,4)
            s=round(n,4)

          if len(cand)<50:
            raise SystemExit(f"NO_PROGRESS: only {len(cand)} unprocessed Bracknell building ways; canonical files unchanged")
          selected=sorted(cand,key=lambda c:(0 if classify(c["tags"])[0]!="unknown" else 1,int(c["wid"])))[:50]

          ev=collections.Counter(); conf=collections.Counter(); types=collections.Counter()
          records=[]; feats=[]; ids=[]; parcels=[]; osms=[]
          for c in selected:
            t=c["tags"]; typ,code,cat,score,level,evidence,match=classify(t)
            fields=[k for k in ("building","shop","office","tourism","amenity","industrial","name","addr:street","addr:postcode","addr:city") if t.get(k)]
            excerpt=" | ".join(f"{k}={t[k]}" for k in fields)[:600] or match
            element=f"https://www.openstreetmap.org/way/{c['wid']}"
            src={"source_name":"OpenStreetMap API 0.6 map","url_or_local_path":c["url"],"element_url":element,"accessed_at":NOW,"sha256":c["sha"],"licence":"ODbL 1.0","granularity":"building_way_centroid","fields_used":fields or ["building"],"supports_field":"building_type_primary","match_method":match,"match_score":score}
            r={"feature_id":c["fid"],"parcel_id":c["fid"],"osm_id":c["oid"],"slot_id":SLOT,"region":"South East","area":CITY,"local_authority":AUTH,"postcode":t.get("addr:postcode",""),"building_type_primary":typ,"building_type_code":code,"building_category":cat,"confidence_score":score,"confidence_level_1_to_4":level,"evidence_level":evidence,"source_count":1,"source_url":element,"source_hash":c["sha"],"match_method":match,"evidence_excerpt":excerpt,"source_evidence_excerpt":excerpt,"sources":[src],"geometry_match_method":"osm_way_centroid","address_match_method":"osm_tags_only","limitations":"OSM-only classification; no EPC/VOA/HMLR corroboration in this batch.","needs_manual_review":evidence in ("U","D"),"fake_data":False,"final_ready":False,"updated_at":NOW,"geometry":c["geometry"]}
            records.append(r)
            feats.append({"type":"Feature","id":c["fid"],"geometry":c["geometry"],"properties":{k:v for k,v in r.items() if k!="geometry"}})
            ev[evidence]+=1; conf[str(level)]+=1; types[typ]+=1
            ids.append(c["fid"]); parcels.append(c["fid"]); osms.append(c["oid"])

          assert len(ids)==len(parcels)==len(osms)==50
          assert len(set(ids))==len(set(parcels))==len(set(osms))==50
          assert not(set(ids)&processed) and not(set(parcels)&processed) and not(set(osms)&processed)

          sh["features"].extend(feats); AFTER=len(sh["features"])
          assert AFTER==BEFORE+50 and AFTER>BEFORE
          sh.update({"updated_at":NOW,"latest_batch":CITY,"last_batch_index":BATCH,"fake_data":False,"final_ready":False})
          source_sha=agg.hexdigest()
          classified=sum(v for k,v in types.items() if k!="unknown")
          unknown=types.get("unknown",0)
          batch={"batch_index":BATCH,"batch_name":CITY,"city":CITY,"grid_bbox":GRID,"source":"OpenStreetMap API 0.6 map","endpoint":ENDPOINT,"source_url":ENDPOINT,"source_sha256":source_sha,"features_used":50,"added_feature_count":50,"classified_added":classified,"unknown_added":unknown,"accessed_at":NOW,"evidence_level_distribution":dict(ev),"confidence_level_distribution":dict(conf),"building_type_distribution":dict(types),"new_feature_ids":ids,"new_parcel_ids":parcels,"new_osm_ids":osms,"fetched_urls":urls,"raw_source_stored_in_git":False}

          mf.update({"generated_at":NOW,"total_features":AFTER,"feature_count":AFTER,"feature_count_before":BEFORE,"feature_count_after":AFTER,"added_feature_count":50,"classified":int(mf.get("classified",0))+classified,"unknown":int(mf.get("unknown",0))+unknown,"fake_data":False,"final_ready":False,"last_batch_index":BATCH,"last_batch_name":CITY,"last_batch":batch})
          for k,v in ev.items(): mf.setdefault("evidence_distribution",{})[k]=int(mf["evidence_distribution"].get(k,0))+v
          for k,v in conf.items(): mf.setdefault("confidence_level_distribution",{})[k]=int(mf["confidence_level_distribution"].get(k,0))+v
          for k,v in types.items(): mf.setdefault("type_distribution",{})[k]=int(mf["type_distribution"].get(k,0))+v
          mf.setdefault("sources",[]).append({"name":f"OpenStreetMap API 0.6 map - {CITY} batch {BATCH}","url":ENDPOINT,"features_used":50,"accessed_at":NOW,"source_sha256":source_sha,"source_hash_method":"sha256_concatenated_raw_osm_xml_tiles","license":"ODbL 1.0","evidence_level_distribution":dict(ev),"confidence_level_distribution":dict(conf),"grid_bbox":GRID,"raw_source_stored_in_git":False,"note":"50 new Bracknell OSM building ways after feature.id/parcel_id/osm_id exclusion; raw XML runtime-only."})

          cl={"schema_version":3,"slot_id":SLOT,"task_id":TASK,"continuation_key":CONT,"generated_at":NOW,"state":"IN_PROGRESS","batch_index":BATCH,"batch_name":CITY,"feature_count_before":BEFORE,"feature_count_after":AFTER,"added_feature_count":50,"classified_added":classified,"unknown_added":unknown,"classified_count_after":mf["classified"],"unknown_count_after":mf["unknown"],"source":"OpenStreetMap API 0.6 map","endpoint":ENDPOINT,"source_sha256":source_sha,"evidence_level_distribution":dict(ev),"confidence_level_distribution":dict(conf),"building_type_distribution":dict(types),"records":records,"fake_data":False,"final_ready":False}

          cp.update({"first_unverified_step_status":f"BATCH_{BATCH}_APPENDED_50_{CITY.upper()}_OSM_CONTINUATION_REQUIRED","updated_at":NOW,"final_ready":False,"state":"IN_PROGRESS","terminal_status":"IN_PROGRESS","feature_count_before":BEFORE,"feature_count_after":AFTER,"current_feature_count":AFTER,"next_batch_index":BATCH+1,"next_target_feature_count":AFTER+300,"last_processed_ids_sample":ids[-20:],"attempted_new_city_batch":CITY,"source_access_evidence":{"osm_api":"Live OSM API 0.6 map tiles succeeded","endpoint":ENDPOINT,"source_sha256":source_sha,"raw_source_stored_in_git":False},"blocker":None,"blocker_reason":"","next_required_action":f"APPEND_ONLY_BATCH_{BATCH+1}_NEW_SOUTH_EAST_CITY_GRID_DO_NOT_REPROCESS_EXISTING_IDS","fake_data":False,"last_batch_name":CITY,"last_batch_new_features":50,"last_batch_evidence":batch,"candidate_batch":None,"no_progress_reason":None,"new_features_added_this_attempt":50,"progress_counted":True})
          cp.setdefault("summary",{}).update({"current_feature_count":AFTER,"new_features_added_this_attempt":50,"progress_counted":True})
          if CITY not in cp.setdefault("attempted_cities",[]): cp["attempted_cities"].append(CITY)

          st.update({"state":"IN_PROGRESS","status":"in_progress","panel_status":"DEVAM","updated_at":NOW,"owner":None,"final_ready":False,"fake_data":False,"classified_count":mf["classified"],"classified":mf["classified"],"unknown_count":mf["unknown"],"unknown":mf["unknown"],"total_elements":AFTER,"total_features":AFTER,"current_feature_count":AFTER,"feature_count_before":BEFORE,"feature_count_after":AFTER,"new_features_added":50,"new_feature_count":50,"progress_count_delta":50,"progress_counted":True,"next_batch_index":BATCH+1,"next_target_feature_count":AFTER+300,"confidence_distribution":dict(mf["confidence_level_distribution"]),"confidence_level_distribution":dict(mf["confidence_level_distribution"]),"evidence_distribution":dict(mf["evidence_distribution"]),"blocker":None,"blocker_reason":"","note":f"Batch {BATCH} appended 50 new {CITY} OSM evidence-backed features outside all prior feature.id/parcel_id/osm_id values; same task/continuation retained.","last_batch_city":CITY,"last_batch_added_feature_count":50,"last_batch_source":"OpenStreetMap API 0.6 map","last_batch_evidence_distribution":dict(ev),"last_batch_confidence_distribution":dict(conf),"last_batch_index":BATCH,"last_batch_name":CITY,"last_batch_new_features":50,"last_batch":batch,"last_batch_evidence":batch,"candidate_batch":None,"no_progress_reason":None,"progress_reason":f"50 new {CITY} OSM records appended after processed-ID exclusion"})
          st.setdefault("summary",{}).update({"current_feature_count":AFTER,"new_features_added_this_attempt":50,"progress_counted":True})

          tk.update({"updated_at":NOW,"owner":None,"final_ready":False,"fake_data":False,"last_batch_index":BATCH,"last_batch_name":CITY,"last_batch_added_feature_count":50,"next_batch_index":BATCH+1,"next_target_feature_count":AFTER+300})
          tk.setdefault("progress",{}).update({"completed_count":AFTER,"target_count":AFTER+300})

          dump("shard",sh)
          shard_sha=hashlib.sha256(P["shard"].read_bytes()).hexdigest()
          mf["output_sha256"]=shard_sha; st["output_sha256"]=shard_sha
          dump("manifest",mf); dump("class",cl); dump("status",st); dump("cp",cp); dump("task",tk)

          assert load("cp")["feature_count_after"]>load("cp")["feature_count_before"]
          assert load("cp")["fake_data"] is False and load("cp")["final_ready"] is False
          assert len(cl["records"])==50
          assert all(r.get("sources") and r.get("evidence_excerpt") and r.get("evidence_level") in ("B","C","D","U") and r.get("confidence_level_1_to_4") in (1,2,3,4) and r.get("fake_data") is False for r in cl["records"])
          print(json.dumps({"before":BEFORE,"after":AFTER,"added":50,"city":CITY,"classified_added":classified,"unknown_added":unknown,"evidence":dict(ev),"confidence":dict(conf),"types":dict(types),"source_sha256":source_sha,"fetched_tiles":len(urls)},sort_keys=True))
          PY

      - name: Guard, commit and push six canonical files
        run: |
          set -euo pipefail
          BRANCH=codex/aays-single-runner-v5-20260706
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            python3 - <<'PY'
          import json, subprocess
          base='origin/codex/aays-single-runner-v5-20260706:'
          cp=json.loads(subprocess.check_output(['git','show',base+'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json'],text=True))
          tk=json.loads(subprocess.check_output(['git','show',base+'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json'],text=True))
          if cp.get('current_feature_count')!=7550 or cp.get('next_batch_index')!=57 or cp.get('continuation_key')!='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e' or tk.get('owner') is not None:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_3 moved; do not overwrite')
          PY
            git add \
              england_map_web/data/building_type/shards/building_type_3_latest.geojson \
              england_map_web/data/building_type/shards/building_type_3_manifest_latest.json \
              docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json \
              docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json \
              docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json \
              docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json
            if ! git diff --cached --quiet; then git commit -m "data(building_type_3): append Bracknell batch 57"; fi
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1

      - name: Remote readback acceptance gate
        run: |
          set -euo pipefail
          BRANCH=codex/aays-single-runner-v5-20260706
          git fetch origin "$BRANCH"
          python3 - <<'PY'
          import json, subprocess
          base='origin/codex/aays-single-runner-v5-20260706:'
          def read(p): return json.loads(subprocess.check_output(['git','show',base+p],text=True))
          cp=read('docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json')
          st=read('docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json')
          mf=read('england_map_web/data/building_type/shards/building_type_3_manifest_latest.json')
          cl=read('docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json')
          sh=read('england_map_web/data/building_type/shards/building_type_3_latest.geojson')
          assert cp['feature_count_before']==7550 and cp['feature_count_after']==7600 and cp['progress_counted'] is True
          assert cp['current_feature_count']==7600 and cp['last_batch_name']=='Bracknell' and cp['fake_data'] is False and cp['final_ready'] is False
          assert st['current_feature_count']==7600 and st['last_batch_name']=='Bracknell' and st['owner'] is None and st['final_ready'] is False
          assert mf['total_features']==7600 and mf['feature_count_after']==7600
          assert cl['feature_count_before']==7550 and cl['feature_count_after']==7600 and cl['added_feature_count']==50 and len(cl['records'])==50 and cl['batch_name']=='Bracknell'
          assert len(sh['features'])==7600 and sh.get('latest_batch')=='Bracknell'
          prior=sh['features'][:7550]; new=sh['features'][7550:]
          prior_ids=set(); prior_parcels=set(); prior_osms=set()
          for f in prior:
            if f.get('id') is not None: prior_ids.add(str(f['id']))
            p=f.get('properties') or {}
            if p.get('parcel_id') is not None: prior_parcels.add(str(p['parcel_id']))
            if p.get('osm_id') is not None: prior_osms.add(str(p['osm_id']))
          new_ids=[str(f.get('id')) for f in new]
          new_parcels=[str((f.get('properties') or {}).get('parcel_id')) for f in new]
          new_osms=[str((f.get('properties') or {}).get('osm_id')) for f in new]
          assert len(new)==50 and len(set(new_ids))==len(set(new_parcels))==len(set(new_osms))==50
          assert not(set(new_ids)&prior_ids) and not(set(new_parcels)&prior_parcels) and not(set(new_osms)&prior_osms)
          assert all(r.get('sources') and r.get('evidence_excerpt') and r.get('evidence_level') in ('B','C','D','U') and r.get('confidence_level_1_to_4') in (1,2,3,4) and r.get('fake_data') is False for r in cl['records'])
          print(json.dumps({'remote_readback':'OK','feature_count_before':7550,'feature_count_after':7600,'added':50,'batch':'Bracknell','classified_added':cl['classified_added'],'unknown_added':cl['unknown_added'],'evidence':cl['evidence_level_distribution'],'confidence':cl['confidence_level_distribution'],'next_batch':cp['next_batch_index']},sort_keys=True))
          PY
