          assert run['feature_count_before']==5300 and run['feature_count_after']==5350 and run['added_feature_count']==50 and run['already_processed_ids_policy_applied'] is True and run['raw_source_committed'] is False and run['fake_data'] is False and run['final_ready'] is False
          assert cp['fake_data'] is False and cp['final_ready'] is False and st['fake_data'] is False and st['final_ready'] is False and man['fake_data'] is False and man['final_ready'] is False
          print('VALIDATED building_type_7 Worcester 5300->5350 batch107=50')
          PY

