              try:
                req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-building_type_7/1.0','Accept':'application/xml'})
                with urllib.request.urlopen(req,timeout=120) as resp: raw=resp.read()
                break
              except Exception as exc:
                errors.append(f'{txt} attempt {attempt+1}: {type(exc).__name__}: {exc}')
                time.sleep(2+attempt)
            if raw is None: continue
            raw_parts.append(raw); fetched_urls.append(url); root=ET.fromstring(raw)
            node_coords={}
            for n in root.findall('node'):
              nid=n.get('id'); lon=n.get('lon'); lat=n.get('lat')
              if nid and lon is not None and lat is not None: node_coords[nid]=(float(lon),float(lat))
            tile_sha=hashlib.sha256(raw).hexdigest()
            for way in root.findall('way'):
              wid=way.get('id'); tags={t.get('k'):t.get('v') for t in way.findall('tag') if t.get('k')}
              if not wid or not tags.get('building'): continue
              cls=classify(tags)
              if cls is None: continue
              pts=[node_coords[nd.get('ref')] for nd in way.findall('nd') if nd.get('ref') in node_coords]
              if not pts: continue
              fid=f'ENG_OSM_way_{wid}'; osmid=f'way/{wid}'
              if fid in already or osmid in already or str(wid) in already or fid in elements: continue
              lon=sum(p[0] for p in pts)/len(pts); lat=sum(p[1] for p in pts)/len(pts)
              elements[fid]=(wid,lon,lat,tags,cls,url,tile_sha)
            if len(elements)>=50: break

          if len(elements)<50:
            raise SystemExit(f'only {len(elements)} new classified candidates; need 50; errors={errors[-6:]}')

          combined_sha=hashlib.sha256(b'\n--AAYS-TILE--\n'.join(raw_parts)).hexdigest()
          chosen=[elements[k] for k in sorted(elements,key=lambda x:int(x.rsplit('_',1)[1]))[:50]]
          new_ids=[]; records=[]; batch_ev=collections.Counter(); batch_conf=collections.Counter(); batch_types=collections.Counter()
          keys=('building','amenity','shop','office','tourism','healthcare','name','addr:housenumber','addr:street','addr:postcode','addr:city')
          for wid,lon,lat,tags,cls,tile_url,tile_sha in chosen:
            primary,code,category,ev,score,level,method=cls; fid=f'ENG_OSM_way_{wid}'; osmid=f'way/{wid}'
            excerpt=' | '.join(f'{k}={tags[k]}' for k in keys if k in tags)
            obj_url=f'https://www.openstreetmap.org/way/{wid}'
            src={'source_name':'OpenStreetMap API 0.6 map','url_or_local_path':tile_url,'element_url':obj_url,'accessed_at':NOW,'sha256':tile_sha,'licence':'ODbL 1.0','granularity':'building_way_centroid','fields_used':[k for k in keys if k in tags],'supports_field':'building_type_primary','match_method':method,'match_score':score,'evidence_excerpt':excerpt}
            geom={'type':'Point','coordinates':[lon,lat]}
            props={'feature_id':fid,'parcel_id':fid,'parcel_id_semantics':'OSM building-way slot identifier; not a cadastral parcel ID','osm_id':osmid,'slot_id':SLOT,'region':REGION,'area':CITY,'local_authority':AUTH,'postcode':tags.get('addr:postcode') or '','building_type_primary':primary,'building_type_code':code,'building_category':category,'confidence_score':score,'confidence_level_1_to_4':level,'evidence_level':ev,'source_count':1,'sources':[src],'source':'OpenStreetMap API 0.6 map','source_url':obj_url,'source_hash':tile_sha,'match_method':method,'evidence_excerpt':excerpt,'source_evidence_excerpt':excerpt,'osm_tags_summary':{k:tags[k] for k in keys if k in tags},'geometry_match_method':'osm_way_node_centroid','address_match_method':'none','limitations':'OSM tag evidence; cadastral parcel binding and EPC/VOA/HMLR corroboration pending.','needs_manual_review':level<3,'fake_data':False,'final_ready':False,'updated_at':NOW}
            feats.append({'type':'Feature','id':fid,'geometry':geom,'properties':props})
            records.append({'feature_id':fid,'parcel_id':fid,'osm_id':osmid,'building_type_primary':primary,'building_type_code':code,'building_category':category,'confidence_score':score,'confidence_level_1_to_4':level,'evidence_level':ev,'source_url':obj_url,'source_hash':tile_sha,'match_method':method,'evidence_excerpt':excerpt,'sources':[src],'fake_data':False,'final_ready':False,'geometry':geom})
            new_ids.append(fid); batch_ev[ev]+=1; batch_conf[str(level)]+=1; batch_types[primary]+=1

          if len(feats)!=AFTER or len(new_ids)!=50 or len(set(new_ids))!=50 or any(i in already for i in new_ids):
            raise SystemExit(f'progress/uniqueness gate failed {BEFORE}->{len(feats)} ids={len(new_ids)}')

          geo['features']=feats
          geo_text=json.dumps(geo,ensure_ascii=False,indent=2)+'\n'; GEO.write_text(geo_text,encoding='utf-8')
          output_sha=hashlib.sha256(geo_text.encode()).hexdigest()

          ev_all=collections.Counter(); conf_all=collections.Counter(); type_all=collections.Counter(); classified=unknown=0
          for f in feats:
            p=f.get('properties') or {}; typ=str(p.get('building_type_primary') or 'unknown'); ev=str(p.get('evidence_level') or 'U'); lvl=str(p.get('confidence_level_1_to_4') or 1)
            ev_all[ev]+=1; conf_all[lvl]+=1; type_all[typ]+=1
            if typ=='unknown' or ev=='U': unknown+=1
            else: classified+=1

          batch={'batch_index':BATCH,'batch_name':CITY,'city':CITY,'grid_bbox':GRID,'source':'OpenStreetMap API 0.6 map','endpoint':API,'source_url':API,'source_sha256':combined_sha,'features_used':50,'added_feature_count':50,'accessed_at':NOW,'evidence_level_distribution':dict(batch_ev),'confidence_level_distribution':dict(batch_conf),'building_type_distribution':dict(batch_types),'new_feature_ids':new_ids,'fetched_urls':fetched_urls,'raw_source_stored_in_git':False}

          man=load(MAN); man.update({'generated_at':NOW,'total_features':AFTER,'feature_count':AFTER,'feature_count_before':BEFORE,'feature_count_after':AFTER,'added_feature_count':50,'classified':classified,'unknown':unknown,'evidence_distribution':dict(ev_all),'type_distribution':dict(type_all),'confidence_level_distribution':dict(conf_all),'latest_batch':batch,'last_batch':batch,'last_batch_index':BATCH,'output_sha256':output_sha,'fake_data':False,'final_ready':False})
          sources=man.get('sources') or []; sources.append({'name':f'OpenStreetMap API 0.6 map - {CITY} batch {BATCH}','url':API,'features_used':50,'accessed_at':NOW,'source_sha256':combined_sha,'source_hash_method':'sha256_runtime_xml_tiles','license':'ODbL 1.0','evidence_level_distribution':dict(batch_ev),'confidence_level_distribution':dict(batch_conf),'grid_bbox':GRID,'note':'Selected outside existing feature.id/feature_id/parcel_id/osm_id values; raw XML runtime-only.'}); man['sources']=sources; dump(MAN,man)

          status.update({'state':'IN_PROGRESS','status':'READY','updated_at':NOW,'owner':None,'classified_count':classified,'classified':classified,'unknown_count':unknown,'unknown':unknown,'total_elements':AFTER,'total_features':AFTER,'current_feature_count':AFTER,'feature_count_before':BEFORE,'feature_count_after':AFTER,'new_features_added':50,'new_feature_count':50,'progress_count_delta':50,'progress_counted':True,'next_batch_index':NEXT_BATCH,'next_target_feature_count':NEXT_TARGET,'confidence_distribution':dict(conf_all),'confidence_level_distribution':dict(conf_all),'evidence_distribution':dict(ev_all),'output_sha256':output_sha,'blocker':None,'blocker_reason':'','candidate_batch':None,'no_progress_reason':None,'note':f'Batch {BATCH} {CITY} OSM API: 50 unique evidence-backed features appended; total {AFTER}. Remote readback pending.','progress_reason':f'50 new {CITY} OSM records appended after processed-ID exclusion','last_batch_city':CITY,'last_batch_added_feature_count':50,'last_batch_source':'OpenStreetMap API 0.6 map','last_batch_evidence_distribution':dict(batch_ev),'last_batch_confidence_distribution':dict(batch_conf),'last_batch_index':BATCH,'last_batch':batch,'fake_data':False,'final_ready':False,'remote_readback_verified':False}); dump(STA,status)

          cp.update({'state':'IN_PROGRESS','terminal_status':'IN_PROGRESS','updated_at':NOW,'first_unverified_step_status':f'BATCH_{BATCH}_APPENDED_REMOTE_READBACK_PENDING','feature_count_before':BEFORE,'feature_count_after':AFTER,'current_feature_count':AFTER,'next_batch_index':NEXT_BATCH,'next_target_feature_count':NEXT_TARGET,'next_city_index':NEXT_CITY_INDEX,'last_processed_ids_sample':new_ids[-20:],'attempted_new_city_batch':CITY,'blocker':None,'blocker_reason':'','candidate_batch':None,'no_progress_reason':None,'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE_AND_PARCEL_BINDING','last_batch_name':CITY,'last_batch_new_features':50,'last_batch':batch,'last_batch_evidence':batch,'source_access_evidence':{'osm_api':'Live OSM API 0.6 map tiles succeeded','endpoint':API,'source_sha256':combined_sha,'raw_source_stored_in_git':False},'fake_data':False,'final_ready':False,'remote_readback_verified':False}); cp.setdefault('summary',{}).update({'current_feature_count':AFTER,'new_features_appended':50,'new_features_added_this_attempt':50,'progress_counted':True,'note':f'PROGRESS: feature_count {BEFORE} -> {AFTER}. Batch {BATCH} {CITY} appended; remote readback pending. final_ready remains false.'}); cp.setdefault('remaining_items',{})['note']=f'Next batch {NEXT_BATCH}: treat all {AFTER} canonical feature.id/feature_id/parcel_id/osm_id values as already_processed_ids and append at least 50 genuinely new West Midlands records; do not replay prior batches.'; dump(CP,cp)

          runner={'schema_version':3,'slot_id':SLOT,'task_id':TASK,'generated_at':NOW,'state':'IN_PROGRESS','batch_index':BATCH,'batch_name':CITY,'city':CITY,'local_authority':AUTH,'grid_bbox':GRID,'feature_count_before':BEFORE,'feature_count_after':AFTER,'new_features_added':50,'added_feature_count':50,'progress_counted':True,'source':'OpenStreetMap API 0.6 map','endpoint':API,'source_url':API,'source_sha256':combined_sha,'evidence_level_distribution':dict(batch_ev),'confidence_level_distribution':dict(batch_conf),'building_type_distribution':dict(batch_types),'already_processed_id_fields':['feature.id','properties.feature_id','properties.parcel_id','properties.osm_id'],'already_processed_ids_policy':'existing feature.id, feature_id, parcel_id and osm_id excluded before selection','already_processed_ids_policy_applied':True,'new_feature_ids':new_ids,'selected_feature_ids':new_ids,'records':records,'raw_source_committed':False,'raw_source_stored_in_git':False,'fake_data':False,'final_ready':False}; dump(RUN,runner)
          print(json.dumps({'before':BEFORE,'after':AFTER,'added':50,'city':CITY,'evidence':dict(batch_ev),'confidence':dict(batch_conf),'source_sha256':combined_sha},ensure_ascii=False))
          PY

      - name: Validate append and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          L=lambda p:json.loads(Path(p).read_text())
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson'); man=L('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json'); cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'); st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json'); run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json'); task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(geo['features'])==5350 and man.get('total_features',man.get('feature_count'))==5350 and cp['current_feature_count']==5350 and cp['next_batch_index']==108 and cp['next_target_feature_count']==5400 and st['current_feature_count']==5350
          assert task['task_id']=='building-type-7-england-classification-v1-20260808' and task.get('owner') in (None,'') and task.get('fake_data') is False and task.get('final_ready') is False
          ids=set(run['new_feature_ids']); assert len(ids)==50; batch=[f for f in geo['features'] if f.get('id') in ids]; assert len(batch)==50
          F=[str(f['id']) for f in geo['features']]; FI=[str((f.get('properties') or {}).get('feature_id')) for f in geo['features'] if (f.get('properties') or {}).get('feature_id')]; P=[str((f.get('properties') or {}).get('parcel_id')) for f in geo['features'] if (f.get('properties') or {}).get('parcel_id')]; O=[str((f.get('properties') or {}).get('osm_id')) for f in geo['features'] if (f.get('properties') or {}).get('osm_id')]
          assert len(F)==len(set(F)) and len(FI)==len(set(FI)) and len(P)==len(set(P)) and len(O)==len(set(O))
          for f in batch:
