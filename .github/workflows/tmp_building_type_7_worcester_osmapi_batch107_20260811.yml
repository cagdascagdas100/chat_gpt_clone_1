name: tmp building_type_7 Worcester OSM API batch 107

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_7_worcester_osmapi_batch107_20260811.yml]

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 unseen Worcester OSM API records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections, datetime as dt, hashlib, json, pathlib, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET

          SLOT='building_type_7'
          TASK='building-type-7-england-classification-v1-20260808'
          CITY='Worcester'
          AUTH='Worcestershire'
          REGION='West Midlands'
          BATCH=107
          BEFORE=5300
          AFTER=5350
          NEXT_BATCH=108
          NEXT_TARGET=5400
          NEXT_CITY_INDEX=18
          API='https://api.openstreetmap.org/api/0.6/map'
          BBOXES=[
            (-2.2300,52.1850,-2.2100,52.2000),
            (-2.2100,52.1850,-2.1900,52.2000),
            (-2.2300,52.2000,-2.2100,52.2150),
            (-2.2100,52.2000,-2.1900,52.2150),
            (-2.2500,52.1850,-2.2300,52.2000),
            (-2.2500,52.2000,-2.2300,52.2150),
          ]
          GRID='52.185,-2.250,52.215,-2.190'

          GEO=pathlib.Path('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          MAN=pathlib.Path('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          STA=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          CP=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          CT=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          RUN=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          NOW=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def dump(p,o,compact=False):
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(json.dumps(o,ensure_ascii=False,separators=(',',':') if compact else None,indent=None if compact else 2)+'\n',encoding='utf-8')

          task,status,cp=load(CT),load(STA),load(CP)
          if task.get('task_id')!=TASK or status.get('task_id')!=TASK:
            raise SystemExit('task mismatch; refusing second task')
          if task.get('owner') not in (None,'') or status.get('owner') not in (None,''):
            raise SystemExit('live owner; refusing second owner')
          if cp.get('next_batch_index')!=BATCH or cp.get('current_feature_count')!=BEFORE or cp.get('next_target_feature_count')!=AFTER:
            raise SystemExit(f'checkpoint moved: current={cp.get("current_feature_count")} batch={cp.get("next_batch_index")} target={cp.get("next_target_feature_count")}')
          for obj in (task,status,cp):
            if obj.get('fake_data') is not False or obj.get('final_ready') is not False:
              raise SystemExit('safety flag changed')

          geo=load(GEO); feats=geo.get('features')
          if not isinstance(feats,list) or len(feats)!=BEFORE:
            raise SystemExit(f'shard moved or invalid: {len(feats) if isinstance(feats,list) else None}')

          already=set()
          for f in feats:
            p=f.get('properties') or {}
            for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id')):
              if v not in (None,''): already.add(str(v))

          residential={'house','detached','semidetached_house','terrace','apartments','bungalow','residential','dormitory'}
          explicit={
            'retail':('commercial_retail','C_RETAIL','commercial'),
            'commercial':('commercial_other','C_COMMERCIAL','commercial'),
            'office':('commercial_office','C_OFFICE','commercial'),
            'hotel':('hotel_or_hospitality','C_HOTEL','commercial'),
            'industrial':('industrial','I_INDUSTRIAL','industrial'),
            'warehouse':('warehouse','I_WAREHOUSE','industrial'),
            'school':('education','P_EDUCATION','institutional'),
            'college':('education','P_EDUCATION','institutional'),
            'university':('education','P_EDUCATION','institutional'),
            'church':('religious_or_community','P_RELIGIOUS','institutional'),
            'chapel':('religious_or_community','P_RELIGIOUS','institutional'),
            'hospital':('healthcare_care','P_HEALTHCARE','institutional'),
            'civic':('public_infrastructure','P_PUBLIC','institutional'),
            'public':('public_infrastructure','P_PUBLIC','institutional'),
            'barn':('agricultural','A_BARN','agricultural'),
            'farm':('agricultural','A_FARM','agricultural'),
            'farm_auxiliary':('agricultural','A_FARM','agricultural'),
            'greenhouse':('agricultural','A_GREENHOUSE','agricultural'),
            'garage':('ancillary_or_storage','A_ANCILLARY','ancillary'),
            'garages':('ancillary_or_storage','A_ANCILLARY','ancillary'),
          }

          def classify(tags):
            b=str(tags.get('building') or '').strip().lower()
            if not b or b in {'no','construction','proposed'}: return None
            if b in residential:
              return ('residential','R_RESIDENTIAL','residential','B',0.86,3,f'building={b}')
            if b in explicit:
              p,c,cat=explicit[b]; return (p,c,cat,'B',0.86,3,f'building={b}')
            shop=tags.get('shop'); office=tags.get('office'); amenity=tags.get('amenity'); tourism=tags.get('tourism'); healthcare=tags.get('healthcare')
            if shop and shop!='no': return ('commercial_retail','C_RETAIL','commercial','C',0.72,2,f'building={b}; shop={shop}')
            if office and office!='no': return ('commercial_office','C_OFFICE','commercial','C',0.72,2,f'building={b}; office={office}')
            if tourism in {'hotel','hostel','guest_house','motel'}: return ('hotel_or_hospitality','C_HOTEL','commercial','C',0.72,2,f'building={b}; tourism={tourism}')
            if healthcare: return ('healthcare_care','P_HEALTHCARE','institutional','C',0.72,2,f'building={b}; healthcare={healthcare}')
            if amenity in {'school','college','university','kindergarten'}: return ('education','P_EDUCATION','institutional','C',0.72,2,f'building={b}; amenity={amenity}')
            if amenity in {'hospital','clinic','doctors','dentist','pharmacy'}: return ('healthcare_care','P_HEALTHCARE','institutional','C',0.72,2,f'building={b}; amenity={amenity}')
            if amenity in {'place_of_worship','community_centre'}: return ('religious_or_community','P_RELIGIOUS_COMMUNITY','institutional','C',0.72,2,f'building={b}; amenity={amenity}')
            if amenity in {'townhall','police','fire_station','library','post_office'}: return ('public_infrastructure','P_PUBLIC','institutional','C',0.72,2,f'building={b}; amenity={amenity}')
            if b!='yes': return ('other_building','X_OTHER','other','C',0.60,2,f'building={b}')
            return None

          elements={}; raw_parts=[]; fetched_urls=[]; errors=[]
          for bbox in BBOXES:
            txt=','.join(f'{v:.4f}' for v in bbox); url=API+'?'+urllib.parse.urlencode({'bbox':txt}); raw=None
