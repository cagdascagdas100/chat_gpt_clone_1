name: tmp building_type_7 North Warwickshire batch 25

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_north_warwickshire_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Fetch official North Warwickshire FHRS XML to runtime cache only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="https://ratings.food.gov.uk/api/open-data-files/FHRS317en-GB.xml"
          printf '%s\n' "$SOURCE_URL" > /tmp/north_warwickshire_source_url.txt
          curl --fail --location --retry 2 --retry-delay 2 --output /tmp/north_warwickshire_fhrs.xml "$SOURCE_URL"
          test -s /tmp/north_warwickshire_fhrs.xml

      - name: Append exactly 50 new North Warwickshire proxy features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import datetime as dt
          import hashlib
          import json
          import math
          import pathlib
          import xml.etree.ElementTree as ET
          from collections import Counter

          SLOT = "building_type_7"
          CITY = "North Warwickshire"
          PREFIX = "NWAR"
          SOURCE = "Food Standards Agency FHRS daily open data - North Warwickshire"
          SOURCE_PAGE = "https://ratings.food.gov.uk/open-data"
          SOURCE_URL = pathlib.Path("/tmp/north_warwickshire_source_url.txt").read_text(encoding="utf-8").strip()
          EXPECTED_BEFORE = 1200
          EXPECTED_BATCH = 25
          EXPECTED_TARGET = 1250
          TASK_ID = "building-type-7-england-classification-v1-20260808"

          shard_path = pathlib.Path("england_map_web/data/building_type/shards/building_type_7_latest.geojson")
          manifest_path = pathlib.Path("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json")
          runner_path = pathlib.Path("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json")
          status_path = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json")
          checkpoint_path = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json")
          task_path = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json")
          xml_path = pathlib.Path("/tmp/north_warwickshire_fhrs.xml")

          shard = json.loads(shard_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))

          assert shard.get("type") == "FeatureCollection"
          features = shard.get("features") or []
          assert len(features) == EXPECTED_BEFORE, f"slot moved: shard={len(features)} expected={EXPECTED_BEFORE}"
          assert checkpoint.get("current_feature_count") == EXPECTED_BEFORE
          assert checkpoint.get("feature_count_after") == EXPECTED_BEFORE
          assert checkpoint.get("next_batch_index") == EXPECTED_BATCH
          assert checkpoint.get("next_target_feature_count") == EXPECTED_TARGET
          assert task.get("task_id") == TASK_ID
          assert task.get("slot_id") == SLOT
          assert task.get("owner") is None, f"current_task has owner={task.get('owner')}"
          assert task.get("final_ready") is False
          assert task.get("fake_data") is False

          processed = set()
          existing_points = set()
          for f in features:
              p = f.get("properties") or {}
              for value in (f.get("id"), p.get("feature_id"), p.get("parcel_id"), p.get("osm_id")):
                  if value is not None and str(value).strip():
                      processed.add(str(value).strip())
              g = f.get("geometry") or {}
              if g.get("type") == "Point":
                  coords = g.get("coordinates") or []
                  if len(coords) >= 2:
                      try:
                          lon, lat = float(coords[0]), float(coords[1])
                          if math.isfinite(lon) and math.isfinite(lat):
                              existing_points.add((round(lon, 7), round(lat, 7)))
                      except Exception:
                          pass

          raw = xml_path.read_bytes()
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def text(el, path):
              n = el.find(path)
              return (n.text or "").strip() if n is not None and n.text is not None else ""

          def classify(bt):
              x = (bt or "").casefold()
              if any(k in x for k in ("school", "college", "university")):
                  return "education", "E_EDUCATION", "institutional"
              if any(k in x for k in ("hospital", "childcare", "caring", "nursing", "residential care")):
                  return "healthcare_care", "H_CARE", "institutional"
              if any(k in x for k in ("hotel", "bed & breakfast", "bed and breakfast", "guest house")):
                  return "hospitality", "C_HOTEL", "commercial"
              if "retail" in x or "supermarket" in x or "hypermarket" in x:
                  return "commercial_retail", "C_RETAIL", "commercial"
              if any(k in x for k in ("restaurant", "cafe", "canteen", "pub", "bar", "nightclub", "takeaway", "sandwich")):
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if any(k in x for k in ("manufacturer", "packer")):
                  return "industrial", "I_INDUSTRIAL", "industrial"
              if any(k in x for k in ("distributor", "transporter", "importer", "exporter")):
                  return "warehouse", "I_WAREHOUSE", "industrial"
              if any(k in x for k in ("farmer", "grower")):
                  return "agricultural_outbuilding", "A_OUTBUILDING", "agricultural"
              return "commercial_other", "C_OTHER", "commercial"

          candidates = []
          skipped_processed = 0
          skipped_coords = 0
          skipped_existing_points = 0
          skipped_duplicate_points = 0
          seen_new_ids = set()
          seen_new_points = set()

          for el in root.findall(".//EstablishmentDetail"):
              fid = text(el, "FHRSID")
              if not fid:
                  continue
              feature_id = f"{PREFIX}_FHRS_{fid}"
              parcel_id = f"{PREFIX}_FHRSID_{fid}"
              if feature_id in processed or parcel_id in processed or fid in processed:
                  skipped_processed += 1
                  continue
              if feature_id in seen_new_ids:
                  continue
              authority = text(el, "LocalAuthorityName")
              if authority and authority.casefold() != CITY.casefold():
                  continue
              lat_s = text(el, "Geocode/Latitude") or text(el, "Latitude")
              lon_s = text(el, "Geocode/Longitude") or text(el, "Longitude")
              try:
                  lat, lon = float(lat_s), float(lon_s)
                  if not (math.isfinite(lat) and math.isfinite(lon) and -90 <= lat <= 90 and -180 <= lon <= 180):
                      raise ValueError
              except Exception:
                  skipped_coords += 1
                  continue
              pt = (round(lon, 7), round(lat, 7))
              if pt in existing_points:
                  skipped_existing_points += 1
                  continue
              if pt in seen_new_points:
                  skipped_duplicate_points += 1
                  continue
              seen_new_points.add(pt)
              seen_new_ids.add(feature_id)
              try:
                  sort_key = (0, int(fid))
              except Exception:
                  sort_key = (1, fid)
              candidates.append((sort_key, el, fid, feature_id, parcel_id, lon, lat))

          candidates.sort(key=lambda x: x[0])
          selected = candidates[:50]
          assert len(selected) == 50, f"only {len(selected)} eligible new North Warwickshire features"
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          new_features = []
          records = []
          for _, el, fid, feature_id, parcel_id, lon, lat in selected:
              business_name = text(el, "BusinessName")
              business_type = text(el, "BusinessType")
              business_type_id = text(el, "BusinessTypeID")
              labid = text(el, "LocalAuthorityBusinessID")
              authority = text(el, "LocalAuthorityName") or CITY
              postcode = text(el, "PostCode")
              rating = text(el, "RatingValue")
              rating_date = text(el, "RatingDate")
              primary, code, category = classify(business_type)
              excerpt = f"FHRSID {fid} | {business_name} | BusinessType {business_type} | LocalAuthority {authority} | PostCode {postcode}"
              excerpt_sha = hashlib.sha256(excerpt.encode("utf-8")).hexdigest()
              evidence_obj = {
                  "FHRSID": fid,
                  "BusinessName": business_name,
                  "BusinessType": business_type,
                  "BusinessTypeID": business_type_id,
                  "LocalAuthorityBusinessID": labid,
                  "LocalAuthorityName": authority,
                  "PostCode": postcode,
                  "RatingValue": rating,
                  "RatingDate": rating_date,
              }
              record = {
                  "parcel_id": parcel_id,
                  "parcel_id_semantics": "stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": None,
                  "slot_id": SLOT,
                  "region": "West Midlands",
                  "area": CITY,
                  "local_authority": authority,
                  "postcode": postcode,
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": 0.55,
                  "confidence_level_1_to_4": 2,
                  "evidence_level": "D",
                  "source_count": 1,
                  "source": SOURCE,
                  "source_url": SOURCE_URL,
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "match_method": "fhrs_business_type_premises_proxy",
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": excerpt_sha,
                  "source_evidence_excerpt": evidence_obj,
                  "sources": [{
                      "source_name": "Food Standards Agency FHRS daily open data",
                      "url_or_local_path": SOURCE_URL,
                      "accessed_at": now,
                      "sha256": source_sha,
                      "sha256_scope": "raw_source_xml",
                      "licence": "Open Government Licence v3.0 / FSA open data terms",
                      "granularity": "food_business_establishment",
                      "fields_used": ["FHRSID", "BusinessName", "BusinessType", "BusinessTypeID", "LocalAuthorityBusinessID", "LocalAuthorityName", "PostCode", "Latitude", "Longitude"],
                      "supports_field": "building_type_primary",
                      "match_method": "fhrs_business_type_premises_proxy",
                      "match_score": 0.55
                  }],
                  "geometry_match_method": "fhrs_geocode_point",
                  "address_match_method": "fhrs_business_address",
                  "limitations": "FHRS business type is a premises-use proxy and does not prove cadastral parcel identity or exact building fabric/type.",
                  "needs_manual_review": True,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": now,
                  "feature_id": feature_id,
                  "geometry": {"type": "Point", "coordinates": [lon, lat]}
              }
              records.append(record)
              props = copy.deepcopy(record)
              geom = props.pop("geometry")
              new_features.append({"type": "Feature", "id": feature_id, "geometry": geom, "properties": props})

          new_ids = [f["id"] for f in new_features]
          new_parcel_ids = [(f.get("properties") or {}).get("parcel_id") for f in new_features]
          assert len(new_ids) == len(set(new_ids)) == 50
          assert len(new_parcel_ids) == len(set(new_parcel_ids)) == 50
          assert not (set(new_ids) & processed)
          assert not (set(new_parcel_ids) & processed)

          shard["features"].extend(new_features)
          after = len(shard["features"])
          assert after == EXPECTED_TARGET and after > EXPECTED_BEFORE
          assert all((f.get("properties") or {}).get("fake_data") is False for f in new_features)
          assert all((f.get("properties") or {}).get("final_ready") is False for f in new_features)
          assert all((f.get("properties") or {}).get("evidence_excerpt") for f in new_features)
          assert all((f.get("properties") or {}).get("evidence_level") == "D" for f in new_features)
          assert all((f.get("properties") or {}).get("confidence_level_1_to_4") == 2 for f in new_features)

          shard_path.write_text(json.dumps(shard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          geojson_sha = hashlib.sha256(shard_path.read_bytes()).hexdigest()

          type_dist = Counter()
          evidence_dist = Counter()
          confidence_dist = Counter()
          unknown = 0
          for f in shard["features"]:
              p = f.get("properties") or {}
              bt = p.get("building_type_primary") or "unknown"
              ev = p.get("evidence_level") or "U"
              cl = str(p.get("confidence_level_1_to_4") or 1)
              type_dist[bt] += 1
              evidence_dist[ev] += 1
              confidence_dist[cl] += 1
              if bt == "unknown":
                  unknown += 1
          classified = after - unknown

          sources = manifest.get("sources") or []
          assert not any(s.get("url") == SOURCE_URL for s in sources), "North Warwickshire source already recorded"
          sources.append({
              "name": SOURCE,
              "url": SOURCE_URL,
              "source_page": SOURCE_PAGE,
              "features_used": 50,
              "accessed_at": now,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "note": "Premises-use proxy; not cadastral parcel geometry."
          })
          manifest.update({
              "slot_id": SLOT,
              "generated_at": now,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "type_distribution": dict(sorted(type_dist.items())),
              "confidence_level_distribution": dict(sorted(confidence_dist.items())),
              "sources": sources,
              "fake_data": False,
              "final_ready": False,
              "note": "Existing shard preserved; appended 50 North Warwickshire FHRS records outside feature.id/feature_id/parcel_id/osm_id already_processed_ids.",
              "feature_count": after,
              "geojson_sha256": geojson_sha,
              "geojson_path": str(shard_path),
              "manifest_updated_at": now,
              "feature_count_before": EXPECTED_BEFORE,
              "feature_count_after": after,
              "added_feature_count": 50,
              "last_batch_city": CITY,
              "last_batch_source": SOURCE,
              "last_batch_source_sha256": source_sha
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          runner = {
              "slot_id": SLOT,
              "task_id": TASK_ID,
              "generated_at": now,
              "feature_count_before": EXPECTED_BEFORE,
              "feature_count_after": after,
              "added_feature_count": 50,
              "city": CITY,
              "source": SOURCE,
              "source_url": SOURCE_URL,
              "source_page": SOURCE_PAGE,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "classification_method": "fhrs_business_type_premises_proxy",
              "confidence_policy": {"evidence_level": "D", "confidence_level_1_to_4": 2, "confidence_score": 0.55},
              "already_processed_id_fields": ["feature.id", "properties.feature_id", "properties.parcel_id", "properties.osm_id"],
              "candidate_count_after_filters": len(candidates),
              "skipped_processed_ids": skipped_processed,
              "skipped_missing_or_invalid_coordinates": skipped_coords,
              "skipped_existing_shard_points": skipped_existing_points,
              "skipped_duplicate_new_points": skipped_duplicate_points,
              "selected_feature_ids": new_ids,
              "records": records,
              "fake_data": False,
              "final_ready": False
          }
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          status.update({
              "state": "IN_PROGRESS",
              "updated_at": now,
              "final_ready": False,
              "classified_count": classified,
              "unknown_count": unknown,
              "total_elements": after,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "confidence_distribution": dict(sorted(confidence_dist.items())),
              "confidence_level_distribution": dict(sorted(confidence_dist.items())),
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "output_sha256": geojson_sha,
              "note": "North Warwickshire FHRS batch appended as premises-use proxy; cadastral parcel binding remains pending.",
              "fake_data": False,
              "feature_count_before": EXPECTED_BEFORE,
              "feature_count_after": after,
              "current_feature_count": after,
              "last_batch": {
                  "city": CITY,
                  "added_feature_count": 50,
                  "source": SOURCE,
                  "source_sha256": source_sha,
                  "classification_basis": "fhrs_business_type_premises_proxy",
                  "evidence_level_distribution": {"D": 50},
                  "confidence_level_distribution": {"2": 50}
              },
              "last_batch_city": CITY,
              "last_batch_added_feature_count": 50,
              "last_batch_source": SOURCE,
              "last_batch_evidence_distribution": {"D": 50},
              "last_batch_confidence_distribution": {"2": 50}
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          checkpoint.update({
              "first_unverified_step_status": "BATCH_APPENDED_50_NORTH_WARWICKSHIRE_FHRS_CONTINUATION_REQUIRED",
              "updated_at": now,
              "final_ready": False,
              "summary": {**(checkpoint.get("summary") or {}), "new_slot": False, "pipeline_stage": 1, "new_features_appended": 50, "current_feature_count": after},
              "state": "IN_PROGRESS",
              "feature_count_before": EXPECTED_BEFORE,
              "feature_count_after": after,
              "current_feature_count": after,
              "next_batch_index": EXPECTED_BATCH + 1,
              "next_target_feature_count": EXPECTED_TARGET + 50,
              "last_processed_ids_sample": new_ids[-20:],
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE_AND_PARCEL_BINDING",
              "fake_data": False,
              "last_batch": {
                  "batch_index": EXPECTED_BATCH,
                  "city": CITY,
                  "source": SOURCE,
                  "source_sha256": source_sha,
                  "added_feature_count": 50,
                  "new_feature_ids": new_ids
              }
          })
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(json.dumps({"before": EXPECTED_BEFORE, "after": after, "added": 50, "source_sha256": source_sha, "candidate_count_after_filters": len(candidates), "first_id": new_ids[0], "last_id": new_ids[-1]}, indent=2))
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          shard = json.loads(pathlib.Path("england_map_web/data/building_type/shards/building_type_7_latest.geojson").read_text())
          manifest = json.loads(pathlib.Path("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json").read_text())
          runner = json.loads(pathlib.Path("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json").read_text())
          status = json.loads(pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json").read_text())
          checkpoint = json.loads(pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json").read_text())
          task = json.loads(pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json").read_text())
          assert len(shard.get("features") or []) == 1250
          assert manifest.get("feature_count_before") == 1200 and manifest.get("feature_count_after") == 1250 and manifest.get("added_feature_count") == 50
          assert runner.get("feature_count_before") == 1200 and runner.get("feature_count_after") == 1250 and runner.get("added_feature_count") == 50
          assert checkpoint.get("current_feature_count") == 1250 and checkpoint.get("next_batch_index") == 26 and checkpoint.get("next_target_feature_count") == 1300
          assert status.get("current_feature_count") == 1250
          assert task.get("owner") is None and task.get("fake_data") is False and task.get("final_ready") is False
          ids=[]
          for f in shard["features"][-50:]:
              p=f.get("properties") or {}
              assert f.get("id") and p.get("parcel_id") and p.get("evidence_excerpt")
              assert p.get("evidence_level") == "D"
              assert p.get("confidence_level_1_to_4") == 2
              assert p.get("fake_data") is False and p.get("final_ready") is False
              ids.append(f["id"])
          assert len(ids)==len(set(ids))==50
          print("validation_ok", ids[0], ids[-1])
          PY

      - name: Commit and push slot outputs only
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_7_latest.geojson
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          )
          git add -- "${paths[@]}"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "data(building_type_7): append North Warwickshire FHRS batch 1200->1250"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706; then
              if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent slot data"
              exit 1
            fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          branch="origin/codex/aays-single-runner-v5-20260706"
          def load(path):
              return json.loads(subprocess.check_output(["git","show",f"{branch}:{path}"]))
          shard=load("england_map_web/data/building_type/shards/building_type_7_latest.geojson")
          manifest=load("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json")
          runner=load("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json")
          status=load("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json")
          checkpoint=load("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json")
          task=load("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json")
          assert len(shard.get("features") or [])==1250
          assert manifest.get("feature_count_after")==1250 and manifest.get("added_feature_count")==50 and manifest.get("last_batch_city")=="North Warwickshire"
          assert runner.get("feature_count_after")==1250 and runner.get("added_feature_count")==50 and runner.get("city")=="North Warwickshire"
          assert checkpoint.get("current_feature_count")==1250 and checkpoint.get("next_batch_index")==26 and checkpoint.get("next_target_feature_count")==1300
          assert status.get("current_feature_count")==1250 and status.get("fake_data") is False and status.get("final_ready") is False
