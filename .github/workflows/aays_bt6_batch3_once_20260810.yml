name: AAYS building_type_6 batch3 once

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/aays_bt6_batch3_once_20260810.yml

permissions:
  contents: write

concurrency:
  group: aays-building-type-6-batch3-once
  cancel-in-progress: false

jobs:
  append-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Sync canonical branch
        shell: bash
        run: |
          git fetch origin codex/aays-single-runner-v5-20260706
          git reset --hard origin/codex/aays-single-runner-v5-20260706

      - name: Append 50 verified Nottingham features
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import hashlib
          import io
          import json
          import pathlib
          import urllib.request

          SLOT = "building_type_6"
          CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"
          SHARD = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_latest.geojson")
          STATUS = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json")
          TASK = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json")
          RESULT = pathlib.Path("/tmp/aays_bt6_result.txt")
          RAW_URL = "https://gist.githubusercontent.com/SK53/c82a3319a2d03e4325434bd14fdac169/raw/9043d679e355e475d348aba181f9d629cfee08b9/bi_pubs_ex_%20osm_230123.csv"
          GIST_URL = "https://gist.github.com/SK53/c82a3319a2d03e4325434bd14fdac169"
          GIST_REV = "9043d679e355e475d348aba181f9d629cfee08b9"

          def noop(reason):
              RESULT.write_text("NOOP " + reason + "\n", encoding="utf-8")
              print("AAYS_RESULT NOOP reason=" + reason)
              raise SystemExit(0)

          try:
              data = json.loads(SHARD.read_text(encoding="utf-8"))
              status = json.loads(STATUS.read_text(encoding="utf-8"))
              task = json.loads(TASK.read_text(encoding="utf-8"))
          except Exception as exc:
              noop("canonical_read_failed:" + type(exc).__name__)

          if status.get("slot_id") != SLOT or task.get("slot_id") != SLOT:
              noop("slot_mismatch")
          if status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:
              noop("continuation_changed")
          if status.get("owner") not in (None, "") or task.get("owner") not in (None, ""):
              noop("live_owner_present")
          if status.get("final_ready") is True or task.get("final_ready") is True:
              noop("final_ready_already_set")

          features = data.get("features")
          if not isinstance(features, list):
              noop("features_not_list")
          before = len(features)
          if before != 100:
              noop(f"feature_count_moved:{before}")

          processed = set()
          for feature in features:
              fid = feature.get("id")
              if fid not in (None, ""):
                  processed.add(str(fid))
              props = feature.get("properties") or {}
              for key in ("parcel_id", "osm_id"):
                  value = props.get(key)
                  if value not in (None, ""):
                      processed.add(str(value))

          req = urllib.request.Request(RAW_URL, headers={"User-Agent": "AAYS-building-type-6/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read()
          except Exception as exc:
              noop("source_download_failed:" + type(exc).__name__)

          source_sha256 = hashlib.sha256(raw).hexdigest()
          text = raw.decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text))
          candidates = []
          for row in reader:
              try:
                  osm_id = int((row.get("osm_id") or "").strip())
                  lat = float((row.get("lat") or "").strip())
                  lon = float((row.get("lon") or "").strip())
              except Exception:
                  continue
              amenity = (row.get("amenity") or "").strip().lower()
              city = (row.get("addr:city") or "").strip()
              if (row.get("osm_type") or "").strip() != "node":
                  continue
              if amenity not in {"pub", "bar"}:
                  continue
              if city.casefold() != "nottingham":
                  continue
              if not (52.85 <= lat <= 53.05 and -1.35 <= lon <= -1.00):
                  continue
              fid = f"ENG_OSM_node_{osm_id}"
              if fid in processed or str(osm_id) in processed:
                  continue
              candidates.append((osm_id, lat, lon, amenity, row))

          candidates.sort(key=lambda item: item[0])
          selected = candidates[:50]
          if len(selected) < 50:
              noop(f"insufficient_unique_candidates:{len(selected)}")

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          accessed_at = now[:10]
          added = []
          for osm_id, lat, lon, amenity, row in selected:
              fid = f"ENG_OSM_node_{osm_id}"
              excerpt = {
                  "osm_id": str(osm_id),
                  "osm_type": "node",
                  "lat": (row.get("lat") or "").strip(),
                  "lon": (row.get("lon") or "").strip(),
                  "amenity": amenity,
                  "name": (row.get("name") or "").strip(),
                  "fhrs:id": (row.get("fhrs:id") or "").strip(),
                  "building": (row.get("building") or "").strip(),
                  "real_ale": (row.get("real_ale") or "").strip(),
                  "addr:city": (row.get("addr:city") or "").strip(),
              }
              tags = {k: v for k, v in excerpt.items() if k not in {"osm_id", "osm_type", "lat", "lon"} and v != ""}
              feature = {
                  "type": "Feature",
                  "id": fid,
                  "geometry": {"type": "Point", "coordinates": [lon, lat]},
                  "properties": {
                      "parcel_id": fid,
                      "osm_id": osm_id,
                      "slot_id": SLOT,
                      "region": "East Midlands",
                      "area": "Nottingham",
                      "building_type_primary": "commercial_retail",
                      "building_type_code": "C_RETAIL",
                      "building_category": "commercial",
                      "evidence_level": "B",
                      "confidence_score": 0.75,
                      "confidence_level_1_to_4": 3,
                      "source_count": 1,
                      "match_method": f"amenity={amenity}",
                      "source": "OSM-derived pubs snapshot (GitHub Gist; sourced from OpenStreetMap)",
                      "source_url": f"https://www.openstreetmap.org/node/{osm_id}",
                      "osm_tags_summary": tags,
                      "evidence_excerpt": excerpt,
                      "source_evidence_excerpt": excerpt,
                      "fake_data": False,
                      "final_ready": False,
                      "needs_manual_review": True,
                      "updated_at": now,
                      "sources": [{
                          "source_name": "OSM-derived pubs snapshot (SK53 GitHub Gist)",
                          "url": GIST_URL,
                          "raw_url": RAW_URL,
                          "accessed_at": accessed_at,
                          "snapshot_date": "2023-01-23",
                          "source_revision": GIST_REV,
                          "source_sha256": source_sha256,
                          "licence": "ODbL 1.0",
                          "granularity": "osm_node_point",
                          "fields_used": ["osm_id", "osm_type", "lat", "lon", "amenity", "name", "fhrs:id", "building", "real_ale", "addr:city"],
                          "supports_field": "building_type_primary",
                          "match_method": f"addr:city=Nottingham;amenity={amenity};bbox=East_Midlands_Nottingham",
                          "match_score": 0.75
                      }],
                      "building_type_secondary": "",
                      "geometry_match_method": "osm_node_point",
                      "address_match_method": "addr_city_exact",
                      "limitations": "Classification uses an explicit pub/bar amenity tag from a reproducible 2023-01-23 OSM-derived snapshot; live OSM/Overpass recheck remains pending.",
                      "evidence_summary": {"osm_snapshot": True, "current_overpass_recheck": False, "total_sources": 1}
                  }
              }
              added.append(feature)
              processed.add(fid)
              processed.add(str(osm_id))

          data["features"].extend(added)
          after = len(data["features"])
          if after <= before or after - before < 50:
              noop(f"growth_assertion_failed:{before}->{after}")

          all_ids = set()
          for feature in data["features"]:
              props = feature.get("properties") or {}
              values = [feature.get("id"), props.get("parcel_id"), props.get("osm_id")]
              for value in values:
                  if value in (None, ""):
                      continue
                  key = str(value)
                  if key.startswith("ENG_OSM_node_"):
                      normalized = key[len("ENG_OSM_node_"):]
                  else:
                      normalized = key
                  if normalized in all_ids:
                      # Same feature contributes id/parcel/osm aliases; only flag cross-feature duplicates below.
                      continue
                  all_ids.add(normalized)
          feature_norm_ids = []
          for feature in data["features"]:
              fid = str(feature.get("id") or "")
              if fid.startswith("ENG_OSM_node_"):
                  feature_norm_ids.append(fid[len("ENG_OSM_node_"):])
              else:
                  feature_norm_ids.append(fid)
          if len(feature_norm_ids) != len(set(feature_norm_ids)):
              noop("duplicate_feature_id_after_append")

          history = data.get("batch_history")
          if not isinstance(history, list):
              history = []
          history.append({
              "batch_index": 3,
              "city": "Nottingham",
              "feature_count_before": before,
              "feature_count_after": after,
              "new_feature_count": len(added),
              "first_new_feature_id": added[0]["id"],
              "last_new_feature_id": added[-1]["id"],
              "source_name": "OSM-derived pubs snapshot (SK53 GitHub Gist)",
              "source_revision": GIST_REV,
              "source_sha256": source_sha256,
              "snapshot_date": "2023-01-23",
              "accessed_at": accessed_at,
              "fake_data": False,
              "final_ready": False
          })
          data["batch_history"] = history
          data["enhanced_at"] = now

          serialized = json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n"
          SHARD.write_text(serialized, encoding="utf-8")
          shard_sha256 = hashlib.sha256(serialized.encode("utf-8")).hexdigest()
          result = (
              f"SUCCESS feature_count_before={before} feature_count_after={after} added={len(added)} "
              f"first_id={added[0]['id']} last_id={added[-1]['id']} "
              f"source_sha256={source_sha256} shard_sha256={shard_sha256}"
          )
          RESULT.write_text(result + "\n", encoding="utf-8")
          print("AAYS_RESULT " + result)
          PY

      - name: Commit shard and remove one-shot workflow
        shell: bash
        run: |
          RESULT="$(cat /tmp/aays_bt6_result.txt 2>/dev/null || echo 'NOOP missing_result')"
          rm -f .github/workflows/aays_bt6_batch3_once_20260810.yml
          git add england_map_web/data/building_type/shards/building_type_6_latest.geojson .github/workflows/aays_bt6_batch3_once_20260810.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No repository changes; result=$RESULT"
            exit 1
          fi
          if [[ "$RESULT" == SUCCESS* ]]; then
            git commit -m "building_type_6 append Nottingham OSM snapshot batch"
          else
            git commit -m "chore: cleanup building_type_6 one-shot workflow"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              echo "AAYS_PUSH_RESULT $RESULT"
              if [[ "$RESULT" == SUCCESS* ]]; then exit 0; else exit 2; fi
            fi
            git pull --rebase origin codex/aays-single-runner-v5-20260706
          done
          exit 1
