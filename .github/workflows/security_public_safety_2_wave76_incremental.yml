name: security-public-safety-2-wave76-incremental

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave76_incremental.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-8ffc9b537d79f7ae2f8c1c60b6945e2b8cbe9d92cf531d3e5c5527d8f4b4960e
  cancel-in-progress: false

jobs:
  guarded-generate-accept-publish-terminalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Claim exact next scope
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave76_orchestrator.py claim

      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Generate official-source rows and publish accepted output
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave76_orchestrator.py run

      - name: Verify remote hashes and terminalize
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave76_orchestrator.py terminalize

      - name: Park failed continuation without duplicate retry
        if: ${{ failure() }}
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave76_orchestrator.py park
