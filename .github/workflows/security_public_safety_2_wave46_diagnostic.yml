name: security-public-safety-2-wave46-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave46_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/aays-single-runner-v5-20260706
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture wave46 status
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          command = ['gh','run','list','--workflow','security_public_safety_2_wave46_incremental.yml','--limit','5','--json','databaseId,status,conclusion,createdAt,startedAt,updatedAt,event,headSha,workflowName,url,attempt']
          completed = subprocess.run(command, text=True, capture_output=True)
          payload = {
            'schema_version': 1,
            'slot_id': 'security_public_safety_2',
            'task_id': 'security_public_safety_2_priority_2620row_incremental_evidence_expansion_20260730',
            'continuation_key': '782cce1b0b9da6131c5d7179996badd7be23eee2322bf036ab9ee541dba713ef',
            'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'returncode': completed.returncode,
            'stderr': completed.stderr,
            'runs': json.loads(completed.stdout or '[]') if completed.returncode == 0 else []
          }
          path = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave46_actions_diagnostic_20260730.json')
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave46_actions_diagnostic_20260730.json
          git commit -m 'capture security_public_safety_2 wave46 actions status'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
