name: AAYS FG3 broader polygon designation scan 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan planning local plan layer names and polygon metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_broad_scan
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request, hashlib, datetime, time
          out=Path('/tmp/fg3_broad_scan')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          terms=[
            'growth','regeneration','opportunity','intensif','strategic development',
            'development area','development zone','housing zone','site allocation',
            'allocated site','allocation','area of change','area for change','renewal',
            'transformation','key site','strategic site','development site','masterplan',
            'major development','urban extension','development corridor','priority area'
          ]
          rows=[]; errors=[]
          for si in range(0,34):
            root=f'https://services.arcgis.com/drifeOPKLpgnJ8Qa/arcgis/rest/services/planning_local_plan_data_{si:02d}/FeatureServer'
            try:
              req=urllib.request.Request(root+'?f=pjson',headers={'User-Agent':'TerraYield-AAYS-FG3-broad-layer-scan/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                raw=r.read(); status=getattr(r,'status',None)
              svc=json.loads(raw.decode('utf-8'))
            except Exception as e:
              errors.append({'service_index':si,'stage':'service','error':str(e)})
              continue
            for layer in svc.get('layers') or []:
              lid=layer.get('id'); name=str(layer.get('name') or '')
              lname=name.lower()
              matched=[t for t in terms if t in lname]
              if not matched: continue
              meta_url=f'{root}/{lid}?f=pjson'
              try:
                req=urllib.request.Request(meta_url,headers={'User-Agent':'TerraYield-AAYS-FG3-broad-layer-scan/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=60) as r:
                  mraw=r.read(); mstatus=getattr(r,'status',None); final=r.geturl()
                meta=json.loads(mraw.decode('utf-8'))
                rows.append({
                  'service_index':si,'layer_id':lid,'layer_name':name,'matched_terms':matched,
                  'service_url':root,'layer_url':f'{root}/{lid}','http_status':mstatus,
                  'final_url':final,'geometryType':meta.get('geometryType'),
                  'description':meta.get('description'),'copyrightText':meta.get('copyrightText'),
                  'serviceItemId':meta.get('serviceItemId'),
                  'layer_meta_sha256':hashlib.sha256(mraw).hexdigest()
                })
              except Exception as e:
                errors.append({'service_index':si,'layer_id':lid,'layer_name':name,'stage':'layer','error':str(e)})
          result={'schema':'fg3_broad_polygon_designation_scan_v1','observed_at_utc':observed,'terms':terms,'hit_count':len(rows),'polygon_hit_count':sum(1 for r in rows if r.get('geometryType')=='esriGeometryPolygon'),'rows':rows,'errors':errors}
          (out/'broad_polygon_designation_scan.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'hit_count':result['hit_count'],'polygon_hit_count':result['polygon_hit_count'],'errors':len(errors),'polygon_rows':[r for r in rows if r.get('geometryType')=='esriGeometryPolygon']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-broad-polygon-designation-scan-20260912
          path: /tmp/fg3_broad_scan
          if-no-files-found: error
          retention-days: 3
