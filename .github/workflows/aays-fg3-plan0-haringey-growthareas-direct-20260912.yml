name: AAYS FG3 Sutton adopted Local Plan status 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Install PDF parser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Materialize Sutton adopted Local Plan status evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_sutton_status
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, datetime, json, re, subprocess
          out=Path('/tmp/fg3_sutton_status')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          url='https://www.sutton.gov.uk/documents/20124/864129/1.%2BSutton%2BLocal%2BPlan%2B%28Adopted%2B2018%29.pdf/57903d66-57ad-bf28-857d-8c8e779fc3ce?t=1678268850847'
          req=urllib.request.Request(url,headers={
              'User-Agent':'Mozilla/5.0 (compatible; TerraYield-AAYS-Plan0-future_growth_3/1.0)',
              'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Referer':'https://www.sutton.gov.uk/'
          })
          with urllib.request.urlopen(req,timeout=240) as r:
              raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
          assert raw, 'adopted Local Plan empty'
          pdf=out/'adopted_local_plan.pdf'; pdf.write_bytes(raw)
          txt_path=out/'adopted_local_plan_layout.txt'
          subprocess.run(['pdftotext','-layout',str(pdf),str(txt_path)],check=True)
          txt=txt_path.read_text(encoding='utf-8',errors='ignore')
          norm=' '.join(txt.split())
          assert re.search(r'POLICY\s+7\s*:\s*Housing\s+Density',norm,re.I), 'Policy 7 Housing Density not found'
          assert re.search(r'Area[s]?\s+of\s+Potential\s+Intensification',norm,re.I), 'Areas of Potential Intensification not found'
          exact_date=bool(re.search(r'26\s+February\s+2018',norm,re.I))
          adopted_terms=bool(re.search(r'Adopted\s+2018|Sutton\s+Local\s+Plan\s+2016-2031.*Adopted',norm,re.I)) or 'Adopted%2B2018' in url
          assert adopted_terms, 'adopted status not supported by official PDF/title URL'
          result={
            'schema':'fg3_sutton_policy7_status_evidence_v3','slot_id':'future_growth_3','observed_at_utc':observed,
            'source':{'url':url,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'path':pdf.name},
            'growth_status':'Adopted','growth_status_date':'2018-02-26' if exact_date else None,
            'growth_type':'Areas of Potential Intensification','raw_arcgis_status':None,'source_policy':'Policy 7',
            'exact_adoption_date_found_in_pdf_text':exact_date,
            'selector':'ArcGIS extrainfo1=Policy 7; official Sutton Local Plan adopted-2018 PDF contains Policy 7 Housing Density and Areas of Potential Intensification; exact 26 February 2018 date used only if present in physical PDF text',
            'denominator':1,'parser_method':'poppler pdftotext -layout + normalized policy/designation/adoption assertions',
            'previous_access_failures':['Council Local Plan HTML page HTTP 403','indexed Authority Monitoring Report direct endpoint HTTP 404'],
            'license':'Public statutory planning material; no reuse licence asserted for council PDF'
          }
          (out/'sutton_policy7_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-sutton-adopted-local-plan-status-20260912
          path: /tmp/fg3_sutton_status
          if-no-files-found: error
          retention-days: 3
