name: AAYS FG3 Waltham Forest INB6 status evidence 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Install PDF parser
        run: python -m pip install --quiet pypdf
      - name: Materialize Waltham Forest policy lifecycle evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_waf_status
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, datetime, json, re
          from pypdf import PdfReader
          out=Path('/tmp/fg3_waf_status')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          sources={
            'current_local_plan_page':'https://www.walthamforest.gov.uk/planning-and-building-control/planning-policy/local-plan-part-1-shaping-borough-2020-2035/local-plan-part-1',
            'core_strategy':'https://www.walthamforest.gov.uk/sites/default/files/2021-11/adopted-core-strategy.pdf'
          }
          meta={}
          for key,url in sources.items():
              req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-waf-status/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=240) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              assert raw
              ext='.pdf' if key=='core_strategy' or 'pdf' in (ctype or '').lower() else '.html'
              p=out/(key+ext); p.write_bytes(raw)
              meta[key]={'url':url,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'path':p.name}
          html=(out/'current_local_plan_page.html').read_text(encoding='utf-8',errors='ignore')
          hnorm=' '.join(re.sub('<[^>]+>',' ',html).split())
          assert re.search(r'adopted\s+on\s+29\s+February\s+2024',hnorm,re.I), 'current plan adoption text not found'
          reader=PdfReader(str(out/'core_strategy.pdf'))
          matches=[]
          for i,page in enumerate(reader.pages):
              txt=' '.join((page.extract_text() or '').split())
              if re.search(r'INB6',txt,re.I) and re.search(r'Lee\s+Valley\s+Regeneration\s+Corridor',txt,re.I):
                  j=re.search(r'.{0,900}INB6.{0,1500}',txt,re.I)
                  snippet=j.group(0) if j else txt[:2400]
                  matches.append({'page':i+1,'snippet':snippet})
          assert matches, 'INB6 Lee Valley table row not found'
          joined=' '.join(x['snippet'] for x in matches)
          assert re.search(r'Policies?\s+superseded|superseded', joined, re.I), 'superseded context not found'
          assert re.search(r'CS1',joined,re.I) and re.search(r'CS8',joined,re.I), 'replacement policies CS1/CS8 not found'
          result={
            'schema':'fg3_waf_inb6_status_evidence_v1','slot_id':'future_growth_3','observed_at_utc':observed,
            'sources':meta,'growth_status':'Superseded','growth_status_date':None,
            'growth_type':'Lee Valley Regeneration Corridor','raw_arcgis_status':None,'source_policy':'INB6',
            'current_local_plan_adoption_date':'2024-02-29',
            'selector':'ArcGIS extrainfo1=Policy INB6; official Waltham Forest Core Strategy supersession table identifies POLICY INB6 Lee Valley Regeneration Corridor/Mixed Use Regeneration Areas as superseded and replaced by CS1/CS8',
            'denominator':2,'core_strategy_page_count':len(reader.pages),'inb6_match_pages':[x['page'] for x in matches],
            'inb6_snippets':[x['snippet'] for x in matches[:3]],'parser_method':'pypdf PdfReader extract_text',
            'license':'Public statutory planning material; no reuse licence asserted for council page/PDF'
          }
          (out/'waf_inb6_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-waf-inb6-status-evidence-20260912
          path: /tmp/fg3_waf_status
          if-no-files-found: error
          retention-days: 3
