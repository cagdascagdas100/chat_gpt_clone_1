name: AAYS FG3 Islington status evidence 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Materialize Islington Local Plan status evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_islington_status
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, datetime, json, re
          out=Path('/tmp/fg3_islington_status')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          sources={
            'local_plan_page':'https://www.islington.gov.uk/planning/planning-policy/islington-local-plan.',
            'adoption_notice':'https://www.islington.gov.uk/-/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/islington-local-plan-adoption-notice-28-september-2023.pdf?hash=9E4B3D585021A856303D83ED03D494370A92F82B&la=en'
          }
          meta={}
          for key,url in sources.items():
              req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-islington-status/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              assert len(raw)>0
              ext='.pdf' if 'pdf' in (ctype or '').lower() or key=='adoption_notice' else '.html'
              p=out/(key+ext); p.write_bytes(raw)
              meta[key]={'url':url,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'path':p.name}
          html=(out/'local_plan_page.html').read_text(encoding='utf-8',errors='ignore')
          norm=' '.join(re.sub('<[^>]+>',' ',html).split())
          assert re.search(r'adopted\s+on\s+28\s+September\s+2023',norm,re.I)
          result={
            'schema':'fg3_islington_status_evidence_v1','slot_id':'future_growth_3','observed_at_utc':observed,
            'sources':meta,
            'growth_status':'Adopted',
            'growth_status_date':'2023-09-28',
            'growth_type':'City Fringe Opportunity Area',
            'raw_arcgis_status':None,
            'selector':'official Islington Local Plan page states adopted on 28 September 2023; adoption notice is the statutory adoption statement; ArcGIS designation is City Fringe Opportunity Area',
            'denominator':2,
            'license':'Public statutory planning material; no reuse licence asserted for council page/PDF'
          }
          (out/'islington_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-islington-status-evidence-20260912
          path: /tmp/fg3_islington_status
          if-no-files-found: error
          retention-days: 3
