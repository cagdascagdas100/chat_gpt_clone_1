name: AAYS FG3 Richmond status evidence 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Install PDF parser
        run: python -m pip install --quiet pypdf
      - name: Materialize Richmond current Local Plan and River Crane designation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_richmond_status
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, datetime, json, re
          from pypdf import PdfReader
          out=Path('/tmp/fg3_richmond_status')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          sources={
            'local_plan_page':'https://www.richmond.gov.uk/adopted_local_plan',
            'adoption_statement':'https://www.richmond.gov.uk/media/bs3ljoij/local_plan_adoption_statement_2025.pdf',
            'adopted_plan':'https://www2.richmond.gov.uk/docs/localplan/local_plan_interim_track_changes_for_adoption_october_2025.pdf'
          }
          meta={}
          for key,url in sources.items():
              req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-richmond-status/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=240) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              assert len(raw)>0
              ext='.pdf' if 'pdf' in (ctype or '').lower() or key in ('adoption_statement','adopted_plan') else '.html'
              p=out/(key+ext); p.write_bytes(raw)
              meta[key]={'url':url,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'path':p.name}
          html=(out/'local_plan_page.html').read_text(encoding='utf-8',errors='ignore')
          norm=' '.join(re.sub('<[^>]+>',' ',html).split())
          assert re.search(r'adopted\s+on\s+7\s+October\s+2025',norm,re.I)
          ar=PdfReader(str(out/'adoption_statement.pdf'))
          adoption_text=' '.join((page.extract_text() or '') for page in ar.pages)
          adoption_norm=' '.join(adoption_text.split())
          assert re.search(r'Local\s+Plan\s+was\s+adopted\s+on\s+7\s+October\s+2025',adoption_norm,re.I)
          pr=PdfReader(str(out/'adopted_plan.pdf'))
          matched_pages=[]
          snippets=[]
          for i,page in enumerate(pr.pages):
              txt=' '.join((page.extract_text() or '').split())
              if re.search(r'River\s+Crane\s+Area\s+of\s+Opportunity',txt,re.I):
                  matched_pages.append(i+1)
                  m=re.search(r'.{0,220}River\s+Crane\s+Area\s+of\s+Opportunity.{0,320}',txt,re.I)
                  snippets.append(m.group(0) if m else 'River Crane Area of Opportunity')
          assert matched_pages, 'current adopted plan does not contain River Crane Area of Opportunity phrase'
          result={
            'schema':'fg3_richmond_status_evidence_v1','slot_id':'future_growth_3','observed_at_utc':observed,
            'sources':meta,'growth_status':'Adopted','growth_status_date':'2025-10-07',
            'growth_type':'River Crane Area of Opportunity','raw_arcgis_status':None,
            'selector':'official Richmond adopted Local Plan page and Adoption Statement state adoption on 7 October 2025; current adopted plan contains River Crane Area of Opportunity',
            'denominator':3,'adoption_statement_page_count':len(ar.pages),'adopted_plan_page_count':len(pr.pages),
            'river_crane_match_pages':matched_pages,'river_crane_snippets':snippets[:5],
            'parser_method':'pypdf PdfReader extract_text',
            'license':'Public statutory planning material; no reuse licence asserted for council page/PDFs'
          }
          (out/'richmond_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-richmond-status-evidence-20260912
          path: /tmp/fg3_richmond_status
          if-no-files-found: error
          retention-days: 3
