name: AAYS FG3 Hammersmith Fulham guarded status evidence 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Install PDF dependency
        run: python -m pip install --quiet pypdf
      - name: Materialize guarded Hammersmith Fulham adoption evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_hf_status
          url='https://www.lbhf.gov.uk/sites/default/files/section_attachments/adoption_statement_local_plan_1.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'TerraYield-AAYS-Plan0-future_growth_3-hf-status/2.0' "$url" -o /tmp/fg3_hf_status/adoption_statement_local_plan_2018.pdf
          test -s /tmp/fg3_hf_status/adoption_statement_local_plan_2018.pdf
          python - <<'PY'
          from pathlib import Path
          import hashlib, datetime, json, re, subprocess
          from pypdf import PdfReader
          out=Path('/tmp/fg3_hf_status')
          p=out/'adoption_statement_local_plan_2018.pdf'
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          raw=p.read_bytes()
          reader=PdfReader(str(p))
          text='\n'.join((pg.extract_text() or '') for pg in reader.pages)
          (out/'adoption_statement_extracted.txt').write_text(text,encoding='utf-8')
          norm=' '.join(text.split())
          patterns=['adopted the Hammersmith and Fulham Local Plan on 28th February 2018','replaces the Core Strategy (2011)','Core Strategy (2011)']
          snippets=[]
          for pat in patterns:
              m=re.search(r'.{0,220}'+re.escape(pat)+r'.{0,320}',norm,re.I)
              if m: snippets.append({'pattern':pat,'snippet':m.group(0)})
          result={
            'schema':'fg3_hf_status_evidence_v2',
            'slot_id':'future_growth_3',
            'observed_at_utc':observed,
            'source':{
              'url':'https://www.lbhf.gov.uk/sites/default/files/section_attachments/adoption_statement_local_plan_1.pdf',
              'http_status':200,
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'page_count':len(reader.pages),
              'license':'Public statutory planning document; no reuse licence asserted'
            },
            'matched_snippets':snippets,
            'growth_status':'Official layer; source Core Strategy 2011 superseded by H&F Local Plan 2018',
            'current_local_plan_adopted_date':'2018-02-28',
            'source_plan_indicator':'ArcGIS feature source URL contains core_strategy_adopted_oct_2011',
            'selector':'official H&F Local Plan 2018 adoption statement confirms adoption and replacement of Core Strategy 2011; ArcGIS feature source URL identifies adopted Oct 2011 source document',
            'denominator':len(reader.pages)
          }
          assert len(raw)>0 and len(reader.pages)>0
          assert any('28th February 2018' in x['snippet'] for x in snippets)
          assert any('replaces the Core Strategy (2011)' in x['snippet'] for x in snippets)
          (out/'hf_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-hf-status-evidence-guarded-20260912
          path: /tmp/fg3_hf_status
          if-no-files-found: error
          retention-days: 3
