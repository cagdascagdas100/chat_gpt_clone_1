name: AAYS FG3 unused growth opportunity layer scan 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Scan Planning Local Plan Data services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_scan
          python - <<'PY'
          from pathlib import Path
          import urllib.request, json, datetime, re, hashlib
          out=Path('/tmp/fg3_scan')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          used={(2,23),(4,13),(5,30),(7,13),(8,18),(14,18)}
          # 7/13 is Camden Local Plan Growth Area; retained as used source family window.
          hits=[]; errors=[]
          for svc in range(1,34):
              base=f'https://services.arcgis.com/drifeOPKLpgnJ8Qa/arcgis/rest/services/planning_local_plan_data_{svc:02d}/FeatureServer'
              url=base+'?f=pjson'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-layer-scan/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read(); status=getattr(r,'status',None); final=r.geturl()
                  meta=json.loads(raw.decode('utf-8'))
                  for lyr in meta.get('layers') or []:
                      lid=lyr.get('id'); name=str(lyr.get('name') or '')
                      if re.search(r'growth|opportunit|intensification|regeneration',name,re.I):
                          hits.append({'service_index':svc,'layer_id':lid,'layer_name':name,'used':(svc,lid) in used,'service_url':base,'http_status':status,'service_meta_sha256':hashlib.sha256(raw).hexdigest()})
              except Exception as e:
                  errors.append({'service_index':svc,'error':repr(e)})
          result={'schema':'fg3_unused_layer_scan_v1','slot_id':'future_growth_3','observed_at_utc':observed,'service_range':'01-33','used_pairs':sorted([list(x) for x in used]),'hits':hits,'unused_hits':[h for h in hits if not h['used']],'errors':errors}
          (out/'unused_growth_opportunity_layer_scan.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'hit_count':len(hits),'unused_hit_count':len(result['unused_hits']),'unused_hits':result['unused_hits'],'errors':errors},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-unused-growth-opportunity-layer-scan-20260912
          path: /tmp/fg3_scan
          if-no-files-found: error
          retention-days: 3
