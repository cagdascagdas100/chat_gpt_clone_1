name: AAYS FG3 Sutton Policy 7 status evidence 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Install PDF parser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Materialize Sutton Policy 7 adopted status evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_sutton_status
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, datetime, json, re, subprocess
          out=Path('/tmp/fg3_sutton_status')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          sources={
            'local_plan_page':'https://www.sutton.gov.uk/planning-and-building/planning/planning-policy/local-plan',
            'adopted_local_plan':'https://www.sutton.gov.uk/documents/20124/864129/1.%2BSutton%2BLocal%2BPlan%2B%28Adopted%2B2018%29.pdf/57903d66-57ad-bf28-857d-8c8e779fc3ce?t=1678268850847'
          }
          meta={}
          for key,url in sources.items():
              req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-sutton-status/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=240) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              assert raw, f'{key} empty'
              ext='.pdf' if key=='adopted_local_plan' or 'pdf' in (ctype or '').lower() else '.html'
              p=out/(key+ext); p.write_bytes(raw)
              meta[key]={'url':url,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'path':p.name}
          html=(out/'local_plan_page.html').read_text(encoding='utf-8',errors='ignore')
          hnorm=' '.join(re.sub('<[^>]+>',' ',html).split())
          adoption_patterns=[r'adopted\s+by\s+the\s+Council.*26\s+February\s+2018',r'adopted.*26\s+February\s+2018']
          assert any(re.search(p,hnorm,re.I) for p in adoption_patterns), 'Sutton Local Plan adoption date not found on official page'
          txt_path=out/'adopted_local_plan_layout.txt'
          subprocess.run(['pdftotext','-layout',str(out/'adopted_local_plan.pdf'),str(txt_path)],check=True)
          txt=txt_path.read_text(encoding='utf-8',errors='ignore')
          norm=' '.join(txt.split())
          assert re.search(r'POLICY\s+7\s*:\s*Housing\s+Density',norm,re.I), 'Policy 7 Housing Density not found'
          assert re.search(r'Area[s]?\s+of\s+Potential\s+Intensification',norm,re.I), 'Areas of Potential Intensification not found'
          assert re.search(r'Sutton\s+Town\s+Centre\s+Area\s+of\s+Potential\s+Intensification',norm,re.I), 'Sutton Town Centre API text not found'
          result={
            'schema':'fg3_sutton_policy7_status_evidence_v1','slot_id':'future_growth_3','observed_at_utc':observed,
            'sources':meta,'growth_status':'Adopted','growth_status_date':'2018-02-26',
            'growth_type':'Areas of Potential Intensification','raw_arcgis_status':None,'source_policy':'Policy 7',
            'selector':'ArcGIS extrainfo1=Policy 7; official Sutton Local Plan page states Sutton Local Plan 2016-31 was adopted by Council on 26 February 2018; adopted Local Plan PDF contains Policy 7 Housing Density and Areas of Potential Intensification',
            'denominator':2,'parser_method':'poppler pdftotext -layout + normalized exact policy/designation assertions',
            'license':'Public statutory planning material; no reuse licence asserted for council page/PDF'
          }
          (out/'sutton_policy7_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-sutton-policy7-status-evidence-20260912
          path: /tmp/fg3_sutton_status
          if-no-files-found: error
          retention-days: 3
