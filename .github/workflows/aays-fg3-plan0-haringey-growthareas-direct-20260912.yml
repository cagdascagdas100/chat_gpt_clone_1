name: AAYS FG3 Lewisham adoption evidence 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-plan0-haringey-growthareas-direct-20260912.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Install PDF dependency
        run: python -m pip install --quiet pypdf
      - name: Materialize Lewisham Local Plan adoption evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_lewisham_status
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, datetime, json, re
          from pypdf import PdfReader
          out=Path('/tmp/fg3_lewisham_status')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          urls={
            'page':'https://lewisham.gov.uk/ldf',
            'adoption_pdf':'https://lewisham.gov.uk/-/media/services/planning/planning-policy/local-plan/local-plan-2020-2040/appendix-f-lewisham-local-plan-adoption-statement-july-2025.pdf'
          }
          meta={}
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-lewisham-status/1.0','Accept':'text/html,application/pdf,*/*'})
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              ext='.pdf' if key.endswith('pdf') else '.html'
              p=out/(key+ext); p.write_bytes(raw)
              meta[key]={'url':url,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'path':p.name}
          page_text=(out/'page.html').read_text(encoding='utf-8',errors='ignore')
          reader=PdfReader(str(out/'adoption_pdf.pdf'))
          pdf_text='\n'.join((pg.extract_text() or '') for pg in reader.pages)
          (out/'adoption_statement_extracted.txt').write_text(pdf_text,encoding='utf-8')
          norm=' '.join((page_text+' '+pdf_text).split())
          snippets=[]
          for pat in ['16 July 2025','adopted its new Local Plan','Lewisham Local Plan 2020 - 2040','Growth']:
              m=re.search(r'.{0,180}'+re.escape(pat)+r'.{0,240}',norm,re.I)
              if m: snippets.append({'pattern':pat,'snippet':m.group(0)})
          result={'schema':'fg3_lewisham_status_evidence_v1','slot_id':'future_growth_3','observed_at_utc':observed,'sources':meta,'pdf_page_count':len(reader.pages),'matched_snippets':snippets,'selector':'official Lewisham adopted local plan page/adoption statement; extract adoption wording/date','denominator':len(reader.pages)}
          (out/'lewisham_status_evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-lewisham-adoption-evidence-20260912
          path: /tmp/fg3_lewisham_status
          if-no-files-found: error
          retention-days: 3
