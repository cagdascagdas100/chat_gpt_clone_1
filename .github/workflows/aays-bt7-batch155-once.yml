          ev=collections.Counter(); td=collections.Counter(); cd=collections.Counter(); classified=0; unknown=0; processed_after=set()
          for f in features:
              p=f.get('properties',{})
              ev[str(p.get('evidence_level','U'))]+=1; td[str(p.get('building_type_primary','unknown'))]+=1; cd[str(p.get('confidence_level_1_to_4',1))]+=1
              if p.get('building_type_primary')=='unknown': unknown+=1
              else: classified+=1
              for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')):
                  if v is not None and str(v): processed_after.add(str(v))
          manifest.update({'generated_at':now,'total_features':after,'classified':classified,'unknown':unknown,'evidence_distribution':dict(ev),'type_distribution':dict(td),'confidence_level_distribution':dict(cd),'final_ready':False,'fake_data':False})
          manifest.setdefault('sources',[]).append({'name':'OpenStreetMap Overpass API - Kenilworth_NorthEast_B','url':endpoint_used,'license':'ODbL 1.0','features_used':added,'accessed_at':now,'source_sha256':source_sha,'source_hash_method':'sha256_raw_overpass_response','note':'OSM building footprint/use tag; building proxy, not cadastral parcel.'})
          report={'slot_id':SLOT,'task_id':TASK,'continuation_key':continuation,'generated_at':now,'batch_index':BATCH,'city':CITY,'local_authority':'Warwickshire','region':'West Midlands','grid_id':GRID,'bbox_wgs84':BBOX,'feature_count_before':before,'attempted_parcels':TARGET,'candidate_count_after_dedupe':len(candidates),'feature_count_after':after,'new_feature_count':added,'target_new_feature_count':TARGET,'no_evidence_this_batch':no_evidence,'source_name':'OpenStreetMap Overpass API','source_url':endpoint_used,'source_sha256':source_sha,'source_hash_method':'sha256_raw_overpass_response','raw_source_committed':False,'fake_data':False,'final_ready':False,'evidence_distribution_new':dict(collections.Counter(r['evidence_level'] for r in new_records)),'confidence_distribution_new':dict(collections.Counter(str(r['confidence_level_1_to_4']) for r in new_records)),'type_distribution_new':dict(collections.Counter(r['building_type_primary'] for r in new_records)),'records':new_records}
          batch_summary={'batch_index':BATCH,'batch_name':CITY,'city':CITY,'grid_bbox':','.join(str(x) for x in BBOX),'source':'OpenStreetMap Overpass API','endpoint':endpoint_used,'source_url':endpoint_used,'source_sha256':source_sha,'features_used':added,'added_feature_count':added,'accessed_at':now,'evidence_level_distribution':report['evidence_distribution_new'],'confidence_level_distribution':report['confidence_distribution_new'],'building_type_distribution':report['type_distribution_new'],'new_feature_ids':[r['feature_id'] for r in new_records],'raw_source_stored_in_git':False}
