              raise SystemExit(f'STALE_STATE before={before} next_batch={cp.get("next_batch_index")}')
          continuation=cp.get('continuation_key') or TASK
          if continuation!=TASK: raise SystemExit(f'CONTINUATION_MISMATCH {continuation}')
          processed=set()
          for f in features:
              p=f.get('properties',{})
              for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')):
                  if v is not None and str(v): processed.add(str(v))
          south,west,north,east=BBOX[1],BBOX[0],BBOX[3],BBOX[2]
          q=f'[out:json][timeout:60];way["building"]({south},{west},{north},{east});out center tags;'
          raw=None; endpoint_used=None; last=None
          for endpoint in ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']:
              try:
                  req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':'TerraYield-AAYS/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as r: raw=r.read()
