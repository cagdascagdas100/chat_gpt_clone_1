name: AAYS building_type_7 batch155 once
on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: ['.github/workflows/aays-bt7-batch155-once.yml']
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 30
          clean: false
      - name: Fetch dedupe classify and persist batch 155
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, urllib.parse, urllib.request, datetime, collections, os
          SLOT='building_type_7'; TASK='building-type-7-england-classification-v1-20260808'
          BATCH=155; CITY='Kenilworth_NorthEast_B'; GRID='uk-grid-kenilworth_northeast_b-001'
