          cp['summary']={'osm_pilot_classified':classified,'new_slot':False,'pipeline_stage':1,'new_features_appended':added,'current_feature_count':after,'note':f'PROGRESS: feature_count {before} -> {after}. Batch {BATCH} {CITY} persisted; remote readback pending. final_ready remains false.' if added else f'NO PROGRESS: feature_count stayed {before}.','new_features_added_this_attempt':added,'progress_counted':after>before,'unknown':unknown}
