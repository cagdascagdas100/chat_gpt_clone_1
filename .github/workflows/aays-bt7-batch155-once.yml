              return ('unknown','UNKNOWN','unknown',0.35,1,'U',True)
          candidates=[]
          for e in data.get('elements',[]):
              if e.get('type')!='way' or not e.get('tags',{}).get('building'): continue
              osm=f"way/{e['id']}"; fid=f"KENILWORTH_NORTHEAST_B_OSM_way_{e['id']}"
