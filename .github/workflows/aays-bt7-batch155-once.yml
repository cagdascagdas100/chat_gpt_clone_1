              if b in m:return m[b]
              if tags.get('shop'): return ('commercial_retail','C_RETAIL','commercial',0.68,2,'C',True)
              if tags.get('office'): return ('commercial_office','C_OFFICE','commercial',0.68,2,'C',True)
              if tags.get('tourism')=='hotel': return ('hotel_or_hospitality','C_HOTEL','commercial',0.68,2,'C',True)
              a=(tags.get('amenity') or '').lower()
