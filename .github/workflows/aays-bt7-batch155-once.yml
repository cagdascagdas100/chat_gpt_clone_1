                'sources':[{'source_name':'OpenStreetMap Overpass API','url_or_path':endpoint_used,'object_url':f"https://www.openstreetmap.org/way/{e['id']}",'accessed_at':now,'sha256':source_sha,'sha256_scope':'raw_overpass_response','licence':'ODbL 1.0','granularity':'building_element','fields_used':used,'supports_field':'building_type_primary','match_method':f"building={tags.get('building')}",'match_score':score}],
                'geometry_match_method':'osm_element_point_or_center','address_match_method':'osm_tags_when_present',
                'limitations':'OSM building/use-tag evidence only; OSM element is a building proxy, not a cadastral parcel; no EPC/VOA corroboration in this batch.',
