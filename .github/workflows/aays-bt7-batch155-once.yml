                      endpoint_used=endpoint; break
              except Exception as e: last=e
          if not raw: raise SystemExit(f'OVERPASS_UNAVAILABLE {last}')
          source_sha=hashlib.sha256(raw).hexdigest(); data=json.loads(raw)
