              new_records.append(rec); new_features.append({'type':'Feature','id':fid,'geometry':rec['geometry'],'properties':{k:v for k,v in rec.items() if k!='geometry'}})
          features.extend(new_features); shard['features']=features
          after=len(features); added=after-before
