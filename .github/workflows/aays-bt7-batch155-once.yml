name: AAYS building_type_7 batch155 state normalize
on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: ['.github/workflows/aays-bt7-batch155-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 30
          clean: false
      - name: Normalize verified batch 155 state
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, datetime, hashlib
          SLOT='building_type_7'; EXPECTED=7750; BATCH=155; NEXT=156; TARGET=7800
          shard_path=f'england_map_web/data/building_type/shards/{SLOT}_latest.geojson'
          manifest_path=f'england_map_web/data/building_type/shards/{SLOT}_manifest_latest.json'
          report_path=f'docs/chatgpt_status/building_type/slots/{SLOT}/runner_outputs/{SLOT}_classification_latest.json'
          cp_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/checkpoint_latest.json'
          status_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/status_latest.json'
          task_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/current_task_latest.json'
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f)
          def dump(p,o):
              with open(p,'w',encoding='utf-8') as f: json.dump(o,f,ensure_ascii=False,indent=2); f.write('\n')
          shard=load(shard_path); manifest=load(manifest_path); report=load(report_path); cp=load(cp_path); status=load(status_path); task=load(task_path)
          if len(shard.get('features',[]))!=EXPECTED: raise SystemExit(f'READBACK_SHARD_MISMATCH {len(shard.get("features",[]))}')
          if int(manifest.get('total_features',-1))!=EXPECTED: raise SystemExit('READBACK_MANIFEST_MISMATCH')
          if int(report.get('feature_count_after',-1))!=EXPECTED or int(report.get('batch_index',-1))!=BATCH: raise SystemExit('READBACK_REPORT_MISMATCH')
          if int(cp.get('current_feature_count',-1))!=EXPECTED or int(cp.get('next_batch_index',-1))!=NEXT: raise SystemExit('READBACK_CHECKPOINT_MISMATCH')
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data_commit=subprocess.check_output(['git','log','-1','--format=%H','--',shard_path],text=True).strip()
          cp['remote_readback_verified']=True; cp['remote_data_commit']=data_commit; cp['remote_head']=head; cp['updated_at']=now
          cp['first_unverified_step']=f'APPEND_NEW_BATCH_{NEXT}_AFTER_FEATURE_{EXPECTED}'
          cp['first_unverified_step_status']='READY'; cp['terminal_status']='READY'; cp['state']='READY'
          cp['next_required_action']=f'CONTINUE_BATCH_{NEXT}_FROM_{EXPECTED}_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES'
          cp['summary']['note']=f'PROGRESS: feature_count 7700 -> {EXPECTED}. Batch {BATCH} Kenilworth_NorthEast_B persisted and remote readback verified; continue at batch {NEXT}. final_ready remains false.'
          cp['summary']['current_feature_count']=EXPECTED; cp['summary']['new_features_appended']=50; cp['summary']['new_features_added_this_attempt']=50; cp['summary']['progress_counted']=True
          cp['remaining_items']['note']=f'Next batch {NEXT}: treat all {EXPECTED} canonical feature.id/feature_id/parcel_id/osm_id/source_ref values as already_processed_ids and append 50 genuinely new West Midlands records; do not replay prior batches.'
          cp['blocker']=None; cp['blocker_reason']=''; cp['no_progress_reason']=None; cp['final_ready']=False; cp['fake_data']=False
          status['remote_readback_verified']=True; status['remote_data_commit']=data_commit; status['remote_head']=head; status['updated_at']=now
          status['note']='Appended 50 unique Kenilworth_NorthEast_B OSM building elements after processed-ID exclusion; remote readback verified; no second task/owner created.'
          status['current_feature_count']=EXPECTED; status['feature_count']=EXPECTED; status['feature_count_before']=7700; status['feature_count_after']=EXPECTED
          status['next_batch_index']=NEXT; status['next_target_feature_count']=TARGET; status['progress_counted']=True; status['blocker']=None; status['blocker_reason']=''; status['final_ready']=False; status['fake_data']=False
          task['updated_at']=now; task['first_unverified_step']=f'APPEND_NEW_BATCH_{NEXT}_AFTER_FEATURE_{EXPECTED}'; task['continuation_key']='building-type-7-england-classification-v1-20260808'; task['owner']=None; task['blocker']=None; task['final_ready']=False; task['fake_data']=False
          task['progress']['completed_count']=EXPECTED; task['progress']['target_count']=TARGET
          dump(cp_path,cp); dump(status_path,status); dump(task_path,task)
          print(json.dumps({'verified':True,'feature_count':EXPECTED,'next_batch':NEXT,'target':TARGET,'data_commit':data_commit,'head':head}))
          PY
      - name: Commit normalized state safely
        shell: bash
        run: |
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json
          git diff --cached --quiet || git commit -m 'state(aays): verify building_type_7 batch 155 readback'
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          git push origin HEAD:codex/aays-single-runner-v5-20260706
