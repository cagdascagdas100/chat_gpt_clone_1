          cp['already_processed_ids']={'strategy':'derived_from_latest_shard_feature.id_plus_feature_id_plus_parcel_id_plus_osm_id_plus_source_ref','unique_key_count':len(processed_after),'sha256_sorted_newline_keys':hashlib.sha256(keys_sorted).hexdigest(),'sample':sorted(processed_after)[-20:]}
          status.update({'slot_id':SLOT,'task_id':TASK,'continuation_key':continuation,'updated_at':now,'owner':None,'classified_count':classified,'unknown_count':unknown,'total_elements':after,'total_features':after,'classified':classified,'unknown':unknown,'confidence_distribution':dict(cd),'confidence_level_distribution':dict(cd),'evidence_distribution':dict(ev),'feature_count_before':before,'feature_count_after':after,'current_feature_count':after,'feature_count':after,'last_batch_index':BATCH if added else status.get('last_batch_index'),'next_batch_index':BATCH+1 if added else BATCH,'next_target_feature_count':after+TARGET,'last_batch_name':CITY if added else status.get('last_batch_name'),'last_batch_city':CITY if added else status.get('last_batch_city'),'last_batch_added_feature_count':added,'last_new_feature_count':added,'new_feature_count':added,'new_features_added':added,'no_evidence_this_batch':no_evidence,'last_batch_source':'OpenStreetMap Overpass API','last_batch_evidence_distribution':report['evidence_distribution_new'],'last_batch_confidence_distribution':report['confidence_distribution_new'],'last_batch':batch_summary,'progress_count_delta':added,'progress_counted':after>before,'progress_reason':f'{added} new {CITY} OSM records appended after processed-ID exclusion' if added else None,'no_progress_reason':None if added else 'NO_NEW_FEATURES','blocker':None,'blocker_reason':'','remote_readback_verified':False,'final_ready':False,'fake_data':False})
          task['task_id']=TASK; task['slot_id']=SLOT; task['continuation_key']=continuation; task['owner']=None; task['updated_at']=now; task['first_unverified_step']=f'APPEND_NEW_BATCH_{BATCH+1}_AFTER_FEATURE_{after}'; task['blocker']=None; task['final_ready']=False; task['fake_data']=False
          task['progress']={'completed_count':after,'target_count':after+TARGET,'previous_percent':100.0*before/(after+TARGET) if after+TARGET else 0.0,'current_percent':100.0*after/(after+TARGET) if after+TARGET else 0.0,'percent_increase':100.0*(after-before)/(after+TARGET) if after+TARGET else 0.0}
