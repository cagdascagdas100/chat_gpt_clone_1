name: AAYS BT6 canonical strict executor 130-141
on:
  push:
    branches: [main]
    paths:
      - 'docs/chatgpt_status/_shared/slots_21/building_type_6/actions_main_trigger_130_141.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt6-canonical-exec-106-117-20260818.yml'
permissions:
  contents: write
concurrency:
  group: aays-bt6-canonical-exec-130-141-20260818
  cancel-in-progress: true
jobs:
  strict-bt6:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout existing BT6 runner payload
        uses: actions/checkout@v4
        with:
          ref: work/openai/agent-aays-bt6-strict-12-20260818-2018
          fetch-depth: 1
          path: trigger
      - name: Extract existing BT6 checkpoint-recovery payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,textwrap
          p=Path('trigger/.github/workflows/aays-bt6-strict-106-117-20260818.yml')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"cat > /tmp/bt6_106_117\.py <<'PY'\n(.*?)\nPY\npython /tmp/bt6_106_117\.py",s,re.S)
          if not m: raise SystemExit('BT6_RUNNER_EXTRACTION_FAILED')
          s=textwrap.dedent(m.group(1))
          if "START=135; END=141; INITIAL=22300; OVERALL_BEFORE=22250" not in s: raise SystemExit('BT6_RECOVERY_CURSOR_PAYLOAD_MISMATCH')
          if "NOTTINGHAM_CITY_COUNCIL_ARCGIS_HMLR_INSPIRE" not in s: raise SystemExit('BT6_SOURCE_FAMILY_MISMATCH')
          if "REPORT=REP" not in s: raise SystemExit('BT6_REPORT_OWNERSHIP_MISMATCH')
          Path('/tmp/bt6_106_117.py').write_text(s,encoding='utf-8')
          print({'slot':'building_type_6','resume_cursor':135,'remaining_batches':'135-141','overall_batches':'130-141','source_family':'Nottingham City ArcGIS HMLR INSPIRE + OSM','ownership':'six canonical BT6 paths'})
          PY
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          path: canonical
      - name: Install geometry dependencies
        run: python -m pip install --quiet requests shapely pyproj
      - name: Resume remaining strict bounded batches with per-batch remote readback
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          python /tmp/bt6_106_117.py
