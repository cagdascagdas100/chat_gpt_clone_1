name: height_difference_2 live browser acceptance 035
on:
  push:
    branches:
      - agent/hd2-live-browser-035-20260722
    paths:
      - docs/chatgpt_status/topography/shards/height_difference_2/runtime/035_live_browser_trigger.json
permissions:
  contents: write
jobs:
  browser_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hd2-live-browser-035-20260722
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Serve slot and run Chromium acceptance
        shell: bash
        run: |
          set -euo pipefail
          SLOT='england_map_web/data/aays_21_slots/height_difference_2'
          python -m http.server 8012 --directory "$SLOT" >/tmp/hd2_http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8012/index.html >/dev/null && break; sleep 1; done
          python - <<'PY'
          import json, hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url='http://127.0.0.1:8012/index.html'
          console_errors=[]
          page_errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width': 1920, 'height': 1080})
              page.on('console', lambda m: console_errors.append(m.text) if m.type=='error' else None)
              page.on('pageerror', lambda e: page_errors.append(str(e)))
              response=page.goto(url, wait_until='networkidle', timeout=120000)
              page.wait_for_function("document.querySelector('#message') && !document.querySelector('#message').textContent.includes('Yükleniyor')", timeout=120000)
              message=page.locator('#message').inner_text()
              operation_rows=page.locator('#rows tr').count()
              source_rows=page.locator('#sources tr').count()
              example_rows=page.locator('#examples tr').count()
              metrics=page.locator('#metrics').inner_text()
              body_text=page.locator('body').inner_text()
              snapshots={}
              expected={'parcel_30762':'0.27','parcel_46142':'0.831','parcel_61522':'0.49'}
              for parcel,diff in expected.items():
                  row=page.locator('#examples tr', has_text=parcel)
                  snapshots[parcel]={'count':row.count(),'text':row.first.inner_text() if row.count() else None,'expected_difference':diff}
              screenshot=Path('/tmp/hd2_live_acceptance_035.png')
              page.screenshot(path=str(screenshot), full_page=True)
              status=response.status if response else None
              browser_version=browser.version
              browser.close()
          checks={
              'http_200': status==200,
              'message_success': 'Yükleme hatası' not in message and '601' in message and '52' in message and '33' in message,
              'operation_rows_601': operation_rows==601,
              'source_rows_52': source_rows==52,
              'example_rows_33': example_rows==33,
              'numeric_metric_3': 'Sayısal sonuç: 3' in metrics,
              'three_measured_rows_visible': all(v['count']==1 and v['expected_difference'] in (v['text'] or '') for v in snapshots.values()),
              'no_console_errors': not console_errors,
              'no_page_errors': not page_errors,
          }
          state='PASS' if all(checks.values()) else 'FAIL'
          receipt={
              'schema_version':1,
              'slot_id':'height_difference_2',
              'validated_at':datetime.now(timezone.utc).isoformat(),
              'state':state,
              'url':url,
              'http_status':status,
              'browser':'Chromium',
              'browser_version':browser_version,
              'message':message,
              'operation_rows':operation_rows,
              'source_rows':source_rows,
              'example_rows':example_rows,
              'checks':checks,
              'measured_row_snapshots':snapshots,
              'console_errors':console_errors,
              'page_errors':page_errors,
              'screenshot_sha256':hashlib.sha256(screenshot.read_bytes()).hexdigest(),
              'fake_data':False,
              'final_ready':False,
          }
          if state!='PASS':
              raise SystemExit(json.dumps(receipt, ensure_ascii=False, indent=2))
          paths=[
              Path('docs/chatgpt_status/topography/shards/height_difference_2/validation/036_live_http_dom_acceptance_20260722.json'),
              Path('england_map_web/data/aays_21_slots/height_difference_2/port_8012_web_acceptance.json'),
          ]
          for path in paths:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit acceptance receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/topography/shards/height_difference_2/validation/036_live_http_dom_acceptance_20260722.json england_map_web/data/aays_21_slots/height_difference_2/port_8012_web_acceptance.json
          git commit -m 'test(height_difference_2): record live HTTP DOM acceptance 035 [skip ci]'
          git push origin HEAD:agent/hd2-live-browser-035-20260722
