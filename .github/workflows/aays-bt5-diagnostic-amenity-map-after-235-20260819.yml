name: AAYS BT5 diagnostic amenity mapping after 235
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-diagnostic-amenity-map-after-235-20260819.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Build canonical same-tag mapping
        shell: bash
        run: |
          python - <<'PY'
          import json,re,collections
          from pathlib import Path
          shard=json.loads(Path('canonical/england_map_web/data/building_type/shards/building_type_5_latest.geojson').read_text())
          uvals=collections.Counter(); bmap=collections.defaultdict(collections.Counter); examples=collections.defaultdict(list)
          for f in shard.get('features',[]):
              p=f.get('properties') or {}; tags={}
              for k in ('osm_tags_summary','source_evidence_excerpt'):
                  v=p.get(k)
                  if isinstance(v,dict): tags.update(v)
              amen=tags.get('amenity')
              if not amen: continue
              if p.get('evidence_level')=='U' and p.get('building_type_primary')=='unknown': uvals[str(amen)]+=1
              if p.get('evidence_level')=='B' and p.get('building_type_primary') not in (None,'','unknown'):
                  bt=str(p.get('building_type_primary')); bmap[str(amen)][bt]+=1
                  if len(examples[str(amen)])<5: examples[str(amen)].append({'parcel_id':p.get('parcel_id'),'building_type_primary':bt,'source_url':p.get('source_url')})
          rows=[]
          for amen,n in uvals.most_common():
              dist=dict(bmap.get(amen,{})); total=sum(dist.values()); dominant=max(dist,key=dist.get) if dist else None
              rows.append({'amenity':amen,'u_count':n,'classified_b_distribution':dist,'classified_b_total':total,'dominant':dominant,'unambiguous':bool(dist and len(dist)==1),'examples':examples.get(amen,[])})
          out={'slot_id':'building_type_5','rows':rows}
          Path('/tmp/bt5_amenity_map.json').write_text(json.dumps(out,separators=(',',':')))
          print(json.dumps(out,indent=2))
          PY
      - name: Publish mapping diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/diagnostic_amenity_map_after_235.json';
            const content=fs.readFileSync('/tmp/bt5_amenity_map.json','utf8');
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: publish BT5 canonical amenity map',content:Buffer.from(content).toString('base64'),...(sha?{sha}:{})});
