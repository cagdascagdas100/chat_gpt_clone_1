# registry retrigger after workflow registration; infrastructure only, not business progress
name: AAYS building_type_9 strict 12 bounded batches 20260818 once
on:
  push:
    paths:
      - '.github/workflows/aays-bt9-strict-12batches-20260818-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-9-strict-12-20260818
  cancel-in-progress: false
jobs:
  strict-spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aays-bt9-strict-12-20260818-0441
          fetch-depth: 2
          path: trigger
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 100
          clean: false
          path: canonical
      - name: Extract registered runner and execute on canonical checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,re,subprocess,zlib
          p='.github/workflows/aays-bt9-strict-12batches-20260818-once.yml'
          text=subprocess.check_output(['git','-C','trigger','show',f'HEAD^:{p}'],text=True)
          m=re.search(r"base64\.b64decode\('([^']+)'\)",text)
          if not m: raise SystemExit('REGISTERED_RUNNER_PAYLOAD_NOT_FOUND')
          open('/tmp/bt9_strict_12.py','wb').write(zlib.decompress(base64.b64decode(m.group(1))))
          PY
          cd canonical
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          python /tmp/bt9_strict_12.py
