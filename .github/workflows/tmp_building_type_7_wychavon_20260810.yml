name: tmp building_type_7 Wychavon batch 28

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_wychavon_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase and guard slot state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json').read_text())
          geo=json.loads(Path('england_map_web/data/building_type/shards/building_type_7_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json').read_text())
          assert cp.get('slot_id') == 'building_type_7'
          assert cp.get('current_feature_count') == 1350, cp
          assert cp.get('feature_count_after') == 1350, cp
          assert cp.get('next_batch_index') == 28, cp
          assert cp.get('next_target_feature_count') == 1400, cp
          assert cp.get('fake_data') is False and cp.get('final_ready') is False
          assert len(geo.get('features') or []) == 1350
          assert manifest.get('total_features', manifest.get('feature_count')) == 1350
          assert task.get('task_id') == 'building-type-7-england-classification-v1-20260808'
          assert task.get('slot_id') == 'building_type_7'
          assert task.get('owner') is None, task.get('owner')
          assert task.get('fake_data') is False and task.get('final_ready') is False
          assert not any('wychavon' in str(s.get('name','')).lower() for s in manifest.get('sources',[]) if isinstance(s,dict)), 'Wychavon already used'
          PY
          : > /tmp/base_slot_hashes.txt
          for p in \
            england_map_web/data/building_type/shards/building_type_7_latest.geojson \
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json; do
            printf '%s %s\n' "$p" "$(git rev-parse HEAD:"$p")" >> /tmp/base_slot_hashes.txt
          done

      - name: Resolve and fetch official Wychavon FHRS XML to runtime cache only
        shell: bash
        run: |
          set -euo pipefail
          PAGE_URL='https://ratings.food.gov.uk/open-data'
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors "$PAGE_URL" -o /tmp/fsa_open_data.html
          python - <<'PY'
          import html, re
          from pathlib import Path
          from urllib.parse import urljoin
          text=html.unescape(Path('/tmp/fsa_open_data.html').read_text(encoding='utf-8', errors='replace'))
          low=text.lower()
          positions=[m.start() for m in re.finditer('wychavon', low)]
          assert positions, 'Wychavon not found on FSA open-data page'
          links=[]
          pat=re.compile(r'href=["\']([^"\']*FHRS\d+en-GB\.xml[^"\']*)["\']', re.I)
          for m in pat.finditer(text):
              links.append((m.start(), m.group(1)))
          assert links, 'No English FHRS XML links found'
          pos, href=min(links, key=lambda x: min(abs(x[0]-p) for p in positions))
          distance=min(abs(pos-p) for p in positions)
          assert distance < 7000, (distance, href)
          url=urljoin('https://ratings.food.gov.uk/open-data', href)
          assert re.search(r'/FHRS\d+en-GB\.xml(?:$|\?)', url, re.I), url
          Path('/tmp/wychavon_source_url.txt').write_text(url+'\n', encoding='utf-8')
          print(url)
          PY
          SOURCE_URL="$(cat /tmp/wychavon_source_url.txt)"
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors "$SOURCE_URL" -o /tmp/wychavon_fhrs.xml
          test -s /tmp/wychavon_fhrs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/wychavon_fhrs.xml').getroot()
          vals=[]
          for e in root.iter():
              if e.tag.rsplit('}',1)[-1] == 'LocalAuthorityName' and e.text:
                  vals.append(e.text.strip())
          assert any(v.casefold() == 'wychavon' for v in vals), sorted(set(vals))[:20]
          PY
          sha256sum /tmp/wychavon_fhrs.xml

      - name: Append exactly 50 new Wychavon proxy features
        shell: bash
        run: |
          set -euo pipefail
          git show 65caa2bdd57dc126a556ece2a3e686a7b00d6c18:.github/workflows/tmp_building_type_7_north_warwickshire_20260810.yml > /tmp/nwar_template.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('/tmp/nwar_template.yml').read_text()
          marker='      - name: Append exactly 50 new North Warwickshire proxy features\n'
          assert marker in text
          section=text.split(marker,1)[1]
          start=section.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          rest=section[start:]
          end=rest.index("\n          PY\n")
          body=textwrap.dedent(rest[:end])
          exact={
              'CITY = "North Warwickshire"':'CITY = "Wychavon"',
              'PREFIX = "NWAR"':'PREFIX = "WYCH"',
              'SOURCE = "Food Standards Agency FHRS daily open data - North Warwickshire"':'SOURCE = "Food Standards Agency FHRS daily open data - Wychavon"',
              'SOURCE_URL = pathlib.Path("/tmp/north_warwickshire_source_url.txt").read_text(encoding="utf-8").strip()':'SOURCE_URL = pathlib.Path("/tmp/wychavon_source_url.txt").read_text(encoding="utf-8").strip()',
              'EXPECTED_BEFORE = 1200':'EXPECTED_BEFORE = 1350',
              'EXPECTED_BATCH = 25':'EXPECTED_BATCH = 28',
              'EXPECTED_TARGET = 1250':'EXPECTED_TARGET = 1400',
              'xml_path = pathlib.Path("/tmp/north_warwickshire_fhrs.xml")':'xml_path = pathlib.Path("/tmp/wychavon_fhrs.xml")',
              'BATCH_APPENDED_50_NORTH_WARWICKSHIRE_FHRS_CONTINUATION_REQUIRED':'BATCH_APPENDED_50_WYCHAVON_FHRS_CONTINUATION_REQUIRED',
          }
          for old,new in exact.items():
              assert old in body, old
              body=body.replace(old,new)
          body=body.replace('North Warwickshire','Wychavon')
          assert 'North Warwickshire' not in body
          assert 'north_warwickshire' not in body
          assert 'EXPECTED_BEFORE = 1350' in body and 'EXPECTED_TARGET = 1400' in body and 'EXPECTED_BATCH = 28' in body
          assert 'p.get("feature_id")' in body and 'p.get("parcel_id")' in body and 'p.get("osm_id")' in body
          assert '"evidence_excerpt": excerpt' in body
          assert '"evidence_level": "D"' in body
          assert '"confidence_level_1_to_4": 2' in body
          Path('/tmp/wychavon_append.py').write_text(body)
          compile(body,'/tmp/wychavon_append.py','exec')
          PY
          python /tmp/wychavon_append.py

      - name: Validate guarded append and exact write set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          geo=json.loads(Path('england_map_web/data/building_type/shards/building_type_7_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json').read_text())
          runner=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json').read_text())
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json').read_text())
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json').read_text())
          source_url=Path('/tmp/wychavon_source_url.txt').read_text().strip()
          feats=geo.get('features') or []
          assert len(feats) == 1400
          assert manifest.get('feature_count_before') == 1350 and manifest.get('feature_count_after') == 1400 and manifest.get('added_feature_count') == 50
          assert runner.get('feature_count_before') == 1350 and runner.get('feature_count_after') == 1400 and runner.get('added_feature_count') == 50
          assert runner.get('city') == 'Wychavon'
          assert runner.get('source_url') == source_url
          assert len(runner.get('records') or []) == 50 and len(runner.get('selected_feature_ids') or []) == 50
          assert len(set(runner['selected_feature_ids'])) == 50
          assert all(x.startswith('WYCH_FHRS_') for x in runner['selected_feature_ids'])
          assert all(r.get('evidence_excerpt') for r in runner['records'])
          assert all(r.get('source_hash') and r.get('source_url') == source_url for r in runner['records'])
          assert all(r.get('evidence_level') == 'D' and r.get('confidence_level_1_to_4') == 2 for r in runner['records'])
          assert all(r.get('fake_data') is False and r.get('final_ready') is False for r in runner['records'])
          assert cp.get('current_feature_count') == 1400 and cp.get('next_batch_index') == 29 and cp.get('next_target_feature_count') == 1450
          assert cp.get('first_unverified_step_status') == 'BATCH_APPENDED_50_WYCHAVON_FHRS_CONTINUATION_REQUIRED'
          assert cp.get('fake_data') is False and cp.get('final_ready') is False
          assert status.get('current_feature_count') == 1400 and status.get('fake_data') is False and status.get('final_ready') is False
          assert task.get('owner') is None and task.get('fake_data') is False and task.get('final_ready') is False
          existing=set()
          for f in feats[:1350]:
              p=f.get('properties') or {}
              for v in (f.get('id'), p.get('feature_id'), p.get('parcel_id'), p.get('osm_id')):
                  if v is not None and str(v).strip():
                      existing.add(str(v).strip())
          new=feats[1350:]
          assert len(new) == 50
          new_feature_ids=[]
          new_parcel_ids=[]
          for f in new:
              p=f.get('properties') or {}
              fid=str(f.get('id') or '').strip()
              pfid=str(p.get('feature_id') or '').strip()
              parcel=str(p.get('parcel_id') or '').strip()
              osm=str(p.get('osm_id') or '').strip()
              assert fid and fid.startswith('WYCH_FHRS_')
              assert pfid == fid
              assert parcel and parcel.startswith('WYCH_FHRSID_')
              assert fid not in existing and parcel not in existing
              if osm:
                  assert osm not in existing
              new_feature_ids.append(fid)
              new_parcel_ids.append(parcel)
          assert len(set(new_feature_ids)) == 50 and len(set(new_parcel_ids)) == 50
          assert set(new_feature_ids) == set(runner['selected_feature_ids'])
          PY
          expected="$(printf '%s\n' \
            'docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json' \
            'docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json' \
            'england_map_web/data/building_type/shards/building_type_7_latest.geojson' \
            'england_map_web/data/building_type/shards/building_type_7_manifest_latest.json' | sort)"
          actual="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Pre-push remote slot guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json > /tmp/remote_before_cp.json
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json > /tmp/remote_before_task.json
          python - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_before_cp.json'))
          task=json.load(open('/tmp/remote_before_task.json'))
          assert cp.get('current_feature_count') == 1350 and cp.get('next_batch_index') == 28 and cp.get('next_target_feature_count') == 1400, cp
          assert task.get('owner') is None and task.get('fake_data') is False and task.get('final_ready') is False, task
          PY
          while read -r p oldsha; do
            newsha="$(git rev-parse origin/codex/aays-single-runner-v5-20260706:"$p")"
            test "$newsha" = "$oldsha" || { echo "same-slot collision: $p"; exit 1; }
          done < /tmp/base_slot_hashes.txt

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_7_latest.geojson
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          )
          git add -- "${paths[@]}"
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "data(building_type_7): append Wychavon FHRS batch 1350->1400"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json > /tmp/loop_cp.json
            git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json > /tmp/loop_task.json
            python - <<'PY'
          import json
          cp=json.load(open('/tmp/loop_cp.json'))
          task=json.load(open('/tmp/loop_task.json'))
          assert cp.get('current_feature_count') == 1350 and cp.get('next_batch_index') == 28 and cp.get('next_target_feature_count') == 1400, cp
          assert task.get('owner') is None and task.get('fake_data') is False and task.get('final_ready') is False, task
          PY
            while read -r p oldsha; do
              newsha="$(git rev-parse origin/codex/aays-single-runner-v5-20260706:"$p")"
              test "$newsha" = "$oldsha" || { echo "same-slot collision during push loop: $p"; exit 1; }
            done < /tmp/base_slot_hashes.txt
            if ! git rebase origin/codex/aays-single-runner-v5-20260706; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          branch='origin/codex/aays-single-runner-v5-20260706'
          def load(path):
              return json.loads(subprocess.check_output(['git','show',f'{branch}:{path}']))
          shard=load('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(shard.get('features') or []) == 1400
          assert manifest.get('feature_count_after') == 1400 and manifest.get('added_feature_count') == 50 and manifest.get('last_batch_city') == 'Wychavon'
          assert runner.get('feature_count_after') == 1400 and runner.get('added_feature_count') == 50 and runner.get('city') == 'Wychavon'
          assert len(runner.get('records') or []) == 50 and all(r.get('evidence_excerpt') for r in runner['records'])
          assert all(r.get('evidence_level') == 'D' and r.get('confidence_level_1_to_4') == 2 for r in runner['records'])
          assert cp.get('current_feature_count') == 1400 and cp.get('next_batch_index') == 29 and cp.get('next_target_feature_count') == 1450
          assert status.get('current_feature_count') == 1400 and status.get('fake_data') is False and status.get('final_ready') is False
          assert task.get('owner') is None and task.get('fake_data') is False and task.get('final_ready') is False
          print('remote_readback_ok', runner.get('source_url'), runner.get('source_sha256'))
          PY
