name: tmp building_type_2 Barking and Dagenham batch 31

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_barking_dagenham_batch29_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Resolve and fetch Barking and Dagenham FHRS runtime source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 --output /tmp/fsa_open_data.html https://ratings.food.gov.uk/open-data
          python - <<'PY'
          import html, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          raw = Path('/tmp/fsa_open_data.html').read_text(encoding='utf-8', errors='replace')
          urls=[]
          for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', raw, flags=re.I|re.S):
              text=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(row))).strip()
              if re.search(r'\bBarking and Dagenham\b', text, flags=re.I):
                  for href in re.findall(r'href=["\']([^"\']*open-data-files/[^"\']+\.xml[^"\']*)', row, flags=re.I):
                      url=urljoin('https://ratings.food.gov.uk/open-data', html.unescape(href))
                      p=urlparse(url)
                      if p.scheme=='https' and p.netloc=='ratings.food.gov.uk' and p.path.startswith('/api/open-data-files/') and p.path.endswith('.xml') and url not in urls:
                          urls.append(url)
          assert len(urls)==1, urls
          Path('/tmp/barking_dagenham_source_url.txt').write_text(urls[0]+'\n', encoding='utf-8')
          print(urls[0])
          PY
          curl --fail --location --retry 2 --retry-delay 2 --output /tmp/barking_dagenham_fhrs.xml "$(cat /tmp/barking_dagenham_source_url.txt)"
          test -s /tmp/barking_dagenham_fhrs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          names={(n.text or '').strip() for n in ET.parse('/tmp/barking_dagenham_fhrs.xml').getroot().findall('.//LocalAuthorityName') if (n.text or '').strip()}
          assert 'Barking and Dagenham' in names, sorted(names)[:10]
          PY

      - name: Append exactly 50 processed-ID-external features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, datetime as dt, hashlib, json, math, pathlib
          import xml.etree.ElementTree as ET
          from collections import Counter

          SLOT='building_type_2'; TASK='building-type-2-england-classification-v1-20260808'
          CITY='Barking and Dagenham'; PREFIX='BARKING_DAGENHAM'; REGION='London Outer'
          SOURCE='Food Standards Agency FHRS daily open data - Barking and Dagenham'
          SOURCE_PAGE='https://ratings.food.gov.uk/open-data'
          SOURCE_URL=pathlib.Path('/tmp/barking_dagenham_source_url.txt').read_text().strip()
          BEFORE=1500; BATCH=31; TARGET=1550; PRIOR_CITY_COUNT=150; CUMULATIVE_SOURCE_COUNT=200
          shard_p=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest_p=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner_p=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          status_p=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          checkpoint_p=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          task_p=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          xml_p=pathlib.Path('/tmp/barking_dagenham_fhrs.xml')
          shard=json.loads(shard_p.read_text()); manifest=json.loads(manifest_p.read_text()); status=json.loads(status_p.read_text()); checkpoint=json.loads(checkpoint_p.read_text()); task=json.loads(task_p.read_text())
          features=shard.get('features') or []
          assert shard.get('type')=='FeatureCollection' and len(features)==BEFORE
          assert checkpoint.get('current_feature_count')==BEFORE and checkpoint.get('feature_count_after')==BEFORE
          assert checkpoint.get('next_batch_index')==BATCH and checkpoint.get('next_target_feature_count')==TARGET
          assert task.get('task_id')==TASK and task.get('slot_id')==SLOT and task.get('owner') is None
          assert task.get('fake_data') is False and task.get('final_ready') is False
          assert not any((f.get('properties') or {}).get('fake_data') is True for f in features)

          processed=set(); existing_points=set(); prior_city=0
          for f in features:
              p=f.get('properties') or {}
              for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id')):
                  if v is not None and str(v).strip(): processed.add(str(v).strip())
              if str(f.get('id') or '').startswith(PREFIX+'_FHRS_'): prior_city+=1
              g=f.get('geometry') or {}; c=g.get('coordinates') or []
              if g.get('type')=='Point' and len(c)>=2:
                  try:
                      lon,lat=float(c[0]),float(c[1])
                      if math.isfinite(lon) and math.isfinite(lat): existing_points.add((round(lon,7),round(lat,7)))
                  except Exception: pass
          assert prior_city==PRIOR_CITY_COUNT, prior_city

          raw=xml_p.read_bytes(); source_sha=hashlib.sha256(raw).hexdigest(); root=ET.fromstring(raw)
          def txt(el,path):
              n=el.find(path); return (n.text or '').strip() if n is not None and n.text is not None else ''
          def classify(bt):
              x=(bt or '').casefold()
              if any(k in x for k in ('school','college','university')): return 'education','E_EDUCATION','institutional'
              if any(k in x for k in ('hospital','childcare','caring','nursing','residential care')): return 'healthcare_care','H_CARE','institutional'
              if any(k in x for k in ('hotel','bed & breakfast','bed and breakfast','guest house')): return 'hospitality','C_HOTEL','commercial'
              if 'retail' in x or 'supermarket' in x or 'hypermarket' in x: return 'commercial_retail','C_RETAIL','commercial'
              if any(k in x for k in ('restaurant','cafe','canteen','pub','bar','nightclub','takeaway','sandwich')): return 'commercial_hospitality','C_HOSPITALITY','commercial'
              if any(k in x for k in ('manufacturer','packer')): return 'industrial','I_INDUSTRIAL','industrial'
              if any(k in x for k in ('distributor','transporter','importer','exporter')): return 'warehouse','I_WAREHOUSE','industrial'
              if any(k in x for k in ('farmer','grower')): return 'agricultural_outbuilding','A_OUTBUILDING','agricultural'
              return 'commercial_other','C_OTHER','commercial'

          candidates=[]; skipped_processed=skipped_coords=skipped_existing=skipped_dup=0; seen_ids=set(); seen_points=set()
          for el in root.findall('.//EstablishmentDetail'):
              fid=txt(el,'FHRSID')
              if not fid: continue
              feature_id=f'{PREFIX}_FHRS_{fid}'; parcel_id=f'{PREFIX}_FHRSID_{fid}'
              if feature_id in processed or parcel_id in processed or fid in processed:
                  skipped_processed+=1; continue
              if feature_id in seen_ids: continue
              try:
                  lat=float(txt(el,'Geocode/Latitude') or txt(el,'Latitude')); lon=float(txt(el,'Geocode/Longitude') or txt(el,'Longitude'))
                  if not(math.isfinite(lat) and math.isfinite(lon) and -90<=lat<=90 and -180<=lon<=180): raise ValueError
              except Exception:
                  skipped_coords+=1; continue
              pt=(round(lon,7),round(lat,7))
              if pt in existing_points: skipped_existing+=1; continue
              if pt in seen_points: skipped_dup+=1; continue
              seen_ids.add(feature_id); seen_points.add(pt)
              try: key=(0,int(fid))
              except Exception: key=(1,fid)
              candidates.append((key,el,fid,feature_id,parcel_id,lon,lat))
          candidates.sort(key=lambda x:x[0]); selected=candidates[:50]
          assert len(selected)==50, f'only {len(selected)} eligible new Barking and Dagenham features'
          now=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          new_features=[]; records=[]
          for _,el,fid,feature_id,parcel_id,lon,lat in selected:
              name=txt(el,'BusinessName'); bt=txt(el,'BusinessType'); btid=txt(el,'BusinessTypeID'); labid=txt(el,'LocalAuthorityBusinessID'); authority=txt(el,'LocalAuthorityName') or CITY; postcode=txt(el,'PostCode')
              assert authority==CITY
              primary,code,category=classify(bt)
              excerpt=f'FHRSID {fid} | {name} | BusinessType {bt} | LocalAuthority {authority} | PostCode {postcode}'
              rec={'parcel_id':parcel_id,'parcel_id_semantics':'stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID','osm_id':None,'slot_id':SLOT,'region':REGION,'area':CITY,'local_authority':authority,'postcode':postcode,'building_type_primary':primary,'building_type_code':code,'building_category':category,'confidence_score':0.55,'confidence_level_1_to_4':2,'evidence_level':'D','source_count':1,'source':SOURCE,'source_url':SOURCE_URL,'source_hash':source_sha,'source_hash_method':'sha256_raw_source_xml','match_method':'fhrs_business_type_premises_proxy','evidence_excerpt':excerpt,'evidence_excerpt_sha256':hashlib.sha256(excerpt.encode()).hexdigest(),'source_evidence_excerpt':{'FHRSID':fid,'BusinessName':name,'BusinessType':bt,'BusinessTypeID':btid,'LocalAuthorityBusinessID':labid,'LocalAuthorityName':authority,'PostCode':postcode,'RatingValue':txt(el,'RatingValue'),'RatingDate':txt(el,'RatingDate')},'sources':[{'source_name':'Food Standards Agency FHRS daily open data','url_or_local_path':SOURCE_URL,'accessed_at':now,'sha256':source_sha,'sha256_scope':'raw_source_xml','granularity':'food_business_establishment','fields_used':['FHRSID','BusinessName','BusinessType','BusinessTypeID','LocalAuthorityBusinessID','LocalAuthorityName','PostCode','Latitude','Longitude'],'supports_field':'building_type_primary','match_method':'fhrs_business_type_premises_proxy','match_score':0.55}],'geometry_match_method':'fhrs_geocode_point','address_match_method':'fhrs_business_address','limitations':'FHRS business type is a premises-use proxy and does not prove cadastral parcel identity or exact building fabric/type.','needs_manual_review':True,'fake_data':False,'final_ready':False,'updated_at':now,'feature_id':feature_id,'geometry':{'type':'Point','coordinates':[lon,lat]}}
              records.append(rec); props=copy.deepcopy(rec); geom=props.pop('geometry'); new_features.append({'type':'Feature','id':feature_id,'geometry':geom,'properties':props})
          ids=[f['id'] for f in new_features]; parcels=[f['properties']['parcel_id'] for f in new_features]
          assert len(ids)==len(set(ids))==50 and len(parcels)==len(set(parcels))==50
          assert not(set(ids)&processed) and not(set(parcels)&processed)
          shard['features'].extend(new_features); after=len(shard['features'])
          assert after==TARGET and after>BEFORE
          assert len([f for f in shard['features'] if str(f.get('id') or '').startswith(PREFIX+'_FHRS_')])==CUMULATIVE_SOURCE_COUNT
          assert all(f['properties']['evidence_excerpt'] and f['properties']['evidence_level']=='D' and f['properties']['confidence_level_1_to_4']==2 and f['properties']['fake_data'] is False and f['properties']['final_ready'] is False for f in new_features)
          shard_p.write_text(json.dumps(shard,ensure_ascii=False,indent=2)+'\n'); geo_sha=hashlib.sha256(shard_p.read_bytes()).hexdigest()

          types=Counter(); evs=Counter(); conf=Counter(); unknown=0
          for f in shard['features']:
              p=f.get('properties') or {}; bt=p.get('building_type_primary') or 'unknown'; ev=p.get('evidence_level') or 'U'; cl=str(p.get('confidence_level_1_to_4') or 1)
              types[bt]+=1; evs[ev]+=1; conf[cl]+=1; unknown += (bt=='unknown')
          classified=after-unknown
          sources=manifest.get('sources') or []; matches=[s for s in sources if s.get('url')==SOURCE_URL]
          assert len(matches)==1 and int(matches[0].get('features_used') or 0)==PRIOR_CITY_COUNT, matches
          matches[0].update({'name':SOURCE,'source_page':SOURCE_PAGE,'features_used':CUMULATIVE_SOURCE_COUNT,'accessed_at':now,'source_sha256':source_sha,'source_hash_method':'sha256_raw_source_xml','note':'Premises-use proxy; not cadastral parcel geometry. Aggregated across processed-ID-external continuation batches.'})
          manifest.update({'slot_id':SLOT,'generated_at':now,'total_features':after,'classified':classified,'unknown':unknown,'evidence_distribution':dict(sorted(evs.items())),'type_distribution':dict(sorted(types.items())),'confidence_level_distribution':dict(sorted(conf.items())),'sources':sources,'fake_data':False,'final_ready':False,'note':'Existing shard preserved; appended 50 Barking and Dagenham FHRS records outside feature.id/parcel_id/osm_id already_processed_ids.','feature_count':after,'geojson_sha256':geo_sha,'geojson_path':str(shard_p),'manifest_updated_at':now,'feature_count_before':BEFORE,'feature_count_after':after,'added_feature_count':50,'last_batch_city':CITY,'last_batch_source':SOURCE,'last_batch_source_sha256':source_sha})
          manifest_p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          runner={'slot_id':SLOT,'task_id':TASK,'generated_at':now,'feature_count_before':BEFORE,'feature_count_after':after,'added_feature_count':50,'city':CITY,'source':SOURCE,'source_url':SOURCE_URL,'source_sha256':source_sha,'classification_method':'fhrs_business_type_premises_proxy','confidence_policy':{'fhrs_premises_proxy':{'evidence_level':'D','confidence_level_1_to_4':2}},'already_processed_id_fields':['feature.id','properties.feature_id','properties.parcel_id','properties.osm_id'],'candidate_count_after_filters':len(candidates),'skipped_processed_ids':skipped_processed,'skipped_missing_or_invalid_coordinates':skipped_coords,'skipped_existing_shard_points':skipped_existing,'skipped_duplicate_points':skipped_dup,'selected_feature_ids':ids,'records':records,'fake_data':False,'final_ready':False}
          runner_p.write_text(json.dumps(runner,ensure_ascii=False,indent=2)+'\n')
          status.update({'state':'IN_PROGRESS','slot_id':SLOT,'task_id':TASK,'updated_at':now,'final_ready':False,'classified_count':classified,'unknown_count':unknown,'total_elements':after,'confidence_distribution':dict(sorted(conf.items())),'evidence_distribution':dict(sorted(evs.items())),'output_sha256':geo_sha,'note':'Barking and Dagenham FHRS continuation batch appended as premises-use proxy; cadastral parcel binding remains pending.','fake_data':False,'feature_count_before':BEFORE,'feature_count_after':after,'current_feature_count':after,'last_batch':{'city':CITY,'added_feature_count':50,'source':SOURCE,'source_sha256':source_sha,'classification_basis':'fhrs_business_type_premises_proxy','evidence_level_distribution':{'D':50},'confidence_level_distribution':{'2':50}},'total_features':after,'classified':classified,'unknown':unknown,'confidence_level_distribution':dict(sorted(conf.items())),'last_batch_city':CITY,'last_batch_added_feature_count':50,'last_batch_source':SOURCE,'last_batch_evidence_distribution':{'D':50},'last_batch_confidence_distribution':{'2':50}})
          status_p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          checkpoint.update({'first_unverified_step_status':'BATCH_APPENDED_50_BARKING_DAGENHAM_FHRS_CONTINUATION_REQUIRED','updated_at':now,'final_ready':False,'state':'IN_PROGRESS','feature_count_before':BEFORE,'feature_count_after':after,'current_feature_count':after,'next_batch_index':BATCH+1,'next_target_feature_count':after+50,'last_processed_ids_sample':ids[-20:],'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE_AND_PARCEL_BINDING','fake_data':False,'last_batch':{'batch_index':BATCH,'city':CITY,'source':SOURCE,'source_sha256':source_sha,'added_feature_count':50,'new_feature_ids':ids}})
          summary=checkpoint.get('summary') or {}; summary.update({'new_slot':False,'pipeline_stage':1,'new_features_appended':50,'current_feature_count':after}); checkpoint['summary']=summary
          checkpoint_p.write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':BEFORE,'after':after,'added':50,'candidates_after_filters':len(candidates),'skipped_processed_ids':skipped_processed,'source_sha256':source_sha,'first':ids[0],'last':ids[-1]},indent=2))
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          S=Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson'); M=Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json'); R=Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'); ST=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json'); C=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json'); T=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          shard=json.loads(S.read_text()); manifest=json.loads(M.read_text()); runner=json.loads(R.read_text()); status=json.loads(ST.read_text()); checkpoint=json.loads(C.read_text()); task=json.loads(T.read_text()); url=Path('/tmp/barking_dagenham_source_url.txt').read_text().strip()
          assert len(shard['features'])==1550
          assert manifest['feature_count_before']==1500 and manifest['feature_count_after']==1550 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==1550 and checkpoint['next_batch_index']==32 and checkpoint['next_target_feature_count']==1600
          assert runner['feature_count_before']==1500 and runner['feature_count_after']==1550 and runner['added_feature_count']==50 and len(runner['selected_feature_ids'])==50
          assert status['current_feature_count']==1550 and task['owner'] is None
          assert all(x['fake_data'] is False and x['final_ready'] is False for x in (manifest,runner,status,checkpoint,task))
          sm=[s for s in manifest['sources'] if s.get('url')==url]; assert len(sm)==1 and sm[0]['features_used']==200
          selected=set(runner['selected_feature_ids']); matches=[f for f in shard['features'] if f.get('id') in selected]
          assert len(matches)==50 and len([f for f in shard['features'] if str(f.get('id') or '').startswith('BARKING_DAGENHAM_FHRS_')])==200
          assert all((f.get('properties') or {}).get('evidence_excerpt') and (f.get('properties') or {}).get('evidence_level')=='D' and (f.get('properties') or {}).get('confidence_level_1_to_4')==2 and (f.get('properties') or {}).get('fake_data') is False and (f.get('properties') or {}).get('final_ready') is False for f in matches)
          print('validated building_type_2 batch31 1500->1550')
          PY

      - name: Commit and push only five slot outputs
        shell: bash
        run: |
          set -euo pipefail
          files=(england_map_web/data/building_type/shards/building_type_2_latest.geojson england_map_web/data/building_type/shards/building_type_2_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json)
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${files[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort); mapfile -t expected < <(printf '%s\n' "${files[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}"); test "${#staged[@]}" -eq 5
          git commit -m "data(building_type_2): append Barking and Dagenham FHRS batch 1500->1550"
          ok=0
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git rebase origin/codex/aays-single-runner-v5-20260706
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then ok=1; break; fi
          done
          test "$ok" -eq 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'
          def load(p): return json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson'); manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json'); runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'); status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json'); checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json'); task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==1550 and manifest['feature_count_after']==1550 and runner['feature_count_after']==1550 and status['current_feature_count']==1550 and checkpoint['current_feature_count']==1550
          assert checkpoint['next_batch_index']==32 and checkpoint['next_target_feature_count']==1600 and len(runner['selected_feature_ids'])==50
          assert task['owner'] is None and all(x['fake_data'] is False and x['final_ready'] is False for x in (manifest,runner,status,checkpoint,task))
          print('remote readback verified building_type_2=1550 batch31=50')
          PY
