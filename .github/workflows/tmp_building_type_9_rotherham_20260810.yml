name: tmp building_type_9 Rotherham batch 17

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_9_rotherham_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-9-continuation
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'run guarded building_type_9 Rotherham batch 17')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 unseen evidence-backed Rotherham buildings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-slot-runner'
          git config user.email 'aays-slot-runner@users.noreply.github.com'
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          python3 - <<'PY'
          import collections, datetime as dt, hashlib, json, pathlib, time, urllib.request
          import xml.etree.ElementTree as ET

          SLOT='building_type_9'
          TASK='building-type-9-england-classification-v1-20260808'
          CONT='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          BEFORE=800; TARGET=850; BATCH=17
          CITY='Rotherham'; GRID='ROTHERHAM_CENTRAL_01'
          BASE='https://api.openstreetmap.org/api/0.6/map'
          ALT='https://www.openstreetmap.org/api/0.6/map'
          BBOXES=[
            '-1.4050,53.4050,-1.3800,53.4250','-1.3800,53.4050,-1.3550,53.4250',
            '-1.3550,53.4050,-1.3300,53.4250','-1.3300,53.4050,-1.3050,53.4250',
            '-1.4050,53.4250,-1.3800,53.4450','-1.3800,53.4250,-1.3550,53.4450',
            '-1.3550,53.4250,-1.3300,53.4450','-1.3300,53.4250,-1.3050,53.4450',
            '-1.4050,53.4450,-1.3800,53.4650','-1.3800,53.4450,-1.3550,53.4650',
            '-1.3550,53.4450,-1.3300,53.4650','-1.3300,53.4450,-1.3050,53.4650']

          GEO=pathlib.Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          MAN=pathlib.Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          RUN=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          STA=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          CP=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          CT=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json')
          load=lambda p: json.loads(p.read_text(encoding='utf-8'))
          task,cp,man,sta,geo=load(CT),load(CP),load(MAN),load(STA),load(GEO)
          feats=geo.get('features') or []
          assert task.get('slot_id')==SLOT and task.get('task_id')==TASK and task.get('continuation_key')==CONT
          assert task.get('owner') is None and task.get('fake_data') is False
          assert cp.get('current_feature_count')==BEFORE and cp.get('feature_count_after')==BEFORE
          assert cp.get('next_batch_index')==BATCH and cp.get('next_target_feature_count')==TARGET
          assert len(feats)==BEFORE and man.get('feature_count',man.get('total_features'))==BEFORE
          assert all(x.get('fake_data') is False for x in (cp,man,sta))
          assert all(x.get('final_ready') is not True for x in (cp,man,sta))
          assert not any('rotherham' in str(s.get('name','')).lower() for s in man.get('sources',[]) if isinstance(s,dict))

          already=set(); owner={}
          for i,f in enumerate(feats):
            p=f.get('properties') or {}
            vals={str(v).strip() for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v is not None and str(v).strip()}
            for v in vals:
              if v in owner and owner[v]!=i: raise AssertionError(f'preexisting duplicate identifier {v}')
              owner[v]=i; already.add(v)
          already_count=len(already)

          def fetch(url):
            last=None
            for n in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'AAYS-building-type-9/1.2 ODbL evidence collection'})
                with urllib.request.urlopen(req,timeout=75) as r: raw=r.read()
                if not raw: raise RuntimeError('empty OSM response')
                ET.fromstring(raw)
                return raw,None
              except Exception as e:
                last=e
                if n<2: time.sleep(2*(n+1))
            return None,last

          raws=[]; urls=[]; failed=[]
          for bbox in BBOXES:
            u=f'{BASE}?bbox={bbox}'; raw,e=fetch(u)
            if raw is None:
              u2=f'{ALT}?bbox={bbox}'; raw,e2=fetch(u2); u=u2
              if raw is None:
                failed.append({'bbox':bbox,'primary_error':str(e),'alternate_error':str(e2)})
                continue
            raws.append(raw); urls.append(u); time.sleep(.4)
          if not raws: raise SystemExit('OSM_SOURCE_READ_FAILED: no Rotherham tile succeeded')
          source_sha=hashlib.sha256(b'\n--AAYS-TILE--\n'.join(raws)).hexdigest()
          query_sha=hashlib.sha256('\n'.join(urls).encode()).hexdigest()

          nodes={}; node_tags={}; ways={}
          for raw in raws:
            root=ET.fromstring(raw)
            for n in root.findall('node'):
              nid=n.attrib['id']; nodes[nid]=(float(n.attrib['lon']),float(n.attrib['lat']))
              tags={t.attrib['k']:t.attrib.get('v','') for t in n.findall('tag')}
              if tags: node_tags[nid]=tags
            for w in root.findall('way'):
              wid=w.attrib['id']; tags={t.attrib['k']:t.attrib.get('v','') for t in w.findall('tag')}
              refs=[nd.attrib.get('ref') for nd in w.findall('nd') if nd.attrib.get('ref')]
              ways[wid]=(tags,refs)

          bmap={'apartments':'residential_apartments','house':'residential_house','detached':'residential_detached',
                'semidetached_house':'residential_semi_detached','terrace':'residential_other','residential':'residential_other',
                'bungalow':'residential_house','commercial':'commercial_other','retail':'commercial_retail',
                'supermarket':'commercial_retail','office':'office','industrial':'industrial','warehouse':'warehouse',
                'hotel':'hotel_or_hospitality','hospital':'hospital_or_healthcare','school':'education','university':'education',
                'college':'education','kindergarten':'education','church':'religious_or_community','cathedral':'religious_or_community',
                'mosque':'religious_or_community','synagogue':'religious_or_community','temple':'religious_or_community',
                'civic':'public_infrastructure','public':'public_infrastructure','transportation':'public_infrastructure','train_station':'public_infrastructure'}
          amap={'school':'education','college':'education','university':'education','kindergarten':'education',
                'hospital':'hospital_or_healthcare','clinic':'hospital_or_healthcare','doctors':'hospital_or_healthcare',
                'dentist':'hospital_or_healthcare','place_of_worship':'religious_or_community','community_centre':'religious_or_community',
                'townhall':'public_infrastructure','library':'public_infrastructure','police':'public_infrastructure','fire_station':'public_infrastructure'}
          def classify(tags):
            b=(tags.get('building') or '').strip().lower()
            if b in bmap: return bmap[b],'osm_explicit_building_tag'
            if not b: return None,None
            if tags.get('shop'): return 'commercial_retail','osm_building_plus_shop_tag'
            if tags.get('office'): return 'office','osm_building_plus_office_tag'
            a=(tags.get('amenity') or '').strip().lower()
            if a in amap: return amap[a],'osm_building_plus_amenity_tag'
            if (tags.get('tourism') or '').strip().lower() in ('hotel','hostel','guest_house'):
              return 'hotel_or_hospitality','osm_building_plus_tourism_tag'
            return None,None
          def excerpt(kind,oid,tags):
            parts=[f'OSM {kind}/{oid}']
            for k in ['building','name','amenity','shop','office','tourism','addr:city','addr:postcode','addr:street','addr:housenumber']:
              if tags.get(k): parts.append(f'{k}={tags[k]}')
            return ' | '.join(parts)[:600]

          cand=[]
          for nid,tags in node_tags.items():
            primary,method=classify(tags)
            if primary:
              lon,lat=nodes[nid]; cand.append(('node',int(nid),lon,lat,tags,primary,method))
          for wid,(tags,refs) in ways.items():
            primary,method=classify(tags)
            if not primary: continue
            coords=[nodes[r] for r in refs if r in nodes]
            if not coords: continue
            cand.append(('way',int(wid),sum(x for x,_ in coords)/len(coords),sum(y for _,y in coords)/len(coords),tags,primary,method))
          cand.sort(key=lambda x:(x[0],x[1]))
          selected=[]; staged=set()
          for kind,oid_i,lon,lat,tags,primary,method in cand:
            oid=str(oid_i); fid=f'ENG_OSM_{kind}_{oid}'; osm=f'{kind}/{oid}'
            ids={fid,osm}
            if ids & already or ids & staged: continue
            staged.update(ids)
            rec={'id':fid,'parcel_id':fid,'osm_id':osm,'building_type_primary':primary,'source':'OpenStreetMap API 0.6',
                 'source_url':f'https://www.openstreetmap.org/{kind}/{oid}','source_hash':source_sha,'query_sha256':query_sha,
                 'evidence_excerpt':excerpt(kind,oid,tags),'evidence_level':'B','confidence_level_1_to_4':3,'match_method':method}
            props=dict(rec); props.update({'city':CITY,'grid_id':GRID,'region':'South Yorkshire','local_authority':'Metropolitan Borough of Rotherham',
                                           'confidence':3,'confidence_score':0.75,'fake_data':False})
            selected.append(({'type':'Feature','id':fid,'geometry':{'type':'Point','coordinates':[round(lon,7),round(lat,7)]},'properties':props},rec))
            if len(selected)==50: break
          if len(selected)<50: raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(selected)} unseen evidence-backed Rotherham records')
          newf=[x[0] for x in selected]; records=[x[1] for x in selected]; newids=[f['id'] for f in newf]
          assert len(newids)==50 and len(set(newids))==50
          feats.extend(newf); geo['features']=feats; AFTER=len(feats)
          assert AFTER==TARGET and AFTER>BEFORE
          now=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          geo_text=json.dumps(geo,ensure_ascii=False,indent=2)+'\n'; GEO.write_text(geo_text,encoding='utf-8')
          geo_sha=hashlib.sha256(geo_text.encode()).hexdigest(); types=collections.Counter(r['building_type_primary'] for r in records)

          man['generated_at']=now; man['total_features']=AFTER; man['feature_count']=AFTER; man['classified']=int(man.get('classified',0))+50
          man['unknown']=int(man.get('unknown',0)); man.setdefault('evidence_distribution',{})['B']=int(man.get('evidence_distribution',{}).get('B',0))+50
          man.setdefault('confidence_level_distribution',{})['3']=int(man.get('confidence_level_distribution',{}).get('3',0))+50
          td=man.setdefault('type_distribution',{})
          for k,v in types.items(): td[k]=int(td.get(k,0))+v
          man.setdefault('sources',[]).append({'name':'OpenStreetMap API 0.6 - Rotherham batch 17','url':BASE,'license':'ODbL 1.0','features_used':50,
            'accessed_at':now,'source_sha256':source_sha,'source_hash_method':'sha256_concatenated_successful_osm_xml_tiles','query_sha256':query_sha,
            'query_urls':urls,'failed_tile_count':len(failed),'grid_id':GRID,'note':'50 new evidence-backed semantic building records from runtime-only OSM XML tiles; no raw source committed.'})
          man['fake_data']=False
          if 'final_ready' in man: man['final_ready']=False
          man.update({'note':'Existing 800-feature shard preserved; appended 50 Rotherham OSM API records outside feature.id/parcel_id/osm_id already_processed_ids.',
            'geojson_sha256':geo_sha,'geojson_path':str(GEO),'manifest_updated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,
            'added_feature_count':50,'last_batch_city':CITY,'last_batch_source':'OpenStreetMap API 0.6 map endpoint','last_batch_source_sha256':source_sha,
            'last_batch_query_sha256':query_sha,'last_batch_grid':GRID})
          MAN.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sta['state']='IN_PROGRESS'; sta['updated_at']=now; sta['classified_count']=int(sta.get('classified_count',0))+50; sta['unknown_count']=int(sta.get('unknown_count',0)); sta['total_elements']=AFTER
          sta.setdefault('confidence_distribution',{})['3']=int(sta.get('confidence_distribution',{}).get('3',0))+50; sta.setdefault('evidence_distribution',{})['B']=int(sta.get('evidence_distribution',{}).get('B',0))+50
          sta.update({'output_sha256':geo_sha,'note':'Batch 17 appended 50 new Rotherham OSM API evidence-backed building features; no fake rows.','fake_data':False,'feature_count_before':BEFORE,
            'feature_count_after':AFTER,'current_feature_count':AFTER,'next_batch_index':18,'next_target_feature_count':900,'last_batch_city':CITY,'last_batch_grid':GRID,
            'last_batch_source_sha256':source_sha,'last_batch_query_sha256':query_sha,'owner_claim_created':False,'progress':True})
          if 'final_ready' in sta: sta['final_ready']=False
          STA.write_text(json.dumps(sta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp['updated_at']=now; cp['first_unverified_step_status']='BATCH_017_APPENDED_50_ROTHERHAM_OSM_FEATURES_CONTINUATION_REQUIRED'; cp['state']='IN_PROGRESS'
          cp.update({'feature_count_before':BEFORE,'feature_count_after':AFTER,'current_feature_count':AFTER,'next_batch_index':18,'next_target_feature_count':900,
            'last_processed_ids_sample':newids[-20:],'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION',
            'fake_data':False,'processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],'next_city_index':18})
          cp.setdefault('summary',{})['new_features_appended']=int(cp.get('summary',{}).get('new_features_appended',0))+50
          cp['last_batch']={'batch_index':BATCH,'city':CITY,'grid_id':GRID,'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE,'source_sha256':source_sha,
            'query_sha256':query_sha,'evidence_level':'B','confidence_level_1_to_4':3,'added_feature_count':50,'new_feature_ids':newids}
          if 'final_ready' in cp: cp['final_ready']=False
          CP.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          run={'slot_id':SLOT,'continuation_key':CONT,'batch_index':BATCH,'city':CITY,'grid_id':GRID,'generated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,
            'added_feature_count':50,'progress':True,'already_processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],'already_processed_id_count_before':already_count,
            'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE,'source_urls':urls,'source_sha256':source_sha,'query_sha256':query_sha,'evidence_level_new_features':{'B':50},
            'confidence_level_new_features':{'3':50},'new_feature_ids':newids,'records':records,'fake_data':False,'owner_claim_created':False,'raw_source_committed':False,
            'failed_source_tiles':failed,'limitation':'OSM building identities with node or way-center geometry; not cadastral parcel polygons. EPC/VOA/HMLR corroboration remains pending.'}
          RUN.write_text(json.dumps(run,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert len(load(GEO).get('features') or [])==850 and load(MAN).get('feature_count')==850 and load(CP).get('current_feature_count')==850
          print(json.dumps({'before':800,'after':850,'added':50,'already_processed_ids':already_count,'successful_tiles':len(urls),'failed_tiles':len(failed),'source_sha256':source_sha,'query_sha256':query_sha,'new_types':dict(types)},sort_keys=True))
          PY

      - name: Validate, guard remote state, self-delete, commit and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_rotherham_20260810.yml'
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'),Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'),Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'),Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')]
          man,sta,cp,run=[json.loads(p.read_text()) for p in paths]
          geo=json.loads(Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson').read_text()); feats=geo.get('features') or []
          assert len(feats)==850 and man.get('feature_count')==850 and sta.get('current_feature_count')==850 and cp.get('current_feature_count')==850
          assert run.get('feature_count_before')==800 and run.get('feature_count_after')==850 and run.get('added_feature_count')==50 and len(run.get('records') or [])==50
          assert run.get('evidence_level_new_features')=={'B':50} and run.get('confidence_level_new_features')=={'3':50}
          for r in run['records']:
            assert r.get('source_url') and r.get('source_hash') and r.get('query_sha256') and r.get('evidence_excerpt') and r.get('evidence_level')=='B' and r.get('confidence_level_1_to_4')==3
          seen={}
          for i,f in enumerate(feats):
            p=f.get('properties') or {}
            for v in {str(x) for x in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if x not in (None,'')}:
              if v in seen and seen[v]!=i: raise AssertionError(f'duplicate identifier {v}')
              seen[v]=i
          assert all(x.get('fake_data') is False for x in (man,sta,cp,run)); assert all(x.get('final_ready') is not True for x in (man,sta,cp,run)); assert 'PUBLISHED' not in json.dumps([man,sta,cp,run])
          print('validated Rotherham 800->850 +50')
          PY
          git fetch origin "$BRANCH"
          python3 - <<'PY'
          import json,subprocess
          B='origin/codex/aays-single-runner-v5-20260706'
          cp=json.loads(subprocess.check_output(['git','show',f'{B}:docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'],text=True))
          task=json.loads(subprocess.check_output(['git','show',f'{B}:docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'],text=True))
          assert cp.get('current_feature_count')==800 and cp.get('next_batch_index')==17 and cp.get('next_target_feature_count')==850
          assert task.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and task.get('owner') is None
          print('remote pre-push guard 800/batch17')
          PY
          git add england_map_web/data/building_type/shards/building_type_9_latest.geojson england_map_web/data/building_type/shards/building_type_9_manifest_latest.json
          git add -f docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json
          git rm -f "$WF"
          git diff --cached --quiet && { echo 'No staged progress'; exit 1; }
          git commit -m 'building_type_9: append batch 17 Rotherham OSM API features'
          for n in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          exit 1

      - name: Verify remote slot9 readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_rotherham_20260810.yml'
          git fetch origin "$BRANCH"
          python3 - <<'PY'
          import json,subprocess
          B='origin/codex/aays-single-runner-v5-20260706'
          def r(p): return json.loads(subprocess.check_output(['git','show',f'{B}:{p}'],text=True))
          cp=r('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'); sta=r('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'); man=r('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'); run=r('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          assert cp.get('current_feature_count')==850 and cp.get('feature_count_before')==800 and cp.get('feature_count_after')==850 and cp.get('next_batch_index')==18 and cp.get('next_target_feature_count')==900
          assert sta.get('current_feature_count')==850 and man.get('feature_count')==850 and run.get('batch_index')==17 and run.get('city')=='Rotherham' and run.get('added_feature_count')==50
          assert run.get('evidence_level_new_features')=={'B':50} and run.get('confidence_level_new_features')=={'3':50} and run.get('fake_data') is False and run.get('raw_source_committed') is False
          assert all(x.get('final_ready') is not True for x in (cp,sta,man,run)) and 'PUBLISHED' not in json.dumps([cp,sta,man,run])
          print(json.dumps({'remote_head':subprocess.check_output(['git','rev-parse',B],text=True).strip(),'before':800,'after':850,'added':50,'city':'Rotherham','source_sha256':run.get('source_sha256'),'query_sha256':run.get('query_sha256'),'successful_tiles':len(run.get('source_urls') or []),'failed_tiles':len(run.get('failed_source_tiles') or [])},sort_keys=True))
          PY
          if git cat-file -e "origin/$BRANCH:$WF" 2>/dev/null; then echo 'temporary workflow still exists remotely'; exit 1; fi
          echo 'remote readback verified and workflow removed'
