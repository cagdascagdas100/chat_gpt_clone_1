name: AAYS building_type_7 batch154 state normalize
on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: ['.github/workflows/aays-bt7-batch154-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 5
          clean: false
      - name: Normalize verified batch 154 state
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, datetime
          SLOT='building_type_7'; DATA_COMMIT='7412725e'
          class_path=f'docs/chatgpt_status/building_type/slots/{SLOT}/runner_outputs/{SLOT}_classification_latest.json'
          cp_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/checkpoint_latest.json'
          status_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/status_latest.json'
          task_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/current_task_latest.json'
          shard_path=f'england_map_web/data/building_type/shards/{SLOT}_latest.geojson'
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f)
          def dump(p,o):
              with open(p,'w',encoding='utf-8') as f: json.dump(o,f,ensure_ascii=False,indent=2); f.write('\n')
          report=load(class_path); cp=load(cp_path); status=load(status_path); task=load(task_path)
          if report.get('feature_count_before')!=7650 or report.get('feature_count_after')!=7700 or report.get('new_feature_count')!=50 or report.get('batch_index')!=154:
              raise SystemExit('REMOTE_READBACK_MISMATCH')
          with open(shard_path,'rb') as f: shard_sha=hashlib.sha256(f.read()).hexdigest()
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          cp['remote_readback_verified']=True; cp['remote_data_commit']=DATA_COMMIT; cp['output_sha256']=shard_sha
          cp['hydration_state']='REMOTE_HEAD_HYDRATED_CONTINUATION_ADVANCED'
          cp['first_unverified_step']='APPEND_NEW_BATCH_155_AFTER_FEATURE_7700'; cp['first_unverified_step_status']='READY'
          cp['next_required_action']='CONTINUE_BATCH_155_FROM_7700_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES'
          cp['remaining_items']={'osm_building_tag_scan_pending':True,'epc_residential_pending':True,'note':'Next batch 155: treat all 7700 canonical feature.id/feature_id/parcel_id/osm_id/source_ref values as already_processed_ids and append 50 genuinely new West Midlands records; do not replay prior batches.'}
          cp['summary']['note']='PROGRESS: feature_count 7650 -> 7700. Batch 154 Kenilworth_NorthEast_A persisted and remote readback verified; continue at batch 155. final_ready remains false.'
          cp['updated_at']=now; cp['final_ready']=False; cp['fake_data']=False
          status['remote_readback_verified']=True; status['remote_data_commit']=DATA_COMMIT; status['output_sha256']=shard_sha
          status['note']='Appended 50 unique Kenilworth_NorthEast_A OSM building elements after processed-ID exclusion; remote readback verified; no second task/owner created.'
          status['updated_at']=now; status['final_ready']=False; status['fake_data']=False; status['owner']=None; status['blocker']=None
          task['continuation_key']='building-type-7-england-classification-v1-20260808'; task['owner']=None; task['updated_at']=now
          task['first_unverified_step']='APPEND_NEW_BATCH_155_AFTER_FEATURE_7700'; task['blocker']=None; task['final_ready']=False; task['fake_data']=False
          dump(cp_path,cp); dump(status_path,status); dump(task_path,task)
          print(json.dumps({'verified':True,'before':7650,'after':7700,'next_batch':155,'shard_sha256':shard_sha}))
          PY
      - name: Commit normalized state safely
        shell: bash
        run: |
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json
          git diff --cached --quiet || git commit -m 'chore(aays): verify building_type_7 batch 154 readback'
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          git push origin HEAD:codex/aays-single-runner-v5-20260706
