name: security-public-safety-2-wave62-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave62_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture wave62 run
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          mkdir -p docs/chatgpt_status/_shared/slots_21/security_public_safety_2
          gh run list --repo "$GITHUB_REPOSITORY" --workflow security_public_safety_2_wave62_incremental.yml --limit 5 --json databaseId,status,conclusion,attempt,createdAt,startedAt,updatedAt,headSha,event,url,workflowName > /tmp/runs.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          runs = json.loads(Path('/tmp/runs.json').read_text())
          payload = {
              'schema_version': 1,
              'slot_id': 'security_public_safety_2',
              'task_id': 'security_public_safety_2_priority_7340row_incremental_evidence_expansion_20260730',
              'continuation_key': '6caf87b26dd9c91bae533642684b4d4e4db47145de0ef5ed36a8d9a392cecd4d',
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'runs': runs,
          }
          Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave62_run_diagnostic_20260730.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave62_run_diagnostic_20260730.json
          git commit -m 'record security_public_safety_2 wave62 run diagnostic'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
