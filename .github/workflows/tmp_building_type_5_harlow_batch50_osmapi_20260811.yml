name: AAYS building_type_5 Harlow batch50 OSM API

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_5_harlow_batch50_osmapi_20260811.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-5-harlow-batch50
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Refresh branch and verify continuation base
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git merge-base --is-ancestor 76422300f5dee2d2be3fd68b287fce19686da07d HEAD

      - name: Append exactly 50 new Harlow features from OpenStreetMap API 0.6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          src = Path('.github/workflows/tmp_building_type_5_dereham_batch47_osmapi_fallback_20260811.yml').read_text(encoding='utf-8')
          step = "      - name: Append exactly 50 new Dereham features from OpenStreetMap API 0.6\n"
          pos = src.index(step)
          marker = "          python - <<'PY'\n"
          start = src.index(marker, pos) + len(marker)
          end = src.index("\n          PY", start)
          code = textwrap.dedent(src[start:end])

          replacements = [
              ("CITY='Dereham'; AUTHORITY='Breckland'; GRID='DEREHAM_01'", "CITY='Harlow'; AUTHORITY='Harlow'; GRID='HARLOW_01'"),
              ("BATCH=47; EXPECTED_BEFORE=2300; TARGET_AFTER=2350; NEXT_TARGET=2400", "BATCH=50; EXPECTED_BEFORE=2450; TARGET_AFTER=2500; NEXT_TARGET=2550"),
              ("if any('dereham' in str((f.get('properties') or {}).get('area','')).lower() for f in features): raise SystemExit('fail closed: Dereham already present')", "if any('harlow' in str((f.get('properties') or {}).get('area','')).lower() for f in features): raise SystemExit('fail closed: Harlow already present')"),
              ("xs=[0.9150,0.9350,0.9550,0.9750]", "xs=[0.0750,0.0900,0.1050,0.1200]"),
              ("ys=[52.6650,52.6800,52.6950]", "ys=[51.7500,51.7625,51.7750]"),
              ("only {len(chosen)} new Dereham building ways found", "only {len(chosen)} new Harlow building ways found"),
              ("BATCH_{BATCH}_APPENDED_50_DEREHAM_OSMAPI_CONTINUATION_REQUIRED", "BATCH_{BATCH}_APPENDED_50_HARLOW_OSMAPI_CONTINUATION_REQUIRED"),
              ("Free public OSM API fallback after three Overpass 502 responses. Real building ways only; raw XML runtime-only.", "Free public OSM API fallback retained because prior slot evidence records the allowed Overpass retries as failed. Real building ways only; raw XML runtime-only."),
              ("'overpass_failure':'3 attempts returned HTTP 502; switched endpoint without replaying IDs'", "'overpass_failure':'prior slot evidence records the allowed Overpass retries failed; OSM API fallback reused without replaying IDs'"),
              ("Overpass failed 3x HTTP 502 then free OSM API fallback succeeded", "prior slot evidence recorded allowed Overpass retries failed; free OSM API fallback reused without replaying IDs")
          ]
          for old, new in replacements:
              if old not in code:
                  raise SystemExit(f'fail closed: expected generator fragment missing: {old[:100]}')
              code = code.replace(old, new)

          exec(compile(code, '<building_type_5_harlow_batch50>', 'exec'), {'__name__':'__main__'})
          PY

      - name: Validate, commit and push slot-only outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          geo_path=Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson')
          runner_path=Path('docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json')
          status_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          task_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          manifest_path=Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json')

          g=json.loads(geo_path.read_text(encoding='utf-8'))
          assert len(g.get('features',[]))==2500
          new=g['features'][-50:]
          assert len(new)==50 and all((f.get('properties') or {}).get('area')=='Harlow' for f in new)
          for f in new:
              p=f.get('properties') or {}
              assert p.get('fake_data') is False and p.get('final_ready') is False
              assert p.get('evidence_level') in {'B','U'}
              assert p.get('confidence_level_1_to_4') in {1,2,3,4}
              assert isinstance(p.get('evidence_excerpt'),dict) and p.get('sources') and p.get('source_hash')
              assert p.get('source')=='OpenStreetMap API 0.6'
          ids=[str(f.get('id')) for f in g['features'] if f.get('id') is not None]
          parcels=[str((f.get('properties') or {}).get('parcel_id')) for f in g['features'] if (f.get('properties') or {}).get('parcel_id') is not None]
          osms=[str((f.get('properties') or {}).get('osm_id')) for f in g['features'] if (f.get('properties') or {}).get('osm_id') is not None]
          assert len(ids)==len(set(ids)) and len(parcels)==len(set(parcels)) and len(osms)==len(set(osms))

          r=json.loads(runner_path.read_text(encoding='utf-8'))
          assert r['task_id']=='building-type-5-england-classification-v1-20260808'
          assert r['continuation_key']==''
          assert r['batch_index']==50 and r['city']=='Harlow' and r['grid_id']=='HARLOW_01'
          assert r['feature_count_before']==2450 and r['feature_count_after']==2500 and r['new_feature_count']==50
          assert r['fake_data'] is False and r['final_ready'] is False

          cp=json.loads(cp_path.read_text(encoding='utf-8'))
          assert cp['current_feature_count']==2500 and cp['feature_count_before']==2450 and cp['feature_count_after']==2500
          assert cp['next_batch_index']==51 and cp['next_target_feature_count']==2550
          assert cp['last_batch']['city']=='Harlow' and cp['last_batch']['grid_id']=='HARLOW_01' and cp['last_batch']['added_feature_count']==50
          assert cp['continuation_key']=='' and cp['fake_data'] is False and cp['final_ready'] is False

          s=json.loads(status_path.read_text(encoding='utf-8'))
          assert s['task_id']=='building-type-5-england-classification-v1-20260808' and s['owner'] is None
          assert s['continuation_key']=='' and s['current_feature_count']==2500 and s['progress_count_delta']==50
          assert s['feature_count_before']==2450 and s['feature_count_after']==2500
          assert s['fake_data'] is False and s['final_ready'] is False

          t=json.loads(task_path.read_text(encoding='utf-8'))
          assert t['task_id']=='building-type-5-england-classification-v1-20260808' and t['owner'] is None
          assert t['continuation_key']==''
          assert t['last_progress']['batch_index']==50 and t['last_progress']['feature_count_before']==2450 and t['last_progress']['feature_count_after']==2500
          assert t['fake_data'] is False and t['final_ready'] is False

          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert m['total_features']==2500 and m['feature_count']==2500
          assert m['fake_data'] is False and m['final_ready'] is False
          assert m['classified'] + m['unknown'] == 2500
          print('validated building_type_5 Harlow batch50', r['known_type_count'], r['unknown_type_count'])
          PY

          git config user.name 'aays-building-type-5-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add england_map_web/data/building_type/shards/building_type_5_latest.geojson \
                  england_map_web/data/building_type/shards/building_type_5_manifest_latest.json \
                  docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json

          expected=$(printf '%s\n' \
            'docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json' \
            'docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json' \
            'england_map_web/data/building_type/shards/building_type_5_latest.geojson' \
            'england_map_web/data/building_type/shards/building_type_5_manifest_latest.json' | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected" || { echo 'unexpected staged paths'; printf '%s\n' "$actual"; exit 1; }
          git diff --cached --quiet && { echo 'no slot progress to commit'; exit 1; }
          git commit -m 'Append building_type_5 Harlow batch 50'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            git fetch origin codex/aays-single-runner-v5-20260706
            git rebase origin/codex/aays-single-runner-v5-20260706
            sleep $((i*2))
          done
          exit 1
