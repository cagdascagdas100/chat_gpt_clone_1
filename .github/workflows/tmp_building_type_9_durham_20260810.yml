name: tmp building_type_9 Wakefield batch 12

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_9_durham_20260810.yml]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Fast-forward and execute guarded batch 12
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import os, re, subprocess, textwrap
          path='.github/workflows/tmp_building_type_9_durham_20260810.yml'
          prev=subprocess.check_output(['git','show',f"{os.environ['GITHUB_SHA']}^:{path}"],text=True)
          m=re.search(r"(?ms)^          python - <<'PY'\n(.*?)^          PY\n",prev)
          if not m: raise RuntimeError('previous batch Python body not found')
          s=textwrap.dedent(m.group(1))
          repl=[
            ("BEFORE=500; BATCH=11; TARGET=550; CITY='Middlesbrough'; GRID='MIDDLESBROUGH_CENTRAL_01'",
             "BEFORE=550; BATCH=12; TARGET=600; CITY='Wakefield'; GRID='WAKEFIELD_CENTRAL_01'"),
            ("tiles=[(-1.260,54.555,-1.225,54.580),(-1.225,54.555,-1.190,54.580),(-1.260,54.580,-1.225,54.605),(-1.225,54.580,-1.190,54.605)]",
             "tiles=[(-1.535,53.660,-1.500,53.685),(-1.500,53.660,-1.465,53.685),(-1.535,53.685,-1.500,53.710),(-1.500,53.685,-1.465,53.710)]"),
            ("'next_batch_index':12","'next_batch_index':13"),
            ("'next_target_feature_count':600","'next_target_feature_count':650"),
            ("'next_city_index':12","'next_city_index':13"),
            ("'batch_index':11","'batch_index':12"),
            ("BATCH_011","BATCH_012"),
            ("MIDDLESBROUGH","WAKEFIELD"),
            ("Middlesbrough","Wakefield"),
            ("Batch 11","Batch 12"),
            ("batch 11","batch 12")
          ]
          for a,b in repl:
              if a not in s: raise RuntimeError(f'missing template token: {a}')
              s=s.replace(a,b)
          forbidden=["Middlesbrough","MIDDLESBROUGH","BATCH_011","'batch_index':11","'next_batch_index':12","'next_target_feature_count':600"]
          if any(x in s for x in forbidden): raise RuntimeError('stale batch-11 token remains')
          exec(compile(s,'batch12_wakefield.py','exec'),{'__name__':'__main__'})
          PY
          git config user.name "AAYS building_type_9 continuation"
          git config user.email "aays-building-type-9@local.invalid"
          git add england_map_web/data/building_type/shards/building_type_9_latest.geojson \
                  england_map_web/data/building_type/shards/building_type_9_manifest_latest.json \
                  docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "building_type_9: append batch 12 Wakefield OSM API features"
          for n in 1 2 3; do
            if ! git pull --rebase origin codex/aays-single-runner-v5-20260706; then
              git rebase --abort || true
              exit 1
            fi
            python - <<'PY'
          import json, pathlib
          cp=json.loads(pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json').read_text())
          ct=json.loads(pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json').read_text())
          assert ct.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          assert ct.get('owner') is None
          assert cp.get('current_feature_count')==600 and cp.get('next_batch_index')==13 and cp.get('next_target_feature_count')==650
          assert cp.get('fake_data') is False and cp.get('final_ready') is False
          PY
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            sleep 4
          done
          exit 1
