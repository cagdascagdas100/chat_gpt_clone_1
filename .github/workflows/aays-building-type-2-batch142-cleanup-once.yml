name: AAYS building_type_2 batch142 metadata cleanup

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-batch142-cleanup-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-batch142-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
      - name: Fast-forward canonical branch
        run: git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Normalize metadata and validate batch142
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          S=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          C=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          M=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          R=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          G=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def dump(p,x): p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          s,c,m,r,g=map(load,(S,C,M,R,G))
          assert len(g.get('features') or [])==7100
          assert r.get('batch_index')==142 and r.get('city')=='Edgware' and r.get('local_authority')=='Barnet'
          assert r.get('feature_count_before')==7050 and r.get('feature_count_after')==7100 and r.get('new_feature_count')==50
          assert r.get('evidence_distribution_new')=={'B':50} and r.get('confidence_distribution_new')=={'3':50}
          ids=[x.get('feature_id') for x in r.get('records') or []]
          assert len(ids)==50 and len(set(ids))==50 and all(ids)
          batch={
            'batch_index':142,'city':'Edgware','local_authority':'Barnet','grid_id':'uk-grid-edgware-001',
            'bbox_wgs84':[-0.3,51.6,-0.25,51.635],'added_feature_count':50,
            'source':'OpenStreetMap Overpass API','source_url':r['source_url'],'source_sha256':r['source_sha256'],
            'classification_basis':'deterministic_osm_building_use_tag_rules_v1',
            'evidence_level_distribution':{'B':50},'confidence_level_distribution':{'3':50}
          }
          s.update({
            'state':'READY','feature_count_before':7050,'feature_count_after':7100,'current_feature_count':7100,
            'total_elements':7100,'total_features':7100,'classified_count':6920,'classified':6920,'unknown_count':180,'unknown':180,
            'confidence_distribution':{'1':180,'2':6795,'3':125},'confidence_level_distribution':{'1':180,'2':6795,'3':125},
            'evidence_distribution':{'B':125,'C':170,'D':6625,'U':180},'last_batch':batch,'last_batch_city':'Edgware',
            'last_batch_added_feature_count':50,'last_batch_source':'OpenStreetMap Overpass API',
            'last_batch_evidence_distribution':{'B':50},'last_batch_confidence_distribution':{'3':50},
            'last_batch_index':142,'progress_count_delta':50,'new_feature_count':50,'new_features_added':50,'progress_counted':True,
            'next_batch_index':143,'next_target_feature_count':7150,'candidate_batch':None,'no_progress_reason':None,
            'progress_reason':'50 new Edgware OSM building elements appended after feature.id/parcel_id/osm_id exclusion',
            'note':'Batch 142 appended 50 unique Edgware/Barnet OSM building elements; same task retained and owner remains null.',
            'blocker':None,'fake_data':False,'final_ready':False,'continuation_key':''
          })
          c['summary'].update({
            'note':'PROGRESS: feature_count 7050 -> 7100. Existing feature.id, parcel_id and osm_id values treated as already_processed_ids; 50 new Edgware/Barnet OSM building elements appended.',
            'new_features_appended':50,'current_feature_count':7100,'new_features_added_this_attempt':50,'progress_counted':True
          })
          c['remaining_items']['note']='Next step batch 143: treat all 7100 feature.id/parcel_id/osm_id values as already_processed_ids and append exactly 50 new London Outer features; do not replay prior records.'
          c['last_batch']={**batch,'new_feature_ids':ids,'evidence_level':'B','confidence_level_1_to_4':3}
          c['source_access_evidence']={'edgware_barnet_source_sha256':r['source_sha256']}
          c.update({'state':'READY','terminal_status':'READY','feature_count_before':7050,'feature_count_after':7100,'current_feature_count':7100,'next_batch_index':143,'next_target_feature_count':7150,'next_city_index':143,'last_city':'Edgware','last_batch_index':142,'last_grid_id':'uk-grid-edgware-001','last_bbox_wgs84':[-0.3,51.6,-0.25,51.635],'next_required_action':'CONTINUE_BATCH_143_FROM_7100_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES','fake_data':False,'final_ready':False,'candidate_batch':None,'no_progress_reason':None})
          fixed=False
          for src in m.get('sources') or []:
            if src.get('name')=='OpenStreetMap Overpass API - Edgware/East Lindsey':
              src['name']='OpenStreetMap Overpass API - Edgware/Barnet'
              src['note']='Runtime-only Overpass response; raw source not committed. building=* evidence from Edgware/Barnet bbox.'
              fixed=True
          assert fixed
          m.update({'total_features':7100,'classified':6920,'unknown':180,'feature_count':7100,'feature_count_before':7050,'feature_count_after':7100,'fake_data':False,'final_ready':False,'note':'Existing 7050 features preserved; Edgware/Barnet batch 142 appended 50 unique runtime Overpass features with already_processed_ids dedupe.'})
          dump(S,s); dump(C,c); dump(M,m)
          # final local invariants
          s,c,m=map(load,(S,C,M))
          assert s['current_feature_count']==7100 and s['last_batch']['batch_index']==142 and s['last_batch']['city']=='Edgware'
          assert c['current_feature_count']==7100 and c['last_batch']['batch_index']==142 and c['last_batch']['new_feature_ids']==ids
          assert any(x.get('name')=='OpenStreetMap Overpass API - Edgware/Barnet' for x in m['sources'])
          print('METADATA_NORMALIZED building_type_2 7050->7100 batch142 Edgware/Barnet')
          PY
      - name: Remove one-shot helpers and commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/aays-building-type-2-batch142-edgware-once.yml .github/workflows/aays-building-type-2-batch142-cleanup-once.yml
          git add england_map_web/data/building_type/shards/building_type_2_manifest_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          git commit -m 'data(building_type_2): normalize batch142 Edgware metadata and cleanup helpers'
          for a in 1 2 3 4 5; do git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0; git fetch origin codex/aays-single-runner-v5-20260706 --depth=20; git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }; done; exit 1
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_2_latest.geojson'); m=j('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json'); s=j('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json'); c=j('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json'); r=j('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'); t=j('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(g['features'])==7100 and m['total_features']==7100 and s['current_feature_count']==7100 and c['current_feature_count']==7100
          assert s['last_batch']['batch_index']==142 and c['last_batch']['batch_index']==142 and r['batch_index']==142
          assert r['new_feature_count']==50 and r['confidence_distribution_new']=={'3':50} and r['evidence_distribution_new']=={'B':50}
          assert t.get('owner') in (None,'') and (t.get('continuation_key') or '')==''
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (m,s,c,r,t))
          for p in ['.github/workflows/aays-building-type-2-batch142-edgware-once.yml','.github/workflows/aays-building-type-2-batch142-cleanup-once.yml']:
            cp=subprocess.run(['git','cat-file','-e','origin/codex/aays-single-runner-v5-20260706:'+p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            assert cp.returncode!=0
          print('REMOTE_READBACK_NORMALIZED_OK building_type_2 7050->7100 batch142 Edgware/Barnet helpers_removed')
          PY
