name: security-public-safety-2-wave122-boundary-edge-micro-offset-exact-pair

on:
  pull_request:
    paths:
      - ".github/wave122-security-public-safety-2.trigger.txt"

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave122-boundary-edge-micro-offset-exact-pair
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Run official boundary-edge micro-offset audit
        run: |
          export AAYS_SOURCE_HEAD="$(git rev-parse HEAD)"
          python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave122_boundary_edge_micro_offset_exact_pair_audit_20260731.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          data_path = root / "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_boundary_edge_micro_offset_exact_pair_wave122_latest.json"
          html_path = root / "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_boundary_edge_micro_offset_exact_pair_wave122.html"
          data = json.loads(data_path.read_text(encoding="utf-8"))
          assert data["state"] == "COMPLETED_BOUNDARY_EDGE_MICRO_OFFSET_EXACT_PAIR_AUDIT_PUBLISHED"
          assert data["scope"]["rows_audited"] == 16
          assert data["scope"]["wave119_held_rows"] == 2
          assert data["scope"]["wave120_held_rows"] == 5
          assert data["scope"]["wave121_held_rows"] == 9
          assert len(data["rows"]) == 16
          assert len({row["parcel_id"] for row in data["rows"]}) == 16
          assert data["result"]["prior_high_confidence_support_rows"] == 30745
          assert data["result"]["official_network_probe_count"] == 288
          assert data["result"]["total_operations"] == 359
          assert data["result"]["completed_or_fail_closed_operations"] == 359
          assert data["result"]["blocked_operations"] == 0
          assert data["result"]["blocked_rows"] == 0
          assert data["sources"]["promoted_official_source_families"] == 4
          assert data["scope"]["candidate_values_changed"] == 0
          assert data["scope"]["business_rows_written"] == 0
          assert data["quality_policy"]["parent_candidate_accuracy_mutated"] is False
          assert data["fake_data"] is False
          assert html_path.read_text(encoding="utf-8").count("<tr>") == 17
          print(json.dumps(data["result"], ensure_ascii=False))
          PY

      - name: Publish audit to moving canonical branch
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_boundary_edge_micro_offset_exact_pair_wave122_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_boundary_edge_micro_offset_exact_pair_wave122.html
          if ! git diff --cached --quiet; then
            git commit -m "security_public_safety_2: publish Wave122 boundary-edge audit [skip ci]"
          fi
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target_branch"
            git rebase "origin/$target_branch"
            if git push origin "HEAD:$target_branch"; then
              published=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Remote file readback
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git fetch origin "$target_branch"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          branch = "origin/codex/aays-single-runner-v5-20260706"
          json_path = "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_boundary_edge_micro_offset_exact_pair_wave122_latest.json"
          html_path = "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_boundary_edge_micro_offset_exact_pair_wave122.html"
          data_bytes = subprocess.check_output(["git", "show", f"{branch}:{json_path}"])
          html_bytes = subprocess.check_output(["git", "show", f"{branch}:{html_path}"])
          data = json.loads(data_bytes.decode("utf-8"))
          assert len(data["rows"]) == 16
          assert data["result"]["total_operations"] == 359
          assert data["result"]["blocked_operations"] == 0
          assert data["result"]["blocked_rows"] == 0
          assert html_bytes.decode("utf-8").count("<tr>") == 17
          print(json.dumps({
              "state": data["state"],
              "result": data["result"],
              "recovery": data.get("recovery"),
              "continuation_key": data.get("continuation_key"),
              "source_head": data.get("source_head"),
              "json_sha256": hashlib.sha256(data_bytes).hexdigest(),
              "html_sha256": hashlib.sha256(html_bytes).hexdigest(),
              "remote_head": subprocess.check_output(["git", "rev-parse", branch], text=True).strip(),
          }, ensure_ascii=False))
          PY
