name: AAYS building_type_6 Oakham OSM one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_6_oakham_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-6-oakham-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward to latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append 50 evidence-backed Oakham OSM records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          SLOT = "building_type_6"
          TASK = "building-type-6-england-classification-v1-20260808"
          CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"
          CITY = "Oakham"
          LOCAL_AUTHORITY = "Rutland"
          REGION = "East Midlands"
          BATCH_INDEX = 5
          EXPECTED_BEFORE = 200
          TARGET_AFTER = 250
          NEXT_BATCH_INDEX = 6
          NEXT_TARGET = 300
          GEO = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_latest.geojson")
          MAN = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_manifest_latest.json")
          STA = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json")
          CP = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json")
          CT = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json")
          RUN = pathlib.Path("docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json")
          ENDPOINT = "https://overpass-api.de/api/interpreter"
          NOW = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          SOURCE_HEAD = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def load(path):
              with path.open(encoding="utf-8") as fh:
                  return json.load(fh)

          def dump(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          task = load(CT)
          status = load(STA)
          checkpoint = load(CP)
          if task.get("task_id") != TASK or status.get("task_id") != TASK:
              raise SystemExit("task mismatch; refusing second/replacement task")
          if task.get("owner") not in (None, "") or status.get("owner") not in (None, ""):
              raise SystemExit("live owner detected; refusing second owner/task")
          for obj, label in ((task, "task"), (status, "status"), (checkpoint, "checkpoint")):
              if obj.get("continuation_key") != CONT:
                  raise SystemExit(f"{label} continuation_key changed; refusing stale continuation")
          if status.get("final_ready") is True or task.get("final_ready") is True or checkpoint.get("final_ready") is True:
              raise SystemExit("final_ready unexpectedly true; refusing mutation")
          if status.get("fake_data") not in (None, False) or task.get("fake_data") is not False or checkpoint.get("fake_data") is not False:
              raise SystemExit("fake_data invariant failed before fetch")

          geo = load(GEO)
          feats = geo.get("features")
          if not isinstance(feats, list):
              raise SystemExit("invalid GeoJSON feature list")
          before = len(feats)
          if before != EXPECTED_BEFORE:
              raise SystemExit(f"shard count changed: expected {EXPECTED_BEFORE}, found {before}")

          already = set()
          represented = set()
          for feat in feats:
              fid = feat.get("id")
              if fid not in (None, ""):
                  already.add(str(fid))
              props = feat.get("properties") or {}
              for key in ("parcel_id", "osm_id"):
                  val = props.get(key)
                  if val not in (None, ""):
                      already.add(str(val))
              for key in ("area", "city", "local_authority"):
                  val = props.get(key)
                  if val:
                      represented.add(str(val).strip().casefold())
          if CITY.casefold() in represented or LOCAL_AUTHORITY.casefold() in represented:
              raise SystemExit("Oakham/Rutland already represented; refusing duplicate city batch")

          query = '''[out:json][timeout:90];
          nwr["building"](around:5000,52.6706,-0.7340);
          out body center qt 2500;
          '''
          payload = urllib.parse.urlencode({"data": query}).encode("utf-8")
          raw = None
          last_error = None
          for attempt_no in range(1, 4):
              try:
                  req = urllib.request.Request(
                      ENDPOINT,
                      data=payload,
                      headers={
                          "User-Agent": "TerraYield-AAYS-building_type_6/1.0",
                          "Accept": "application/json",
                          "Content-Type": "application/x-www-form-urlencoded",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read()
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  if attempt_no < 3:
                      time.sleep(5 * attempt_no)
          if raw is None:
              raise SystemExit(f"Overpass failed after 3 attempts: {last_error}")

          source_sha = hashlib.sha256(raw).hexdigest()
          data = json.loads(raw.decode("utf-8"))
          elements = data.get("elements") or []
          if not isinstance(elements, list):
              raise SystemExit("invalid Overpass response")

          residential_map = {
              "house": ("residential_house", "R_HOUSE"),
              "detached": ("residential_detached", "R_DET"),
              "semidetached_house": ("residential_semidetached", "R_SEMI"),
              "terrace": ("residential_terrace", "R_TERRACE"),
              "apartments": ("residential_apartments", "R_APARTMENT"),
              "bungalow": ("residential_bungalow", "R_BUNGALOW"),
              "residential": ("residential", "R_RESIDENTIAL"),
              "dormitory": ("residential_dormitory", "R_DORMITORY"),
          }
          specific_map = {
              "retail": ("commercial_retail", "C_RETAIL", "commercial"),
              "supermarket": ("commercial_retail", "C_RETAIL", "commercial"),
              "commercial": ("commercial", "C_COMMERCIAL", "commercial"),
              "office": ("office", "C_OFFICE", "commercial"),
              "hotel": ("hospitality", "C_HOSPITALITY", "commercial"),
              "industrial": ("industrial", "I_INDUSTRIAL", "industrial"),
              "warehouse": ("warehouse", "I_WAREHOUSE", "industrial"),
              "manufacture": ("industrial", "I_INDUSTRIAL", "industrial"),
              "school": ("education", "P_EDUCATION", "institutional"),
              "college": ("education", "P_EDUCATION", "institutional"),
              "university": ("education", "P_EDUCATION", "institutional"),
              "kindergarten": ("education", "P_EDUCATION", "institutional"),
              "hospital": ("healthcare_care", "H_CARE", "institutional"),
              "clinic": ("healthcare_care", "H_CARE", "institutional"),
              "church": ("religious", "P_RELIGIOUS", "institutional"),
              "chapel": ("religious", "P_RELIGIOUS", "institutional"),
              "cathedral": ("religious", "P_RELIGIOUS", "institutional"),
              "mosque": ("religious", "P_RELIGIOUS", "institutional"),
              "synagogue": ("religious", "P_RELIGIOUS", "institutional"),
              "barn": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
              "farm_auxiliary": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
              "stable": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
          }

          def classify(building):
              b = str(building or "").strip().lower()
              if b in residential_map:
                  primary, code = residential_map[b]
                  return primary, code, "residential", "B", 0.85, 3, False
              if b in specific_map:
                  primary, code, category = specific_map[b]
                  return primary, code, category, "B", 0.85, 3, False
              return "unknown", "U_UNKNOWN", "unknown", "U", 0.20, 1, True

          candidates = []
          seen_candidate = set()
          for el in elements:
              etype = str(el.get("type") or "")
              eid = el.get("id")
              tags = el.get("tags") or {}
              building = tags.get("building")
              if etype not in ("node", "way", "relation") or eid is None or not building:
                  continue
              center = el.get("center") or {}
              lat = el.get("lat", center.get("lat"))
              lon = el.get("lon", center.get("lon"))
              if lat is None or lon is None:
                  continue
              osm_id = f"{etype}/{eid}"
              fid = f"OAKHAM_OSM_{etype}_{eid}"
              if osm_id in already or str(eid) in already or fid in already or fid in seen_candidate:
                  continue
              seen_candidate.add(fid)
              primary, code, category, ev, conf, level, review = classify(building)
              evidence_parts = [f"OSM {osm_id}", f"building={building}"]
              for k in ("name", "amenity", "shop", "office", "tourism", "addr:street", "addr:housenumber", "addr:postcode"):
                  if tags.get(k):
                      evidence_parts.append(f"{k}={tags[k]}")
              excerpt = " | ".join(evidence_parts[:8])
              match = f"osm_building_tag:{str(building).strip().lower()}"
              props = {
                  "parcel_id": fid,
                  "parcel_id_semantics": "stable OSM element-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": osm_id,
                  "slot_id": SLOT,
                  "region": REGION,
                  "area": CITY,
                  "local_authority": LOCAL_AUTHORITY,
                  "postcode": str(tags.get("addr:postcode") or ""),
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": conf,
                  "confidence_level_1_to_4": level,
                  "evidence_level": ev,
                  "source_count": 1,
                  "source": "OpenStreetMap via Overpass API",
                  "source_url": f"https://www.openstreetmap.org/{etype}/{eid}",
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_overpass_response",
                  "match_method": match,
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": hashlib.sha256(excerpt.encode("utf-8")).hexdigest(),
                  "source_evidence_excerpt": {k: tags[k] for k in ("building", "name", "amenity", "shop", "office", "tourism", "addr:postcode") if k in tags},
                  "sources": [{
                      "source_name": "OpenStreetMap Overpass API",
                      "url_or_local_path": ENDPOINT,
                      "accessed_at": NOW,
                      "sha256": source_sha,
                      "sha256_scope": "raw_overpass_response",
                      "licence": "ODbL 1.0",
                      "granularity": "building_element",
                      "fields_used": ["building", "name", "amenity", "shop", "office", "tourism", "addr:postcode"],
                      "supports_field": "building_type_primary",
                      "match_method": match,
                      "match_score": conf
                  }],
                  "geometry_match_method": "osm_element_point_or_center",
                  "address_match_method": "osm_tags_when_present",
                  "limitations": "OSM building tag evidence only; no cadastral parcel binding or EPC/VOA corroboration in this batch.",
                  "needs_manual_review": review,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": NOW,
                  "feature_id": fid
              }
              candidates.append({
                  "type": "Feature",
                  "id": fid,
                  "geometry": {"type": "Point", "coordinates": [float(lon), float(lat)]},
                  "properties": props
              })

          candidates.sort(key=lambda f: (f["properties"]["evidence_level"] == "U", str(f["id"])))
          new_feats = candidates[:50]
          if len(new_feats) < 50:
              raise SystemExit(f"only {len(new_feats)} unique Oakham/Rutland building elements after dedupe; need 50")
          if any(f["id"] in already or f["properties"].get("parcel_id") in already or f["properties"].get("osm_id") in already for f in new_feats):
              raise SystemExit("already_processed_ids collision after selection")
          if any(f["properties"].get("fake_data") is not False or f["properties"].get("final_ready") is not False for f in new_feats):
              raise SystemExit("fake_data/final_ready invariant failed")

          feats.extend(new_feats)
          after = len(feats)
          if after != TARGET_AFTER or after <= before:
              raise SystemExit(f"progress invariant failed: before={before} after={after}")

          metadata = geo.get("metadata")
          if not isinstance(metadata, dict):
              metadata = {}
              geo["metadata"] = metadata
          metadata["feature_count"] = after
          metadata["updated_at"] = NOW
          metadata["last_batch_index"] = BATCH_INDEX
          metadata["last_batch_city"] = CITY
          metadata["fake_data"] = False
          metadata["final_ready"] = False
          if "feature_count" in geo:
              geo["feature_count"] = after
          dump(GEO, geo)
          geo_sha = hashlib.sha256(GEO.read_bytes()).hexdigest()

          all_props = [(f.get("properties") or {}) for f in feats]
          evidence_dist = collections.Counter(str(p.get("evidence_level") or "U") for p in all_props)
          type_dist = collections.Counter(str(p.get("building_type_primary") or "unknown") for p in all_props)
          conf_dist = collections.Counter(str(p.get("confidence_level_1_to_4") or 1) for p in all_props)
          unknown = sum(1 for p in all_props if str(p.get("building_type_primary") or "unknown") == "unknown")
          classified = after - unknown

          manifest = load(MAN)
          manifest["generated_at"] = NOW
          manifest["total_features"] = after
          manifest["feature_count"] = after
          manifest["classified"] = classified
          manifest["unknown"] = unknown
          manifest["evidence_distribution"] = {k: evidence_dist.get(k, 0) for k in ("A", "B", "C", "D", "U")}
          manifest["type_distribution"] = dict(sorted(type_dist.items()))
          manifest["confidence_level_distribution"] = {str(i): conf_dist.get(str(i), 0) for i in range(1, 5)}
          old_sources = manifest.get("sources") if isinstance(manifest.get("sources"), list) else []
          old_sources.append({
              "name": "OpenStreetMap Overpass API - Oakham/Rutland",
              "url": ENDPOINT,
              "license": "ODbL 1.0",
              "features_used": 50,
              "accessed_at": NOW,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_overpass_response",
              "note": "Runtime-only Overpass response; raw source not committed. building=* evidence from Oakham/Rutland 5 km grid."
          })
          manifest["sources"] = old_sources
          manifest["fake_data"] = False
          manifest["final_ready"] = False
          manifest["note"] = "Existing 200 features preserved; Oakham/Rutland batch 5 appended from runtime Overpass with already_processed_ids dedupe."
          manifest["geojson_sha256"] = geo_sha
          manifest["geojson_path"] = str(GEO)
          manifest["manifest_updated_at"] = NOW
          dump(MAN, manifest)

          status["state"] = "READY"
          status["updated_at"] = NOW
          status["owner"] = None
          status["final_ready"] = False
          status["fake_data"] = False
          status["classified_count"] = classified
          status["unknown_count"] = unknown
          status["total_elements"] = after
          status["confidence_distribution"] = {str(i): conf_dist.get(str(i), 0) for i in range(1, 5)}
          status["evidence_distribution"] = {k: evidence_dist.get(k, 0) for k in ("A", "B", "C", "D", "U")}
          status["output_sha256"] = geo_sha
          status["blocker"] = None
          status["next_batch_index"] = NEXT_BATCH_INDEX
          status["next_target_feature_count"] = NEXT_TARGET
          status["note"] = "Appended 50 unique Oakham/Rutland OSM building elements; no second task/owner created."
          dump(STA, status)

          checkpoint["sequence"] = int(checkpoint.get("sequence") or 0) + 1
          checkpoint["hydration_state"] = "REMOTE_HEAD_HYDRATED_CONTINUATION_ADVANCED"
          checkpoint["remote_head"] = SOURCE_HEAD
          checkpoint["first_unverified_step"] = f"APPEND_NEW_BATCH_{NEXT_BATCH_INDEX:03d}_AFTER_FEATURE_{after}"
          checkpoint["first_unverified_step_status"] = "READY"
          checkpoint["terminal_status"] = "READY"
          checkpoint["updated_at"] = NOW
          checkpoint["final_ready"] = False
          checkpoint["state"] = "READY"
          checkpoint["feature_count_before"] = before
          checkpoint["feature_count_after"] = after
          checkpoint["current_feature_count"] = after
          checkpoint["next_batch_index"] = NEXT_BATCH_INDEX
          checkpoint["next_target_feature_count"] = NEXT_TARGET
          attempted = checkpoint.get("attempted_cities")
          if not isinstance(attempted, list):
              attempted = []
          if CITY not in attempted:
              attempted.append(CITY)
          checkpoint["attempted_cities"] = attempted
          sae = checkpoint.get("source_access_evidence")
          if not isinstance(sae, dict):
              sae = {}
          sae["overpass_api"] = "SUCCESS_OAKHAM_RUTLAND_BATCH_5"
          sae["oakham_rutland_source_sha256"] = source_sha
          checkpoint["source_access_evidence"] = sae
          checkpoint["next_required_action"] = f"CONTINUE_BATCH_{NEXT_BATCH_INDEX}_FROM_{after}_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES"
          checkpoint["fake_data"] = False
          checkpoint["last_processed_ids_sample"] = [f["id"] for f in new_feats[:10]]
          checkpoint["last_city"] = CITY
          checkpoint["last_batch_index"] = BATCH_INDEX
          summary = checkpoint.get("summary")
          if not isinstance(summary, dict):
              summary = {}
          summary["osm_pilot_classified"] = classified
          summary["unknown"] = unknown
          summary["current_feature_count"] = after
          checkpoint["summary"] = summary
          dump(CP, checkpoint)

          run = {
              "slot_id": SLOT,
              "task_id": TASK,
              "continuation_key": CONT,
              "generated_at": NOW,
              "batch_index": BATCH_INDEX,
              "city": CITY,
              "local_authority": LOCAL_AUTHORITY,
              "region": REGION,
              "feature_count_before": before,
              "feature_count_after": after,
              "new_feature_count": len(new_feats),
              "source_name": "OpenStreetMap Overpass API",
              "source_url": ENDPOINT,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_overpass_response",
              "raw_source_committed": False,
              "fake_data": False,
              "final_ready": False,
              "evidence_distribution_new": dict(collections.Counter(f["properties"]["evidence_level"] for f in new_feats)),
              "confidence_distribution_new": dict(collections.Counter(str(f["properties"]["confidence_level_1_to_4"]) for f in new_feats)),
              "records": [{"feature_id": f["id"], "geometry": f["geometry"], **f["properties"]} for f in new_feats]
          }
          dump(RUN, run)

          reread = load(GEO)
          if len(reread.get("features") or []) != TARGET_AFTER:
              raise SystemExit("GeoJSON reread count mismatch")
          if load(STA).get("final_ready") is not False or load(CP).get("final_ready") is not False:
              raise SystemExit("final_ready invariant failed after write")
          if load(STA).get("fake_data") is not False or load(CP).get("fake_data") is not False:
              raise SystemExit("fake_data invariant failed after write")
          print(json.dumps({
              "before": before,
              "after": after,
              "new": len(new_feats),
              "city": CITY,
              "source_sha256": source_sha,
              "evidence_new": run["evidence_distribution_new"],
              "confidence_new": run["confidence_distribution_new"]
          }, sort_keys=True))
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          WF=".github/workflows/tmp_building_type_6_oakham_20260810.yml"
          rm -f "$WF"
          git config user.name "AAYS building_type_6 continuation"
          git config user.email "aays-building-type-6@local.invalid"
          git add \
            england_map_web/data/building_type/shards/building_type_6_latest.geojson \
            england_map_web/data/building_type/shards/building_type_6_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json \
            "$WF"
          git diff --cached --quiet && { echo "No staged progress; refusing empty commit"; exit 1; }
          git commit -m "building_type_6: append Oakham Rutland OSM batch 5"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 non-force attempts"
              exit 1
            fi
            git fetch origin codex/aays-single-runner-v5-20260706
            git rebase origin/codex/aays-single-runner-v5-20260706
          done
