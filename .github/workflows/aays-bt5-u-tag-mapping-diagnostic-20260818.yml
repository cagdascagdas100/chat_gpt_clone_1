name: AAYS BT5 U tag mapping diagnostic 20260818
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-u-tag-mapping-diagnostic-20260818.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Mark started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_u_tag_mapping_diagnostic_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'RUNNING',run_id:String(context.runId),head_sha:context.sha,started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 U tag mapping diagnostic started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Inspect mappings
        shell: bash
        run: |
          python - <<'PY'
          import json, collections
          from pathlib import Path
          d=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson').read_text(encoding='utf-8'))
          fs=d['features']
          u=[f for f in fs if (f.get('properties') or {}).get('evidence_level')=='U']
          keys=['building','amenity','shop','office','tourism','healthcare','railway','landuse','leisure','craft','public_transport']
          def tags(f): return (f.get('properties') or {}).get('osm_tags_summary') or {}
          def bt(f): return (f.get('properties') or {}).get('building_type_primary')
          idx=collections.defaultdict(collections.Counter)
          for f in fs:
            if (f.get('properties') or {}).get('evidence_level')=='U': continue
            t=tags(f)
            for k in keys:
              v=t.get(k)
              if v not in (None,''): idx[(k,str(v))][str(bt(f))]+=1
          print('U_COUNT',len(u))
          for i,f in enumerate(u[:60]):
            p=f.get('properties') or {}; t=tags(f)
            sig=[]
            for k in keys:
              if t.get(k) not in (None,''):
                sig.append([k,str(t[k]),dict(idx[(k,str(t[k]))])])
            print('U_MAP',i,json.dumps({'parcel_id':p.get('parcel_id'),'area':p.get('area'),'coords':f.get('geometry',{}).get('coordinates'),'tags':t,'signals':sig},ensure_ascii=False,sort_keys=True))
          PY
      - name: Mark finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_u_tag_mapping_diagnostic_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),head_sha:context.sha,finished_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 U tag mapping diagnostic finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
