name: AAYS BT7 Batch187 Once

on:
  push:
    paths:
      - '.github/workflows/aays-bt7-batch187-once.yml'

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 40
          clean: false

      - name: Build batch187 runner from verified batch183 script
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT='4027aa0256bb7d19ec3aea0faf33601521630c63'
          git fetch origin "$OLD_COMMIT" --depth=1 || true
          git show "$OLD_COMMIT:.github/scripts/aays-bt7-batch183-once.py" > /tmp/aays-bt7-batch187.py
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/aays-bt7-batch187.py')
          s = p.read_text()
          replacements = {
              'BATCH = 183': 'BATCH = 187',
              'EXPECTED_BEFORE = 9063': 'EXPECTED_BEFORE = 9263',
              'EXPECTED_NEXT_BATCH = 183': 'EXPECTED_NEXT_BATCH = 187',
              'EXPECTED_AFTER = 9113': 'EXPECTED_AFTER = 9313',
              'EXPECTED_AFTER_NEXT_BATCH = 184': 'EXPECTED_AFTER_NEXT_BATCH = 188',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing replacement token: {old}')
              s = s.replace(old, new, 1)
          areas = '''AREAS = [
              ("Coventry_East_E", "uk-grid-coventry_east_e-001", [-1.350, 52.400, -1.325, 52.415]),
              ("Coventry_South_G", "uk-grid-coventry_south_g-001", [-1.375, 52.385, -1.350, 52.400]),
              ("Coventry_East_F", "uk-grid-coventry_east_f-001", [-1.325, 52.400, -1.300, 52.415]),
              ("Coventry_South_H", "uk-grid-coventry_south_h-001", [-1.350, 52.385, -1.325, 52.400]),
              ("Coventry_East_G", "uk-grid-coventry_east_g-001", [-1.300, 52.400, -1.275, 52.415]),
          ]'''
          s2, n = re.subn(r'AREAS = \[.*?\]\n\nshard_path', areas + '\n\nshard_path', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'AREAS replacement count={n}')
          p.write_text(s2)
          PY
          python /tmp/aays-bt7-batch187.py
