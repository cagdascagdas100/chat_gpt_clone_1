name: AAYS building_type_2 final audit v21 batches 393-404

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-final-audit-v21-393-404-20260819.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-common-v18-next12-20260819
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 200
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
      - name: Audit canonical v21 continuation and publish runner report
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git pull --ff-only origin "$BRANCH"
          python - <<'PY'
          import hashlib, json, pathlib
          SLOT='building_type_2'; TASK='building-type-2-england-classification-v1-20260808'
          START=393; END=404; BEFORE=18950; AFTER=19550; NEXT=405; KEY='continuation_report_20260819_v21'
          G=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          M=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          C=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          S=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          T=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          R=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          geo,man,cp,st,task,runner=map(load,(G,M,C,S,T,R)); feats=geo.get('features') or []
          assert task.get('slot_id')==SLOT and task.get('task_id')==TASK
          assert task.get('owner') in (None,'') and (task.get('continuation_key') or '')==TASK
          assert len(feats)==AFTER and man.get('total_features')==AFTER and cp.get('current_feature_count')==AFTER and st.get('total_elements')==AFTER
          assert cp.get('next_batch_index')==NEXT and st.get('next_batch_index')==NEXT and st.get('last_batch_index')==END
          by={}
          for x in st.get('batch_attempt_history') or []:
              try: b=int(x.get('batch_index'))
              except Exception: continue
              if START <= b <= END: by[b]=x
          assert set(by)==set(range(START,END+1)), (sorted(by), START, END)
          rows=[by[i] for i in range(START,END+1)]
          cities=[str(x.get('city') or '') for x in rows]; bboxes=[x.get('bbox_wgs84') for x in rows]
          assert all(cities) and len(set(cities))==12
          assert all(isinstance(b,list) and len(b)==4 for b in bboxes) and len({tuple(float(v) for v in b) for b in bboxes})==12
          adds=[int(x.get('added_feature_count') or 0) for x in rows]
          assert sum(adds)==AFTER-BEFORE and all(a==50 for a in adds), adds
          fields={'feature_id': [], 'parcel_id': [], 'osm_id': [], 'source_ref': []}
          for f in feats:
              p=f.get('properties') if isinstance(f.get('properties'),dict) else f
              vals={'feature_id': f.get('id') or p.get('feature_id'),'parcel_id':p.get('parcel_id'),'osm_id':p.get('osm_id'),'source_ref':p.get('source_ref')}
              for k,v in vals.items():
                  if v not in (None,''): fields[k].append(str(v))
          duplicate_by_key={k:len(v)-len(set(v)) for k,v in fields.items()}; unique_by_key={k:len(set(v)) for k,v in fields.items()}
          assert all(v==0 for v in duplicate_by_key.values()), duplicate_by_key
          sha=hashlib.sha256(G.read_bytes()).hexdigest(); assert sha==st.get('output_sha256')
          report={'slot_id':SLOT,'batch_range':[START,END],'batches_processed':12,'feature_count_before':BEFORE,'added_feature_count':AFTER-BEFORE,'feature_count_after':AFTER,'next_batch_index':NEXT,'shard_feature_count':len(feats),'checkpoint_feature_count':cp.get('current_feature_count'),'status_feature_count':st.get('total_elements'),'manifest_feature_count':man.get('total_features'),'unique_key_count':sum(unique_by_key.values()),'unique_key_count_by_namespace':unique_by_key,'duplicate_key_count':sum(duplicate_by_key.values()),'duplicate_key_count_by_namespace':duplicate_by_key,'fake_data_generated':False,'nearest_match_used':False,'progress_batches':12,'zero_addition_batches':0,'zero_batches':[],'cities':cities,'bboxes_wgs84':bboxes,'source_family':'OpenStreetMap Overpass API','parcel_id_semantics':'stable OSM element-derived slot identifier; not a cadastral parcel ID','geojson_sha256':sha,'final_ready':False,'production_merge':False}
          runner['readback_required']=True; runner[KEY]=report
          R.write_text(json.dumps(runner,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
          R='docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$R" && git commit -m 'audit building_type_2 batches 393-404 report v21'
          pushed=0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:"$BRANCH"; then pushed=1; break; fi
            git pull --rebase origin "$BRANCH"
          done
          test "$pushed" = 1
          git fetch origin "$BRANCH" && git show "origin/$BRANCH:$R" > /tmp/remote_runner.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/remote_runner.json',encoding='utf-8'))['continuation_report_20260819_v21']
          assert x['batch_range']==[393,404] and x['feature_count_before']==18950 and x['added_feature_count']==600 and x['feature_count_after']==19550 and x['next_batch_index']==405
          assert x['shard_feature_count']==x['checkpoint_feature_count']==x['status_feature_count']==x['manifest_feature_count']==19550
          assert x['duplicate_key_count']==0 and x['fake_data_generated'] is False and x['nearest_match_used'] is False
          assert x['progress_batches']==12 and x['zero_addition_batches']==0 and len(set(x['cities']))==12 and len({tuple(v) for v in x['bboxes_wgs84']})==12
          print('REMOTE_READBACK_OK',json.dumps(x,ensure_ascii=False))
          PY
