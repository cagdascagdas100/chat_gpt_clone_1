name: AAYS building_type_1 batch121 Lambeth Brixton West C one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-1-batch121-lambeth-brixton-west-c-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-1-batch121
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 80

      - name: Fast-forward canonical branch and load guarded generator template
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git fetch origin 61d873aaecbce4d338e9ff8aaaa60cbd5d1be72c --depth=1

      - name: Append 50 new evidenced OSM features for batch121
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, json, re, subprocess, textwrap

          TEMPLATE='61d873aaecbce4d338e9ff8aaaa60cbd5d1be72c'
          OLD_WF='.github/workflows/aays-building-type-1-batch120-lambeth-brixton-west-b-once.yml'
          NEW_WF='.github/workflows/aays-building-type-1-batch121-lambeth-brixton-west-c-once.yml'
          old=subprocess.check_output(['git','show',f'{TEMPLATE}:{OLD_WF}'],text=True)
          marker="          python - <<'PY'\n"
          start=old.index(marker)+len(marker)
          end=old.index("\n          PY",start)
          code=textwrap.dedent(old[start:end])

          replacements={
            "GRID='Lambeth_Brixton_West_B'":"GRID='Lambeth_Brixton_West_C'",
            "NEXT_GRID='Lambeth_Brixton_West_C'":"NEXT_GRID='Lambeth_Brixton_West_D'",
            "LOCAL_AUTHORITY='Lambeth'":"LOCAL_AUTHORITY='Lambeth / Wandsworth boundary'",
            "BATCH_INDEX=120":"BATCH_INDEX=121",
            "EXPECTED_BEFORE=7800":"EXPECTED_BEFORE=7850",
            "TARGET_AFTER=7850":"TARGET_AFTER=7900",
            "NEXT_TARGET=7900":"NEXT_TARGET=7950",
            "BBOX=[51.455,-0.155,51.470,-0.135]":"BBOX=[51.455,-0.175,51.470,-0.155]",
            "pathlib.Path('.github/workflows/aays-building-type-1-batch120-lambeth-brixton-west-b-once.yml')":f"pathlib.Path('{NEW_WF}')",
            "OpenStreetMap Overpass API - Lambeth Brixton West B":"OpenStreetMap Overpass API - Lambeth Brixton West C"
          }
          for a,b in replacements.items():
              if a not in code:
                  raise SystemExit(f'missing generator template token: {a}')
              code=code.replace(a,b)

          replacement_query = "query=f'''[out:json][timeout:45];\\nway[\\\"building\\\"][\\\"building\\\"!~\\\"^(yes|garage|garages|shed|carport|roof|construction|proposed|no)$\\\"]({south},{west},{north},{east});\\nout tags center qt 1500;\\n'''"
          code,n=re.subn(r"query=f'''[\s\S]*?'''", lambda m: replacement_query, code, count=1)
          if n != 1:
              raise SystemExit('typed-building query patch failed')

          fetch_pattern = r"payload=urllib\.parse\.urlencode\(\{'data':query\}\)\.encode\('utf-8'\)\nraw=None; errors=\[\]\nfor attempt in range\(1,4\):[\s\S]*?if raw is None: raise SystemExit\(f'Overpass failed after 3 attempts: \{errors\}'\)"
          replacement_fetch = "\n".join([
              "payload=urllib.parse.urlencode({'data':query}).encode('utf-8')",
              "raw=None; errors=[]",
              "ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']",
              "for attempt,endpoint in enumerate(ENDPOINTS,1):",
              "    try:",
              "        req=urllib.request.Request(endpoint,data=payload,headers={'User-Agent':'TerraYield-AAYS-building_type_1/1.0','Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'},method='POST')",
              "        with urllib.request.urlopen(req,timeout=90) as resp: raw=resp.read()",
              "        ENDPOINT=endpoint",
              "        break",
              "    except Exception as exc:",
              "        errors.append({'endpoint':endpoint,'error':repr(exc)})",
              "        if attempt<len(ENDPOINTS): time.sleep(3*attempt)",
              "if raw is None: raise SystemExit(f'Overpass endpoints failed once each: {errors}')",
          ])
          code,n=re.subn(fetch_pattern, lambda m: replacement_fetch, code, count=1)
          if n != 1:
              raise SystemExit('multi-endpoint fetch patch failed')

          exec(compile(code,'batch121_generator','exec'),{})

          # Normalize the manifest/status distributions from the full 7,900-feature shard.
          GEO='england_map_web/data/building_type/shards/building_type_1_latest.geojson'
          MAN='england_map_web/data/building_type/shards/building_type_1_manifest_latest.json'
          RUN='docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'
          STA='docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json'
          CP='docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'
          def rj(p):
              with open(p,encoding='utf-8') as f: return json.load(f)
          def wj(p,o):
              with open(p,'w',encoding='utf-8') as f: json.dump(o,f,ensure_ascii=False,indent=2); f.write('\n')
          geo=rj(GEO); man=rj(MAN); run=rj(RUN); st=rj(STA); cp=rj(CP)
          feats=geo.get('features') or []
          if len(feats)!=7900 or len(run.get('records') or [])!=50:
              raise SystemExit('post-generator feature/record count mismatch')
          ev=collections.Counter(); conf=collections.Counter(); types=collections.Counter(); unknown=0
          for f in feats:
              p=f.get('properties') or {}
              ev[str(p.get('evidence_level') or 'U')]+=1
              lvl=p.get('confidence_level_1_to_4')
              try: lvl=int(lvl)
              except Exception: lvl=1
              if lvl not in (1,2,3,4): lvl=1
              conf[f'level_{lvl}']+=1
              primary=str(p.get('building_type_primary') or 'unknown')
              types[primary]+=1
              if primary=='unknown': unknown+=1
          classified=len(feats)-unknown
          man.update({
              'feature_count_before':7850,'feature_count_after':7900,'new_features_added':50,
              'current_feature_count':7900,'next_batch_index':122,'next_target_feature_count':7950,
              'total_features':7900,'feature_count':7900,'classified':classified,'unknown':unknown,
              'evidence_distribution':dict(sorted(ev.items())),'confidence_distribution':dict(sorted(conf.items())),
              'confidence_level_distribution':dict(sorted(conf.items())),'building_type_distribution':dict(sorted(types.items())),
              'type_distribution':dict(sorted(types.items())),'fake_data':False,'final_ready':False
          })
          st.update({'classified_count':classified,'unknown_count':unknown,'evidence_distribution':dict(sorted(ev.items())),
                     'confidence_distribution':dict(sorted(conf.items())),'fake_data':False,'final_ready':False})
          cp.update({'fake_data':False,'final_ready':False})
          run.update({'classified_count_after':classified,'unknown_count_after':unknown,'fake_data':False,'final_ready':False})
          wj(MAN,man); wj(STA,st); wj(CP,cp); wj(RUN,run)
          print('BATCH121_GENERATED_AND_NORMALIZED',len(feats),classified,unknown)
          PY

      - name: Validate, commit exact slot outputs, remove one-shot transport, and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          paths={
            'geo':'england_map_web/data/building_type/shards/building_type_1_latest.geojson',
            'man':'england_map_web/data/building_type/shards/building_type_1_manifest_latest.json',
            'run':'docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json',
            'st':'docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json',
            'cp':'docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json',
            'task':'docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json'
          }
          d={k:json.load(open(v,encoding='utf-8')) for k,v in paths.items()}
          feats=d['geo'].get('features') or []; records=d['run'].get('records') or []
          assert len(feats)==7900
          assert d['st'].get('feature_count_before')==7850 and d['st'].get('feature_count_after')==7900
          assert d['st'].get('new_features_added')==50 and d['st'].get('current_feature_count')==7900
          assert d['cp'].get('next_batch_index')==122 and d['cp'].get('next_target_feature_count')==7950
          assert d['cp'].get('last_grid_id')=='Lambeth_Brixton_West_C'
          assert len(records)==50 and d['man'].get('feature_count')==7900
          assert d['task'].get('task_id')=='building-type-1-england-classification-v1-20260808'
          assert d['task'].get('owner') in (None,'')
          seen_f=set(); seen_p=set(); seen_o=set()
          for f in feats:
              fid=f.get('id'); p=f.get('properties') or {}; pid=p.get('parcel_id'); oid=p.get('osm_id')
              if fid not in (None,''): assert str(fid) not in seen_f; seen_f.add(str(fid))
              if pid not in (None,''): assert str(pid) not in seen_p; seen_p.add(str(pid))
              if oid not in (None,''): assert str(oid) not in seen_o; seen_o.add(str(oid))
          for r in records:
              assert r.get('source_url') and r.get('source_hash') and r.get('sources') and r.get('evidence_excerpt')
              assert r.get('evidence_level') in {'B','C'}
              assert r.get('confidence_level_1_to_4') in {2,3}
              assert r.get('fake_data') is False and r.get('final_ready') is False
          for k in ('man','run','st','cp'):
              assert d[k].get('fake_data') is False and d[k].get('final_ready') is False
          print('LOCAL_VALIDATION_OK building_type_1 7850->7900 batch121 +50')
          PY

          git config user.name "aays-building-type-1-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/aays-building-type-1-batch121-lambeth-brixton-west-c-once.yml
          git add -- \
            .github/workflows/aays-building-type-1-batch121-lambeth-brixton-west-c-once.yml \
            england_map_web/data/building_type/shards/building_type_1_latest.geojson \
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json
          git diff --cached --quiet && { echo 'No staged change; refusing false progress'; exit 1; }
          git commit -m "building_type_1: append batch 121 Lambeth_Brixton_West_C +50"

          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=80
            remote_count=$(git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json | python -c "import json,sys; print(json.load(sys.stdin).get('current_feature_count'))")
            remote_batch=$(git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json | python -c "import json,sys; print(json.load(sys.stdin).get('next_batch_index'))")
            if [ "$remote_count" != "7850" ] || [ "$remote_batch" != "121" ]; then
              echo "building_type_1 moved remotely; abort duplicate publish"
              exit 1
            fi
            if git pull --rebase origin codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=80
          python - <<'PY'
          import json, subprocess
          BR='origin/codex/aays-single-runner-v5-20260706'
          def rj(p): return json.loads(subprocess.check_output(['git','show',f'{BR}:{p}']).decode())
          geo=rj('england_map_web/data/building_type/shards/building_type_1_latest.geojson')
          man=rj('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json')
          run=rj('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json')
          st=rj('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json')
          cp=rj('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json')
          task=rj('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json')
          feats=geo.get('features') or []; records=run.get('records') or []
          assert len(feats)==7900
          assert st.get('current_feature_count')==7900 and cp.get('current_feature_count')==7900
          assert st.get('feature_count_before')==7850 and st.get('feature_count_after')==7900 and st.get('new_features_added')==50
          assert cp.get('next_batch_index')==122 and cp.get('next_target_feature_count')==7950 and cp.get('last_grid_id')=='Lambeth_Brixton_West_C'
          assert len(records)==50 and man.get('feature_count')==7900
          assert task.get('task_id')=='building-type-1-england-classification-v1-20260808' and task.get('owner') in (None,'')
          for r in records:
              assert r.get('source_url') and r.get('source_hash') and r.get('sources') and r.get('evidence_excerpt')
              assert r.get('evidence_level') in {'B','C'} and r.get('confidence_level_1_to_4') in {2,3}
              assert r.get('fake_data') is False and r.get('final_ready') is False
          assert st.get('fake_data') is False and cp.get('fake_data') is False and run.get('fake_data') is False and man.get('fake_data') is False
          assert st.get('final_ready') is False and cp.get('final_ready') is False and run.get('final_ready') is False and man.get('final_ready') is False
          print('REMOTE_READBACK_OK building_type_1 7850->7900 batch121 Lambeth_Brixton_West_C +50')
          PY
