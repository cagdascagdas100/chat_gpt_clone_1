name: security-public-safety-2-wave106-pull-request-recovery

on:
  pull_request:
    branches:
      - codex/aays-single-runner-v5-20260706
    types: [opened, synchronize, reopened]
    paths:
      - .github/wave106-pr-trigger.txt

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave106-pr-64b0a7adc96e0f7d6f5945b9be115448bf3242d197f70ba0de9c736fac53e96e
  cancel-in-progress: false

jobs:
  guarded-wave106-pr-recovery:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Check idempotent claim gate
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          queue = Path('docs/chatgpt_status/aays1/queue/0081_security_public_safety_2_priority_26860row_incremental_evidence_expansion_20260731.v3.task.json')
          current = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/current_task_latest.json')
          continuation = '64b0a7adc96e0f7d6f5945b9be115448bf3242d197f70ba0de9c736fac53e96e'
          payload = json.loads(current.read_text(encoding='utf-8'))
          print('run=false' if queue.exists() or payload.get('continuation_key') == continuation else 'run=true')
          PY

      - name: Validate Wave106 orchestrator syntax
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave106_orchestrator.py

      - name: Claim exact next scope
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave106_orchestrator.py claim

      - name: Install browser runtime
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Generate official-source rows and publish accepted output
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave106_orchestrator.py run

      - name: Verify remote hashes and terminalize
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave106_orchestrator.py terminalize

      - name: Park failed continuation without duplicate retry
        if: ${{ failure() && steps.gate.outputs.run == 'true' }}
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave106_orchestrator.py park
