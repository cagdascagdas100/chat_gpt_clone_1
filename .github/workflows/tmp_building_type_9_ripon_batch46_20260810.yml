name: AAYS building_type_9 Ripon OSM batch46 one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_9_ripon_batch46_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-9-ripon-batch46-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new evidence-backed Ripon OSM features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, time, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          from collections import Counter

          SLOT='building_type_9'
          CITY='Ripon'
          GRID='RIPON_CENTRAL_01'
          LOCAL_AUTHORITY='North Yorkshire'
          BATCH=46
          EXPECTED_BEFORE=2250
          TARGET_AFTER=2300
          NEXT_TARGET=2350
          BASE_URL='https://api.openstreetmap.org/api/0.6/map'
          BRANCH='codex/aays-single-runner-v5-20260706'
          WORKFLOW_PATH='.github/workflows/tmp_building_type_9_ripon_batch46_20260810.yml'
          geo_path=Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          manifest_path=Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          runner_path=Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          status_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          checkpoint_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          task_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json')

          with geo_path.open(encoding='utf-8') as f:
              geo=json.load(f)
          features=geo.get('features',[])
          if len(features) != EXPECTED_BEFORE:
              raise SystemExit(f'fail closed: expected {EXPECTED_BEFORE} features, found {len(features)}')

          with checkpoint_path.open(encoding='utf-8') as f:
              checkpoint=json.load(f)
          if int(checkpoint.get('next_batch_index', BATCH)) != BATCH:
              raise SystemExit(f"fail closed: checkpoint next_batch_index={checkpoint.get('next_batch_index')} != {BATCH}")
          if int(checkpoint.get('current_feature_count', EXPECTED_BEFORE)) != EXPECTED_BEFORE:
              raise SystemExit(f"fail closed: checkpoint current_feature_count={checkpoint.get('current_feature_count')} != {EXPECTED_BEFORE}")

          with manifest_path.open(encoding='utf-8') as f:
              manifest=json.load(f)
          sources=manifest.get('sources') or []
          prior_city=str(manifest.get('last_batch_city') or '').lower()
          if prior_city == CITY.lower() or any(str(s.get('grid_id') or '') == GRID for s in sources) or any(CITY.lower() in str(s.get('name') or '').lower() for s in sources):
              raise SystemExit(f'fail closed: city/grid already present in manifest: {CITY}/{GRID}')

          with task_path.open(encoding='utf-8') as f:
              task0=json.load(f)
          continuation_key=task0.get('continuation_key','')
          if task0.get('owner') not in (None,''):
              raise SystemExit(f"fail closed: unexpected live owner={task0.get('owner')}")
          if task0.get('blocker') not in (None,''):
              raise SystemExit(f"fail closed: blocker={task0.get('blocker')}")
          if not continuation_key:
              raise SystemExit('fail closed: missing continuation_key')

          processed=set()
          for ft in features:
              p=ft.get('properties') or {}
              for v in (ft.get('id'), p.get('parcel_id'), p.get('osm_id')):
                  if v is not None and str(v):
                      processed.add(str(v))
          processed_before=len(processed)

          # Ripon urban area, North Yorkshire. Raw OSM XML remains runtime-only.
          xs=[-1.6000,-1.5650,-1.5300,-1.4950,-1.4600]
          ys=[54.1000,54.1200,54.1400,54.1600,54.1800]
          urls=[]
          for yi in range(len(ys)-1):
              for xi in range(len(xs)-1):
                  urls.append(f'{BASE_URL}?bbox={xs[xi]:.4f},{ys[yi]:.4f},{xs[xi+1]:.4f},{ys[yi+1]:.4f}')
          query_sha=hashlib.sha256('\n'.join(urls).encode()).hexdigest()

          raw_parts=[]
          failed=[]
          nodes={}
          ways={}
          for url in urls:
              data=None
              err=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'TerraYield-AAYS-building_type_9/1.0'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          data=r.read()
                      break
                  except Exception as e:
                      err=repr(e)
                      time.sleep(2+attempt*2)
              if data is None:
                  failed.append({'url':url,'error':err})
                  continue
              raw_parts.append(data)
              root=ET.fromstring(data)
              for n in root.findall('node'):
                  try:
                      nodes[n.attrib['id']] = (float(n.attrib['lat']), float(n.attrib['lon']))
                  except Exception:
                      pass
              for w in root.findall('way'):
                  wid=w.attrib.get('id')
                  if not wid:
                      continue
                  tags={t.attrib.get('k'):t.attrib.get('v') for t in w.findall('tag') if t.attrib.get('k')}
                  refs=[nd.attrib.get('ref') for nd in w.findall('nd') if nd.attrib.get('ref')]
                  old=ways.get(wid)
                  if old is None or len(tags) > len(old['tags']):
                      ways[wid]={'tags':tags,'refs':refs}
              time.sleep(0.8)

          if not raw_parts:
              raise SystemExit('BLOCKED_NO_NEW_SOURCE_OR_BATCH: all OSM API tiles failed')
          source_sha=hashlib.sha256(b''.join(raw_parts)).hexdigest()

          building_map={
              'detached':('residential_detached','R_DET','residential'),
              'semidetached_house':('residential_semi_detached','R_SEMI','residential'),
              'semi':('residential_semi_detached','R_SEMI','residential'),
              'terrace':('residential_other','R_TERR','residential'),
              'terraced_house':('residential_other','R_TERR','residential'),
              'apartments':('residential_apartments','R_FLAT','residential'),
              'flats':('residential_apartments','R_FLAT','residential'),
              'house':('residential_house','R_HOUSE','residential'),
              'residential':('residential_other','R_OTHER','residential'),
              'bungalow':('residential_detached','R_DET','residential'),
              'dormitory':('residential_other','R_OTHER','residential'),
              'industrial':('industrial','I_FACTORY','industrial'),
              'warehouse':('warehouse','I_WAREHOUSE','industrial'),
              'retail':('commercial_retail','C_RETAIL','commercial'),
              'commercial':('commercial_other','C_OTHER','commercial'),
              'office':('office','C_OFFICE','commercial'),
              'school':('education','P_SCHOOL','institutional'),
              'college':('education','P_SCHOOL','institutional'),
              'university':('education','P_SCHOOL','institutional'),
              'hospital':('hospital_or_healthcare','P_HEALTHCARE','institutional'),
              'church':('religious_or_community','P_RELIGIOUS','institutional'),
              'chapel':('religious_or_community','P_RELIGIOUS','institutional'),
              'mosque':('religious_or_community','P_RELIGIOUS','institutional'),
              'synagogue':('religious_or_community','P_RELIGIOUS','institutional'),
              'temple':('religious_or_community','P_RELIGIOUS','institutional'),
              'hotel':('hotel_or_hospitality','C_HOSPITALITY','commercial'),
              'farm':('residential_other','R_OTHER','residential'),
              'barn':('industrial','I_OTHER','industrial'),
              'public':('public_infrastructure','P_GOVERNMENT','institutional'),
              'government':('public_infrastructure','P_GOVERNMENT','institutional'),
              'civic':('public_infrastructure','P_GOVERNMENT','institutional'),
              'train_station':('public_infrastructure','P_TRANSPORT','institutional'),
              'garage':('industrial','I_WORKSHOP','industrial'),
              'garages':('industrial','I_WORKSHOP','industrial')
          }
          amenity_map={
              'school':('education','P_SCHOOL','institutional'),
              'college':('education','P_SCHOOL','institutional'),
              'university':('education','P_SCHOOL','institutional'),
              'kindergarten':('education','P_SCHOOL','institutional'),
              'hospital':('hospital_or_healthcare','P_HEALTHCARE','institutional'),
              'clinic':('hospital_or_healthcare','P_HEALTHCARE','institutional'),
              'doctors':('hospital_or_healthcare','P_HEALTHCARE','institutional'),
              'pharmacy':('hospital_or_healthcare','P_HEALTHCARE','institutional'),
              'place_of_worship':('religious_or_community','P_RELIGIOUS','institutional'),
              'community_centre':('religious_or_community','P_RELIGIOUS','institutional'),
              'police':('public_infrastructure','P_GOVERNMENT','institutional'),
              'post_office':('public_infrastructure','P_GOVERNMENT','institutional'),
              'fire_station':('public_infrastructure','P_GOVERNMENT','institutional'),
              'townhall':('public_infrastructure','P_GOVERNMENT','institutional'),
              'library':('public_infrastructure','P_GOVERNMENT','institutional'),
              'bank':('commercial_retail','C_RETAIL','commercial'),
              'restaurant':('commercial_retail','C_RETAIL','commercial'),
              'cafe':('commercial_retail','C_RETAIL','commercial'),
              'pub':('commercial_retail','C_RETAIL','commercial'),
              'fast_food':('commercial_retail','C_RETAIL','commercial')
          }

          def classify(tags):
              amen=tags.get('amenity')
              if amen in amenity_map:
                  return (*amenity_map[amen], 'osm_building_plus_amenity_tag')
              if tags.get('tourism') in {'hotel','hostel','guest_house'}:
                  return ('hotel_or_hospitality','C_HOSPITALITY','commercial','osm_building_plus_tourism_tag')
              if tags.get('office') and tags.get('office') != 'no':
                  return ('office','C_OFFICE','commercial','osm_building_plus_office_tag')
              if tags.get('shop') not in (None,'','no'):
                  return ('commercial_retail','C_RETAIL','commercial','osm_building_plus_shop_tag')
              b=tags.get('building')
              if b in building_map:
                  return (*building_map[b], 'osm_explicit_building_tag')
              return None

          candidates=[]
          for wid,obj in ways.items():
              tags=obj['tags']
              if not tags.get('building'):
                  continue
              c=classify(tags)
              if not c:
                  continue
              fid=f'ENG_OSM_way_{wid}'
              oid=f'way/{wid}'
              if fid in processed or oid in processed or str(wid) in processed:
                  continue
              pts=[nodes[r] for r in obj['refs'] if r in nodes]
              if not pts:
                  continue
              lat=sum(p[0] for p in pts)/len(pts)
              lon=sum(p[1] for p in pts)/len(pts)
              candidates.append((int(wid),wid,tags,lat,lon,c))

          candidates.sort(key=lambda x:x[0])
          chosen=candidates[:50]
          if len(chosen) < 50:
              raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(chosen)} new classifiable OSM ways found')

          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          new_features=[]
          records=[]
          keep_keys=['building','amenity','shop','office','tourism','name','addr:postcode','addr:street','addr:housenumber','addr:city']
          for _,wid,tags,lat,lon,c in chosen:
              primary,code,category,method=c
              fid=f'ENG_OSM_way_{wid}'
              oid=f'way/{wid}'
              excerpt={k:tags[k] for k in keep_keys if tags.get(k)}
              excerpt_text=' | '.join([f'OSM way/{wid}']+[f'{k}={v}' for k,v in excerpt.items()])
              src={
                  'source_name':'OpenStreetMap API 0.6',
                  'url_or_local_path':f'https://www.openstreetmap.org/way/{wid}',
                  'accessed_at':now,
                  'sha256':source_sha,
                  'licence':'ODbL 1.0',
                  'granularity':'building_way_center',
                  'fields_used':[k for k in ['building','amenity','shop','office','tourism'] if tags.get(k)],
                  'supports_field':'building_type_primary',
                  'match_method':method,
                  'match_score':0.85,
                  'evidence_excerpt':excerpt
              }
              props={
                  'parcel_id':fid,
                  'osm_id':oid,
                  'slot_id':SLOT,
                  'region':'Yorkshire & North East',
                  'local_authority':LOCAL_AUTHORITY,
                  'area':CITY,
                  'postcode':tags.get('addr:postcode',''),
                  'building_type_primary':primary,
                  'building_type_code':code,
                  'building_category':category,
                  'evidence_level':'B',
                  'confidence_score':0.85,
                  'confidence_level_1_to_4':3,
                  'source_count':1,
                  'match_method':method,
                  'source':'OpenStreetMap API 0.6',
                  'source_url':f'https://www.openstreetmap.org/way/{wid}',
                  'source_hash':source_sha,
                  'query_sha256':query_sha,
                  'evidence_excerpt':excerpt_text,
                  'osm_tags_summary':excerpt,
                  'fake_data':False,
                  'final_ready':False,
                  'needs_manual_review':False,
                  'updated_at':now,
                  'sources':[src],
                  'source_evidence_excerpt':excerpt,
                  'building_type_secondary':'',
                  'geometry_match_method':'osm_way_centroid',
                  'address_match_method':'osm_address_tags' if tags.get('addr:postcode') else 'none',
                  'limitations':'OSM explicit/tag-based classification; independent EPC/VOA/HMLR corroboration still pending.'
              }
              ft={'type':'Feature','id':fid,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props}
              new_features.append(ft)
              records.append({
                  'id':fid,'parcel_id':fid,'osm_id':oid,
                  'building_type_primary':primary,
                  'source':'OpenStreetMap API 0.6',
                  'source_url':f'https://www.openstreetmap.org/way/{wid}',
                  'source_hash':source_sha,'query_sha256':query_sha,
                  'sources':[src],'evidence_excerpt':excerpt_text,
                  'evidence_level':'B','confidence_level_1_to_4':3,
                  'match_method':method
              })

          geo['features'].extend(new_features)
          if len(geo['features']) != TARGET_AFTER or TARGET_AFTER <= EXPECTED_BEFORE:
              raise SystemExit('feature_count_after invariant failed')

          seen_fid=set(); seen_parcel=set(); seen_osm=set()
          for ft in geo['features']:
              p=ft.get('properties') or {}
              fid=str(ft.get('id') or '')
              parcel=str(p.get('parcel_id') or '')
              osm=str(p.get('osm_id') or '')
              if fid:
                  if fid in seen_fid: raise SystemExit(f'duplicate feature.id {fid}')
                  seen_fid.add(fid)
              if parcel:
                  if parcel in seen_parcel: raise SystemExit(f'duplicate parcel_id {parcel}')
                  seen_parcel.add(parcel)
              if osm:
                  if osm in seen_osm: raise SystemExit(f'duplicate osm_id {osm}')
                  seen_osm.add(osm)

          geo_path.write_text(json.dumps(geo,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          geo_sha=hashlib.sha256(geo_path.read_bytes()).hexdigest()

          evidence_dist=Counter(); type_dist=Counter(); conf_dist=Counter()
          for ft in geo['features']:
              p=ft.get('properties') or {}
              evidence_dist[str(p.get('evidence_level','U'))]+=1
              type_dist[str(p.get('building_type_primary','unknown'))]+=1
              conf_dist[str(p.get('confidence_level_1_to_4',1))]+=1
          unknown=type_dist.get('unknown',0)
          classified=TARGET_AFTER-unknown

          sources.append({
              'name':f'OpenStreetMap API 0.6 - {CITY} batch {BATCH}',
              'url':BASE_URL,
              'license':'ODbL 1.0',
              'features_used':50,
              'accessed_at':now,
              'source_sha256':source_sha,
              'source_hash_method':'sha256_concatenated_successful_osm_xml_tiles',
              'query_sha256':query_sha,
              'query_urls':urls,
              'failed_tile_count':len(failed),
              'grid_id':GRID,
              'note':'50 new evidence-backed semantic building records from runtime-only OSM XML tiles; no raw source committed.'
          })
          manifest.update({
              'slot_id':SLOT,'generated_at':now,'total_features':TARGET_AFTER,
              'classified':classified,'unknown':unknown,
              'evidence_distribution':dict(sorted(evidence_dist.items())),
              'type_distribution':dict(sorted(type_dist.items())),
              'confidence_level_distribution':dict(sorted(conf_dist.items())),
              'sources':sources,'fake_data':False,'final_ready':False,
              'note':f'Existing {EXPECTED_BEFORE}-feature shard preserved; appended 50 {CITY} OSM API records outside feature.id/parcel_id/osm_id already_processed_ids.',
              'feature_count':TARGET_AFTER,'geojson_sha256':geo_sha,
              'geojson_path':str(geo_path),'manifest_updated_at':now,
              'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,
              'added_feature_count':50,'last_batch_city':CITY,
              'last_batch_source':'OpenStreetMap API 0.6 map endpoint',
              'last_batch_source_sha256':source_sha,'last_batch_query_sha256':query_sha,
              'last_batch_grid':GRID
          })
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          runner={
              'slot_id':SLOT,'continuation_key':continuation_key,'batch_index':BATCH,
              'city':CITY,'grid_id':GRID,'generated_at':now,
              'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,
              'added_feature_count':50,'progress':True,
              'already_processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],
              'already_processed_id_count_before':processed_before,
              'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE_URL,
              'source_urls':urls,'source_sha256':source_sha,'query_sha256':query_sha,
              'failed_tile_count':len(failed),'evidence_level_new_features':{'B':50},
              'confidence_level_new_features':{'3':50},
              'new_feature_ids':[ft['id'] for ft in new_features],
              'records':records,'fake_data':False,'final_ready':False
          }
          runner_path.parent.mkdir(parents=True,exist_ok=True)
          runner_path.write_text(json.dumps(runner,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          with status_path.open(encoding='utf-8') as f:
              status=json.load(f)
          status.update({
              'state':'IN_PROGRESS','updated_at':now,'final_ready':False,
              'classified_count':classified,'unknown_count':unknown,'total_elements':TARGET_AFTER,
              'confidence_distribution':dict(sorted(conf_dist.items())),
              'evidence_distribution':dict(sorted(evidence_dist.items())),
              'output_sha256':geo_sha,
              'note':f'Batch {BATCH} appended 50 new {CITY} OSM API evidence-backed building features; no fake rows.',
              'fake_data':False,'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,
              'current_feature_count':TARGET_AFTER,'next_batch_index':BATCH+1,
              'next_target_feature_count':NEXT_TARGET,'last_batch_city':CITY,'last_batch_grid':GRID,
              'last_batch_source_sha256':source_sha,'last_batch_query_sha256':query_sha,
              'owner_claim_created':False,'progress':True
          })
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          checkpoint.update({
              'hydration_state':'REMOTE_HEAD_HYDRATED_FIRST_UNVERIFIED_PRESERVED',
              'first_unverified_step':'AŞAMA_1_OSM_GENISLETME_APPEND_NEW_BATCH_THEN_OPTIONAL_EPC_VOA_HMLR_UPGRADE',
              'first_unverified_step_status':f'BATCH_{BATCH:03d}_APPENDED_50_{CITY.upper().replace(" ","_")}_OSM_FEATURES_CONTINUATION_REQUIRED',
              'updated_at':now,'final_ready':False,'state':'IN_PROGRESS',
              'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,
              'current_feature_count':TARGET_AFTER,'next_batch_index':BATCH+1,
              'next_target_feature_count':NEXT_TARGET,
              'last_processed_ids_sample':[ft['id'] for ft in new_features[-20:]],
              'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION',
              'fake_data':False,'processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],
              'last_batch':{
                  'batch_index':BATCH,'city':CITY,'grid_id':GRID,
                  'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE_URL,
                  'source_sha256':source_sha,'query_sha256':query_sha,
                  'evidence_level':'B','confidence_level_1_to_4':3,
                  'added_feature_count':50,'new_feature_ids':[ft['id'] for ft in new_features]
              },
              'next_city_index':BATCH+1
          })
          summary=checkpoint.get('summary') or {}
          summary['new_features_appended']=int(summary.get('new_features_appended',0))+50
          checkpoint['summary']=summary
          checkpoint_path.write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          task=task0
          task.update({
              'state':'READY','status':'ready','panel_status':'HAZIR','updated_at':now,
              'first_unverified_step':f'APPEND_NEW_BATCH_{BATCH+1:03d}_AFTER_FEATURE_{TARGET_AFTER}',
              'continuation_key':continuation_key,'owner':None,'blocker':None,
              'claimable':True,'ready_for_claim':True,'fake_data':False,'final_ready':False,
              'progress':{
                  'completed_count':TARGET_AFTER,'target_count':NEXT_TARGET,
                  'previous_percent':round(EXPECTED_BEFORE/TARGET_AFTER*100,4),
                  'current_percent':round(TARGET_AFTER/NEXT_TARGET*100,4),
                  'percent_increase':round(TARGET_AFTER/NEXT_TARGET*100-EXPECTED_BEFORE/TARGET_AFTER*100,4)
              }
          })
          task_path.write_text(json.dumps(task,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          if any((ft.get('properties') or {}).get('fake_data') is True for ft in new_features):
              raise SystemExit('fake_data invariant failed')
          if any((ft.get('properties') or {}).get('final_ready') is True for ft in new_features):
              raise SystemExit('final_ready invariant failed')
          print('RESULT',json.dumps({
              'slot_id':SLOT,'batch_index':BATCH,'city':CITY,'grid_id':GRID,
              'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,
              'added_feature_count':50,'already_processed_id_count_before':processed_before,
              'new_feature_ids':[ft['id'] for ft in new_features],
              'source_sha256':source_sha,'query_sha256':query_sha,
              'failed_tile_count':len(failed),'geojson_sha256':geo_sha,
              'fake_data':False,'final_ready':False,'continuation_key':continuation_key
          },separators=(',',':')))
          PY

      - name: Commit and push only building_type_9 outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_ripon_batch46_20260810.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- "$WF"
          git add -- \
            england_map_web/data/building_type/shards/building_type_9_latest.geojson \
            england_map_web/data/building_type/shards/building_type_9_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json \
