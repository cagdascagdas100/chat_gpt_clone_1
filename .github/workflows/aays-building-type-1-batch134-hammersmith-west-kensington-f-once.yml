name: AAYS building_type_1 batch134 Hammersmith West Kensington F one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-1-batch134-hammersmith-west-kensington-f-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-1-batch134-hammersmith-west-kensington-f-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_1_latest.geojson
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_1
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs
      - name: Fast-forward to canonical head
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Execute guarded batch134
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          repl={
          'SLOT = "building_type_6"':'SLOT = "building_type_1"',
          'TASK = "building-type-6-england-classification-v1-20260808"':'TASK = "building-type-1-england-classification-v1-20260808"',
          'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"':'CONT = ""',
          'CITY = "Skegness"':'CITY = "Hammersmith_West_Kensington_F"',
          'LOCAL_AUTHORITY = "East Lindsey"':'LOCAL_AUTHORITY = "Kensington & Chelsea"',
          'REGION = "East Midlands"':'REGION = "London Inner"',
          'BATCH_INDEX = 26':'BATCH_INDEX = 134',
          'EXPECTED_BEFORE = 2250':'EXPECTED_BEFORE = 8500',
          'ADD_COUNT = 250':'ADD_COUNT = 50',
          'TARGET_AFTER = 2500':'TARGET_AFTER = 8550',
          'NEXT_TARGET = 2750':'NEXT_TARGET = 8600',
          'BBOX = [0.20, 53.08, 0.48, 53.21]':'BBOX = [-0.195, 51.490, -0.165, 51.505]',
          'england_map_web/data/building_type/shards/building_type_6_latest.geojson':'england_map_web/data/building_type/shards/building_type_1_latest.geojson',
          'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json':'england_map_web/data/building_type/shards/building_type_1_manifest_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json',
          'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json':'docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'}
          for old,new in repl.items():
              if old not in code:
                  raise SystemExit(f'missing token {old}')
              code=code.replace(old,new,1)
          code=code.replace('building_type_6','building_type_1')
          code=code.replace('Skegness','Hammersmith_West_Kensington_F').replace('SKEGNESS','HAMMERSMITH_WEST_KENSINGTON_F').replace('skegness','hammersmith_west_kensington_f')
          code=code.replace('East Lindsey','Kensington & Chelsea').replace('east_lindsey','kensington_chelsea')
          old='if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new='if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old not in code:
              raise SystemExit('missing continuation guard')
          code=code.replace(old,new,1)
          code=code.replace('for key in ("parcel_id", "osm_id"):', 'for key in ("parcel_id", "osm_id", "source_ref"):')
          old='if {fid, pid, osmid, engfid, str(oid), f"{typ}_{oid}"} & already:'
          new='if {fid, pid, osmid, f"OSM:{osmid}", engfid, str(oid), f"{typ}_{oid}"} & already:'
          if old not in code:
              raise SystemExit('missing candidate dedupe token')
          code=code.replace(old,new,1)
          old='chosen = candidates[:ADD_COUNT]'
          new='evidence_candidates = [row for row in candidates if row[8][0] != "unknown" and row[8][3] != "U"]\nchosen = evidence_candidates[:ADD_COUNT]'
          if old not in code:
              raise SystemExit('missing candidate selection token')
          code=code.replace(old,new,1)
          code=code.replace('raise SystemExit(f"only {len(chosen)} new geometry-bearing candidates; need >= {ADD_COUNT}")', 'raise SystemExit(f"NO_EVIDENCE_THIS_BATCH: only {len(chosen)} evidence-backed new candidates; need exactly {ADD_COUNT}")',1)
          old='"osm_id": osmid,'
          new='"osm_id": osmid,\n        "source_ref": f"OSM:{osmid}",'
          if old not in code:
              raise SystemExit('missing osm_id property token')
          code=code.replace(old,new,1)
          old='"source_url": object_url,'
          new='"source_url": object_url,\n        "source_path": ENDPOINT,'
          if old not in code:
              raise SystemExit('missing source_url property token')
          code=code.replace(old,new,1)
          Path('/tmp/bt1_b134.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/bt1_b134.py
      - name: Normalize batch134 metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          CITY='Hammersmith_West_Kensington_F'
          BBOX=[-0.195,51.490,-0.165,51.505]
          BATCH=134
          BEFORE=8500
          AFTER=8550
          NEXT=8600
          ENDPOINT='https://overpass-api.de/api/interpreter'
          paths={
            'geo':Path('england_map_web/data/building_type/shards/building_type_1_latest.geojson'),
            'man':Path('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json'),
            'sta':Path('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json'),
            'cp':Path('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'),
            'ct':Path('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json'),
            'run':Path('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json')}
          def load(k): return json.loads(paths[k].read_text(encoding='utf-8'))
          def dump(k,obj,compact=False): paths[k].write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':') if compact else None,indent=None if compact else 2)+'\n',encoding='utf-8')
          geo,man,sta,cp,ct,run=[load(k) for k in ('geo','man','sta','cp','ct','run')]
          now=run['generated_at']; sha=run['source_sha256']
          rec=run.get('records') or []
          if len(rec)!=50: raise SystemExit('runner record count must be exactly 50')
          for r in rec:
            if not r.get('source_ref') or not r.get('source_url') or not r.get('source_path'):
              raise SystemExit('missing source_ref/source_url/source_path')
            if not r.get('evidence_excerpt') or r.get('building_type_primary') in (None,'','unknown'):
              raise SystemExit('non-evidence record selected')
            if r.get('confidence_level_1_to_4') not in (1,2,3,4) or r.get('evidence_level')=='U':
              raise SystemExit('invalid confidence/evidence')
            srcs=r.get('sources') or []
            if not srcs or not srcs[0].get('accessed_at') or not srcs[0].get('fields_used'):
              raise SystemExit('missing nested source metadata')
            if r.get('fake_data') is not False or r.get('final_ready') is not False:
              raise SystemExit('safety flag violation')
          batch_ev={
            'batch_name':CITY,'bbox':BBOX,'local_authority':'Kensington & Chelsea',
            'overpass_endpoint':ENDPOINT,'response_sha256':sha,'new_feature_count':50,
            'attempted_parcels':50,'no_evidence_this_batch':False,'accessed_at':now}
          sta.update({
            'updated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,
            'current_feature_count':AFTER,'total_elements':AFTER,'new_features_added':50,
            'result':{'state':'BATCH_APPENDED','note':f'Appended exactly 50 new {CITY} evidence-backed OSM features; feature.id/parcel_id/osm_id/source_ref deduped.'},
            'last_batch':[batch_ev],'next_batch_index':135,'next_target_feature_count':NEXT,
            'blocker':None,'fake_data':False,'final_ready':False,'progress_counted':True,
            'note':f'Appended exactly 50 unique {CITY} OSM evidence-backed building elements; no second task/owner created.'})
          cp.update({
            'last_batch_name':CITY,'last_batch_new_features':50,'last_batch_evidence':[batch_ev],
            'next_grid_hint':'Hammersmith_West_Kensington_G','read_fallback_used':False,
            'fake_data':False,'final_ready':False})
          man.update({
            'updated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,
            'new_features_added':50,'current_feature_count':AFTER,'feature_count':AFTER,
            'total_features':AFTER,'next_batch_index':135,'next_target_feature_count':NEXT,
            'continuation_key':'','fake_data':False,'final_ready':False})
          run.update({'attempted_parcels':50,'source_path':ENDPOINT,'no_evidence_this_batch':False,'fake_data':False,'final_ready':False})
          ct.update({'fake_data':False,'final_ready':False,'owner':None,'continuation_key':''})
          dump('geo',geo,compact=True); dump('man',man); dump('sta',sta); dump('cp',cp); dump('ct',ct); dump('run',run)
          PY
      - name: Commit and push exact slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_1_latest.geojson \
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json
          git diff --cached --quiet && { echo 'No progress'; exit 1; }
          git commit -m 'data(building_type_1): append Hammersmith West Kensington F OSM batch 134 8500->8550'
          for a in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
            if ! git rebase origin/codex/aays-single-runner-v5-20260706; then git rebase --abort || true; exit 1; fi
          done
          exit 1
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_1_latest.geojson')
          m=j('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json')
          c=j('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json')
          s=j('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json')
          r=j('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json')
          t=j('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json')
          assert len(g.get('features') or [])==8550
          assert c.get('feature_count_before')==8500 and c.get('feature_count_after')==8550 and c.get('current_feature_count')==8550 and c.get('next_batch_index')==135
          assert s.get('feature_count_before')==8500 and s.get('feature_count_after')==8550 and s.get('current_feature_count')==8550 and s.get('total_elements')==8550 and s.get('new_features_added')==50
          assert r.get('city')=='Hammersmith_West_Kensington_F' and r.get('attempted_parcels')==50 and r.get('new_feature_count')==50 and r.get('feature_count_before')==8500 and r.get('feature_count_after')==8550
          assert t.get('owner') is None and (t.get('continuation_key') or '')==''
          assert m.get('total_features')==8550 and m.get('current_feature_count')==8550
          assert all(x.get('fake_data') is False for x in (c,s,r,t,m))
          assert all(x.get('final_ready') is False for x in (c,s,r,t,m))
          rec=r.get('records') or []
          assert len(rec)==50
          for x in rec:
              assert x.get('building_type_primary') not in (None,'','unknown')
              assert x.get('evidence_excerpt') and x.get('evidence_level') != 'U'
              assert x.get('confidence_level_1_to_4') in {1,2,3,4}
              assert x.get('source_ref') and x.get('source_url') and x.get('source_path') and x.get('source_hash') and x.get('sources')
              assert x['sources'][0].get('accessed_at') and x['sources'][0].get('fields_used')
              assert x.get('fake_data') is False and x.get('final_ready') is False
          seen=set()
          for f in g.get('features') or []:
              p=f.get('properties') or {}
              vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')) if v not in (None,'')}
              assert not (seen & vals)
              seen.update(vals)
          print('REMOTE_READBACK_OK building_type_1 8500->8550 batch134 Hammersmith_West_Kensington_F attempted=50 final_ready=false')
          PY
