name: security-public-safety-2-wave61-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave61_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture wave61 run
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          cmd = ['gh','run','list','--repo',os.environ['GITHUB_REPOSITORY'],'--workflow','security_public_safety_2_wave61_incremental.yml','--limit','5','--json','databaseId,status,conclusion,createdAt,startedAt,updatedAt,event,headSha,url,workflowName,attempt']
          p = subprocess.run(cmd, text=True, capture_output=True)
          try:
              runs = json.loads(p.stdout or '[]')
          except json.JSONDecodeError:
              runs = []
          payload = {
              'schema_version': 1,
              'slot_id': 'security_public_safety_2',
              'task_id': 'security_public_safety_2_priority_6970row_incremental_evidence_expansion_20260730',
              'continuation_key': '72821d58cee55269d7897425cac337a317486de2481229866b6b3caba36c51e8',
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'returncode': p.returncode,
              'stderr': p.stderr,
              'runs': runs,
          }
          path = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave61_run_diagnostic_20260730.json')
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave61_run_diagnostic_20260730.json
          git commit -m 'record security_public_safety_2 wave61 run diagnostic'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
