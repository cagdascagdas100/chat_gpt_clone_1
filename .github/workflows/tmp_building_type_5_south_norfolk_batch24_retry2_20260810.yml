name: tmp building_type_5 South Norfolk batch24 retry2

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_5_south_norfolk_batch24_retry2_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-5-write
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'retry guarded South Norfolk batch 24')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Build verified South Norfolk append script and run
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          src_commit='bf86fbf19e0aa2a1f0f41aed648f713e628eabaf'
          src_path='.github/workflows/tmp_building_type_5_broadland_batch23_20260810.yml'
          text=subprocess.check_output(['git','show',f'{src_commit}:{src_path}'],text=True)
          marker='        run: |\n'
          start=text.index(marker)+len(marker)
          end=text.index('\n      - name: Cleanup temporary workflow on failure',start)
          block=text[start:end]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'

          exact=[
            (".github/workflows/tmp_building_type_5_broadland_batch23_20260810.yml",
             ".github/workflows/tmp_building_type_5_south_norfolk_batch24_retry2_20260810.yml"),
            ("FHRS228en-GB.xml","FHRS233en-GB.xml"),
            ("BEFORE=1100","BEFORE=1150"),
            ("BATCH=23","BATCH=24"),
            ("TARGET=1150","TARGET=1200"),
            ("PREFIX='BRD'","PREFIX='SNF'"),
            ("int(s.get('feature_count_after',-1))==1100","int(s.get('feature_count_after',-1))==1150"),
            ("int(c.get('current_feature_count',-1))==1100","int(c.get('current_feature_count',-1))==1150"),
            ("int(c.get('next_batch_index',-1))==23","int(c.get('next_batch_index',-1))==24"),
            ("int(c.get('next_target_feature_count',-1))==1150","int(c.get('next_target_feature_count',-1))==1200"),
            ("int(m.get('total_features',-1))==1100","int(m.get('total_features',-1))==1150"),
            ("append South Norfolk FHRS batch 1100->1150","append South Norfolk FHRS batch 1150->1200"),
          ]
          # Replace path/numeric guards first, then authority labels in every remaining context.
          for old,new in exact:
              if old not in script:
                  raise SystemExit(f'missing template token: {old}')
              script=script.replace(old,new)
          script=script.replace('BATCH_23','BATCH_24')
          script=script.replace('BROADLAND','SOUTH_NORFOLK')
          script=script.replace('Broadland','South Norfolk')
          script=script.replace('broadland','south norfolk')
          script=script.replace('Batch 23','Batch 24')

          forbidden=['FHRS228en-GB.xml','Broadland','broadland','BROADLAND','BEFORE=1100','BATCH=23','TARGET=1150',"PREFIX='BRD'",
                     "feature_count_after',-1))==1100","current_feature_count',-1))==1100","next_batch_index',-1))==23","next_target_feature_count',-1))==1150","total_features',-1))==1100"]
          leftovers=[x for x in forbidden if x in script]
          if leftovers:
              raise SystemExit(f'stale template tokens remain: {leftovers}')
          required=['South Norfolk','FHRS233en-GB.xml','BEFORE=1150','BATCH=24','TARGET=1200',"PREFIX='SNF'",'classified_proxy_only','evidence_excerpt','confidence_level_1_to_4']
          missing=[x for x in required if x not in script]
          if missing:
              raise SystemExit(f'required transformed tokens missing: {missing}')
          Path('/tmp/run_batch24.sh').write_text(script,encoding='utf-8')
          PY
          bash -n /tmp/run_batch24.sh
          bash /tmp/run_batch24.sh

      - name: Cleanup temporary workflow on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_5_south_norfolk_batch24_retry2_20260810.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if [ ! -f "$WF" ]; then exit 0; fi
            git rm -f "$WF"
            git commit -m 'chore(building_type_5): cleanup failed South Norfolk batch 24 retry2'
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 2
          done
          exit 1
