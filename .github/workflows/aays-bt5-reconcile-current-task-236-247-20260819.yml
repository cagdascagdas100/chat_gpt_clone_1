name: AAYS BT5 reconcile current-task 236-247
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-reconcile-current-task-236-247-20260819.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Mark reconcile started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo; const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_reconcile_236_247_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'RUNNING',run_id:String(context.runId),started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 reconcile started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Reconcile only BT5 current-task metadata
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          git config user.name 'AAYS building_type_5'
          git config user.email 'aays-building-type-5@users.noreply.github.com'
          python - <<'PY'
          import json
          from pathlib import Path
          cp=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          cur=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          c=json.loads(cp.read_text()); x=json.loads(cur.read_text())
          if int(c.get('source_window_cursor',-1))!=247 or int(c.get('canonical_feature_cursor',-1))!=195: raise SystemExit('BT5_CURSOR_CHANGED')
          nr=x.get('new_page_resume') or {}
          nr.update({'canonical_shard_blob_sha':'63b8eac33ed7510800a2d8462d7bec58a9d3a6f5','canonical_manifest_sha':'5a4c7c0767b93522a1c0254da897c715d6d3420a','canonical_feature_count':6100,'next_batch_index':195,'canonical_feature_cursor':195,'source_window_cursor':247,'terminal_no_replay_through_cursor':247,'source_processing_attempted':True,'source_payload_verified':True})
          x['new_page_resume']=nr; x['owner']=None
          cur.write_text(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git add -- docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json
          git commit -m 'aays: reconcile building_type_5 current-task after 236-247'
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            rc=$(git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json | python -c "import sys,json; print(json.load(sys.stdin)['source_window_cursor'])")
            test "$rc" = 247 || { echo "BT5_CURSOR_CHANGED:$rc"; exit 2; }
            git rebase origin/codex/aays-single-runner-v5-20260706 || { git rebase --abort || true; exit 3; }
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then ok=1; break; fi
            sleep "$i"
          done
          test "$ok" = 1
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json | python -c "import sys,json; x=json.load(sys.stdin); n=x['new_page_resume']; assert n['source_window_cursor']==247 and n['canonical_feature_cursor']==195 and n['canonical_shard_blob_sha']=='63b8eac33ed7510800a2d8462d7bec58a9d3a6f5' and n['canonical_manifest_sha']=='5a4c7c0767b93522a1c0254da897c715d6d3420a' and x.get('owner') is None; print('CURRENT_TASK_READBACK_OK')"
      - name: Mark reconcile finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo; const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_reconcile_236_247_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),finished_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 reconcile finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
