name: tmp building_type_7 Herefordshire batch 9

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_herefordshire_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-herefordshire-batch-9
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 Herefordshire FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git show fa59a9179e6365dc146a5beaeaaf5d6358009e44:.github/workflows/tmp_building_type_7_dudley_20260810.yml > /tmp/template.yml
          python3 <<'PY'
          from pathlib import Path
          text = Path('/tmp/template.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in text:
              raise SystemExit('template run block missing')
          shell = text.split(marker, 1)[1]
          lines = shell.splitlines()
          shell = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          shell = shell.replace('expected_before = 350', 'expected_before = 400', 1)
          shell = shell.replace('expected_target = 400', 'expected_target = 450', 1)
          shell = shell.replace('source_name = "Food Standards Agency FHRS daily open data - Dudley"', 'source_name = "Food Standards Agency FHRS daily open data - Herefordshire"', 1)
          old_source = 'source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS409en-GB.xml"'
          discovery = '\n'.join([
              'source_url = None',
              'auth_req = urllib.request.Request(',
              '    "https://ratings.food.gov.uk/api/authorities/basic",',
              '    headers={"User-Agent": "AAYS-building-type/1.0", "x-api-version": "2"},',
              ')',
              'with urllib.request.urlopen(auth_req, timeout=90) as auth_resp:',
              '    auth_payload = json.loads(auth_resp.read().decode("utf-8"))',
              'def walk_dicts(obj):',
              '    if isinstance(obj, dict):',
              '        yield obj',
              '        for value in obj.values():',
              '            yield from walk_dicts(value)',
              '    elif isinstance(obj, list):',
              '        for value in obj:',
              '            yield from walk_dicts(value)',
              'authority_id = None',
              'for item in walk_dicts(auth_payload):',
              '    name = str(item.get("Name") or item.get("LocalAuthorityName") or item.get("name") or "")',
              '    if "herefordshire" not in name.lower():',
              '        continue',
              '    for key in ("LocalAuthorityId", "LocalAuthorityID", "Id", "id"):',
              '        value = item.get(key)',
              '        if value is not None and str(value).strip():',
              '            authority_id = str(value).strip()',
              '            break',
              '    if authority_id:',
              '        break',
              'if not authority_id:',
              '    raise SystemExit("Herefordshire authority ID not found in official FSA authorities API")',
              'source_url = f"https://ratings.food.gov.uk/api/open-data-files/FHRS{authority_id}en-GB.xml"',
          ])
          if old_source not in shell:
              raise SystemExit('template source line missing')
          shell = shell.replace(old_source, discovery, 1)
          shell = shell.replace('city = "Dudley"', 'city = "Herefordshire"', 1)
          shell = shell.replace('prefix = "DUD"', 'prefix = "HFD"', 1)
          shell = shell.replace('"dudley" not in la.lower()', '"herefordshire" not in la.lower()', 1)
          shell = shell.replace('52.35 <= lat <= 52.65 and -2.30 <= lon <= -1.85', '51.80 <= lat <= 52.45 and -3.30 <= lon <= -2.20', 1)
          shell = shell.replace('eligible Dudley FHRS candidates', 'eligible Herefordshire FHRS candidates')
          shell = shell.replace('50 Dudley FHRS records', '50 Herefordshire FHRS records')
          shell = shell.replace('BATCH_APPENDED_50_DUDLEY_FHRS_CONTINUATION_REQUIRED', 'BATCH_APPENDED_50_HEREFORDSHIRE_FHRS_CONTINUATION_REQUIRED')
          shell = shell.replace('building_type_7 append Dudley FHRS batch', 'building_type_7 append Herefordshire FHRS batch')
          required = [
              'expected_before = 400', 'expected_target = 450', 'city = "Herefordshire"',
              'prefix = "HFD"', 'authority_id', 'BATCH_APPENDED_50_HEREFORDSHIRE_FHRS_CONTINUATION_REQUIRED'
          ]
          missing = [x for x in required if x not in shell]
          if missing:
              raise SystemExit(f'template patch incomplete: {missing}')
          Path('/tmp/run_herefordshire.sh').write_text(shell, encoding='utf-8')
          PY
          bash /tmp/run_herefordshire.sh
