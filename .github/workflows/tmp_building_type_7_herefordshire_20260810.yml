name: tmp building_type_7 Herefordshire batch 9

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_herefordshire_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-herefordshire-batch-9
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 Herefordshire FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git show fa59a9179e6365dc146a5beaeaaf5d6358009e44:.github/workflows/tmp_building_type_7_dudley_20260810.yml > /tmp/template.yml
          python3 <<'PY'
          from pathlib import Path
          text = Path('/tmp/template.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in text:
              raise SystemExit('template run block missing')
          shell = text.split(marker, 1)[1]
          lines = shell.splitlines()
          shell = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          replacements = [
              ('expected_before = 350', 'expected_before = 400'),
              ('expected_target = 400', 'expected_target = 450'),
              ('source_name = "Food Standards Agency FHRS daily open data - Dudley"', 'source_name = "Food Standards Agency FHRS daily open data - Herefordshire"'),
              ('source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS409en-GB.xml"', 'source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS895en-GB.xml"'),
              ('city = "Dudley"', 'city = "Herefordshire"'),
              ('prefix = "DUD"', 'prefix = "HFD"'),
              ('"dudley" not in la.lower()', '"herefordshire" not in la.lower()'),
              ('52.35 <= lat <= 52.65 and -2.30 <= lon <= -1.85', '51.80 <= lat <= 52.45 and -3.30 <= lon <= -2.20'),
              ('eligible Dudley FHRS candidates', 'eligible Herefordshire FHRS candidates'),
              ('50 Dudley FHRS records', '50 Herefordshire FHRS records'),
              ('BATCH_APPENDED_50_DUDLEY_FHRS_CONTINUATION_REQUIRED', 'BATCH_APPENDED_50_HEREFORDSHIRE_FHRS_CONTINUATION_REQUIRED'),
              ('building_type_7 append Dudley FHRS batch', 'building_type_7 append Herefordshire FHRS batch'),
          ]
          for old, new in replacements:
              if old not in shell:
                  raise SystemExit(f'template token missing: {old}')
              shell = shell.replace(old, new)
          required = [
              'expected_before = 400', 'expected_target = 450',
              'FHRS895en-GB.xml', 'city = "Herefordshire"', 'prefix = "HFD"',
              'BATCH_APPENDED_50_HEREFORDSHIRE_FHRS_CONTINUATION_REQUIRED'
          ]
          missing = [x for x in required if x not in shell]
          if missing:
              raise SystemExit(f'template patch incomplete: {missing}')
          Path('/tmp/run_herefordshire.sh').write_text(shell, encoding='utf-8')
          PY
          bash /tmp/run_herefordshire.sh
