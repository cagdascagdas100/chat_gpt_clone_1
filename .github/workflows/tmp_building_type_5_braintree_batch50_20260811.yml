          man=json.loads(mp.read_text()); man.update({'slot_id':SLOT,'generated_at':now,'total_features':AFTER,'classified':AFTER-unknown,'unknown':unknown,'evidence_distribution':dict(ed),'type_distribution':dict(td),'confidence_level_distribution':dict(cd)}); man.setdefault('sources',[]).append({'name':source,'url':surl,'features_used':50,'accessed_at':now,'source_sha256':sha,'query_sha256':qsha,'license':'ODbL 1.0','evidence_distribution':dict(bec),'confidence_level_distribution':dict(bcc),'city':CITY,'grid_id':GRID}); mp.write_text(json.dumps(man,indent=2))
