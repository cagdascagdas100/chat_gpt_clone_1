          st=json.loads(sp.read_text()); st.update({'state':'IN_PROGRESS','status':'in_progress','updated_at':now,'owner':None,'final_ready':False,'fake_data':False,'classified_count':AFTER-unknown,'unknown_count':unknown,'total_elements':AFTER,'current_feature_count':AFTER,'feature_count_before':BEFORE,'feature_count_after':AFTER,'progress_count_delta':50,'new_feature_count':50,'new_features_appended':50,'next_batch_index':51,'next_target_feature_count':NEXT,'confidence_distribution':dict(cd),'evidence_distribution':dict(ed),'output_sha256':gsha,'last_batch_index':BATCH,'last_batch_city':CITY,'last_city':CITY,'last_grid_id':GRID,'last_batch_source':source,'last_source':source,'last_source_sha256':sha,'evidence_level':'B' if not unk else 'MIXED','confidence_level_1_to_4':3 if not unk else 1,'blocker':None,'candidate_batch':None,'no_progress_reason':None,'progress_reason':f'50 new Braintree OSM building features appended after feature.id/parcel_id/osm_id exclusion; {source} used','note':'Batch 50 appended 50 Braintree records outside all prior feature.id, parcel_id and osm_id values; same task retained, owner null.'}); sp.write_text(json.dumps(st,indent=2))
