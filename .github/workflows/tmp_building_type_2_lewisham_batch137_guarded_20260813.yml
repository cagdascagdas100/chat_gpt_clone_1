name: tmp building_type_2 Lewisham FHRS continuation batch 137 guarded

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_lewisham_batch137_guarded_20260813.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 processed-ID-external Lewisham FHRS features
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          template_path=Path('.github/workflows/tmp_building_type_2_bromley_batch126_direct_20260812.yml')
          text=template_path.read_text(encoding='utf-8')
          marker="          python3 <<'PY'\n"
          start=text.find(marker)
          if start < 0: raise SystemExit('FAIL_CLOSED append template marker missing')
          start += len(marker)
          end=text.find("\n          PY", start)
          if end < 0: raise SystemExit('FAIL_CLOSED append template terminator missing')
          script=textwrap.dedent(text[start:end])

          replacements=[
            ("CITY='Bromley'; REGION='London Outer'", "CITY='Lewisham'; REGION='London Outer'"),
            ("SOURCE='Food Standards Agency FHRS daily open data - Bromley'", "SOURCE='Food Standards Agency FHRS daily open data - Lewisham'"),
            ("URL='https://ratings.food.gov.uk/api/open-data-files/FHRS505en-GB.xml'", "URL='https://ratings.food.gov.uk/api/open-data-files/FHRS523en-GB.xml'"),
            ("BEFORE=6250; TARGET=6300; BATCH=126; NEXT_BATCH=127; NEXT_TARGET=6350", "BEFORE=6800; TARGET=6850; BATCH=137; NEXT_BATCH=138; NEXT_TARGET=6900"),
            ("if not prefix: prefix='BROMLEY'", "if not prefix: prefix='LEWISHAM'"),
            ("if authority and 'bromley' not in authority.lower(): continue", "if authority and 'lewisham' not in authority.lower(): continue"),
            ("('insufficient processed-ID-external Bromley FHRS candidates',len(candidates))", "('insufficient processed-ID-external Lewisham FHRS candidates',len(candidates))"),
            ("'Existing shard preserved; appended 50 Bromley FHRS continuation records outside all prior feature.id, parcel_id and osm_id values.'", "'Existing shard preserved; appended 50 Lewisham FHRS continuation records outside all prior feature.id, parcel_id and osm_id values.'"),
            ("'note':'Batch 126 appended from official Bromley FHRS continuation records outside all prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.'", "'note':'Batch 137 appended from official Lewisham FHRS continuation records outside all prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.'"),
            ("'progress_reason':'50 new Bromley FHRS continuation premises-use proxy records appended after feature.id/parcel_id/osm_id exclusion'", "'progress_reason':'50 new Lewisham FHRS continuation premises-use proxy records appended after feature.id/parcel_id/osm_id exclusion'"),
            ("'first_unverified_step_status':'BATCH_126_APPENDED_50_BROMLEY_FHRS_CONTINUATION_REQUIRED'", "'first_unverified_step_status':'BATCH_137_APPENDED_50_LEWISHAM_FHRS_CONTINUATION_REQUIRED'"),
            ("'note':'PROGRESS: feature_count 6250 -> 6300. Mevcut sharddaki feature.id, parcel_id ve osm_id degerleri already_processed_ids kabul edildi; Bromley FHRS acik verisinden processed kumesi disinda 50 yeni premises-use proxy feature append edildi.'", "'note':'PROGRESS: feature_count 6800 -> 6850. Mevcut sharddaki feature.id, parcel_id ve osm_id degerleri already_processed_ids kabul edildi; Lewisham FHRS acik verisinden processed kumesi disinda 50 yeni premises-use proxy feature append edildi.'"),
            ("'note':'Sonraki adim batch 127: mevcut 6300 featurein feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 6300 kaydi tekrar isleme.'", "'note':'Sonraki adim batch 138: mevcut 6850 featurein feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 6850 kaydi tekrar isleme.'"),
            ("print(f'prepared {before}->{after}; Bromley source {source_sha}; prefix={prefix}; candidates={len(candidates)}')", "print(f'prepared {before}->{after}; Lewisham source {source_sha}; prefix={prefix}; candidates={len(candidates)}')")
          ]
          for old,new in replacements:
              count=script.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL_CLOSED replacement count {count}: {old}')
              script=script.replace(old,new)
          stale=["CITY='Bromley'","FHRS505en-GB.xml","BATCH_126_APPENDED_50_BROMLEY","feature_count 6250 -> 6300","batch 127: mevcut 6300"]
          for literal in stale:
              if literal in script: raise SystemExit(f'FAIL_CLOSED stale literal remains: {literal}')
          exec(compile(script,'<building_type_2_lewisham_batch137>','exec'),{'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          URL='https://ratings.food.gov.uk/api/open-data-files/FHRS523en-GB.xml'
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==6850
          assert manifest['feature_count_before']==6800 and manifest['feature_count_after']==6850 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==6850 and checkpoint['next_batch_index']==138 and checkpoint['next_target_feature_count']==6900
          assert status['current_feature_count']==6850 and runner['feature_count_before']==6800 and runner['feature_count_after']==6850 and runner['added_feature_count']==50
          assert task['owner'] is None and task['task_id']=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          assert runner.get('already_processed_ids_policy_applied') is True and runner['city']=='Lewisham'
          ids=list(runner['new_feature_ids']); assert len(ids)==50 and len(set(ids))==50
          batch=[f for f in shard['features'] if f.get('id') in set(ids)]; assert len(batch)==50 and len(runner['records'])==50
          assert len({f.get('id') for f in shard['features']})==6850
          assert len({(f.get('properties') or {}).get('parcel_id') for f in batch})==50
          assert len({str((f.get('properties') or {}).get('fhrs_id')) for f in batch})==50
          source_rows=[f for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL]; assert len(source_rows)==300
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]; assert len(src)==1 and src[0]['features_used']==300
          for f in batch:
              p=f.get('properties') or {}
              assert p.get('source_url')==URL and p.get('source_hash') and p.get('sources')
              assert p.get('evidence_excerpt') and p.get('source_evidence_excerpt')
              assert p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2 and p.get('confidence_score')==0.55
              assert p.get('needs_manual_review') is True and p.get('fake_data') is False and p.get('final_ready') is False
          print('validated building_type_2 6800->6850 with exactly 50 new Lewisham features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          paths=(
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r p; do ok=0; for e in "${paths[@]}"; do [[ "$p" == "$e" ]] && ok=1; done; [[ "$ok" == 1 ]] || { echo "unexpected staged path: $p"; exit 1; }; done < <(git diff --cached --name-only)
          git diff --cached --check
          git commit -m "data(building_type_2): append Lewisham FHRS batch 137 6800->6850"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'
          def load(p): return json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          if cp.get('current_feature_count') != 6800 or cp.get('next_batch_index') != 137 or cp.get('next_target_feature_count') != 6850:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_2 checkpoint moved; do not overwrite')
          if task.get('task_id') != 'building-type-2-england-classification-v1-20260808' or task.get('owner') is not None:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_2 task/owner changed')
          if task.get('fake_data') is not False or task.get('final_ready') is not False:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_2 safety flags changed')
          PY
            if ! git merge --no-edit "origin/$BRANCH"; then git merge --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; URL='https://ratings.food.gov.uk/api/open-data-files/FHRS523en-GB.xml'
          def load(p): return json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==6850
          assert manifest['feature_count_before']==6800 and manifest['feature_count_after']==6850 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==6850 and checkpoint['next_batch_index']==138 and checkpoint['next_target_feature_count']==6900
          assert status['current_feature_count']==6850 and runner['city']=='Lewisham' and len(runner['new_feature_ids'])==50 and runner.get('already_processed_ids_policy_applied') is True
          assert task['owner'] is None and task['task_id']=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          ids=set(runner['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]; assert len(batch)==50
          assert all((f.get('properties') or {}).get('evidence_excerpt') and (f.get('properties') or {}).get('source_evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('evidence_level')=='D' and (f.get('properties') or {}).get('confidence_level_1_to_4')==2 for f in batch)
          assert all((f.get('properties') or {}).get('fake_data') is False and (f.get('properties') or {}).get('final_ready') is False for f in batch)
          source_rows=[f for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL]; assert len(source_rows)==300
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]; assert len(src)==1 and src[0]['features_used']==300
          print('remote readback verified building_type_2 6800->6850 batch137 Lewisham; final_ready=false')
          PY
