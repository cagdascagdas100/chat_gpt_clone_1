name: security-public-safety-2-wave60-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave60_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture wave60 run
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          cmd = ['gh','run','list','--workflow','security_public_safety_2_wave60_incremental.yml','--branch','codex/aays-single-runner-v5-20260706','--limit','3','--json','databaseId,status,conclusion,createdAt,startedAt,updatedAt,event,headSha,url,workflowName,attempt']
          proc = subprocess.run(cmd, text=True, capture_output=True)
          try:
              runs = json.loads(proc.stdout or '[]')
          except json.JSONDecodeError:
              runs = []
          payload = {
              'schema_version': 1,
              'slot_id': 'security_public_safety_2',
              'task_id': 'security_public_safety_2_priority_6610row_incremental_evidence_expansion_20260730',
              'continuation_key': '6757d62b9226dc562217fd84b23f7b9ef2f9fda4d7362c745ede1abbc8e84947',
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'returncode': proc.returncode,
              'stderr': proc.stderr,
              'runs': runs,
          }
          path = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave60_run_status_latest.json')
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave60_run_status_latest.json
          git commit -m 'record security_public_safety_2 wave60 run status'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
