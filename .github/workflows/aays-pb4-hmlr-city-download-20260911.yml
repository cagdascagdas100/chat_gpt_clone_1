name: AAYS PB4 HMLR City of London INSPIRE ZIP 20260911
on:
  push:
    branches:
      - 'agent/aays-pb4-probe-20260911'
    paths:
      - '.github/workflows/aays-pb4-hmlr-city-download-20260911.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download current public HMLR City of London INSPIRE ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pb4_hmlr_city
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,json,zipfile,io,os,datetime
          url='https://use-land-property-data.service.gov.uk/datasets/inspire/download/City_of_London_Corporation.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS-ChatGPT/1.0 planned_buildings_4 HMLR public download','Accept':'*/*'})
          out={'schema':'pb4_hmlr_city_download_v1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'url':url}
          try:
            with urllib.request.urlopen(req,timeout=300) as r:
              d=r.read(); out.update({'http_status':getattr(r,'status',None),'final_url':r.geturl(),'content_type':r.headers.get('Content-Type'),'content_disposition':r.headers.get('Content-Disposition'),'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest()})
            open('pb4_hmlr_city/City_of_London_Corporation.zip','wb').write(d)
            z=zipfile.ZipFile(io.BytesIO(d)); out['members']=[]
            for zi in z.infolist():
              if zi.is_dir(): continue
              b=z.read(zi.filename); safe=os.path.basename(zi.filename)
              open('pb4_hmlr_city/'+safe,'wb').write(b)
              out['members'].append({'original_name':zi.filename,'path':safe,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          except urllib.error.HTTPError as e:
            b=e.read(); out.update({'http_status':e.code,'error':str(e),'final_url':getattr(e,'url',url),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'preview':b[:2000].decode('utf-8','replace')})
            open('pb4_hmlr_city/http_error.raw','wb').write(b)
          except Exception as e:
            out.update({'http_status':None,'error_type':type(e).__name__,'error':str(e)})
          open('pb4_hmlr_city/summary.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Upload HMLR City artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb4-hmlr-city-inspire
          path: pb4_hmlr_city
          if-no-files-found: error
          retention-days: 7
