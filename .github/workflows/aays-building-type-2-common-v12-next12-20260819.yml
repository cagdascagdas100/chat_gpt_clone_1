name: AAYS building_type_2 next 12 unused bounded windows v12

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-common-v12-next12-20260819.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-common-v10-next12-20260818
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 420
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-2-common-v2-b177-188-20260818.yml
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs
      - name: Select unused windows and execute proven v2 driver
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          from pathlib import Path
          import json

          driver_path=Path('.github/workflows/aays-building-type-2-common-v2-b177-188-20260818.yml')
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          task_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          geo_path=Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          man_path=Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          cp=json.loads(cp_path.read_text(encoding='utf-8'))
          st=json.loads(st_path.read_text(encoding='utf-8'))
          task=json.loads(task_path.read_text(encoding='utf-8'))
          geo=json.loads(geo_path.read_text(encoding='utf-8'))
          man=json.loads(man_path.read_text(encoding='utf-8'))
          start_batch=int(cp['next_batch_index'])
          start_count=len(geo.get('features') or [])
          assert start_batch >= 285, (start_batch, 'refusing stale/replayed cursor')
          assert cp.get('current_feature_count')==start_count
          assert st.get('total_elements')==start_count
          assert man.get('total_features')==start_count
          assert task.get('owner') in (None,'')
          assert (task.get('continuation_key') or '') == 'building-type-2-england-classification-v1-20260808'

          candidates=[
            ('Upminster','Havering',[0.22,51.54,0.28,51.58]),
            ('Rainham','Havering',[0.16,51.50,0.22,51.54]),
            ('Dagenham East','Barking and Dagenham',[0.13,51.53,0.19,51.57]),
            ('Becontree','Barking and Dagenham',[0.10,51.54,0.16,51.58]),
            ('East Ham','Newham',[0.03,51.51,0.09,51.55]),
            ('Forest Gate','Newham',[0.00,51.53,0.06,51.57]),
            ('Plaistow','Newham',[0.00,51.51,0.06,51.54]),
            ('Colindale','Barnet',[-0.27,51.57,-0.21,51.60]),
            ('Golders Green','Barnet',[-0.23,51.56,-0.17,51.59]),
            ('Muswell Hill','Haringey',[-0.17,51.58,-0.11,51.61]),
            ('Wood Green','Haringey',[-0.13,51.58,-0.07,51.61]),
            ('Tottenham North','Haringey',[-0.09,51.59,-0.03,51.63]),
            ('Feltham','Hounslow',[-0.44,51.43,-0.38,51.47]),
            ('Hanworth','Hounslow',[-0.41,51.42,-0.35,51.46]),
            ('Brentford','Hounslow',[-0.33,51.47,-0.27,51.50]),
            ('Uxbridge','Hillingdon',[-0.50,51.53,-0.44,51.57]),
            ('Ickenham','Hillingdon',[-0.46,51.55,-0.40,51.59]),
            ('Yiewsley','Hillingdon',[-0.50,51.50,-0.44,51.54]),
            ('Surbiton','Kingston upon Thames',[-0.33,51.38,-0.27,51.42]),
            ('Mitcham','Merton',[-0.19,51.38,-0.13,51.42]),
            ('Wallington','Sutton',[-0.17,51.35,-0.11,51.39]),
            ('Belmont','Sutton',[-0.23,51.33,-0.17,51.37]),
            ('Coulsdon','Croydon',[-0.16,51.29,-0.10,51.33]),
            ('Sanderstead','Croydon',[-0.11,51.32,-0.05,51.36]),
            ('Addiscombe','Croydon',[-0.10,51.37,-0.04,51.41]),
            ('Richmond East','Richmond upon Thames',[-0.28,51.45,-0.22,51.49]),
            ('Ham','Richmond upon Thames',[-0.33,51.43,-0.27,51.47]),
            ('Edgware','Barnet',[-0.30,51.60,-0.24,51.64]),
            ('Burnt Oak','Barnet',[-0.29,51.59,-0.23,51.62]),
            ('Chipping Barnet','Barnet',[-0.23,51.64,-0.17,51.68]),
            ('Whetstone','Barnet',[-0.19,51.62,-0.13,51.66]),
            ('East Finchley','Barnet',[-0.19,51.58,-0.13,51.61]),
            ('Stanmore','Harrow',[-0.34,51.60,-0.28,51.64]),
            ('Harrow Weald','Harrow',[-0.36,51.59,-0.30,51.63]),
            ('Ruislip','Hillingdon',[-0.45,51.56,-0.39,51.60]),
            ('Northwood','Hillingdon',[-0.45,51.60,-0.39,51.64]),
            ('Southall','Ealing',[-0.40,51.49,-0.34,51.53]),
