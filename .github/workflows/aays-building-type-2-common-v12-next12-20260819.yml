            ('Acton West','Ealing',[-0.30,51.50,-0.24,51.54]),
            ('Twickenham','Richmond upon Thames',[-0.36,51.43,-0.30,51.47]),
            ('Mortlake','Richmond upon Thames',[-0.28,51.46,-0.22,51.50]),
            ('Barnes West','Richmond upon Thames',[-0.27,51.46,-0.21,51.50]),
            ('Teddington South','Richmond upon Thames',[-0.35,51.40,-0.29,51.44]),
            ('Hampton','Richmond upon Thames',[-0.39,51.40,-0.33,51.44]),
            ('Thames Ditton','Kingston upon Thames',[-0.34,51.37,-0.28,51.41]),
            ('Berrylands','Kingston upon Thames',[-0.31,51.38,-0.25,51.42]),
            ('Malden Rushett','Kingston upon Thames',[-0.33,51.31,-0.27,51.35]),
            ('Carshalton','Sutton',[-0.19,51.35,-0.13,51.39]),
            ('Hackbridge','Sutton',[-0.17,51.37,-0.11,51.41]),
            ('Banstead North','Sutton',[-0.23,51.31,-0.17,51.35]),
            ('Purley','Croydon',[-0.14,51.32,-0.08,51.36]),
            ('South Croydon','Croydon',[-0.12,51.34,-0.06,51.38]),
            ('Shirley','Croydon',[-0.08,51.36,-0.02,51.40]),
            ('Orpington South','Bromley',[0.07,51.35,0.13,51.39]),
            ('Bromley Common','Bromley',[0.00,51.38,0.06,51.42]),
            ('Chislehurst','Bromley',[0.03,51.40,0.09,51.44]),
            ('Erith','Bexley',[0.15,51.47,0.21,51.51]),
            ('Welling East','Bexley',[0.10,51.45,0.16,51.49]),
            ('Blackfen','Bexley',[0.08,51.43,0.14,51.47]),
            ('Eltham','Greenwich',[0.02,51.44,0.08,51.48]),
