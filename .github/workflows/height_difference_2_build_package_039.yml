name: height_difference_2 build uncertainty package 039
on:
  pull_request:
    paths:
      - 'docs/chatgpt_status/topography/shards/height_difference_2/runtime/039_build_package_trigger.json'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hd2-uncertainty-budget-039-clean-20260722
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Build increment 039 package
        run: python docs/chatgpt_status/topography/shards/height_difference_2/automation/039_build_uncertainty_budget_package.py
      - name: Final HTTP DOM acceptance
        run: |
          python -m http.server 8012 --directory england_map_web/data/aays_21_slots/height_difference_2 >/tmp/hd2-http.log 2>&1 &
          echo $! >/tmp/hd2-http.pid
          python - <<'PY'
          import json, pathlib, hashlib
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright
          slot=pathlib.Path('england_map_web/data/aays_21_slots/height_difference_2')
          doc=pathlib.Path('docs/chatgpt_status/topography/shards/height_difference_2')
          console=[]; page_errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1920,'height':1080})
              page.on('console',lambda m: console.append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: page_errors.append(str(e)))
              response=page.goto('http://127.0.0.1:8012/index.html',wait_until='networkidle',timeout=120000)
              page.wait_for_function("document.querySelectorAll('#rows tr').length===792 && document.querySelectorAll('#sources tr').length===70 && document.querySelectorAll('#examples tr').length===48",timeout=120000)
              rows=page.locator('#rows tr').count(); sources=page.locator('#sources tr').count(); examples=page.locator('#examples tr').count()
              body=page.locator('body').inner_text()
              checks={
                'http_200':response.status==200,'operation_rows_792':rows==792,'source_rows_70':sources==70,'example_rows_48':examples==48,
                'three_uncertainty_rows_visible':all(x in body for x in ['HD2-UNCERTAINTY-022','HD2-UNCERTAINTY-023','HD2-UNCERTAINTY-024']),
                'decision_states_visible':all(x in body for x in ['CAUTION_ABSOLUTE_95_BUDGET_PASS_RELATIVE_95_BUDGET','PASS_BOTH_BUDGETS','PASS_BOTH_NARROW_ABSOLUTE_95_MARGIN']),
                'no_console_errors':not console,'no_page_errors':not page_errors
              }
              shot=slot/'port_8012_web_acceptance_final_039.png'; page.screenshot(path=str(shot),full_page=True)
              screenshot_sha=hashlib.sha256(shot.read_bytes()).hexdigest()
              browser.close()
          assert all(checks.values()),checks
          now=datetime.now(timezone.utc).isoformat()
          receipt={'schema_version':1,'slot_id':'height_difference_2','validated_at':now,'state':'PASS','url':'http://127.0.0.1:8012/index.html','http_status':200,'browser':'Chromium','operation_rows':rows,'source_rows':sources,'example_rows':examples,'checks':checks,'console_errors':console,'page_errors':page_errors,'screenshot_sha256':screenshot_sha,'fake_data':False,'final_ready':False}
          for path in [slot/'port_8012_web_acceptance.json',slot/'port_8012_web_acceptance_final_039.json',doc/'validation/046_final_live_http_dom_acceptance_039.json']:
              path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          progress=json.loads((slot/'progress_increment_039.json').read_text()); progress['live_http_browser_state']='PASS_FINAL_792_70_48_CHROMIUM_NO_CONSOLE_OR_PAGE_ERRORS'; progress['updated_at']=now; (slot/'progress_increment_039.json').write_text(json.dumps(progress,ensure_ascii=False,indent=2)+'\n')
          valp=doc/'validation/045_uncertainty_budget_web_package_20260722.json'; val=json.loads(valp.read_text())
          for c in val['checks']:
              if c['check']=='final_039_live_http_browser_acceptance': c['state']='PASS'; c['observed']='HTTP_200_DOM_792_70_48_NO_CONSOLE_OR_PAGE_ERRORS'
          val['pass_count']=sum(c['state']=='PASS' for c in val['checks']); val['not_run_count']=sum(c['state']=='NOT_RUN' for c in val['checks']); val['validated_at']=now; valp.write_text(json.dumps(val,ensure_ascii=False,indent=2)+'\n')
          PY
          kill $(cat /tmp/hd2-http.pid)
      - name: Commit generated result package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/chatgpt_status/topography/shards/height_difference_2/research/039_official_uncertainty_budget_and_decision_gate_20260722.json docs/chatgpt_status/topography/shards/height_difference_2/runtime/039_uncertainty_budget_audit.json docs/chatgpt_status/topography/shards/height_difference_2/validation/045_uncertainty_budget_web_package_20260722.json docs/chatgpt_status/topography/shards/height_difference_2/validation/046_final_live_http_dom_acceptance_039.json england_map_web/data/aays_21_slots/height_difference_2/uncertainty_budget_runtime_039.json england_map_web/data/aays_21_slots/height_difference_2/examples_increment_039.json england_map_web/data/aays_21_slots/height_difference_2/operations_increment_039.json england_map_web/data/aays_21_slots/height_difference_2/progress_increment_039.json england_map_web/data/aays_21_slots/height_difference_2/source_candidates_increment_039.json england_map_web/data/aays_21_slots/height_difference_2/operations_manifest.json england_map_web/data/aays_21_slots/height_difference_2/index.html england_map_web/data/aays_21_slots/height_difference_2/port_8012_web_acceptance.json england_map_web/data/aays_21_slots/height_difference_2/port_8012_web_acceptance_final_039.json
          git commit -m 'height_difference_2: build uncertainty package 039 [skip ci]'
          git push
