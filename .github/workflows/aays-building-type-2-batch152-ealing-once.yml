name: AAYS building_type_2 batch152 Ealing one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-batch152-ealing-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-batch152-ealing-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 90
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs

      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Execute guarded batch152
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text()
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          repl={
            'SLOT = "building_type_6"':'SLOT = "building_type_2"',
            'TASK = "building-type-6-england-classification-v1-20260808"':'TASK = "building-type-2-england-classification-v1-20260808"',
            'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"':'CONT = ""',
            'CITY = "Skegness"':'CITY = "Ealing"',
            'LOCAL_AUTHORITY = "East Lindsey"':'LOCAL_AUTHORITY = "Ealing"',
            'REGION = "East Midlands"':'REGION = "London Outer"',
            'BATCH_INDEX = 26':'BATCH_INDEX = 152',
            'EXPECTED_BEFORE = 2250':'EXPECTED_BEFORE = 7550',
            'ADD_COUNT = 250':'ADD_COUNT = 50',
            'TARGET_AFTER = 2500':'TARGET_AFTER = 7600',
            'NEXT_TARGET = 2750':'NEXT_TARGET = 7650',
            'BBOX = [0.20, 53.08, 0.48, 53.21]':'BBOX = [-0.34, 51.49, -0.27, 51.54]',
            'england_map_web/data/building_type/shards/building_type_6_latest.geojson':'england_map_web/data/building_type/shards/building_type_2_latest.geojson',
            'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json':'england_map_web/data/building_type/shards/building_type_2_manifest_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json',
            'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json':'docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'
          }
          for old,new in repl.items():
              if old not in code: raise SystemExit(f'missing base token: {old}')
              code=code.replace(old,new,1)
          code=code.replace('building_type_6','building_type_2').replace('Skegness','Ealing').replace('SKEGNESS','EALING').replace('skegness','ealing')
          old='if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new='if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old not in code: raise SystemExit('missing continuation guard')
          code=code.replace(old,new,1)
          old='for key in ("parcel_id", "osm_id"):'
          new='for key in ("parcel_id", "osm_id", "source_ref"):'
          if old not in code: raise SystemExit('missing processed-id tuple')
          code=code.replace(old,new,1)
          patches={
            '"area": CITY,':'"area": CITY,\n                  "city": CITY,\n                  "grid_id": "uk-grid-ealing-001",',
            '"building_type_primary": primary,':'"building_type": primary,\n                  "building_type_primary": primary,',
            '"confidence_level_1_to_4": level,':'"confidence": level,\n                  "confidence_level_1_to_4": level,',
            '"source": "OpenStreetMap via Overpass API",':'"evidence_sources": ["OpenStreetMap via Overpass API"],\n                  "evidence_urls": [object_url],\n                  "source": "OpenStreetMap via Overpass API",'
          }
          for old,new in patches.items():
              if old not in code: raise SystemExit(f'missing evidence schema token: {old}')
              code=code.replace(old,new,1)
          if 'dump(CT, task)' not in code: raise SystemExit('missing current_task write token')
          code=code.replace('dump(CT, task)', '# preserve current_task unchanged: same task/owner/continuation')
          Path('/tmp/bt2_b152.py').write_text(code)
          PY
          python /tmp/bt2_b152.py

      - name: Normalize metadata and validate exact batch152
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          G=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          M=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          C=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          S=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          R=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          T=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          def load(p): return json.load(open(p,encoding='utf-8'))
          def dump(p,x): p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          g,m,c,s,r,t=map(load,(G,M,C,S,R,T))
          assert len(g['features'])==7600
          assert c['feature_count_before']==7550 and c['feature_count_after']==7600 and c['next_batch_index']==153
          assert s['total_elements']==7600
          assert r.get('city')=='Ealing' and (r.get('new_feature_count')==50 or r.get('added_feature_count')==50)
          assert t['task_id']=='building-type-2-england-classification-v1-20260808'
          assert t.get('owner') in (None,'') and (t.get('continuation_key') or '')==''
          rec=r.get('records') or []; assert len(rec)==50
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (c,s,r,t))
          assert r.get('raw_source_committed') is False
          for z in rec:
              assert z.get('parcel_id') and z.get('osm_id') and z.get('building_type_primary')
              assert z.get('confidence_level_1_to_4') in {1,2,3,4}
              assert z.get('confidence_score') is not None and z.get('evidence_level')
              assert z.get('source_url') and z.get('sources')
              assert z.get('city')=='Ealing' and z.get('grid_id')=='uk-grid-ealing-001'
              assert z.get('parcel_id_semantics')=='stable OSM element-derived slot identifier; not a cadastral parcel ID'
              assert z.get('fake_data') is False and z.get('final_ready') is False
              for src in z['sources']:
                  assert (src.get('url') or src.get('url_or_local_path'))
                  assert src.get('accessed_at') and src.get('fields_used') and src.get('match_method')
          seen=set()
          for f in g['features']:
              p=f.get('properties') or {}
              vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')) if v not in (None,'')}
              assert not (seen & vals); seen.update(vals)
          assert m.get('total_features')==7600
          new_ids=[z.get('feature_id') for z in rec]
          last={
            'batch_index':152,'city':'Ealing','local_authority':'Ealing','grid_id':'uk-grid-ealing-001',
            'bbox_wgs84':[-0.34,51.49,-0.27,51.54],'added_feature_count':50,
            'source':'OpenStreetMap Overpass API','source_url':r.get('source_url'),
            'source_sha256':r.get('source_sha256'),'classification_basis':'deterministic_osm_building_use_tag_rules_v1',
            'evidence_level_distribution':r.get('evidence_distribution_new') or {},
            'confidence_level_distribution':r.get('confidence_distribution_new') or {},
            'new_feature_ids':new_ids,
            'evidence_level':'B' if (r.get('evidence_distribution_new') or {})=={'B':50} else 'mixed'}
          c['last_batch']=last
          c['summary']['note']='PROGRESS: feature_count 7550 -> 7600; 50 unique Ealing OSM building elements appended after feature.id/parcel_id/osm_id/source_ref exclusion.'
          c['summary']['current_feature_count']=7600
          c['remaining_items']['note']='Next step batch 153: treat all 7600 feature.id/parcel_id/osm_id/source_ref values as already_processed_ids and append exactly 50 new London Outer features; do not replay prior records.'
          c['last_city']='Ealing'; c['last_batch_index']=152; c['last_grid_id']='uk-grid-ealing-001'; c['last_bbox_wgs84']=[-0.34,51.49,-0.27,51.54]; c['next_city_index']=153
          c['already_processed_ids_policy']='Treat every existing shard feature.id, properties.parcel_id, properties.osm_id and properties.source_ref as already_processed_ids; never replay them.'
          attempted=list(c.get('attempted_cities') or [])
          if 'Ealing' not in attempted: attempted.append('Ealing')
          c['attempted_cities']=attempted
          keys=sorted(seen)
          c['already_processed_ids']={'strategy':'derived_from_latest_shard_feature.id_plus_parcel_id_plus_osm_id_plus_source_ref','unique_key_count':len(keys),'sha256_sorted_newline_keys':hashlib.sha256(('\n'.join(keys)+'\n').encode()).hexdigest(),'sample':new_ids[:20]}
          sae=dict(c.get('source_access_evidence') or {})
          sae.pop('ealing_east_lindsey_source_sha256',None)
          sae['ealing_ealing_source_sha256']=r.get('source_sha256')
          c['source_access_evidence']=sae
          s['last_batch']=last; s['current_feature_count']=7600; s['total_features']=7600
          s['classified']=s.get('classified_count'); s['unknown']=s.get('unknown_count'); s['confidence_level_distribution']=s.get('confidence_distribution')
          s['last_batch_index']=152; s['last_batch_city']='Ealing'; s['last_batch_added_feature_count']=50; s['last_batch_source']='OpenStreetMap Overpass API'
          s['last_batch_evidence_distribution']=r.get('evidence_distribution_new') or {}; s['last_batch_confidence_distribution']=r.get('confidence_distribution_new') or {}
          s['progress_reason']='50 new Ealing OSM building elements appended after feature.id/parcel_id/osm_id/source_ref exclusion'; s['note']='Appended 50 unique Ealing OSM building elements; no second task/owner created.'
          r['grid_id']='uk-grid-ealing-001'; r['local_authority']='Ealing'; r['region']='London Outer'
          dump(C,c); dump(S,s); dump(R,r)
          print('LOCAL_VALIDATION_OK building_type_2 7550->7600 batch152 Ealing')
          PY

      - name: Commit and push exact slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/building_type/shards/building_type_2_latest.geojson \
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          git diff --cached --quiet && { echo 'No progress'; exit 1; }
          git commit -m 'data(building_type_2): append Ealing OSM batch 152 7550->7600'
          for a in 1 2 3 4 5; do
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=90
            git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=90
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          m=j('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          c=j('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          s=j('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          r=j('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          t=j('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(g['features'])==7600 and m.get('total_features')==7600
          assert c['feature_count_before']==7550 and c['feature_count_after']==7600 and c['next_batch_index']==153
          assert c.get('last_city')=='Ealing' and c.get('last_grid_id')=='uk-grid-ealing-001'
          assert s['total_elements']==7600 and s['current_feature_count']==7600 and s['last_batch_index']==152
          assert r.get('city')=='Ealing' and r.get('grid_id')=='uk-grid-ealing-001' and len(r.get('records') or [])==50
          assert t.get('owner') in (None,'') and (t.get('continuation_key') or '')==''
          seen=set()
          for f in g['features']:
              p=f.get('properties') or {}
              vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')) if v not in (None,'')}
              assert not (seen & vals); seen.update(vals)
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (c,s,r,t))
          print('REMOTE_READBACK_OK building_type_2 7550->7600 batch152 Ealing duplicate_free final_ready=false')
          PY
