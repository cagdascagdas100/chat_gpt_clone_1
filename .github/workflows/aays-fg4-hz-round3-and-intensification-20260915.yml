name: AAYS fg4 Housing Zones round3 and Intensification 20260915
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-fg4-hz-round3-and-intensification-20260915.yml'
permissions:
  contents: read
jobs:
  fetch-sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Housing Zones final window and Areas of Intensification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, datetime
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          headers={'User-Agent':'TerraYield-AAYS-future_growth_4/1.0','Accept':'application/geo+json,application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              return raw,status,final,ctype
          def fetch(layer, offset, count, prefix):
              base=f'https://gis.london.gov.uk/arcgis/rest/services/apps/planning_data_map_02/FeatureServer/{layer}/query'
              params={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'objectid ASC','resultOffset':str(offset),'resultRecordCount':str(count),'f':'geojson'}
              url=base+'?'+urllib.parse.urlencode(params)
              raw,status,final,ctype=get(url)
              d=json.loads(raw); feats=(d.get('features') or [])[:count]
              if not feats: raise SystemExit(prefix+' empty')
              for f in feats:
                  gt=(f.get('geometry') or {}).get('type')
                  if gt not in ('Polygon','MultiPolygon'): raise SystemExit(prefix+' non-polygon '+str(gt))
              out={'type':'FeatureCollection','features':feats}
              b=json.dumps(out,separators=(',',':'),ensure_ascii=False).encode()
              open(prefix+'.geojson','wb').write(b)
              meta={'slot_id':'future_growth_4','retrieved_at_utc':now,'http_status':status,'content_type':ctype,'request_url':url,'final_url':final,'raw_response_sha256':hashlib.sha256(raw).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b).hexdigest(),'feature_count':len(feats),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in feats]}
              open(prefix+'_meta.json','w').write(json.dumps(meta,indent=2,ensure_ascii=False))
              return meta
          hz=fetch(105,20,10,'fg4_gla_housing_zones_21_30')
          ai=fetch(106,0,10,'fg4_gla_areas_of_intensification_1_10')
          print(json.dumps({'housing_zones':{'count':hz['feature_count'],'http':hz['http_status']},'areas_of_intensification':{'count':ai['feature_count'],'http':ai['http_status']}},ensure_ascii=False))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fg4-hz-round3-and-intensification
          path: |
            fg4_gla_housing_zones_21_30.geojson
            fg4_gla_housing_zones_21_30_meta.json
            fg4_gla_areas_of_intensification_1_10.geojson
            fg4_gla_areas_of_intensification_1_10_meta.json
          if-no-files-found: error
