name: security-public-safety-2-wave31-diagnostics

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave31_diagnostics.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/aays-single-runner-v5-20260706
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture workflow runs
        shell: bash
        run: |
          mkdir -p docs/chatgpt_status/_shared/slots_21/security_public_safety_2
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          workflows = [
            'security_public_safety_2_wave31_incremental.yml',
            'security_public_safety_2_wave31_recovery_controller.yml',
            'security_public_safety_2_wave31_recovery_run.yml',
          ]
          result = {
            'schema_version': 1,
            'slot_id': 'security_public_safety_2',
            'task_id': 'security_public_safety_2_priority_520row_incremental_evidence_expansion_20260729',
            'continuation_key': '0457103ca48101726eaad2b9a6707c165198cbd0f5c8b3c71942106179041bf4',
            'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'workflows': {},
          }
          for workflow in workflows:
            cmd = [
              'gh','run','list','--repo',os.environ['GITHUB_REPOSITORY'],
              '--workflow',workflow,'--branch',os.environ['BRANCH'],'--limit','10',
              '--json','databaseId,workflowName,event,status,conclusion,headSha,createdAt,startedAt,updatedAt,url,attempt'
            ]
            proc = subprocess.run(cmd, text=True, capture_output=True)
            result['workflows'][workflow] = {
              'returncode': proc.returncode,
              'stderr': proc.stderr.strip(),
              'runs': json.loads(proc.stdout) if proc.returncode == 0 and proc.stdout.strip() else [],
            }
          path = 'docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave31_actions_diagnostics_latest.json'
          open(path,'w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave31_actions_diagnostics_latest.json
          git commit -m 'diagnose security_public_safety_2 wave31 actions'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort || true; exit 1; }
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
