name: AAYS building_type_6 batch27 Louth one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-6-batch27-louth-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-6-batch27-louth-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_6_latest.geojson
            england_map_web/data/building_type/shards/building_type_6_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_6
            docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs

      - name: Fast-forward sparse checkout to latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Execute guarded batch27 Louth continuation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          code = '\n'.join(lines) + '\n'
          replacements = {
              'CITY = "Skegness"': 'CITY = "Louth"',
              'BATCH_INDEX = 26': 'BATCH_INDEX = 27',
              'EXPECTED_BEFORE = 2250': 'EXPECTED_BEFORE = 2500',
              'TARGET_AFTER = 2500': 'TARGET_AFTER = 2750',
              'NEXT_TARGET = 2750': 'NEXT_TARGET = 3000',
              'BBOX = [0.20, 53.08, 0.48, 53.21]': 'BBOX = [-0.10, 53.32, 0.12, 53.43]',
          }
          for old, new in replacements.items():
              if old not in code:
                  raise SystemExit(f'missing canonical replacement token: {old}')
              code = code.replace(old, new, 1)
          code = code.replace('Skegness', 'Louth').replace('SKEGNESS', 'LOUTH').replace('skegness', 'louth')
          Path('/tmp/building_type_6_batch27_louth.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/building_type_6_batch27_louth.py

      - name: Commit and push batch 27
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_6_latest.geojson \
            england_map_web/data/building_type/shards/building_type_6_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json
          git diff --cached --quiet && { echo "No slot changes to commit; refusing false progress"; exit 1; }
          git commit -m "building_type_6: append batch 27 Louth +250"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then
              git merge --abort || true
              echo "merge conflict; refusing to overwrite concurrent slot changes"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Remote readback invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json, subprocess
          BR = 'origin/codex/aays-single-runner-v5-20260706'
          def remote_json(path):
              raw = subprocess.check_output(['git','show',f'{BR}:{path}'])
              return json.loads(raw.decode('utf-8'))
          geo = remote_json('england_map_web/data/building_type/shards/building_type_6_latest.geojson')
          cp = remote_json('docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json')
          st = remote_json('docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json')
          run = remote_json('docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json')
          feats = geo.get('features') or []
          assert len(feats) == 2750, len(feats)
          assert cp.get('current_feature_count') == 2750
          assert cp.get('feature_count_before') == 2500 and cp.get('feature_count_after') == 2750
          assert cp.get('next_batch_index') == 28 and cp.get('next_target_feature_count') == 3000
          assert st.get('total_elements') == 2750 and st.get('new_features_added') == 250
          assert run.get('city') == 'Louth' and run.get('new_feature_count') == 250
          assert run.get('feature_count_before') == 2500 and run.get('feature_count_after') == 2750
          assert cp.get('fake_data') is False and st.get('fake_data') is False and run.get('fake_data') is False
          assert cp.get('final_ready') is False and st.get('final_ready') is False and run.get('final_ready') is False
          records = run.get('records') or []
          assert len(records) == 250
          for r in records:
              assert r.get('evidence_excerpt')
              assert r.get('evidence_level') in {'A','B','C','D','U'}
              assert r.get('confidence_level_1_to_4') in {1,2,3,4}
              assert r.get('source_url')
              assert r.get('sources')
              assert r.get('fake_data') is False and r.get('final_ready') is False
          ids = [str(f.get('id')) for f in feats if f.get('id') not in (None,'')]
          assert len(ids) == len(set(ids))
          print('REMOTE_READBACK_OK building_type_6 2500->2750 batch27 Louth; evidence fields present; final_ready=false')
          PY
