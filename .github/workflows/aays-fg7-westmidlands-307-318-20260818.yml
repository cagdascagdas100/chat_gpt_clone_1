name: AAYS FG7 West Midlands 307-318 strict continuation

on:
  pull_request:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-fg7-westmidlands-307-318-20260818.yml'
      - 'ai-task-scripts/aays_fg7_westmidlands_307_318_20260818.py'

permissions:
  contents: write

concurrency:
  group: aays-future-growth-7-canonical-20260818
  cancel-in-progress: false

jobs:
  run-fg7:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger
          fetch-depth: 1

      - name: Checkout canonical branch with history
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          path: canonical
          fetch-depth: 0
          persist-credentials: true

      - name: Execute batches with canonical push and remote readback after every batch
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'

          cursor=$(python - <<'PY'
          import json
          print(json.load(open('state/slots/future_growth_7/checkpoint_latest.json',encoding='utf-8'))['next_batch_index'])
          PY
          )
          if [ "$cursor" -lt 307 ] || [ "$cursor" -gt 319 ]; then
            echo "UNEXPECTED_CANONICAL_CURSOR:$cursor"; exit 1
          fi
          if [ "$cursor" -eq 319 ]; then
            echo 'BATCH_RANGE_ALREADY_CANONICAL_307_318'; exit 0
          fi

          for batch in $(seq "$cursor" 318); do
            echo "=== FG7 BATCH $batch ==="
            python ../trigger/ai-task-scripts/aays_fg7_westmidlands_307_318_20260818.py "$batch"

            mapfile -t changed < <(git diff --name-only)
            test ${#changed[@]} -eq 4 || { echo "UNEXPECTED_CHANGED_COUNT:${#changed[@]}"; printf '%s\n' "${changed[@]}"; exit 1; }
            for p in "${changed[@]}"; do
              [[ "$p" == state/slots/future_growth_7/* ]] || { echo "CROSS_SLOT_CHANGE:$p"; exit 1; }
            done

            git add -- \
              state/slots/future_growth_7/checkpoint_latest.json \
              state/slots/future_growth_7/status_latest.json \
              state/slots/future_growth_7/evidence_manifest_latest.json \
              state/slots/future_growth_7/report_latest.json
            mapfile -t staged < <(git diff --cached --name-only)
            test ${#staged[@]} -eq 4 || { echo "UNEXPECTED_STAGED_COUNT:${#staged[@]}"; printf '%s\n' "${staged[@]}"; exit 1; }
            for p in "${staged[@]}"; do
              [[ "$p" == state/slots/future_growth_7/* ]] || { echo "CROSS_SLOT_STAGED:$p"; exit 1; }
            done

            git commit -m "future_growth_7: strict batch $batch West Midlands"
            git push origin HEAD:codex/aays-single-runner-v5-20260706
            git fetch origin codex/aays-single-runner-v5-20260706

            remote=origin/codex/aays-single-runner-v5-20260706
            git show "$remote":AAYS/england_map_web/data/future_growth/shards/future_growth_7_latest.geojson > /tmp/fg7_shard.json
            git show "$remote":state/slots/future_growth_7/checkpoint_latest.json > /tmp/fg7_cp.json
            git show "$remote":state/slots/future_growth_7/status_latest.json > /tmp/fg7_st.json
            git show "$remote":state/slots/future_growth_7/evidence_manifest_latest.json > /tmp/fg7_mf.json
            git show "$remote":state/slots/future_growth_7/report_latest.json > /tmp/fg7_rp.json
            BATCH="$batch" python - <<'PY'
          import json, os
          b=int(os.environ['BATCH'])
          sh=json.load(open('/tmp/fg7_shard.json',encoding='utf-8'))
          cp=json.load(open('/tmp/fg7_cp.json',encoding='utf-8'))
          st=json.load(open('/tmp/fg7_st.json',encoding='utf-8'))
          mf=json.load(open('/tmp/fg7_mf.json',encoding='utf-8'))
          rp=json.load(open('/tmp/fg7_rp.json',encoding='utf-8'))
          assert sh['metadata']['slot_id']=='future_growth_7'
          assert sh['metadata']['continuation_key']=='future_growth_7_open_source_v2_20260813'
          fs=sh.get('features') or []
          ids=[(x.get('properties') or {}).get('source_feature_id') for x in fs]
          assert len(fs)==18 and None not in ids and len(ids)==len(set(ids))
          assert cp['slot_id']==st['slot_id']==mf['slot_id']==rp['slot_id']=='future_growth_7'
          assert cp['latest_batch']==st['latest_batch']==b
          assert cp['next_batch_index']==rp['next_batch_index']==b+1
          assert cp['artifact_feature_count']==st['artifact_feature_count']==mf['artifact_feature_count']==18
          assert cp['duplicate_count']==st['duplicate_count']==mf['duplicate_count']==rp['counts']['duplicate_count']==0
          assert cp['nearest_match_used'] is st['nearest_match_used'] is mf['nearest_match_used'] is False
          assert cp['fake_data'] is st['fake_data'] is mf['fake_data'] is False
          assert rp['quality_gates']['dup0_each_batch'] is True
          assert rp['quality_gates']['cross_slot_writes'] is False
          assert rp['quality_gates']['own_slot_only'] is True
          assert rp['quality_gates']['reused_window_count']==0
          assert rp['completed_new_bounded_batches']==b-306
          assert rp['per_batch_readbacks'][-1]['batch']==b and rp['per_batch_readbacks'][-1]['pass'] is True
          print(f'REMOTE_READBACK_PASS batch={b} shard=checkpoint=status=manifest=18 dup=0 next={b+1}')
          PY
          done

          python - <<'PY'
          import json
          p=json.load(open('/tmp/fg7_rp.json',encoding='utf-8'))
          assert p['run_id']=='common_continuation_20260818_batches_307_318_west_midlands'
          assert p['completed_new_bounded_batches']==12
          assert p['batch_range']=={'first':307,'last':318}
          assert p['counts']['before']==0 and p['counts']['added']==0 and p['counts']['after']==0
          assert p['next_batch_index']==319
          assert p['quality_gates']['dup0_each_batch'] is True
          assert p['quality_gates']['reused_window_count']==0
          print('FG7_FINAL_REMOTE_READBACK_PASS batches=307-318 before=0 added=0 after=0 next=319')
          PY
