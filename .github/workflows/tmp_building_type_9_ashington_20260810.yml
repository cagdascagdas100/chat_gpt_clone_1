name: tmp building_type_9 Ashington batch 33

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_9_ashington_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-9-continuation
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'run guarded building_type_9 Ashington batch 33')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 unseen evidence-backed Ashington buildings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-slot-runner'
          git config user.email 'aays-slot-runner@users.noreply.github.com'
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          git show 26f4437047e47328b233a506c4c9b9394379717b:.github/workflows/tmp_building_type_9_north_shields_20260810.yml > /tmp/prev.yml
          python3 - <<'PY'
          import pathlib, re, textwrap
          src=pathlib.Path('/tmp/prev.yml').read_text(encoding='utf-8')
          start="          cat > /tmp/run.py <<'PY'\n"
          end="\n          PY\n          python3 /tmp/run.py"
          block=textwrap.dedent(src.split(start,1)[1].split(end,1)[0])
          block=block.replace("BEFORE=1550; TARGET=1600; BATCH=32","BEFORE=1600; TARGET=1650; BATCH=33")
          block=block.replace("CITY='North Shields'; GRID='NORTH_SHIELDS_CENTRAL_01'; AUTH='North Tyneside'","CITY='Ashington'; GRID='ASHINGTON_CENTRAL_01'; AUTH='Northumberland'")
          bbox="""BBOXES=[
    '-1.6500,55.1400,-1.6100,55.1700','-1.6100,55.1400,-1.5700,55.1700',
    '-1.5700,55.1400,-1.5300,55.1700','-1.5300,55.1400,-1.4900,55.1700',
    '-1.6500,55.1700,-1.6100,55.2000','-1.6100,55.1700,-1.5700,55.2000',
    '-1.5700,55.1700,-1.5300,55.2000','-1.5300,55.1700,-1.4900,55.2000',
    '-1.6500,55.2000,-1.6100,55.2300','-1.6100,55.2000,-1.5700,55.2300',
    '-1.5700,55.2000,-1.5300,55.2300','-1.5300,55.2000,-1.4900,55.2300']"""
          block=re.sub(r"BBOXES=\[.*?\]\n\nGEO=",bbox+"\n\nGEO=",block,flags=re.S)
          block=block.replace("'north shields'","'ashington'")
          block=block.replace('North Shields','Ashington').replace('NORTH_SHIELDS_CENTRAL_01','ASHINGTON_CENTRAL_01')
          block=block.replace('batch 32','batch 33').replace('Batch 32','Batch 33')
          block=block.replace('Existing 1550-feature','Existing 1600-feature')
          block=block.replace("'next_batch_index':33,'next_target_feature_count':1650","'next_batch_index':34,'next_target_feature_count':1700")
          block=block.replace("'next_city_index':33","'next_city_index':34")
          block=block.replace('BATCH_032_APPENDED_50_ASHINGTON_OSM_FEATURES_CONTINUATION_REQUIRED','BATCH_033_APPENDED_50_ASHINGTON_OSM_FEATURES_CONTINUATION_REQUIRED')
          assert 'North Shields' not in block and 'NORTH_SHIELDS' not in block
          pathlib.Path('/tmp/run.py').write_text(block,encoding='utf-8')
          PY
          python3 /tmp/run.py

      - name: Guard remote state, self-delete, commit and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_ashington_20260810.yml'
          GEO='england_map_web/data/building_type/shards/building_type_9_latest.geojson'
          MAN='england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'
          RUN='docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json'
          STA='docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'
          CP='docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'
          CT='docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'
          git fetch origin "$BRANCH"
          git show "origin/$BRANCH:$CP" > /tmp/remote_cp.json
          git show "origin/$BRANCH:$CT" > /tmp/remote_ct.json
          python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json')); t=json.load(open('/tmp/remote_ct.json'))
          assert cp.get('current_feature_count')==1600 and cp.get('next_batch_index')==33 and cp.get('next_target_feature_count')==1650
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          PY
          rm -f "$WF"
          git add "$GEO" "$MAN" "$RUN" "$STA" "$CP" "$WF"
          git commit -m 'building_type_9: append batch 33 Ashington OSM API features'
          ok=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:$CP" > /tmp/remote_cp_retry.json
            python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp_retry.json'))
          assert cp.get('current_feature_count')==1600 and cp.get('next_batch_index')==33, 'same-slot remote state advanced; abort rebase'
          PY
            git rebase "origin/$BRANCH"
          done
          test "$ok" = 1

      - name: Verify remote slot9 readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          for item in \
            'england_map_web/data/building_type/shards/building_type_9_latest.geojson:/tmp/g.json' \
            'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json:/tmp/m.json' \
            'docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json:/tmp/r.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json:/tmp/s.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json:/tmp/c.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json:/tmp/t.json'; do
            src="${item%%:*}"; dst="${item#*:}"; git show "origin/$BRANCH:$src" > "$dst"
          done
          python3 - <<'PY'
          import json
          g=json.load(open('/tmp/g.json')); m=json.load(open('/tmp/m.json')); r=json.load(open('/tmp/r.json')); s=json.load(open('/tmp/s.json')); c=json.load(open('/tmp/c.json')); t=json.load(open('/tmp/t.json'))
          assert len(g['features'])==1650
          assert c['feature_count_before']==1600 and c['feature_count_after']==1650 and c['current_feature_count']==1650 and c['next_batch_index']==34 and c['next_target_feature_count']==1700
          assert c['last_batch']['city']=='Ashington' and c['last_batch']['added_feature_count']==50
          assert m['total_features']==1650 and s['total_elements']==1650 and r['feature_count_after']==1650 and len(r['records'])==50
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          assert all(x.get('fake_data') is False for x in (m,r,s,c)) and all(x.get('final_ready') is not True for x in (m,s,c))
          print('REMOTE_READBACK_OK building_type_9 1600->1650 Ashington batch33')
          PY
