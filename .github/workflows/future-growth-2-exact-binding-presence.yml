name: future-growth-2-exact-binding-presence

on:
  pull_request:
    paths:
      - ".github/workflows/future-growth-2-exact-binding-presence.yml"
      - "docs/chatgpt_status/aays1/shards/future_growth_2/automation/043_validate_tracked_exact_binding_presence_001.py"
      - "docs/chatgpt_status/aays1/shards/future_growth_2/evidence/043_tracked_exact_binding_presence_source_manifest_20260804.json"
      - "docs/chatgpt_status/aays1/shards/future_growth_2/evidence/043_tracked_exact_binding_presence_script_test_20260804.json"
      - "docs/chatgpt_status/aays1/queue/future_growth_2_tracked_exact_binding_presence_gate_001_20260804.v3.task.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and execute bounded gate
        env:
          CONTINUATION_KEY: 06c2182b61033ab54b7b95e092812f0fcfd93d08003bd13fd0014f2f72d46ec9
        run: |
          set -euo pipefail
          SCRIPT="docs/chatgpt_status/aays1/shards/future_growth_2/automation/043_validate_tracked_exact_binding_presence_001.py"
          MANIFEST="docs/chatgpt_status/aays1/shards/future_growth_2/evidence/043_tracked_exact_binding_presence_source_manifest_20260804.json"
          CANDIDATE="england_map_web/data/aays_21_slots/future_growth_2/official_uprn_address_identity_batch_097_20260724.json"
          VALIDATION="england_map_web/data/aays_21_slots/future_growth_2/slot_bounded_parcel_candidate_identity_validation_001_20260804.json"
          PRIOR="england_map_web/data/aays_21_slots/future_growth_2/title_boundary_entity_to_parcel_linkage_input_gate_001_20260804.json"
          OUTDIR="tmp/future_growth_2_exact_binding_presence"
          OUTPUT="$OUTDIR/tracked_exact_binding_presence_gate_001_20260804.json"
          RECEIPT="$OUTDIR/execution_receipt.json"
          mkdir -p "$OUTDIR"
          python -m py_compile "$SCRIPT"
          python "$SCRIPT" --self-test > "$OUTDIR/self_test.json"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python "$SCRIPT" --candidate-input "$CANDIDATE" --candidate-validation "$VALIDATION" --prior-gate "$PRIOR" --manifest "$MANIFEST" --output "$OUTPUT" --task-continuation-key "$CONTINUATION_KEY"
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - "$OUTPUT" "$RECEIPT" "$STARTED_AT" "$COMPLETED_AT" <<'PY'
          import hashlib, json, os, pathlib, sys
          output_path = pathlib.Path(sys.argv[1])
          receipt_path = pathlib.Path(sys.argv[2])
          output = json.loads(output_path.read_text(encoding="utf-8"))
          if output.get("state") not in {"NO_DATA_CONTINUE", "PUBLISHED"}:
              raise SystemExit("unexpected gate state")
          receipt = {"schema_version":3,"architecture_version":3,"workstream_id":"AAYS_21_SLOT_SAFE_PARALLEL_V1","slot_id":"future_growth_2","task_id":"future_growth_2_tracked_exact_binding_presence_gate_001_20260804","continuation_key":os.environ["CONTINUATION_KEY"],"runner":"github-hosted-ubuntu-latest","github_run_id":os.environ.get("GITHUB_RUN_ID"),"github_job":os.environ.get("GITHUB_JOB"),"github_sha":os.environ.get("GITHUB_SHA"),"started_at":sys.argv[3],"completed_at":sys.argv[4],"py_compile":"PASS","self_test":"PASS_8_OF_8","result_state":output.get("state"),"completed_count":output.get("completed_count"),"target_count":output.get("target_count"),"exact_binding_count":output.get("exact_binding_count"),"output_sha256":hashlib.sha256(output_path.read_bytes()).hexdigest(),"produced_business_rows":0,"identifier_values_persisted":False,"geometry_persisted":False,"coordinates_persisted":False,"fake_data":False}
          receipt_path.write_text(json.dumps(receipt,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: future-growth-2-exact-binding-presence
          path: tmp/future_growth_2_exact_binding_presence
          if-no-files-found: error
          retention-days: 7
