name: tmp building_type_7 batch 106 metadata normalize

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_7_batch106_metadata_normalize_20260811.yml]

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Prepare head
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Normalize checkpoint last_batch
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          o=json.loads(p.read_text())
          assert o['current_feature_count']==5300 and o['next_batch_index']==107 and o['next_target_feature_count']==5350
          assert o['remote_readback_verified'] is True and o['fake_data'] is False and o['final_ready'] is False
          ev=o.get('last_batch_evidence') or {}
          assert ev.get('batch_index')==106 and ev.get('city')=='Telford' and ev.get('added_feature_count')==50
          o['last_batch']=ev
          p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          PY
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          git commit -m "building_type_7: normalize batch 106 checkpoint last_batch"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && break
            [[ $a -lt 5 ]] || exit 1
            sleep $((a*2))
          done
      - name: Remote readback
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess
          p='docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'
          o=json.loads(subprocess.check_output(['git','show',f'origin/codex/aays-single-runner-v5-20260706:{p}']))
          assert o['current_feature_count']==5300 and o['next_batch_index']==107 and o['next_target_feature_count']==5350
          assert o['last_batch']['batch_index']==106 and o['last_batch']['city']=='Telford' and o['last_batch']['added_feature_count']==50
          assert o['remote_readback_verified'] is True and o['fake_data'] is False and o['final_ready'] is False
          print('CHECKPOINT_METADATA_NORMALIZED batch106 Telford current=5300 next=107')
          PY
