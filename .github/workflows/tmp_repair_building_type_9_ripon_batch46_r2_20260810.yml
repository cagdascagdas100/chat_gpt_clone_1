name: Robust repair building_type_9 Ripon batch46 workflow

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_repair_building_type_9_ripon_batch46_r2_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-9-ripon-batch46-repair-r2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Repair target syntax and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp_building_type_9_ripon_batch46_20260810.yml')
          lines=p.read_text(encoding='utf-8').splitlines(True)
          hits=[]
          for i,line in enumerate(lines):
              if 'first_unverified_step_status' in line and 'CITY.upper().replace' in line:
                  hits.append(i)
          if len(hits) != 1:
              raise SystemExit(f'fail closed: expected exactly one syntax target, got {len(hits)}')
          i=hits[0]
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          lines[i]=indent+"'first_unverified_step_status':f'BATCH_{BATCH:03d}_APPENDED_50_RIPON_OSM_FEATURES_CONTINUATION_REQUIRED',\n"
          p.write_text(''.join(lines),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp_repair_building_type_9_ripon_batch46_r2_20260810.yml
          git add .github/workflows/tmp_building_type_9_ripon_batch46_20260810.yml
          git diff --cached --check
          git commit -m 'ci: fix building_type_9 Ripon batch46 syntax r2'
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706; then
              if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt*2))
          done
          exit 1
