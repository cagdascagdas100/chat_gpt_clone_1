name: AAYS building_type_2 batch145 Harrow one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-batch145-harrow-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-batch145-harrow-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 30
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs
      - name: Fast-forward to canonical head
        run: git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Execute guarded batch145
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          prev=subprocess.check_output(['git','show','87c315748046b731abfeecdcd4444126bffede8b:.github/workflows/aays-building-type-2-batch144-bexleyheath-once.yml'],text=True)
          anchor='      - name: Execute guarded batch144\n'
          part=prev.split(anchor,1)[1]
          marker="          python - <<'PY'\n"
          body=part.split(marker,1)[1].split("\n          PY",1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n'
          replacements=[
            ('Bexleyheath','Harrow'),('BEXLEYHEATH','HARROW'),
            ('LOCAL_AUTHORITY = "Bexley"','LOCAL_AUTHORITY = "Harrow"'),
            ('BATCH_INDEX = 144','BATCH_INDEX = 145'),
            ('EXPECTED_BEFORE = 7150','EXPECTED_BEFORE = 7200'),
            ('TARGET_AFTER = 7200','TARGET_AFTER = 7250'),
            ('NEXT_TARGET = 7250','NEXT_TARGET = 7300'),
            ('BBOX = [0.10, 51.44, 0.17, 51.48]','BBOX = [-0.36, 51.56, -0.28, 51.61]'),
            ('uk-grid-bexleyheath-001','uk-grid-harrow-001'),
            ('bt2_b144.py','bt2_b145.py')]
          for old,new in replacements:
              if old not in script:
                  raise SystemExit(f'missing previous-batch token: {old}')
              script=script.replace(old,new)
          exec(compile(script,'batch145_transform','exec'),{})
          PY
          python /tmp/bt2_b145.py
      - name: Normalize metadata and validate exact batch145
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          G=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          M=pathlib.Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          C=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          S=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          R=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          T=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          def load(p): return json.load(open(p,encoding='utf-8'))
          def dump(p,x): p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          g,m,c,s,r,t=map(load,(G,M,C,S,R,T))
          assert len(g['features'])==7250
          assert c['feature_count_before']==7200 and c['feature_count_after']==7250 and c['next_batch_index']==146
          assert s['total_elements']==7250
          assert r.get('city')=='Harrow' and (r.get('new_feature_count')==50 or r.get('added_feature_count')==50)
          assert t['task_id']=='building-type-2-england-classification-v1-20260808' and t.get('owner') in (None,'') and (t.get('continuation_key') or '')==''
          rec=r.get('records') or []; assert len(rec)==50
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (c,s,r,t))
          for z in rec:
              assert z.get('parcel_id') and z.get('osm_id') and z.get('building_type_primary')
              assert z.get('confidence_level_1_to_4') in {1,2,3,4} and z.get('confidence_score') is not None
              assert z.get('evidence_level') and z.get('source_url') and z.get('sources')
              for src in z['sources']:
                  assert (src.get('url') or src.get('url_or_local_path')) and src.get('accessed_at') and src.get('fields_used') and src.get('match_method')
              assert z.get('fake_data') is False and z.get('final_ready') is False
          seen=set()
          for f in g['features']:
              p=f.get('properties') or {}; vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')) if v not in (None,'')}
              assert not (seen & vals); seen.update(vals)
          last={
            'batch_index':145,'city':'Harrow','local_authority':'Harrow','grid_id':'uk-grid-harrow-001',
            'bbox_wgs84':[-0.36,51.56,-0.28,51.61],'added_feature_count':50,
            'source':'OpenStreetMap Overpass API','source_url':r.get('source_url'),
            'source_sha256':r.get('source_sha256'),'classification_basis':'deterministic_osm_building_use_tag_rules_v1',
            'evidence_level_distribution':r.get('evidence_distribution_new') or {},
            'confidence_level_distribution':r.get('confidence_distribution_new') or {},
            'new_feature_ids':[z.get('feature_id') for z in rec],
            'evidence_level':'B' if (r.get('evidence_distribution_new') or {})=={'B':50} else 'mixed'}
          c['last_batch']=last
          c['summary']['note']='PROGRESS: feature_count 7200 -> 7250; 50 unique Harrow OSM building elements appended after feature.id/parcel_id/osm_id/source_ref exclusion.'
          c['remaining_items']['note']='Next step batch 146: treat all 7250 feature.id/parcel_id/osm_id/source_ref values as already_processed_ids and append exactly 50 new London Outer features; do not replay prior records.'
          s['last_batch']=last
          s['current_feature_count']=7250; s['total_features']=7250; s['classified']=s.get('classified_count'); s['unknown']=s.get('unknown_count')
          s['last_batch_index']=145; s['last_batch_city']='Harrow'; s['last_batch_added_feature_count']=50
          s['progress_reason']='50 new Harrow OSM building elements appended after feature.id/parcel_id/osm_id/source_ref exclusion'
          dump(C,c); dump(S,s)
          assert m.get('total_features')==7250
          print('LOCAL_VALIDATION_OK building_type_2 7200->7250 batch145 Harrow')
          PY
      - name: Commit and push exact slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add england_map_web/data/building_type/shards/building_type_2_latest.geojson england_map_web/data/building_type/shards/building_type_2_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          git diff --cached --quiet && { echo 'No progress'; exit 1; }
          git commit -m 'data(building_type_2): append Harrow OSM batch 145 7200->7250'
          for a in 1 2 3 4 5; do git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0; git fetch origin codex/aays-single-runner-v5-20260706 --depth=30; git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }; done
          exit 1
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=30
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_2_latest.geojson'); m=j('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json'); c=j('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json'); s=j('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json'); r=j('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'); t=j('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(g['features'])==7250 and m.get('total_features')==7250
          assert c['feature_count_before']==7200 and c['feature_count_after']==7250 and c['next_batch_index']==146
          assert s['total_elements']==7250 and s['current_feature_count']==7250 and s['last_batch_index']==145
          assert r.get('city')=='Harrow' and len(r.get('records') or [])==50
          assert t.get('owner') in (None,'') and (t.get('continuation_key') or '')==''
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (c,s,r,t))
          print('REMOTE_READBACK_OK building_type_2 7200->7250 batch145 Harrow final_ready=false')
          PY
