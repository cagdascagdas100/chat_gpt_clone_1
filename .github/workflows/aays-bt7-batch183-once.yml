name: AAYS building_type_7 batch183 once
on:
  push:
    paths:
      - '.github/workflows/aays-bt7-batch183-once.yml'
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 40
          clean: false
      - name: Adapt verified batch 182 runner and execute batch 183 with safe push retry
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT='cb930efdae290b189686526b8ccf0c0f554ed6e9'
          git fetch origin "$OLD_COMMIT" --depth=1 || true
          python - <<'PY'
          import subprocess, textwrap
          old_commit='cb930efdae290b189686526b8ccf0c0f554ed6e9'
          path='.github/workflows/aays-bt7-batch182-once.yml'
          text=subprocess.check_output(['git','show',f'{old_commit}:{path}'],text=True)
          text=text.replace("if before!=9013 or int(cp.get('next_batch_index',-1))!=182", "if before!=9063 or int(cp.get('next_batch_index',-1))!=183")
          text=text.replace("if cp.get('current_feature_count')!=9013 or int(cp.get('next_batch_index',-1))!=182", "if cp.get('current_feature_count')!=9063 or int(cp.get('next_batch_index',-1))!=183")
          text=text.replace("if report.get('batch_index')!=BATCH or expect!=9063 or added!=50 or rm.get('total_features')!=expect or rcp.get('current_feature_count')!=expect or rcp.get('next_batch_index')!=183", "if report.get('batch_index')!=BATCH or expect!=9113 or added!=50 or rm.get('total_features')!=expect or rcp.get('current_feature_count')!=expect or rcp.get('next_batch_index')!=184")
          text=text.replace("BATCH=182; TARGET=50", "BATCH=183; TARGET=50")
          text=text.replace("SLOT='building_type_7'; BATCH=182; BRANCH", "SLOT='building_type_7'; BATCH=183; BRANCH")
          text=text.replace("batch 182'", "batch 183'")
          lines=text.splitlines(); runs=[]; i=0
          while i < len(lines):
              if lines[i].startswith('        run: |'):
                  i += 1; block=[]
                  while i < len(lines) and (lines[i].startswith('          ') or lines[i].strip()==''):
                      block.append(lines[i][10:] if lines[i].startswith('          ') else '')
                      i += 1
                  runs.append('\n'.join(block))
              else:
                  i += 1
          if len(runs) != 3:
              raise SystemExit(f'EXPECTED_3_RUN_BLOCKS_GOT_{len(runs)}')
          old_tail='git pull --rebase origin "$BRANCH"\ngit push origin HEAD:"$BRANCH"'
          new_tail=textwrap.dedent('''
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            python -c 'import json,subprocess; cp=json.loads(subprocess.check_output(["git","show","origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json"])); cur=cp.get("current_feature_count"); nxt=int(cp.get("next_batch_index",-1)); assert cur==9063 and nxt==183, f"REMOTE_SLOT_ADVANCED_DURING_RETRY current={cur} next={nxt}"'
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'DATA_PUSH_RETRY_EXHAUSTED' >&2
              exit 1
            fi
          done
          ''').strip()
          if old_tail not in runs[1]:
              raise SystemExit('DATA_PUSH_TAIL_NOT_FOUND')
          runs[1]=runs[1].replace(old_tail,new_tail)
          verify_old='git pull --rebase origin codex/aays-single-runner-v5-20260706\ngit push origin HEAD:codex/aays-single-runner-v5-20260706'
          verify_new=textwrap.dedent('''
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            python -c 'import json,subprocess; cp=json.loads(subprocess.check_output(["git","show","origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json"])); cur=cp.get("current_feature_count"); nxt=int(cp.get("next_batch_index",-1)); assert cur==9113 and nxt==184, f"REMOTE_SLOT_ADVANCED_BEFORE_VERIFY_PUSH current={cur} next={nxt}"'
            git rebase origin/codex/aays-single-runner-v5-20260706
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'VERIFY_PUSH_RETRY_EXHAUSTED' >&2
              exit 1
            fi
          done
          ''').strip()
          if verify_old not in runs[2]:
              raise SystemExit('VERIFY_PUSH_TAIL_NOT_FOUND')
          runs[2]=runs[2].replace(verify_old,verify_new)
          for idx,block in enumerate(runs,1):
              print(f'=== EXECUTING_ADAPTED_RUN_BLOCK_{idx} ===', flush=True)
              subprocess.run(['bash','-lc',block],check=True)
          PY