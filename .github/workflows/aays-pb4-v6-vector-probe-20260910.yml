name: AAYS PB4 V6 exact vector probe 20260910
on:
  push:
    branches:
      - agent/aays-pb4-v6-probe-20260910
    paths:
      - '.github/workflows/aays-pb4-v6-vector-probe-20260910.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, pathlib, re, time
          OUT=pathlib.Path('probe_out'); OUT.mkdir()
          UA='TerraYield-AAYS/PLAN0-V6 planned_buildings_4 exact-vector-probe'
          def fetch(url, fn, timeout=120):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read(); st=getattr(r,'status',None); ct=r.headers.get('Content-Type'); final=r.geturl()
              except urllib.error.HTTPError as e:
                  b=e.read(); st=e.code; ct=e.headers.get('Content-Type') if e.headers else None; final=getattr(e,'url',url)
              p=OUT/fn; p.write_bytes(b)
              return {'url':url,'final_url':final,'http_status':st,'content_type':ct,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'file':fn,'body':b}
          def arc(base, where, fn, fmt='json', outsr='27700'):
              q=urllib.parse.urlencode({'where':where,'outFields':'*','returnGeometry':'true','outSR':outsr,'f':fmt})
              return fetch(base+'/query?'+q,fn)
          targets=[
            {'slug':'1_undershaft','name':'1 Undershaft','ref':'23/01423/FULEIA'},
            {'slug':'55_bishopsgate','name':'55 Bishopsgate','ref':'22/00981/FULEIA'},
            {'slug':'99_bishopsgate','name':'99 Bishopsgate','ref':'24/00836/FULEIA'},
          ]
          l94='https://www.mapping.cityoflondon.gov.uk/arcgis/rest/services/INSPIRE/MapServer/94'
          l61='https://www.mapping.cityoflondon.gov.uk/arcgis/rest/services/INSPIRE/MapServer/61'
          hmlr='https://inspire.landregistry.gov.uk/inspire/ows'
          result={'schema':'pb4_v6_exact_vector_probe_v1','fetched_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'targets':[]}
          capurl=hmlr+'?'+urllib.parse.urlencode({'service':'WMS','version':'1.3.0','request':'GetCapabilities'})
          cap=fetch(capurl,'hmlr_getcapabilities.xml'); capt=cap['body'].decode('utf-8','replace')
          layers=re.findall(r'<Name>([^<]*CadastralParcel[^<]*)</Name>',capt,re.I)
          layers=list(dict.fromkeys(layers)) or ['inspire:CP.CadastralParcel']
          result['hmlr_capabilities']={k:v for k,v in cap.items() if k!='body'}; result['hmlr_layers']=layers
          for t in targets:
              rec={'target':t}
              where="BUILDING_NAME='"+t['name'].replace("'","''")+"'"
              a94=arc(l94,where,t['slug']+'_layer94_bng.json','json','27700')
              g94=arc(l94,where,t['slug']+'_layer94_wgs84.geojson','geojson','4326')
              rec['layer94_bng']={k:v for k,v in a94.items() if k!='body'}
              rec['layer94_wgs84']={k:v for k,v in g94.items() if k!='body'}
              bng=None
              try:
                  bng=json.loads(a94['body']); fs=bng.get('features',[])
                  rec['layer94_feature_count']=len(fs)
                  rec['layer94_attributes']=[f.get('attributes',{}) for f in fs]
                  rec['layer94_geometry_types']=['Polygon' if f.get('geometry',{}).get('rings') else None for f in fs]
              except Exception as e: rec['layer94_parse_error']=repr(e); fs=[]
              try:
                  gj=json.loads(g94['body']); rec['layer94_geojson_feature_count']=len(gj.get('features',[])); rec['layer94_geojson_geometry_types']=[f.get('geometry',{}).get('type') for f in gj.get('features',[])]
              except Exception as e: rec['layer94_geojson_parse_error']=repr(e)
              w61="PLANNING_REF_NUMBER='"+t['ref'].replace("'","''")+"'"
              a61=arc(l61,w61,t['slug']+'_layer61_bng.json','json','27700')
              rec['layer61_bng']={k:v for k,v in a61.items() if k!='body'}
              try:
                  j61=json.loads(a61['body']); rec['layer61_feature_count']=len(j61.get('features',[])); rec['layer61_attributes']=[f.get('attributes',{}) for f in j61.get('features',[])]
              except Exception as e: rec['layer61_parse_error']=repr(e)
              rings=[]
              if fs: rings=(fs[0].get('geometry') or {}).get('rings') or []
              if rings and rings[0]:
                  rr=rings[0]; xs=[p[0] for p in rr]; ys=[p[1] for p in rr]; E=sum(xs)/len(xs); N=sum(ys)/len(ys)
                  rec['layer94_seed_bng']={'E':E,'N':N,'ring_vertex_count':len(rr)}
                  bbox=(E-80,N-80,E+80,N+80); width=640; height=640; i=j=320
                  attempts=[]
                  for layer in layers[:4]:
                    for info in ('application/vnd.ogc.gml','text/xml','application/json'):
                      params={'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetFeatureInfo','LAYERS':layer,'QUERY_LAYERS':layer,'STYLES':'','CRS':'EPSG:27700','BBOX':','.join(f'{x:.3f}' for x in bbox),'WIDTH':str(width),'HEIGHT':str(height),'I':str(i),'J':str(j),'FEATURE_COUNT':'20','INFO_FORMAT':info}
                      u=hmlr+'?'+urllib.parse.urlencode(params)
                      fn=t['slug']+'_hmlr_'+re.sub('[^a-z0-9]+','_',info.lower()).strip('_')+'.dat'
                      h=fetch(u,fn)
                      text=h['body'].decode('utf-8','replace')
                      pos=re.findall(r'<(?:\\w+:)?posList[^>]*>([^<]+)</(?:\\w+:)?posList>',text,re.I)
                      ids=[]
                      for pat in [r'<(?:\\w+:)?localId[^>]*>([^<]+)',r'<(?:\\w+:)?nationalCadastralReference[^>]*>([^<]+)',r'<(?:\\w+:)?identifier[^>]*>([^<]+)']:
                        ids += re.findall(pat,text,re.I)
                      hr={k:v for k,v in h.items() if k!='body'}; hr.update({'layer':layer,'info_format':info,'poslist_count':len(pos),'poslist_samples':pos[:6],'identifier_samples':list(dict.fromkeys(ids))[:12]})
                      attempts.append(hr)
                      if h['http_status']==200 and pos: break
                    if attempts and attempts[-1].get('poslist_count',0): break
                  rec['hmlr_attempts']=attempts
              result['targets'].append(rec)
          (OUT/'summary.json').write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(result,separators=(',',':'),ensure_ascii=False))
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: pb4-v6-exact-vector-probe-20260910
          path: probe_out/
          if-no-files-found: error
          retention-days: 7
