name: AAYS BT5 OSM strict microparcel 188-199
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-osm-strict-microparcel-188-199.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-5-osm-strict-188-199
  cancel-in-progress: false
jobs:
  strict-osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Mark BT5 188-199 run started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_main_run_188_199_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',source_windows:'188-199',state:'RUNNING',mode:'OSM_STRICT_EXISTING_PARCEL_REFRESH',run_id:String(context.runId),head_sha:context.sha,started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 188-199 started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout canonical shallow
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Configure author and runtime
        shell: bash
        run: |
          set -euo pipefail
          git -C canonical config user.name 'AAYS building_type_5'
          git -C canonical config user.email 'aays-building-type-5@users.noreply.github.com'
          python -m pip install --quiet requests shapely
      - name: Execute BT5 188-199 strict OSM refresh
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,zlib
          payload=''
          open('/tmp/run_bt5_188_199.py','wb').write(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/run_bt5_188_199.py
      - name: Mark BT5 188-199 run finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_main_run_188_199_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',source_windows:'188-199',state:'${{ job.status }}'.toUpperCase(),mode:'OSM_STRICT_EXISTING_PARCEL_REFRESH',run_id:String(context.runId),head_sha:context.sha,finished_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 188-199 finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
