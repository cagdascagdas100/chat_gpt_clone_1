name: AAYS fg4 OA round3 and Housing Zones 20260915
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-fg4-oa-round3-and-housing-zones-20260915.yml'
permissions:
  contents: read
jobs:
  fetch-sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Opportunity Areas round3 and Housing Zones
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, datetime
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          headers={'User-Agent':'TerraYield-AAYS-future_growth_4/1.0','Accept':'application/geo+json,application/json'}
          def fetch(layer, offset, count, stem):
              base=f'https://gis.london.gov.uk/arcgis/rest/services/apps/planning_data_map_02/FeatureServer/{layer}/query'
              params={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'objectid ASC','resultOffset':str(offset),'resultRecordCount':str(count),'f':'geojson'}
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              data=json.loads(raw); feats=(data.get('features') or [])[:count]
              if not feats: raise SystemExit(stem+' empty')
              for f in feats:
                  gt=(f.get('geometry') or {}).get('type')
                  if gt not in ('Polygon','MultiPolygon'): raise SystemExit(stem+' non-polygon '+str(gt))
              out={'type':'FeatureCollection','features':feats}; b=json.dumps(out,separators=(',',':'),ensure_ascii=False).encode()
              open(stem+'.geojson','wb').write(b)
              meta={'slot_id':'future_growth_4','retrieved_at_utc':now,'http_status':status,'content_type':ctype,'request_url':url,'final_url':final,'raw_response_sha256':hashlib.sha256(raw).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b).hexdigest(),'feature_count':len(feats),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in feats]}
              open(stem+'_meta.json','w').write(json.dumps(meta,indent=2,ensure_ascii=False))
              return len(feats), status
          a,sa=fetch(103,20,10,'fg4_gla_opportunity_areas_round3')
          b,sb=fetch(105,0,10,'fg4_gla_housing_zones_1_10')
          print(json.dumps({'opportunity_areas_round3_count':a,'opportunity_areas_http':sa,'housing_zones_count':b,'housing_zones_http':sb},ensure_ascii=False))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fg4-oa-round3-and-housing-zones
          path: |
            fg4_gla_opportunity_areas_round3.geojson
            fg4_gla_opportunity_areas_round3_meta.json
            fg4_gla_housing_zones_1_10.geojson
            fg4_gla_housing_zones_1_10_meta.json
          if-no-files-found: error
