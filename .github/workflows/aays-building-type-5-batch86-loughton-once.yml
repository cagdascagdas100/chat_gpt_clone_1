name: AAYS building_type_5 batch86 Loughton one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-5-batch86-loughton-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-5-batch86-loughton-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            .github/workflows/aays-building-type-5-batch86-loughton-once.yml
            england_map_web/data/building_type/shards/building_type_5_latest.geojson
            england_map_web/data/building_type/shards/building_type_5_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_5
            docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs
      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Execute guarded batch86
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text()
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          repl={
            'SLOT = "building_type_6"':'SLOT = "building_type_5"',
            'TASK = "building-type-6-england-classification-v1-20260808"':'TASK = "building-type-5-england-classification-v1-20260808"',
            'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"':'CONT = ""',
            'CITY = "Skegness"':'CITY = "Loughton"',
            'LOCAL_AUTHORITY = "East Lindsey"':'LOCAL_AUTHORITY = "Epping Forest"',
            'REGION = "East Midlands"':'REGION = "East of England"',
            'BATCH_INDEX = 26':'BATCH_INDEX = 86',
            'EXPECTED_BEFORE = 2250':'EXPECTED_BEFORE = 4250',
            'ADD_COUNT = 250':'ADD_COUNT = 50',
            'TARGET_AFTER = 2500':'TARGET_AFTER = 4300',
            'NEXT_TARGET = 2750':'NEXT_TARGET = 4350',
            'BBOX = [0.20, 53.08, 0.48, 53.21]':'BBOX = [0.03, 51.62, 0.09, 51.68]',
            'england_map_web/data/building_type/shards/building_type_6_latest.geojson':'england_map_web/data/building_type/shards/building_type_5_latest.geojson',
            'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json':'england_map_web/data/building_type/shards/building_type_5_manifest_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json',
            'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json':'docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json'
          }
          for old,new in repl.items():
              if old not in code:
                  raise SystemExit(f'missing source token: {old}')
              code=code.replace(old,new,1)
          code=code.replace('building_type_6','building_type_5').replace('Skegness','Loughton').replace('SKEGNESS','LOUGHTON').replace('skegness','loughton')
          old_cont='if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new_cont='if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old_cont not in code:
              raise SystemExit('missing continuation guard')
          code=code.replace(old_cont,new_cont,1)
          manifest_guard='''manifest = load(MAN)\n\nif any(CITY.lower() in __import__("json").dumps(x, ensure_ascii=False).lower() for x in (manifest.get("sources") or [])):\n    raise SystemExit("city already present in manifest; refusing repeated city batch")'''
          if 'manifest = load(MAN)' not in code:
              raise SystemExit('missing manifest load')
          code=code.replace('manifest = load(MAN)', manifest_guard, 1)
          needle='''    cls = classify(tags)\n    candidates.append'''
          replacement='''    cls = classify(tags)\n    if cls[3] not in {"A", "B", "C", "D"}:\n        continue\n    candidates.append'''
          if needle not in code:
              raise SystemExit('missing candidate classification hook')
          code=code.replace(needle,replacement,1)
          Path('/tmp/bt5_b86.py').write_text(code)
          PY
          python /tmp/bt5_b86.py
      - name: Commit and push exact slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_5_latest.geojson \
            england_map_web/data/building_type/shards/building_type_5_manifest_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json
          git rm .github/workflows/aays-building-type-5-batch86-loughton-once.yml
          git diff --cached --quiet && { echo "No progress; refusing false progress"; exit 1; }
          git commit -m "data(building_type_5): append Loughton OSM batch 86 4250->4300"
          for a in 1 2 3 4 5; do
            git pull --rebase origin codex/aays-single-runner-v5-20260706 || exit 1
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0
            sleep 3
          done
          exit 1
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json, subprocess
          BR='origin/codex/aays-single-runner-v5-20260706'
          def j(p): return json.loads(subprocess.check_output(['git','show',f'{BR}:{p}']))
          g=j('england_map_web/data/building_type/shards/building_type_5_latest.geojson')
          c=j('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          s=j('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          r=j('docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json')
          t=j('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          assert len(g.get('features') or []) == 4300
          assert c.get('feature_count_before') == 4250 and c.get('feature_count_after') == 4300
          assert c.get('current_feature_count') == 4300 and c.get('next_batch_index') == 87
          assert s.get('total_elements') == 4300
          assert r.get('city') == 'Loughton' and r.get('local_authority') == 'Epping Forest'
          assert r.get('new_feature_count') == 50 and r.get('feature_count_before') == 4250 and r.get('feature_count_after') == 4300
          assert t.get('task_id') == 'building-type-5-england-classification-v1-20260808'
          assert t.get('owner') in (None,'') and (t.get('continuation_key') or '') == ''
          for x in (c,s,r,t):
              assert x.get('fake_data') is False and x.get('final_ready') is False
          rec=r.get('records') or []
          assert len(rec) == 50
          for x in rec:
              assert x.get('evidence_excerpt')
              assert x.get('evidence_level') in {'A','B','C','D'}
              assert x.get('confidence_level_1_to_4') in {1,2,3,4}
              assert x.get('source_url') and x.get('sources')
          seen=set()
          for f in g.get('features') or []:
              p=f.get('properties') or {}
              vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v not in (None,'')}
              assert not (seen & vals), f'duplicate identifier(s): {seen & vals}'
              seen.update(vals)
          print('REMOTE_READBACK_OK building_type_5 4250->4300 batch86 Loughton final_ready=false fake_data=false')
          PY
