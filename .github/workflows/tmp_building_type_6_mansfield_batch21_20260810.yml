name: AAYS building_type_6 Mansfield OSM recovery batch 21

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_6_mansfield_batch21_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-6-mansfield-batch21-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward to latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append 250 evidence-backed Mansfield OSM records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          SLOT = "building_type_6"
          TASK = "building-type-6-england-classification-v1-20260808"
          CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"
          CITY = "Mansfield"
          LOCAL_AUTHORITY = "Mansfield District"
          REGION = "East Midlands"
          GRID_ID = "uk-grid-mansfield-001"
          BBOX = [-1.3020, 53.0810, -1.0920, 53.2070]
          MIN_NEW = 250
          RECOVERY_TARGET = 1500
          GEO = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_latest.geojson")
          MAN = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_manifest_latest.json")
          STA = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json")
          CP = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json")
          CT = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json")
          REC = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/recovery_latest.json")
          RUN = pathlib.Path("docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json")
          ENDPOINT = "https://overpass-api.de/api/interpreter"
          NOW = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def load(path):
              with path.open(encoding="utf-8") as fh:
                  return json.load(fh)

          def dump(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          task = load(CT)
          status = load(STA)
          checkpoint = load(CP)
          recovery = load(REC) if REC.exists() else {}
          manifest = load(MAN)
          geo = load(GEO)

          if task.get("task_id") != TASK or status.get("task_id") != TASK:
              raise SystemExit("task mismatch; refusing second/replacement task")
          for obj, label in ((task, "task"), (status, "status"), (checkpoint, "checkpoint")):
              if obj.get("continuation_key") != CONT:
                  raise SystemExit(f"{label} continuation_key changed; refusing stale continuation")
          ignore_stale_owner = bool(recovery.get("ignore_stale_owner"))
          for obj, label in ((task, "task"), (status, "status")):
              owner = obj.get("owner")
              if owner not in (None, "") and not ignore_stale_owner:
                  raise SystemExit(f"live owner in {label}; refusing second owner/task")
          if status.get("fake_data") is not False or checkpoint.get("fake_data") is not False:
              raise SystemExit("fake_data invariant failed before work")
          if status.get("final_ready") is True or checkpoint.get("final_ready") is True or task.get("final_ready") is True:
              raise SystemExit("final_ready invariant failed before work")

          feats = geo.get("features")
          if not isinstance(feats, list):
              raise SystemExit("invalid GeoJSON feature list")
          before = len(feats)
          recovery_floor = int(recovery.get("current_count") or 0)
          if before < recovery_floor:
              raise SystemExit(f"shard count {before} below recovery floor {recovery_floor}")
          if int(recovery.get("min_new_features_per_continuation") or MIN_NEW) > MIN_NEW:
              raise SystemExit("recovery minimum increased; workflow must be regenerated")
          if before >= RECOVERY_TARGET:
              raise SystemExit(f"recovery target already reached: {before}")
          batch_index = int(checkpoint.get("next_batch_index") or 21)
          if batch_index < 21:
              raise SystemExit(f"checkpoint regressed to batch {batch_index}")

          already = set()
          represented = set()
          for feat in feats:
              fid = feat.get("id")
              if fid not in (None, ""):
                  already.add(str(fid))
              props = feat.get("properties") or {}
              for key in ("parcel_id", "osm_id"):
                  val = props.get(key)
                  if val not in (None, ""):
                      already.add(str(val))
              for key in ("area", "city", "local_authority"):
                  val = props.get(key)
                  if val:
                      represented.add(str(val).strip().casefold())
          if CITY.casefold() in represented or LOCAL_AUTHORITY.casefold() in represented:
              raise SystemExit("Mansfield already represented; refusing duplicate city batch")

          query = '''[out:json][timeout:90];
          nwr["building"](around:7000,53.1440,-1.1970);
          out body center qt 10000;
          '''
          payload = urllib.parse.urlencode({"data": query}).encode("utf-8")
          raw = None
          last_error = None
          for attempt_no in range(1, 4):
              try:
                  req = urllib.request.Request(
                      ENDPOINT,
                      data=payload,
                      headers={
                          "User-Agent": "TerraYield-AAYS-building_type_6/1.0",
                          "Accept": "application/json",
                          "Content-Type": "application/x-www-form-urlencoded",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read()
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  if attempt_no < 3:
                      time.sleep(5 * attempt_no)
          if raw is None:
              raise SystemExit(f"Overpass failed after 3 attempts: {last_error}")

          source_sha = hashlib.sha256(raw).hexdigest()
          data = json.loads(raw.decode("utf-8"))
          elements = data.get("elements") or []
          if not isinstance(elements, list):
              raise SystemExit("invalid Overpass response")

          residential_map = {
              "house": ("residential_house", "R_HOUSE"),
              "detached": ("residential_detached", "R_DET"),
              "semidetached_house": ("residential_semidetached", "R_SEMI"),
              "terrace": ("residential_terrace", "R_TERRACE"),
              "apartments": ("residential_apartments", "R_APARTMENT"),
              "bungalow": ("residential_bungalow", "R_BUNGALOW"),
              "residential": ("residential", "R_RESIDENTIAL"),
              "dormitory": ("residential_dormitory", "R_DORMITORY"),
          }
          building_map = {
              "retail": ("commercial_retail", "C_RETAIL", "commercial"),
              "supermarket": ("commercial_retail", "C_RETAIL", "commercial"),
              "commercial": ("commercial", "C_COMMERCIAL", "commercial"),
              "office": ("office", "C_OFFICE", "commercial"),
              "hotel": ("hospitality", "C_HOSPITALITY", "commercial"),
              "industrial": ("industrial", "I_INDUSTRIAL", "industrial"),
              "warehouse": ("warehouse", "I_WAREHOUSE", "industrial"),
              "manufacture": ("industrial", "I_INDUSTRIAL", "industrial"),
              "school": ("education", "P_EDUCATION", "institutional"),
              "college": ("education", "P_EDUCATION", "institutional"),
              "university": ("education", "P_EDUCATION", "institutional"),
              "kindergarten": ("education", "P_EDUCATION", "institutional"),
              "hospital": ("healthcare_care", "H_CARE", "institutional"),
              "clinic": ("healthcare_care", "H_CARE", "institutional"),
              "church": ("religious", "P_RELIGIOUS", "institutional"),
              "chapel": ("religious", "P_RELIGIOUS", "institutional"),
              "cathedral": ("religious", "P_RELIGIOUS", "institutional"),
              "mosque": ("religious", "P_RELIGIOUS", "institutional"),
              "synagogue": ("religious", "P_RELIGIOUS", "institutional"),
              "barn": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
              "farm_auxiliary": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
              "stable": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
          }
          amenity_map = {
              "school": ("education", "P_EDUCATION", "institutional"),
              "college": ("education", "P_EDUCATION", "institutional"),
              "university": ("education", "P_EDUCATION", "institutional"),
              "kindergarten": ("education", "P_EDUCATION", "institutional"),
              "hospital": ("healthcare_care", "H_CARE", "institutional"),
              "clinic": ("healthcare_care", "H_CARE", "institutional"),
              "doctors": ("healthcare_care", "H_CARE", "institutional"),
              "place_of_worship": ("religious", "P_RELIGIOUS", "institutional"),
              "fire_station": ("public_infrastructure", "P_INFRA", "institutional"),
              "police": ("public_infrastructure", "P_INFRA", "institutional"),
              "library": ("public_infrastructure", "P_INFRA", "institutional"),
              "community_centre": ("public_infrastructure", "P_INFRA", "institutional"),
              "pub": ("commercial_retail", "C_RETAIL", "commercial"),
              "restaurant": ("commercial_retail", "C_RETAIL", "commercial"),
              "cafe": ("commercial_retail", "C_RETAIL", "commercial"),
          }

          def classify(tags):
              b = str(tags.get("building") or "").strip().lower()
              if b in residential_map:
                  primary, code = residential_map[b]
                  return primary, code, "residential", "B", 0.85, 3, False, f"osm_building_tag:{b}"
              if b in building_map:
                  primary, code, category = building_map[b]
                  return primary, code, category, "B", 0.85, 3, False, f"osm_building_tag:{b}"
              amenity = str(tags.get("amenity") or "").strip().lower()
              if amenity in amenity_map:
                  primary, code, category = amenity_map[amenity]
                  return primary, code, category, "B", 0.80, 3, False, f"osm_amenity_tag:{amenity}"
              if tags.get("shop"):
                  return "commercial_retail", "C_RETAIL", "commercial", "B", 0.80, 3, False, f"osm_shop_tag:{tags.get('shop')}"
              if tags.get("office"):
                  return "office", "C_OFFICE", "commercial", "B", 0.80, 3, False, f"osm_office_tag:{tags.get('office')}"
              tourism = str(tags.get("tourism") or "").strip().lower()
              if tourism in ("hotel", "guest_house", "hostel", "motel"):
                  return "hospitality", "C_HOSPITALITY", "commercial", "B", 0.80, 3, False, f"osm_tourism_tag:{tourism}"
              return "unknown", "U_UNKNOWN", "unknown", "U", 0.20, 1, True, f"osm_building_tag:{b or 'unknown'}"

          candidates = []
          seen_candidate = set()
          for el in elements:
              etype = str(el.get("type") or "")
              eid = el.get("id")
              tags = el.get("tags") or {}
              building = tags.get("building")
              if etype not in ("node", "way", "relation") or eid is None or not building:
                  continue
              center = el.get("center") or {}
              lat = el.get("lat", center.get("lat"))
              lon = el.get("lon", center.get("lon"))
              if lat is None or lon is None:
                  continue
              osm_id = f"{etype}/{eid}"
              fid = f"MANSFIELD_OSM_{etype}_{eid}"
              if osm_id in already or fid in already or fid in seen_candidate:
                  continue
              seen_candidate.add(fid)
              primary, code, category, ev, conf, level, review, match = classify(tags)
              evidence_parts = [f"OSM {osm_id}", f"building={building}"]
              for k in ("name", "amenity", "shop", "office", "tourism", "addr:street", "addr:housenumber", "addr:postcode"):
                  if tags.get(k):
                      evidence_parts.append(f"{k}={tags[k]}")
              excerpt = " | ".join(evidence_parts[:8])
              props = {
                  "parcel_id": fid,
                  "parcel_id_semantics": "stable OSM element-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": osm_id,
                  "slot_id": SLOT,
                  "region": REGION,
                  "area": CITY,
                  "local_authority": LOCAL_AUTHORITY,
                  "postcode": str(tags.get("addr:postcode") or ""),
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": conf,
                  "confidence_level_1_to_4": level,
                  "evidence_level": ev,
                  "source_count": 1,
                  "source": "OpenStreetMap via Overpass API",
                  "source_url": f"https://www.openstreetmap.org/{etype}/{eid}",
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_overpass_response",
                  "match_method": match,
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": hashlib.sha256(excerpt.encode("utf-8")).hexdigest(),
                  "source_evidence_excerpt": {k: tags[k] for k in ("building", "name", "amenity", "shop", "office", "tourism", "addr:postcode") if k in tags},
                  "sources": [{
                      "source_name": "OpenStreetMap Overpass API",
                      "url_or_local_path": ENDPOINT,
                      "accessed_at": NOW,
                      "sha256": source_sha,
                      "sha256_scope": "raw_overpass_response",
                      "licence": "ODbL 1.0",
                      "granularity": "building_element",
                      "fields_used": ["building", "name", "amenity", "shop", "office", "tourism", "addr:postcode"],
                      "supports_field": "building_type_primary",
                      "match_method": match,
                      "match_score": conf
                  }],
                  "geometry_match_method": "osm_element_point_or_center",
                  "address_match_method": "osm_tags_when_present",
                  "limitations": "OSM building/use-tag evidence only; grid-centered batch label, no cadastral parcel binding or EPC/VOA corroboration in this batch.",
                  "needs_manual_review": review,
                  "fake_data": False,
                  "updated_at": NOW,
              }
              candidates.append({
                  "type": "Feature",
                  "id": fid,
                  "geometry": {"type": "Point", "coordinates": [float(lon), float(lat)]},
                  "properties": props,
              })
              if len(candidates) >= MIN_NEW:
                  break

          if len(candidates) < MIN_NEW:
              raise SystemExit(f"BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(candidates)} unique candidates, recovery minimum {MIN_NEW}")

          selected = candidates[:MIN_NEW]
          feats.extend(selected)
          after = len(feats)
          if after <= before:
              raise SystemExit(f"NO_PROGRESS: feature_count_after={after} <= feature_count_before={before}")
          if after - before < MIN_NEW:
              raise SystemExit(f"recovery minimum not met: added {after-before}, need {MIN_NEW}")

          geo["features"] = feats
          geo_text = json.dumps(geo, ensure_ascii=False, indent=2) + "\n"
          GEO.write_text(geo_text, encoding="utf-8")
          geo_sha = hashlib.sha256(geo_text.encode("utf-8")).hexdigest()

          evidence_dist = collections.Counter()
          type_dist = collections.Counter()
          confidence_dist = collections.Counter()
          classified = 0
          unknown = 0
          for feat in feats:
              props = feat.get("properties") or {}
              ev = str(props.get("evidence_level") or "U")
              bt = str(props.get("building_type_primary") or "unknown")
              cl = str(props.get("confidence_level_1_to_4") or 1)
              evidence_dist[ev] += 1
              type_dist[bt] += 1
              confidence_dist[cl] += 1
              if bt == "unknown":
                  unknown += 1
              else:
                  classified += 1

          new_evidence = collections.Counter(str((f.get("properties") or {}).get("evidence_level") or "U") for f in selected)
          new_confidence = collections.Counter(str((f.get("properties") or {}).get("confidence_level_1_to_4") or 1) for f in selected)
          new_type = collections.Counter(str((f.get("properties") or {}).get("building_type_primary") or "unknown") for f in selected)

          sources = manifest.get("sources")
          if not isinstance(sources, list):
              sources = []
          sources.append({
              "name": "OpenStreetMap Overpass API - Mansfield/Mansfield District",
              "url": ENDPOINT,
              "license": "ODbL 1.0",
              "features_used": len(selected),
              "accessed_at": NOW,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_overpass_response",
              "note": "Runtime-only Overpass response; raw source not committed. building=* evidence from Mansfield-centered 7 km grid."
          })
          manifest.update({
              "generated_at": NOW,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "type_distribution": dict(sorted(type_dist.items())),
              "confidence_level_distribution": dict(sorted(confidence_dist.items())),
              "sources": sources,
              "fake_data": False,
              "feature_count": after,
              "geojson_sha256": geo_sha,
              "geojson_path": str(GEO),
              "manifest_updated_at": NOW,
              "note": f"Existing {before} features preserved; Mansfield batch {batch_index} appended {after-before} unique runtime Overpass features with already_processed_ids dedupe."
          })
          if "final_ready" in manifest:
              manifest["final_ready"] = False
          dump(MAN, manifest)

          runner = {
              "slot_id": SLOT,
              "task_id": TASK,
              "continuation_key": CONT,
              "generated_at": NOW,
              "batch_index": batch_index,
              "city": CITY,
              "local_authority": LOCAL_AUTHORITY,
              "region": REGION,
              "grid_id": GRID_ID,
              "bbox_wgs84": BBOX,
              "feature_count_before": before,
              "feature_count_after": after,
              "new_feature_count": after-before,
              "source_name": "OpenStreetMap Overpass API",
              "source_url": ENDPOINT,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_overpass_response",
              "raw_source_committed": False,
              "fake_data": False,
              "evidence_distribution_new": dict(sorted(new_evidence.items())),
              "confidence_distribution_new": dict(sorted(new_confidence.items())),
              "type_distribution_new": dict(sorted(new_type.items())),
              "records": [{
                  "feature_id": f.get("id"),
                  "geometry": f.get("geometry"),
                  **(f.get("properties") or {})
              } for f in selected]
          }
          dump(RUN, runner)

          old_status = dict(status)
          status.update({
              "state": "READY",
              "updated_at": NOW,
              "owner": old_status.get("owner"),
              "continuation_key": CONT,
              "classified_count": classified,
              "unknown_count": unknown,
              "total_elements": after,
              "confidence_distribution": dict(sorted(confidence_dist.items())),
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "output_sha256": geo_sha,
              "blocker": None,
              "next_batch_index": batch_index + 1,
              "next_target_feature_count": RECOVERY_TARGET,
              "note": f"Appended {after-before} unique Mansfield OSM building elements; no second task/owner created.",
              "fake_data": False
          })
          if "final_ready" in status:
              status["final_ready"] = False
          dump(STA, status)

          attempted = checkpoint.get("attempted_cities")
          if not isinstance(attempted, list):
              attempted = []
          if CITY not in attempted:
              attempted.append(CITY)
          source_access = checkpoint.get("source_access_evidence")
          if not isinstance(source_access, dict):
              source_access = {}
          source_access["overpass_api"] = f"SUCCESS_MANSFIELD_BATCH_{batch_index}"
          source_access["mansfield_mansfield_district_source_sha256"] = source_sha
          checkpoint.update({
              "updated_at": NOW,
              "state": "READY",
              "first_unverified_step": f"APPEND_NEW_BATCH_{batch_index+1:03d}_AFTER_FEATURE_{after}",
              "first_unverified_step_status": "READY",
              "continuation_key": CONT,
              "feature_count_before": before,
              "feature_count_after": after,
              "current_feature_count": after,
              "next_batch_index": batch_index + 1,
              "next_target_feature_count": RECOVERY_TARGET,
              "attempted_cities": attempted,
              "source_access_evidence": source_access,
              "next_required_action": f"CONTINUE_BATCH_{batch_index+1}_FROM_{after}_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES",
              "fake_data": False,
              "last_processed_ids_sample": [f.get("id") for f in selected[:10]],
              "last_city": CITY,
              "last_batch_index": batch_index,
              "last_grid_id": GRID_ID,
              "last_bbox_wgs84": BBOX,
              "next_city_index": int(checkpoint.get("next_city_index") or batch_index) + 1
          })
          summary = checkpoint.get("summary")
          if isinstance(summary, dict):
              summary["osm_pilot_classified"] = classified
              summary["unknown"] = unknown
              summary["current_feature_count"] = after
              checkpoint["summary"] = summary
          if "final_ready" in checkpoint:
              checkpoint["final_ready"] = False
          dump(CP, checkpoint)

          progress = task.get("progress")
          if not isinstance(progress, dict):
              progress = {}
          progress.update({
              "completed_count": after,
              "target_count": RECOVERY_TARGET,
              "previous_percent": round(before / RECOVERY_TARGET * 100, 4),
              "current_percent": round(after / RECOVERY_TARGET * 100, 4),
              "percent_increase": round((after-before) / RECOVERY_TARGET * 100, 4)
          })
          task.update({
              "updated_at": NOW,
              "status": "ready",
              "panel_status": "HAZIR",
              "first_unverified_step": f"APPEND_NEW_BATCH_{batch_index+1:03d}_AFTER_FEATURE_{after}",
              "continuation_key": CONT,
              "owner": task.get("owner"),
              "progress": progress,
              "fake_data": False
          })
          if "final_ready" in task:
              task["final_ready"] = False
          dump(CT, task)

          print(json.dumps({
              "slot_id": SLOT,
              "city": CITY,
              "batch_index": batch_index,
              "feature_count_before": before,
              "feature_count_after": after,
              "new_feature_count": after-before,
              "evidence_distribution_new": dict(new_evidence),
              "confidence_distribution_new": dict(new_confidence),
              "source_sha256": source_sha,
              "raw_source_committed": False,
              "fake_data": False
          }, indent=2))
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          SELF='.github/workflows/tmp_building_type_6_mansfield_batch21_20260810.yml'
          OWNED=(
            'england_map_web/data/building_type/shards/building_type_6_latest.geojson'
            'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json'
            'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json'
          )
          BASE="$(git rev-parse HEAD)"
          git config user.name 'AAYS building_type_6 continuation'
          git config user.email 'aays-building-type-6@local.invalid'
          rm -f "$SELF"
          git add "${OWNED[@]}" "$SELF"
          git diff --cached --quiet && { echo 'No staged progress'; exit 1; }
          git commit -m 'building_type_6: append Mansfield OSM batch 21 (+250)'

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            REMOTE="$(git rev-parse "origin/$BRANCH")"
            CHANGED="$(git diff --name-only "$BASE..$REMOTE" -- "${OWNED[@]}" || true)"
            if [ -n "$CHANGED" ]; then
              echo 'Same-slot files changed remotely after batch started; fail closed:'
              echo "$CHANGED"
              exit 1
            fi
            if [ "$(git rev-parse HEAD^)" != "$REMOTE" ]; then
              git rebase "origin/$BRANCH"
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Push failed after 3 guarded attempts'
          exit 1
