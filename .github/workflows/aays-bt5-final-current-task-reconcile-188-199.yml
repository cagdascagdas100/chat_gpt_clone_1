name: AAYS BT5 final current task reconcile 188-199
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-final-current-task-reconcile-188-199.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Mark reconcile started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_final_current_task_reconcile_188_199_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'RUNNING',run_id:String(context.runId),head_sha:context.sha,started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 final metadata reconcile started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Reconcile BT5 continuation metadata
        shell: bash
        run: |
          set -euo pipefail
          git -C canonical config user.name 'AAYS building_type_5'
          git -C canonical config user.email 'aays-building-type-5@users.noreply.github.com'
          cd canonical
          git fetch origin codex/aays-single-runner-v5-20260706
          git checkout -B bt5-final-meta origin/codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          cp=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          st=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          cur=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          shard=Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson')
          man=Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json')
          C=json.loads(cp.read_text()); S=json.loads(st.read_text()); Q=json.loads(cur.read_text())
          assert C['source_window_cursor']==199 and C['canonical_feature_cursor']==147
          assert S['classified_count']==5928 and S['unknown_count']==172 and S['readback_contract']['duplicate_count']==0
          shard_sha=subprocess.check_output(['git','hash-object',str(shard)],text=True).strip()
          man_sha=subprocess.check_output(['git','hash-object',str(man)],text=True).strip()
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          nr=Q.get('new_page_resume') or {}
          nr.update({'canonical_feature_count':6100,'feature_count_before':6100,'feature_count_after':6100,'new_features_appended':0,'next_batch_index':147,'canonical_feature_cursor':147,'source_window_cursor':199,'terminal_no_replay_through_cursor':199,'canonical_manifest_sha':man_sha,'canonical_shard_blob_sha':shard_sha,'blocker_code':'BOUNDED_TURN_COMPLETE_MORE_U_REMAIN','blocker_root_cause':'172_EVIDENCE_U_ROWS_REMAIN_AFTER_EXACT_ID_REFRESH','source_processing_attempted':True,'source_payload_verified':True,'latest_attempted_at':'2026-08-18T19:49:34Z','duplicate_policy':'parcel_id/source_ref/project_ref/osm_id in existing shard are terminal already_processed_ids; no replay','matching_policy':'nearest matching forbidden; exact OSM element identity or strict approved spatial binding only'})
          Q['new_page_resume']=nr; Q['updated_at']=now; Q['owner']=None; Q['status']='blocked'; Q['panel_status']='BLOCKED'; Q['final_ready']=False; Q['fake_data']=False
          cur.write_text(json.dumps(Q,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps({'source_cursor':199,'feature_cursor':147,'shard_sha':shard_sha,'manifest_sha':man_sha,'source_payload_verified':True},sort_keys=True))
          PY
          git add -- docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json
          git commit -m 'aays: reconcile building_type_5 continuation metadata after 188-199'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then break; fi
            git fetch origin codex/aays-single-runner-v5-20260706
            remote_cursor=$(git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json | python -c "import json,sys;print(json.load(sys.stdin)['source_window_cursor'])")
            test "$remote_cursor" = 199
            git rebase origin/codex/aays-single-runner-v5-20260706
          done
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json | python -c "import json,sys;d=json.load(sys.stdin);r=d['new_page_resume'];assert r['source_window_cursor']==199 and r['canonical_feature_cursor']==147 and r['source_payload_verified'] is True;print('CURRENT_TASK_READBACK_OK',r['canonical_shard_blob_sha'],r['canonical_manifest_sha'])"
      - name: Mark reconcile finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_final_current_task_reconcile_188_199_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),head_sha:context.sha,finished_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 final metadata reconcile finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
