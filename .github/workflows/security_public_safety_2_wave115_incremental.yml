name: security-public-safety-2-wave115-final-incremental

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave115_incremental.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-3c391d74df0d094b712038e46117560142b33e67f25d554a542e9e371cc235fa
  cancel-in-progress: false

jobs:
  guarded-generate-accept-publish-terminalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Claim exact final scope
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave115_orchestrator.py claim

      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Generate final official-source rows and publish accepted output
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave115_orchestrator.py run

      - name: Verify remote hashes and terminalize
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave115_orchestrator.py terminalize

      - name: Park failed continuation without duplicate retry
        if: ${{ failure() }}
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave115_orchestrator.py park
