name: tmp building_type_4 Tewkesbury OSM batch 86

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_4_cheltenham_batch80_20260811.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-type-4-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Sync canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append 50 unseen Tewkesbury OSM building-use features
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re, subprocess, textwrap
          base='682a69d54d1aa38e76d106e8cff76206d9936d04'
          path='.github/workflows/tmp_building_type_4_cheltenham_batch80_20260811.yml'
          old=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
          m=re.search(r"python3 <<'PY'\n(.*?)\n\s+PY",old,re.S)
          if not m: raise RuntimeError('append python block not found in trusted batch81 helper')
          code=textwrap.dedent(m.group(1))
          replacements=[
            ("CITY='Stroud'","CITY='Tewkesbury'"),
            ("AUTHORITY='Gloucestershire'","AUTHORITY='Gloucestershire'"),
            ("GRID='51.710,-2.280,51.790,-2.150'","GRID='51.970,-2.220,52.050,-2.080'"),
            ("BEFORE=4000; TARGET=4050; BATCH=81; NEXT_BATCH=82; NEXT_TARGET=4100","BEFORE=4250; TARGET=4300; BATCH=86; NEXT_BATCH=87; NEXT_TARGET=4350"),
            ('BATCH_81','BATCH_86'),
            ('Stroud','Tewkesbury'),
            ('batch 81','batch 86'),
            ('batch81','batch86'),
            ('20.25','21.5'),
          ]
          for a,b in replacements:
              code=code.replace(a,b)
          required=["CITY='Tewkesbury'","AUTHORITY='Gloucestershire'","BEFORE=4250; TARGET=4300; BATCH=86; NEXT_BATCH=87; NEXT_TARGET=4350","GRID='51.970,-2.220,52.050,-2.080'","for endpoint in ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']"]
          assert all(x in code for x in required)
          exec(compile(code,'batch86_tewkesbury_append.py','exec'),{'__name__':'__main__'})
          PY

      - name: Validate append and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          shard=load('england_map_web/data/building_type/shards/building_type_4_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_4_manifest_latest.json')
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json')
          st=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          run=load('docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json')
          assert len(shard['features'])==4300 and manifest['total_features']==4300
          assert cp['feature_count_before']==4250 and cp['feature_count_after']==4300 and cp['current_feature_count']==4300
          assert cp['next_batch_index']==87 and cp['next_target_feature_count']==4350
          assert st['current_feature_count']==4300 and st['next_batch_index']==87
          assert run['batch_index']==86 and run['city']=='Tewkesbury' and run['feature_count_before']==4250 and run['feature_count_after']==4300
          assert run['already_processed_ids_policy_applied'] is True and len(run['new_feature_ids'])==50 and len(set(run['new_feature_ids']))==50
          ids=set(run['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]; assert len(batch)==50
          all_ids=[str(f.get('id')) for f in shard['features']]; assert len(all_ids)==len(set(all_ids))
          parcels=[str((f.get('properties') or {}).get('parcel_id')) for f in shard['features'] if (f.get('properties') or {}).get('parcel_id') is not None]; assert len(parcels)==len(set(parcels))
          osms=[str((f.get('properties') or {}).get('osm_id')) for f in shard['features'] if (f.get('properties') or {}).get('osm_id') is not None]; assert len(osms)==len(set(osms))
          for f in batch:
              p=f['properties']; assert p['area']=='Tewkesbury' and p['local_authority']=='Gloucestershire' and p['evidence_level']=='B' and p['confidence_level_1_to_4']==3
              assert p['evidence_excerpt'] and p['source_evidence_excerpt'] and p['sources'][0].get('evidence_excerpt')
              assert p['source_url'] and p['source_hash'] and p['match_method'] and p['sources'][0].get('sha256')
              assert p['fake_data'] is False and p['final_ready'] is False
          assert task['task_id']=='building-type-4-england-classification-v1-20260808' and task.get('owner') in (None,'')
          for obj in (manifest,cp,st,run,task): assert obj.get('fake_data') is False and obj.get('final_ready') is False
          print('VALIDATED building_type_4 4250->4300 Tewkesbury batch86=50 evidence=B confidence=3/4')
          PY

      - name: Commit and push only building_type_4 outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(england_map_web/data/building_type/shards/building_type_4_latest.geojson england_map_web/data/building_type/shards/building_type_4_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json)
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r p; do ok=0; for e in "${paths[@]}"; do [[ "$p" == "$e" ]] && ok=1; done; [[ "$ok" == 1 ]] || { echo "unexpected staged path: $p"; exit 1; }; done < <(git diff --cached --name-only)
          git commit -m "data(building_type_4): append Tewkesbury OSM batch 86 4250->4300"
          echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then break; fi
            [[ $a -lt 5 ]] || exit 1; sleep $((a*2))
          done

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; load=lambda p: json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_4_latest.geojson')
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json')
          st=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          run=load('docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json')
          assert len(shard['features'])==4300 and cp['current_feature_count']==4300 and st['current_feature_count']==4300 and cp['next_batch_index']==87
          assert run['batch_index']==86 and run['city']=='Tewkesbury' and run['feature_count_before']==4250 and run['feature_count_after']==4300
          ids=set(run['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]; assert len(ids)==50 and len(batch)==50
          assert all(f['properties']['evidence_level']=='B' and f['properties']['confidence_level_1_to_4']==3 and f['properties']['evidence_excerpt'] for f in batch)
          assert all(f['properties']['fake_data'] is False and f['properties']['final_ready'] is False for f in batch)
          print('REMOTE_READBACK_OK building_type_4 4250->4300 Tewkesbury batch86=50')
          PY

      - name: Record remote readback metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); head=os.environ['DATA_COMMIT']
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json'); st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          cp=json.loads(cp_path.read_text()); st=json.loads(st_path.read_text())
          cp.update({'remote_head':head,'remote_readback_verified':True,'updated_at':now,'first_unverified_step_status':'BATCH_86_REMOTE_READBACK_VERIFIED_CONTINUATION_REQUIRED','final_ready':False,'fake_data':False})
          cp.setdefault('summary',{})['note']='PROGRESS: feature_count 4250 -> 4300. Batch 86 Tewkesbury remote readback verified; continue at batch 87. final_ready remains false.'
          st.update({'remote_head':head,'remote_readback_verified':True,'updated_at':now,'last_update':now,'note':'Batch 86 Tewkesbury OSM: 50 unique evidence-backed features appended; total 4300. Remote readback verified. Continue batch 87.','final_ready':False,'fake_data':False})
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n'); st_path.write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json
          git commit -m "building_type_4: record batch 86 remote readback"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then break; fi
            [[ $a -lt 5 ]] || exit 1; sleep $((a*2))
          done

      - name: Final remote metadata readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; load=lambda p: json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json'); st=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          assert cp['current_feature_count']==4300 and cp['next_batch_index']==87 and cp['remote_readback_verified'] is True
          assert st['current_feature_count']==4300 and st['next_batch_index']==87 and st['remote_readback_verified'] is True
          assert cp['final_ready'] is False and st['final_ready'] is False and cp['fake_data'] is False and st['fake_data'] is False
          print('FINAL_REMOTE_METADATA_OK building_type_4 current=4300 next_batch=87 final_ready=false')
          PY
