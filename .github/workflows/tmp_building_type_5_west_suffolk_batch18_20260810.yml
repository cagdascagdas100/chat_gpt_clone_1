          status.update({'state':'IN_PROGRESS','updated_at':now,'owner':None,'final_ready':False,'fake_data':False,'classified_count':classified,'unknown_count':unknown,'total_elements':after,'feature_count_before':before,'feature_count_after':after,'progress_count_delta':after-before,'next_batch_index':BATCH+1,'next_target_feature_count':TARGET+50,'confidence_distribution':dict(sorted(conf.items())),'evidence_distribution':dict(sorted(ev.items())),'output_sha256':output_sha,'candidate_batch':None,'no_progress_reason':None,'new_feature_count':50,'last_batch_index':BATCH,'last_batch_city':AREA,'last_batch_source':SOURCE_NAME,'note':'Batch 18 appended from official West Suffolk FHRS records outside all prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.','progress_reason':'50 new West Suffolk FHRS premises-use proxy records appended after feature.id/parcel_id/osm_id exclusion'}); status_p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
