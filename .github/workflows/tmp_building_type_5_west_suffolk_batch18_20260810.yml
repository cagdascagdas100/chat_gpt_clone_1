          assert len(g.get('features') or [])==900; assert s.get('feature_count_before')==850 and s.get('feature_count_after')==900 and s.get('progress_count_delta')==50; assert c.get('current_feature_count')==900 and c.get('next_batch_index')==19 and c.get('next_target_feature_count')==950; assert all(x.get('fake_data') is False for x in (s,c,t,m)); assert all(x.get('final_ready') is False for x in (s,c,t,m)); assert str(s.get('state','')).upper() not in {'DONE','PUBLISHED'}; assert str(c.get('terminal_status','')).upper() not in {'DONE','PUBLISHED'}
