              if typ=='unknown': unknown+=1
              else: classified+=1
          sources=list(manifest.get('sources') or []); sources.append({'name':SOURCE_NAME,'url':SOURCE,'features_used':50,'accessed_at':now,'source_sha256':source_sha,'source_hash_method':'sha256_raw_source_xml','authority_metadata':AUTHORITY_META,'authority_metadata_source':'https://api.ratings.food.gov.uk/authorities','evidence_level':'D','confidence_level_1_to_4':2,'note':'FHRS BusinessType premises-use proxy; not cadastral parcel geometry or building-fabric evidence.'})
