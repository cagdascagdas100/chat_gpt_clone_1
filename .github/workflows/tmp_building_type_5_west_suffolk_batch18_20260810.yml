              added.append({'type':'Feature','id':feature_id,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props}); new_ids.append(feature_id)
          new_parcels={f['properties']['parcel_id'] for f in added}; assert len(added)==50 and len(set(new_ids))==50 and len(new_parcels)==50; assert not (set(new_ids)&processed); assert not (new_parcels&processed)
          features.extend(added); after=len(features); assert after>before and after==TARGET, f'no valid progress: before={before} after={after}'
