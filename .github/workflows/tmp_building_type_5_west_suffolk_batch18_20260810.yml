name: tmp building_type_5 West Suffolk batch18

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_5_west_suffolk_batch18_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-5-west-suffolk-batch18
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'launch guarded West Suffolk batch 18')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Guard and append exactly 50 new West Suffolk FHRS features
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_5_west_suffolk_batch18_20260810.yml'
          STATUS='docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json'
          CHECKPOINT='docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json'
          TASK='docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json'
          MANIFEST='england_map_web/data/building_type/shards/building_type_5_manifest_latest.json'
          SHARD='england_map_web/data/building_type/shards/building_type_5_latest.geojson'
          RUNNER='docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json'

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            -H 'x-api-version: 2' -H 'Accept: application/json' \
            -A 'AAYS-building-type/1.0' 'https://api.ratings.food.gov.uk/authorities' \
            -o /tmp/fhrs_authorities.json

          python3 <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          data=json.loads(Path('/tmp/fhrs_authorities.json').read_text(encoding='utf-8'))
          authorities=data.get('authorities') if isinstance(data,dict) else data
          assert isinstance(authorities,list), 'FSA authorities response missing authorities list'
          matches=[]
          for a in authorities:
              name=str(a.get('Name') or a.get('FriendlyName') or '').strip()
              if name.lower()=='west suffolk': matches.append(a)
          assert len(matches)==1, f'expected exactly one West Suffolk authority, got {len(matches)}'
          a=matches[0]
          filename=str(a.get('FileName') or '').strip()
          assert filename, 'West Suffolk FileName missing from FSA authority API'
          source=urljoin('https://ratings.food.gov.uk/',filename)
          if source.startswith('http://ratings.food.gov.uk/'):
              source='https://ratings.food.gov.uk/'+source.split('http://ratings.food.gov.uk/',1)[1]
          assert source.startswith('https://ratings.food.gov.uk/'), source
          Path('/tmp/source_url.txt').write_text(source,encoding='utf-8')
          Path('/tmp/authority_meta.json').write_text(json.dumps({'LocalAuthorityId':a.get('LocalAuthorityId'),'LocalAuthorityIdCode':a.get('LocalAuthorityIdCode'),'Name':a.get('Name'),'FriendlyName':a.get('FriendlyName'),'FileName':a.get('FileName'),'EstablishmentCount':a.get('EstablishmentCount'),'LastPublishedDate':a.get('LastPublishedDate')},ensure_ascii=False,sort_keys=True),encoding='utf-8')
          print(source)
          PY

          SOURCE="$(cat /tmp/source_url.txt)"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'AAYS-building-type/1.0' "$SOURCE" -o /tmp/west_suffolk_fhrs.xml

          python3 <<'PY'
