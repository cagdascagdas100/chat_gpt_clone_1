      - 'ai-task-scripts/aays_fg7_regional_331_342_20260819.py'
      - '.github/workflows/aays-fg7-regional-331-342-20260819.yml'
permissions:
  contents: write
jobs:
  run-fg7-regional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4
