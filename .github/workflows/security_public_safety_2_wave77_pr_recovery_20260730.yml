name: security-public-safety-2-wave91-pr-target-recovery

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - .github/wave91-trigger.txt

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-a3efcf9d82e085183979087a1bf0d2ea905fa427d3009fdccd73ac023f01ce92
  cancel-in-progress: false

jobs:
  guarded-wave91-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Check idempotent claim gate
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          queue = Path('docs/chatgpt_status/aays1/queue/0066_security_public_safety_2_priority_20110row_incremental_evidence_expansion_20260730.v3.task.json')
          current = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/current_task_latest.json')
          continuation = 'a3efcf9d82e085183979087a1bf0d2ea905fa427d3009fdccd73ac023f01ce92'
          payload = json.loads(current.read_text(encoding='utf-8'))
          print('run=false' if queue.exists() or payload.get('continuation_key') == continuation else 'run=true')
          PY

      - name: Validate Wave91 orchestrator syntax
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave91_orchestrator.py

      - name: Claim exact next scope
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave91_orchestrator.py claim

      - name: Install browser runtime
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Generate official-source rows and publish accepted output
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave91_orchestrator.py run

      - name: Verify remote hashes and terminalize
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave91_orchestrator.py terminalize

      - name: Park failed continuation without duplicate retry
        if: failure() && steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave91_orchestrator.py park
