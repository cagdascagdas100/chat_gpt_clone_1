name: tmp building_type_7 Telford batch 13

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_telford_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Fetch Telford and Wrekin FHRS source to runtime cache only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 \
            --output /tmp/telford_fhrs.xml \
            https://ratings.food.gov.uk/api/open-data-files/FHRS900en-GB.xml
          test -s /tmp/telford_fhrs.xml

      - name: Append exactly 50 new Telford and Wrekin proxy features
        shell: bash
        run: |
          set -euo pipefail
          git show 75e4277e368db332a167b10f01075166c7bc70e7:.github/workflows/tmp_building_type_7_stoke_20260810.yml > /tmp/stoke_template.yml
          python3 <<'PY'
          from pathlib import Path

          text = Path('/tmp/stoke_template.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          body = text[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'

          replacements = [
              ('CITY = "Stoke-on-Trent"', 'CITY = "Telford & Wrekin"'),
              ('PREFIX = "STK"', 'PREFIX = "TFW"'),
              ('Food Standards Agency FHRS daily open data - Stoke-on-Trent', 'Food Standards Agency FHRS daily open data - Telford & Wrekin'),
              ('https://ratings.food.gov.uk/api/open-data-files/FHRS880en-GB.xml', 'https://ratings.food.gov.uk/api/open-data-files/FHRS900en-GB.xml'),
              ('EXPECTED_BEFORE = 550', 'EXPECTED_BEFORE = 600'),
              ('EXPECTED_BATCH = 12', 'EXPECTED_BATCH = 13'),
              ('EXPECTED_TARGET = 600', 'EXPECTED_TARGET = 650'),
              ('/tmp/stoke_fhrs.xml', '/tmp/telford_fhrs.xml'),
              ('BATCH_APPENDED_50_STOKE_ON_TRENT_FHRS_CONTINUATION_REQUIRED', 'BATCH_APPENDED_50_TELFORD_WREKIN_FHRS_CONTINUATION_REQUIRED'),
              ('Stoke-on-Trent FHRS records', 'Telford & Wrekin FHRS records'),
              ('Stoke-on-Trent FHRS batch', 'Telford & Wrekin FHRS batch'),
              ('Stoke source already recorded', 'Telford source already recorded'),
              ('eligible new Stoke features', 'eligible new Telford features'),
          ]
          for old, new in replacements:
              if old not in body:
                  raise SystemExit(f'template token missing: {old}')
              body = body.replace(old, new)

          required = [
              'CITY = "Telford & Wrekin"',
              'PREFIX = "TFW"',
              'FHRS900en-GB.xml',
              'EXPECTED_BEFORE = 600',
              'EXPECTED_BATCH = 13',
              'EXPECTED_TARGET = 650',
              'BATCH_APPENDED_50_TELFORD_WREKIN_FHRS_CONTINUATION_REQUIRED',
              'task.get("owner") is None',
              'feature_id", p.get("parcel_id"), p.get("osm_id")',
              '"evidence_excerpt": excerpt',
              '"evidence_level": "D"',
              '"confidence_level_1_to_4": 2',
              '"fake_data": False',
              '"final_ready": False',
          ]
          missing = [x for x in required if x not in body]
          if missing:
              raise SystemExit(f'patched template incomplete: {missing}')
          Path('/tmp/run_telford.py').write_text(body, encoding='utf-8')
          PY
          python3 /tmp/run_telford.py

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          shard = json.loads(Path('england_map_web/data/building_type/shards/building_type_7_latest.geojson').read_text(encoding='utf-8'))
          manifest = json.loads(Path('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json').read_text(encoding='utf-8'))
          checkpoint = json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json').read_text(encoding='utf-8'))
          status = json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json').read_text(encoding='utf-8'))
          runner = json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json').read_text(encoding='utf-8'))
          task = json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json').read_text(encoding='utf-8'))

          assert len(shard.get('features') or []) == 650
          assert manifest.get('feature_count_before') == 600 and manifest.get('feature_count_after') == 650
          assert manifest.get('added_feature_count') == 50
          assert checkpoint.get('feature_count_before') == 600 and checkpoint.get('feature_count_after') == 650
          assert checkpoint.get('current_feature_count') == 650
          assert checkpoint.get('next_batch_index') == 14 and checkpoint.get('next_target_feature_count') == 700
          assert runner.get('feature_count_before') == 600 and runner.get('feature_count_after') == 650 and runner.get('added_feature_count') == 50
          assert task.get('owner') is None
          assert manifest.get('fake_data') is False and manifest.get('final_ready') is False
          assert checkpoint.get('fake_data') is False and checkpoint.get('final_ready') is False
          assert status.get('fake_data') is False and status.get('final_ready') is False

          new = [f for f in shard['features'] if str(f.get('id') or '').startswith('TFW_FHRS_')]
          assert len(new) == 50, len(new)
          ids = [str(f.get('id')) for f in new]
          parcels = [str((f.get('properties') or {}).get('parcel_id')) for f in new]
          assert len(ids) == len(set(ids)) == 50
          assert len(parcels) == len(set(parcels)) == 50
          for f in new:
              p = f.get('properties') or {}
              assert p.get('evidence_excerpt')
              assert p.get('evidence_level') == 'D'
              assert p.get('confidence_level_1_to_4') == 2
              assert p.get('fake_data') is False
              assert p.get('final_ready') is False
              assert p.get('source_url') == 'https://ratings.food.gov.uk/api/open-data-files/FHRS900en-GB.xml'
          print('validated 600->650 with 50 new TFW features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_7_latest.geojson
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          )
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r p; do
            ok=0
            for expected in "${paths[@]}"; do
              [[ "$p" == "$expected" ]] && ok=1
            done
            [[ "$ok" == 1 ]] || { echo "unexpected staged path: $p"; exit 1; }
          done < <(git diff --cached --name-only)
          git commit -m "data(building_type_7): append Telford FHRS batch 600->650"

          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then
              git merge --abort || true
              echo "merge conflict; refusing to overwrite another slot"
              exit 1
            fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
