name: tmp building_type_2 Barking and Dagenham batch 28

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_2_barking_dagenham_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Resolve and fetch Barking and Dagenham FHRS source to runtime cache only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 \
            --output /tmp/fsa_open_data.html \
            https://ratings.food.gov.uk/open-data
          test -s /tmp/fsa_open_data.html
          python - <<'PY'
          import html as htmllib
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          raw = Path('/tmp/fsa_open_data.html').read_text(encoding='utf-8', errors='replace')
          candidates = []
          for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', raw, flags=re.I | re.S):
              text = re.sub(r'<[^>]+>', ' ', htmllib.unescape(row))
              text = re.sub(r'\s+', ' ', text).strip()
              if re.search(r'\bBarking and Dagenham\b', text, flags=re.I):
                  candidates.extend(re.findall(r'href=["\']([^"\']*open-data-files/[^"\']+\.xml[^"\']*)', row, flags=re.I))
          if not candidates:
              for m in re.finditer(r'\bBarking and Dagenham\b', raw, flags=re.I):
                  window = raw[max(0, m.start()-1500):min(len(raw), m.end()+1500)]
                  candidates.extend(re.findall(r'href=["\']([^"\']*open-data-files/[^"\']+\.xml[^"\']*)', window, flags=re.I))
          urls = []
          for href in candidates:
              url = urljoin('https://ratings.food.gov.uk/open-data', htmllib.unescape(href))
              p = urlparse(url)
              if p.scheme == 'https' and p.netloc == 'ratings.food.gov.uk' and p.path.startswith('/api/open-data-files/') and p.path.endswith('.xml'):
                  if url not in urls:
                      urls.append(url)
          assert len(urls) == 1, f'expected exactly one Barking and Dagenham FHRS XML URL, got {urls}'
          Path('/tmp/barking_dagenham_source_url.txt').write_text(urls[0] + '\n', encoding='utf-8')
          print(f'resolved Barking and Dagenham source: {urls[0]}')
          PY
          curl --fail --location --retry 2 --retry-delay 2 \
            --output /tmp/barking_dagenham_fhrs.xml \
            "$(cat /tmp/barking_dagenham_source_url.txt)"
          test -s /tmp/barking_dagenham_fhrs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/barking_dagenham_fhrs.xml').getroot()
          names = {(n.text or '').strip() for n in root.findall('.//LocalAuthorityName') if (n.text or '').strip()}
          assert 'Barking and Dagenham' in names, f'expected Barking and Dagenham FHRS source, got sample={sorted(names)[:10]}'
          print('verified Barking and Dagenham FHRS source authority')
          PY

      - name: Append exactly 50 new Barking and Dagenham proxy features
        shell: bash
        run: |
          set -euo pipefail
          git show 8621d29652a7387561bc123e4792aaeb14c4c366:.github/workflows/tmp_building_type_7_worcester_20260810.yml > /tmp/worcester_template.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/worcester_template.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          replacements = [
              ('SOURCE_URL = "https://ratings.food.gov.uk/api/open-data-files/FHRS151en-GB.xml"', 'SOURCE_URL = pathlib.Path("/tmp/barking_dagenham_source_url.txt").read_text(encoding="utf-8").strip()'),
              ('SLOT = "building_type_7"', 'SLOT = "building_type_2"'),
              ('TASK_ID = "building-type-7-england-classification-v1-20260808"', 'TASK_ID = "building-type-2-england-classification-v1-20260808"'),
              ('building_type_7', 'building_type_2'),
              ('building-type-7', 'building-type-2'),
              ('WORCESTER_CITY', 'BARKING_DAGENHAM'),
              ('CITY = "Worcester City"', 'CITY = "Barking and Dagenham"'),
              ('PREFIX = "WORC"', 'PREFIX = "BARKING_DAGENHAM"'),
              ('Worcester City', 'Barking and Dagenham'),
              ('/tmp/worcester_fhrs.xml', '/tmp/barking_dagenham_fhrs.xml'),
              ('Worcester', 'Barking and Dagenham'),
              ('EXPECTED_BEFORE = 750', 'EXPECTED_BEFORE = 1350'),
              ('EXPECTED_BATCH = 16', 'EXPECTED_BATCH = 28'),
              ('EXPECTED_TARGET = 800', 'EXPECTED_TARGET = 1400'),
              ('West Midlands', 'London Outer'),
          ]
          for old, new in replacements:
              if old in body:
                  body = body.replace(old, new)

          required = [
              'SLOT = "building_type_2"',
              'CITY = "Barking and Dagenham"',
              'PREFIX = "BARKING_DAGENHAM"',
              'building-type-2-england-classification-v1-20260808',
              'SOURCE_URL = pathlib.Path("/tmp/barking_dagenham_source_url.txt").read_text(encoding="utf-8").strip()',
              'EXPECTED_BEFORE = 1350',
              'EXPECTED_BATCH = 28',
              'EXPECTED_TARGET = 1400',
              '/tmp/barking_dagenham_fhrs.xml',
              '"region": "London Outer"',
              'for value in (f.get("id"), p.get("feature_id"), p.get("parcel_id"), p.get("osm_id")):',
              'evidence_excerpt',
              'evidence_level',
              'confidence_level_1_to_4',
              'source_hash',
              'fake_data',
              'final_ready',
          ]
          missing = [token for token in required if token not in body]
          assert not missing, f"patched template missing required tokens: {missing}"
          forbidden = ['building_type_7', 'building-type-7', 'Worcester', 'West Midlands', '/tmp/worcester_fhrs.xml', 'FHRS151en-GB.xml']
          leaked = [token for token in forbidden if token in body]
          assert not leaked, f"patched template leaked old slot/city tokens: {leaked}"
          exec(compile(body, '<building_type_2_barking_dagenham_append>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          shard_path = Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest_path = Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner_path = Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          status_path = Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          checkpoint_path = Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          task_path = Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          source_url = Path('/tmp/barking_dagenham_source_url.txt').read_text(encoding='utf-8').strip()

          shard = json.loads(shard_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          runner = json.loads(runner_path.read_text(encoding='utf-8'))
          status = json.loads(status_path.read_text(encoding='utf-8'))
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          task = json.loads(task_path.read_text(encoding='utf-8'))

          assert len(shard['features']) == 1400
          assert manifest['feature_count_before'] == 1350 and manifest['feature_count_after'] == 1400 and manifest['added_feature_count'] == 50
          assert manifest['feature_count_after'] > manifest['feature_count_before']
          assert checkpoint['feature_count_before'] == 1350 and checkpoint['feature_count_after'] == 1400 and checkpoint['current_feature_count'] == 1400
          assert checkpoint['next_batch_index'] == 29 and checkpoint['next_target_feature_count'] == 1450
          assert runner['feature_count_before'] == 1350 and runner['feature_count_after'] == 1400 and runner['added_feature_count'] == 50
          assert status['feature_count_before'] == 1350 and status['feature_count_after'] == 1400 and status['current_feature_count'] == 1400
          assert task['owner'] is None and task['fake_data'] is False and task['final_ready'] is False
          assert manifest['fake_data'] is False and manifest['final_ready'] is False
          assert checkpoint['fake_data'] is False and checkpoint['final_ready'] is False
          assert runner['city'] == 'Barking and Dagenham'
          assert runner['source_url'] == source_url
          assert set(runner['already_processed_id_fields']) == {'feature.id','properties.feature_id','properties.parcel_id','properties.osm_id'}

          batch = [f for f in shard['features'] if str(f.get('id') or '').startswith('BARKING_DAGENHAM_FHRS_')]
          assert len(batch) == 50, len(batch)
          ids = [f['id'] for f in batch]
          parcels = [(f.get('properties') or {}).get('parcel_id') for f in batch]
          assert len(ids) == len(set(ids)) == 50
          assert len(parcels) == len(set(parcels)) == 50
          for f in batch:
              p = f.get('properties') or {}
              assert p.get('evidence_excerpt')
              assert p.get('evidence_level') == 'D'
              assert p.get('confidence_level_1_to_4') == 2
              assert p.get('source_hash')
              assert p.get('source_url') == source_url
              assert p.get('fake_data') is False
              assert p.get('final_ready') is False
          print(f'validated building_type_2 Barking and Dagenham 1350->1400; source={source_url}; 50 new D/confidence-2 features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${files[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${files[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}")
          test "${#staged[@]}" -eq 5
          git commit -m "data(building_type_2): append Barking and Dagenham FHRS batch 1350->1400"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git rebase origin/codex/aays-single-runner-v5-20260706
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              pushed=1
              break
            fi
          done
          test "$pushed" -eq 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          ref = 'origin/codex/aays-single-runner-v5-20260706'
          source_url = Path('/tmp/barking_dagenham_source_url.txt').read_text(encoding='utf-8').strip()
          def load(path):
              return json.loads(subprocess.check_output(['git','show',f'{ref}:{path}']))
          shard = load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest = load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner = load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          checkpoint = load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          task = load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features']) == 1400
          assert manifest['feature_count_before'] == 1350 and manifest['feature_count_after'] == 1400 and manifest['added_feature_count'] == 50
          assert checkpoint['current_feature_count'] == 1400 and checkpoint['next_batch_index'] == 29 and checkpoint['next_target_feature_count'] == 1450
          assert runner['city'] == 'Barking and Dagenham' and runner['source_url'] == source_url and len(runner['selected_feature_ids']) == 50
          assert task['owner'] is None and task['fake_data'] is False and task['final_ready'] is False
          batch = [f for f in shard['features'] if str(f.get('id') or '').startswith('BARKING_DAGENHAM_FHRS_')]
          assert len(batch) == 50
          assert all((f.get('properties') or {}).get('fake_data') is False for f in batch)
          assert all((f.get('properties') or {}).get('final_ready') is False for f in batch)
          print(f'remote readback verified: building_type_2=1400; Barking and Dagenham batch=50; source={source_url}')
          PY
