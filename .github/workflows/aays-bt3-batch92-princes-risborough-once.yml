name: AAYS building_type_3 batch92 Princes Risborough once
on:
  push:
    paths:
      - '.github/workflows/aays-bt3-batch92-princes-risborough-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-3-batch92-princes-risborough
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 50
          clean: false
      - name: Sync branch without reset clean or force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706
      - name: Batch 92 classify and append exactly 50 attempts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, textwrap
          base_path='.github/workflows/aays-bt3-batch90-henley-on-thames-retry1.yml'
          text=open(base_path,encoding='utf-8').read()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",text,re.S)
          if not m:
              raise SystemExit('BASE_RUNNER_BLOCK_NOT_FOUND')
          src=textwrap.dedent(m.group(1))
          old_tiles="tiles=[(-0.9300,51.5200,-0.9200,51.5300),(-0.9200,51.5200,-0.9100,51.5300),(-0.9100,51.5200,-0.9000,51.5300),(-0.9000,51.5200,-0.8900,51.5300),(-0.8900,51.5200,-0.8800,51.5300),(-0.9300,51.5300,-0.9200,51.5400),(-0.9200,51.5300,-0.9100,51.5400),(-0.9100,51.5300,-0.9000,51.5400),(-0.9000,51.5300,-0.8900,51.5400),(-0.8900,51.5300,-0.8800,51.5400),(-0.9300,51.5400,-0.9200,51.5500),(-0.9200,51.5400,-0.9100,51.5500),(-0.9100,51.5400,-0.9000,51.5500),(-0.9000,51.5400,-0.8900,51.5500),(-0.8900,51.5400,-0.8800,51.5500),(-0.9300,51.5500,-0.9200,51.5600),(-0.9200,51.5500,-0.9100,51.5600),(-0.9100,51.5500,-0.9000,51.5600),(-0.9000,51.5500,-0.8900,51.5600),(-0.8900,51.5500,-0.8800,51.5600)]"
          new_tiles="tiles=[(-0.8700,51.7000,-0.8600,51.7100),(-0.8600,51.7000,-0.8500,51.7100),(-0.8500,51.7000,-0.8400,51.7100),(-0.8400,51.7000,-0.8300,51.7100),(-0.8300,51.7000,-0.8200,51.7100),(-0.8200,51.7000,-0.8100,51.7100),(-0.8100,51.7000,-0.8000,51.7100),(-0.8700,51.7100,-0.8600,51.7200),(-0.8600,51.7100,-0.8500,51.7200),(-0.8500,51.7100,-0.8400,51.7200),(-0.8400,51.7100,-0.8300,51.7200),(-0.8300,51.7100,-0.8200,51.7200),(-0.8200,51.7100,-0.8100,51.7200),(-0.8100,51.7100,-0.8000,51.7200),(-0.8700,51.7200,-0.8600,51.7300),(-0.8600,51.7200,-0.8500,51.7300),(-0.8500,51.7200,-0.8400,51.7300),(-0.8400,51.7200,-0.8300,51.7300),(-0.8300,51.7200,-0.8200,51.7300),(-0.8200,51.7200,-0.8100,51.7300),(-0.8100,51.7200,-0.8000,51.7300),(-0.8700,51.7300,-0.8600,51.7400),(-0.8600,51.7300,-0.8500,51.7400),(-0.8500,51.7300,-0.8400,51.7400),(-0.8400,51.7300,-0.8300,51.7400),(-0.8300,51.7300,-0.8200,51.7400),(-0.8200,51.7300,-0.8100,51.7400),(-0.8100,51.7300,-0.8000,51.7400),(-0.8700,51.7400,-0.8600,51.7500),(-0.8600,51.7400,-0.8500,51.7500),(-0.8500,51.7400,-0.8400,51.7500),(-0.8400,51.7400,-0.8300,51.7500),(-0.8300,51.7400,-0.8200,51.7500),(-0.8200,51.7400,-0.8100,51.7500),(-0.8100,51.7400,-0.8000,51.7500)]"
          replacements={
              "BATCH=90; CITY='Henley-on-Thames'; GRID='uk-grid-henley-on-thames-central-001'; REGION='South East'; LOCAL_AUTHORITY='Oxfordshire'; TARGET=50; EXPECTED_BEFORE=9200":"BATCH=92; CITY='Princes Risborough'; GRID='uk-grid-princes-risborough-central-001'; REGION='South East'; LOCAL_AUTHORITY='Buckinghamshire'; TARGET=50; EXPECTED_BEFORE=9300",
              old_tiles:new_tiles,
              "building_type_3 batch90":"building_type_3 batch92",
              "Henley-on-Thames central tiled grid -0.9300,51.5200,-0.8800,51.5600":"Princes Risborough central tiled grid -0.8700,51.7000,-0.8000,51.7500",
              "OpenStreetMap API 0.6 map - Henley-on-Thames Batch 90":"OpenStreetMap API 0.6 map - Princes Risborough Batch 92",
              "'next_city':'Thame','next_grid_id':'uk-grid-thame-central-001'":"'next_city':'Wendover','next_grid_id':'uk-grid-wendover-central-001'",
              "BATCH90_RESULT":"BATCH92_RESULT",
          }
          for old,new in replacements.items():
              if old not in src:
                  raise SystemExit('PATCH_TOKEN_MISSING '+old[:120])
              src=src.replace(old,new)
          ns={}
          exec(compile(src,'batch92_princes_risborough_runner.py','exec'),ns,ns)
          PY
      - name: Guard remote state commit and push explicit slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json > /tmp/remote_cp.json
          python - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json'))
          assert cp.get('continuation_key')=='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e'
          assert cp.get('current_feature_count')==9300, cp.get('current_feature_count')
          assert cp.get('next_batch_index')==92, cp.get('next_batch_index')
          assert cp.get('fake_data') is False
          assert cp.get('final_ready') is False
          PY
          git add -- england_map_web/data/building_type/shards/building_type_3_latest.geojson england_map_web/data/building_type/shards/building_type_3_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json
          if git diff --cached --quiet; then echo 'NO_EVIDENCE_THIS_BATCH: no output changes'; exit 0; fi
          git commit -m 'data(aays): building_type_3 batch92 Princes Risborough'
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          git push origin HEAD:codex/aays-single-runner-v5-20260706
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json > /tmp/cp.json
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json > /tmp/r.json
          python - <<'PY'
          import json
          cp=json.load(open('/tmp/cp.json')); r=json.load(open('/tmp/r.json'))
          assert r.get('batch_index')==92
          assert r.get('attempted_parcels')==50
          assert r.get('fake_data') is False and r.get('final_ready') is False
          print('REMOTE_READBACK',json.dumps({'before':r.get('feature_count_before'),'attempted':r.get('attempted_parcels'),'added':r.get('added_feature_count'),'after':r.get('feature_count_after'),'confidence':r.get('confidence_level_distribution'),'evidence':r.get('evidence_level_distribution'),'NO_EVIDENCE_THIS_BATCH':r.get('NO_EVIDENCE_THIS_BATCH'),'next_batch':cp.get('next_batch_index'),'next_city':cp.get('next_city'),'next_grid':cp.get('next_grid_id')},ensure_ascii=False))
          PY