name: Generate E-Books Nachteile Audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'deutsch_tests_1/ebook_audio_text.txt'
      - '.github/workflows/generate-ebook-nachteile-audio.yml'

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate German MP3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, subprocess, textwrap
          from pathlib import Path

          src = Path('deutsch_tests_1/ebook_audio_text.txt')
          out = Path('deutsch_tests_1/ebook_nachteile_audio.mp3')
          text = src.read_text(encoding='utf-8').strip()
          tmp = Path('deutsch_tests_1/.audio_parts')
          tmp.mkdir(parents=True, exist_ok=True)

          def chunks(t, limit=2300):
              sents = re.split(r'(?<=[.!?])\s+', t)
              res=[]; cur=''
              for s in sents:
                  if len(cur)+len(s)+1 > limit:
                      if cur.strip(): res.append(cur.strip())
                      cur=s
                  else:
                      cur=(cur+' '+s).strip()
              if cur.strip(): res.append(cur.strip())
              return res

          parts = chunks(text)

          if os.environ.get('OPENAI_API_KEY'):
              import requests
              for i, part in enumerate(parts, 1):
                  print('OpenAI TTS part', i, 'of', len(parts))
                  r = requests.post(
                      'https://api.openai.com/v1/audio/speech',
                      headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY'], 'Content-Type':'application/json'},
                      json={
                          'model':'gpt-4o-mini-tts',
                          'voice':'coral',
                          'input':part,
                          'instructions':'Sprich klares, natürliches Hochdeutsch wie ein gebildeter deutscher Muttersprachler. Ruhig, deutlich, freundlich und lernorientiert. Keine übertriebene Betonung.',
                          'response_format':'mp3'
                      }, timeout=180)
                  r.raise_for_status()
                  (tmp / f'part_{i:03d}.mp3').write_bytes(r.content)
          else:
              import asyncio, edge_tts
              async def main():
                  for i, part in enumerate(parts, 1):
                      print('Edge TTS German neural part', i, 'of', len(parts))
                      communicate = edge_tts.Communicate(part, voice='de-DE-KatjaNeural', rate='-8%', pitch='-2Hz')
                      await communicate.save(str(tmp / f'part_{i:03d}.mp3'))
              asyncio.run(main())

          files = sorted(tmp.glob('part_*.mp3'))
          concat = tmp / 'concat.txt'
          concat.write_text('\n'.join("file '"+str(p.resolve())+"'" for p in files), encoding='utf-8')
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i',str(concat),'-c','copy',str(out)], check=True)
          print('Generated', out, out.stat().st_size, 'bytes')
          PY

      - name: Commit MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deutsch_tests_1/ebook_nachteile_audio.mp3
          git commit -m "Generate E-Books Nachteile German audio MP3" || echo "No changes to commit"
          git push
