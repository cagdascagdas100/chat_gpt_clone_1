name: tmp building_type_5 East Hertfordshire batch23

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_5_east_hertfordshire_batch23_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-5-write
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'launch guarded East Hertfordshire batch 23')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Guard, fetch source, append exactly 50 new East Hertfordshire FHRS features
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_5_east_hertfordshire_batch23_20260810.yml'
          SOURCE='https://ratings.food.gov.uk/api/open-data-files/FHRS157en-GB.xml'
          STATUS='docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json'
          CHECKPOINT='docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json'
          TASK='docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json'
          MANIFEST='england_map_web/data/building_type/shards/building_type_5_manifest_latest.json'
          SHARD='england_map_web/data/building_type/shards/building_type_5_latest.geojson'
          RUNNER='docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          python3 <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json').read_text())
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json').read_text())
          geo=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson').read_text())
          assert status.get('slot_id')=='building_type_5' and cp.get('slot_id')=='building_type_5' and task.get('slot_id')=='building_type_5'
          assert status.get('task_id')=='building-type-5-england-classification-v1-20260808'
          assert task.get('task_id')=='building-type-5-england-classification-v1-20260808'
          assert status.get('owner') is None and task.get('owner') is None, 'live owner detected'
          assert str(status.get('state','')).upper() not in {'DONE','PUBLISHED'}
          assert str(cp.get('terminal_status','')).upper() not in {'DONE','PUBLISHED'}
          assert len(geo.get('features') or [])==1100
          assert int(status.get('feature_count_after',-1))==1100
          assert int(cp.get('current_feature_count',-1))==1100
          assert int(cp.get('next_batch_index',-1))==23
          assert int(cp.get('next_target_feature_count',-1))==1150
          assert int(manifest.get('total_features',manifest.get('feature_count',-1)))==1100
          assert all(x.get('fake_data') is False for x in (status,cp,task,manifest))
          assert all(x.get('final_ready') is False for x in (status,cp,task,manifest))
          assert not any('east hertfordshire' in str(s.get('name','')).casefold() for s in manifest.get('sources',[]) if isinstance(s,dict)), 'East Hertfordshire already used'
          PY

          : > /tmp/base_slot_hashes.txt
          for p in "$SHARD" "$MANIFEST" "$RUNNER" "$STATUS" "$CHECKPOINT" "$TASK"; do
            printf '%s %s\n' "$p" "$(git rev-parse HEAD:"$p")" >> /tmp/base_slot_hashes.txt
          done

          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'AAYS-building-type/1.0' "$SOURCE" -o /tmp/FHRS157en-GB.xml
          test -s /tmp/FHRS157en-GB.xml
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/FHRS157en-GB.xml').getroot()
          vals=[]
          for e in root.iter():
              if e.tag.rsplit('}',1)[-1]=='LocalAuthorityName' and e.text:
                  vals.append(e.text.strip())
          assert any(v.casefold()=='east hertfordshire' for v in vals), sorted(set(vals))[:20]
          PY

          git show 1c2e73f094960a3e6e8a12443899dc48497ca2db:.github/workflows/tmp_building_type_5_breckland_batch22_20260810.yml > /tmp/breckland_template.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('/tmp/breckland_template.yml').read_text(encoding='utf-8')
          marker="          python3 <<'PY'\n"
          assert marker in text
          rest=text.split(marker,1)[1]
          end=rest.index("\n          PY\n")
          body=textwrap.dedent(rest[:end])
          replacements=[
            ("https://ratings.food.gov.uk/api/open-data-files/FHRS227en-GB.xml","https://ratings.food.gov.uk/api/open-data-files/FHRS157en-GB.xml"),
            ("Food Standards Agency FHRS daily open data - Breckland","Food Standards Agency FHRS daily open data - East Hertfordshire"),
            ("BEFORE=1050","BEFORE=1100"),
            ("BATCH=22","BATCH=23"),
            ("TARGET=1100","TARGET=1150"),
            ("PREFIX='BRK'","PREFIX='EHRT'"),
            ("Path('/tmp/FHRS227en-GB.xml')","Path('/tmp/FHRS157en-GB.xml')"),
            ("!='breckland'","!='east hertfordshire'"),
            ("'Breckland'","'East Hertfordshire'"),
            ("Batch 22 appended","Batch 23 appended"),
            ("BATCH_22_APPENDED_50_BRECKLAND_FHRS_CONTINUATION_REQUIRED","BATCH_23_APPENDED_50_EAST_HERTFORDSHIRE_FHRS_CONTINUATION_REQUIRED")
          ]
          for old,new in replacements:
              assert old in body, old
              body=body.replace(old,new)
          assert 'Breckland' not in body and "!='breckland'" not in body
          assert 'BEFORE=1100' in body and 'BATCH=23' in body and 'TARGET=1150' in body
          assert "PREFIX='EHRT'" in body
          assert "evidence_excerpt" in body and "evidence_level':'D'" in body and "confidence_level_1_to_4':2" in body
          Path('/tmp/east_hertfordshire_append.py').write_text(body,encoding='utf-8')
          compile(body,'/tmp/east_hertfordshire_append.py','exec')
          PY
          python3 /tmp/east_hertfordshire_append.py

          python3 <<'PY'
          import json
          from pathlib import Path
          geo=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json').read_text())
          runner=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json').read_text())
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json').read_text())
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json').read_text())
          feats=geo.get('features') or []
          assert len(feats)==1150
          assert manifest.get('feature_count_before')==1100 and manifest.get('feature_count_after')==1150 and manifest.get('added_feature_count')==50
          assert runner.get('feature_count_before')==1100 and runner.get('feature_count_after')==1150 and runner.get('new_feature_count')==50
          assert runner.get('batch_index')==23 and runner.get('city')=='East Hertfordshire'
          assert runner.get('source_url')=='https://ratings.food.gov.uk/api/open-data-files/FHRS157en-GB.xml'
          assert runner.get('evidence_level')=='D' and runner.get('confidence_level_1_to_4')==2
          assert runner.get('fake_data') is False and runner.get('final_ready') is False
          assert status.get('feature_count_before')==1100 and status.get('feature_count_after')==1150 and status.get('progress_count_delta')==50
          assert status.get('next_batch_index')==24 and status.get('next_target_feature_count')==1200
          assert status.get('owner') is None and status.get('fake_data') is False and status.get('final_ready') is False
          assert cp.get('current_feature_count')==1150 and cp.get('next_batch_index')==24 and cp.get('next_target_feature_count')==1200
          assert cp.get('first_unverified_step_status')=='BATCH_23_APPENDED_50_EAST_HERTFORDSHIRE_FHRS_CONTINUATION_REQUIRED'
          assert cp.get('fake_data') is False and cp.get('final_ready') is False
          assert task.get('owner') is None and task.get('fake_data') is False and task.get('final_ready') is False
          existing=set()
          for f in feats[:1100]:
              p=f.get('properties') or {}
              for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')):
                  if v is not None and str(v).strip(): existing.add(str(v).strip())
          new=feats[1100:]
          assert len(new)==50
          ids=[]; parcels=[]
          for f in new:
              p=f.get('properties') or {}
              fid=str(f.get('id') or '').strip(); parcel=str(p.get('parcel_id') or '').strip(); osm=str(p.get('osm_id') or '').strip()
              assert fid.startswith('EHRT_FHRS_') and parcel.startswith('EHRT_FHRSID_')
              assert fid not in existing and parcel not in existing
              if osm: assert osm not in existing
              assert p.get('evidence_excerpt')
              assert p.get('source_url')=='https://ratings.food.gov.uk/api/open-data-files/FHRS157en-GB.xml'
              assert p.get('source_hash') and p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2
              assert p.get('match_method')=='fhrs_business_type_premises_proxy'
              assert p.get('needs_manual_review') is True and p.get('proxy_only') is True
              assert p.get('fake_data') is False and p.get('final_ready') is False
              ids.append(fid); parcels.append(parcel)
          assert len(set(ids))==50 and len(set(parcels))==50
          assert set(ids)==set(runner.get('new_feature_ids') or [])
          PY

          expected="$(printf '%s\n' "$SHARD" "$MANIFEST" "$RUNNER" "$STATUS" "$CHECKPOINT" | sort)"
          actual="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          test "$actual" = "$expected"

          git fetch origin "$BRANCH"
          python3 <<'PY'
          import json, subprocess
          branch='codex/aays-single-runner-v5-20260706'
          def remote(path):
              return json.loads(subprocess.check_output(['git','show',f'origin/{branch}:{path}'],text=True))
          s=remote('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          c=remote('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          t=remote('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          m=remote('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json')
          assert s.get('owner') is None and t.get('owner') is None
          assert int(s.get('feature_count_after',-1))==1100
          assert int(c.get('current_feature_count',-1))==1100
          assert int(c.get('next_batch_index',-1))==23
          assert int(c.get('next_target_feature_count',-1))==1150
          assert int(m.get('total_features',-1))==1100
          assert all(x.get('fake_data') is False for x in (s,c,t,m))
          assert all(x.get('final_ready') is False for x in (s,c,t,m))
          PY
          while read -r p oldsha; do
            newsha="$(git rev-parse origin/$BRANCH:"$p")"
            test "$newsha" = "$oldsha" || { echo "same-slot collision: $p"; exit 1; }
          done < /tmp/base_slot_hashes.txt

          git add "$SHARD" "$MANIFEST" "$RUNNER" "$STATUS" "$CHECKPOINT"
          git rm -f "$WF"
          git commit -m 'data(building_type_5): append East Hertfordshire FHRS batch 1100->1150'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Cleanup temporary workflow on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_5_east_hertfordshire_batch23_20260810.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if [ -f "$WF" ]; then
            git rm -f "$WF"
            git commit -m 'chore(building_type_5): cleanup failed East Hertfordshire batch 23 workflow'
            for attempt in 1 2 3; do
              git fetch origin "$BRANCH"
              if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
          fi
