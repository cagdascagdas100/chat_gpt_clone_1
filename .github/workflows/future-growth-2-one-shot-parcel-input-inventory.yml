name: future-growth-2-one-shot-parcel-input-preflight

on:
  pull_request:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/future-growth-2-one-shot-parcel-input-inventory.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Hash exact tracked read paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/future_growth_2_preflight
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          paths = [
              'england_map_web/data/aays_21_slots/future_growth_2/official_uprn_address_identity_batch_097_20260724.json',
              'england_map_web/data/aays_21_slots/future_growth_2/title_boundary_entity_to_parcel_linkage_input_gate_001_20260804.json',
              'docs/chatgpt_status/_shared/slots_21/future_growth_2/ownership_latest.json',
          ]
          records = []
          for path in paths:
              p = pathlib.Path(path)
              raw = p.read_bytes()
              records.append({
                  'path': path,
                  'git_blob_sha': subprocess.check_output(['git', 'hash-object', path], text=True).strip(),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'size_bytes': len(raw),
              })
          candidate = json.loads(pathlib.Path(paths[0]).read_text(encoding='utf-8'))
          prior = json.loads(pathlib.Path(paths[1]).read_text(encoding='utf-8'))
          ownership = json.loads(pathlib.Path(paths[2]).read_text(encoding='utf-8'))
          expected_rows = [30762, 46142, 61522]
          checks = {
              'candidate_slot_matches': candidate.get('slot_id') == 'future_growth_2',
              'candidate_rows_cumulative_three': candidate.get('candidate_rows_cumulative') == 3,
              'sample_rows_match': [x.get('row_no') for x in candidate.get('sample_candidates', [])] == expected_rows,
              'sample_parcel_ids_match': [x.get('parcel_id') for x in candidate.get('sample_candidates', [])] == [f'parcel_{n}' for n in expected_rows],
              'exact_parcel_bound_rows_zero': candidate.get('exact_parcel_bound_rows') == 0,
              'prior_gate_no_data_continue': prior.get('state') == 'NO_DATA_CONTINUE',
              'prior_gate_prerequisites_verified': prior.get('linkage_prerequisites_verified') is True,
              'partition_matches': ownership.get('parcel_partition') == {'start': 30762, 'end': 61522, 'count': 30761},
              'ownership_unclaimed': ownership.get('owner') is None,
          }
          assert all(checks.values()), checks
          result = {
              'schema_version': 3,
              'architecture_version': 3,
              'workstream_id': 'AAYS_21_SLOT_SAFE_PARALLEL_V1',
              'slot_id': 'future_growth_2',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'github_sha': os.environ['GITHUB_SHA'],
              'records': records,
              'checks': checks,
              'result': 'PASS_9_OF_9',
              'source_rows_persisted': False,
              'geometry_persisted': False,
              'coordinates_persisted': False,
              'fake_data': False,
          }
          raw = (json.dumps(result, sort_keys=True, separators=(',', ':')) + '\n').encode()
          pathlib.Path('/tmp/future_growth_2_preflight/exact_read_path_preflight_receipt.json').write_bytes(raw)
          pathlib.Path('/tmp/future_growth_2_preflight/artifact_receipt.json').write_text(
              json.dumps({
                  'schema_version': 3,
                  'slot_id': 'future_growth_2',
                  'github_run_id': os.environ['GITHUB_RUN_ID'],
                  'preflight_sha256': hashlib.sha256(raw).hexdigest(),
                  'result': 'PASS_9_OF_9',
                  'fake_data': False,
              }, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload exact preflight
        uses: actions/upload-artifact@v4
        with:
          name: future-growth-2-parcel-input-preflight
          path: /tmp/future_growth_2_preflight
          if-no-files-found: error
          retention-days: 1
