name: security_public_safety_2 Wave127 multiscale boundary profile

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/triggers/security-public-safety-2-wave127.trigger'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: security-public-safety-2-wave127-multiscale-boundary-profile
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout canonical work branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run official Wave127 multiscale audit
        env:
          WAVE127_SOURCE_HEAD: e69a994781fbabd98795f3ee520d5a7822c8c0de
        run: |
          python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave127_adaptive_boundary_tomography_20260731.py | tee /tmp/wave127-summary.json

      - name: Validate fail-closed outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          j=root/'england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_multiscale_boundary_profile_wave127_latest.json'
          h=root/'england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_multiscale_boundary_profile_wave127.html'
          m=root/'docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json'
          d=json.loads(j.read_text()); x=json.loads(m.read_text())
          assert d['task_id']=='security_public_safety_2_wave127_multiscale_official_boundary_profile_20260731'
          assert d['continuation_key']=='01227829c45351f8a2fdabc38f0d480ad5b7ee53569c6c8c5361d295ce37190c'
          r=d['result']; q=d['quality_policy']
          assert r['rows_audited']==2 and r['server_side_grid_checks']==2500
          assert r['blocked_rows']==0 and r['blocked_operations']==0
          assert d['sources']['promoted_official_source_families']==5
          assert q['support_only'] and not q['parent_candidate_value_changed']
          assert not q['parent_candidate_accuracy_mutated'] and not q['fake_data']
          assert r['manual_review_open_rows']==x['open_item_count']
          assert h.read_text().count('<tr>')>=104
          assert {z['parcel_id'] for z in d['rows']}=={'parcel_40827','parcel_48739'}
          print(json.dumps(r,indent=2))
          PY

      - name: Publish to moving canonical branch
        run: |
          set -euo pipefail
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_multiscale_boundary_profile_wave127_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_multiscale_boundary_profile_wave127.html \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json
          git commit -m 'security_public_safety_2: publish Wave127 multiscale boundary profile [skip ci]'
          ok=0
          for attempt in 1 2 3 4; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git rebase origin/codex/aays-single-runner-v5-20260706; then
              git rebase --abort || true
              sleep $((attempt*2))
              continue
            fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" = 1

      - name: Remote readback
        run: |
          set -euo pipefail
          branch=codex/aays-single-runner-v5-20260706
          git fetch origin "$branch"
          remote_head=$(git rev-parse "origin/$branch")
          paths=(
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_multiscale_boundary_profile_wave127_latest.json
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_multiscale_boundary_profile_wave127.html
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json
          )
          for p in "${paths[@]}"; do
            git show "origin/$branch:$p" > /tmp/readback
            test "$(sha256sum "$p" | cut -d' ' -f1)" = "$(sha256sum /tmp/readback | cut -d' ' -f1)"
          done
          echo "REMOTE_HEAD=$remote_head"
          cat /tmp/wave127-summary.json
