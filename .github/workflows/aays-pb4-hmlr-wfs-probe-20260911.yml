name: AAYS PB4 HMLR WFS parcel probe 20260911
on:
  push:
    branches:
      - 'agent/aays-pb4-probe-20260911'
    paths:
      - '.github/workflows/aays-pb4-hmlr-wfs-probe-20260911.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch HMLR WFS parcel evidence for PB4 City candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pb4_hmlr_wfs
          python - <<'PY'
          import urllib.request,urllib.parse,urllib.error,hashlib,json,re,os,datetime
          UA='TerraYield-AAYS-ChatGPT/1.0 planned_buildings_4 HMLR WFS probe'
          base='https://inspire.landregistry.gov.uk/inspire/ows'
          candidates=[
            ('890','Bury House',533372.778251398,181210.43902037758),
            ('916','Tenter House',532674.3222401298,181721.07588119278),
            ('930','1 Undershaft',533211.8586843839,181229.9843002155),
            ('1000','65 Fleet Street',531414.1532395639,181097.10882490664),
            ('1003','Hill House',531455.0445204311,181305.12059195375),
            ('3003','30-33 Minories And Writers House',533676.1476452308,181018.94582370337),
            ('3326','London Wall West',532186.7958315362,181601.58139151084),
            ('855','1 Exchange Square',533320.9866386438,181839.67147490956),
            ('864','Hamilton House',531371.4391642303,180856.46313642172),
            ('869','Winchester House',532993.3560453233,181443.45696128832),
          ]
          def get(url,timeout=180):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                d=r.read(); return {'ok':True,'http_status':getattr(r,'status',None),'final_url':r.geturl(),'content_type':r.headers.get('Content-Type'),'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'data':d}
            except urllib.error.HTTPError as e:
              d=e.read(); return {'ok':False,'http_status':e.code,'final_url':getattr(e,'url',url),'content_type':e.headers.get('Content-Type') if e.headers else None,'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'data':d,'error':str(e)}
            except Exception as e:
              return {'ok':False,'http_status':None,'error_type':type(e).__name__,'error':str(e),'bytes':0,'data':b''}
          def save(name,d):
            p='pb4_hmlr_wfs/'+name; open(p,'wb').write(d); return p
          out={'schema':'pb4_hmlr_wfs_probe_v1','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'base':base,'results':[]}
          # WFS versions in descending preference
          for ver in ('2.0.0','1.1.0'):
            u=base+'?'+urllib.parse.urlencode({'service':'WFS','version':ver,'request':'GetCapabilities'})
            r=get(u); d=r.pop('data'); save('GetCapabilities_'+ver.replace('.','_')+'.xml',d)
            out.setdefault('capabilities',[]).append({**r,'url':u,'version':ver,'preview':d.decode('utf-8','replace')[:5000]})
          caps='\n'.join(x['preview'] for x in out['capabilities'])
          names=[]
          names+=re.findall(r'<(?:\\w+:)?Name>([^<]*CadastralParcel[^<]*)</(?:\\w+:)?Name>',caps,re.I)
          names+=re.findall(r'<(?:\\w+:)?Name>([^<]*PD_LR_INDEX_POLY[^<]*)</(?:\\w+:)?Name>',caps,re.I)
          names=list(dict.fromkeys(x.strip() for x in names if x.strip()))
          if not names: names=['inspire:CP.CadastralParcel']
          out['type_names']=names
          for tn in names[:4]:
            for ver in ('2.0.0','1.1.0'):
              k={'service':'WFS','version':ver,'request':'DescribeFeatureType'}
              k['typeNames' if ver=='2.0.0' else 'typeName']=tn
              u=base+'?'+urllib.parse.urlencode(k)
              r=get(u); d=r.pop('data'); save('Describe_'+re.sub(r'[^A-Za-z0-9]+','_',tn)+'_'+ver.replace('.','_')+'.xml',d)
              out.setdefault('describes',[]).append({**r,'url':u,'type_name':tn,'version':ver,'preview':d.decode('utf-8','replace')[:5000]})
          for oid,name,E,N in candidates:
            bbox=(E-90,N-90,E+90,N+90)
            cres={'OBJECTID':oid,'name':name,'E':E,'N':N,'bbox':bbox,'attempts':[],'selected':None}
            for tn in names[:4]:
              for ver in ('2.0.0','1.1.0'):
                for fmt in ('application/json','application/gml+xml; version=3.2','text/xml; subtype=gml/3.2.1'):
                  p={'service':'WFS','version':ver,'request':'GetFeature','srsName':'EPSG:27700','bbox':','.join(f'{v:.3f}' for v in bbox)+',EPSG:27700','outputFormat':fmt}
                  p['typeNames' if ver=='2.0.0' else 'typeName']=tn
                  p['count' if ver=='2.0.0' else 'maxFeatures']='20'
                  u=base+'?'+urllib.parse.urlencode(p)
                  r=get(u); d=r.pop('data'); txt=d.decode('utf-8','replace')
                  fn=f'object_{oid}_{len(cres["attempts"])+1}.'+('json' if 'json' in fmt else 'xml'); path=save(fn,d)
                  pos=re.findall(r'<(?:\\w+:)?posList[^>]*>([^<]+)</(?:\\w+:)?posList>',txt,re.I)
                  lids=re.findall(r'<(?:\\w+:)?localId[^>]*>([^<]+)</(?:\\w+:)?localId>',txt,re.I)
                  ids=re.findall(r'(?:gml:id|fid)="([^"]+)"',txt,re.I)
                  gj_count=None; gj_polys=0; gj_ids=[]
                  if 'json' in fmt and d:
                    try:
                      jj=json.loads(txt); fs=jj.get('features') or []; gj_count=len(fs); gj_polys=sum(1 for f in fs if (f.get('geometry') or {}).get('type') in ('Polygon','MultiPolygon'))
                      for f in fs[:20]:
                        pr=f.get('properties') or {}; gj_ids.append(pr.get('INSPIRE_ID') or pr.get('inspireId') or pr.get('localId') or f.get('id'))
                    except Exception: pass
                  rec={**r,'url':u,'type_name':tn,'version':ver,'output_format':fmt,'raw_path':path,'poslist_count':len(pos),'poslist_samples':pos[:3],'local_ids':lids[:20],'gml_ids':ids[:20],'geojson_feature_count':gj_count,'geojson_polygon_count':gj_polys,'geojson_ids':gj_ids,'preview':txt[:3500]}
                  cres['attempts'].append(rec)
                  if r.get('http_status')==200 and ((gj_polys or 0)>0 or len(pos)>0):
                    cres['selected']=rec; break
                if cres['selected']: break
              if cres['selected']: break
            out['results'].append(cres)
          open('pb4_hmlr_wfs/summary.json','w',encoding='utf-8').write(json.dumps(out,indent=2,ensure_ascii=False))
          inv=[]
          for fn in sorted(os.listdir('pb4_hmlr_wfs')):
            p='pb4_hmlr_wfs/'+fn
            if os.path.isfile(p):
              d=open(p,'rb').read(); inv.append({'path':p,'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest()})
          open('pb4_hmlr_wfs/inventory.json','w').write(json.dumps(inv,indent=2))
          print('TYPE_NAMES',names)
          for r in out['results']:
            s=r['selected'] or {}; print('RESULT',r['OBJECTID'],r['name'],'selected',bool(r['selected']),'http',s.get('http_status'),'pos',s.get('poslist_count'),'geojson_polys',s.get('geojson_polygon_count'),'sha',s.get('sha256'))
          PY
      - name: Upload WFS probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb4-hmlr-wfs-probe
          path: pb4_hmlr_wfs
          if-no-files-found: error
          retention-days: 7
