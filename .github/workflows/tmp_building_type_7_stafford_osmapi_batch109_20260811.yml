name: tmp building_type_7 Stafford OSM API batch 109

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_7_stafford_osmapi_batch109_20260811.yml]

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 unseen Stafford OSM API records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, json
          src=Path('.github/workflows/tmp_building_type_7_worcester_osmapi_batch107_20260811.yml').read_text()
          anchor=src.index('- name: Append exactly 50 unseen Worcester OSM API records')
          marker="          python3 <<'PY'\n"
          start=src.index(marker,anchor)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          replacements=[
            ("CITY='Worcester'","CITY='Stafford'"),
            ("AUTH='Worcestershire'","AUTH='Staffordshire'"),
            ('BATCH=107','BATCH=109'),
            ('BEFORE=5300','BEFORE=5400'),
            ('AFTER=5350','AFTER=5450'),
            ('NEXT_BATCH=108','NEXT_BATCH=110'),
            ('NEXT_TARGET=5400','NEXT_TARGET=5500'),
            ('NEXT_CITY_INDEX=18','NEXT_CITY_INDEX=20'),
            ("GRID='52.185,-2.250,52.215,-2.190'","GRID='52.790,-2.160,52.835,-2.060'"),
          ]
          for old,new in replacements:
            assert old in code, old
            code=code.replace(old,new)
          boxes="BBOXES=[(-2.1400,52.7900,-2.1200,52.8050),(-2.1200,52.7900,-2.1000,52.8050),(-2.1000,52.7900,-2.0800,52.8050),(-2.0800,52.7900,-2.0600,52.8050),(-2.1600,52.7900,-2.1400,52.8050),(-2.1400,52.8050,-2.1200,52.8200),(-2.1200,52.8050,-2.1000,52.8200),(-2.1000,52.8050,-2.0800,52.8200),(-2.0800,52.8050,-2.0600,52.8200),(-2.1600,52.8050,-2.1400,52.8200),(-2.1400,52.8200,-2.1200,52.8350),(-2.1200,52.8200,-2.1000,52.8350),(-2.1000,52.8200,-2.0800,52.8350),(-2.0800,52.8200,-2.0600,52.8350)]"
          code,n=re.subn(r'BBOXES=\[\n.*?\n          \]',boxes,code,count=1,flags=re.S)
          if n!=1:
            code,n=re.subn(r'BBOXES=\[\n.*?\n\]',boxes,code,count=1,flags=re.S)
          assert n==1, 'bbox replacement failed'
          exec(compile(code,'building_type_7_stafford_osmapi_batch109.py','exec'),{})

          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          for p in (cp_path,st_path):
            o=json.loads(p.read_text())
            o['remote_readback_verified']=False
            o['remote_data_commit']=None
            o['remote_head']=None
            o['fake_data']=False
            o['final_ready']=False
            p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          PY
          git checkout -- docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json

      - name: Validate append and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          L=lambda p:json.loads(Path(p).read_text())
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          man=L('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(geo['features'])==5450
          assert man.get('total_features',man.get('feature_count'))==5450
          assert cp['current_feature_count']==5450 and cp['next_batch_index']==110 and cp['next_target_feature_count']==5500
          assert st['current_feature_count']==5450 and st['next_batch_index']==110 and st['next_target_feature_count']==5500
          assert run['batch_index']==109 and run['feature_count_before']==5400 and run['feature_count_after']==5450
          assert task['task_id']=='building-type-7-england-classification-v1-20260808' and task.get('owner') in (None,'')
          ids=set(run.get('new_feature_ids') or run.get('selected_feature_ids') or [])
          assert len(ids)==50
          batch=[f for f in geo['features'] if f.get('id') in ids]
          assert len(batch)==50
          F=[str(f['id']) for f in geo['features']]
          FI=[str((f.get('properties') or {}).get('feature_id')) for f in geo['features'] if (f.get('properties') or {}).get('feature_id')]
          P=[str((f.get('properties') or {}).get('parcel_id')) for f in geo['features'] if (f.get('properties') or {}).get('parcel_id')]
          O=[str((f.get('properties') or {}).get('osm_id')) for f in geo['features'] if (f.get('properties') or {}).get('osm_id')]
          assert len(F)==len(set(F)) and len(FI)==len(set(FI)) and len(P)==len(set(P)) and len(O)==len(set(O))
          for f in batch:
            p=f['properties']
            assert p['area']=='Stafford' and p['local_authority']=='Staffordshire'
            assert p['evidence_level'] in ('B','C') and p['confidence_level_1_to_4'] in (2,3)
            assert p.get('evidence_excerpt') and p.get('source_hash') and p.get('match_method') and p.get('sources')
            assert p['sources'][0].get('evidence_excerpt')
            assert p['fake_data'] is False and p['final_ready'] is False
          assert run.get('already_processed_ids_policy_applied') is True
          assert run.get('raw_source_committed',False) is False and run.get('raw_source_stored_in_git',False) is False
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (man,cp,st,run,task))
          print('VALIDATED Stafford OSM API batch109 5400->5450 +50')
          PY
          git diff --exit-code -- docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json

      - name: Commit and push only building_type_7 outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(england_map_web/data/building_type/shards/building_type_7_latest.geojson england_map_web/data/building_type/shards/building_type_7_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json)
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -vE '^(england_map_web/data/building_type/shards/building_type_7_(latest.geojson|manifest_latest.json)|docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json|docs/chatgpt_status/_shared/slots_21/building_type_7/(status_latest|checkpoint_latest).json)$')"
          git commit -m "data(building_type_7): append Stafford OSM API batch 109 5400->5450"
          echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && break
            [[ $a -lt 5 ]] || exit 1
            sleep $((a*2))
          done

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess
          R='origin/codex/aays-single-runner-v5-20260706'
          L=lambda p:json.loads(subprocess.check_output(['git','show',f'{R}:{p}']))
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(geo['features'])==5450 and cp['current_feature_count']==5450 and cp['next_batch_index']==110 and cp['next_target_feature_count']==5500
          assert run['batch_index']==109 and run['feature_count_before']==5400 and run['feature_count_after']==5450 and task.get('owner') in (None,'')
          ids=set(run.get('new_feature_ids') or run.get('selected_feature_ids') or []); assert len(ids)==50
          batch=[f for f in geo['features'] if f.get('id') in ids]
          assert len(batch)==50 and all(f['properties']['fake_data'] is False and f['properties']['final_ready'] is False and f['properties'].get('evidence_excerpt') for f in batch)
          print('REMOTE_READBACK_OK Stafford 5400->5450')
          PY

      - name: Record remote readback metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          head=os.environ['DATA_COMMIT']
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          cp=json.loads(cp_path.read_text()); st=json.loads(st_path.read_text())
          cp.update({'remote_head':head,'remote_data_commit':head,'remote_readback_verified':True,'updated_at':now,'first_unverified_step_status':'BATCH_109_REMOTE_READBACK_VERIFIED_CONTINUATION_REQUIRED','fake_data':False,'final_ready':False})
          cp.setdefault('summary',{})['note']='PROGRESS: feature_count 5400 -> 5450. Batch 109 Stafford OSM API remote readback verified; continue at batch 110. final_ready remains false.'
          cp.setdefault('summary',{})['current_feature_count']=5450
          cp.setdefault('summary',{})['new_features_added_this_attempt']=50
          cp.setdefault('summary',{})['progress_counted']=True
          cp.setdefault('remaining_items',{})['note']='Next batch 110: treat all 5450 canonical feature.id/feature_id/parcel_id/osm_id values as already_processed_ids and append at least 50 genuinely new West Midlands records; do not replay prior batches.'
          st.update({'remote_head':head,'remote_data_commit':head,'remote_readback_verified':True,'updated_at':now,'fake_data':False,'final_ready':False,'note':'Batch 109 Stafford OSM API: 50 unique evidence-backed features appended; total 5450. Remote readback verified. Continue batch 110.'})
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n'); st_path.write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')
          PY
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
          git commit -m "building_type_7: record Stafford batch 109 remote readback"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && break
            [[ $a -lt 5 ]] || exit 1
            sleep $((a*2))
          done

      - name: Final remote metadata readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess
          R='origin/codex/aays-single-runner-v5-20260706'
          L=lambda p:json.loads(subprocess.check_output(['git','show',f'{R}:{p}']))
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert cp['current_feature_count']==5450 and cp['next_batch_index']==110 and cp['next_target_feature_count']==5500 and cp['remote_readback_verified'] is True
          assert st['current_feature_count']==5450 and st['remote_readback_verified'] is True and task.get('owner') in (None,'')
          assert 'verified' in st.get('note','').lower()
          assert cp['fake_data'] is False and cp['final_ready'] is False and st['fake_data'] is False and st['final_ready'] is False and task['fake_data'] is False and task['final_ready'] is False
          print('FINAL_REMOTE_METADATA_OK building_type_7 Stafford batch109')
          PY
