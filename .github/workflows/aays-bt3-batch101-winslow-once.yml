# registry retrigger for same guarded Batch 101; infrastructure only, not business progress
name: AAYS building_type_3 batch101 Winslow once
on:
  push:
    paths:
      - '.github/workflows/aays-bt3-batch101-winslow-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-3-batch101-winslow
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 50
          clean: false
      - name: Sync branch without reset clean or force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706
      - name: Batch 101 classify and append exactly 50 attempts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, textwrap
          base_path='.github/workflows/aays-bt3-batch90-henley-on-thames-retry1.yml'
          text=open(base_path,encoding='utf-8').read()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",text,re.S)
          if not m:
              raise SystemExit('BASE_RUNNER_BLOCK_NOT_FOUND')
          src=textwrap.dedent(m.group(1))
          # Winslow-centred tile order: settlement core first, then widen.
          lon_order=[-0.88,-0.87,-0.89,-0.86,-0.90,-0.85,-0.91,-0.84,-0.92]
          lat_order=[51.94,51.93,51.95,51.92,51.96,51.91,51.97]
          tiles=[]
          for south in lat_order:
              north=south+0.01
              for west in lon_order:
                  east=west+0.01
                  tiles.append((round(west,4),round(south,4),round(east,4),round(north,4)))
          new_tiles='tiles='+repr(tiles)
          src,n=re.subn(r"tiles=\[[^\n]*\]",new_tiles,src,count=1)
          if n != 1:
              raise SystemExit('TILES_PATCH_FAILED')
          replacements={
              "BATCH=90; CITY='Henley-on-Thames'; GRID='uk-grid-henley-on-thames-central-001'; REGION='South East'; LOCAL_AUTHORITY='Oxfordshire'; TARGET=50; EXPECTED_BEFORE=9200":"BATCH=101; CITY='Winslow'; GRID='uk-grid-winslow-central-001'; REGION='South East'; LOCAL_AUTHORITY='Buckinghamshire'; TARGET=50; EXPECTED_BEFORE=9750",
              "building_type_3 batch90":"building_type_3 batch101",
              "Henley-on-Thames central tiled grid -0.9300,51.5200,-0.8800,51.5600":"Winslow central tiled grid -0.9200,51.9100,-0.8300,51.9800",
              "OpenStreetMap API 0.6 map - Henley-on-Thames Batch 90":"OpenStreetMap API 0.6 map - Winslow Batch 101",
              "'next_city':'Thame','next_grid_id':'uk-grid-thame-central-001'":"'next_city':'Olney','next_grid_id':'uk-grid-olney-central-001'",
              "BATCH90_RESULT":"BATCH101_RESULT",
          }
          for old,new in replacements.items():
              if old not in src:
                  raise SystemExit('PATCH_TOKEN_MISSING '+old[:120])
              src=src.replace(old,new)
          ns={}
          exec(compile(src,'batch101_winslow_runner.py','exec'),ns,ns)
          fallback_reason='GitHub connector omitted the large shard body; Actions runner read the full checked-out shard and built exact processed-ID exclusions.'
          paths=[
              'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json',
              'docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json',
              'docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json',
          ]
          for p in paths:
              obj=json.load(open(p,encoding='utf-8'))
              obj['READ_FALLBACK_USED']=True
              obj['read_fallback_reason']=fallback_reason
              with open(p,'w',encoding='utf-8') as f:
                  json.dump(obj,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
      - name: Guard remote state commit and push explicit slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json > /tmp/remote_cp.json
          python - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json'))
          assert cp.get('continuation_key')=='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e'
          assert cp.get('current_feature_count')==9750, cp.get('current_feature_count')
          assert cp.get('next_batch_index')==101, cp.get('next_batch_index')
          assert cp.get('fake_data') is False
          assert cp.get('final_ready') is False
          PY
          git add -- england_map_web/data/building_type/shards/building_type_3_latest.geojson england_map_web/data/building_type/shards/building_type_3_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json
          if git diff --cached --quiet; then echo 'NO_EVIDENCE_THIS_BATCH: no output changes'; exit 0; fi
          git commit -m 'data(aays): building_type_3 batch101 Winslow'
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          git push origin HEAD:codex/aays-single-runner-v5-20260706
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json > /tmp/cp.json
          git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json > /tmp/r.json
          python - <<'PY'
          import json
          cp=json.load(open('/tmp/cp.json')); r=json.load(open('/tmp/r.json'))
          assert r.get('batch_index')==101
          assert r.get('attempted_parcels')==50
          assert r.get('fake_data') is False and r.get('final_ready') is False
          assert r.get('READ_FALLBACK_USED') is True
          print('REMOTE_READBACK',json.dumps({'before':r.get('feature_count_before'),'attempted':r.get('attempted_parcels'),'added':r.get('added_feature_count'),'after':r.get('feature_count_after'),'confidence':r.get('confidence_level_distribution'),'evidence':r.get('evidence_level_distribution'),'NO_EVIDENCE_THIS_BATCH':r.get('NO_EVIDENCE_THIS_BATCH'),'READ_FALLBACK_USED':r.get('READ_FALLBACK_USED'),'next_batch':cp.get('next_batch_index'),'next_city':cp.get('next_city'),'next_grid':cp.get('next_grid_id')},ensure_ascii=False))
          PY
