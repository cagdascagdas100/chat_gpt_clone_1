name: AAYS building_type_2 next 12 unused bounded windows v13

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-common-v13-next12-20260819.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-common-v8-next12-20260818
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 400
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-2-common-v2-b177-188-20260818.yml
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs
      - name: Select unused windows and execute proven v2 driver
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          from pathlib import Path
          import json

          driver_path=Path('.github/workflows/aays-building-type-2-common-v2-b177-188-20260818.yml')
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          man_path=Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          task_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          geo_path=Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          cp=json.loads(cp_path.read_text(encoding='utf-8'))
          st=json.loads(st_path.read_text(encoding='utf-8'))
          man=json.loads(man_path.read_text(encoding='utf-8'))
          task=json.loads(task_path.read_text(encoding='utf-8'))
          geo=json.loads(geo_path.read_text(encoding='utf-8'))
          start_batch=int(cp['next_batch_index'])
          start_count=len(geo.get('features') or [])
          assert start_batch == 297, (start_batch, 'same-slot cursor moved; refusing replay/overlap')
          assert start_count == 14250, (start_count, 'same-slot count moved; refusing stale start')
          assert cp.get('current_feature_count')==start_count
          assert st.get('total_elements')==start_count
          assert man.get('total_features')==start_count
          assert task.get('owner') in (None,'')
          assert (task.get('continuation_key') or '') == 'building-type-2-england-classification-v1-20260808'

          candidates=[
            ('Eastcote','Hillingdon',[-0.42,51.56,-0.36,51.60]),
            ('Northwood','Hillingdon',[-0.45,51.60,-0.39,51.64]),
            ('Ruislip Gardens','Hillingdon',[-0.44,51.55,-0.38,51.59]),
            ('Harefield','Hillingdon',[-0.50,51.59,-0.44,51.63]),
            ('Harmondsworth','Hillingdon',[-0.50,51.47,-0.44,51.51]),
            ('Cranford','Hounslow',[-0.43,51.46,-0.37,51.50]),
            ('Feltham South','Hounslow',[-0.43,51.43,-0.37,51.47]),
            ('Hampton','Richmond upon Thames',[-0.39,51.40,-0.33,51.44]),
            ('Barnes South','Richmond upon Thames',[-0.25,51.45,-0.19,51.49]),
            ('Richmond East','Richmond upon Thames',[-0.29,51.44,-0.23,51.48]),
            ('Chessington North','Kingston upon Thames',[-0.33,51.36,-0.27,51.40]),
            ('Surbiton South','Kingston upon Thames',[-0.32,51.37,-0.26,51.41]),
            ('New Malden East','Kingston upon Thames',[-0.26,51.38,-0.20,51.42]),
            ('Wallington','Sutton',[-0.17,51.35,-0.11,51.39]),
            ('Belmont','Sutton',[-0.23,51.32,-0.17,51.36]),
            ('Hackbridge','Sutton',[-0.18,51.36,-0.12,51.40]),
            ('Selsdon','Croydon',[-0.08,51.34,-0.02,51.38]),
            ('Shirley','Croydon',[-0.07,51.36,-0.01,51.40]),
            ('Kenley','Croydon',[-0.12,51.30,-0.06,51.34]),
            ('Addiscombe East','Croydon',[-0.08,51.37,-0.02,51.41]),
            ('Biggin Hill','Bromley',[-0.02,51.29,0.04,51.33]),
            ('Hayes Bromley','Bromley',[-0.03,51.36,0.03,51.40]),
            ('Orpington East','Bromley',[0.10,51.36,0.16,51.40]),
            ('Barnehurst','Bexley',[0.14,51.45,0.20,51.49]),
            ('Northumberland Heath','Bexley',[0.15,51.46,0.21,51.50]),
            ('Slade Green','Bexley',[0.17,51.46,0.23,51.50]),
            ('Kidbrooke','Greenwich',[0.01,51.44,0.07,51.48]),
            ('Eltham East','Greenwich',[0.07,51.44,0.13,51.48]),
            ('Blackheath South','Greenwich',[-0.01,51.44,0.05,51.48]),
            ('Hainault','Redbridge',[0.08,51.60,0.14,51.64]),
            ('Woodford Bridge','Redbridge',[0.04,51.59,0.10,51.63]),
            ('Newbury Park','Redbridge',[0.07,51.56,0.13,51.60]),
            ('Harold Wood','Havering',[0.20,51.58,0.26,51.62]),
            ('Collier Row','Havering',[0.15,51.58,0.21,51.62]),
            ('Elm Park','Havering',[0.18,51.53,0.24,51.57]),
            ('Upminster East','Havering',[0.25,51.54,0.31,51.58]),
            ('Chingford North','Waltham Forest',[-0.03,51.63,0.03,51.67]),
            ('Highams Park','Waltham Forest',[-0.04,51.60,0.02,51.64]),
            ('Leyton East','Waltham Forest',[-0.01,51.55,0.05,51.59]),
            ('Cockfosters','Enfield',[-0.16,51.64,-0.10,51.68]),
            ('Enfield Town East','Enfield',[-0.07,51.64,-0.01,51.68]),
            ('Bush Hill Park','Enfield',[-0.10,51.62,-0.04,51.66]),
            ('Mill Hill East','Barnet',[-0.23,51.60,-0.17,51.64]),
            ('Totteridge','Barnet',[-0.23,51.62,-0.17,51.66]),
            ('Whetstone','Barnet',[-0.19,51.61,-0.13,51.65]),
            ('North Harrow','Harrow',[-0.37,51.58,-0.31,51.62]),
            ('South Harrow','Harrow',[-0.37,51.55,-0.31,51.59]),
            ('Wealdstone','Harrow',[-0.34,51.58,-0.28,51.62]),
            ('Northolt','Ealing',[-0.39,51.54,-0.33,51.58]),
            ('Greenford West','Ealing',[-0.38,51.52,-0.32,51.56]),
            ('Southall North','Ealing',[-0.39,51.51,-0.33,51.55]),
            ('Wembley North','Brent',[-0.30,51.57,-0.24,51.61]),
            ('Kingsbury','Brent',[-0.29,51.58,-0.23,51.62]),
            ('Queensbury','Brent',[-0.33,51.58,-0.27,51.62]),
            ('Mitcham South','Merton',[-0.19,51.37,-0.13,51.41]),
            ('Motspur Park','Merton',[-0.26,51.38,-0.20,51.42]),
            ('Beckton North','Newham',[0.04,51.51,0.10,51.55]),
            ('Manor Park East','Newham',[0.04,51.54,0.10,51.58]),
            ('Muswell Hill North','Haringey',[-0.16,51.59,-0.10,51.63]),
            ('Crouch End North','Haringey',[-0.14,51.58,-0.08,51.62]),
          ]
          used_cities=set(str(x).strip().lower() for x in (cp.get('attempted_cities') or []) if x)
          used_bboxes=set()
          for obj in (cp,st):
              for k in ('source_attempt_history','batch_attempt_history','zero_window_attempts'):
                  for rec in obj.get(k) or []:
                      if rec.get('city'): used_cities.add(str(rec['city']).strip().lower())
                      b=rec.get('bbox_wgs84')
                      if isinstance(b,list) and len(b)==4: used_bboxes.add(tuple(float(x) for x in b))
              for k in ('last_bbox_wgs84','last_attempted_bbox_wgs84'):
                  b=obj.get(k)
                  if isinstance(b,list) and len(b)==4: used_bboxes.add(tuple(float(x) for x in b))
              for k in ('last_city','last_attempted_city','last_batch_city'):
                  if obj.get(k): used_cities.add(str(obj[k]).strip().lower())

          selected=[]
          for city,authority,bbox in candidates:
              tb=tuple(float(x) for x in bbox)
              if city.lower() in used_cities or tb in used_bboxes:
                  print('SKIP_USED_WINDOW',city,bbox,flush=True)
                  continue
              selected.append((city,authority,bbox))
              used_cities.add(city.lower()); used_bboxes.add(tb)
              if len(selected)==12: break
          if len(selected)<12:
              raise SystemExit(f'only {len(selected)} unused windows available; refusing replay')
          specs=[(start_batch+i,city,authority,bbox) for i,(city,authority,bbox) in enumerate(selected)]
          print('SELECTED_UNUSED_WINDOWS',json.dumps(specs,ensure_ascii=False),flush=True)

          yml=driver_path.read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          begin=yml.index(marker)+len(marker)
          end=yml.rindex("\n          PY")
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in yml[begin:end].splitlines())+'\n'
          code=code.replace('START_COUNT = 8800',f'START_COUNT = {start_count}',1)
          code=code.replace('START_BATCH = 177',f'START_BATCH = {start_batch}',1)
          a=code.index('SPECS = [')
          b=code.index('ENDPOINTS = [',a)
          code=code[:a]+'SPECS = '+repr(specs)+'\n'+code[b:]
          code=code.replace('next=189',f'next={start_batch+12}')
          compile(code,'<building_type_2-next12-v13>','exec')
          exec(compile(code,'<building_type_2-next12-v13>','exec'),{})
          PY
