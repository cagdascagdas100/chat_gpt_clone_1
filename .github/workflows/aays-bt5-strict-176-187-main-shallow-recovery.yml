name: AAYS BT5 strict 176-187 shallow recovery one-shot
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aays-bt5-strict-176-187-main-shallow-recovery.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-5-strict-main-once-176-187
  cancel-in-progress: true
jobs:
  strict-spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Mark BT5 recovery run started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_main_run_176_187_recovery_status.json';
            let sha;
            try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',source_windows:'176-187',state:'RUNNING',mode:'SHALLOW_CHECKOUT_RECOVERY',run_id:String(context.runId),run_attempt:String(process.env.GITHUB_RUN_ATTEMPT||''),head_sha:context.sha,started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 176-187 shallow recovery started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout trigger payload shallow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: trigger
      - name: Checkout canonical BT5 branch shallow
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Install strict spatial runtime
        run: python -m pip install --quiet requests shapely
      - name: Execute registered BT5 payload once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,re,zlib
          from pathlib import Path
          p=Path('trigger/.github/workflows/aays-bt5-strict-176-187-main-once.yml')
          text=p.read_text(encoding='utf-8')
          m=re.search(r"payload='([^']+)'",text)
          if not m: raise SystemExit('BT5_REGISTERED_PAYLOAD_NOT_FOUND')
          Path('/tmp/run_bt5_176_187.py').write_bytes(zlib.decompress(base64.b64decode(m.group(1))))
          PY
          python /tmp/run_bt5_176_187.py
      - name: Mark BT5 recovery run finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_main_run_176_187_recovery_status.json';
            let sha;
            try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',source_windows:'176-187',state:'${{ job.status }}'.toUpperCase(),mode:'SHALLOW_CHECKOUT_RECOVERY',run_id:String(context.runId),run_attempt:String(process.env.GITHUB_RUN_ATTEMPT||''),head_sha:context.sha,finished_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 176-187 shallow recovery finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
