name: AAYS building_type_9 Pontefract OSM batch44 one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_9_pontefract_batch44_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-9-pontefract-batch44-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new evidence-backed Pontefract OSM features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          from collections import Counter

          SLOT='building_type_9'
          CITY='Pontefract'
          GRID='PONTEFRACT_CENTRAL_01'
          BATCH=44
          EXPECTED_BEFORE=2150
          TARGET_AFTER=2200
          NEXT_TARGET=2250
          CONTINUATION_KEY='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          BASE_URL='https://api.openstreetmap.org/api/0.6/map'
          geo_path=Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          manifest_path=Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          runner_path=Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          status_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          checkpoint_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          task_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json')

          with geo_path.open(encoding='utf-8') as f:
              geo=json.load(f)
          features=geo.get('features',[])
          if len(features) != EXPECTED_BEFORE:
              raise SystemExit(f'fail closed: expected {EXPECTED_BEFORE} features, found {len(features)}')

          processed=set()
          for ft in features:
              for v in (ft.get('id'), (ft.get('properties') or {}).get('parcel_id'), (ft.get('properties') or {}).get('osm_id')):
                  if v is not None:
                      processed.add(str(v))

          # 4 x 3 small API-safe tiles around Pontefract town centre / surrounding urban fabric.
          xs=[-1.3500,-1.3200,-1.2900,-1.2600,-1.2300]
          ys=[53.6750,53.7000,53.7250,53.7500]
          urls=[]
          for yi in range(3):
              for xi in range(4):
                  urls.append(f'{BASE_URL}?bbox={xs[xi]:.4f},{ys[yi]:.4f},{xs[xi+1]:.4f},{ys[yi+1]:.4f}')

          query_sha=hashlib.sha256('\n'.join(urls).encode()).hexdigest()
          raw_parts=[]
          failed=[]
          nodes={}
          ways={}
          for url in urls:
              data=None
              err=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'TerraYield-AAYS-building_type_9/1.0'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          data=r.read()
                      break
                  except Exception as e:
                      err=repr(e)
                      time.sleep(2+attempt*2)
              if data is None:
                  failed.append({'url':url,'error':err})
                  continue
              raw_parts.append(data)
              root=ET.fromstring(data)
              for n in root.findall('node'):
                  try: nodes[n.attrib['id']] = (float(n.attrib['lat']), float(n.attrib['lon']))
                  except Exception: pass
              for w in root.findall('way'):
                  wid=w.attrib.get('id')
                  if not wid: continue
                  tags={t.attrib.get('k'):t.attrib.get('v') for t in w.findall('tag') if t.attrib.get('k')}
                  refs=[nd.attrib.get('ref') for nd in w.findall('nd') if nd.attrib.get('ref')]
                  # Merge duplicate way observations from overlapping tiles.
                  if wid not in ways or len(tags) > len(ways[wid]['tags']):
                      ways[wid]={'tags':tags,'refs':refs}
              time.sleep(1)

          if not raw_parts:
              raise SystemExit('NO_DATA_CONTINUE: all OSM API tiles failed')
          source_sha=hashlib.sha256(b''.join(raw_parts)).hexdigest()

          building_map={
              'detached':('residential_detached','R_DET'),
              'semidetached_house':('residential_semi_detached','R_SEMI'),
              'semi':('residential_semi_detached','R_SEMI'),
              'terrace':('residential_other','R_TERR'),
              'terraced_house':('residential_other','R_TERR'),
              'apartments':('residential_apartments','R_FLAT'),
              'flats':('residential_apartments','R_FLAT'),
              'house':('residential_house','R_DET'),
              'residential':('residential_other','R_OTHER'),
              'bungalow':('residential_detached','R_DET'),
              'industrial':('industrial','I_FACTORY'),
              'warehouse':('warehouse','I_WAREHOUSE'),
              'retail':('commercial_retail','C_RETAIL'),
              'commercial':('commercial_other','C_OTHER'),
              'office':('office','C_OFFICE'),
              'school':('education','P_SCHOOL'),
              'college':('education','P_SCHOOL'),
              'university':('education','P_SCHOOL'),
              'hospital':('hospital_or_healthcare','P_HEALTHCARE'),
              'church':('religious_or_community','P_RELIGIOUS'),
              'chapel':('religious_or_community','P_RELIGIOUS'),
              'mosque':('religious_or_community','P_RELIGIOUS'),
              'synagogue':('religious_or_community','P_RELIGIOUS'),
              'temple':('religious_or_community','P_RELIGIOUS'),
              'hotel':('hotel_or_hospitality','C_HOSPITALITY'),
              'farm':('residential_other','S_AGRICULTURE'),
              'barn':('residential_other','S_AGRICULTURE'),
              'public':('public_infrastructure','P_GOVERNMENT'),
              'government':('public_infrastructure','P_GOVERNMENT'),
              'civic':('public_infrastructure','P_GOVERNMENT'),
              'train_station':('public_infrastructure','P_GOVERNMENT'),
              'garage':('industrial','I_WORKSHOP'),
              'garages':('industrial','I_WORKSHOP')
          }
          amenity_map={
              'school':('education','P_SCHOOL'), 'college':('education','P_SCHOOL'), 'university':('education','P_SCHOOL'),
              'hospital':('hospital_or_healthcare','P_HEALTHCARE'), 'clinic':('hospital_or_healthcare','P_HEALTHCARE'), 'doctors':('hospital_or_healthcare','P_HEALTHCARE'), 'pharmacy':('hospital_or_healthcare','P_HEALTHCARE'),
              'place_of_worship':('religious_or_community','P_RELIGIOUS'), 'community_centre':('religious_or_community','P_RELIGIOUS'),
              'police':('public_infrastructure','P_GOVERNMENT'), 'post_office':('public_infrastructure','P_GOVERNMENT'), 'fire_station':('public_infrastructure','P_GOVERNMENT'), 'townhall':('public_infrastructure','P_GOVERNMENT'),
              'bank':('commercial_retail','C_RETAIL'), 'restaurant':('commercial_retail','C_RETAIL'), 'cafe':('commercial_retail','C_RETAIL'), 'pub':('commercial_retail','C_RETAIL'), 'fast_food':('commercial_retail','C_RETAIL')
          }
          shop_values={'supermarket','convenience','mall','department_store','clothes','hairdresser','car_repair','hardware','bakery','chemist','books','butcher','greengrocer'}

          def classify(tags):
              amen=tags.get('amenity')
              if amen in amenity_map: return (*amenity_map[amen], 'osm_building_plus_amenity_tag')
              if tags.get('tourism') in {'hotel','hostel','guest_house'}: return ('hotel_or_hospitality','C_HOSPITALITY','osm_building_plus_tourism_tag')
              if tags.get('office'): return ('office','C_OFFICE','osm_building_plus_office_tag')
              if tags.get('shop') in shop_values or tags.get('shop') not in (None,'no'):
                  return ('commercial_retail','C_RETAIL','osm_building_plus_shop_tag')
              b=tags.get('building')
              if b in building_map: return (*building_map[b], 'osm_explicit_building_tag')
              return None

          candidates=[]
          for wid, obj in ways.items():
              tags=obj['tags']
              if 'building' not in tags: continue
              c=classify(tags)
              if not c: continue
              fid=f'ENG_OSM_way_{wid}'
              oid=f'way/{wid}'
              if fid in processed or oid in processed or wid in processed: continue
              pts=[nodes[r] for r in obj['refs'] if r in nodes]
              if not pts: continue
              lat=sum(p[0] for p in pts)/len(pts); lon=sum(p[1] for p in pts)/len(pts)
              candidates.append((int(wid),wid,tags,lat,lon,c))

          candidates.sort(key=lambda x:x[0])
          chosen=candidates[:50]
          if len(chosen) < 50:
              raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(chosen)} new classifiable OSM ways found')

          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          records=[]
          new_features=[]
          keep_keys=['building','amenity','shop','office','tourism','name','addr:postcode','addr:street','addr:city']
          for _,wid,tags,lat,lon,c in chosen:
              primary,code,method=c
              fid=f'ENG_OSM_way_{wid}'; oid=f'way/{wid}'
              excerpt_parts=[f'OSM {oid}']
              for k in keep_keys:
                  if tags.get(k): excerpt_parts.append(f'{k}={tags[k]}')
              excerpt=' | '.join(excerpt_parts)
              src={
                  'source_name':'OpenStreetMap API 0.6',
                  'url_or_local_path':f'https://www.openstreetmap.org/way/{wid}',
                  'sha256':source_sha,
                  'licence':'ODbL 1.0',
                  'granularity':'building_way_center',
                  'fields_used':[k for k in ['building','amenity','shop','office','tourism'] if tags.get(k)],
                  'supports_field':'building_type_primary',
                  'match_method':method,
                  'evidence_excerpt':{k:tags[k] for k in keep_keys if tags.get(k)}
              }
              props={
                  'slot_id':SLOT,
                  'parcel_id':fid,
                  'osm_id':oid,
                  'building_type_primary':primary,
                  'building_type_code':code,
                  'source':'OpenStreetMap API 0.6',
                  'source_url':f'https://www.openstreetmap.org/way/{wid}',
                  'source_hash':source_sha,
                  'query_sha256':query_sha,
                  'sources':[src],
                  'source_count':1,
                  'evidence_excerpt':excerpt,
                  'evidence_level':'B',
                  'confidence_score':0.85,
                  'confidence_level_1_to_4':3,
                  'match_method':method,
                  'city':CITY,
                  'grid_id':GRID,
                  'fake_data':False,
                  'final_ready':False
              }
              ft={'type':'Feature','id':fid,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props}
              new_features.append(ft)
              records.append({
                  'id':fid,'parcel_id':fid,'osm_id':oid,'building_type_primary':primary,
                  'source':'OpenStreetMap API 0.6','source_url':f'https://www.openstreetmap.org/way/{wid}',
                  'source_hash':source_sha,'query_sha256':query_sha,'sources':[src],
                  'evidence_excerpt':excerpt,'evidence_level':'B','confidence_level_1_to_4':3,'match_method':method
              })

          geo['features'].extend(new_features)
          if len(geo['features']) != TARGET_AFTER:
              raise SystemExit('feature_count_after invariant failed')
          ids=[]
          for ft in geo['features']:
              ids.append(str(ft.get('id')))
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate feature.id detected after append')
          geo_path.write_text(json.dumps(geo,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          geo_sha=hashlib.sha256(geo_path.read_bytes()).hexdigest()

          def distributions(fs):
              t=Counter(); e=Counter(); conf=Counter(); unknown=0
              for ft in fs:
                  p=ft.get('properties') or {}
                  typ=p.get('building_type_primary','unknown') or 'unknown'; t[typ]+=1
                  ev=p.get('evidence_level','U') or 'U'; e[str(ev)]+=1
                  cl=p.get('confidence_level_1_to_4',1); conf[str(cl)]+=1
                  if typ=='unknown' or ev=='U': unknown+=1
              return t,e,conf,unknown
          tdist,edist,cdist,unknown=distributions(geo['features'])
          classified=TARGET_AFTER-unknown

          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update({
              'generated_at':now,'total_features':TARGET_AFTER,'classified':classified,'unknown':unknown,
              'type_distribution':dict(sorted(tdist.items())),'evidence_distribution':dict(sorted(edist.items())),
              'confidence_level_distribution':dict(sorted(cdist.items())), 'fake_data':False,'final_ready':False,
              'note':f'Existing {EXPECTED_BEFORE}-feature shard preserved; appended 50 Pontefract OSM API records outside feature.id/parcel_id/osm_id already_processed_ids.',
              'feature_count':TARGET_AFTER,'geojson_sha256':geo_sha,'manifest_updated_at':now,
              'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,'added_feature_count':50,
              'last_batch_city':CITY,'last_batch_source':'OpenStreetMap API 0.6 map endpoint',
              'last_batch_source_sha256':source_sha,'last_batch_query_sha256':query_sha,'last_batch_grid':GRID
          })
          sources=manifest.setdefault('sources',[])
          sources.append({
              'name':'OpenStreetMap API 0.6 - Pontefract batch 44','url':BASE_URL,'license':'ODbL 1.0','features_used':50,
              'accessed_at':now,'source_sha256':source_sha,'source_hash_method':'sha256_concatenated_successful_osm_xml_tiles',
              'query_sha256':query_sha,'query_urls':urls,'failed_tile_count':len(failed),'grid_id':GRID,
              'note':'50 new evidence-backed semantic building records from runtime-only OSM XML tiles; no raw source committed.'
          })
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          new_ids=[r['id'] for r in records]
          runner={
              'slot_id':SLOT,'continuation_key':CONTINUATION_KEY,'batch_index':BATCH,'city':CITY,'grid_id':GRID,'generated_at':now,
              'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,'added_feature_count':50,'progress':True,
              'already_processed_id_basis':['feature.id','properties.parcel_id','properties.osm_id'],
              'already_processed_id_count_before':len(processed),'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE_URL,
              'source_urls':urls,'source_sha256':source_sha,'query_sha256':query_sha,'failed_tile_count':len(failed),
              'evidence_level_new_features':{'B':50},'confidence_level_new_features':{'3':50},
              'new_feature_ids':new_ids,'records':records,'fake_data':False,'final_ready':False
          }
          runner_path.write_text(json.dumps(runner,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          checkpoint=json.loads(checkpoint_path.read_text(encoding='utf-8'))
          checkpoint.update({
              'hydration_state':'REMOTE_HEAD_HYDRATED_FIRST_UNVERIFIED_PRESERVED',
              'first_unverified_step':'AŞAMA_1_OSM_GENISLETME_APPEND_NEW_BATCH_THEN_OPTIONAL_EPC_VOA_HMLR_UPGRADE',
              'first_unverified_step_status':'BATCH_044_APPENDED_50_PONTEFRACT_OSM_FEATURES_CONTINUATION_REQUIRED',
              'updated_at':now,'final_ready':False,'state':'IN_PROGRESS','feature_count_before':EXPECTED_BEFORE,
              'feature_count_after':TARGET_AFTER,'current_feature_count':TARGET_AFTER,'next_batch_index':45,
              'next_target_feature_count':NEXT_TARGET,'next_city_index':45,
              'last_processed_ids_sample':new_ids[-20:],
              'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION',
              'fake_data':False,
              'last_batch':{
                  'batch_index':BATCH,'city':CITY,'grid_id':GRID,'source':'OpenStreetMap API 0.6 map endpoint','source_url':BASE_URL,
                  'source_sha256':source_sha,'query_sha256':query_sha,'evidence_level':'B','confidence_level_1_to_4':3,
                  'added_feature_count':50,'new_feature_ids':new_ids
              }
          })
          checkpoint.setdefault('summary',{})['new_features_appended']=checkpoint.get('summary',{}).get('new_features_appended',1950)+50
          checkpoint_path.write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          status=json.loads(status_path.read_text(encoding='utf-8'))
          status.update({
              'state':'IN_PROGRESS','updated_at':now,'final_ready':False,'classified_count':classified,'unknown_count':unknown,
              'total_elements':TARGET_AFTER,'confidence_distribution':dict(sorted(cdist.items())),
              'evidence_distribution':dict(sorted(edist.items())),'output_sha256':geo_sha,
              'note':'Batch 44 appended 50 new Pontefract OSM API evidence-backed building features; no fake rows.',
              'fake_data':False,'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,
              'current_feature_count':TARGET_AFTER,'next_batch_index':45,'next_target_feature_count':NEXT_TARGET,
              'last_batch_city':CITY,'last_batch_grid':GRID,'last_batch_source_sha256':source_sha,'last_batch_query_sha256':query_sha,
              'owner_claim_created':False,'progress':True
          })
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          task=json.loads(task_path.read_text(encoding='utf-8'))
          task.update({
              'state':'READY','status':'ready','panel_status':'HAZIR','updated_at':now,'continuation_key':CONTINUATION_KEY,
              'first_unverified_step':'APPEND_NEW_BATCH_045_AFTER_FEATURE_2200','claimable':True,'ready_for_claim':True,
              'owner':None,'blocker':None,'fake_data':False,'final_ready':False
          })
          task['progress']={'completed_count':TARGET_AFTER,'target_count':NEXT_TARGET,'previous_percent':97.7273,'current_percent':97.7778,'percent_increase':0.0505}
          task_path.write_text(json.dumps(task,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Final local invariants.
          reread=json.loads(geo_path.read_text(encoding='utf-8'))
          assert len(reread['features'])==TARGET_AFTER
          assert all((f.get('properties') or {}).get('fake_data') is False for f in new_features)
          assert all((f.get('properties') or {}).get('final_ready') is False for f in new_features)
          print(json.dumps({'result':'SUCCESS_PONTEFRACT_BATCH_44','before':EXPECTED_BEFORE,'after':TARGET_AFTER,'added':50,'source_sha256':source_sha,'query_sha256':query_sha,'failed_tiles':len(failed),'new_ids':new_ids},indent=2))
          PY

      - name: Commit and push only building_type_9 outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          SELF='.github/workflows/tmp_building_type_9_pontefract_batch44_20260810.yml'
          OWNED=(
            'england_map_web/data/building_type/shards/building_type_9_latest.geojson'
            'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'
            'docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'
          )
          BASE="$(git rev-parse HEAD)"
          git config user.name 'AAYS building_type_9 continuation'
          git config user.email 'aays-building-type-9@local.invalid'
          rm -f "$SELF"
          git add "${OWNED[@]}" "$SELF"
          git diff --cached --quiet && { echo 'No staged progress'; exit 1; }
          git commit -m 'building_type_9: append Pontefract OSM batch 44'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            REMOTE="$(git rev-parse "origin/$BRANCH")"
            CHANGED="$(git diff --name-only "$BASE..$REMOTE" -- "${OWNED[@]}" || true)"
            if [ -n "$CHANGED" ]; then
              echo 'Same-slot files changed remotely after batch started; fail closed:'
              echo "$CHANGED"
              exit 1
            fi
            if [ "$(git rev-parse HEAD^)" != "$REMOTE" ]; then
              git rebase "origin/$BRANCH"
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Push failed after 3 guarded attempts'
          exit 1
