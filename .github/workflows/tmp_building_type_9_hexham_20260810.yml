name: tmp building_type_9 Hexham batch 35

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_9_hexham_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-9-continuation
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'run guarded building_type_9 Hexham batch 35')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 unseen evidence-backed Hexham buildings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-slot-runner'
          git config user.email 'aays-slot-runner@users.noreply.github.com'
          BRANCH='codex/aays-single-runner-v5-20260706'
          BASE_REF='26f4437047e47328b233a506c4c9b9394379717b'
          BASE_WF='.github/workflows/tmp_building_type_9_north_shields_20260810.yml'
          git fetch origin "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          git show "$BASE_REF:$BASE_WF" > /tmp/base.yml
          python3 - <<'PY'
          import pathlib, textwrap
          text=pathlib.Path('/tmp/base.yml').read_text(encoding='utf-8')
          start="          cat > /tmp/run.py <<'PY'\n"
          end="          PY\n          python3 /tmp/run.py\n"
          assert start in text and end in text
          block=textwrap.dedent(text.split(start,1)[1].split(end,1)[0])

          old_bboxes="""BBOXES=[
              '-1.5500,55.0000,-1.5200,55.0250','-1.5200,55.0000,-1.4900,55.0250',
              '-1.4900,55.0000,-1.4600,55.0250','-1.4600,55.0000,-1.4300,55.0250',
              '-1.5500,55.0250,-1.5200,55.0500','-1.5200,55.0250,-1.4900,55.0500',
              '-1.4900,55.0250,-1.4600,55.0500','-1.4600,55.0250,-1.4300,55.0500',
              '-1.5500,55.0500,-1.5200,55.0750','-1.5200,55.0500,-1.4900,55.0750',
              '-1.4900,55.0500,-1.4600,55.0750','-1.4600,55.0500,-1.4300,55.0750']"""
          new_bboxes="""BBOXES=[
              '-2.1500,54.9500,-2.1200,54.9750','-2.1200,54.9500,-2.0900,54.9750',
              '-2.0900,54.9500,-2.0600,54.9750','-2.0600,54.9500,-2.0300,54.9750',
              '-2.1500,54.9750,-2.1200,55.0000','-2.1200,54.9750,-2.0900,55.0000',
              '-2.0900,54.9750,-2.0600,55.0000','-2.0600,54.9750,-2.0300,55.0000',
              '-2.1500,55.0000,-2.1200,55.0250','-2.1200,55.0000,-2.0900,55.0250',
              '-2.0900,55.0000,-2.0600,55.0250','-2.0600,55.0000,-2.0300,55.0250']"""
          assert old_bboxes in block
          block=block.replace(old_bboxes,new_bboxes)
          block=block.replace("BEFORE=1550; TARGET=1600; BATCH=32","BEFORE=1700; TARGET=1750; BATCH=35")
          block=block.replace("CITY='North Shields'; GRID='NORTH_SHIELDS_CENTRAL_01'; AUTH='North Tyneside'","CITY='Hexham'; GRID='HEXHAM_CENTRAL_01'; AUTH='Northumberland'")
          block=block.replace('North Shields','Hexham').replace('north shields','hexham').replace('NORTH_SHIELDS','HEXHAM')
          block=block.replace('batch 32','batch 35').replace('Batch 32','Batch 35').replace('batch32','batch35')
          block=block.replace('BATCH_032','BATCH_035')
          block=block.replace('Existing 1550-feature','Existing 1700-feature')
          block=block.replace("'next_batch_index':33,'next_target_feature_count':1650","'next_batch_index':36,'next_target_feature_count':1800")
          block=block.replace("'next_city_index':33","'next_city_index':36")
          assert 'North Shields' not in block and 'north shields' not in block.lower() and 'NORTH_SHIELDS' not in block
          assert "BEFORE=1700; TARGET=1750; BATCH=35" in block
          assert "'next_batch_index':36,'next_target_feature_count':1800" in block
          assert "'next_city_index':36" in block
          pathlib.Path('/tmp/run.py').write_text(block,encoding='utf-8')
          PY
          python3 /tmp/run.py

      - name: Guard remote state, self-delete, commit and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_hexham_20260810.yml'
          GEO='england_map_web/data/building_type/shards/building_type_9_latest.geojson'
          MAN='england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'
          RUN='docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json'
          STA='docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'
          CP='docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'
          CT='docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'
          git fetch origin "$BRANCH"
          git show "origin/$BRANCH:$CP" > /tmp/remote_cp.json
          git show "origin/$BRANCH:$CT" > /tmp/remote_ct.json
          python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json')); t=json.load(open('/tmp/remote_ct.json'))
          assert cp.get('current_feature_count')==1700 and cp.get('next_batch_index')==35 and cp.get('next_target_feature_count')==1750
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          PY
          rm -f "$WF"
          git add "$GEO" "$MAN" "$RUN" "$STA" "$CP" "$WF"
          git commit -m 'building_type_9: append batch 35 Hexham OSM API features'
          ok=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:$CP" > /tmp/remote_cp_retry.json
            python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp_retry.json'))
          assert cp.get('current_feature_count')==1700 and cp.get('next_batch_index')==35, 'same-slot remote state advanced; abort rebase'
          PY
            git rebase "origin/$BRANCH"
          done
          test "$ok" = 1

      - name: Verify remote slot9 readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          for item in \
            'england_map_web/data/building_type/shards/building_type_9_latest.geojson:/tmp/g.json' \
            'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json:/tmp/m.json' \
            'docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json:/tmp/r.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json:/tmp/s.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json:/tmp/c.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json:/tmp/t.json'; do
            src="${item%%:*}"; dst="${item#*:}"; git show "origin/$BRANCH:$src" > "$dst"
          done
          python3 - <<'PY'
          import json
          g=json.load(open('/tmp/g.json')); m=json.load(open('/tmp/m.json')); r=json.load(open('/tmp/r.json')); s=json.load(open('/tmp/s.json')); c=json.load(open('/tmp/c.json')); t=json.load(open('/tmp/t.json'))
          assert len(g['features'])==1750
          assert c['feature_count_before']==1700 and c['feature_count_after']==1750 and c['current_feature_count']==1750 and c['next_batch_index']==36 and c['next_target_feature_count']==1800
          assert c['last_batch']['city']=='Hexham' and c['last_batch']['added_feature_count']==50
          assert m['total_features']==1750 and s['total_elements']==1750 and r['feature_count_after']==1750 and len(r['records'])==50
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          assert all(x.get('fake_data') is False for x in (m,r,s,c)) and all(x.get('final_ready') is not True for x in (m,s,c))
          print('REMOTE_READBACK_OK building_type_9 1700->1750 Hexham batch35')
          PY
