name: tmp building_type_7 Cannock Chase batch 21

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_cannock_chase_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git rev-parse HEAD > /tmp/building_type_7_base_head.txt

      - name: Discover Cannock Chase FHRS source and cache runtime files only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 \
            --output /tmp/fsa_open_data.html \
            https://ratings.food.gov.uk/open-data
          python - <<'PY'
          import html as htmlmod
          import pathlib
          import re
          from urllib.parse import urljoin, urlparse

          authority = "Cannock Chase"
          source_page = "https://ratings.food.gov.uk/open-data"
          raw = pathlib.Path("/tmp/fsa_open_data.html").read_text(encoding="utf-8", errors="replace")
          candidates = []
          rows = re.findall(r"<tr\b.*?</tr>", raw, flags=re.I | re.S)
          for row in rows:
              plain = htmlmod.unescape(re.sub(r"<[^>]+>", " ", row))
              plain = re.sub(r"\s+", " ", plain).strip()
              if not re.search(r"\bCannock\s+Chase\b", plain, flags=re.I):
                  continue
              for href in re.findall(r"href\s*=\s*[\"']([^\"']+)[\"']", row, flags=re.I):
                  href = htmlmod.unescape(href)
                  if "open-data-files" in href and ".xml" in href.lower():
                      candidates.append(urljoin(source_page, href))
          if not candidates:
              for m in re.finditer(r"href\s*=\s*[\"']([^\"']*open-data-files/[^\"']+\.xml[^\"']*)[\"']", raw, flags=re.I):
                  context = raw[max(0, m.start()-700):m.end()+700]
                  plain = htmlmod.unescape(re.sub(r"<[^>]+>", " ", context))
                  if re.search(r"\bCannock\s+Chase\b", plain, flags=re.I):
                      candidates.append(urljoin(source_page, htmlmod.unescape(m.group(1))))
          candidates = list(dict.fromkeys(candidates))
          candidates = [u for u in candidates if "en-GB.xml" in u]
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one Cannock Chase English XML source, got {candidates}")
          source_url = candidates[0]
          parsed = urlparse(source_url)
          if parsed.scheme != "https" or parsed.netloc != "ratings.food.gov.uk" or "/api/open-data-files/" not in parsed.path or not parsed.path.lower().endswith(".xml"):
              raise SystemExit(f"unexpected source URL: {source_url}")
          pathlib.Path("/tmp/cannock_chase_source_url.txt").write_text(source_url + "\n", encoding="utf-8")
          print(source_url)
          PY
          SOURCE_URL="$(cat /tmp/cannock_chase_source_url.txt)"
          curl --fail --location --retry 2 --retry-delay 2 \
            --output /tmp/cannock_chase_fhrs.xml \
            "$SOURCE_URL"
          test -s /tmp/cannock_chase_fhrs.xml

      - name: Append exactly 50 new Cannock Chase proxy features
        shell: bash
        run: |
          set -euo pipefail
          git show 4649e2d9305591ebcc0ccddf23caa51872d20948:.github/workflows/tmp_building_type_7_lichfield_20260810.yml > /tmp/lichfield_template.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/lichfield_template.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('historical Lichfield template append python block not found')
          start += len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          replacements = [
              ('CITY = "Lichfield"', 'CITY = "Cannock Chase"'),
              ('PREFIX = "LICH"', 'PREFIX = "CANN"'),
              ('SOURCE = "Food Standards Agency FHRS daily open data - Lichfield"', 'SOURCE = "Food Standards Agency FHRS daily open data - Cannock Chase"'),
              ('/tmp/lichfield_source_url.txt', '/tmp/cannock_chase_source_url.txt'),
              ('/tmp/lichfield_fhrs.xml', '/tmp/cannock_chase_fhrs.xml'),
              ('EXPECTED_BEFORE = 950', 'EXPECTED_BEFORE = 1000'),
              ('EXPECTED_BATCH = 20', 'EXPECTED_BATCH = 21'),
              ('EXPECTED_TARGET = 1000', 'EXPECTED_TARGET = 1050'),
              ('LICHFIELD', 'CANNOCK_CHASE'),
              ('Lichfield', 'Cannock Chase'),
          ]
          for old, new in replacements:
              if old not in body:
                  raise SystemExit(f'missing expected template token: {old}')
              body = body.replace(old, new)
          required = [
              'CITY = "Cannock Chase"',
              'PREFIX = "CANN"',
              'EXPECTED_BEFORE = 1000',
              'EXPECTED_BATCH = 21',
              'EXPECTED_TARGET = 1050',
              '/tmp/cannock_chase_source_url.txt',
              '/tmp/cannock_chase_fhrs.xml',
              'for value in (f.get("id"), p.get("feature_id"), p.get("parcel_id"), p.get("osm_id")):',
              'evidence_excerpt',
              'evidence_level',
              'confidence_level_1_to_4',
              'fake_data',
              'final_ready',
          ]
          missing = [token for token in required if token not in body]
          assert not missing, f"patched body missing required tokens: {missing}"
          assert 'Lichfield' not in body and 'LICHFIELD' not in body and '/tmp/lichfield_' not in body
          exec(compile(body, '<cannock_chase_append>', 'exec'), {'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          shard = json.loads(Path('england_map_web/data/building_type/shards/building_type_7_latest.geojson').read_text(encoding='utf-8'))
          manifest = json.loads(Path('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json').read_text(encoding='utf-8'))
          runner = json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json').read_text(encoding='utf-8'))
          status = json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json').read_text(encoding='utf-8'))
          checkpoint = json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json').read_text(encoding='utf-8'))
          task = json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json').read_text(encoding='utf-8'))
          source_url = Path('/tmp/cannock_chase_source_url.txt').read_text(encoding='utf-8').strip()

          assert len(shard['features']) == 1050
          assert manifest['feature_count_before'] == 1000 and manifest['feature_count_after'] == 1050 and manifest['added_feature_count'] == 50
          assert checkpoint['feature_count_before'] == 1000 and checkpoint['feature_count_after'] == 1050 and checkpoint['current_feature_count'] == 1050
          assert checkpoint['next_batch_index'] == 22 and checkpoint['next_target_feature_count'] == 1100
          assert runner['feature_count_before'] == 1000 and runner['feature_count_after'] == 1050 and runner['added_feature_count'] == 50
          assert status['feature_count_before'] == 1000 and status['feature_count_after'] == 1050 and status['current_feature_count'] == 1050
          assert task['task_id'] == 'building-type-7-england-classification-v1-20260808'
          assert task['slot_id'] == 'building_type_7'
          assert task['owner'] is None and task['fake_data'] is False and task['final_ready'] is False
          assert manifest['fake_data'] is False and manifest['final_ready'] is False
          assert checkpoint['fake_data'] is False and checkpoint['final_ready'] is False
          assert runner['city'] == 'Cannock Chase'
          assert runner['source_url'] == source_url
          assert len(runner['selected_feature_ids']) == 50

          batch = [f for f in shard['features'] if str(f.get('id') or '').startswith('CANN_FHRS_')]
          assert len(batch) == 50, len(batch)
          seen_ids = set()
          seen_parcels = set()
          for f in batch:
              p = f.get('properties') or {}
              assert f['id'] not in seen_ids; seen_ids.add(f['id'])
              assert p.get('parcel_id') not in seen_parcels; seen_parcels.add(p.get('parcel_id'))
              assert p.get('source_url') == source_url
              assert p.get('source_hash')
              assert p.get('evidence_excerpt')
              assert p.get('evidence_level') == 'D'
              assert p.get('confidence_level_1_to_4') == 2
              assert p.get('fake_data') is False
              assert p.get('final_ready') is False
          print('validated Cannock Chase 1000->1050; 50 new D/confidence-2 features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            england_map_web/data/building_type/shards/building_type_7_latest.geojson
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          )
          git add -- "${files[@]}"
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "data(building_type_7): append Cannock Chase FHRS batch 1000->1050"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge-base --is-ancestor origin/codex/aays-single-runner-v5-20260706 HEAD; then
              git rebase origin/codex/aays-single-runner-v5-20260706
            fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then pushed=1; break; fi
          done
          test "$pushed" -eq 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'
          def load(path):
              return json.loads(subprocess.check_output(['git','show',f'{ref}:{path}']))
          shard=load('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(shard['features']) == 1050
          assert manifest['feature_count_after'] == 1050 and manifest['added_feature_count'] == 50
          assert checkpoint['current_feature_count'] == 1050 and checkpoint['next_batch_index'] == 22 and checkpoint['next_target_feature_count'] == 1100
          assert runner['city'] == 'Cannock Chase' and len(runner['selected_feature_ids']) == 50
          assert task['owner'] is None and task['fake_data'] is False and task['final_ready'] is False
          print('remote readback verified: building_type_7=1050')
          PY
