name: security-public-safety-2-wave67-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave67_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture wave67 run state
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          cmd = ['gh','run','list','--repo','cagdascagdas100/chat_gpt_clone_1','--workflow','security-public-safety-2-wave67-incremental','--limit','3','--json','databaseId,status,conclusion,createdAt,startedAt,updatedAt,event,headSha,url,workflowName,attempt']
          proc = subprocess.run(cmd, text=True, capture_output=True)
          try:
              runs = json.loads(proc.stdout or '[]')
          except json.JSONDecodeError:
              runs = []
          payload = {
              'schema_version': 1,
              'slot_id': 'security_public_safety_2',
              'task_id': 'security_public_safety_2_priority_9340row_incremental_evidence_expansion_20260730',
              'continuation_key': '59c4b6dbebae2bf0eee3519971bd13a80fa414fe0c12f84c81804ba650b089fe',
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'returncode': proc.returncode,
              'stderr': proc.stderr,
              'runs': runs,
          }
          path = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave67_run_state_20260730.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave67_run_state_20260730.json
          git commit -m 'record security_public_safety_2 wave67 run state'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
