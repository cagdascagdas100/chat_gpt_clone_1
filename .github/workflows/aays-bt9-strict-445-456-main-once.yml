name: AAYS BT9 strict 445-456 main one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt9-strict-445-456-main-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-9-strict-main-once-445-456
  cancel-in-progress: true
jobs:
  strict-spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Mark run started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_9/actions_main_run_445_456_status.json';
            async function write(body,message) {
              for (let i=0;i<5;i++) {
                let sha;
                try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
                try {
                  await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message,content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
                  return;
                } catch(e) {
                  if(e.status!==409 || i===4) throw e;
                  await new Promise(r=>setTimeout(r,1000*(i+1)));
                }
              }
            }
            await write({slot_id:'building_type_9',batches:'445-456',state:'RUNNING',run_id:String(context.runId),run_attempt:String(process.env.GITHUB_RUN_ATTEMPT||''),head_sha:context.sha,started_at:new Date().toISOString()},'aays: mark BT9 445-456 run started');
      - name: Checkout verified BT9 executor
        uses: actions/checkout@v4
        with:
          ref: agent/aays-bt9-strict-12-20260818-0441
          fetch-depth: 0
          path: trigger
      - name: Checkout canonical slot branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          path: canonical
      - name: Install strict spatial runtime
        run: python -m pip install --quiet requests shapely
      - name: Execute BT9 445-456 with guarded continuation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('trigger/docs/chatgpt_status/_shared/slots_21/building_type_9/automation/run_strict_229_240_20260818.py')
          s=src.read_text(encoding='utf-8')
          repl=[
            ('START=229','START=445'),
            ('NEXT=241','NEXT=457'),
            ('BEFORE=7945','BEFORE=12618'),
            ("('W=[]; bi=181','W=[]; bi=229')","('W=[]; bi=181','W=[]; bi=445')"),
            ("('if start!=181:','if start!=229:')","('if start!=181:','if start!=445:')"),
            ("('if len(fs)!=7200:','if len(fs)!=7945:')","('if len(fs)!=7200:','if len(fs)!=12618:')"),
            ("(\"'start_batch_index':181\",\"'start_batch_index':229\")","(\"'start_batch_index':181\",\"'start_batch_index':445\")"),
            ("(\"'next_batch_index':181\",\"'next_batch_index':229\")","(\"'next_batch_index':181\",\"'next_batch_index':445\")"),
            ("(\"rep['next_batch_index']=193\",\"rep['next_batch_index']=241\")","(\"rep['next_batch_index']=193\",\"rep['next_batch_index']=457\")"),
            ("(\"cp['next_batch_index']=193\",\"cp['next_batch_index']=241\")","(\"cp['next_batch_index']=193\",\"cp['next_batch_index']=457\")"),
            ("(\"st['next_batch_index']=193\",\"st['next_batch_index']=241\")","(\"st['next_batch_index']=193\",\"st['next_batch_index']=457\")"),
            ("(\"task['next_batch_index']=193\",\"task['next_batch_index']=241\")","(\"task['next_batch_index']=193\",\"task['next_batch_index']=457\")"),
            ("('BATCH_193_STRICT_SPATIAL_BINDING_SOURCE_BYTES','BATCH_241_STRICT_SPATIAL_BINDING_SOURCE_BYTES')","('BATCH_193_STRICT_SPATIAL_BINDING_SOURCE_BYTES','BATCH_457_STRICT_SPATIAL_BINDING_SOURCE_BYTES')"),
            ("('Continue from batch 193','Continue from batch 241')","('Continue from batch 193','Continue from batch 457')"),
            ("('Batches 181-192 processed','Batches 229-240 processed')","('Batches 181-192 processed','Batches 445-456 processed')"),
            ("(\"'next_batch':193\",\"'next_batch':241\")","(\"'next_batch':193\",\"'next_batch':457\")"),
            ("Path('/tmp/bt9_229_240.py')","Path('/tmp/bt9_445_456.py')"),
            ('strict bounded batches 229-240','strict bounded batches 445-456'),
            ('remote readback 229-240','remote readback 445-456'),
          ]
          for a,b in repl:
              if a not in s:
                  raise SystemExit('ADAPTER_TOKEN_MISSING:'+a)
              s=s.replace(a,b)
          anchor="      ('for y in (575000,580000,585000):','for y in (635000,640000,645000):'),"
          if anchor not in s:
              raise SystemExit('WINDOW_ANCHOR_MISSING')
          replacement="      ('for y in (575000,580000,585000):','for y in (530000,535000,540000):'),\n      ('for x in (380000,385000,390000,395000):','for x in (380000,385000,390000,395000):'),"
          s=s.replace(anchor,replacement)
          out=Path('/tmp/run_strict_445_456_20260818.py')
          out.write_text(s,encoding='utf-8')
          print('ADAPTED_EXECUTOR',out)
          PY
          python /tmp/run_strict_445_456_20260818.py
      - name: Mark run finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_9/actions_main_run_445_456_status.json';
            async function write(body,message) {
              for (let i=0;i<5;i++) {
                let sha;
                try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
                try {
                  await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message,content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
                  return;
                } catch(e) {
                  if(e.status!==409 || i===4) throw e;
                  await new Promise(r=>setTimeout(r,1000*(i+1)));
                }
              }
            }
            await write({slot_id:'building_type_9',batches:'445-456',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),run_attempt:String(process.env.GITHUB_RUN_ATTEMPT||''),head_sha:context.sha,finished_at:new Date().toISOString()},'aays: mark BT9 445-456 run finished');
