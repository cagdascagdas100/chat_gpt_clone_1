name: security-public-safety-2-wave66-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave66_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture wave66 run
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          sleep 20
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          command = ['gh','run','list','--workflow','security_public_safety_2_wave66_incremental.yml','--branch',os.environ['BRANCH'],'--limit','5','--json','databaseId,status,conclusion,createdAt,startedAt,updatedAt,event,headSha,url,workflowName,attempt']
          result = subprocess.run(command, capture_output=True, text=True)
          payload = {
            'schema_version': 1,
            'slot_id': 'security_public_safety_2',
            'task_id': 'security_public_safety_2_priority_8920row_incremental_evidence_expansion_20260730',
            'continuation_key': '69f728dd60d78e4dcb321426efb22f729f30419590faf5a11ac89ded61332c37',
            'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'returncode': result.returncode,
            'stderr': result.stderr,
            'runs': json.loads(result.stdout or '[]'),
          }
          path='docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave66_run_status_20260730.json'
          open(path,'w').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave66_run_status_20260730.json
          git commit -m 'record security_public_safety_2 wave66 run status'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
