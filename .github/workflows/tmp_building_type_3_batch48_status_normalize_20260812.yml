name: tmp building_type_3 batch48 status normalize

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_3_batch48_status_normalize_20260812.yml]

permissions:
  contents: write

concurrency:
  group: building-type-3-continuation
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Normalize status helper fields
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          MSG='chore(building_type_3): normalize batch 48 status metadata'
          git pull --ff-only origin "$BRANCH"
          python3 <<'PY'
          import json, pathlib
          p=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json')
          o=json.loads(p.read_text(encoding='utf-8'))
          if o.get('current_feature_count') != 7150 or o.get('feature_count_after') != 7150 or o.get('last_batch_index') != 48:
              raise SystemExit('status moved; refusing normalization')
          if o.get('task_id') != 'building-type-3-england-classification-v1-20260808':
              raise SystemExit('task moved')
          if o.get('continuation_key') != '03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e':
              raise SystemExit('continuation moved')
          if o.get('owner') not in (None,'') or o.get('fake_data') is not False or o.get('final_ready') is not False:
              raise SystemExit('safety guard changed')
          s=o.get('summary') or {}
          s.update({'current_feature_count':7150,'new_features_added_this_attempt':50,'progress_counted':True})
          o['summary']=s
          p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'aays-building-type-3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json
          git diff --cached --quiet && { echo 'Already normalized'; exit 0; }
          git commit -m "$MSG"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            if ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo 'dirty worktree; refusing rebase'; git status --short; exit 1
              fi
              git rebase "origin/$BRANCH"
            fi
            if git push origin HEAD:"$BRANCH"; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test -n "$REMOTE_HEAD"
          git fetch origin "$REMOTE_HEAD"
          ACTUAL=$(git log "$REMOTE_HEAD" --format='%H%x09%s' --max-count=80 | awk -F '\t' -v m="$MSG" '$2==m {print $1; exit}')
          test -n "$ACTUAL"
          git merge-base --is-ancestor "$ACTUAL" "$REMOTE_HEAD"
          echo "REMOTE_READBACK_OK commit=$ACTUAL remote_head=$REMOTE_HEAD"
