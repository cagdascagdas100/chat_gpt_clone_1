name: AAYS HF probe readonly

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aays-hf-probe-readonly.yml'
      - 'tools/aays_hf_proxy_probe.ps1'
      - 'tools/aays_region_asset_gate.ps1'
      - 'england_map_web/app.js'
      - 'england_map_web/config/regions.local.json'

permissions:
  contents: read

jobs:
  probe:
    name: Read-only HF PMTiles probe
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run read-only HF probe
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ".\tools\aays_hf_proxy_probe.ps1" -Repo "$env:GITHUB_WORKSPACE"

      - name: Validate JSON outputs
        shell: pwsh
        run: |
          Get-Content ".\docs\chatgpt_status\runner_outputs\latest_output.json" -Raw | ConvertFrom-Json | Out-Null
          Get-Content ".\docs\chatgpt_status\runner_outputs\aays-hf-proxy-probe-latest.json" -Raw | ConvertFrom-Json | Out-Null
          Write-Host "json_parse=PASS"
          Write-Host "secret_values_printed=false"

      - name: Git diff check
        shell: pwsh
        run: git diff --check

      - name: Upload probe outputs
        uses: actions/upload-artifact@v4
        with:
          name: aays-hf-probe-readonly-outputs
          path: |
            docs/chatgpt_status/runner_outputs/latest_output.json
            docs/chatgpt_status/runner_outputs/latest_output.txt
            docs/chatgpt_status/runner_outputs/aays-hf-proxy-probe-latest.json
            docs/chatgpt_status/runner_outputs/aays-hf-proxy-probe-latest.txt
            docs/chatgpt_status/runner_outputs/aays-hf-proxy-plan-latest.md
