name: security_public_safety_2 Wave138 postcode package assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/aays-triggers/security_public_safety_2_wave138.trigger.json

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave138
  cancel-in-progress: false

jobs:
  publish-official-postcode-package-assets:
    if: github.head_ref == 'audit/security-public-safety-2-wave138-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests pyshp shapely pyproj

      - name: Verify runner syntax
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.py

      - name: Create exact READY queue task
        env:
          AAYS_SOURCE_HEAD: 0121118970256ed4de2a5917d4eacc968c3645a8
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          workstream = 'AAYS_21_SLOT_SAFE_PARALLEL_V1'
          slot = 'security_public_safety_2'
          branch = 'codex/aays-single-runner-v5-20260706'
          step = 'WAVE138_SINGLE_OPEN_ROW_OFFICIAL_POSTCODE_PACKAGE_ASSETS_AND_EXACT_ROW_BINDING'
          source_head = os.environ['AAYS_SOURCE_HEAD']
          continuation = hashlib.sha256(f'{workstream}|{slot}|{branch}|{step}|{source_head}'.encode()).hexdigest()
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          path = Path('docs/chatgpt_status/aays1/queue/0151_security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.v3.task.json')
          payload = {
            'schema_version': 3,
            'workstream_id': workstream,
            'slot_id': slot,
            'task_id': 'security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801',
            'attempt_id': 'attempt-001',
            'continuation_key': continuation,
            'previous_continuation_key': '11a58a332f8498a21787d35bd8bfcaa3af8cd39830270e31c15bfbd007f9015e',
            'source_head': source_head,
            'canonical_branch': branch,
            'first_unverified_step': step,
            'state': 'READY',
            'owner': None,
            'blocker': None,
            'created_at': now,
            'updated_at': now,
            'resource_class': 'NETWORK_IO_CPU_BOUNDED',
            'maximum_simultaneous_workers': 15,
            'maximum_simultaneous_downloads': 4,
            'timeout_minutes': 60,
            'read_paths': [
              'england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_lsoa_crosswalk_primary_binding_wave137_latest.json',
              'docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json',
              'docs/chatgpt_status/aays1/automation/security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.py'
            ],
            'exact_write_paths': [
              'england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138_latest.json',
              'england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138.html',
              'docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_status_latest.json',
              'docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_evidence_latest.json',
              'docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json',
              str(path)
            ],
            'acceptance_conditions': [
              'At least eight official ONS portal searches execute',
              'At least one official postcode candidate item and package asset are inspected',
              'Package downloads are bounded to four workers, 64 MiB per asset and 256 MiB total',
              'CSV/ZIP manifests, headers, exact-code rows and provenance results are published line by line',
              'Postcode proximity alone cannot promote the row',
              'Promotion requires an exact non-derived primary source binding and multi-release official expected-pair agreement',
              'Canonical push and remote readback succeed'
            ],
            'fake_data_allowed': False,
            'second_runner_created': False,
            'second_task_created': False
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          print(continuation)
          PY

      - name: Publish READY queue checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          queue=docs/chatgpt_status/aays1/queue/0151_security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.v3.task.json
          git add "$queue"
          git commit -m 'security_public_safety_2: queue Wave138 READY'
          published=false
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              published=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Run official internet postcode package audit
        env:
          AAYS_SOURCE_HEAD: 0121118970256ed4de2a5917d4eacc968c3645a8
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.py

      - name: Strict fail-closed validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138_latest.json')
          website = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138.html')
          status = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_status_latest.json')
          evidence = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_evidence_latest.json')
          queue = Path('docs/chatgpt_status/aays1/queue/0151_security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.v3.task.json')
          manual = Path('docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json')
          for path in (output, website, status, evidence, queue, manual):
              assert path.exists() and path.stat().st_size > 0, path
          data = json.loads(output.read_text())
          result = data['result']
          q = json.loads(queue.read_text())
          assert data['fake_data'] is False
          assert data['scope']['maximum_simultaneous_workers'] == 15
          assert data['scope']['maximum_simultaneous_downloads'] == 4
          assert data['continuation_key'] == q['continuation_key']
          assert result['official_portal_searches'] >= 8
          assert result['official_portal_search_successes'] >= 1
          assert result['official_unique_candidate_items'] >= 1
          assert result['official_items_inspected'] >= 1
          assert result['official_asset_candidates'] >= 1
          assert result['official_package_download_attempts'] >= 1
          assert result['completed_or_fail_closed_operations'] == result['total_operations']
          assert result['blocked_operations'] == 0
          assert result['stuck_pending_operations'] == 0
          assert q['state'] == 'COMPLETED_PUBLISHED'
          assert 'Operation ledger' in website.read_text()
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit and publish canonical outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_evidence_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0151_security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.v3.task.json
          git commit -m 'security_public_safety_2: publish Wave138 postcode package assets'
          published=false
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              published=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Remote canonical readback
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          remote_head=$(git rev-parse origin/codex/aays-single-runner-v5-20260706)
          for path in \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_package_assets_exact_row_binding_wave138.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave138_evidence_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0151_security_public_safety_2_wave138_official_postcode_package_assets_exact_row_binding_20260801.v3.task.json; do
            local_sha=$(sha256sum "$path" | cut -d' ' -f1)
            remote_sha=$(git show "origin/codex/aays-single-runner-v5-20260706:$path" | sha256sum | cut -d' ' -f1)
            test "$local_sha" = "$remote_sha"
            echo "REMOTE_READBACK $path $remote_sha"
          done
          echo "CANONICAL_REMOTE_HEAD=$remote_head"
