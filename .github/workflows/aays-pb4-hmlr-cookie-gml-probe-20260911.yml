name: AAYS PB4 HMLR cookie-aware GML probe 20260911
on:
  push:
    branches:
      - agent/aays-pb4-probe-20260911
    paths:
      - '.github/workflows/aays-pb4-hmlr-cookie-gml-probe-20260911.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and unpack public City of London INSPIRE parcel ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pb4_hmlr_cookie_gml
          python - <<'PY'
          import requests, hashlib, json, os, datetime, zipfile, io
          OUT='pb4_hmlr_cookie_gml'
          UA='Mozilla/5.0 TerraYield-AAYS-ChatGPT/1.0 planned_buildings_4 public evidence'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept':'*/*'})
          page='https://use-land-property-data.service.gov.uk/datasets/inspire/download'
          url='https://use-land-property-data.service.gov.uk/datasets/inspire/download/City_of_London_Corporation.zip'
          out={'schema':'pb4_hmlr_cookie_gml_probe_v2','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'page_url':page,'download_url':url}
          rp=s.get(page,allow_redirects=True,timeout=120); pb=rp.content
          open(OUT+'/index.raw.html','wb').write(pb)
          out['index']={'status':rp.status_code,'final_url':rp.url,'bytes':len(pb),'sha256':hashlib.sha256(pb).hexdigest(),'cookies':s.cookies.get_dict()}
          r=s.get(url,allow_redirects=True,timeout=180); b=r.content
          out['download']={'status':r.status_code,'final_url':r.url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':r.headers.get('content-type'),'cookies':s.cookies.get_dict()}
          if r.status_code!=200 or not b.startswith(b'PK'):
              out['error']='EXPECTED_ZIP_NOT_RECEIVED'
          else:
              open(OUT+'/City_of_London_Corporation.raw.zip','wb').write(b)
              z=zipfile.ZipFile(io.BytesIO(b)); out['members']=[]
              for zi in z.infolist():
                  if zi.is_dir(): continue
                  bb=z.read(zi.filename); safe=os.path.basename(zi.filename)
                  if not safe: continue
                  path=OUT+'/'+safe; open(path,'wb').write(bb)
                  out['members'].append({'original_name':zi.filename,'path':safe,'bytes':len(bb),'sha256':hashlib.sha256(bb).hexdigest()})
              gml=[x for x in out['members'] if x['path'].lower().endswith(('.gml','.xml'))]
              out['gml_members']=gml
          open(OUT+'/summary.json','w',encoding='utf-8').write(json.dumps(out,indent=2,ensure_ascii=False))
          inv=[]
          for fn in sorted(os.listdir(OUT)):
              p=OUT+'/'+fn
              if os.path.isfile(p):
                  bb=open(p,'rb').read(); inv.append({'path':p,'bytes':len(bb),'sha256':hashlib.sha256(bb).hexdigest()})
          open(OUT+'/inventory.json','w').write(json.dumps(inv,indent=2))
          print(json.dumps(out,indent=2,ensure_ascii=False)[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pb4-hmlr-cookie-gml
          path: pb4_hmlr_cookie_gml
          if-no-files-found: error
          retention-days: 7
