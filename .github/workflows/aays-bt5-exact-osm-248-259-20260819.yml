            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 248-259 started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout canonical
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Configure runtime
        shell: bash
        run: |
          set -euo pipefail
          git -C canonical config user.name 'AAYS building_type_5'
          git -C canonical config user.email 'aays-building-type-5@users.noreply.github.com'
          python -m pip install --quiet requests
          git -C canonical fetch --deepen=4000 origin codex/aays-single-runner-v5-20260706 || true
      - name: Execute exact OSM windows 248-259
        shell: bash
        env:
          CANONICAL_BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          set -euo pipefail
          cat > /tmp/bt5_248_259.py <<'PY'
