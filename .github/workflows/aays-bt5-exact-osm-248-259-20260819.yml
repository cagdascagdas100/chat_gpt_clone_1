name: AAYS BT5 exact OSM 248-259 20260819
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-exact-osm-248-259-20260819.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-5-exact-248-259
  cancel-in-progress: true
jobs:
  exact-osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
