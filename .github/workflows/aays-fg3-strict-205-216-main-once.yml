name: AAYS FG3 strict 205-216 main one-shot
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aays-fg3-strict-205-216-main-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-future-growth-3-strict-205-216
  cancel-in-progress: false
jobs:
  strict-source-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Mark run started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/future_growth_3/actions_main_run_205_216_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'future_growth_3',state:'RUNNING',run_id:String(context.runId),head_sha:context.sha,started_at:new Date().toISOString(),canonical_branch:'codex/aays-single-runner-v5-20260706'};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark FG3 205-216 started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout FG3 executor
        uses: actions/checkout@v4
        with:
          ref: agent/aays-fg3-b205-216-strict-spatial-20260819-0107
          fetch-depth: 0
          path: trigger
      - name: Checkout canonical slot branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          path: canonical
          persist-credentials: true
      - name: Install spatial runtime
        run: python -m pip install --disable-pip-version-check --quiet shapely==2.1.1
      - name: Execute FG3 strict 205-216 with per-batch readback
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          python ../trigger/tools/aays_fg3_205_216_strict.py
      - name: Mark run finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/future_growth_3/actions_main_run_205_216_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'future_growth_3',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),head_sha:context.sha,finished_at:new Date().toISOString(),canonical_branch:'codex/aays-single-runner-v5-20260706'};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark FG3 205-216 finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
