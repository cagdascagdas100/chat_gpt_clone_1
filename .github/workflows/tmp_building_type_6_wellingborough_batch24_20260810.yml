name: AAYS building_type_6 Wellingborough OSM batch 24

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_6_wellingborough_batch24_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-6-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: codex/aays-single-runner-v5-20260706
      SLOT_ID: building_type_6
      CONTINUATION_KEY: c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a
      SHARD: england_map_web/data/building_type/shards/building_type_6_latest.geojson
      MANIFEST: england_map_web/data/building_type/shards/building_type_6_manifest_latest.json
      STATUS: docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json
      CHECKPOINT: docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json
      CURRENT_TASK: docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json
      RUNNER_OUTPUT: docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json
      TEMPLATE: .github/workflows/tmp_building_type_6_corby_batch23_20260810.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward safely to canonical branch
        shell: bash
        run: |
          set -euo pipefail
          START_SHA='${{ github.sha }}'
          git fetch origin "$BRANCH"
          REMOTE_SHA="$(git rev-parse origin/$BRANCH)"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            CHANGED="$(git diff --name-only "$START_SHA..$REMOTE_SHA")"
            for p in "$SHARD" "$MANIFEST" "$STATUS" "$CHECKPOINT" "$CURRENT_TASK" "$RUNNER_OUTPUT"; do
              if printf '%s\n' "$CHANGED" | grep -Fxq "$p"; then
                echo "Fail closed: building_type_6 state changed after trigger: $p"
                exit 41
              fi
            done
            git merge --ff-only "origin/$BRANCH"
          fi
          echo "SAFE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Append 250 evidence-backed Wellingborough OSM records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          p=pathlib.Path('.github/workflows/tmp_building_type_6_corby_batch23_20260810.yml')
          text=p.read_text(encoding='utf-8')
          marker="          import collections, datetime, hashlib, json, os, pathlib, urllib.parse, urllib.request"
          start=text.index(marker)
          end=text.index("\n          PY", start)
          block=text[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          replacements={
            "CITY='Corby'":"CITY='Wellingborough'",
            "GRID='uk-grid-corby-001'":"GRID='uk-grid-wellingborough-001'",
            "BBOX=[-0.77,52.44,-0.64,52.53]":"BBOX=[-0.75,52.27,-0.62,52.35]",
            "BATCH=23":"BATCH=24",
            "EXPECTED_BEFORE=1500":"EXPECTED_BEFORE=1750",
            "PREFIX='CORBY_OSM'":"PREFIX='WELLINGBOROUGH_OSM'",
            "corby_north_northamptonshire_source_sha256":"wellingborough_north_northamptonshire_source_sha256",
            "SUCCESS_CORBY_BATCH_23":"SUCCESS_WELLINGBOROUGH_BATCH_24",
            "Corby grid":"Wellingborough grid"
          }
          for old,new in replacements.items():
            if old not in code:
              raise SystemExit(f'Fail closed: template marker missing: {old}')
            code=code.replace(old,new)
          exec(compile(code,'wellingborough_batch24_from_verified_corby_template.py','exec'),{})
          PY

      - name: Verify safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          def load(p):
            with open(p,'r',encoding='utf-8') as f: return json.load(f)
          g=load(os.environ['SHARD']); s=load(os.environ['STATUS']); c=load(os.environ['CHECKPOINT']); t=load(os.environ['CURRENT_TASK']); r=load(os.environ['RUNNER_OUTPUT']); m=load(os.environ['MANIFEST'])
          assert len(g.get('features',[])) == 2000
          assert r.get('feature_count_before') == 1750 and r.get('feature_count_after') == 2000 and r.get('new_feature_count') == 250
          assert r.get('city') == 'Wellingborough' and r.get('batch_index') == 24
          assert s.get('total_elements') == 2000 and c.get('current_feature_count') == 2000
          assert s.get('owner') in (None,'') and t.get('owner') in (None,'')
          assert s.get('continuation_key') == os.environ['CONTINUATION_KEY'] == c.get('continuation_key') == t.get('continuation_key')
          assert s.get('fake_data') is False and c.get('fake_data') is False and t.get('fake_data') is False and m.get('fake_data') is False and r.get('fake_data') is False
          assert s.get('final_ready') is False and c.get('final_ready') is False and t.get('final_ready') is False and m.get('final_ready') is False
          for rec in r.get('records',[]):
            assert rec.get('evidence_excerpt')
            assert rec.get('evidence_level') in ('A','B','C','D','U')
            assert rec.get('confidence_level_1_to_4') in (1,2,3,4)
            assert rec.get('source_url') and rec.get('source_hash')
            assert rec.get('fake_data') is False
          assert len(r.get('records',[])) == 250
          ids=set()
          for f in g.get('features',[]):
            props=f.get('properties') or {}
            for v in (f.get('id'),props.get('parcel_id'),props.get('osm_id')):
              if v in (None,''): continue
              key=str(v)
              if key in ids:
                raise AssertionError(f'duplicate already_processed id: {key}')
              ids.add(key)
          print('verified',len(g['features']),len(r['records']))
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AAYS building_type_6 continuation'
          git config user.email 'aays-building-type-6@local.invalid'
          git add "$SHARD" "$MANIFEST" "$STATUS" "$CHECKPOINT" "$CURRENT_TASK" "$RUNNER_OUTPUT"
          git diff --cached --quiet && { echo 'No progress: no slot output changes'; exit 50; }
          git commit -m 'building_type_6: append Wellingborough OSM batch 24 (+250)'
          git fetch origin "$BRANCH"
          REMOTE_SHA="$(git rev-parse origin/$BRANCH)"
          if [ "$REMOTE_SHA" != "$SAFE_BASE" ]; then
            CHANGED="$(git diff --name-only "$SAFE_BASE..$REMOTE_SHA")"
            for p in "$SHARD" "$MANIFEST" "$STATUS" "$CHECKPOINT" "$CURRENT_TASK" "$RUNNER_OUTPUT"; do
              if printf '%s\n' "$CHANGED" | grep -Fxq "$p"; then
                echo "Fail closed before push: concurrent building_type_6 change: $p"
                exit 51
              fi
            done
            git rebase "origin/$BRANCH"
          fi
          git push origin "HEAD:$BRANCH"
