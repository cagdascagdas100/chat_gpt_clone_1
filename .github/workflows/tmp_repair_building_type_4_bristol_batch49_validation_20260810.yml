name: Repair building_type_4 Bristol batch49 validation

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_repair_building_type_4_bristol_batch49_validation_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-4-slot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Guard and repair existing batch49 workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json').read_text())
          sta=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json').read_text())
          assert cp.get('current_feature_count')==2400 and cp.get('next_batch_index')==49 and cp.get('next_target_feature_count')==2450
          assert cp.get('blocker') in (None,'') and cp.get('fake_data') is False and cp.get('final_ready') is False
          assert sta.get('owner') is None and sta.get('current_feature_count')==2400 and sta.get('fake_data') is False and sta.get('final_ready') is False
          assert task.get('task_id')=='building-type-4-england-classification-v1-20260808' and task.get('owner') is None

          p=Path('.github/workflows/tmp_building_type_4_bristol_osm_batch49_20260810.yml')
          text=p.read_text(encoding='utf-8')
          old="""          ids=[]; pids=[]; oids=[]
          for f in geo['features']:
              p=f.get('properties') or {}; ids.append(str(f.get('id'))); pids.append(str(p.get('parcel_id'))); oids.append(str(p.get('osm_id')))
          assert len(ids)==len(set(ids)); assert len(pids)==len(set(pids)); assert len(oids)==len(set(oids))
"""
          new="""          ids=[str(x.get('id')) for x in geo['features'] if x.get('id') not in (None,'')]
          pids=[str((x.get('properties') or {}).get('parcel_id')) for x in geo['features'] if (x.get('properties') or {}).get('parcel_id') not in (None,'')]
          oids=[str((x.get('properties') or {}).get('osm_id')) for x in geo['features'] if (x.get('properties') or {}).get('osm_id') not in (None,'')]
          assert len(ids)==len(set(ids)); assert len(pids)==len(set(pids)); assert len(oids)==len(set(oids))
"""
          assert old in text, 'expected faulty validation block not found; fail closed'
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp_building_type_4_bristol_osm_batch49_20260810.yml
          git rm .github/workflows/tmp_repair_building_type_4_bristol_batch49_validation_20260810.yml
          git commit -m 'ci(building_type_4): fix Bristol batch49 validation filter'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin codex/aays-single-runner-v5-20260706
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
