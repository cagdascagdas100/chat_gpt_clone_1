name: tmp building_type_7 Walsall batch

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_walsall_20260810.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 Walsall FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import hashlib
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          slot_id = "building_type_7"
          expected_before = 250
          expected_target = 300
          source_name = "Food Standards Agency FHRS daily open data - Walsall"
          source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS433en-GB.xml"
          city = "Walsall"
          prefix = "WSL"

          shard_path = Path("england_map_web/data/building_type/shards/building_type_7_latest.geojson")
          manifest_path = Path("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json")
          checkpoint_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json")
          status_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json")
          task_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json")
          runner_path = Path("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json")

          shard = json.loads(shard_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))
          features = shard.get("features", [])
          before = len(features)

          assert task.get("slot_id") == slot_id, "wrong slot"
          assert task.get("task_id") == "building-type-7-england-classification-v1-20260808", "task changed"
          assert task.get("owner") is None, "current_task owner is not null; refusing second owner/task"
          assert before == expected_before, f"stale shard count {before} != {expected_before}"
          assert int(checkpoint.get("current_feature_count", -1)) == before, "checkpoint/shard count mismatch"
          assert int(checkpoint.get("next_target_feature_count", -1)) == expected_target, "target changed"
          assert manifest.get("fake_data") is False and checkpoint.get("fake_data") is False and status.get("fake_data") is False, "fake_data guard"
          assert manifest.get("final_ready") is False and checkpoint.get("final_ready") is False and status.get("final_ready") is False, "final_ready guard"

          processed = set()
          for f in features:
              p = f.get("properties") or {}
              for value in (f.get("id"), p.get("parcel_id"), p.get("osm_id"), p.get("feature_id")):
                  if value is not None and str(value).strip():
                      processed.add(str(value).strip())

          req = urllib.request.Request(source_url, headers={"User-Agent": "AAYS-building-type/1.0"})
          with urllib.request.urlopen(req, timeout=90) as resp:
              raw = resp.read()
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def text(el, wanted):
              for child in el.iter():
                  if local(child.tag) == wanted:
                      return (child.text or "").strip()
              return ""

          def classify(bt):
              b = bt.strip().lower()
              if "school" in b or "college" in b or "university" in b:
                  return "education", "P_EDUCATION", "institutional"
              if "hospital" in b or "caring" in b or "childcare" in b:
                  return "healthcare_care", "P_HEALTHCARE", "institutional"
              if "hotel" in b or "bed & breakfast" in b or "guest house" in b:
                  return "hospitality", "C_HOTEL", "commercial"
              if "pub" in b or "bar" in b or "nightclub" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "restaurant" in b or "cafe" in b or "canteen" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "takeaway" in b or "sandwich" in b:
                  return "commercial_hospitality", "C_TAKEAWAY", "commercial"
              if "retailer" in b or "supermarket" in b or "hypermarket" in b:
                  return "commercial_retail", "C_RETAIL", "commercial"
              if "distributor" in b or "transporter" in b:
                  return "warehouse", "C_LOGISTICS", "commercial"
              if "manufacturer" in b or "packer" in b:
                  return "industrial", "I_MANUFACTURING", "industrial"
              return "commercial_other", "C_OTHER", "commercial"

          candidates = []
          for el in root.iter():
              if local(el.tag) != "EstablishmentDetail":
                  continue
              fhrsid = text(el, "FHRSID")
              if not fhrsid:
                  continue
              feature_id = f"{prefix}_FHRS_{fhrsid}"
              parcel_id = f"{prefix}_FHRSID_{fhrsid}"
              if feature_id in processed or parcel_id in processed or fhrsid in processed:
                  continue
              la = text(el, "LocalAuthorityName")
              if la and "walsall" not in la.lower():
                  continue
              business_type = text(el, "BusinessType")
              if "mobile caterer" in business_type.lower():
                  continue
              try:
                  lat = float(text(el, "Latitude"))
                  lon = float(text(el, "Longitude"))
              except (TypeError, ValueError):
                  continue
              if not (49.0 <= lat <= 61.0 and -9.0 <= lon <= 3.0):
                  continue
              candidates.append((int(fhrsid) if fhrsid.isdigit() else 10**18, fhrsid, el, lat, lon))

          candidates.sort(key=lambda x: (x[0], x[1]))
          assert len(candidates) >= 50, f"only {len(candidates)} eligible Walsall FHRS candidates"

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          new_features = []
          new_ids = []
          records = []
          for _, fhrsid, el, lat, lon in candidates[:50]:
              feature_id = f"{prefix}_FHRS_{fhrsid}"
              parcel_id = f"{prefix}_FHRSID_{fhrsid}"
              business_name = text(el, "BusinessName")
              business_type = text(el, "BusinessType")
              business_type_id = text(el, "BusinessTypeID")
              labid = text(el, "LocalAuthorityBusinessID")
              la = text(el, "LocalAuthorityName") or city
              postcode = text(el, "PostCode")
              rating = text(el, "RatingValue")
              rating_date = text(el, "RatingDate")
              primary, code, category = classify(business_type)
              excerpt = f"FHRSID {fhrsid} | {business_name} | BusinessType {business_type} | LocalAuthority {la} | PostCode {postcode}"
              props = {
                  "parcel_id": parcel_id,
                  "parcel_id_semantics": "stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": None,
                  "slot_id": slot_id,
                  "region": "West Midlands",
                  "area": city,
                  "local_authority": la,
                  "postcode": postcode,
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": 0.55,
                  "confidence_level_1_to_4": 2,
                  "evidence_level": "D",
                  "source_count": 1,
                  "source": source_name,
                  "source_url": source_url,
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "match_method": "fhrs_business_type_premises_proxy",
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": hashlib.sha256(excerpt.encode("utf-8")).hexdigest(),
                  "source_evidence_excerpt": {
                      "FHRSID": fhrsid,
                      "BusinessName": business_name,
                      "BusinessType": business_type,
                      "BusinessTypeID": business_type_id,
                      "LocalAuthorityBusinessID": labid,
                      "LocalAuthorityName": la,
                      "PostCode": postcode,
                      "RatingValue": rating,
                      "RatingDate": rating_date
                  },
                  "sources": [{
                      "source_name": "Food Standards Agency FHRS daily open data",
                      "url_or_local_path": source_url,
                      "accessed_at": now,
                      "sha256": source_sha,
                      "sha256_scope": "raw_source_xml",
                      "granularity": "food_business_establishment",
                      "fields_used": ["FHRSID", "BusinessName", "BusinessType", "BusinessTypeID", "LocalAuthorityBusinessID", "LocalAuthorityName", "PostCode", "Latitude", "Longitude"],
                      "supports_field": "building_type_primary",
                      "match_method": "fhrs_business_type_premises_proxy",
                      "match_score": 0.55
                  }],
                  "geometry_match_method": "fhrs_geocode_point",
                  "address_match_method": "fhrs_business_address",
                  "limitations": "FHRS business type is a premises-use proxy and does not prove cadastral parcel identity or exact building fabric/type.",
                  "needs_manual_review": True,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": now,
                  "feature_id": feature_id
              }
              feat = {"type": "Feature", "id": feature_id, "geometry": {"type": "Point", "coordinates": [lon, lat]}, "properties": props}
              new_features.append(feat)
              new_ids.append(feature_id)
              records.append({**props, "geometry": feat["geometry"]})

          assert len(new_features) == 50
          assert len(set(new_ids)) == 50
          assert not (set(new_ids) & processed), "feature.id collision"
          for feat in new_features:
              p = feat["properties"]
              assert str(p["parcel_id"]) not in processed, "parcel_id collision"
              assert p["fake_data"] is False and p["final_ready"] is False
              assert p["evidence_excerpt"] and p["evidence_level"] == "D"
              assert p["confidence_level_1_to_4"] == 2

          shard["features"] = features + new_features
          after = len(shard["features"])
          assert after == before + 50 and after > before
          shard_path.write_text(json.dumps(shard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          output_sha = hashlib.sha256(shard_path.read_bytes()).hexdigest()

          props_all = [(f.get("properties") or {}) for f in shard["features"]]
          ev = Counter(str(p.get("evidence_level") or "U") for p in props_all)
          conf = Counter(str(p.get("confidence_level_1_to_4") or 1) for p in props_all)
          types = Counter(str(p.get("building_type_primary") or "unknown") for p in props_all)
          unknown = types.get("unknown", 0)
          classified = after - unknown

          source_entry = {
              "name": source_name,
              "url": source_url,
              "features_used": 50,
              "accessed_at": now,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "note": "Premises-use proxy; not cadastral parcel geometry."
          }
          sources = [s for s in (manifest.get("sources") or []) if s.get("url") != source_url]
          sources.append(source_entry)
          manifest.update({
              "generated_at": now,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": {k: ev.get(k, 0) for k in ["A", "B", "C", "D", "U"]},
              "type_distribution": dict(sorted(types.items())),
              "confidence_level_distribution": {k: conf.get(k, 0) for k in ["1", "2", "3", "4"]},
              "sources": sources,
              "fake_data": False,
              "final_ready": False,
              "note": "Existing shard preserved; appended 50 Walsall FHRS records outside feature.id/parcel_id/osm_id already_processed_ids.",
              "feature_count": after,
              "geojson_sha256": output_sha,
              "geojson_path": str(shard_path),
              "manifest_updated_at": now,
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": 50,
              "last_batch_city": city,
              "last_batch_source": source_name,
              "last_batch_source_sha256": source_sha
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          batch_index = int(checkpoint.get("next_batch_index", 6))
          checkpoint.update({
              "updated_at": now,
              "state": "IN_PROGRESS",
              "first_unverified_step_status": "BATCH_APPENDED_50_WALSALL_FHRS_CONTINUATION_REQUIRED",
              "final_ready": False,
              "fake_data": False,
              "feature_count_before": before,
              "feature_count_after": after,
              "current_feature_count": after,
              "next_batch_index": batch_index + 1,
              "next_target_feature_count": after + 50,
              "last_processed_ids_sample": new_ids[-20:],
              "last_batch": {
                  "batch_index": batch_index,
                  "city": city,
                  "source": source_name,
                  "source_sha256": source_sha,
                  "added_feature_count": 50,
                  "new_feature_ids": new_ids
              },
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE_AND_PARCEL_BINDING"
          })
          checkpoint.setdefault("summary", {})["new_slot"] = False
          checkpoint["summary"]["new_features_appended"] = 50
          checkpoint["summary"]["current_feature_count"] = after
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          status.update({
              "state": "IN_PROGRESS",
              "updated_at": now,
              "final_ready": False,
              "fake_data": False,
              "classified_count": classified,
              "unknown_count": unknown,
              "total_elements": after,
              "confidence_distribution": {k: conf.get(k, 0) for k in ["1", "2", "3", "4"]},
              "evidence_distribution": {k: ev.get(k, 0) for k in ["A", "B", "C", "D", "U"]},
              "output_sha256": output_sha,
              "feature_count_before": before,
              "feature_count_after": after,
              "current_feature_count": after,
              "last_batch": {
                  "city": city,
                  "added_feature_count": 50,
                  "source": source_name,
                  "source_sha256": source_sha,
                  "classification_basis": "fhrs_business_type_premises_proxy",
                  "evidence_level_distribution": {"D": 50},
                  "confidence_level_distribution": {"2": 50}
              }
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          runner = {
              "slot_id": slot_id,
              "task_id": task["task_id"],
              "generated_at": now,
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": 50,
              "city": city,
              "source": source_name,
              "source_url": source_url,
              "source_sha256": source_sha,
              "classification_method": "fhrs_business_type_premises_proxy",
              "confidence_policy": {"fhrs_premises_proxy": {"evidence_level": "D", "confidence_level_1_to_4": 2}},
              "records": records,
              "fake_data": False,
              "final_ready": False
          }
          runner_path.parent.mkdir(parents=True, exist_ok=True)
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(json.dumps({"before": before, "after": after, "added": 50, "eligible_candidates": len(candidates), "source_sha256": source_sha, "owner_preserved": status.get("owner"), "current_task_owner": task.get("owner")}, ensure_ascii=False))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_7_latest.geojson \
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json
          git diff --cached --quiet && { echo "No feature-count progress; refusing commit"; exit 1; } || true
          git commit -m "building_type_7 append Walsall FHRS batch"
          git push origin HEAD:codex/aays-single-runner-v5-20260706
