name: tmp building_type_7 Walsall batch

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_walsall_20260810.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Run corrected Walsall append at 300-to-350 continuation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git show 2aa8fbd8be029cbfd43f49519da6e8d80fbcb139:.github/workflows/tmp_building_type_7_walsall_20260810.yml > /tmp/walsall_stale.yml
          python3 <<'PY'
          from pathlib import Path
          text = Path('/tmp/walsall_stale.yml').read_text(encoding='utf-8')
          text = text.replace('expected_before = 250', 'expected_before = 300', 1)
          text = text.replace('expected_target = 300', 'expected_target = 350', 1)
          marker = '        run: |\n'
          if marker not in text:
              raise SystemExit('old workflow run block not found')
          script = text.split(marker, 1)[1]
          lines = script.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          if 'expected_before = 300' not in script or 'expected_target = 350' not in script:
              raise SystemExit('continuation guard patch failed')
          Path('/tmp/run_walsall.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/run_walsall.sh
