name: tmp building_type_3 batch28 checkpoint normalize

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_3_batch28_checkpoint_normalize_20260811.yml]

permissions:
  contents: write

concurrency:
  group: building-type-3-continuation
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Normalize checkpoint helper fields
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git pull --ff-only origin "$BRANCH"
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          if x.get('continuation_key')!='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e': raise SystemExit('continuation moved')
          if x.get('current_feature_count')!=6150 or x.get('next_batch_index')!=29 or x.get('last_batch_name')!='Reigate_Redhill': raise SystemExit('checkpoint moved')
          x['new_features_added_this_attempt']=50
          s=x.get('summary') or {}; s['current_feature_count']=6150; s['new_features_added_this_attempt']=50; s['progress_counted']=True; x['summary']=s
          a=x.get('attempted_cities') or []
          if 'Reigate_Redhill' not in a: a.append('Reigate_Redhill')
          x['attempted_cities']=a
          x['fake_data']=False; x['final_ready']=False
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'aays-building-type-3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(building_type_3): normalize batch 28 checkpoint metadata'
          COMMIT=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git merge-base --is-ancestor origin/"$BRANCH" HEAD; then git rebase origin/"$BRANCH"; fi
            if git push origin HEAD:"$BRANCH"; then break; fi
            sleep 2
          done
          git fetch origin "$BRANCH"
          git merge-base --is-ancestor "$COMMIT" origin/"$BRANCH"
          echo "REMOTE_READBACK_OK commit=$COMMIT"
