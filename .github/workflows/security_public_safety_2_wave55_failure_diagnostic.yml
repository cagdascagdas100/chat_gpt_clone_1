name: security-public-safety-2-wave55-failure-diagnostic

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/security_public_safety_2_wave55_failure_diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Capture failed log tail
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          set +e
          gh run view 30505557616 --attempt 3 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/wave55_failed.log 2>&1
          rc=$?
          tail -n 300 /tmp/wave55_failed.log > docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave55_failure_tail_20260730.txt
          printf '\nDIAGNOSTIC_ATTEMPT=3\nDIAGNOSTIC_RETURN_CODE=%s\n' "$rc" >> docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave55_failure_tail_20260730.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave55_failure_tail_20260730.txt
          git commit -m 'record security_public_safety_2 wave55 attempt 3 failure tail'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
