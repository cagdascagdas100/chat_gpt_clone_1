name: tmp building_type_9 Northallerton batch 27

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_9_northallerton_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-9-continuation
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'run guarded building_type_9 Northallerton batch 27')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 unseen evidence-backed Northallerton buildings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-slot-runner'
          git config user.email 'aays-slot-runner@users.noreply.github.com'
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          git show 4599bbdaaec1ff24eb048e69cbcfec3d2ab5c247:.github/workflows/tmp_building_type_9_hartlepool_20260810.yml > /tmp/base.yml
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('/tmp/base.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY",start)
          lines=text[start:end].splitlines()
          script='\n'.join((ln[10:] if ln.startswith('          ') else ln) for ln in lines)+'\n'
          script=script.replace("BEFORE=1250; TARGET=1300; BATCH=26","BEFORE=1300; TARGET=1350; BATCH=27")
          script=script.replace("Hartlepool","Northallerton").replace("hartlepool","northallerton").replace("HARTLEPOOL","NORTHALLERTON")
          script=script.replace("AUTH='Northallerton'","AUTH='North Yorkshire'")
          script=script.replace("AAYS-building-type-9/2.1","AAYS-building-type-9/2.2")
          script=script.replace("batch 26","batch 27")
          script=script.replace("BATCH_026","BATCH_027")
          script=script.replace("Existing 1250-feature","Existing 1300-feature")
          script=script.replace("'next_batch_index':27","'next_batch_index':28")
          script=script.replace("'next_target_feature_count':1350","'next_target_feature_count':1400")
          script=script.replace("'next_city_index':27","'next_city_index':28")
          bboxes="""BBOXES=[
  '-1.4900,54.3000,-1.4600,54.3250','-1.4600,54.3000,-1.4300,54.3250',
  '-1.4300,54.3000,-1.4000,54.3250','-1.4000,54.3000,-1.3700,54.3250',
  '-1.4900,54.3250,-1.4600,54.3500','-1.4600,54.3250,-1.4300,54.3500',
  '-1.4300,54.3250,-1.4000,54.3500','-1.4000,54.3250,-1.3700,54.3500',
  '-1.4900,54.3500,-1.4600,54.3750','-1.4600,54.3500,-1.4300,54.3750',
  '-1.4300,54.3500,-1.4000,54.3750','-1.4000,54.3500,-1.3700,54.3750']"""
          script=re.sub(r"BBOXES=\[.*?\]\n\nGEO=",bboxes+"\n\nGEO=",script,flags=re.S)
          required=["BEFORE=1300; TARGET=1350; BATCH=27","CITY='Northallerton'","GRID='NORTHALLERTON_CENTRAL_01'","AUTH='North Yorkshire'","next_batch_index':28","next_target_feature_count':1400","next_city_index':28"]
          for s in required: assert s in script,s
          assert 'Hartlepool' not in script and 'hartlepool' not in script and 'BATCH_026' not in script
          pathlib.Path('/tmp/run.py').write_text(script)
          PY
          python3 /tmp/run.py

      - name: Guard remote state, self-delete, commit and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_northallerton_20260810.yml'
          GEO='england_map_web/data/building_type/shards/building_type_9_latest.geojson'
          MAN='england_map_web/data/building_type/shards/building_type_9_manifest_latest.json'
          RUN='docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json'
          STA='docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json'
          CP='docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'
          CT='docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'
          git fetch origin "$BRANCH"
          git show "origin/$BRANCH:$CP" > /tmp/remote_cp.json
          git show "origin/$BRANCH:$CT" > /tmp/remote_ct.json
          python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json')); t=json.load(open('/tmp/remote_ct.json'))
          assert cp.get('current_feature_count')==1300 and cp.get('next_batch_index')==27 and cp.get('next_target_feature_count')==1350
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          PY
          rm -f "$WF"
          git add "$GEO" "$MAN" "$RUN" "$STA" "$CP" "$WF"
          git commit -m 'building_type_9: append batch 27 Northallerton OSM API features'
          ok=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:$CP" > /tmp/remote_cp_retry.json
            python3 - <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp_retry.json'))
          assert cp.get('current_feature_count')==1300 and cp.get('next_batch_index')==27, 'same-slot remote state advanced; abort rebase'
          PY
            git rebase "origin/$BRANCH"
          done
          test "$ok" = 1

      - name: Verify remote slot9 readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          for item in \
            'england_map_web/data/building_type/shards/building_type_9_latest.geojson:/tmp/g.json' \
            'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json:/tmp/m.json' \
            'docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json:/tmp/r.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json:/tmp/s.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json:/tmp/c.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json:/tmp/t.json'; do
            src="${item%%:*}"; dst="${item#*:}"; git show "origin/$BRANCH:$src" > "$dst"
          done
          python3 - <<'PY'
          import json
          g=json.load(open('/tmp/g.json')); m=json.load(open('/tmp/m.json')); r=json.load(open('/tmp/r.json')); s=json.load(open('/tmp/s.json')); c=json.load(open('/tmp/c.json')); t=json.load(open('/tmp/t.json'))
          assert len(g['features'])==1350
          assert c['feature_count_before']==1300 and c['feature_count_after']==1350 and c['current_feature_count']==1350 and c['next_batch_index']==28 and c['next_target_feature_count']==1400
          assert c['last_batch']['city']=='Northallerton' and c['last_batch']['added_feature_count']==50
          assert m['total_features']==1350 and s['total_elements']==1350 and r['feature_count_after']==1350 and len(r['records'])==50
          assert t.get('continuation_key')=='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512' and t.get('owner') is None
          assert all(x.get('fake_data') is False for x in (m,r,s,c)) and all(x.get('final_ready') is not True for x in (m,s,c))
          print('REMOTE_READBACK_OK building_type_9 1300->1350 Northallerton batch27')
          PY
