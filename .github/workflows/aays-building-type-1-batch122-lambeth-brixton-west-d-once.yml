name: AAYS building_type_1 batch122 Lambeth Brixton West D one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-1-batch122-lambeth-brixton-west-d-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-1-batch122
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 80
      - name: Use prior guarded batch generator
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git fetch origin 61d873aaecbce4d338e9ff8aaaa60cbd5d1be72c --depth=1
          python - <<'PY'
          import collections, json, re, subprocess, textwrap
          TEMPLATE='61d873aaecbce4d338e9ff8aaaa60cbd5d1be72c'
          OLD_WF='.github/workflows/aays-building-type-1-batch120-lambeth-brixton-west-b-once.yml'
          NEW_WF='.github/workflows/aays-building-type-1-batch122-lambeth-brixton-west-d-once.yml'
          old=subprocess.check_output(['git','show',f'{TEMPLATE}:{OLD_WF}'],text=True)
          marker="          python - <<'PY'\n"; start=old.index(marker)+len(marker); end=old.index("\n          PY",start)
          code=textwrap.dedent(old[start:end])
          replacements={
            "GRID='Lambeth_Brixton_West_B'":"GRID='Lambeth_Brixton_West_D'",
            "NEXT_GRID='Lambeth_Brixton_West_C'":"NEXT_GRID='Lambeth_Brixton_West_E'",
            "LOCAL_AUTHORITY='Lambeth'":"LOCAL_AUTHORITY='Wandsworth'",
            "BATCH_INDEX=120":"BATCH_INDEX=122",
            "EXPECTED_BEFORE=7800":"EXPECTED_BEFORE=7900",
            "TARGET_AFTER=7850":"TARGET_AFTER=7950",
            "NEXT_TARGET=7900":"NEXT_TARGET=8000",
            "BBOX=[51.455,-0.155,51.470,-0.135]":"BBOX=[51.455,-0.195,51.470,-0.175]",
            "pathlib.Path('.github/workflows/aays-building-type-1-batch120-lambeth-brixton-west-b-once.yml')":f"pathlib.Path('{NEW_WF}')",
            "OpenStreetMap Overpass API - Lambeth Brixton West B":"OpenStreetMap Overpass API - Lambeth Brixton West D"
          }
          for a,b in replacements.items():
              if a not in code: raise SystemExit(f'missing generator template token: {a}')
              code=code.replace(a,b)
          replacement_query="query=f'''[out:json][timeout:45];\\nway[\\\"building\\\"][\\\"building\\\"!~\\\"^(yes|garage|garages|shed|carport|roof|construction|proposed|no)$\\\"]({south},{west},{north},{east});\\nout tags center qt 1500;\\n'''"
          code,n=re.subn(r"query=f'''[\s\S]*?'''",lambda m:replacement_query,code,count=1)
          if n!=1: raise SystemExit('typed-building query patch failed')
          fetch_pattern=r"payload=urllib\.parse\.urlencode\(\{'data':query\}\)\.encode\('utf-8'\)\nraw=None; errors=\[\]\nfor attempt in range\(1,4\):[\s\S]*?if raw is None: raise SystemExit\(f'Overpass failed after 3 attempts: \{errors\}'\)"
          replacement_fetch="\n".join([
            "payload=urllib.parse.urlencode({'data':query}).encode('utf-8')","raw=None; errors=[]",
            "ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']",
            "for attempt,endpoint in enumerate(ENDPOINTS,1):","    try:",
            "        req=urllib.request.Request(endpoint,data=payload,headers={'User-Agent':'TerraYield-AAYS-building_type_1/1.0','Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'},method='POST')",
            "        with urllib.request.urlopen(req,timeout=90) as resp: raw=resp.read()","        ENDPOINT=endpoint","        break",
            "    except Exception as exc:","        errors.append({'endpoint':endpoint,'error':repr(exc)})",
            "        if attempt<len(ENDPOINTS): time.sleep(3*attempt)","if raw is None: raise SystemExit(f'Overpass endpoints failed once each: {errors}')"])
          code,n=re.subn(fetch_pattern,lambda m:replacement_fetch,code,count=1)
          if n!=1: raise SystemExit('multi-endpoint fetch patch failed')
          exec(compile(code,'batch122_generator','exec'),{})
          GEO='england_map_web/data/building_type/shards/building_type_1_latest.geojson'; MAN='england_map_web/data/building_type/shards/building_type_1_manifest_latest.json'; RUN='docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'; STA='docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json'; CP='docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'
          def rj(p): return json.load(open(p,encoding='utf-8'))
          def wj(p,o):
              with open(p,'w',encoding='utf-8') as f: json.dump(o,f,ensure_ascii=False,indent=2); f.write('\n')
          geo=rj(GEO); man=rj(MAN); run=rj(RUN); st=rj(STA); cp=rj(CP); feats=geo.get('features') or []
          if len(feats)!=7950 or len(run.get('records') or [])!=50: raise SystemExit('post-generator feature/record count mismatch')
          ev=collections.Counter(); conf=collections.Counter(); types=collections.Counter(); unknown=0
          for f in feats:
              p=f.get('properties') or {}; ev[str(p.get('evidence_level') or 'U')]+=1
              try: lvl=int(p.get('confidence_level_1_to_4'))
              except Exception: lvl=1
              if lvl not in (1,2,3,4): lvl=1
              conf[f'level_{lvl}']+=1; primary=str(p.get('building_type_primary') or 'unknown'); types[primary]+=1; unknown+=primary=='unknown'
          classified=len(feats)-unknown
          man.update({'feature_count_before':7900,'feature_count_after':7950,'new_features_added':50,'current_feature_count':7950,'next_batch_index':123,'next_target_feature_count':8000,'total_features':7950,'feature_count':7950,'classified':classified,'unknown':unknown,'evidence_distribution':dict(sorted(ev.items())),'confidence_distribution':dict(sorted(conf.items())),'confidence_level_distribution':dict(sorted(conf.items())),'building_type_distribution':dict(sorted(types.items())),'type_distribution':dict(sorted(types.items())),'fake_data':False,'final_ready':False})
          st.update({'classified_count':classified,'unknown_count':unknown,'evidence_distribution':dict(sorted(ev.items())),'confidence_distribution':dict(sorted(conf.items())),'fake_data':False,'final_ready':False}); cp.update({'fake_data':False,'final_ready':False}); run.update({'classified_count_after':classified,'unknown_count_after':unknown,'fake_data':False,'final_ready':False})
          wj(MAN,man); wj(STA,st); wj(CP,cp); wj(RUN,run)
          PY
      - name: Validate commit and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          paths={'geo':'england_map_web/data/building_type/shards/building_type_1_latest.geojson','man':'england_map_web/data/building_type/shards/building_type_1_manifest_latest.json','run':'docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json','st':'docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json','cp':'docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json','task':'docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json'}
          d={k:json.load(open(v,encoding='utf-8')) for k,v in paths.items()}; feats=d['geo'].get('features') or []; records=d['run'].get('records') or []
          assert len(feats)==7950 and d['st'].get('feature_count_before')==7900 and d['st'].get('feature_count_after')==7950 and d['st'].get('new_features_added')==50
          assert d['cp'].get('next_batch_index')==123 and d['cp'].get('next_target_feature_count')==8000 and d['cp'].get('last_grid_id')=='Lambeth_Brixton_West_D'
          assert len(records)==50 and d['man'].get('feature_count')==7950 and d['task'].get('owner') in (None,'')
          seen_f=set(); seen_p=set(); seen_o=set()
          for f in feats:
              fid=f.get('id'); p=f.get('properties') or {}; pid=p.get('parcel_id'); oid=p.get('osm_id')
              if fid not in (None,''): assert str(fid) not in seen_f; seen_f.add(str(fid))
              if pid not in (None,''): assert str(pid) not in seen_p; seen_p.add(str(pid))
              if oid not in (None,''): assert str(oid) not in seen_o; seen_o.add(str(oid))
          for r in records:
              assert r.get('source_url') and r.get('source_hash') and r.get('sources') and r.get('evidence_excerpt') and r.get('evidence_level') in {'B','C'} and r.get('confidence_level_1_to_4') in {2,3} and r.get('fake_data') is False and r.get('final_ready') is False
          for k in ('man','run','st','cp'): assert d[k].get('fake_data') is False and d[k].get('final_ready') is False
          PY
          git config user.name "aays-building-type-1-bot"; git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/aays-building-type-1-batch122-lambeth-brixton-west-d-once.yml
          git add -- .github/workflows/aays-building-type-1-batch122-lambeth-brixton-west-d-once.yml england_map_web/data/building_type/shards/building_type_1_latest.geojson england_map_web/data/building_type/shards/building_type_1_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json
          git diff --cached --quiet && { echo 'No staged change; refusing false progress'; exit 1; }
          git commit -m "building_type_1: append batch 122 Lambeth_Brixton_West_D +50"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=80
            remote_count=$(git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json | python -c "import json,sys; print(json.load(sys.stdin).get('current_feature_count'))")
            remote_batch=$(git show origin/codex/aays-single-runner-v5-20260706:docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json | python -c "import json,sys; print(json.load(sys.stdin).get('next_batch_index'))")
            if [ "$remote_count" != "7900" ] || [ "$remote_batch" != "122" ]; then echo 'building_type_1 moved remotely; abort duplicate publish'; exit 1; fi
            if git pull --rebase origin codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            git rebase --abort || true; sleep $((attempt*2))
          done
          exit 1
      - name: Remote readback invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=80
          python - <<'PY'
          import json, subprocess
          BR='origin/codex/aays-single-runner-v5-20260706'; r=lambda p: json.loads(subprocess.check_output(['git','show',f'{BR}:{p}']).decode())
          geo=r('england_map_web/data/building_type/shards/building_type_1_latest.geojson'); man=r('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json'); run=r('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'); st=r('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json'); cp=r('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'); task=r('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json')
          assert len(geo.get('features') or [])==7950 and st.get('current_feature_count')==7950 and cp.get('current_feature_count')==7950 and st.get('feature_count_before')==7900 and st.get('feature_count_after')==7950 and st.get('new_features_added')==50
          assert cp.get('next_batch_index')==123 and cp.get('next_target_feature_count')==8000 and cp.get('last_grid_id')=='Lambeth_Brixton_West_D' and len(run.get('records') or [])==50 and man.get('feature_count')==7950 and task.get('owner') in (None,'')
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (man,run,st,cp))
          print('REMOTE_READBACK_OK building_type_1 7900->7950 batch122 Lambeth_Brixton_West_D +50')
          PY
