name: security_public_safety_2 Wave140 HMLR INSPIRE and OS Open UPRN

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/aays-triggers/security_public_safety_2_wave140.trigger.json

permissions:
  contents: read

concurrency:
  group: security-public-safety-2-wave140
  cancel-in-progress: false

jobs:
  diagnose-hmlr-download-controls:
    if: github.head_ref == 'audit/security-public-safety-2-wave140-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded diagnostic dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Capture official HMLR download controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          url = 'https://use-land-property-data.service.gov.uk/datasets/inspire/download'
          targets = ['London Borough of Barnet','London Borough of Enfield','London Borough of Hackney','London Borough of Haringey','London Borough of Waltham Forest']
          s = requests.Session()
          s.headers['User-Agent'] = 'AAYS-wave140-HMLR-control-diagnostic/1.0'
          r = s.get(url, timeout=(20, 120))
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')
          records = []
          for target in targets:
              matches = []
              for node in soup.find_all(string=lambda value: value and target.lower() in value.lower()):
                  candidates = []
                  current = node.parent
                  for _ in range(8):
                      if current is None:
                          break
                      candidates.append(current)
                      if current.name in {'tr','li','form'}:
                          break
                      current = current.parent
                  for container in candidates:
                      controls = []
                      for tag in container.find_all(['a','button','form','input'], recursive=True):
                          attrs = {str(k): (list(v) if isinstance(v, list) else str(v)) for k, v in tag.attrs.items()}
                          controls.append({'tag': tag.name, 'text': ' '.join(tag.stripped_strings)[:300], 'attrs': attrs})
                      if controls:
                          matches.append({'container_tag': container.name, 'container_attrs': dict(container.attrs), 'controls': controls, 'html': str(container)[:20000]})
                          break
              records.append({'authority': target, 'matches': matches[:10]})
          payload = {
              'page_url': r.url,
              'status': r.status_code,
              'content_type': r.headers.get('content-type'),
              'page_bytes': len(r.content),
              'records': records,
          }
          out = Path('/tmp/wave140-hmlr-structure.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2))
          Path('/tmp/wave140-hmlr-page.html').write_text(r.text)
          print(json.dumps({
              'page_bytes': len(r.content),
              'authorities': len(records),
              'matched_authorities': sum(bool(x['matches']) for x in records),
              'control_count': sum(len(m['controls']) for x in records for m in x['matches']),
          }))
          PY
      - name: Upload HMLR structure diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: security-public-safety-2-wave140-hmlr-structure
          path: |
            /tmp/wave140-hmlr-structure.json
            /tmp/wave140-hmlr-page.html
          if-no-files-found: error
          retention-days: 1
