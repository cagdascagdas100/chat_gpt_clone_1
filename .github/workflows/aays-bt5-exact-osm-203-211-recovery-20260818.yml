      - name: Mark BT5 203-211 recovery started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_exact_osm_203_211_recovery_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',source_windows:'203-211',state:'RUNNING',mode:'EXACT_OSM_NODE_IDENTITY_REFRESH_PHASE2_RECOVERY',run_id:String(context.runId),head_sha:context.sha,started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 exact 203-211 recovery started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout canonical shallow
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Configure runtime
        shell: bash
        run: |
          set -euo pipefail
          git -C canonical config user.name 'AAYS building_type_5'
          git -C canonical config user.email 'aays-building-type-5@users.noreply.github.com'
          python -m pip install --quiet requests
      - name: Resume exact OSM windows 203-211
        shell: bash
        env:
          CANONICAL_BRANCH: codex/aays-single-runner-v5-20260706
        run: |
          set -euo pipefail
          cat > /tmp/bt5_exact_203_211_recovery.py <<'PY'
