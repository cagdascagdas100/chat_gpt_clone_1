name: AAYS BT5 exact OSM 203-211 recovery 20260818
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-exact-osm-203-211-recovery-20260818.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-5-exact-203-211-recovery
  cancel-in-progress: true
jobs:
  exact-osm-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
