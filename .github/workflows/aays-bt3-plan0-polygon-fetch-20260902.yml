name: AAYS bt3 Plan0 exact polygon evidence 20260902
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-bt3-plan0-polygon-fetch-20260902.yml'
permissions:
  contents: read
  checks: write
jobs:
  fetch-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe official HMLR vector parcel service
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, re, os, xml.etree.ElementTree as ET
          UA='TerraYield-AAYS-ChatGPT/1.0 building_type_3 HMLR WFS evidence'
          base='https://inspire.landregistry.gov.uk/inspire/ows'
          result={'schema':'bt3_hmlr_wfs_probe_v1','base':base,'capabilities':[],'getfeature_attempts':[]}
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      d=r.read();return {'http_status':getattr(r,'status',None),'final_url':r.geturl(),'content_type':r.headers.get('Content-Type'),'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'data':d}
              except urllib.error.HTTPError as e:
                  d=e.read();return {'http_status':e.code,'final_url':getattr(e,'url',url),'content_type':e.headers.get('Content-Type') if e.headers else None,'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'data':d,'error':str(e)}
              except Exception as e:return {'http_status':None,'error_type':type(e).__name__,'error':str(e),'bytes':0,'data':b''}
          names=[]
          for ver in ('2.0.0','1.1.0'):
              u=base+'?'+urllib.parse.urlencode({'service':'WFS','version':ver,'request':'GetCapabilities'})
              r=get(u); text=r.pop('data').decode('utf-8','replace'); r['url']=u; r['preview']=text[:1800]
              found=sorted(set(re.findall(r'<(?:\w+:)?Name>([^<]*CadastralParcel[^<]*)</(?:\w+:)?Name>',text,re.I)))
              r['cadastral_feature_names']=found; names.extend(found); result['capabilities'].append(r)
          names=list(dict.fromkeys(names))
          if not names:
              names=['inspire:CP.CadastralParcel','CP.CadastralParcel','cp:CP.CadastralParcel']
          bbox='491250,190130,491370,190220,EPSG:27700'
          for name in names[:6]:
              for ver in ('2.0.0','1.1.0'):
                  params={'service':'WFS','version':ver,'request':'GetFeature','bbox':bbox}
                  if ver=='2.0.0':params['typenames']=name
                  else:params['typename']=name
                  params['srsName']='EPSG:27700'
                  u=base+'?'+urllib.parse.urlencode(params)
                  r=get(u,timeout=240); data=r.pop('data'); text=data.decode('utf-8','replace')
                  r.update({'url':u,'version':ver,'typename':name,'preview':text[:2500]})
                  # capture bounded posList coordinates if GML contains features
                  pls=re.findall(r'<(?:\w+:)?posList[^>]*>([^<]+)</(?:\w+:)?posList>',text,re.I)
                  r['poslist_count']=len(pls); r['poslist_samples']=pls[:5]
                  result['getfeature_attempts'].append(r)
                  if r.get('http_status')==200 and pls: break
              if any(a.get('http_status')==200 and a.get('poslist_count',0)>0 for a in result['getfeature_attempts']): break
          summary=json.dumps(result,separators=(',',':'),ensure_ascii=False)
          if len(summary)>64000:summary=summary[:63900]+json.dumps({'truncated':True})
          payload={'name':'bt3-hmlr-wfs-probe','head_sha':os.environ['GH_SHA'],'status':'completed','conclusion':'success','output':{'title':'BT3 official HMLR WFS probe','summary':summary}}
          api='https://api.github.com/repos/'+os.environ['GH_REPO']+'/check-runs'
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':UA})
          with urllib.request.urlopen(req,timeout=60) as r:print('CUSTOM_CHECK_STATUS',r.status)
          PY
