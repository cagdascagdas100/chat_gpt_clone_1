name: AAYS bt3 Plan0 exact polygon evidence 20260902
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-bt3-plan0-polygon-fetch-20260902.yml'
permissions:
  contents: read
  checks: write
jobs:
  fetch-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe HMLR WMS GetFeatureInfo parcel geometry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, re, os
          UA='TerraYield-AAYS-ChatGPT/1.0 building_type_3 HMLR WMS evidence'
          base='https://inspire.landregistry.gov.uk/inspire/ows'
          bbox=(491250.0,190130.0,491370.0,190220.0); width=600; height=450
          cs=[{'fid':'ENG_OSM_way_253977368','E':491326.95,'N':190170.00},{'fid':'ENG_OSM_way_253977373','E':491288.29,'N':190179.97}]
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      d=r.read();return {'http_status':getattr(r,'status',None),'final_url':r.geturl(),'content_type':r.headers.get('Content-Type'),'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'data':d}
              except urllib.error.HTTPError as e:
                  d=e.read();return {'http_status':e.code,'final_url':getattr(e,'url',url),'content_type':e.headers.get('Content-Type') if e.headers else None,'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'data':d,'error':str(e)}
              except Exception as e:return {'http_status':None,'error_type':type(e).__name__,'error':str(e),'bytes':0,'data':b''}
          result={'schema':'bt3_hmlr_wms_featureinfo_v1','base':base,'bbox':bbox,'results':[]}
          capu=base+'?'+urllib.parse.urlencode({'service':'WMS','version':'1.3.0','request':'GetCapabilities'})
          cap=get(capu); capt=cap.pop('data').decode('utf-8','replace'); cap['url']=capu; cap['preview']=capt[:2500]; result['capabilities']=cap
          # collect plausible layer name from capabilities, but keep historical fallback
          names=re.findall(r'<Name>([^<]*CadastralParcel[^<]*)</Name>',capt,re.I)
          names=list(dict.fromkeys(names)) or ['inspire:CP.CadastralParcel']
          result['layer_names']=names
          for c in cs:
              i=round((c['E']-bbox[0])/(bbox[2]-bbox[0])*width)
              j=round((bbox[3]-c['N'])/(bbox[3]-bbox[1])*height)
              attempts=[]
              for layer in names[:4]:
                  for info in ('application/vnd.ogc.gml','text/xml','application/json'):
                      params={'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetFeatureInfo','LAYERS':layer,'QUERY_LAYERS':layer,'STYLES':'','CRS':'EPSG:27700','BBOX':','.join(str(x) for x in bbox),'WIDTH':str(width),'HEIGHT':str(height),'I':str(i),'J':str(j),'FEATURE_COUNT':'10','INFO_FORMAT':info}
                      u=base+'?'+urllib.parse.urlencode(params)
                      r=get(u); data=r.pop('data'); text=data.decode('utf-8','replace')
                      # bounded raw response retained; detect geometry-bearing tags/coordinates
                      geom_tags=sorted(set(re.findall(r'<(?:\w+:)?(Polygon|MultiPolygon|MultiSurface|Surface|LinearRing|posList)\b',text,re.I)))
                      poslists=re.findall(r'<(?:\w+:)?posList[^>]*>([^<]+)</(?:\w+:)?posList>',text,re.I)
                      rec={**r,'url':u,'layer':layer,'info_format':info,'i':i,'j':j,'geometry_tags':geom_tags,'poslist_count':len(poslists),'poslist_samples':poslists[:8],'preview':text[:9000]}
                      attempts.append(rec)
                      if r.get('http_status')==200 and (poslists or 'CadastralParcel' in text):break
                  if attempts and attempts[-1].get('http_status')==200 and (attempts[-1].get('poslist_count',0)>0 or 'CadastralParcel' in attempts[-1].get('preview','')):break
              result['results'].append({'fid':c['fid'],'E':c['E'],'N':c['N'],'i':i,'j':j,'attempts':attempts})
          summary=json.dumps(result,separators=(',',':'),ensure_ascii=False)
          if len(summary)>64000:summary=summary[:63900]+json.dumps({'truncated':True})
          payload={'name':'bt3-hmlr-wms-featureinfo','head_sha':os.environ['GH_SHA'],'status':'completed','conclusion':'success','output':{'title':'BT3 HMLR WMS FeatureInfo','summary':summary}}
          api='https://api.github.com/repos/'+os.environ['GH_REPO']+'/check-runs'
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':UA})
          with urllib.request.urlopen(req,timeout=60) as r:print('CUSTOM_CHECK_STATUS',r.status)
          PY
