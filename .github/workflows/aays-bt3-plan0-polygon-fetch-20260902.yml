name: AAYS bt3 Plan0 exact polygon evidence 20260902
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-bt3-plan0-polygon-fetch-20260902.yml'
permissions:
  contents: read
jobs:
  fetch-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact open building and HMLR parcel evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, re, xml.etree.ElementTree as ET
          from urllib.parse import urljoin

          UA='TerraYield-AAYS-ChatGPT/1.0 building_type_3 Plan0 evidence'
          candidates=[
            {'fid':'ENG_OSM_way_253977368','lon':-0.6827255,'lat':51.60297445,'E':491326.95,'N':190170.00},
            {'fid':'ENG_OSM_way_253977373','lon':-0.683280925,'lat':51.603070325,'E':491288.29,'N':190179.97},
          ]
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  data=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              return status,final,ctype,data
          def esc(s):
              return str(s).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          def notice(title,obj):
              msg=json.dumps(obj,separators=(',',':'),ensure_ascii=False)
              print(f'::notice title={title}::{esc(msg)}')

          os_base='https://services.arcgis.com/qHLhLQrcvEnxjtPr/arcgis/rest/services/OS_OpenMap_Local_Buildings/FeatureServer/1/query'
          for c in candidates:
              params={'f':'geojson','geometry':f"{c['lon']},{c['lat']}",'geometryType':'esriGeometryPoint','inSR':'4326','outFields':'*','outSR':'4326','returnGeometry':'true','spatialRel':'esriSpatialRelIntersects','where':'1=1'}
              url=os_base+'?'+urllib.parse.urlencode(params)
              try:
                  status,final,ctype,data=get(url)
                  obj=json.loads(data.decode('utf-8')); feats=obj.get('features') or []
                  notice('BT3_OS_META_'+c['fid'],{'fid':c['fid'],'url':url,'http_status':status,'final_url':final,'content_type':ctype,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'feature_count':len(feats)})
                  for i,f in enumerate(feats[:5]):
                      notice('BT3_OS_FEATURE_'+c['fid']+'_'+str(i),{'fid':c['fid'],'index':i,'geometry':f.get('geometry'),'properties':f.get('properties') or {}})
              except Exception as e:
                  notice('BT3_OS_ERROR_'+c['fid'],{'fid':c['fid'],'type':type(e).__name__,'error':str(e)})

          catalogue='https://use-land-property-data.service.gov.uk/datasets/inspire/download'
          try:
              status,final,ctype,html=get(catalogue)
              text=html.decode('utf-8','replace')
              notice('BT3_HMLR_CATALOGUE',{'http_status':status,'final_url':final,'content_type':ctype,'sha256':hashlib.sha256(html).hexdigest(),'bytes':len(html)})
              idx=text.lower().find('buckinghamshire council')
              if idx < 0: raise RuntimeError('Buckinghamshire Council not found in catalogue HTML')
              window=text[max(0,idx-3000):idx+6000]
              hrefs=[urljoin(final,h) for h in re.findall(r'href=[\"\']([^\"\']+)[\"\']',window,re.I)]
              scored=sorted(set(((5 if '.gml' in h.lower() else 0)+(2 if 'download' in h.lower() else 0)+(1 if 'inspire' in h.lower() else 0),h) for h in hrefs),reverse=True)
              gml_url=next((h for s,h in scored if s>=5),None)
              if not gml_url:
                  m=re.search(r'Buckinghamshire Council.{0,3000}?href=[\"\']([^\"\']+)[\"\']',text,re.I|re.S)
                  if m: gml_url=urljoin(final,m.group(1))
              notice('BT3_HMLR_URL_CANDIDATES',{'urls':[h for s,h in scored[:10]],'selected':gml_url})
              if not gml_url: raise RuntimeError('Buckinghamshire GML href not found')
              gstatus,gfinal,gctype,gml=get(gml_url,timeout=600)
              notice('BT3_HMLR_GML_META',{'url':gml_url,'http_status':gstatus,'final_url':gfinal,'content_type':gctype,'sha256':hashlib.sha256(gml).hexdigest(),'bytes':len(gml)})
              path='/tmp/buck.gml'; open(path,'wb').write(gml)
              def local(tag): return tag.split('}',1)[-1]
              def pairs(txt):
                  vals=[float(x) for x in re.split(r'\s+',txt.strip()) if x]
                  out=[]
                  for i in range(0,len(vals)-1,2):
                      a,b=vals[i],vals[i+1]
                      if 450000<=a<=550000 and 150000<=b<=250000: out.append((a,b))
                      elif 450000<=b<=550000 and 150000<=a<=250000: out.append((b,a))
                      else: out.append((a,b))
                  return out
              def pip(x,y,p):
                  inside=False; j=len(p)-1
                  for i in range(len(p)):
                      xi,yi=p[i]; xj,yj=p[j]
                      if ((yi>y)!=(yj>y)) and x < (xj-xi)*(y-yi)/(yj-yi)+xi: inside=not inside
                      j=i
                  return inside
              found={c['fid']:[] for c in candidates}
              for ev,elem in ET.iterparse(path,events=('end',)):
                  if local(elem.tag).lower() not in ('cadastralparcel','parcel'): continue
                  polys=[]
                  for sub in elem.iter():
                      if local(sub.tag)=='posList' and sub.text:
                          p=pairs(sub.text)
                          if len(p)>=3: polys.append(p)
                  if not polys:
                      elem.clear(); continue
                  attrs={'gml_id':elem.attrib.get('{http://www.opengis.net/gml/3.2}id') or elem.attrib.get('{http://www.opengis.net/gml}id') or elem.attrib.get('id')}
                  for sub in elem.iter():
                      ln=local(sub.tag)
                      if ln.lower() in ('localid','namespace','nationalcadastralreference','label','beginlifespanversion') and sub.text and len(sub.text.strip())<300: attrs[ln]=sub.text.strip()
                  for c in candidates:
                      for p in polys:
                          if pip(c['E'],c['N'],p): found[c['fid']].append({'attributes':attrs,'polygon':p}); break
                  elem.clear()
              for c in candidates:
                  ms=found[c['fid']]
                  notice('BT3_HMLR_MATCH_'+c['fid'],{'fid':c['fid'],'E':c['E'],'N':c['N'],'match_count':len(ms)})
                  for i,m in enumerate(ms[:3]): notice('BT3_HMLR_PARCEL_'+c['fid']+'_'+str(i),{'fid':c['fid'],'index':i,'attributes':m['attributes'],'polygon':m['polygon']})
          except Exception as e:
              notice('BT3_HMLR_ERROR',{'type':type(e).__name__,'error':str(e)})
          PY
