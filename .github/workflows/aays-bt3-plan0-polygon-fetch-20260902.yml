name: AAYS bt3 Plan0 exact polygon evidence 20260902
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-bt3-plan0-polygon-fetch-20260902.yml'
permissions:
  contents: read
  checks: write
jobs:
  fetch-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and publish exact polygon evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, re, xml.etree.ElementTree as ET, os
          from urllib.parse import urljoin
          UA='TerraYield-AAYS-ChatGPT/1.0 building_type_3 Plan0 evidence'
          candidates=[
            {'fid':'ENG_OSM_way_253977368','address':'6 White House Close, Wooburn Green, High Wycombe, HP10 0NU','lon':-0.6827255,'lat':51.60297445,'E':491326.95,'N':190170.00,'type':'residential_detached'},
            {'fid':'ENG_OSM_way_253977373','address':'9 White House Close, Wooburn Green, High Wycombe, HP10 0NU','lon':-0.683280925,'lat':51.603070325,'E':491288.29,'N':190179.97,'type':'residential_detached'},
          ]
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  d=r.read(); return getattr(r,'status',None),r.geturl(),r.headers.get('Content-Type'),d
          result={'schema':'bt3_plan0_exact_polygon_evidence_v1','candidates':{},'hmlr':{}}
          os_base='https://services.arcgis.com/qHLhLQrcvEnxjtPr/arcgis/rest/services/OS_OpenMap_Local_Buildings/FeatureServer/1/query'
          for c in candidates:
              rr={'address':c['address'],'semantic_type':c['type'],'os_openmap_local':{},'hmlr_match':{}}
              params={'f':'geojson','geometry':f"{c['lon']},{c['lat']}",'geometryType':'esriGeometryPoint','inSR':'4326','outFields':'*','outSR':'4326','returnGeometry':'true','spatialRel':'esriSpatialRelIntersects','where':'1=1'}
              url=os_base+'?'+urllib.parse.urlencode(params)
              try:
                  status,final,ctype,data=get(url)
                  obj=json.loads(data.decode('utf-8')); feats=obj.get('features') or []
                  rr['os_openmap_local']={'url':url,'http_status':status,'final_url':final,'content_type':ctype,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'feature_count':len(feats),'features':feats[:3]}
              except Exception as e:
                  rr['os_openmap_local']={'error_type':type(e).__name__,'error':str(e)}
              result['candidates'][c['fid']]=rr

          catalogue='https://use-land-property-data.service.gov.uk/datasets/inspire/download'
          try:
              status,final,ctype,html=get(catalogue)
              text=html.decode('utf-8','replace')
              result['hmlr']['catalogue']={'url':catalogue,'http_status':status,'final_url':final,'content_type':ctype,'sha256':hashlib.sha256(html).hexdigest(),'bytes':len(html)}
              idx=text.lower().find('buckinghamshire council')
              if idx<0: raise RuntimeError('Buckinghamshire Council not found in catalogue HTML')
              window=text[max(0,idx-3000):idx+6000]
              hrefs=[urljoin(final,h) for h in re.findall(r'href=[\"\']([^\"\']+)[\"\']',window,re.I)]
              scored=sorted(set(((5 if '.gml' in h.lower() else 0)+(2 if 'download' in h.lower() else 0)+(1 if 'inspire' in h.lower() else 0),h) for h in hrefs),reverse=True)
              gml_url=next((h for s,h in scored if s>=5),None)
              if not gml_url:
                  m=re.search(r'Buckinghamshire Council.{0,3000}?href=[\"\']([^\"\']+)[\"\']',text,re.I|re.S)
                  if m:gml_url=urljoin(final,m.group(1))
              result['hmlr']['href_candidates']=[h for s,h in scored[:10]]
              result['hmlr']['selected_url']=gml_url
              if not gml_url: raise RuntimeError('Buckinghamshire GML href not found')
              gs,gf,gc,gml=get(gml_url,timeout=600)
              result['hmlr']['gml']={'url':gml_url,'http_status':gs,'final_url':gf,'content_type':gc,'sha256':hashlib.sha256(gml).hexdigest(),'bytes':len(gml)}
              path='/tmp/buck.gml';open(path,'wb').write(gml)
              def local(t):return t.split('}',1)[-1]
              def pairs(txt):
                  v=[float(x) for x in re.split(r'\s+',txt.strip()) if x];o=[]
                  for i in range(0,len(v)-1,2):
                      a,b=v[i],v[i+1]
                      if 450000<=a<=550000 and 150000<=b<=250000:o.append((a,b))
                      elif 450000<=b<=550000 and 150000<=a<=250000:o.append((b,a))
                      else:o.append((a,b))
                  return o
              def pip(x,y,p):
                  inside=False;j=len(p)-1
                  for i in range(len(p)):
                      xi,yi=p[i];xj,yj=p[j]
                      if ((yi>y)!=(yj>y)) and x<(xj-xi)*(y-yi)/(yj-yi)+xi:inside=not inside
                      j=i
                  return inside
              found={c['fid']:[] for c in candidates}
              for ev,e in ET.iterparse(path,events=('end',)):
                  if local(e.tag).lower() not in ('cadastralparcel','parcel'):continue
                  polys=[]
                  for s in e.iter():
                      if local(s.tag)=='posList' and s.text:
                          p=pairs(s.text)
                          if len(p)>=3:polys.append(p)
                  if not polys:e.clear();continue
                  attrs={'gml_id':e.attrib.get('{http://www.opengis.net/gml/3.2}id') or e.attrib.get('{http://www.opengis.net/gml}id') or e.attrib.get('id')}
                  for s in e.iter():
                      ln=local(s.tag)
                      if ln.lower() in ('localid','namespace','nationalcadastralreference','label','beginlifespanversion') and s.text and len(s.text.strip())<300:attrs[ln]=s.text.strip()
                  for c in candidates:
                      for p in polys:
                          if pip(c['E'],c['N'],p):found[c['fid']].append({'attributes':attrs,'polygon':p});break
                  e.clear()
              for c in candidates:result['candidates'][c['fid']]['hmlr_match']={'E':c['E'],'N':c['N'],'match_count':len(found[c['fid']]),'matches':found[c['fid']][:3]}
          except Exception as e:
              result['hmlr']['error_type']=type(e).__name__;result['hmlr']['error']=str(e)

          summary=json.dumps(result,separators=(',',':'),ensure_ascii=False)
          # GitHub check output summary max is 65535 chars; keep full candidate polygons and bounded parcel matches.
          if len(summary)>64000: summary=summary[:63900]+json.dumps({'truncated':True})
          payload={'name':'bt3-evidence-payload','head_sha':os.environ['GH_SHA'],'status':'completed','conclusion':'success','output':{'title':'BT3 Plan0 exact polygon evidence','summary':summary}}
          api='https://api.github.com/repos/'+os.environ['GH_REPO']+'/check-runs'
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':UA})
          with urllib.request.urlopen(req,timeout=60) as r:
              print('CUSTOM_CHECK_STATUS',r.status)
          PY
