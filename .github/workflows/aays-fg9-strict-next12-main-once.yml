name: AAYS FG9 strict next-12 main one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aays-fg9-strict-next12-main-once.yml']
permissions:
  contents: write
concurrency:
  group: aays-future-growth-9-strict-next12
  cancel-in-progress: false
jobs:
  strict-source-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Mark run started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,path='docs/chatgpt_status/_shared/slots_21/future_growth_9/actions_main_run_next12_status.json'; let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}catch(e){if(e.status!==404)throw e}
            const body={slot_id:'future_growth_9',state:'RUNNING_NEXT12_W115_126',run_id:String(context.runId),head_sha:context.sha,canonical_branch:'codex/aays-single-runner-v5-20260706',executor:'run_strict_next12_w115_126_20260818.py',expected_start:{count:114,window:115}};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark FG9 next-12 w115-126 started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout executor
        uses: actions/checkout@v4
        with:
          ref: agent/aays-fg9-strict-12-20260818-2011-w91-102
          fetch-depth: 1
          path: trigger
      - name: Checkout canonical slot branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
          path: canonical
      - name: Install source runtime
        run: python -m pip install --quiet requests
      - name: Run 12 new bounded windows and verify remote readback
        shell: bash
        run: |
          set +e
          python trigger/docs/chatgpt_status/_shared/slots_21/future_growth_9/automation/run_strict_next12_w115_126_20260818.py 2>&1 | tee fg9-exec.log
          exit ${PIPESTATUS[0]}
      - name: Mark run finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const owner=context.repo.owner,repo=context.repo.repo,path='docs/chatgpt_status/_shared/slots_21/future_growth_9/actions_main_run_next12_status.json'; let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}catch(e){if(e.status!==404)throw e}
            let execution_log_tail=''; try{execution_log_tail=fs.readFileSync('fg9-exec.log','utf8').slice(-20000)}catch(e){}
            const body={slot_id:'future_growth_9',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),head_sha:context.sha,finished_at:new Date().toISOString(),canonical_branch:'codex/aays-single-runner-v5-20260706',executor:'run_strict_next12_w115_126_20260818.py',execution_log_tail};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark FG9 next-12 w115-126 finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
