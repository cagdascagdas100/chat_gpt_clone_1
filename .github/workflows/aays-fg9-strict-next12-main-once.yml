name: AAYS FG9 strict next-12 main one-shot
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aays-fg9-strict-next12-main-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-future-growth-9-strict-next12
  cancel-in-progress: false
jobs:
  strict-source-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Mark run started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/future_growth_9/actions_main_run_next12_status.json';
            let sha;
            try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'future_growth_9',state:'RUNNING',run_id:String(context.runId),run_attempt:String(process.env.GITHUB_RUN_ATTEMPT||''),head_sha:context.sha,started_at:new Date().toISOString(),executor_branch:'agent/aays-fg9-strict-12-20260818-2011-w91-102',canonical_branch:'codex/aays-single-runner-v5-20260706',executor:'run_strict_next12_planning_snapshot_20260818.py',source_family:'planning_data_brownfield_land_frozen_snapshot'};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark FG9 Planning Data snapshot strict next-12 started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - name: Checkout verified FG9 executor
        uses: actions/checkout@v4
        with:
          ref: agent/aays-fg9-strict-12-20260818-2011-w91-102
          fetch-depth: 0
          path: trigger
      - name: Checkout canonical slot branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          path: canonical
      - name: Install source runtime
        run: python -m pip install --quiet requests
      - name: Execute FG9 frozen official snapshot next-12 and verify remote readback
        id: execute
        shell: bash
        run: |
          set +e
          python trigger/docs/chatgpt_status/_shared/slots_21/future_growth_9/automation/run_strict_next12_planning_snapshot_20260818.py 2>&1 | tee fg9-exec.log
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - name: Mark run finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/future_growth_9/actions_main_run_next12_status.json';
            let sha;
            try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            let execution_log_tail='';
            try { execution_log_tail=fs.readFileSync('fg9-exec.log','utf8').slice(-7000); } catch(e) {}
            const body={slot_id:'future_growth_9',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),run_attempt:String(process.env.GITHUB_RUN_ATTEMPT||''),head_sha:context.sha,finished_at:new Date().toISOString(),executor_branch:'agent/aays-fg9-strict-12-20260818-2011-w91-102',canonical_branch:'codex/aays-single-runner-v5-20260706',executor:'run_strict_next12_planning_snapshot_20260818.py',source_family:'planning_data_brownfield_land_frozen_snapshot',execution_log_tail};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark FG9 Planning Data snapshot strict next-12 finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
