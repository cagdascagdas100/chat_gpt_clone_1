name: tmp building_type_9 Barnsley batch 16

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_9_barnsley_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-9-continuation
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'run guarded building_type_9 Barnsley batch 16')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Guard, fetch robust Barnsley OSM tiles, append exactly 50 unseen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-slot-runner'
          git config user.email 'aays-slot-runner@users.noreply.github.com'
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          python3 - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          SLOT = 'building_type_9'
          TASK_ID = 'building-type-9-england-classification-v1-20260808'
          CONT = 'd350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          BEFORE = 750
          BATCH = 16
          TARGET = 800
          CITY = 'Barnsley'
          GRID = 'BARNSLEY_CENTRAL_01'
          BASE_API = 'https://api.openstreetmap.org/api/0.6/map'
          ALT_API = 'https://www.openstreetmap.org/api/0.6/map'
          BBOXES = [
              '-1.5050,53.5350,-1.4800,53.5580',
              '-1.4800,53.5350,-1.4550,53.5580',
              '-1.4550,53.5350,-1.4300,53.5580',
              '-1.4300,53.5350,-1.4050,53.5580',
              '-1.5050,53.5580,-1.4800,53.5810',
              '-1.4800,53.5580,-1.4550,53.5810',
              '-1.4550,53.5580,-1.4300,53.5810',
              '-1.4300,53.5580,-1.4050,53.5810',
              '-1.5050,53.5810,-1.4800,53.6040',
              '-1.4800,53.5810,-1.4550,53.6040',
              '-1.4550,53.5810,-1.4300,53.6040',
              '-1.4300,53.5810,-1.4050,53.6040',
          ]

          shard_path = pathlib.Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          manifest_path = pathlib.Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          runner_path = pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          status_path = pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          checkpoint_path = pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          task_path = pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          task = load(task_path)
          checkpoint = load(checkpoint_path)
          manifest = load(manifest_path)
          status = load(status_path)
          shard = load(shard_path)
          features = shard.get('features') or []

          assert task.get('slot_id') == SLOT, task.get('slot_id')
          assert task.get('task_id') == TASK_ID, task.get('task_id')
          assert task.get('continuation_key') == CONT, task.get('continuation_key')
          assert task.get('owner') is None, f"live owner blocks append: {task.get('owner')}"
          assert task.get('fake_data') is False
          assert checkpoint.get('slot_id') == SLOT
          assert checkpoint.get('current_feature_count') == BEFORE, checkpoint.get('current_feature_count')
          assert checkpoint.get('feature_count_after') == BEFORE, checkpoint.get('feature_count_after')
          assert checkpoint.get('next_batch_index') == BATCH, checkpoint.get('next_batch_index')
          assert checkpoint.get('next_target_feature_count') == TARGET, checkpoint.get('next_target_feature_count')
          assert checkpoint.get('fake_data') is False
          assert checkpoint.get('final_ready') is not True
          assert manifest.get('feature_count', manifest.get('total_features')) == BEFORE
          assert manifest.get('fake_data') is False
          assert manifest.get('final_ready') is not True
          assert status.get('fake_data') is False
          assert status.get('final_ready') is not True
          assert len(features) == BEFORE, len(features)
          assert not any('barnsley' in str(s.get('name','')).lower() for s in manifest.get('sources',[]) if isinstance(s, dict)), 'Barnsley already used'

          already = set()
          identifier_owner = {}
          for index, feature in enumerate(features):
              props = feature.get('properties') or {}
              values = {str(v).strip() for v in (feature.get('id'), props.get('parcel_id'), props.get('osm_id')) if v is not None and str(v).strip()}
              for value in values:
                  other = identifier_owner.get(value)
                  if other is not None and other != index:
                      raise AssertionError(f'preexisting cross-feature identifier duplicate: {value}')
                  identifier_owner[value] = index
                  already.add(value)
          already_count_before = len(already)

          def fetch_url(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'AAYS-building-type-9/1.1 (GitHub Actions; ODbL evidence collection)'})
              last = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=75) as response:
                          raw = response.read()
                      if not raw:
                          raise RuntimeError('empty OSM response')
                      ET.fromstring(raw)
                      return raw, None
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(2 * (attempt + 1))
              return None, last

          raws = []
          successful_urls = []
          failed_tiles = []
          for bbox in BBOXES:
              primary = f'{BASE_API}?bbox={bbox}'
              raw, err = fetch_url(primary)
              used_url = primary
              if raw is None:
                  alternate = f'{ALT_API}?bbox={bbox}'
                  raw, err2 = fetch_url(alternate)
                  used_url = alternate
                  if raw is None:
                      failed_tiles.append({'bbox': bbox, 'primary_error': str(err), 'alternate_error': str(err2)})
                      print(f'WARN OSM tile skipped after retries bbox={bbox} primary={err} alternate={err2}')
                      continue
              raws.append(raw)
              successful_urls.append(used_url)
              time.sleep(0.5)

          if not raws:
              raise SystemExit('OSM_SOURCE_READ_FAILED: no Barnsley OSM tiles succeeded')

          source_material = b'\n--AAYS-TILE--\n'.join(raws)
          source_sha = hashlib.sha256(source_material).hexdigest()
          query_material = '\n'.join(successful_urls)
          query_sha = hashlib.sha256(query_material.encode('utf-8')).hexdigest()

          nodes = {}
          node_tags = {}
          ways = {}
          for raw in raws:
              root = ET.fromstring(raw)
              for node in root.findall('node'):
                  nid = node.attrib['id']
                  nodes[nid] = (float(node.attrib['lon']), float(node.attrib['lat']))
                  tags = {t.attrib['k']: t.attrib.get('v','') for t in node.findall('tag')}
                  if tags:
                      node_tags[nid] = tags
              for way in root.findall('way'):
                  wid = way.attrib['id']
                  tags = {t.attrib['k']: t.attrib.get('v','') for t in way.findall('tag')}
                  refs = [nd.attrib.get('ref') for nd in way.findall('nd') if nd.attrib.get('ref')]
                  ways[wid] = (tags, refs)

          mapping = {
              'apartments': 'residential_apartments',
              'house': 'residential_house',
              'detached': 'residential_detached',
              'semidetached_house': 'residential_semi_detached',
              'terrace': 'residential_other',
              'residential': 'residential_other',
              'commercial': 'commercial_other',
              'retail': 'commercial_retail',
              'supermarket': 'commercial_retail',
              'office': 'office',
              'industrial': 'industrial',
              'warehouse': 'warehouse',
              'hotel': 'hotel_or_hospitality',
              'hospital': 'hospital_or_healthcare',
              'school': 'education',
              'university': 'education',
              'college': 'education',
              'kindergarten': 'education',
              'church': 'religious_or_community',
              'cathedral': 'religious_or_community',
              'mosque': 'religious_or_community',
              'synagogue': 'religious_or_community',
              'temple': 'religious_or_community',
              'civic': 'public_infrastructure',
              'public': 'public_infrastructure',
              'transportation': 'public_infrastructure',
              'train_station': 'public_infrastructure',
          }

          def evidence_excerpt(kind, oid, tags):
              keys = ['building','name','amenity','shop','office','addr:city','addr:postcode','addr:street','addr:housenumber']
              parts = [f'OSM {kind}/{oid}']
              for key in keys:
                  value = tags.get(key)
                  if value:
                      parts.append(f'{key}={value}')
              return ' | '.join(parts)[:600]

          candidates = []
          for nid, tags in node_tags.items():
              raw_type = tags.get('building','')
              primary = mapping.get(raw_type)
              if not primary:
                  continue
              lon, lat = nodes[nid]
              candidates.append(('node', int(nid), lon, lat, tags, primary))

          for wid, (tags, refs) in ways.items():
              raw_type = tags.get('building','')
              primary = mapping.get(raw_type)
              if not primary:
                  continue
              coords = [nodes[r] for r in refs if r in nodes]
              if not coords:
                  continue
              lon = sum(p[0] for p in coords) / len(coords)
              lat = sum(p[1] for p in coords) / len(coords)
              candidates.append(('way', int(wid), lon, lat, tags, primary))

          candidates.sort(key=lambda x: (x[0], x[1]))
          selected = []
          staged_ids = set()
          for kind, oid_int, lon, lat, tags, primary in candidates:
              oid = str(oid_int)
              fid = f'ENG_OSM_{kind}_{oid}'
              parcel_id = fid
              osm_id = f'{kind}/{oid}'
              identifiers = {fid, parcel_id, osm_id}
              if identifiers & already or identifiers & staged_ids:
                  continue
              staged_ids.update(identifiers)
              record = {
                  'id': fid,
                  'parcel_id': parcel_id,
                  'osm_id': osm_id,
                  'building_type_primary': primary,
                  'source': 'OpenStreetMap API 0.6',
                  'source_url': f'https://www.openstreetmap.org/{kind}/{oid}',
                  'source_hash': source_sha,
                  'query_sha256': query_sha,
                  'evidence_excerpt': evidence_excerpt(kind, oid, tags),
                  'evidence_level': 'B',
                  'confidence_level_1_to_4': 3,
                  'match_method': 'osm_explicit_building_tag',
              }
              props = dict(record)
              props.update({
                  'city': CITY,
                  'grid_id': GRID,
                  'confidence': 3,
                  'confidence_score': 0.75,
                  'fake_data': False,
              })
              feature = {
                  'type': 'Feature',
                  'id': fid,
                  'geometry': {'type': 'Point', 'coordinates': [round(lon,7), round(lat,7)]},
                  'properties': props,
              }
              selected.append((feature, record))
              if len(selected) == 50:
                  break

          if len(selected) < 50:
              raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(selected)} unseen explicit semantic building records from {len(successful_urls)} successful tiles; failed_tiles={len(failed_tiles)}')

          new_features = [x[0] for x in selected]
          records = [x[1] for x in selected]
          new_ids = [f['id'] for f in new_features]
          assert len(new_ids) == 50 and len(set(new_ids)) == 50
          for feature in new_features:
              p = feature['properties']
              ids = {str(feature['id']), str(p['parcel_id']), str(p['osm_id'])}
              assert not (ids & already), ids & already

          features.extend(new_features)
          shard['features'] = features
          AFTER = len(features)
          assert AFTER == TARGET and AFTER > BEFORE

          generated_at = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          shard_text = json.dumps(shard, ensure_ascii=False, indent=2) + '\n'
          shard_path.write_text(shard_text, encoding='utf-8')
          geo_sha = hashlib.sha256(shard_text.encode('utf-8')).hexdigest()

          new_types = collections.Counter(r['building_type_primary'] for r in records)
          manifest['generated_at'] = generated_at
          manifest['total_features'] = AFTER
          manifest['feature_count'] = AFTER
          manifest['classified'] = int(manifest.get('classified',0)) + 50
          manifest['unknown'] = int(manifest.get('unknown',0))
          manifest.setdefault('evidence_distribution',{})['B'] = int(manifest.get('evidence_distribution',{}).get('B',0)) + 50
          manifest.setdefault('confidence_level_distribution',{})['3'] = int(manifest.get('confidence_level_distribution',{}).get('3',0)) + 50
          td = manifest.setdefault('type_distribution',{})
          for key, value in new_types.items():
              td[key] = int(td.get(key,0)) + value
          manifest.setdefault('sources',[]).append({
              'name': 'OpenStreetMap API 0.6 - Barnsley batch 16',
              'url': BASE_API,
              'license': 'ODbL 1.0',
              'features_used': 50,
              'accessed_at': generated_at,
              'source_sha256': source_sha,
              'source_hash_method': 'sha256_concatenated_successful_osm_xml_tiles',
              'query_sha256': query_sha,
              'query_urls': successful_urls,
              'failed_tile_count': len(failed_tiles),
              'grid_id': GRID,
              'note': '50 new explicit semantic building=* OSM features from runtime-only XML tiles; native node/derived way-center evidence, not cadastral parcel polygons.'
          })
          manifest['fake_data'] = False
          if 'final_ready' in manifest:
              manifest['final_ready'] = False
          manifest['note'] = 'Existing 750-feature shard preserved; appended 50 Barnsley OSM API semantic building features outside feature.id/parcel_id/osm_id already_processed_ids.'
          manifest['geojson_sha256'] = geo_sha
          manifest['geojson_path'] = str(shard_path)
          manifest['manifest_updated_at'] = generated_at
          manifest['feature_count_before'] = BEFORE
          manifest['feature_count_after'] = AFTER
          manifest['added_feature_count'] = 50
          manifest['last_batch_city'] = CITY
          manifest['last_batch_source'] = 'OpenStreetMap API 0.6 map endpoint'
          manifest['last_batch_source_sha256'] = source_sha
          manifest['last_batch_query_sha256'] = query_sha
          manifest['last_batch_grid'] = GRID
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status['state'] = 'IN_PROGRESS'
          status['updated_at'] = generated_at
          if 'final_ready' in status:
              status['final_ready'] = False
          status['classified_count'] = int(status.get('classified_count',0)) + 50
          status['unknown_count'] = int(status.get('unknown_count',0))
          status['total_elements'] = AFTER
          status.setdefault('confidence_distribution',{})['3'] = int(status.get('confidence_distribution',{}).get('3',0)) + 50
          status.setdefault('evidence_distribution',{})['B'] = int(status.get('evidence_distribution',{}).get('B',0)) + 50
          status['output_sha256'] = geo_sha
          status['note'] = 'Batch 16 appended 50 new Barnsley OSM API semantic building features; no fake rows.'
          status['fake_data'] = False
          status['feature_count_before'] = BEFORE
          status['feature_count_after'] = AFTER
          status['current_feature_count'] = AFTER
          status['next_batch_index'] = 17
          status['next_target_feature_count'] = 850
          status['last_batch_city'] = CITY
          status['last_batch_grid'] = GRID
          status['last_batch_source_sha256'] = source_sha
          status['last_batch_query_sha256'] = query_sha
          status['owner_claim_created'] = False
          status['progress'] = True
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checkpoint['updated_at'] = generated_at
          if 'final_ready' in checkpoint:
              checkpoint['final_ready'] = False
          checkpoint['first_unverified_step_status'] = 'BATCH_016_APPENDED_50_BARNSLEY_OSM_FEATURES_CONTINUATION_REQUIRED'
          checkpoint['state'] = 'IN_PROGRESS'
          checkpoint['feature_count_before'] = BEFORE
          checkpoint['feature_count_after'] = AFTER
          checkpoint['current_feature_count'] = AFTER
          checkpoint['next_batch_index'] = 17
          checkpoint['next_target_feature_count'] = 850
          checkpoint.setdefault('summary',{})['new_features_appended'] = int(checkpoint.get('summary',{}).get('new_features_appended',0)) + 50
          checkpoint['last_processed_ids_sample'] = new_ids[-20:]
          checkpoint['next_required_action'] = 'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION'
          checkpoint['fake_data'] = False
          checkpoint['processed_id_basis'] = ['feature.id','properties.parcel_id','properties.osm_id']
          checkpoint['last_batch'] = {
              'batch_index': BATCH,
              'city': CITY,
              'grid_id': GRID,
              'source': 'OpenStreetMap API 0.6 map endpoint',
              'source_url': BASE_API,
              'source_sha256': source_sha,
              'query_sha256': query_sha,
              'evidence_level': 'B',
              'confidence_level_1_to_4': 3,
              'added_feature_count': 50,
              'new_feature_ids': new_ids,
          }
          checkpoint['next_city_index'] = 17
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runner = {
              'slot_id': SLOT,
              'continuation_key': CONT,
              'batch_index': BATCH,
              'city': CITY,
              'grid_id': GRID,
              'generated_at': generated_at,
              'feature_count_before': BEFORE,
              'feature_count_after': AFTER,
              'added_feature_count': 50,
              'progress': True,
              'already_processed_id_basis': ['feature.id','properties.parcel_id','properties.osm_id'],
              'already_processed_id_count_before': already_count_before,
              'source': 'OpenStreetMap API 0.6 map endpoint',
              'source_url': BASE_API,
              'source_urls': successful_urls,
              'source_sha256': source_sha,
              'query_sha256': query_sha,
              'evidence_level_new_features': {'B': 50},
              'confidence_level_new_features': {'3': 50},
              'new_feature_ids': new_ids,
              'records': records,
              'fake_data': False,
              'owner_claim_created': False,
              'raw_source_committed': False,
              'failed_source_tiles': failed_tiles,
              'limitation': 'OSM feature identities with native node or vertex-derived way-center geometry; not cadastral parcel polygons. EPC/VOA/HMLR corroboration remains optional/pending.'
          }
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert len(load(shard_path).get('features') or []) == AFTER
          assert load(manifest_path).get('feature_count') == AFTER
          assert load(status_path).get('feature_count_after') == AFTER
          assert load(checkpoint_path).get('current_feature_count') == AFTER
          assert load(runner_path).get('added_feature_count') == 50
          print(json.dumps({'before': BEFORE, 'after': AFTER, 'added': 50, 'already_processed_ids': already_count_before, 'successful_tiles': len(successful_urls), 'failed_tiles': len(failed_tiles), 'source_sha256': source_sha, 'query_sha256': query_sha, 'new_types': dict(new_types)}, sort_keys=True))
          PY

      - name: Validate permanent outputs, self-delete workflow, commit and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          GEO=Path('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          MAN=Path('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          STA=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          CP=Path('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          RUN=Path('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          geo=json.loads(GEO.read_text())
          man=json.loads(MAN.read_text())
          sta=json.loads(STA.read_text())
          cp=json.loads(CP.read_text())
          run=json.loads(RUN.read_text())
          feats=geo.get('features') or []
          assert len(feats)==800, len(feats)
          assert man.get('feature_count')==800 and man.get('feature_count_before')==750 and man.get('feature_count_after')==800
          assert sta.get('feature_count_before')==750 and sta.get('feature_count_after')==800 and sta.get('current_feature_count')==800
          assert cp.get('current_feature_count')==800 and cp.get('next_batch_index')==17 and cp.get('next_target_feature_count')==850
          assert run.get('feature_count_before')==750 and run.get('feature_count_after')==800 and run.get('added_feature_count')==50
          assert run.get('progress') is True and run.get('fake_data') is False and run.get('raw_source_committed') is False
          assert len(run.get('records') or [])==50
          for r in run.get('records') or []:
              assert r.get('source_url') and r.get('source_hash') and r.get('query_sha256')
              assert r.get('evidence_excerpt') and r.get('evidence_level')=='B'
              assert r.get('confidence_level_1_to_4')==3
              assert r.get('match_method')=='osm_explicit_building_tag'
          owner={}
          for idx,f in enumerate(feats):
              p=f.get('properties') or {}
              values={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v not in (None,'')}
              for v in values:
                  if v in owner and owner[v] != idx:
                      raise AssertionError(f'duplicate identifier across features {v}')
                  owner[v]=idx
          assert all(x.get('fake_data') is False for x in (man,sta,cp,run))
          assert all(x.get('final_ready') is not True for x in (man,sta,cp,run))
          assert 'PUBLISHED' not in json.dumps([man,sta,cp,run])
          print('validated Barnsley 750->800 +50 evidence-backed rows')
          PY

          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_9_barnsley_20260810.yml'
          git add england_map_web/data/building_type/shards/building_type_9_latest.geojson
          git add england_map_web/data/building_type/shards/building_type_9_manifest_latest.json
          git add -f docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json
          git add -f docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json
          git add -f docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json
          git rm -f "$WF"
          git diff --cached --quiet && { echo 'No staged progress'; exit 1; }
          git commit -m 'building_type_9: append batch 16 Barnsley OSM API features'
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify remote slot9 readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          python3 - <<'PY'
          import json, subprocess
          branch='origin/codex/aays-single-runner-v5-20260706'
          paths={
            'geo':'england_map_web/data/building_type/shards/building_type_9_latest.geojson',
            'manifest':'england_map_web/data/building_type/shards/building_type_9_manifest_latest.json',
