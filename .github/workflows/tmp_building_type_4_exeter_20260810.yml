name: tmp building_type_4 Exeter batch

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_4_exeter_20260810.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 Exeter FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import hashlib
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          slot_id = "building_type_4"
          task_id_expected = "building-type-4-england-classification-v1-20260808"
          expected_before = 300
          expected_target = 350
          batch_city = "Exeter"
          source_name = "Food Standards Agency FHRS daily open data - Exeter City"
          source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS073en-GB.xml"

          shard_path = Path("england_map_web/data/building_type/shards/building_type_4_latest.geojson")
          manifest_path = Path("england_map_web/data/building_type/shards/building_type_4_manifest_latest.json")
          checkpoint_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json")
          status_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json")
          task_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json")
          runner_path = Path("docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json")

          shard = json.loads(shard_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))
          features = shard.get("features", [])
          before = len(features)

          assert task.get("slot_id") == slot_id, "wrong slot"
          assert task.get("task_id") == task_id_expected, "task changed"
          assert task.get("owner") is None, "current_task owner is not null; refusing second owner/task"
          assert task.get("state") == "READY", "current_task is not READY"
          assert before == expected_before, f"stale shard count {before} != {expected_before}"
          assert int(checkpoint.get("current_feature_count", -1)) == before, "checkpoint/shard count mismatch"
          assert int(checkpoint.get("next_target_feature_count", -1)) == expected_target, "target changed"
          assert manifest.get("fake_data") is False and checkpoint.get("fake_data") is False and status.get("fake_data") is False, "fake_data guard"
          assert manifest.get("final_ready") is False and checkpoint.get("final_ready") is False and status.get("final_ready") is False, "final_ready guard"

          processed = set()
          for feat in features:
              props = feat.get("properties") or {}
              for value in (feat.get("id"), props.get("parcel_id"), props.get("osm_id")):
                  if value is not None and str(value).strip():
                      processed.add(str(value).strip())

          req = urllib.request.Request(source_url, headers={"User-Agent": "AAYS-building-type/1.0"})
          with urllib.request.urlopen(req, timeout=90) as response:
              raw = response.read()
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def text(el, wanted):
              for child in el.iter():
                  if local(child.tag) == wanted:
                      return (child.text or "").strip()
              return ""

          def classify(business_type):
              b = business_type.strip().lower()
              if "school" in b or "college" in b or "university" in b:
                  return "education", "P_EDUCATION", "institutional"
              if "hospital" in b or "caring" in b or "childcare" in b:
                  return "healthcare_care", "P_HEALTHCARE", "institutional"
              if "hotel" in b or "bed & breakfast" in b or "guest house" in b:
                  return "hotel_or_hospitality", "C_HOTEL", "commercial"
              if "pub" in b or "bar" in b or "nightclub" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "restaurant" in b or "cafe" in b or "canteen" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "takeaway" in b or "sandwich" in b:
                  return "commercial_hospitality", "C_TAKEAWAY", "commercial"
              if "retailer" in b or "supermarket" in b or "hypermarket" in b:
                  return "commercial_retail", "C_RETAIL", "commercial"
              if "distributor" in b or "transporter" in b:
                  return "warehouse", "C_LOGISTICS", "commercial"
              if "manufacturer" in b or "packer" in b:
                  return "industrial", "I_MANUFACTURING", "industrial"
              return "commercial_other", "C_OTHER", "commercial"

          candidates = []
          for el in root.iter():
              if local(el.tag) != "EstablishmentDetail":
                  continue
              fhrsid = text(el, "FHRSID")
              if not fhrsid:
                  continue
              feature_id = f"EXE_FHRS_{fhrsid}"
              parcel_id = f"EXE_FHRSID_{fhrsid}"
              if feature_id in processed or parcel_id in processed or fhrsid in processed:
                  continue
              local_authority = text(el, "LocalAuthorityName")
              if local_authority and "exeter" not in local_authority.lower():
                  continue
              business_type = text(el, "BusinessType")
              if not business_type or "mobile caterer" in business_type.lower():
                  continue
              try:
                  lat = float(text(el, "Latitude"))
                  lon = float(text(el, "Longitude"))
              except (TypeError, ValueError):
                  continue
              if not (49.0 <= lat <= 61.0 and -9.0 <= lon <= 3.0):
                  continue
              candidates.append((int(fhrsid) if fhrsid.isdigit() else 10**18, fhrsid, el, lat, lon))

          candidates.sort(key=lambda item: (item[0], item[1]))
          assert len(candidates) >= 50, f"only {len(candidates)} eligible Exeter FHRS candidates"

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          new_features = []
          new_ids = []
          records = []
          for _, fhrsid, el, lat, lon in candidates[:50]:
              feature_id = f"EXE_FHRS_{fhrsid}"
              parcel_id = f"EXE_FHRSID_{fhrsid}"
              business_name = text(el, "BusinessName")
              business_type = text(el, "BusinessType")
              business_type_id = text(el, "BusinessTypeID")
              local_business_id = text(el, "LocalAuthorityBusinessID")
              local_authority = text(el, "LocalAuthorityName") or "Exeter City"
              postcode = text(el, "PostCode")
              rating = text(el, "RatingValue")
              rating_date = text(el, "RatingDate")
              primary, code, category = classify(business_type)
              excerpt = f"FHRSID {fhrsid} | {business_name} | BusinessType {business_type} | LocalAuthority {local_authority} | PostCode {postcode}"
              props = {
                  "parcel_id": parcel_id,
                  "parcel_id_semantics": "stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": None,
                  "slot_id": slot_id,
                  "region": "South West",
                  "area": batch_city,
                  "local_authority": local_authority,
                  "postcode": postcode,
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": 0.55,
                  "confidence_level_1_to_4": 2,
                  "evidence_level": "D",
                  "source_count": 1,
                  "source": source_name,
                  "source_url": source_url,
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "match_method": "fhrs_business_type_premises_proxy",
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": hashlib.sha256(excerpt.encode("utf-8")).hexdigest(),
                  "source_evidence_excerpt": {
                      "FHRSID": fhrsid,
                      "BusinessName": business_name,
                      "BusinessType": business_type,
                      "BusinessTypeID": business_type_id,
                      "LocalAuthorityBusinessID": local_business_id,
                      "LocalAuthorityName": local_authority,
                      "PostCode": postcode,
                      "RatingValue": rating,
                      "RatingDate": rating_date
                  },
                  "sources": [{
                      "source_name": "Food Standards Agency FHRS daily open data",
                      "url_or_local_path": source_url,
                      "accessed_at": now,
                      "sha256": source_sha,
                      "sha256_scope": "raw_source_xml",
                      "licence": "Open Government Licence v3.0",
                      "granularity": "food_business_establishment",
                      "fields_used": ["FHRSID", "BusinessName", "BusinessType", "BusinessTypeID", "LocalAuthorityBusinessID", "LocalAuthorityName", "PostCode", "Latitude", "Longitude"],
                      "supports_field": "building_type_primary",
                      "match_method": "fhrs_business_type_premises_proxy",
                      "match_score": 0.55
                  }],
                  "geometry_match_method": "fhrs_geocode_point",
                  "address_match_method": "fhrs_business_address",
                  "limitations": "FHRS BusinessType is a premises-use proxy; it does not prove cadastral parcel identity, exact building fabric, or residential subtype.",
                  "needs_manual_review": True,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": now,
                  "feature_id": feature_id
              }
              feature = {
                  "type": "Feature",
                  "id": feature_id,
                  "geometry": {"type": "Point", "coordinates": [lon, lat]},
                  "properties": props
              }
              new_features.append(feature)
              new_ids.append(feature_id)
              records.append({**props, "geometry": feature["geometry"]})

          assert len(new_features) == 50
          assert len(set(new_ids)) == 50
          assert not (set(new_ids) & processed), "feature.id collision"
          for feature in new_features:
              props = feature["properties"]
              assert str(props["parcel_id"]) not in processed, "parcel_id collision"
              assert props["osm_id"] is None
              assert props["fake_data"] is False and props["final_ready"] is False
              assert props["evidence_excerpt"] and props["evidence_level"] == "D"
              assert props["confidence_level_1_to_4"] == 2

          shard["features"] = features + new_features
          after = len(shard["features"])
          assert after == before + 50 and after > before
          shard_path.write_text(json.dumps(shard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          output_sha = hashlib.sha256(shard_path.read_bytes()).hexdigest()

          all_props = [(feature.get("properties") or {}) for feature in shard["features"]]
          evidence_distribution = Counter(str(props.get("evidence_level") or "U") for props in all_props)
          confidence_distribution = Counter(str(props.get("confidence_level_1_to_4") or 1) for props in all_props)
          type_distribution = Counter(str(props.get("building_type_primary") or "unknown") for props in all_props)
          unknown = type_distribution.get("unknown", 0)
          classified = after - unknown

          source_entry = {
              "name": source_name,
              "url": source_url,
              "license": "Open Government Licence v3.0",
              "features_used": 50,
              "accessed_at": now,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "note": "FHRS BusinessType is a premises-use proxy; not cadastral parcel geometry."
          }
          manifest_sources = manifest.get("sources") or []
          manifest_sources = [item for item in manifest_sources if item.get("url") != source_url]
          manifest_sources.append(source_entry)
          manifest.update({
              "generated_at": now,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": {key: evidence_distribution.get(key, 0) for key in ["A", "B", "C", "D", "U"]},
              "type_distribution": dict(sorted(type_distribution.items())),
              "confidence_level_distribution": {key: confidence_distribution.get(key, 0) for key in ["1", "2", "3", "4"]},
              "sources": manifest_sources,
              "fake_data": False,
              "final_ready": False,
              "note": "Existing 300-feature shard preserved; appended 50 Exeter City FHRS premises-use proxy records outside feature.id/parcel_id/osm_id already_processed_ids.",
              "feature_count": after,
              "geojson_sha256": output_sha,
              "geojson_path": str(shard_path),
              "manifest_updated_at": now,
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": 50,
              "last_batch_city": batch_city,
              "last_batch_source": source_name,
              "last_batch_source_sha256": source_sha
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          batch_index = int(checkpoint.get("next_batch_index", 7))
          next_city_index = int(checkpoint.get("next_city_index", 0)) + 1
          checkpoint.update({
              "updated_at": now,
              "state": "IN_PROGRESS",
              "first_unverified_step_status": "BATCH_APPENDED_50_EXETER_FHRS_PROXY_CONTINUATION_REQUIRED",
              "final_ready": False,
              "fake_data": False,
              "feature_count_before": before,
              "feature_count_after": after,
              "current_feature_count": after,
              "next_batch_index": batch_index + 1,
              "next_city_index": next_city_index,
              "next_target_feature_count": after + 50,
              "last_processed_ids_sample": new_ids[-20:],
              "processed_id_basis": ["feature.id", "properties.parcel_id", "properties.osm_id"],
              "last_batch": {
                  "batch_index": batch_index,
                  "city": batch_city,
                  "source": source_name,
                  "source_url": source_url,
                  "source_sha256": source_sha,
                  "evidence_level": "D",
                  "confidence_level_1_to_4": 2,
                  "added_feature_count": 50,
                  "new_feature_ids": new_ids
              },
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE AND PARCEL BINDING"
          })
          checkpoint.setdefault("summary", {})["new_slot"] = False
          checkpoint["summary"]["new_features_appended"] = 50
          checkpoint["summary"]["current_feature_count"] = after
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          status.update({
              "state": "IN_PROGRESS",
              "updated_at": now,
              "final_ready": False,
              "fake_data": False,
              "classified_count": classified,
              "unknown_count": unknown,
              "total_elements": after,
              "confidence_distribution": {key: confidence_distribution.get(key, 0) for key in ["1", "2", "3", "4"]},
              "evidence_distribution": {key: evidence_distribution.get(key, 0) for key in ["A", "B", "C", "D", "U"]},
              "output_sha256": output_sha,
              "feature_count_before": before,
              "feature_count_after": after,
              "last_batch_city": batch_city,
              "last_batch_source": source_name,
              "note": "Added 50 Exeter City FHRS D-level premises-use proxy records; no new task/owner created. Continue append-only; EPC/VOA/HMLR/OSM corroboration remains pending."
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          runner = {
              "slot_id": slot_id,
              "task_id": task["task_id"],
              "generated_at": now,
              "batch_index": batch_index,
              "city": batch_city,
              "source_name": source_name,
              "source_url": source_url,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "processed_id_basis": ["feature.id", "properties.parcel_id", "properties.osm_id"],
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": 50,
              "evidence_level": "D",
              "confidence_level_1_to_4": 2,
              "classification_semantics": "premises_use_proxy_not_cadastral_building_fabric",
              "records": records,
              "fake_data": False,
              "final_ready": False
          }
          runner_path.parent.mkdir(parents=True, exist_ok=True)
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(json.dumps({
              "before": before,
              "after": after,
              "added": 50,
              "eligible_candidates": len(candidates),
              "source_sha256": source_sha,
              "current_task_owner": task.get("owner")
          }, ensure_ascii=False))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_4_latest.geojson \
            england_map_web/data/building_type/shards/building_type_4_manifest_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json
          git diff --cached --quiet && { echo "No feature-count progress; refusing commit"; exit 1; } || true
          git commit -m "building_type_4 append Exeter FHRS batch"
          git push origin HEAD:codex/aays-single-runner-v5-20260706
