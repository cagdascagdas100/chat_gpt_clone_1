name: tmp building_type_9 Newcastle batch 6

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_9_newcastle_20260810.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Fast-forward to current branch head
        run: |
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Append 50 evidence-backed Newcastle OSM features
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          import time

          SLOT = "building_type_9"
          CONTINUATION_KEY = "d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512"
          EXPECTED_BEFORE = 250
          EXPECTED_BATCH = 6
          EXPECTED_TARGET = 300
          CITY = "Newcastle upon Tyne"
          GRID = "NCL_CENTRAL_01"
          BRANCH = "codex/aays-single-runner-v5-20260706"
          ROOT = pathlib.Path('.')
          SHARD = ROOT / "england_map_web/data/building_type/shards/building_type_9_latest.geojson"
          MANIFEST = ROOT / "england_map_web/data/building_type/shards/building_type_9_manifest_latest.json"
          CHECKPOINT = ROOT / "docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json"
          STATUS = ROOT / "docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json"
          CURRENT = ROOT / "docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json"
          RUNNER = ROOT / "docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json"
          allowed_paths = {str(SHARD), str(MANIFEST), str(CHECKPOINT), str(STATUS), str(RUNNER)}

          geo = json.loads(SHARD.read_text(encoding='utf-8'))
          checkpoint = json.loads(CHECKPOINT.read_text(encoding='utf-8'))
          current = json.loads(CURRENT.read_text(encoding='utf-8'))
          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          status = json.loads(STATUS.read_text(encoding='utf-8'))

          assert current.get('slot_id') == SLOT
          assert current.get('continuation_key') == CONTINUATION_KEY
          assert current.get('owner') is None, f"current task owner changed: {current.get('owner')}"
          assert checkpoint.get('current_feature_count') == EXPECTED_BEFORE, checkpoint.get('current_feature_count')
          assert checkpoint.get('next_batch_index') == EXPECTED_BATCH, checkpoint.get('next_batch_index')
          assert checkpoint.get('next_target_feature_count') == EXPECTED_TARGET, checkpoint.get('next_target_feature_count')
          assert checkpoint.get('fake_data') is False
          assert checkpoint.get('final_ready') is False
          assert len(geo.get('features', [])) == EXPECTED_BEFORE, len(geo.get('features', []))

          # Canonical already_processed_ids: feature.id + properties.parcel_id + properties.osm_id.
          already = set()
          for f in geo['features']:
              for v in (f.get('id'), (f.get('properties') or {}).get('parcel_id'), (f.get('properties') or {}).get('osm_id')):
                  if v is not None and str(v).strip():
                      already.add(str(v))

          semantic = (
              "apartments|house|detached|semidetached_house|terrace|residential|"
              "commercial|retail|supermarket|office|industrial|warehouse|hotel|hospital|"
              "school|university|college|kindergarten|church|cathedral|mosque|synagogue|temple|"
              "civic|public|transportation|train_station"
          )
          # Newcastle central/inner-city grid; raw response is runtime-only and never written to the repo.
          query = f'''[out:json][timeout:120];
          (
            nwr["building"~"^({semantic})$"](54.9300,-1.7200,55.0500,-1.5000);
          );
          out center tags 1500;'''
          query_sha = hashlib.sha256(query.encode('utf-8')).hexdigest()
          endpoints = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
          ]
          raw = None
          used_endpoint = None
          errors = []
          for endpoint in endpoints:
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(
                          endpoint,
                          data=urllib.parse.urlencode({'data': query}).encode('utf-8'),
                          headers={'User-Agent': 'TerraYield-AAYS-building_type_9/2026-08-10', 'Accept': 'application/json'},
                          method='POST',
                      )
                      with urllib.request.urlopen(req, timeout=150) as resp:
                          candidate = resp.read()
                      parsed = json.loads(candidate.decode('utf-8'))
                      if not isinstance(parsed.get('elements'), list):
                          raise RuntimeError('Overpass payload missing elements')
                      raw = candidate
                      data = parsed
                      used_endpoint = endpoint
                      break
                  except Exception as exc:
                      errors.append(f"{endpoint} attempt {attempt+1}: {type(exc).__name__}: {exc}")
                      time.sleep(3)
              if raw is not None:
                  break
          if raw is None:
              raise RuntimeError('All Overpass endpoints failed: ' + ' | '.join(errors))

          source_sha = hashlib.sha256(raw).hexdigest()
          accessed = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          mapping = {
              'apartments': ('residential_apartments','R_APART','residential'),
              'house': ('residential_house','R_HOUSE','residential'),
              'detached': ('residential_detached','R_DETACHED','residential'),
              'semidetached_house': ('residential_semi_detached','R_SEMI','residential'),
              'terrace': ('residential_other','R_OTHER','residential'),
              'residential': ('residential_other','R_OTHER','residential'),
              'commercial': ('commercial_other','C_OTHER','commercial'),
              'retail': ('commercial_retail','C_RETAIL','commercial'),
              'supermarket': ('commercial_retail','C_RETAIL','commercial'),
              'office': ('office','C_OFFICE','commercial'),
              'industrial': ('industrial','I_INDUSTRIAL','industrial'),
              'warehouse': ('warehouse','I_WAREHOUSE','industrial'),
              'hotel': ('hotel_or_hospitality','C_HOTEL','commercial'),
              'hospital': ('hospital_or_healthcare','P_HEALTH','institutional'),
              'school': ('education','P_EDUCATION','institutional'),
              'university': ('education','P_EDUCATION','institutional'),
              'college': ('education','P_EDUCATION','institutional'),
              'kindergarten': ('education','P_EDUCATION','institutional'),
              'church': ('religious_or_community','P_RELIGIOUS','institutional'),
              'cathedral': ('religious_or_community','P_RELIGIOUS','institutional'),
              'mosque': ('religious_or_community','P_RELIGIOUS','institutional'),
              'synagogue': ('religious_or_community','P_RELIGIOUS','institutional'),
              'temple': ('religious_or_community','P_RELIGIOUS','institutional'),
              'civic': ('public_infrastructure','P_INFRA','institutional'),
              'public': ('public_infrastructure','P_INFRA','institutional'),
              'transportation': ('public_infrastructure','P_INFRA','institutional'),
              'train_station': ('public_infrastructure','P_INFRA','institutional'),
          }

          candidates = []
          for e in data['elements']:
              typ = e.get('type')
              oid = e.get('id')
              tags = e.get('tags') or {}
              b = tags.get('building')
              if typ not in {'node','way','relation'} or oid is None or b not in mapping:
                  continue
              fid = f"ENG_OSM_{typ}_{oid}"
              osmid = f"{typ}/{oid}"
              parcel = fid
              if fid in already or parcel in already or osmid in already:
                  continue
              if typ == 'node':
                  lat, lon = e.get('lat'), e.get('lon')
              else:
                  center = e.get('center') or {}
                  lat, lon = center.get('lat'), center.get('lon')
              if lat is None or lon is None:
                  continue
              candidates.append((str(typ), int(oid), e, float(lon), float(lat)))
          candidates.sort(key=lambda x: (x[0], x[1]))
          if len(candidates) < 50:
              raise RuntimeError(f"Only {len(candidates)} eligible new explicit-building OSM features after already_processed_ids exclusion")

          new_features = []
          for typ, oid, e, lon, lat in candidates[:50]:
              tags = e.get('tags') or {}
              b = tags['building']
              primary, code, category = mapping[b]
              fid = f"ENG_OSM_{typ}_{oid}"
              osmid = f"{typ}/{oid}"
              source_url = f"https://www.openstreetmap.org/{typ}/{oid}"
              excerpt_parts = [f"OSM {osmid}", f"building={b}"]
              for k in ('name','addr:city','addr:postcode','addr:street','addr:housenumber'):
                  if tags.get(k):
                      excerpt_parts.append(f"{k}={tags[k]}")
              excerpt = ' | '.join(excerpt_parts)
              evidence_tags = {k: tags[k] for k in ('building','name','addr:city','addr:postcode','addr:street','addr:housenumber') if tags.get(k)}
              props = {
                  'parcel_id': fid,
                  'parcel_id_semantics': 'OSM feature identity used as slot record key; not a cadastral parcel ID',
                  'osm_id': osmid,
                  'slot_id': SLOT,
                  'region': 'Yorkshire & North East',
                  'area': CITY,
                  'local_authority': CITY,
                  'grid_id': GRID,
                  'postcode': tags.get('addr:postcode',''),
                  'building_type_primary': primary,
                  'building_type_code': code,
                  'building_category': category,
                  'confidence_score': 0.75,
                  'confidence_level_1_to_4': 3,
                  'evidence_level': 'B',
                  'source_count': 1,
                  'source': 'OpenStreetMap via Overpass API',
                  'source_url': source_url,
                  'source_hash': source_sha,
                  'source_hash_method': 'sha256_raw_overpass_json',
                  'query_sha256': query_sha,
                  'match_method': 'osm_explicit_building_tag',
                  'evidence_excerpt': excerpt,
                  'evidence_excerpt_sha256': hashlib.sha256(excerpt.encode('utf-8')).hexdigest(),
                  'source_evidence_excerpt': evidence_tags,
                  'osm_tags_summary': evidence_tags,
                  'sources': [{
                      'source_name': 'OpenStreetMap Overpass API',
                      'url_or_local_path': used_endpoint,
                      'object_url': source_url,
                      'accessed_at': accessed,
                      'licence': 'ODbL 1.0',
                      'granularity': 'OSM feature point/native center',
                      'fields_used': list(evidence_tags.keys()),
                      'supports_field': 'building_type_primary',
                      'match_method': 'osm_explicit_building_tag',
                      'match_score': 0.75,
                      'source_sha256': source_sha,
                      'query_sha256': query_sha,
                  }],
                  'building_type_secondary': '',
                  'geometry_match_method': 'osm_native_or_center_point',
                  'address_match_method': 'osm_address_tags_if_present',
                  'limitations': 'OSM building tag and OSM point/center are direct feature evidence but are not a cadastral parcel boundary; EPC/VOA/HMLR corroboration not yet applied.',
                  'needs_manual_review': False,
                  'fake_data': False,
                  'final_ready': False,
                  'updated_at': accessed,
                  'feature_id': fid,
              }
              new_features.append({'type':'Feature','id':fid,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props})

          # Re-check all three ID namespaces against canonical existing rows and within the new batch.
          seen = set(already)
          for f in new_features:
              vals = [f['id'], f['properties']['parcel_id'], f['properties']['osm_id']]
              for v in vals:
                  if v in seen:
                      raise RuntimeError(f'duplicate already_processed_id: {v}')
              seen.update(vals)
              p = f['properties']
              assert p['evidence_excerpt'] and p['evidence_level'] == 'B' and p['confidence_level_1_to_4'] == 3
              assert p['fake_data'] is False and p['final_ready'] is False

          before = len(geo['features'])
          geo['features'].extend(new_features)
          after = len(geo['features'])
          assert before == EXPECTED_BEFORE and after == EXPECTED_TARGET and after > before
          SHARD.write_text(json.dumps(geo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          geo_sha = hashlib.sha256(SHARD.read_bytes()).hexdigest()

          # Recompute distributions from canonical shard rather than incrementing stale counters.
          ev = collections.Counter()
          conf = collections.Counter()
          types = collections.Counter()
          for f in geo['features']:
              p = f.get('properties') or {}
              ev[str(p.get('evidence_level','U'))] += 1
              conf[str(p.get('confidence_level_1_to_4',1))] += 1
              types[str(p.get('building_type_primary','unknown'))] += 1
          unknown = types.get('unknown', 0)

          manifest.update({
              'generated_at': accessed,
              'total_features': after,
              'classified': after - unknown,
              'unknown': unknown,
              'evidence_distribution': dict(sorted(ev.items())),
              'type_distribution': dict(sorted(types.items())),
              'confidence_level_distribution': dict(sorted(conf.items())),
              'fake_data': False,
              'final_ready': False,
              'note': f'Existing {before}-feature shard preserved; appended 50 Newcastle upon Tyne OSM semantic building features outside feature.id/parcel_id/osm_id already_processed_ids.',
              'feature_count': after,
              'geojson_sha256': geo_sha,
              'geojson_path': str(SHARD),
              'manifest_updated_at': accessed,
              'feature_count_before': before,
              'feature_count_after': after,
              'added_feature_count': 50,
              'last_batch_city': CITY,
              'last_batch_grid': GRID,
              'last_batch_source': 'OpenStreetMap Overpass API',
              'last_batch_source_sha256': source_sha,
              'last_batch_query_sha256': query_sha,
          })
          sources = manifest.setdefault('sources', [])
          sources.append({
              'name': 'OpenStreetMap Overpass API - Newcastle upon Tyne batch 6',
              'url': used_endpoint,
              'license': 'ODbL 1.0',
              'features_used': 50,
              'accessed_at': accessed,
              'source_sha256': source_sha,
              'source_hash_method': 'sha256_raw_overpass_json',
              'query_sha256': query_sha,
              'grid_id': GRID,
              'note': '50 new explicit semantic building=* OSM features; native point/center evidence, not cadastral parcel polygons.'
          })
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checkpoint.update({
              'updated_at': accessed,
              'first_unverified_step_status': 'BATCH_006_APPENDED_50_NEWCASTLE_OSM_FEATURES_CONTINUATION_REQUIRED',
              'final_ready': False,
              'state': 'IN_PROGRESS',
              'feature_count_before': before,
              'feature_count_after': after,
              'current_feature_count': after,
              'next_batch_index': 7,
              'next_target_feature_count': 350,
              'next_required_action': 'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION',
              'fake_data': False,
              'processed_id_basis': ['feature.id','properties.parcel_id','properties.osm_id'],
              'last_processed_ids_sample': [f['id'] for f in new_features[-20:]],
              'last_batch': {
                  'batch_index': EXPECTED_BATCH,
                  'city': CITY,
                  'grid_id': GRID,
                  'source': 'OpenStreetMap Overpass API',
                  'source_url': used_endpoint,
                  'source_sha256': source_sha,
                  'query_sha256': query_sha,
                  'evidence_level': 'B',
                  'confidence_level_1_to_4': 3,
                  'added_feature_count': 50,
                  'new_feature_ids': [f['id'] for f in new_features],
              },
          })
          checkpoint.setdefault('summary', {})['new_features_appended'] = int(checkpoint.get('summary',{}).get('new_features_appended',0)) + 50
          CHECKPOINT.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Preserve any historical status owner value; do not create/claim a new owner.
          status.update({
              'updated_at': accessed,
              'state': 'IN_PROGRESS',
              'feature_count_before': before,
              'feature_count_after': after,
              'current_feature_count': after,
              'next_batch_index': 7,
              'next_target_feature_count': 350,
              'last_batch_city': CITY,
              'last_batch_grid': GRID,
              'last_batch_source_sha256': source_sha,
              'last_batch_query_sha256': query_sha,
              'fake_data': False,
              'final_ready': False,
              'owner_claim_created': False,
              'progress': True,
          })
          STATUS.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runner = {
              'slot_id': SLOT,
              'continuation_key': CONTINUATION_KEY,
              'batch_index': EXPECTED_BATCH,
              'city': CITY,
              'grid_id': GRID,
              'generated_at': accessed,
              'feature_count_before': before,
              'feature_count_after': after,
              'added_feature_count': 50,
              'progress': after > before,
              'already_processed_id_basis': ['feature.id','properties.parcel_id','properties.osm_id'],
              'already_processed_id_count_before': len(already),
              'source': 'OpenStreetMap Overpass API',
              'source_url': used_endpoint,
              'source_sha256': source_sha,
              'query_sha256': query_sha,
              'evidence_level_new_features': {'B': 50},
              'confidence_level_new_features': {'3': 50},
              'new_feature_ids': [f['id'] for f in new_features],
              'fake_data': False,
              'final_ready': False,
              'published': False,
              'owner_claim_created': False,
              'raw_source_committed': False,
              'limitations': 'New rows are OSM feature identities/centers, not cadastral parcel polygons; EPC/VOA/HMLR corroboration remains optional pending work.'
          }
          RUNNER.parent.mkdir(parents=True, exist_ok=True)
          RUNNER.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Only own slot derived/state paths may have changed.
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed_paths
          if unexpected:
              raise RuntimeError(f'unexpected changed paths: {sorted(unexpected)}')
          if changed != allowed_paths:
              missing = allowed_paths - changed
              raise RuntimeError(f'expected output paths not all changed: missing={sorted(missing)} changed={sorted(changed)}')
          print(json.dumps({'before':before,'after':after,'added':50,'city':CITY,'grid':GRID,'source_sha256':source_sha,'query_sha256':query_sha,'endpoint':used_endpoint,'already_processed_id_count':len(already)}, indent=2))
          PY
      - name: Commit and push append-only outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AAYS building_type_9 continuation"
          git config user.email "aays-building-type-9@local.invalid"
          git add \
            england_map_web/data/building_type/shards/building_type_9_latest.geojson \
            england_map_web/data/building_type/shards/building_type_9_manifest_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json
          git diff --cached --quiet && { echo "No staged progress"; exit 1; }
          git commit -m "building_type_9: append batch 6 Newcastle OSM features"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git rebase origin/codex/aays-single-runner-v5-20260706; then
              git rebase --abort || true
              echo "Rebase conflict; refusing cross-slot overwrite"
              exit 1
            fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              echo "push successful"
              exit 0
            fi
            sleep 2
          done
          echo "push failed after retries"
          exit 1
