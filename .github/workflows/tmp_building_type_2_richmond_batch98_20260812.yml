name: tmp building_type_2 Richmond-Upon-Thames FHRS continuation batch 98

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_richmond_batch98_20260812.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new Richmond-Upon-Thames FHRS features
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:.github/workflows/tmp_building_type_2_bexley_batch38_20260810.yml > /tmp/template.yml
          python3 <<'PY'
          from pathlib import Path
          text=Path('/tmp/template.yml').read_text(encoding='utf-8')
          anchor='      - name: Append exactly 50 new Bexley FHRS continuation features'
          marker="          python3 <<'PY'\n"
          a=text.index(anchor); start=text.index(marker,a)+len(marker); end=text.index("\n          PY",start)
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())+'\n'
          replacements=[
            ('CITY="Bexley"; PREFIX="BEXLEY"; REGION="London Outer"','CITY="Richmond-Upon-Thames"; PREFIX=""; REGION="London Outer"'),
            ('Food Standards Agency FHRS daily open data - Bexley','Food Standards Agency FHRS daily open data - Richmond-Upon-Thames'),
            ('FHRS503en-GB.xml','FHRS527en-GB.xml'),
            ('BEFORE=1850; TARGET=1900; BATCH=38; NEXT_BATCH=39; NEXT_TARGET=1950','BEFORE=4850; TARGET=4900; BATCH=98; NEXT_BATCH=99; NEXT_TARGET=4950'),
            ('authority.lower()!="bexley"','not ("richmond" in authority.lower() and "thames" in authority.lower())'),
            ('Existing shard preserved; appended 50 Bexley FHRS continuation records','Existing shard preserved; appended 50 Richmond-Upon-Thames FHRS continuation records'),
            ('Batch 38 appended from official Bexley FHRS continuation records','Batch 98 appended from official Richmond-Upon-Thames FHRS continuation records'),
            ('50 new Bexley FHRS continuation premises-use proxy records','50 new Richmond-Upon-Thames FHRS continuation premises-use proxy records'),
            ('BATCH_38_APPENDED_50_BEXLEY_FHRS_CONTINUATION_REQUIRED','BATCH_98_APPENDED_50_RICHMOND_FHRS_CONTINUATION_REQUIRED'),
            ('feature_count 1850 -> 1900','feature_count 4850 -> 4900'),
            ('Bexley FHRS acik verisinden','Richmond-Upon-Thames FHRS acik verisinden'),
            ("Sonraki adim batch 39: mevcut 1900 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 1900 kaydi tekrar isleme.","Sonraki adim batch 99: mevcut 4900 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 4900 kaydi tekrar isleme.")
          ]
          for old,new in replacements:
              if old not in body: raise AssertionError(f'missing replacement token: {old}')
              body=body.replace(old,new)

          feature_anchor='features=shard.get("features") or []; before=len(features)\n'
          assert feature_anchor in body
          dynamic_prefix='''features=shard.get("features") or []; before=len(features)\nrichmond_existing=[f for f in features if (f.get("properties") or {}).get("source_url")=="https://ratings.food.gov.uk/api/open-data-files/FHRS527en-GB.xml" and "_FHRS_" in str(f.get("id") or "")]\nassert richmond_existing, "existing Richmond FHRS seed records not found"\nprefixes={str(f.get("id")).rsplit("_FHRS_",1)[0] for f in richmond_existing}\nassert len(prefixes)==1, prefixes\nPREFIX=next(iter(prefixes))\n'''
          body=body.replace(feature_anchor,dynamic_prefix,1)

          processed_anchor='processed=set()\n'
          assert processed_anchor in body
          body=body.replace(processed_anchor,'processed=set()\nprocessed_fhrs_ids={str((f.get("properties") or {}).get("fhrs_id")).strip() for f in features if (f.get("properties") or {}).get("fhrs_id") not in (None,"")}\n',1)
          candidate_guard='if feature_id in processed or parcel_id in processed or fid in processed: continue'
          assert candidate_guard in body
          body=body.replace(candidate_guard,'if feature_id in processed or parcel_id in processed or fid in processed or fid in processed_fhrs_ids: continue',1)

          old='assert int(s.get("features_used",0))==50\n        s.update({"name":SOURCE,"features_used":100'
          new='assert int(s.get("features_used",0))==150\n        s.update({"name":SOURCE,"features_used":200'
          assert old in body, 'missing Richmond cumulative source token'
          body=body.replace(old,new,1)

          required=['CITY="Richmond-Upon-Thames"','FHRS527en-GB.xml','BEFORE=4850; TARGET=4900; BATCH=98; NEXT_BATCH=99; NEXT_TARGET=4950','"richmond" in authority.lower()','PREFIX=next(iter(prefixes))','processed_fhrs_ids','features_used":200','evidence_excerpt','source_evidence_excerpt','"evidence_level":"D"','"confidence_level_1_to_4":2','"fake_data":False','"final_ready":False']
          missing=[x for x in required if x not in body]
          assert not missing, missing
          exec(compile(body,'<building_type_2_richmond_batch98>','exec'),{'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          URL='https://ratings.food.gov.uk/api/open-data-files/FHRS527en-GB.xml'
          shard=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json').read_text())
          checkpoint=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json').read_text())
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json').read_text())
          runner=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json').read_text())
          assert len(shard.get('features') or [])==4900
          assert manifest.get('feature_count_before')==4850 and manifest.get('feature_count_after')==4900 and manifest.get('added_feature_count')==50
          assert checkpoint.get('current_feature_count')==4900 and checkpoint.get('next_batch_index')==99 and checkpoint.get('next_target_feature_count')==4950
          assert status.get('current_feature_count')==4900 and runner.get('feature_count_before')==4850 and runner.get('feature_count_after')==4900 and runner.get('added_feature_count')==50
          assert task.get('owner') is None and task.get('task_id')=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          assert runner.get('already_processed_ids_policy_applied') is True and runner.get('city')=='Richmond-Upon-Thames'
          ids=list(runner.get('new_feature_ids') or []); assert len(ids)==50 and len(set(ids))==50
          new=[f for f in shard['features'] if f.get('id') in set(ids)]; assert len(new)==50 and len(runner.get('records') or [])==50
          assert len({f.get('id') for f in shard['features']})==len(shard['features'])
          prefixes={str(f.get('id')).rsplit('_FHRS_',1)[0] for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL and '_FHRS_' in str(f.get('id') or '')}
          assert len(prefixes)==1; prefix=next(iter(prefixes)); assert all(str(x).startswith(prefix+'_FHRS_') for x in ids)
          source_rows=[f for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL]
          assert len(source_rows)==200
          assert len({(f.get('properties') or {}).get('parcel_id') for f in new})==50
          assert len({str((f.get('properties') or {}).get('fhrs_id')) for f in new})==50
          for f in new:
              p=f.get('properties') or {}
              assert p.get('evidence_excerpt') and p.get('source_evidence_excerpt') and p.get('sources') and p.get('source_hash')
              assert p.get('source_url')==URL and p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2 and p.get('confidence_score')==0.55
              assert p.get('needs_manual_review') is True and p.get('fake_data') is False and p.get('final_ready') is False
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]
          assert len(src)==1 and src[0].get('features_used')==200
          print('validated building_type_2 4850->4900 with 50 new Richmond-Upon-Thames FHRS continuation features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r path; do ok=0; for expected in "${paths[@]}"; do [[ "$path" == "$expected" ]] && ok=1; done; [[ "$ok" == 1 ]] || { echo "unexpected staged path: $path"; exit 1; }; done < <(git diff --cached --name-only)
          git commit -m "data(building_type_2): append Richmond-Upon-Thames FHRS batch 98 4850->4900"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; URL='https://ratings.food.gov.uk/api/open-data-files/FHRS527en-GB.xml'
          def load(p): return json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==4900 and manifest['feature_count_before']==4850 and manifest['feature_count_after']==4900 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==4900 and checkpoint['next_batch_index']==99 and checkpoint['next_target_feature_count']==4950 and status['current_feature_count']==4900
          assert runner['city']=='Richmond-Upon-Thames' and len(runner['new_feature_ids'])==50 and runner.get('already_processed_ids_policy_applied') is True and task['owner'] is None
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          ids=set(runner['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]
          assert len(batch)==50 and all((f.get('properties') or {}).get('evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('source_evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('evidence_level')=='D' for f in batch)
          assert all((f.get('properties') or {}).get('confidence_level_1_to_4')==2 for f in batch)
          assert all((f.get('properties') or {}).get('fake_data') is False and (f.get('properties') or {}).get('final_ready') is False for f in batch)
          source_rows=[f for f in shard['features'] if (f.get('properties') or {}).get('source_url')==URL]
          assert len(source_rows)==200
          src=[s for s in manifest.get('sources') or [] if s.get('url')==URL]
          assert len(src)==1 and src[0].get('features_used')==200
          print('remote readback verified building_type_2 4850->4900 batch98 Richmond-Upon-Thames FHRS final_ready=false')
          PY
