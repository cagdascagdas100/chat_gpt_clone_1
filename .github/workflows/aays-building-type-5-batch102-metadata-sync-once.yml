name: AAYS building_type_5 batch102 metadata sync one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-5-batch102-metadata-sync-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-5-batch102-metadata-sync-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json
      - name: Synchronize batch103 continuation metadata
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, pathlib
          sp=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          cp=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          tp=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          s=json.loads(sp.read_text()); c=json.loads(cp.read_text()); t=json.loads(tp.read_text())
          if not (s.get('current_feature_count')==5100 and s.get('next_batch_index')==103 and c.get('last_batch',{}).get('batch_index')==102 and t.get('last_progress',{}).get('batch_index')==102 and (s.get('continuation_key') or '')=='' and (c.get('continuation_key') or '')=='' and (t.get('continuation_key') or '')==''):
              raise SystemExit('STATE_MOVED_SKIP_METADATA_SYNC')
          c['first_unverified_step']='APPEND_NEW_BATCH_103_AFTER_FEATURE_5100'
          c['first_unverified_step_status']='READY'
          c['next_required_action']='CONTINUE_BATCH_103_FROM_5100_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES'
          c['last_grid_id']='uk-grid-welwyn-garden-city-001'
          t['first_unverified_step']='APPEND_NEW_BATCH_103_AFTER_FEATURE_5100'
          cp.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          tp.write_text(json.dumps(t,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json
          git diff --cached --quiet && { echo 'METADATA_ALREADY_SYNCED'; exit 0; }
          git commit -m "fix(building_type_5): advance batch102 continuation metadata to batch103"
          git push origin HEAD:codex/aays-single-runner-v5-20260706
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json, subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          s=j('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          c=j('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          t=j('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          assert s['current_feature_count']==5100 and s['next_batch_index']==103
          assert c['first_unverified_step']=='APPEND_NEW_BATCH_103_AFTER_FEATURE_5100'
          assert c['next_required_action']=='CONTINUE_BATCH_103_FROM_5100_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES'
          assert c['last_grid_id']=='uk-grid-welwyn-garden-city-001'
          assert t['first_unverified_step']=='APPEND_NEW_BATCH_103_AFTER_FEATURE_5100'
          assert t['owner'] is None and (t.get('continuation_key') or '')=='' and t['fake_data'] is False and t['final_ready'] is False
          print('REMOTE_METADATA_SYNC_OK building_type_5 batch103 from 5100')
          PY
