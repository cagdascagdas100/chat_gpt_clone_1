name: tmp building_type_4 Dorchester OSM batch 78

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_4_bridport_batch77_20260811.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-type-4-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Sync canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append 50 unseen Dorchester OSM building-use features
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          old='1d2a96793adb1fd86a0335e88227651ab1257f22'
          path='.github/workflows/tmp_building_type_4_bridport_batch77_20260811.yml'
          text=subprocess.check_output(['git','show',f'{old}:{path}'],text=True)
          marker="          python3 <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          replacements=[
              ("CITY='Bridport'","CITY='Dorchester'"),
              ("GRID='50.700,-2.820,50.780,-2.660'","GRID='50.680,-2.520,50.770,-2.340'"),
              ('BEFORE=3800','BEFORE=3850'),('TARGET=3850','TARGET=3900'),('BATCH=77','BATCH=78'),
              ('NEXT_BATCH=78','NEXT_BATCH=79'),('NEXT_TARGET=3900','NEXT_TARGET=3950'),
              ('BATCH_77','BATCH_78'),('batch 77','batch 78'),('Bridport','Dorchester'),('19.25','19.5')]
          for a,b in replacements: code=code.replace(a,b)
          exec(compile(code,'building_type_4_batch78_runtime.py','exec'),{})
          PY

      - name: Validate append and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          shard=load('england_map_web/data/building_type/shards/building_type_4_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_4_manifest_latest.json')
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json')
          st=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          run=load('docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json')
          assert len(shard['features'])==3900 and manifest['total_features']==3900
          assert cp['feature_count_before']==3850 and cp['feature_count_after']==3900 and cp['current_feature_count']==3900
          assert cp['next_batch_index']==79 and cp['next_target_feature_count']==3950
          assert st['current_feature_count']==3900 and st['next_batch_index']==79
          assert run['batch_index']==78 and run['city']=='Dorchester' and run['feature_count_before']==3850 and run['feature_count_after']==3900
          assert run['already_processed_ids_policy_applied'] is True and len(run['new_feature_ids'])==50 and len(set(run['new_feature_ids']))==50
          ids=set(run['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]; assert len(batch)==50
          all_ids=[str(f.get('id')) for f in shard['features']]; assert len(all_ids)==len(set(all_ids))
          parcels=[str((f.get('properties') or {}).get('parcel_id')) for f in shard['features'] if (f.get('properties') or {}).get('parcel_id') is not None]; assert len(parcels)==len(set(parcels))
          osms=[str((f.get('properties') or {}).get('osm_id')) for f in shard['features'] if (f.get('properties') or {}).get('osm_id') is not None]; assert len(osms)==len(set(osms))
          for f in batch:
              p=f['properties']; assert p['area']=='Dorchester' and p['evidence_level']=='B' and p['confidence_level_1_to_4']==3
              assert p['evidence_excerpt'] and p['source_evidence_excerpt'] and p['sources'] and p['sources'][0].get('evidence_excerpt')
              assert p['fake_data'] is False and p['final_ready'] is False
          assert task['task_id']=='building-type-4-england-classification-v1-20260808' and task.get('owner') in (None,'')
          for obj in (manifest,cp,st,run,task): assert obj.get('fake_data') is False and obj.get('final_ready') is False
          print('VALIDATED building_type_4 3850->3900 Dorchester batch78=50 evidence=B confidence=3/4')
          PY

      - name: Commit and push only building_type_4 outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(england_map_web/data/building_type/shards/building_type_4_latest.geojson england_map_web/data/building_type/shards/building_type_4_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json)
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r p; do ok=0; for e in "${paths[@]}"; do [[ "$p" == "$e" ]] && ok=1; done; [[ "$ok" == 1 ]] || { echo "unexpected staged path: $p"; exit 1; }; done < <(git diff --cached --name-only)
          git commit -m "data(building_type_4): append Dorchester OSM batch 78 3850->3900"
          echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for a in 1 2 3 4 5; do git fetch origin codex/aays-single-runner-v5-20260706; if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi; if git push origin HEAD:codex/aays-single-runner-v5-20260706; then break; fi; [[ $a -lt 5 ]] || exit 1; sleep $((a*2)); done

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; load=lambda p: json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          shard=load('england_map_web/data/building_type/shards/building_type_4_latest.geojson'); cp=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json'); st=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json'); run=load('docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json')
          assert len(shard['features'])==3900 and cp['current_feature_count']==3900 and st['current_feature_count']==3900 and cp['next_batch_index']==79
          ids=set(run['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]; assert len(ids)==50 and len(batch)==50
          assert all(f['properties']['evidence_level']=='B' and f['properties']['confidence_level_1_to_4']==3 and f['properties']['evidence_excerpt'] for f in batch)
          assert all(f['properties']['fake_data'] is False and f['properties']['final_ready'] is False for f in batch)
          print('REMOTE_READBACK_OK building_type_4 3850->3900 Dorchester batch78=50')
          PY

      - name: Record remote readback metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); head=os.environ['DATA_COMMIT']
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json'); st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          cp=json.loads(cp_path.read_text()); st=json.loads(st_path.read_text())
          cp.update({'remote_head':head,'remote_readback_verified':True,'updated_at':now,'first_unverified_step_status':'BATCH_78_REMOTE_READBACK_VERIFIED_CONTINUATION_REQUIRED','final_ready':False,'fake_data':False})
          cp.setdefault('summary',{})['note']='PROGRESS: feature_count 3850 -> 3900. Batch 78 Dorchester remote readback verified; continue at batch 79. final_ready remains false.'
          st.update({'remote_head':head,'remote_readback_verified':True,'updated_at':now,'last_update':now,'note':'Batch 78 Dorchester OSM: 50 unique evidence-backed features appended; total 3900. Remote readback verified. Continue batch 79.','final_ready':False,'fake_data':False})
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n'); st_path.write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json
          git commit -m "building_type_4: record batch 78 remote readback"
          for a in 1 2 3 4 5; do git fetch origin codex/aays-single-runner-v5-20260706; if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi; if git push origin HEAD:codex/aays-single-runner-v5-20260706; then break; fi; [[ $a -lt 5 ]] || exit 1; sleep $((a*2)); done

      - name: Final remote metadata readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'; load=lambda p: json.loads(subprocess.check_output(['git','show',f'{ref}:{p}']))
          cp=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json'); st=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          assert cp['current_feature_count']==3900 and cp['next_batch_index']==79 and cp['remote_readback_verified'] is True
          assert st['current_feature_count']==3900 and st['next_batch_index']==79 and st['remote_readback_verified'] is True
          assert cp['final_ready'] is False and st['final_ready'] is False and cp['fake_data'] is False and st['fake_data'] is False
          print('FINAL_REMOTE_METADATA_OK building_type_4 current=3900 next_batch=79 final_ready=false')
          PY
