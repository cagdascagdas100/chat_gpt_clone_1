          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          fc=json.loads(shard.read_text(encoding='utf-8')); before=len(fc.get('features',[])); assert before==3300,before
          processed=set()
