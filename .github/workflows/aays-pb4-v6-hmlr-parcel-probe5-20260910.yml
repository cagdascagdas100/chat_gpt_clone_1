name: AAYS PB4 V6 HMLR parcel probe5 20260910
on:
  push:
    branches:
      - agent/aays-pb4-v6-probe-20260910
    paths:
      - '.github/workflows/aays-pb4-v6-hmlr-parcel-probe5-20260910.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve HMLR download and bind City of London parcel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,urllib.parse,urllib.error,http.cookiejar,re,json,hashlib,pathlib,zipfile,io,time,xml.etree.ElementTree as ET
          O=pathlib.Path('out'); O.mkdir(exist_ok=True)
          UA='TerraYield-AAYS/PLAN0-V6 planned_buildings_4 hmlr-parcel-probe5-r2'
          index='https://use-land-property-data.service.gov.uk/datasets/inspire/download'
          guessed='https://use-land-property-data.service.gov.uk/datasets/inspire/download/City_of_London_Corporation.zip'
          fp=[[532047.358,181333.363],[532060.945,181331.78],[532060.116,181324.67],[532069.037,181323.633],[532076.098,181322.804],[532075.224,181315.293],[532075.464,181312.228],[532076.294,181310.48],[532078.526,181309.024],[532082.033,181308.192],[532105.159,181305.811],[532107.958,181305.795],[532110.468,181306.694],[532112.614,181308.553],[532114.107,181310.673],[532114.929,181313.509],[532115.262,181316.478],[532119.016,181351.261],[532118.745,181353.157],[532117.688,181355.055],[532116.375,181356.189],[532112.984,181357.336],[532113.219,181359.79],[532113.46,181362.267],[532115.687,181362.08],[532117.92,181362.449],[532119.966,181364.372],[532121.041,181367.115],[532122.365,181381.071],[532122.048,181384.178],[532119.646,181387.654],[532116.357,181389.972],[532053.634,181396.699],[532050.424,181396.515],[532048.007,181395.485],[532046.125,181393.9],[532044.682,181391.715],[532043.435,181383.615],[532043.557,181380.78],[532044.44,181378.066],[532045.542,181376.781],[532047.111,181375.976],[532051.813,181374.608],[532051.409,181369.567],[532049.523,181368.684],[532048.216,181367.147],[532047.585,181365.517],[532044.583,181338.9],[532044.86,181336.793],[532046.073,181334.732],[532047.358,181333.363]]
          bx=[p[0] for p in fp]; by=[p[1] for p in fp]; bb=[min(bx),min(by),max(bx),max(by)]; cx=sum(p[0] for p in fp[:-1])/(len(fp)-1); cy=sum(p[1] for p in fp[:-1])/(len(fp)-1)
          meta={'schema':'pb4_v6_hmlr_parcel_probe5_r2','fetched_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'index_url':index,'guessed_url':guessed,'footprint_bbox_bng':bb,'footprint_centroid_bng':[cx,cy],'resolution':{}}
          cj=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          hdr={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/zip,application/octet-stream,*/*'}
          target=None
          try:
            with opener.open(urllib.request.Request(index,headers=hdr),timeout=120) as r:
              ib=r.read(); meta['resolution']['index']={'status':r.status,'final_url':r.geturl(),'bytes':len(ib),'sha256':hashlib.sha256(ib).hexdigest(),'cookies':[c.name for c in cj]}; (O/'hmlr_index.html').write_bytes(ib)
            txt=ib.decode('utf-8','replace')
            hrefs=re.findall(r'href=["\']([^"\']+)["\']',txt,re.I)
            city=[h for h in hrefs if 'City_of_London' in h or 'city-of-london' in h.lower() or 'city_of_london' in h.lower()]
            meta['resolution']['city_hrefs']=city[:20]
            if city: target=urllib.parse.urljoin(index,city[0])
          except Exception as e: meta['resolution']['index_error']=repr(e)
          target=target or guessed; meta['resolution']['selected_target']=target
          data=None
          try:
            with opener.open(urllib.request.Request(target,headers=hdr),timeout=240) as r:
              data=r.read(); meta['download']={'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('Content-Type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'cookies':[c.name for c in cj]}
          except Exception as e: meta['download_error']=repr(e)
          # If automatic redirects loop, inspect one redirect at a time and preserve evidence.
          if data is None:
            class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
            nr=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj),NoRedir())
            u=target; trace=[]
            for _ in range(8):
              try:
                rr=nr.open(urllib.request.Request(u,headers=hdr),timeout=120); b=rr.read(); trace.append({'url':u,'status':rr.status,'location':rr.headers.get('Location'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}); data=b; meta['download']={'status':rr.status,'final_url':u,'content_type':rr.headers.get('Content-Type'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'manual_trace':trace}; break
              except urllib.error.HTTPError as e:
                b=e.read(); loc=e.headers.get('Location') if e.headers else None; trace.append({'url':u,'status':e.code,'location':loc,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
                if e.code in (301,302,303,307,308) and loc:
                  nu=urllib.parse.urljoin(u,loc)
                  if nu==u or any(x['url']==nu for x in trace): break
                  u=nu; continue
                break
              except Exception as e: trace.append({'url':u,'error':repr(e)}); break
            meta['redirect_trace']=trace
          src=[]
          if data:
            (O/'download.bin').write_bytes(data)
            try:
              z=zipfile.ZipFile(io.BytesIO(data)); meta['zip_members']=z.namelist()
              for n in z.namelist():
                if n.lower().endswith(('.gml','.xml')):
                  b=z.read(n); fn=pathlib.Path(n).name; (O/fn).write_bytes(b); src.append((fn,b))
            except zipfile.BadZipFile:
              if data.lstrip().startswith(b'<'): (O/'City_of_London_Corporation.gml').write_bytes(data); src=[('City_of_London_Corporation.gml',data)]
              else: meta['parse_error']='download_not_zip_or_xml'
          def ln(t): return t.rsplit('}',1)[-1].split(':')[-1]
          def inside(x,y,r):
            c=False; j=len(r)-1
            for i,(xi,yi) in enumerate(r):
              xj,yj=r[j]
              if (yi>y)!=(yj>y) and x < (xj-xi)*(y-yi)/(yj-yi+1e-30)+xi: c=not c
              j=i
            return c
          def ov(a,b): return not(a[2]<b[0] or a[0]>b[2] or a[3]<b[1] or a[1]>b[3])
          matches=[]; members=0; geom_members=0
          for fn,b in src:
            try: it=ET.iterparse(O/fn,events=('end',))
            except Exception as e: meta.setdefault('gml_errors',[]).append({'file':fn,'error':repr(e)}); continue
            for _,el in it:
              if ln(el.tag).lower() not in ('featuremember','member'): continue
              members+=1; rings=[]; props={}
              for d in el.iter():
                k=ln(d.tag); t=(d.text or '').strip()
                if t and len(list(d))==0 and len(t)<500: props.setdefault(k,t)
                if k.lower()=='poslist' and t:
                  try: nums=[float(x) for x in t.replace(',',' ').split()]
                  except: continue
                  dim=int(d.attrib.get('srsDimension','2') or 2); pts=[(nums[i],nums[i+1]) for i in range(0,len(nums)-1,max(2,dim))]
                  if len(pts)>=4: rings.append(pts)
              if rings:
                geom_members+=1
                for ri,r in enumerate(rings):
                  xs=[x for x,y in r]; ys=[y for x,y in r]; rb=[min(xs),min(ys),max(xs),max(ys)]; cc=inside(cx,cy,r); n=sum(inside(x,y,r) for x,y in fp[:-1]); bi=ov(rb,bb)
                  if cc or n or bi:
                    keep={k:v for k,v in props.items() if k.lower() in ('inspireid','label','nationalcadastralreference','validfrom','beginlifespanversion','localid','namespace') or 'inspire' in k.lower() or 'cadastral' in k.lower()}
                    gid=None
                    for d in el.iter():
                      for ak,av in d.attrib.items():
                        if ln(ak).lower()=='id': gid=av; break
                      if gid: break
                    matches.append({'source_file':fn,'ring_index':ri,'ring_vertex_count':len(r),'ring_bbox':rb,'centroid_contained':cc,'footprint_vertices_contained':n,'footprint_vertex_denominator':len(fp)-1,'bbox_intersects':bi,'properties':keep,'gml_id':gid,'ring':r})
              el.clear()
          matches.sort(key=lambda m:(m['centroid_contained'],m['footprint_vertices_contained'],m['bbox_intersects']),reverse=True)
          meta.update(feature_member_count=members,poslist_feature_count=geom_members,match_count=len(matches),matches=matches[:30],extracted_sources=[{'file':fn,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for fn,b in src])
          for i,m in enumerate(matches[:10]): (O/f'match_{i+1:02d}.json').write_text(json.dumps(m,indent=2))
          (O/'summary.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps({'selected_target':target,'download':meta.get('download'),'download_error':meta.get('download_error'),'redirect_trace':meta.get('redirect_trace'),'match_count':len(matches),'top':matches[:3]},separators=(',',':')))
          PY
      - name: Upload HMLR parcel probe5
        uses: actions/upload-artifact@v4
        with:
          name: pb4-v6-hmlr-parcel-probe5-20260910
          path: out/
          if-no-files-found: error
          retention-days: 7
