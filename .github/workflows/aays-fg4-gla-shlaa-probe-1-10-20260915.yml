name: AAYS fg4 GLA SHLAA probe 1-10 20260915
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-fg4-gla-shlaa-probe-1-10-20260915.yml'
permissions:
  contents: read
jobs:
  fetch-shlaa:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch GLA SHLAA layer metadata and first 10 records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, datetime
          headers={'User-Agent':'TerraYield-AAYS-future_growth_4/1.0','Accept':'application/geo+json,application/json'}
          layer='https://gis.london.gov.uk/arcgis/rest/services/apps/planning_data_map_02/FeatureServer/108'
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              return raw,status,final,ctype
          mraw,mstatus,mfinal,mctype=get(layer+'?f=pjson')
          meta=json.loads(mraw)
          open('fg4_gla_shlaa_layer108_metadata.json','w').write(json.dumps(meta,indent=2,ensure_ascii=False))
          params={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'objectid ASC','resultOffset':'0','resultRecordCount':'10','f':'geojson'}
          url=layer+'/query?'+urllib.parse.urlencode(params)
          raw,status,final,ctype=get(url)
          data=json.loads(raw); feats=(data.get('features') or [])[:10]
          if not feats: raise SystemExit('no SHLAA features returned')
          for f in feats:
              gt=(f.get('geometry') or {}).get('type')
              if gt not in ('Polygon','MultiPolygon'):
                  raise SystemExit('non-polygon SHLAA geometry: '+str(gt))
          out={'type':'FeatureCollection','features':feats}
          b=json.dumps(out,separators=(',',':'),ensure_ascii=False).encode()
          open('fg4_gla_shlaa_1_10.geojson','wb').write(b)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          probe={'slot_id':'future_growth_4','retrieved_at_utc':now,'layer_metadata_http_status':mstatus,'layer_metadata_final_url':mfinal,'layer_metadata_content_type':mctype,'layer_metadata_sha256':hashlib.sha256(mraw).hexdigest(),'http_status':status,'content_type':ctype,'request_url':url,'final_url':final,'raw_response_sha256':hashlib.sha256(raw).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b).hexdigest(),'feature_count':len(feats),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in feats]}
          open('fg4_gla_shlaa_1_10_meta.json','w').write(json.dumps(probe,indent=2,ensure_ascii=False))
          print(json.dumps({'layer_name':meta.get('name'),'geometryType':meta.get('geometryType'),'capabilities':meta.get('capabilities'),'query_formats':meta.get('supportedQueryFormats'),'feature_count':len(feats),'http_status':status},ensure_ascii=False))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fg4-gla-shlaa-probe-1-10
          path: |
            fg4_gla_shlaa_layer108_metadata.json
            fg4_gla_shlaa_1_10.geojson
            fg4_gla_shlaa_1_10_meta.json
          if-no-files-found: error
