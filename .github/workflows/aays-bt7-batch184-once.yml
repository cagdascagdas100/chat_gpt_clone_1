name: AAYS building_type_7 batch184 once
on:
  push:
    paths:
      - '.github/workflows/aays-bt7-batch184-once.yml'
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 40
          clean: false
      - name: Adapt verified runner and execute batch 184
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT='4027aa0256bb7d19ec3aea0faf33601521630c63'
          git fetch origin "$OLD_COMMIT" --depth=1 || true
          git show "$OLD_COMMIT:.github/scripts/aays-bt7-batch183-once.py" > /tmp/aays-bt7-batch184.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/aays-bt7-batch184.py')
          t=p.read_text()
          replacements={
              'BATCH = 183':'BATCH = 184',
              'EXPECTED_BEFORE = 9063':'EXPECTED_BEFORE = 9113',
              'EXPECTED_NEXT_BATCH = 183':'EXPECTED_NEXT_BATCH = 184',
              'EXPECTED_AFTER = 9113':'EXPECTED_AFTER = 9163',
              'EXPECTED_AFTER_NEXT_BATCH = 184':'EXPECTED_AFTER_NEXT_BATCH = 185',
          }
          for old,new in replacements.items():
              if old not in t:
                  raise SystemExit(f'MISSING_REPLACEMENT {old}')
              t=t.replace(old,new,1)
          start=t.index('AREAS = [')
          end=t.index('\n]\n\nshard_path', start)+2
          new_areas='''AREAS = [
              ("Coventry_East_C", "uk-grid-coventry_east_c-001", [-1.400, 52.400, -1.375, 52.415]),
              ("Coventry_South_E", "uk-grid-coventry_south_e-001", [-1.425, 52.385, -1.400, 52.400]),
              ("Coventry_East_D", "uk-grid-coventry_east_d-001", [-1.375, 52.400, -1.350, 52.415]),
              ("Coventry_South_F", "uk-grid-coventry_south_f-001", [-1.400, 52.385, -1.375, 52.400]),
              ("Coventry_East_E", "uk-grid-coventry_east_e-001", [-1.350, 52.400, -1.325, 52.415]),
          ]'''
          t=t[:start]+new_areas+t[end:]
          p.write_text(t)
          PY
          python /tmp/aays-bt7-batch184.py
