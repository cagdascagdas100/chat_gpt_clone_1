name: AAYS building_type_3 batch85 Amersham self-contained
on:
  push:
    paths:
      - '.github/workflows/aays-bt3-batch85-amersham-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-3-batch85-amersham
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 50
          clean: false
      - name: Sync branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706
      - name: Fetch OSM classify dedupe append Batch 85
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          SLOT='building_type_3'
          TASK='building-type-3-england-classification-v1-20260808'
          CONT='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e'
          BATCH=85
          CITY='Amersham'
          GRID='uk-grid-amersham-central-001'
          REGION='South East'
          LOCAL_AUTHORITY='Buckinghamshire'
          TARGET=50
          EXPECTED_BEFORE=8950
          tiles=[
              (-0.6320,51.6600,-0.6200,51.6700),
              (-0.6200,51.6600,-0.6080,51.6700),
              (-0.6080,51.6600,-0.5960,51.6700),
              (-0.5960,51.6600,-0.5840,51.6700),
              (-0.6320,51.6700,-0.6200,51.6800),
              (-0.6200,51.6700,-0.6080,51.6800),
              (-0.6080,51.6700,-0.5960,51.6800),
              (-0.5960,51.6700,-0.5840,51.6800),
              (-0.6320,51.6800,-0.6200,51.6900),
              (-0.6200,51.6800,-0.6080,51.6900),
              (-0.6080,51.6800,-0.5960,51.6900),
              (-0.5960,51.6800,-0.5840,51.6900),
          ]

          shard_path=f'england_map_web/data/building_type/shards/{SLOT}_latest.geojson'
          manifest_path=f'england_map_web/data/building_type/shards/{SLOT}_manifest_latest.json'
          class_path=f'docs/chatgpt_status/building_type/slots/{SLOT}/runner_outputs/{SLOT}_classification_latest.json'
          cp_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/checkpoint_latest.json'
          status_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/status_latest.json'
          task_path=f'docs/chatgpt_status/_shared/slots_21/{SLOT}/current_task_latest.json'

          def load(path):
              with open(path,encoding='utf-8') as f:
                  return json.load(f)

          def dump(path,obj):
              os.makedirs(os.path.dirname(path),exist_ok=True)
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(obj,f,ensure_ascii=False,indent=2)
                  f.write('\n')

          def canonical_osm_from_url(value):
              if not isinstance(value,str):
                  return None
              m=re.search(r'openstreetmap\.org/(node|way|relation)/(\d+)',value)
              return f'{m.group(1)}/{m.group(2)}' if m else None

          shard=load(shard_path)
          manifest=load(manifest_path)
          cp=load(cp_path)
          status=load(status_path)
          task=load(task_path)
          features=shard.get('features',[])
          before=len(features)
          if before != EXPECTED_BEFORE or int(cp.get('next_batch_index',-1)) != BATCH:
              raise SystemExit(f'STALE_STATE before={before} next_batch={cp.get("next_batch_index")}')
          if cp.get('continuation_key') != CONT or status.get('continuation_key') != CONT or task.get('continuation_key') != CONT:
              raise SystemExit('CONTINUATION_MISMATCH')
          if status.get('task_id') != TASK or task.get('task_id') != TASK:
              raise SystemExit('TASK_MISMATCH')
          if status.get('owner') not in (None,'') or task.get('owner') not in (None,''):
              raise SystemExit('OWNER_PRESENT')

          processed=set()
          for feature in features:
              props=feature.get('properties') or {}
              for value in (feature.get('id'),props.get('feature_id'),props.get('parcel_id'),props.get('osm_id'),props.get('source_ref'),props.get('source_url')):
                  if value is not None and str(value):
                      processed.add(str(value))
                      canonical=canonical_osm_from_url(value)
                      if canonical:
                          processed.add(canonical)
              for source in props.get('sources') or []:
                  if not isinstance(source,dict):
                      continue
                  for key in ('element_url','object_url','url','url_or_path','url_or_local_path'):
                      canonical=canonical_osm_from_url(source.get(key))
                      if canonical:
                          processed.add(canonical)

          raw_parts=[]
          source_urls=[]
          errors=[]
          elements={}
          for west,south,east,north in tiles:
              url=f'https://api.openstreetmap.org/api/0.6/map?bbox={west},{south},{east},{north}'
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'TerraYield-AAYS/1.0 (building_type_3 batch85)'})
                  with urllib.request.urlopen(request,timeout=90) as response:
                      raw=response.read()
                  raw_parts.append(raw)
                  source_urls.append(url)
                  root=ET.fromstring(raw)
                  nodes={n.attrib['id']:(float(n.attrib['lon']),float(n.attrib['lat'])) for n in root.findall('node')}
                  for way in root.findall('way'):
                      tags={tag.attrib.get('k'):tag.attrib.get('v') for tag in way.findall('tag')}
                      if not tags.get('building'):
                          continue
                      refs=[nd.attrib.get('ref') for nd in way.findall('nd')]
                      if len(refs) < 4 or refs[0] != refs[-1]:
                          continue
                      points=[nodes[r] for r in refs[:-1] if r in nodes]
                      if len(points) < 3:
                          continue
                      eid=int(way.attrib['id'])
                      osm=f'way/{eid}'
                      fid=f'ENG_OSM_way_{eid}'
                      if osm in processed or fid in processed or str(eid) in processed:
                          continue
                      lon=sum(p[0] for p in points)/len(points)
                      lat=sum(p[1] for p in points)/len(points)
                      elements[eid]={'id':eid,'tags':tags,'center':{'lon':lon,'lat':lat},'tile_url':url}
                  if len(elements) >= 180:
                      break
                  time.sleep(1)
              except Exception as exc:
                  errors.append(f'{url}: {type(exc).__name__}: {exc}')

          if not raw_parts:
              raise SystemExit('OSM_API_UNAVAILABLE '+ ' | '.join(errors))

          source_sha=hashlib.sha256(b'\n--TILE--\n'.join(raw_parts)).hexdigest()
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def classify(tags):
              b=(tags.get('building') or '').lower().strip()
              mapping={
                  'house':('residential_house','R_HOUSE','residential',0.86,3,'B',False),
                  'detached':('residential_detached','R_DETACHED','residential',0.86,3,'B',False),
                  'semidetached_house':('residential_semi_detached','R_SEMI','residential',0.86,3,'B',False),
                  'terrace':('residential_terrace','R_TERRACE','residential',0.85,3,'B',False),
                  'residential':('residential','R_RES','residential',0.83,3,'B',False),
                  'apartments':('flat_or_apartment','R_APT','residential',0.86,3,'B',False),
                  'bungalow':('residential_bungalow','R_BUNGALOW','residential',0.86,3,'B',False),
                  'garage':('workshop_or_garage','A_GARAGE','ancillary',0.82,3,'B',False),
                  'garages':('workshop_or_garage','A_GARAGE','ancillary',0.82,3,'B',False),
                  'retail':('commercial_retail','C_RETAIL','commercial',0.86,3,'B',False),
                  'supermarket':('commercial_retail','C_RETAIL','commercial',0.86,3,'B',False),
                  'commercial':('commercial_other','C_OTHER','commercial',0.83,3,'B',False),
                  'office':('commercial_office','C_OFFICE','commercial',0.86,3,'B',False),
                  'hotel':('hotel_or_hospitality','C_HOTEL','commercial',0.86,3,'B',False),
                  'industrial':('industrial','I_IND','industrial',0.86,3,'B',False),
                  'warehouse':('warehouse','I_WARE','industrial',0.86,3,'B',False),
                  'school':('education','P_EDU','public',0.86,3,'B',False),
                  'college':('education','P_EDU','public',0.86,3,'B',False),
                  'university':('education','P_EDU','public',0.86,3,'B',False),
                  'hospital':('hospital_or_healthcare','P_HEALTH','public',0.86,3,'B',False),
                  'church':('religious_or_community','P_RELIG','public',0.86,3,'B',False),
                  'chapel':('religious_or_community','P_RELIG','public',0.84,3,'B',False),
                  'cathedral':('religious_or_community','P_RELIG','public',0.86,3,'B',False),
                  'civic':('public_infrastructure','P_PUBLIC','public',0.84,3,'B',False),
                  'government':('public_infrastructure','P_PUBLIC','public',0.84,3,'B',False),
                  'barn':('agricultural','A_AGRI','agricultural',0.83,3,'B',False),
                  'farm_auxiliary':('agricultural','A_AGRI','agricultural',0.83,3,'B',False),
                  'cowshed':('agricultural','A_AGRI','agricultural',0.82,3,'B',False),
                  'stable':('agricultural','A_AGRI','agricultural',0.81,3,'B',False),
              }
              if b in mapping:
                  return mapping[b]
              if tags.get('shop'):
                  return ('commercial_retail','C_RETAIL','commercial',0.68,2,'C',True)
              if tags.get('office'):
                  return ('commercial_office','C_OFFICE','commercial',0.68,2,'C',True)
              if (tags.get('tourism') or '').lower() in {'hotel','hostel','guest_house'}:
                  return ('hotel_or_hospitality','C_HOTEL','commercial',0.68,2,'C',True)
              amenity=(tags.get('amenity') or '').lower()
              if amenity in {'school','college','university','kindergarten'}:
                  return ('education','P_EDU','public',0.68,2,'C',True)
              if amenity in {'hospital','clinic','doctors','dentist','care_home'}:
                  return ('hospital_or_healthcare','P_HEALTH','public',0.68,2,'C',True)
              if amenity in {'place_of_worship','community_centre','social_centre'}:
                  return ('religious_or_community','P_RELIG','public',0.66,2,'C',True)
              if b and b not in {'yes','roof','construction'}:
                  return ('other_building','B_OTHER','other',0.62,2,'C',True)
              return ('unknown','U_UNKNOWN','unknown',0.35,1,'U',True)

          candidates=[]
          for eid,element in elements.items():
              cls=classify(element['tags'])
              osm=f'way/{eid}'
              fid=f'ENG_OSM_way_{eid}'
              candidates.append((cls[4],cls[3],eid,element,osm,fid,cls))
          candidates.sort(key=lambda item:(-item[0],-item[1],item[2]))
          selected=candidates[:TARGET]

          new_records=[]
          new_features=[]
          for _,_,eid,element,osm,fid,cls in selected:
              tags=element['tags']
              primary,code,category,score,level,evidence,review=cls
              fields_used=[key for key in ('building','amenity','shop','office','tourism','landuse','addr:housenumber','addr:street','addr:city','addr:postcode','name') if tags.get(key)]
              excerpt=' | '.join(f'{key}={tags[key]}' for key in fields_used)
              postcode=tags.get('addr:postcode','')
              rec={
                  'feature_id':fid,
                  'parcel_id':fid,
                  'parcel_id_semantics':'stable OSM building-element-derived identifier; not a cadastral title number',
                  'osm_id':osm,
                  'source_ref':osm,
                  'slot_id':SLOT,
                  'region':REGION,
                  'area':CITY,
                  'grid_id':GRID,
                  'local_authority':LOCAL_AUTHORITY,
                  'postcode':postcode,
                  'building_type_primary':primary,
                  'building_type_code':code,
                  'building_category':category,
                  'building_type_confidence':level,
                  'confidence_score':score,
                  'confidence_level_1_to_4':level,
                  'evidence_level':evidence,
                  'source_count':1,
                  'source':'OpenStreetMap API 0.6 map',
                  'source_url':f'https://www.openstreetmap.org/way/{eid}',
                  'source_path':element['tile_url'],
                  'source_hash':source_sha,
                  'source_hash_method':'sha256_concatenated_osm_api_tiles',
                  'match_method':f'building={tags.get("building")}',
                  'classification_method':'deterministic_osm_building_use_tag_rules_v3',
                  'evidence_excerpt':excerpt,
                  'source_evidence_excerpt':excerpt,
                  'osm_tags_summary':{key:tags[key] for key in fields_used},
                  'sources':[{
                      'source_name':'OpenStreetMap API 0.6 map',
                      'url_or_path':element['tile_url'],
                      'url_or_local_path':element['tile_url'],
                      'element_url':f'https://www.openstreetmap.org/way/{eid}',
                      'accessed_at':now,
                      'sha256':source_sha,
                      'sha256_scope':'concatenated_successful_osm_api_tiles',
                      'licence':'ODbL 1.0',
                      'granularity':'building_way_centroid',
                      'fields_used':fields_used,
                      'supports_field':'building_type_primary',
                      'match_method':f'building={tags.get("building")}',
                      'match_score':score
                  }],
                  'geometry_match_method':'osm_closed_way_node_mean_point',
                  'address_match_method':'osm_tags_only',
                  'limitations':'OSM building/use-tag evidence only; building element is a property/building proxy rather than an HMLR cadastral parcel; no EPC/VOA corroboration in this batch.',
                  'needs_manual_review':review,
                  'fake_data':False,
                  'final_ready':False,
                  'updated_at':now,
                  'geometry':{'type':'Point','coordinates':[element['center']['lon'],element['center']['lat']]}
              }
              new_records.append(rec)
              new_features.append({'type':'Feature','id':fid,'geometry':rec['geometry'],'properties':{key:value for key,value in rec.items() if key!='geometry'}})

          features.extend(new_features)
          shard['features']=features
          after=len(features)
          added=after-before
          missing=max(0,TARGET-len(selected))
          unknown_new=sum(1 for rec in new_records if rec['evidence_level']=='U')
          no_evidence=missing+unknown_new

          evidence_all=collections.Counter()
          types_all=collections.Counter()
          confidence_all=collections.Counter()
          classified=0
          unknown=0
          for feature in features:
              props=feature.get('properties') or {}
              primary=str(props.get('building_type_primary') or 'unknown')
              evidence=str(props.get('evidence_level') or 'U')
              confidence=str(props.get('confidence_level_1_to_4') or 1)
              evidence_all[evidence]+=1
              types_all[primary]+=1
              confidence_all[confidence]+=1
              if primary == 'unknown':
                  unknown+=1
              else:
                  classified+=1

          new_ev=dict(collections.Counter(rec['evidence_level'] for rec in new_records))
          new_cd=dict(collections.Counter(str(rec['confidence_level_1_to_4']) for rec in new_records))
          new_td=dict(collections.Counter(rec['building_type_primary'] for rec in new_records))
          urls_join=' | '.join(source_urls)
          batch_summary={
              'batch_index':BATCH,
              'batch_name':CITY,
              'city':CITY,
              'grid_id':GRID,
              'grid_bbox':'Amersham central tiled grid -0.6320,51.6600,-0.5840,51.6900',
              'source':'OpenStreetMap API 0.6 map',
              'endpoint':'https://api.openstreetmap.org/api/0.6/map',
              'source_url':urls_join,
              'source_sha256':source_sha,
              'features_used':added,
              'added_feature_count':added,
              'classified_added':sum(1 for rec in new_records if rec['building_type_primary']!='unknown'),
              'unknown_added':unknown_new,
              'attempted_parcels':TARGET,
              'no_evidence_this_batch':no_evidence,
              'accessed_at':now,
              'evidence_level_distribution':new_ev,
              'confidence_level_distribution':new_cd,
              'building_type_distribution':new_td,
              'new_feature_ids':[rec['feature_id'] for rec in new_records],
              'new_parcel_ids':[rec['parcel_id'] for rec in new_records],
              'new_osm_ids':[rec['osm_id'] for rec in new_records],
              'fetched_urls':source_urls,
              'source_fetch_errors':errors,
              'raw_source_stored_in_git':False
          }

          manifest.update({
              'generated_at':now,
              'continuation_key':CONT,
              'total_features':after,
              'feature_count':after,
              'feature_count_before':before,
              'feature_count_after':after,
              'added_feature_count':added,
              'classified':classified,
              'unknown':unknown,
              'evidence_distribution':dict(evidence_all),
              'type_distribution':dict(types_all),
              'confidence_level_distribution':dict(confidence_all),
              'final_ready':False,
              'fake_data':False,
              'last_batch':batch_summary
          })
          if added:
              manifest.setdefault('sources',[]).append({
                  'name':'OpenStreetMap API 0.6 map - Amersham Batch 85',
                  'url':urls_join,
                  'license':'ODbL 1.0',
                  'features_used':added,
                  'accessed_at':now,
                  'source_sha256':source_sha,
                  'source_hash_method':'sha256_concatenated_osm_api_tiles',
                  'evidence_level_distribution':new_ev,
                  'confidence_level_distribution':new_cd,
                  'fields_used':['building','amenity','shop','office','tourism','landuse','address tags'],
                  'match_method':'closed OSM building way + direct element ID/centroid; exact processed-ID exclusion',
                  'note':'Derived records only; raw OSM XML not stored in Git.'
              })

          report={
              'schema_version':3,
              'slot_id':SLOT,
              'task_id':TASK,
              'continuation_key':CONT,
              'generated_at':now,
              'state':'IN_PROGRESS',
              'batch_index':BATCH,
              'batch_name':CITY,
              'city':CITY,
              'grid_id':GRID,
              'region':REGION,
              'local_authority':LOCAL_AUTHORITY,
              'feature_count_before':before,
              'attempted_parcels':TARGET,
              'candidate_count_after_dedupe':len(candidates),
              'feature_count_after':after,
              'added_feature_count':added,
              'new_feature_count':added,
              'target_new_feature_count':TARGET,
              'classified_added':sum(1 for rec in new_records if rec['building_type_primary']!='unknown'),
              'unknown_added':unknown_new,
              'classified_count_after':classified,
              'unknown_count_after':unknown,
              'no_evidence_this_batch':no_evidence,
              'source':'OpenStreetMap API 0.6 map',
              'endpoint':'https://api.openstreetmap.org/api/0.6/map',
              'source_url':urls_join,
              'source_path':urls_join,
              'source_sha256':source_sha,
              'source_hash_method':'sha256_concatenated_osm_api_tiles',
              'source_fetch_errors':errors,
              'raw_source_committed':False,
              'fake_data':False,
              'final_ready':False,
              'evidence_level_distribution':new_ev,
              'confidence_level_distribution':new_cd,
              'building_type_distribution':new_td,
              'records':new_records
          }

          next_batch=BATCH+1 if added>0 else BATCH
          cp.update({
              'slot_id':SLOT,
              'continuation_key':CONT,
              'updated_at':now,
              'state':'IN_PROGRESS',
              'terminal_status':'IN_PROGRESS',
              'feature_count_before':before,
              'feature_count_after':after,
              'current_feature_count':after,
              'new_features_added_this_attempt':added,
              'progress_counted':added>0,
              'next_batch_index':next_batch,
              'next_city_index':next_batch,
              'next_target_feature_count':max(int(cp.get('next_target_feature_count') or 0),after+TARGET),
              'last_batch_index':BATCH if added else cp.get('last_batch_index'),
              'last_batch_name':CITY if added else cp.get('last_batch_name'),
              'last_batch_new_features':added,
              'last_batch_evidence':batch_summary if added else cp.get('last_batch_evidence'),
              'attempted_new_city_batch':CITY,
              'candidate_batch':None,
              'fake_data':False,
              'final_ready':False,
              'blocker':None if added else 'BLOCKED_NO_NEW_SOURCE_OR_BATCH',
              'blocker_reason':'' if added else f'Batch {BATCH} {CITY}: no new deduplicated OSM building candidates',
              'no_progress_reason':None if added else 'NO_EVIDENCE_THIS_BATCH',
              'next_required_action':f'APPEND_ONLY_BATCH_{BATCH+1}_NEW_SOUTH_EAST_CITY_GRID_DO_NOT_REPROCESS_EXISTING_IDS' if added else f'RETRY_BATCH_{BATCH}_WITH_NEW_UNPROCESSED_CITY_GRID',
              'already_processed_ids_policy':'Treat every existing shard feature.id, properties.parcel_id, properties.osm_id and source_ref as already_processed_ids; never replay them.',
              'remote_readback_verified':False
          })
          attempted=list(cp.get('attempted_cities') or [])
          if CITY not in attempted:
              attempted.append(CITY)
          cp['attempted_cities']=attempted
          cp.setdefault('summary',{}).update({
              'current_feature_count':after,
              'new_features_added_this_attempt':added,
              'progress_counted':added>0,
              'note':f'Batch {BATCH} {CITY}: {before} -> {after}; fake_data=false; final_ready=false.'
          })

          status.update({
              'state':'IN_PROGRESS',
              'status':'in_progress',
              'panel_status':'DEVAM',
              'slot_id':SLOT,
              'task_id':TASK,
              'continuation_key':CONT,
              'updated_at':now,
              'owner':None,
              'final_ready':False,
              'fake_data':False,
              'classified_count':classified,
              'unknown_count':unknown,
              'total_elements':after,
              'total_features':after,
              'current_feature_count':after,
              'feature_count_before':before,
              'feature_count_after':after,
              'new_features_added':added,
              'new_feature_count':added,
              'progress_count_delta':added,
              'progress_counted':added>0,
              'next_batch_index':next_batch,
              'confidence_distribution':dict(confidence_all),
              'confidence_level_distribution':dict(confidence_all),
              'evidence_distribution':dict(evidence_all),
              'blocker':None if added else 'BLOCKED_NO_NEW_SOURCE_OR_BATCH',
              'blocker_reason':'' if added else f'Batch {BATCH} {CITY}: no new source-backed candidates',
              'candidate_batch':None,
              'no_progress_reason':None if added else 'NO_EVIDENCE_THIS_BATCH',
              'last_batch_index':BATCH if added else status.get('last_batch_index'),
              'last_batch_name':CITY if added else status.get('last_batch_name'),
              'last_batch_city':CITY if added else status.get('last_batch_city'),
              'last_batch_new_features':added,
              'last_batch_added_feature_count':added,
              'last_batch_source':'OpenStreetMap API 0.6 map',
              'last_batch_evidence':batch_summary if added else status.get('last_batch_evidence'),
              'note':f'Batch {BATCH} {CITY}: attempted {TARGET}, appended {added} unique OSM building elements after exact processed-ID exclusion; no new task/owner.'
          })

          task['updated_at']=now
          task['owner']=None
          task['continuation_key']=CONT
          task['final_ready']=False
          task['fake_data']=False
          task['last_batch_index']=BATCH if added else task.get('last_batch_index')
          task['last_batch_name']=CITY if added else task.get('last_batch_name')
          task['last_batch_added_feature_count']=added
          task['next_batch_index']=next_batch
