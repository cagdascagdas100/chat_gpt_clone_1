name: security-public-safety-2-wave130-historical-lineage-lookup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/aays-triggers/security_public_safety_2_wave130.trigger.json"

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave130-historical-lineage-lookup
  cancel-in-progress: false

jobs:
  publish-historical-lineage-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical work branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave130_historical_source_lineage_official_lookup_precision_lattice_20260731.py

      - name: Run official historical-lineage lookup and precision-lattice audit
        shell: bash
        run: |
          set -euo pipefail
          export AAYS_SOURCE_HEAD="$(git rev-parse HEAD)"
          python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave130_historical_source_lineage_official_lookup_precision_lattice_20260731.py

      - name: Strict result validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          output_json = root / "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_historical_source_lineage_official_lookup_precision_lattice_wave130_latest.json"
          output_html = root / "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_historical_source_lineage_official_lookup_precision_lattice_wave130.html"
          manual_json = root / "docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json"

          data = json.loads(output_json.read_text(encoding="utf-8"))
          manual = json.loads(manual_json.read_text(encoding="utf-8"))
          page = output_html.read_text(encoding="utf-8")

          expected_key = hashlib.sha256(
              (
                  "AAYS_21_SLOT_SAFE_PARALLEL_V1|security_public_safety_2|"
                  "codex/aays-single-runner-v5-20260706|"
                  "WAVE130_SINGLE_OPEN_ROW_HISTORICAL_SOURCE_LINEAGE_OFFICIAL_LOOKUP_PRECISION_LATTICE|"
                  + data["source_head"]
              ).encode("utf-8")
          ).hexdigest()

          assert data["state"] == "COMPLETED_HISTORICAL_LINEAGE_OFFICIAL_LOOKUP_PRECISION_LATTICE_PUBLISHED"
          assert data["continuation_key"] == expected_key
          assert data["previous_continuation_key"] == "5957308ab01729e8f3bb816915d1e650753d91c56cc73b2c2f45640fcd747cf0"
          assert len(data["rows"]) == 1
          assert data["rows"][0]["parcel_id"] == "parcel_40827"
          assert data["result"]["rows_audited"] == 1
          assert data["result"]["reviewed_official_source_families"] >= 4
          assert data["result"]["promoted_official_source_families"] >= 4
          assert data["result"]["portal_search_queries"] == 5
          assert data["result"]["git_history_searches"] == 3
          assert data["result"]["precision_lattice_checks"] == 40344
          assert data["result"]["completed_or_fail_closed_operations"] == data["result"]["total_operations"]
          assert data["result"]["blocked_rows"] == 0
          assert data["result"]["blocked_operations"] == 0
          assert data["result"]["stuck_pending_operations"] == 0
          assert data["quality_policy"]["majority_vote_forbidden"] is True
          assert data["quality_policy"]["threshold_relaxation_forbidden"] is True
          assert data["quality_policy"]["nearby_record_inference_forbidden"] is True
          assert data["quality_policy"]["parent_candidate_value_changed"] is False
          assert data["quality_policy"]["parent_candidate_accuracy_mutated"] is False
          assert data["fake_data"] is False
          assert manual["open_item_count"] + manual["resolved_item_count"] == 16
          assert manual["requires_user_action"] == (manual["open_item_count"] > 0)
          assert manual["final_ready"] == (manual["open_item_count"] == 0)
          assert "parcel_40827" in page
          assert page.count("<tr>") >= 10
          print(json.dumps({
              "result": data["result"],
              "row_state": data["rows"][0]["state"],
              "row_confidence": data["rows"][0]["confidence_percent"],
              "continuation_key": data["continuation_key"],
              "manual": {
                  "state": manual["state"],
                  "open": manual["open_item_count"],
                  "resolved": manual["resolved_item_count"],
              },
          }, ensure_ascii=False))
          PY

      - name: Publish to moving canonical branch with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_historical_source_lineage_official_lookup_precision_lattice_wave130_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_historical_source_lineage_official_lookup_precision_lattice_wave130.html
          if ! git diff --cached --quiet; then
            git commit -m "security_public_safety_2: publish Wave130 historical lineage lookup [skip ci]"
          fi
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target_branch"
            git rebase "origin/$target_branch"
            if git push origin "HEAD:$target_branch"; then
              published=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Canonical remote readback
        shell: bash
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git fetch origin "$target_branch"
          python - <<'PY'
          import hashlib
          import json
          import subprocess

          branch = "origin/codex/aays-single-runner-v5-20260706"
          output_json = "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_historical_source_lineage_official_lookup_precision_lattice_wave130_latest.json"
          output_html = "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_historical_source_lineage_official_lookup_precision_lattice_wave130.html"
          manual_json = "docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json"

          data_bytes = subprocess.check_output(["git", "show", f"{branch}:{output_json}"])
          html_bytes = subprocess.check_output(["git", "show", f"{branch}:{output_html}"])
          manual_bytes = subprocess.check_output(["git", "show", f"{branch}:{manual_json}"])
          data = json.loads(data_bytes.decode("utf-8"))
          manual = json.loads(manual_bytes.decode("utf-8"))

          assert data["state"] == "COMPLETED_HISTORICAL_LINEAGE_OFFICIAL_LOOKUP_PRECISION_LATTICE_PUBLISHED"
          assert len(data["rows"]) == 1 and data["rows"][0]["parcel_id"] == "parcel_40827"
          assert data["result"]["precision_lattice_checks"] == 40344
          assert data["result"]["blocked_operations"] == 0
          assert data["result"]["stuck_pending_operations"] == 0
          assert manual["open_item_count"] + manual["resolved_item_count"] == 16
          assert "parcel_40827" in html_bytes.decode("utf-8")

          print(json.dumps({
              "state": data["state"],
              "result": data["result"],
              "row_state": data["rows"][0]["state"],
              "row_confidence": data["rows"][0]["confidence_percent"],
              "manual_action_state": manual["state"],
              "manual_open_rows": manual["open_item_count"],
              "manual_resolved_rows": manual["resolved_item_count"],
              "continuation_key": data["continuation_key"],
              "source_head": data["source_head"],
              "json_sha256": hashlib.sha256(data_bytes).hexdigest(),
              "html_sha256": hashlib.sha256(html_bytes).hexdigest(),
              "manual_action_sha256": hashlib.sha256(manual_bytes).hexdigest(),
              "remote_head": subprocess.check_output(["git", "rev-parse", branch], text=True).strip(),
          }, ensure_ascii=False))
          PY
