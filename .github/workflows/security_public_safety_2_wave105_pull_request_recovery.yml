name: security-public-safety-2-wave108-branch-recovery

on:
  push:
    branches:
      - recovery/security-public-safety-2-wave105-pr-v3-20260731
    paths:
      - .github/wave105-pr-trigger-v3.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-e96c5d44527e5d4593633eaa2c8d372dd0cf4467e94959816adc92162b094d5a
  cancel-in-progress: false

jobs:
  guarded-wave108-branch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Check idempotent claim gate
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          queue = Path('docs/chatgpt_status/aays1/queue/0083_security_public_safety_2_priority_27760row_incremental_evidence_expansion_20260731.v3.task.json')
          current = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/current_task_latest.json')
          continuation = 'e96c5d44527e5d4593633eaa2c8d372dd0cf4467e94959816adc92162b094d5a'
          payload = json.loads(current.read_text(encoding='utf-8'))
          print('run=false' if queue.exists() or payload.get('continuation_key') == continuation else 'run=true')
          PY

      - name: Validate Wave108 orchestrator syntax
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave108_orchestrator.py

      - name: Claim exact next scope
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave108_orchestrator.py claim

      - name: Install browser runtime
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Generate official-source rows and publish accepted output
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave108_orchestrator.py run

      - name: Verify remote hashes and terminalize
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave108_orchestrator.py terminalize

      - name: Park failed continuation without duplicate retry
        if: failure() && steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave108_orchestrator.py park
