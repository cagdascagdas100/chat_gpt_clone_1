name: AAYS bt3 Plan0 title-boundary probe 20260914

on:
  push:
    paths:
      - '.github/workflows/aays-bt3-plan0-title-boundary-probe-20260914.yml'

permissions:
  contents: read

jobs:
  hmlr-price-paid-semantic:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact HMLR Price Paid address records
        shell: python
        run: |
          import base64, hashlib, json, urllib.parse, urllib.request
          base='https://landregistry.data.gov.uk/data/ppi/transaction-record.json'
          for paon in ('6','9'):
              params=[
                  ('propertyAddress.postcode','HP10 0NU'),
                  ('propertyAddress.paon',paon),
                  ('propertyAddress.street','WHITE HOUSE CLOSE'),
                  ('_pageSize','100'),
              ]
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'AAYS-Plan0-V6-building_type_3/20260914','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  body=r.read()
                  meta={'paon':paon,'url':url,'final_url':r.geturl(),'http_status':r.status,'content_type':r.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
              print('BT3_PPD_META '+json.dumps(meta,sort_keys=True,separators=(',',':')))
              print('BT3_PPD_RAW_B64_BEGIN '+paon)
              print(base64.b64encode(body).decode('ascii'))
              print('BT3_PPD_RAW_B64_END '+paon)
