name: AAYS bt3 Plan0 title-boundary probe 20260914

on:
  push:
    paths:
      - '.github/workflows/aays-bt3-plan0-title-boundary-probe-20260914.yml'

permissions:
  contents: read

jobs:
  canonical-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Scan canonical for duplicate identities and schema keys
        shell: python
        run: |
          import json
          p='england_map_web/data/building_type/shards/building_type_3_latest.geojson'
          obj=json.load(open(p,encoding='utf-8'))
          fs=obj.get('features') or []
          needles={
            '32129771','32127598','12032129771','12032127598',
            '4AD98F7E-0D4F-4C68-B4B6-31808EAFEE30','208CD3B0-B579-4157-8D90-60712583FB18',
            'title-boundary:32129771','title-boundary:32127598',
          }
          hits=[]
          for i,f in enumerate(fs):
              p=f.get('properties') or {}
              vals=[]
              for k,v in p.items():
                  if isinstance(v,(str,int,float)):
                      vals.append((k,str(v)))
              for k,v in vals:
                  if v in needles or any(n in v for n in needles):
                      hits.append({'index':i,'feature_id':f.get('id') or p.get('feature_id'),'key':k,'value':v})
          sample_keys=sorted((fs[0].get('properties') or {}).keys()) if fs else []
          last_keys=sorted((fs[-1].get('properties') or {}).keys()) if fs else []
          print('BT3_CANONICAL_READBACK '+json.dumps({'feature_count':len(fs),'duplicate_hits':hits,'sample_property_keys':sample_keys,'last_property_keys':last_keys},sort_keys=True,separators=(',',':')))
