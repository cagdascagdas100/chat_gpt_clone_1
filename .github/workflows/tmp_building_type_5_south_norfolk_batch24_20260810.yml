name: tmp building_type_5 South Norfolk batch24

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_5_south_norfolk_batch24_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-5-write
  cancel-in-progress: false

jobs:
  append:
    if: contains(github.event.head_commit.message, 'launch guarded South Norfolk batch 24')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Reuse verified batch template with guarded substitutions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          src_commit='bf86fbf19e0aa2a1f0f41aed648f713e628eabaf'
          src_path='.github/workflows/tmp_building_type_5_broadland_batch23_20260810.yml'
          text=subprocess.check_output(['git','show',f'{src_commit}:{src_path}'],text=True)
          marker='        run: |\n'
          start=text.index(marker)+len(marker)
          end=text.index('\n      - name: Cleanup temporary workflow on failure',start)
          block=text[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'

          replacements=[
            (".github/workflows/tmp_building_type_5_broadland_batch23_20260810.yml",
             ".github/workflows/tmp_building_type_5_south_norfolk_batch24_20260810.yml"),
            ("https://ratings.food.gov.uk/api/open-data-files/FHRS228en-GB.xml",
             "https://ratings.food.gov.uk/api/open-data-files/FHRS233en-GB.xml"),
            ("/tmp/FHRS228en-GB.xml","/tmp/FHRS233en-GB.xml"),
            ("Food Standards Agency FHRS daily open data - Broadland",
             "Food Standards Agency FHRS daily open data - South Norfolk"),
            ("BEFORE=1100","BEFORE=1150"),
            ("BATCH=23","BATCH=24"),
            ("TARGET=1150","TARGET=1200"),
            ("PREFIX='BRD'","PREFIX='SNF'"),
            ("la.strip().lower()!='broadland'","la.strip().lower()!='south norfolk'"),
            ("or 'Broadland'","or 'South Norfolk'"),
            ("'area':'Broadland'","'area':'South Norfolk'"),
            ("BATCH_23_APPENDED_50_BROADLAND_FHRS_CONTINUATION_REQUIRED",
             "BATCH_24_APPENDED_50_SOUTH_NORFOLK_FHRS_CONTINUATION_REQUIRED"),
            ("Batch 23 appended from official Broadland FHRS records",
             "Batch 24 appended from official South Norfolk FHRS records"),
            ("50 new Broadland FHRS premises-use proxy records",
             "50 new South Norfolk FHRS premises-use proxy records"),
            ("'last_batch_city':'Broadland'","'last_batch_city':'South Norfolk'"),
            ("'city':'Broadland'","'city':'South Norfolk'"),
            ("appended 50 Broadland FHRS records","appended 50 South Norfolk FHRS records"),
            ("int(s.get('feature_count_after',-1))==1100","int(s.get('feature_count_after',-1))==1150"),
            ("int(c.get('current_feature_count',-1))==1100","int(c.get('current_feature_count',-1))==1150"),
            ("int(c.get('next_batch_index',-1))==23","int(c.get('next_batch_index',-1))==24"),
            ("int(c.get('next_target_feature_count',-1))==1150","int(c.get('next_target_feature_count',-1))==1200"),
            ("int(m.get('total_features',-1))==1100","int(m.get('total_features',-1))==1150"),
            ("append Broadland FHRS batch 1100->1150","append South Norfolk FHRS batch 1150->1200"),
          ]
          for old,new in replacements:
              if old not in script:
                  raise SystemExit(f'missing expected template token: {old}')
              script=script.replace(old,new)

          forbidden=[
            "FHRS228en-GB.xml","Broadland","BEFORE=1100","BATCH=23","TARGET=1150",
            "==1100","next_batch_index',-1))==23","next_target_feature_count',-1))==1150"
          ]
          for token in forbidden:
              if token in script:
                  raise SystemExit(f'stale template token remains: {token}')

          Path('/tmp/run_batch24.sh').write_text(script,encoding='utf-8')
          PY
          bash -n /tmp/run_batch24.sh
          bash /tmp/run_batch24.sh

      - name: Cleanup temporary workflow on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_5_south_norfolk_batch24_20260810.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if [ ! -f "$WF" ]; then exit 0; fi
            git rm -f "$WF"
            git commit -m 'chore(building_type_5): cleanup failed South Norfolk batch 24 workflow'
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 2
          done
