name: tmp building_type_2 Romford OSM grid batch 62

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_romford_osm_batch62_20260811.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new Romford OSM features
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, time, urllib.parse, urllib.request, subprocess
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          SLOT='building_type_2'; TASK='building-type-2-england-classification-v1-20260808'
          CITY='Romford'; AUTHORITY='Havering'; REGION='London Outer'
          BBOX=(51.5650,0.1650,51.5920,0.2100)
