              primary,code,category,ev,score,conf,method,review=cls
              excerpt={k:tags[k] for k in ('building','amenity','shop','office','tourism','railway','name','addr:postcode','addr:street') if k in tags}
              element_url=f'https://www.openstreetmap.org/{et}/{oid}'
              src={'source_name':'OpenStreetMap Overpass API','url':endpoint_used,'element_url':element_url,'accessed_at':now,'sha256':source_sha,'query_sha256':query_sha,'licence':'ODbL 1.0','granularity':'osm_element_centroid','fields_used':list(excerpt.keys()),'supports_field':'building_type_primary','match_method':method,'match_score':score,'evidence_excerpt':excerpt}
              props={'parcel_id':fid,'osm_id':osmid,'slot_id':SLOT,'region':REGION,'area':CITY,'local_authority':AUTHORITY,'postcode':tags.get('addr:postcode',''),'building_type_primary':primary,'building_type_code':code,'building_category':category,'evidence_level':ev,'evidence_score':score,'confidence_score':score,'confidence':score,'confidence_level_1_to_4':conf,'source_count':1,'match_method':method,'source':'OpenStreetMap Overpass API','source_url':element_url,'source_hash':source_sha,'sources':[src],'evidence_excerpt':excerpt,'source_evidence_excerpt':excerpt,'snapshot_date':now[:10],'geometry_match_method':'osm_centroid_only','address_match_method':'osm_tags_only','limitations':'OSM element-centroid classification; cadastral HMLR parcel binding and EPC/VOA corroboration remain pending.','needs_manual_review':review,'fake_data':False,'final_ready':False,'updated_at':now}
              geom={'type':'Point','coordinates':[lon,lat]}
