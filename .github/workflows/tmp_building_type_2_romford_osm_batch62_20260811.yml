          sources=list(manifest.get('sources') or []); sources.append({'name':'OpenStreetMap Overpass API - Romford grid batch 62','url':endpoint_used,'license':'ODbL 1.0','features_used':50,'accessed_at':now,'source_sha256':source_sha,'query_sha256':query_sha,'bbox':list(BBOX),'evidence_level_distribution':dict(sorted(new_evidence.items())),'confidence_level_distribution':dict(sorted(new_conf.items())),'note':'Only selected evidence excerpts and hashes stored; raw Overpass response not committed.'})
          manifest.update({'generated_at':now,'total_features':after,'classified':classified,'unknown':unknown,'evidence_distribution':dict(sorted(ed.items())),'type_distribution':dict(sorted(td.items())),'confidence_level_distribution':dict(sorted(cd.items())),'sources':sources,'fake_data':False,'final_ready':False,'note':'Existing shard preserved; appended 50 new Romford/Havering OSM-grid records outside all prior feature.id, parcel_id and osm_id values.','feature_count':after,'geojson_sha256':out_sha,'geojson_path':str(shard_p),'manifest_updated_at':now,'feature_count_before':before,'feature_count_after':after,'added_feature_count':50,'last_batch_index':BATCH,'last_batch_city':CITY,'last_batch_source':'OpenStreetMap Overpass API','last_batch_source_sha256':source_sha}); manifest_p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          status.update({'state':'IN_PROGRESS','updated_at':now,'owner':None,'final_ready':False,'fake_data':False,'classified_count':classified,'unknown_count':unknown,'total_elements':after,'total_features':after,'classified':classified,'unknown':unknown,'feature_count_before':before,'feature_count_after':after,'current_feature_count':after,'progress_count_delta':50,'next_batch_index':NEXT_BATCH,'next_target_feature_count':NEXT_TARGET,'confidence_distribution':{str(k):int(v) for k,v in sorted(cd.items())},'confidence_level_distribution':{str(k):int(v) for k,v in sorted(cd.items())},'evidence_distribution':dict(sorted(ed.items())),'output_sha256':out_sha,'candidate_batch':None,'no_progress_reason':None,'new_feature_count':50,'last_batch_index':BATCH,'last_batch_city':CITY,'last_batch_added_feature_count':50,'last_batch_source':'OpenStreetMap Overpass API','last_batch_evidence_distribution':dict(sorted(new_evidence.items())),'last_batch_confidence_distribution':dict(sorted(new_conf.items())),'note':'Batch 62 appended from a new Romford/Havering OSM grid outside all prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.','progress_reason':'50 new Romford/Havering OSM-grid records appended after feature.id/parcel_id/osm_id exclusion','last_batch':{'batch_index':BATCH,'city':CITY,'local_authority':AUTHORITY,'bbox':list(BBOX),'added_feature_count':50,'source':'OpenStreetMap Overpass API','source_url':endpoint_used,'source_sha256':source_sha,'query_sha256':query_sha,'classification_basis':'osm_tag_match','evidence_level_distribution':dict(sorted(new_evidence.items())),'confidence_level_distribution':dict(sorted(new_conf.items()))}}); status_p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          checkpoint.update({'hydration_state':'REMOTE_HEAD_HYDRATED_FIRST_UNVERIFIED_PRESERVED','remote_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'first_unverified_step_status':'BATCH_62_APPENDED_50_ROMFORD_HAVERING_OSM_CONTINUATION_REQUIRED','terminal_status':'IN_PROGRESS','updated_at':now,'final_ready':False,'state':'IN_PROGRESS','feature_count_before':before,'feature_count_after':after,'current_feature_count':after,'next_batch_index':NEXT_BATCH,'next_target_feature_count':NEXT_TARGET,'last_processed_ids_sample':new_ids[-20:],'already_processed_ids_policy':'Treat every existing shard feature.id, properties.parcel_id and properties.osm_id as already_processed_ids; never replay them.','candidate_batch':None,'no_progress_reason':None,'fake_data':False,'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION','summary':{'osm_pilot_classified':checkpoint.get('summary',{}).get('osm_pilot_classified',0),'new_slot':False,'pipeline_stage':1,'note':'PROGRESS: feature_count 3050 -> 3100. Existing shard feature.id, parcel_id and osm_id values were treated as already_processed_ids; 50 new Romford/Havering OSM-grid features were appended.','new_features_appended':50,'current_feature_count':after},'remaining_items':{'osm_building_tag_scan_pending':True,'epc_residential_pending':True,'voa_non_domestic_pending':True,'note':'Next batch 63: treat all 3100 existing feature.id/parcel_id/osm_id values as already_processed_ids and append at least 50 new London Outer features without replay.'},'last_batch':{'batch_index':BATCH,'city':CITY,'local_authority':AUTHORITY,'bbox':list(BBOX),'source':'OpenStreetMap Overpass API','source_url':endpoint_used,'source_sha256':source_sha,'query_sha256':query_sha,'evidence_level_distribution':dict(sorted(new_evidence.items())),'confidence_level_distribution':dict(sorted(new_conf.items())),'added_feature_count':50,'new_feature_ids':new_ids}}); checkpoint_p.write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n')
