          runner_p=Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')

          shard=json.loads(shard_p.read_text()); manifest=json.loads(manifest_p.read_text()); checkpoint=json.loads(checkpoint_p.read_text()); status=json.loads(status_p.read_text()); task=json.loads(task_p.read_text())
          features=shard.get('features') or []; before=len(features)
          assert task.get('slot_id')==SLOT and task.get('task_id')==TASK and task.get('owner') is None
          assert str(status.get('state')) not in {'DONE','PUBLISHED'}
          assert before==BEFORE and int(manifest.get('total_features',-1))==before and int(checkpoint.get('current_feature_count',-1))==before
          assert int(checkpoint.get('next_batch_index',-1))==BATCH and int(checkpoint.get('next_target_feature_count',-1))==TARGET
          for o in (manifest,checkpoint,status,task): assert o.get('fake_data') is False and o.get('final_ready') is False

          processed=set()
          for f in features:
              p=f.get('properties') or {}
              for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')):
                  if v is not None and str(v).strip(): processed.add(str(v).strip())

