name: tmp building_type_6 Derby batch

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_6_derby_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-6-derby-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 new Derby OSM features
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          SOURCE='https://overpass-api.de/api/interpreter'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          cat > /tmp/derby_overpass.ql <<'QL'
          [out:json][timeout:90];
          (
            nwr["amenity"~"^(school|college|university|kindergarten|hospital|clinic|doctors|dentist|restaurant|cafe|pub|bar|fast_food|food_court|community_centre|library|theatre|cinema|arts_centre|place_of_worship|police|fire_station|townhall|courthouse)$"](52.84,-1.58,53.02,-1.33);
            nwr["shop"](52.84,-1.58,53.02,-1.33);
            nwr["office"](52.84,-1.58,53.02,-1.33);
            nwr["tourism"~"^(hotel|hostel|guest_house)$"](52.84,-1.58,53.02,-1.33);
            nwr["building"~"^(industrial|warehouse|commercial|retail|office|school|hospital|hotel|civic|public|church|chapel|mosque|synagogue|temple)$"](52.84,-1.58,53.02,-1.33);
          );
          out center tags;
          QL

          curl -fsSL --retry 2 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            -A 'AAYS-building-type/1.0' \
            --data-urlencode data@/tmp/derby_overpass.ql \
            "$SOURCE" -o /tmp/derby_overpass.json

          python3 <<'PY'
          import hashlib, json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          SLOT='building_type_6'
          TASK='building-type-6-england-classification-v1-20260808'
          CONT='c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a'
          SOURCE='https://overpass-api.de/api/interpreter'
          SOURCE_NAME='OpenStreetMap Overpass API - Derby urban grid'
          GRID='Derby_bbox_52.84_-1.58_53.02_-1.33'
          BEFORE_EXPECTED=100
          TARGET_EXPECTED=150

          shard_p=Path('england_map_web/data/building_type/shards/building_type_6_latest.geojson')
          manifest_p=Path('england_map_web/data/building_type/shards/building_type_6_manifest_latest.json')
          checkpoint_p=Path('docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json')
          status_p=Path('docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json')
          task_p=Path('docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json')
          runner_p=Path('docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json')

          shard=json.loads(shard_p.read_text(encoding='utf-8'))
          manifest=json.loads(manifest_p.read_text(encoding='utf-8'))
          checkpoint=json.loads(checkpoint_p.read_text(encoding='utf-8'))
          status=json.loads(status_p.read_text(encoding='utf-8'))
          task=json.loads(task_p.read_text(encoding='utf-8'))
          features=shard.get('features',[])
          before=len(features)

          assert task.get('slot_id')==SLOT and task.get('task_id')==TASK
          assert task.get('owner') is None, 'owner changed; refusing second owner/task'
          assert status.get('owner') is None, 'status owner changed; refusing write'
          assert task.get('continuation_key')==CONT and checkpoint.get('continuation_key')==CONT and status.get('continuation_key')==CONT
          assert before==BEFORE_EXPECTED, f'stale shard count {before} != {BEFORE_EXPECTED}'
          assert int(checkpoint.get('current_feature_count',-1))==before
          assert int(checkpoint.get('next_batch_index',-1))==3
          assert int(checkpoint.get('next_target_feature_count',-1))==TARGET_EXPECTED
          assert manifest.get('fake_data') is False and checkpoint.get('fake_data') is False and task.get('fake_data') is False
          assert status.get('fake_data',False) is False
          assert manifest.get('final_ready') is False and checkpoint.get('final_ready') is False and status.get('final_ready') is False and task.get('final_ready') is False

          processed=set()
          for f in features:
              p=f.get('properties') or {}
              for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')):
                  if v is not None and str(v).strip():
                      processed.add(str(v).strip())

          raw=Path('/tmp/derby_overpass.json').read_bytes()
          query=Path('/tmp/derby_overpass.ql').read_bytes()
          source_sha=hashlib.sha256(raw).hexdigest()
          query_sha=hashlib.sha256(query).hexdigest()
          payload=json.loads(raw.decode('utf-8'))
          elements=payload.get('elements') or []
          assert isinstance(elements,list) and elements, 'Overpass response contains no elements'

          building_map={
            'industrial':('industrial','I_INDUSTRIAL','industrial'),
            'warehouse':('warehouse','I_WAREHOUSE','industrial'),
            'commercial':('commercial_other','C_COMMERCIAL','commercial'),
            'retail':('commercial_retail','C_RETAIL','commercial'),
            'office':('office','C_OFFICE','commercial'),
            'school':('education','P_EDUCATION','institutional'),
            'hospital':('healthcare_care','P_HEALTHCARE','institutional'),
            'hotel':('hospitality','C_HOTEL','commercial'),
            'civic':('public_infrastructure','P_CIVIC','institutional'),
            'public':('public_infrastructure','P_PUBLIC','institutional'),
            'church':('religious_or_community','P_RELIGIOUS','institutional'),
            'chapel':('religious_or_community','P_RELIGIOUS','institutional'),
            'mosque':('religious_or_community','P_RELIGIOUS','institutional'),
            'synagogue':('religious_or_community','P_RELIGIOUS','institutional'),
            'temple':('religious_or_community','P_RELIGIOUS','institutional'),
          }
          def classify(tags):
              b=str(tags.get('building','')).lower()
              if b in building_map:
                  a=building_map[b]
                  return (*a,'C',3,'explicit_osm_building_tag')
              amenity=str(tags.get('amenity','')).lower()
              if amenity in {'school','college','university','kindergarten'}:
                  return 'education','P_EDUCATION','institutional','D',2,'osm_amenity_use_proxy'
              if amenity in {'hospital','clinic','doctors','dentist'}:
                  return 'healthcare_care','P_HEALTHCARE','institutional','D',2,'osm_amenity_use_proxy'
              if amenity in {'restaurant','cafe','pub','bar','fast_food','food_court'}:
                  return 'commercial_hospitality','C_HOSPITALITY','commercial','D',2,'osm_amenity_use_proxy'
              if amenity in {'community_centre','library','theatre','cinema','arts_centre'}:
                  return 'religious_or_community','P_COMMUNITY','institutional','D',2,'osm_amenity_use_proxy'
              if amenity=='place_of_worship':
                  return 'religious_or_community','P_RELIGIOUS','institutional','D',2,'osm_amenity_use_proxy'
              if amenity in {'police','fire_station','townhall','courthouse'}:
                  return 'public_infrastructure','P_PUBLIC','institutional','D',2,'osm_amenity_use_proxy'
              if tags.get('shop'):
                  return 'commercial_retail','C_RETAIL','commercial','D',2,'osm_shop_use_proxy'
              tourism=str(tags.get('tourism','')).lower()
              if tourism in {'hotel','hostel','guest_house'}:
                  return 'hospitality','C_HOTEL','commercial','D',2,'osm_tourism_use_proxy'
              if tags.get('office'):
                  return 'office','C_OFFICE','commercial','D',2,'osm_office_use_proxy'
              return None

          candidates=[]
          type_order={'node':0,'way':1,'relation':2}
          for el in elements:
              kind=str(el.get('type','')).lower()
              oid=str(el.get('id','')).strip()
              if kind not in type_order or not oid:
                  continue
              osm_ref=f'{kind}/{oid}'
              feature_id=f'DER_OSM_{kind}_{oid}'
              parcel_id=f'DER_OSM_ELEM_{kind}_{oid}'
              if {oid,osm_ref,feature_id,parcel_id} & processed:
                  continue
              tags=el.get('tags') or {}
              cls=classify(tags)
              if not cls:
                  continue
              if kind=='node':
                  lat,lon=el.get('lat'),el.get('lon')
              else:
                  center=el.get('center') or {}
                  lat,lon=center.get('lat'),center.get('lon')
              try:
                  lat=float(lat); lon=float(lon)
              except (TypeError,ValueError):
                  continue
              if not (52.84 <= lat <= 53.02 and -1.58 <= lon <= -1.33):
                  continue
              candidates.append((type_order[kind],int(oid) if oid.isdigit() else 10**20,oid,kind,el,lat,lon,cls))
          candidates.sort(key=lambda x:(x[0],x[1],x[2]))
          assert len(candidates)>=50, f'only {len(candidates)} eligible new Derby OSM candidates'

          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          added=[]
          records=[]
          ev_add=Counter(); conf_add=Counter(); type_add=Counter()
          for _,_,oid,kind,el,lat,lon,cls in candidates[:50]:
              primary,code,category,evidence_level,confidence,match_method=cls
              tags=el.get('tags') or {}
              feature_id=f'DER_OSM_{kind}_{oid}'
              parcel_id=f'DER_OSM_ELEM_{kind}_{oid}'
              osm_ref=f'{kind}/{oid}'
              relevant={k:tags[k] for k in ['name','building','amenity','shop','office','tourism','addr:housenumber','addr:street','addr:postcode'] if k in tags}
              excerpt=' | '.join([f'OSM {osm_ref}']+[f'{k}={relevant[k]}' for k in sorted(relevant)])
              element_url=f'https://www.openstreetmap.org/{kind}/{oid}'
              props={
                'parcel_id':parcel_id,
                'parcel_id_semantics':'stable OSM element-derived identifier; not a cadastral parcel ID',
                'osm_id':osm_ref,
                'slot_id':SLOT,
                'region':'East Midlands',
                'area':'Derby urban grid',
                'grid_id':GRID,
                'building_type_primary':primary,
                'building_type_code':code,
                'building_category':category,
                'confidence_score':0.78 if confidence==3 else 0.58,
                'confidence_level_1_to_4':confidence,
                'evidence_level':evidence_level,
                'source_count':1,
                'source':SOURCE_NAME,
                'source_url':element_url,
                'source_query_url':SOURCE,
                'source_hash':source_sha,
                'source_hash_method':'sha256_raw_overpass_json',
                'source_query_sha256':query_sha,
                'match_method':match_method,
                'evidence_excerpt':excerpt,
                'evidence_excerpt_sha256':hashlib.sha256(excerpt.encode()).hexdigest(),
                'source_evidence_excerpt':{'osm_type':kind,'osm_id':oid,'tags':relevant},
                'sources':[{
                  'source_name':'OpenStreetMap via Overpass API',
                  'url_or_local_path':element_url,
                  'query_endpoint':SOURCE,
                  'accessed_at':now,
                  'sha256':source_sha,
                  'sha256_scope':'raw_overpass_json',
                  'query_sha256':query_sha,
                  'licence':'OpenStreetMap ODbL 1.0',
                  'granularity':'osm_element_or_poi_center',
                  'fields_used':sorted(relevant.keys()),
                  'supports_field':'building_type_primary',
                  'match_method':match_method,
                  'match_score':0.78 if confidence==3 else 0.58
                }],
                'geometry_match_method':'osm_node_or_element_center',
                'limitations':'OSM tags are direct building tags when evidence_level=C; otherwise POI/use tags are premises-use proxies and do not prove cadastral parcel identity.',
                'needs_manual_review':confidence<3,
                'fake_data':False,
                'final_ready':False,
                'updated_at':now,
                'feature_id':feature_id
              }
              feat={'type':'Feature','id':feature_id,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props}
              added.append(feat)
              records.append({**props,'geometry':feat['geometry']})
              ev_add[evidence_level]+=1
              conf_add[str(confidence)]+=1
              type_add[primary]+=1

          new_ids={f['id'] for f in added}
          new_parcels={f['properties']['parcel_id'] for f in added}
          new_osm={f['properties']['osm_id'] for f in added}
          assert len(added)==50 and len(new_ids)==50 and len(new_parcels)==50 and len(new_osm)==50
          assert not (new_ids & processed) and not (new_parcels & processed) and not (new_osm & processed)
          assert all(f['properties']['fake_data'] is False and f['properties']['final_ready'] is False for f in added)
          assert all(f['properties']['evidence_excerpt'] and f['properties']['evidence_level'] in {'C','D'} and 1 <= f['properties']['confidence_level_1_to_4'] <= 4 for f in added)

          shard['features']=features+added
          after=len(shard['features'])
          assert after==before+50 and after>before
          shard_p.write_text(json.dumps(shard,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          output_sha=hashlib.sha256(shard_p.read_bytes()).hexdigest()

          ev=Counter({str(k):int(v) for k,v in (manifest.get('evidence_distribution') or {}).items()}); ev.update(ev_add)
          conf=Counter({str(k):int(v) for k,v in (manifest.get('confidence_level_distribution') or {}).items()}); conf.update(conf_add)
          types=Counter({str(k):int(v) for k,v in (manifest.get('type_distribution') or {}).items()}); types.update(type_add)
          classified=int(manifest.get('classified',before-int(manifest.get('unknown',0))))+50
          unknown=int(manifest.get('unknown',0))
          source_entry={
            'name':SOURCE_NAME,
            'url':SOURCE,
            'license':'ODbL 1.0',
            'features_used':50,
            'accessed_at':now,
            'source_sha256':source_sha,
            'source_hash_method':'sha256_raw_overpass_json',
            'query_sha256':query_sha,
            'grid_id':GRID,
            'evidence_level_distribution':dict(sorted(ev_add.items())),
            'confidence_level_1_to_4_distribution':dict(sorted(conf_add.items())),
            'note':'Direct OSM building tags use C/3; amenity/shop/office/tourism records use D/2 premises-use proxy.'
          }
          manifest.update({
            'generated_at':now,
            'total_features':after,
            'classified':classified,
            'unknown':unknown,
            'evidence_distribution':{k:ev.get(k,0) for k in ['A','B','C','D','U']},
            'confidence_level_distribution':{k:conf.get(k,0) for k in ['1','2','3','4']},
            'type_distribution':dict(sorted(types.items())),
            'sources':manifest.get('sources',[])+[source_entry],
            'fake_data':False,
            'final_ready':False,
            'feature_count':after,
            'feature_count_before':before,
            'feature_count_after':after,
            'added_feature_count':50,
            'last_batch_city':'Derby',
            'last_batch_grid':GRID,
            'last_batch_source':SOURCE_NAME,
            'last_batch_source_sha256':source_sha,
            'geojson_sha256':output_sha,
            'geojson_path':str(shard_p),
            'manifest_updated_at':now,
            'note':'Preserved existing Leicester-derived 100 features; appended 50 Derby OSM elements outside existing feature.id/parcel_id/osm_id values. Raw Overpass response was not committed.'
          })
          manifest_p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          batch=int(checkpoint.get('next_batch_index',3))
          checkpoint.update({
            'updated_at':now,
            'state':'IN_PROGRESS',
            'terminal_status':'IN_PROGRESS',
            'first_unverified_step':'APPEND_NEW_BATCH_004_AFTER_FEATURE_150',
            'first_unverified_step_status':'BATCH_003_APPENDED_50_DERBY_OSM_CONTINUATION_REQUIRED',
            'feature_count_before':before,
            'feature_count_after':after,
            'current_feature_count':after,
            'next_batch_index':batch+1,
            'next_target_feature_count':after+50,
            'final_ready':False,
            'fake_data':False,
            'last_processed_ids_sample':sorted(new_ids)[-20:],
            'last_batch':{
              'batch_index':batch,
              'city':'Derby',
              'grid_id':GRID,
              'source':SOURCE_NAME,
              'source_sha256':source_sha,
              'query_sha256':query_sha,
              'added_feature_count':50,
              'new_feature_ids':sorted(new_ids),
              'evidence_level_distribution':dict(sorted(ev_add.items())),
              'confidence_level_distribution':dict(sorted(conf_add.items()))
            },
            'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; corroborate D-level OSM POI/use proxies with EPC/VOA/HMLR where available'
          })
          checkpoint.setdefault('summary',{})['new_features_appended']=50
          checkpoint['summary']['current_feature_count']=after
          checkpoint['summary']['classified_total']=classified
          checkpoint.setdefault('source_access_evidence',{})['osm_overpass_derby_grid']='SUCCESS_RAW_JSON_SHA256_'+source_sha
          checkpoint_p.write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          status.update({
            'state':'IN_PROGRESS',
            'updated_at':now,
            'owner':None,
            'final_ready':False,
            'fake_data':False,
            'classified_count':classified,
            'unknown_count':unknown,
            'total_elements':after,
            'confidence_distribution':{k:conf.get(k,0) for k in ['1','2','3','4']},
            'evidence_distribution':{k:ev.get(k,0) for k in ['A','B','C','D','U']},
            'output_sha256':output_sha,
            'feature_count_before':before,
            'feature_count_after':after,
            'current_feature_count':after,
            'next_batch_index':batch+1,
            'next_target_feature_count':after+50,
            'blocker':None,
            'last_batch':{
              'city':'Derby','grid_id':GRID,'added_feature_count':50,
              'source':SOURCE_NAME,'source_sha256':source_sha,
              'classification_basis':'osm_explicit_building_or_poi_use_proxy',
              'evidence_level_distribution':dict(sorted(ev_add.items())),
              'confidence_level_distribution':dict(sorted(conf_add.items()))
            }
          })
          status_p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          prog=task.setdefault('progress',{})
          prev=float(prog.get('current_percent',0))
          target=int(prog.get('target_count',150) or 150)
          prog.update({'completed_count':after,'target_count':target,'previous_percent':prev,'current_percent':round(100*after/target,4),'percent_increase':round(100*after/target-prev,4)})
          task.update({'state':'IN_PROGRESS','updated_at':now,'first_unverified_step':'APPEND_NEW_BATCH_004_AFTER_FEATURE_150','blocker':None,'fake_data':False,'final_ready':False})
          task_p.write_text(json.dumps(task,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          runner={
            'slot_id':SLOT,'task_id':TASK,'continuation_key':CONT,'generated_at':now,
            'feature_count_before':before,'feature_count_after':after,'added_feature_count':50,
            'city':'Derby','grid_id':GRID,'source':SOURCE_NAME,'source_url':SOURCE,
            'source_sha256':source_sha,'source_query_sha256':query_sha,
            'classification_method':'osm_explicit_building_or_poi_use_proxy',
            'evidence_level_distribution':dict(sorted(ev_add.items())),
            'confidence_level_distribution':dict(sorted(conf_add.items())),
            'records':records,'fake_data':False,'final_ready':False
          }
          runner_p.parent.mkdir(parents=True,exist_ok=True)
          runner_p.write_text(json.dumps(runner,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'before':before,'after':after,'added':50,'eligible_candidates':len(candidates),'source_sha256':source_sha,'query_sha256':query_sha,'evidence':dict(ev_add),'confidence':dict(conf_add),'owner':task.get('owner')},ensure_ascii=False))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/building_type/shards/building_type_6_latest.geojson \
            england_map_web/data/building_type/shards/building_type_6_manifest_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json
          git diff --cached --quiet && { echo 'No feature-count progress; refusing commit'; exit 1; } || true
          git commit -m 'data(building_type_6): append Derby OSM batch 100->150'

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            remote="$(git rev-parse "origin/$BRANCH")"
            if ! git merge-base --is-ancestor "$remote" HEAD; then
              git show "origin/$BRANCH:docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json" > /tmp/remote_cp.json
              git show "origin/$BRANCH:docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json" > /tmp/remote_task.json
              python3 <<'PY'
          import json
          cp=json.load(open('/tmp/remote_cp.json',encoding='utf-8'))
          task=json.load(open('/tmp/remote_task.json',encoding='utf-8'))
          cont='c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a'
          assert cp.get('continuation_key')==cont and task.get('continuation_key')==cont, 'remote continuation changed'
          assert int(cp.get('current_feature_count',-1))==100, 'remote building_type_6 already advanced; refusing duplicate batch'
          assert int(cp.get('next_batch_index',-1))==3, 'remote batch index changed; refusing duplicate batch'
          assert task.get('owner') is None, 'remote owner changed; refusing rebase/push'
          assert cp.get('fake_data') is False and task.get('fake_data') is False
          assert cp.get('final_ready') is False and task.get('final_ready') is False
          PY
              git rebase "origin/$BRANCH" || { git rebase --abort || true; echo 'Rebase conflict; refusing automatic conflict resolution'; exit 1; }
            fi

            python3 <<'PY'
          import json
          from pathlib import Path
          shard=json.loads(Path('england_map_web/data/building_type/shards/building_type_6_latest.geojson').read_text(encoding='utf-8'))
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json').read_text(encoding='utf-8'))
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json').read_text(encoding='utf-8'))
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json').read_text(encoding='utf-8'))
          assert len(shard.get('features',[]))==150
          assert int(cp.get('feature_count_before'))==100 and int(cp.get('feature_count_after'))==150
          assert cp.get('fake_data') is False and status.get('fake_data') is False and task.get('fake_data') is False
          assert cp.get('final_ready') is False and status.get('final_ready') is False and task.get('final_ready') is False
          PY

            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            test "$attempt" -lt 5 || { echo 'bounded push retries exhausted'; exit 1; }
          done
