name: tmp building_type_5 St Albans FHRS batch 11

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_5_stalbans_fhrs_batch11_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-5-batch11
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append exactly 50 new St Albans FHRS evidence features
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="codex/aays-single-runner-v5-20260706"
          WF=".github/workflows/tmp_building_type_5_stalbans_fhrs_batch11_20260810.yml"
          git pull --ff-only origin "$BRANCH"
          BASE_HEAD=$(git rev-parse HEAD)
          python3 <<'PY'
          import hashlib, json, urllib.request, xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          slot_id = "building_type_5"
          expected_task_id = "building-type-5-england-classification-v1-20260808"
          expected_before = 500
          expected_target = 550
          batch_index = 11
          city = "St Albans City"
          prefix = "STA"
          source_name = "Food Standards Agency FHRS daily open data - St Albans City"
          source_url = "https://ratings.food.gov.uk/api/open-data-files/FHRS160en-GB.xml"

          shard_path = Path("england_map_web/data/building_type/shards/building_type_5_latest.geojson")
          manifest_path = Path("england_map_web/data/building_type/shards/building_type_5_manifest_latest.json")
          checkpoint_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json")
          status_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json")
          task_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json")
          runner_path = Path("docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json")

          shard = json.loads(shard_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))
          features = shard.get("features") or []
          before = len(features)

          assert task.get("slot_id") == slot_id, "wrong slot"
          assert task.get("task_id") == expected_task_id, "task changed"
          assert task.get("owner") is None, "current_task owner is not null"
          assert status.get("owner") is None, "status owner is not null"
          assert str(status.get("state")) not in {"DONE", "PUBLISHED"}, "slot terminal"
          assert before == expected_before, f"stale shard count {before} != {expected_before}"
          assert int(manifest.get("total_features", -1)) == before, "manifest/shard count mismatch"
          assert int(checkpoint.get("current_feature_count", -1)) == before, "checkpoint/shard count mismatch"
          assert int(checkpoint.get("next_batch_index", -1)) == batch_index, "batch index changed"
          assert int(checkpoint.get("next_target_feature_count", -1)) == expected_target, "target changed"
          assert checkpoint.get("fake_data") is False and status.get("fake_data") is False and manifest.get("fake_data") is False, "fake_data guard"
          assert checkpoint.get("final_ready") is False and status.get("final_ready") is False and manifest.get("final_ready") is False, "final_ready guard"

          processed = set()
          for f in features:
              p = f.get("properties") or {}
              for v in (f.get("id"), p.get("parcel_id"), p.get("osm_id")):
                  if v is not None and str(v).strip():
                      processed.add(str(v).strip())

          req = urllib.request.Request(source_url, headers={"User-Agent": "AAYS-building-type/1.0"})
          with urllib.request.urlopen(req, timeout=90) as resp:
              raw = resp.read()
          assert len(raw) > 1000, "FHRS source response unexpectedly small"
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag): return tag.rsplit("}", 1)[-1]
          def text(el, wanted):
              for child in el.iter():
                  if local(child.tag) == wanted:
                      return (child.text or "").strip()
              return ""

          def classify(bt):
              b = bt.strip().lower()
              if "school" in b or "college" in b or "university" in b:
                  return "education", "P_EDUCATION", "institutional"
              if "hospital" in b or "caring" in b or "childcare" in b:
                  return "healthcare_care", "P_HEALTHCARE", "institutional"
              if "hotel" in b or "bed & breakfast" in b or "guest house" in b:
                  return "hospitality", "C_HOTEL", "commercial"
              if "pub" in b or "bar" in b or "nightclub" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "restaurant" in b or "cafe" in b or "canteen" in b:
                  return "commercial_hospitality", "C_HOSPITALITY", "commercial"
              if "takeaway" in b or "sandwich" in b:
                  return "commercial_hospitality", "C_TAKEAWAY", "commercial"
              if "retailer" in b or "supermarket" in b or "hypermarket" in b:
                  return "commercial_retail", "C_RETAIL", "commercial"
              if "distributor" in b or "transporter" in b:
                  return "warehouse", "C_LOGISTICS", "commercial"
              if "manufacturer" in b or "packer" in b:
                  return "industrial", "I_MANUFACTURING", "industrial"
              return "commercial_other", "C_OTHER", "commercial"

          candidates = []
          for el in root.iter():
              if local(el.tag) != "EstablishmentDetail":
                  continue
              fhrsid = text(el, "FHRSID")
              if not fhrsid:
                  continue
              feature_id = f"{prefix}_FHRS_{fhrsid}"
              parcel_id = f"{prefix}_FHRSID_{fhrsid}"
              if feature_id in processed or parcel_id in processed or fhrsid in processed:
                  continue
              la = text(el, "LocalAuthorityName")
              if la and "st albans" not in la.lower():
                  continue
              bt = text(el, "BusinessType")
              if not bt or "mobile caterer" in bt.lower():
                  continue
              try:
                  lat = float(text(el, "Latitude")); lon = float(text(el, "Longitude"))
              except Exception:
                  continue
              if not (-1.0 < lon < 1.5 and 50.5 < lat < 53.5):
                  continue
              candidates.append((int(fhrsid) if fhrsid.isdigit() else 10**18, fhrsid, el, lat, lon, bt, la))

          candidates.sort(key=lambda x: (x[0], x[1]))
          assert len(candidates) >= 50, f"only {len(candidates)} eligible new St Albans records"
          selected = candidates[:50]
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          new_ids = []

          for _, fhrsid, el, lat, lon, bt, la in selected:
              feature_id = f"{prefix}_FHRS_{fhrsid}"
              parcel_id = f"{prefix}_FHRSID_{fhrsid}"
              primary, code, category = classify(bt)
              name = text(el, "BusinessName")
              postcode = text(el, "PostCode")
              addr = " ".join(filter(None, [text(el,"AddressLine1"), text(el,"AddressLine2"), text(el,"AddressLine3"), text(el,"AddressLine4")]))
              excerpt = f"FHRSID {fhrsid} | {name} | BusinessType {bt} | LocalAuthority {la or city} | PostCode {postcode} | coordinates {lat:.6f},{lon:.6f}"
              features.append({
                  "type": "Feature",
                  "id": feature_id,
                  "geometry": {"type": "Point", "coordinates": [lon, lat]},
                  "properties": {
                      "parcel_id": parcel_id,
                      "osm_id": None,
                      "slot_id": slot_id,
                      "region": "East of England",
                      "area": city,
                      "local_authority": la or city,
                      "postcode": postcode,
                      "address": addr,
                      "business_name": name,
                      "fhrs_id": fhrsid,
                      "fhrs_business_type": bt,
                      "building_type_primary": primary,
                      "building_type_code": code,
                      "building_category": category,
                      "evidence_level": "D",
                      "evidence_score": 0.55,
                      "confidence_score": 0.55,
                      "confidence": 0.55,
                      "confidence_level_1_to_4": 2,
                      "source_count": 1,
                      "match_method": "fhrs_business_type_premises_proxy",
                      "source": source_name,
                      "source_url": source_url,
                      "source_hash": source_sha,
                      "sources": [{
                          "source_name": source_name,
                          "url": source_url,
                          "sha256": source_sha,
                          "accessed_at": now,
                          "licence": "Open Government Licence / FSA terms",
                          "granularity": "geocoded_business_premises_point",
                          "fields_used": ["FHRSID","BusinessName","BusinessType","LocalAuthorityName","PostCode","Latitude","Longitude"],
                          "supports_field": "building_type_primary (premises-use proxy)",
                          "match_method": "fhrs_business_type_premises_proxy",
                          "match_score": 0.55
                      }],
                      "evidence_excerpt": excerpt,
                      "source_evidence_excerpt": excerpt,
                      "snapshot_date": now[:10],
                      "geometry_match_method": "source_geocoded_point_only",
                      "address_match_method": "source_record_address",
                      "limitations": "FHRS premises-use proxy only; cadastral parcel identity and building fabric remain unverified.",
                      "needs_manual_review": True,
                      "fake_data": False,
                      "final_ready": False,
                      "updated_at": now
                  }
              })
              new_ids.append(feature_id)

          after = len(features)
          assert after == expected_target and after > before and after - before == 50
          shard["features"] = features
          shard_text = json.dumps(shard, ensure_ascii=False, indent=2) + "\n"
          shard_path.write_text(shard_text, encoding="utf-8")
          out_sha = hashlib.sha256(shard_text.encode("utf-8")).hexdigest()

          classified = sum(1 for f in features if (f.get("properties") or {}).get("building_type_primary") not in (None,"","unknown"))
          unknown = after - classified
          evidence_dist = Counter((f.get("properties") or {}).get("evidence_level", "U") for f in features)
          type_dist = Counter((f.get("properties") or {}).get("building_type_primary", "unknown") for f in features)
          conf_dist = Counter(str((f.get("properties") or {}).get("confidence_level_1_to_4", 1)) for f in features)

          sources = list(manifest.get("sources") or [])
          sources = [s for s in sources if s.get("url") != source_url]
          sources.append({
              "name": source_name, "url": source_url, "features_used": 50,
              "accessed_at": now, "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml", "evidence_level": "D",
              "confidence_level_1_to_4": 2,
              "note": "FHRS BusinessType premises-use proxy; not cadastral parcel geometry or building-fabric evidence."
          })
          manifest.update({
              "generated_at": now, "total_features": after, "classified": classified, "unknown": unknown,
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "type_distribution": dict(sorted(type_dist.items())),
              "confidence_level_distribution": dict(sorted(conf_dist.items())),
              "sources": sources, "fake_data": False, "final_ready": False,
              "note": "Existing shard preserved; appended 50 St Albans City FHRS records outside all prior feature.id, parcel_id and osm_id values.",
              "feature_count": after, "geojson_sha256": out_sha,
              "geojson_path": str(shard_path), "manifest_updated_at": now,
              "feature_count_before": before, "feature_count_after": after, "added_feature_count": 50,
              "last_batch_index": batch_index, "last_batch_city": city, "last_batch_source": source_name,
              "last_batch_source_sha256": source_sha
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          status.update({
              "state": "IN_PROGRESS", "updated_at": now, "owner": None, "final_ready": False, "fake_data": False,
              "classified_count": classified, "unknown_count": unknown, "total_elements": after,
              "feature_count_before": before, "feature_count_after": after, "progress_count_delta": 50,
              "next_batch_index": 12, "next_target_feature_count": 600,
              "confidence_distribution": {str(k): int(v) for k,v in sorted(conf_dist.items())},
              "evidence_distribution": dict(sorted(evidence_dist.items())), "output_sha256": out_sha,
              "candidate_batch": None, "no_progress_reason": None,
              "note": "Batch 11 appended from official St Albans City FHRS records outside all prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.",
              "new_feature_count": 50, "last_batch_index": batch_index, "last_batch_city": city,
              "last_batch_source": source_name,
              "progress_reason": "50 new St Albans City FHRS premises-use proxy records appended after feature.id/parcel_id/osm_id exclusion"
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          checkpoint.update({
              "hydration_state": "REMOTE_HEAD_HYDRATED_FIRST_UNVERIFIED_PRESERVED",
              "first_unverified_step_status": "BATCH_11_APPENDED_50_ST_ALBANS_FHRS_CONTINUATION_REQUIRED",
              "terminal_status": "IN_PROGRESS", "updated_at": now, "final_ready": False, "state": "IN_PROGRESS",
              "feature_count_before": before, "feature_count_after": after, "current_feature_count": after,
              "next_batch_index": 12, "next_target_feature_count": 600,
              "last_processed_ids_sample": new_ids[-20:],
              "already_processed_ids_policy": "Treat every existing shard feature.id, properties.parcel_id and properties.osm_id as already_processed_ids; never replay them.",
              "candidate_batch": None, "no_progress_reason": None,
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL OSM/EPC/VOA/HMLR CORROBORATION FOR FHRS PROXY RECORDS",
              "fake_data": False,
              "last_batch": {"batch_index": batch_index, "city": city, "source": source_name, "source_url": source_url,
                             "source_sha256": source_sha, "evidence_level": "D", "confidence_level_1_to_4": 2,
                             "added_feature_count": 50, "new_feature_ids": new_ids}
          })
          summary = dict(checkpoint.get("summary") or {})
          summary.update({"new_slot": False, "pipeline_stage": 1, "progress_count_delta": 50, "new_features_appended": 50, "current_feature_count": after})
          checkpoint["summary"] = summary
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          runner = {
              "slot_id": slot_id, "task_id": expected_task_id, "generated_at": now, "batch_index": batch_index,
              "city": city, "source_name": source_name, "source_url": source_url, "source_sha256": source_sha,
              "feature_count_before": before, "feature_count_after": after, "new_feature_count": 50,
              "new_feature_ids": new_ids, "evidence_level": "D", "confidence_level_1_to_4": 2,
              "match_method": "fhrs_business_type_premises_proxy",
              "limitations": "Premises-use proxy only; cadastral parcel identity and building fabric remain unverified.",
              "already_processed_ids_policy_applied": True, "fake_data": False, "final_ready": False,
              "output_sha256": out_sha
          }
          runner_path.parent.mkdir(parents=True, exist_ok=True)
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps({"before": before, "after": after, "added": 50, "source_sha256": source_sha, "output_sha256": out_sha}))
          PY

          rm -f "$WF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_5_latest.geojson \
            england_map_web/data/building_type/shards/building_type_5_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json \
            "$WF"
          git commit -m "data(building_type_5): append St Albans FHRS batch 500->550"
          for i in 1 2 3; do
            if git push origin HEAD:"$BRANCH"; then break; fi
            test "$i" != 3
            git pull --rebase origin "$BRANCH"
          done
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"

      - name: Cleanup temporary workflow on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="codex/aays-single-runner-v5-20260706"
          WF=".github/workflows/tmp_building_type_5_stalbans_fhrs_batch11_20260810.yml"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          if test -f "$WF"; then
            git rm "$WF"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary building_type_5 St Albans batch 11 workflow"
            git push origin HEAD:"$BRANCH" || true
          fi
