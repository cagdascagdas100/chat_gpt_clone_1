name: AAYS building_type_9 Longbenton batch130 autorun

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/tmp_bt9_batch130_longbenton_autorun_20260813.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-9-serial
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Render fail-closed Longbenton batch 130 runner
        shell: bash
        run: |
          set -euo pipefail
          git show 2dd1104bc682198b075fa9283d98f1c2e039102e:.github/tmp_bt9_batch46_ripon_v3.py > .github/tmp_bt9_batch130_longbenton_20260813.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp_bt9_batch130_longbenton_20260813.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('CITY = "Ripon"', 'CITY = "Longbenton"'),
              ('GRID = "RIPON_CENTRAL_02"', 'GRID = "LONGBENTON_NORTH_TYNESIDE_01"'),
              ('LOCAL_AUTHORITY = "North Yorkshire"', 'LOCAL_AUTHORITY = "North Tyneside"'),
              ('BATCH = 46', 'BATCH = 130'),
              ('EXPECTED_BEFORE = 2250', 'EXPECTED_BEFORE = 6450'),
              ('TARGET_AFTER = 2300', 'TARGET_AFTER = 6500'),
              ('NEXT_TARGET = 2350', 'NEXT_TARGET = 6550'),
              ('xs = [-1.5650, -1.5350, -1.5050, -1.4750]', 'xs = [-1.6250, -1.6000, -1.5750, -1.5500, -1.5250]'),
              ('ys = [54.1100, 54.1320, 54.1540, 54.1760]', 'ys = [54.9900, 55.0050, 55.0200, 55.0350, 55.0500]'),
              ('(+evidence batch 46)', '(+evidence batch 130)'),
              ('OpenStreetMap API 0.6 - Ripon batch 46', 'OpenStreetMap API 0.6 - Longbenton batch 130'),
              ('appended 50 Ripon OSM API records', 'appended 50 Longbenton OSM API records'),
              ('Batch 46 appended 50 new Ripon OSM API evidence-backed building features', 'Batch 130 appended 50 new Longbenton OSM API evidence-backed building features'),
              ('BATCH_046_APPENDED_50_RIPON_OSM_FEATURES_CONTINUATION_REQUIRED', 'BATCH_130_APPENDED_50_LONGBENTON_OSM_FEATURES_CONTINUATION_REQUIRED'),
              ('APPEND_NEW_BATCH_047_AFTER_FEATURE_2300', 'APPEND_NEW_BATCH_131_AFTER_FEATURE_6500'),
              ('for attempt in range(4):', 'for attempt in range(3):'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL_CLOSED replacement target count {count} for: {old}')
              text = text.replace(old, new)

          old = 'for v in (ft.get("id"), p.get("parcel_id"), p.get("osm_id")):'
          new = 'for v in (ft.get("id"), p.get("parcel_id"), p.get("osm_id"), p.get("source_ref")):'
          if text.count(old) != 1:
              raise SystemExit('FAIL_CLOSED processed source_ref patch target mismatch')
          text = text.replace(old, new)

          old = '"already_processed_id_basis": ["feature.id", "properties.parcel_id", "properties.osm_id"],'
          new = '"already_processed_id_basis": ["feature.id", "properties.parcel_id", "properties.osm_id", "properties.source_ref"],'
          if text.count(old) != 1:
              raise SystemExit('FAIL_CLOSED already_processed_id_basis target mismatch')
          text = text.replace(old, new)

          old = '"processed_id_basis": ["feature.id", "properties.parcel_id", "properties.osm_id"],'
          new = '"processed_id_basis": ["feature.id", "properties.parcel_id", "properties.osm_id", "properties.source_ref"],'
          if text.count(old) != 1:
              raise SystemExit('FAIL_CLOSED processed_id_basis target mismatch')
          text = text.replace(old, new)

          old = '        "source_url": "https://www.openstreetmap.org/way/" + wid,\n        "source_hash": source_sha,'
          new = '        "source_url": "https://www.openstreetmap.org/way/" + wid,\n        "source_ref": "https://www.openstreetmap.org/way/" + wid,\n        "source_hash": source_sha,'
          if text.count(old) != 2:
              raise SystemExit(f'FAIL_CLOSED source_ref insertion target count {text.count(old)}')
          text = text.replace(old, new)

          old = '        "evidence_level": "B",\n        "confidence_level_1_to_4": 3,\n        "match_method": method,\n    })'
          new = '        "evidence_level": "B",\n        "confidence_score": 0.85,\n        "confidence_level_1_to_4": 3,\n        "match_method": method,\n        "fake_data": False,\n    })'
          if text.count(old) != 1:
              raise SystemExit('FAIL_CLOSED record confidence/fake_data insertion target mismatch')
          text = text.replace(old, new)

          old = 'seen_osm = set()\nfor ft in geo["features"]:'
          new = 'seen_osm = set()\nseen_source_ref = set()\nfor ft in geo["features"]:'
          if text.count(old) != 1:
              raise SystemExit('FAIL_CLOSED source_ref seen set target mismatch')
          text = text.replace(old, new)

          old = '        ("osm_id", str(p.get("osm_id") or ""), seen_osm),\n    ]'
          new = '        ("osm_id", str(p.get("osm_id") or ""), seen_osm),\n        ("source_ref", str(p.get("source_ref") or ""), seen_source_ref),\n    ]'
          if text.count(old) != 1:
              raise SystemExit('FAIL_CLOSED source_ref duplicate guard target mismatch')
          text = text.replace(old, new)

          stale = [
              'CITY = "Ripon"', 'GRID = "RIPON_CENTRAL_02"', 'BATCH = 46',
              'EXPECTED_BEFORE = 2250', 'TARGET_AFTER = 2300', 'NEXT_TARGET = 2350',
              'APPEND_NEW_BATCH_047_AFTER_FEATURE_2300'
          ]
          for literal in stale:
              if literal in text:
                  raise SystemExit(f'FAIL_CLOSED stale template literal remains: {literal}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run fail-closed Longbenton batch 130
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp_bt9_batch130_longbenton_20260813.py

      - name: Remote checkpoint guard then commit and push only building_type_9 outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          python - <<'PY'
          import json, subprocess
          base='origin/codex/aays-single-runner-v5-20260706:'
          cp=json.loads(subprocess.check_output(['git','show',base+'docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json'], text=True))
          task=json.loads(subprocess.check_output(['git','show',base+'docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json'], text=True))
          expected='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          if cp.get('current_feature_count') != 6450 or cp.get('next_batch_index') != 130:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_9 checkpoint moved; do not overwrite')
          if task.get('task_id') != 'building-type-9-england-classification-v1-20260808' or task.get('continuation_key') != expected:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_9 task/continuation moved')
          if task.get('owner') is not None or task.get('blocker') is not None:
              raise SystemExit('REMOTE_GUARD_ABORT: building_type_9 owner/blocker changed')
          PY
          git rm -f --ignore-unmatch -- \
            .github/tmp_bt9_batch130_longbenton_20260813.py \
            .github/workflows/tmp_bt9_batch130_longbenton_autorun_20260813.yml
          git add -- \
            england_map_web/data/building_type/shards/building_type_9_latest.geojson \
            england_map_web/data/building_type/shards/building_type_9_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'data: append building_type_9 Longbenton batch 130'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then exit 0; fi
            else
              git rebase --abort || true
              echo 'Rebase conflict; refusing to overwrite concurrent slot changes.' >&2
              exit 1
            fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          python - <<'PY'
          import json, subprocess
          base='origin/codex/aays-single-runner-v5-20260706:'
          def read(path):
              return json.loads(subprocess.check_output(['git','show',base+path], text=True))
          cp=read('docs/chatgpt_status/_shared/slots_21/building_type_9/checkpoint_latest.json')
          st=read('docs/chatgpt_status/_shared/slots_21/building_type_9/status_latest.json')
          mf=read('england_map_web/data/building_type/shards/building_type_9_manifest_latest.json')
          cl=read('docs/chatgpt_status/building_type/slots/building_type_9/runner_outputs/building_type_9_classification_latest.json')
          sh=read('england_map_web/data/building_type/shards/building_type_9_latest.geojson')
          task=read('docs/chatgpt_status/_shared/slots_21/building_type_9/current_task_latest.json')
          expected='d350a5a37a836c7a2d36fc243b0692c1cffa5b3d65f7e01ff1108c4215340512'
          assert cp['feature_count_before']==6450 and cp['feature_count_after']==6500
          assert cp['current_feature_count']==6500 and cp['next_batch_index']==131
          assert cp['last_batch']['batch_index']==130 and cp['last_batch']['city']=='Longbenton'
          assert cp['fake_data'] is False and cp['final_ready'] is False
          assert st['feature_count_before']==6450 and st['feature_count_after']==6500 and st['current_feature_count']==6500
          assert st['last_batch_city']=='Longbenton' and st['fake_data'] is False and st['final_ready'] is False
          assert mf['total_features']==6500 and mf['feature_count_after']==6500 and mf['last_batch_city']=='Longbenton'
          assert cl['feature_count_before']==6450 and cl['feature_count_after']==6500 and cl['added_feature_count']==50 and cl['progress'] is True
          assert cl['city']=='Longbenton' and cl['batch_index']==130 and cl['continuation_key']==expected
          assert cl['fake_data'] is False and cl['final_ready'] is False and len(cl['records'])==50
          assert task['continuation_key']==expected and task['owner'] is None and task['blocker'] is None
          assert task['first_unverified_step']=='APPEND_NEW_BATCH_131_AFTER_FEATURE_6500' and task['final_ready'] is False and task['fake_data'] is False
          assert len(sh['features'])==6500
          prior=sh['features'][:6450]
          new=sh['features'][6450:]
          prior_ids=set(); prior_parcels=set(); prior_osms=set(); prior_refs=set()
          for f in prior:
              if f.get('id') is not None: prior_ids.add(str(f['id']))
              p=f.get('properties') or {}
              if p.get('parcel_id') is not None: prior_parcels.add(str(p['parcel_id']))
              if p.get('osm_id') is not None: prior_osms.add(str(p['osm_id']))
              if p.get('source_ref') is not None: prior_refs.add(str(p['source_ref']))
          new_ids=[str(f.get('id')) for f in new]
          new_parcels=[str((f.get('properties') or {}).get('parcel_id')) for f in new]
          new_osms=[str((f.get('properties') or {}).get('osm_id')) for f in new]
          new_refs=[str((f.get('properties') or {}).get('source_ref')) for f in new]
          assert len(new)==50
          assert len(set(new_ids))==len(set(new_parcels))==len(set(new_osms))==len(set(new_refs))==50
          assert not (set(new_ids)&prior_ids) and not (set(new_parcels)&prior_parcels) and not (set(new_osms)&prior_osms) and not (set(new_refs)&prior_refs)
          assert all((f.get('properties') or {}).get('fake_data') is False and (f.get('properties') or {}).get('final_ready') is False for f in new)
          assert all(r.get('source_url') and r.get('source_ref') and r.get('sources') and r.get('evidence_excerpt') and r.get('evidence_level') in ('B','C','D','U') and r.get('confidence_score') is not None and r.get('confidence_level_1_to_4') in (1,2,3,4) and r.get('fake_data') is False for r in cl['records'])
          print({'remote_readback':'OK','feature_count_before':6450,'feature_count_after':6500,'added':50,'batch':130,'city':'Longbenton','evidence':cl['evidence_level_new_features'],'confidence':cl['confidence_level_new_features'],'next_batch':cp['next_batch_index']})
          PY
