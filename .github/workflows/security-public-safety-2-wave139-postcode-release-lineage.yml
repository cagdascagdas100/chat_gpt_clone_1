name: security_public_safety_2 Wave139 postcode release lineage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/aays-triggers/security_public_safety_2_wave139.trigger.json

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave139
  cancel-in-progress: false

jobs:
  publish-postcode-release-lineage:
    if: github.head_ref == 'audit/security-public-safety-2-wave139-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests pyshp shapely pyproj

      - name: Verify runner syntax
        run: |
          python -m py_compile \
            docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.py \
            docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801_v2.py

      - name: Run official internet postcode release lineage audit
        env:
          AAYS_SOURCE_HEAD: acd82a8205cf80fc352d065faa31475193024530
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.py

      - name: Upload Wave139 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-public-safety-2-wave139-diagnostic
          path: docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Strict fail-closed validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json')
          website = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html')
          status = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json')
          evidence = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json')
          diagnostic = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json')
          queue = Path('docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json')
          manual = Path('docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json')
          for path in (output, website, status, evidence, diagnostic, queue, manual):
              assert path.exists() and path.stat().st_size > 0, path
          data = json.loads(output.read_text())
          result = data['result']
          diagnosis = json.loads(diagnostic.read_text())
          assert data['fake_data'] is False
          assert diagnosis['fake_data'] is False
          assert diagnosis['stage'] == 'completed'
          assert data['continuation_key'] == 'a61e46015baebb5d9e1ddb098b98fe04e6c1c617ec98a1a09eef8c1c297c066f'
          assert data['scope']['maximum_simultaneous_workers'] == 15
          assert result['official_portal_searches'] >= 6
          assert result['official_portal_search_successes'] >= 4
          assert result['official_items_inspected'] >= 5
          assert result['official_relationship_probes'] >= 20
          assert result['field_semantic_rows'] >= 10
          assert result['postcode_release_matrix_rows'] >= 20
          assert result['completed_or_fail_closed_operations'] == result['total_operations']
          assert result['blocked_operations'] == 0
          assert result['stuck_pending_operations'] == 0
          assert json.loads(queue.read_text())['state'] == 'COMPLETED_PUBLISHED'
          page = website.read_text()
          assert 'Postcode release matrix' in page
          assert 'Operation ledger' in page
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit and publish canonical outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json
          git commit -m 'security_public_safety_2: publish Wave139 postcode release lineage'
          published=false
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              published=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Remote canonical readback
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          remote_head=$(git rev-parse origin/codex/aays-single-runner-v5-20260706)
          for path in \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json; do
            local_sha=$(sha256sum "$path" | cut -d' ' -f1)
            remote_sha=$(git show "origin/codex/aays-single-runner-v5-20260706:$path" | sha256sum | cut -d' ' -f1)
            test "$local_sha" = "$remote_sha"
            echo "REMOTE_READBACK $path $remote_sha"
          done
          echo "CANONICAL_REMOTE_HEAD=$remote_head"
