name: security_public_safety_2 Wave139 postcode release lineage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/aays-triggers/security_public_safety_2_wave139.trigger.json

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave139
  cancel-in-progress: false

jobs:
  publish-postcode-release-lineage:
    if: github.head_ref == 'audit/security-public-safety-2-wave139-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests pyshp shapely pyproj

      - name: Verify runner syntax
        run: |
          python -m py_compile \
            docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.py \
            docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801_v2.py \
            docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801_v3.py

      - name: Run official internet postcode release lineage audit
        env:
          AAYS_SOURCE_HEAD: acd82a8205cf80fc352d065faa31475193024530
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.py

      - name: Named strict fail-closed validation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected_continuation = 'a61e46015baebb5d9e1ddb098b98fe04e6c1c617ec98a1a09eef8c1c297c066f'
          paths = {
              'output': Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json'),
              'website': Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html'),
              'status': Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json'),
              'evidence': Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json'),
              'diagnostic': Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json'),
              'queue': Path('docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json'),
              'manual': Path('docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json'),
          }
          report = {
              'schema_version': 1,
              'slot_id': 'security_public_safety_2',
              'task_id': 'security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801',
              'continuation_key': expected_continuation,
              'checks': [],
              'failures': [],
              'fake_data': False,
          }

          def record(name, actual, expected, passed):
              row = {'name': name, 'actual': actual, 'expected': expected, 'passed': bool(passed)}
              report['checks'].append(row)
              if not passed:
                  report['failures'].append(row)

          for name, path in paths.items():
              passed = path.exists() and path.stat().st_size > 0
              record(f'file:{name}:exists_nonempty', passed, True, passed)

          def load(name):
              path = paths[name]
              try:
                  return json.loads(path.read_text())
              except Exception as exc:
                  record(f'json:{name}:parse', f'{type(exc).__name__}:{exc}', 'valid JSON', False)
                  return {}

          data = load('output')
          status = load('status')
          evidence = load('evidence')
          diagnosis = load('diagnostic')
          queue = load('queue')
          manual = load('manual')
          result = data.get('result') or {}
          page = paths['website'].read_text() if paths['website'].exists() else ''

          record('output.fake_data', data.get('fake_data'), False, data.get('fake_data') is False)
          record('diagnostic.fake_data', diagnosis.get('fake_data'), False, diagnosis.get('fake_data') is False)
          record('diagnostic.stage', diagnosis.get('stage'), 'completed', diagnosis.get('stage') == 'completed')
          record('output.continuation_key', data.get('continuation_key'), expected_continuation,
                 data.get('continuation_key') == expected_continuation)
          record('status.continuation_key', status.get('continuation_key'), expected_continuation,
                 status.get('continuation_key') == expected_continuation)
          record('evidence.continuation_key', evidence.get('continuation_key'), expected_continuation,
                 evidence.get('continuation_key') == expected_continuation)
          record('queue.continuation_key', queue.get('continuation_key'), expected_continuation,
                 queue.get('continuation_key') == expected_continuation)
          record('scope.maximum_simultaneous_workers', (data.get('scope') or {}).get('maximum_simultaneous_workers'), 15,
                 (data.get('scope') or {}).get('maximum_simultaneous_workers') == 15)

          thresholds = {
              'official_portal_searches': 6,
              'official_portal_search_successes': 4,
              'official_items_inspected': 5,
              'official_relationship_probes': 20,
              'field_semantic_rows': 10,
              'postcode_release_matrix_rows': 20,
          }
          for key, minimum in thresholds.items():
              actual = result.get(key)
              record(f'result.{key}', actual, f'>={minimum}', isinstance(actual, (int, float)) and actual >= minimum)

          completed = result.get('completed_or_fail_closed_operations')
          total = result.get('total_operations')
          record('result.operations_complete', {'completed': completed, 'total': total}, 'completed == total',
                 isinstance(completed, (int, float)) and completed == total)
          record('result.blocked_operations', result.get('blocked_operations'), 0, result.get('blocked_operations') == 0)
          record('result.stuck_pending_operations', result.get('stuck_pending_operations'), 0,
                 result.get('stuck_pending_operations') == 0)
          record('queue.state', queue.get('state'), 'COMPLETED_PUBLISHED', queue.get('state') == 'COMPLETED_PUBLISHED')
          record('status.state', status.get('state'), 'COMPLETED_PUBLISHED', status.get('state') == 'COMPLETED_PUBLISHED')
          record('manual.open_item_count', manual.get('open_item_count'), 1, manual.get('open_item_count') == 1)
          record('website.Postcode release matrix', 'Postcode release matrix' in page, True,
                 'Postcode release matrix' in page)
          record('website.Operation ledger', 'Operation ledger' in page, True, 'Operation ledger' in page)

          report_path = Path('/tmp/wave139_validation_report.json')
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False))
          if report['failures']:
              raise SystemExit(1)
          PY

      - name: Upload Wave139 final recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-public-safety-2-wave139-final-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/wave139_validation_report.json
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json
            docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish through isolated canonical worktree
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          ART="/tmp/wave139-artifacts"
          rm -rf "$ART"
          mkdir -p "$ART"
          NONMANUAL=(
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json
            docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json
          )
          tar -cf "$ART/nonmanual.tar" "${NONMANUAL[@]}"
          cp docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json "$ART/generated_manual.json"

          published=false
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            WT="/tmp/wave139-publish-$attempt"
            git worktree remove --force "$WT" 2>/dev/null || true
            rm -rf "$WT"
            git worktree add --detach "$WT" origin/codex/aays-single-runner-v5-20260706
            tar -xf "$ART/nonmanual.tar" -C "$WT"
            python - "$ART/generated_manual.json" "$WT/docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          generated_path = Path(sys.argv[1])
          current_path = Path(sys.argv[2])
          generated = json.loads(generated_path.read_text())
          current = json.loads(current_path.read_text()) if current_path.exists() else generated
          generated_item = next((row for row in generated.get('items', []) if row.get('parcel_id') == 'parcel_40827'), None)
          if generated_item is None:
              raise RuntimeError('GENERATED_MANUAL_TARGET_MISSING')
          items = current.setdefault('items', [])
          for index, row in enumerate(items):
              if row.get('parcel_id') == 'parcel_40827':
                  items[index] = generated_item
                  break
          else:
              items.append(generated_item)
          for key in ('updated_at', 'continuation_key'):
              current[key] = generated.get(key)
          evidence_paths = current.setdefault('evidence_paths', [])
          for path in generated.get('evidence_paths', []):
              if path not in evidence_paths:
                  evidence_paths.append(path)
          current['open_item_count'] = sum(row.get('state') == 'OPEN' for row in items)
          current['resolved_item_count'] = sum(row.get('state') == 'RESOLVED' for row in items)
          current['state'] = 'RESOLVED' if current['open_item_count'] == 0 else 'OPEN'
          current['requires_user_action'] = bool(current['open_item_count'])
          current['final_ready'] = current['open_item_count'] == 0
          current_path.parent.mkdir(parents=True, exist_ok=True)
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n')
          PY

            if (
              cd "$WT"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add \
                england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json \
                england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html \
                docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json \
                docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json \
                docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json \
                docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
                docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json
              git commit -m 'security_public_safety_2: publish Wave139 postcode release lineage'
              git push origin HEAD:codex/aays-single-runner-v5-20260706
            ); then
              git -C "$WT" rev-parse HEAD > /tmp/wave139_published_sha
              cp "$WT/docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json" "$SRC/docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json"
              published=true
              git worktree remove --force "$WT"
              break
            fi
            git worktree remove --force "$WT" || true
            sleep $((attempt * 2))
          done
          test "$published" = true
          echo "WAVE139_PUBLISHED_SHA=$(cat /tmp/wave139_published_sha)"

      - name: Remote canonical readback
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          remote_head=$(git rev-parse origin/codex/aays-single-runner-v5-20260706)
          for path in \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_postcode_release_lineage_field_semantics_primary_binding_wave139.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_evidence_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave139_diagnostic_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0152_security_public_safety_2_wave139_official_postcode_release_lineage_field_semantics_primary_binding_20260801.v3.task.json; do
            local_sha=$(sha256sum "$path" | cut -d' ' -f1)
            remote_sha=$(git show "origin/codex/aays-single-runner-v5-20260706:$path" | sha256sum | cut -d' ' -f1)
            test "$local_sha" = "$remote_sha"
            echo "REMOTE_READBACK $path $remote_sha"
          done
          echo "CANONICAL_REMOTE_HEAD=$remote_head"
          echo "WAVE139_PUBLISHED_SHA=$(cat /tmp/wave139_published_sha)"
