name: tmp-building-type-1-recovery-20260810-r3
on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: ['.github/workflows/tmp_building_type_1_recovery_20260810_r3.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          sparse-checkout: |
            england_map_web/data/building_type/shards/building_type_1_latest.geojson
            england_map_web/data/poi/london-points.geojson
            docs/chatgpt_status/_shared/slots_21/building_type_1
            docs/chatgpt_status/building_type/slots/building_type_1
            .github/workflows/tmp_building_type_1_recovery_20260810_r3.yml
          sparse-checkout-cone-mode: false
      - name: Append new Inner London evidence batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, hashlib, pathlib, urllib.parse, urllib.request, time, datetime, collections
          SLOT='building_type_1'
          CONT='5863ed20ce49304e6f6c645502caa52bd8546d2c048456712ac9510ddf1c0c17'
          SOURCE_HEAD='4637ca6e01176f4cc53d8200f79f4322763377be'
          shard=pathlib.Path('england_map_web/data/building_type/shards/building_type_1_latest.geojson')
          poi=pathlib.Path('england_map_web/data/poi/london-points.geojson')
          stated=pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_1')
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          fc=json.loads(shard.read_text(encoding='utf-8'))
          before=len(fc.get('features',[])); assert before>=300, before
          pathlib.Path('/tmp/expected_before').write_text(str(before))
          processed=set()
          for f in fc['features']:
              p=f.get('properties') or {}
              for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')):
                  if v is not None: processed.add(str(v))
          pfc=json.loads(poi.read_text(encoding='utf-8'))
          poi_sha=hashlib.sha256(poi.read_bytes()).hexdigest()
          step=.002; grid=collections.defaultdict(list)
          for f in pfc.get('features',[]):
              g=f.get('geometry') or {}; c=g.get('coordinates') or []
              if g.get('type')!='Point' or len(c)<2: continue
              try: lon,lat=float(c[0]),float(c[1])
              except Exception: continue
              grid[(round(lat/step),round(lon/step))].append((lat,lon,f.get('properties') or {}))
          def hav(a,b,c,d):
              R=6371000.; q=math.sin(math.radians(c-a)/2)**2+math.cos(math.radians(a))*math.cos(math.radians(c))*math.sin(math.radians(d-b)/2)**2
              return 2*R*math.asin(math.sqrt(q))
          def nearest(lat,lon,limit=150):
              k=(round(lat/step),round(lon/step)); best=None
              for i in (-1,0,1):
                  for j in (-1,0,1):
                      for a,b,p in grid.get((k[0]+i,k[1]+j),[]):
                          d=hav(lat,lon,a,b)
                          if d<=limit and (best is None or d<best[0]): best=(d,p)
              return best
          BM={'detached':('detached_house','R_DET','residential'),'semidetached_house':('semi_detached_house','R_SEMI','residential'),'terrace':('terraced_house','R_TERR','residential'),'apartments':('flat_or_apartment','R_FLAT','residential'),'house':('house','R_DET','residential'),'bungalow':('bungalow','R_DET','residential'),'industrial':('industrial','I_FACTORY','industrial'),'warehouse':('warehouse','I_WAREHOUSE','industrial'),'retail':('commercial_retail','C_RETAIL','commercial'),'commercial':('commercial_retail','C_RETAIL','commercial'),'office':('office','C_OFFICE','commercial'),'school':('school','P_SCHOOL','institutional'),'hospital':('healthcare','P_HEALTHCARE','institutional'),'church':('religious','P_RELIGIOUS','institutional'),'hotel':('hospitality','C_HOSPITALITY','commercial'),'farm':('agriculture','S_AGRICULTURE','special'),'barn':('agriculture','S_AGRICULTURE','special'),'public':('public_infrastructure','P_GOVERNMENT','institutional'),'train_station':('public_infrastructure','P_GOVERNMENT','institutional'),'garage':('workshop','I_WORKSHOP','industrial')}
          AM={'school':('school','P_SCHOOL','institutional'),'hospital':('healthcare','P_HEALTHCARE','institutional'),'pharmacy':('healthcare','P_HEALTHCARE','institutional'),'place_of_worship':('religious','P_RELIGIOUS','institutional'),'police':('public_infrastructure','P_GOVERNMENT','institutional'),'post_office':('public_infrastructure','P_GOVERNMENT','institutional'),'bank':('commercial_retail','C_RETAIL','commercial'),'restaurant':('commercial_retail','C_RETAIL','commercial'),'cafe':('commercial_retail','C_RETAIL','commercial'),'pub':('commercial_retail','C_RETAIL','commercial'),'fast_food':('commercial_retail','C_RETAIL','commercial')}
          def classify(t):
              b=t.get('building')
              if b in BM: return BM[b],f'building={b}'
              a=t.get('amenity')
              if a in AM: return AM[a],f'amenity={a}'
              if t.get('shop'): return ('commercial_retail','C_RETAIL','commercial'),f"shop={t.get('shop')}"
              if t.get('office'): return ('office','C_OFFICE','commercial'),f"office={t.get('office')}"
              if t.get('tourism')=='hotel': return ('hospitality','C_HOSPITALITY','commercial'),'tourism=hotel'
              if t.get('landuse')=='industrial': return ('industrial','I_FACTORY','industrial'),'landuse=industrial'
              if t.get('landuse') in ('commercial','retail'): return ('commercial_retail','C_RETAIL','commercial'),f"landuse={t.get('landuse')}"
              if t.get('railway')=='station': return ('public_infrastructure','P_GOVERNMENT','institutional'),'railway=station'
              return None,None
          batches=[('Islington_Hackney',(51.5200,-0.1150,51.5650,-0.0200)),('TowerHamlets_Southwark',(51.4750,-0.1000,51.5350,-0.0005)),('Lambeth_Wandsworth',(51.4200,-0.2500,51.5000,-0.1000))]
          eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']
          added=[]; used=[]
          for name,(s,w,n,e) in batches:
              if len(added)>=60: break
              q=f'''[out:json][timeout:60];(way["building"]({s},{w},{n},{e});relation["building"]({s},{w},{n},{e});node["amenity"]({s},{w},{n},{e});node["shop"]({s},{w},{n},{e});node["office"]({s},{w},{n},{e});node["tourism"="hotel"]({s},{w},{n},{e});node["railway"="station"]({s},{w},{n},{e});way["landuse"="industrial"]({s},{w},{n},{e});way["landuse"="commercial"]({s},{w},{n},{e});way["landuse"="retail"]({s},{w},{n},{e}););out center 1000;'''
              raw=None; ep_used=None
              for ep in eps:
                  try:
                      req=urllib.request.Request(ep,data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':'TerraYield-AAYS-building_type_1/3.0'})
                      with urllib.request.urlopen(req,timeout=100) as r: raw=r.read()
                      ep_used=ep; break
                  except Exception as ex:
                      print('OVERPASS_RETRY',ep,repr(ex)); time.sleep(5)
              if raw is None: continue
              h=hashlib.sha256(raw).hexdigest(); data=json.loads(raw)
              used.append({'batch_name':name,'bbox':[s,w,n,e],'overpass_endpoint':ep_used,'response_sha256':h,'element_count':len(data.get('elements',[]))})
              for el in data.get('elements',[]):
                  if len(added)>=60: break
                  oid=f"ENG_OSM_{el.get('type')}_{el.get('id')}"
                  if oid in processed or str(el.get('id')) in processed: continue
                  tags=el.get('tags') or {}; cls,method=classify(tags)
                  if not cls: continue
                  lat=el.get('lat') or (el.get('center') or {}).get('lat'); lon=el.get('lon') or (el.get('center') or {}).get('lon')
                  if lat is None or lon is None: continue
                  m=nearest(float(lat),float(lon),150)
                  if not m: continue
                  dist,pp=m; pcl,_=classify(pp); agree=bool(pcl and pcl[1]==cls[1])
                  conf=3 if agree else 2; score=.88 if agree else .68; ev='B' if agree else 'C'
                  ex={k:tags[k] for k in ('building','amenity','shop','office','tourism','landuse','railway','name','addr:postcode','addr:street') if k in tags}
                  pex={k:pp[k] for k in ('amenity','shop','office','tourism','name') if k in pp}; pex['distance_m']=round(dist,1)
                  sources=[{'source_name':'OSM Overpass API','url':ep_used,'cache_sha256':h,'accessed_at':now,'licence':'ODbL 1.0','match_method':method,'match_score':.75,'evidence_excerpt':ex},{'source_name':'POI regional data (london)','url_or_local_path':'england_map_web/data/poi/london-points.geojson','cache_sha256':poi_sha,'accessed_at':now,'licence':'ODbL 1.0','match_method':'poi_within_150m','match_score':.25 if agree else .1,'evidence_excerpt':pex}]
                  feat={'type':'Feature','id':oid,'geometry':{'type':'Point','coordinates':[float(lon),float(lat)]},'properties':{'parcel_id':oid,'osm_id':el.get('id'),'osm_element_type':el.get('type'),'slot_id':SLOT,'region':'London','area':name,'local_authority':'London Inner','building_type_primary':cls[0],'building_type_code':cls[1],'building_category':cls[2],'evidence_level':ev,'confidence_score':score,'confidence_level_1_to_4':conf,'source_count':2,'match_method':method,'source':'OpenStreetMap via Overpass API + London POI proximity','source_url':f"https://www.openstreetmap.org/{el.get('type')}/{el.get('id')}",'osm_tags_summary':ex,'sources':sources,'source_evidence_excerpt':ex,'fake_data':False,'final_ready':False,'needs_manual_review':conf<3,'limitations':'POI proximity corroborates OSM; EPC/VOA/HMLR cadastral binding remains a later upgrade.','updated_at':now}}
                  added.append(feat); processed.add(oid); processed.add(str(el.get('id')))
              time.sleep(2)
          assert len(added)>=50, f'need>=50 got {len(added)}'
          added=added[:60]; fc['features'].extend(added); after=len(fc['features']); assert after-before>=50
          pathlib.Path('/tmp/expected_after').write_text(str(after))
          shard.write_text(json.dumps(fc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          out_sha=hashlib.sha256(shard.read_bytes()).hexdigest()
          confd=collections.Counter(str((f.get('properties') or {}).get('confidence_level_1_to_4',1)) for f in fc['features'])
          evd=collections.Counter(str((f.get('properties') or {}).get('evidence_level','U')) for f in fc['features'])
          cp=json.loads((stated/'checkpoint_latest.json').read_text()); old_idx=int(cp.get('next_batch_index') or 7)
          cp.update({'state':'IN_PROGRESS','source_head':SOURCE_HEAD,'continuation_key':CONT,'feature_count_before':before,'feature_count_after':after,'current_feature_count':after,'next_batch_index':max(8,old_idx+1),'next_target_feature_count':after+50,'last_batch_name':used[-1]['batch_name'],'last_batch_new_features':after-before,'last_batch_evidence':used,'last_processed_ids_sample':[f['id'] for f in added[-20:]],'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES','updated_at':now,'fake_data':False,'final_ready':False})
          (stated/'checkpoint_latest.json').write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n')
          st=json.loads((stated/'status_latest.json').read_text())
          st.update({'state':'IN_PROGRESS','owner':None,'updated_at':now,'continuation_key':CONT,'feature_count_before':before,'feature_count_after':after,'current_feature_count':after,'new_features_added':after-before,'confidence_distribution':{f'level_{k}':v for k,v in sorted(confd.items())},'evidence_distribution':dict(evd),'last_batch':used,'output_sha256':out_sha,'fake_data':False,'final_ready':False,'result':{'state':'RECOVERY_BATCH_APPENDED','note':f'Appended {after-before} new evidenced Inner London features.'}})
          (stated/'status_latest.json').write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')
          task=json.loads((stated/'current_task_latest.json').read_text())
          task.update({'state':'READY','status':'ready','panel_status':'HAZIR','owner':None,'claimable':True,'ready_for_claim':True,'continuation_key':CONT,'source_head':SOURCE_HEAD,'updated_at':now,'fake_data':False,'final_ready':False,'progress':{'completed_count':after,'target_count':after+50,'previous_percent':0.0,'current_percent':0.0,'percent_increase':0.0}})
          (stated/'current_task_latest.json').write_text(json.dumps(task,ensure_ascii=False,indent=2)+'\n')
          manifest=shard.with_name('building_type_1_manifest_latest.json')
          manifest.write_text(json.dumps({'schema_version':3,'slot_id':SLOT,'region':'London Inner','continuation_key':CONT,'updated_at':now,'feature_count_before':before,'feature_count_after':after,'new_features_added':after-before,'next_batch_index':cp['next_batch_index'],'next_target_feature_count':after+50,'source_batches':used,'poi_sha256':poi_sha,'output_sha256':out_sha,'fake_data':False,'final_ready':False},ensure_ascii=False,indent=2)+'\n')
          out=pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'slot_id':SLOT,'continuation_key':CONT,'state':'RECOVERY_BATCH_APPENDED','feature_count_before':before,'feature_count_after':after,'new_features_added':after-before,'source_batches':used,'output_sha256':out_sha,'fake_data':False,'final_ready':False,'updated_at':now},ensure_ascii=False,indent=2)+'\n')
          print('RECOVERY_RESULT',json.dumps({'before':before,'after':after,'added':after-before,'batches':used}))
          PY
      - name: Validate commit push and remote readback
        shell: bash
        run: |
          set -euo pipefail
          BR=codex/aays-single-runner-v5-20260706
          EXPECTED=$(cat /tmp/expected_after)
          git config user.name aays-building-type-1-bot
          git config user.email actions@users.noreply.github.com
          git add england_map_web/data/building_type/shards/building_type_1_latest.geojson england_map_web/data/building_type/shards/building_type_1_manifest_latest.json docs/chatgpt_status/_shared/slots_21/building_type_1 docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json
          git commit -m 'Append building_type_1 Inner London recovery batch r3'
          OUR=$(git rev-parse HEAD)
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR"
            if ! git merge-base --is-ancestor origin/$BR HEAD; then
              git rebase origin/$BR || { git rebase --abort || true; sleep 3; continue; }
              OUR=$(git rev-parse HEAD)
            fi
            if git push origin HEAD:"$BR"; then
              sleep 4
              git fetch origin "$BR"
              if git merge-base --is-ancestor "$OUR" origin/$BR; then
                git show origin/$BR:england_map_web/data/building_type/shards/building_type_1_latest.geojson > /tmp/remote.geojson
                git show origin/$BR:docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json > /tmp/remote_cp.json
                EXPECTED="$EXPECTED" python - <<'PY'
          import json,os
          d=json.load(open('/tmp/remote.geojson')); c=json.load(open('/tmp/remote_cp.json')); n=len(d['features']); exp=int(os.environ['EXPECTED'])
          assert n>=exp,(n,exp)
          assert c.get('current_feature_count')==n,(c.get('current_feature_count'),n)
          assert c.get('continuation_key')=='5863ed20ce49304e6f6c645502caa52bd8546d2c048456712ac9510ddf1c0c17'
          assert c.get('fake_data') is False and c.get('final_ready') is False
          tail=d['features'][-50:]
          assert len({str(f.get('id')) for f in d['features']})==n
          assert all((f.get('properties') or {}).get('source_count',0)>=2 for f in tail)
          assert all((f.get('properties') or {}).get('fake_data') is False and (f.get('properties') or {}).get('final_ready') is False for f in tail)
          print('REMOTE_READBACK_OK',n,c.get('next_batch_index'),c.get('next_target_feature_count'))
          PY
                exit 0
              fi
            fi
            sleep 3
          done
          exit 1
