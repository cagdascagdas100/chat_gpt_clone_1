name: security-public-safety-2-wave133-official-correspondence-package-provenance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/aays-triggers/security_public_safety_2_wave133.trigger.json"

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave133-official-correspondence-package-provenance
  cancel-in-progress: false

jobs:
  publish-official-correspondence-package-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout canonical work branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave133_official_correspondence_code_history_package_provenance_20260731.py

      - name: Run official correspondence code-history package provenance audit
        shell: bash
        run: |
          set -euo pipefail
          export AAYS_SOURCE_HEAD="$(git rev-parse HEAD)"
          python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave133_official_correspondence_code_history_package_provenance_20260731.py

      - name: Strict result validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd()
          output_json=root/"england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_correspondence_code_history_package_provenance_wave133_latest.json"
          output_html=root/"england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_correspondence_code_history_package_provenance_wave133.html"
          manual_json=root/"docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json"
          data=json.loads(output_json.read_text())
          manual=json.loads(manual_json.read_text())
          page=output_html.read_text()
          expected=hashlib.sha256(("AAYS_21_SLOT_SAFE_PARALLEL_V1|security_public_safety_2|codex/aays-single-runner-v5-20260706|WAVE133_SINGLE_OPEN_ROW_OFFICIAL_CORRESPONDENCE_CODE_HISTORY_PACKAGE_PROVENANCE|"+data["source_head"]).encode()).hexdigest()
          assert data["state"]=="COMPLETED_OFFICIAL_CORRESPONDENCE_CODE_HISTORY_PACKAGE_PROVENANCE_PUBLISHED"
          assert data["continuation_key"]==expected
          assert data["previous_continuation_key"]=="dacded4a0de4987af2134c089498f40bfb47c52c68f98064350377a159960874"
          assert len(data["rows"])==1 and data["rows"][0]["parcel_id"]=="parcel_40827"
          assert data["result"]["official_catalog_searches"]==32
          assert data["result"]["official_items_inspected"]<=80
          assert data["result"]["official_package_downloads"]<=32
          assert data["result"]["completed_or_fail_closed_operations"]==data["result"]["total_operations"]
          assert data["result"]["blocked_operations"]==0
          assert data["result"]["stuck_pending_operations"]==0
          assert data["scope"]["support_only"] is True
          assert data["scope"]["parent_values_mutated"] is False
          assert data["scope"]["parent_scores_mutated"] is False
          assert data["quality_policy"]["majority_vote_forbidden"] is True
          assert data["quality_policy"]["threshold_relaxation_forbidden"] is True
          assert data["quality_policy"]["nearby_record_inference_forbidden"] is True
          assert data["quality_policy"]["correspondence_row_alone_cannot_promote"] is True
          assert data["quality_policy"]["package_checksum_alone_cannot_promote"] is True
          assert data["quality_policy"]["parent_candidate_value_changed"] is False
          assert data["quality_policy"]["parent_candidate_accuracy_mutated"] is False
          assert data["fake_data"] is False
          assert manual["open_item_count"]+manual["resolved_item_count"]==16
          assert manual["requires_user_action"]==(manual["open_item_count"]>0)
          assert manual["final_ready"]==(manual["open_item_count"]==0)
          assert "parcel_40827" in page
          assert page.count("<tr>") >= len(data["operation_ledger"]) + len(data["official_catalog"]["searches"]) + 1
          print(json.dumps({"result":data["result"],"row":data["rows"][0],"manual":{"state":manual["state"],"open":manual["open_item_count"],"resolved":manual["resolved_item_count"]}},ensure_ascii=False))
          PY

      - name: Publish to moving canonical branch with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_correspondence_code_history_package_provenance_wave133_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_correspondence_code_history_package_provenance_wave133.html
          if ! git diff --cached --quiet; then
            git commit -m "security_public_safety_2: publish Wave133 official correspondence/package provenance [skip ci]"
          fi
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target_branch"
            git rebase "origin/$target_branch"
            if git push origin "HEAD:$target_branch"; then published=true; break; fi
            sleep $((attempt*2))
          done
          test "$published" = true

      - name: Canonical remote readback
        shell: bash
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git fetch origin "$target_branch"
          python - <<'PY'
          import hashlib, json, subprocess
          branch="origin/codex/aays-single-runner-v5-20260706"
          output_json="england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_correspondence_code_history_package_provenance_wave133_latest.json"
          output_html="england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_official_correspondence_code_history_package_provenance_wave133.html"
          manual_json="docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json"
          data_bytes=subprocess.check_output(["git","show",f"{branch}:{output_json}"])
          html_bytes=subprocess.check_output(["git","show",f"{branch}:{output_html}"])
          manual_bytes=subprocess.check_output(["git","show",f"{branch}:{manual_json}"])
          data=json.loads(data_bytes); manual=json.loads(manual_bytes)
          assert data["state"]=="COMPLETED_OFFICIAL_CORRESPONDENCE_CODE_HISTORY_PACKAGE_PROVENANCE_PUBLISHED"
          assert data["result"]["official_catalog_searches"]==32
          assert data["result"]["blocked_operations"]==0
          assert data["result"]["stuck_pending_operations"]==0
          assert manual["open_item_count"]+manual["resolved_item_count"]==16
          assert "parcel_40827" in html_bytes.decode()
          print(json.dumps({"state":data["state"],"result":data["result"],"row":data["rows"][0],"manual_state":manual["state"],"manual_open":manual["open_item_count"],"manual_resolved":manual["resolved_item_count"],"continuation_key":data["continuation_key"],"source_head":data["source_head"],"json_sha256":hashlib.sha256(data_bytes).hexdigest(),"html_sha256":hashlib.sha256(html_bytes).hexdigest(),"manual_sha256":hashlib.sha256(manual_bytes).hexdigest(),"remote_head":subprocess.check_output(["git","rev-parse",branch],text=True).strip()},ensure_ascii=False))
          PY
