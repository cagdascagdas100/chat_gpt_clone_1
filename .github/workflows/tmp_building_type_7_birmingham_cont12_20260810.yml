name: tmp building_type_7 Birmingham continuation batch 44

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_birmingham_cont12_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Execute transformed guarded predecessor for batch 44
        shell: bash
        run: |
          set -euo pipefail
          git show 481e7a7a9de83c82d6276d9ea5da5009e3b2280d:.github/workflows/tmp_building_type_7_birmingham_cont11_20260810.yml > /tmp/prev_slot7.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          text=Path('/tmp/prev_slot7.yml').read_text()
          marker='      - name: Guard state, append exactly 50, push and read back\n'
          assert marker in text, 'predecessor guarded step missing'
          section=text.split(marker,1)[1]
          run_marker='        run: |\n'
          assert run_marker in section, 'predecessor run block missing'
          body=textwrap.dedent(section.split(run_marker,1)[1])

          required=[
              'continuation batch 11',
              'birmingham_cont11',
              'CONTINUATION_11_REQUIRED',
              "current_feature_count') == 2100",
              "feature_count_after') == 2100",
              "next_batch_index') == 43",
              "next_target_feature_count') == 2150",
              'EXPECTED_BEFORE = 2100',
              'EXPECTED_BATCH = 43',
              'EXPECTED_TARGET = 2150',
              'len(feats) == 2150',
              'feats[:2100]',
              'feats[2100:]',
              '2100->2150',
          ]
          for anchor in required:
              assert anchor in body, f'missing predecessor anchor: {anchor}'

          body=body.replace('continuation batch 11','continuation batch 12')
          body=body.replace('birmingham_cont11','birmingham_cont12')
          body=body.replace('CONTINUATION_11_REQUIRED','CONTINUATION_12_REQUIRED')

          body=body.replace("next_batch_index') == 43", "next_batch_index') == __BATCH__")
          body=body.replace('EXPECTED_BATCH = 43','EXPECTED_BATCH = __BATCH__')
          body=body.replace("next_batch_index') == 44", "next_batch_index') == __NEXT_BATCH__")

          body=body.replace('2100','__BEFORE_COUNT__')
          body=body.replace('2150','__AFTER_COUNT__')
          body=body.replace('__BEFORE_COUNT__','2150')
          body=body.replace('__AFTER_COUNT__','2200')
          body=body.replace('__BATCH__','44')
          body=body.replace('__NEXT_BATCH__','45')

          assert 'continuation batch 11' not in body
          assert 'birmingham_cont11' not in body
          assert 'CONTINUATION_11_REQUIRED' not in body
          assert 'EXPECTED_BEFORE = 2150' in body
          assert 'EXPECTED_BATCH = 44' in body
          assert 'EXPECTED_TARGET = 2200' in body
          assert "current_feature_count') == 2150" in body
          assert "feature_count_after') == 2150" in body
          assert "next_batch_index') == 44" in body
          assert "next_target_feature_count') == 2200" in body
          assert 'len(feats) == 2200' in body
          assert 'feats[:2150]' in body and 'feats[2150:]' in body
          assert '2150->2200' in body
          assert 'Food Standards Agency FHRS daily open data - Birmingham continuation batch 12' in body
          assert 'BATCH_APPENDED_50_BIRMINGHAM_FHRS_CONTINUATION_12_REQUIRED' in body
          assert 'p.get(\"feature_id\")' in body and 'p.get(\"parcel_id\")' in body and 'p.get(\"osm_id\")' in body
          assert 'evidence_excerpt' in body and 'source_hash' in body and 'confidence_level_1_to_4' in body

          Path('/tmp/run_slot7_batch44.sh').write_text(body)
          PY
          bash /tmp/run_slot7_batch44.sh
