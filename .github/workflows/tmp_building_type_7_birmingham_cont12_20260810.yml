name: tmp building_type_7 Birmingham continuation batch 44

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_birmingham_cont12_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Safe retry guarded predecessor for batch 44
        shell: bash
        run: |
          set -euxo pipefail
          git show 481e7a7a9de83c82d6276d9ea5da5009e3b2280d:.github/workflows/tmp_building_type_7_birmingham_cont11_20260810.yml > /tmp/prev_slot7.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          text=Path('/tmp/prev_slot7.yml').read_text()
          marker='      - name: Guard state, append exactly 50, push and read back\n'
          if marker not in text:
              raise SystemExit('predecessor guarded step missing')
          section=text.split(marker,1)[1]
          run_marker='        run: |\n'
          if run_marker not in section:
              raise SystemExit('predecessor run block missing')
          body=textwrap.dedent(section.split(run_marker,1)[1])

          # Protect predecessor before/after and batch counters from recursive replacement.
          body=body.replace("next_batch_index') == 43", "next_batch_index') == __OLD_BATCH__")
          body=body.replace('EXPECTED_BATCH = 43','EXPECTED_BATCH = __OLD_BATCH__')
          body=body.replace("next_batch_index') == 44", "next_batch_index') == __NEXT_BATCH__")
          body=body.replace('continuation batch 11','continuation batch 12')
          body=body.replace('birmingham_cont11','birmingham_cont12')
          body=body.replace('CONTINUATION_11_REQUIRED','CONTINUATION_12_REQUIRED')
          body=body.replace('2100','__OLD_COUNT__')
          body=body.replace('2150','__NEW_COUNT__')
          body=body.replace('__OLD_COUNT__','2150')
          body=body.replace('__NEW_COUNT__','2200')
          body=body.replace('__OLD_BATCH__','44')
          body=body.replace('__NEXT_BATCH__','45')

          # Minimal transformation guard; predecessor itself performs the full data/evidence/readback validation.
          checks=(
              'Food Standards Agency FHRS daily open data - Birmingham continuation batch 12',
              'EXPECTED_BEFORE = 2150',
              'EXPECTED_BATCH = 44',
              'EXPECTED_TARGET = 2200',
              'BATCH_APPENDED_50_BIRMINGHAM_FHRS_CONTINUATION_12_REQUIRED',
              'data(building_type_7): append Birmingham FHRS continuation batch 2150->2200',
          )
          missing=[x for x in checks if x not in body]
          if missing:
              raise SystemExit('transformation guard missing: '+repr(missing))
          Path('/tmp/run_slot7_batch44.sh').write_text(body)
          print('retry transformation ready:', *checks, sep='\n- ')
          PY
          bash -x /tmp/run_slot7_batch44.sh
