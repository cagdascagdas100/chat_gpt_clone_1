name: AAYS BT5 strict source windows 176-187 main one-shot
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aays-bt5-strict-176-187-main-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-5-strict-main-once-176-187
  cancel-in-progress: false
jobs:
  strict-spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout canonical slot branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
          path: canonical
      - name: Install strict spatial runtime
        run: python -m pip install --quiet requests shapely
      - name: Execute BT5 source windows 176-187 with per-window remote readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,zlib
          payload=''
          open('/tmp/run_bt5_176_187.py','wb').write(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/run_bt5_176_187.py
