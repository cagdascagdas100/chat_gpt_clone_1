name: AAYS building_type_3 batch25 Chichester Bognor one-shot

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/tmp_bt3_batch25_chichester_bognor_20260811.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-3-batch25-chichester-bognor
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append evidence-backed batch 25
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp_bt3_batch25_chichester_bognor_20260811.py

      - name: Validate slot-only changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          geo = json.loads(pathlib.Path('england_map_web/data/building_type/shards/building_type_3_latest.geojson').read_text(encoding='utf-8'))
          status = json.loads(pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json').read_text(encoding='utf-8'))
          cp = json.loads(pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json').read_text(encoding='utf-8'))
          run = json.loads(pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json').read_text(encoding='utf-8'))
          assert len(geo['features']) == 5500
          assert status['feature_count_before'] == 5200 and status['feature_count_after'] == 5500
          assert cp['current_feature_count'] == 5500 and cp['next_batch_index'] == 26
          assert run['new_features_added'] == 300
          assert status['fake_data'] is False and status['final_ready'] is False
          assert cp['fake_data'] is False and cp['final_ready'] is False
          assert all(r.get('evidence_excerpt') and r.get('evidence_level') in {'B','C','D','U'} and 1 <= int(r.get('confidence_level_1_to_4')) <= 4 for r in run['records'])
          print('local_validation_ok')
          PY
          allowed='^(england_map_web/data/building_type/shards/building_type_3_latest.geojson|england_map_web/data/building_type/shards/building_type_3_manifest_latest.json|docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json|docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json|docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json|docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json)$'
          bad=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected modified paths:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Commit and push slot outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git config user.name 'aays-building-type-3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f -- \
            .github/tmp_bt3_batch25_chichester_bognor_20260811.py \
            .github/workflows/tmp_bt3_batch25_chichester_bognor_20260811.yml
          git add -- \
            england_map_web/data/building_type/shards/building_type_3_latest.geojson \
            england_map_web/data/building_type/shards/building_type_3_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json
          git diff --cached --check
          git commit -m 'data(building_type_3): append Chichester Bognor OSM batch 25'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                break
              fi
            else
              git rebase --abort || true
              echo 'Rebase conflict; refusing to overwrite concurrent changes.' >&2
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Push failed after bounded retries.' >&2
              exit 1
            fi
            sleep $((attempt*2))
          done

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git fetch origin "$BRANCH"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse "origin/$BRANCH")
          test "$local_sha" = "$remote_sha"
          git show "origin/$BRANCH:docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json" > /tmp/bt3_status_remote.json
          git show "origin/$BRANCH:docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json" > /tmp/bt3_checkpoint_remote.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/bt3_status_remote.json', encoding='utf-8'))
          c=json.load(open('/tmp/bt3_checkpoint_remote.json', encoding='utf-8'))
          assert s['feature_count_before'] == 5200
          assert s['feature_count_after'] == 5500
          assert s['new_features_added'] == 300
          assert s['fake_data'] is False and s['final_ready'] is False
          assert c['current_feature_count'] == 5500
          assert c['next_batch_index'] == 26
          assert c['fake_data'] is False and c['final_ready'] is False
          print('REMOTE_READBACK_OK', s['last_batch_city'], s['last_batch_evidence_distribution'], s['last_batch_confidence_distribution'])
          PY
