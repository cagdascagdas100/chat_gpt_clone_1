name: AAYS building_type_4 batch91 Tavistock one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-4-batch91-tavistock-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-4-batch91-tavistock-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_4_latest.geojson
            england_map_web/data/building_type/shards/building_type_4_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_4
            docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs

      - name: Fast-forward sparse checkout to latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Execute guarded batch91 Tavistock continuation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          code = '\n'.join(lines) + '\n'
          replacements = {
              'SLOT = "building_type_6"': 'SLOT = "building_type_4"',
              'TASK = "building-type-6-england-classification-v1-20260808"': 'TASK = "building-type-4-england-classification-v1-20260808"',
              'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"': 'CONT = ""',
              'CITY = "Skegness"': 'CITY = "Tavistock"',
              'LOCAL_AUTHORITY = "East Lindsey"': 'LOCAL_AUTHORITY = "West Devon"',
              'REGION = "East Midlands"': 'REGION = "South West"',
              'BATCH_INDEX = 26': 'BATCH_INDEX = 91',
              'EXPECTED_BEFORE = 2250': 'EXPECTED_BEFORE = 4500',
              'ADD_COUNT = 250': 'ADD_COUNT = 50',
              'TARGET_AFTER = 2500': 'TARGET_AFTER = 4550',
              'NEXT_TARGET = 2750': 'NEXT_TARGET = 4600',
              'BBOX = [0.20, 53.08, 0.48, 53.21]': 'BBOX = [-4.18, 50.53, -4.10, 50.58]',
              'england_map_web/data/building_type/shards/building_type_6_latest.geojson': 'england_map_web/data/building_type/shards/building_type_4_latest.geojson',
              'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json': 'england_map_web/data/building_type/shards/building_type_4_manifest_latest.json',
              'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json': 'docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json',
              'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json': 'docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json',
              'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json': 'docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json',
              'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json': 'docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json',
          }
          for old, new in replacements.items():
              if old not in code:
                  raise SystemExit(f'missing canonical replacement token: {old}')
              code = code.replace(old, new, 1)
          code = code.replace('building_type_6', 'building_type_4')
          code = code.replace('Skegness', 'Tavistock').replace('SKEGNESS', 'TAVISTOCK').replace('skegness', 'tavistock')
          old_guard = 'if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new_guard = 'if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old_guard not in code:
              raise SystemExit('missing continuation guard token')
          code = code.replace(old_guard, new_guard, 1)
          Path('/tmp/building_type_4_batch91_tavistock.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/building_type_4_batch91_tavistock.py

      - name: Commit and push batch 91
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_4_latest.geojson \
            england_map_web/data/building_type/shards/building_type_4_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json
          git diff --cached --quiet && { echo "No slot changes to commit; refusing false progress"; exit 1; }
          git commit -m "data(building_type_4): append Tavistock OSM batch 91 4500->4550"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              exit 0
            fi
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then
              git merge --abort || true
              echo "merge conflict; refusing to overwrite concurrent slot changes"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Remote readback invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json, subprocess
          BR = 'origin/codex/aays-single-runner-v5-20260706'
          def remote_json(path):
              raw = subprocess.check_output(['git','show',f'{BR}:{path}'])
              return json.loads(raw.decode('utf-8'))
          geo = remote_json('england_map_web/data/building_type/shards/building_type_4_latest.geojson')
          cp = remote_json('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json')
          st = remote_json('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          run = remote_json('docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json')
          task = remote_json('docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json')
          feats = geo.get('features') or []
          assert len(feats) == 4550, len(feats)
          assert cp.get('current_feature_count') == 4550
          assert cp.get('feature_count_before') == 4500 and cp.get('feature_count_after') == 4550
          assert cp.get('next_batch_index') == 92 and cp.get('next_target_feature_count') == 4600
          assert st.get('total_elements') == 4550
          assert run.get('city') == 'Tavistock' and run.get('new_feature_count') == 50
          assert run.get('local_authority') == 'West Devon'
          assert run.get('feature_count_before') == 4500 and run.get('feature_count_after') == 4550
          assert task.get('task_id') == 'building-type-4-england-classification-v1-20260808'
          assert (task.get('continuation_key') or '') == ''
          assert task.get('owner') is None
          assert cp.get('fake_data') is False and st.get('fake_data') is False and run.get('fake_data') is False and task.get('fake_data') is False
          assert cp.get('final_ready') is False and st.get('final_ready') is False and run.get('final_ready') is False and task.get('final_ready') is False
          records = run.get('records') or []
          assert len(records) == 50
          for r in records:
              assert r.get('evidence_excerpt')
              assert r.get('evidence_level') in {'A','B','C','D','U'}
              assert r.get('confidence_level_1_to_4') in {1,2,3,4}
              assert r.get('source_url') and r.get('sources')
              assert r.get('fake_data') is False and r.get('final_ready') is False
          all_seen=set()
          for f in feats:
              fid=f.get('id'); p=(f.get('properties') or {})
              vals=[fid,p.get('parcel_id'),p.get('osm_id')]
              for v in vals:
                  if v in (None,''): continue
                  key=str(v)
                  assert key not in all_seen, key
                  all_seen.add(key)
          print('REMOTE_READBACK_OK building_type_4 4500->4550 batch91 Tavistock; evidence present; final_ready=false')
          PY
