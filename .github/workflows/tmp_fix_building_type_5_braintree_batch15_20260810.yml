name: tmp fix building_type_5 Braintree batch15

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_fix_building_type_5_braintree_batch15_20260810.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0
      - name: Fix Braintree workflow checkpoint expression and relaunch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          WF='.github/workflows/tmp_building_type_5_braintree_batch15_20260810.yml'
          FIX='.github/workflows/tmp_fix_building_type_5_braintree_batch15_20260810.yml'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp_building_type_5_braintree_batch15_20260810.yml')
          s=p.read_text()
          old="'summary':dict(checkpoint.get('summary') or {},progress_count_delta:=(after-before))"
          new="'summary':dict(checkpoint.get('summary') or {})"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f "$FIX"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$WF" "$FIX"
          git commit -m 'chore(building_type_5): launch guarded Braintree batch 15'
          for attempt in 1 2 3 4 5; do
            if git push origin "$BRANCH"; then exit 0; fi
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 43
