name: AAYS building_type_1 batch133 Hammersmith West Kensington E one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-1-batch133-hammersmith-west-kensington-e-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-1-batch133-hammersmith-west-kensington-e-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_1_latest.geojson
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_1
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs
      - name: Fast-forward to canonical head
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Execute guarded batch133
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          repl={
          'SLOT = "building_type_6"':'SLOT = "building_type_1"',
          'TASK = "building-type-6-england-classification-v1-20260808"':'TASK = "building-type-1-england-classification-v1-20260808"',
          'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"':'CONT = ""',
          'CITY = "Skegness"':'CITY = "Hammersmith_West_Kensington_E"',
          'LOCAL_AUTHORITY = "East Lindsey"':'LOCAL_AUTHORITY = "Hammersmith & Fulham"',
          'REGION = "East Midlands"':'REGION = "London Inner"',
          'BATCH_INDEX = 26':'BATCH_INDEX = 133',
          'EXPECTED_BEFORE = 2250':'EXPECTED_BEFORE = 8450',
          'ADD_COUNT = 250':'ADD_COUNT = 50',
          'TARGET_AFTER = 2500':'TARGET_AFTER = 8500',
          'NEXT_TARGET = 2750':'NEXT_TARGET = 8550',
          'BBOX = [0.20, 53.08, 0.48, 53.21]':'BBOX = [-0.225, 51.490, -0.195, 51.505]',
          'england_map_web/data/building_type/shards/building_type_6_latest.geojson':'england_map_web/data/building_type/shards/building_type_1_latest.geojson',
          'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json':'england_map_web/data/building_type/shards/building_type_1_manifest_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json',
          'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json':'docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'}
          for old,new in repl.items():
              if old not in code:
                  raise SystemExit(f'missing token {old}')
              code=code.replace(old,new,1)
          code=code.replace('building_type_6','building_type_1')
          code=code.replace('Skegness','Hammersmith_West_Kensington_E').replace('SKEGNESS','HAMMERSMITH_WEST_KENSINGTON_E').replace('skegness','hammersmith_west_kensington_e')
          code=code.replace('East Lindsey','Hammersmith & Fulham').replace('east_lindsey','hammersmith_fulham')
          old='if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new='if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old not in code:
              raise SystemExit('missing continuation guard')
          Path('/tmp/bt1_b133.py').write_text(code.replace(old,new,1), encoding='utf-8')
          PY
          python /tmp/bt1_b133.py
      - name: Commit and push exact slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_1_latest.geojson \
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json
          git diff --cached --quiet && { echo 'No progress'; exit 1; }
          git commit -m 'data(building_type_1): append Hammersmith West Kensington E OSM batch 133 8450->8500'
          for a in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
          done
          exit 1
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_1_latest.geojson')
          m=j('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json')
          c=j('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json')
          s=j('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json')
          r=j('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json')
          t=j('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json')
          assert len(g.get('features') or [])==8500
          assert c.get('feature_count_before')==8450 and c.get('feature_count_after')==8500 and c.get('current_feature_count')==8500 and c.get('next_batch_index')==134
          assert s.get('feature_count_before')==8450 and s.get('feature_count_after')==8500 and s.get('total_elements')==8500 and s.get('new_features_added')==50
          assert r.get('city')=='Hammersmith_West_Kensington_E' and r.get('new_feature_count')==50 and r.get('feature_count_before')==8450 and r.get('feature_count_after')==8500
          assert t.get('owner') is None and (t.get('continuation_key') or '')==''
          assert m.get('total_features')==8500 or m.get('feature_count')==8500 or m.get('current_feature_count')==8500
          assert all(x.get('fake_data') is False for x in (c,s,r,t,m))
          assert all(x.get('final_ready') is False for x in (c,s,r,t,m))
          rec=r.get('records') or []
          assert len(rec)==50
          for x in rec:
              assert x.get('evidence_excerpt')
              assert x.get('evidence_level') in {'A','B','C','D','U'}
              assert x.get('confidence_level_1_to_4') in {1,2,3,4}
              assert x.get('source_url') and x.get('source_hash') and x.get('sources')
              assert x.get('fake_data') is False and x.get('final_ready') is False
          seen=set()
          for f in g.get('features') or []:
              p=f.get('properties') or {}
              vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v not in (None,'')}
              assert not (seen & vals)
              seen.update(vals)
          print('REMOTE_READBACK_OK building_type_1 8450->8500 batch133 Hammersmith_West_Kensington_E final_ready=false')
          PY
