name: tmp building_type_4 Bristol continuation batch 42

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_4_dorset_batch11_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-4-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new Bristol continuation FHRS evidence features
        shell: bash
        run: |
          set -euo pipefail
          git show 36e3ec4b60407b31446311ee7d6015012a2de1b7:.github/workflows/tmp_building_type_4_dorset_batch11_20260810.yml > /tmp/batch41.yml
          python3 <<'PY'
          from pathlib import Path
          text=Path('/tmp/batch41.yml').read_text(encoding='utf-8')
          anchor='      - name: Append exactly 50 new Bristol continuation FHRS evidence features'
          marker="          python3 <<'PY'\n"
          a=text.index(anchor)
          start=text.index(marker,a)+len(marker)
          end=text.index("\n          PY",start)
          lines=text[start:end].splitlines()
          body="\n".join(line[10:] if line.startswith("          ") else line for line in lines)+"\n"
          replacements=[
            ('BEFORE=2000; TARGET=2050; BATCH=41; NEXT_BATCH=42; NEXT_TARGET=2100',
             'BEFORE=2050; TARGET=2100; BATCH=42; NEXT_BATCH=43; NEXT_TARGET=2150'),
            ('Batch 41 appended from official Bristol FHRS continuation records',
             'Batch 42 appended from official Bristol FHRS continuation records'),
            ('BATCH_41_APPENDED_50_BRISTOL_FHRS_CONTINUATION_REQUIRED',
             'BATCH_42_APPENDED_50_BRISTOL_FHRS_CONTINUATION_REQUIRED'),
            ('feature_count 2000 -> 2050', 'feature_count 2050 -> 2100'),
            ('Sonraki adim batch 42: mevcut 2050 feature',
             'Sonraki adim batch 43: mevcut 2100 feature'),
          ]
          for old,new in replacements:
              if old not in body:
                  raise AssertionError(f'missing replacement token: {old}')
              body=body.replace(old,new)
          required=[
            'CITY="Bristol"', 'PREFIX="BRIS"', 'FHRS855en-GB.xml',
            'BEFORE=2050; TARGET=2100; BATCH=42; NEXT_BATCH=43; NEXT_TARGET=2150',
            'authority.lower()!="bristol"', 'evidence_excerpt',
            '"evidence_level":"D"', '"confidence_level_1_to_4":2',
            '"fake_data":False', '"final_ready":False',
          ]
          missing=[x for x in required if x not in body]
          assert not missing, missing
          exec(compile(body,'<building_type_4_bristol_continuation_batch42_append>','exec'), {'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          shard=json.loads(Path("england_map_web/data/building_type/shards/building_type_4_latest.geojson").read_text())
          manifest=json.loads(Path("england_map_web/data/building_type/shards/building_type_4_manifest_latest.json").read_text())
          checkpoint=json.loads(Path("docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json").read_text())
          status=json.loads(Path("docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json").read_text())
          runner=json.loads(Path("docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json").read_text())
          task=json.loads(Path("docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json").read_text())
          assert len(shard.get("features") or [])==2100
          assert manifest.get("feature_count_before")==2050 and manifest.get("feature_count_after")==2100 and manifest.get("added_feature_count")==50
          assert checkpoint.get("current_feature_count")==2100 and checkpoint.get("next_batch_index")==43 and checkpoint.get("next_target_feature_count")==2150
          assert status.get("current_feature_count")==2100 and runner.get("feature_count_before")==2050 and runner.get("feature_count_after")==2100 and runner.get("added_feature_count")==50
          assert task.get("owner") is None and task.get("task_id")=="building-type-4-england-classification-v1-20260808"
          for o in (manifest,checkpoint,status,runner):
              assert o.get("fake_data") is False and o.get("final_ready") is False
          ids=list(runner.get("new_feature_ids") or [])
          assert len(ids)==50 and len(set(ids))==50 and all(str(x).startswith("BRIS_FHRS_") for x in ids)
          idset=set(ids)
          new=[f for f in shard["features"] if f.get("id") in idset]
          assert len(new)==50 and len(runner.get("records") or [])==50
          assert len([f for f in shard["features"] if str(f.get("id") or "").startswith("BRIS_FHRS_")])==500
          assert len({(f.get("properties") or {}).get("parcel_id") for f in new})==50
          for f in new:
              p=f.get("properties") or {}
              assert p.get("evidence_excerpt") and p.get("source_evidence_excerpt")
              assert p.get("evidence_level")=="D" and p.get("confidence_level_1_to_4")==2
              assert p.get("confidence_score")==0.55 and p.get("needs_manual_review") is True
              assert p.get("source_hash") and p.get("sources")
              assert p.get("source_url")=="https://ratings.food.gov.uk/api/open-data-files/FHRS855en-GB.xml"
              assert p.get("fake_data") is False and p.get("final_ready") is False
              assert "cadastral parcel identity and building fabric remain unverified" in p.get("limitations","")
          print("validated 2050->2100 with 50 new Bristol continuation features outside processed IDs")
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_4_latest.geojson
            england_map_web/data/building_type/shards/building_type_4_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r path; do
            ok=0
            for expected in "${paths[@]}"; do [[ "$path" == "$expected" ]] && ok=1; done
            [[ "$ok" == 1 ]] || { echo "unexpected staged path: $path"; exit 1; }
          done < <(git diff --cached --name-only)
          git commit -m "data(building_type_4): append Bristol FHRS continuation batch 2050->2100"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'
          def load(path): return json.loads(subprocess.check_output(['git','show',f'{ref}:{path}']))
          shard=load('england_map_web/data/building_type/shards/building_type_4_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_4_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_4/runner_outputs/building_type_4_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_4/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_4/status_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_4/current_task_latest.json')
          assert len(shard['features'])==2100
          assert manifest['feature_count_before']==2050 and manifest['feature_count_after']==2100 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==2100 and checkpoint['next_batch_index']==43 and checkpoint['next_target_feature_count']==2150
          assert status['current_feature_count']==2100
          assert runner['city']=='Bristol' and len(runner['new_feature_ids'])==50
          assert task['owner'] is None
          for o in (manifest,checkpoint,status,runner,task):
              assert o.get('fake_data') is False and o.get('final_ready') is False
          ids=set(runner['new_feature_ids'])
          batch=[f for f in shard['features'] if f.get('id') in ids]
          assert len(batch)==50 and all(str(f.get('id') or '').startswith('BRIS_FHRS_') for f in batch)
          assert len([f for f in shard['features'] if str(f.get('id') or '').startswith('BRIS_FHRS_')])==500
          assert all((f.get('properties') or {}).get('evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('evidence_level')=='D' for f in batch)
          assert all((f.get('properties') or {}).get('confidence_level_1_to_4')==2 for f in batch)
          assert all((f.get('properties') or {}).get('fake_data') is False for f in batch)
          assert all((f.get('properties') or {}).get('final_ready') is False for f in batch)
          print('remote readback verified: building_type_4=2100; Bristol continuation batch=50')
          PY
