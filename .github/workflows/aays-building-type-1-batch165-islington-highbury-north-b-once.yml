name: AAYS building_type_1 batch165 Islington Highbury North B one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-1-batch165-islington-highbury-north-b-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-1-batch165-islington-highbury-north-b-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_1_latest.geojson
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_1
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs
      - name: Fast-forward to canonical head
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Execute guarded batch165
        id: guarded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          repl={
            'SLOT = "building_type_6"':'SLOT = "building_type_1"',
            'TASK = "building-type-6-england-classification-v1-20260808"':'TASK = "building-type-1-england-classification-v1-20260808"',
            'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"':'CONT = ""',
            'CITY = "Skegness"':'CITY = "Islington_Highbury_North_B"',
            'LOCAL_AUTHORITY = "East Lindsey"':'LOCAL_AUTHORITY = "Islington"',
            'REGION = "East Midlands"':'REGION = "London Inner"',
            'BATCH_INDEX = 26':'BATCH_INDEX = 165',
            'EXPECTED_BEFORE = 2250':'EXPECTED_BEFORE = 10050',
            'ADD_COUNT = 250':'ADD_COUNT = 50',
            'TARGET_AFTER = 2500':'TARGET_AFTER = 10100',
            'NEXT_TARGET = 2750':'NEXT_TARGET = 10150',
            'BBOX = [0.20, 53.08, 0.48, 53.21]':'BBOX = [-0.075, 51.565, -0.055, 51.580]',
            'england_map_web/data/building_type/shards/building_type_6_latest.geojson':'england_map_web/data/building_type/shards/building_type_1_latest.geojson',
            'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json':'england_map_web/data/building_type/shards/building_type_1_manifest_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json',
            'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json',
            'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json':'docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'
          }
          for old,new in repl.items():
              if old not in code:
                  raise SystemExit(f'missing generator token {old}')
              code=code.replace(old,new,1)
          code=code.replace('building_type_6','building_type_1')
          code=code.replace('Skegness','Islington_Highbury_North_B').replace('SKEGNESS','ISLINGTON_HIGHBURY_NORTH_B').replace('skegness','islington_highbury_north_b')
          code=code.replace('East Lindsey','Islington').replace('east_lindsey','islington')

          old='if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new='if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old not in code: raise SystemExit('missing continuation guard')
          code=code.replace(old,new,1)
          code=code.replace('for key in ("parcel_id", "osm_id"):', 'for key in ("parcel_id", "osm_id", "source_ref"):')
          old='if {fid, pid, osmid, engfid, str(oid), f"{typ}_{oid}"} & already:'
          new='if {fid, pid, osmid, f"OSM:{osmid}", engfid, str(oid), f"{typ}_{oid}"} & already:'
          if old not in code: raise SystemExit('missing candidate dedupe token')
          code=code.replace(old,new,1)

          old='nwr["building"]({south},{west},{north},{east});\n          out body center qt 3500;'
          new='area["boundary"="administrative"]["name"="London Borough of Islington"]->.a;\n          nwr(area.a)["building"~"^(house|detached|semidetached_house|terrace|apartments|bungalow|residential|dormitory|retail|commercial|office|hotel|industrial|warehouse|school|college|university|church|chapel|hospital|civic|public|train_station|barn|farm|farm_auxiliary|stable)$"]({south},{west},{north},{east});\n          out body center qt 250;'
          if old not in code: raise SystemExit('missing Overpass query token')
          code=code.replace(old,new,1)
          if 'for attempt in range(1, 4):' not in code or 'if attempt < 3:' not in code:
              raise SystemExit('missing retry tokens')
          code=code.replace('for attempt in range(1, 4):','for attempt in range(1, 3):',1)
          code=code.replace('if attempt < 3:','if attempt < 2:',1)
          old='if raw is None:\n    raise SystemExit(f"Overpass failed after 3 attempts: {last_error}")'
          new='''if raw is None:\n    checkpoint["state"] = "BLOCKED_SOURCE_ACCESS"\n    checkpoint["first_unverified_step_status"] = "BLOCKED_SOURCE_ACCESS"\n    checkpoint["blocker"] = "BLOCKED_SOURCE_ACCESS"\n    checkpoint["blocked_source_url"] = ENDPOINT\n    checkpoint["blocked_source_error"] = last_error\n    checkpoint["blocked_source_attempts"] = 2\n    checkpoint["blocked_source_batch_index"] = BATCH_INDEX\n    checkpoint["next_batch_index"] = BATCH_INDEX + 1\n    checkpoint["next_city_index"] = BATCH_INDEX + 1\n    checkpoint["next_required_action"] = f"CONTINUE_BATCH_{BATCH_INDEX + 1}_DO_NOT_RETRY_{ENDPOINT}"\n    checkpoint["updated_at"] = NOW\n    checkpoint["final_ready"] = False\n    checkpoint["fake_data"] = False\n    attempted = checkpoint.setdefault("attempted_cities", [])\n    if CITY not in attempted:\n        attempted.append(CITY)\n    dump(CP, checkpoint)\n    print(f"BLOCKED_SOURCE_ACCESS url={ENDPOINT} next_index={BATCH_INDEX + 1} error={last_error}")\n    raise SystemExit(42)'''
          if old not in code: raise SystemExit('missing source failure token')
          code=code.replace(old,new,1)

          old='chosen = candidates[:ADD_COUNT]'
          new='evidence_candidates = [row for row in candidates if row[8][0] != "unknown" and row[8][3] == "B" and str((row[7] or {}).get("building", "")).strip().lower() not in {"", "yes", "construction", "proposed", "no"}]\nchosen = evidence_candidates[:ADD_COUNT]'
          if old not in code: raise SystemExit('missing candidate selection token')
          code=code.replace(old,new,1)
          code=code.replace('raise SystemExit(f"only {len(chosen)} new geometry-bearing candidates; need >= {ADD_COUNT}")', 'raise SystemExit(f"NO_EVIDENCE_THIS_BATCH: only {len(chosen)} direct-building-tag candidates; need exactly {ADD_COUNT}")',1)
          old='"osm_id": osmid,'
          new='"osm_id": osmid,\n        "source_ref": f"OSM:{osmid}",'
          if old not in code: raise SystemExit('missing osm_id property token')
          code=code.replace(old,new,1)
          old='"source_url": object_url,'
          new='"source_url": object_url,\n        "source_path": ENDPOINT,'
          if old not in code: raise SystemExit('missing source_url property token')
          code=code.replace(old,new,1)
          old='"url_or_local_path": ENDPOINT,'
          new='"url_or_local_path": ENDPOINT,\n                      "url_or_path": ENDPOINT,\n                      "source_id": f"OSM:{osmid}",'
          if old not in code: raise SystemExit('missing nested source path token')
          code=code.replace(old,new,1)
          Path('/tmp/bt1_b165.py').write_text(code, encoding='utf-8')
          PY

          set +e
          python /tmp/bt1_b165.py
          rc=$?
          set -e
          if [ "$rc" -eq 42 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json
            git diff --cached --quiet || git commit -m 'state(building_type_1): record batch165 source access blocker'
            for a in 1 2 3 4 5; do
              if git push origin HEAD:codex/aays-single-runner-v5-20260706; then break; fi
              git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
              if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            done
            echo 'result=blocked' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo 'result=success' >> "$GITHUB_OUTPUT"

      - name: Normalize batch165 metadata
        if: steps.guarded.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          CITY='Islington_Highbury_North_B'; AUTHORITY='Islington'; BBOX=[-0.075,51.565,-0.055,51.580]
          BEFORE=10050; AFTER=10100; NEXT=10150; ENDPOINT='https://overpass-api.de/api/interpreter'
          paths={'geo':Path('england_map_web/data/building_type/shards/building_type_1_latest.geojson'),'man':Path('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json'),'sta':Path('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json'),'cp':Path('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'),'ct':Path('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json'),'run':Path('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json')}
          def load(k): return json.loads(paths[k].read_text(encoding='utf-8'))
          def dump(k,obj,compact=False): paths[k].write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':') if compact else None,indent=None if compact else 2)+'\n',encoding='utf-8')
          geo,man,sta,cp,ct,run=[load(k) for k in ('geo','man','sta','cp','ct','run')]
          now=run['generated_at']; sha=run['source_sha256']; rec=run.get('records') or []
          if len(rec)!=50: raise SystemExit('runner record count must be exactly 50')
          for r in rec:
            if r.get('local_authority') != AUTHORITY: raise SystemExit('authority mismatch')
            if r.get('building_type_primary') in (None,'','unknown') or r.get('evidence_level')!='B': raise SystemExit('non-direct evidence record selected')
            if r.get('confidence_level_1_to_4') != 3: raise SystemExit('direct OSM evidence must be confidence 3')
            if not r.get('source_ref') or not r.get('source_url') or not r.get('source_path') or not r.get('source_hash'): raise SystemExit('missing top-level source metadata')
            srcs=r.get('sources') or []
            if not srcs: raise SystemExit('missing nested source metadata')
            s=srcs[0]
            for k in ('url_or_path','accessed_at','sha256','licence','source_id','fields_used','match_method'):
              if not s.get(k): raise SystemExit(f'missing source field {k}')
            if r.get('fake_data') is not False or r.get('final_ready') is not False: raise SystemExit('safety flag violation')
          batch_ev={'batch_name':CITY,'bbox':BBOX,'local_authority':AUTHORITY,'overpass_endpoint':ENDPOINT,'response_sha256':sha,'returned_element_cap':250,'new_feature_count':50,'attempted_parcels':50,'no_evidence_this_batch':False,'accessed_at':now,'licence':'ODbL 1.0','match_method':'direct_osm_building_tag_element_id'}
          sta.update({'state':'READY','updated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,'current_feature_count':AFTER,'total_elements':AFTER,'new_features_added':50,'result':{'state':'BATCH_APPENDED','note':f'Appended exactly 50 new {CITY} direct building-tag OSM features; deduped on feature.id/parcel_id/osm_id/source_ref.'},'last_batch':[batch_ev],'next_batch_index':166,'next_target_feature_count':NEXT,'blocker':None,'fake_data':False,'final_ready':False,'progress_counted':True,'note':f'NEW_PAGE_RESUME_READY: 50 direct OSM building-tag records appended in {AUTHORITY}.'})
          cp.update({'state':'READY','first_unverified_step_status':'READY','blocker':None,'last_batch_name':CITY,'last_batch_new_features':50,'last_batch_evidence':[batch_ev],'next_grid_hint':'UNRESOLVED_NEXT_UNPROCESSED_GRID','read_fallback_used':False,'fake_data':False,'final_ready':False,'next_batch_index':166,'next_city_index':166,'next_target_feature_count':NEXT,'next_required_action':'CONTINUE_BATCH_166_FROM_10100_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES'})
          if isinstance(cp.get('already_processed_ids'),dict): cp['already_processed_ids']['strategy']='derived_from_latest_shard_feature.id_plus_parcel_id_plus_osm_id_plus_source_ref'
          man.update({'updated_at':now,'feature_count_before':BEFORE,'feature_count_after':AFTER,'new_features_added':50,'current_feature_count':AFTER,'feature_count':AFTER,'total_features':AFTER,'next_batch_index':166,'next_target_feature_count':NEXT,'continuation_key':'','fake_data':False,'final_ready':False})
          batches=man.setdefault('source_batches',[])
          if not any(x.get('batch_name')==CITY for x in batches if isinstance(x,dict)): batches.append(batch_ev)
          sc=sta.get('confidence_distribution') or {}
          man['confidence_distribution']={'level_1':sc.get('1',0),'level_2':sc.get('2',0),'level_3':sc.get('3',0),'level_4':sc.get('4',0)}
          run.update({'attempted_parcels':50,'source_path':ENDPOINT,'no_evidence_this_batch':False,'fake_data':False,'final_ready':False,'local_authority':AUTHORITY,'max_source_features_processed':250,'resume_state':'NEW_PAGE_RESUME_READY'})
          ct.update({'state':'READY','status':'ready','panel_status':'HAZIR','fake_data':False,'final_ready':False,'owner':None,'continuation_key':'','first_unverified_step':'APPEND_NEW_BATCH_166_AFTER_FEATURE_10100'})
          dump('geo',geo,compact=True); dump('man',man); dump('sta',sta); dump('cp',cp); dump('ct',ct); dump('run',run)
          PY

      - name: Commit and push exact slot outputs
        if: steps.guarded.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/building_type/shards/building_type_1_latest.geojson \
            england_map_web/data/building_type/shards/building_type_1_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json
          git diff --cached --quiet && { echo 'No progress'; exit 1; }
          git commit -m 'data(building_type_1): append batch165 Highbury North B direct OSM 10050->10100'
          pushed=0
          for a in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then pushed=1; break; fi
            git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
          done
          [ "$pushed" -eq 1 ] || exit 1

      - name: Remote readback success
        if: steps.guarded.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_1_latest.geojson'); m=j('england_map_web/data/building_type/shards/building_type_1_manifest_latest.json'); c=j('docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'); s=j('docs/chatgpt_status/_shared/slots_21/building_type_1/status_latest.json'); r=j('docs/chatgpt_status/building_type/slots/building_type_1/runner_outputs/building_type_1_classification_latest.json'); t=j('docs/chatgpt_status/_shared/slots_21/building_type_1/current_task_latest.json')
          assert len(g.get('features') or [])==10100
          assert c.get('feature_count_before')==10050 and c.get('feature_count_after')==10100 and c.get('current_feature_count')==10100 and c.get('next_batch_index')==166
          assert s.get('feature_count_before')==10050 and s.get('feature_count_after')==10100 and s.get('current_feature_count')==10100 and s.get('new_features_added')==50
          assert r.get('city')=='Islington_Highbury_North_B' and r.get('new_feature_count')==50 and r.get('max_source_features_processed')==250
          assert t.get('owner') is None and (t.get('continuation_key') or '')==''
          assert m.get('current_feature_count')==10100 and m.get('total_features')==10100
          rec=r.get('records') or []; assert len(rec)==50
          for x in rec:
            assert x.get('building_type_primary') not in (None,'','unknown'); assert x.get('evidence_level')=='B'; assert x.get('confidence_level_1_to_4')==3; assert x.get('source_ref') and x.get('source_hash'); ss=x.get('sources') or []; assert ss and ss[0].get('url_or_path') and ss[0].get('accessed_at') and ss[0].get('sha256') and ss[0].get('licence') and ss[0].get('source_id') and ss[0].get('match_method'); assert x.get('fake_data') is False and x.get('final_ready') is False
          seen=set()
          for f in g.get('features') or []:
            p=f.get('properties') or {}; vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id'),p.get('source_ref')) if v not in (None,'')}; assert not (seen & vals); seen.update(vals)
          print('REMOTE_READBACK_OK NEW_PAGE_RESUME_READY building_type_1 10050->10100 batch165 direct_osm max_source_features=250 final_ready=false')
          PY

      - name: Remote readback blocked
        if: steps.guarded.outputs.result == 'blocked'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json,subprocess
          p='docs/chatgpt_status/_shared/slots_21/building_type_1/checkpoint_latest.json'
          c=json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          assert c.get('state')=='BLOCKED_SOURCE_ACCESS' and c.get('blocked_source_url')=='https://overpass-api.de/api/interpreter' and c.get('blocked_source_attempts')==2 and c.get('next_batch_index')==166 and c.get('final_ready') is False and c.get('fake_data') is False
          print('REMOTE_READBACK_OK BLOCKED_SOURCE_ACCESS building_type_1 batch165 next_index=166')
          PY
