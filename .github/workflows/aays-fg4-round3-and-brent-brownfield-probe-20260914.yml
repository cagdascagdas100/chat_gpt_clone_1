name: AAYS fg4 round3 and GLA site allocations probe 20260914
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-fg4-round3-and-brent-brownfield-probe-20260914.yml'
permissions:
  contents: read
jobs:
  fetch-sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch TWBC 51-60 and GLA Site Allocations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, datetime
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          headers={'User-Agent':'TerraYield-AAYS-future_growth_4/1.0','Accept':'application/geo+json,application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              return raw,status,final,ctype
          # Third TWBC window under current binding method.
          twbc_base='https://services.arcgis.com/tghlG7ZjtJZbhYYT/ArcGIS/rest/services/TWBC_Local_Plan__Adopted_2025__Interactive_Policies_Map_v2_WFL1/FeatureServer/8/query'
          twbc_params={'where':'OBJECTID >= 51 AND OBJECTID <= 60','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'OBJECTID ASC','resultRecordCount':'10','f':'geojson'}
          twbc_url=twbc_base+'?'+urllib.parse.urlencode(twbc_params)
          raw,status,final,ctype=get(twbc_url)
          data=json.loads(raw); feats=(data.get('features') or [])[:10]
          if not feats: raise SystemExit('TWBC no features')
          for f in feats:
              if (f.get('geometry') or {}).get('type') not in ('Polygon','MultiPolygon'): raise SystemExit('TWBC non-polygon')
          out={'type':'FeatureCollection','features':feats}
          b=json.dumps(out,separators=(',',':'),ensure_ascii=False).encode()
          open('fg4_twbc_site_allocation_uses_51_60.geojson','wb').write(b)
          open('fg4_twbc_site_allocation_uses_51_60_meta.json','w').write(json.dumps({'slot_id':'future_growth_4','retrieved_at_utc':now,'http_status':status,'content_type':ctype,'request_url':twbc_url,'final_url':final,'raw_response_sha256':hashlib.sha256(raw).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b).hexdigest(),'feature_count':len(feats),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in feats]},indent=2,ensure_ascii=False))
          # Changed source family/region after round 3: Greater London Authority Site Allocations layer 102.
          gla_base='https://gis.london.gov.uk/arcgis/rest/services/apps/planning_data_map_02/FeatureServer/102/query'
          gla_params={'where':'removeddate IS NULL','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'objectid ASC','resultRecordCount':'25','f':'geojson'}
          gla_url=gla_base+'?'+urllib.parse.urlencode(gla_params)
          raw2,status2,final2,ctype2=get(gla_url)
          d2=json.loads(raw2)
          allf=d2.get('features') or []
          selected=[]
          for f in allf:
              g=f.get('geometry') or {}
              if g.get('type') in ('Polygon','MultiPolygon'):
                  selected.append(f)
              if len(selected)>=10: break
          if len(selected)<1: raise SystemExit('GLA no polygon features')
          out2={'type':'FeatureCollection','features':selected}
          b2=json.dumps(out2,separators=(',',':'),ensure_ascii=False).encode()
          open('fg4_gla_site_allocations.geojson','wb').write(b2)
          open('fg4_gla_site_allocations_meta.json','w').write(json.dumps({'slot_id':'future_growth_4','retrieved_at_utc':now,'http_status':status2,'content_type':ctype2,'request_url':gla_url,'final_url':final2,'raw_response_sha256':hashlib.sha256(raw2).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b2).hexdigest(),'returned_feature_count':len(allf),'selected_feature_count':len(selected),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in selected]},indent=2,ensure_ascii=False))
          print(json.dumps({'twbc_count':len(feats),'gla_selected_count':len(selected),'twbc_http':status,'gla_http':status2},ensure_ascii=False))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fg4-round3-and-gla-site-allocations-probe
          path: |
            fg4_twbc_site_allocation_uses_51_60.geojson
            fg4_twbc_site_allocation_uses_51_60_meta.json
            fg4_gla_site_allocations.geojson
            fg4_gla_site_allocations_meta.json
          if-no-files-found: error
