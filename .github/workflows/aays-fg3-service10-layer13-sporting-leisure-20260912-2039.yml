name: AAYS FG3 unused polygon designation discovery 20260912
on:
  push:
    paths:
      - '.github/workflows/aays-fg3-service10-layer13-sporting-leisure-20260912-2039.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan official London Planning Local Plan polygon designation layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fg3_discovery
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request, urllib.parse, datetime, hashlib, re
          out=Path('/tmp/fg3_discovery')
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat()
          rgx=re.compile(r'(growth|opportun|regener|intensif|allocation|strategic|development\s*(site|area)|housing\s*zone|renewal|transformation|urban\s*extension|major\s*site|key\s*site|future)', re.I)
          rows=[]; errors=[]
          for si in range(0,41):
              svc=f'https://services.arcgis.com/drifeOPKLpgnJ8Qa/arcgis/rest/services/planning_local_plan_data_{si:02d}/FeatureServer'
              req=urllib.request.Request(svc+'?f=pjson',headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-discovery/1.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read(); svc_status=getattr(r,'status',None); svc_final=r.geturl()
                  meta=json.loads(raw.decode('utf-8'))
              except Exception as e:
                  errors.append({'service_index':si,'url':svc,'error':str(e)})
                  continue
              for lyr in meta.get('layers') or []:
                  lid=lyr.get('id'); name=str(lyr.get('name') or '')
                  if lid is None or not rgx.search(name):
                      continue
                  lurl=f'{svc}/{lid}'
                  try:
                      req=urllib.request.Request(lurl+'?f=pjson',headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-discovery/1.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          lraw=r.read(); lstatus=getattr(r,'status',None); lfinal=r.geturl()
                      lm=json.loads(lraw.decode('utf-8'))
                  except Exception as e:
                      errors.append({'service_index':si,'layer_id':lid,'url':lurl,'error':str(e)})
                      continue
                  geom=lm.get('geometryType')
                  if geom!='esriGeometryPolygon':
                      continue
                  qurl=lurl+'/query?'+urllib.parse.urlencode({
                      'where':'1=1','outFields':'planningauthority,borough,designation,boroughdesignation,status,source,extrainfo1,layerreference,sitereference,sitename','returnGeometry':'false','resultRecordCount':'1','f':'json'
                  })
                  sample=None; qstatus=None
                  try:
                      req=urllib.request.Request(qurl,headers={'User-Agent':'TerraYield-AAYS-Plan0-future_growth_3-discovery/1.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          qraw=r.read(); qstatus=getattr(r,'status',None)
                      qo=json.loads(qraw.decode('utf-8'))
                      fs=qo.get('features') or []
                      sample=(fs[0].get('attributes') if fs else None)
                  except Exception as e:
                      errors.append({'service_index':si,'layer_id':lid,'query_url':qurl,'error':str(e)})
                  rows.append({
                      'service_index':si,'layer_id':lid,'layer_name':name,'service_url':svc,'layer_url':lurl,
                      'service_http_status':svc_status,'layer_http_status':lstatus,'sample_http_status':qstatus,
                      'geometryType':geom,'serviceItemId':lm.get('serviceItemId') or meta.get('serviceItemId'),
                      'copyrightText':lm.get('copyrightText') or meta.get('copyrightText'),
                      'description':lm.get('description'),'displayField':lm.get('displayField'),
                      'maxRecordCount':lm.get('maxRecordCount'),'sample':sample,
                      'service_meta_sha256':hashlib.sha256(raw).hexdigest(),
                      'layer_meta_sha256':hashlib.sha256(lraw).hexdigest(),
                  })
          result={'schema':'fg3_unused_polygon_designation_discovery_v1','slot_id':'future_growth_3','observed_at_utc':observed,'keyword_regex':rgx.pattern,'rows':rows,'errors':errors,'row_count':len(rows),'error_count':len(errors)}
          (out/'discovery_scan.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'row_count':len(rows),'error_count':len(errors),'rows':rows[:120]},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fg3-unused-polygon-designation-discovery-20260912
          path: /tmp/fg3_discovery
          if-no-files-found: error
          retention-days: 3
