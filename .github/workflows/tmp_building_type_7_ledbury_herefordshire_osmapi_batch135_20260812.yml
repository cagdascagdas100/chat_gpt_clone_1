name: tmp building_type_7 Ledbury Herefordshire OSM API batch 135

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_7_ledbury_herefordshire_osmapi_batch135_20260812.yml]

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python3 - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json').read_text())
          st=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json').read_text())
          assert cp['current_feature_count']==6700 and cp['next_batch_index']==135 and cp['next_target_feature_count']==6750, cp
          assert st['current_feature_count']==6700 and st['next_batch_index']==135 and st['next_target_feature_count']==6750, st
          assert task['task_id']=='building-type-7-england-classification-v1-20260808' and task.get('owner') in (None,''), task
          assert cp.get('fake_data') is False and cp.get('final_ready') is False
          assert st.get('fake_data') is False and st.get('final_ready') is False
          PY

      - name: Append exactly 50 unseen Ledbury OSM API records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, json, subprocess
          historic='306b1032bab74c2d85055573dedf79b4204a94f1:.github/workflows/tmp_building_type_7_worcester_osmapi_batch107_20260811.yml'
          src=subprocess.check_output(['git','show',historic],text=True)
          anchor=src.index('- name: Append exactly 50 unseen Worcester OSM API records')
          marker="          python3 <<'PY'\n"
          start=src.index(marker,anchor)+len(marker)
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          replacements=[
            ("CITY='Worcester'","CITY='Ledbury'"),
            ("AUTH='Worcestershire'","AUTH='Herefordshire'"),
            ('BATCH=107','BATCH=135'),
            ('BEFORE=5300','BEFORE=6700'),
            ('AFTER=5350','AFTER=6750'),
            ('NEXT_BATCH=108','NEXT_BATCH=136'),
            ('NEXT_TARGET=5400','NEXT_TARGET=6800'),
            ('NEXT_CITY_INDEX=18','NEXT_CITY_INDEX=46'),
            ("GRID='52.185,-2.250,52.215,-2.190'","GRID='52.025,-2.450,52.070,-2.380'"),
          ]
          for old,new in replacements:
            assert old in code, old
            code=code.replace(old,new)
          boxes="BBOXES=[(-2.4500,52.0250,-2.4300,52.0400),(-2.4300,52.0250,-2.4100,52.0400),(-2.4100,52.0250,-2.3900,52.0400),(-2.3900,52.0250,-2.3800,52.0400),(-2.4500,52.0400,-2.4300,52.0550),(-2.4300,52.0400,-2.4100,52.0550),(-2.4100,52.0400,-2.3900,52.0550),(-2.3900,52.0400,-2.3800,52.0550),(-2.4500,52.0550,-2.4300,52.0700),(-2.4300,52.0550,-2.4100,52.0700),(-2.4100,52.0550,-2.3900,52.0700),(-2.3900,52.0550,-2.3800,52.0700)]"
          code,n=re.subn(r'BBOXES=\[\n.*?\n          \]',boxes,code,count=1,flags=re.S)
          if n!=1:
            code,n=re.subn(r'BBOXES=\[\n.*?\n\]',boxes,code,count=1,flags=re.S)
          assert n==1, 'bbox replacement failed'
          exec(compile(code,'building_type_7_ledbury_herefordshire_osmapi_batch135.py','exec'),{})
          for p in [Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'),Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')]:
            o=json.loads(p.read_text())
            o['remote_readback_verified']=False; o['remote_data_commit']=None; o['remote_head']=None
            o['fake_data']=False; o['final_ready']=False
            p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          PY
          git checkout -- docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json

      - name: Validate append and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          L=lambda p:json.loads(Path(p).read_text())
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          man=L('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(geo['features'])==6750
          assert man.get('total_features',man.get('feature_count'))==6750
          assert cp['current_feature_count']==6750 and cp['next_batch_index']==136 and cp['next_target_feature_count']==6800
          assert st['current_feature_count']==6750 and st['next_batch_index']==136 and st['next_target_feature_count']==6800
          assert run['batch_index']==135 and run['feature_count_before']==6700 and run['feature_count_after']==6750 and run.get('progress_counted') is True
          assert task['task_id']=='building-type-7-england-classification-v1-20260808' and task.get('owner') in (None,'')
          ids=set(run.get('new_feature_ids') or run.get('selected_feature_ids') or []); assert len(ids)==50
          batch=[f for f in geo['features'] if f.get('id') in ids]; assert len(batch)==50
          old=geo['features'][:6700]; processed=set()
          for f in old:
            p=f.get('properties') or {}
            for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id')):
              if v is not None: processed.add(str(v))
          for key,vals in {
            'feature.id':[str(f['id']) for f in geo['features']],
            'feature_id':[str((f.get('properties') or {}).get('feature_id')) for f in geo['features'] if (f.get('properties') or {}).get('feature_id')],
            'parcel_id':[str((f.get('properties') or {}).get('parcel_id')) for f in geo['features'] if (f.get('properties') or {}).get('parcel_id')],
            'osm_id':[str((f.get('properties') or {}).get('osm_id')) for f in geo['features'] if (f.get('properties') or {}).get('osm_id')],
          }.items(): assert len(vals)==len(set(vals)), key
          for f in batch:
            p=f['properties']
            assert p['area']=='Ledbury' and p['local_authority']=='Herefordshire'
            assert p['evidence_level'] in ('B','C') and p['confidence_level_1_to_4'] in (2,3)
            assert p.get('evidence_excerpt') and p.get('source_hash') and p.get('match_method') and p.get('sources') and p['sources'][0].get('evidence_excerpt')
            assert p['fake_data'] is False and p['final_ready'] is False
            for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id')):
              if v is not None: assert str(v) not in processed
          assert run.get('already_processed_ids_policy_applied') is True
          assert run.get('raw_source_committed',False) is False and run.get('raw_source_stored_in_git',False) is False
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (man,cp,st,run,task))
          print('VALIDATED Ledbury OSM API batch135 6700->6750 +50')
          PY
          git diff --exit-code -- docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json

      - name: Commit and push only building_type_7 outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(england_map_web/data/building_type/shards/building_type_7_latest.geojson england_map_web/data/building_type/shards/building_type_7_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json)
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -vE '^(england_map_web/data/building_type/shards/building_type_7_(latest.geojson|manifest_latest.json)|docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json|docs/chatgpt_status/_shared/slots_21/building_type_7/(status_latest|checkpoint_latest).json)$')"
          git commit -m "data(building_type_7): append Ledbury Herefordshire OSM API batch 135 6700->6750"
          echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && break
            [[ $a -lt 5 ]] || exit 1
            sleep $((a*2))
          done

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess
          R='origin/codex/aays-single-runner-v5-20260706'; L=lambda p:json.loads(subprocess.check_output(['git','show',f'{R}:{p}']))
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(geo['features'])==6750 and cp['current_feature_count']==6750 and cp['next_batch_index']==136 and cp['next_target_feature_count']==6800
          assert run['batch_index']==135 and run['feature_count_before']==6700 and run['feature_count_after']==6750 and task.get('owner') in (None,'')
          ids=set(run.get('new_feature_ids') or run.get('selected_feature_ids') or []); assert len(ids)==50
          batch=[f for f in geo['features'] if f.get('id') in ids]
          assert len(batch)==50 and all(f['properties']['fake_data'] is False and f['properties']['final_ready'] is False and f['properties'].get('evidence_excerpt') for f in batch)
          print('REMOTE_READBACK_OK Ledbury 6700->6750')
          PY

      - name: Record remote readback metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); head=os.environ['DATA_COMMIT']
          cp_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'); st_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          cp=json.loads(cp_path.read_text()); st=json.loads(st_path.read_text())
          cp.update({'remote_head':head,'remote_data_commit':head,'remote_readback_verified':True,'updated_at':now,'first_unverified_step_status':'BATCH_135_REMOTE_READBACK_VERIFIED_CONTINUATION_REQUIRED','fake_data':False,'final_ready':False})
          cp.setdefault('summary',{})['note']='PROGRESS: feature_count 6700 -> 6750. Batch 135 Ledbury OSM API remote readback verified; continue at batch 136. final_ready remains false.'
          cp.setdefault('summary',{})['current_feature_count']=6750; cp.setdefault('summary',{})['new_features_added_this_attempt']=50; cp.setdefault('summary',{})['progress_counted']=True
          cp.setdefault('remaining_items',{})['note']='Next batch 136: treat all 6750 canonical feature.id/feature_id/parcel_id/osm_id values as already_processed_ids and append at least 50 genuinely new West Midlands records; do not replay prior batches.'
          st.update({'remote_head':head,'remote_data_commit':head,'remote_readback_verified':True,'updated_at':now,'fake_data':False,'final_ready':False,'note':'Batch 135 Ledbury OSM API: 50 unique evidence-backed features appended; total 6750. Remote readback verified. Continue batch 136.'})
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n'); st_path.write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')
          PY
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
          git commit -m "building_type_7: record Ledbury batch 135 remote readback"
          for a in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }
            git push origin HEAD:codex/aays-single-runner-v5-20260706 && break
            [[ $a -lt 5 ]] || exit 1
            sleep $((a*2))
          done

      - name: Final remote metadata readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess,os
          R='origin/codex/aays-single-runner-v5-20260706'; L=lambda p:json.loads(subprocess.check_output(['git','show',f'{R}:{p}']))
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          head=os.environ['DATA_COMMIT']
          assert cp['current_feature_count']==6750 and cp['next_batch_index']==136 and cp['next_target_feature_count']==6800
          assert st['current_feature_count']==6750 and st['next_batch_index']==136 and st['next_target_feature_count']==6800
          assert cp.get('remote_readback_verified') is True and st.get('remote_readback_verified') is True
          assert cp.get('remote_data_commit')==head and st.get('remote_data_commit')==head
          assert cp.get('fake_data') is False and cp.get('final_ready') is False and st.get('fake_data') is False and st.get('final_ready') is False
          assert task['task_id']=='building-type-7-england-classification-v1-20260808' and task.get('owner') in (None,'') and task.get('fake_data') is False and task.get('final_ready') is False
          print('FINAL_REMOTE_METADATA_READBACK_OK Ledbury batch135 6700->6750')
          PY
