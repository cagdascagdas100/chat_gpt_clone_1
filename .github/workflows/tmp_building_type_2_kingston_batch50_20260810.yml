name: tmp building_type_2 Kingston continuation batch 50

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_2_kingston_batch50_20260810.yml]

permissions:
  contents: write

concurrency:
  group: building-type-2-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append exactly 50 new Kingston-Upon-Thames FHRS continuation features
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:.github/workflows/tmp_building_type_2_hounslow_batch49_20260810.yml > /tmp/template.yml
          python3 <<'PY'
          from pathlib import Path
          text=Path('/tmp/template.yml').read_text(encoding='utf-8')
          anchor='      - name: Append exactly 50 new Hounslow FHRS continuation features'
          marker="          python3 <<'PY'\n"
          a=text.index(anchor)
          start=text.index(marker,a)+len(marker)
          end=text.index("\n          PY",start)
          lines=text[start:end].splitlines()
          body="\n".join(line[10:] if line.startswith("          ") else line for line in lines)+"\n"
          replacements=[
            ('CITY="Hounslow"; PREFIX="HOUNSLOW"; REGION="London Outer"','CITY="Kingston-Upon-Thames"; PREFIX="KINGSTON"; REGION="London Outer"'),
            ('Food Standards Agency FHRS daily open data - Hounslow','Food Standards Agency FHRS daily open data - Kingston-Upon-Thames'),
            ('FHRS518en-GB.xml','FHRS521en-GB.xml'),
            ('BEFORE=2400; TARGET=2450; BATCH=49; NEXT_BATCH=50; NEXT_TARGET=2500','BEFORE=2450; TARGET=2500; BATCH=50; NEXT_BATCH=51; NEXT_TARGET=2550'),
            ('authority.lower()!="hounslow"','authority.lower()!="kingston-upon-thames"'),
            ('Existing shard preserved; appended 50 Hounslow FHRS continuation records','Existing shard preserved; appended 50 Kingston-Upon-Thames FHRS continuation records'),
            ('Batch 49 appended from official Hounslow FHRS continuation records','Batch 50 appended from official Kingston-Upon-Thames FHRS continuation records'),
            ('50 new Hounslow FHRS continuation premises-use proxy records','50 new Kingston-Upon-Thames FHRS continuation premises-use proxy records'),
            ('BATCH_49_APPENDED_50_HOUNSLOW_FHRS_CONTINUATION_REQUIRED','BATCH_50_APPENDED_50_KINGSTON_FHRS_CONTINUATION_REQUIRED'),
            ('feature_count 2400 -> 2450','feature_count 2450 -> 2500'),
            ('Hounslow FHRS acik verisinden','Kingston-Upon-Thames FHRS acik verisinden'),
            ("Sonraki adim batch 50: mevcut 2450 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 2450 kaydi tekrar isleme.","Sonraki adim batch 51: mevcut 2500 feature'in feature.id/parcel_id/osm_id degerlerini already_processed_ids kabul ederek London Outer icinde processed kumesi disindan en az 50 append-only feature ekle; onceki 2500 kaydi tekrar isleme."),
            ('<building_type_2_hounslow_continuation_batch49_append>','<building_type_2_kingston_continuation_batch50_append>')
          ]
          for old,new in replacements:
              if old not in body: raise AssertionError(f'missing replacement token: {old}')
              body=body.replace(old,new)
          required=['CITY="Kingston-Upon-Thames"','PREFIX="KINGSTON"','FHRS521en-GB.xml','BEFORE=2450; TARGET=2500; BATCH=50; NEXT_BATCH=51; NEXT_TARGET=2550','authority.lower()!="kingston-upon-thames"','evidence_excerpt','"evidence_level":"D"','"confidence_level_1_to_4":2','"fake_data":False','"final_ready":False']
          missing=[x for x in required if x not in body]
          assert not missing, missing
          exec(compile(body,'<building_type_2_kingston_continuation_batch50_append>','exec'), {'__name__':'__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          shard=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_latest.geojson').read_text())
          manifest=json.loads(Path('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json').read_text())
          checkpoint=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json').read_text())
          status=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json').read_text())
          runner=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json').read_text())
          assert len(shard.get('features') or [])==2500
          assert manifest.get('feature_count_before')==2450 and manifest.get('feature_count_after')==2500 and manifest.get('added_feature_count')==50
          assert checkpoint.get('current_feature_count')==2500 and checkpoint.get('next_batch_index')==51 and checkpoint.get('next_target_feature_count')==2550
          assert status.get('current_feature_count')==2500 and runner.get('feature_count_before')==2450 and runner.get('feature_count_after')==2500 and runner.get('added_feature_count')==50
          assert task.get('owner') is None and task.get('task_id')=='building-type-2-england-classification-v1-20260808'
          for o in (manifest,checkpoint,status,runner): assert o.get('fake_data') is False and o.get('final_ready') is False
          assert runner.get('already_processed_ids_policy_applied') is True
          ids=list(runner.get('new_feature_ids') or [])
          assert len(ids)==50 and len(set(ids))==50 and all(str(x).startswith('KINGSTON_FHRS_') for x in ids)
          idset=set(ids); new=[f for f in shard['features'] if f.get('id') in idset]
          assert len(new)==50 and len(runner.get('records') or [])==50
          assert len([f for f in shard['features'] if str(f.get('id') or '').startswith('KINGSTON_FHRS_')])==100
          assert len({(f.get('properties') or {}).get('parcel_id') for f in new})==50
          for f in new:
              p=f.get('properties') or {}
              assert p.get('evidence_excerpt') and p.get('source_evidence_excerpt')
              assert p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2 and p.get('confidence_score')==0.55
              assert p.get('needs_manual_review') is True and p.get('source_hash') and p.get('sources')
              assert p.get('source_url')=='https://ratings.food.gov.uk/api/open-data-files/FHRS521en-GB.xml'
              assert p.get('fake_data') is False and p.get('final_ready') is False
          src=[s for s in manifest.get('sources') or [] if s.get('url')=='https://ratings.food.gov.uk/api/open-data-files/FHRS521en-GB.xml']
          assert len(src)==1 and src[0].get('features_used')==100
          print('validated building_type_2 2450->2500 with 50 new Kingston-Upon-Thames continuation features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          )
          git restore -- docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json
          git add -- "${paths[@]}"
          test -n "$(git diff --cached --name-only)"
          while read -r path; do ok=0; for expected in "${paths[@]}"; do [[ "$path" == "$expected" ]] && ok=1; done; [[ "$ok" == 1 ]] || { echo "unexpected staged path: $path"; exit 1; }; done < <(git diff --cached --name-only)
          git commit -m "data(building_type_2): append Kingston FHRS continuation batch 2450->2500"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge --no-edit origin/codex/aays-single-runner-v5-20260706; then git merge --abort || true; exit 1; fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json, subprocess
          ref='origin/codex/aays-single-runner-v5-20260706'
          def load(path): return json.loads(subprocess.check_output(['git','show',f'{ref}:{path}']))
          shard=load('england_map_web/data/building_type/shards/building_type_2_latest.geojson')
          manifest=load('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json')
          runner=load('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json')
          checkpoint=load('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json')
          status=load('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json')
          task=load('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(shard['features'])==2500
          assert manifest['feature_count_before']==2450 and manifest['feature_count_after']==2500 and manifest['added_feature_count']==50
          assert checkpoint['current_feature_count']==2500 and checkpoint['next_batch_index']==51 and checkpoint['next_target_feature_count']==2550
          assert status['current_feature_count']==2500
          assert runner['city']=='Kingston-Upon-Thames' and len(runner['new_feature_ids'])==50 and runner.get('already_processed_ids_policy_applied') is True
          assert task['owner'] is None
          for o in (manifest,checkpoint,status,runner,task): assert o.get('fake_data') is False and o.get('final_ready') is False
          ids=set(runner['new_feature_ids']); batch=[f for f in shard['features'] if f.get('id') in ids]
          assert len(batch)==50 and all(str(f.get('id') or '').startswith('KINGSTON_FHRS_') for f in batch)
          assert len([f for f in shard['features'] if str(f.get('id') or '').startswith('KINGSTON_FHRS_')])==100
          assert all((f.get('properties') or {}).get('evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('source_evidence_excerpt') for f in batch)
          assert all((f.get('properties') or {}).get('evidence_level')=='D' for f in batch)
          assert all((f.get('properties') or {}).get('confidence_level_1_to_4')==2 for f in batch)
          assert all((f.get('properties') or {}).get('fake_data') is False for f in batch)
          assert all((f.get('properties') or {}).get('final_ready') is False for f in batch)
          src=[s for s in manifest.get('sources') or [] if s.get('url')=='https://ratings.food.gov.uk/api/open-data-files/FHRS521en-GB.xml']
          assert len(src)==1 and src[0].get('features_used')==100
          print('remote readback verified: building_type_2=2500; Kingston-Upon-Thames continuation batch=50; final_ready=false')
          PY
