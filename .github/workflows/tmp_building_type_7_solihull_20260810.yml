name: tmp building_type_7 Solihull batch

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_solihull_20260810.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Append 50 new Solihull FHRS features
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          git pull --ff-only origin "$BRANCH"
          python3 <<'PY'
          import hashlib
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          SLOT = "building_type_7"
          TASK_ID = "building-type-7-england-classification-v1-20260808"
          EXPECTED_BEFORE = 250
          EXPECTED_TARGET = 300
          CITY = "Solihull"
          SOURCE_NAME = "Food Standards Agency FHRS daily open data - Solihull"
          SOURCE_URL = "https://ratings.food.gov.uk/api/open-data-files/FHRS426en-GB.xml"

          shard_path = Path("england_map_web/data/building_type/shards/building_type_7_latest.geojson")
          manifest_path = Path("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json")
          runner_path = Path("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json")
          status_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json")
          checkpoint_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json")
          task_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json")

          shard = json.loads(shard_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))
          features = shard.get("features", [])
          before = len(features)

          assert task.get("slot_id") == SLOT, "wrong slot"
          assert task.get("task_id") == TASK_ID, "task changed"
          assert task.get("owner") is None, "current_task owner is not null; refusing second task/owner"
          assert before == EXPECTED_BEFORE, f"stale shard count {before} != {EXPECTED_BEFORE}"
          assert int(checkpoint.get("current_feature_count", -1)) == before, "checkpoint/shard mismatch"
          assert int(checkpoint.get("next_target_feature_count", -1)) == EXPECTED_TARGET, "target changed"
          for obj in (manifest, status, checkpoint, task):
              assert obj.get("fake_data") is False, "fake_data guard failed"
              assert obj.get("final_ready") is False, "final_ready guard failed"

          processed = set()
          for feat in features:
              props = feat.get("properties") or {}
              for value in (feat.get("id"), props.get("parcel_id"), props.get("osm_id"), props.get("feature_id")):
                  if value is not None and str(value).strip():
                      processed.add(str(value).strip())

          req = urllib.request.Request(SOURCE_URL, headers={"User-Agent": "AAYS-building-type/1.0"})
          with urllib.request.urlopen(req, timeout=90) as response:
              raw = response.read()
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def deep_text(node, wanted):
              for el in node.iter():
                  if local(el.tag) == wanted and el.text is not None:
                      return el.text.strip()
              return ""

          def classify(bt):
              b = (bt or "").strip().lower()
              if b in {"pub/bar/nightclub", "restaurant/cafe/canteen", "takeaway/sandwich shop", "hotel/bed & breakfast/guest house"}:
                  return ("commercial_hospitality", "C_HOSPITALITY", "commercial")
              if b in {"retailers - supermarkets/hypermarkets", "retailers - other"}:
                  return ("commercial_retail", "C_RETAIL", "commercial")
              if b == "hospitals/childcare/caring premises":
                  return ("healthcare_care", "H_CARE", "institutional")
              if b == "school/college/university":
                  return ("education", "P_EDUCATION", "institutional")
              return None

          candidates = []
          for est in root.iter():
              if local(est.tag) != "EstablishmentDetail":
                  continue
              authority = deep_text(est, "LocalAuthorityName")
              if "solihull" not in authority.lower():
                  continue
              fhrsid = deep_text(est, "FHRSID")
              business_name = deep_text(est, "BusinessName")
              business_type = deep_text(est, "BusinessType")
              mapped = classify(business_type)
              if not fhrsid or mapped is None:
                  continue
              lat_s = deep_text(est, "Latitude")
              lon_s = deep_text(est, "Longitude")
              try:
                  lat, lon = float(lat_s), float(lon_s)
              except Exception:
                  continue
              if not (49.0 <= lat <= 61.5 and -8.5 <= lon <= 2.5):
                  continue
              fid = f"SOL_FHRS_{fhrsid}"
              parcel_id = f"SOL_FHRSID_{fhrsid}"
              if fid in processed or parcel_id in processed or fhrsid in processed:
                  continue
              candidates.append((int(fhrsid) if fhrsid.isdigit() else 10**18, fhrsid, est, mapped, lat, lon))

          candidates.sort(key=lambda x: (x[0], x[1]))
          selected = candidates[:50]
          assert len(selected) == 50, f"only {len(selected)} eligible new Solihull records"

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          new_features = []
          records = []
          for _, fhrsid, est, mapped, lat, lon in selected:
              primary, code, category = mapped
              business_name = deep_text(est, "BusinessName")
              business_type = deep_text(est, "BusinessType")
              business_type_id = deep_text(est, "BusinessTypeID")
              local_business_id = deep_text(est, "LocalAuthorityBusinessID")
              authority = deep_text(est, "LocalAuthorityName")
              postcode = deep_text(est, "PostCode")
              rating_value = deep_text(est, "RatingValue")
              rating_date = deep_text(est, "RatingDate")
              fid = f"SOL_FHRS_{fhrsid}"
              parcel_id = f"SOL_FHRSID_{fhrsid}"
              excerpt = f"FHRSID {fhrsid} | {business_name} | BusinessType {business_type} | LocalAuthority {authority} | PostCode {postcode}"
              excerpt_sha = hashlib.sha256(excerpt.encode("utf-8")).hexdigest()
              props = {
                  "parcel_id": parcel_id,
                  "parcel_id_semantics": "stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": None,
                  "slot_id": SLOT,
                  "region": "West Midlands",
                  "area": CITY,
                  "local_authority": authority or CITY,
                  "postcode": postcode,
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": 0.55,
                  "confidence_level_1_to_4": 2,
                  "evidence_level": "D",
                  "source_count": 1,
                  "source": SOURCE_NAME,
                  "source_url": SOURCE_URL,
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "match_method": "fhrs_business_type_premises_proxy",
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": excerpt_sha,
                  "source_evidence_excerpt": {
                      "FHRSID": fhrsid,
                      "BusinessName": business_name,
                      "BusinessType": business_type,
                      "BusinessTypeID": business_type_id,
                      "LocalAuthorityBusinessID": local_business_id,
                      "LocalAuthorityName": authority,
                      "PostCode": postcode,
                      "RatingValue": rating_value,
                      "RatingDate": rating_date
                  },
                  "sources": [{
                      "source_name": "Food Standards Agency FHRS daily open data",
                      "url_or_local_path": SOURCE_URL,
                      "accessed_at": now,
                      "sha256": source_sha,
                      "sha256_scope": "raw_source_xml",
                      "granularity": "food_business_establishment",
                      "fields_used": ["FHRSID", "BusinessName", "BusinessType", "BusinessTypeID", "LocalAuthorityBusinessID", "LocalAuthorityName", "PostCode", "Latitude", "Longitude"],
                      "supports_field": "building_type_primary",
                      "match_method": "fhrs_business_type_premises_proxy",
                      "match_score": 0.55
                  }],
                  "geometry_match_method": "fhrs_geocode_point",
                  "address_match_method": "fhrs_business_address",
                  "limitations": "FHRS business type is a premises-use proxy and does not prove cadastral parcel identity or exact building fabric/type.",
                  "needs_manual_review": True,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": now,
                  "feature_id": fid
              }
              geometry = {"type": "Point", "coordinates": [lon, lat]}
              new_features.append({"type": "Feature", "id": fid, "geometry": geometry, "properties": props})
              rec = dict(props)
              rec["geometry"] = geometry
              records.append(rec)

          new_ids = [f["id"] for f in new_features]
          assert len(new_ids) == len(set(new_ids)) == 50
          assert not (set(new_ids) & processed), "already_processed feature collision"
          for f in new_features:
              assert f["properties"]["parcel_id"] not in processed, "already_processed parcel collision"

          features.extend(new_features)
          shard["features"] = features
          after = len(features)
          assert after > before, "feature_count_after must be greater than feature_count_before"
          assert after - before == 50, f"expected +50, got {after-before}"
          shard_path.write_text(json.dumps(shard, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          geo_sha = hashlib.sha256(shard_path.read_bytes()).hexdigest()

          evidence_dist = Counter()
          confidence_dist = Counter()
          type_dist = Counter()
          classified = 0
          unknown = 0
          for feat in features:
              p = feat.get("properties") or {}
              ev = str(p.get("evidence_level") or "U")
              evidence_dist[ev] += 1
              confidence_dist[str(p.get("confidence_level_1_to_4") or 1)] += 1
              typ = str(p.get("building_type_primary") or "unknown")
              type_dist[typ] += 1
              if typ == "unknown":
                  unknown += 1
              else:
                  classified += 1

          sources = list(manifest.get("sources") or [])
          sources = [s for s in sources if s.get("name") != SOURCE_NAME]
          sources.append({
              "name": SOURCE_NAME,
              "url": SOURCE_URL,
              "source_page": "https://ratings.food.gov.uk/open-data",
              "features_used": 50,
              "accessed_at": now,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_source_xml",
              "note": "Premises-use proxy; not cadastral parcel geometry."
          })
          manifest.update({
              "generated_at": now,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "type_distribution": dict(sorted(type_dist.items())),
              "confidence_level_distribution": dict(sorted(confidence_dist.items())),
              "sources": sources,
              "fake_data": False,
              "final_ready": False,
              "note": "Existing shard preserved; appended 50 Solihull FHRS records outside feature.id/parcel_id/osm_id already_processed_ids.",
              "feature_count": after,
              "geojson_sha256": geo_sha,
              "geojson_path": str(shard_path),
              "manifest_updated_at": now,
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": after-before,
              "last_batch_city": CITY,
              "last_batch_source": SOURCE_NAME,
              "last_batch_source_sha256": source_sha
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          runner = {
              "slot_id": SLOT,
              "task_id": TASK_ID,
              "generated_at": now,
              "feature_count_before": before,
              "feature_count_after": after,
              "added_feature_count": after-before,
              "city": CITY,
              "source": SOURCE_NAME,
              "source_url": SOURCE_URL,
              "source_sha256": source_sha,
              "classification_method": "fhrs_business_type_premises_proxy",
              "confidence_policy": {"fhrs_premises_proxy": {"evidence_level": "D", "confidence_level_1_to_4": 2}},
              "records": records,
              "fake_data": False,
              "final_ready": False
          }
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          status.update({
              "state": "IN_PROGRESS",
              "updated_at": now,
              "final_ready": False,
              "fake_data": False,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": dict(sorted(evidence_dist.items())),
              "confidence_level_distribution": dict(sorted(confidence_dist.items())),
              "feature_count_before": before,
              "feature_count_after": after,
              "last_batch_city": CITY,
              "last_batch_added_feature_count": 50,
              "last_batch_source": SOURCE_NAME,
              "last_batch_evidence_distribution": {"D": 50},
              "last_batch_confidence_distribution": {"2": 50},
              "output_sha256": geo_sha
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          checkpoint.update({
              "updated_at": now,
              "final_ready": False,
              "fake_data": False,
              "state": "IN_PROGRESS",
              "first_unverified_step_status": "BATCH_APPENDED_50_SOLIHULL_FHRS_CONTINUATION_REQUIRED",
              "feature_count_before": before,
              "feature_count_after": after,
              "current_feature_count": after,
              "next_batch_index": 7,
              "next_target_feature_count": 350,
              "last_processed_ids_sample": new_ids[-20:],
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE AND PARCEL BINDING",
              "last_batch": {
                  "batch_index": 6,
                  "city": CITY,
                  "source": SOURCE_NAME,
                  "source_sha256": source_sha,
                  "added_feature_count": 50,
                  "new_feature_ids": new_ids
              }
          })
          summary = checkpoint.get("summary") or {}
          summary.update({"new_slot": False, "pipeline_stage": 1, "new_features_appended": 50, "current_feature_count": after})
          checkpoint["summary"] = summary
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(json.dumps({"before": before, "after": after, "added": 50, "source_sha256": source_sha, "first_id": new_ids[0], "last_id": new_ids[-1]}, ensure_ascii=False))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/building_type/shards/building_type_7_latest.geojson \
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          git commit -m 'building_type_7 append Solihull FHRS batch'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
