name: tmp building_type_7 East Staffordshire batch 22

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_east_staffordshire_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase onto latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706

      - name: Guard slot state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cp = json.loads(Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json").read_text())
          task = json.loads(Path("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json").read_text())
          assert cp["slot_id"] == "building_type_7"
          assert cp["current_feature_count"] == 1050, cp
          assert cp["next_batch_index"] == 22, cp
          assert cp["next_target_feature_count"] == 1100, cp
          assert cp.get("fake_data") is False
          assert cp.get("final_ready") is False
          assert task["slot_id"] == "building_type_7"
          assert task["task_id"] == "building-type-7-england-classification-v1-20260808"
          assert task.get("owner") is None, task.get("owner")
          assert task.get("fake_data") is False
          assert task.get("final_ready") is False
          PY

      - name: Fetch East Staffordshire FSA FHRS XML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            "https://ratings.food.gov.uk/api/open-data-files/FHRS288en-GB.xml" \
            -o /tmp/east_staffordshire_fhrs.xml
          test -s /tmp/east_staffordshire_fhrs.xml
          sha256sum /tmp/east_staffordshire_fhrs.xml

      - name: Append 50 new evidence-backed features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, re
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          SLOT = "building_type_7"
          REGION = "West Midlands"
          CITY = "East Staffordshire"
          PREFIX = "ESTA"
          SOURCE_NAME = "Food Standards Agency FHRS daily open data - East Staffordshire"
          SOURCE_URL = "https://ratings.food.gov.uk/api/open-data-files/FHRS288en-GB.xml"
          SOURCE_PAGE = "https://ratings.food.gov.uk/open-data"
          BEFORE = 1050
          AFTER = 1100
          BATCH_INDEX = 22
          NEXT_BATCH = 23
          NEXT_TARGET = 1150
          TASK_ID = "building-type-7-england-classification-v1-20260808"

          geo_path = Path("england_map_web/data/building_type/shards/building_type_7_latest.geojson")
          manifest_path = Path("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json")
          runner_path = Path("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json")
          status_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json")
          checkpoint_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json")
          task_path = Path("docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json")
          raw_path = Path("/tmp/east_staffordshire_fhrs.xml")

          geo = json.loads(geo_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          status = json.loads(status_path.read_text())
          checkpoint = json.loads(checkpoint_path.read_text())
          task = json.loads(task_path.read_text())

          features = geo.get("features", [])
          assert len(features) == BEFORE, len(features)
          assert manifest.get("total_features", manifest.get("feature_count")) == BEFORE
          assert checkpoint["current_feature_count"] == BEFORE
          assert checkpoint["next_batch_index"] == BATCH_INDEX
          assert checkpoint["next_target_feature_count"] == AFTER
          assert task["task_id"] == TASK_ID and task["slot_id"] == SLOT
          assert task.get("owner") is None
          assert task.get("fake_data") is False and task.get("final_ready") is False

          processed = set()
          existing_points = set()
          for f in features:
              vals = [f.get("id")]
              p = f.get("properties") or {}
              vals += [p.get("feature_id"), p.get("parcel_id"), p.get("osm_id")]
              for v in vals:
                  if v is not None and str(v).strip():
                      processed.add(str(v).strip())
              g = f.get("geometry") or {}
              if g.get("type") == "Point":
                  c = g.get("coordinates") or []
                  if len(c) >= 2:
                      try:
                          existing_points.add((round(float(c[0]), 7), round(float(c[1]), 7)))
                      except Exception:
                          pass

          raw = raw_path.read_bytes()
          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def child_text(el, wanted):
              for node in el.iter():
                  if local(node.tag) == wanted:
                      return (node.text or "").strip()
              return ""

          establishments = [e for e in root.iter() if local(e.tag) == "EstablishmentDetail"]
          assert establishments, "No EstablishmentDetail records found"

          def classify(bt):
              s = (bt or "").strip().lower()
              if any(x in s for x in ["school", "college", "university"]):
                  return ("education", "E_EDUCATION", "institutional")
              if any(x in s for x in ["hospital", "caring premises", "nursing", "residential care", "childcare"]):
                  return ("healthcare_care", "H_CARE", "institutional")
              if any(x in s for x in ["hotel", "bed & breakfast", "bed and breakfast", "guest house"]):
                  return ("hospitality", "H_HOSPITALITY", "commercial")
              if any(x in s for x in ["retailers - supermarkets", "hypermarket", "retailers - other", "supermarket"]):
                  return ("commercial_retail", "C_RETAIL", "commercial")
              if any(x in s for x in ["restaurant", "cafe", "café", "canteen", "pub", "bar", "nightclub", "takeaway", "sandwich", "mobile caterer"]):
                  return ("commercial_hospitality", "C_HOSPITALITY", "commercial")
              if any(x in s for x in ["manufacturer", "packer"]):
                  return ("industrial", "I_INDUSTRIAL", "industrial")
              if any(x in s for x in ["distributor", "transporter", "importer", "exporter"]):
                  return ("warehouse", "I_WAREHOUSE", "industrial")
              if any(x in s for x in ["farmer", "grower"]):
                  return ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural")
              return ("commercial_other", "C_OTHER", "commercial")

          def numeric_id(s):
              m = re.search(r"\d+", s or "")
              return int(m.group()) if m else 10**30

          candidates = []
          skipped_processed = 0
          skipped_invalid = 0
          skipped_existing_points = 0
          skipped_duplicate_points = 0
          source_points = set()

          establishments.sort(key=lambda e: numeric_id(child_text(e, "FHRSID")))
          for e in establishments:
              fhrsid = child_text(e, "FHRSID")
              if not fhrsid:
                  continue
              feature_id = f"{PREFIX}_FHRS_{fhrsid}"
              parcel_id = f"{PREFIX}_FHRSID_{fhrsid}"
              if feature_id in processed or parcel_id in processed or str(fhrsid) in processed:
                  skipped_processed += 1
                  continue
              lon_s, lat_s = child_text(e, "Longitude"), child_text(e, "Latitude")
              try:
                  lon, lat = float(lon_s), float(lat_s)
                  if not (math.isfinite(lon) and math.isfinite(lat) and -180 <= lon <= 180 and -90 <= lat <= 90):
                      raise ValueError
                  if abs(lon) < 1e-12 and abs(lat) < 1e-12:
                      raise ValueError
              except Exception:
                  skipped_invalid += 1
                  continue
              point = (round(lon, 7), round(lat, 7))
              if point in existing_points:
                  skipped_existing_points += 1
                  continue
              if point in source_points:
                  skipped_duplicate_points += 1
                  continue
              source_points.add(point)
              candidates.append((e, fhrsid, feature_id, parcel_id, lon, lat))

          candidate_count_after_filters = len(candidates)
          selected = candidates[:50]
          assert len(selected) == 50, f"Only {len(selected)} eligible new candidates"
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          new_features = []
          records = []
          selected_ids = []
          for e, fhrsid, feature_id, parcel_id, lon, lat in selected:
              business_name = child_text(e, "BusinessName")
              business_type = child_text(e, "BusinessType")
              business_type_id = child_text(e, "BusinessTypeID")
              local_business_id = child_text(e, "LocalAuthorityBusinessID")
              local_authority = child_text(e, "LocalAuthorityName") or CITY
              postcode = child_text(e, "PostCode")
              rating_value = child_text(e, "RatingValue")
              rating_date = child_text(e, "RatingDate")
              primary, code, category = classify(business_type)
              excerpt = f"FHRSID {fhrsid} | {business_name} | BusinessType {business_type} | LocalAuthority {local_authority} | PostCode {postcode}"
              excerpt_sha = hashlib.sha256(excerpt.encode("utf-8")).hexdigest()
              geom = {"type": "Point", "coordinates": [lon, lat]}
              record = {
                  "parcel_id": parcel_id,
                  "parcel_id_semantics": "stable FSA FHRSID-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": None,
                  "slot_id": SLOT,
                  "region": REGION,
                  "area": CITY,
                  "local_authority": local_authority,
                  "postcode": postcode,
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": 0.55,
                  "confidence_level_1_to_4": 2,
                  "evidence_level": "D",
                  "source_count": 1,
                  "source": SOURCE_NAME,
                  "source_url": SOURCE_URL,
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "match_method": "fhrs_business_type_premises_proxy",
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": excerpt_sha,
                  "source_evidence_excerpt": {
                      "FHRSID": fhrsid,
                      "BusinessName": business_name,
                      "BusinessType": business_type,
                      "BusinessTypeID": business_type_id,
                      "LocalAuthorityBusinessID": local_business_id,
                      "LocalAuthorityName": local_authority,
                      "PostCode": postcode,
                      "RatingValue": rating_value,
                      "RatingDate": rating_date,
                  },
                  "sources": [{
                      "source_name": "Food Standards Agency FHRS daily open data",
                      "url_or_local_path": SOURCE_URL,
                      "accessed_at": now,
                      "sha256": source_sha,
                      "sha256_scope": "raw_source_xml",
                      "granularity": "food_business_establishment",
                      "fields_used": [
                          "FHRSID", "BusinessName", "BusinessType", "BusinessTypeID",
                          "LocalAuthorityBusinessID", "LocalAuthorityName", "PostCode",
                          "Latitude", "Longitude"
                      ],
                      "supports_field": "building_type_primary",
                      "match_method": "fhrs_business_type_premises_proxy",
                      "match_score": 0.55,
                  }],
                  "geometry_match_method": "fhrs_geocode_point",
                  "address_match_method": "fhrs_business_address",
                  "limitations": "FHRS business type is a premises-use proxy and does not prove cadastral parcel identity or exact building fabric/type.",
                  "needs_manual_review": True,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": now,
                  "feature_id": feature_id,
                  "geometry": geom,
              }
              props = {k: v for k, v in record.items() if k != "geometry"}
              feat = {"type": "Feature", "id": feature_id, "geometry": geom, "properties": props}
              new_features.append(feat)
              records.append(record)
              selected_ids.append(feature_id)

          geo["features"].extend(new_features)
          assert len(geo["features"]) == AFTER
          assert AFTER > BEFORE

          def distributions(all_features):
              type_c = Counter()
              ev_c = Counter()
              conf_c = Counter()
              classified = 0
              unknown = 0
              for f in all_features:
                  p = f.get("properties") or {}
                  bt = p.get("building_type_primary") or "unknown"
                  ev = p.get("evidence_level") or "U"
                  cl = p.get("confidence_level_1_to_4")
                  type_c[str(bt)] += 1
                  ev_c[str(ev)] += 1
                  if cl is not None:
                      conf_c[str(cl)] += 1
                  if bt == "unknown":
                      unknown += 1
                  else:
                      classified += 1
              return classified, unknown, dict(sorted(type_c.items())), dict(sorted(ev_c.items())), dict(sorted(conf_c.items(), key=lambda kv: int(kv[0])))

          classified, unknown, type_dist, ev_dist, conf_dist = distributions(geo["features"])

          geo_text = json.dumps(geo, ensure_ascii=False, indent=2) + "\n"
          geo_sha = hashlib.sha256(geo_text.encode("utf-8")).hexdigest()

          sources = list(manifest.get("sources", []))
          if not any(s.get("url") == SOURCE_URL for s in sources if isinstance(s, dict)):
              sources.append({
                  "name": SOURCE_NAME,
                  "url": SOURCE_URL,
                  "source_page": SOURCE_PAGE,
                  "features_used": 50,
                  "accessed_at": now,
                  "source_sha256": source_sha,
                  "source_hash_method": "sha256_raw_source_xml",
                  "note": "Premises-use proxy; not cadastral parcel geometry.",
              })

          manifest.update({
              "slot_id": SLOT,
              "generated_at": now,
              "total_features": AFTER,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": ev_dist,
              "type_distribution": type_dist,
              "confidence_level_distribution": conf_dist,
              "sources": sources,
              "fake_data": False,
              "final_ready": False,
              "note": "Existing shard preserved; appended 50 East Staffordshire FHRS records outside feature.id/parcel_id/osm_id already_processed_ids.",
              "feature_count": AFTER,
              "geojson_sha256": geo_sha,
              "geojson_path": str(geo_path),
              "manifest_updated_at": now,
              "feature_count_before": BEFORE,
              "feature_count_after": AFTER,
              "added_feature_count": 50,
              "last_batch_city": CITY,
              "last_batch_source": SOURCE_NAME,
              "last_batch_source_sha256": source_sha,
          })

          runner = {
              "slot_id": SLOT,
              "task_id": TASK_ID,
              "generated_at": now,
              "feature_count_before": BEFORE,
              "feature_count_after": AFTER,
              "added_feature_count": 50,
              "city": CITY,
              "source": SOURCE_NAME,
              "source_url": SOURCE_URL,
              "source_sha256": source_sha,
              "classification_method": "fhrs_business_type_premises_proxy",
              "confidence_policy": {"fhrs_premises_proxy": {"evidence_level": "D", "confidence_level_1_to_4": 2}},
              "already_processed_id_fields": ["feature.id", "properties.feature_id", "properties.parcel_id", "properties.osm_id"],
              "candidate_count_after_filters": candidate_count_after_filters,
              "skipped_processed_ids": skipped_processed,
              "skipped_missing_or_invalid_coordinates": skipped_invalid,
              "skipped_existing_shard_points": skipped_existing_points,
              "skipped_duplicate_points": skipped_duplicate_points,
              "selected_feature_ids": selected_ids,
              "records": records,
              "fake_data": False,
              "final_ready": False,
          }

          status.update({
              "state": "IN_PROGRESS",
              "slot_id": SLOT,
              "task_id": TASK_ID,
              "updated_at": now,
              "final_ready": False,
              "classified_count": classified,
              "unknown_count": unknown,
              "total_elements": AFTER,
              "confidence_distribution": conf_dist,
              "evidence_distribution": ev_dist,
              "output_sha256": geo_sha,
              "note": "East Staffordshire FHRS batch appended as premises-use proxy; cadastral parcel binding remains pending.",
              "fake_data": False,
              "feature_count_before": BEFORE,
              "feature_count_after": AFTER,
              "current_feature_count": AFTER,
              "last_batch": {
                  "city": CITY,
                  "added_feature_count": 50,
                  "source": SOURCE_NAME,
                  "source_sha256": source_sha,
                  "classification_basis": "fhrs_business_type_premises_proxy",
                  "evidence_level_distribution": {"D": 50},
                  "confidence_level_distribution": {"2": 50},
              },
              "total_features": AFTER,
              "classified": classified,
              "unknown": unknown,
              "confidence_level_distribution": conf_dist,
              "last_batch_city": CITY,
              "last_batch_added_feature_count": 50,
              "last_batch_source": SOURCE_NAME,
              "last_batch_evidence_distribution": {"D": 50},
              "last_batch_confidence_distribution": {"2": 50},
          })

          checkpoint.update({
              "first_unverified_step_status": "BATCH_APPENDED_50_EAST_STAFFORDSHIRE_FHRS_CONTINUATION_REQUIRED",
              "updated_at": now,
              "final_ready": False,
              "summary": {
                  **checkpoint.get("summary", {}),
                  "new_features_appended": 50,
                  "current_feature_count": AFTER,
              },
              "state": "IN_PROGRESS",
              "feature_count_before": BEFORE,
              "feature_count_after": AFTER,
              "current_feature_count": AFTER,
              "next_batch_index": NEXT_BATCH,
              "next_target_feature_count": NEXT_TARGET,
              "last_processed_ids_sample": selected_ids[-20:],
              "next_required_action": "APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR/OSM CORROBORATION FOR CURRENT-USE_AND_PARCEL_BINDING",
              "fake_data": False,
              "last_batch": {
                  "batch_index": BATCH_INDEX,
                  "city": CITY,
                  "source": SOURCE_NAME,
                  "source_sha256": source_sha,
                  "added_feature_count": 50,
                  "new_feature_ids": selected_ids,
              },
          })

          geo_path.write_text(geo_text)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          runner_path.parent.mkdir(parents=True, exist_ok=True)
          runner_path.write_text(json.dumps(runner, ensure_ascii=False, indent=2) + "\n")
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n")
          checkpoint_path.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n")

          print(json.dumps({
              "before": BEFORE, "after": AFTER, "added": 50, "city": CITY,
              "source_sha256": source_sha, "candidate_count_after_filters": candidate_count_after_filters,
              "selected_first": selected_ids[0], "selected_last": selected_ids[-1],
              "geojson_sha256": geo_sha,
              "classified": classified, "unknown": unknown,
              "evidence_distribution": ev_dist, "confidence_distribution": conf_dist,
          }, indent=2))
          PY

      - name: Verify exact write set and safety flags
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
            Path("england_map_web/data/building_type/shards/building_type_7_latest.geojson"),
            Path("england_map_web/data/building_type/shards/building_type_7_manifest_latest.json"),
            Path("docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json"),
            Path("docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json"),
            Path("docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json"),
          ]
          geo = json.loads(paths[0].read_text())
          manifest = json.loads(paths[1].read_text())
          runner = json.loads(paths[2].read_text())
          status = json.loads(paths[3].read_text())
          cp = json.loads(paths[4].read_text())
          assert len(geo["features"]) == 1100
          assert manifest["feature_count_before"] == 1050 and manifest["feature_count_after"] == 1100
          assert runner["added_feature_count"] == 50 and len(runner["records"]) == 50
          assert all(r.get("fake_data") is False and r.get("final_ready") is False for r in runner["records"])
          assert all(r.get("evidence_excerpt") and r.get("source_hash") and r.get("evidence_level") == "D" and r.get("confidence_level_1_to_4") == 2 for r in runner["records"])
          assert status.get("fake_data") is False and status.get("final_ready") is False
          assert cp.get("fake_data") is False and cp.get("final_ready") is False
          assert cp["current_feature_count"] == 1100 and cp["next_batch_index"] == 23 and cp["next_target_feature_count"] == 1150
          PY
          expected="$(printf '%s\n' \
            'docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json' \
            'docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json' \
            'docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json' \
            'england_map_web/data/building_type/shards/building_type_7_latest.geojson' \
            'england_map_web/data/building_type/shards/building_type_7_manifest_latest.json' | sort)"
          actual="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          echo "Changed paths:"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push business files
        shell: bash
        run: |
          set -euo pipefail
          git add \
            england_map_web/data/building_type/shards/building_type_7_latest.geojson \
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          git diff --cached --quiet && { echo "No business changes"; exit 1; }
          git commit -m "data(building_type_7): append East Staffordshire FHRS batch 1050->1100"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          git push origin HEAD:codex/aays-single-runner-v5-20260706
