name: AAYS FG7 strict 271-282 hosted fallback 20260818

on:
  push:
    branches:
      - agent/aays-fg7-strict-12-20260818-271-282-2009
    paths:
      - '.aays_fg7_271_282_hosted_trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aays-fg7-strict-271-282-hosted-fallback-20260818
  cancel-in-progress: false

jobs:
  run-fg7-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      AAYS_CONTINUATION_PATH: 'F:\TerraYield_AAYS_Portable\docs\deepseek_prompts\AAYS_CHATGPT_PLAN_00_23_SLOT_COMMON_CONTINUATION_20260818.md'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          ref: agent/aays-fg7-strict-12-20260818-271-282-2009
          path: trigger
          fetch-depth: 1

      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          path: canonical
          fetch-depth: 50
          persist-credentials: true

      - name: Execute hosted fallback with strict cursor and history gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('trigger/ai-task-scripts/aays_fg7_batches_271_282_20260818.py').read_text(encoding='utf-8')
          old='''plan_path = pathlib.Path(os.environ["AAYS_CONTINUATION_PATH"])
          if not plan_path.is_file():
              raise SystemExit(f"COMMON_CONTINUATION_FILE_MISSING:{plan_path}")
          plan_text = plan_path.read_text(encoding="utf-8-sig")
          if not plan_text.strip():
              raise SystemExit("COMMON_CONTINUATION_FILE_EMPTY")
          plan_bytes = plan_path.read_bytes()
          plan_sha256 = hashlib.sha256(plan_bytes).hexdigest()
          plan_lines = plan_text.count("\\n") + (1 if plan_text else 0)
          '''
          new='''plan_path = pathlib.Path(os.environ["AAYS_CONTINUATION_PATH"])
          plan_file_read = plan_path.is_file()
          if plan_file_read:
              plan_text = plan_path.read_text(encoding="utf-8-sig")
              if not plan_text.strip():
                  raise SystemExit("COMMON_CONTINUATION_FILE_EMPTY")
              plan_bytes = plan_path.read_bytes()
              plan_sha256 = hashlib.sha256(plan_bytes).hexdigest()
              plan_lines = plan_text.count("\\n") + (1 if plan_text else 0)
          else:
              plan_text = ""
              plan_bytes = b""
              plan_sha256 = None
              plan_lines = 0
          '''
          if old not in src:
              raise SystemExit('HOSTED_PATCH_PLAN_BLOCK_NOT_FOUND')
          src=src.replace(old,new,1)
          src=src.replace('"requested_common_continuation_file_read": True,','"requested_common_continuation_file_read": plan_file_read,',1)
          src=src.replace('"common_continuation_file_read_full": True,','"common_continuation_file_read_full": plan_file_read,',1)
          out=Path('canonical/.fg7_271_282_hosted.py')
          out.write_text(src,encoding='utf-8')
          PY
          cd canonical
          python .fg7_271_282_hosted.py
          rm -f .fg7_271_282_hosted.py

          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git add -- state/slots/future_growth_7/checkpoint_latest.json state/slots/future_growth_7/status_latest.json state/slots/future_growth_7/evidence_manifest_latest.json state/slots/future_growth_7/report_latest.json
          mapfile -t staged < <(git diff --cached --name-only)
          test ${#staged[@]} -gt 0 || { echo NO_STAGED_STATE; exit 1; }
          for p in "${staged[@]}"; do [[ "$p" == state/slots/future_growth_7/* ]] || { echo "CROSS_SLOT_STAGED:$p"; exit 1; }; done
          git commit -m 'future_growth_7: process strict batches 271-282'

          pushed=0
          for i in 1 2 3 4; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then pushed=1; break; fi
            git fetch origin codex/aays-single-runner-v5-20260706
            git rebase origin/codex/aays-single-runner-v5-20260706 || { git rebase --abort || true; echo REBASE_CONFLICT_FAIL_CLOSED; exit 1; }
            sleep $((i*2))
          done
          test "$pushed" = 1 || { echo PUSH_FAILED_AFTER_RETRIES; exit 1; }
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=1
          git show origin/codex/aays-single-runner-v5-20260706:state/slots/future_growth_7/report_latest.json | grep -q 'common_continuation_20260818_batches_271_282_self_hosted'
          echo 'REMOTE_READBACK_PASS future_growth_7 batches 271-282 hosted-fallback'
