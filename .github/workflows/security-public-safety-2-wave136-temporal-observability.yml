name: security_public_safety_2 Wave136 temporal observability controls

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/aays-triggers/security_public_safety_2_wave136.trigger.json

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave136
  cancel-in-progress: false

jobs:
  publish-temporal-observability-controls:
    if: github.head_ref == 'audit/security-public-safety-2-wave136-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests pyshp shapely pyproj

      - name: Verify runner syntax
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave136_temporal_parameter_observability_and_revision_controls_20260801.py

      - name: Run official internet temporal observability audit
        env:
          AAYS_SOURCE_HEAD: 7f6ccfb8b1ffc65086e277f870cb3aea44f63668
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave136_temporal_parameter_observability_and_revision_controls_20260801.py

      - name: Strict fail-closed validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_temporal_parameter_observability_revision_controls_wave136_latest.json')
          website = Path('england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_temporal_parameter_observability_revision_controls_wave136.html')
          status = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave136_status_latest.json')
          evidence = Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave136_evidence_latest.json')
          queue = Path('docs/chatgpt_status/aays1/queue/0149_security_public_safety_2_wave136_temporal_parameter_observability_and_revision_controls_20260801.v3.task.json')
          manual = Path('docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json')
          for path in (output, website, status, evidence, queue, manual):
              assert path.exists() and path.stat().st_size > 0, path
          data = json.loads(output.read_text())
          result = data['result']
          assert data['fake_data'] is False
          assert data['continuation_key'] == '157d04ad18d43adde2a3b4323612a4196bf7a3266e9234cc5853d2603cec65a6'
          assert data['scope']['maximum_simultaneous_workers'] == 15
          assert result['official_item_metadata_successes'] >= 4
          assert result['official_service_metadata_successes'] >= 4
          assert result['official_layer_metadata_successes'] >= 4
          assert result['baseline_exact_code_hits'] >= 4
          assert result['temporal_parameter_probes'] >= 32
          assert result['revision_dependency_change_control_probes'] >= 28
          assert result['completed_or_fail_closed_operations'] == result['total_operations']
          assert result['blocked_operations'] == 0
          assert result['stuck_pending_operations'] == 0
          assert json.loads(queue.read_text())['state'] == 'COMPLETED_PUBLISHED'
          assert 'Operation ledger' in website.read_text()
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit and publish canonical outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_temporal_parameter_observability_revision_controls_wave136_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_temporal_parameter_observability_revision_controls_wave136.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave136_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave136_evidence_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0149_security_public_safety_2_wave136_temporal_parameter_observability_and_revision_controls_20260801.v3.task.json
          git commit -m 'security_public_safety_2: publish Wave136 temporal observability controls'
          published=false
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if git rebase origin/codex/aays-single-runner-v5-20260706 && git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              published=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Remote canonical readback
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          remote_head=$(git rev-parse origin/codex/aays-single-runner-v5-20260706)
          for path in \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_temporal_parameter_observability_revision_controls_wave136_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_temporal_parameter_observability_revision_controls_wave136.html \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave136_status_latest.json \
            docs/chatgpt_status/_shared/slots_21/security_public_safety_2/wave136_evidence_latest.json \
            docs/chatgpt_status/_shared/manual_actions/security_public_safety_2.json \
            docs/chatgpt_status/aays1/queue/0149_security_public_safety_2_wave136_temporal_parameter_observability_and_revision_controls_20260801.v3.task.json; do
            local_sha=$(sha256sum "$path" | cut -d' ' -f1)
            remote_sha=$(git show "origin/codex/aays-single-runner-v5-20260706:$path" | sha256sum | cut -d' ' -f1)
            test "$local_sha" = "$remote_sha"
            echo "REMOTE_READBACK $path $remote_sha"
          done
          echo "CANONICAL_REMOTE_HEAD=$remote_head"
