name: AAYS building_type_6 Mansfield OSM one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_6_mansfield_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-6-mansfield-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward to latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append 50 evidence-backed Mansfield OSM records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          SLOT = "building_type_6"
          TASK = "building-type-6-england-classification-v1-20260808"
          CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"
          CITY = "Mansfield"
          LOCAL_AUTHORITY = "Mansfield District"
          REGION = "East Midlands"
          BATCH_INDEX = 8
          EXPECTED_BEFORE = 350
          TARGET_AFTER = 400
          NEXT_TARGET = 450
          GEO = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_latest.geojson")
          MAN = pathlib.Path("england_map_web/data/building_type/shards/building_type_6_manifest_latest.json")
          STA = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json")
          CP = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json")
          CT = pathlib.Path("docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json")
          RUN = pathlib.Path("docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json")
          ENDPOINT = "https://overpass-api.de/api/interpreter"
          NOW = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def dump(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          task = load(CT)
          status = load(STA)
          checkpoint = load(CP)
          manifest = load(MAN)
          geo = load(GEO)

          if task.get("task_id") != TASK or status.get("task_id") != TASK:
              raise SystemExit("task mismatch; refusing second/replacement task")
          if task.get("owner") not in (None, "") or status.get("owner") not in (None, ""):
              raise SystemExit("live owner detected; refusing second owner/task")
          for obj, label in ((task, "task"), (status, "status"), (checkpoint, "checkpoint")):
              if obj.get("continuation_key") != CONT:
                  raise SystemExit(f"{label} continuation_key changed; refusing stale continuation")
          if checkpoint.get("next_batch_index") != BATCH_INDEX:
              raise SystemExit(f"checkpoint batch changed: expected {BATCH_INDEX}, found {checkpoint.get('next_batch_index')}")
          if checkpoint.get("next_target_feature_count") != TARGET_AFTER:
              raise SystemExit(f"checkpoint target changed: expected {TARGET_AFTER}, found {checkpoint.get('next_target_feature_count')}")
          for obj, label in ((task, "task"), (status, "status"), (checkpoint, "checkpoint"), (manifest, "manifest")):
              if obj.get("fake_data") is not False:
                  raise SystemExit(f"{label} fake_data invariant failed")
              if obj.get("final_ready") is not False:
                  raise SystemExit(f"{label} final_ready invariant failed")

          feats = geo.get("features")
          if not isinstance(feats, list):
              raise SystemExit("invalid GeoJSON feature list")
          before = len(feats)
          if before != EXPECTED_BEFORE:
              raise SystemExit(f"shard count changed: expected {EXPECTED_BEFORE}, found {before}")

          already = set()
          represented = set()
          for feat in feats:
              fid = feat.get("id")
              if fid not in (None, ""):
                  already.add(str(fid))
              props = feat.get("properties") or {}
              for key in ("parcel_id", "osm_id"):
                  val = props.get(key)
                  if val not in (None, ""):
                      already.add(str(val))
              for key in ("area", "city", "local_authority"):
                  val = props.get(key)
                  if val:
                      represented.add(str(val).strip().casefold())
          if CITY.casefold() in represented or LOCAL_AUTHORITY.casefold() in represented:
              raise SystemExit("Mansfield already represented; refusing duplicate city batch")

          query = '''[out:json][timeout:90];
          nwr["building"](around:5000,53.1440,-1.1970);
          out body center qt 3000;
          '''
          payload = urllib.parse.urlencode({"data": query}).encode("utf-8")
          raw = None
          last_error = None
          for attempt_no in range(1, 4):
              try:
                  req = urllib.request.Request(
                      ENDPOINT,
                      data=payload,
                      headers={
                          "User-Agent": "TerraYield-AAYS-building_type_6/1.0",
                          "Accept": "application/json",
                          "Content-Type": "application/x-www-form-urlencoded",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read()
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  if attempt_no < 3:
                      time.sleep(5 * attempt_no)
          if raw is None:
              raise SystemExit(f"Overpass failed after 3 attempts: {last_error}")

          source_sha = hashlib.sha256(raw).hexdigest()
          data = json.loads(raw.decode("utf-8"))
          elements = data.get("elements") or []
          if not isinstance(elements, list):
              raise SystemExit("invalid Overpass response")

          residential = {
              "house": ("residential_house", "R_HOUSE"),
              "detached": ("residential_detached", "R_DET"),
              "semidetached_house": ("residential_semidetached", "R_SEMI"),
              "terrace": ("residential_terrace", "R_TERRACE"),
              "apartments": ("residential_apartments", "R_APARTMENT"),
              "bungalow": ("residential_bungalow", "R_BUNGALOW"),
              "residential": ("residential", "R_RESIDENTIAL"),
              "dormitory": ("residential_dormitory", "R_DORMITORY"),
          }
          building_map = {
              "retail": ("commercial_retail", "C_RETAIL", "commercial"),
              "supermarket": ("commercial_retail", "C_RETAIL", "commercial"),
              "commercial": ("commercial", "C_COMMERCIAL", "commercial"),
              "office": ("office", "C_OFFICE", "commercial"),
              "hotel": ("hospitality", "C_HOSPITALITY", "commercial"),
              "industrial": ("industrial", "I_INDUSTRIAL", "industrial"),
              "warehouse": ("warehouse", "I_WAREHOUSE", "industrial"),
              "manufacture": ("industrial", "I_INDUSTRIAL", "industrial"),
              "school": ("education", "P_EDUCATION", "institutional"),
              "college": ("education", "P_EDUCATION", "institutional"),
              "university": ("education", "P_EDUCATION", "institutional"),
              "kindergarten": ("education", "P_EDUCATION", "institutional"),
              "hospital": ("healthcare_care", "H_CARE", "institutional"),
              "clinic": ("healthcare_care", "H_CARE", "institutional"),
              "church": ("religious", "P_RELIGIOUS", "institutional"),
              "chapel": ("religious", "P_RELIGIOUS", "institutional"),
              "cathedral": ("religious", "P_RELIGIOUS", "institutional"),
              "mosque": ("religious", "P_RELIGIOUS", "institutional"),
              "synagogue": ("religious", "P_RELIGIOUS", "institutional"),
              "barn": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
              "farm_auxiliary": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
              "stable": ("agricultural_outbuilding", "A_OUTBUILDING", "agricultural"),
          }
          amenity_map = {
              "school": ("education", "P_EDUCATION", "institutional"),
              "college": ("education", "P_EDUCATION", "institutional"),
              "university": ("education", "P_EDUCATION", "institutional"),
              "kindergarten": ("education", "P_EDUCATION", "institutional"),
              "hospital": ("healthcare_care", "H_CARE", "institutional"),
              "clinic": ("healthcare_care", "H_CARE", "institutional"),
              "doctors": ("healthcare_care", "H_CARE", "institutional"),
              "place_of_worship": ("religious", "P_RELIGIOUS", "institutional"),
              "fire_station": ("public_infrastructure", "P_INFRA", "institutional"),
              "police": ("public_infrastructure", "P_INFRA", "institutional"),
              "library": ("public_infrastructure", "P_INFRA", "institutional"),
              "community_centre": ("public_infrastructure", "P_INFRA", "institutional"),
              "pub": ("commercial_retail", "C_RETAIL", "commercial"),
              "restaurant": ("commercial_retail", "C_RETAIL", "commercial"),
              "cafe": ("commercial_retail", "C_RETAIL", "commercial"),
          }

          def classify(tags):
              b = str(tags.get("building") or "").strip().lower()
              if b in residential:
                  primary, code = residential[b]
                  return primary, code, "residential", "B", 0.85, 3, False, f"osm_building_tag:{b}"
              if b in building_map:
                  primary, code, cat = building_map[b]
                  return primary, code, cat, "B", 0.85, 3, False, f"osm_building_tag:{b}"
              a = str(tags.get("amenity") or "").strip().lower()
              if a in amenity_map:
                  primary, code, cat = amenity_map[a]
                  return primary, code, cat, "B", 0.80, 3, False, f"osm_amenity_tag:{a}"
              if tags.get("shop"):
                  return "commercial_retail", "C_RETAIL", "commercial", "B", 0.80, 3, False, f"osm_shop_tag:{tags.get('shop')}"
              if tags.get("office"):
                  return "office", "C_OFFICE", "commercial", "B", 0.80, 3, False, f"osm_office_tag:{tags.get('office')}"
              tourism = str(tags.get("tourism") or "").strip().lower()
              if tourism in ("hotel", "guest_house", "hostel", "motel"):
                  return "hospitality", "C_HOSPITALITY", "commercial", "B", 0.80, 3, False, f"osm_tourism_tag:{tourism}"
              return "unknown", "U_UNKNOWN", "unknown", "U", 0.20, 1, True, f"osm_building_tag:{b or 'unknown'}"

          candidates = []
          seen = set()
          for el in elements:
              etype = str(el.get("type") or "")
              eid = el.get("id")
              tags = el.get("tags") or {}
              building = tags.get("building")
              if etype not in ("node", "way", "relation") or eid is None or not building:
                  continue
              center = el.get("center") or {}
              lat = el.get("lat", center.get("lat"))
              lon = el.get("lon", center.get("lon"))
              if lat is None or lon is None:
                  continue
              osm_id = f"{etype}/{eid}"
              fid = f"MANSFIELD_OSM_{etype}_{eid}"
              if osm_id in already or str(eid) in already or fid in already or fid in seen:
                  continue
              seen.add(fid)
              primary, code, category, ev, conf, level, review, match = classify(tags)
              parts = [f"OSM {osm_id}", f"building={building}"]
              for key in ("name", "amenity", "shop", "office", "tourism", "addr:street", "addr:housenumber", "addr:postcode"):
                  if tags.get(key):
                      parts.append(f"{key}={tags[key]}")
              excerpt = " | ".join(parts[:8])
              props = {
                  "parcel_id": fid,
                  "parcel_id_semantics": "stable OSM element-derived slot identifier; not a cadastral parcel ID",
                  "osm_id": osm_id,
                  "slot_id": SLOT,
                  "region": REGION,
                  "area": CITY,
                  "local_authority": LOCAL_AUTHORITY,
                  "postcode": str(tags.get("addr:postcode") or ""),
                  "building_type_primary": primary,
                  "building_type_code": code,
                  "building_category": category,
                  "confidence_score": conf,
                  "confidence_level_1_to_4": level,
                  "evidence_level": ev,
                  "source_count": 1,
                  "source": "OpenStreetMap via Overpass API",
                  "source_url": f"https://www.openstreetmap.org/{etype}/{eid}",
                  "source_hash": source_sha,
                  "source_hash_method": "sha256_raw_overpass_response",
                  "match_method": match,
                  "evidence_excerpt": excerpt,
                  "evidence_excerpt_sha256": hashlib.sha256(excerpt.encode("utf-8")).hexdigest(),
                  "source_evidence_excerpt": {k: tags[k] for k in ("building", "name", "amenity", "shop", "office", "tourism", "addr:postcode") if k in tags},
                  "sources": [{
                      "source_name": "OpenStreetMap Overpass API",
                      "url_or_local_path": ENDPOINT,
                      "accessed_at": NOW,
                      "sha256": source_sha,
                      "sha256_scope": "raw_overpass_response",
                      "licence": "ODbL 1.0",
                      "granularity": "building_element",
                      "fields_used": ["building", "name", "amenity", "shop", "office", "tourism", "addr:postcode"],
                      "supports_field": "building_type_primary",
                      "match_method": match,
                      "match_score": conf
                  }],
                  "geometry_match_method": "osm_element_point_or_center",
                  "address_match_method": "osm_tags_when_present",
                  "limitations": "OSM building/use-tag evidence only; no cadastral parcel binding or EPC/VOA corroboration in this batch.",
                  "needs_manual_review": review,
                  "fake_data": False,
                  "final_ready": False,
                  "updated_at": NOW,
              }
              candidates.append({"type": "Feature", "id": fid, "geometry": {"type": "Point", "coordinates": [float(lon), float(lat)]}, "properties": props})

          candidates.sort(key=lambda f: (0 if f["properties"]["evidence_level"] == "B" else 1, f["id"]))
          selected = candidates[:50]
          if len(selected) < 50:
              raise SystemExit(f"only {len(selected)} unique new building features available")
          new_ids = set()
          for feat in selected:
              props = feat["properties"]
              for val in (feat["id"], props["parcel_id"], props["osm_id"]):
                  if val in already or val in new_ids:
                      raise SystemExit(f"dedupe invariant failed for {val}")
                  new_ids.add(val)
              if props["fake_data"] is not False or props["final_ready"] is not False:
                  raise SystemExit("safety flag invariant failed")

          feats.extend(selected)
          after = len(feats)
          if after != TARGET_AFTER or after <= before:
              raise SystemExit(f"progress invariant failed: {before}->{after}")
          geo.setdefault("metadata", {})
          geo["metadata"].update({"feature_count": after, "updated_at": NOW, "last_batch_index": BATCH_INDEX, "last_batch_city": CITY, "fake_data": False, "final_ready": False})
          geo_text = json.dumps(geo, ensure_ascii=False, indent=2) + "\n"
          geo_sha = hashlib.sha256(geo_text.encode("utf-8")).hexdigest()
          GEO.write_text(geo_text, encoding="utf-8")

          all_props = [(f.get("properties") or {}) for f in feats]
          evidence = collections.Counter(str(p.get("evidence_level") or "U") for p in all_props)
          confidence = collections.Counter(str(p.get("confidence_level_1_to_4") or 1) for p in all_props)
          types = collections.Counter(str(p.get("building_type_primary") or "unknown") for p in all_props)
          unknown = types.get("unknown", 0)
          classified = after - unknown
          new_evidence = collections.Counter(f["properties"]["evidence_level"] for f in selected)
          new_conf = collections.Counter(str(f["properties"]["confidence_level_1_to_4"]) for f in selected)

          manifest.update({
              "generated_at": NOW,
              "total_features": after,
              "classified": classified,
              "unknown": unknown,
              "evidence_distribution": dict(sorted(evidence.items())),
              "type_distribution": dict(sorted(types.items())),
              "confidence_level_distribution": dict(sorted(confidence.items())),
              "fake_data": False,
              "final_ready": False,
              "note": f"Existing {before} features preserved; {CITY}/{LOCAL_AUTHORITY} batch {BATCH_INDEX} appended from runtime Overpass with already_processed_ids dedupe.",
              "feature_count": after,
              "geojson_sha256": geo_sha,
              "geojson_path": str(GEO),
              "manifest_updated_at": NOW,
          })
          sources = manifest.setdefault("sources", [])
          sources.append({
              "name": f"OpenStreetMap Overpass API - {CITY}/{LOCAL_AUTHORITY}",
              "url": ENDPOINT,
              "license": "ODbL 1.0",
              "features_used": 50,
              "accessed_at": NOW,
              "source_sha256": source_sha,
              "source_hash_method": "sha256_raw_overpass_response",
              "note": f"Runtime-only Overpass response; raw source not committed. building=* evidence from {CITY} 5 km grid."
          })

          status.update({
              "state": "READY", "updated_at": NOW, "owner": None, "final_ready": False,
              "classified_count": classified, "unknown_count": unknown, "total_elements": after,
              "confidence_distribution": dict(sorted(confidence.items())),
              "evidence_distribution": dict(sorted(evidence.items())),
              "output_sha256": geo_sha, "blocker": None,
              "next_batch_index": BATCH_INDEX + 1, "next_target_feature_count": NEXT_TARGET,
              "note": f"Appended 50 unique {CITY}/{LOCAL_AUTHORITY} OSM building elements; no second task/owner created.",
              "fake_data": False
          })

          checkpoint.update({
              "sequence": int(checkpoint.get("sequence", 0)) + 1,
              "hydration_state": "REMOTE_HEAD_HYDRATED_CONTINUATION_ADVANCED",
              "remote_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "first_unverified_step": f"APPEND_NEW_BATCH_{BATCH_INDEX + 1:03d}_AFTER_FEATURE_{after}",
              "first_unverified_step_status": "READY", "terminal_status": "READY",
              "updated_at": NOW, "final_ready": False, "state": "READY",
              "summary": {"osm_pilot_classified": classified, "unknown": unknown, "current_feature_count": after, "pipeline_stage": 1},
              "feature_count_before": before, "feature_count_after": after, "current_feature_count": after,
              "next_batch_index": BATCH_INDEX + 1, "next_target_feature_count": NEXT_TARGET,
              "next_required_action": f"CONTINUE_BATCH_{BATCH_INDEX + 1}_FROM_{after}_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES",
              "fake_data": False, "last_processed_ids_sample": [f["id"] for f in selected[:10]],
              "last_city": CITY, "last_batch_index": BATCH_INDEX
          })
          attempted = checkpoint.setdefault("attempted_cities", [])
          if CITY not in attempted:
              attempted.append(CITY)
          sae = checkpoint.setdefault("source_access_evidence", {})
          sae["overpass_api"] = f"SUCCESS_MANSFIELD_BATCH_{BATCH_INDEX}"
          sae["mansfield_source_sha256"] = source_sha

          prev_pct = float((task.get("progress") or {}).get("current_percent", 0.0))
          current_pct = round(after / NEXT_TARGET * 100, 4)
          task.update({
              "updated_at": NOW, "first_unverified_step": f"APPEND_NEW_BATCH_{BATCH_INDEX + 1:03d}_AFTER_FEATURE_{after}",
              "owner": None, "blocker": None, "fake_data": False, "final_ready": False,
              "progress": {"completed_count": after, "target_count": NEXT_TARGET, "previous_percent": prev_pct, "current_percent": current_pct, "percent_increase": round(current_pct - prev_pct, 4)}
          })

          runner = {
              "slot_id": SLOT, "task_id": TASK, "continuation_key": CONT, "generated_at": NOW,
              "batch_index": BATCH_INDEX, "city": CITY, "local_authority": LOCAL_AUTHORITY, "region": REGION,
              "feature_count_before": before, "feature_count_after": after, "new_feature_count": 50,
              "source_name": "OpenStreetMap Overpass API", "source_url": ENDPOINT,
              "source_sha256": source_sha, "source_hash_method": "sha256_raw_overpass_response",
              "raw_source_committed": False, "fake_data": False, "final_ready": False,
              "evidence_distribution_new": dict(new_evidence), "confidence_distribution_new": dict(new_conf),
              "records": [{"feature_id": f["id"], "geometry": f["geometry"], **f["properties"]} for f in selected]
          }

          dump(MAN, manifest)
          dump(STA, status)
          dump(CP, checkpoint)
          dump(CT, task)
          dump(RUN, runner)
          print(json.dumps({"before": before, "after": after, "new": len(selected), "new_evidence": dict(new_evidence), "new_confidence": dict(new_conf), "source_sha256": source_sha}, indent=2))
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          SELF='.github/workflows/tmp_building_type_6_mansfield_20260810.yml'
          OWNED=(
            'england_map_web/data/building_type/shards/building_type_6_latest.geojson'
            'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json'
            'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json'
          )
          BASE="$(git rev-parse HEAD)"
          git config user.name 'AAYS building_type_6 continuation'
          git config user.email 'aays-building-type-6@local.invalid'
          git rm "$SELF"
          git add "${OWNED[@]}"
          git diff --cached --quiet && { echo 'No staged progress'; exit 1; }
          git commit -m 'building_type_6: append Mansfield OSM batch 8'

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            REMOTE="$(git rev-parse "origin/$BRANCH")"
            CHANGED="$(git diff --name-only "$BASE..$REMOTE" -- "${OWNED[@]}" || true)"
            if [ -n "$CHANGED" ]; then
              echo 'Same-slot files changed remotely after batch started; fail closed:'
              echo "$CHANGED"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$REMOTE" HEAD; then
              git rebase "origin/$BRANCH"
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Push failed after guarded retries'
          exit 1
