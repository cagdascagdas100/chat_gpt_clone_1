name: AAYS building_type_6 Mansfield Overture one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_6_mansfield_20260810.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-6-mansfield-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Fast-forward to latest canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Install Overture client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet overturemaps

      - name: Append 50 evidence-backed Mansfield Overture records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import subprocess
          import time

          SLOT = 'building_type_6'
          TASK = 'building-type-6-england-classification-v1-20260808'
          CONT = 'c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a'
          CITY = 'Mansfield'
          LOCAL_AUTHORITY = 'Mansfield District'
          REGION = 'East Midlands'
          BATCH_INDEX = 8
          EXPECTED_BEFORE = 350
          TARGET_AFTER = 400
          NEXT_TARGET = 450
          BBOX = '-1.272,53.099,-1.122,53.189'
          GEO = pathlib.Path('england_map_web/data/building_type/shards/building_type_6_latest.geojson')
          MAN = pathlib.Path('england_map_web/data/building_type/shards/building_type_6_manifest_latest.json')
          STA = pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json')
          CP = pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json')
          CT = pathlib.Path('docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json')
          RUN = pathlib.Path('docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json')
          RAW = pathlib.Path('/tmp/mansfield_overture_buildings.geojson')
          SOURCE_URL = 'https://stac.overturemaps.org/catalog.json'
          NOW = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def load(p):
              return json.loads(p.read_text(encoding='utf-8'))
          def dump(p, obj):
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          task, status, checkpoint, manifest, geo = map(load, (CT, STA, CP, MAN, GEO))
          if task.get('task_id') != TASK or status.get('task_id') != TASK:
              raise SystemExit('task mismatch; refusing second/replacement task')
          if task.get('owner') not in (None,'') or status.get('owner') not in (None,''):
              raise SystemExit('live owner detected; refusing second owner/task')
          for obj,label in ((task,'task'),(status,'status'),(checkpoint,'checkpoint')):
              if obj.get('continuation_key') != CONT:
                  raise SystemExit(f'{label} continuation changed; fail closed')
          if checkpoint.get('next_batch_index') != BATCH_INDEX or checkpoint.get('next_target_feature_count') != TARGET_AFTER:
              raise SystemExit('checkpoint moved; fail closed')
          for obj,label in ((task,'task'),(status,'status'),(checkpoint,'checkpoint'),(manifest,'manifest')):
              if obj.get('fake_data') is not False or obj.get('final_ready') is not False:
                  raise SystemExit(f'{label} safety invariant failed')

          feats = geo.get('features')
          if not isinstance(feats,list) or len(feats) != EXPECTED_BEFORE:
              raise SystemExit(f'shard count changed; expected {EXPECTED_BEFORE}, found {len(feats) if isinstance(feats,list) else "invalid"}')
          before = len(feats)
          already = set()
          represented = set()
          for feat in feats:
              if feat.get('id') not in (None,''):
                  already.add(str(feat['id']))
              props = feat.get('properties') or {}
              for key in ('parcel_id','osm_id'):
                  if props.get(key) not in (None,''):
                      already.add(str(props[key]))
              for key in ('area','city','local_authority'):
                  if props.get(key):
                      represented.add(str(props[key]).strip().casefold())
          if CITY.casefold() in represented or LOCAL_AUTHORITY.casefold() in represented:
              raise SystemExit('Mansfield already represented; refusing duplicate city batch')

          last_error = None
          for attempt in range(1,4):
              try:
                  if RAW.exists(): RAW.unlink()
                  subprocess.run(['overturemaps','download',f'--bbox={BBOX}','-f','geojson','--type=building','-o',str(RAW)], check=True, timeout=240)
                  if RAW.exists() and RAW.stat().st_size > 0:
                      break
              except Exception as exc:
                  last_error = repr(exc)
                  if attempt < 3: time.sleep(5*attempt)
          if not RAW.exists() or RAW.stat().st_size == 0:
              raise SystemExit(f'Overture failed after 3 attempts: {last_error}')

          raw_bytes = RAW.read_bytes()
          source_sha = hashlib.sha256(raw_bytes).hexdigest()
          data = json.loads(raw_bytes.decode('utf-8'))
          src_features = data.get('features') or []
          if not isinstance(src_features,list):
              raise SystemExit('invalid Overture GeoJSON')

          residential_classes = {
              'apartments':('residential_apartments','R_APARTMENT'), 'bungalow':('residential_bungalow','R_BUNGALOW'),
              'detached':('residential_detached','R_DET'), 'dwelling_house':('residential_house','R_HOUSE'),
              'house':('residential_house','R_HOUSE'), 'residential':('residential','R_RESIDENTIAL'),
              'semi':('residential_semidetached','R_SEMI'), 'semidetached_house':('residential_semidetached','R_SEMI'),
              'terrace':('residential_terrace','R_TERRACE'), 'dormitory':('residential_dormitory','R_DORMITORY')}
          class_map = {
              'commercial':('commercial','C_COMMERCIAL','commercial'),'retail':('commercial_retail','C_RETAIL','commercial'),
              'supermarket':('commercial_retail','C_RETAIL','commercial'),'office':('office','C_OFFICE','commercial'),
              'hotel':('hospitality','C_HOSPITALITY','commercial'),'factory':('industrial','I_INDUSTRIAL','industrial'),
              'industrial':('industrial','I_INDUSTRIAL','industrial'),'manufacture':('industrial','I_INDUSTRIAL','industrial'),
              'warehouse':('warehouse','I_WAREHOUSE','industrial'),'school':('education','P_EDUCATION','institutional'),
              'college':('education','P_EDUCATION','institutional'),'university':('education','P_EDUCATION','institutional'),
              'kindergarten':('education','P_EDUCATION','institutional'),'hospital':('healthcare_care','H_CARE','institutional'),
              'church':('religious','P_RELIGIOUS','institutional'),'chapel':('religious','P_RELIGIOUS','institutional'),
              'cathedral':('religious','P_RELIGIOUS','institutional'),'mosque':('religious','P_RELIGIOUS','institutional'),
              'synagogue':('religious','P_RELIGIOUS','institutional'),'religious':('religious','P_RELIGIOUS','institutional'),
              'fire_station':('public_infrastructure','P_INFRA','institutional'),'library':('public_infrastructure','P_INFRA','institutional'),
              'government':('public_infrastructure','P_INFRA','institutional'),'civic':('public_infrastructure','P_INFRA','institutional'),
              'barn':('agricultural_outbuilding','A_OUTBUILDING','agricultural'),'farm':('agricultural','A_AGRICULTURAL','agricultural'),
              'farm_auxiliary':('agricultural_outbuilding','A_OUTBUILDING','agricultural'),'stable':('agricultural_outbuilding','A_OUTBUILDING','agricultural')}
          subtype_map = {
              'residential':('residential','R_RESIDENTIAL','residential'),'commercial':('commercial','C_COMMERCIAL','commercial'),
              'education':('education','P_EDUCATION','institutional'),'industrial':('industrial','I_INDUSTRIAL','industrial'),
              'medical':('healthcare_care','H_CARE','institutional'),'religious':('religious','P_RELIGIOUS','institutional'),
              'agricultural':('agricultural','A_AGRICULTURAL','agricultural'),'civic':('public_infrastructure','P_INFRA','institutional'),
              'transportation':('public_infrastructure','P_INFRA','institutional')}

          def classify(props):
              cls = str(props.get('class') or '').strip().lower()
              subtype = str(props.get('subtype') or '').strip().lower()
              if cls in residential_classes:
                  primary, code = residential_classes[cls]
                  return primary,code,'residential','B',0.85,3,False,f'overture_building_class:{cls}'
              if cls in class_map:
                  primary,code,cat = class_map[cls]
                  return primary,code,cat,'B',0.85,3,False,f'overture_building_class:{cls}'
              if subtype in subtype_map:
                  primary,code,cat = subtype_map[subtype]
                  return primary,code,cat,'C',0.65,2,True,f'overture_building_subtype:{subtype}'
              return 'unknown','U_UNKNOWN','unknown','U',0.20,1,True,'overture_building_unclassified'

          candidates=[]
          seen=set()
          for sf in src_features:
              props = sf.get('properties') or {}
              oid = sf.get('id') or props.get('id')
              geom = sf.get('geometry')
              if not oid or not geom:
                  continue
              oid = str(oid)
              fid = 'MANSFIELD_OVERTURE_' + oid.replace('/','_')
              if oid in already or fid in already or fid in seen:
                  continue
              seen.add(fid)
              primary,code,cat,ev,conf,level,review,match = classify(props)
              cls = props.get('class')
              subtype = props.get('subtype')
              names = props.get('names') or {}
              name = names.get('primary') if isinstance(names,dict) else None
              parts=[f'Overture building {oid}']
              if cls: parts.append(f'class={cls}')
              if subtype: parts.append(f'subtype={subtype}')
              if name: parts.append(f'name={name}')
              excerpt=' | '.join(parts)
              outprops={
                  'parcel_id':fid,'parcel_id_semantics':'stable Overture building-derived slot identifier; not a cadastral parcel ID',
                  'overture_id':oid,'slot_id':SLOT,'region':REGION,'area':CITY,'local_authority':LOCAL_AUTHORITY,'postcode':'',
                  'building_type_primary':primary,'building_type_code':code,'building_category':cat,'confidence_score':conf,
                  'confidence_level_1_to_4':level,'evidence_level':ev,'source_count':1,'source':'Overture Maps buildings',
                  'source_url':SOURCE_URL,'source_hash':source_sha,'source_hash_method':'sha256_runtime_bbox_geojson',
                  'match_method':match,'evidence_excerpt':excerpt,'evidence_excerpt_sha256':hashlib.sha256(excerpt.encode()).hexdigest(),
                  'source_evidence_excerpt':{'class':cls,'subtype':subtype,'name':name},
                  'sources':[{'source_name':'Overture Maps buildings','url_or_local_path':SOURCE_URL,'accessed_at':NOW,
                              'sha256':source_sha,'sha256_scope':'runtime_bbox_geojson','licence':'Overture data license / source licences',
                              'granularity':'building_footprint','fields_used':['id','class','subtype','names','geometry'],
                              'supports_field':'building_type_primary','match_method':match,'match_score':conf}],
                  'geometry_match_method':'overture_building_footprint','address_match_method':'none',
                  'limitations':'Overture building class/subtype evidence only; no cadastral parcel binding or EPC/VOA corroboration in this batch.',
                  'needs_manual_review':review,'fake_data':False,'final_ready':False,'updated_at':NOW}
              candidates.append({'type':'Feature','id':fid,'geometry':geom,'properties':outprops})

          candidates.sort(key=lambda f: ({'B':0,'C':1,'U':2}.get(f['properties']['evidence_level'],3), f['id']))
          selected=candidates[:50]
          if len(selected)<50:
              raise SystemExit(f'only {len(selected)} unique new Overture buildings available')
          newids=set()
          for f in selected:
              for v in (f['id'],f['properties']['parcel_id'],f['properties']['overture_id']):
                  if v in already or v in newids: raise SystemExit(f'dedupe invariant failed: {v}')
                  newids.add(v)

          feats.extend(selected)
          after=len(feats)
          if after != TARGET_AFTER or after <= before: raise SystemExit(f'progress invariant failed {before}->{after}')
          geo.setdefault('metadata',{}).update({'feature_count':after,'updated_at':NOW,'last_batch_index':BATCH_INDEX,'last_batch_city':CITY,'fake_data':False,'final_ready':False})
          geo_text=json.dumps(geo,ensure_ascii=False,indent=2)+'\n'
          geo_sha=hashlib.sha256(geo_text.encode()).hexdigest()
          GEO.write_text(geo_text,encoding='utf-8')

          allp=[f.get('properties') or {} for f in feats]
          evidence=collections.Counter(str(p.get('evidence_level') or 'U') for p in allp)
          confidence=collections.Counter(str(p.get('confidence_level_1_to_4') or 1) for p in allp)
          types=collections.Counter(str(p.get('building_type_primary') or 'unknown') for p in allp)
          unknown=types.get('unknown',0); classified=after-unknown
          new_ev=collections.Counter(f['properties']['evidence_level'] for f in selected)
          new_cf=collections.Counter(str(f['properties']['confidence_level_1_to_4']) for f in selected)

          manifest.update({'generated_at':NOW,'total_features':after,'classified':classified,'unknown':unknown,
                           'evidence_distribution':dict(sorted(evidence.items())),'type_distribution':dict(sorted(types.items())),
                           'confidence_level_distribution':dict(sorted(confidence.items())),'fake_data':False,'final_ready':False,
                           'note':f'Existing {before} features preserved; {CITY}/{LOCAL_AUTHORITY} batch {BATCH_INDEX} appended from runtime Overture bbox with already_processed_ids dedupe.',
                           'feature_count':after,'geojson_sha256':geo_sha,'geojson_path':str(GEO),'manifest_updated_at':NOW})
          manifest.setdefault('sources',[]).append({'name':f'Overture Maps buildings - {CITY}/{LOCAL_AUTHORITY}','url':SOURCE_URL,
                  'features_used':50,'accessed_at':NOW,'source_sha256':source_sha,'source_hash_method':'sha256_runtime_bbox_geojson',
                  'note':f'Runtime-only Overture building bbox extract for {CITY}; raw source not committed.'})
          status.update({'state':'READY','updated_at':NOW,'owner':None,'final_ready':False,'classified_count':classified,'unknown_count':unknown,
                         'total_elements':after,'confidence_distribution':dict(sorted(confidence.items())),'evidence_distribution':dict(sorted(evidence.items())),
                         'output_sha256':geo_sha,'blocker':None,'next_batch_index':9,'next_target_feature_count':NEXT_TARGET,
                         'note':f'Appended 50 unique {CITY}/{LOCAL_AUTHORITY} Overture buildings; no second task/owner created.','fake_data':False})
          checkpoint.update({'sequence':int(checkpoint.get('sequence',0))+1,'hydration_state':'REMOTE_HEAD_HYDRATED_CONTINUATION_ADVANCED',
              'remote_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'first_unverified_step':f'APPEND_NEW_BATCH_009_AFTER_FEATURE_{after}',
              'first_unverified_step_status':'READY','terminal_status':'READY','updated_at':NOW,'final_ready':False,'state':'READY',
              'summary':{'osm_pilot_classified':classified,'unknown':unknown,'current_feature_count':after,'pipeline_stage':1},
              'feature_count_before':before,'feature_count_after':after,'current_feature_count':after,'next_batch_index':9,'next_target_feature_count':NEXT_TARGET,
              'next_required_action':f'CONTINUE_BATCH_9_FROM_{after}_USING_ALREADY_PROCESSED_IDS_DO_NOT_REPROCESS_EXISTING_FEATURES','fake_data':False,
              'last_processed_ids_sample':[f['id'] for f in selected[:10]],'last_city':CITY,'last_batch_index':BATCH_INDEX})
          if CITY not in checkpoint.setdefault('attempted_cities',[]): checkpoint['attempted_cities'].append(CITY)
          sae=checkpoint.setdefault('source_access_evidence',{})
          sae['overture_maps']=f'SUCCESS_MANSFIELD_BATCH_{BATCH_INDEX}'
          sae['mansfield_overture_source_sha256']=source_sha
          prev=float((task.get('progress') or {}).get('current_percent',0.0)); cur=round(after/NEXT_TARGET*100,4)
          task.update({'updated_at':NOW,'first_unverified_step':f'APPEND_NEW_BATCH_009_AFTER_FEATURE_{after}','owner':None,'blocker':None,
                       'fake_data':False,'final_ready':False,'progress':{'completed_count':after,'target_count':NEXT_TARGET,
                       'previous_percent':prev,'current_percent':cur,'percent_increase':round(cur-prev,4)}})
          runner={'slot_id':SLOT,'task_id':TASK,'continuation_key':CONT,'generated_at':NOW,'batch_index':BATCH_INDEX,'city':CITY,
                  'local_authority':LOCAL_AUTHORITY,'region':REGION,'feature_count_before':before,'feature_count_after':after,'new_feature_count':50,
                  'source_name':'Overture Maps buildings','source_url':SOURCE_URL,'source_sha256':source_sha,'source_hash_method':'sha256_runtime_bbox_geojson',
                  'raw_source_committed':False,'fake_data':False,'final_ready':False,'evidence_distribution_new':dict(new_ev),
                  'confidence_distribution_new':dict(new_cf),'records':[{'feature_id':f['id'],'geometry':f['geometry'],**f['properties']} for f in selected]}
          for p,o in ((MAN,manifest),(STA,status),(CP,checkpoint),(CT,task),(RUN,runner)): dump(p,o)
          print(json.dumps({'before':before,'after':after,'new':50,'new_evidence':dict(new_ev),'new_confidence':dict(new_cf),'source_sha256':source_sha},indent=2))
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='codex/aays-single-runner-v5-20260706'
          SELF='.github/workflows/tmp_building_type_6_mansfield_20260810.yml'
          OWNED=(
            'england_map_web/data/building_type/shards/building_type_6_latest.geojson'
            'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json'
            'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json'
          )
          BASE="$(git rev-parse HEAD)"
          git config user.name 'AAYS building_type_6 continuation'
          git config user.email 'aays-building-type-6@local.invalid'
          git rm "$SELF"
          git add "${OWNED[@]}"
          git diff --cached --quiet && { echo 'No staged progress'; exit 1; }
          git commit -m 'building_type_6: append Mansfield Overture batch 8'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            REMOTE="$(git rev-parse "origin/$BRANCH")"
            CHANGED="$(git diff --name-only "$BASE..$REMOTE" -- "${OWNED[@]}" || true)"
            if [ -n "$CHANGED" ]; then echo 'Same-slot files changed remotely; fail closed:'; echo "$CHANGED"; exit 1; fi
            if ! git merge-base --is-ancestor "$REMOTE" HEAD; then git rebase "origin/$BRANCH"; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
