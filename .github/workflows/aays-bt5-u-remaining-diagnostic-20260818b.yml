name: AAYS BT5 remaining U diagnostic 20260818b
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aays-bt5-u-remaining-diagnostic-20260818b.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Mark started
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_u_remaining_diagnostic_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'RUNNING',run_id:String(context.runId),head_sha:context.sha,started_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 remaining-U diagnostic started',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 1
      - name: Inspect remaining U candidates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson').read_text(encoding='utf-8'))
          fs=d['features']
          u=[f for f in fs if (f.get('properties') or {}).get('evidence_level')=='U']
          print('U_COUNT',len(u))
          keys=['building','amenity','shop','office','tourism','healthcare','railway','landuse','leisure','craft','public_transport','name','operator','brand','man_made','historic']
          for i,f in enumerate(u):
              p=f.get('properties') or {}; t=p.get('osm_tags_summary') or {}
              sig={k:t[k] for k in keys if k in t and t[k] not in (None,'')}
              print('U_ROW',i,json.dumps({'parcel_id':p.get('parcel_id'),'area':p.get('area'),'coords':(f.get('geometry') or {}).get('coordinates'),'sig':sig,'tags':t},ensure_ascii=False,sort_keys=True))
          PY
      - name: Mark finished
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='docs/chatgpt_status/_shared/slots_21/building_type_5/actions_u_remaining_diagnostic_status.json';
            let sha; try { const r=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); sha=r.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const body={slot_id:'building_type_5',state:'${{ job.status }}'.toUpperCase(),run_id:String(context.runId),head_sha:context.sha,finished_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'aays: mark BT5 remaining-U diagnostic finished',content:Buffer.from(JSON.stringify(body)).toString('base64'),...(sha?{sha}:{})});
