name: AAYS building_type_2 batch143 Enfield one-shot

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/aays-building-type-2-batch143-enfield-once.yml]

permissions:
  contents: write

concurrency:
  group: aays-building-type-2-batch143-enfield-once
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 20
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/aays-building-type-6-batch26-skegness-once.yml
            england_map_web/data/building_type/shards/building_type_2_latest.geojson
            england_map_web/data/building_type/shards/building_type_2_manifest_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_2
            docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs
      - name: Fast-forward to canonical head
        run: git pull --ff-only origin codex/aays-single-runner-v5-20260706
      - name: Execute guarded batch143
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aays-building-type-6-batch26-skegness-once.yml').read_text()
          marker="          python - <<'PY'\n"; start=src.index(marker)+len(marker); end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          repl={
          'SLOT = "building_type_6"':'SLOT = "building_type_2"',
          'TASK = "building-type-6-england-classification-v1-20260808"':'TASK = "building-type-2-england-classification-v1-20260808"',
          'CONT = "c1418ec751ca09ee40aa5704d014ad3e25ee346e2fc9eec7c32d3c11d565027a"':'CONT = ""',
          'CITY = "Skegness"':'CITY = "Enfield"',
          'LOCAL_AUTHORITY = "East Lindsey"':'LOCAL_AUTHORITY = "Enfield"',
          'REGION = "East Midlands"':'REGION = "London Outer"',
          'BATCH_INDEX = 26':'BATCH_INDEX = 143',
          'EXPECTED_BEFORE = 2250':'EXPECTED_BEFORE = 7100',
          'ADD_COUNT = 250':'ADD_COUNT = 50',
          'TARGET_AFTER = 2500':'TARGET_AFTER = 7150',
          'NEXT_TARGET = 2750':'NEXT_TARGET = 7200',
          'BBOX = [0.20, 53.08, 0.48, 53.21]':'BBOX = [-0.10, 51.635, -0.045, 51.675]',
          'england_map_web/data/building_type/shards/building_type_6_latest.geojson':'england_map_web/data/building_type/shards/building_type_2_latest.geojson',
          'england_map_web/data/building_type/shards/building_type_6_manifest_latest.json':'england_map_web/data/building_type/shards/building_type_2_manifest_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/status_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/checkpoint_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json',
          'docs/chatgpt_status/_shared/slots_21/building_type_6/current_task_latest.json':'docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json',
          'docs/chatgpt_status/building_type/slots/building_type_6/runner_outputs/building_type_6_classification_latest.json':'docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'}
          for old,new in repl.items():
              if old not in code: raise SystemExit(f'missing token {old}')
              code=code.replace(old,new,1)
          code=code.replace('building_type_6','building_type_2').replace('Skegness','Enfield').replace('SKEGNESS','ENFIELD').replace('skegness','enfield')
          old='if checkpoint.get("continuation_key") != CONT or status.get("continuation_key") != CONT or task.get("continuation_key") != CONT:'
          new='if (checkpoint.get("continuation_key") or "") != CONT or (status.get("continuation_key") or "") != CONT or (task.get("continuation_key") or "") != CONT:'
          if old not in code: raise SystemExit('missing continuation guard')
          code=code.replace(old,new,1)
          required_patches={
              '"area": CITY,':'"area": CITY,\n                  "city": CITY,\n                  "grid_id": "uk-grid-enfield-town-001",',
              '"building_type_primary": primary,':'"building_type": primary,\n                  "building_type_primary": primary,',
              '"confidence_level_1_to_4": level,':'"confidence": level,\n                  "confidence_level_1_to_4": level,',
              '"source": "OpenStreetMap via Overpass API",':'"evidence_sources": ["OpenStreetMap via Overpass API"],\n                  "evidence_urls": [object_url],\n                  "source": "OpenStreetMap via Overpass API",'
          }
          for old,new in required_patches.items():
              if old not in code: raise SystemExit(f'missing evidence schema token {old}')
              code=code.replace(old,new,1)
          if 'dump(CT, task)' not in code: raise SystemExit('missing current_task write token')
          code=code.replace('dump(CT, task)', '# current_task intentionally preserved unchanged for same task/owner/continuation')
          Path('/tmp/bt2_b143.py').write_text(code)
          PY
          python /tmp/bt2_b143.py
      - name: Validate exact batch before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          paths={
            'g':'england_map_web/data/building_type/shards/building_type_2_latest.geojson',
            'm':'england_map_web/data/building_type/shards/building_type_2_manifest_latest.json',
            'c':'docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json',
            's':'docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json',
            'r':'docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json',
            't':'docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json'}
          x={k:json.load(open(v,encoding='utf-8')) for k,v in paths.items()}
          g,m,c,s,r,t=x['g'],x['m'],x['c'],x['s'],x['r'],x['t']
          assert len(g['features'])==7150
          assert c['feature_count_before']==7100 and c['feature_count_after']==7150 and c['next_batch_index']==144
          assert s['total_elements']==7150
          assert r.get('city')=='Enfield' and (r.get('new_feature_count')==50 or r.get('added_feature_count')==50)
          assert t['owner'] in (None,'') and (t.get('continuation_key') or '')==''
          assert all(z.get('fake_data') is False and z.get('final_ready') is False for z in (c,s,r,t))
          new=g['features'][-50:]
          assert len(new)==50
          for f in new:
              p=f.get('properties') or {}
              assert f.get('id') and p.get('parcel_id') and p.get('osm_id')
              assert p.get('building_type_primary') and p.get('evidence_excerpt') and p.get('evidence_level')
              assert p.get('confidence_level_1_to_4') in {1,2,3,4}
              assert p.get('confidence_score') is not None and p.get('source_url') and p.get('sources')
              assert p.get('fake_data') is False and p.get('final_ready') is False
              assert p.get('city')=='Enfield' and p.get('grid_id')=='uk-grid-enfield-town-001'
              for src in p.get('sources') or []:
                  assert (src.get('url') or src.get('url_or_local_path')) and src.get('accessed_at') and src.get('fields_used') and src.get('match_method')
          seen=set()
          for f in g['features']:
              p=f.get('properties') or {}; vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v not in (None,'')}
              assert not (seen & vals); seen.update(vals)
          assert m.get('total_features')==7150
          print('LOCAL_VALIDATION_OK building_type_2 7100->7150 batch143 Enfield fake_data=false final_ready=false')
          PY
      - name: Commit and push exact slot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add england_map_web/data/building_type/shards/building_type_2_latest.geojson england_map_web/data/building_type/shards/building_type_2_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json
          git diff --cached --quiet && { echo 'No progress'; exit 1; }
          git commit -m 'data(building_type_2): append Enfield OSM batch 143 7100->7150'
          for a in 1 2 3 4 5; do git push origin HEAD:codex/aays-single-runner-v5-20260706 && exit 0; git fetch origin codex/aays-single-runner-v5-20260706 --depth=20; git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }; done; exit 1
      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706 --depth=20
          python - <<'PY'
          import json,subprocess
          def j(p): return json.loads(subprocess.check_output(['git','show','origin/codex/aays-single-runner-v5-20260706:'+p]))
          g=j('england_map_web/data/building_type/shards/building_type_2_latest.geojson'); m=j('england_map_web/data/building_type/shards/building_type_2_manifest_latest.json'); c=j('docs/chatgpt_status/_shared/slots_21/building_type_2/checkpoint_latest.json'); s=j('docs/chatgpt_status/_shared/slots_21/building_type_2/status_latest.json'); r=j('docs/chatgpt_status/building_type/slots/building_type_2/runner_outputs/building_type_2_classification_latest.json'); t=j('docs/chatgpt_status/_shared/slots_21/building_type_2/current_task_latest.json')
          assert len(g['features'])==7150 and m.get('total_features')==7150
          assert c['feature_count_before']==7100 and c['feature_count_after']==7150 and c['next_batch_index']==144
          assert s['total_elements']==7150 and r.get('city')=='Enfield' and (r.get('new_feature_count')==50 or r.get('added_feature_count')==50)
          assert t['owner'] in (None,'') and (t.get('continuation_key') or '')==''
          assert all(x.get('fake_data') is False and x.get('final_ready') is False for x in (c,s,r,t))
          rec=r.get('records') or []; assert len(rec)==50
          seen=set()
          for f in g['features']:
              p=f.get('properties') or {}; vals={str(v) for v in (f.get('id'),p.get('parcel_id'),p.get('osm_id')) if v not in (None,'')}
              assert not (seen & vals); seen.update(vals)
          print('REMOTE_READBACK_OK building_type_2 7100->7150 batch143 Enfield final_ready=false')
          PY
