name: AAYS building_type_5 Kings Lynn batch49 FHRS fallback

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths:
      - '.github/workflows/tmp_building_type_5_kings_lynn_batch49_fhrs_20260811.yml'

permissions:
  contents: write

concurrency:
  group: aays-building-type-5-kings-lynn-batch49-fhrs
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Refresh branch and verify continuation base
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          git merge-base --is-ancestor 76422300f5dee2d2be3fd68b287fce19686da07d HEAD
          git merge-base --is-ancestor 64eec19a9a3dba6d4fe2e38297ae782d7feb8f0f HEAD

      - name: Append exactly 50 new Kings Lynn FHRS premises-use records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, urllib.request, xml.etree.ElementTree as ET, re
          from pathlib import Path
          from datetime import datetime, timezone
          from collections import Counter

          SLOT='building_type_5'; CITY="King's Lynn"; AUTHORITY="King's Lynn and West Norfolk"; GRID='KINGS_LYNN_01'
          BATCH=49; EXPECTED_BEFORE=2400; TARGET_AFTER=2450; NEXT_TARGET=2500
          TASK_ID='building-type-5-england-classification-v1-20260808'
          AUTH_URL='https://api.ratings.food.gov.uk/authorities'
          geo_path=Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson')
          manifest_path=Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json')
          runner_path=Path('docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json')
          status_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          checkpoint_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          task_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          recovery_path=Path('docs/chatgpt_status/_shared/slots_21/building_type_5/recovery_latest.json')

          geo=json.loads(geo_path.read_text(encoding='utf-8')); features=geo.get('features',[])
          if len(features)!=EXPECTED_BEFORE: raise SystemExit(f'fail closed: expected {EXPECTED_BEFORE}, found {len(features)}')
          cp=json.loads(checkpoint_path.read_text(encoding='utf-8'))
          if int(cp.get('next_batch_index',-1))!=BATCH: raise SystemExit(f"fail closed: next_batch_index={cp.get('next_batch_index')}")
          if int(cp.get('next_target_feature_count',-1))!=TARGET_AFTER: raise SystemExit(f"fail closed: next_target_feature_count={cp.get('next_target_feature_count')}")
          continuation_key=cp.get('continuation_key','')
          task=json.loads(task_path.read_text(encoding='utf-8'))
          if task.get('task_id')!=TASK_ID: raise SystemExit('fail closed: task changed')
          if task.get('owner') not in (None,''): raise SystemExit(f"BLOCKED_LIVE_OWNER: {task.get('owner')}")
          if task.get('continuation_key','')!=continuation_key: raise SystemExit('fail closed: continuation_key mismatch')
          if recovery_path.exists(): raise SystemExit('RECOVERY_PRESENT_REVIEW_REQUIRED')
          if any("king's lynn" in str((f.get('properties') or {}).get('area','')).lower() for f in features): raise SystemExit("fail closed: King's Lynn already present")

          processed=set(); ids=[]; parcels=[]; osms=[]; prior_source_ids=set()
          for f in features:
              p=f.get('properties') or {}
              for v in (f.get('id'), p.get('parcel_id'), p.get('osm_id')):
                  if v is not None: processed.add(str(v))
              if f.get('id') is not None: ids.append(str(f.get('id')))
              if p.get('parcel_id') is not None: parcels.append(str(p.get('parcel_id')))
              if p.get('osm_id') is not None: osms.append(str(p.get('osm_id')))
              for key in ('fhrs_id','source_record_id','FHRSID'):
                  if p.get(key) is not None: prior_source_ids.add(str(p.get(key)))
              ex=p.get('evidence_excerpt') or p.get('source_evidence_excerpt') or {}
              if isinstance(ex,dict) and ex.get('FHRSID') is not None: prior_source_ids.add(str(ex.get('FHRSID')))
          if len(ids)!=len(set(ids)) or len(parcels)!=len(set(parcels)) or len(osms)!=len(set(osms)):
              raise SystemExit('fail closed: existing duplicate id/parcel/osm')

          headers={'User-Agent':'TerraYield-AAYS-building_type_5/1.0','x-api-version':'2','Accept':'application/json'}
          req=urllib.request.Request(AUTH_URL,headers=headers)
          with urllib.request.urlopen(req,timeout=90) as r: auth_raw=r.read()
          auth_sha=hashlib.sha256(auth_raw).hexdigest()
          auth_json=json.loads(auth_raw.decode('utf-8-sig'))

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          authority_obj=None
          target_norm=re.sub(r'[^a-z0-9]+','',AUTHORITY.lower())
          for obj in walk(auth_json):
              nm=str(obj.get('Name') or obj.get('name') or '')
              if re.sub(r'[^a-z0-9]+','',nm.lower())==target_norm:
                  authority_obj=obj; break
          if not authority_obj:
              names=sorted({str(o.get('Name') or o.get('name')) for o in walk(auth_json) if o.get('Name') or o.get('name')})
              near=[n for n in names if 'lynn' in n.lower() or 'west norfolk' in n.lower()]
              raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: authority not found; near={near[:10]}')

          def pick(*keys):
              for k in keys:
                  v=authority_obj.get(k)
                  if v not in (None,''): return v
              return None
          data_url=pick('FileName','fileName','filename')
          code=pick('LocalAuthorityIdCode','localAuthorityIdCode','IdCode','idCode')
          if data_url and str(data_url).startswith('/'):
              data_url='https://ratings.food.gov.uk'+str(data_url)
          if not data_url:
              if not code: raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: authority metadata lacks FileName/code: {authority_obj}')
              data_url=f'https://ratings.food.gov.uk/OpenDataFiles/FHRS{code}en-GB.xml'
          data_url=str(data_url).replace('http://','https://')

          req=urllib.request.Request(data_url,headers={'User-Agent':'TerraYield-AAYS-building_type_5/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r: raw=r.read()
          source_sha=hashlib.sha256(raw).hexdigest()
          query_sha=hashlib.sha256((AUTH_URL+'\n'+data_url+'\n'+AUTHORITY).encode()).hexdigest()
          root=ET.fromstring(raw)

          def txt(node,path):
              el=node.find(path)
              return (el.text or '').strip() if el is not None and el.text else ''
          def classify(bt):
              s=bt.strip().lower()
              if any(k in s for k in ('retailer','supermarket','hypermarket')):
                  return ('commercial_retail','C_RETAIL','commercial')
              if any(k in s for k in ('school','college','university')):
                  return ('education','P_SCHOOL','institutional')
              if any(k in s for k in ('hospital','childcare','caring premises','care home')):
                  return ('healthcare_care','P_HEALTHCARE','institutional')
              if any(k in s for k in ('manufacturer','packer','importer','exporter','distributor','transporter')):
                  return ('commercial_operational','C_OPERATIONAL','commercial')
              if any(k in s for k in ('restaurant','cafe','canteen','pub','bar','nightclub','takeaway','sandwich','hotel','bed & breakfast','guest house','mobile caterer','other catering')):
                  return ('commercial_hospitality','C_HOSPITALITY','commercial')
              return None

          candidates=[]
          for d in root.findall('.//EstablishmentDetail'):
              rid=txt(d,'FHRSID')
              if not rid: continue
              fid=f'ENG_FHRS_{rid}'; parcel=fid
              if fid in processed or parcel in processed or rid in processed or rid in prior_source_ids: continue
              bt=txt(d,'BusinessType'); c=classify(bt)
              if not c: continue
              lat_s=txt(d,'Geocode/Latitude'); lon_s=txt(d,'Geocode/Longitude')
              try: lat=float(lat_s); lon=float(lon_s)
              except Exception: continue
              if not (49.0 <= lat <= 56.5 and -7.0 <= lon <= 3.0): continue
              name=txt(d,'BusinessName'); postcode=txt(d,'PostCode')
              addr='; '.join(x for x in [txt(d,'AddressLine1'),txt(d,'AddressLine2'),txt(d,'AddressLine3'),txt(d,'AddressLine4')] if x)
              excerpt={'FHRSID':rid,'BusinessName':name,'BusinessType':bt,'PostCode':postcode,'Address':addr,'RatingValue':txt(d,'RatingValue'),'LocalAuthorityName':txt(d,'LocalAuthorityName') or AUTHORITY}
              candidates.append((int(rid) if rid.isdigit() else 10**18, rid, lat, lon, c, excerpt))
          candidates.sort(key=lambda x:(x[0],x[1]))
          chosen=candidates[:50]
          if len(chosen)<50: raise SystemExit(f'BLOCKED_NO_NEW_SOURCE_OR_BATCH: only {len(chosen)} new classified FHRS geocoded records found')

          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          new_features=[]; records=[]; new_ids=[]
          for _,rid,lat,lon,c,excerpt in chosen:
              primary,code_bt,category=c; fid=f'ENG_FHRS_{rid}'
              method='fhrs_business_type_premises_use_proxy'; score=0.55; ev='D'; conf=2
              src={'source_name':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','url_or_local_path':data_url,'sha256':source_sha,'granularity':'food_business_establishment_geocode','fields_used':['FHRSID','BusinessType','BusinessName','PostCode','Geocode'],'supports_field':'building_type_primary','match_method':method,'match_score':score,'evidence_excerpt':excerpt}
              props={'parcel_id':fid,'slot_id':SLOT,'region':'East of England','local_authority':AUTHORITY,'area':CITY,'postcode':excerpt.get('PostCode',''),'building_type_primary':primary,'building_type_code':code_bt,'building_category':category,'confidence_score':score,'confidence_level_1_to_4':conf,'evidence_level':ev,'source_count':1,'sources':[src],'evidence_excerpt':excerpt,'source_evidence_excerpt':excerpt,'match_method':method,'source':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','source_url':data_url,'source_hash':source_sha,'query_sha256':query_sha,'fhrs_id':rid,'source_record_id':rid,'geometry_match_method':'fhrs_geocode_point','address_match_method':'fhrs_postcode_address','limitations':'FHRS BusinessType is a premises-use proxy and not cadastral parcel geometry or building-fabric evidence; confidence limited to level 2.','needs_manual_review':True,'fake_data':False,'final_ready':False,'updated_at':now}
              new_features.append({'type':'Feature','id':fid,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props})
              records.append({'id':fid,'parcel_id':fid,'fhrs_id':rid,'building_type_primary':primary,'building_type_code':code_bt,'building_category':category,'evidence_excerpt':excerpt,'evidence_level':ev,'confidence_level_1_to_4':conf,'sources':[src],'fake_data':False,'final_ready':False})
              new_ids.append(fid)

          geo['features'].extend(new_features)
          if len(geo['features'])!=TARGET_AFTER: raise SystemExit('feature_count_after invariant failed')
          ids=[]; parcels=[]; osms=[]
          for f in geo['features']:
              p=f.get('properties') or {}
              if f.get('id') is not None: ids.append(str(f.get('id')))
              if p.get('parcel_id') is not None: parcels.append(str(p.get('parcel_id')))
              if p.get('osm_id') is not None: osms.append(str(p.get('osm_id')))
          if len(ids)!=len(set(ids)) or len(parcels)!=len(set(parcels)) or len(osms)!=len(set(osms)): raise SystemExit('duplicate after append')
          geo_path.write_text(json.dumps(geo,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          geo_sha=hashlib.sha256(geo_path.read_bytes()).hexdigest()

          tdist=Counter(); edist=Counter(); cdist=Counter(); unknown=0
          for f in geo['features']:
              p=f.get('properties') or {}; typ=p.get('building_type_primary') or 'unknown'; evx=str(p.get('evidence_level') or 'U'); cl=str(p.get('confidence_level_1_to_4') or 1)
              tdist[typ]+=1; edist[evx]+=1; cdist[cl]+=1
              if typ=='unknown' or evx=='U': unknown+=1

          manifest=json.loads(manifest_path.read_text(encoding='utf-8')) if manifest_path.exists() else {}
          sources=list(manifest.get('sources') or [])
          sources.append({'name':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','url':data_url,'features_used':50,'known_type_features':50,'unknown_type_features':0,'accessed_at':now,'source_sha256':source_sha,'authority_metadata_sha256':auth_sha,'query_sha256':query_sha,'authority_metadata':authority_obj,'authority_metadata_source':AUTH_URL,'evidence_level':'D','confidence_level_1_to_4':2,'note':'FHRS BusinessType premises-use proxy; not cadastral parcel geometry or building-fabric evidence. Raw XML used runtime-only and not committed.'})
          manifest.update({'slot_id':SLOT,'region':'East of England','feature_count':TARGET_AFTER,'total_features':TARGET_AFTER,'classified_count':TARGET_AFTER-unknown,'classified':TARGET_AFTER-unknown,'unknown_count':unknown,'unknown':unknown,'type_distribution':dict(tdist),'evidence_distribution':dict(edist),'confidence_distribution':dict(cdist),'confidence_level_distribution':dict(cdist),'sources':sources,'last_batch_index':BATCH,'last_batch_city':CITY,'last_grid_id':GRID,'last_source_sha256':source_sha,'output_sha256':geo_sha,'fake_data':False,'final_ready':False,'updated_at':now,'generated_at':now})
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          runner={'slot_id':SLOT,'task_id':TASK_ID,'continuation_key':continuation_key,'batch_index':BATCH,'city':CITY,'grid_id':GRID,'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,'new_feature_count':50,'known_type_count':50,'unknown_type_count':0,'records':records,'source_name':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','source_url':data_url,'source_sha256':source_sha,'query_sha256':query_sha,'evidence_distribution':{'D':50},'confidence_distribution':{'2':50},'source_fallback_reason':'prior Overpass checkpoint recorded 3x HTTP 502; two Kings Lynn OSM API map workflows failed closed with HTTP 400; switched to established official FSA FHRS open-data source','fake_data':False,'final_ready':False,'updated_at':now}
          runner_path.write_text(json.dumps(runner,ensure_ascii=False,indent=2),encoding='utf-8')

          status=json.loads(status_path.read_text(encoding='utf-8'))
          status.update({'state':'IN_PROGRESS','status':'in_progress','updated_at':now,'owner':None,'final_ready':False,'fake_data':False,'classified_count':TARGET_AFTER-unknown,'unknown_count':unknown,'total_elements':TARGET_AFTER,'current_feature_count':TARGET_AFTER,'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,'progress_count_delta':50,'new_feature_count':50,'new_features_appended':50,'next_batch_index':BATCH+1,'next_target_feature_count':NEXT_TARGET,'confidence_distribution':dict(cdist),'evidence_distribution':dict(edist),'output_sha256':geo_sha,'candidate_batch':None,'no_progress_reason':None,'note':f'Batch {BATCH} appended 50 {CITY} FHRS premises-use records outside prior feature.id, parcel_id and osm_id values; same task retained and owner remains null.','last_batch_index':BATCH,'last_batch_city':CITY,'last_city':CITY,'last_grid_id':GRID,'last_batch_source':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','last_source':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','last_source_sha256':source_sha,'evidence_level':'D','confidence_level_1_to_4':2,'blocker':None,'progress_reason':f'50 new {CITY} FHRS geocoded premises-use features appended after feature.id/parcel_id/osm_id exclusion; OSM network fallbacks failed closed and FHRS open data provided real records'})
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')

          cp.update({'first_unverified_step':'AŞAMA_1_OSM_GENISLETME_APPEND_NEW_BATCH_THEN_OPTIONAL_EPC_VOA_HMLR_UPGRADE','first_unverified_step_status':f'BATCH_{BATCH}_APPENDED_50_KINGS_LYNN_FHRS_CONTINUATION_REQUIRED','terminal_status':'IN_PROGRESS','updated_at':now,'final_ready':False,'state':'IN_PROGRESS','feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,'current_feature_count':TARGET_AFTER,'next_batch_index':BATCH+1,'next_target_feature_count':NEXT_TARGET,'next_city_index':BATCH+1,'candidate_batch':None,'no_progress_reason':None,'next_required_action':'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL EPC/VOA/HMLR CORROBORATION FOR LOWER-CONFIDENCE FHRS RECORDS','fake_data':False,'last_processed_ids_sample':new_ids[-20:],'summary':{'osm_pilot_classified':0,'new_slot':False,'pipeline_stage':1,'progress_count_delta':50,'new_features_appended':50,'current_feature_count':TARGET_AFTER},'last_batch':{'batch_index':BATCH,'city':CITY,'grid_id':GRID,'source':f'Food Standards Agency FHRS daily open data - {AUTHORITY}','source_url':data_url,'source_sha256':source_sha,'query_sha256':query_sha,'evidence_distribution':{'D':50},'confidence_distribution':{'2':50},'known_type_count':50,'unknown_type_count':0,'added_feature_count':50,'new_feature_ids':new_ids}})
          checkpoint_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2),encoding='utf-8')

          task['updated_at']=now; task['owner']=None; task['status']='ready'; task['state']='READY'; task['final_ready']=False; task['fake_data']=False
          task['last_progress']={'batch_index':BATCH,'city':CITY,'grid_id':GRID,'feature_count_before':EXPECTED_BEFORE,'feature_count_after':TARGET_AFTER,'new_features_appended':50,'known_type_count':50,'unknown_type_count':0,'source_sha256':source_sha}
          task_path.write_text(json.dumps(task,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'before':EXPECTED_BEFORE,'after':TARGET_AFTER,'added':50,'known':50,'unknown':0,'source_url':data_url,'source_sha256':source_sha,'query_sha256':query_sha,'authority':authority_obj,'first_id':new_ids[0],'last_id':new_ids[-1]}))
          PY

      - name: Validate, commit and push slot-only outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson').read_text(encoding='utf-8'))
          assert len(g.get('features',[]))==2450
          new=g['features'][-50:]; assert len(new)==50
          assert all((f.get('properties') or {}).get('area')=="King's Lynn" for f in new)
          for f in new:
              p=f.get('properties') or {}
              assert p.get('fake_data') is False and p.get('final_ready') is False
              assert p.get('evidence_level')=='D' and p.get('confidence_level_1_to_4')==2
              assert isinstance(p.get('evidence_excerpt'),dict) and p.get('evidence_excerpt',{}).get('FHRSID')
              assert p.get('sources') and p.get('source_hash') and p.get('fhrs_id')
          ids=[str(f.get('id')) for f in g['features'] if f.get('id') is not None]
          parcels=[str((f.get('properties') or {}).get('parcel_id')) for f in g['features'] if (f.get('properties') or {}).get('parcel_id') is not None]
          osms=[str((f.get('properties') or {}).get('osm_id')) for f in g['features'] if (f.get('properties') or {}).get('osm_id') is not None]
          assert len(ids)==len(set(ids)) and len(parcels)==len(set(parcels)) and len(osms)==len(set(osms))
          r=json.loads(Path('docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json').read_text(encoding='utf-8'))
          assert r['task_id']=='building-type-5-england-classification-v1-20260808' and r['batch_index']==49 and r['city']=="King's Lynn"
          assert r['feature_count_before']==2400 and r['feature_count_after']==2450 and r['new_feature_count']==50
          assert r['evidence_distribution']=={'D':50} and r['confidence_distribution']=={'2':50}
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json').read_text(encoding='utf-8'))
          assert cp['current_feature_count']==2450 and cp['next_batch_index']==50 and cp['next_target_feature_count']==2500
          assert cp['fake_data'] is False and cp['final_ready'] is False and cp['last_batch']['city']=="King's Lynn"
          s=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json').read_text(encoding='utf-8'))
          assert s['task_id']=='building-type-5-england-classification-v1-20260808' and s['owner'] is None and s['current_feature_count']==2450
          assert s['fake_data'] is False and s['final_ready'] is False
          t=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json').read_text(encoding='utf-8'))
          assert t['task_id']=='building-type-5-england-classification-v1-20260808' and t['owner'] is None
          assert t['fake_data'] is False and t['final_ready'] is False and t['last_progress']['feature_count_after']==2450
          m=json.loads(Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json').read_text(encoding='utf-8'))
          assert m['total_features']==2450 and m['feature_count']==2450 and m['fake_data'] is False and m['final_ready'] is False
          print('validated building_type_5 Kings Lynn FHRS batch49', r['known_type_count'], r['unknown_type_count'])
          PY
          git config user.name 'aays-building-type-5-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add england_map_web/data/building_type/shards/building_type_5_latest.geojson \
                  england_map_web/data/building_type/shards/building_type_5_manifest_latest.json \
                  docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json \
                  docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json
          git diff --cached --quiet && { echo 'no slot progress to commit'; exit 1; }
          git commit -m 'Append building_type_5 Kings Lynn batch 49 via FHRS'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then exit 0; fi
            git fetch origin codex/aays-single-runner-v5-20260706
            git rebase origin/codex/aays-single-runner-v5-20260706
            sleep $((i*2))
          done
          exit 1
