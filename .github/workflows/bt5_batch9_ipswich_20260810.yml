name: building_type_5 batch 9 Ipswich

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/bt5_batch9_ipswich_20260810.yml

permissions:
  contents: write

concurrency:
  group: aays-building-type-5-batch9-ipswich
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Sync canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Append 50 new Ipswich FHRS proxy-evidence features
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections
          import datetime as dt
          import hashlib
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SLOT = 'building_type_5'
          TASK_ID = 'building-type-5-england-classification-v1-20260808'
          BATCH = 9
          EXPECTED_BEFORE = 400
          EXPECTED_AFTER = 450
          CITY = 'Ipswich'
          SOURCE_NAME = 'Food Standards Agency FHRS daily open data - Ipswich Borough'
          SOURCE_PAGE = 'https://ratings.food.gov.uk/open-data/en-GB'
          SOURCE_URLS = [
              'https://ratings.food.gov.uk/api/open-data-files/FHRS299en-GB.xml',
              'https://ratings.food.gov.uk/OpenDataFiles/FHRS299en-GB.xml',
          ]

          SHARD = Path('england_map_web/data/building_type/shards/building_type_5_latest.geojson')
          MANIFEST = Path('england_map_web/data/building_type/shards/building_type_5_manifest_latest.json')
          CHECKPOINT = Path('docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json')
          STATUS = Path('docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json')
          TASK = Path('docs/chatgpt_status/_shared/slots_21/building_type_5/current_task_latest.json')
          OUTPUT = Path('docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json')
          COMMON = Path('docs/building_type_common_continue_prompt_TR.md')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          geo = load(SHARD)
          manifest = load(MANIFEST)
          checkpoint = load(CHECKPOINT)
          status = load(STATUS)
          task = load(TASK)
          assert COMMON.exists(), 'common continuation prompt missing'

          features = geo.get('features')
          assert isinstance(features, list), 'shard.features is not a list'
          before = len(features)

          assert before == EXPECTED_BEFORE, f'GUARD shard count changed: {before}'
          assert checkpoint.get('slot_id') == SLOT, 'GUARD wrong checkpoint slot'
          assert task.get('slot_id') == SLOT, 'GUARD wrong current_task slot'
          assert task.get('task_id') == TASK_ID, 'GUARD task changed'
          assert task.get('owner') in (None, ''), 'GUARD current_task owner is live'
          assert status.get('owner') in (None, ''), 'GUARD status owner is live'
          assert int(checkpoint.get('current_feature_count', -1)) == before, 'GUARD checkpoint/shard mismatch'
          assert int(checkpoint.get('next_batch_index', -1)) == BATCH, 'GUARD next_batch_index changed'
          assert int(checkpoint.get('next_target_feature_count', -1)) == EXPECTED_AFTER, 'GUARD target changed'
          for label, obj in [('checkpoint', checkpoint), ('status', status), ('task', task), ('manifest', manifest)]:
              assert obj.get('fake_data') is False, f'GUARD {label} fake_data is not false'
              assert obj.get('final_ready') is False, f'GUARD {label} final_ready is not false'
              assert str(obj.get('state', '')).upper() != 'PUBLISHED', f'GUARD {label} published'
              assert str(obj.get('status', '')).upper() != 'PUBLISHED', f'GUARD {label} published'

          processed = set()
          def remember(value):
              if value in (None, ''):
                  return
              s = str(value).strip()
              if not s:
                  return
              processed.add(s)
              processed.add(s.lower())
          for feature in features:
              props = feature.get('properties') or {}
              remember(feature.get('id'))
              remember(props.get('parcel_id'))
              remember(props.get('osm_id'))

          req_headers = {
              'User-Agent': 'TerraYield-AAYS-building-type/1.0 (github.com/cagdascagdas100/chat_gpt_clone_1)',
              'Accept': 'application/xml,text/xml,*/*',
          }
          raw = None
          source_url = None
          last_error = None
          for candidate_url in SOURCE_URLS:
              try:
                  req = urllib.request.Request(candidate_url, headers=req_headers)
                  with urllib.request.urlopen(req, timeout=90) as response:
                      payload = response.read()
                  if payload and b'Establishment' in payload:
                      raw = payload
                      source_url = candidate_url
                      break
              except Exception as exc:
                  last_error = exc
          if raw is None:
              raise SystemExit(f'SOURCE_BLOCKED: Ipswich FHRS open-data fetch failed: {last_error}')

          source_sha = hashlib.sha256(raw).hexdigest()
          root = ET.fromstring(raw)

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def first_text(node, wanted):
              for child in node.iter():
                  if local(child.tag) == wanted:
                      text = (child.text or '').strip()
                      if text:
                          return text
              return ''

          type_map = {
              'Restaurant/Cafe/Canteen': ('commercial_hospitality', 'C_HOSPITALITY', 'commercial'),
              'Takeaway/sandwich shop': ('commercial_hospitality', 'C_TAKEAWAY', 'commercial'),
              'Pub/bar/nightclub': ('commercial_hospitality', 'C_HOSPITALITY', 'commercial'),
              'Hotel/bed & breakfast/guest house': ('hospitality', 'C_HOTEL', 'commercial'),
              'Retailers - supermarkets/hypermarkets': ('commercial_retail', 'C_RETAIL', 'commercial'),
              'Retailers - other': ('commercial_retail', 'C_RETAIL', 'commercial'),
          }

          candidates = []
          for node in root.iter():
              if local(node.tag) not in ('EstablishmentDetail', 'Establishment'):
                  continue
              fhrs_id = first_text(node, 'FHRSID')
              business_type = first_text(node, 'BusinessType')
              if not fhrs_id or business_type not in type_map:
                  continue
              try:
                  numeric_id = int(fhrs_id)
                  lat = float(first_text(node, 'Latitude'))
                  lon = float(first_text(node, 'Longitude'))
              except (TypeError, ValueError):
                  continue
              if not (-0.1 <= lon <= 1.6 and 51.8 <= lat <= 53.1):
                  continue
              fid = f'IPS_FHRS_{numeric_id}'
              if fid in processed or fid.lower() in processed:
                  continue
              candidates.append({
                  'numeric_id': numeric_id,
                  'fhrs_id': str(numeric_id),
                  'fid': fid,
                  'business_name': first_text(node, 'BusinessName'),
                  'business_type': business_type,
                  'business_type_id': first_text(node, 'BusinessTypeID'),
                  'local_authority': first_text(node, 'LocalAuthorityName'),
                  'postcode': first_text(node, 'PostCode'),
                  'lat': lat,
                  'lon': lon,
              })

          dedup = {}
          for row in candidates:
              dedup[row['fid']] = row
          selected = sorted(dedup.values(), key=lambda x: x['numeric_id'])[:50]
          if len(selected) < 50:
              raise SystemExit(f'SOURCE_BLOCKED: only {len(selected)} unique geocoded Ipswich FHRS candidates outside already_processed_ids')

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          snapshot_date = now[:10]
          new_features = []
          new_ids = []
          for row in selected:
              primary, code, category = type_map[row['business_type']]
              excerpt = (
                  f"FHRSID {row['fhrs_id']} | {row['business_name'] or '[unnamed]'} | "
                  f"BusinessType {row['business_type']} | LocalAuthority {row['local_authority'] or 'Ipswich Borough'} | "
                  f"PostCode {row['postcode'] or '[none]'} | coordinates {row['lat']:.6f},{row['lon']:.6f}"
              )
              props = {
                  'parcel_id': row['fid'],
                  'slot_id': SLOT,
                  'region': 'East of England',
                  'area': CITY,
                  'city': CITY,
                  'local_authority': row['local_authority'] or 'Ipswich Borough',
                  'postcode': row['postcode'],
                  'fhrs_id': row['fhrs_id'],
                  'business_name': row['business_name'],
                  'business_type': row['business_type'],
                  'business_type_id': row['business_type_id'],
                  'building_type_primary': primary,
                  'building_type_code': code,
                  'category': category,
                  'classification_source': 'FSA FHRS BusinessType premises-use proxy',
                  'classification_method': 'official_fhrs_business_type_proxy',
                  'source_url': source_url,
                  'source_dataset_page': SOURCE_PAGE,
                  'source_count': 1,
                  'evidence_level': 'D',
                  'evidence_score': 0.55,
                  'confidence': 0.55,
                  'confidence_score': 0.55,
                  'confidence_level_1_to_4': 2,
                  'confidence_1_4': 2,
                  'match_method': 'fhrs_business_type_premises_proxy',
                  'evidence_excerpt': excerpt,
                  'source_evidence_excerpt': excerpt,
                  'snapshot_date': snapshot_date,
                  'source_sha256': source_sha,
                  'source_hash_method': 'sha256_raw_source_xml',
                  'sources': [{
                      'source_name': SOURCE_NAME,
                      'url_or_local_path': source_url,
                      'dataset_page': SOURCE_PAGE,
                      'accessed_at': now,
                      'sha256': source_sha,
                      'sha256_scope': 'raw_source_xml',
                      'granularity': 'fhrs_geocoded_establishment_point',
                      'fields_used': ['FHRSID','BusinessName','BusinessType','BusinessTypeID','LocalAuthorityName','PostCode','Latitude','Longitude'],
                      'supports_field': 'building_type_primary',
                      'match_method': 'fhrs_business_type_premises_proxy',
                      'match_score': 0.55,
                  }],
                  'source_record': {
                      'FHRSID': row['fhrs_id'],
                      'BusinessName': row['business_name'],
                      'BusinessType': row['business_type'],
                      'BusinessTypeID': row['business_type_id'],
                      'LocalAuthorityName': row['local_authority'],
                      'PostCode': row['postcode'],
                      'Latitude': row['lat'],
                      'Longitude': row['lon'],
                  },
                  'geometry_match_method': 'fhrs_geocoded_point',
                  'limitations': 'FHRS BusinessType is premises-use proxy evidence at a geocoded establishment point; cadastral parcel binding and building fabric/type remain unverified.',
                  'needs_manual_review': True,
                  'batch_index': BATCH,
                  'fake_data': False,
                  'final_ready': False,
                  'updated_at': now,
              }
              new_features.append({
                  'type': 'Feature',
                  'id': row['fid'],
                  'geometry': {'type': 'Point', 'coordinates': [row['lon'], row['lat']]},
                  'properties': props,
              })
              new_ids.append(row['fid'])

          assert len(new_features) == 50 and len(set(new_ids)) == 50
          assert not ({x.lower() for x in new_ids} & processed), 'ID collision with already_processed_ids'
          geo['features'] = features + new_features
          after = len(geo['features'])
          assert after == EXPECTED_AFTER and after > before, f'COUNT_GUARD before={before} after={after}'

          history = geo.get('batch_history')
          if isinstance(history, list):
              history.append({
                  'batch_index': BATCH,
                  'city': CITY,
                  'feature_count_before': before,
                  'feature_count_after': after,
                  'new_feature_count': 50,
                  'source': SOURCE_NAME,
                  'source_url': source_url,
                  'source_sha256': source_sha,
                  'evidence_level': 'D',
                  'confidence_level_1_to_4': 2,
                  'raw_source_committed': False,
                  'fake_data': False,
                  'final_ready': False,
                  'updated_at': now,
              })
          if isinstance(geo.get('metadata'), dict):
              geo['metadata'].update({
                  'feature_count_before': before,
                  'feature_count_after': after,
                  'current_feature_count': after,
                  'last_batch_index': BATCH,
                  'updated_at': now,
                  'fake_data': False,
                  'final_ready': False,
              })

          SHARD.write_text(json.dumps(geo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          output_sha = hashlib.sha256(SHARD.read_bytes()).hexdigest()

          props_all = [(f.get('properties') or {}) for f in geo['features']]
          type_counts = collections.Counter(str(p.get('building_type_primary') or 'unknown') for p in props_all)
          evidence_counts = collections.Counter(str(p.get('evidence_level') or 'U') for p in props_all)
          confidence_counts = collections.Counter(str(p.get('confidence_level_1_to_4') or p.get('confidence_1_4') or 1) for p in props_all)
          unknown = type_counts.get('unknown', 0)
          classified = after - unknown

          sources = list(manifest.get('sources') or [])
          sources = [s for s in sources if s.get('name') != SOURCE_NAME]
          sources.append({
              'name': SOURCE_NAME,
              'url': source_url,
              'dataset_page': SOURCE_PAGE,
              'features_used': 50,
              'accessed_at': now,
              'source_sha256': source_sha,
              'source_hash_method': 'sha256_raw_source_xml',
              'evidence_level': 'D',
              'confidence_level_1_to_4': 2,
              'raw_source_committed': False,
              'note': 'FHRS BusinessType premises-use proxy; not cadastral parcel geometry or building-fabric evidence.',
          })
          manifest.update({
              'generated_at': now,
              'total_features': after,
              'classified': classified,
              'unknown': unknown,
              'evidence_distribution': {k: evidence_counts.get(k, 0) for k in ['A','B','C','D','U']},
              'type_distribution': dict(sorted(type_counts.items())),
              'confidence_level_distribution': {k: confidence_counts.get(k, 0) for k in ['1','2','3','4']},
              'sources': sources,
              'fake_data': False,
              'final_ready': False,
              'note': 'Existing 400-feature shard preserved; appended 50 Ipswich FHRS records outside all prior feature.id, parcel_id and osm_id values.',
              'feature_count': after,
              'geojson_sha256': output_sha,
              'geojson_path': str(SHARD),
              'manifest_updated_at': now,
              'feature_count_before': before,
              'feature_count_after': after,
              'added_feature_count': 50,
              'last_batch_index': BATCH,
              'last_batch_city': CITY,
              'last_batch_source': SOURCE_NAME,
              'last_batch_source_sha256': source_sha,
          })
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          last_batch = {
              'batch_index': BATCH,
              'city': CITY,
              'source': SOURCE_NAME,
              'source_url': source_url,
              'source_sha256': source_sha,
              'evidence_level': 'D',
              'confidence_level_1_to_4': 2,
              'added_feature_count': 50,
              'new_feature_ids': new_ids,
              'raw_source_committed': False,
          }
          for obj in (checkpoint, status):
              obj['state'] = 'IN_PROGRESS'
              if 'terminal_status' in obj:
                  obj['terminal_status'] = 'IN_PROGRESS'
              obj['feature_count_before'] = before
              obj['feature_count_after'] = after
              obj['current_feature_count'] = after
              obj['next_batch_index'] = BATCH + 1
              obj['next_target_feature_count'] = after + 50
              obj['last_processed_ids_sample'] = new_ids[-20:]
              obj['last_batch'] = last_batch
              obj['next_required_action'] = 'APPEND_ONLY_NEW_BATCH_DO_NOT_REPROCESS_EXISTING_FEATURES; OPTIONAL OSM/EPC/VOA/HMLR CORROBORATION FOR FHRS PROXY RECORDS'
              obj['no_progress_reason'] = None
              obj['updated_at'] = now
              obj['fake_data'] = False
              obj['final_ready'] = False
              if isinstance(obj.get('summary'), dict):
                  obj['summary']['progress_count_delta'] = 50
                  obj['summary']['new_features_appended'] = 50
                  obj['summary']['current_feature_count'] = after
              if isinstance(obj.get('progress'), dict):
                  obj['progress']['completed_count'] = after
          checkpoint['first_unverified_step_status'] = 'BATCH_9_APPENDED_50_IPSWICH_FHRS_CONTINUATION_REQUIRED'
          CHECKPOINT.write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          STATUS.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          output = {
              'schema_version': 1,
              'slot_id': SLOT,
              'task_id': TASK_ID,
              'state': 'IN_PROGRESS',
              'batch_index': BATCH,
              'city': CITY,
              'source': SOURCE_NAME,
              'source_url': source_url,
              'source_sha256': source_sha,
              'feature_count_before': before,
              'feature_count_after': after,
              'new_feature_count': 50,
              'new_feature_ids': new_ids,
              'evidence_level': 'D',
              'confidence_level_1_to_4': 2,
              'classification_basis': 'FSA FHRS BusinessType premises-use proxy',
              'limitations': 'Proxy-use classification at geocoded establishment points; cadastral parcel and building fabric remain unverified.',
              'already_processed_policy': ['feature.id','properties.parcel_id','properties.osm_id'],
              'raw_source_committed': False,
              'fake_data': False,
              'final_ready': False,
              'updated_at': now,
          }
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Final local guards: no new feature may claim publication/fake data and count must grow.
          reread = load(SHARD)
          assert len(reread['features']) == EXPECTED_AFTER
          for f in reread['features'][-50:]:
              p = f.get('properties') or {}
              assert p.get('fake_data') is False
              assert p.get('final_ready') is False
              assert p.get('evidence_excerpt')
              assert p.get('evidence_level') == 'D'
              assert int(p.get('confidence_level_1_to_4')) == 2
          print(json.dumps({'before': before, 'after': after, 'new': 50, 'first': new_ids[0], 'last': new_ids[-1], 'source_sha256': source_sha}))
          PY

      - name: Commit guarded result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aays-building-type-bot'
          git config user.email 'aays-building-type-bot@users.noreply.github.com'
          git rm .github/workflows/bt5_batch9_ipswich_20260810.yml
          git add \
            england_map_web/data/building_type/shards/building_type_5_latest.geojson \
            england_map_web/data/building_type/shards/building_type_5_manifest_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/checkpoint_latest.json \
            docs/chatgpt_status/_shared/slots_21/building_type_5/status_latest.json \
            docs/chatgpt_status/building_type/slots/building_type_5/runner_outputs/building_type_5_classification_latest.json
          echo 'Staged files:'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m 'data(building_type_5): append Ipswich batch 9'
          git push origin HEAD:codex/aays-single-runner-v5-20260706
