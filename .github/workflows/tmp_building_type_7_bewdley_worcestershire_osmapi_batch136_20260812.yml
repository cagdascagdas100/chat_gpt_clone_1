name: tmp building_type_7 Bewdley Worcestershire OSM API batch 136

on:
  push:
    branches: [codex/aays-single-runner-v5-20260706]
    paths: [.github/workflows/tmp_building_type_7_bewdley_worcestershire_osmapi_batch136_20260812.yml]

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Prepare current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aays-building-type-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706
          python3 - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json').read_text())
          st=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json').read_text())
          task=json.loads(Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json').read_text())
          assert cp['current_feature_count']==6750 and cp['next_batch_index']==136 and cp['next_target_feature_count']==6800, cp
          assert st['current_feature_count']==6750 and st['next_batch_index']==136 and st['next_target_feature_count']==6800, st
          assert task['task_id']=='building-type-7-england-classification-v1-20260808' and task.get('owner') in (None,''), task
          assert cp.get('fake_data') is False and cp.get('final_ready') is False
          assert st.get('fake_data') is False and st.get('final_ready') is False
          PY

      - name: Append exactly 50 unseen Bewdley OSM API records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re,json,subprocess
          src=subprocess.check_output(['git','show','306b1032bab74c2d85055573dedf79b4204a94f1:.github/workflows/tmp_building_type_7_worcester_osmapi_batch107_20260811.yml'],text=True)
          anchor=src.index('- name: Append exactly 50 unseen Worcester OSM API records'); marker="          python3 <<'PY'\n"; start=src.index(marker,anchor)+len(marker); end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          for old,new in [("CITY='Worcester'","CITY='Bewdley'"),("AUTH='Worcestershire'","AUTH='Worcestershire'"),('BATCH=107','BATCH=136'),('BEFORE=5300','BEFORE=6750'),('AFTER=5350','AFTER=6800'),('NEXT_BATCH=108','NEXT_BATCH=137'),('NEXT_TARGET=5400','NEXT_TARGET=6850'),('NEXT_CITY_INDEX=18','NEXT_CITY_INDEX=47'),("GRID='52.185,-2.250,52.215,-2.190'","GRID='52.360,-2.350,52.405,-2.290'")]:
            assert old in code,old; code=code.replace(old,new)
          boxes="BBOXES=[(-2.3500,52.3600,-2.3300,52.3750),(-2.3300,52.3600,-2.3100,52.3750),(-2.3100,52.3600,-2.2900,52.3750),(-2.3500,52.3750,-2.3300,52.3900),(-2.3300,52.3750,-2.3100,52.3900),(-2.3100,52.3750,-2.2900,52.3900),(-2.3500,52.3900,-2.3300,52.4050),(-2.3300,52.3900,-2.3100,52.4050),(-2.3100,52.3900,-2.2900,52.4050)]"
          code,n=re.subn(r'BBOXES=\[\n.*?\n          \]',boxes,code,count=1,flags=re.S)
          if n!=1: code,n=re.subn(r'BBOXES=\[\n.*?\n\]',boxes,code,count=1,flags=re.S)
          assert n==1
          exec(compile(code,'building_type_7_bewdley_batch136.py','exec'),{})
          for p in [Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'),Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')]:
            o=json.loads(p.read_text()); o.update({'remote_readback_verified':False,'remote_data_commit':None,'remote_head':None,'fake_data':False,'final_ready':False}); p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          PY
          git checkout -- docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json

      - name: Validate append and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          L=lambda p:json.loads(Path(p).read_text())
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson'); man=L('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json'); cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'); st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json'); run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json'); task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(geo['features'])==6800 and man.get('total_features',man.get('feature_count'))==6800
          assert cp['current_feature_count']==6800 and cp['next_batch_index']==137 and cp['next_target_feature_count']==6850
          assert st['current_feature_count']==6800 and st['next_batch_index']==137 and st['next_target_feature_count']==6850
          assert run['batch_index']==136 and run['feature_count_before']==6750 and run['feature_count_after']==6800 and run.get('progress_counted') is True
          ids=set(run.get('new_feature_ids') or run.get('selected_feature_ids') or []); assert len(ids)==50
          batch=[f for f in geo['features'] if f.get('id') in ids]; assert len(batch)==50
          old=geo['features'][:6750]; processed=set()
          for f in old:
            p=f.get('properties') or {}
            for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id')):
              if v is not None: processed.add(str(v))
          for key,vals in {'feature.id':[str(f['id']) for f in geo['features']],'feature_id':[str((f.get('properties') or {}).get('feature_id')) for f in geo['features'] if (f.get('properties') or {}).get('feature_id')],'parcel_id':[str((f.get('properties') or {}).get('parcel_id')) for f in geo['features'] if (f.get('properties') or {}).get('parcel_id')],'osm_id':[str((f.get('properties') or {}).get('osm_id')) for f in geo['features'] if (f.get('properties') or {}).get('osm_id')]}.items(): assert len(vals)==len(set(vals)),key
          for f in batch:
            p=f['properties']; assert p['area']=='Bewdley' and p['local_authority']=='Worcestershire'; assert p['evidence_level'] in ('B','C') and p['confidence_level_1_to_4'] in (2,3); assert p.get('evidence_excerpt') and p.get('source_hash') and p.get('match_method') and p.get('sources') and p['sources'][0].get('evidence_excerpt'); assert p['fake_data'] is False and p['final_ready'] is False
            for v in (f.get('id'),p.get('feature_id'),p.get('parcel_id'),p.get('osm_id')):
              if v is not None: assert str(v) not in processed
          assert run.get('already_processed_ids_policy_applied') is True and run.get('raw_source_stored_in_git',False) is False
          assert task.get('owner') in (None,'') and task.get('fake_data') is False and task.get('final_ready') is False
          print('VALIDATED Bewdley batch136 6750->6800 +50')
          PY
          git diff --exit-code -- docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json

      - name: Commit and push only building_type_7 outputs
        shell: bash
        run: |
          set -euo pipefail
          paths=(england_map_web/data/building_type/shards/building_type_7_latest.geojson england_map_web/data/building_type/shards/building_type_7_manifest_latest.json docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json)
          git add -- "${paths[@]}"; test -n "$(git diff --cached --name-only)"
          git commit -m "data(building_type_7): append Bewdley Worcestershire OSM API batch 136 6750->6800"
          echo "DATA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for a in 1 2 3 4 5; do git fetch origin codex/aays-single-runner-v5-20260706; git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }; git push origin HEAD:codex/aays-single-runner-v5-20260706 && break; [[ $a -lt 5 ]] || exit 1; sleep $((a*2)); done

      - name: Remote data readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess
          R='origin/codex/aays-single-runner-v5-20260706'; L=lambda p:json.loads(subprocess.check_output(['git','show',f'{R}:{p}']))
          geo=L('england_map_web/data/building_type/shards/building_type_7_latest.geojson'); cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'); run=L('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          assert len(geo['features'])==6800 and cp['current_feature_count']==6800 and run['batch_index']==136 and run['feature_count_before']==6750 and run['feature_count_after']==6800
          print('REMOTE_DATA_READBACK_OK Bewdley')
          PY

      - name: Record and verify remote metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); head=os.environ['DATA_COMMIT']; cp_p=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'); st_p=Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json'); cp=json.loads(cp_p.read_text()); st=json.loads(st_p.read_text())
          cp.update({'remote_head':head,'remote_data_commit':head,'remote_readback_verified':True,'updated_at':now,'first_unverified_step_status':'BATCH_136_REMOTE_READBACK_VERIFIED_CONTINUATION_REQUIRED','fake_data':False,'final_ready':False}); cp['summary']['note']='PROGRESS: feature_count 6750 -> 6800. Batch 136 Bewdley OSM API remote readback verified; continue at batch 137. final_ready remains false.'; cp['remaining_items']['note']='Next batch 137: treat all 6800 canonical feature.id/feature_id/parcel_id/osm_id values as already_processed_ids and append at least 50 genuinely new West Midlands records; do not replay prior batches.'
          st.update({'remote_head':head,'remote_data_commit':head,'remote_readback_verified':True,'updated_at':now,'fake_data':False,'final_ready':False,'note':'Batch 136 Bewdley OSM API: 50 unique evidence-backed features appended; total 6800. Remote readback verified. Continue batch 137.'})
          cp_p.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n'); st_p.write_text(json.dumps(st,ensure_ascii=False,indent=2)+'\n')
          PY
          git add docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json; git commit -m "building_type_7: record Bewdley batch 136 remote readback"
          for a in 1 2 3 4 5; do git fetch origin codex/aays-single-runner-v5-20260706; git merge --no-edit origin/codex/aays-single-runner-v5-20260706 || { git merge --abort || true; exit 1; }; git push origin HEAD:codex/aays-single-runner-v5-20260706 && break; [[ $a -lt 5 ]] || exit 1; sleep $((a*2)); done
          git fetch origin codex/aays-single-runner-v5-20260706
          python3 <<'PY'
          import json,subprocess,os
          R='origin/codex/aays-single-runner-v5-20260706'; L=lambda p:json.loads(subprocess.check_output(['git','show',f'{R}:{p}']))
          cp=L('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json'); st=L('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json'); task=L('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json'); head=os.environ['DATA_COMMIT']
          assert cp['current_feature_count']==6800 and cp['next_batch_index']==137 and cp['next_target_feature_count']==6850 and st['current_feature_count']==6800 and st['next_batch_index']==137 and st['next_target_feature_count']==6850
          assert cp['remote_readback_verified'] is True and st['remote_readback_verified'] is True and cp['remote_data_commit']==head and st['remote_data_commit']==head
          assert cp['final_ready'] is False and st['final_ready'] is False and cp['fake_data'] is False and st['fake_data'] is False and task.get('owner') in (None,'')
          print('FINAL_REMOTE_METADATA_READBACK_OK Bewdley batch136 6750->6800')
          PY
