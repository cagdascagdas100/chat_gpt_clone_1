name: AAYS1 Security Queue Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/chatgpt_status/aays1/queue/**'
      - 'docs/chatgpt_status/security_public_safety/automation/**'
      - '.github/workflows/aays1-security-queue-runner.yml'

permissions:
  contents: write

concurrency:
  group: aays1-security-queue-runner
  cancel-in-progress: false

jobs:
  run-pending-security-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        shell: pwsh
        run: |
          git config user.name "aays1-security-runner"
          git config user.email "aays1-security-runner@users.noreply.github.com"

      - name: Run SPS5 task
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $RepoRoot = (Get-Location).Path
          $env:AAYS_REPO_ROOT = $RepoRoot
          $env:AAYS_BRIDGE_ROOT = $RepoRoot
          $QueueFile = Join-Path $RepoRoot 'docs/chatgpt_status/aays1/queue/0000_000_security_public_safety_5_local_spatial_join_v1_20260928.task.json'
          $q = Get-Content -LiteralPath $QueueFile -Raw | ConvertFrom-Json
          if ([string]$q.status -ne 'pending' -or [string]$q.task_id -ne 'security-public-safety-5-local-spatial-join-v1-20260928') { exit 0 }
          $q.status='running'
          $q | Add-Member -NotePropertyName picked_at -NotePropertyValue (Get-Date).ToString('o') -Force
          $q | Add-Member -NotePropertyName runner_status -NotePropertyValue 'GITHUB_ACTIONS_RUNNING' -Force
          $q | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $QueueFile -Encoding UTF8
          & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $RepoRoot 'docs/chatgpt_status/security_public_safety/automation/security_public_safety_5_local_spatial_join_v1.ps1')
          $code=$LASTEXITCODE
          if ($null -eq $code) { $code=1 }
          $q2 = Get-Content -LiteralPath $QueueFile -Raw | ConvertFrom-Json
          $q2.status = $(if ($code -eq 0) { 'done' } else { 'blocked' })
          $q2 | Add-Member -NotePropertyName completed_at -NotePropertyValue (Get-Date).ToString('o') -Force
          $q2 | Add-Member -NotePropertyName runner_status -NotePropertyValue $(if ($code -eq 0) { 'GITHUB_ACTIONS_DONE' } else { 'GITHUB_ACTIONS_BLOCKED' }) -Force
          $q2 | Add-Member -NotePropertyName automation_exit_code -NotePropertyValue $code -Force
          $q2 | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $QueueFile -Encoding UTF8
          if ($code -ne 0) { Write-Error "Automation failed with exit code $code" }

      - name: Commit SPS5 output
        if: always()
        shell: pwsh
        run: |
          git add docs/chatgpt_status/aays1/queue/0000_000_security_public_safety_5_local_spatial_join_v1_20260928.task.json
          if (Test-Path 'docs/chatgpt_status/security_public_safety/runner_outputs/security_public_safety_5_local_spatial_join_latest.json') {
            git add docs/chatgpt_status/security_public_safety/runner_outputs/security_public_safety_5_local_spatial_join_latest.json
          }
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "Run SPS5 Planning Data geometry-entity window"
            git pull --rebase origin main
            git push origin main
          }
