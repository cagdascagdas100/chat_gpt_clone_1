name: AAYS1 Security Queue Runner
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/chatgpt_status/aays1/queue/**'
      - 'docs/chatgpt_status/security_public_safety/automation/**'
      - '.github/workflows/aays1-security-queue-runner.yml'
permissions:
  contents: write
concurrency:
  group: aays1-security-queue-runner
  cancel-in-progress: false
jobs:
  run-pending-security-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        shell: pwsh
        run: |
          git config user.name "aays1-security-runner"
          git config user.email "aays1-security-runner@users.noreply.github.com"
      - name: Run SPS5 task
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $RepoRoot=(Get-Location).Path
          $env:AAYS_REPO_ROOT=$RepoRoot
          $qf=Join-Path $RepoRoot 'docs/chatgpt_status/aays1/queue/0000_000_security_public_safety_5_local_spatial_join_v1_20260928.task.json'
          $q=Get-Content -LiteralPath $qf -Raw | ConvertFrom-Json
          if ([string]$q.status -ne 'pending') { exit 0 }
          $script=Join-Path $RepoRoot (($q.automation_script -replace '/', [IO.Path]::DirectorySeparatorChar))
          $q.status='running'; $q | Add-Member picked_at (Get-Date).ToString('o') -Force; $q | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $qf -Encoding utf8
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $script
          $code=$LASTEXITCODE; if ($null -eq $code) {$code=1}
          $q=Get-Content -LiteralPath $qf -Raw | ConvertFrom-Json
          $q.status=$(if($code -eq 0){'done'}else{'blocked'}); $q | Add-Member completed_at (Get-Date).ToString('o') -Force; $q | Add-Member automation_exit_code $code -Force; $q | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $qf -Encoding utf8
      - name: Commit SPS5 readback
        if: always()
        shell: pwsh
        run: |
          git add docs/chatgpt_status/aays1/queue/0000_000_security_public_safety_5_local_spatial_join_v1_20260928.task.json
          git add docs/chatgpt_status/security_public_safety/runner_outputs/security_public_safety_5_local_spatial_join_latest.json
          if (git status --porcelain) {
            git commit -m "Run SPS5 exact-reference semantic precheck"
            git pull --rebase origin main
            git push origin main
          }
