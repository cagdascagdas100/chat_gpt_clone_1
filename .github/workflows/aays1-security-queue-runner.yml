name: AAYS1 Security Queue Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/chatgpt_status/aays1/queue/**'
      - 'docs/chatgpt_status/security_public_safety/automation/**'
      - '.github/workflows/aays1-security-queue-runner.yml'

permissions:
  contents: write

concurrency:
  group: aays1-security-queue-runner
  cancel-in-progress: false

jobs:
  run-pending-security-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        shell: pwsh
        run: |
          git config user.name "aays1-security-runner"
          git config user.email "aays1-security-runner@users.noreply.github.com"

      - name: Run pending AAYS1 Security queue task
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $RepoRoot = (Get-Location).Path
          $env:AAYS_REPO_ROOT = $RepoRoot
          $env:AAYS_BRIDGE_ROOT = $RepoRoot
          $QueueDir = Join-Path $RepoRoot 'docs/chatgpt_status/aays1/queue'
          $StatusDir = Join-Path $RepoRoot 'docs/chatgpt_status/aays1/status'
          $ReportDir = Join-Path $RepoRoot 'docs/chatgpt_status/aays1/reports'
          New-Item -ItemType Directory -Force -Path $StatusDir,$ReportDir | Out-Null
          $pending = Get-ChildItem -LiteralPath $QueueDir -Filter '*.json' |
            Sort-Object Name |
            ForEach-Object {
              try {
                $q = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
                [pscustomobject]@{ File=$_.FullName; Queue=$q; Status=[string]$q.status; Name=$_.Name }
              } catch { $null }
            } |
            Where-Object { $_ -and $_.Status -eq 'pending' -and $_.Queue.task_id -eq 'security-public-safety-5-local-spatial-join-v1-20260928' } |
            Select-Object -First 1
          if (-not $pending) { exit 0 }
          $queueFile = $pending.File
          $queue = $pending.Queue
          $scriptFile = Join-Path $RepoRoot (($queue.automation_script -replace '/', [IO.Path]::DirectorySeparatorChar))
          if (-not (Test-Path -LiteralPath $scriptFile)) { throw "Automation script not found: $scriptFile" }
          $queue.status = 'running'
          $queue | Add-Member -NotePropertyName picked_at -NotePropertyValue (Get-Date).ToString('o') -Force
          $queue | Add-Member -NotePropertyName runner_status -NotePropertyValue 'GITHUB_ACTIONS_RUNNING' -Force
          $queue | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $queueFile -Encoding UTF8
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $scriptFile
          $exitCode = $LASTEXITCODE
          if ($null -eq $exitCode) { $exitCode = 1 }
          $q2 = Get-Content -LiteralPath $queueFile -Raw | ConvertFrom-Json
          $q2.status = $(if ($exitCode -eq 0) { 'done' } else { 'blocked' })
          $q2 | Add-Member -NotePropertyName completed_at -NotePropertyValue (Get-Date).ToString('o') -Force
          $q2 | Add-Member -NotePropertyName runner_status -NotePropertyValue $(if ($exitCode -eq 0) { 'GITHUB_ACTIONS_DONE' } else { 'GITHUB_ACTIONS_BLOCKED' }) -Force
          $q2 | Add-Member -NotePropertyName automation_exit_code -NotePropertyValue $exitCode -Force
          $q2 | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $queueFile -Encoding UTF8

      - name: Commit SPS5 outputs
        if: always()
        shell: pwsh
        run: |
          git add docs/chatgpt_status/aays1/queue/0000_000_security_public_safety_5_local_spatial_join_v1_20260928.task.json
          if (Test-Path 'docs/chatgpt_status/security_public_safety/runner_outputs/security_public_safety_5_local_spatial_join_latest.json') {
            git add docs/chatgpt_status/security_public_safety/runner_outputs/security_public_safety_5_local_spatial_join_latest.json
          }
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "Run SPS5 neighbourhood-boundary local join"
            git pull --rebase origin main
            git push origin main
          }
