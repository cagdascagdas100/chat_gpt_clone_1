name: AAYS building_type_3 batch94 Great Missenden once
on:
  push:
    paths:
      - '.github/workflows/aays-bt3-batch94-great-missenden-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-3-batch94-great-missenden
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 50
          clean: false
      - name: Sync branch without reset clean or force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706
      - name: Batch 94 classify and append exactly 50 attempts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, textwrap
          base_path='.github/workflows/aays-bt3-batch90-henley-on-thames-retry1.yml'
          text=open(base_path,encoding='utf-8').read()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",text,re.S)
          if not m:
              raise SystemExit('BASE_RUNNER_BLOCK_NOT_FOUND')
          src=textwrap.dedent(m.group(1))
          old_tiles="tiles=[(-0.9300,51.5200,-0.9200,51.5300),(-0.9200,51.5200,-0.9100,51.5300),(-0.9100,51.5200,-0.9000,51.5300),(-0.9000,51.5200,-0.8900,51.5300),(-0.8900,51.5200,-0.8800,51.5300),(-0.9300,51.5300,-0.9200,51.5400),(-0.9200,51.5300,-0.9100,51.5400),(-0.9100,51.5300,-0.9000,51.5400),(-0.9000,51.5300,-0.8900,51.5400),(-0.8900,51.5300,-0.8800,51.5400),(-0.9300,51.5400,-0.9200,51.5500),(-0.9200,51.5400,-0.9100,51.5500),(-0.9100,51.5400,-0.9000,51.5500),(-0.9000,51.5400,-0.8900,51.5500),(-0.8900,51.5400,-0.8800,51.5500),(-0.9300,51.5500,-0.9200,51.5600),(-0.9200,51.5500,-0.9100,51.5600),(-0.9100,51.5500,-0.9000,51.5600),(-0.9000,51.5500,-0.8900,51.5600),(-0.8900,51.5500,-0.8800,51.5600)]"
          new_tiles="tiles=[(-0.7500,51.6800,-0.7400,51.6900),(-0.7400,51.6800,-0.7300,51.6900),(-0.7300,51.6800,-0.7200,51.6900),(-0.7200,51.6800,-0.7100,51.6900),(-0.7100,51.6800,-0.7000,51.6900),(-0.7000,51.6800,-0.6900,51.6900),(-0.6900,51.6800,-0.6800,51.6900),(-0.6800,51.6800,-0.6700,51.6900),(-0.6700,51.6800,-0.6600,51.6900),(-0.7500,51.6900,-0.7400,51.7000),(-0.7400,51.6900,-0.7300,51.7000),(-0.7300,51.6900,-0.7200,51.7000),(-0.7200,51.6900,-0.7100,51.7000),(-0.7100,51.6900,-0.7000,51.7000),(-0.7000,51.6900,-0.6900,51.7000),(-0.6900,51.6900,-0.6800,51.7000),(-0.6800,51.6900,-0.6700,51.7000),(-0.6700,51.6900,-0.6600,51.7000),(-0.7500,51.7000,-0.7400,51.7100),(-0.7400,51.7000,-0.7300,51.7100),(-0.7300,51.7000,-0.7200,51.7100),(-0.7200,51.7000,-0.7100,51.7100),(-0.7100,51.7000,-0.7000,51.7100),(-0.7000,51.7000,-0.6900,51.7100),(-0.6900,51.7000,-0.6800,51.7100),(-0.6800,51.7000,-0.6700,51.7100),(-0.6700,51.7000,-0.6600,51.7100),(-0.7500,51.7100,-0.7400,51.7200),(-0.7400,51.7100,-0.7300,51.7200),(-0.7300,51.7100,-0.7200,51.7200),(-0.7200,51.7100,-0.7100,51.7200),(-0.7100,51.7100,-0.7000,51.7200),(-0.7000,51.7100,-0.6900,51.7200),(-0.6900,51.7100,-0.6800,51.7200),(-0.6800,51.7100,-0.6700,51.7200),(-0.6700,51.7100,-0.6600,51.7200),(-0.7500,51.7200,-0.7400,51.7300),(-0.7400,51.7200,-0.7300,51.7300),(-0.7300,51.7200,-0.7200,51.7300),(-0.7200,51.7200,-0.7100,51.7300),(-0.7100,51.7200,-0.7000,51.7300),(-0.7000,51.7200,-0.6900,51.7300),(-0.6900,51.7200,-0.6800,51.7300),(-0.6800,51.7200,-0.6700,51.7300),(-0.6700,51.7200,-0.6600,51.7300)]"
          replacements={
              "BATCH=90; CITY='Henley-on-Thames'; GRID='uk-grid-henley-on-thames-central-001'; REGION='South East'; LOCAL_AUTHORITY='Oxfordshire'; TARGET=50; EXPECTED_BEFORE=9200":"BATCH=94; CITY='Great Missenden'; GRID='uk-grid-great-missenden-central-001'; REGION='South East'; LOCAL_AUTHORITY='Buckinghamshire'; TARGET=50; EXPECTED_BEFORE=9400",
