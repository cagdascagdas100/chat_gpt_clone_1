name: tmp building_type_7 Bromsgrove batch 17

on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - .github/workflows/tmp_building_type_7_bromsgrove_20260810.yml

permissions:
  contents: write

concurrency:
  group: building-type-7-continuation
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Rebase to current canonical head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --ff-only origin codex/aays-single-runner-v5-20260706

      - name: Fetch Bromsgrove FHRS source to runtime cache only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 \
            --output /tmp/bromsgrove_fhrs.xml \
            https://ratings.food.gov.uk/api/open-data-files/FHRS145en-GB.xml
          test -s /tmp/bromsgrove_fhrs.xml

      - name: Append exactly 50 new Bromsgrove proxy features
        shell: bash
        run: |
          set -euo pipefail
          git show 8621d29652a7387561bc123e4792aaeb14c4c366:.github/workflows/tmp_building_type_7_worcester_20260810.yml > /tmp/worcester_template.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/worcester_template.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          replacements = [
              ('CITY = "Worcester City"', 'CITY = "Bromsgrove"'),
              ('PREFIX = "WORC"', 'PREFIX = "BROM"'),
              ('SOURCE = "Food Standards Agency FHRS daily open data - Worcester City"', 'SOURCE = "Food Standards Agency FHRS daily open data - Bromsgrove"'),
              ('FHRS151en-GB.xml', 'FHRS145en-GB.xml'),
              ('EXPECTED_BEFORE = 750', 'EXPECTED_BEFORE = 800'),
              ('EXPECTED_BATCH = 16', 'EXPECTED_BATCH = 17'),
              ('EXPECTED_TARGET = 800', 'EXPECTED_TARGET = 850'),
              ('/tmp/worcester_fhrs.xml', '/tmp/bromsgrove_fhrs.xml'),
              ('WORCESTER_CITY', 'BROMSGROVE'),
              ('Worcester City', 'Bromsgrove'),
              ('Worcester', 'Bromsgrove'),
          ]
          for old, new in replacements:
              if old in body:
                  body = body.replace(old, new)

          required = [
              'CITY = "Bromsgrove"',
              'PREFIX = "BROM"',
              'FHRS145en-GB.xml',
              'EXPECTED_BEFORE = 800',
              'EXPECTED_BATCH = 17',
              'EXPECTED_TARGET = 850',
              '/tmp/bromsgrove_fhrs.xml',
              'for value in (f.get("id"), p.get("feature_id"), p.get("parcel_id"), p.get("osm_id")):',
              'evidence_level',
              'evidence_excerpt',
              'confidence_level_1_to_4',
          ]
          missing = [token for token in required if token not in body]
          assert not missing, f"patched template missing required tokens: {missing}"
          assert 'Worcester' not in body
          assert 'FHRS151en-GB.xml' not in body
          exec(compile(body, '<bromsgrove_append>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate guarded append
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          shard_path = Path('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          manifest_path = Path('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          runner_path = Path('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          status_path = Path('docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json')
          checkpoint_path = Path('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          task_path = Path('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')

          shard = json.loads(shard_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          runner = json.loads(runner_path.read_text(encoding='utf-8'))
          status = json.loads(status_path.read_text(encoding='utf-8'))
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          task = json.loads(task_path.read_text(encoding='utf-8'))

          assert len(shard['features']) == 850
          assert manifest['feature_count_before'] == 800 and manifest['feature_count_after'] == 850 and manifest['added_feature_count'] == 50
          assert checkpoint['feature_count_before'] == 800 and checkpoint['feature_count_after'] == 850 and checkpoint['current_feature_count'] == 850
          assert checkpoint['next_batch_index'] == 18 and checkpoint['next_target_feature_count'] == 900
          assert runner['feature_count_before'] == 800 and runner['feature_count_after'] == 850 and runner['added_feature_count'] == 50
          assert status['feature_count_before'] == 800 and status['feature_count_after'] == 850 and status['current_feature_count'] == 850
          assert task['owner'] is None and task['fake_data'] is False and task['final_ready'] is False
          assert manifest['fake_data'] is False and manifest['final_ready'] is False
          assert checkpoint['fake_data'] is False and checkpoint['final_ready'] is False
          assert runner['city'] == 'Bromsgrove'
          assert runner['source_url'] == 'https://ratings.food.gov.uk/api/open-data-files/FHRS145en-GB.xml'

          batch = [f for f in shard['features'] if str(f.get('id') or '').startswith('BROM_FHRS_')]
          assert len(batch) == 50, len(batch)
          ids = [f['id'] for f in batch]
          parcels = [(f.get('properties') or {}).get('parcel_id') for f in batch]
          assert len(ids) == len(set(ids)) == 50
          assert len(parcels) == len(set(parcels)) == 50
          for f in batch:
              p = f.get('properties') or {}
              assert p.get('evidence_excerpt')
              assert p.get('evidence_level') == 'D'
              assert p.get('confidence_level_1_to_4') == 2
              assert p.get('fake_data') is False
              assert p.get('final_ready') is False
              assert p.get('source_url') == 'https://ratings.food.gov.uk/api/open-data-files/FHRS145en-GB.xml'
          print('validated Bromsgrove 800->850; 50 new D/confidence-2 features')
          PY

      - name: Commit and push only slot outputs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            england_map_web/data/building_type/shards/building_type_7_latest.geojson
            england_map_web/data/building_type/shards/building_type_7_manifest_latest.json
            docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/status_latest.json
            docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json
          )
          git add -- "${files[@]}"
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "data(building_type_7): append Bromsgrove FHRS batch 800->850"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin codex/aays-single-runner-v5-20260706
            if ! git merge-base --is-ancestor origin/codex/aays-single-runner-v5-20260706 HEAD; then
              git rebase origin/codex/aays-single-runner-v5-20260706
            fi
            if git push origin HEAD:codex/aays-single-runner-v5-20260706; then
              pushed=1
              break
            fi
          done
          test "$pushed" -eq 1

      - name: Remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/aays-single-runner-v5-20260706
          python - <<'PY'
          import json, subprocess
          ref = 'origin/codex/aays-single-runner-v5-20260706'
          def load(path):
              raw = subprocess.check_output(['git','show',f'{ref}:{path}'])
              return json.loads(raw)
          shard = load('england_map_web/data/building_type/shards/building_type_7_latest.geojson')
          manifest = load('england_map_web/data/building_type/shards/building_type_7_manifest_latest.json')
          runner = load('docs/chatgpt_status/building_type/slots/building_type_7/runner_outputs/building_type_7_classification_latest.json')
          checkpoint = load('docs/chatgpt_status/_shared/slots_21/building_type_7/checkpoint_latest.json')
          task = load('docs/chatgpt_status/_shared/slots_21/building_type_7/current_task_latest.json')
          assert len(shard['features']) == 850
          assert manifest['feature_count_after'] == 850 and manifest['added_feature_count'] == 50
          assert checkpoint['current_feature_count'] == 850 and checkpoint['next_target_feature_count'] == 900
          assert runner['city'] == 'Bromsgrove' and len(runner['selected_feature_ids']) == 50
          assert task['owner'] is None and task['fake_data'] is False and task['final_ready'] is False
          print('remote readback verified: building_type_7=850')
          PY
