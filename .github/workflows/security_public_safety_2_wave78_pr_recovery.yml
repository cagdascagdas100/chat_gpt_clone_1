name: security-public-safety-2-wave78-pr-recovery

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/wave78-trigger/security_public_safety_2.txt

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-2cc8451e9fc6c56c340af6d0f8126f07fe327a0411de024472f8c3250a1f765d
  cancel-in-progress: false

jobs:
  guarded-wave78-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fixed canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Check exact idempotent claim gate
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          queue = Path('docs/chatgpt_status/aays1/queue/0053_security_public_safety_2_priority_14260row_incremental_evidence_expansion_20260730.v3.task.json')
          current = json.loads(Path('docs/chatgpt_status/_shared/slots_21/security_public_safety_2/current_task_latest.json').read_text(encoding='utf-8'))
          continuation = '2cc8451e9fc6c56c340af6d0f8126f07fe327a0411de024472f8c3250a1f765d'
          print('run=false' if queue.exists() or current.get('continuation_key') == continuation else 'run=true')
          PY

      - name: Validate Wave78 orchestrator syntax
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile docs/chatgpt_status/aays1/automation/security_public_safety_2_wave78_orchestrator.py

      - name: Claim exact Wave78 scope
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave78_orchestrator.py claim

      - name: Install browser runtime
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Generate official-source rows and publish accepted output
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave78_orchestrator.py run

      - name: Verify remote hashes and terminalize
        if: steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave78_orchestrator.py terminalize

      - name: Park failed continuation without duplicate retry
        if: failure() && steps.gate.outputs.run == 'true'
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave78_orchestrator.py park
