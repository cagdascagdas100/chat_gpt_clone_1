name: AAYS building_type_3 batch87 publish verified blobs
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-building-type-3-batch86-marlow-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-3-batch87-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 100
          clean: false
      - name: Restore only six verified batch87 blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          branch='codex/aays-single-runner-v5-20260706'
          git fetch origin "$branch"
          git pull --rebase origin "$branch"
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo='cagdascagdas100/chat_gpt_clone_1'
          blobs={
            'england_map_web/data/building_type/shards/building_type_3_latest.geojson':'b3c3e25d20f25e002be771c2ae0a0317d52533f1',
            'england_map_web/data/building_type/shards/building_type_3_manifest_latest.json':'5670ffa9be38852d4dabf5f7d52c5fa66eac7bc4',
            'docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json':'2beab234c33337320781bfc3ebe0db1908f88613',
            'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json':'97b13b74eb91c4093063feee2e39c037b7dfeceb',
            'docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json':'889f4486ad5ae144b87edf2ebf4307ec3b8ff4be',
            'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json':'674f140c09e6c5ea53979c251cbc79320844d6d0',
          }
          token=os.environ['GH_TOKEN']
          for path,sha in blobs.items():
              url=f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'TerraYield-AAYS/1.0'})
              with urllib.request.urlopen(req,timeout=120) as r:
                  obj=json.load(r)
              data=base64.b64decode(obj['content'])
              p=pathlib.Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          PY
      - name: Verify batch87 exact contract before publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          CONT='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e'
          paths={
            'shard':'england_map_web/data/building_type/shards/building_type_3_latest.geojson',
            'manifest':'england_map_web/data/building_type/shards/building_type_3_manifest_latest.json',
            'report':'docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json',
            'checkpoint':'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json',
            'status':'docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json',
            'task':'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json',
          }
          def load(k):
              with open(paths[k],encoding='utf-8') as f:return json.load(f)
          s,m,r,cp,st,t=[load(k) for k in ('shard','manifest','report','checkpoint','status','task')]
          feats=s.get('features') or []
          assert len(feats)==9100
          assert m.get('feature_count')==9100
          assert r.get('feature_count_before')==9050 and r.get('feature_count_after')==9100
          assert r.get('attempted_parcels')==50 and r.get('added_feature_count')==50
          assert r.get('city')=='Beaconsfield' and r.get('grid_id')=='uk-grid-beaconsfield-central-001'
          assert r.get('fake_data') is False and r.get('final_ready') is False
          assert cp.get('continuation_key')==CONT and st.get('continuation_key')==CONT and t.get('continuation_key')==CONT
          assert cp.get('next_batch_index')==88 and st.get('next_batch_index')==88 and t.get('next_batch_index')==88
          old=feats[:9050]; new=feats[9050:]
          def p(f): return f.get('properties') or {}
          old_f={str(f.get('id') or p(f).get('feature_id')) for f in old}
          old_o={str(p(f).get('osm_id')) for f in old if p(f).get('osm_id')}
          old_r={str(p(f).get('source_ref')) for f in old if p(f).get('source_ref')}
          nf=[str(f.get('id') or p(f).get('feature_id')) for f in new]
          no=[str(p(f).get('osm_id')) for f in new]
          nr=[str(p(f).get('source_ref')) for f in new]
          assert len(nf)==len(set(nf))==50 and not(set(nf)&old_f)
          assert len(no)==len(set(no))==50 and not(set(no)&old_o)
          assert len(nr)==len(set(nr))==50 and not(set(nr)&old_r)
          records=r.get('records') or []
          assert len(records)==50
          required=('source_url','source_path','accessed_at','fields_used','match_method','evidence_level','confidence_score','confidence_level_1_to_4')
          assert all(rec.get('fake_data') is False and all(rec.get(k) not in (None,'') for k in required) for rec in records)
          print(json.dumps({'before':9050,'attempted':50,'added':50,'after':9100,'confidence':r.get('confidence_level_distribution'),'evidence':r.get('evidence_level_distribution'),'no_evidence':r.get('no_evidence_this_batch'),'final_ready':False},ensure_ascii=False))
          PY
      - name: Commit explicit outputs and push with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/aays-single-runner-v5-20260706'
          files=(
            'england_map_web/data/building_type/shards/building_type_3_latest.geojson'
            'england_map_web/data/building_type/shards/building_type_3_manifest_latest.json'
            'docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json'
            'docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json'
          )
          git add -- "${files[@]}"
          git diff --cached --quiet && { echo 'NO_EVIDENCE_THIS_BATCH: verified blobs already present'; exit 0; }
          git commit -m 'data(aays): building_type_3 batch87 Beaconsfield'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              echo "PUSH_OK attempt=$attempt"
              exit 0
            fi
          done
          echo 'PUBLISH_PENDING: bounded push retries exhausted'
          exit 1
