name: AAYS building_type_3 batch86 Marlow once
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-building-type-3-batch86-marlow-once.yml'
permissions:
  contents: write
concurrency:
  group: aays-building-type-3-batch86-marlow
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 50
          clean: false
      - name: Run preserved batch86 classifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TerraYield AAYS Bot'
          git config user.email 'aays-bot@users.noreply.github.com'
          git fetch origin codex/aays-single-runner-v5-20260706
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          workflow='.github/workflows/aays-building-type-3-batch86-marlow-once.yml'
          prev_commit="$(git log -2 --format=%H -- "$workflow" | tail -1)"
          test -n "$prev_commit"
          git show "$prev_commit:$workflow" > /tmp/aays_bt3_batch86_prev.yml
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/aays_bt3_batch86_prev.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY\n", start)
          body=src[start:end]
          out=[]
          for line in body.splitlines():
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/aays_bt3_batch86.py').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
          python /tmp/aays_bt3_batch86.py
      - name: Enforce exact batch contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          CONT='03d44e69b0c48954f68ecf6b86773a0e24affd56956a1cdfee6ccd900658161e'
          TASK='building-type-3-england-classification-v1-20260808'
          shard='england_map_web/data/building_type/shards/building_type_3_latest.geojson'
          manifest='england_map_web/data/building_type/shards/building_type_3_manifest_latest.json'
          report='docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json'
          checkpoint='docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json'
          status='docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json'
          task='docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json'
          def load(p):
              with open(p, encoding='utf-8') as f: return json.load(f)
          s=load(shard); m=load(manifest); r=load(report); cp=load(checkpoint); st=load(status); t=load(task)
          after=len(s.get('features', []))
          assert r.get('feature_count_before') == 9000, r.get('feature_count_before')
          assert r.get('attempted_parcels') == 50, r.get('attempted_parcels')
          assert r.get('added_feature_count') == 50, r.get('added_feature_count')
          assert r.get('feature_count_after') == 9050, r.get('feature_count_after')
          assert after == 9050, after
          assert m.get('feature_count') == 9050, m.get('feature_count')
          assert cp.get('continuation_key') == CONT
          assert st.get('continuation_key') == CONT
          assert t.get('continuation_key') == CONT
          assert st.get('task_id') == TASK
          assert t.get('task_id') == TASK
          assert st.get('owner') in (None, '')
          assert t.get('owner') in (None, '')
          assert r.get('fake_data') is False
          assert r.get('final_ready') is False
          records=r.get('records') or []
          assert len(records) == 50, len(records)
          for rec in records:
              for key in ('building_type_primary','source_url','source_path','accessed_at','fields_used','match_method','evidence_level','confidence_score','confidence_level_1_to_4'):
                  assert rec.get(key) not in (None, ''), (rec.get('parcel_id'), key)
              assert rec.get('fake_data') is False
          ids=[]
          for rec in records:
              ids.extend([str(rec.get('parcel_id')), str(rec.get('osm_id')), str(rec.get('source_ref'))])
          assert len(ids) == len(set(ids)), 'duplicate ids inside batch86'
          print({'feature_count_before':9000,'attempted_parcels':50,'newly_added':50,'feature_count_after':9050,'records':len(records)})
          PY
      - name: Commit only explicit building_type_3 outputs
        shell: bash
        run: |
          set -euo pipefail
          shard='england_map_web/data/building_type/shards/building_type_3_latest.geojson'
          manifest='england_map_web/data/building_type/shards/building_type_3_manifest_latest.json'
          classout='docs/chatgpt_status/building_type/slots/building_type_3/runner_outputs/building_type_3_classification_latest.json'
          checkpoint='docs/chatgpt_status/_shared/slots_21/building_type_3/checkpoint_latest.json'
          status='docs/chatgpt_status/_shared/slots_21/building_type_3/status_latest.json'
          task='docs/chatgpt_status/_shared/slots_21/building_type_3/current_task_latest.json'
          git add -- "$shard" "$manifest" "$classout" "$checkpoint" "$status" "$task"
          if git diff --cached --quiet; then
            echo 'NO_EVIDENCE_THIS_BATCH: no output changes'
            exit 1
          fi
          git commit -m 'data(aays): building_type_3 batch86 Marlow'
          git pull --rebase origin codex/aays-single-runner-v5-20260706
          git push origin HEAD:codex/aays-single-runner-v5-20260706
