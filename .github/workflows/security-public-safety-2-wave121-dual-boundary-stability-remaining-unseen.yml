name: security-public-safety-2-wave121-dual-boundary-stability-remaining-unseen

on:
  pull_request:
    paths:
      - ".github/wave121-security-public-safety-2.trigger.txt"

permissions:
  contents: write

concurrency:
  group: security-public-safety-2-wave121-dual-boundary-stability-remaining-unseen
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: codex/aays-single-runner-v5-20260706
          fetch-depth: 0

      - name: Run official remaining-unseen dual-boundary audit
        run: python docs/chatgpt_status/aays1/automation/security_public_safety_2_wave121_dual_boundary_stability_remaining_unseen_20260731.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          data_path = root / "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_dual_boundary_stability_remaining_unseen_wave121_latest.json"
          html_path = root / "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_dual_boundary_stability_remaining_unseen_wave121.html"
          data = json.loads(data_path.read_text(encoding="utf-8"))
          assert data["state"] == "COMPLETED_DUAL_BOUNDARY_STABILITY_REMAINING_UNSEEN_PUBLISHED"
          assert data["scope"]["rows_audited"] == 125
          assert data["scope"]["remaining_unseen_rows_before_sample"] == 125
          assert data["scope"]["prior_audited_rows_excluded_total"] == 192
          assert len(data["rows"]) == 125
          assert len({row["parcel_id"] for row in data["rows"]}) == 125
          assert data["result"]["prior_high_confidence_support_rows"] == 30629
          assert data["result"]["official_network_probe_count"] == 1250
          assert data["result"]["total_operations"] == 1631
          assert data["result"]["completed_or_fail_closed_operations"] == 1631
          assert data["result"]["blocked_operations"] == 0
          assert data["result"]["blocked_rows"] == 0
          assert data["result"]["held_scope_audit_progress_percent"] == 100.0
          assert data["result"]["stable_dual_boundary_rows"] > 0
          assert data["scope"]["candidate_values_changed"] == 0
          assert data["scope"]["business_rows_written"] == 0
          assert data["quality_policy"]["parent_candidate_accuracy_mutated"] is False
          assert data["fake_data"] is False
          assert html_path.read_text(encoding="utf-8").count("<tr>") == 126
          print(json.dumps(data["result"], ensure_ascii=False))
          PY

      - name: Publish audit to moving canonical branch
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_dual_boundary_stability_remaining_unseen_wave121_latest.json \
            england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_dual_boundary_stability_remaining_unseen_wave121.html
          if ! git diff --cached --quiet; then
            git commit -m "security_public_safety_2: publish Wave121 remaining-unseen audit [skip ci]"
          fi
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target_branch"
            git rebase "origin/$target_branch"
            if git push origin "HEAD:$target_branch"; then
              published=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$published" = true

      - name: Remote file readback
        run: |
          set -euo pipefail
          target_branch="codex/aays-single-runner-v5-20260706"
          git fetch origin "$target_branch"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          branch = "origin/codex/aays-single-runner-v5-20260706"
          json_path = "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_dual_boundary_stability_remaining_unseen_wave121_latest.json"
          html_path = "england_map_web/data/aays_21_slots/security_public_safety_2/lsoa_dual_boundary_stability_remaining_unseen_wave121.html"
          data_bytes = subprocess.check_output(["git", "show", f"{branch}:{json_path}"])
          html_bytes = subprocess.check_output(["git", "show", f"{branch}:{html_path}"])
          data = json.loads(data_bytes.decode("utf-8"))
          assert len(data["rows"]) == 125
          assert data["result"]["total_operations"] == 1631
          assert data["result"]["blocked_operations"] == 0
          assert html_bytes.decode("utf-8").count("<tr>") == 126
          print(json.dumps({
              "state": data["state"],
              "result": data["result"],
              "recovery": data.get("recovery"),
              "json_sha256": hashlib.sha256(data_bytes).hexdigest(),
              "html_sha256": hashlib.sha256(html_bytes).hexdigest(),
              "remote_head": subprocess.check_output(["git", "rev-parse", branch], text=True).strip(),
          }, ensure_ascii=False))
          PY
