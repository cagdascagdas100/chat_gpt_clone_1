name: AAYS fg4 GLA round3 and Opportunity Areas probe 20260915
on:
  push:
    branches:
      - codex/aays-single-runner-v5-20260706
    paths:
      - '.github/workflows/aays-fg4-gla-round3-and-opportunity-areas-probe-20260915.yml'
permissions:
  contents: read
jobs:
  fetch-sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch GLA Site Allocations final window and Opportunity Areas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, datetime
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          headers={'User-Agent':'TerraYield-AAYS-future_growth_4/1.0','Accept':'application/geo+json,application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); status=getattr(r,'status',None); final=r.geturl(); ctype=r.headers.get('Content-Type')
              return raw,status,final,ctype
          sa_base='https://gis.london.gov.uk/arcgis/rest/services/apps/planning_data_map_02/FeatureServer/102/query'
          sa_params={'where':'removeddate IS NULL','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'objectid ASC','resultOffset':'20','resultRecordCount':'10','f':'geojson'}
          sa_url=sa_base+'?'+urllib.parse.urlencode(sa_params)
          raw,status,final,ctype=get(sa_url)
          data=json.loads(raw); feats=(data.get('features') or [])[:10]
          if not feats: raise SystemExit('site allocations final window empty')
          for f in feats:
              if (f.get('geometry') or {}).get('type') not in ('Polygon','MultiPolygon'): raise SystemExit('site allocations non-polygon')
          out={'type':'FeatureCollection','features':feats}; b=json.dumps(out,separators=(',',':'),ensure_ascii=False).encode()
          open('fg4_gla_site_allocations_21_25.geojson','wb').write(b)
          open('fg4_gla_site_allocations_21_25_meta.json','w').write(json.dumps({'slot_id':'future_growth_4','retrieved_at_utc':now,'http_status':status,'content_type':ctype,'request_url':sa_url,'final_url':final,'raw_response_sha256':hashlib.sha256(raw).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b).hexdigest(),'feature_count':len(feats),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in feats]},indent=2,ensure_ascii=False))
          oa_base='https://gis.london.gov.uk/arcgis/rest/services/apps/planning_data_map_02/FeatureServer/103/query'
          oa_params={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','orderByFields':'objectid ASC','resultOffset':'0','resultRecordCount':'10','f':'geojson'}
          oa_url=oa_base+'?'+urllib.parse.urlencode(oa_params)
          raw2,status2,final2,ctype2=get(oa_url)
          d2=json.loads(raw2); feats2=(d2.get('features') or [])[:10]
          if not feats2: raise SystemExit('opportunity areas empty')
          for f in feats2:
              if (f.get('geometry') or {}).get('type') not in ('Polygon','MultiPolygon'): raise SystemExit('opportunity areas non-polygon')
          out2={'type':'FeatureCollection','features':feats2}; b2=json.dumps(out2,separators=(',',':'),ensure_ascii=False).encode()
          open('fg4_gla_opportunity_areas_1_10.geojson','wb').write(b2)
          open('fg4_gla_opportunity_areas_1_10_meta.json','w').write(json.dumps({'slot_id':'future_growth_4','retrieved_at_utc':now,'http_status':status2,'content_type':ctype2,'request_url':oa_url,'final_url':final2,'raw_response_sha256':hashlib.sha256(raw2).hexdigest(),'selected_geojson_sha256':hashlib.sha256(b2).hexdigest(),'feature_count':len(feats2),'features':[{'id':f.get('id'),'geometry_type':(f.get('geometry') or {}).get('type'),'properties':f.get('properties',{})} for f in feats2]},indent=2,ensure_ascii=False))
          print(json.dumps({'site_allocations_final_count':len(feats),'opportunity_areas_count':len(feats2),'site_allocations_http':status,'opportunity_areas_http':status2},ensure_ascii=False))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fg4-gla-round3-and-opportunity-areas-probe
          path: |
            fg4_gla_site_allocations_21_25.geojson
            fg4_gla_site_allocations_21_25_meta.json
            fg4_gla_opportunity_areas_1_10.geojson
            fg4_gla_opportunity_areas_1_10_meta.json
          if-no-files-found: error
