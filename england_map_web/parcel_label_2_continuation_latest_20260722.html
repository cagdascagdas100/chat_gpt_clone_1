<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_2 — Güncel devam özeti</title><style>body{font-family:Arial,sans-serif;margin:22px;background:#f4f6f8;color:#17202a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border:1px solid #ccd6dd;border-radius:6px;padding:11px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:13px}th,td{border:1px solid #ccd6dd;padding:8px;text-align:left;vertical-align:top}th{background:#eaf0f4}code,a{word-break:break-all}.ok{color:#166534}.bad{color:#991b1b}</style></head><body><h1>parcel_label_2 — Güncel devam özeti</h1><div id="state" class="warn">Veri yükleniyor…</div><div id="cards" class="grid"></div><h2>Satır-satır sayfalar</h2><table><thead><tr><th>Sayfa</th><th>Aday</th><th>İşlem satırı</th><th>Durum</th></tr></thead><tbody id="pages"></tbody></table><h2>Son adaylar</h2><table><thead><tr><th>Sınıf</th><th>Adaylar</th></tr></thead><tbody id="candidates"></tbody></table><h2>Runner ve engeller</h2><table><tbody id="runner"></tbody></table><p id="error" class="bad"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=(l,v)=>`<div class="card">${e(l)}<br><b>${e(v)}</b></div>`;const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);fetch('./data/distance_property_types/parcel_label_2_continuation_latest_20260722.json',{cache:'no-store',signal:c.signal}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{state.className='warn';state.textContent=d.state+' · final_ready='+d.final_ready;const m=d.main_workflow,p=d.research_publication,g=d.canonical_gates;cards.innerHTML=card('Genel ilerleme',m.progress_percent+'%')+card('Yüzde artışı','+'+m.delta_percentage_points+' puan')+card('Ana işlem',m.operations_completed+'/'+m.operations_total)+card('Yeni aday',p.new_candidate_rows)+card('Toplam aday',p.candidate_rows_after)+card('Resmî kaynak kontrolü',p.official_source_category_checks_passed+'/'+p.official_source_category_checks_total)+card('Kaynak doğruluğu',p.source_accuracy_percent+'%')+card('Yeni görünür satır',p.new_visible_activity_rows)+card('Toplam görünür satır',p.visible_activity_rows_after)+card('Yeni dosya',p.new_files_merged)+card('Kanonik doğrulanmış',g.canonical_verified_slot_rows)+card('Kesin geometri',g.exact_geometry_rows);pages.innerHTML=d.web_pages.map(x=>`<tr><td><a href="${e(x.path)}">${e(x.label)}</a></td><td>${e(x.candidate_rows)}</td><td>${e(x.activity_rows)}</td><td>PUBLISHED</td></tr>`).join('');candidates.innerHTML=Object.entries(d.latest_candidate_groups).map(([k,v])=>`<tr><td>${e(k)}</td><td>${v.map(e).join('<br>')}</td></tr>`).join('');runner.innerHTML=Object.entries(d.runner).map(([k,v])=>`<tr><th>${e(k)}</th><td><code>${e(v)}</code></td></tr>`).join('')+`<tr><th>blockers</th><td>${d.blockers.map(e).join('<br>')}</td></tr>`}).catch(x=>error.textContent=x.name==='AbortError'?'8 saniye zaman aşımı':'Veri yüklenemedi: '+x.message).finally(()=>clearTimeout(t));</script></body></html>
