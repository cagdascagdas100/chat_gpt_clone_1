<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_3 — Batch 20</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0 0 8px}.note{margin:0 0 18px;color:#52606d}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}.card{background:#fff;border:1px solid #d8dee4;border-radius:9px;padding:12px}.card b{display:block;font-size:1.35rem}.wrap{overflow:auto;background:#fff;border:1px solid #d8dee4;border-radius:9px}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:8px 10px;border-bottom:1px solid #e5e9ed;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eef2f5}.PASS,.COMPLETE,.PREPARED,.PREPARED_NONFINAL{font-weight:700;color:#146c2e}.BLOCKED{font-weight:700;color:#a33a00}.err{background:#fff3f3;color:#9b1c1c;padding:12px;border-radius:8px}</style></head><body><main><h1>height_difference_3 — Batch 20</h1><p class="note">Strict checkpoint + retry reconciler v2. Hazırlık puanları ölçülmüş hedef kot doğruluğu değildir. fake_data=false · final_ready=false · iş verisi=0.</p><section class="cards"><div class="card"><span>Görünür satır</span><b id="rows">150</b></div><div class="card"><span>Yeni kaynak</span><b>8</b></div><div class="card"><span>Yeni aday</span><b>4</b></div><div class="card"><span>Test</span><b>28/28</b></div><div class="card"><span>İşlem</span><b>67/68</b></div><div class="card"><span>Yeni batch hazırlık</span><b>%99,98</b></div></section><div id="error"></div><div class="wrap"><table><thead><tr><th>#</th><th>Grup</th><th>Kod / ad</th><th>Durum</th><th>Ayrıntı</th></tr></thead><tbody id="body"></tbody></table></div></main><script>
const base='data/height_difference/';
const files=['height_difference_3_source_candidates_batch_20.json','height_difference_3_strict_checkpoint_contract_batch_20.json','height_difference_3_batch_20_contract_tests.json','height_difference_3_retry_examples_batch_20.json','height_difference_3_operations_batch_20.json','height_difference_3_operations_batch_20_readback.json'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const d=await Promise.all(files.map(f=>fetch(base+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+': '+r.status);return r.json()})));const rows=[];d[0].official_sources.forEach(x=>rows.push(['SOURCE',x.source_id,'PREPARED',x.authority+' — '+x.finding+' Güven: %'+x.confidence]));d[0].candidates.forEach(x=>rows.push(['CANDIDATE',x.candidate_id,x.state,x.name+' · hazırlık %'+x.readiness]));d[1].rows.forEach(x=>rows.push([x.category,x.code,x.state,x.detail]));d[2].tests.forEach(x=>rows.push(['TEST',x.name,x.state,x.detail]));d[3].examples.forEach(x=>rows.push(['EXAMPLE_'+x.example,x.scenario,x.decision,x.reason]));d[4].rows.forEach(x=>rows.push(['OPERATION',x.operation,x.status,x.name+' — '+x.detail]));d[5].rows.forEach(x=>rows.push(['READBACK',x.operation,x.status,x.name+' — '+x.detail]));document.getElementById('rows').textContent=rows.length;document.getElementById('body').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="${esc(r[2])}">${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('');if(rows.length!==150)throw Error('VISIBLE_ROW_COUNT_MISMATCH:'+rows.length)}catch(e){document.getElementById('error').innerHTML='<p class="err">'+esc(e.message)+'</p>'}})();
</script></body></html>
