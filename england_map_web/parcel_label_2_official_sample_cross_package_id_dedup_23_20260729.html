<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paket 23 Exact-ID Denetimi</title><style>body{font-family:Arial;margin:24px;background:#f5f7fa}.cards{display:flex;gap:10px;flex-wrap:wrap}.card,table{background:#fff;border:1px solid #ccc}.card{padding:12px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#edf2f7}.pass{color:#176b32;font-weight:bold}</style></head><body><h1>Paket 23 — Exact-ID Tekillik Denetimi</h1><div id="c" class="cards"></div><table><thead><tr><th>Satır</th><th>Seçilen candidate_id</th><th>Önceki paket çakışması</th></tr></thead><tbody id="t"></tbody></table><script>fetch('../docs/chatgpt_status/_shared/slots_21/parcel_label_2/recovery/official_sample_cross_package_id_dedup_23_20260729.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{c.innerHTML=[['Önceki paket',d.scope.previous_packages_scanned],['Önceki occurrence',d.scope.previous_candidate_occurrences],['Kontrol',d.scope.proposed_candidate_ids_checked],['Çakışma',d.scope.exact_id_collisions]].map(x=>`<div class="card">${x[0]}<br><b>${x[1]}</b></div>`).join('');t.innerHTML=d.selected_candidate_ids.map((x,i)=>`<tr><td>${i+1}</td><td><code>${x}</code></td><td class="pass">0 — PASS</td></tr>`).join('')});</script></body></html>
