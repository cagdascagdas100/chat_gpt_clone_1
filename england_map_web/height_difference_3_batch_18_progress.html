<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_3 Batch 18</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f8fa;color:#111;line-height:1.4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border:1px solid #bbb;border-radius:8px;padding:12px}.v{font-size:22px;font-weight:700}table{border-collapse:collapse;width:100%;background:#fff;margin:18px 0}th,td{border:1px solid #bbb;padding:7px;text-align:left;vertical-align:top}th{background:#eef1f4}.bad{color:#a00;font-weight:700}.ok{color:#067d17;font-weight:700}.muted{color:#555}</style></head><body><h1>height_difference_3 — Batch 18</h1><p>Uzun süre pending kalan Git ve alt süreçler için bounded watchdog, process-tree sonlandırma, eski output reddi ve slot-sınırlı geçici dosya temizliği.</p><div class="cards" id="cards"></div><p id="state"></p><div id="tables"></div><script>
const base='data/height_difference/';
const files={sources:'height_difference_3_source_candidates_batch_18.json',contract:'height_difference_3_execution_watchdog_contract_batch_18.json',tests:'height_difference_3_execution_watchdog_tests_batch_18.json',examples:'height_difference_3_execution_watchdog_examples_batch_18.json',operations:'height_difference_3_operations_batch_18.json',readback:'height_difference_3_operations_batch_18_readback.json',watchdog:'height_difference_3_execution_watchdog_latest.json'};
const safe=async n=>{try{const r=await fetch(base+files[n],{cache:'no-store'});return r.ok?await r.json():null}catch{return null}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(title,cols,rows)=>`<h2>${esc(title)} <span class="muted">(${rows.length})</span></h2><table><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof c[1]==='function'?c[1](r):r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
Promise.all(Object.keys(files).map(async k=>[k,await safe(k)])).then(items=>{const d=Object.fromEntries(items),s=d.sources||{},c=d.contract||{},t=d.tests||{},e=d.examples||{};const src=s.official_sources||[],cand=s.source_chain_candidates||[],g=c.rows||[],tests=t.tests||[],ex=e.rows||[],ops=[...((d.operations||{}).rows||[]),...((d.readback||{}).rows||[])],wd=d.watchdog||{};const visible=src.length+cand.length+g.length+tests.length+ex.length+ops.length;const cardsData=[['Resmî kaynak',src.length],['Aday',cand.length],['Kapı',g.length],['Test',(t.passed_count||0)+' / '+(t.test_count||0)],['Örnek',ex.length],['İşlem',ops.length],['Görünür satır',visible],['Gerçek watchdog',wd.task_id?'VAR':'YOK']];cards.innerHTML=cardsData.map(x=>`<div class="card"><div>${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');state.className=wd.task_id?'ok':'bad';state.textContent=wd.task_id?`Watchdog state: ${wd.state}; timeout=${wd.timeout_count||0}; killed=${wd.killed_process_tree_count||0}`:'Shared-runner host offline olduğu için gerçek watchdog/Point çıktısı henüz yok; repository tarafındaki hang önlemleri hazır.';let out='';out+=table('Resmî kaynaklar',[['Kaynak','source_id'],['Kurum','authority'],['Doğrulanan bilgi','verified_fact'],['Hazırlık','source_readiness_score'],['Sınırlama','limitation']],src);out+=table('Aday zincirler',[['Aday','candidate_id'],['Sınır','boundary_source'],['Yükseklik','elevation_source'],['Hazırlık','readiness_score'],['Durum','status']],cand);out+=table('Execution watchdog kapıları',[['Kapı','gate_id'],['Aşama','phase'],['Kural','requirement'],['Durum','status'],['Hata','fail_code']],g);out+=table('Testler',[['Test','test_id'],['Ad','name'],['Sonuç',r=>r.passed?'PASS':'FAIL'],['Sözleşme','verified_contract']],tests);out+=table('Hazır örnekler',[['Örnek','row_id'],['Girdi','input_state'],['Karar','decision'],['Gerekçe','reason']],ex);out+=table('İşlemler',[['Satır','line'],['İşlem','operation'],['Kapsam','scope'],['Durum','status'],['Sonuç','result']],ops);tables.innerHTML=out}).catch(err=>{state.className='bad';state.textContent='Sayfa verileri yüklenemedi: '+err.message});
</script></body></html>
