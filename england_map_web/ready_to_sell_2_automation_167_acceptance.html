<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 2 — Automation 167 Acceptance</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f7fa;color:#152033}header,section{padding:14px 18px;background:#fff;border-bottom:1px solid #c3ced9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #bdc8d5;padding:8px;margin:6px 0;background:#fbfcfd}.small{font-size:12px;color:#536176}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body data-load-state="loading" data-load-mode="unknown" data-visible-row-count="0" data-live-source-count="0" data-progress-event-count="0" data-research-candidate-count="0" data-research-candidate-card-count="0" data-research-candidate-duplicate-count="0" data-research-candidate-missing-id-count="0"><header><h1>ReadyToSell 2 — Automation 167 DOM Acceptance</h1><div>Gerçek geometry/AI kanıtı, güncel shard ilerlemesi ve Wave 46–47 adayları aynı DOM içinde doğrulanır.</div></header><section id="metrics">Yükleniyor...</section><section class="grid"><div><h2>Kanıt satırları</h2><div id="evidence"></div></div><div><h2>İşlem satırları</h2><div id="events"></div></div></section><section><h2>Araştırma adayları</h2><div id="candidates"></div></section><script>'use strict';const P={geometry:'data/geometry_review_3of4/all_1264_real_geometry_3of4.geojson',ai:'data/geometry_review_3of4/photo_ai_boundary_review_results.json',progress:'data/aays_21_slots/ready_to_sell_2/progress_latest.json',full:'data/aays_21_slots/ready_to_sell_2/progress_wave_47_latest.json',manifests:['data/aays_21_slots/ready_to_sell_2/candidate_wave_46_latest.json','data/aays_21_slots/ready_to_sell_2/candidate_wave_47_latest.json']};const esc=v=>String(v??'not_available').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(p,r=false){try{const x=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!x.ok)throw new Error('HTTP '+x.status);return await x.json()}catch(e){if(r)throw new Error(p+': '+e.message);return null}}async function load(){document.body.dataset.loadState='loading';try{const[g,a,p,f,ms]=await Promise.all([j(P.geometry),j(P.ai,true),j(P.progress,true),j(P.full,true),Promise.all(P.manifests.map(x=>j(x,true)))]);if(!Array.isArray(a.results))throw new Error('AI results dizisi yok');let candidateRows=[];for(const m of ms){if(Array.isArray(m.candidates))candidateRows.push(...m.candidates);const ps=await Promise.all((m.candidate_part_files||[]).map(x=>j('data/aays_21_slots/ready_to_sell_2/'+x,true)));candidateRows.push(...ps.flatMap(x=>x.candidates||[]))}const uniqueCandidates=new Map(),missingCandidateIds=[];for(const c of candidateRows){const id=String(c&&c.candidate_id||'').trim();if(!id){missingCandidateIds.push(c);continue}if(!uniqueCandidates.has(id))uniqueCandidates.set(id,c)}const candidates=[...uniqueCandidates.values()],duplicateCandidateCount=candidateRows.length-missingCandidateIds.length-candidates.length;const eventMap=new Map();for(const e of [...(f.events||[]),...(p.events||[])]){const sequence=e&&e.sequence;if(sequence!==undefined&&sequence!==null)eventMap.set(String(sequence),e)}const events=[...eventMap.values()].sort((a,b)=>Number(a.sequence||0)-Number(b.sequence||0));const rows=a.results,live=rows.filter(x=>x.source_verification_status==='verified_live_listing_page').length,mode=g&&Array.isArray(g.features)&&g.features.length?'canonical_geometry':'ai_evidence_fallback';document.body.dataset.loadMode=mode;document.body.dataset.visibleRowCount=String(rows.length);document.body.dataset.liveSourceCount=String(live);document.body.dataset.progressEventCount=String(events.length);document.body.dataset.researchCandidateCount=String(candidates.length);document.body.dataset.researchCandidateCardCount=String(candidates.length);document.body.dataset.researchCandidateDuplicateCount=String(duplicateCandidateCount);document.body.dataset.researchCandidateMissingIdCount=String(missingCandidateIds.length);document.getElementById('metrics').innerHTML=`mode=<b>${esc(mode)}</b> | visible=<b>${rows.length}</b> | live=<b>${live}</b> | events=<b>${events.length}</b> | unique_candidates=<b>${candidates.length}</b> | duplicate_candidates=<b>${duplicateCandidateCount}</b> | missing_ids=<b>${missingCandidateIds.length}</b> | completed=<b>${p.completed_operations}/${p.total_operations}</b>`;document.getElementById('evidence').innerHTML=rows.slice(0,50).map((x,i)=>`<div class="card" data-evidence-row="${esc(x.row_id??i+1)}"><b>${esc(x.row_id??i+1)}</b> — ${esc(x.source_verification_status)}<div class="small">${esc(x.listing_url)}</div></div>`).join('');document.getElementById('events').innerHTML=events.map(e=>`<div class="card" data-progress-sequence="${esc(e.sequence)}"><b>${esc(e.sequence)}. ${esc(e.event)}</b> — ${esc(e.result)}<div class="small">${esc(e.detail)}</div></div>`).join('');document.getElementById('candidates').innerHTML=candidates.map(c=>`<div class="card" data-research-candidate="${esc(c.candidate_id)}"><b>${esc(c.title)}</b> — ${esc(c.marketing_status)}<div>${esc(c.location)} | ${esc(c.price)}</div><div class="small">confidence=${esc(c.source_confidence_score)}/100 | promotion_allowed=${esc(c.promotion_allowed)}</div></div>`).join('');document.body.dataset.loadState='ready'}catch(e){document.body.dataset.loadState='error';document.getElementById('metrics').textContent='Yükleme hatası: '+e.message}}load();</script></body></html>
