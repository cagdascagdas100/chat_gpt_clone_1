<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 — Batch6 İlerleme</title><style>body{font-family:system-ui;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:13px}.v{font-size:24px;font-weight:700}.warn{color:#a05a00}.ok{color:#16794b}ul{background:#fff;border:1px solid #ddd;padding:20px 38px}</style></head><body><h1>Security/Public Safety — Batch6 ve 046 recovery ilerlemesi</h1><div id="grid" class="grid"></div><h2>Kalan kapılar</h2><ul id="blockers"></ul><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('data/security_public_safety/security_public_safety_3_progress_batch6_046_recovery_20260722.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{grid.innerHTML=[['Gösterilen ilerleme','%'+d.overall_progress_percent,'ok'],['Kesin ilerleme','%'+d.overall_progress_precise_percent,'ok'],['Artış','+'+d.progress_delta_percent+' puan','ok'],['İşlem',d.completed_operations+' / '+d.total_operations,'ok'],['Kaynak',d.official_source_candidates,'ok'],['≥95 kaynak',d.source_authority_accuracy_ge_95_count,'ok'],['Promoted context',d.promoted_sources,'ok'],['Held',d.held_sources,'warn'],['Web satırı',d.visible_total_line_rows,'ok'],['Parsel yükseltme',d.published_score_row_count,'warn']].map(x=>`<div class="card"><div>${esc(x[0])}</div><div class="v ${x[2]}">${esc(x[1])}</div></div>`).join('');blockers.innerHTML=d.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}).catch(e=>document.body.insertAdjacentHTML('beforeend',`<p>Yükleme hatası: ${esc(e.message)}</p>`));</script></body></html>
