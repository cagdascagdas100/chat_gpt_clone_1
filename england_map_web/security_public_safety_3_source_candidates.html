<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 Source Inventory</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:12px;vertical-align:top}th{background:#eef1f4}.muted{color:#666}</style></head><body><h1>security_public_safety_3 kaynak envanteri</h1><div class="muted">Materialize edilmiş kaynak kimlikleri, SRC-21 geçişi ve count-only reconciliation farkı · 60 saniyede yenilenir</div><div id="summary" class="grid"></div><div id="warning"></div><div id="table"></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(l,v,c='')=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></div>`;async function main(){try{const r=await fetch('data/security_public_safety/security_public_safety_3_source_candidates_latest.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('summary').innerHTML=card('Materialize aday',d.candidate_count,'ok')+card('Materialize yükseltilen',d.promoted_count)+card('Materialize held',d.held_count)+card('İş adayı',d.reported_business_candidate_count)+card('Kimlik farkı',d.materialised_identity_gap,d.materialised_identity_gap?'bad':'ok')+card('Skor satırı',d.verified_parcel_rows||0,'warn');document.getElementById('warning').innerHTML=d.materialised_identity_gap?`<div class="card"><b class="bad">Reconciliation gerekli:</b> ${esc(d.materialised_identity_gap)} count-only kaynak kimliği remote source dosyasında materialize değil; uydurulmadan bloklu tutuluyor.</div>`:'';document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>ID</th><th>Kaynak</th><th>Yayıncı</th><th>Doğruluk</th><th>Karar</th><th>Kanıt tarihi</th><th>Tazelik</th><th>Kullanım sınırı</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td>${x.line}</td><td>${esc(x.source_id)}</td><td>${esc(x.name)}</td><td>${esc(x.publisher)}</td><td>${esc(x.authority_accuracy)}</td><td>${esc(x.decision)}</td><td>${esc(x.evidence_date)}</td><td>${esc(x.freshness_status)}</td><td>${esc(x.semantic_limit)}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('table').textContent=e.stack||e}}main();setInterval(main,60000);</script></body></html>
