<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 Source Inventory</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:12px;vertical-align:top}th{background:#eef1f4}.muted{color:#666}</style></head><body><h1>security_public_safety_3 kaynak envanteri</h1><div class="muted">Ana `38` kaynak ile batch5 `6` kaynak bağımsız yüklenir ve tek tabloda birleştirilir · 60 saniyede yenilenir</div><div id="summary" class="grid"></div><div id="warning"></div><div id="table"></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(l,v,c='')=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></div>`;async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.json()}async function main(){try{const b='data/security_public_safety/';const[a,x]=await Promise.all([j(b+'security_public_safety_3_source_candidates_latest.json'),j(b+'security_public_safety_3_source_candidates_batch5_latest.json')]);const rows=[...(a.rows||[]),...(x.rows||[])].sort((u,v)=>Number(u.line)-Number(v.line));const promoted=rows.filter(r=>String(r.decision||'').startsWith('promoted')).length;const held=rows.filter(r=>String(r.decision||'').startsWith('held')).length;const a90=rows.filter(r=>Number(r.authority_accuracy)>=90).length;const a95=rows.filter(r=>Number(r.authority_accuracy)>=95).length;const duplicateIds=rows.length-new Set(rows.map(r=>r.source_id)).size;document.getElementById('summary').innerHTML=card('Aday',rows.length,'ok')+card('Yükseltilen',promoted,'ok')+card('Held',held,'warn')+card('Doğruluk ≥90',a90,'ok')+card('Doğruluk ≥95',a95,'ok')+card('Kimlik farkı',duplicateIds,duplicateIds?'bad':'ok');document.getElementById('warning').innerHTML=duplicateIds?`<div class="card"><b class="bad">Kimlik çakışması:</b> ${duplicateIds}</div>`:`<div class="card"><b class="ok">Reconciliation tamam:</b> ana 38 + batch5 6 = 44 benzersiz kaynak; SRC-21 31 Mart 2026 yayınına güncel.</div>`;document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>ID</th><th>Kaynak</th><th>Yayıncı</th><th>Doğruluk</th><th>Karar</th><th>Kanıt tarihi</th><th>Tazelik</th><th>Kullanım sınırı</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.line}</td><td>${esc(r.source_id)}</td><td>${esc(r.name)}</td><td>${esc(r.publisher)}</td><td>${esc(r.authority_accuracy)}</td><td>${esc(r.decision)}</td><td>${esc(r.evidence_date)}</td><td>${esc(r.freshness_status)}</td><td>${esc(r.semantic_limit)}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('table').textContent=e.stack||e}}main();setInterval(main,60000);</script></body></html>
