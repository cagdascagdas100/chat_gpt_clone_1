<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_2 — Batch 205-206</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:#fff;border:1px solid #d5d8dc;padding:12px;min-width:150px}table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px}th,td{border:1px solid #d5d8dc;padding:8px;text-align:left;vertical-align:top}th{background:#edf2f7}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px}code{word-break:break-all}</style></head><body><h1>parcel_label_2 — Batch 205-206</h1><div class="warn">Araştırma adaylarıdır. SOURCE_* kimlikleri kanonik parsel değildir; kesin geometri ve parcel binding yapılmamıştır.</div><div id="cards" class="cards"></div><h2>Adaylar</h2><table><thead><tr><th>ID</th><th>Aday</th><th>Tür</th><th>Doğruluk</th><th>Resmî kaynak</th><th>Durum</th></tr></thead><tbody id="candidates"></tbody></table><h2>Satır-satır aktivite</h2><table><thead><tr><th>Başlangıç satırı</th><th>Aday</th><th>Tür</th><th>Kanıt</th></tr></thead><tbody id="activity"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Promise.all([fetch('./data/distance_property_types/parcel_label_2_candidates_batches205_206.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('candidate HTTP '+r.status);return r.json()}),fetch('./data/distance_property_types/parcel_label_2_activity_batches205_206.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('activity HTTP '+r.status);return r.json()})]).then(([c,a])=>{document.getElementById('cards').innerHTML=[['Batch','205-206'],['Aday',c.candidate_count],['Aktivite satırı',a.expanded_activity_count],['Ortalama doğruluk',c.classification_accuracy_average_percent+'%'],['Kanonik satır',0],['Kesin geometri',0]].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('candidates').innerHTML=c.candidates.map(x=>`<tr><td><code>${e(x.parcel_id)}</code></td><td>${e(x.parcel_ref)}</td><td>${e(x.selected_property_type)}</td><td>${e(x.accuracy_percent)}%</td><td><a href="${e(x.source_url)}">${e(x.source_url)}</a></td><td>${e(x.geometry_status)} / manual review</td></tr>`).join('');document.getElementById('activity').innerHTML=a.events.map(x=>`<tr><td>${e(x.start_sequence)}-${e(x.start_sequence+4)}</td><td>${e(x.subject)}</td><td>${e(x.property_type)}</td><td>${e(x.evidence)}</td></tr>`).join('')}).catch(err=>document.getElementById('error').textContent='Veri yüklenemedi: '+err.message);</script></body></html>
