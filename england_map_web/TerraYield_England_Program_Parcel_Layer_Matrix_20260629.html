<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TerraYield Parsel Katman Matrisi</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1118;--band:#111b27;--line:#2b3b50;--text:#e8eef6;--muted:#a7b5c6;--ok:#60d394;--warn:#ffca6a;--bad:#ff7b7b;--accent:#ff8a3d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;font-size:14px;letter-spacing:0}
    header{padding:16px 18px;background:#0e1722;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0}p{margin:4px 0;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:minmax(240px,360px) minmax(220px,1fr) auto auto;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--band)}
    select,input,button{min-height:38px;border:1px solid #3c4d63;background:#08111b;color:var(--text);padding:7px 10px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}
    .summary{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px}.summary-line{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #405168;padding:4px 7px;background:#0a141f}.pill.ok{border-color:#27734c;color:var(--ok)}.pill.warn{border-color:#8a6422;color:var(--warn)}.pill.bad{border-color:#8a3434;color:var(--bad)}
    .paths{font-family:Consolas,monospace;font-size:12px;color:#b8c8da;overflow-wrap:anywhere}.message{padding:10px 18px;border-bottom:1px solid var(--line);color:var(--muted)}.message.error{color:var(--bad)}
    .table-wrap{overflow:auto;height:calc(100vh - 280px);min-height:360px}table{border-collapse:collapse;min-width:1500px;width:100%;font-size:12px}th,td{border:1px solid #27384b;padding:6px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;max-width:320px}th{position:sticky;top:0;background:#18263a;color:#fff;z-index:3;text-align:left}td{background:#0f1926}tr.latest td{background:#18261f}tr.manual td{box-shadow:inset 4px 0 var(--warn)}tr.blocked td{box-shadow:inset 4px 0 var(--bad)}a{color:#8cc8ff}.badge{display:inline-block;padding:2px 5px;border:1px solid #52647b;color:#dbe7f3}.badge.latest{border-color:#2b8a58;color:var(--ok)}.badge.manual{border-color:#a97925;color:var(--warn)}.badge.blocked{border-color:#9d3c3c;color:var(--bad)}
    .pager{display:flex;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--line);background:var(--band)}.pager span{min-width:170px;color:var(--muted)}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.table-wrap{height:calc(100vh - 340px)}}
  </style>
</head>
<body>
  <header>
    <h1>TerraYield / AAYS - Parsel Katman Matrisi</h1>
    <p>Kaynaklı satırlar, kanıt yolları ve gerçek blocker durumları. Ürün final durumu kanıt oluşana kadar false kalır.</p>
  </header>
  <section class="toolbar">
    <select id="layerSelect" aria-label="Katman seçimi">
      <option value="security">Security / Public Safety</option>
      <option value="gas">Gas Emissions</option>
      <option value="distance">Parcel Label / Distance Property Types</option>
      <option value="topography">Height Difference / Topography</option>
      <option value="matrix">Tam Program Parsel Matrisi</option>
    </select>
    <input id="search" placeholder="Parsel, kaynak, durum veya kanıt ara">
    <button id="prev" type="button">Önceki</button>
    <button id="next" type="button">Sonraki</button>
  </section>
  <section class="summary">
    <h2 id="title">Yükleniyor</h2>
    <div class="summary-line" id="metrics"></div>
    <div class="paths" id="paths"></div>
  </section>
  <div class="message" id="message">Veri yükleniyor...</div>
  <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  <div class="pager"><span id="pageInfo">Sayfa 1</span><button id="refresh" type="button">Veriyi Yenile</button></div>
<script>
'use strict';
const bust=()=>`v=${Date.now()}`;
const esc=v=>String(v===null||v===undefined||v===''?'not_available':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bool=v=>v===true||String(v).toLowerCase()==='true';
const configs={
 security:{title:'Security / Public Safety - Kaynaklı Satırlar',data:'data/program_layer_matrix/security_public_safety_visible_rows.json',status:'data/program_layer_matrix/security_public_safety_visible_status.json',rowsKey:'rows',columns:[['Parsel','parcel_id'],['Security skoru (%)','security_score_percent'],['Security seviyesi','security_level'],['Doğruluk','accuracy_score_4'],['Doğruluk etiketi','accuracy_label_4'],['Güven (%)','confidence_score'],['Kaynak tarihi','source_date'],['Kaynak coğrafya','source_geography_level'],['Resmi kaynak kanıtı','official_source_evidence'],['Yerel kaynak dosyası','$source_csv'],['Eşleştirme notu','change_reason'],['Manuel inceleme','needs_manual_review'],['Son çalışmada değişti','changed_in_latest_run']]},
 gas:{title:'Gas Emissions - Kaynaklı Son Satırlar',data:'data/program_layer_matrix/gas_emissions_visible_rows_latest.json',status:'data/program_layer_matrix/gas_emissions_status_latest.json',rowsKey:'rows',columns:[['Satır','row_id|row_no'],['Yıl','calendar_year'],['Sektör','sector'],['Alt sektör','sub_sector'],['Sera gazı','greenhouse_gas'],['Emisyon (kt CO2e)','territorial_emissions_kt_co2e'],['Etki alanı (kt CO2)','scope_of_influence_kt_co2'],['Kaynak satırı','source_lines'],['Eşleştirme yöntemi','matching_method'],['Güven (%)','confidence_percent'],['Doğruluk','accuracy_score_4|gas_emission_level_accuracy'],['Kaynak URL','$source_url'],['Yerel kaynak','$source_path'],['Rapor/kanıt','$report_path'],['Manuel inceleme','needs_manual_review'],['Son çalışmada değişti','changed_in_latest_run']]},
 distance:{title:'Parcel Label / Distance Property Types - Kaynaklı Satırlar',data:'data/program_layer_matrix/distance_property_types_visible_rows_latest.json',status:'data/program_layer_matrix/distance_property_types_status_latest.json',rowsKey:'rows',columns:[['Parsel','parcel_id'],['Seçilen mülk tipi','selected_property_type'],['Renk kategorisi','selected_color_category'],['Seçilen mesafe (m)','selected_match_distance_m'],['Doğruluk','accuracy_score_4'],['Doğruluk etiketi','accuracy_label_4'],['Resmi kaynak','official_source_evidence'],['Web kanıtı','web_source_evidence'],['Harita kanıtı','map_source_evidence'],['Fotoğraf/AI kanıtı','photo_ai_evidence'],['Kaynak tarihi','source_date'],['Yerel kaynak CSV','$source_csv'],['Eşleştirme yöntemi','matching_method'],['Aday durumu','$candidate_status'],['Manuel inceleme','needs_manual_review'],['Son çalışmada değişti','changed_in_latest_run'],['Değişiklik nedeni','change_reason']]},
 topography:{title:'Height Difference / Topography - Koordinat Handoff',data:'data/program_layer_matrix/topography_coordinate_handoff_latest.json',status:null,rowsKey:'coordinates',columns:[['Parsel','parcel_id'],['Parsel ref','parcel_ref|hmlr_inspire_id'],['Enlem','centroid_lat|hmlr_lat'],['Boylam','centroid_lon|hmlr_lon'],['Koordinat durumu','coordinate_status'],['Koordinat kaynağı','source_file_path|coordinate_source'],['Kaynak satırları','source_lines'],['Yeni height difference','height_difference_m'],['Manuel inceleme','needs_manual_review'],['Blocker','$blockers'],['Son çalışmada değişti','changed_in_latest_run'],['Sahte veri','$fake_data']]}
};
let state={layer:'security',rows:[],filtered:[],data:null,status:null,page:0,pageSize:25,matrixManifest:null,matrixFilters:null};
async function getJson(path){const r=await fetch(`${path}${path.includes('?')?'&':'?'}${bust()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${path} -> HTTP ${r.status}`);return r.json()}
function valueFor(row,key,data){if(key.startsWith('$')){const clean=key.trim().slice(1);if(clean==='candidate_status'){if(bool(row.needs_manual_review))return 'NEEDS_MANUAL_REVIEW';if(bool(row.changed_in_latest_run))return 'VISIBLE_PILOT_SOURCE_BACKED';return 'VISIBLE_SOURCE_BACKED'}const v=data[clean];return Array.isArray(v)?v.join(', '):(v??'not_available')}for(const candidate of key.split('|')){if(row[candidate]!==undefined&&row[candidate]!==null&&row[candidate]!=='')return row[candidate]}return 'not_available'}
function rowClass(row){if(row.blocker&&row.blocker!=='none')return 'blocked';if(bool(row.needs_manual_review))return 'manual';if(bool(row.changed_in_latest_run))return 'latest';return ''}
function statusBadge(row){if(row.blocker&&row.blocker!=='none')return '<span class="badge blocked">BLOCKED</span>';if(bool(row.needs_manual_review))return '<span class="badge manual">MANUEL İNCELEME</span>';if(bool(row.changed_in_latest_run))return '<span class="badge latest">YENİ / LATEST</span>';return '<span class="badge">KAYNAKLI</span>'}
function renderSummary(){const d=state.data||{},s=state.status||{},cfg=configs[state.layer];document.getElementById('title').textContent=cfg?cfg.title:'Tam Program Parsel Matrisi';const blocker=s.blocker||d.bulk_blocker||d.blocker||(Array.isArray(d.blockers)?d.blockers.join(', '):null)||'none';const count=state.rows.length;const featureCount=d.geojson_feature_count??s.geojson_feature_count??'not_available';const metrics=[['Görünür satır',count,'ok'],['GeoJSON feature',featureCount,''],['Blocker',blocker,blocker==='none'?'ok':'warn'],['final_ready',String(d.final_ready===true||s.final_ready===true),d.final_ready===true||s.final_ready===true?'bad':'ok'],['fake_data',String(d.fake_data===true||s.fake_data===true),d.fake_data===true||s.fake_data===true?'bad':'ok']];document.getElementById('metrics').innerHTML=metrics.map(x=>`<span class="pill ${x[2]}">${esc(x[0])}: <strong>${esc(x[1])}</strong></span>`).join('');const paths=[`data: ${cfg?cfg.data:'chunks/manifest.json'}`,`status: ${cfg&&cfg.status?cfg.status:'same_data_or_not_required'}`,`source_url: ${d.source_url||s.source_url||'not_available'}`,`source_csv: ${d.source_csv||s.csv_path||'not_available'}`,`source_geojson: ${d.source_geojson||s.geojson_path||d.source_path||'not_available'}`,`visible_rows_path: ${s.visible_rows_path||'current_data_path'}`];document.getElementById('paths').innerHTML=paths.map(esc).join('<br>')}
function applySearch(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('tr-TR');state.filtered=q?state.rows.filter(r=>JSON.stringify(r).toLocaleLowerCase('tr-TR').includes(q)):state.rows.slice();state.page=0;renderRows()}
function renderRows(){if(state.layer==='matrix'){renderMatrixPage();return}const cfg=configs[state.layer],start=state.page*state.pageSize,rows=state.filtered.slice(start,start+state.pageSize);document.querySelector('#table thead').innerHTML='<tr><th>Durum</th>'+cfg.columns.map(c=>`<th>${esc(c[0])}</th>`).join('')+'</tr>';document.querySelector('#table tbody').innerHTML=rows.map(r=>`<tr class="${rowClass(r)}"><td>${statusBadge(r)}</td>${cfg.columns.map(c=>`<td>${esc(valueFor(r,c[1],state.data))}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="30">Eşleşen satır yok.</td></tr>';const pages=Math.max(1,Math.ceil(state.filtered.length/state.pageSize));document.getElementById('pageInfo').textContent=`Sayfa ${state.page+1} / ${pages} - ${state.filtered.length} satır`;document.getElementById('message').className='message';document.getElementById('message').textContent=`${cfg.title}: veri ve kaynak yolları yüklendi.`}
async function loadLayer(layer){state.layer=layer;state.page=0;document.getElementById('message').className='message';document.getElementById('message').textContent='Veri yükleniyor...';try{if(layer==='matrix'){await loadMatrix();return}const cfg=configs[layer];const values=await Promise.all([getJson(cfg.data),cfg.status?getJson(cfg.status).catch(e=>({status_fetch_error:e.message})):Promise.resolve({})]);state.data=values[0];state.status=values[1];state.rows=Array.isArray(state.data[cfg.rowsKey])?state.data[cfg.rowsKey]:(Array.isArray(state.data.rows)?state.data.rows:(Array.isArray(state.data.changes)?state.data.changes:[]));state.filtered=state.rows.slice();renderSummary();renderRows()}catch(e){state.rows=[];state.filtered=[];document.getElementById('message').className='message error';document.getElementById('message').textContent=`Yükleme hatası: ${e.message}`;document.querySelector('#table thead').innerHTML='';document.querySelector('#table tbody').innerHTML=''} }
async function loadMatrix(){state.matrixManifest=await getJson('chunks/manifest.json');state.matrixFilters=await getJson('chunks/filter_indexes.json');const key='all';const pages=state.matrixFilters[key]||[];state.rows=pages;state.filtered=pages;state.data={final_ready:false,fake_data:false};state.status={blocker:'none'};renderSummary();await renderMatrixPage()}
async function renderMatrixPage(){const pages=state.filtered.length?state.filtered:[0];const idx=Math.min(state.page,pages.length-1);const pageNo=pages[idx]??idx;try{const chunk=await getJson(`chunks/page_${String(pageNo).padStart(6,'0')}.json`),rows=chunk.rows||[];const base=state.matrixManifest.base_columns||[],groups=state.matrixManifest.groups||[];let head='<tr>'+base.map(c=>`<th>${esc(c[0])}</th>`).join('');for(const g of groups)for(const f of g[1])head+=`<th>${esc(f[0])} - Çıktı</th><th>${esc(f[0])} - Kaynak/Kanıt</th><th>${esc(f[0])} - Doğruluk</th>`;head+='</tr>';document.querySelector('#table thead').innerHTML=head;document.querySelector('#table tbody').innerHTML=rows.map(r=>{let cells=base.map(c=>`<td>${esc(r[c[1]])}</td>`).join('');for(const g of groups)for(const f of g[1]){const cell=(r.outputs||{})[f[1]]||{};cells+=`<td>${esc(cell.value)}</td><td>${esc(cell.source)}</td><td>${esc(cell.accuracy)}</td>`}return `<tr>${cells}</tr>`}).join('');document.getElementById('pageInfo').textContent=`Chunk ${pageNo} - ${rows.length} satır`;document.getElementById('message').textContent='Tam parsel matrisi canonical chunk dosyasından yüklendi.'}catch(e){document.getElementById('message').className='message error';document.getElementById('message').textContent=`Matrix chunk hatası: ${e.message}`}}
document.getElementById('layerSelect').addEventListener('change',e=>loadLayer(e.target.value));document.getElementById('search').addEventListener('input',applySearch);document.getElementById('prev').addEventListener('click',()=>{if(state.page>0){state.page--;renderRows()}});document.getElementById('next').addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(state.filtered.length/state.pageSize));if(state.page+1<pages||state.layer==='matrix'&&state.page+1<state.filtered.length){state.page++;renderRows()}});document.getElementById('refresh').addEventListener('click',()=>loadLayer(state.layer));
loadLayer('security');
</script>
</body>
</html>
