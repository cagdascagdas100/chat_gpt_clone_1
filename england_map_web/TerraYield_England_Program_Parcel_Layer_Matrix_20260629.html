<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TerraYield Parsel Katman Matrisi</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1118;--band:#111b27;--line:#2b3b50;--text:#e8eef6;--muted:#a7b5c6;--ok:#60d394;--warn:#ffca6a;--bad:#ff7b7b;--accent:#ff8a3d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;font-size:14px;letter-spacing:0}
    header{padding:16px 18px;background:#0e1722;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0}p{margin:4px 0;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:minmax(220px,320px) minmax(220px,1fr) minmax(180px,230px) minmax(180px,230px) auto auto;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--band)}
    select,input,button{min-height:38px;border:1px solid #3c4d63;background:#08111b;color:var(--text);padding:7px 10px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}
    .summary{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px}.summary-line{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #405168;padding:4px 7px;background:#0a141f}.pill.ok{border-color:#27734c;color:var(--ok)}.pill.warn{border-color:#8a6422;color:var(--warn)}.pill.bad{border-color:#8a3434;color:var(--bad)}
    .paths{font-family:Consolas,monospace;font-size:12px;color:#b8c8da;overflow-wrap:anywhere}.message{padding:10px 18px;border-bottom:1px solid var(--line);color:var(--muted)}.message.error{color:var(--bad)}
    .table-wrap{overflow:auto;height:calc(100vh - 280px);min-height:360px}table{border-collapse:collapse;min-width:1900px;width:100%;font-size:12px}th,td{border:1px solid #27384b;padding:6px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;max-width:340px}th{position:sticky;top:0;background:#18263a;color:#fff;z-index:3;text-align:left}td{background:#0f1926}tr.latest td{background:#153025}tr.pending td{background:#252516}tr.manual td{box-shadow:inset 4px 0 var(--warn)}tr.blocked td{box-shadow:inset 4px 0 var(--bad)}a{color:#8cc8ff}.badges{display:flex;flex-wrap:wrap;gap:4px;min-width:130px}.badge{display:inline-block;padding:2px 5px;border:1px solid #52647b;color:#dbe7f3}.badge.latest{border-color:#2b8a58;color:var(--ok)}.badge.pending{border-color:#4e79a7;color:#9ac8ff}.badge.manual{border-color:#a97925;color:var(--warn)}.badge.blocked{border-color:#9d3c3c;color:var(--bad)}.badge.meta{border-color:#59697b;color:#bdcad8}.path-value{font-family:Consolas,monospace;font-size:11px}.path-state{display:block;margin-top:4px}.path-state.ok{color:var(--ok)}.path-state.missing{color:var(--warn)}
    .pager{display:flex;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--line);background:var(--band)}.pager span{min-width:170px;color:var(--muted)}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.table-wrap{height:calc(100vh - 340px)}}
  </style>
</head>
<body>
  <header>
    <h1>TerraYield / AAYS - Parsel Katman Matrisi</h1>
    <p>Kaynaklı satırlar, kanıt yolları ve gerçek blocker durumları. Ürün final durumu kanıt oluşana kadar false kalır.</p>
  </header>
  <section class="toolbar">
    <select id="layerSelect" aria-label="Katman seçimi">
      <option value="security">Security / Public Safety</option>
      <option value="gas">Gas Emissions</option>
      <option value="distance">Parcel Label / Distance Property Types</option>
      <option value="topography">Height Difference / Topography</option>
      <option value="matrix">Tam Program Parsel Matrisi</option>
    </select>
    <input id="search" placeholder="Parsel, kaynak, durum veya kanıt ara">
    <select id="statusFilter" aria-label="Durum filtresi">
      <option value="all">Tüm durumlar</option>
      <option value="latest">Yalnız yeni / latest</option>
      <option value="pending">Yalnız pending / queued</option>
      <option value="visible">Yalnız görünür / kaynaklı</option>
      <option value="manual">Yalnız manuel inceleme</option>
      <option value="missing">Yalnız eksik kanıt</option>
      <option value="completed">Yalnız completed</option>
    </select>
    <select id="viewSelect" aria-label="Topography görünümü">
      <option value="parcel">Parsel sonuçları</option>
      <option value="new_operations">Yeni işlemler</option>
      <option value="all_operations">Tüm işlemler</option>
      <option value="blockers">Blocker işlemleri</option>
    </select>
    <button id="prev" type="button">Önceki</button>
    <button id="next" type="button">Sonraki</button>
  </section>
  <section class="summary">
    <h2 id="title">Yükleniyor</h2>
    <div class="summary-line" id="metrics"></div>
    <div class="paths" id="paths"></div>
  </section>
  <div class="message" id="message">Veri yükleniyor...</div>
  <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  <div class="pager"><span id="pageInfo">Sayfa 1</span><button id="refresh" type="button">Veriyi Yenile</button></div>
<script>
'use strict';
const bust=()=>`v=${Date.now()}`;
const esc=v=>String(v===null||v===undefined||v===''?'not_available':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bool=v=>v===true||String(v).toLowerCase()==='true';
const configs={
 security:{title:'Security / Public Safety - Satır Bazlı Kaynak ve Kanıt',data:'data/program_layer_matrix/security_public_safety_visible_rows.json',status:'data/program_layer_matrix/security_public_safety_visible_status.json',rowsKey:'rows',columns:[['Batch ID','batch_id'],['Parsel','parcel_id'],['Security skoru (%)','security_score_percent'],['Security seviyesi','security_level'],['Doğruluk','accuracy_score_4'],['Güven (%)','confidence_score'],['İlk görülme','first_seen_at'],['Son doğrulama','last_verified_at'],['Resmi kaynak URL','source_url'],['Resmi kaynak kanıtı','official_source_evidence'],['CSV artifact','source_path'],['GeoJSON / kanıt','evidence_path'],['Manifest','source_manifest_path'],['Rapor','report_path'],['Aday durumu','candidate_status'],['Manuel inceleme','needs_manual_review']]},
 gas:{title:'Gas Emissions - Kaynaklı Son Satırlar',data:'data/program_layer_matrix/gas_emissions_visible_rows_latest.json',status:'data/program_layer_matrix/gas_emissions_status_latest.json',rowsKey:'rows',columns:[['Satır','row_id|row_no'],['Yıl','calendar_year'],['Sektör','sector'],['Alt sektör','sub_sector'],['Sera gazı','greenhouse_gas'],['Emisyon (kt CO2e)','territorial_emissions_kt_co2e'],['Etki alanı (kt CO2)','scope_of_influence_kt_co2'],['Kaynak satırı','source_lines'],['Eşleştirme yöntemi','matching_method'],['Hesap açıklaması','calculation_explanation'],['Parcel binding','parcel_binding_status'],['Güven (%)','confidence_percent'],['Doğruluk','accuracy_score_4|gas_emission_level_accuracy'],['Resmi kaynak URL','source_url'],['Ham yerel kaynak','source_local_raw_path'],['Visible artifact','visible_rows_artifact_path'],['Status yolu','status_path'],['Rapor yolu','report_path'],['Served commit','served_commit_sha'],['Artifact SHA','artifact_sha'],['Manuel inceleme','needs_manual_review']]},
 distance:{title:'Parcel Label / Distance Property Types - Tüm İzlenen Satırlar',data:'data/program_layer_matrix/distance_property_types_all_rows_latest.json',status:'data/program_layer_matrix/distance_property_types_status_latest.json',rowsKey:'rows',columns:[['Aday durumu','candidate_status'],['Batch','batch_id'],['Task ID','task_id'],['Parsel','parcel_id'],['Parsel ref','parcel_ref'],['Seçilen mülk tipi','selected_property_type'],['Renk kategorisi','selected_color_category'],['Mesafe (m)','selected_match_distance_m'],['Doğruluk','accuracy_score_4'],['Resmi kaynak URL','source_url'],['Resmi kaynak kanıtı','official_source_evidence'],['Web kanıtı','web_source_evidence'],['Harita kanıtı','map_source_evidence'],['Payload','payload_path'],['Queue','queue_task_path'],['Kaynak dosyası','source_path'],['Yerel kaynak','local_source_path'],['Rapor','report_path'],['Kanıt','evidence_path'],['Runner output','runner_output_path'],['Manuel inceleme','needs_manual_review']]},
 topography:{title:'Height Difference / Topography - Güncel İşlem ve Kaynak Satırları',data:'data/program_layer_matrix/topography_visible_rows_latest.json',status:'data/program_layer_matrix/topography_visible_status_latest.json',rowsKey:'rows',columns:[['İşlem durumu','display_badge'],['Task ID','task_id'],['Güncelleme zamanı','updated_at'],['Parsel','parcel_id'],['Parsel ref','parcel_ref'],['Enlem','centroid_lat'],['Boylam','centroid_lon'],['BNG tile','bng_tile'],['Koordinat durumu','coordinate_status'],['Koordinat kaynağı','coordinate_source_path'],['Kaynak satırları','coordinate_source_lines'],['Boundary durumu','boundary_status'],['Sampling durumu','sampling_status'],['DEM/LiDAR ürün adı','dem_lidar_product_name'],['Dataset','copdem_dataset'],['Product type','copdem_product_type'],['Grid ID','copdem_grid_id'],['Deniz seviyesi elevation','elevation_sea_level_m'],['Bölgesel ortalama','regional_average_elevation_m'],['Height difference','elevation_difference_regional_average_m'],['Kaynak URL','source_url'],['Repo kaynak dosyası','source_file_path'],['Yerel kaynak dosyası','local_source_path'],['Rapor yolu','report_path'],['Status yolu','status_path'],['Queue yolu','queue_path'],['Commit SHA','commit_sha'],['Güven (%)','confidence_percent'],['Doğruluk','accuracy_score_4'],['Blocker','blocker'],['Manuel inceleme','needs_manual_review']]}
};
let state={layer:'security',rows:[],filtered:[],data:null,status:null,page:0,pageSize:25,matrixManifest:null,matrixFilters:null};
async function getJson(path){const r=await fetch(`${path}${path.includes('?')?'&':'?'}${bust()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${path} -> HTTP ${r.status}`);return r.json()}
function valueFor(row,key,data){if(key.startsWith('$')){const clean=key.trim().slice(1),v=data[clean];return Array.isArray(v)?v.join(', '):(v??'not_available')}for(const candidate of key.split('|')){if(row[candidate]!==undefined&&row[candidate]!==null&&row[candidate]!=='')return row[candidate]}return 'not_available'}
const isLatest=row=>bool(row.is_new_in_latest_batch)||bool(row.new_this_run)||bool(row.changed_in_latest_run);
const stateText=row=>[row.display_badge,row.candidate_status,row.run_status,row.status,row.blocker].filter(Boolean).join(' ').toLowerCase();
const isPending=row=>/pending|queued|waiting|bekliyor/.test(stateText(row));
const isCompleted=row=>/completed_visible|\bcompleted\b|vision_compared/.test(stateText(row));
const isVisible=row=>/visible|kaynakli|source_backed|verified/.test(stateText(row));
const hasMissing=row=>/not_available|not_downloaded|missing/.test(JSON.stringify(row).toLowerCase());
function rowClass(row){return [isLatest(row)?'latest':'',isPending(row)?'pending':'',bool(row.needs_manual_review)?'manual':'',row.blocker&&row.blocker!=='none'?'blocked':''].filter(Boolean).join(' ')}
function statusBadges(row){const badges=[];const main=row.display_badge||row.candidate_status||row.run_status;if(main)badges.push(`<span class="badge meta">${esc(main)}</span>`);if(isLatest(row))badges.push('<span class="badge latest">YENİ / LATEST</span>');if(isPending(row))badges.push('<span class="badge pending">PENDING / QUEUED</span>');if(bool(row.needs_manual_review))badges.push('<span class="badge manual">MANUEL İNCELEME</span>');if(row.blocker&&row.blocker!=='none')badges.push('<span class="badge blocked">BLOCKED</span>');if(!badges.length)badges.push('<span class="badge">KAYNAKLI / MEVCUT</span>');return `<div class="badges">${badges.join('')}</div>`}
function webRelative(value){const text=String(value||'');if(text.startsWith('england_map_web/'))return text.slice('england_map_web/'.length);if(text.startsWith('data/'))return text;return null}
function isPathKey(key){return /url|path|artifact|manifest|evidence/i.test(key)}
function cellFor(row,key,data){const value=valueFor(row,key,data);if(/url/i.test(key)&&/^https?:\/\//i.test(String(value)))return `<a href="${esc(value)}" target="_blank" rel="noopener">${esc(value)}</a>`;if(isPathKey(key)){const rel=webRelative(value);if(rel)return `<span class="path-value"><a data-artifact-link="true" href="${esc(rel)}" target="_blank" rel="noopener">${esc(value)}</a><span class="path-state ok">BROWSER LINK</span></span>`;const missing=/not_available|not_downloaded|missing/i.test(String(value));return `<span class="path-value">${esc(value)}<span class="path-state ${missing?'missing':''}">${missing?'MISSING / NOT DOWNLOADED':'REPO PATH'}</span></span>`}return esc(value)}
function renderSummary(){const d=state.data||{},s=state.status||{},cfg=configs[state.layer];document.getElementById('title').textContent=cfg?cfg.title:'Tam Program Parsel Matrisi';const blockers=s.blockers||d.blockers;const blocker=s.blocker||d.bulk_blocker||d.blocker||(Array.isArray(blockers)?blockers.join(', '):null)||'none';const featureCount=d.verified_geojson_features??s.verified_geojson_features??d.geojson_feature_count??s.geojson_feature_count??'not_available';const newCount=d.new_rows_in_latest_batch??s.new_rows_in_latest_batch??d.latest_batch_count??s.latest_batch_count??d.new_operations_count??s.new_operations_count??0;const pending=d.pending_runner_count??s.pending_runner_count??'not_available';const manual=d.manual_review_count??s.manual_review_count??state.rows.filter(r=>bool(r.needs_manual_review)).length;const metrics=[['Görünür / izlenen satır',state.rows.length,'ok'],['GeoJSON feature',featureCount,featureCount==='not_available'?'warn':'ok'],['Yeni / latest',newCount,newCount?'ok':''],['Pending runner',pending,pending==='not_available'?'':'warn'],['Manuel inceleme',manual,manual?'warn':'ok'],['Batch',d.latest_batch_id??s.latest_batch_id??d.latest_task_id??s.latest_task_id??'not_available',''],['Blocker',blocker,blocker==='none'?'ok':'warn'],['final_ready',String(d.final_ready===true||s.final_ready===true),d.final_ready===true||s.final_ready===true?'bad':'ok'],['fake_data',String(d.fake_data===true||s.fake_data===true),d.fake_data===true||s.fake_data===true?'bad':'ok']];document.getElementById('metrics').innerHTML=metrics.map(x=>`<span class="pill ${x[2]}">${esc(x[0])}: <strong>${esc(x[1])}</strong></span>`).join('');const paths=[['data',cfg?cfg.data:'chunks/manifest.json'],['status',cfg&&cfg.status?cfg.status:'not_available'],['source_url',d.source_url||s.source_url||'not_available'],['source_csv',d.source_csv||s.csv_path||d.source_local_raw_path||s.source_local_raw_path||'not_available'],['source_geojson',d.source_geojson||s.geojson_path||d.source_path||'not_available'],['visible_rows_path',s.visible_rows_path||d.visible_rows_artifact_path||d.all_rows_path||'current_data_path'],['source_manifest_path',d.source_manifest_path||s.source_manifest_path||'not_available'],['served_commit_sha',d.served_commit_sha||s.served_commit_sha||'not_available'],['artifact_sha',d.artifact_sha||s.artifact_sha||'not_available']];document.getElementById('paths').innerHTML=paths.map(([k,v])=>`${esc(k)}: ${isPathKey(k)?cellFor({[k]:v},k,{}):esc(v)}`).join('<br>')}
function applySearch(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('tr-TR'),filter=document.getElementById('statusFilter').value;state.filtered=state.rows.filter(row=>{if(q&&!JSON.stringify(row).toLocaleLowerCase('tr-TR').includes(q))return false;if(filter==='latest')return isLatest(row);if(filter==='pending')return isPending(row);if(filter==='visible')return isVisible(row);if(filter==='manual')return bool(row.needs_manual_review);if(filter==='missing')return hasMissing(row);if(filter==='completed')return isCompleted(row);return true});state.page=0;renderRows()}
function renderRows(){if(state.layer==='matrix'){renderMatrixPage();return}const cfg=configs[state.layer],start=state.page*state.pageSize,rows=state.filtered.slice(start,start+state.pageSize);document.querySelector('#table thead').innerHTML='<tr><th>Durum</th>'+cfg.columns.map(c=>`<th>${esc(c[0])}</th>`).join('')+'</tr>';document.querySelector('#table tbody').innerHTML=rows.map(r=>`<tr class="${rowClass(r)}"><td>${statusBadges(r)}</td>${cfg.columns.map(c=>`<td>${cellFor(r,c[1],state.data)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="40">Eşleşen satır yok.</td></tr>';const pages=Math.max(1,Math.ceil(state.filtered.length/state.pageSize));document.getElementById('pageInfo').textContent=`Sayfa ${state.page+1} / ${pages} - ${state.filtered.length} satır`;document.getElementById('message').className='message';document.getElementById('message').textContent=`${cfg.title}: veri, durum ve kaynak yolları yüklendi.`}
async function loadLayer(layer){state.layer=layer;state.page=0;document.getElementById('statusFilter').value='all';document.getElementById('message').className='message';document.getElementById('message').textContent='Veri yükleniyor...';try{if(layer==='matrix'){await loadMatrix();return}const cfg=configs[layer];const values=await Promise.all([getJson(cfg.data),cfg.status?getJson(cfg.status).catch(e=>({status_fetch_error:e.message})):Promise.resolve({})]);state.data=values[0];state.status=values[1];state.rows=Array.isArray(state.data[cfg.rowsKey])?state.data[cfg.rowsKey]:(Array.isArray(state.data.rows)?state.data.rows:(Array.isArray(state.data.changes)?state.data.changes:[]));state.filtered=state.rows.slice();renderSummary();renderRows()}catch(e){state.rows=[];state.filtered=[];document.getElementById('message').className='message error';document.getElementById('message').textContent=`Yükleme hatası: ${e.message}`;document.querySelector('#table thead').innerHTML='';document.querySelector('#table tbody').innerHTML=''} }
async function loadMatrix(){state.matrixManifest=await getJson('chunks/manifest.json');state.matrixFilters=await getJson('chunks/filter_indexes.json');const key='all';const pages=state.matrixFilters[key]||[];state.rows=pages;state.filtered=pages;state.data={final_ready:false,fake_data:false};state.status={blocker:'none'};renderSummary();await renderMatrixPage()}
async function renderMatrixPage(){const pages=state.filtered.length?state.filtered:[0];const idx=Math.min(state.page,pages.length-1);const pageNo=pages[idx]??idx;try{const chunk=await getJson(`chunks/page_${String(pageNo).padStart(6,'0')}.json`),rows=chunk.rows||[];const base=state.matrixManifest.base_columns||[],groups=state.matrixManifest.groups||[];let head='<tr>'+base.map(c=>`<th>${esc(c[0])}</th>`).join('');for(const g of groups)for(const f of g[1])head+=`<th>${esc(f[0])} - Çıktı</th><th>${esc(f[0])} - Kaynak/Kanıt</th><th>${esc(f[0])} - Doğruluk</th>`;head+='</tr>';document.querySelector('#table thead').innerHTML=head;document.querySelector('#table tbody').innerHTML=rows.map(r=>{let cells=base.map(c=>`<td>${esc(r[c[1]])}</td>`).join('');for(const g of groups)for(const f of g[1]){const cell=(r.outputs||{})[f[1]]||{};cells+=`<td>${esc(cell.value)}</td><td>${esc(cell.source)}</td><td>${esc(cell.accuracy)}</td>`}return `<tr>${cells}</tr>`}).join('');document.getElementById('pageInfo').textContent=`Chunk ${pageNo} - ${rows.length} satır`;document.getElementById('message').textContent='Tam parsel matrisi canonical chunk dosyasından yüklendi.'}catch(e){document.getElementById('message').className='message error';document.getElementById('message').textContent=`Matrix chunk hatası: ${e.message}`}}
document.getElementById('layerSelect').addEventListener('change',e=>loadLayer(e.target.value));document.getElementById('search').addEventListener('input',applySearch);document.getElementById('statusFilter').addEventListener('change',applySearch);document.getElementById('prev').addEventListener('click',()=>{if(state.page>0){state.page--;renderRows()}});document.getElementById('next').addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(state.filtered.length/state.pageSize));if(state.page+1<pages||state.layer==='matrix'&&state.page+1<state.filtered.length){state.page++;renderRows()}});document.getElementById('refresh').addEventListener('click',()=>loadLayer(state.layer));
configs.topography.operations='data/program_layer_matrix/topography_operations_latest.json';
configs.security.operations='data/program_layer_matrix/security_public_safety_operations_latest.json';
configs.gas.operations='data/program_layer_matrix/gas_emissions_pipeline_latest.json';
configs.security.columns.unshift(['İşlem tipi','operation_type'],['Aşama','stage'],['İşlem durumu','status']);
configs.gas.columns.push(['Resmi CSV eşleşmesi','official_csv_evidence_status'],['Kaynak SHA-256','source_sha256'],['Kaynak manifesti','source_manifest_path'],['Satır kanıtı','row_evidence_path'],['Pipeline','pipeline_path'],['Blocker','blocker']);
configs.distance.columns.unshift(['Değişiklik','change_kind'],['Artifact index','artifact_index_path']);
configs.topography.columns.unshift(['İşlem tipi','operation_type'],['Aşama','stage'],['Dataset','dataset'],['İstek durumu','request_status'],['Sayısal örnek durumu','numeric_sample_status']);
state.operations=[];
const baseLoadLayer=loadLayer;
loadLayer=async function(layer){await baseLoadLayer(layer);if(state.status&&state.status.bulk_blocker){state.status.blocker=state.status.bulk_blocker;renderSummary()}const cfg=configs[layer];if(cfg&&cfg.operations){try{const operationDoc=await getJson(cfg.operations);state.operations=Array.isArray(operationDoc.operations)?operationDoc.operations:(Array.isArray(operationDoc.stages)?operationDoc.stages:[])}catch(e){state.operations=[];state.status.operations_fetch_error=e.message}}};
function applyView(){const view=document.getElementById('viewSelect').value;if(view==='parcel'||!configs[state.layer]||!configs[state.layer].operations){state.rows=Array.isArray(state.data&&state.data.rows)?state.data.rows:[]}else if(view==='new_operations'){state.rows=state.operations.filter(x=>bool(x.is_new_operation))}else if(view==='blockers'){state.rows=state.operations.filter(x=>/blocked|failed|unavailable|request_failed|not_downloaded/i.test(String(x.status)+' '+String(x.blocker)))}else{state.rows=state.operations.slice()}state.filtered=state.rows.slice();state.page=0;renderSummary();renderRows()}
document.getElementById('viewSelect').addEventListener('change',applyView);
loadLayer('security');
</script>
</body>
</html>
