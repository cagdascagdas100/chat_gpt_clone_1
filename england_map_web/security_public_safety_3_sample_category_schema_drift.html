<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategori şema drift</title><style>body{font-family:system-ui;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}th{background:#eef1f4}</style></head><body><h1>Ay-bazlı suç kategorisi şema drift koruması</h1><div id="summary" class="grid"></div><div id="table"></div><script>const e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const c=(l,v,k='')=>`<div class="card"><div>${e(l)}</div><div class="value ${k}">${e(v)}</div></div>`;async function main(){const r=await fetch('data/security_public_safety/security_public_safety_3_sample_category_schema_drift_latest.json',{cache:'no-store'});const d=await r.json();document.getElementById('summary').innerHTML=c('Kanıt ayı',d.evidence_month)+c('Satır',d.row_count)+c('Hazır',d.pass_or_guard_ready,'ok')+c('Runtime bloklu',d.blocked_runtime,d.blocked_runtime?'bad':'ok')+c('Yayımlanan skor',d.published_score_rows||0);document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>Parsel</th><th>Kontrol</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td>${x.line}</td><td>${e(x.parcel_id)}</td><td>${e(x.check)}</td><td class="${x.status==='BLOCKED_RUNTIME'?'bad':'ok'}"><b>${e(x.status)}</b></td><td>${e(x.evidence)}</td></tr>`).join('')}</tbody></table>`}main();setInterval(main,60000);</script></body></html>
