arılan',d.summary.failed_exact_historic_alternatives_excluded],['Doğrulanmış değişim',d.summary.verified_replacements]].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');routes.innerHTML=d.routes.map(r=>`<tr><td>${e(r.row)}</td><td><code>${e(r.source_code)}</code></td><td>${e(r.domain)}</td><td>${e(r.route)}</td><td>${e(r.note)}</td><td class="pass">${e(r.result)}</td></tr>`).join('');excluded.innerHTML=d.excluded.map(x=>`<tr><td><code>${e(x.candidate_id)}</code></td><td>${e(x.name)}</td><td>${e(x.reason)}</td><td><code>${e(x.replacement_id)}</code><br>${e(x.replacement_name)}</td></tr>`).join('')}).catch(x=>error.textContent='Route denetimi yüklenemedi: '+x.message);</script></body></html>
