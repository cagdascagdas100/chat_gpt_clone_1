<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_3 Batch 15</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f8fa;color:#111;line-height:1.4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border:1px solid #bbb;border-radius:8px;padding:12px}.v{font-size:22px;font-weight:700}table{border-collapse:collapse;width:100%;background:#fff;margin:18px 0}th,td{border:1px solid #bbb;padding:7px;text-align:left;vertical-align:top}th{background:#eef1f4}.ok{color:#087f23;font-weight:700}.bad{color:#a00;font-weight:700}.muted{color:#555}code{word-break:break-all}</style></head><body><h1>height_difference_3 — Batch 15</h1><p>Exact kanonik blob hidratasyonu, tek-pass zincir, epoch kapısı ve resmî doğruluk kaynakları. Gerçek hedef satırları fail-closed tutulur.</p><div class="cards" id="cards"></div><p class="bad" id="blocker"></p><div id="tables"></div><script>
const base='data/height_difference/';
const files={sources:'height_difference_3_source_candidates_batch_15.json',contract:'height_difference_3_single_pass_chain_contract_batch_15.json',tests:'height_difference_3_single_pass_chain_tests_batch_15.json',examples:'height_difference_3_single_pass_chain_examples_batch_15.json',operations:'height_difference_3_operations_batch_15.json',readback:'height_difference_3_operations_batch_15_readback.json',chain:'height_difference_3_chain_orchestration_latest.json'};
const safe=async name=>{try{const r=await fetch(base+files[name],{cache:'no-store'});if(!r.ok)return null;return await r.json()}catch{return null}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(title,cols,rows)=>`<h2>${esc(title)} <span class="muted">(${rows.length})</span></h2><table><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof c[1]==='function'?c[1](r):r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
Promise.all(Object.keys(files).map(async k=>[k,await safe(k)])).then(items=>{const d=Object.fromEntries(items);const src=d.sources||{};const contract=d.contract||{};const tests=d.tests||{};const examples=d.examples||{};const ops=[...((d.operations||{}).rows||[]),...((d.readback||{}).rows||[])];const chain=d.chain||{};const sourceRows=src.official_sources||[];const candidates=src.source_chain_candidates||[];const gateRows=contract.rows||[];const testRows=tests.tests||[];const exampleRows=examples.rows||[];const visible=sourceRows.length+candidates.length+gateRows.length+testRows.length+exampleRows.length+ops.length;const cardData=[['Resmî kaynak',sourceRows.length],['Aday',candidates.length],['Kapı',gateRows.length],['Test',(tests.passed_count||0)+' / '+(tests.test_count||0)],['Örnek',exampleRows.length],['İşlem',ops.length],['Görünür satır',visible],['Gerçek Point',chain.canonical_point_output_exists?3:0]];cards.innerHTML=cardData.map(x=>`<div class="card"><div>${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');blocker.textContent=chain.state?`Zincir durumu: ${chain.state}`:'Shared runner zincir raporu henüz oluşmadı; gerçek hedef satırı yok.';let out='';out+=table('Resmî kaynaklar',[['Kaynak','source_id'],['Kurum','authority'],['Doğrulanan bilgi','verified_fact'],['Hazırlık','source_readiness_score'],['Sınırlama','limitation']],sourceRows);out+=table('Aday zincirler',[['Aday','candidate_id'],['Sınır', 'boundary_source'],['Yükseklik','elevation_source'],['Hazırlık','readiness_score'],['Durum','status']],candidates);out+=table('Tek-pass kabul kapıları',[['Kapı','gate_id'],['Aşama','phase'],['Kural','requirement'],['Durum','status'],['Hata kodu','fail_code']],gateRows);out+=table('Testler',[['Test','test_id'],['Ad','name'],['Sonuç',r=>r.passed?'PASS':'FAIL'],['Sözleşme','verified_contract']],testRows);out+=table('Hazır örnekler',[['Örnek','row_id'],['Aşama','stage'],['Girdi','input_state'],['Beklenen işlem','expected_action'],['Durum','result_state']],exampleRows);out+=table('İşlemler',[['Satır','line'],['İşlem','operation'],['Kapsam','scope'],['Durum','status'],['Sonuç','result']],ops);tables.innerHTML=out;}).catch(e=>{blocker.textContent='Sayfa verileri yüklenemedi: '+e.message});
</script></body></html>
