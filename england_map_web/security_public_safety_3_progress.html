<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety Slot 3</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}h1{margin:0 0 8px}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff;margin:10px 0 24px}th,td{border:1px solid #ddd;padding:7px;text-align:left;font-size:13px;vertical-align:top}th{background:#eef1f4;position:sticky;top:0}.section{margin-top:26px}.error{white-space:pre-wrap;background:#fee;border:1px solid #f99;padding:12px;border-radius:8px}.scroll{overflow:auto;max-height:70vh}.gate{font-weight:700}.url{max-width:320px;word-break:break-all}</style></head><body><h1>security_public_safety_3</h1><div class="muted">Parsel aralığı 61.523–92.283 · doğrulanmamış skorlar kabul edilmez · otomatik yenileme 60 saniye</div><div id="summary" class="grid"></div><div id="blockers"></div><section class="section"><h2>Parsel adayları ve dört kabul kapısı</h2><div id="rows" class="scroll"></div></section><section class="section"><h2>Resmî kaynak adayları, tarihler ve kullanım sınırları</h2><div id="sources" class="scroll"></div></section><script>const base='data/security_public_safety/';async function load(name){const r=await fetch(base+name,{cache:'no-store'});if(!r.ok)throw new Error(name+' HTTP '+r.status);return r.json()}function card(label,value,cls=''){return `<div class="card"><div class="muted">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function gate(v){return `<span class="gate ${v?'ok':'warn'}">${v?'GEÇTİ':'BEKLİYOR'}</span>`}function rowsTable(rows){return `<table><thead><tr><th>Satır</th><th>Parsel</th><th>Durum</th><th>Kanonik</th><th>Crime API</th><th>Outcomes API</th><th>IoD2025 v2</th><th>Doğruluk /4</th><th>Skor</th><th>İnceleme</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.line)}</td><td>${esc(r.parcel_id)}</td><td>${esc(r.candidate_status)}</td><td>${gate(r.canonical_gate)}</td><td>${gate(r.crime_api_gate)}</td><td>${gate(r.outcomes_api_gate)}</td><td>${gate(r.iod25_gate)}</td><td>${esc(r.accuracy_score_4)}</td><td>${esc(r.security_score_percent)}</td><td>${esc(r.needs_manual_review)}</td></tr>`).join('')}</tbody></table>`}function sourcesTable(rows){return `<table><thead><tr><th>Satır</th><th>Kaynak</th><th>Ad</th><th>Yayıncı</th><th>Doğruluk</th><th>Karar</th><th>Kanıt tarihi</th><th>Tazelik</th><th>Kullanım sınırı</th><th>Resmî URL</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.line)}</td><td>${esc(r.source_id)}</td><td>${esc(r.name)}</td><td>${esc(r.publisher)}</td><td>${esc(r.authority_accuracy)}</td><td>${esc(r.decision)}</td><td>${esc(r.evidence_date)}</td><td>${esc(r.freshness_status)}</td><td>${esc(r.semantic_limit)}</td><td class="url"><a href="${esc(r.official_url)}" target="_blank" rel="noopener">${esc(r.official_url)}</a></td></tr>`).join('')}</tbody></table>`}async function main(){try{const [p,r,s]=await Promise.all([load('security_public_safety_3_progress_latest.json'),load('security_public_safety_3_rows_latest.json'),load('security_public_safety_3_source_candidates_latest.json')]);document.getElementById('summary').innerHTML=card('Genel ilerleme','%'+p.overall_progress_percent,'ok')+card('Artış','+'+p.progress_delta_percent+'%','ok')+card('İşlemler',p.completed_operations+' / '+p.total_operations)+card('Hazır parsel',p.visible_parcel_rows)+card('4/4 doğrulanmış',p.accuracy_score_4_rows,p.accuracy_score_4_rows?'ok':'warn')+card('Yükseltilen kaynak',p.promoted_sources,'ok')+card('Tazeliği yeniden doğrulanan',p.source_freshness_reverified_count,'ok')+card('Runner heartbeat',p.runner_heartbeat_fresh?'taze':'eski',p.runner_heartbeat_fresh?'ok':'bad');document.getElementById('blockers').innerHTML='<div class="card"><b>Engeller</b><ul>'+p.blockers.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="muted">Kuyruk: '+esc(p.queue_task)+'</div><div class="muted">Beklenen çıktı: '+esc(p.expected_output)+'</div></div>';document.getElementById('rows').innerHTML=rowsTable(r.rows);document.getElementById('sources').innerHTML=sourcesTable(s.rows)}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="error">'+esc(e.stack||e)+'</div>')}}main();setInterval(main,60000);</script></body></html>
