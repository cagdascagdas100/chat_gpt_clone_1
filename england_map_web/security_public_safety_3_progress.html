<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety Slot 3</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}h1{margin:0 0 8px}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff;margin:10px 0 24px}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:14px}th{background:#eef1f4;position:sticky;top:0}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#fff3cd}.section{margin-top:26px}.error{white-space:pre-wrap;background:#fee;border:1px solid #f99;padding:12px;border-radius:8px}</style></head><body><h1>security_public_safety_3</h1><div class="muted">Parsel aralığı 61.523–92.283 · doğrulanmamış skorlar kabul edilmez</div><div id="summary" class="grid"></div><div id="blockers"></div><section class="section"><h2>Parsel adayları</h2><div id="rows"></div></section><section class="section"><h2>Resmî kaynak adayları</h2><div id="sources"></div></section><script>const base='data/security_public_safety/';async function load(name){const r=await fetch(base+name,{cache:'no-store'});if(!r.ok)throw new Error(name+' HTTP '+r.status);return r.json()}function card(label,value,cls=''){return `<div class="card"><div class="muted">${label}</div><div class="value ${cls}">${value}</div></div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function table(rows,cols){return `<table><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}async function main(){try{const [p,r,s]=await Promise.all([load('security_public_safety_3_progress_latest.json'),load('security_public_safety_3_rows_latest.json'),load('security_public_safety_3_source_candidates_latest.json')]);document.getElementById('summary').innerHTML=card('Genel ilerleme','%'+p.overall_progress_percent,'ok')+card('Artış','+'+p.progress_delta_percent+'%','ok')+card('İşlemler',p.completed_operations+' / '+p.total_operations)+card('Görünen parsel',p.visible_parcel_rows)+card('4/4 doğrulanmış',p.accuracy_score_4_rows,p.accuracy_score_4_rows?'ok':'warn')+card('Yükseltilen kaynak',p.promoted_sources,'ok')+card('≥95 kaynak',p.source_authority_accuracy_ge_95_count,'ok')+card('Runner heartbeat',p.runner_heartbeat_fresh?'taze':'eski',p.runner_heartbeat_fresh?'ok':'bad');document.getElementById('blockers').innerHTML='<div class="card"><b>Engeller</b><ul>'+p.blockers.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="muted">Beklenen çıktı: '+esc(p.expected_output)+'</div></div>';document.getElementById('rows').innerHTML=table(r.rows,[['Satır','line'],['Parsel','parcel_id'],['Durum','candidate_status'],['Skor','security_score_percent'],['Doğruluk /4','accuracy_score_4'],['İnceleme','needs_manual_review']]);document.getElementById('sources').innerHTML=table(s.rows,[['Satır','line'],['Kaynak','source_id'],['Ad','name'],['Otorite doğruluğu','authority_accuracy'],['Karar','decision']]);}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="error">'+esc(e.stack||e)+'</div>')}}main();setInterval(main,60000);</script></body></html>
