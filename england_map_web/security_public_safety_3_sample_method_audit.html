<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 Sample Method Audit</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}h1{margin-bottom:6px}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:7px;text-align:left;font-size:13px;vertical-align:top}th{background:#eef1f4;position:sticky;top:0}.scroll{overflow:auto;max-height:75vh}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}</style></head><body><h1>security_public_safety_3 · örnek yöntem denetimi</h1><div class="muted">Parseller 61523–61525 · resmî API tazelik, kapsam, eksik-konum ve veri-karantina kontrolleri · skor yayımlanmaz · 60 saniyede yenilenir</div><div id="summary" class="grid"></div><div id="table" class="scroll"></div><script>const path='data/security_public_safety/security_public_safety_3_sample_method_audit_latest.json';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(l,v,c='')=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></div>`;async function main(){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('summary').innerHTML=card('Satır',d.row_count,'ok')+card('Geçen / koruma hazır',d.pass_or_guard_ready_count,'ok')+card('Runtime koordinatı bekleyen',d.ready_not_executed_count,'warn')+card('Skor dışı tutulan',d.held_outside_score_count,'warn')+card('Doğrulanmış skor',d.verified_parcel_score_rows,d.verified_parcel_score_rows?'ok':'warn')+card('Gerçek yazılan',d.actual_slot_rows_written,d.actual_slot_rows_written?'ok':'warn');document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>Parsel</th><th>Kontrol</th><th>Durum</th><th>Gözlem</th><th>Resmî kaynak</th><th>Skor etkisi</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td>${esc(x.line)}</td><td>${esc(x.parcel_id)}</td><td>${esc(x.check)}</td><td><b>${esc(x.status)}</b></td><td>${esc(x.observed)}</td><td>${esc(x.source)}</td><td>${esc(x.release_effect)}</td></tr>`).join('')}</tbody></table>`}catch(e){document.body.insertAdjacentHTML('beforeend',`<pre>${esc(e.stack||e)}</pre>`)}}main();setInterval(main,60000);</script></body></html>
