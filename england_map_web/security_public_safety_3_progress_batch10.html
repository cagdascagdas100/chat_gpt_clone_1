<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPS3 Batch10 Progress</title><style>body{font:13px system-ui,Arial;margin:20px;background:#f6f7f9;color:#111}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #bbb;padding:7px;vertical-align:top}th{background:#e8f2fa;position:sticky;top:0}.m{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.p{background:#fff;border:1px solid #999;border-radius:6px;padding:7px}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}</style></head><body><h1>Security/Public Safety 3 — Batch10 İlerleme</h1><div id="state" class="p warn">Veri yükleniyor…</div><div id="cards" class="grid"></div><script>const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const card=(l,v)=>`<div class="p"><div class="muted">${esc(l)}</div><b>${esc(v)}</b></div>`;async function load(){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch('data/security_public_safety/security_public_safety_3_progress_batch10_continue_20260722.json',{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),x=d.cumulative;cards.innerHTML=card('Genel ilerleme','%'+x.overall_progress_percent)+card('Hassas ilerleme','%'+x.precise_progress_percent)+card('Artış','+'+x.progress_delta_percent+'%')+card('Tamamlanan',x.completed_operations+' / '+x.total_operations)+card('Benzersiz kaynak',x.official_source_candidates)+card('Yükseltilen',x.promoted_sources)+card('Held',x.held_sources)+card('Doğruluk ≥95',x.source_accuracy_ge_95)+card('İşlem satırı',x.visible_operation_rows)+card('Batch9 mükerrer',d.batch9_reconciliation.duplicate_rows)+card('Runner',d.runtime.runner_heartbeat_fresh?'TAZE':'STALE')+card('Final manifest',d.runtime.final_artifact_hash_present_count+' / '+d.runtime.final_artifact_hash_expected_count);state.className='p ok';state.textContent='PASS · sayaçlar yüklendi'}catch(e){state.className='p bad';state.textContent='FAIL-CLOSED · '+(e.name==='AbortError'?'8 saniye zaman aşımı':e.message)}finally{clearTimeout(t)}}load();</script></body></html>
