<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 Statik Denetim Manifesti</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px;vertical-align:top}th{background:#eef1f4;position:sticky;top:0}.muted{color:#666}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}.scroll{overflow:auto;max-height:76vh}</style></head><body><h1>security_public_safety_3 statik denetim yayın manifesti</h1><div class="muted">24 artefakt · gerçek Git blob bağları · yalnız statik görünürlük kanıtı · runtime veya skor başarısı değildir · 60 saniyede yenilenir</div><div id="summary" class="grid"></div><div id="table" class="scroll"></div><script>const path='data/security_public_safety/security_public_safety_3_static_audit_publication_manifest_latest.json';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(l,v,c='')=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></div>`;async function main(){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('summary').innerHTML=card('Artefakt',d.row_count,'ok')+card('Mevcut',d.artifact_present_count,'ok')+card('Blob bağlı',d.git_blob_bound_count,'ok')+card('Veri–sayfa çifti',d.data_page_pair_count,'ok')+card('Denetim veri satırı',d.audit_data_row_count,'ok')+card('Runtime kabul',d.runtime_acceptance?'GEÇTİ':'HAYIR','warn')+card('Skor yayını',d.parcel_score_release?'GEÇTİ':'HAYIR','warn');document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>Artefakt</th><th>Tür</th><th>Yol</th><th>Git blob</th><th>Beklenen satır</th><th>Durum</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td>${esc(x.line)}</td><td>${esc(x.artifact)}</td><td>${esc(x.kind)}</td><td class="mono">${esc(x.path)}</td><td class="mono">${esc(x.git_blob_sha)}</td><td>${esc(x.expected_rows)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('table').textContent=e.stack||e}}main();setInterval(main,60000);</script></body></html>
