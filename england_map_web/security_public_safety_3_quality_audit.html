<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Security Public Safety 3 Kaynak Kalite Denetimi</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}
    h1{margin-bottom:6px}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
    .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;font-size:13px}th{background:#eef1f4;position:sticky;top:0}
    .PASS,.PASS_GUARD_READY{color:#16794b;font-weight:700}.PENDING_FUTURE_RELEASE{color:#a05a00;font-weight:700}.BLOCKED{color:#b42318;font-weight:700}.scroll{overflow:auto;max-height:75vh}
  </style>
</head>
<body>
  <h1>security_public_safety_3 kaynak kalite denetimi</h1>
  <div class="muted">44 resmî kaynak · semantik kullanım sınırları · hassas veri karantinası · yayın takvimi · runtime manifest blocker'ı · 60 saniyede otomatik yenileme</div>
  <div id="summary" class="grid"></div>
  <div class="scroll"><table><thead><tr><th>Satır</th><th>Kontrol</th><th>Durum</th><th>Gözlem</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const path='data/security_public_safety/security_public_safety_3_source_quality_audit_latest.json';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const card=(l,v)=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value">${esc(v)}</div></div>`;
async function main(){
  const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const s=d.source_inventory||{};
  document.getElementById('summary').innerHTML=card('Aday kaynak',s.candidate_count)+card('Yükseltilen',s.promoted_count)+card('Ayrı tutulan',s.held_count)+card('Doğruluk ≥90',s.accuracy_ge_90_count)+card('Doğruluk ≥95',s.accuracy_ge_95_count)+card('Geçen denetim',d.passed_rows)+card('Gelecek yayın',d.pending_future_rows)+card('Blocker',d.blocked_rows);
  document.getElementById('rows').innerHTML=(d.audit_rows||[]).map(x=>`<tr><td>${esc(x.line)}</td><td>${esc(x.check)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.observed)}</td><td>${esc(x.evidence)}</td></tr>`).join('');
}
main().catch(e=>document.body.insertAdjacentHTML('beforeend','<pre>'+esc(e.stack||e)+'</pre>'));setInterval(main,60000);
</script>
</body>
</html>
