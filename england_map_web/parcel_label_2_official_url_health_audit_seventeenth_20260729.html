<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_2 — 17. Paket Route Denetimi</title><style>body{font:14px Arial;margin:24px;background:#f5f7fa}.cards{display:flex;gap:8px;flex-wrap:wrap}.card,.note{background:#fff;border:1px solid #ccd6e0;padding:10px}.note{margin-top:12px;background:#fff3cd}table{width:100%;border-collapse:collapse;background:#fff;margin-top:14px}th,td{border:1px solid #d5d8dc;padding:8px;text-align:left}th{background:#edf2f7}.pass{color:#176b32;font-weight:bold}</style></head><body><h1>17. Paket — Resmî Route Sağlık Denetimi</h1><div id="cards" class="cards"></div><p class="note">Bu görünüm yedi yayıncı rotasını raporlar; 102 bağımsız HTTP probe yapıldığı iddia edilmez.</p><table><thead><tr><th>#</th><th>Yayıncı</th><th>Alan adı</th><th>Route türü</th><th>Sonuç</th></tr></thead><tbody id="t"></tbody></table><script>fetch('../docs/chatgpt_status/_shared/slots_21/parcel_label_2/recovery/official_url_health_audit_seventeenth_20260729.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{cards.innerHTML=[['Route',d.scope.routes_passed+'/'+d.scope.routes_total],['Kapsanan aday',d.scope.candidate_urls_covered],['Bağımsız probe iddiası',d.scope.distinct_http_probe_claimed?'EVET':'HAYIR']].map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');t.innerHTML=d.routes.map((x,i)=>`<tr><td>${i+1}</td><td>${x.publisher}</td><td>${x.domain}</td><td>${x.route_type}</td><td class=pass>${x.status}</td></tr>`).join('')})</script></body></html>
