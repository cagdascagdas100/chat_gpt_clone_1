<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 — Batch 63–64</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0 28px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1;position:sticky;top:0}.BLOCKED{color:#b71c1c;font-weight:700}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER{font-weight:700}small{color:#455a64}a{word-break:break-all}</style></head><body><h1>parcel_label_1 — Batch 63–64</h1><p>HMPPS/MoJ bireysel GOV.UK Contact bölümlerinden adres ve postcode yeniden doğrulaması. Exact UPRN veya parsel geometrisi çıkarılmamıştır.</p><div id="cards" class="cards"></div><h2>Kanıt satırları — <span id="evidenceCount">0</span></h2><table><thead><tr><th>Batch</th><th>Kurum</th><th>Resmî adres</th><th>Postcode</th><th>Son güncelleme</th><th>Kaynak</th><th>Doğruluk</th></tr></thead><tbody id="evidence"></tbody></table><h2>İşlem satırları — <span id="operationCount">0</span></h2><table><thead><tr><th>Batch</th><th>Sıra</th><th>Kayıt</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="operations"></tbody></table><small id="meta"></small><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=(cells,cls='')=>`<tr${cls?` class="${esc(cls)}"`:''}>${cells.map(x=>`<td>${x}</td>`).join('')}</tr>`;
fetch('batch_63_64_evidence_latest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{
 const s=d.summary,c=s.cumulative,i=s.increment;
 document.getElementById('cards').innerHTML=[['Aday',c.visible_research_candidate_rows],['Kaynak yükseltmesi',c.official_sources_upgraded],['İşlem',`${c.completed_or_fail_closed_operations} / ${c.visible_operation_rows}`],['İlerleme',`${c.research_operation_progress_percent}%`],['Yeni doğrulama',i.revalidated_candidate_rows],['Yeni işlem',`${i.completed_or_fail_closed_operations} / ${i.operation_rows}`],['Checkpoint',43],['final_ready','false']].map(x=>`<div class="card"><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join('');
 let er=[],or=[],oc=0;
 for(const id of ['63','64']){
  const b=d[`batch_${id}`],ops=d[`batch_${id}_operations`];
  b.rows.forEach(rec=>{er.push(row([id,esc(rec[0]),esc(rec[1]),esc(rec[2]),esc(rec[3]),`<a href="${esc(rec[4])}">${esc(rec[4])}</a>`,`${esc(rec[5])}%`]));ops.candidate_operation_templates.forEach(t=>{oc++;or.push(row([`batch_${id}`,oc,esc(rec[0]),esc(t.operation),`<span class="${esc(t.state)}">${esc(t.state)}</span>`,esc(t.result)]));});});
  ops.fixed_operations.forEach(f=>{oc++;or.push(row([`batch_${id}`,oc,'BATCH_FIXED',esc(f[1]),`<span class="${esc(f[2])}">${esc(f[2])}</span>`,esc(f[3])]));});
 }
 document.getElementById('evidence').innerHTML=er.join('');document.getElementById('operations').innerHTML=or.join('');document.getElementById('evidenceCount').textContent=er.length;document.getElementById('operationCount').textContent=oc;document.getElementById('meta').textContent=`continuation_key=${d.continuation_key} · source_head=${d.source_head} · fake_data=false · final_ready=false`;
}).catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p class="BLOCKED">Kanıt JSON yüklenemedi: ${esc(e.message)}</p>`)});
</script></body></html>
