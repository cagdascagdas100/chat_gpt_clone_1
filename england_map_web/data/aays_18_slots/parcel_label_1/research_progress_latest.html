<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>parcel_label_1 araştırma ilerlemesi</title><style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #cfd8dc;padding:12px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:16px}
th,td{border:1px solid #cfd8dc;padding:7px;text-align:left}th{background:#eceff1}a{font-weight:700}
</style></head><body><h1>parcel_label_1 araştırma ilerlemesi</h1><div id="cards" class="cards"></div>
<table><thead><tr><th>Son paket</th><th>Yeniden doğrulama</th><th>Kaynak</th><th>İşlem</th><th>Doğruluk</th><th>Detay</th></tr></thead><tbody id="row"></tbody></table>
<script>fetch('./research_progress_latest.json',{cache:'no-store'}).then(r=>r.json()).then(p=>{const c=p.cumulative,i=p.increment,l=p.latest_batch;
cards.innerHTML=[['Toplam aday',c.visible_research_candidate_rows],['Toplam kaynak',c.official_sources_upgraded],
['İşlem',c.completed_or_fail_closed_operations+'/'+c.visible_operation_rows],['Genel ilerleme',c.research_operation_progress_percent+'%'],
['Artış','+'+c.research_operation_progress_delta_percent+' puan'],['Doğruluk',c.classification_accuracy_weighted_average_percent+'%'],
['Kanonik satır',c.canonical_reconciled_rows],['Exact geometri',c.exact_geometry_rows]]
.map(x=>`<div class="card">${x[0]}<br><b>${x[1]}</b></div>`).join('');
row.innerHTML=`<tr><td>Batch 61–62</td><td>${i.revalidated_candidate_rows}</td><td>${i.official_sources_upgraded}</td><td>${i.completed_or_fail_closed_operations}/${i.operation_rows}</td><td>${l.accuracy_average_percent}%</td><td><a href="./batch_61_62_live_progress.html">Bütün satırları aç</a></td></tr>`});</script></body></html>
