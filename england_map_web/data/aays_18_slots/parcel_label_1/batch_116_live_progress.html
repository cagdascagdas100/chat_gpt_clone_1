<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 116 — 104 işlem</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #ccd6dd;padding:5px;text-align:left;vertical-align:top}th{background:#edf1f3;position:sticky;top:0}.BLOCKED,.EXCLUDED{font-weight:700}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER,.DONE_WITH_EXCLUSION{font-weight:700}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;padding:9px;min-width:135px}a{word-break:break-all}</style></head><body><h1>parcel_label_1 — Batch 116</h1><p>Resmî aktif HMCTS ziyaret adresleri; tekrar, kapanış ve belirsizlik kapıları fail-closed uygulanır. Canonical parcel/UPRN/title/polygon bağlaması yoktur.</p><div id="cards" class="cards"></div><table><thead><tr><th>Satır</th><th>Aday</th><th>İşlem</th><th>Durum</th><th>Sonuç</th><th>Kaynak</th></tr></thead><tbody id="ops"></tbody></table><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('batch_116_evidence_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{cards.innerHTML=[['Aday',d.package.candidate_rows],['Kaynak',d.package.official_sources_upgraded],['İşlem',d.package.visible_operation_rows],['Tamam',d.package.completed_or_fail_closed_operations],['Bloklu',d.package.blocked_operations],['Doğruluk','%'+d.package.accuracy_average_percent]].map(x=>`<div class="card"><b>${e(x[0])}</b><br>${e(x[1])}</div>`).join('');(d.rows||[]).forEach((r,i)=>(d.candidate_operation_templates||[]).forEach(t=>ops.insertAdjacentHTML('beforeend',`<tr><td>${i+1}</td><td>${e(r[0])}<br>${e(r[1])}</td><td>${e(t.operation)}</td><td class="${e(t.state)}">${e(t.state)}</td><td>${e(t.result)}</td><td><a href="${e(r[4])}" target="_blank" rel="noopener">HMCTS</a></td></tr>`)));(d.fixed_operations_global||[]).forEach(x=>ops.insertAdjacentHTML('beforeend',`<tr><td>F${e(x[0])}</td><td>Global</td><td>${e(x[1])}</td><td class="${e(x[2])}">${e(x[2])}</td><td>${e(x[3])}</td><td>—</td></tr>`))}).catch(err=>document.body.insertAdjacentHTML('beforeend','<p class="BLOCKED">'+e(err)+'</p>'));</script></body></html>
