<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>parcel_label_1 — Batch 61–62</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}
.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}
table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0 28px;font-size:12px}
th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1;position:sticky;top:0}
.BLOCKED{color:#b71c1c;font-weight:700}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER{font-weight:700}
small{color:#455a64} a{word-break:break-all}
</style></head><body>
<h1>parcel_label_1 — Batch 61–62</h1>
<p>HMPPS/MoJ bireysel GOV.UK kılavuzlarından adres ve posta kodu yeniden doğrulaması. Kanonik parsel veya geometri iddiası değildir.</p>
<div id="cards" class="cards"></div>
<div id="root"></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
fetch('./batch_61_62_evidence_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(p=>{
 const s=p.summary, c=s.cumulative, i=s.increment;
 cards.innerHTML=[
 ['Yeni aday',i.new_candidate_rows],['Yeniden doğrulanan',i.revalidated_candidate_rows],
 ['Yeni resmî kaynak',i.official_sources_upgraded],['Yeni işlem',i.completed_or_fail_closed_operations+'/'+i.operation_rows],
 ['Toplam aday',c.visible_research_candidate_rows],['Toplam kaynak',c.official_sources_upgraded],
 ['Toplam işlem',c.completed_or_fail_closed_operations+'/'+c.visible_operation_rows],
 ['Genel ilerleme',c.research_operation_progress_percent+'%'],['Artış','+'+c.research_operation_progress_delta_percent+' puan'],
 ['Ağırlıklı doğruluk',c.classification_accuracy_weighted_average_percent+'%']
 ].map(x=>`<div class="card">${esc(x[0])}<br><b>${esc(x[1])}</b></div>`).join('');
 const batches=['61','62'];
 root.innerHTML=batches.map(n=>{
   const b=p['batch_'+n], o=p['batch_'+n+'_operations'];
   const candidates=b.rows.map((r,idx)=>`<tr><td>${idx+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td><a href="${esc(r[4])}">${esc(r[4])}</a></td><td>${esc(r[5])}%</td></tr>`).join('');
   let ops=[],seq=1;
   b.rows.forEach(r=>o.candidate_operation_templates.forEach(t=>ops.push([seq++,t.operation+': '+r[0],t.state,t.result])));
   o.fixed_operations.forEach(x=>ops.push([seq++,x[1],x[2],x[3]]));
   const operationRows=ops.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td class="${esc(r[2])}">${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('');
   return `<section><h2>Batch ${n}</h2><small>${b.revalidated_candidate_count} yeniden doğrulama · ${b.accuracy_ge_97_count}/${b.revalidated_candidate_count} ≥%97 · ${o.completed_or_fail_closed_operations}/${o.operation_count} işlem</small>
   <h3>Kanıt satırları</h3><table><thead><tr><th>#</th><th>Kurum</th><th>Resmî iletişim adresi</th><th>Postcode</th><th>Güncelleme</th><th>GOV.UK</th><th>Doğruluk</th></tr></thead><tbody>${candidates}</tbody></table>
   <h3>Satır satır işlemler</h3><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody>${operationRows}</tbody></table></section>`;
 }).join('');
}).catch(e=>{root.innerHTML='<p>Veri yüklenemedi: '+esc(e.message)+'</p>'});
</script></body></html>
