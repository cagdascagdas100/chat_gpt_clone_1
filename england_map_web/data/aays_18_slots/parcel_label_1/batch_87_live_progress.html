isible_operation_rows],['Tamam/fail-closed',p.completed_or_fail_closed_operations],['Bloklu',p.blocked_operations],['Batch ilerleme','%'+Number(p.workflow_percent).toFixed(2)],['Kümülatif aday',c.visible_research_candidate_rows],['Kümülatif doğruluk','%'+Number(c.classification_accuracy_weighted_average_percent).toFixed(2)],['Kümülatif işlem',c.visible_operation_rows],['Genel araştırma','%'+Number(c.research_operation_progress_percent).toFixed(2)],['Yüzde artışı','+'+Number(c.research_operation_progress_delta_percent).toFixed(2)]];document.getElementById('summary').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${esc(x[0])}</div><strong>${esc(x[1])}</strong></div>`).join('');document.getElementById('candidates').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td><code>${esc(x[2])}</code></td><td>${esc(x[3])}</td><td>%${esc(x[5])}</td><td><a href="${esc(x[4])}" target="_blank" rel="noopener">HMCTS</a></td><td>UPRN/title/polygon yok · fail-closed</td></tr>`).join('');let seq=1,ops=[];(d.fixed_operations_global||[]).forEach(x=>ops.push([seq++,'Global',x[1],x[2],x[3]]));rows.forEach(x=>(d.candidate_operation_templates||[]).forEach(t=>ops.push([seq++,x[0],t.operation,t.state,t.result])));document.getElementById('operations').innerHTML=ops.map(o=>`<tr><td>${o[0]}</td><td>${esc(o[1])}</td><td>${esc(o[2])}</td><td class="${esc(o[3])}">${esc(o[3])}</td><td>${esc(o[4])}</td></tr>`).join('')}).catch(e=>{document.getElementById('candidates').innerHTML=`<tr><td colspan="8">${esc(e.message)}</td></tr>`;document.getElementById('operations').innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`});</script></body></html>
