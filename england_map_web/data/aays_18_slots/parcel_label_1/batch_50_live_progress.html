<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 — Batch 50 DWP snapshot</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.BLOCKED{color:#b71c1c;font-weight:700}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER{font-weight:700}code,a{word-break:break-all}</style></head><body><h1>parcel_label_1 — Batch 50 DWP snapshot</h1><div class="cards" id="cards"></div><h2>Adaylar</h2><table><thead><tr><th>ID</th><th>Ad</th><th>Snapshot adresi</th><th>Kaynak</th><th>Doğruluk</th></tr></thead><tbody id="candidates"></tbody></table><h2>Satır satır işlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="operations"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Promise.all([fetch('./batch_50_candidates_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./batch_50_operations_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([c,o])=>{cards.innerHTML=[['Aday',c.candidate_count],['≥97',c.accuracy_ge_97_count],['Ortalama',c.accuracy_average_percent+'%'],['İşlem',o.completed_or_fail_closed_operations+'/'+o.operation_count],['İlerleme',o.workflow_percent+'%'],['Blocker',o.blocked_operations]].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');candidates.innerHTML=c.rows.map(x=>`<tr><td><code>${e(x[0])}</code></td><td>${e(x[1])}</td><td>${e(x[2])}</td><td><a href="${e(x[3])}">GOV.UK</a></td><td>${e(x[4])}%</td></tr>`).join('');operations.innerHTML=o.rows.map(x=>`<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td class="${e(x[2])}">${e(x[2])}</td><td>${e(x[3])}</td></tr>`).join('')}).catch(x=>error.textContent='Veri yüklenemedi: '+x.message);</script></body></html>
