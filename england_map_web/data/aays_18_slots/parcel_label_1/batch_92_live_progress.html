<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 92</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:22px;line-height:1.4;background:#f5f7f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #c9d2d8;padding:9px;min-width:145px}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0 26px;font-size:12px}th,td{border:1px solid #c9d2d8;padding:6px;text-align:left;vertical-align:top}th{background:#edf1f3;position:sticky;top:0}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER{font-weight:700}.BLOCKED,.EXCLUDED{font-weight:700}a{word-break:break-all}</style></head><body><h1>parcel_label_1 · Batch 92</h1><p>Aktif resmî HMCTS ziyaret adresleri. Canonical parcel, UPRN, title ve polygon bağlaması yapılmadan fail-closed tutulur.</p><div id="cards" class="cards"></div><h2>Dışlanan kayıt</h2><table><thead><tr><th>Ad</th><th>Durum</th><th>Neden</th></tr></thead><tbody id="excluded"></tbody></table><h2>Adaylar</h2><table><thead><tr><th>#</th><th>Kurum</th><th>Adres</th><th>Postcode</th><th>Tür</th><th>Doğruluk</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><h2>Satır satır işlemler</h2><table><thead><tr><th>#</th><th>Aday/Kapsam</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="ops"></tbody></table><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('batch_92_evidence_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const p=d.package,c=d.cumulative;cards.innerHTML=[['Yeni aday',p.candidate_rows],['Kaynak',p.official_sources_upgraded],['Batch doğruluk','%'+p.accuracy_average_percent],['Batch işlem',p.visible_operation_rows],['Tamam/fail-closed',p.completed_or_fail_closed_operations],['Bloklu',p.blocked_operations],['Kümülatif aday',c.visible_research_candidate_rows],['Kümülatif kaynak',c.official_sources_upgraded],['Kümülatif işlem',c.visible_operation_rows],['Genel ilerleme','%'+c.research_operation_progress_percent],['Artış','+'+c.research_operation_progress_delta_percent],['Canonical satır',c.canonical_reconciled_rows]].map(x=>`<div class="card"><b>${e(x[0])}</b><br>${e(x[1])}</div>`).join('');excluded.innerHTML=(d.excluded_candidates||[]).map(x=>`<tr><td>${e(x.name)}</td><td class="EXCLUDED">${e(x.state)}</td><td>${e(x.reason)}</td></tr>`).join('');rows.innerHTML=d.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${e(r[0])}</td><td>${e(r[1])}</td><td>${e(r[2])}</td><td>${e(r[3])}</td><td>%${e(r[5])}</td><td><a href="${e(r[4])}" target="_blank" rel="noopener">HMCTS</a></td></tr>`).join('');let n=1,a=[];(d.fixed_operations_global||[]).forEach(x=>a.push([n++,'GLOBAL',x[1],x[2],x[3]]));d.rows.forEach(r=>(d.candidate_operation_templates||[]).forEach(t=>a.push([n++,r[0],t.operation,t.state,t.result])));ops.innerHTML=a.map(x=>`<tr><td>${x[0]}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td class="${e(x[3])}">${e(x[3])}</td><td>${e(x[4])}</td></tr>`).join('')}).catch(err=>document.body.insertAdjacentHTML('beforeend','<p class="BLOCKED">'+e(err)+'</p>'));</script></body></html>
