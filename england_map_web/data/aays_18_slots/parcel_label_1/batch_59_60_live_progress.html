<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 59–60</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.BLOCKED{color:#b71c1c;font-weight:700}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER{font-weight:700}</style></head><body><h1>parcel_label_1 — Batch 59–60</h1><div class="cards" id="cards"></div><h2>Yeni adaylar</h2><table><thead><tr><th>Ad</th><th>Güncelleme</th><th>Kaynak</th><th>Doğruluk</th></tr></thead><tbody id="a"></tbody></table><h2>Adres yeniden doğrulamaları</h2><table><thead><tr><th>Ad</th><th>Resmî adres</th><th>Postcode</th><th>Güncelleme</th><th>Kaynak</th><th>Doğruluk</th></tr></thead><tbody id="r"></tbody></table><h2>Satır satır işlemler</h2><table><thead><tr><th>#</th><th>Batch</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="o"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));fetch('./batch_59_60_evidence_latest.json',{cache:'no-store'}).then(x=>x.json()).then(p=>{const s=p.summary;cards.innerHTML=[['Yeni aday',s.increment.new_candidate_rows],['Yeniden doğrulama',s.increment.revalidated_candidate_rows],['Kaynak yükseltme',s.increment.official_sources_upgraded],['Yeni işlem',s.increment.completed_or_fail_closed_operations+'/'+s.increment.operation_rows],['Toplam aday',s.cumulative.visible_research_candidate_rows],['Toplam kaynak',s.cumulative.official_sources_upgraded],['Toplam işlem',s.cumulative.completed_or_fail_closed_operations+'/'+s.cumulative.visible_operation_rows],['Genel ilerleme',s.cumulative.research_operation_progress_percent+'%'],['Artış','+'+s.cumulative.research_operation_progress_delta_percent+' puan'],['Doğruluk',s.cumulative.classification_accuracy_weighted_average_percent+'%']].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');a.innerHTML=p.batch_59.rows.map(x=>`<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td><a href="${e(x[2])}" target="_blank" rel="noopener">GOV.UK</a></td><td>${e(x[3])}%</td></tr>`).join('');r.innerHTML=p.batch_60.rows.map(x=>`<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td>${e(x[3])}</td><td><a href="${e(x[4])}" target="_blank" rel="noopener">GOV.UK</a></td><td>${e(x[5])}%</td></tr>`).join('');let z=[],n=1;[[p.batch_59,p.batch_59_operations],[p.batch_60,p.batch_60_operations]].forEach(([d,q])=>{d.rows.forEach(row=>q.candidate_operation_templates.forEach(t=>z.push([n++,d.batch_id,t.operation+': '+row[0],t.state,t.result])));q.fixed_operations.forEach(x=>z.push([n++,d.batch_id,x[1],x[2],x[3]]))});o.innerHTML=z.map(x=>`<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td class="${e(x[3])}">${e(x[3])}</td><td>${e(x[4])}</td></tr>`).join('')}).catch(x=>error.textContent='Veri yüklenemedi: '+x.message);</script></body></html>
