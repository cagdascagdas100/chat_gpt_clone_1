<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 — Batch 74–75 HMCTS</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;padding:9px;min-width:140px}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0 24px;font-size:12px}th,td{border:1px solid #ccd6dd;padding:5px;text-align:left;vertical-align:top}th{background:#edf1f3;position:sticky;top:0}.BLOCKED{font-weight:700;color:#b71c1c}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER{font-weight:700}a{word-break:break-all}</style></head><body><h1>parcel_label_1 — Batch 74–75 HMCTS</h1><div id="cards" class="cards"></div><h2>Kanıt satırları</h2><table><thead><tr><th>Batch</th><th>Kurum</th><th>Ziyaret adresi</th><th>Postcode</th><th>Tür</th><th>Kaynak</th><th>Doğruluk</th></tr></thead><tbody id="rows"></tbody></table><h2>İşlem satırları</h2><table><thead><tr><th>Batch</th><th>Satır</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="ops"></tbody></table><script>fetch('batch_74_75_evidence_latest.json').then(r=>r.json()).then(d=>{const s=d.cumulative;cards.innerHTML=[['Aday',s.visible_research_candidate_rows],['Kaynak',s.official_sources_upgraded],['İşlem',s.completed_or_fail_closed_operations+'/'+s.visible_operation_rows],['İlerleme','%'+s.research_operation_progress_percent],['Artış','+'+s.research_operation_progress_delta_percent],['Doğruluk','%'+s.classification_accuracy_weighted_average_percent],['HMCTS yeni aday',s.hmcts_new_candidate_rows]].map(x=>`<div class="card"><b>${x[0]}</b><br>${x[1]}</div>`).join('');d.batches.forEach(b=>{b.rows.forEach((r,i)=>{rows.insertAdjacentHTML('beforeend',`<tr><td>${b.batch_id}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><a href="${r[4]}">${r[4]}</a></td><td>${r[5]}%</td></tr>`);d.candidate_operation_templates.forEach(t=>ops.insertAdjacentHTML('beforeend',`<tr><td>${b.batch_id}</td><td>${i+1}</td><td>${t.operation}</td><td class="${t.state}">${t.state}</td><td>${t.result}</td></tr>`))})});d.fixed_operations_global.forEach(x=>ops.insertAdjacentHTML('beforeend',`<tr><td>GLOBAL</td><td>F${x[0]}</td><td>${x[1]}</td><td class="${x[2]}">${x[2]}</td><td>${x[3]}</td></tr>`))}).catch(e=>document.body.insertAdjacentHTML('beforeend','<p class="BLOCKED">JSON okunamadı: '+e+'</p>'));</script></body></html>
