<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 55–56</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:white;border:1px solid #cfd8dc;padding:10px;min-width:145px}table{border-collapse:collapse;width:100%;background:white;margin-top:15px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left}th{background:#eceff1}</style></head><body><h1>parcel_label_1 — Batch 55–56</h1><div id="cards" class="cards"></div><table><thead><tr><th>Batch</th><th>Aralık</th><th>Aday</th><th>≥97</th><th>İşlem</th><th>İlerleme</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('./batch_55_56_increment_latest.json',{cache:'no-store'}).then(r=>r.json()).then(p=>{const c=p.cumulative;cards.innerHTML=[['Yeni aday',p.increment.candidate_rows],['Yeni kaynak',p.increment.official_sources_upgraded],['Yeni işlem',p.increment.completed_or_fail_closed_operations+'/'+p.increment.operation_rows],['Toplam aday',c.visible_research_candidate_rows],['Toplam işlem',c.completed_or_fail_closed_operations+'/'+c.visible_operation_rows],['Genel ilerleme',c.research_operation_progress_percent+'%'],['Artış','+'+c.research_operation_progress_delta_percent+' puan'],['Doğruluk',c.classification_accuracy_weighted_average_percent+'%'],['DWP England kaynağı','Tükendi']].map(x=>`<div class="card">${x[0]}<br><b>${x[1]}</b></div>`).join('');rows.innerHTML=p.batches.map(b=>`<tr><td>${b.batch_id}</td><td>${b.first_record} — ${b.last_record}</td><td>${b.candidate_rows}</td><td>${b.accuracy_ge_97_count}</td><td>${b.completed_or_fail_closed_operations}/${b.operation_rows}</td><td>${b.workflow_percent}%</td><td><a href="${b.live_page}">Satırları aç</a></td></tr>`).join('')});</script></body></html>
