<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 — Batch 96</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0 24px;font-size:12px}th,td{border:1px solid #ccd6dd;padding:5px;text-align:left;vertical-align:top}th{background:#edf1f3;position:sticky;top:0}.BLOCKED,.EXCLUDED{font-weight:700}.DONE,.DONE_NO_BINDING,.DONE_WITH_BLOCKER,.DONE_WITH_EXCLUSION{font-weight:700}a{word-break:break-all}</style></head><body><h1>parcel_label_1 — Batch 96</h1><p>Resmî aktif HMCTS ziyaret adresleri; canonical parcel/UPRN/title/polygon bağlaması yapılmaz.</p><h2>Dışlanan kayıtlar</h2><table><thead><tr><th>Ad</th><th>Durum</th><th>Neden</th></tr></thead><tbody id="excluded"></tbody></table><h2>Adaylar</h2><table><thead><tr><th>#</th><th>Kurum</th><th>Adres</th><th>Postcode</th><th>Tür</th><th>Kaynak</th><th>Doğruluk</th></tr></thead><tbody id="rows"></tbody></table><h2>İşlem satırları</h2><table><thead><tr><th>Satır</th><th>Kurum/Kapsam</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="ops"></tbody></table><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('batch_96_evidence_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{excluded.innerHTML=(d.excluded_candidates||[]).map(x=>`<tr><td>${e(x.name)}</td><td class="EXCLUDED">${e(x.state)}</td><td>${e(x.reason)}</td></tr>`).join('');let n=1,a=[];d.rows.forEach((r,i)=>{rows.insertAdjacentHTML('beforeend',`<tr><td>${i+1}</td><td>${e(r[0])}</td><td>${e(r[1])}</td><td>${e(r[2])}</td><td>${e(r[3])}</td><td><a href="${e(r[4])}" target="_blank" rel="noopener">HMCTS</a></td><td>${e(r[5])}%</td></tr>`);d.candidate_operation_templates.forEach(t=>a.push([n++,r[0],t.operation,t.state,t.result]))});d.fixed_operations_global.forEach(x=>a.push([n++,'GLOBAL',x[1],x[2],x[3]]));ops.innerHTML=a.map(x=>`<tr><td>${x[0]}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td class="${e(x[3])}">${e(x[3])}</td><td>${e(x[4])}</td></tr>`).join('')}).catch(err=>document.body.insertAdjacentHTML('beforeend','<p class="BLOCKED">'+e(err)+'</p>'));</script></body></html>
