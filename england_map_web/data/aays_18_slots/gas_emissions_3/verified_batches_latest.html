<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="60"><title>Gas Emissions 3 — Doğrulanmış Paket Dizini</title><style>body{font-family:system-ui;margin:24px;background:#f7f7f8;color:#171717}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}.card,table{background:#fff;border:1px solid #ddd}.card{padding:12px;border-radius:8px}.v{font-size:22px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.scroll{max-height:72vh;overflow:auto}.ok{font-weight:700}.muted{color:#666}</style></head><body><h1>Gas Emissions 3 — doğrulanmış web paketleri</h1><div id="meta" class="muted">Yükleniyor…</div><div id="cards" class="cards"></div><p class="muted">Bu dizin son yüksek etkili paketlere erişim sağlar. Paket satırları kanonik toplamda zaten sayıldığı için burada ikinci kez ilerleme satırı olarak sayılmaz.</p><div class="scroll"><table><thead><tr><th>#</th><th>Paket</th><th>Başlık</th><th>Kaynak satırı</th><th>Kontrol satırı</th><th>Toplam</th><th>Güven</th><th>Minimum</th><th>Sonuç</th><th>Sayfa</th></tr></thead><tbody id="rows"></tbody></table></div><script>(async()=>{const e=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),d=await fetch('./verified_batches_latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),p=(d.batches||[]).filter(x=>x.verification==='PASS').length;document.getElementById('meta').textContent=`SLOT_ID=${d.slot_id} | Güncelleme=${d.updated_at} | Durum=${d.status}`;document.getElementById('cards').innerHTML=[['Paket',p+' / '+d.totals.batch_pages],['Kaynak satırı',d.totals.source_rows],['Kontrol satırı',d.totals.control_rows],['Görünür satır',d.totals.visible_rows],['Genel güven',d.verification_confidence_percent+'%'],['Browser kabul',d.browser_acceptance]].map(x=>`<div class="card"><div class="muted">${e(x[0])}</div><div class="v">${e(x[1])}</div></div>`).join('');document.getElementById('rows').innerHTML=(d.batches||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.batch_id)}</td><td>${e(x.title)}</td><td>${e(x.source_rows)}</td><td>${e(x.control_rows)}</td><td>${e(x.total_rows)}</td><td>${e(x.confidence_percent)}%</td><td>${e(x.minimum_confidence_percent)}%</td><td class="ok">${e(x.verification)}</td><td><a href="./${e(x.page)}">Satırları aç</a></td></tr>`).join('');window.__gasEmissions3VerifiedBatchIndex={batch_pages:d.totals.batch_pages,source_rows:d.totals.source_rows,control_rows:d.totals.control_rows,visible_rows:d.totals.visible_rows,passed:p}})().catch(err=>{document.getElementById('meta').textContent='Dizin yüklenemedi: '+err})</script></body></html>
