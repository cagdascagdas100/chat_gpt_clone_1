<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 doğrulanmış paketler</title><style>body{font-family:system-ui;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{position:sticky;top:0;background:#eee}.summary{margin:12px 0;font-weight:700}</style></head><body><h1>Gas Emissions 3 — doğrulanmış paket dizini</h1><div id="summary" class="summary">Yükleniyor…</div><table><thead><tr><th>#</th><th>Paket</th><th>Başlık</th><th>Kaynak</th><th>Kontrol</th><th>Toplam</th><th>Güven</th><th>Sonuç</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>const files=['verified_batches_latest.json','verified_batches_overlay_060.json','verified_batches_overlay_061.json','verified_batches_overlay_062.json','verified_batches_overlay_063.json','verified_batches_overlay_064.json','verified_batches_overlay_065.json','verified_batches_overlay_066.json','verified_batches_overlay_067.json','verified_batches_overlay_068.json','verified_batches_overlay_069.json','verified_batches_overlay_070.json','verified_batches_overlay_071.json','verified_batches_overlay_072.json'];const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');Promise.all(files.map(f=>fetch('./'+f+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()))).then(all=>{const b=all.flatMap(x=>x.batches||[]);const src=all.reduce((n,x)=>n+(x.totals?.source_rows||0),0),ctl=all.reduce((n,x)=>n+(x.totals?.control_rows||0),0),vis=all.reduce((n,x)=>n+(x.totals?.visible_rows||0),0),pass=b.filter(x=>x.verification==='PASS').length;summary.textContent=`${pass}/${b.length} paket PASS | ${src} kaynak satırı | ${ctl} kontrol satırı | ${vis} görünür satır | güven %99 | browser 66/100`;rows.innerHTML=b.map(x=>`<tr><td>${esc(x.row)}</td><td>${esc(x.batch_id)}</td><td>${esc(x.title)}</td><td>${esc(x.source_rows)}</td><td>${esc(x.control_rows)}</td><td>${esc(x.total_rows)}</td><td>${esc(x.confidence_percent)}%</td><td>${esc(x.verification)}</td><td><a href="./${esc(x.page)}">Satırları aç</a></td></tr>`).join('');window.__gasEmissions3VerifiedBatchIndex={batch_pages:b.length,source_rows:src,control_rows:ctl,visible_rows:vis,passed:pass}}).catch(e=>summary.textContent='Dizin yüklenemedi: '+e.message)</script></body></html>
