<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="60"><title>Gas Emissions 3 — Doğrulanmış Paket Dizini</title><style>body{font-family:system-ui;margin:24px;background:#f7f7f8;color:#171717}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}.card,table{background:#fff;border:1px solid #ddd}.card{padding:12px;border-radius:8px}.v{font-size:22px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.scroll{max-height:72vh;overflow:auto}.ok{font-weight:700}.muted{color:#666}</style></head><body><h1>Gas Emissions 3 — doğrulanmış web paketleri</h1><div id="meta" class="muted">Yükleniyor…</div><div id="cards" class="cards"></div><p class="muted">49 temel paket + overlay 060 (12) + overlay 061 (6) birlikte gösterilir. Paket satırları ilerleme toplamında ikinci kez sayılmaz.</p><div class="scroll"><table><thead><tr><th>#</th><th>Paket</th><th>Başlık</th><th>Kaynak</th><th>Kontrol</th><th>Toplam</th><th>Güven</th><th>Minimum</th><th>Sonuç</th><th>Sayfa</th></tr></thead><tbody id="rows"></tbody></table></div><script>(async()=>{const e=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),ts=Date.now(),base=await fetch('./verified_batches_latest.json?ts='+ts,{cache:'no-store'}).then(r=>r.json()),o60=await fetch('./verified_batches_overlay_060.json?ts='+ts,{cache:'no-store'}).then(r=>r.json()),o61=await fetch('./verified_batches_overlay_061.json?ts='+ts,{cache:'no-store'}).then(r=>r.json()),arr=[base,o60,o61],b=arr.flatMap(x=>x.batches||[]),tot={batch_pages:arr.reduce((a,x)=>a+(x.totals?.batch_pages||0),0),source_rows:arr.reduce((a,x)=>a+(x.totals?.source_rows||0),0),control_rows:arr.reduce((a,x)=>a+(x.totals?.control_rows||0),0),visible_rows:arr.reduce((a,x)=>a+(x.totals?.visible_rows||0),0)},p=b.filter(x=>x.verification==='PASS').length;meta.textContent=`SLOT_ID=${base.slot_id} | Güncelleme=${o61.updated_at} | Durum=COMBINED_VERIFIED_BATCH_INDEX_${p}_OF_${tot.batch_pages}_PASS`;cards.innerHTML=[['Paket',p+' / '+tot.batch_pages],['Kaynak satırı',tot.source_rows],['Kontrol satırı',tot.control_rows],['Görünür satır',tot.visible_rows],['Genel güven','99%'],['Browser kabul',base.browser_acceptance]].map(x=>`<div class="card"><div class="muted">${e(x[0])}</div><div class="v">${e(x[1])}</div></div>`).join('');rows.innerHTML=b.map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.batch_id)}</td><td>${e(x.title)}</td><td>${e(x.source_rows)}</td><td>${e(x.control_rows)}</td><td>${e(x.total_rows)}</td><td>${e(x.confidence_percent)}%</td><td>${e(x.minimum_confidence_percent)}%</td><td class="ok">${e(x.verification)}</td><td><a href="./${e(x.page)}">Satırları aç</a></td></tr>`).join('');window.__gasEmissions3VerifiedBatchIndex={batch_pages:tot.batch_pages,source_rows:tot.source_rows,control_rows:tot.control_rows,visible_rows:tot.visible_rows,passed:p,base_pages:49,overlay060_pages:12,overlay061_pages:6}})().catch(err=>meta.textContent='Dizin yüklenemedi: '+err)</script></body></html>
