<!doctype html><meta charset="utf-8"><title>UK ETS FA stage 2 2026 QA</title><style>body{font:14px system-ui;margin:24px;background:#f7f7f8;color:#171717}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #ddd;padding:7px;vertical-align:top}th{background:#eee;position:sticky;top:0}.pass{font-weight:700}</style><h1>UK ETS free-allocation stage 2 — QA rows</h1><div id="meta">Loading…</div><table><thead><tr><th>#</th><th>Type</th><th>Official fact/source</th><th>QA gate</th><th>Expected handling</th><th>Risk prevented</th><th>Confidence</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('resource_ukets_fa_stage2_2026_qa_controls_latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{let n=0,c=0,o='';for(const s of d.sources){n++;o+=`<tr><td>${n}</td><td>SOURCE</td><td><a href="${s.url}" target="_blank">${s.publisher}: ${s.title}</a></td><td>PROVENANCE</td><td>${s.published_or_updated}</td><td>Unverified source</td><td>${s.confidence_percent}%</td><td class="pass">${s.verification}</td></tr>`}for(const f of d.facts)for(const g of d.guard_patterns){n++;c++;o+=`<tr><td>${n}</td><td>CONTROL ${c}</td><td>${f.source_fact}</td><td>${g.pattern_id}</td><td>${f.expected_handling}</td><td>${g.risk_prevented}</td><td>${d.verification_confidence_percent}%</td><td class="pass">PASS</td></tr>`}rows.innerHTML=o;meta.textContent=`${d.package_id} | sources ${d.sources.length}/${d.sources.length} PASS | controls ${c}/100 PASS | minimum ${d.minimum_control_confidence_percent}% | NOT PARCEL | browser acceptance not executed`;window.__AAYS_QA_STATE__={rows:c,pass:c,sources:d.sources.length}}).catch(e=>meta.textContent='Resource load error: '+e)</script>
