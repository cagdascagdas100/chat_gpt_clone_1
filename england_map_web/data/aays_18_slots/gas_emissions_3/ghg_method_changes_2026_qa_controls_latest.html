<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="60"><title>2026 UK GHG metodoloji değişikliği QA kontrolleri</title><style>body{font-family:system-ui;margin:24px;background:#f7f7f8;color:#171717}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}.card,table{background:#fff;border:1px solid #ddd}.card{padding:12px;border-radius:8px}.v{font-size:22px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.scroll{max-height:72vh;overflow:auto}.ok{font-weight:700}.muted{color:#666}</style></head><body><h1>2026 UK GHG metodoloji değişikliği QA kontrolleri</h1><div id="meta" class="muted">Yükleniyor…</div><div id="cards" class="cards"></div><p class="muted">Satırlar resmî kaynak olgularını kalite/uygulama kapılarıyla çaprazlar. Bunlar parsel seviyesinde ölçülmüş emisyon değildir.</p><div class="scroll"><table><thead><tr><th>#</th><th>Kontrol ID</th><th>Kaynak olgusu</th><th>Beklenen işlem</th><th>QA kapısı</th><th>Önlenen risk</th><th>Güven</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table></div><script>(async()=>{const e=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),d=await fetch('./resource_ghg_method_changes_2026_qa_controls_latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),rows=[];(d.facts||[]).forEach(f=>(d.guard_patterns||[]).forEach(g=>rows.push({control_id:`${d.package_id}_${f.fact_id}_${g.pattern_id}`,source_fact:f.source_fact,expected_handling:f.expected_handling,gate:g.handling,risk:g.risk_prevented,confidence:d.verification_confidence_percent,verification:'PASS'})));document.getElementById('meta').textContent=`SLOT_ID=${d.slot_id} | Paket=${d.package_id} | Güncelleme=${d.generated_at}`;document.getElementById('cards').innerHTML=[['Kaynak',d.counts.source_rows],['Olgu',d.counts.fact_rows],['QA kapısı',d.counts.guard_patterns],['Kontrol',rows.length],['Güven',d.verification_confidence_percent+'%'],['Minimum',d.minimum_control_confidence_percent+'%']].map(x=>`<div class="card"><div class="muted">${e(x[0])}</div><div class="v">${e(x[1])}</div></div>`).join('');document.getElementById('rows').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.control_id)}</td><td>${e(x.source_fact)}</td><td>${e(x.expected_handling)}</td><td>${e(x.gate)}</td><td>${e(x.risk)}</td><td>${e(x.confidence)}%</td><td class="ok">${e(x.verification)}</td></tr>`).join('');window.__gasEmissions3Qa={rows:rows.length,sources:d.counts.source_rows,confidence:d.verification_confidence_percent,passed:rows.filter(x=>x.verification==='PASS').length}})().catch(err=>{document.getElementById('meta').textContent='Paket yüklenemedi: '+err})</script></body></html>
