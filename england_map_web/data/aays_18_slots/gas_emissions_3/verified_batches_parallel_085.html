<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 — 085 paralel doğrulama</title><style>body{font-family:system-ui;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{position:sticky;top:0;background:#eee}.summary{font-weight:700;margin:12px 0}</style></head><body><h1>Gas Emissions 3 — 085 resmî internet/QA paketi</h1><div id="summary" class="summary">Yükleniyor…</div><table><thead><tr><th>#</th><th>Paket</th><th>Başlık</th><th>Kaynak</th><th>Kontrol</th><th>Toplam</th><th>Güven</th><th>Sonuç</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('./verified_batches_overlay_085.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{const b=x.batches||[],t=x.totals||{},e=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');summary.textContent=`${b.filter(y=>y.verification==='PASS').length}/${b.length} paket PASS | ${t.source_rows||0} kaynak satırı | ${t.control_rows||0} kontrol satırı | ${t.visible_rows||0} görünür satır | güven %99 | browser 66/100`;rows.innerHTML=b.map(y=>`<tr><td>${e(y.row)}</td><td>${e(y.batch_id)}</td><td>${e(y.title)}</td><td>${e(y.source_rows)}</td><td>${e(y.control_rows)}</td><td>${e(y.total_rows)}</td><td>${e(y.confidence_percent)}%</td><td>${e(y.verification)}</td><td><a href="./${e(y.page)}">Satırları aç</a></td></tr>`).join('')}).catch(err=>summary.textContent='Yüklenemedi: '+err.message)</script></body></html>
