<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="90"><title>Gas Emissions 3 — 2024 Yerel GHG Kapsam ve Nokta Kaynak Kontrolleri</title><style>body{font-family:system-ui;margin:24px;background:#f7f7f8;color:#171717}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}.card,table{background:#fff;border:1px solid #ddd}.card{padding:12px;border-radius:8px}.v{font-size:22px;font-weight:700}.muted{color:#666}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.scroll{max-height:72vh;overflow:auto}.ok{font-weight:700}</style></head><body><h1>Gas Emissions 3 — 2024 Yerel GHG kapsam / nokta kaynak</h1><div id="meta" class="muted">Yükleniyor…</div><div id="cards" class="cards"></div><h2>Resmî kaynaklar</h2><div id="sources"></div><h2>Satır satır kontroller</h2><div class="scroll"><table><thead><tr><th>#</th><th>Kontrol</th><th>Güven</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table></div><script>(async()=>{const e=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),d=await fetch('./resource_local_ghg_2024_methodology_controls_latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),a=d.scope_point_source_controls||[];document.getElementById('meta').textContent=`SLOT_ID=${d.slot_id} | Güncelleme=${d.updated_at} | Ölçüm seviyesi=${d.measurement_level}`;document.getElementById('cards').innerHTML=[['Kontrol',a.length+'/50'],['Kaynak',d.sources.length],['Otorite',d.authority_score+'/100'],['Genel güven',d.verification_confidence_percent+'%'],['Minimum',d.minimum_control_confidence_percent+'%'],['Parsel bağlama','Çalıştırılmadı']].map(x=>`<div class="card"><div class="muted">${e(x[0])}</div><div class="v">${e(x[1])}</div></div>`).join('');document.getElementById('sources').innerHTML='<table><thead><tr><th>#</th><th>Yayıncı</th><th>Kaynak</th><th>Tarih</th><th>Güven</th></tr></thead><tbody>'+d.sources.map((s,i)=>`<tr><td>${i+1}</td><td>${e(s.publisher)}</td><td><a href="${e(s.url)}">${e(s.title)}</a></td><td>${e(s.last_updated||s.published)}</td><td class="ok">${e(s.confidence_percent)}% PASS</td></tr>`).join('')+'</tbody></table>';document.getElementById('rows').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x)}</td><td>99%</td><td class="ok">PASS</td></tr>`).join('');window.__gasEmissions3LocalGhgScope={rows:a.length,sources:d.sources.length,passed:a.length}})().catch(err=>document.getElementById('meta').textContent='Yüklenemedi: '+err)</script></body></html>
