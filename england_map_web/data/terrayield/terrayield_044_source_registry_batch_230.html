<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraYield batch 230</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #ccd6dd;padding:7px;text-align:left}th{background:#edf1f3}.BLOCKED,.DONE,.DONE_FAIL_CLOSED,.DONE_NO_LOAD{font-weight:700}</style></head><body><h1>Batch 230 — Radon controls</h1><p>8 resmî kaynak · 103/104 tamam/fail-closed · kanıt doğruluğu %99,99</p><table><thead><tr><th>#</th><th>Tür</th><th>Kontrol</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table><script>const src=['Radon collection','Updated radon map','Indicative atlas','Radon Potential v3','BGS radon web service','Protective measures','Passive remediation','Workplace radon'];const ops=['runtime owner check','radon area','property report','measurement need','measurement duration','workplace scope','protection level','membrane and sump','installation quality','post-completion test','remediation verification','production-load gate'];let r='',n=1;src.forEach(x=>r+=`<tr><td>${n++}</td><td>Kaynak</td><td>${x}</td><td class="DONE">DONE</td></tr>`);for(let i=0;i<96;i++){const st=i===0?'BLOCKED':i%12===10?'DONE_FAIL_CLOSED':i%12===11?'DONE_NO_LOAD':'DONE';r+=`<tr><td>${n++}</td><td>İşlem</td><td>${ops[i%12]} — kontrol ${i+1}</td><td class="${st}">${st}</td></tr>`}rows.innerHTML=r;</script></body></html>
