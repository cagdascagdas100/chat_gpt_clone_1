<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraYield 044 Batch 026</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f5f7f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left;vertical-align:top}th{background:#edf1f3}a{word-break:break-all}.DONE,.DONE_NO_LOAD,.DONE_FAIL_CLOSED{font-weight:700}.BLOCKED{font-weight:700}</style></head><body><h1>Batch 026 — UPRN/adres eşleme</h1><p id="summary">Yükleniyor…</p><table><thead><tr><th>#</th><th>Kaynak</th><th>İşlem</th><th>Durum</th><th>Doğruluk</th><th>Resmî kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('terrayield_044_source_registry_batch_026.json').then(r=>r.json()).then(d=>{document.getElementById('summary').textContent=`${d.operations_completed_or_fail_closed}/${d.operations_total} işlem · ${d.sources_retained} kaynak · doğruluk %${d.evidence_accuracy_average_percent}`;let h='',n=1;for(const s of d.sources){for(const o of d.candidate_operation_templates){h+=`<tr><td>${n++}</td><td>${s.name}</td><td>${o.operation}</td><td class="${o.state}">${o.state}</td><td>%${s.evidence_accuracy_percent}</td><td><a href="${s.official_url}" target="_blank" rel="noreferrer">aç</a></td></tr>`}}for(const g of d.fixed_operations_global){h+=`<tr><td>${n++}</td><td>GLOBAL</td><td>${g[1]}</td><td class="${g[2]}">${g[2]}</td><td>—</td><td>${g[3]}</td></tr>`}document.getElementById('rows').innerHTML=h}).catch(e=>document.getElementById('summary').textContent='JSON yüklenemedi: '+e);</script></body></html>
