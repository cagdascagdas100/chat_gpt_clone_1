<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraYield 044 Batch 022</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;padding:9px;min-width:145px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:12px;font-size:12px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left;vertical-align:top}th{background:#edf1f3;position:sticky;top:0}.BLOCKED{font-weight:700}a{word-break:break-all}</style></head><body><h1>TerraYield 044 — adres düzeyi / hard-to-reach Batch 022</h1><div id="cards" class="cards"></div><table><thead><tr><th>#</th><th>Kaynak</th><th>İşlem</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('terrayield_044_source_registry_batch_022.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{cards.innerHTML=[['Kaynak',d.sources_retained],['Tamam',d.operations_completed_or_fail_closed+'/'+d.operations_total],['Bloklu',d.operations_blocked],['Doğruluk','%'+d.evidence_accuracy_average_percent]].map(x=>`<div class="card"><b>${e(x[0])}</b><br>${e(x[1])}</div>`).join('');let n=0;d.sources.forEach(s=>d.candidate_operation_templates.forEach(t=>{n++;rows.insertAdjacentHTML('beforeend',`<tr><td>${n}</td><td><a href="${e(s.official_url)}" target="_blank" rel="noopener">${e(s.name)}</a></td><td>${e(t.operation)}</td><td>${e(t.state)}</td><td>${e(t.result)}</td></tr>`)}));d.fixed_operations_global.forEach(x=>{n++;rows.insertAdjacentHTML('beforeend',`<tr><td>${n}</td><td>GLOBAL</td><td>${e(x[1])}</td><td class="${e(x[2])}">${e(x[2])}</td><td>${e(x[3])}</td></tr>`)});});</script></body></html>
