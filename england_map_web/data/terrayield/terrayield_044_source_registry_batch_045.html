<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraYield Batch 045</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #ccd6dd;padding:7px;text-align:left;vertical-align:top}th{background:#edf1f3}.BLOCKED{font-weight:700}.DONE,.DONE_NO_LOAD,.DONE_FAIL_CLOSED{font-weight:700}</style></head><body><h1>TerraYield 044 — Batch 045</h1><p>Voucher eligibility / assurance / subsidy-control — 104 satır.</p><table><thead><tr><th>#</th><th>Kaynak</th><th>İşlem</th><th>Durum</th><th>Not</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('terrayield_044_source_registry_batch_045.json').then(r=>r.json()).then(d=>{let h='',n=1;d.sources.forEach(s=>d.candidate_operation_templates.forEach(o=>{h+=`<tr><td>${n++}</td><td>${s.name}</td><td>${o.operation}</td><td class="${o.state}">${o.state}</td><td>${s.role||''}; ${s.limitations||''}</td></tr>`}));d.fixed_operations_global.forEach(x=>{h+=`<tr><td>${n++}</td><td>GLOBAL</td><td>${x[1]}</td><td class="${x[2]}">${x[2]}</td><td>${x[3]}</td></tr>`});document.getElementById('rows').innerHTML=h}).catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="5">JSON yüklenemedi: '+e+'</td></tr>')</script></body></html>
