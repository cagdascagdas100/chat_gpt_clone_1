<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraYield Batch 029</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #ccd6dd;padding:7px;text-align:left;vertical-align:top}th{background:#edf1f3}.DONE,.DONE_NO_LOAD,.DONE_FAIL_CLOSED{font-weight:700}.BLOCKED{font-weight:700}a{word-break:break-all}.meta{background:#fff;padding:10px;margin-bottom:12px}</style></head><body><h1>TerraYield 044 — Batch 029</h1><div id="meta" class="meta">Yükleniyor…</div><table><thead><tr><th>#</th><th>Kaynak</th><th>İşlem</th><th>Durum</th><th>Sonuç / rol</th><th>Resmî kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('terrayield_044_source_registry_batch_029.json').then(r=>r.json()).then(d=>{document.getElementById('meta').innerHTML='<b>'+d.sources_retained+' kaynak</b> · '+d.operations_completed_or_fail_closed+'/'+d.operations_total+' tamam/fail-closed · doğruluk %'+d.evidence_accuracy_average_percent+' · '+d.state;let rows=[],n=1;for(const s of d.sources){for(const o of d.candidate_operation_templates){rows.push([n++,s.name,o.operation,o.state,s.role||'',s.official_url]);}}for(const g of d.fixed_operations_global){rows.push([n++,'GLOBAL',g[1],g[2],g[3],'']);}document.getElementById('rows').innerHTML=rows.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td class="'+x[3]+'">'+x[3]+'</td><td>'+x[4]+'</td><td>'+(x[5]?'<a href="'+x[5]+'" target="_blank" rel="noopener">aç</a>':'—')+'</td></tr>').join('');}).catch(e=>document.getElementById('meta').textContent='Yükleme hatası: '+e);</script></body></html>
