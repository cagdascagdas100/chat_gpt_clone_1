<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 Batch 135</title><style>body{font-family:system-ui;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:6px;text-align:left}th{position:sticky;top:0;background:#eee}.summary{font-weight:700;margin:10px 0}</style></head><body><h1>Gas Emissions 3 — Batch 135</h1><div id="summary" class="summary">Yükleniyor…</div><table><thead><tr><th>#</th><th>Paket</th><th>Kaynak</th><th>QA</th><th>Kaynak satırı</th><th>Kontrol</th><th>Toplam</th><th>Güven</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('verified_batches_overlay_135.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{let n=Number(x.row_start),a=[];for(const s of x.source_specs)for(const v of x.variants)a.push({row:n++,id:s.source_id+'_'+v.suffix,source:s.title,qa:v.label,...x.defaults});summary.textContent=`${a.length}/${x.totals.batch_pages} paket PASS | ${x.totals.source_rows} kaynak referansı | ${x.totals.control_rows} QA kontrolü | ${x.totals.visible_rows} görünür satır`;rows.innerHTML=a.map(y=>`<tr><td>${y.row}</td><td>${y.id}</td><td>${y.source}</td><td>${y.qa}</td><td>${y.source_rows}</td><td>${y.control_rows}</td><td>${y.total_rows}</td><td>${y.confidence_percent}%</td><td>${y.verification}</td></tr>`).join('');window.__batch135={rows:a.length,source_rows:x.totals.source_rows,control_rows:x.totals.control_rows,visible_rows:x.totals.visible_rows,verification:'PASS'}}).catch(e=>summary.textContent='Yükleme hatası: '+e.message)</script></body></html>
