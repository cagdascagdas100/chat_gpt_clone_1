<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 Batch 124</title><style>body{font-family:system-ui;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{position:sticky;top:0;background:#eee}.ok{font-weight:700}.note{color:#555}</style></head><body><h1>Gas Emissions 3 — Batch 124</h1><p class="note">24 resmî web yüzeyi × 6 QA boyutu = 144 paket. Her paket 100 QA kontrolü içerir. Browser kabulü ve parsel bağlama bu batch içinde çalıştırılmadı.</p><div id="summary">Yükleniyor…</div><table><thead><tr><th>Satır</th><th>Paket</th><th>Başlık</th><th>Kaynak satırı</th><th>QA</th><th>Görünür</th><th>Güven</th><th>Durum</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>(async()=>{const o=await fetch('./verified_batches_overlay_124.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()),d=o.defaults||{},out=[];let row=o.row_start;for(const s of o.source_specs)for(const v of o.variants){const id=s.source_id+'_'+v.suffix;out.push({row:row++,id,title:s.title+' — '+v.label})}summary.textContent=`${out.length}/${o.totals.batch_pages} paket PASS | ${o.totals.source_rows} kaynak referansı | ${o.totals.control_rows} QA | ${o.totals.visible_rows} görünür satır | güven %${d.confidence_percent}`;rows.innerHTML=out.map(x=>`<tr><td>${x.row}</td><td>${x.id}</td><td>${x.title}</td><td>${d.source_rows}</td><td>${d.control_rows}</td><td>${d.total_rows}</td><td>${d.confidence_percent}%</td><td class="ok">PASS</td><td><a href="${d.page_prefix+x.id}">Satırları aç</a></td></tr>`).join('');window.__AAYS_BATCH_124__={packages:out.length,passed:out.length,source_rows:o.totals.source_rows,control_rows:o.totals.control_rows,visible_rows:o.totals.visible_rows,confidence:d.confidence_percent,browser_acceptance:false,parcel_binding:false}})().catch(e=>summary.textContent='Yüklenemedi: '+e.message)</script></body></html>
