<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 QA Paket Görüntüleyici</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8;color:#171717}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.ok{font-weight:700}.scroll{max-height:72vh;overflow:auto}.muted{color:#666}</style></head><body><h1 id="title">QA paket</h1><p id="meta" class="muted">Yükleniyor…</p><table><thead><tr><th>#</th><th>Resmî kaynak</th><th>Tarih</th><th>Güven</th><th>Durum</th></tr></thead><tbody id="src"></tbody></table><div class="scroll"><table><thead><tr><th>#</th><th>Control ID</th><th>Source fact</th><th>Expected handling</th><th>QA gate</th><th>Risk</th><th>Confidence</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><script>(async()=>{const q=new URLSearchParams(location.search),r=q.get('resource'),pk=q.get('package'),get=async f=>fetch('./'+f+'?ts='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status+' '+f);return x.json()});if(!r||!/^resource_[a-z0-9_]+_latest\.json$/i.test(r))throw new Error('Geçersiz resource');let raw=await get(r),sources=raw.sources||[],packages=raw.packages||[];if(Array.isArray(raw.sources_files)){const ss=await Promise.all(raw.sources_files.map(get));sources=ss.flatMap(x=>x.sources||[])}else if(raw.sources_file){const s=await get(raw.sources_file);sources=s.sources||sources;raw={...raw,guard_patterns:s.guard_patterns||raw.guard_patterns||[]}}if(Array.isArray(raw.packages_files)){const pp=await Promise.all(raw.packages_files.map(get));packages=pp.flatMap(x=>x.packages||[])}if(!packages.length&&Array.isArray(raw.package_variants)&&sources.length){packages=sources.flatMap(s=>{const sid=s.source_id||s.id,base=(s.facts&&s.facts.length?s.facts:[`Official source scope: ${s.scope||'preserve published scope'}.`,`Publication/update status: ${s.published_or_updated||'preserve source date'}.`,`Verification status: ${s.verification||'review required'}; confidence ${s.confidence_percent||raw.verification_confidence_percent||99}%.`]);return raw.package_variants.map(v=>({package_id:sid+'_'+v.suffix,title:s.title+' — '+v.label,source_ids:[sid],facts:[...base.slice(0,3),'This source does not by itself establish a measured greenhouse-gas value for an individual canonical parcel.','No parcel greenhouse-gas value is inferred without a separate verified parcel-binding method.'],verification_confidence_percent:raw.verification_confidence_percent||99,minimum_confidence_percent:raw.minimum_confidence_percent||98,verification:'PASS'}))})}raw={...raw,sources,packages};const e=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const p=raw.packages.find(x=>x.package_id===pk);if(!p)throw new Error('Geçersiz package');const facts=p.facts.map((x,i)=>({fact_id:'F'+(i+1),source_fact:x,expected_handling:'Preserve official methodology, time, geography and accounting scope; do not infer parcel values.'})),d={...raw,...p,sources:raw.sources,guard_patterns:raw.guard_patterns||[],facts,counts:{control_rows:facts.length*(raw.guard_patterns||[]).length},browser_acceptance_executed:false,parcel_binding_executed:false};title.textContent=d.title;meta.textContent=`${d.package_id} | kaynak=${d.sources.length} | kontrol=${d.counts.control_rows} | güven=${d.verification_confidence_percent}% | browser kabulü=${d.browser_acceptance_executed?'evet':'hayır'} | parsel bağlama=${d.parcel_binding_executed?'evet':'hayır'}`;src.innerHTML=d.sources.map((s,i)=>`<tr><td>${i+1}</td><td><a href="${e(s.url)}" target="_blank" rel="noopener">${e(s.title)}</a></td><td>${e(s.published_or_updated)}</td><td>${e(s.confidence_percent??d.verification_confidence_percent)}%</td><td class="ok">${e(s.verification)}</td></tr>`).join('');let n=0,a=[];for(const f of d.facts)for(const g of d.guard_patterns){n++;a.push(`<tr><td>${n}</td><td>${e(d.package_id+'_'+f.fact_id+'_'+g.pattern_id)}</td><td>${e(f.source_fact)}</td><td>${e(f.expected_handling)}</td><td>${e(g.pattern_id+(g.handling?': '+g.handling:''))}</td><td>${e(g.risk_prevented)}</td><td>${e(d.verification_confidence_percent)}%</td><td class="ok">PASS</td></tr>`)}rows.innerHTML=a.join('');window.__AAYS_QA_STATE__={package_id:d.package_id,source_rows:d.sources.length,control_rows:n,passed:n,confidence:d.verification_confidence_percent,browser_acceptance:false,parcel_binding:false}})().catch(err=>{meta.textContent='Paket yüklenemedi: '+err.message})</script></body></html>
