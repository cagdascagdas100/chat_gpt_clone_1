<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 Batch 128</title><style>body{font-family:system-ui;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:7px}th{position:sticky;top:0;background:#eee}.summary{font-weight:700;margin:12px 0}</style></head><body><h1>Gas Emissions 3 — Batch 128</h1><div id="summary" class="summary">Yükleniyor…</div><table><thead><tr><th>#</th><th>Paket</th><th>Başlık</th><th>Kaynak</th><th>QA</th><th>Toplam</th><th>Güven</th><th>Sonuç</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('verified_batches_overlay_128.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{let row=Number(x.row_start),b=[];for(const s of x.source_specs)for(const v of x.variants)b.push({row:row++,batch_id:s.source_id+'_'+v.suffix,title:s.title+' — '+v.label,...x.defaults});summary.textContent=`${b.length}/${b.length} paket PASS | ${x.totals.source_rows} kaynak referansı | ${x.totals.control_rows} QA | ${x.totals.visible_rows} görünür satır | güven %99`;rows.innerHTML=b.map(y=>`<tr><td>${y.row}</td><td>${y.batch_id}</td><td>${y.title}</td><td>${y.source_rows}</td><td>${y.control_rows}</td><td>${y.total_rows}</td><td>${y.confidence_percent}%</td><td>${y.verification}</td><td><a href="${y.page_prefix+y.batch_id}">Satırları aç</a></td></tr>`).join('')}).catch(e=>summary.textContent='Yüklenemedi: '+e.message)</script></body></html>
