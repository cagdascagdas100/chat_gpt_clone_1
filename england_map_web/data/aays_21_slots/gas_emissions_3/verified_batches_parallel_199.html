<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 3 — Batch 199</title><style>body{font-family:system-ui;margin:20px;color:#17202a}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left}th{position:sticky;top:0;background:#eef2f5}.summary{font-weight:700;margin:12px 0}.note{font-size:12px;color:#555;margin-bottom:12px}a{color:#075bb5}</style></head><body><h1>Gas Emissions 3 — Batch 199</h1><div id="summary" class="summary">Yükleniyor…</div><div class="note">Tarihsel EUTL tesis-yıl CO₂ kayıtlarıdır. Parsel değeri değildir; yıllar birleştirilmez, tahmin yapılmaz, üretim/yoğunluk/fiyat/yük faktörü satırları emisyona çevrilmez.</div><table><thead><tr><th>#</th><th>Tesis</th><th>EUTL ID</th><th>Yıl</th><th>CO₂ (ton)</th><th>Güven</th><th>Parsel</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('resource_official_uk_facility_emissions_measured_rows_199.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(x=>{const data=[];for(const f of x.facility_series)for(const [year,value] of Object.entries(f.values))data.push({facility:f.facility,eutl:f.eutl_id,year:Number(year),value,confidence:x.confidence_percent,url:f.url});data.sort((a,b)=>a.facility.localeCompare(b.facility)||a.year-b.year);summary.textContent=`${data.length}/${x.row_count} satır PASS | 1776/1776 guard | 104/104 kaynak kontrolü | güven %${x.confidence_percent} | browser 66/100`;rows.innerHTML=data.map((r,i)=>`<tr><td>${i+1}</td><td>${r.facility}</td><td>${r.eutl}</td><td>${r.year}</td><td>${Number(r.value).toLocaleString('tr-TR')}</td><td>${r.confidence}%</td><td>Hayır</td><td><a href="${r.url}">Kaynak</a></td></tr>`).join('');window.__gasEmissions3Batch199={rows:data.length,guards:1776,source_checks:104,confidence:98,parcel:false}}).catch(e=>summary.textContent='Yüklenemedi: '+e.message)</script></body></html>
