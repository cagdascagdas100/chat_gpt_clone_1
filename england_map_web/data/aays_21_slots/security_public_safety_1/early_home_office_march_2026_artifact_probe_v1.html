<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Early Home Office Artifact Probe</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6df;padding:10px;min-width:170px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin:14px 0}th,td{border:1px solid #ccd6df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}[class^="PASS"],[class^="FAILED"]{font-weight:700}.mono{font-family:Consolas,monospace}</style></head><body><h1>Erken Home Office Mart 2026 artifact probe</h1><p>Raw dosya elde edilmedi; hash, workbook ve annual release kabulü yoktur.</p><div class="cards"><div class="card">Probe satırı<br><strong id="rowsCount">yükleniyor</strong></div><div class="card">Metadata PASS<br><strong id="metadata">yükleniyor</strong></div><div class="card">Transport failure<br><strong id="failures">yükleniyor</strong></div><div class="card">Raw byte<br><strong id="bytes">yükleniyor</strong></div><div class="card">Kaynak eklenen<br><strong id="sources">yükleniyor</strong></div></div><table><thead><tr><th>#</th><th>Bölüm</th><th>Sözleşme</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const r=await fetch(`early_home_office_march_2026_artifact_probe_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();if(d.rows.length!==8||d.summary.rows!==8)throw Error(`Probe ${d.rows.length}/8`);if(d.summary.raw_bytes_received!==0||d.summary.source_rows_added!==0)throw Error('Fail-closed sayımı bozuk');$('rowsCount').textContent='8/8';$('metadata').textContent=`${d.summary.passed_metadata_rows}/2`;$('failures').textContent=`${d.summary.failed_transport_rows}/3`;$('bytes').textContent=String(d.summary.raw_bytes_received);$('sources').textContent=String(d.summary.source_rows_added);$('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="mono">${esc(x.section)}</td><td class="mono">${esc(x.contract)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.evidence)}</td></tr>`).join('');document.body.dataset.probeRows='8';document.body.dataset.rawBytes='0';document.body.dataset.sourceRowsAdded='0'})().catch(e=>{document.body.dataset.loadError=e.message;document.body.insertAdjacentHTML('afterbegin',`<p>${esc(e.message)}</p>`)})</script></body></html>
