<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Official Release Structure Fixture</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6df;padding:10px;min-width:170px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin:14px 0}th,td{border:1px solid #ccd6df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}[class^="PASS"]{font-weight:700}.mono{font-family:Consolas,monospace}</style></head><body><h1>Resmî yayın yapı fixture doğrulaması</h1><p>Önceki resmî yayınların gerçek ürün yapısını doğrular; güncel Mart 2026 yayını veya skor kabulü değildir.</p><div class="cards"><div class="card">ONS yapı<br><strong id="ons">yükleniyor</strong></div><div class="card">Home Office yapı<br><strong id="ho">yükleniyor</strong></div><div class="card">Semantik<br><strong id="sem">yükleniyor</strong></div><div class="card">Toplam<br><strong id="total">yükleniyor</strong></div><div class="card">Yeni kaynak<br><strong id="sources">yükleniyor</strong></div></div><table><thead><tr><th>#</th><th>Bölüm</th><th>Sözleşme</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const r=await fetch(`official_release_structure_fixture_validation_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();if(d.rows.length!==16||d.summary.passed_rows!==16)throw Error(`Fixture ${d.rows.length}/16`);if(d.summary.ons_structure_rows!==9||d.summary.home_office_structure_rows!==5||d.summary.semantic_rows!==2)throw Error('9/5/2 bölüm sayımı bozuk');$('ons').textContent='9/9';$('ho').textContent='5/5';$('sem').textContent='2/2';$('total').textContent='16/16';$('sources').textContent=String(d.summary.new_official_source_rows);$('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="mono">${esc(x.section)}</td><td class="mono">${esc(x.contract)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.evidence)}</td></tr>`).join('');document.body.dataset.fixtureRows='16';document.body.dataset.newSourceRows=String(d.summary.new_official_source_rows)})().catch(e=>{document.body.dataset.loadError=e.message;document.body.insertAdjacentHTML('afterbegin',`<p>${esc(e.message)}</p>`)})</script></body></html>
