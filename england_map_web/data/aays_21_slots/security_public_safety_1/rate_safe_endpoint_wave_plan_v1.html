<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Rate-safe endpoint wave plan</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #cbd5df;padding:7px;text-align:left;vertical-align:top}th{background:#eaf0f5}.READY_NOT_EXECUTED{font-weight:700}.note{padding:12px;border:1px solid #d4a72c;background:#fff7d6;margin-bottom:12px}.mono{font-family:Consolas,monospace}</style></head><body data-expected-rows="20"><h1>Security / Public Safety 1 — rate-safe endpoint dalgaları</h1><div class="note">Hazırlık planıdır; canlı kabul kanıtı değildir. Dalga 1: 8 endpoint / 62 aday. Dalga 2: 8 endpoint / 68 aday. F-host claim olmadan çalıştırılmaz.</div><table><thead><tr><th>#</th><th>Dalga</th><th>Endpoint / kontrol</th><th>Aday</th><th>Beklenen count</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(`rate_safe_endpoint_wave_plan_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(x=>{if((x.rows||[]).length!==20)throw Error(`Satır sayısı ${(x.rows||[]).length}/20`);rows.innerHTML=x.rows.map(r=>`<tr><td>${r.row}</td><td>${esc(r.wave)}</td><td>${esc(r.endpoint_id)}</td><td>${esc(r.candidate_rows)}</td><td>${esc(r.stored_crime_count)}</td><td class="${esc(r.status)}">${esc(r.status)}</td><td class="mono">${esc(r.expected||r.manifest_reference)}</td></tr>`).join('');document.body.dataset.actualRows=String(x.rows.length);document.body.dataset.executedRows=String(x.summary.executed_rows);document.body.dataset.blocker=x.blocker}).catch(e=>{rows.innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});</script></body></html>
