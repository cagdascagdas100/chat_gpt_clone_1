<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><link rel="icon" href="data:,"><title>Resmî Metrik Yorumlama Koruması</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.note{padding:12px;border:1px solid #d4a72c;background:#fff7d6;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cbd5df;padding:10px;min-width:170px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin-top:12px}th,td{border:1px solid #cbd5df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}.PASS_PREPARED{font-weight:700}.mono{font-family:Consolas,monospace;overflow-wrap:anywhere}</style></head><body data-slot-id="security_public_safety_1" data-output-semantics="AREA_LEVEL_PROXY" data-parcel-measurement="false"><h1>Resmî Metrik Yorumlama Koruması V1</h1><div class="note">Hazırlık sözleşmesidir. ONS/Home Office yayını, canlı endpoint kabulü veya skor değişikliği değildir.</div><div class="cards"><div class="card">Satır<br><strong id="rows">yükleniyor</strong></div><div class="card">Kaynak sistemi grubu<br><strong id="groups">yükleniyor</strong></div><div class="card">Doğrudan skor girdisi<br><strong id="score">yükleniyor</strong></div><div class="card">Canlı yürütülen<br><strong id="executed">yükleniyor</strong></div></div><table><thead><tr><th>#</th><th>Grup</th><th>Metrik sözleşmesi</th><th>Durum</th><th>Kural</th><th>Resmî kanıt</th><th>Benimseme</th></tr></thead><tbody id="body"></tbody></table><script>'use strict';const esc=v=>String(v??'n/a').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(`official_metric_interpretation_guard_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{if((d.rows||[]).length!==50)throw Error(`Satır ${(d.rows||[]).length}/50`);document.getElementById('rows').textContent='50/50';document.getElementById('groups').textContent=`${d.summary.source_system_groups}/5`;document.getElementById('score').textContent=String(d.summary.direct_score_inputs_accepted);document.getElementById('executed').textContent=`${d.summary.executed_rows}/50`;document.getElementById('body').innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td>${esc(x.group)}</td><td class="mono">${esc(x.metric_contract)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.rule)}</td><td>${esc(x.evidence)}</td><td>${esc(x.adoption)}</td></tr>`).join('');document.body.dataset.rows='50';document.body.dataset.executed=String(d.summary.executed_rows);document.body.dataset.blocker=d.blocker}).catch(e=>{document.getElementById('body').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});</script></body></html>
