<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><link rel="icon" href="data:,">
<title>Canlı Kabul Hata ve Retry Matrisi</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.note{padding:12px;border:1px solid #d4a72c;background:#fff7d6}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin-top:12px}th,td{border:1px solid #cbd5df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}.mono{font-family:Consolas,monospace;overflow-wrap:anywhere}</style>
</head>
<body>
<h1>Canlı Kabul Hata ve Retry Matrisi</h1>
<div class="note"><strong>Hazırlık kanıtıdır:</strong> Bu tablo canonical runner çalışması veya kabul sonucu değildir. Hatalar sıfır faaliyete çevrilmez; skor/parsel değeri yazılmaz.</div>
<div id="summary">yükleniyor</div>
<table><thead><tr><th>#</th><th>Sinyal</th><th>Sınıf</th><th>Retry</th><th>Eylem</th></tr></thead><tbody id="rows"></tbody></table>
<script>
'use strict';const esc=v=>String(v??'n/a').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch(`live_acceptance_failure_playbook_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{if((d.decisions||[]).length!==20)throw Error(`Karar satırı ${(d.decisions||[]).length}/20`);summary.textContent=`20/20 karar · bounded retry ${d.summary.bounded_retry_classes} · yürütülen hata ${d.summary.executed_failures} · stored values modified ${d.summary.stored_values_modified}`;rows.innerHTML=d.decisions.map(x=>`<tr><td>${x.row}</td><td class="mono">${esc(x.signal)}</td><td>${esc(x.classification)}</td><td>${esc(x.retry)}</td><td>${esc(x.action)}</td></tr>`).join('');document.body.dataset.decisionRows='20';document.body.dataset.executedFailures=String(d.summary.executed_failures);document.body.dataset.blocker=d.blocker}).catch(e=>{rows.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});
</script>
</body></html>
