<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Official Release Artifact Collector Validation</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6df;padding:10px;min-width:170px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin:14px 0}th,td{border:1px solid #ccd6df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}[class^="PASS"]{font-weight:700}.mono{font-family:Consolas,monospace}</style></head><body><h1>Resmî yayın artifact collector doğrulaması</h1><p>Collector yayın öncesinde fail-closed çalışır; rakam, skor veya parsel değeri üretmez.</p><div class="cards"><div class="card">Doğrulama satırı<br><strong id="rowsCount">yükleniyor</strong></div><div class="card">Unit test<br><strong id="tests">yükleniyor</strong></div><div class="card">Collector kodu<br><strong id="collector">yükleniyor</strong></div><div class="card">Yürütülen yayın toplama<br><strong id="executed">yükleniyor</strong></div><div class="card">Kabul edilen artifact<br><strong id="accepted">yükleniyor</strong></div></div><table><thead><tr><th>#</th><th>Bölüm</th><th>Sözleşme</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const r=await fetch(`official_release_artifact_collector_validation_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();if(d.rows.length!==24||d.summary.rows!==24)throw Error(`Doğrulama ${d.rows.length}/24`);if(d.summary.unit_tests_passed!==9||d.summary.unit_tests_total!==9)throw Error('Unit test 9/9 değil');if(d.summary.stored_values_modified!==false)throw Error('stored_values_modified false değil');$('rowsCount').textContent='24/24';$('tests').textContent='9/9 PASS';$('collector').textContent=`${d.summary.collector_lines} satır`;$('executed').textContent=String(d.summary.executed_release_collections);$('accepted').textContent=String(d.summary.accepted_artifacts);$('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="mono">${esc(x.section)}</td><td class="mono">${esc(x.contract)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.evidence)}</td></tr>`).join('');document.body.dataset.validationRows='24';document.body.dataset.unitTests='9';document.body.dataset.executedCollections=String(d.summary.executed_release_collections);document.body.dataset.acceptedArtifacts=String(d.summary.accepted_artifacts)})().catch(e=>{document.body.dataset.loadError=e.message;document.body.insertAdjacentHTML('afterbegin',`<p>${esc(e.message)}</p>`)})</script></body></html>
