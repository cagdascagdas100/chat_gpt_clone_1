<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Official Release Delay Observation</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6df;padding:10px;min-width:170px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin:14px 0}th,td{border:1px solid #ccd6df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}[class^="PASS"],.DELAY_OBSERVED,.BLOCKED_EXTERNAL_HOST_RECOVERY{font-weight:700}.mono{font-family:Consolas,monospace}</style></head><body><h1>Resmî yayın gecikmesi gözlemi</h1><p>Planlanan saat sonrası doğrudan resmî sayfa durumudur; yayın, veri ingestion veya skor kabulü değildir.</p><div class="cards"><div class="card">Gözlem satırı<br><strong id="rowsCount">yükleniyor</strong></div><div class="card">ONS yayımlandı<br><strong id="ons">yükleniyor</strong></div><div class="card">Home Office yayımlandı<br><strong id="ho">yükleniyor</strong></div><div class="card">V10 kaynak<br><strong id="v10">yükleniyor</strong></div><div class="card">Ingested figure<br><strong id="figures">yükleniyor</strong></div></div><table><thead><tr><th>#</th><th>Bölüm</th><th>Sözleşme</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const r=await fetch(`official_release_delay_observation_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();if(d.rows.length!==8||d.summary.observed_rows!==8)throw Error(`Gözlem ${d.rows.length}/8`);if(d.summary.ons_published||d.summary.home_office_published||d.summary.v10_source_rows_added!==0||d.summary.figures_ingested!==0)throw Error('Fail-closed yayın sayımı bozuk');$('rowsCount').textContent='8/8';$('ons').textContent='HAYIR';$('ho').textContent='HAYIR';$('v10').textContent='0';$('figures').textContent='0';$('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="mono">${esc(x.section)}</td><td class="mono">${esc(x.contract)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.evidence)}</td></tr>`).join('');document.body.dataset.observationRows='8';document.body.dataset.onsPublished='false';document.body.dataset.homeOfficePublished='false';document.body.dataset.v10SourceRows='0';document.body.dataset.figuresIngested='0'})().catch(e=>{document.body.dataset.loadError=e.message;document.body.insertAdjacentHTML('afterbegin',`<p>${esc(e.message)}</p>`)})</script></body></html>
