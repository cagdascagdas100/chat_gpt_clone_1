<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><link rel="icon" href="data:,"><title>Resmî yayın veri-semantik eşleme</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.note{padding:12px;border:1px solid #d4a72c;background:#fff7d6}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin-top:14px}th,td{border:1px solid #cbd5df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}.PASS_PREPARED{font-weight:700}.mono{font-family:Consolas,monospace;overflow-wrap:anywhere}</style></head>
<body data-slot-id="security_public_safety_1" data-output-semantics="AREA_LEVEL_PROXY" data-parcel-measurement="false">
<h1>Resmî yayın veri-semantik eşleme V1</h1><div class="note">45 satır hazırlanmıştır; yayın veya runtime kabul kanıtı değildir. Doğrudan skor girdisi 0’dır.</div>
<table><thead><tr><th>#</th><th>Dataset</th><th>Alan sözleşmesi</th><th>Durum</th><th>Beklenen</th><th>Benimseme</th></tr></thead><tbody id="rows"></tbody></table>
<script>'use strict';const esc=v=>String(v??'n/a').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(`official_release_dataset_semantic_mapping_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{if((d.rows||[]).length!==45)throw Error(`Satır ${(d.rows||[]).length}/45`);document.getElementById('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="mono">${esc(x.dataset_id)}</td><td>${esc(x.field_contract)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.expected)}</td><td>${esc(x.adoption)}</td></tr>`).join('');document.body.dataset.mappingRows='45';document.body.dataset.executedRows=String(d.summary.executed_rows);document.body.dataset.blocker=d.blocker}).catch(e=>{document.getElementById('rows').innerHTML=`<tr><td colspan="6">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});</script>
</body></html>
