<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30">
<title>Security 1 Runtime Adoption Preflight</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.note{background:#fff7d6;border:1px solid #d4a72c;padding:12px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin-top:12px}th,td{border:1px solid #cbd5df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}.PASS{font-weight:700}.mono{font-family:Consolas,monospace}</style>
</head>
<body data-slot-id="security_public_safety_1" data-output-semantics="AREA_LEVEL_PROXY">
<h1>Runtime benimseme ön-kontrolü</h1>
<div class="note"><strong>20/20 resmî kontrol.</strong> Police API ve MPS LSOA adayları yalnız canlı parity, Chromium ve publisher kabulünden sonra benimsenebilir. Şu anda skor veya parsel değeri değiştirilmez.</div>
<div id="summary">yükleniyor</div>
<table><thead><tr><th>#</th><th>Durum</th><th>Aday</th><th>Kontrol</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table>
<script>
'use strict';
const esc=v=>String(v??'n/a').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const r=await fetch(`runtime_adoption_preflight_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();const flat=d.candidates.flatMap(c=>c.checks.map(x=>({...x,candidate:c.source})));if(flat.length!==20)throw Error(`Kontrol satırı uyuşmazlığı ${flat.length}/20`);summary.textContent=`${d.preflight_summary.passed}/${d.preflight_summary.checks} geçti · 2 aday · kabul edilen 0 · blocker: ${d.blocker}`;rows.innerHTML=flat.map(x=>`<tr><td>${x.operation}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.candidate)}</td><td class="mono">${esc(x.check)}</td><td>${esc(x.evidence)}</td></tr>`).join('');document.body.dataset.preflightRows=String(flat.length);document.body.dataset.blocker=d.blocker;})().catch(e=>{rows.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});
</script>
</body></html>
