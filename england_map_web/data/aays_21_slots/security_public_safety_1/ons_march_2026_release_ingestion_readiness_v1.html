<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><link rel="icon" href="data:,"><title>ONS Mart 2026 Yayın Hazırlığı</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.note{padding:12px;background:#fff7d6;border:1px solid #d4a72c}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.card{background:#fff;border:1px solid #cbd5df;padding:10px;min-width:180px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #cbd5df;padding:6px;text-align:left;vertical-align:top}th{background:#eaf0f5}.PENDING_RELEASE,[class^="PASS"]{font-weight:700}.mono{font-family:Consolas,monospace}</style></head>
<body data-slot-id="security_public_safety_1" data-output-semantics="AREA_LEVEL_PROXY">
<h1>ONS Mart 2026 Yayın-Ingestion Hazırlığı</h1>
<div class="note">Kontrol 11:30 İstanbul yayın saatinden önce yapılmıştır. Erken rakam üretilmez; yalnız resmî ONS/Home Office yayınları kullanılır.</div>
<div class="cards"><div class="card">Toplam kapı<br><strong id="total">yükleniyor</strong></div><div class="card">Hazır/doğrulanmış<br><strong id="prepared">yükleniyor</strong></div><div class="card">Yayın bekleyen<br><strong id="pending">yükleniyor</strong></div><div class="card">Eklenen rakam<br><strong id="figures">yükleniyor</strong></div></div>
<table><thead><tr><th>#</th><th>Durum</th><th>Kapı</th><th>Kanıt</th><th>Eylem</th></tr></thead><tbody id="rows"></tbody></table>
<script>'use strict';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(`ons_march_2026_release_ingestion_readiness_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{if((d.rows||[]).length!==36)throw Error(`Satır sayısı ${(d.rows||[]).length}/36`);total.textContent='36/36';prepared.textContent=`${d.summary.prepared_or_verified_rows}/36`;pending.textContent=`${d.summary.release_pending_rows}/36`;figures.textContent=String(d.summary.figures_ingested);rows.innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td class="mono">${esc(x.gate)}</td><td>${esc(x.evidence)}</td><td>${esc(x.action)}</td></tr>`).join('');document.body.dataset.rows='36';document.body.dataset.pending=String(d.summary.release_pending_rows);document.body.dataset.figuresIngested=String(d.summary.figures_ingested)}).catch(e=>{rows.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});</script>
</body></html>
