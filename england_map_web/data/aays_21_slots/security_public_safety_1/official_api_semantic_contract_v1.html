<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official API Semantic Contract</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #cbd5df;padding:7px;text-align:left;vertical-align:top}th{background:#eaf0f5}[class^=PASS]{font-weight:700}</style></head><body><h1>Resmî API semantik sözleşmesi — 24 satır</h1><p>Hazırlık kanıtıdır; canlı kabul sonucu değildir. AREA_LEVEL_PROXY korunur.</p><table><thead><tr><th>#</th><th>Durum</th><th>Sözleşme</th><th>Resmî kural</th><th>Runtime etkisi</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(`official_api_semantic_contract_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{if((d.rows||[]).length!==24)throw Error(`Satır ${(d.rows||[]).length}/24`);rows.innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.contract)}</td><td>${esc(x.rule)}</td><td>${esc(x.runtime_effect)}</td></tr>`).join('');document.body.dataset.rows='24';document.body.dataset.acceptanceEvidence=String(d.summary.acceptance_evidence)}).catch(e=>{rows.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});</script></body></html>
