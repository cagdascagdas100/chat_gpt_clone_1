<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Acceptance Matrix</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #cbd5df;padding:7px;text-align:left;vertical-align:top}th{background:#eaf0f5}.PASS_STATIC_READBACK,.PENDING_RUNTIME{font-weight:700}</style></head><body><h1>Browser kabul matrisi — 30 satır</h1><p>28 statik readback geçti; 2 canlı Chromium/publisher kapısı bekliyor.</p><table><thead><tr><th>#</th><th>Durum</th><th>Kontrol</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><script>'use strict';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(`browser_acceptance_matrix_v1_20260723.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{if((d.rows||[]).length!==30)throw Error(`Satır ${(d.rows||[]).length}/30`);rows.innerHTML=d.rows.map(x=>`<tr><td>${x.row}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.check)}</td><td>${esc(x.evidence)}</td></tr>`).join('');document.body.dataset.rows='30';document.body.dataset.runtimePending=String(d.summary.runtime_pending)}).catch(e=>{rows.innerHTML=`<tr><td colspan="4">${esc(e.message)}</td></tr>`;document.body.dataset.loadError=e.message});</script></body></html>
