orted rate was 4.0 actions per 100,000 attendees versus 4.2 previously; attendance inputs came from several external providers and exclude specified competitions.","Use as competition context only; retain denominator provenance and exclusions."],["S92","PASS_UPGRADED",99,"https://www.gov.uk/government/statistics/football-related-arrests-banning-orders-2025-to-2026-domestic-season/football-related-arrests-banning-orders-2025-to-2026-domestic-season","British Transport Police football actions","BTP reported 99 football-related arrests or other police actions, compared with 106 in 2024/25.","Transport-policing subset; avoid adding it again where already included in totals."],["S93","PASS_UPGRADED",99,"https://www.gov.uk/government/statistics/football-related-arrests-banning-orders-2025-to-2026-domestic-season/football-related-arrests-banning-orders-2025-to-2026-domestic-season","Unclassified ‘other’ football actions","There were 255 ‘other’ actions, down 23%; the recording method does not permit publication by offence type.","Do not impute an offence mix for the unclassified group."],["S94","PASS_UPGRADED",99,"https://www.gov.uk/government/statistics/football-related-arrests-banning-orders-2025-to-2026-domestic-season/football-related-arrests-banning-orders-2025-to-2026-domestic-season","Football banning-order stock and new orders","2,460 banning orders were in force on 1 June 2026; 701 were issued over 12 months, while the comparable 10-month count was 568, down 17%.","Use equal reporting windows for trends; stock and flow remain distinct."],["S95","PASS_UPGRADED",99,"https://www.gov.uk/government/statistics/football-related-arrests-banning-orders-2025-to-2026-domestic-season/football-related-arrests-banning-orders-2025-to-2026-domestic-season","Banning-order identity and timing guard","One individual can have multiple bans, and an order may be issued in a later season than the related arrest.","Never equate bans with unique people or same-season arrests."],["S96","PA
