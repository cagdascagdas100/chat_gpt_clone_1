<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="15">
  <title>Security Public Safety 1 Runner Pickup</title>
  <style>body{font-family:Arial,sans-serif;margin:24px;line-height:1.45;background:#fafafa;color:#171717}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}code{background:#eee;padding:2px 5px}.notice{padding:12px;border:1px solid #999;background:#fff;margin-bottom:16px}</style>
</head>
<body>
<h1>Security / Public Safety — Runner Pickup</h1>
<div class="notice"><code>security_public_safety_1</code> · <code>AREA_LEVEL_PROXY</code> · parsel ölçümü değildir · <code>final_ready=false</code></div>
<table><thead><tr><th>Alan</th><th>Güncel değer</th></tr></thead><tbody id="rows"><tr><td colspan="2">Yükleniyor…</td></tr></tbody></table>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('./runner_pickup_status_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
 const rows=[
  ['Durum',d.status],['Checkpoint',d.checkpoint_sequence],['İlk doğrulanmamış adım',d.first_unverified_step],
  ['Slot status',d.slot_status],['Current task',d.slot_current_task],['Heartbeat',`${d.slot_heartbeat}; stale=${d.slot_heartbeat_stale}`],
  ['JSON queue',`${d.json_queue_status}; consumed=${d.json_queue_consumed_by_existing_runner}`],['Legacy bridge',d.legacy_bridge_ready],
  ['Global control alias',d.global_control_alias],['Alias bu slota ait',d.global_control_alias_owned_by_this_slot],
  ['Claim oluşturuldu',d.claim_created],['Acceptance raporu',d.acceptance_report_present],['Blocker',d.blocker],['Sonraki adım',d.next_step]
 ];
 document.getElementById('rows').innerHTML=rows.map(x=>`<tr><th>${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('');
}).catch(e=>document.getElementById('rows').innerHTML=`<tr><td colspan="2">Okuma hatası: ${esc(e)}</td></tr>`);
</script>
</body>
</html>
