,s.acceptance_candidate_target],['Acceptance API',s.acceptance_unique_endpoints],['Supplemental aday',s.supplemental_candidate_count],['Supplemental doğruluk 4/4',s.supplemental_accuracy_score_4_count],['Supplemental HTTP 200',s.supplemental_stored_http_200_count],['Supplemental API',s.supplemental_unique_endpoints],['Acceptance dışı yeni API',s.supplemental_new_unique_endpoints_vs_acceptance],['Son aralık',`${s.latest_supplemental_range.start}-${s.latest_supplemental_range.end}`],['Son aralık API',s.latest_supplemental_unique_endpoints],['Son aralık yeni API',s.latest_supplemental_new_endpoints],['Görünür toplam',s.visible_candidate_total],['Görünür API',s.visible_unique_endpoint_total],['Görünür yeniden kullanım',`${s.visible_endpoint_reuse_ratio} satır/API`],['Endpoint düzeltmesi',s.endpoint_inventory_correction],['Resmî kaynak',s.official_source_count],['Bu tur kaynak kontrolü',s.official_source_rechecks_this_turn],['Planlanan canlı kontrol',s.planned_live_network_checks_unchanged],['Police API son ay',s.police_api_latest_month],['Police arşivi son ay',s.police_archive_latest_month],['London LSOA son ay',s.london_lsoa_latest_month],['ONS sonraki yayın',s.ons_next_release_date],['ONS yayımlandı',s.ons_next_release_published],['Home Office sonraki yayın',s.home_office_next_release_date],['Home Office yayımlandı',s.home_office_next_release_published],['Preflight hazır',d.deterministic_preflight_ready],['Preflight çalıştırıldı',d.deterministic_preflight_executed],['Alias durumu',d.control_alias_state],['Global alias',d.global_control_alias],['Claim',d.claim_created],['Acceptance raporu',d.acceptance_report_present],['Blocker',d.blocker],['Sonraki adım',d.next_step]];document.getElementById('rows').innerHTML=rows.map(x=>`<tr><th>${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('')}).catch(e=>document.getElementById('rows').innerHTML=`<tr><td colspan="2">Okuma hatası: ${esc(e)}</td></tr>`);</script></body></html>
