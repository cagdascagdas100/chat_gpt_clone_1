<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>body{font-family:Arial,sans-serif;margin:24px;line-height:1.45;background:#fafafa;color:#171717}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}code{background:#eee;padding:2px 5px}.notice{padding:12px;border:1px solid #999;background:#fff;margin-bottom:16px}a{font-weight:bold}</style>
</head>
<body>
<h1>Security / Public Safety — Runner Pickup</h1>
<div class="notice"><code>security_public_safety_1</code> · <code>AREA_LEVEL_PROXY</code> · parsel ölçümü değildir · <code>final_ready=false</code> · <a id="progressLink" href="progress_v14.html">180 görünür satırlık V14 ilerleme sayfası</a></div>
<table><thead><tr><th>Alan</th><th>Güncel değer</th></tr></thead><tbody id="rows"><tr><td colspan="2">Yükleniyor…</td></tr></tbody></table>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getJson=url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(url+' HTTP '+r.status);return r.json()});
Promise.all([getJson('./runner_pickup_status_latest.json'),getJson('./supplemental_status_latest.json')]).then(([d,s])=>{
 document.getElementById('progressLink').href=d.progress_page||'progress_v14.html';
 const rows=[
  ['Durum',d.status],['Attempt',d.attempt_id],['Checkpoint',d.checkpoint_sequence],['İlk doğrulanmamış adım',d.first_unverified_step],
  ['Slot status',d.slot_status],['Current task',d.slot_current_task],['Heartbeat',`${d.slot_heartbeat}; stale=${d.slot_heartbeat_stale}`],
  ['JSON queue',`${d.json_queue_status}; consumed=${d.json_queue_consumed_by_existing_runner}`],['Legacy bridge',`ready=${d.legacy_bridge_ready}; worker=v${d.legacy_bridge_worker_version}`],
  ['Acceptance adayı',s.acceptance_candidate_target],['Acceptance benzersiz API',s.acceptance_unique_endpoints],['Acceptance yeniden kullanım',`${s.acceptance_endpoint_reuse_ratio} satır/API`],
  ['Supplemental aday',s.supplemental_candidate_count],['Supplemental doğruluk 4/4',s.supplemental_accuracy_score_4_count],['Supplemental HTTP 200',s.supplemental_stored_http_200_count],
  ['Son supplemental aralık',`${s.latest_supplemental_range?.start}-${s.latest_supplemental_range?.end}`],['Son aralık API',s.latest_supplemental_unique_endpoints],['Son aralık yeni API',s.latest_supplemental_new_endpoints],
  ['Supplemental benzersiz API',s.supplemental_unique_endpoints],['Acceptance dışı yeni API',s.supplemental_new_unique_endpoints_vs_acceptance],['Görünür toplam',s.visible_candidate_total],
  ['Görünür benzersiz API',s.visible_unique_endpoint_total],['Görünür yeniden kullanım',`${s.visible_endpoint_reuse_ratio} satır/API`],['Acceptance sözleşmesi değişti',!s.acceptance_contract_unchanged],
  ['Authoring canlı endpoint erişimi',s.authoring_direct_live_endpoint_recheck_available],['Authoring canlı kontrol notu',s.authoring_direct_live_endpoint_recheck_note],
  ['Resmî kaynak',s.official_source_count],['Bu tur resmî kaynak kontrolü',s.official_source_rechecks_this_turn],['Planlanan canlı ağ kontrolü',s.planned_live_network_checks_unchanged],
  ['Police API son ay',s.police_api_latest_month],['Police archive son ay',s.police_archive_latest_month],['Police changelog kontrolü',s.police_known_missing_force_reviewed],['London LSOA son ay',s.london_lsoa_latest_month],
  ['ONS sonraki yayın',s.ons_next_release_date],['ONS yayımlandı',s.ons_next_release_published],['Home Office sonraki yayın',s.home_office_next_release_date],['Home Office yayımlandı',s.home_office_next_release_published],
  ['Preflight hazır',d.deterministic_preflight_ready],['Preflight çalıştırıldı',d.deterministic_preflight_executed],['V14 AST authoring kontrolü',d.authoring_worker_v14_ast_parse_pass],
  ['Control alias durumu',d.control_alias_state],['Global alias',d.global_control_alias],['Alias bu slota ait',d.global_control_alias_owned_by_this_slot],['Alias değiştirildi',d.global_control_alias_overwritten],
  ['Claim oluşturuldu',d.claim_created],['Acceptance raporu',d.acceptance_report_present],['Blocker',d.blocker],['Sonraki adım',d.next_step]
 ];
 document.getElementById('rows').innerHTML=rows.map(x=>`<tr><th>${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('');
}).catch(e=>document.getElementById('rows').innerHTML=`<tr><td colspan="2">Okuma hatası: ${esc(e)}</td></tr>`);
</script>
</body>
</html>
