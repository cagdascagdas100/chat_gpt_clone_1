<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>internet_access_2 — satır satır ilerleme</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}
table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}
th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}
th{background:#eceff1}.pass{color:#087f23;font-weight:bold}.blocked{color:#b71c1c;font-weight:bold}
code,a{word-break:break-all}
</style>
</head>
<body>
<h1>internet_access_2 — satır satır ilerleme</h1>
<div id="cards" class="cards"></div>
<h2>İşlem satırları</h2>
<table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="operations"></tbody></table>
<h2>Resmî kaynaklar</h2>
<table><thead><tr><th>#</th><th>Kaynak</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="sources"></tbody></table>
<h2>Ofcom r2 dosyaları</h2>
<table><thead><tr><th>#</th><th>Dosya</th><th>Alan</th><th>Veri satırı</th><th>Sütun</th><th>Durum</th></tr></thead><tbody id="files"></tbody></table>
<p id="error"></p>
<script>
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('./ofcom_r2_line_by_line_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
 const cards=[['Durum',d.state],['Genel ilerleme',d.progress_percent+'%'],['Artış','+'+d.percent_change+'%'],['İşlem',d.completed_operations+'/'+d.total_operations],['Hazır örnek',d.prepared_postcode_samples??0],['Postcode doğrulama',(d.postcode_identity_confirmed??0)+'/'+(d.prepared_postcode_samples??0)],['Yükseltilen kaynak',d.source_upgrades??(d.source_checks||[]).length],['Kapsama adayı',d.official_coverage_verified_candidates??0],['Doğruluk yazıldı',d.accuracy_written??0],['r2 dosya',(d.r2_postcode_file_count??0)+'/'+(d.expected_r2_postcode_file_count??121)],['r2 satır',(d.total_r2_postcode_rows??0)+'/'+(d.expected_r2_postcode_rows??1741096)]];
 document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');
 document.getElementById('operations').innerHTML=(d.operation_rows||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td>${e(x.status)}</td><td><code>${e(x.evidence)}</code></td></tr>`).join('');
 document.getElementById('sources').innerHTML=(d.source_checks||[]).map(x=>`<tr><td>${e(x.row)}</td><td><a href="${e(x.url)}">${e(x.source)}</a></td><td>${e(x.status)}</td><td>${e(x.evidence)}</td></tr>`).join('');
 document.getElementById('files').innerHTML=(d.file_rows||[]).map(x=>`<tr><td>${e(x.row)}</td><td><code>${e(x.file)}</code></td><td>${e(x.postcode_area)}</td><td>${e(x.data_rows)}</td><td>${e((x.missing_core_columns||[]).length?'Eksik: '+x.missing_core_columns.join(', '):'Tam')}</td><td>${e(x.status)}</td></tr>`).join('');
}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);
</script>
</body>
</html>
