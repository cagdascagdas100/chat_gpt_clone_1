<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 3 — 963–970</title><style>body{font:13px Segoe UI,Arial;margin:0;background:#f3f6f9;color:#172033}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #aab6c2;z-index:2}main{padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:7px}.card{background:#fff;border:1px solid #c9d2da;border-radius:7px;padding:8px}table{width:100%;border-collapse:collapse;background:#fff;margin-top:12px}th,td{border:1px solid #c9d2da;padding:6px;text-align:left;vertical-align:top}th{background:#edf2f6}small{color:#526170}a{color:#075eb5}.warn{background:#fff4d6}</style></head><body><header><b>ReadyToSell 3 — Dalgalar 963–970</b> · 96/96 işlem · 16 aday · ortalama 99,9 · genel %99,9640 · satırlar 4.110<br><small id="state">Veriler yükleniyor; her istek 10 saniye ile sınırlıdır.</small></header><main><h2>İşlemler — satır satır</h2><div id="ops" class="grid"></div><h2>Adaylar</h2><table><thead><tr><th>Dalga</th><th>Aday</th><th>Fiyat</th><th>Tür / durum</th><th>Tenure</th><th>Doğruluk</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table></main><script>const files=[963,964,965,966,967,968,969,970].map(n=>`research_wave_${n}_20260726.json`),progress='ready_to_sell_3_progress_events_wave_963_970_20260726.json';const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function get(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}}async function run(){let degraded=false;try{const p=await get(progress);document.getElementById('ops').innerHTML=p.events.map(x=>`<div class="card ${x[3].includes('warning')?'warn':''}"><b>#${x[0]} · ${esc(x[1])}</b><br>${esc(x[2])}<br><small>${esc(x[3])} · ${x[4]} · ${esc(x[5])}</small></div>`).join('')}catch(e){degraded=true;document.getElementById('ops').innerHTML='<div class="card warn">İşlem günlüğü sınırlı sürede yüklenemedi.</div>'}const rows=[];for(const f of files)try{const d=await get(f);d.candidates.forEach(c=>rows.push({...c,wave:d.wave}))}catch(e){degraded=true}document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td>${r.wave}</td><td><b>${esc(r.title)}</b><br><small>${esc(r.integrity_note)}</small></td><td>${esc(r.price)}</td><td>${esc(r.property_type_marketing)}<br>${esc(r.occupancy_note)}<br><small>${esc(r.planning_status_marketing)}</small></td><td>${esc(r.tenure_marketing)}</td><td>${r.source_confidence_score}</td><td><a href="${esc(r.source_url)}" target="_blank" rel="noopener">Resmî detay</a></td></tr>`).join('');document.getElementById('state').textContent=degraded?'Sınırlı kaynak hatası: mevcut satırlar gösteriliyor.':'96 işlem ve 16 aday başarıyla yüklendi; DOM/parsel/geometri yükseltmesi bloklu.'}run();setTimeout(()=>{if(document.getElementById('state').textContent.includes('yükleniyor'))document.getElementById('state').textContent='15 saniyelik görünüm sınırı aşıldı; sayfa takılı kalmadı.'},15000);</script></body></html>
