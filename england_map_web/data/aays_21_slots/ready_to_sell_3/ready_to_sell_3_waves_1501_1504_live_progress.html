<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 3 1501-1504</title><style>body{font:14px Arial;margin:16px;background:#f5f7f9;color:#172235}section{background:#fff;border:1px solid #ccd6e1;padding:12px;margin:10px 0}.scroll{max-height:760px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d7dee7;padding:5px;vertical-align:top}th{background:#edf2f7;position:sticky;top:0}.ok{color:#08783e}.warn{color:#9b5b00}.bad{color:#ad1e2a}</style><h1>ReadyToSell 3 — 1501–1504</h1><section id="summary">Yükleniyor…</section><section class="bad">Automation 167 port-8012 DOM kanıtı yok. Public-host, parsel, geometri ve nihai kabul bekliyor.</section><section><h2>Adaylar</h2><div class="scroll"><table><thead><tr><th>Dalga</th><th>Aday</th><th>Guide</th><th>Kaynak</th><th>Güven</th></tr></thead><tbody id="candidates"></tbody></table></div></section><section><h2>Dışlananlar</h2><div id="excluded"></div></section><section><h2>Satır satır işlemler</h2><div class="scroll"><table><thead><tr><th>#</th><th>İşlem</th><th>Kayıt</th><th>Sonuç</th><th>Açıklama</th></tr></thead><tbody id="events"></tbody></table></div></section><script>const files=['research_wave_1501_20260731.json','research_wave_1502_20260731.json','research_wave_1503_20260731.json','research_wave_1504_20260731.json','ready_to_sell_3_progress_events_wave_1501_1504_20260731.json'];const add=(tr,v,cls='')=>{const td=document.createElement('td');td.textContent=v??'';if(cls)td.className=cls;tr.appendChild(td)};Promise.all(files.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.json()}))).then(data=>{const p=data.pop(),waves=data,a=p.candidate_summary;summary.textContent=`İlerleme %${p.visible_operation_progress_percent.toFixed(6)} | Artış +%${p.visible_operation_progress_delta_percent.toFixed(6)} | İşlem ${p.visible_operation_completed}/${p.visible_operation_total} | Taranan ${a.screened} | Aday ${a.latest_turn_researched} | Ortalama güven %${a.latest_turn_average_source_confidence.toFixed(2)} | Kaynak yükseltmesi ${a.source_upgrades_to_direct_official} | Satır ${a.visible_research_rows_after_wave_1504}`;for(const w of waves){for(const q of w.candidates){const tr=document.createElement('tr');add(tr,w.wave);add(tr,q.title);add(tr,q.price);add(tr,q.source_class);add(tr,'%'+q.source_confidence_score,'ok');candidates.appendChild(tr)}for(const q of w.excluded_candidates||[]){const d=document.createElement('p');d.textContent=`${q.title} — ${q.reason}: ${q.detail}`;d.className='bad';excluded.appendChild(d)}}let n=p.event_sequence_start,rows=[];for(const w of waves){for(const q of w.excluded_candidates||[])for(const x of [['source_guard','fail_closed',q.reason],['exclude_guard','pass','candidate blocked'],['parcel_guard','pass_warning','legal-pack parcel plan required'],['web_exclusion','pass',q.detail]])rows.push([n++,x[0],q.candidate_id,x[1],x[2]]);for(const q of w.candidates)for(const x of [['auction_guard','pass','future official auction'],['source_verified','pass','official evidence retained'],['source_tier_guard','pass',q.source_class],['legal_guard','pass_warning','legal pack required'],['integrity_guard','pass_warning','no valuation, planning or parcel inference'],['web_row','pass','candidate row added']])rows.push([n++,x[0],q.candidate_id,x[1],x[2]])}for(const x of p.global_events)rows.push([n++,x[0],'global',x[1],x[2]]);for(const r of rows){const tr=document.createElement('tr');add(tr,r[0]);add(tr,r[1]);add(tr,r[2]);add(tr,r[3],String(r[3]).includes('blocked')||String(r[3]).includes('closed')?'bad':String(r[3]).includes('warning')||String(r[3]).includes('pending')?'warn':'ok');add(tr,r[4]);events.appendChild(tr)}}).catch(e=>{summary.textContent='Yükleme hatası: '+e.message;summary.className='bad'});</script>
