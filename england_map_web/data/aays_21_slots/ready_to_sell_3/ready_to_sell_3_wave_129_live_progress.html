<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReadyToSell 3 — Wave 129 canlı ilerleme</title>
<style>
body{font:13px Segoe UI,Arial,sans-serif;margin:18px;background:#f4f7fa;color:#142033}
.card{background:#fff;border:1px solid #c5d0dc;padding:10px;margin:8px 0}.metrics{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid #8fa0b3;padding:6px}.ok{border-color:#3e9a68}.warn{border-color:#c28a32}
table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #c5d0dc;padding:6px;vertical-align:top}th{background:#e0f4e8;position:sticky;top:0}
a{color:#075eb5}.done{border-left:4px solid #2e9a60}.blocked{border-left:4px solid #b64646}
</style></head><body data-load-state="loading">
<h1>ReadyToSell 3 — Wave 129</h1>
<p>Parsel aralığı 61523–92283. Bu sayfa araştırma adaylarını gösterir; parsel/geometri kanıtı olmadan yükseltme yapılmaz.</p>
<div class="metrics" id="metrics"></div>
<h2>İşlemler — satır satır</h2><div id="events"></div>
<h2>Adaylar</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Aday</th><th>Konum</th><th>Pazarlama</th><th>Fiyat</th><th>Kaynak</th><th>Planlama/kullanım</th><th>Güven</th><th>Yükseltme</th><th>Uyarı / sonraki işlem</th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="error"></p>
<script>
const e=v=>String(v??'not_available').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=async p=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(p+'?v='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}};
Promise.all([get('research_preload_wave_129_20260722.json'),get('ready_to_sell_3_progress_events_wave_129_20260722.json')]).then(([w,p])=>{
document.body.dataset.loadState='ready';
const s=p.candidate_summary||{};
document.getElementById('metrics').innerHTML=[
['İlerleme',p.visible_operation_progress_percent+'%','ok'],['Artış','+'+Number(p.visible_operation_progress_delta_percent||0).toFixed(2)+' puan','ok'],
['İşlem',p.visible_operation_completed+' / '+p.visible_operation_total,'ok'],['Yeni aday',s.latest_turn_researched,'ok'],
['≥90 güven',s.latest_turn_high_source_confidence,'ok'],['Ortalama güven',s.latest_turn_average_source_confidence+'/100','ok'],
['Toplam web satırı',s.visible_research_rows_after_wave_129,'ok'],['Yükseltilen',s.latest_turn_promoted,'warn'],
['DOM/parsel/geometri','BLOCKED','warn']].map(x=>`<span class="pill ${x[2]}"><b>${e(x[0])}:</b> ${e(x[1])}</span>`).join('');
document.getElementById('events').innerHTML=(p.events||[]).map(x=>`<div class="card ${x.result==='pass'||x.result==='pass_limited'?'done':'blocked'}"><b>#${e(x.sequence)} ${e(x.event)}</b> — ${e(x.result)} — ${e(x.detail)} — doğruluk ${e(x.accuracy_score)}/100</div>`).join('');
document.getElementById('rows').innerHTML=(w.candidates||[]).map((c,i)=>`<tr><td>${i+1}</td><td><b>${e(c.title)}</b><br>${e(c.candidate_id)}</td><td>${e(c.location)}</td><td>${e(c.marketing_status)}</td><td>${e(c.price)}</td><td><a href="${e(c.source_url)}" target="_blank" rel="noopener">${e(c.publisher)}</a></td><td>${e(c.planning_signal)}<br>${e(c.planning_reference)}</td><td>${e(c.source_confidence_score)}/100</td><td>${c.promotion_allowed?'YES':'NO'}</td><td>${e(c.integrity_warning)}<br><b>Sonraki:</b> ${e(c.next_required)}</td></tr>`).join('');
}).catch(err=>{document.body.dataset.loadState='degraded';document.getElementById('error').textContent='Veri yüklenemedi: '+err.message});
</script></body></html>
