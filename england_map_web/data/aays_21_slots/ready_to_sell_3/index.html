<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 3 — Birleşik araştırma</title><style>body{margin:0;background:#f4f7fa;color:#142033;font:13px Segoe UI,Arial,sans-serif}header,.panel{background:#fff;border-bottom:1px solid #c5d0dc;padding:12px 16px}.metrics,.tools{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #8fa0b3;background:#fff;padding:6px}.ok{border-color:#3e9a68}.warn{border-color:#c28a32}.bad{border-color:#b64646}.flow{max-height:28vh;overflow:auto}.flow div{background:#fff;border-left:4px solid #3e9a68;padding:5px;margin:3px 0}.limited{border-color:#c28a32!important}.wrap{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;min-width:1800px;background:#fff;font-size:12px}th,td{border:1px solid #c5d0dc;padding:5px;vertical-align:top}th{position:sticky;top:0;background:#e0f4e8}input{padding:7px;min-width:300px;flex:1}a{color:#075eb5}</style></head><body data-load-state="loading" data-slot-id="ready_to_sell_3"><header><h1>ReadyToSell 3 — Birleşik internet araştırması</h1><div>Parsel 61523–92283 · Kaynak doğrulaması parsel/geometri eşleşmesi değildir; kanıt olmadan yükseltme yapılmaz.</div></header><section class="panel"><div class="metrics" id="metrics"></div></section><section class="panel"><b>İşlemler — satır satır</b><div class="flow" id="events"></div></section><section class="panel tools"><input id="q" type="search" placeholder="Adres, aday, fiyat veya kaynak ara"><label><input id="high" type="checkbox"> ≥90 güven</label><label><input id="uncertain" type="checkbox"> Belirsiz/STP</label></section><section class="panel"><div id="message">Veriler yükleniyor…</div><div class="wrap"><table><thead><tr><th>#</th><th>Wave</th><th>Aday</th><th>Konum</th><th>Tarih</th><th>Fiyat</th><th>Tenure</th><th>Kaynak</th><th>Planlama/kullanım</th><th>Güven</th><th>Yükseltme</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>'use strict';const waves=[...Array.from({length:5},(_,i)=>[i+2,'20260720']),...Array.from({length:28},(_,i)=>[i+7,'20260721']),...Array.from({length:88},(_,i)=>[i+35,'20260722']),...Array.from({length:6},(_,i)=>[i+123,'20260723']),...Array.from({length:27},(_,i)=>[i+129,'20260722'])];const files=waves.map(([w,d])=>`research_preload_wave_${w}_${d}.json`),progress='ready_to_sell_3_progress_events_wave_152_155_20260722.json';const $=id=>document.getElementById(id),esc=v=>String(v??'not_available').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(p){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(p+'?v='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return{ok:true,data:await r.json(),p}}catch(e){return{ok:false,p,error:String(e.message)}}finally{clearTimeout(t)}}async function pool(items,n=12){const out=[],q=[...items];await Promise.all(Array.from({length:n},async()=>{while(q.length)out.push(await get(q.shift()))}));return out}let all=[],failed=[];function render(){const q=$('q').value.toLocaleLowerCase('tr-TR'),hi=$('high').checked,un=$('uncertain').checked,rows=all.filter(c=>(!hi||Number(c.source_confidence_score||0)>=90)&&(!un||/(stp|subject|unverified|not_exposed|pending|legal_pack|permission|lease|title)/i.test(`${c.planning_reference||''}`))&&(!q||JSON.stringify(c).toLocaleLowerCase('tr-TR').includes(q)));$('rows').innerHTML=rows.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.wave)}</td><td><b>${esc(c.title)}</b><br>${esc(c.candidate_id)}</td><td>${esc(c.location)}</td><td>${esc(c.auction_date)}</td><td>${esc(c.price)}</td><td>${esc(c.tenure_marketing||c.tenure)}</td><td><a href="${esc(c.source_url||c.final_url)}" target="_blank" rel="noopener">${esc(c.publisher||'kaynak')}</a></td><td>${esc(c.planning_signal)}<br>${esc(c.planning_reference)}</td><td>${esc(c.source_confidence_score||0)}/100</td><td>${c.promotion_allowed?'YES':'NO'}</td></tr>`).join('');$('message').textContent=`Görünen ${rows.length}; toplam benzersiz ${all.length}; yüklenemeyen dosya ${failed.length}; yükseltilen ${rows.filter(x=>x.promotion_allowed).length}.`}async function start(){const res=await pool([...files,progress]),pr=res.find(x=>x.p===progress&&x.ok)?.data||{},docs=res.filter(x=>x.p!==progress&&x.ok).map(x=>x.data);failed=res.filter(x=>!x.ok);const m=new Map();for(const d of docs)for(const c of d.candidates||[])m.set(c.candidate_id,{...c,wave:d.wave});all=[...m.values()];const s=pr.candidate_summary||{};$('metrics').innerHTML=[['İlerleme',`${Number(pr.visible_operation_progress_percent||0).toFixed(2)}%`,'ok'],['Artış',`+${Number(pr.visible_operation_progress_delta_percent||0).toFixed(2)} puan`,'ok'],['İşlem',`${pr.visible_operation_completed||0} / ${pr.visible_operation_total||0}`,'ok'],['Toplam web satırı',s.visible_research_rows_after_wave_155||all.length,'ok'],['Yeni aday',s.latest_turn_researched||0,'ok'],['≥90 güven',s.latest_turn_high_source_confidence||0,'ok'],['Ortalama güven',`${Number(s.latest_turn_average_source_confidence||0).toFixed(2)}/100`,'ok'],['Yükseltilen',s.latest_turn_promoted||0,'warn'],['DOM/parsel/geometri','BLOCKED','bad'],['Dosya yükleme',failed.length?`${failed.length} eksik; kısmi görünüm`:'tam',failed.length?'warn':'ok']].map(x=>`<span class="pill ${x[2]}"><b>${esc(x[0])}:</b> ${esc(x[1])}</span>`).join('');$('events').innerHTML=(pr.events||[]).map(e=>`<div class="${e.result==='pass_limited'?'limited':''}"><b>#${esc(e.sequence)} ${esc(e.event)}</b> — ${esc(e.result)} — ${esc(e.detail)} — doğruluk ${esc(e.accuracy_score)}/100</div>`).join('');document.body.dataset.loadState=failed.length?'degraded':'ready';render()}$('q').addEventListener('input',render);$('high').addEventListener('change',render);$('uncertain').addEventListener('change',render);let done=false,t=setTimeout(()=>{if(!done){document.body.dataset.loadState='degraded';$('message').textContent='15 saniye sınırı aşıldı; sonsuz pending yerine kısmi görünüm korunuyor.'}},15000);start().finally(()=>{done=true;clearTimeout(t)});</script></body></html>
