<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 3 — 1019–1026</title><style>body{font:13px Segoe UI,Arial,sans-serif;margin:12px;background:#f5f7fa;color:#172033}h1{font-size:20px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.card{background:white;border:1px solid #ccd5df;border-radius:6px;padding:8px 10px}table{border-collapse:collapse;width:100%;background:white;margin:10px 0 20px}th,td{border:1px solid #d7dee7;padding:6px;vertical-align:top;text-align:left}th{background:#eaf0f6;position:sticky;top:0}a{color:#075eb5}.small{font-size:12px}</style></head><body><h1>ReadyToSell 3 — Güncel dalgalar 1019–1026</h1><div id="meta" class="meta"></div><h2>Aday satırları</h2><table><thead><tr><th>Dalga</th><th>Aday</th><th>Fiyat</th><th>Tür / tenure</th><th>Durum / planlama</th><th>Doğruluk</th><th>Kaynak</th></tr></thead><tbody id="candidates"></tbody></table><h2>İşlem satırları</h2><table><thead><tr><th>Sıra</th><th>İşlem</th><th>Aday</th><th>Sonuç</th><th>Doğruluk</th><th>Ayrıntı</th></tr></thead><tbody id="events"></tbody></table><script>const waves=[1019,1020,1021,1022,1023,1024,1025,1026];async function getj(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json()}(async()=>{let rows=[];for(const w of waves){const d=await getj(`research_wave_${w}_20260726.json`);for(const c of d.candidates)rows.push({w,c})}const p=await getj('ready_to_sell_3_progress_events_wave_1019_1026_20260726.json');document.getElementById('meta').innerHTML=`<div class="card">Aday: <b>${rows.length}</b></div><div class="card">Ortalama doğruluk: <b>${p.candidate_summary.latest_turn_average_source_confidence}</b></div><div class="card">İşlem: <b>${p.completed_events}/${p.total_events}</b></div><div class="card">Genel: <b>${p.visible_operation_progress_percent}%</b></div><div class="card">Engel: <b>${p.blocker}</b></div>`;document.getElementById('candidates').innerHTML=rows.map(({w,c})=>`<tr><td>${w}</td><td>${c.title}</td><td>${c.price}</td><td>${c.property_type_marketing}<br><span class="small">${c.tenure_marketing}</span></td><td>${c.occupancy_note}<br><span class="small">${c.planning_status_marketing}</span></td><td>${c.source_confidence_score}</td><td><a href="${c.source_url}" target="_blank" rel="noopener">Resmî detay</a></td></tr>`).join('');document.getElementById('events').innerHTML=p.events.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td><td>${e[3]}</td><td>${e[4]}</td><td>${e[5]}</td></tr>`).join('')})().catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p>Yükleme hatası: ${e.message}</p>`)})</script></body></html>
