r(const c of d.candidates||[])rows.push([d.wave,c])}catch(e){degraded=true}}document.getElementById("candidates").innerHTML=rows.map(([w,c])=>`<tr><td>${w}</td><td>${esc(c.title)}</td><td>${esc(c.price)}</td><td>${esc(c.property_type_marketing)}</td><td>${esc(c.tenure_marketing)}</td><td>${esc(c.occupancy_note)}</td><td>${esc(c.planning_status_marketing)}</td><td>${esc(c.source_confidence_score)}</td><td>${esc(c.integrity_note)}</td></tr>`).join("");try{const p=await loadJson(progressFile);document.getElementById("events").innerHTML=(p.events||[]).map(e=>`<tr><td>${e[0]}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td><td class="${e[3].includes("blocked")?"blocked":e[3].includes("warning")?"warn":"ok"}">${esc(e[3])}</td><td>${esc(e[4])}</td><td>${esc(e[5])}</td></tr>`).join("")}catch(e){degraded=true}const st=document.getElementById("state");st.textContent=degraded?"sınırlı görünüm — bazı dosyalar yüklenemedi":`${rows.length} aday · 96 işlem`;st.className=degraded?"warn":"ok"})();</script></body></html>
