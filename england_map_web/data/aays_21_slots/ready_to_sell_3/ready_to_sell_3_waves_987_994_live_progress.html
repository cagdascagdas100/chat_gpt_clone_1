<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 3 — 987–994</title><style>body{margin:0;font:13px Segoe UI,Arial;background:#f3f6f9;color:#172033}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #aab5c2;padding:12px;z-index:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px;padding:10px}.card,section{background:#fff;border:1px solid #c5ced8;border-radius:6px;padding:9px}.price{font-weight:700}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ccd4dd;padding:5px;text-align:left;vertical-align:top}th{position:sticky;top:49px;background:#eaf0f6}.wrap{padding:10px}.ok{color:#08752f}.warn{color:#8b5200}.blocked{color:#a00000}#status{margin-left:8px}</style></head><body><header><b>ReadyToSell 3 — Dalgalar 987–994</b><span id="status">Yükleniyor…</span></header><div class="wrap"><section id="summary"></section></div><div id="candidates" class="grid"></div><div class="wrap"><h3>İşlem satırları</h3><table><thead><tr><th>Sıra</th><th>İşlem</th><th>Aday</th><th>Sonuç</th><th>Doğruluk</th><th>Detay</th></tr></thead><tbody id="events"></tbody></table></div><script>const waves=[987,988,989,990,991,992,993,994].map(n=>`research_wave_${n}_20260726.json`);const progress='ready_to_sell_3_progress_events_wave_987_994_20260726.json';const timeout=(p,ms=8000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const [p,...ws]=await timeout(Promise.all([fetch(progress,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),...waves.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}))]));const cs=ws.flatMap(w=>w.candidates||[]);document.getElementById('status').innerHTML=` · <span class="ok">${p.completed_events}/${p.total_events} işlem tamamlandı</span>`;document.getElementById('summary').innerHTML=`<b>Genel ilerleme:</b> ${p.visible_operation_progress_percent}% · <b>Artış:</b> +${p.visible_operation_progress_delta_percent} · <b>Toplam:</b> ${p.visible_operation_completed}/${p.visible_operation_total} · <b>Aday:</b> ${cs.length} · <b>Ortalama doğruluk:</b> ${p.candidate_summary.latest_turn_average_source_confidence} · <b>Engel:</b> <span class="blocked">${esc(p.blocker)}</span>`;document.getElementById('candidates').innerHTML=cs.map(c=>`<article class="card"><b>${esc(c.title)}</b><div class="price">${esc(c.price)}</div><div>${esc(c.property_type_marketing)}</div><div><b>Tenure:</b> ${esc(c.tenure_marketing)} · <b>Doluluk:</b> ${esc(c.occupancy_note)}</div><div><b>Planlama:</b> ${esc(c.planning_status_marketing)}</div><div><b>Doğruluk:</b> ${esc(c.source_confidence_score)}</div><div>${esc(c.integrity_note)}</div><a href="${esc(c.source_url)}" target="_blank" rel="noopener">Resmî kaynak</a></article>`).join('');document.getElementById('events').innerHTML=(p.events||[]).map(e=>`<tr><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td><td class="${e[3].includes('blocked')?'blocked':e[3].includes('warning')?'warn':'ok'}">${esc(e[3])}</td><td>${esc(e[4])}</td><td>${esc(e[5])}</td></tr>`).join('')}catch(e){document.getElementById('status').innerHTML=' · <span class="warn">Sınırlı görünüm: veri yüklenemedi; sayfayı yenileyin.</span>';document.getElementById('summary').textContent='Veri isteği zaman aşımına uğradı veya geçici olarak erişilemedi. Sonsuz pending uygulanmadı.'}}load();</script></body></html>
