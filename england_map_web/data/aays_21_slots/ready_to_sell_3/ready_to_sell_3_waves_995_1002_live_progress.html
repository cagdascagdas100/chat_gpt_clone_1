<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyToSell 3 — 995–1002</title><style>body{margin:0;font:13px Segoe UI,Arial;background:#eef3f7;color:#172033}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #b7c3ce;z-index:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px;padding:10px}.card{background:#fff;border:1px solid #c6d0da;border-radius:6px;padding:9px}.ok{border-left:4px solid #2a7}.warn{border-left:4px solid #d87}.blocked{border-left:4px solid #b33}.small{color:#526174;font-size:12px}a{color:#075eb5}</style></head><body><header><b>ReadyToSell 3 · Waves 995–1002</b><div id="summary" class="small">Yükleniyor…</div></header><h3 style="padding:0 10px">İşlem satırları</h3><main id="ops" class="grid"></main><h3 style="padding:0 10px">Aday satırları</h3><section id="cands" class="grid"></section><script>const timeout=(u,ms=10000)=>Promise.race([fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),new Promise((_,j)=>setTimeout(()=>j(Error('timeout')),ms))]);const waves=[995,996,997,998,999,1000,1001,1002];(async()=>{let degraded=false;try{const p=await timeout('ready_to_sell_3_progress_events_wave_995_1002_20260726.json');summary.textContent=`${p.completed_events}/${p.total_events} bu tur · ${p.visible_operation_completed}/${p.visible_operation_total} toplam · %${p.visible_operation_progress_percent}`;for(const e of p.events){const d=document.createElement('div');d.className='card '+(e[3].includes('blocked')?'blocked':e[3].includes('warning')?'warn':'ok');d.innerHTML=`<b>#${e[0]} ${e[1]}</b><div>${e[2]}</div><div class=small>${e[3]} · doğruluk ${e[4]} · ${e[5]||''}</div>`;ops.appendChild(d)}}catch(e){degraded=true;summary.textContent='İşlem günlüğü sınırlı sürede yüklenemedi; degraded görünüm.'}for(const w of waves){try{const x=await timeout(`research_wave_${w}_20260726.json`);for(const c of x.candidates){const d=document.createElement('div');d.className='card ok';d.innerHTML=`<b>${c.title}</b><div>${c.price} · ${c.tenure_marketing}</div><div>${c.property_type_marketing}</div><div class=small>${c.occupancy_note}<br>${c.planning_status_marketing}<br>Kaynak güveni: ${c.source_confidence_score}</div>`;cands.appendChild(d)}}catch(e){degraded=true}}setTimeout(()=>{if(degraded&&!summary.textContent.includes('degraded'))summary.textContent+=' · bazı satırlar degraded'},15000)})();</script></body></html>
