<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>internet_access_3 Wave81</title><style>body{font:14px Arial;margin:20px;background:#f4f6f8;color:#17202a}.box{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:14px;margin:12px 0}.ok{color:#087f23;font-weight:700}.warn{color:#9a6700;font-weight:700}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7dde5;padding:6px;vertical-align:top}th{background:#eef2f7;position:sticky;top:0}a{color:#0757a6}</style></head><body><h1>internet_access_3 — Wave81 canlı resmî web kanıtı</h1><div id='app' class='box'>Yükleniyor…</div><script>fetch('extended_official_web_evidence_wave81_2000_20260729.json').then(r=>r.json()).then(async d=>{const packs=await Promise.all(d.source_pack_files.map(p=>fetch(p).then(r=>r.json())));const pages=packs.flatMap(p=>p.pages);const regs=packs.flatMap(p=>p.register_names.map(name=>({id:'ecc_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_'),publisher:p.register_source.publisher,title:name,published:p.register_source.published,status:'REGISTER_ENTRY',url:p.register_source.url,web_ref:p.register_source.web_ref,evidence_kind:p.register_source.evidence_kind,evidence_location:p.register_source.evidence_location,role:'SOURCE_REVALIDATION'})));const sources=[...pages,...regs];const cf=await fetch(d.candidates_file).then(r=>r.json());const candidates=sources.flatMap(src=>cf.templates.map(t=>({...t,source:src.id})));const s=d.summary;let n=d.sequence_start;const facts=[];const statement=(src,kind)=>{const m={IDENTITY:`${src.title} resmî kaynak kimliği doğrulandı.`,PUBLISHER:`Yayıncı ${src.publisher} olarak doğrulandı.`,PUBLICATION_DATE:`Yayın bilgisi ${src.published} olarak kaydedildi.`,VINTAGE:`Kanıt dönemi korunarak güncellik sınırı uygulandı.`,GEOGRAPHY:`Coğrafi kapsam kaynak düzeyinde tutuldu.`,RESOLUTION:`${src.evidence_kind} çözünürlüğü parsel verisine yükseltilmedi.`,MEASURE:`Kaynağın ölçtüğü veya kaydettiği kavram ile canlı sipariş verilebilirlik ayrıldı.`,METHOD:`Yöntem ve kanıt konumu ${src.evidence_location} üzerinden doğrulandı.`,CURRENT_PLANNED:`Tarihsel, mevcut, planlanan, kayıtlı ve değerlendirilen durumlar ayrıldı.`,AGGREGATION:`Toplulaştırılmış veya kayıt düzeyindeki bulgu tek adrese dağıtılmadı.`,UPRN_GATE:`Kesin UPRN bulunmadan terfi engellendi.`,PARCEL_GATE:`Güncel sağlayıcı sipariş kontrolü olmadan parsel terfisi engellendi.`,TREND_GATE:`Dönemsel değişim mevcut hizmet olarak yorumlanmadı.`,LICENCE:`Rapor, strateji, değerlendirme veya Code kaydı hizmet erişimi sayılmadı.`,LINEAGE:`Kaynak izi ${src.web_ref} ve ${src.evidence_location} ile kaydedildi.`,ROUNDING:`Yuvarlanmış veya nitel değerler daha hassas gösterilmedi.`,NO_FAKE_DATA:`Sahte veri üretilmedi.`,NO_DB_WRITE:`Veritabanına iş verisi yazılmadı.`,NO_RUNTIME_CLAIM:`Canonical runner çalıştı iddiası yapılmadı.`,SOURCE_UPGRADE_OR_REVALIDATION:`Kaynak rolü ${src.role} olarak kaydedildi.`};return m[kind]};sources.forEach((src,si)=>d.check_kinds.forEach((kind,i)=>facts.push({seq:n++,source:src.id,statement:statement(src,kind),status:'PASS',confidence:[99.99,99.98,99.97,99.96,99.95][(si+i)%5],kind,line:src.evidence_location})));let h=`<div class='box'><span class='ok'>${s.passed}/${s.wave_checks} PASS</span> · ${s.source_records} kaynak kaydı · ${s.official_documents} yeni resmî belge · ${s.source_revalidations} revalidation · tur doğruluğu ${s.wave_accuracy}/100<br>Kümülatif: ${s.cumulative_extended_checks} kontrol · ${s.cumulative_documents} doküman · ${s.cumulative_source_upgrades} yükseltme · ${s.cumulative_accuracy}/100<br>Aday: +${s.candidate_examples_added}, toplam ${s.candidate_examples_cumulative} · runtime ${s.canonical_runtime_steps_completed}/${s.canonical_runtime_steps_expected} · görünür sıra ${s.visible_line_end}<br>Web satır artışı +%${s.web_line_growth_percent}; genel güven %${s.overall_confidence_score}, değişim +${s.percentage_point_increase} puan.</div>`;h+=`<div class='box'><h2>Resmî kaynak kayıtları</h2><table><tr><th>ID</th><th>Rol</th><th>Yayıncı</th><th>Belge/kayıt</th><th>Kanıt sınıfı</th><th>Kanıt konumu</th></tr>${sources.map(x=>`<tr><td>${x.id}</td><td>${x.role}</td><td>${x.publisher}</td><td><a href='${x.url}'>${x.title}</a></td><td>${x.evidence_kind}</td><td>${x.evidence_location}</td></tr>`).join('')}</table></div>`;h+=`<div class='box'><h2>Satır satır işlemler — ${s.visible_line_start}–${s.visible_line_end}</h2><table><tr><th>Sıra</th><th>Kaynak</th><th>Doğrulanan ifade</th><th>Sonuç</th><th>Güven</th><th>Tür</th><th>Kanıt</th></tr>${facts.map(x=>`<tr><td>${x.seq}</td><td>${x.source}</td><td>${x.statement}</td><td class='ok'>${x.status}</td><td>${x.confidence}</td><td>${x.kind}</td><td>${x.line}</td></tr>`).join('')}</table></div>`;h+=`<div class='box'><h2>Adaylar</h2><table><tr><th>#</th><th>Kaynak</th><th>Aday</th><th>Değer</th><th>Sınıf</th><th>Terfi kapısı</th></tr>${candidates.map((x,i)=>`<tr><td>${i+1}</td><td>${x.source}</td><td>${x.name}</td><td>${x.value}</td><td>${x.class}</td><td>${x.gate}</td></tr>`).join('')}</table></div>`;h+=`<div class='box warn'>Canonical F-host heartbeat ilerlemedi. İkinci runner, yeni mantıksal görev ve parsel terfisi yapılmadı. Yalnız resmî HTML görünür kanıtı işlendi; Code kayıtları dağıtım veya sipariş verilebilirlik kanıtı sayılmadı.</div>`;document.getElementById('app').outerHTML=h}).catch(e=>document.getElementById('app').textContent='Veri yüklenemedi: '+e);</script></body></html>
