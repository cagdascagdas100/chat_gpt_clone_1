<!doctype html><html lang="tr"><meta charset="utf-8"><title>internet_access_3 Wave148</title><body><h1>internet_access_3 Wave148 · resmî web kanıtı</h1><p id="sum">Yükleniyor…</p><table border="1" cellpadding="5"><thead><tr><th>#</th><th>Yayıncı</th><th>Kaynak</th><th>Doğrulanan bilgi</th><th>Kapsam sınırı</th><th>Güven</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table><p><a href="extended_official_web_evidence_wave148_operations_2600_20260731.html">2.600 işlem satırını aç</a></p><p><a href="extended_official_web_evidence_wave148_2600_20260731.json">Manifesti aç</a></p><script>const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');const delta=(v,label)=>v===0?`${label} figure was unchanged`:`${label} figure ${v>0?'increased':'decreased'} by ${Math.abs(v).toLocaleString('en-GB')}`;function expand(seed){let a=[];for(const [n,s,c,b,jc,jb] of seed.contract_seed){const z=slug(n);a.push([`feb_${z}_supplier`,['february_snapshot'],`The February 2026 BDUK snapshot listed ${s} as supplier for ${n}.`,'monthly_snapshot']);a.push([`feb_${z}_contracted`,['february_snapshot'],`The February 2026 BDUK snapshot listed ${c.toLocaleString('en-GB')} initial-scope contracted premises for ${n}.`,'monthly_snapshot']);a.push([`feb_${z}_built`,['february_snapshot'],`The February 2026 BDUK snapshot listed ${b.toLocaleString('en-GB')} built contracted premises for ${n}.`,'monthly_snapshot']);if(jc!==null){a.push([`delta_feb_jul_${z}_contracted`,['february_snapshot','july_snapshot'],`From the February to July 2026 BDUK snapshots, the ${delta(jc-c,'initial-scope contracted-premises')} for ${n}.`,'monthly_comparison']);a.push([`delta_feb_jul_${z}_built`,['february_snapshot','july_snapshot'],`From the February to July 2026 BDUK snapshots, the ${delta(jb-b,'built contracted-premises')} for ${n}.`,'monthly_comparison']);}else a.push([`jul_${z}_absent`,['february_snapshot','july_snapshot'],`The July 2026 BDUK table did not contain a separate row for ${n}, so no arithmetic February-to-July delta was asserted.`,'monthly_comparison']);}for(const [id,doc,fact,g] of seed.consumer_seed)a.push([id,[doc],fact,g]);return a.map((r,i)=>[...r,100,(i+1)%5===0?'REVALIDATION':'UPGRADE']);}Promise.all([fetch('extended_official_web_evidence_wave148_2600_20260731.json').then(r=>r.json()),fetch('extended_official_web_evidence_wave148_seed_20260731.json').then(r=>r.json())]).then(([d,s])=>{const records=expand(s),docs=Object.fromEntries(d.documents.map(x=>[x.id,x]));document.getElementById('sum').textContent=`${d.assertion_pass}/${d.assertion_checks} PASS · ${records.length} kaynak kaydı · ${d.official_documents} benzersiz resmî belge · ${d.source_upgrades} kaynak yükseltmesi · ${d.source_revalidations} yeniden doğrulama · ${d.candidate_examples} aday · doğruluk %${d.assertion_accuracy_percent.toFixed(2)} · business satırı 0 · parsel terfisi 0.`;const b=document.getElementById('rows');records.forEach((x,i)=>{const tr=document.createElement('tr'),links=x[1].map(id=>`<a href="${docs[id].url}">${docs[id].title}</a>`).join('<br>'),pubs=[...new Set(x[1].map(id=>docs[id].publisher))].join(' / ');tr.innerHTML=`<td>${i+1}</td><td>${pubs}</td><td>${links}</td><td>${x[2]}</td><td>${d.scope_guards[x[3]]}</td><td>${x[4].toFixed(1)}</td><td>${x[5]}</td>`;b.appendChild(tr)});}).catch(e=>document.getElementById('sum').textContent='Kanıt yüklenemedi: '+e);</script><noscript>Kaynak tablosu için JavaScript gerekir; manifest ve seed JSON dosyaları doğrudan açılabilir.</noscript></body></html>
