<script>
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const delta=(v,a,b)=>v===0?`was unchanged from ${a} to ${b}`:`${v>0?'increased':'decreased'} by ${Math.abs(v).toLocaleString('en-GB')} from ${a} to ${b}`;
function expand(seed){const a=[];for(const [n,p,fc,fb,mc,mb] of seed.contract_seed){const z=slug(n);
a.push([`feb_${z}_supplier`,['february_snapshot'],`The February 2026 BDUK snapshot listed ${p} as supplier for ${n}.`,'monthly_snapshot']);
a.push([`feb_${z}_contracted`,['february_snapshot'],`The February 2026 BDUK snapshot listed ${fc.toLocaleString('en-GB')} initial-scope contracted premises for ${n}.`,'monthly_snapshot']);
a.push([`feb_${z}_built`,['february_snapshot'],`The February 2026 BDUK snapshot listed ${fb.toLocaleString('en-GB')} built contracted premises for ${n}.`,'monthly_snapshot']);
a.push([`mar_${z}_contracted`,['march_snapshot'],`The March 2026 BDUK snapshot listed ${mc.toLocaleString('en-GB')} initial-scope contracted premises for ${n}.`,'monthly_snapshot']);
a.push([`mar_${z}_built`,['march_snapshot'],`The March 2026 BDUK snapshot listed ${mb.toLocaleString('en-GB')} built contracted premises for ${n}.`,'monthly_snapshot']);
a.push([`delta_feb_mar_${z}_built`,['february_snapshot','march_snapshot'],`The rounded built-premises figure for ${n} ${delta(mb-fb,'February','March 2026')}.`,'monthly_change']);
if(fb===0)a.push([`pct_feb_mar_${z}_built`,['february_snapshot','march_snapshot'],`The February-to-March built-premises percentage change for ${n} was not calculated because the February rounded value was zero; the absolute change was ${(mb-fb)>=0?'+':''}${(mb-fb).toLocaleString('en-GB')}.`,'monthly_change']);
else a.push([`pct_feb_mar_${z}_built`,['february_snapshot','march_snapshot'],`The rounded built-premises figure for ${n} changed by ${(((mb-fb)/fb)*100)>=0?'+':''}${(((mb-fb)/fb)*100).toFixed(2)}% from February to March 2026 (${fb.toLocaleString('en-GB')} to ${mb.toLocaleString('en-GB')}).`,'monthly_change']);
a.push([`continuity_feb_mar_${z}`,['february_snapshot','march_snapshot'],`The rounded initial-scope contracted-premises figure for ${n} ${delta(mc-fc,'February','March 2026')}; the supplier remained ${p}.`,'monthly_change']);}
for(const [id,doc,fact,g] of seed.consumer_seed)a.push([id,[doc],fact,g]);
return a.map((r,i)=>[...r,100,(i+1)%5===0?'REVALIDATION':'UPGRADE']);}
</script>
<script>Promise.all([fetch('extended_official_web_evidence_wave154_3800_20260801.json').then(r=>r.json()),fetch('extended_official_web_evidence_wave154_seed_20260801.json').then(r=>r.json())]).then(([d,s])=>{const rs=expand(s),docs=Object.fromEntries(d.documents.map(x=>[x.id,x]));document.getElementById('sum').textContent=`${d.assertion_pass}/${d.assertion_checks} PASS · ${rs.length} kayıt · ${d.official_documents} resmî belge · ${d.source_upgrades} yükseltme · ${d.source_revalidations} yeniden doğrulama · ${d.candidate_examples} aday · doğruluk %${d.assertion_accuracy_percent.toFixed(2)} · business satırı 0 · parsel terfisi 0.`;const b=document.getElementById('rows');rs.forEach((x,i)=>{const tr=document.createElement('tr'),links=x[1].map(id=>`<a href="${docs[id].url}">${docs[id].title}</a>`).join('<br>'),pubs=[...new Set(x[1].map(id=>docs[id].publisher))].join(' / ');tr.innerHTML=`<td>${i+1}</td><td>${pubs}</td><td>${links}</td><td>${x[2]}</td><td>${d.scope_guards[x[3]]}</td><td>${x[4].toFixed(1)}</td><td>${x[5]}</td>`;b.appendChild(tr)})}).catch(e=>document.getElementById('sum').textContent='Kanıt yüklenemedi: '+e);</script>
