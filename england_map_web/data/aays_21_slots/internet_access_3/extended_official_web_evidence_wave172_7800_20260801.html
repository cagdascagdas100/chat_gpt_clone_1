   [`jul_${z}_completion_rank`,[`july_snapshot`],`${n} has competition rank ${rank(rv,r)} by calculated July completion ratio, descending.`,'derived_distribution'],
   [`jul_${z}_unbuilt_rank`,[`july_snapshot`],`${n} has competition rank ${rank(uv,u)} by rounded July unbuilt premises, descending.`,'derived_distribution'],
   [`jul_${z}_supplier_contracted_total`,[`july_snapshot`],`For the July rows, supplier ${s} has a row-summed contracted total of ${sc.toLocaleString('en-GB')}; ${n} is one contributing contract.`,'supplier_aggregate'],

   [`jul_${z}_supplier_contract_rank`,[`july_snapshot`],`Supplier ${s}, associated with ${n}, has competition rank ${rank(scv,sc)} by row-summed July contracted premises.`,'supplier_aggregate'],

 }
 for(const [id,doc,fact,g] of seed.consumer_seed)a.push([id,[doc],fact,g]);
