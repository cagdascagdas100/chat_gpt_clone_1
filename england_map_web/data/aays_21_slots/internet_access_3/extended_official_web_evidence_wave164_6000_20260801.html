<script>
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const rank=(arr,v)=>1+arr.filter(x=>x>v).length;
function expand(seed){
 const a=[], rows=seed.contract_seed, tc=seed.displayed_totals.contracted, tb=seed.displayed_totals.built;
 const cs=rows.map(x=>x[2]), bs=rows.map(x=>x[3]), gs=rows.map(x=>x[2]-x[3]), ss=rows.map(x=>x[2]?100*x[3]/x[2]:0);
 const agg={}; for(const [n,p,c,b] of rows){if(!agg[p])agg[p]={count:0,c:0,b:0};agg[p].count++;agg[p].c+=c;agg[p].b+=b;}
 for(const [n,p,c,b] of rows){const z=slug(n),g=c-b,s=c?100*b/c:0,q=agg[p];
  a.push([`jul_${z}_supplier`,['july_snapshot'],`The July 2026 BDUK snapshot listed ${p} as supplier for ${n}.`,'monthly_snapshot']);
  a.push([`jul_${z}_contracted`,['july_snapshot'],`The July 2026 snapshot listed ${c.toLocaleString('en-GB')} initial-scope contracted premises for ${n}.`,'monthly_snapshot']);
  a.push([`jul_${z}_built`,['july_snapshot'],`The July 2026 snapshot listed ${b.toLocaleString('en-GB')} built contracted premises for ${n}.`,'monthly_snapshot']);
  a.push([`jul_${z}_gap`,['july_snapshot'],`The displayed contracted-minus-built arithmetic gap for ${n} was ${g.toLocaleString('en-GB')}.`,'derived_snapshot']);
  a.push([`jul_${z}_built_share`,['july_snapshot'],`The displayed built count for ${n} was ${s.toFixed(2)}% of its displayed contracted count.`,'derived_snapshot']);
  a.push([`jul_${z}_contracted_total_share`,['july_snapshot'],`${n} represented ${(100*c/tc).toFixed(2)}% of the displayed July contracted total.`,'derived_snapshot']);
  a.push([`jul_${z}_built_total_share`,['july_snapshot'],`${n} represented ${(100*b/tb).toFixed(2)}% of the displayed July built total.`,'derived_snapshot']);
  a.push([`jul_${z}_contracted_rank`,['july_snapshot'],`${n} ranked ${rank(cs,c)} by displayed contracted premises using competition ranking.`,'derived_snapshot']);
  a.push([`jul_${z}_built_rank`,['july_snapshot'],`${n} ranked ${rank(bs,b)} by displayed built premises using competition ranking.`,'derived_snapshot']);
  a.push([`jul_${z}_gap_rank`,['july_snapshot'],`${n} ranked ${rank(gs,g)} by displayed contracted-minus-built gap using competition ranking.`,'derived_snapshot']);
  a.push([`jul_${z}_share_rank`,['july_snapshot'],`${n} ranked ${rank(ss,s)} by displayed built-to-contracted percentage using competition ranking.`,'derived_snapshot']);
  a.push([`jul_${z}_supplier_contract_count`,['july_snapshot'],`${p} appeared on ${q.count} displayed July contract rows.`,'supplier_aggregate']);
  a.push([`jul_${z}_supplier_contracted_total`,['july_snapshot'],`${p}'s displayed July contract rows summed to ${q.c.toLocaleString('en-GB')} contracted premises.`,'supplier_aggregate']);
  a.push([`jul_${z}_supplier_built_total`,['july_snapshot'],`${p}'s displayed July contract rows summed to ${q.b.toLocaleString('en-GB')} built premises.`,'supplier_aggregate']);
  a.push([`jul_${z}_supplier_built_share`,['july_snapshot'],`${p}'s displayed July built total was ${(100*q.b/q.c).toFixed(2)}% of its displayed contracted total.`,'supplier_aggregate']);
 }
 for(const [id,doc,fact,g] of seed.consumer_seed)a.push([id,[doc],fact,g]);
 return a.map((r,i)=>[...r,100,(i+1)%5===0?'REVALIDATION':'UPGRADE']);
}
</script>
<script>Promise.all([fetch('extended_official_web_evidence_wave164_6000_20260801.json').then(r=>r.json()),fetch('extended_official_web_evidence_wave164_seed_20260801.json').then(r=>r.json())]).then(([d,s])=>{const rs=expand(s),docs=Object.fromEntries(d.documents.map(x=>[x.id,x]));document.getElementById('sum').textContent=`${d.assertion_pass}/${d.assertion_checks} PASS · ${rs.length} kayıt · ${d.official_documents} resmî belge · ${d.source_upgrades} yükseltme · ${d.source_revalidations} yeniden doğrulama · ${d.candidate_examples} aday · doğruluk %${d.assertion_accuracy_percent.toFixed(2)} · business satırı 0 · parsel terfisi 0.`;const b=document.getElementById('rows');rs.forEach((x,i)=>{const tr=document.createElement('tr'),links=x[1].map(id=>`<a href="${docs[id].url}">${docs[id].title}</a>`).join('<br>'),pubs=[...new Set(x[1].map(id=>docs[id].publisher))].join(' / ');tr.innerHTML=`<td>${i+1}</td><td>${pubs}</td><td>${links}</td><td>${x[2]}</td><td>${d.scope_guards[x[3]]}</td><td>${x[4].toFixed(1)}</td><td>${x[5]}</td>`;b.appendChild(tr)})}).catch(e=>document.getElementById('sum').textContent='Kanıt yüklenemedi: '+e);</script>
