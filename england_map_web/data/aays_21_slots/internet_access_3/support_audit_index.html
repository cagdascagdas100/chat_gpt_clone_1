<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>internet_access_3 destek denetimi</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f5f7fa;color:#172033}h1,h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.card,table{background:#fff;border:1px solid #dce2ea;border-radius:10px;box-shadow:0 1px 3px #0001}.card{padding:14px}.value{font-size:1.6rem;font-weight:700}.muted{color:#5e6b7d;font-size:.9rem}table{width:100%;border-collapse:collapse;overflow:hidden;margin:12px 0 24px}th,td{padding:9px 10px;border-bottom:1px solid #e7ebf0;text-align:left;vertical-align:top;font-size:.9rem}th{background:#eef2f7}.PASS{font-weight:700;color:#167545}.BLOCKED{font-weight:700;color:#b54708}.null{color:#7a8699}code{font-size:.82rem;white-space:pre-wrap;overflow-wrap:anywhere}#error{white-space:pre-wrap;color:#b42318}
</style>
</head>
<body>
<h1>internet_access_3 — satır satır destek denetimi</h1>
<div class="muted" id="meta">Yükleniyor…</div>
<div class="grid" id="metrics"></div>
<h2>İşlemler</h2><table><thead><tr><th>Dalga</th><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt / ayrıntı</th></tr></thead><tbody id="ops"></tbody></table>
<h2>Şeffaf örnek adaylar</h2><table><thead><tr><th>Dalga</th><th>Satır</th><th>Durum</th><th>Değer</th><th>Kanıt alanları</th><th>Güven</th><th>Yükseltilebilir</th></tr></thead><tbody id="examples"></tbody></table>
<h2>Doğrulanan resmî kaynaklar</h2><table><thead><tr><th>Dalga</th><th>Kaynak</th><th>Doğruluk</th><th>Doğrulanan rol</th></tr></thead><tbody id="sources"></tbody></table>
<h2>Açık engeller</h2><table><thead><tr><th>Kod</th><th>Durum</th></tr></thead><tbody id="blockers"></tbody></table>
<div id="error"></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${u}: HTTP ${r.status}`);return r.json()});
const waveOps=w=>Array.isArray(w.operations)?w.operations:Array.isArray(w.operations_compact)?w.operations_compact.map(r=>({line:r[0],operation:r[1],status:r[2]??w.operation_status_default??'PASS',detail:r[3]??w.operation_detail_default??''})):Array.isArray(w.operation_names)?w.operation_names.map((name,i)=>({line:(w.operation_line_start??1)+i,operation:name,status:w.operation_status_default??'PASS',detail:w.operation_detail_default??''})):[];
const waveExamples=w=>{if(Array.isArray(w.candidate_examples))return w.candidate_examples;const r=w.candidate_example_range;if(!r)return[];const{start,end,...template}=r;return Array.from({length:end-start+1},(_,i)=>({...template,canonical_row:start+i}))};
get('support_audit_summary_latest.json').then(s=>Promise.all((s.wave_paths||[]).map(get)).then(waves=>({s,waves}))).then(({s,waves})=>{
 const ops=waves.flatMap((w,x)=>waveOps(w).map(y=>({...y,wave:w.wave??x+1}))).sort((x,y)=>x.line-y.line);
 const examples=waves.flatMap((w,x)=>waveExamples(w).map(y=>({...y,wave:w.wave??x+1})));
 const sources=waves.flatMap((w,x)=>(w.official_sources||[]).map(y=>({...y,wave:w.wave??x+1})));
 const m=s.metrics;
 document.getElementById('meta').textContent=`${s.updated_at} | ${s.state} | aynı attempt: ${s.attempt_id} | dalga 1–${waves.length}`;
 const delta=m.support_audit_exact_delta_from_previous_wave_percent??0;
 const cards=[['Destek akışı',`${m.support_operations_completed}/${m.support_operations_total}`],['Destek ilerleme',`${m.support_audit_progress_percent}%`],['Kesin ilerleme',`${m.support_audit_exact_progress_percent}%`],['Son dalga artışı',`+${delta}`],['Bu tur işlemler',m.operations_added_this_continuation],['Bu tur örnek',m.examples_added_this_continuation],['Bu tur kaynak',m.unique_sources_added_this_continuation],['Hazır aday',m.prepared_manifest_candidates],['Gösterilen örnek',m.transparent_example_rows],['Runtime aday',m.runtime_revalidated_candidates],['Kaynak rolleri',m.static_official_source_roles_verified],['Benzersiz kaynak',m.unique_official_sources_verified],['Kaynak doğruluğu',`${m.mean_static_source_accuracy_score}/100`],['Parsel eşleşme',`${m.parcel_match_accuracy_score}/100`],['Runtime pipeline',`${m.runtime_pipeline_steps_completed}/${m.runtime_pipeline_steps_total}`],['Runtime test',`${m.runtime_contract_tests_completed}/${m.runtime_contract_tests_total}`],['Runtime kaynak',`${m.runtime_official_source_checks_completed}/${m.runtime_official_source_checks_total}`],['Genel runtime',`${m.runtime_progress_percent}%`]];
 document.getElementById('metrics').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('');
 document.getElementById('ops').innerHTML=ops.map(o=>`<tr><td>${o.wave}</td><td>${o.line}</td><td><code>${esc(o.operation)}</code></td><td class="${esc(o.status)}">${esc(o.status)}</td><td>${esc(o.detail)}</td></tr>`).join('');
 const omit=new Set(['wave','canonical_row','candidate_state','candidate_value','internet_match_confidence','promotion_allowed']);
 const evidence=x=>Object.fromEntries(Object.entries(x).filter(([k])=>!omit.has(k)));
 document.getElementById('examples').innerHTML=examples.map(x=>`<tr><td>${x.wave}</td><td>${x.canonical_row}</td><td>${esc(x.candidate_state)}</td><td class="null">${x.candidate_value==null?'null':esc(x.candidate_value)}</td><td><code>${esc(JSON.stringify(evidence(x)))}</code></td><td>${x.internet_match_confidence}</td><td>${x.promotion_allowed?'evet':'hayır'}</td></tr>`).join('');
 document.getElementById('sources').innerHTML=sources.map(x=>`<tr><td>${x.wave}</td><td>${esc(x.authority)} — ${esc(x.source_id)}</td><td>${x.accuracy_score}/100</td><td>${(x.verified_facts||[]).map(esc).join('<br>')}</td></tr>`).join('');
 const blockerCodes=[...new Set(waves.flatMap(w=>w.blockers||[]))];
 document.getElementById('blockers').innerHTML=blockerCodes.map(x=>`<tr><td><code>${esc(x)}</code></td><td class="BLOCKED">BLOCKED</td></tr>`).join('');
}).catch(e=>document.getElementById('error').textContent='Veri yüklenemedi: '+e.message);
</script>
</body>
</html>
