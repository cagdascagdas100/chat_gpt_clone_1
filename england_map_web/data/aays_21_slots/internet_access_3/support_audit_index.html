<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>internet_access_3 destek denetimi</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f5f7fa;color:#172033}h1,h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.card,table{background:#fff;border:1px solid #dce2ea;border-radius:10px;box-shadow:0 1px 3px #0001}.card{padding:14px}.value{font-size:1.6rem;font-weight:700}.muted{color:#5e6b7d;font-size:.9rem}table{width:100%;border-collapse:collapse;overflow:hidden;margin:12px 0 24px}th,td{padding:9px 10px;border-bottom:1px solid #e7ebf0;text-align:left;vertical-align:top;font-size:.9rem}th{background:#eef2f7}.PASS{font-weight:700;color:#167545}.BLOCKED{font-weight:700;color:#b54708}.null{color:#7a8699}code{font-size:.82rem}#error{white-space:pre-wrap;color:#b42318}
</style>
</head>
<body>
<h1>internet_access_3 — satır satır destek denetimi</h1>
<div class="muted" id="meta">Yükleniyor…</div>
<div class="grid" id="metrics"></div>
<h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt / ayrıntı</th></tr></thead><tbody id="ops"></tbody></table>
<h2>Şeffaf örnek adaylar</h2><table><thead><tr><th>Satır</th><th>Durum</th><th>Değer</th><th>Güven</th><th>Yükseltilebilir</th></tr></thead><tbody id="examples"></tbody></table>
<h2>Doğrulanan resmî kaynaklar</h2><table><thead><tr><th>Kaynak</th><th>Doğruluk</th><th>Doğrulanan rol</th></tr></thead><tbody id="sources"></tbody></table>
<div id="error"></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('support_audit_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
 document.getElementById('meta').textContent=`${d.checked_at} | ${d.state} | attempt: ${d.attempt_id}`;
 const m=d.metrics;const cards=[['Destek akışı',`${m.support_operations_completed}/${m.support_operations_total}`],['Destek ilerleme',`${m.support_audit_progress_percent}%`],['Hazır aday',d.candidate_summary.prepared_manifest_candidates],['Runtime aday',d.candidate_summary.runtime_revalidated_candidates],['Kaynak doğruluğu',`${m.source_schema_accuracy_score}/100`],['Parsel eşleşme',`${m.parcel_match_accuracy_score}/100`],['Runtime pipeline',`${m.runtime_pipeline_steps_completed}/${m.runtime_pipeline_steps_total}`],['Genel runtime',`${m.overall_runtime_progress_percent}%`]];
 document.getElementById('metrics').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('');
 document.getElementById('ops').innerHTML=d.operations.map(o=>`<tr><td>${o.line}</td><td><code>${esc(o.operation)}</code></td><td class="${esc(o.status)}">${esc(o.status)}</td><td>${esc(o.detail)}</td></tr>`).join('');
 document.getElementById('examples').innerHTML=d.candidate_examples.map(x=>`<tr><td>${x.canonical_row}</td><td>${esc(x.candidate_state)}</td><td class="null">${x.candidate_value===null?'null':esc(x.candidate_value)}</td><td>${x.internet_match_confidence}</td><td>${x.promotion_allowed?'evet':'hayır'}</td></tr>`).join('');
 document.getElementById('sources').innerHTML=d.official_sources.map(s=>`<tr><td>${esc(s.authority)} — ${esc(s.source_id)}</td><td>${s.accuracy_score}/100</td><td>${s.verified_facts.map(esc).join('<br>')}</td></tr>`).join('');
}).catch(e=>document.getElementById('error').textContent='Veri yüklenemedi: '+e.message);
</script>
</body>
</html>
