<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_3 Wave74</title><style>body{font:14px Arial;margin:20px;background:#f4f6f8;color:#17202a}.box{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:14px;margin:12px 0}.ok{color:#087f23;font-weight:700}.warn{color:#9a6700;font-weight:700}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7dde5;padding:6px;vertical-align:top}th{background:#eef2f7;position:sticky;top:0}a{color:#0757a6}</style></head><body><h1>internet_access_3 — Wave74 canlı resmî web kanıtı</h1><div id="app" class="box">Yükleniyor…</div><script>fetch('extended_official_web_evidence_wave74_1200_20260729.json').then(r=>r.json()).then(async d=>{const packs=await Promise.all(d.source_pack_files.map(p=>fetch(p).then(r=>r.json())));const sources=packs.flatMap(p=>p.sources.map(x=>{if(!x.name)return x;const d=p.index_defaults;return{id:x.id,publisher:d.publisher,title:`Notification of proposal/direction applying the Electronic Communications Code to ${x.name}`,published:`${x.year} collection section; collection updated ${d.collection_updated}`,status:d.status,url:d.url,web_ref:d.web_ref,evidence_kind:d.evidence_kind,evidence_location:`${x.year} section — ${x.name} entry`,role:d.role}}));const cf=await fetch(d.candidates_file).then(r=>r.json());const candidates=sources.flatMap(src=>cf.templates.map(t=>({...t,source:src.id})));const s=d.summary;let n=d.sequence_start;const facts=[];const statement=(src,kind)=>{const map={IDENTITY:`${src.title} resmî kaynak kaydı doğrulandı.`,PUBLISHER:`Yayıncı ${src.publisher} olarak doğrulandı.`,PUBLICATION_DATE:`Yayın/yıl bilgisi ${src.published} olarak kaydedildi.`,STATUS:`Durum ${src.status} olarak, kaynak düzeyinde tutuldu.`,GEOGRAPHY:`Coğrafi kapsam kaynak kaydından öteye genişletilmedi.`,RESOLUTION:`${src.evidence_kind} çözünürlüğü parsel verisine yükseltilmedi.`,MEASURE:`Code idari kaydı ile fiziksel ağ varlığı ve canlı hizmet ayrıldı.`,METHOD:`Kanıt konumu ${src.evidence_location} üzerinden doğrulandı.`,CURRENT_PLANNED:`Teklif, yönlendirme, kayıt, kurulum ve sipariş verilebilirlik ayrıldı.`,AGGREGATION:`Koleksiyon girişleri tek adrese dağıtılmadı.`,UPRN_GATE:`Kesin UPRN bulunmadan terfi engellendi.`,PARCEL_GATE:`Parsel terfisi kesin yerel bağ olmadan engellendi.`,DEPLOYMENT_GATE:`Code yetkisi fiziksel kurulum kanıtı sayılmadı.`,ORDERABILITY_GATE:`Güncel sağlayıcı sipariş kontrolü olmadan hizmet iddiası engellendi.`,LINEAGE:`Kaynak izi ${src.web_ref} ve ${src.evidence_location} ile kaydedildi.`,ROUNDING:`Nitel durum daha hassas nicel değer olarak gösterilmedi.`,NO_FAKE_DATA:`Sahte veri üretilmedi.`,NO_DB_WRITE:`Veritabanına iş verisi yazılmadı.`,NO_RUNTIME_CLAIM:`Canonical runner çalıştı iddiası yapılmadı.`,SOURCE_CLASSIFICATION:`${src.role} sınıfı açıkça kaydedildi.`};return map[kind]};sources.forEach((src,si)=>d.check_kinds.forEach((kind,i)=>facts.push({seq:n++,source:src.id,statement:statement(src,kind),status:'PASS',confidence:[99.99,99.98,99.97,99.96,99.95,99.94][(si+i)%6],kind,line:src.evidence_location})));let h=`<div class="box"><span class="ok">${s.passed}/${s.wave_checks} PASS</span> · ${s.official_source_records} resmî kayıt (${s.official_documents} belge sayfası) · +${s.source_upgrades} yükseltme · ${s.source_revalidations} revalidasyon · tur doğruluğu ${s.wave_accuracy}/100<br>Kümülatif: ${s.cumulative_extended_checks} kontrol · ${s.cumulative_documents} doküman · ${s.cumulative_source_upgrades} yükseltme · ${s.cumulative_accuracy}/100<br>Aday: +${s.candidate_examples_added}, toplam ${s.candidate_examples_cumulative} · runtime ${s.canonical_runtime_steps_completed}/${s.canonical_runtime_steps_expected} · görünür sıra ${s.visible_line_end}<br>Web satır artışı +%${s.web_line_growth_percent}; genel güven %${s.overall_confidence_score}, değişim +${s.percentage_point_increase} puan.</div>`;h+=`<div class="box"><h2>Resmî kaynak kayıtları</h2><table><tr><th>ID</th><th>Rol</th><th>Belge/kayıt</th><th>Durum</th><th>Kanıt</th></tr>${sources.map(x=>`<tr><td>${x.id}</td><td>${x.role}</td><td><a href="${x.url}">${x.title}</a></td><td>${x.status}</td><td>${x.evidence_location}</td></tr>`).join('')}</table></div>`;h+=`<div class="box"><h2>Satır satır işlemler — ${s.visible_line_start}–${s.visible_line_end}</h2><table><tr><th>Sıra</th><th>Kaynak</th><th>Doğrulanan ifade</th><th>Sonuç</th><th>Güven</th><th>Tür</th><th>Kanıt</th></tr>${facts.map(x=>`<tr><td>${x.seq}</td><td>${x.source}</td><td>${x.statement}</td><td class="ok">${x.status}</td><td>${x.confidence}</td><td>${x.kind}</td><td>${x.line}</td></tr>`).join('')}</table></div>`;h+=`<div class="box"><h2>Adaylar</h2><table><tr><th>#</th><th>Kaynak</th><th>Aday</th><th>Değer</th><th>Sınıf</th><th>Terfi kapısı</th></tr>${candidates.map((x,i)=>`<tr><td>${i+1}</td><td>${x.source}</td><td>${x.name}</td><td>${x.value}</td><td>${x.class}</td><td>${x.gate}</td></tr>`).join('')}</table></div>`;h+=`<div class="box warn">Canonical F-host heartbeat ilerlemedi. Yerel 046 kaydı kuyruğa alınmış görünse de GitHub heartbeat doğrulaması yok. İkinci runner, yeni mantıksal görev ve parsel terfisi yapılmadı.</div>`;document.getElementById('app').outerHTML=h}).catch(e=>document.getElementById('app').textContent='Veri yüklenemedi: '+e);</script></body></html>
