<script>
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const delta=(v,a,b)=>v===0?`was unchanged from ${a} to ${b}`:`${v>0?'increased':'decreased'} by ${Math.abs(v).toLocaleString('en-GB')} from ${a} to ${b}`;
function expand(seed){const a=[];for(const [n,p,ac,ab,mc,mb,jc,jb] of seed.contract_seed){const z=slug(n);a.push([`apr_${z}_supplier`,['april_snapshot'],`The April 2026 BDUK snapshot listed ${p} as supplier for ${n}.`,'monthly_snapshot']);a.push([`apr_${z}_contracted`,['april_snapshot'],`The April 2026 BDUK snapshot listed ${ac.toLocaleString('en-GB')} initial-scope contracted premises for ${n}.`,'monthly_snapshot']);a.push([`apr_${z}_built`,['april_snapshot'],`The April 2026 BDUK snapshot listed ${ab.toLocaleString('en-GB')} built contracted premises for ${n}.`,'monthly_snapshot']);a.push([`delta_apr_may_${z}_built`,['april_snapshot','may_snapshot'],`The rounded built-premises figure for ${n} ${delta(mb-ab,'April','May 2026')}.`,'monthly_change']);a.push([`delta_may_jun_${z}_built`,['may_snapshot','june_snapshot'],`The rounded built-premises figure for ${n} ${delta(jb-mb,'May','June 2026')}.`,'monthly_change']);a.push([`delta_apr_jun_${z}_contracted`,['april_snapshot','june_snapshot'],`The rounded initial-scope contracted-premises figure for ${n} ${delta(jc-ac,'April','June 2026')}.`,'continuity']);if(ab===0)a.push([`pct_apr_jun_${z}_built`,['april_snapshot','june_snapshot'],`The April-to-June built-premises percentage change for ${n} was not calculated because the April rounded value was zero; the absolute change was ${(jb-ab)>=0?'+':''}${(jb-ab).toLocaleString('en-GB')}.`,'monthly_change']);else a.push([`pct_apr_jun_${z}_built`,['april_snapshot','june_snapshot'],`The rounded built-premises figure for ${n} changed by ${(((jb-ab)/ab)*100)>=0?'+':''}${(((jb-ab)/ab)*100).toFixed(2)}% from April to June 2026 (${ab.toLocaleString('en-GB')} to ${jb.toLocaleString('en-GB')}).`,'monthly_change']);}for(const [id,doc,fact,g] of seed.consumer_seed)a.push([id,[doc],fact,g]);return a.map((r,i)=>[...r,100,(i+1)%5===0?'REVALIDATION':'UPGRADE']);}
</script>
