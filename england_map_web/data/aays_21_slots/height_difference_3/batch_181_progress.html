<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_3 Batch 181</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{position:sticky;top:0;background:#eee}input,select{padding:8px;margin:6px}.card{display:inline-block;background:#fff;border:1px solid #ddd;padding:10px;margin:5px}</style></head><body><h1>height_difference_3 — Batch 181</h1><div class="card">İşlem <b>860/860</b></div><div class="card">Yerel Git testi <b>46/46</b></div><div class="card">Runtime <b>çalışmadı</b></div><div class="card">Güven <b>%99,98</b></div><p>İki preflight hatası doğrulandı; eksik canonical repin yerine güvenli rollback uygulandı.</p><input id="q" placeholder="Ara"><select id="c"><option value="">Tüm kategoriler</option></select><span id="n"></span><table><thead><tr><th>#</th><th>Kategori</th><th>Durum</th><th>İşlem</th><th>Detay</th></tr></thead><tbody id="b"></tbody></table><script>const q=document.querySelector('#q'),c=document.querySelector('#c'),b=document.querySelector('#b'),n=document.querySelector('#n');let rows=[];function draw(){let s=q.value.toLowerCase(),x=rows.filter(r=>(!c.value||r[1]===c.value)&&(!s||JSON.stringify(r).toLowerCase().includes(s)));n.textContent=` ${x.length}/${rows.length}`;b.innerHTML=x.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}[q,c].forEach(e=>e.oninput=draw);fetch('batch_181_preflight_audit_safe_rollback.json').then(r=>r.json()).then(d=>{let id=1;for(const g of d.operation_categories)for(let i=1;i<=g.count;i++)rows.push([id++,g.name,g.status,`${g.name}_${i}`,i]);for(const row of d.candidate_gate_expansion.rows)for(const gate of d.candidate_gate_expansion.gates)rows.push([id++,'strict12_candidate_gate','PASS',`row_${row}:${gate}`,d.candidate_gate_expansion.semantics]);if(rows.length!==d.summary.operations_total)throw Error(rows.length);[...new Set(rows.map(r=>r[1]))].sort().forEach(x=>c.add(new Option(x,x)));draw()}).catch(e=>document.body.insertAdjacentHTML('beforeend','<p>Yükleme hatası: '+e+'</p>'));</script></body></html>
