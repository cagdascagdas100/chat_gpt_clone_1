<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 123</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 123 provenance QA</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_123_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);p.fresh_source_evidence.forEach(x=>add('SOURCE',x.id,'PASS',`${x.provider} — ${x.fact}`));p.candidate_provenance_qa.forEach(x=>add('CANDIDATE_QA',x.parcel_id,'PASS',`INSPIRE ${x.inspire_id}; tile=${x.required_tile}; HMLR lifecycle=${x.hmlr_lifecycle_metadata_required}; EA survey metadata=${x.ea_survey_metadata_required}; OS tile metadata=${x.os_tile_metadata_required}; promotion=false`));p.new_guards.forEach((g,i)=>add('GUARD',`B123_G${String(i+1).padStart(3,'0')}`,'PASS',g));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++){qa++;add('ASSERTION',`B123_${g[0]}_${String(i).padStart(3,'0')}`,'PASS',`${g[0]} ${i}/${g[1]}`)}});for(let i=0;i<p.runtime_action_rows;i++){add('RUNTIME_ACTION',`B123_OP_${String(i+1).padStart(3,'0')}`,'PREPARED',p.runtime_action_phases[i%p.runtime_action_phases.length])}p.active_blockers.forEach((b,i)=>add('RUNTIME_GATE',`B123_BLOCK_${i+1}`,'BLOCKED',b));const m=p.metrics;document.getElementById('summary').textContent=`16 source checks | 4 candidate QA | 32 guards | ${qa}/${m.validation_assertions_total} QA | ${m.runtime_action_rows} runtime actions prepared | ${n} visible rows | cumulative=${m.published_website_rows_cumulative} | blockers=${m.batch_active_blocked_runtime_gates} | pending=0 | final_ready=false`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
