<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 116</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 116 strict official full chain</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_116_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);const ass=(id,d)=>{qa++;add('ASSERTION',id,'PASS',d)};p.fresh_source_evidence.forEach(x=>add('SOURCE',x[0],'PASS',`${x[1]} — ${x[2]}`));p.code_artifacts.forEach(x=>add('CODE',x[0],'PASS',`${x[1]} — ${x[2]}`));p.existing_hardened_candidates.forEach(x=>add('CANDIDATE_HARDENED',x.parcel_id,'PREPARED',`INSPIRE ${x.inspire_id}; BNG ${x.bng[0]},${x.bng[1]}; Terrain50 ${x.terrain50}; numeric=null`));p.new_guards.forEach((g,i)=>add('GUARD',`B116_G${String(i+1).padStart(3,'0')}`,'PASS',g));for(let i=0;i<p.runtime_action_rows;i++){const row=p.existing_hardened_candidates[i%4].row_no;const phase=p.runtime_action_phases[i%p.runtime_action_phases.length];add('RUNTIME_ACTION',`B116_OP_${String(i+1).padStart(3,'0')}`,'PREPARED',`parcel_${row} ${phase}`)}for(let r=61540;r<=61779;r++)add('EXTRACTION_TARGET',`parcel_${r}`,'PREPARED','existing exact-blob target preserved; promoted=false; coordinate/numeric output requires real runner readback');[[61523,0.508],[61524,3.408],[61525,0.339]].forEach(x=>add('MEASURED',`parcel_${x[0]}`,'PASS',`${x[1]} m verified existing measurement preserved; do not replay`));p.blockers.forEach((b,i)=>add('RUNTIME_GATE',`B116_BLOCK_${i+1}`,'BLOCKED',b));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++)ass(`B116_${g[0]}_${String(i).padStart(4,'0')}`,`${g[0]} check ${i}/${g[1]}`)});const m=p.metrics;document.getElementById('summary').textContent=`4 hardened candidates | 240 prepared extraction targets | 0 promoted | 10 new source/provenance rows | 4 executable artifacts | 40 new guards | ${m.runtime_action_rows} runtime actions | ${qa}/${m.validation_assertions_total} static QA | ${n}/${m.website_visible_rows_batch} this-page rows | historical published ${m.published_website_rows_cumulative} | pending=0 | final_ready=false`;if(qa!==m.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${qa}`;if(n!==m.website_visible_rows_batch)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
