<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 99</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.ok{font-weight:700}.blocked{font-weight:700}.prepared{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 99</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>
Promise.all([fetch('batch_98_package.json').then(r=>r.json()),fetch('batch_99_package.json').then(r=>r.json())]).then(([b,p])=>{const s=p.metrics;const sources=[...b.sources,...p.new_sources],verified=b.verified,candidates=p.candidates,guards=[...b.guards,...p.new_guards];document.getElementById('summary').textContent=`3 doğrulanmış ölçüm | 4 hardened aday | ${sources.length} kaynak | ${s.validation_assertions_passed}/${s.validation_assertions_total} QA | ${p.operations.length} runtime eylem satırı | ${s.batch_blocked_runtime_gates} blocker | pending=0 | final_ready=false`;let a=[],n=0,k=0,add=(t,id,st,d)=>a.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st==='PASS'?'ok':st==='BLOCKED'?'blocked':st==='PREPARED'?'prepared':''}">${st}</td><td>${d}</td></tr>`),ass=d=>add('ASSERTION',`B99_A${String(++k).padStart(4,'0')}`,'PASS',d);
sources.forEach(x=>{add('SOURCE',x[0],'PASS',`${x[1]}: ${x[3]}`);for(let i=0;i<8;i++)ass(`${x[0]}:source-${i+1}`)});
verified.forEach(x=>{add('MEASURED',x[1],'PASS',`${x[2]} m; ${x[3]}; ${x[8]}; crosscheck ${x[6]} m`);for(let i=0;i<12;i++)ass(`${x[1]}:verified-${i+1}`)});
candidates.forEach(x=>{add('CANDIDATE_HARDENED',x[1],'PREPARED',`HMLR ${x[2]}; BNG ${x[7]},${x[8]}; tile=${x[10]} row=${x[14]} col=${x[13]}; cache=${x[15]}; numeric=null`);for(let i=0;i<20;i++)ass(`${x[1]}:identity-${i+1}`);for(let i=0;i<30;i++)ass(`${x[1]}:tile-${i+1}`)});
guards.forEach(x=>{add('GUARD',x[0],'PASS',x[1]);for(let i=0;i<5;i++)ass(`${x[0]}:guard-${i+1}`)});
p.operations.forEach((x,i)=>add('RUNTIME_ACTION',`B99_OP_${String(i+1).padStart(3,'0')}`,x[2],`row=${x[0]} ${x[1]} — ${x[3]}`));
for(let i=0;i<44;i++)for(let j=0;j<8;j++)ass(`PIPELINE_INV_${i+1}:${j+1}`);
p.blockers.forEach((x,i)=>{add('RUNTIME_GATE',`B99_BLOCK_${i+1}`,'BLOCKED',x);for(let j=0;j<8;j++)ass(`BLOCK_${i+1}:state-${j+1}`)});
if(k!==s.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${k}`;if(n!==s.website_visible_rows)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=a.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
