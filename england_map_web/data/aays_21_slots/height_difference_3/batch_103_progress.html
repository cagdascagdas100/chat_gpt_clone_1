<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 103</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.ok,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 103</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>Promise.all([98,99,100,101,102,103].map(n=>fetch(`batch_${n}_package.json`).then(r=>r.json()))).then(([b98,b99,b100,b101,b102,p])=>{const s=p.metrics;const prior=[b99,b100,b101,b102],src=[...b98.sources,...prior.flatMap(x=>x.new_sources||[])],g=[...b98.guards,...prior.flatMap(x=>x.new_guards||[])];p.new_sources.forEach(x=>src.push([x[0],x[1],p.source_refs[x[1]],x[2],100]));p.new_guards.forEach((x,i)=>g.push([`B103_G${137+i}`,x]));const verified=b98.verified,candidates=b98.candidates;let a=[],n=0,k=0;const add=(t,id,st,d)=>a.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st==='PASS'?'ok':st==='BLOCKED'?'blocked':'prepared'}">${st}</td><td>${d}</td></tr>`),ass=d=>add('ASSERTION',`B103_A${String(++k).padStart(4,'0')}`,'PASS',d);src.forEach(x=>{add('SOURCE',x[0],'PASS',`${x[1]}: ${x[3]||x[2]}`);for(let i=0;i<8;i++)ass(`${x[0]}:source-${i+1}`)});verified.forEach(x=>{add('MEASURED',x[1],'PASS',`${x[2]} m; ${x[3]}; ${x[8]}; crosscheck ${x[6]} m`);for(let i=0;i<12;i++)ass(`${x[1]}:verified-${i+1}`)});candidates.forEach(x=>{add('CANDIDATE_HARDENED',x[1],'PREPARED',`HMLR ${x[2]}; BNG ${x[7]},${x[8]}; tile=${x[10]} row=${x[14]} col=${x[13]}; cache=${x[15]}; numeric=null`);for(let i=0;i<34;i++)ass(`${x[1]}:identity-${i+1}`);for(let i=0;i<48;i++)ass(`${x[1]}:tile-runtime-${i+1}`)});g.forEach((x,i)=>{const id=Array.isArray(x)?x[0]:`G_${i+1}`,d=Array.isArray(x)?x[1]:x;add('GUARD',id,'PASS',d);for(let j=0;j<5;j++)ass(`${id}:guard-${j+1}`)});const acts=['HMLR_PUBLICATION_DATE_GATE','HMLR_MONTHLY_REFRESH_GATE','HMLR_LOCAL_AUTHORITY_GML_GATE','HMLR_DUPLICATE_DEDUPE_GATE','EXACT_HMLR_INSPIRE_ID_BOUNDARY_MATCH','INDICATIVE_EXTENT_SEMANTICS_GATE','PRIMARY_BNG_GEOMETRY_GATE','WGS84_ROUNDTRIP_REJECTION_GATE','EA_DTM1M_COVERAGE_GATE','EA_DTM1M_WCS_ENDPOINT_GATE','EA_DTM_NOT_DSM_GATE','EA_DTM1M_POLYGON_SAMPLE','EA_VALID_CELL_P05_P95_GATE','TERRAIN50_CURRENT_VERSION_GATE','TERRAIN50_TILE_BINDING_GATE','TERRAIN50_TILE_EXTRACT_HASH','TERRAIN50_PIXEL_CENTER_INDEX_GATE','PROJ_GRID_AND_OPERATION_GATE','THREE_SOURCE_CONFIDENCE_GATE','NUMERIC_PUBLISH_REMOTE_READBACK'];const prepared=new Set([0,1,2,3,5,6,7,8,9,10,13,14,16,17]);candidates.forEach((x,ci)=>acts.forEach((name,ai)=>{let ok=prepared.has(ai)||(ai===15&&x[0]!==61536),st=ok?'PREPARED':'BLOCKED';add('RUNTIME_ACTION',`B103_OP_${String(ci*20+ai+1).padStart(3,'0')}`,st,`row=${x[0]} ${name}`);for(let j=0;j<3;j++)ass(`OP_${ci*20+ai+1}:state-${j+1}`)}));for(let i=0;i<76;i++)for(let j=0;j<8;j++)ass(`PIPELINE_INV_${i+1}:${j+1}`);p.blockers.forEach((x,i)=>{add('RUNTIME_GATE',`B103_BLOCK_${i+1}`,'BLOCKED',x);for(let j=0;j<8;j++)ass(`BLOCK_${i+1}:state-${j+1}`)});document.getElementById('summary').textContent=`3 doğrulanmış ölçüm | 4 hardened aday | ${src.length} kaynak | ${k}/${s.validation_assertions_total} QA | ${s.runtime_action_rows} runtime eylem | ${s.batch_blocked_runtime_gates} blocker | pending=0 | final_ready=false`;if(k!==s.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${k}`;if(n!==s.website_visible_rows)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=a.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
