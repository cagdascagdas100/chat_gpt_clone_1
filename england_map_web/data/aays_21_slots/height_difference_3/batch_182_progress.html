<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_3 Batch 182</title><style>body{font-family:system-ui,sans-serif;margin:20px;background:#f7f7f8;color:#171717}h1{margin-bottom:4px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.card{background:white;border:1px solid #ddd;border-radius:8px;padding:10px 14px}input,select{padding:8px;border:1px solid #bbb;border-radius:6px;margin-right:8px}table{width:100%;border-collapse:collapse;background:white;margin-top:12px}th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.PASS{font-weight:700}code{white-space:pre-wrap;word-break:break-word}@media(max-width:800px){table{font-size:12px}}</style></head><body><h1>height_difference_3 — Batch 182</h1><div>1.034 işlem satırı · snapshot-safe preflight canonical repin · host runtime çalıştırılmadı</div><div class="meta"><div class="card">İşlem: <b>1034/1034</b></div><div class="card">Yerel test: <b>86/86</b></div><div class="card">Uzak blob: <b>10/10</b></div><div class="card">Kaynak güveni: <b>%99,99</b></div><div class="card">Runtime çıktı: <b>0/22</b></div></div><div><input id="q" placeholder="Satırlarda ara"><select id="cat"><option value="">Tüm kategoriler</option></select><select id="status"><option value="">Tüm durumlar</option></select><span id="count"></span></div><div id="err"></div><table><thead><tr><th>#</th><th>Kategori</th><th>Durum</th><th>İşlem</th><th>Detay</th><th>Kaynak</th></tr></thead><tbody id="body"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];const cat=document.getElementById('cat'),status=document.getElementById('status'),q=document.getElementById('q'),body=document.getElementById('body'),count=document.getElementById('count');function add(c,s,a,d,src='CANONICAL_GITHUB_OR_LOCAL_VERIFICATION'){rows.push([rows.length+1,c,s,a,d,src])}function draw(){const n=q.value.toLowerCase(),f=rows.filter(r=>(!cat.value||r[1]===cat.value)&&(!status.value||r[2]===status.value)&&(!n||JSON.stringify(r).toLowerCase().includes(n)));count.textContent=` ${f.length} / ${rows.length} satır`;body.innerHTML=f.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td class="${esc(r[2])}">${esc(r[2])}</td><td>${esc(r[3])}</td><td><code>${esc(typeof r[4]==='string'?r[4]:JSON.stringify(r[4]))}</code></td><td>${esc(r[5])}</td></tr>`).join('')}[q,cat,status].forEach(e=>e.addEventListener('input',draw));fetch('batch_182_preflight_canonical_repin.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{d.state_operations.forEach(x=>add('state_check','PASS',x[0],x[1]));d.code_updates.forEach(x=>add('code_and_pin_update','PASS',x.path,{blob_sha:x.blob_sha,commit:x.commit_sha}));d.local_tests.forEach(x=>add('local_synthetic_test','PASS',x.name,x.detail));d.remote_readback_paths.forEach(x=>add('remote_blob_readback','PASS',x.path,{expected:x.blob_sha,remote:x.blob_sha}));d.pin_parity_paths.forEach(x=>add('pin_chain_parity','PASS',x.path,{declared:x.blob_sha,remote:x.blob_sha}));d.workflow_checks.forEach(x=>add('workflow_visibility','NO_RUN',x.commit,{runs:x.runs}));d.expected_output_paths.forEach(x=>add('expected_output_census','MISSING',x,'Exact GitHub path returned 404; runtime did not materialize output.'));d.official_source_checks.forEach(x=>add('official_source_check','PASS',x.provider,x.detail,'OFFICIAL_WEB'));d.chain_stages.forEach(x=>add('chain_stage_check','PASS',x,'Pinned or fail-closed; execution not claimed.'));d.publication_operations.forEach(x=>add('publication','PASS',x[0],x[1]));for(const rowId of d.candidate_gate_expansion.row_ids){for(const gate of d.candidate_gate_expansion.gates){add('strict12_candidate_gate','PASS',`row_${rowId}:${gate}`,{row_id:rowId,gate,semantics:d.candidate_gate_expansion.detail_semantics})}}if(rows.length!==d.expanded_operation_count)throw Error(`satır sayısı ${rows.length}/${d.expanded_operation_count}`);[...new Set(rows.map(r=>r[1]))].sort().forEach(x=>cat.add(new Option(x,x)));[...new Set(rows.map(r=>r[2]))].sort().forEach(x=>status.add(new Option(x,x)));draw()}).catch(e=>document.getElementById('err').textContent='İşlem paketi yüklenemedi: '+e);</script></body></html>
