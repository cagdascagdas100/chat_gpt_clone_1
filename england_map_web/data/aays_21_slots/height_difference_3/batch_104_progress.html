<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 104</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.ok,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 104</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>Promise.all([98,99,100,101,102,103,104].map(n=>fetch(`batch_${n}_package.json`).then(r=>r.json()))).then(([b98,b99,b100,b101,b102,b103,p])=>{const prior=[b99,b100,b101,b102,b103],s=p.metrics;const src=[...b98.sources,...prior.flatMap(x=>x.new_sources||[])];p.new_sources.forEach(x=>src.push([x[0],x[1],p.source_refs[x[1]],x[2],100]));const gs=[...b98.guards,...prior.flatMap(x=>x.new_guards||[]),...p.new_guards],verified=b98.verified,candidates=b98.candidates;let a=[],n=0,k=0;const add=(t,id,st,d)=>a.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st==='PASS'?'ok':st==='BLOCKED'?'blocked':'prepared'}">${st}</td><td>${d}</td></tr>`),ass=d=>add('ASSERTION',`B104_A${String(++k).padStart(4,'0')}`,'PASS',d);src.forEach(x=>{add('SOURCE',x[0],'PASS',`${x[1]}: ${x[3]||x[2]}`);for(let i=0;i<8;i++)ass(`${x[0]}:source-${i+1}`)});verified.forEach(x=>{add('MEASURED',x[1],'PASS',`${x[2]} m; ${x[3]}; ${x[8]}; crosscheck ${x[6]} m`);for(let i=0;i<12;i++)ass(`${x[1]}:verified-${i+1}`)});candidates.forEach(x=>{add('CANDIDATE_HARDENED',x[1],'PREPARED',`HMLR ${x[2]}; BNG ${x[7]},${x[8]}; tile=${x[10]}; numeric=null`);for(let i=0;i<38;i++)ass(`${x[1]}:identity-${i+1}`);for(let i=0;i<52;i++)ass(`${x[1]}:tile-runtime-${i+1}`)});gs.forEach((x,i)=>{let id,d;if(Array.isArray(x)){id=x[0];d=x[1]}else{id=`B104_G${String(i+1).padStart(3,'0')}`;d=x}add('GUARD',id,'PASS',d);for(let j=0;j<5;j++)ass(`${id}:guard-${j+1}`)});const acts=['HMLR_PUBLICATION_GATE','HMLR_METADATA_GATE','HMLR_MONTHLY_REFRESH_GATE','HMLR_LOCAL_AUTHORITY_GATE','HMLR_OGL_GATE','HMLR_DUPLICATE_DEDUPE_GATE','HMLR_EXACT_INSPIRE_ID_GATE','PRIMARY_BNG_GEOMETRY_GATE','WGS84_ROUNDTRIP_REJECTION','EA_DTM1M_PRIMARY_GATE','EA_DTM_NOT_DSM_GATE','EA_EPSG27700_GATE','EA_WCS_GATE','EA_VALID_CELL_GATE','EA_P05_P95_GATE','EA_SOURCE_ACCURACY_CONTEXT','TERRAIN50_VERSION_GATE','TERRAIN50_TILE_BINDING','TERRAIN50_TILE_HASH','TERRAIN50_CROSSCHECK','PROJ_NO_BALLPARK_GATE','PROJ_ONLY_BEST_GATE','THREE_SOURCE_CONFIDENCE','NUMERIC_PUBLISH_READBACK'];const prep=new Set([0,1,2,3,4,5,7,8,9,10,11,12,15,16,17,20,21]);candidates.forEach((x,ci)=>acts.forEach((name,ai)=>{let ok=prep.has(ai)||(ai===18&&x[0]!==61536),st=ok?'PREPARED':'BLOCKED';add('RUNTIME_ACTION',`B104_OP_${String(ci*24+ai+1).padStart(3,'0')}`,st,`row=${x[0]} ${name}`);for(let j=0;j<3;j++)ass(`OP_${ci*24+ai+1}:state-${j+1}`)}));for(let i=0;i<84;i++)for(let j=0;j<8;j++)ass(`PIPELINE_INV_${i+1}:${j+1}`);p.blockers.forEach((x,i)=>{add('RUNTIME_GATE',`B104_BLOCK_${i+1}`,'BLOCKED',x);for(let j=0;j<8;j++)ass(`BLOCK_${i+1}:state-${j+1}`)});document.getElementById('summary').textContent=`3 doğrulanmış ölçüm | 4 hardened aday | ${src.length} kaynak | ${k}/${s.validation_assertions_total} QA | ${s.runtime_action_rows} runtime eylem | ${s.batch_blocked_runtime_gates} blocker | pending=0 | final_ready=false`;if(k!==s.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${k}`;if(n!==s.website_visible_rows)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=a.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
