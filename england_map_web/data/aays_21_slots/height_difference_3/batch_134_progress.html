<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 134</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 134 SHA-pinned coordinator wiring</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_134_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);p.fresh_source_evidence.forEach(x=>add(x.provider==='Canonical repository'?'WIRING_SOURCE':'SOURCE',x.id,'PASS',`${x.provider} — ${x.fact}`));p.existing_candidate_qa.forEach(x=>add('CANDIDATE_QA',`parcel_${x.row_no}`,'PASS',`INSPIRE ${x.inspire_id}; tile=${x.tile}; numeric_promotion=false`));p.new_guards.forEach((g,i)=>add('GUARD',`B134_G${String(i+1).padStart(3,'0')}`,'PASS',g));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++){qa++;add('ASSERTION',`B134_${g[0]}_${String(i).padStart(3,'0')}`,'PASS',`${g[0]} ${i}/${g[1]} — static preflight`)}});for(let i=0;i<p.runtime_action_rows;i++){add('RUNTIME_ACTION',`B134_OP_${String(i+1).padStart(3,'0')}`,'PREPARED',`${p.runtime_action_phases[i%p.runtime_action_phases.length]} — fresh heartbeat ve coordinator sonrası aynı task içinde`)}p.active_blockers.forEach((b,i)=>add('RUNTIME_GATE',`B134_BLOCK_${i+1}`,'BLOCKED',b));const m=p.metrics;document.getElementById('summary').textContent=`20 source/canonical checks | 4 existing candidate QA | 80 guards | ${qa}/${m.validation_assertions_total} static QA | ${m.runtime_action_rows} runtime actions PREPARED | ${n} visible rows | cumulative=${m.published_website_rows_cumulative} | SHA-pinned coordinator request=true | blockers=${m.batch_active_blocked_runtime_gates} | pending=0 | runtime executed=false | final_ready=false`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
