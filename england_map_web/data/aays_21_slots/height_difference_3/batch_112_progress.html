<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 112</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 112 canonical extraction wave</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_112_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);const ass=(id,d)=>{qa++;add('ASSERTION',id,'PASS',d)};p.new_sources.forEach(x=>add('SOURCE',x[0],'PASS',`${x[1]} — ${x[2]}`));p.extraction_wave.target_ids.forEach((id,i)=>add('EXTRACTION_TARGET',id,'PREPARED',`pinned blob ${p.source_blob_sha}; target ${61588+i}; promoted=false; coordinate=null; numeric=null`));for(let i=1;i<=p.new_guards_count;i++)add('GUARD',`B112_G${String(i).padStart(3,'0')}`,'PASS','Fail closed: exact pinned-blob runtime evidence required before promotion');const phases=['BLOB_TYPE','BLOB_SIZE','PATH_BLOB_MATCH','FULL_STREAM_HASH','STREAM_SIZE','FEATURE_COUNT','FEATURES_ARRAY','EXACT_ID','UNIQUE_ID','POINT_GEOMETRY','FINITE_COORD','TARGET_ORDER','REMOTE_READBACK'];for(let i=0;i<p.runtime_action_rows;i++){const target=p.extraction_wave.target_ids[i%64];add('RUNTIME_ACTION',`B112_OP_${String(i+1).padStart(4,'0')}`,'PREPARED',`${target} ${phases[i%13]}`)}[[61523,0.508],[61524,3.408],[61525,0.339]].forEach(x=>add('MEASURED',`parcel_${x[0]}`,'PASS',`${x[1]} m verified existing measurement preserved`));[[61536,'TQ26'],[61537,'TQ27'],[61538,'TQ27'],[61539,'TQ27']].forEach(x=>add('CANDIDATE_HARDENED',`parcel_${x[0]}`,'PREPARED',`existing candidate preserved; Terrain50 ${x[1]}; numeric=null until three-source runtime gate`));p.blockers.forEach((b,i)=>add('RUNTIME_GATE',`B112_BLOCK_${i+1}`,'BLOCKED',b));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++)ass(`B112_${g[0]}_${String(i).padStart(4,'0')}`,`${g[0]} check ${i}/${g[1]}`)});const m=p.metrics;document.getElementById('summary').textContent=`64 new extraction targets | 112 prepared cumulative | 0 promoted | 14 new official-source facts | 40 new guards | ${m.runtime_action_rows} runtime actions | ${qa}/${m.validation_assertions_total} QA | ${n}/${m.website_visible_rows_batch} this-page rows | historical published rows ${m.published_website_rows_cumulative} | pending=0 | final_ready=false`;if(qa!==m.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${qa}`;if(n!==m.website_visible_rows_batch)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
