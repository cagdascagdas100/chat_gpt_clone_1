<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_3 Batch183</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}h1,h2{margin:.4em 0}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;border-radius:7px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:11px;margin:12px 0}.good{background:#e8f5e9;border:1px solid #a5d6a7;padding:11px;margin:12px 0}.info{background:#e8f4fd;border:1px solid #9fc9e8;padding:11px;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0;font-size:12px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.held{color:#9a6700;font-weight:bold}.ok{color:#176b2c;font-weight:bold}code,a{word-break:break-all}</style></head><body><h1>height_difference_3 — Batch183 satır satır ilerleme</h1><div id="summary"></div><div id="cards" class="cards"></div><h2>24 doğrulama işlemi</h2><table><thead><tr><th>#</th><th>Grup</th><th>Kontrol</th><th>Kanıt</th><th>Sonuç</th></tr></thead><tbody id="checks"></tbody></table><h2>3 doğrulanmış ölçüm</h2><table><thead><tr><th>Satır</th><th>Yükseklik farkı</th><th>EA hücre</th><th>OS Terrain50</th><th>Çapraz fark</th><th>Sınır</th><th>Güven</th></tr></thead><tbody id="verified"></tbody></table><h2>4 hazır fakat yükseltilmemiş aday</h2><table><thead><tr><th>Satır</th><th>HMLR INSPIRE ID</th><th>Koordinat</th><th>Terrain50</th><th>Durum</th></tr></thead><tbody id="candidates"></tbody></table><script>const R='batch_183_source_liveness.json';const e=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');fetch(R,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const all=[...d.source_checks,...d.row_gate_checks];document.getElementById('summary').innerHTML=`<div class="good"><b>Kaynak doğrulama:</b> ${d.operations.completed}/${d.operations.total} = ${d.operations.percent}%. Resmî kaynak ailesi ${d.metrics.source_families_refreshed}; kaynak sözleşmesi güveni %${d.metrics.source_contract_confidence}.</div><div class="info"><b>Ölçümler:</b> ${d.metrics.verified_measurements_retained} yüksek güvenli satır korundu; yeni sayısal yükseltme ${d.metrics.new_numeric_promotions}. Web satırı +${d.metrics.website_visible_rows_added}.</div><div class="warn"><b>Runtime:</b> mevcut portable runner/coordinator hâlâ çalışmadı; 22 kanonik çıktı eksik. İkinci görev veya runner açılmadı.</div>`;const cards=[['İşlem',d.operations.completed+'/'+d.operations.total],['Batch','%'+d.operations.percent],['Kaynak kontrolü',d.metrics.official_source_checks_matched+'/'+d.metrics.official_source_checks_total],['Kaynak ailesi',d.metrics.source_families_refreshed],['Doğrulanmış',d.metrics.verified_measurements_retained],['Aday',d.metrics.hardened_candidates_retained],['Yeni ölçüm',d.metrics.new_numeric_promotions],['Web satırı','+'+d.metrics.website_visible_rows_added],['Güven','%'+d.metrics.source_contract_confidence]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');document.getElementById('checks').innerHTML=all.map(x=>`<tr><td>${x.line}</td><td>${e(x.group)}</td><td>${e(x.check)}</td><td>${x.url?`<a href="${e(x.url)}" target="_blank" rel="noopener">${e(x.evidence)}</a>`:e(x.evidence)}</td><td class="${x.result.startsWith('PASS')?'ok':'held'}">${e(x.result)}</td></tr>`).join('');document.getElementById('verified').innerHTML=d.verified_measurements.map(x=>`<tr><td>${x.row_no}</td><td>${x.height_difference_m} m</td><td>${x.ea_valid_cell_count}</td><td>${x.os_terrain50_centroid_elevation_m} m</td><td>${x.cross_source_absolute_difference_m} m</td><td>${e(x.boundary_match_method)}</td><td class="ok">${e(x.confidence)}</td></tr>`).join('');document.getElementById('candidates').innerHTML=d.hardened_unpromoted_candidates.map(x=>`<tr><td>${x.row_no}</td><td>${e(x.hmlr_inspire_id)}</td><td>${x.latitude}, ${x.longitude}</td><td>${e(x.terrain50_tile)}</td><td class="held">${e(x.status)}</td></tr>`).join('');if(all.length!==24||d.verified_measurements.length!==3||d.hardened_unpromoted_candidates.length!==4||d.metrics.new_numeric_promotions!==0||d.runtime_executed!==false)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
