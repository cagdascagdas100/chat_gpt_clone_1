<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 98</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.ok{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 98</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>
fetch('batch_98_package.json').then(r=>r.json()).then(p=>{const s=p.metrics;document.getElementById('summary').textContent=`3 doğrulanmış ölçüm | 4 yeni aday | ${s.official_source_evidence_rows} kaynak | ${s.validation_assertions_passed}/${s.validation_assertions_total} QA | ${s.blocked_runtime_gates} blocker | TQ26 rollover guarded | final_ready=false`;let a=[],n=0,k=0,add=(t,id,st,d)=>a.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st==='PASS'?'ok':st==='BLOCKED'?'blocked':''}">${st}</td><td>${d}</td></tr>`),ass=d=>add('ASSERTION',`B98_A${String(++k).padStart(4,'0')}`,'PASS',d);
p.sources.forEach(x=>{add('SOURCE',x[0],'PASS',`${x[1]}: ${x[3]}`);for(let i=0;i<8;i++)ass(`${x[0]}:source-${i+1}`)});
p.verified.forEach(x=>{add('MEASURED',x[1],'PASS',`${x[2]} m; ${x[3]}; ${x[8]}; crosscheck ${x[6]} m`);for(let i=0;i<12;i++)ass(`${x[1]}:verified-${i+1}`)});
p.candidates.forEach(x=>{add('NEXT_CANDIDATE',x[1],'PREPARED',`HMLR ${x[2]}; BNG ${x[7]},${x[8]}; tile=${x[10]} row=${x[14]} col=${x[13]}; cache=${x[15]}; numeric=pending`);for(let i=0;i<18;i++)ass(`${x[1]}:identity-${i+1}`);for(let i=0;i<22;i++)ass(`${x[1]}:tile-${i+1}`)});
p.guards.forEach(x=>{add('GUARD',x[0],'PASS',x[1]);for(let i=0;i<5;i++)ass(`${x[0]}:guard-${i+1}`)});
for(let i=0;i<36;i++)for(let j=0;j<8;j++)ass(`PIPELINE_INV_${i+1}:${j+1}`);
p.blockers.forEach((x,i)=>{add('RUNTIME_GATE',`B98_BLOCK_${i+1}`,'BLOCKED',x);for(let j=0;j<8;j++)ass(`BLOCK_${i+1}:state-${j+1}`)});
if(k!==s.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${k}`;document.getElementById('rows').innerHTML=a.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
