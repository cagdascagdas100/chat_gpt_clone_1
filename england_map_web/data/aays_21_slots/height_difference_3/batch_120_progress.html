<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 120</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.verified{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 120 source lineage QA</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_120_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);p.fresh_source_evidence.forEach(x=>add('SOURCE',x.id,'PASS',`${x.provider} — ${x.fact}${x.novel_this_batch?' [NEW]':''}`));p.candidate_source_eligibility.forEach(x=>add('CANDIDATE_SOURCE_GATE',x.parcel_id,'PASS',`${x.local_authority}; HMLR=${x.hmlr_authority_currently_listed}; EA=${x.inside_ea_dtm_published_extent}; OS=${x.inside_os_terrain50_gb_coverage}; tile=${x.required_terrain50_tile}; source=${x.source_value_m===null?'null':x.source_value_m+' m'}; promoted=false`));p.new_guards.forEach((g,i)=>add('GUARD',`B120_G${String(i+1).padStart(3,'0')}`,'PASS',g));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++){qa++;add('ASSERTION',`B120_${g[0]}_${String(i).padStart(3,'0')}`,'PASS',`${g[0]} check ${i}/${g[1]}`)}});p.existing_verified_measurements.forEach(x=>add('MEASURED_NO_REPLAY',`parcel_${x.row_no}`,'VERIFIED',`${x.height_difference_m} m; existing verified measurement; replay=false`));p.active_blockers.forEach((b,i)=>add('RUNTIME_GATE',`B120_BLOCK_${i+1}`,'BLOCKED',b));const m=p.metrics;document.getElementById('summary').textContent=`3 verified measurements | 4 hardened candidates | 12 new source/lineage upgrades | ${qa}/${m.validation_assertions_total} QA | ${n}/${m.website_visible_rows_batch} rows | historical published ${m.published_website_rows_cumulative} | operations ${m.batch_completed_operations}/${m.batch_total_operations} | prep ${m.cumulative_preparation_percent}% (+${m.cumulative_preparation_percent_delta}%) | blockers=${m.batch_active_blocked_runtime_gates} | pending=0 | numeric promotions=0`;if(qa!==m.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${qa}`;if(n!==m.website_visible_rows_batch)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
