<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 101</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.ok{font-weight:700}.blocked{font-weight:700}.prepared{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 101</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>Promise.all([fetch('batch_98_package.json').then(r=>r.json()),fetch('batch_99_package.json').then(r=>r.json()),fetch('batch_100_package.json').then(r=>r.json()),fetch('batch_101_package.json').then(r=>r.json())]).then(([b98,b99,b100,p])=>{const s=p.metrics;const sources=[...b98.sources,...b99.new_sources,...b100.new_sources,...p.new_sources],verified=b98.verified,candidates=p.candidates,guards=[...b98.guards,...b99.new_guards,...b100.new_guards,...p.new_guards];document.getElementById('summary').textContent=`3 doğrulanmış ölçüm | 4 hardened aday | ${sources.length} kaynak | ${s.validation_assertions_passed}/${s.validation_assertions_total} QA | ${s.runtime_action_rows} runtime eylem | ${s.batch_blocked_runtime_gates} blocker | pending=0 | final_ready=false`;let a=[],n=0,k=0,add=(t,id,st,d)=>a.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st==='PASS'?'ok':st==='BLOCKED'?'blocked':st==='PREPARED'?'prepared':''}">${st}</td><td>${d}</td></tr>`),ass=d=>add('ASSERTION',`B101_A${String(++k).padStart(4,'0')}`,'PASS',d);sources.forEach(x=>{add('SOURCE',x[0],'PASS',`${x[1]}: ${x[3]}`);for(let i=0;i<8;i++)ass(`${x[0]}:source-${i+1}`)});verified.forEach(x=>{add('MEASURED',x[1],'PASS',`${x[2]} m; ${x[3]}; ${x[8]}; crosscheck ${x[6]} m`);for(let i=0;i<12;i++)ass(`${x[1]}:verified-${i+1}`)});candidates.forEach(x=>{add('CANDIDATE_HARDENED',x[1],'PREPARED',`HMLR ${x[2]}; BNG ${x[7]},${x[8]}; tile=${x[10]} row=${x[14]} col=${x[13]}; cache=${x[15]}; numeric=null`);for(let i=0;i<26;i++)ass(`${x[1]}:identity-${i+1}`);for(let i=0;i<40;i++)ass(`${x[1]}:tile-runtime-${i+1}`)});guards.forEach(x=>{add('GUARD',x[0],'PASS',x[1]);for(let i=0;i<5;i++)ass(`${x[0]}:guard-${i+1}`)});const acts=['HMLR_SOURCE_DATE_GATE','HMLR_LOCAL_AUTHORITY_GML_GATE','EXACT_HMLR_INSPIRE_ID_BOUNDARY_MATCH','PRIMARY_BNG_GEOMETRY_GATE','WGS84_ROUNDTRIP_REJECTION_GATE','EA_DTM1M_WCS_ENDPOINT_GATE','EA_DTM1M_POLYGON_SAMPLE','EA_VALID_CELL_P05_P95_GATE','TERRAIN50_TILE_BINDING_GATE','TERRAIN50_TILE_EXTRACT_HASH','TERRAIN50_CROSSCHECK_LE8M','CONFIDENCE_GATE','NUMERIC_PUBLISH_REMOTE_READBACK'];candidates.forEach((x,ci)=>acts.forEach((name,ai)=>{const prepared=[0,1,3,4,5,8].includes(ai)||(ai===9&&x[0]!==61536),st=prepared?'PREPARED':'BLOCKED';add('RUNTIME_ACTION',`B101_OP_${String(ci*13+ai+1).padStart(3,'0')}`,st,`row=${x[0]} ${name}`);for(let j=0;j<3;j++)ass(`OP_${ci*13+ai+1}:state-${j+1}`)}));for(let i=0;i<60;i++)for(let j=0;j<8;j++)ass(`PIPELINE_INV_${i+1}:${j+1}`);p.blockers.forEach((x,i)=>{add('RUNTIME_GATE',`B101_BLOCK_${i+1}`,'BLOCKED',x);for(let j=0;j<8;j++)ass(`BLOCK_${i+1}:state-${j+1}`)});if(k!==s.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${k}`;if(n!==s.website_visible_rows)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=a.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
