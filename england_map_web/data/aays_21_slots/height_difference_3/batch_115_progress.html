<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 115</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 115 HMLR exact-ID probe</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_115_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);const ass=(id,d)=>{qa++;add('ASSERTION',id,'PASS',d)};p.fresh_source_evidence.forEach(x=>add('SOURCE',x[0],'PASS',`${x[1]} — ${x[2]}`));p.code_artifacts.forEach(x=>add('CODE',x[0],'PASS',`${x[1]} — ${x[2]}`));p.exact_id_targets.forEach(x=>add('EXACT_ID_TARGET',x.parcel_id,'PREPARED',`INSPIRE ${x.inspire_id}; BNG ${x.bng[0]},${x.bng[1]}; Terrain50 ${x.terrain50}; numeric=null`));p.new_guards.forEach((g,i)=>add('GUARD',`B115_G${String(i+1).padStart(3,'0')}`,'PASS',g));for(let i=0;i<p.runtime_action_rows;i++){const phase=p.runtime_action_phases[i%p.runtime_action_phases.length];const target=p.exact_id_targets[i%4].parcel_id;add('RUNTIME_ACTION',`B115_OP_${String(i+1).padStart(3,'0')}`,'PREPARED',`${target} ${phase}`)}[[61523,0.508],[61524,3.408],[61525,0.339]].forEach(x=>add('MEASURED',`parcel_${x[0]}`,'PASS',`${x[1]} m verified existing measurement preserved; do not replay`));p.exact_id_targets.forEach(x=>add('CANDIDATE_HARDENED',x.parcel_id,'PREPARED',`INSPIRE ${x.inspire_id}; ${x.terrain50}; boundary probe pending; numeric=null`));p.blockers.forEach((b,i)=>add('RUNTIME_GATE',`B115_BLOCK_${i+1}`,'BLOCKED',b));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++)ass(`B115_${g[0]}_${String(i).padStart(4,'0')}`,`${g[0]} check ${i}/${g[1]}`)});const m=p.metrics;document.getElementById('summary').textContent=`4 hardened candidates | 240 prepared extraction targets | 0 promoted | 3 new source/provenance rows | 4 new executable artifacts | 28 new guards | ${m.runtime_action_rows} runtime actions | ${qa}/${m.validation_assertions_total} QA | ${n}/${m.website_visible_rows_batch} this-page rows | historical published ${m.published_website_rows_cumulative} | pending=0 | final_ready=false`;if(qa!==m.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${qa}`;if(n!==m.website_visible_rows_batch)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
