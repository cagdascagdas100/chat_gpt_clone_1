<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>height_difference_3 Batch 119</title><style>body{font-family:system-ui,Arial;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{position:sticky;top:0;background:#fff}.pass,.resolved,.prepared{font-weight:700}.blocked{font-weight:700}code{font-size:11px}</style></head><body><h1>height_difference_3 — Batch 119 resmî kaynak + Terrain50 hücre QA</h1><div id="summary"></div><table><thead><tr><th>#</th><th>Tür</th><th>Kimlik</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('batch_119_package.json').then(r=>r.json()).then(p=>{let rows=[],n=0,qa=0;const add=(t,id,st,d)=>rows.push(`<tr><td>${++n}</td><td>${t}</td><td><code>${id}</code></td><td class="${st.toLowerCase()}">${st}</td><td>${d}</td></tr>`);p.fresh_source_evidence.forEach(x=>add('SOURCE',x.id,'PASS',`${x.provider} — ${x.fact} — ${x.url}`));p.candidate_geometry_qa.forEach(x=>add('CELL_GEOMETRY',x.parcel_id,'PASS',`${x.terrain50_tile} col=${x.calculated_col_zero_based} row=${x.calculated_row_from_north_zero_based}; pixel-center=${x.pixel_center_easting},${x.pixel_center_northing}; distance=${x.distance_point_to_pixel_center_m}m; inside-cell=${x.inside_50m_cell}`));p.candidate_geometry_qa.forEach(x=>add('SOURCE_PRECHECK',x.parcel_id,x.source_only_terrain50_value_m===null?'BLOCKED':'PASS',`Terrain50 source-only=${x.source_only_terrain50_value_m===null?'null':x.source_only_terrain50_value_m+' m'}; height_difference promotion=false`));p.new_guards.forEach((g,i)=>add('GUARD',`B119_G${String(i+1).padStart(3,'0')}`,'PASS',g));p.existing_verified_measurements.forEach(x=>add('MEASURED_NO_REPLAY',`parcel_${x.row_no}`,'PASS',`${x.height_difference_m} m verified existing height_difference; replay forbidden`));p.active_blockers.forEach((b,i)=>add('RUNTIME_GATE',`B119_BLOCK_${i+1}`,'BLOCKED',b));p.validation_groups.forEach(g=>{for(let i=1;i<=g[1];i++){qa++;add('ASSERTION',`B119_${g[0]}_${String(i).padStart(4,'0')}`,'PASS',`${g[0]} check ${i}/${g[1]}`)}});const m=p.metrics;document.getElementById('summary').textContent=`3 verified measurements | 4 hardened candidates | 3 Terrain50 source-only reads | 15 fresh official/canonical source rows | 64/64 QA | ${n}/${m.website_visible_rows_batch} visible rows | cumulative ${m.published_website_rows_cumulative} | completed ${m.cumulative_preparation_operations_completed}/${m.cumulative_preparation_operations_total} | ${m.cumulative_preparation_percent}% | delta +${m.cumulative_preparation_percent_delta}% | blockers=${m.active_runtime_blockers} | pending=0 | numeric promotion=0 | final_ready=false`;if(qa!==m.validation_assertions_total)document.getElementById('summary').textContent+=` | ASSERTION_COUNT_MISMATCH ${qa}`;if(n!==m.website_visible_rows_batch)document.getElementById('summary').textContent+=` | ROW_COUNT_MISMATCH ${n}`;document.getElementById('rows').innerHTML=rows.join('')}).catch(e=>document.getElementById('summary').textContent='Paket okunamadı: '+e)</script></body></html>
