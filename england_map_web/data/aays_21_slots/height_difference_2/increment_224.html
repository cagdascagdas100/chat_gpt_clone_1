<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_2 Increment 224</title><style>body{font-family:system-ui,sans-serif;margin:20px;background:#f7f7f8;color:#171717}h1{font-size:22px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #ddd;padding:7px;vertical-align:top;text-align:left}th{position:sticky;top:0;background:#eee}.completed{color:#087a35}.blocked{color:#b42318;font-weight:700}</style></head><body><h1>height_difference_2 — Increment 224</h1><div class="summary"><div class="card">120 işlem</div><div class="card">116 tamamlandı</div><div class="card">4 engel</div><div class="card">Kaynak doğruluğu 4.0/4</div></div><p>Terrain50 ürün kimliği, TQ indirme sözleşmesi, üç kesin tile ve F-host makbuz denetimi.</p><table><thead><tr><th>No</th><th>Durum</th><th>Aşama</th><th>İşlem</th><th>Aday</th><th>Özet</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>
const fill=(s,c)=>s.replace(/\{(\w+)\}/g,(_,k)=>c[k]);fetch('operations_increment_224.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(p=>{let n=p.operation_start,ops=[];for(const x of p.official)ops.push([n++,'completed','OFFICIAL_SOURCE_CONTRACT',x[0],'',x[1],x[2]]);for(const c of p.candidates)for(const x of p.candidate_checks)ops.push([n++,'completed','EXACT_CANDIDATE_DOWNLOAD_GUARD',x[0],c.row,fill(x[1],c),'OS Terrain 50']);for(const x of p.integrity)ops.push([n++,'completed','RECOVERY_AND_INTEGRITY_AUDIT',x[0],'',x[1],'GitHub/official']);for(const x of p.blockers)ops.push([n++,'blocked','EXTERNAL_GATE',x[0],'',x[1],'Canonical evidence']);const t=document.getElementById('rows');for(const o of ops){const tr=document.createElement('tr');tr.innerHTML=`<td>${o[0]}</td><td class="${o[1]}">${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td><td>${o[5]}</td><td>${o[6]}</td>`;t.appendChild(tr)}}).catch(e=>document.body.insertAdjacentHTML('beforeend',`<p class="blocked">${e}</p>`));</script></body></html>
