<!doctype html><meta charset="utf-8"><title>height_difference_2 Increment 195</title>
<style>body{font:12px system-ui;background:#09111a;color:#eef}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #345;padding:4px}th{background:#18283a;position:sticky;top:0}.completed{background:#10251d}.blocked{background:#321818}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid #345;padding:8px}.gap{background:#302812;padding:10px}</style>
<h1>height_difference_2 — Increment 195</h1><div id="cards" class="cards"></div><div id="gaps" class="gap"></div>
<h2>576 işlem</h2><table><thead><tr><th>No</th><th>Durum</th><th>Aşama</th><th>Hedef</th><th>Kontrol</th><th>Kanıt</th><th>Güven</th><th>Blocker</th></tr></thead><tbody id="ops"></tbody></table>
<h2>144 örnek</h2><table><tbody id="ex"></tbody></table><h2>20 kaynak</h2><table><tbody id="src"></tbody></table><h2>30 runtime</h2><table><tbody id="rt"></tbody></table>
<script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE=x=>[
['ID','row',x.row],['ID','authority',x.authority],['ID','HMLR',x.hmlr],['ID','area',x.area],['ID','tile',x.tile],
['CRS','E',x.easting],['CRS','N',x.northing],['CRS','processing','EPSG:27700'],['CRS','vertical','ODN'],['CRS','OSTN15','required'],
['M','min1',x.min1],['M','max1',x.max1],['M','span1',x.span1],['M','min2',x.min2],['M','max2',x.max2],
['M','span2',x.span2],['M','delta',x.span_delta],['M','delta%',x.span_delta_pct],['C','mean',x.mean1],['C','median',x.median1],
['R','p02',x.p02],['R','p98',x.p98],['R','robust span',x.robust_span],['R','robust%',x.robust_pct],['R','lower tail',x.lower_tail],
['R','upper tail',x.upper_tail],['P','centre1',x.center1],['P','centre2',x.center2],['P','density1',x.density1],['P','effective2',x.effective2],
['P','surplus1',x.mask_count_surplus1],['P','surplus2',x.mask_count_surplus2],['U','relative95',x.relative95],['U','absolute95',x.absolute95],
['U','EA ratio',x.span_to_ea_rmse],['U','OS ratio',x.span_to_os_rmse],['W','CoverageId','pinned'],['W','axes','explicit'],['W','interpolation','pinned'],['W','resolution','1m exact']
];
Promise.all([fetch('qa_bundle_increment_195.json',{cache:'no-store'}).then(r=>r.json()),fetch('qa_bundle_increment_194.json',{cache:'no-store'}).then(r=>r.json())]).then(([d,p])=>{
 let i=d.inc,n=i[0],rows=[];const A=(s,a,t,c,e,g=100,b='')=>rows.push([n++,s,a,t,c,e,g,b]);
 cards.innerHTML=[['Kanonik',d.can[0]+'/'+d.can[1]],['Genel',d.can[6]+'%'],['İşlem',i[3]+'/'+i[2]],['Blocked',i[4]],['Kaynak',i[6]],['Örnek',i[7]],['Runtime',i[10]+' PASS / '+i[11]+' GAP'],['Receipt',d.rec[3]]].map(x=>'<span class=card><b>'+E(x[0])+'</b><br>'+E(x[1])+'</span>').join('');
 gaps.innerHTML=d.gaps.map(x=>'<b>'+E(x.id)+'</b>: '+E(x.evidence)+'<br>'+E(x.required)).join('<hr>');
 for(const s of d.src){A('completed','SOURCE',s[0],'authority',s[1]+' — '+s[2]);A('completed','FACT',s[0],'verified',s[5]);A('completed','LIMIT',s[0],'fail-closed',s[6])}
 for(const x of p.cand)for(const q of BASE(x))for(const m of ['VALUE','SOURCE','GATE','RECEIPT'])A('completed',q[0]+'_'+m,'row '+x.row+' / '+x.hmlr,q[1],m==='VALUE'?q[2]:m==='SOURCE'?'official or preserved evidence':m==='GATE'?'fail closed on mismatch':'receipt required',m==='VALUE'?96:100);
 for(const r of d.rt)A(r[1]==='STATIC_GAP'?'blocked':'completed','RUNTIME','revision16',r[0],r[2],100,r[1]==='STATIC_GAP'?r[0]:'');
 for(const g of [['DUPLICATE','same continuation; no second runner'],['BUSINESS','0 new rows'],['WEB','576 line-by-line rows'],['NETWORK','EA XML endpoint observed; bytes not hashed'],['REV17','coordinated five-gap acceptance matrix published']])A('completed','GLOBAL','increment195',g[0],g[1]);
 A('blocked','RECOVERY','F-host','0/4 receipts','fresh restart, heartbeat, claim and final output absent',100,d.rec[7]);
 ops.innerHTML=rows.map(x=>'<tr class='+x[1]+'>'+x.map(v=>'<td>'+E(v)+'</td>').join('')+'</tr>').join('');
 let e=1120,exs=[];for(const x of p.cand)for(const s of d.sc)exs.push([`HD2-QA-${e++}`,x.row,x.authority,s,x.hmlr,x.span1.toFixed(3),x.span2.toFixed(3),x.confidence+'%',/WCS_AXIS|WCS_INTERPOLATION|WCS_RESOLUTION|WCS_VERTICAL_DATUM|TERRAIN50_HEADER|ASC_PRJ|ARCHIVE_HASH/.test(s)||(s==='UNCERTAINTY_QA'&&x.absolute95<0)?'CAUTION':'PASS']);
 ex.innerHTML=exs.map(x=>'<tr>'+x.map(v=>'<td>'+E(v)+'</td>').join('')+'</tr>').join('');
 src.innerHTML=d.src.map(x=>'<tr><td>'+E(x[0])+'</td><td>'+E(x[1])+'</td><td><a href="'+E(x[3])+'" target="_blank" rel="noopener">'+E(x[2])+'</a></td><td>'+E(x[4])+'</td><td>'+E(x[5])+'</td><td>'+E(x[6])+'</td></tr>').join('');
 rt.innerHTML=d.rt.map(x=>'<tr class='+(x[1]==='STATIC_GAP'?'blocked':'completed')+'><td>'+E(x[0])+'</td><td>'+E(x[1])+'</td><td>'+E(x[2])+'</td></tr>').join('');
 if(rows.length!==576||rows.filter(x=>x[1]==='completed').length!==570||rows.filter(x=>x[1]==='blocked').length!==6||exs.length!==144||d.src.length!==20||d.rt.length!==30)document.body.prepend('INTEGRITY BLOCK');
}).catch(e=>document.body.prepend('LOAD ERROR '+E(e.message)));
</script>
