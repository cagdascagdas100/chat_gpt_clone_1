<!doctype html><meta charset="utf-8"><title>height_difference_2 QA 211</title><h1>height_difference_2 — increment 211</h1><div id="app">Loading…</div><script>
const fs=['operations_increment_211.json','source_candidates_increment_211.json','examples_increment_211.json','progress_increment_211.json'];
Promise.all(fs.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.json()))).then(([o,s,e,p])=>{
let h=`<p>operations ${p.child_branch_preview_operation_rows_total} (+${p.child_branch_preview_operation_rows_increase}) | source rows ${p.child_branch_preview_source_rows_total} (+${p.child_branch_preview_source_rows_increase} revalidation) | unique sources ${p.child_branch_source_candidate_count} | examples ${p.child_branch_preview_example_rows_total} (+${p.child_branch_preview_example_rows_increase}) | result confidence ${p.numeric_result_confidence_percent}% | cells ${p.terrain50_all_touched_cells_verified} | QA gap closed ${p.qa_gap_closed_this_increment}</p>`;
h+='<h2>Operations</h2><table border=1><tr><th>No</th><th>Status</th><th>Stage</th><th>Details</th></tr>';
o.operations.forEach(x=>h+=`<tr><td>${x.operation_no}</td><td>${x.status}</td><td>${x.stage}</td><td>${x.details}</td></tr>`);
h+='</table><h2>Official source revalidations</h2><table border=1><tr><th>ID</th><th>Publisher</th><th>Name</th><th>Confidence</th><th>State</th></tr>';
s.candidates.forEach(x=>h+=`<tr><td>${x.candidate_id}</td><td>${x.publisher}</td><td><a href="${x.source_url}" target="_blank" rel="noopener">${x.name}</a></td><td>${x.source_confidence_percent}%</td><td>${x.promotion_state}</td></tr>`);
h+='</table><h2>Pixel/cell examples</h2><table border=1><tr><th>ID</th><th>Row</th><th>HMLR</th><th>Height diff</th><th>Confidence</th><th>Tile</th><th>Cell reads / centres / overlap</th><th>Area check</th></tr>';
e.examples.forEach(x=>{const cells=x.terrain50_cells.map(c=>`${c.ascii_read} @ ${c.pixel_center_epsg27700.join(',')} overlap=${c.polygon_overlap_m2}m²`).join(' | ');h+=`<tr><td>${x.example_id}</td><td>${x.row_no}</td><td>${x.hmlr_inspire_id}</td><td>${x.height_difference_m} m</td><td>${x.result_confidence_percent}%</td><td>${x.terrain50_tile}</td><td>${cells}</td><td>${x.overlap_sum_m2}/${x.polygon_area_m2} m²</td></tr>`});
document.getElementById('app').innerHTML=h+'</table>';});
</script>
