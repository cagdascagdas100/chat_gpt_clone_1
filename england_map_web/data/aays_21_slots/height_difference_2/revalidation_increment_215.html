<!doctype html><meta charset="utf-8"><title>height_difference_2 QA 215</title><h1>height_difference_2 — increment 215</h1><div id="app">Loading…</div><script>
const fs=['operations_increment_215.json','source_candidates_increment_215.json','examples_increment_215.json','progress_increment_215.json'];
Promise.all(fs.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.json()))).then(([o,s,e,p])=>{
let h=`<p>operations ${p.child_branch_preview_operation_rows_total} (+${p.child_branch_preview_operation_rows_increase}) | source rows ${p.child_branch_preview_source_rows_total} (+${p.child_branch_preview_source_rows_increase}) | examples ${p.child_branch_preview_example_rows_total} (+${p.child_branch_preview_example_rows_increase}) | result confidence ${p.numeric_result_confidence_percent}% | OS OpenData API key required ${p.os_opendata_api_key_required} | support DNS ${p.support_runtime_api_os_uk_dns_ok?'PASS':'BLOCKED'}</p>`;
h+='<h2>Operations</h2><table border=1><tr><th>No</th><th>Status</th><th>Stage</th><th>Details</th></tr>';
o.operations.forEach(x=>h+=`<tr><td>${x.operation_no}</td><td>${x.status}</td><td>${x.stage}</td><td>${x.details}</td></tr>`);
h+='</table><h2>Official source revalidations</h2><table border=1><tr><th>ID</th><th>Publisher</th><th>Name</th><th>Confidence</th><th>State</th></tr>';
s.candidates.forEach(x=>h+=`<tr><td>${x.candidate_id}</td><td>${x.publisher}</td><td><a href="${x.source_url}" target="_blank" rel="noopener">${x.name}</a></td><td>${x.source_confidence_percent}%</td><td>${x.promotion_state}</td></tr>`);
h+='</table><h2>Transport examples</h2><table border=1><tr><th>ID</th><th>Row</th><th>Tile</th><th>Area</th><th>Format</th><th>API key</th><th>Support transport</th><th>Current numeric observed</th></tr>';
e.examples.forEach(x=>h+=`<tr><td>${x.example_id}</td><td>${x.row_no}</td><td>${x.terrain50_tile}</td><td>${x.download_area}</td><td>${x.download_format}</td><td>${x.opendata_api_key_required?'required':'not required'}</td><td>${x.support_runtime_transport}</td><td>${x.current_numeric_cell_values_observed?'yes':'no'}</td></tr>`);
document.getElementById('app').innerHTML=h+'</table>';});
</script>
