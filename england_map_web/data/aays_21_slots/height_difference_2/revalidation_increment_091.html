<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>height_difference_2 — 091</title><style>body{font-family:system-ui,sans-serif;margin:20px}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #999;padding:6px;text-align:left;vertical-align:top}</style></head><body><h1>091 — EA WMS/WCS raw-pixel QA</h1><div id="m"></div><h2>İşlemler</h2><table><tbody id="o"></tbody></table><h2>Kaynaklar</h2><table><tbody id="s"></tbody></table><h2>Örnekler</h2><table><tbody id="x"></tbody></table><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Promise.all([fetch('operations_increment_091.json').then(r=>r.json()),fetch('source_candidates_increment_091.json').then(r=>r.json()),fetch('examples_increment_091.json').then(r=>r.json()),fetch('progress_increment_091.json').then(r=>r.json())]).then(([o,s,x,p])=>{m.innerHTML=`Genel <b>${e(p.overall_completion_percent)}%</b> · ${e(p.completed_operation_count)}/${e(p.planned_operation_count)} · child işlem ${e(p.child_branch_preview_operation_rows_total)} · kaynak ${e(p.child_branch_preview_source_rows_total)} · örnek ${e(p.child_branch_preview_example_rows_total)}`;document.getElementById('o').innerHTML=o.operations.map(v=>`<tr><td>${e(v.operation_no)}</td><td>${e(v.status)}</td><td>${e(v.stage)}</td><td>${e(v.details_summary)}</td><td>${e(v.accuracy_score_4)}/4</td></tr>`).join('');document.getElementById('s').innerHTML=s.candidates.map(v=>`<tr><td>${e(v.candidate_id)}</td><td><a href="${e(v.source_url)}">${e(v.name)}</a></td><td>${e(v.source_confidence_percent)}%</td></tr>`).join('');document.getElementById('x').innerHTML=x.examples.map(v=>`<tr><td>${e(v.example_id)}</td><td>${e(v.row_no)}</td><td>${e(v.height_difference_m)} m</td><td>${e(v.result_confidence_percent)}%</td></tr>`).join('')})</script></body></html>
