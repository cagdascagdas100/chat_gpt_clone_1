<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>height_difference_2 increment 097</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:18px;background:#fafafa;color:#111}h1,h2{margin:10px 0}.k{display:flex;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #ddd;border-radius:8px;padding:10px 14px}.scroll{max-height:620px;overflow:auto;border:1px solid #ccc;background:white}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #eee;padding:5px 7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f1f1f1}.ok{font-weight:700}pre{white-space:pre-wrap}
</style></head><body>
<h1>height_difference_2 — increment 097</h1>
<div class="k" id="cards"></div>
<h2>Operations — row by row</h2><div class="scroll"><table><thead><tr><th>#</th><th>type</th><th>rule</th><th>source</th><th>context</th><th>score</th></tr></thead><tbody id="ops"></tbody></table></div>
<h2>Official source candidates</h2><div class="scroll"><table><thead><tr><th>ID</th><th>publisher</th><th>name</th><th>role</th><th>confidence</th><th>facts / limits</th></tr></thead><tbody id="src"></tbody></table></div>
<h2>Prepared examples — row by row</h2><div class="scroll"><table><thead><tr><th>ID</th><th>scenario</th><th>parcel</th><th>tile</th><th>1m</th><th>2m</th><th>Δ</th><th>confidence</th><th>survey identity</th><th>rule</th><th>score</th></tr></thead><tbody id="ex"></tbody></table></div>
<h2>Integrity audit</h2><pre id="audit"></pre>
<script>
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=async p=>(await fetch(p)).json();
function expandOps(o){
 let rows=[...(o.fixed_operations||[])];
 for(const g of (o.generators||[])){for(let i=0;i<g.count;i++){let rule=g.rule_cycle[(i*(g.rule_stride||1))%g.rule_cycle.length],ctx=g.context_cycle[i%g.context_cycle.length];rows.push([g.operation_start+i,g.operation_type,rule,"",ctx,g.accuracy_score_4]);}}
 return rows.sort((a,b)=>a[0]-b[0]);
}
function expandExamples(e){
 let out=[],num=parseInt(e.example_start.split("-").pop(),10);
 for(const s of e.scenarios){for(const p of e.parcels){out.push([`HD2-QA-${num++}`,s.scenario,p.parcel,p.parcel_row_id,p.hmlr_id,p.grid_tile,p.area_m2,p.dtm1m,p.dtm2m,p.delta,e.numeric_result_confidence_percent,e.parcel_specific_survey_identity,s.rule_code,e.accuracy_score_4,false]);}}
 return out;
}
(async()=>{
 const [o,s,e,p,a]=await Promise.all([load("operations_increment_097.json"),load("source_candidates_increment_097.json"),load("examples_increment_097.json"),load("progress_increment_097.json"),load("integrity_audit_increment_097.json")]);
 cards.innerHTML=[["main",`${p.completed_operation_count}/${p.planned_operation_count}`],["overall",`${p.overall_completion_percent}%`],["operations",p.website_operation_rows_written],["sources",p.website_source_rows_written],["examples",p.website_example_rows_written],["numeric confidence",`${p.numeric_result_confidence_percent}%`],["blocker",p.blocker]].map(x=>`<div class=card><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join("");
 ops.innerHTML=expandOps(o).map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td title="${esc(o.rule_descriptions[r[2]]||"")}">${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td class=ok>${r[5]}/4</td></tr>`).join("");
 src.innerHTML=s.candidates.map(c=>`<tr><td>${esc(c.candidate_id)}</td><td>${esc(c.publisher)}</td><td>${esc(c.name)}</td><td>${esc(c.role)}</td><td class=ok>${c.source_confidence_percent}%</td><td>${esc(c.verified_facts.join(" | "))}<br><b>limit:</b> ${esc(c.semantic_limits.join(" | "))}</td></tr>`).join("");
 ex.innerHTML=expandExamples(e).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[5])}</td><td>${r[7].toFixed(3)}</td><td>${r[8].toFixed(3)}</td><td>${r[9].toFixed(3)}</td><td>${r[10]}%</td><td>${esc(r[11])}</td><td>${esc(r[12])}</td><td class=ok>${r[13]}/4</td></tr>`).join("");
 audit.textContent=JSON.stringify(a,null,2);
})();
</script></body></html>
