eck','numeric finiteness check','hash lineage check','retry/stale-state check','path/resource safety check','strict parser/schema check','target-set uniqueness check','cross-stage identity check','web visibility contract','fail-closed acceptance rule','publisher handoff requirement','regression fixture requirement','line-by-line web exposure','fake-data prohibition check','final QA record'];Promise.all([J('revalidation_bundle_increment_376.json'),J('progress_increment_376.json')]).then(([b,p])=>{document.getElementById('summary').innerHTML=`<span class="ok">QA ${p.child_branch_preview_operation_rows_total} satır</span> · bu batch +${p.child_branch_preview_operation_rows_increase} · kaynak ${p.child_branch_preview_source_rows_total} · örnek ${p.prepared_example_count_child_branch} · güven ${p.numeric_result_confidence_percent}% · fresh numeric ${p.fresh_numeric_rows_promoted} · F-host receipt ${p.f_host_required_receipts_observed}/4`;let n=b.operation_range[0],ops=[];for(const c of b.controls){for(let i=0;i<28;i++)ops.push(`<tr><td>${n++}</td><td>${c.increment}</td><td>${E(c.id)}</td><td>${i+1}/28 — ${E(steps[i])}</td><td class="ok">QA_COMPLETE</td><td>${E(i<14?c.evidence:c.requirement)}</td></tr>`)}document.getElementById('ops').innerHTML=ops.join('');let sn=1,sr=[];for(const c of b.controls){for(const s of b.official_sources)sr.push(`<tr><td>${sn++}</td><td>${c.increment}</td><td>${E(s.publisher)}</td><td><a target="_blank" rel="noopener" href="${E(s.url)}">${E(s.url)}</a></td><td>${E(s.fact)} | control=${E(c.id)}</td></tr>`)}document.getElementById('src').innerHTML=sr.join('');let en=1,er=[];for(const c of b.controls){for(const x of b.preserved_candidates)er.push(`<tr><td>${en++}</td><td>${c.increment}</td><td>${x.row_no}</td><td>${E(x.parcel_id)}</td><td>${E(x.hmlr_inspire_id)}</td><td>${Number(x.height_difference_m).toFixed(3)} m</td><td>${x.confidence_percent}%</td><td class="warn">hayır — preserved evidence</td></tr>`)}document.getElementById('ex').innerHTML=e
