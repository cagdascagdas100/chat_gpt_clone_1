const fs=['operations_increment_212.json','source_candidates_increment_212.json','examples_increment_212.json','progress_increment_212.json'];
Promise.all(fs.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.json()))).then(([o,s,e,p])=>{

h+='<h2>Operations</h2><table border=1><tr><th>No</th><th>Status</th><th>Stage</th><th>Details</th></tr>';o.operations.forEach(x=>h+=`<tr><td>${x.operation_no}</td><td>${x.status}</td><td>${x.stage}</td><td>${x.details}</td></tr>`);
h+='</table><h2>Source revalidations</h2><table border=1><tr><th>ID</th><th>Publisher</th><th>Name</th><th>Confidence</th><th>State</th></tr>';s.candidates.forEach(x=>h+=`<tr><td>${x.candidate_id}</td><td>${x.publisher}</td><td><a href="${x.source_url}" target="_blank" rel="noopener">${x.name}</a></td><td>${x.source_confidence_percent}%</td><td>${x.promotion_state}</td></tr>`);
h+='</table><h2>ASCII index roundtrip examples</h2><table border=1><tr><th>ID</th><th>Row</th><th>HMLR</th><th>Height diff</th><th>Confidence</th><th>Tile</th><th>Header</th><th>Roundtrip cells</th></tr>';e.examples.forEach(x=>{const cells=x.roundtrip_cells.map(c=>`${c.ascii_read} → row ${c.data_row_1based}, col ${c.token_1based} → (${c.pixel_center_epsg27700.join(',')})`).join(' | ');h+=`<tr><td>${x.example_id}</td><td>${x.row_no}</td><td>${x.hmlr_inspire_id}</td><td>${x.height_difference_m} m</td><td>${x.result_confidence_percent}%</td><td>${x.terrain50_tile}</td><td>${e.index_contract.header_rows} rows</td><td>${cells}</td></tr>`});document.getElementById('app').innerHTML=h+'</table>';});
</script>
