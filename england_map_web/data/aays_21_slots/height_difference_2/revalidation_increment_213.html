<!doctype html><meta charset="utf-8"><title>height_difference_2 QA 213</title><h1>height_difference_2 — increment 213</h1><div id="app">Loading…</div><script>
const fs=['operations_increment_213.json','source_candidates_increment_213.json','examples_increment_213.json','progress_increment_213.json'];
Promise.all(fs.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.json()))).then(([o,s,e,p])=>{
let h=`<p>operations ${p.child_branch_preview_operation_rows_total} (+${p.child_branch_preview_operation_rows_increase}, +${p.child_branch_preview_operation_rows_increase_percent}%) | source rows ${p.child_branch_preview_source_rows_total} (+${p.child_branch_preview_source_rows_increase}) | examples ${p.child_branch_preview_example_rows_total} (+${p.child_branch_preview_example_rows_increase}) | result confidence ${p.numeric_result_confidence_percent}% | WCS ${p.ea_wcs_version} | composite year ${p.ea_composite_year} | remaining result checks ${p.remaining_result_checks}</p>`;
h+='<h2>Operations</h2><table border=1><tr><th>No</th><th>Status</th><th>Stage</th><th>Details</th></tr>';o.operations.forEach(x=>h+=`<tr><td>${x.operation_no}</td><td>${x.status}</td><td>${x.stage}</td><td>${x.details}</td></tr>`);
h+='</table><h2>Source revalidations</h2><table border=1><tr><th>ID</th><th>Publisher</th><th>Name</th><th>Confidence</th><th>State</th></tr>';s.candidates.forEach(x=>h+=`<tr><td>${x.candidate_id}</td><td>${x.publisher}</td><td>${x.source_url.startsWith('http')?`<a href="${x.source_url}" target="_blank" rel="noopener">${x.name}</a>`:x.name}</td><td>${x.source_confidence_percent}%</td><td>${x.promotion_state}</td></tr>`);
h+='</table><h2>Temporal-lineage examples</h2><table border=1><tr><th>ID</th><th>Row</th><th>HMLR</th><th>Height diff</th><th>Confidence</th><th>Service current</th><th>Observation epoch</th><th>Lineage</th></tr>';e.examples.forEach(x=>h+=`<tr><td>${x.example_id}</td><td>${x.row_no}</td><td>${x.hmlr_inspire_id}</td><td>${x.height_difference_m} m</td><td>${x.result_confidence_percent}%</td><td>${x.service_current}</td><td>${x.observation_epoch_state}</td><td>${x.lineage_summary}</td></tr>`);document.getElementById('app').innerHTML=h+'</table>';});
</script>
