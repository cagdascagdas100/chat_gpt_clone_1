<!doctype html><html><head><meta charset="utf-8"><title>height_difference_2 increment 091</title><style>body{font-family:system-ui,Arial,sans-serif;margin:20px;line-height:1.35}table{border-collapse:collapse;width:100%;font-size:12px;margin:12px 0 28px}th,td{border:1px solid #bbb;padding:5px;vertical-align:top}th{position:sticky;top:0;background:#eee}pre{white-space:pre-wrap}</style></head><body><h1>height_difference_2 — increment 091</h1><div id="summary"></div><h2>Operations</h2><div id="ops"></div><h2>Sources</h2><div id="src"></div><h2>Examples</h2><div id="ex"></div><h2>Integrity</h2><pre id="audit"></pre><script>
async function j(f){return (await fetch(f)).json()} function tbl(h,r){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+String(x??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
