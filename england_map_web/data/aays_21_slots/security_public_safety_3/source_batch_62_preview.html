<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 - Batch 62</title><style>:root{color-scheme:dark}body{margin:0;background:#0b1118;color:#e8eef6;font:14px Segoe UI,Arial,sans-serif}header,.toolbar,.summary{padding:12px 16px;background:#111b27;border-bottom:1px solid #2b3b50}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;min-height:38px;background:#08111b;color:#e8eef6;border:1px solid #3c4d63;padding:7px}.pill{display:inline-block;border:1px solid #405168;padding:5px 8px;margin:2px}.wrap{overflow:auto;height:calc(100vh - 170px)}table{border-collapse:collapse;min-width:2500px;width:100%;font-size:12px}th,td{border:1px solid #27384b;padding:6px;vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;background:#18263a;text-align:left}.held{background:#211f16}.reaudit{background:#13231d}a{color:#8cc8ff}.mono{font-family:Consolas,monospace}</style></head><body><header><h1>Batch 62 — Satır Bazlı İşlemler</h1><p>18 resmî polis/yangın/acil hazırlık kaynağı ve 14 aday yeniden denetimi. LSOA proxy kesin parsel ölçümü değildir.</p></header><section class="toolbar"><input id="q" placeholder="İşlem, kurum, başlık, parsel, LSOA veya karar ara"><button id="reload">Yenile</button></section><section class="summary" id="summary"></section><div id="msg" class="summary">Yükleniyor…</div><div class="wrap"><table><thead><tr><th>ID</th><th>Durum</th><th>Tür</th><th>Başlık</th><th>Kurum</th><th>Parsel</th><th>LSOA</th><th>Skor</th><th>Seviye</th><th>Doğruluk</th><th>Güven</th><th>Kayıt</th><th>Tarih</th><th>Karar</th><th>Kaynak</th><th>SHA-256</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table></div><script>'use strict';const files=["source_worker_batch_62_official.json","source_worker_batch_62_candidates.json"];let all=[];const e=v=>String(v??"not_available").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function expand(d){return(d.operation_rows||[]).map(r=>{const o={...(d.operation_common||{})};d.operation_columns.forEach((k,i)=>o[k]=r[i]);return o})}function render(){const s=q.value.toLocaleLowerCase("tr-TR"),d=s?all.filter(x=>JSON.stringify(x).toLocaleLowerCase("tr-TR").includes(s)):all;rows.innerHTML=d.map(o=>`<tr class="${String(o.decision||"").startsWith("held_")?"held":o.operation_type==="representative_candidate_reaudit"?"reaudit":""}"><td class="mono">${e(o.operation_id)}</td><td>${e(o.status)}</td><td>${e(o.operation_type)}</td><td>${e(o.source_title)}</td><td>${e(o.source_agency)}</td><td>${e(o.parcel_id)}</td><td>${e(o.lsoa_code)}</td><td>${e(o.security_score_percent)}</td><td>${e(o.security_level)}</td><td>${e(o.source_authority_accuracy??o.accuracy_score_4)}${o.accuracy_score_4?"/4":"%"}</td><td>${e(o.confidence_score)}</td><td>${e(o.official_api_sample_crime_count)}</td><td>${e(o.evidence_date??o.canonical_evidence_month)}</td><td>${e(o.decision)}</td><td>${o.source_url?`<a target="_blank" rel="noopener" href="${e(o.source_url)}">Kaynak</a>`:"not_available"}</td><td class="mono">${e(o.source_identity_sha256??o.official_api_sample_sha256)}</td><td>${e((o.result||"")+" "+(o.parcel_attribution_limit||""))}</td></tr>`).join("")||'<tr><td colspan="17">Eşleşen satır yok.</td></tr>';msg.textContent=`${d.length} / ${all.length} satır gösteriliyor.`}async function load(){try{const ds=await Promise.all(files.map(f=>fetch(`${f}?v=${Date.now()}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(`${f}: HTTP ${r.status}`);return r.json()})));all=ds.flatMap(expand);const held=all.filter(x=>String(x.decision||"").startsWith("held_")).length,off=all.filter(x=>x.operation_type==="official_source_revalidation").length,rea=all.filter(x=>x.operation_type==="representative_candidate_reaudit").length;summary.innerHTML=`<span class="pill">Toplam <b>${all.length}</b></span><span class="pill">Resmî kaynak <b>${off}</b></span><span class="pill">Aday denetimi <b>${rea}</b></span><span class="pill">Held <b>${held}</b></span><span class="pill">Blocked <b>0</b></span><span class="pill">Eşzamanlı yükleme <b>2</b></span>`;render()}catch(err){all=[];msg.textContent="FAIL-CLOSED: "+err.message}}q.addEventListener("input",render);reload.addEventListener("click",load);load();</script></body></html>
