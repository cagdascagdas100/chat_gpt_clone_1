<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 — Batch 50</title><style>:root{color-scheme:dark;--bg:#0b1118;--panel:#111b27;--line:#2b3b50;--text:#e8eef6;--muted:#a7b5c6;--ok:#60d394;--warn:#ffca6a;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}header,.summary,.toolbar{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}h1{margin:0 0 6px;font-size:21px}p{margin:3px 0;color:var(--muted)}.summary{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #405168;padding:5px 8px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;min-height:38px;border:1px solid #3c4d63;background:#08111b;color:var(--text);padding:7px 10px}.table-wrap{overflow:auto;height:calc(100vh - 205px)}table{border-collapse:collapse;min-width:2350px;width:100%;font-size:12px}th,td{border:1px solid #27384b;padding:6px;vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;background:#18263a;text-align:left}a{color:#8cc8ff}.mono{font-family:Consolas,monospace;font-size:11px}.held td{background:#211f16}.reaudit td{background:#13231d}.message{padding:9px 16px;color:var(--muted)}</style></head><body><header><h1>Security / Public Safety 3 — Batch 50</h1><p>42 resmî internet kaynağı ve 18 temsili aday denetimi satır bazında gösterilir. Kaynaklar kesin mekânsal eşleşme sağlamıyorsa aday puanı yükseltilmez.</p></header><section class="toolbar"><input id="search" placeholder="İşlem, kaynak, yayıncı, aday, LSOA, karar veya SHA ara"></section><section class="summary" id="summary"></section><div class="message" id="message">Veri yükleniyor…</div><div class="table-wrap"><table><thead><tr><th>İşlem ID</th><th>Durum</th><th>Tür</th><th>Aday</th><th>LSOA</th><th>Skor</th><th>Kaynak</th><th>Yayıncı</th><th>Doğruluk</th><th>Karar</th><th>Tarih/Ay</th><th>Sonuç</th><th>Sınır</th><th>Resmî URL</th><th>SHA-256</th></tr></thead><tbody id="rows"></tbody></table></div><script>'use strict';const esc=v=>String(v===null||v===undefined||v===''?'not_available':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];const render=()=>{const q=search.value.trim().toLocaleLowerCase('tr-TR'),data=q?all.filter(x=>JSON.stringify(x).toLocaleLowerCase('tr-TR').includes(q)):all;rows.innerHTML=data.map(o=>{const held=String(o.decision||'').startsWith('held_'),reaudit=o.operation_type==='representative_candidate_reaudit',url=o.source_url||o.official_api_validation_url,sha=o.source_identity_sha256||o.official_api_sample_sha256;return `<tr class="${held?'held':reaudit?'reaudit':''}"><td class="mono">${esc(o.operation_id)}</td><td>${esc(o.status)}</td><td>${esc(o.operation_type)}</td><td>${esc(o.parcel_id)}</td><td>${esc(o.lsoa_code)}</td><td>${esc(o.security_score_percent)}</td><td>${esc(o.source_name)}</td><td>${esc(o.publisher)}</td><td>${esc(o.accuracy_score_4)}/4 · ${esc(o.confidence_score)}%</td><td>${esc(o.decision)}</td><td>${esc(o.evidence_date||o.canonical_evidence_month)}</td><td>${esc(o.result)}</td><td>${esc(o.parcel_attribution_limit)}</td><td>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Kaynak</a>`:'not_available'}</td><td class="mono">${esc(sha)}</td></tr>`}).join('')||'<tr><td colspan="15">Eşleşen satır yok.</td></tr>';message.textContent=`${data.length} / ${all.length} işlem satırı gösteriliyor.`};let done=false;const timer=setTimeout(()=>{if(!done){message.textContent='FAIL-CLOSED: veri 8 saniye içinde yüklenmedi';message.className='message bad'}},8000);fetch('source_worker_batch_50_latest.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest HTTP '+r.status);return r.json()}).then(async d=>{const docs=await Promise.all(d.parts.map(f=>fetch(f+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' HTTP '+r.status);return r.json()})));all=docs.flatMap(x=>Array.isArray(x.operations)?x.operations:[]);summary.innerHTML=`<span class="pill ok">Toplam: <b>${all.length}</b></span><span class="pill ok">Tamamlanan: <b>${all.filter(o=>o.status==='completed').length}</b></span><span class="pill ok">Resmî kaynak: <b>${d.official_source_operation_count}</b></span><span class="pill ok">Aday denetimi: <b>${d.representative_candidate_reaudit_count}</b></span><span class="pill ok">Promoted: <b>${d.promoted_source_count}</b></span><span class="pill warn">Held: <b>${d.held_source_count}</b></span><span class="pill ok">Ortalama kaynak güveni: <b>${d.source_authority_accuracy_average}%</b></span><span class="pill warn">Aday güven artışı: <b>0</b></span>`;done=true;clearTimeout(timer);render()}).catch(e=>{done=true;clearTimeout(timer);message.textContent='FAIL-CLOSED: '+e.message;message.className='message bad'});search.addEventListener('input',render);</script></body></html>
