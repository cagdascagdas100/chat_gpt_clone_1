<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch 53 - Security Public Safety 3</title>
<style>body{margin:0;background:#0b1118;color:#e8eef6;font:14px Segoe UI,Arial}header,.toolbar,.summary{padding:12px 16px;background:#111b27;border-bottom:1px solid #2b3b50}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;min-height:36px;background:#08111b;color:#e8eef6;border:1px solid #3c4d63;padding:6px}.summary{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #405168;padding:5px 8px}.wrap{height:calc(100vh - 155px);overflow:auto}table{border-collapse:collapse;min-width:1900px;width:100%;font-size:12px}th,td{border:1px solid #27384b;padding:6px;vertical-align:top}th{position:sticky;top:0;background:#18263a}tr.held td{background:#211f16}tr.reaudit td{background:#13231d}a{color:#8cc8ff}.mono{font-family:Consolas,monospace}</style></head><body>
<header><h2>Batch 53 — Satır Bazlı Kaynak ve Aday Denetimi</h2><div>42 resmî kaynak + 18 aday yeniden denetimi. Kesin mekânsal kesişim yoksa aday güveni yükseltilmez.</div></header>
<section class="toolbar"><input id="q" placeholder="İşlem, kaynak, parsel, LSOA veya karar ara"><button id="r">Yenile</button></section><section id="sum" class="summary"></section>
<div class="wrap"><table><thead><tr><th>ID</th><th>Durum</th><th>Tür</th><th>Kaynak/Parsel</th><th>LSOA</th><th>Skor</th><th>Doğruluk</th><th>Karar</th><th>Tarih</th><th>Kaynak</th><th>SHA</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>'use strict';const files=["source_worker_batch_53_part_1.json","source_worker_batch_53_part_2.json","source_worker_batch_53_part_3.json","source_worker_batch_53_part_4.json","source_worker_batch_53_part_5.json"];let all=[];const esc=v=>String(v??"not_available").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function expand(d){let o=Array.isArray(d.operations)?d.operations:[];if(Array.isArray(d.operation_rows)&&Array.isArray(d.operation_columns)){const c=d.operation_common||{};o=o.concat(d.operation_rows.map(r=>{const x={...c};d.operation_columns.forEach((k,i)=>x[k]=r[i]);return x}))}return o}async function load(){const docs=await Promise.all(files.map(f=>fetch(f+"?v="+Date.now(),{cache:"no-store"}).then(x=>{if(!x.ok)throw Error(f+": HTTP "+x.status);return x.json()})));all=docs.flatMap(expand);render()}function render(){const s=q.value.toLocaleLowerCase("tr-TR"),d=s?all.filter(x=>JSON.stringify(x).toLocaleLowerCase("tr-TR").includes(s)):all;rows.innerHTML=d.map(o=>`<tr class="${String(o.decision||"").startsWith("held_")?"held":o.operation_type==="representative_candidate_reaudit"?"reaudit":""}"><td class="mono">${esc(o.operation_id)}</td><td>${esc(o.status)}</td><td>${esc(o.operation_type)}</td><td>${esc(o.source_title||o.parcel_id)}</td><td>${esc(o.lsoa_code)}</td><td>${esc(o.security_score_percent)}</td><td>${esc(o.source_authority_accuracy||o.accuracy_score_4)}</td><td>${esc(o.decision)}</td><td>${esc(o.evidence_date||o.canonical_evidence_month)}</td><td>${o.source_url?`<a href="${esc(o.source_url)}" target="_blank" rel="noopener">Kaynak</a>`:"not_available"}</td><td class="mono">${esc(o.source_identity_sha256||o.official_api_sample_sha256)}</td><td>${esc(o.result)}</td></tr>`).join("");sum.innerHTML=`<span class="pill">Toplam <b>${all.length}</b></span><span class="pill">Resmî <b>${all.filter(x=>x.operation_type==="official_source_validation").length}</b></span><span class="pill">Aday denetimi <b>${all.filter(x=>x.operation_type==="representative_candidate_reaudit").length}</b></span><span class="pill">Held <b>${all.filter(x=>String(x.decision||"").startsWith("held_")).length}</b></span>`}q.addEventListener("input",render);r.addEventListener("click",load);load().catch(e=>rows.innerHTML=`<tr><td colspan="12">FAIL-CLOSED: ${esc(e.message)}</td></tr>`);</script></body></html>
