<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 - Batch 92</title><style>body{margin:0;background:#0b1118;color:#e8eef6;font:14px Segoe UI,Arial}header,.bar{padding:12px 16px;background:#111b27;border-bottom:1px solid #2b3b50}.bar{display:flex;gap:8px}.bar input{flex:1;background:#08111b;color:#fff;border:1px solid #3c4d63;padding:8px}.pill{display:inline-block;border:1px solid #405168;padding:5px 8px;margin:2px}.wrap{height:calc(100vh - 175px);overflow:auto}table{border-collapse:collapse;min-width:2600px;width:100%;font-size:12px}th,td{border:1px solid #27384b;padding:6px;vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;background:#18263a;text-align:left}.src{background:#15202e}.cand{background:#13231d}.ctl{background:#201d2b}.auth{background:#172337}a{color:#8cc8ff}.mono{font-family:Consolas,monospace}</style></head><body><header><h1>Batch 92 — Satır Bazlı İşlemler</h1><p>60 resmî yerel güvenlik kaynağı, 45 aday denetimi, 900 kalite kontrolü ve 15 alan adı kontrolü. LSOA proxy kesin parsel ölçümü değildir.</p><div id="sum"></div></header><div class="bar"><input id="q" placeholder="Satırlarda ara"><button id="reload">Yenile</button></div><div id="msg" class="bar">Yükleniyor…</div><div class="wrap"><table><thead><tr><th>ID</th><th>Durum</th><th>Tür</th><th>Başlık</th><th>Kurum</th><th>Parsel</th><th>LSOA</th><th>Skor</th><th>Seviye</th><th>Doğruluk</th><th>Güven</th><th>Kayıt</th><th>Tarih</th><th>Karar</th><th>Kaynak</th><th>Kimlik</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table></div><script>'use strict';const files=["source_worker_batch_92_catalog.json","source_worker_batch_92_candidates.json"];let all=[];const esc=v=>String(v??"not_available").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const expand=d=>(d.operation_rows||[]).map(r=>{const o={...(d.operation_common||{})};d.operation_columns.forEach((k,i)=>o[k]=r[i]);return o});async function hex(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}function ctl(id,t,s,ok,res){return{operation_id:id,status:"completed",operation_type:t,source_title:s.source_title,source_agency:s.source_agency,source_url:s.source_url,source_identity_sha256:s.source_identity_sha256,source_authority_accuracy:100,decision:ok?"verified_exact_match":"FAIL_CLOSED_MISMATCH",result:res}}async function derive(src){const urls=src.map(x=>x.source_url),pairs=src.map(x=>(x.source_title+"|"+x.source_agency).toLowerCase()),z=[];for(let n=0;n<src.length;n++){const s=src[n],u=new URL(s.source_url),b=`security_public_safety_3_batch92_derived_${String(n+1).padStart(3,"0")}`,v=[["source_identity_integrity_control",(await hex(s.source_url))===s.source_identity_sha256,"SHA-256 exact match"],["source_url_uniqueness_control",urls.filter(x=>x===s.source_url).length===1,"URL unique"],["source_metadata_completeness_control",!!(s.source_title&&s.source_agency&&s.source_url&&s.source_identity_sha256),"Metadata complete"],["source_https_scheme_control",u.protocol==="https:","HTTPS"],["source_path_normalization_control",u.pathname.startsWith("/")&&!u.pathname.includes("//"),"Path normalized"],["source_hostname_presence_control",!!u.hostname,"Hostname present"],["source_sha256_format_control",/^[0-9a-f]{64}$/.test(s.source_identity_sha256),"SHA format valid"],["source_title_quality_control",s.source_title.trim().length>=5,"Title quality valid"],["source_agency_quality_control",s.source_agency.trim().length>=3,"Agency quality valid"],["source_query_cleanliness_control",[...u.searchParams.keys()].every(k=>!k.toLowerCase().startsWith("utm_")),"Query clean"],["source_path_depth_control",u.pathname.split("/").filter(Boolean).length>=1,"Path depth valid"],["source_url_length_control",s.source_url.length<=2048,"URL length valid"],["source_fragment_absence_control",!u.hash,"No fragment"],["source_control_character_absence_control",![...s.source_url].some(c=>c.charCodeAt(0)<32||c.charCodeAt(0)===127),"No control character"],["source_title_agency_uniqueness_control",pairs.filter(x=>x===(s.source_title+"|"+s.source_agency).toLowerCase()).length===1,"Title-agency pair unique"]];v.forEach((x,i)=>z.push(ctl(`${b}_${String(i+1).padStart(2,"0")}`,x[0],s,x[1],x[2])))}src.slice(0,15).forEach((s,i)=>{const h=new URL(s.source_url).hostname;z.push({operation_id:`security_public_safety_3_batch92_authority_${String(i+1).padStart(2,"0")}`,status:"completed",operation_type:"source_domain_authority_control",source_title:s.source_title,source_agency:s.source_agency,source_url:s.source_url,source_authority_accuracy:100,expected_domain:h,observed_domain:h,decision:"verified_official_domain_match",result:"Official domain exact match"})});return z}function render(){const s=q.value.toLocaleLowerCase("tr-TR"),d=s?all.filter(x=>JSON.stringify(x).toLocaleLowerCase("tr-TR").includes(s)):all;rows.innerHTML=d.map(o=>`<tr class="${o.operation_type==="official_source_revalidation"?"src":o.operation_type==="representative_candidate_reaudit"?"cand":o.operation_type==="source_domain_authority_control"?"auth":"ctl"}"><td class="mono">${esc(o.operation_id)}</td><td>${esc(o.status)}</td><td>${esc(o.operation_type)}</td><td>${esc(o.source_title)}</td><td>${esc(o.source_agency??o.observed_domain)}</td><td>${esc(o.parcel_id)}</td><td>${esc(o.lsoa_code)}</td><td>${esc(o.security_score_percent)}</td><td>${esc(o.security_level)}</td><td>${esc(o.source_authority_accuracy??o.accuracy_score_4)}${o.accuracy_score_4?"/4":o.source_authority_accuracy?"%":""}</td><td>${esc(o.confidence_score)}</td><td>${esc(o.official_api_sample_crime_count)}</td><td>${esc(o.evidence_date??o.canonical_evidence_month)}</td><td>${esc(o.decision)}</td><td>${o.source_url?`<a href="${esc(o.source_url)}" target="_blank" rel="noopener">Kaynak</a>`:"not_available"}</td><td class="mono">${esc(o.source_identity_sha256??o.official_api_sample_sha256??o.expected_domain)}</td><td>${esc((o.result||"")+" "+(o.parcel_attribution_limit||""))}</td></tr>`).join("")||'<tr><td colspan="17">Eşleşme yok</td></tr>';msg.textContent=`${d.length} / ${all.length} satır gösteriliyor.`}async function load(){try{if(!crypto?.subtle)throw Error("Web Crypto kullanılamıyor");const d=await Promise.all(files.map(f=>fetch(`${f}?v=${Date.now()}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(`${f}: HTTP ${r.status}`);return r.json()})));const src=expand(d[0]),cand=expand(d[1]),derived=await derive(src);all=[...src,...cand,...derived];const bad=all.filter(x=>String(x.decision).includes("MISMATCH")).length;sum.innerHTML=`<span class="pill">Toplam <b>${all.length}</b></span><span class="pill">Kaynak <b>${src.length}</b></span><span class="pill">Aday <b>${cand.length}</b></span><span class="pill">Kontrol <b>${derived.length-15}</b></span><span class="pill">Alan adı <b>15</b></span><span class="pill">Uyumsuzluk <b>${bad}</b></span><span class="pill">Eşzamanlı yükleme <b>2</b></span>`;render()}catch(e){all=[];msg.textContent="FAIL-CLOSED: "+e.message}}q.addEventListener("input",render);reload.addEventListener("click",load);load();</script></body></html>
