<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 841-848</title></head><body><h1>Waves 841–848 · Flood risk, FRA and climate allowances</h1><p>27 Temmuz 2026 resmî kaynak denetimi. EA standing advice ve climate allowances planlama girdisidir; exact site flood result için güncel site araştırması, uygun model ve gerektiğinde FRA gerekir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=841,firstRow=1819822,rowsPerWave=2340,confidence=99.95;const themes=['When a flood risk assessment is required','Sustainable drainage strategy gate','EA national flood-risk standing advice','Flood Zone consultation routes','Sequential and exception tests','Climate-change allowances','Existing-model limitations and correct product choice','Wave848 flood evidence integrity audit'];const sources=['https://www.gov.uk/guidance/flood-risk-assessments-applying-for-planning-permission','https://www.gov.uk/guidance/national-flood-risk-standing-advice-for-local-planning-authorities','https://www.gov.uk/guidance/preparing-a-flood-risk-assessment-standing-advice','https://www.gov.uk/guidance/flood-risk-assessments-climate-change-allowances','https://www.gov.uk/guidance/developers-get-environmental-advice-on-your-planning-proposals'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=area_or_guidance_evidence_not_exact_property_flood_result | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
