<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 913-920</title></head><body><h1>Waves 913–920 · NSIP HRA ve katılım süreci</h1><p>Planning Inspectorate/GOV.UK resmî kaynakları. HRA aşamaları, temsil ve yerel otorite rolleri proje bazlı DCO sonucu yerine geçmez.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=913,firstRow=1988302,rowsPerWave=2340,confidence=99.95;const themes=['NSIP HRA screening likely-significant-effects gate','NSIP HRA appropriate-assessment integrity test','NSIP HRA derogation and RIES evidence gate','NSIP public participation stage distinction','Relevant representation registration status','Local-authority consultation and DCO requirements role','DCO change consultation is separate statutory process','Linear-project environmental statement and land-rights guard'];const sources=['https://www.gov.uk/guidance/nationally-significant-infrastructure-projects-advice-on-habitats-regulations-assessments','https://www.gov.uk/government/collections/national-infrastructure-planning-advice-notes','https://www.gov.uk/guidance/nationally-significant-infrastructure-projects-advice-for-local-authorities','https://www.gov.uk/guidance/nationally-significant-infrastructure-projects-advice-on-preparing-applications-for-linear-projects','https://www.gov.uk/government/collections/national-infrastructure-planning-guidance-portal'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=process_or_HRA_stage_not_project_consent | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
