ssion guard','Exact-site planning history required for promotion','No inferred candidate promotion','Wave1586 cross-source housing/land integrity audit'];const sources=['https://www.gov.uk/guidance/national-planning-policy-framework/5-delivering-a-sufficient-supply-of-homes','https://www.gov.uk/guidance/housing-supply-and-delivery','https://www.gov.uk/guidance/publishing-your-local-plan-housing-requirement','https://www.planning.data.gov.uk/dataset/brownfield-land','https://www.planning.data.gov.uk/dataset/brownfield-site','https://www.planning.data.gov.uk/dataset/green-belt','https://www.gov.uk/guidance/national-planning-policy-framework/annex-2-glossary','https://www.gov.uk/guidance/green-belt'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source='+src+' | guard=authority_level_dataset_policy_not_exact_site_permission | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
