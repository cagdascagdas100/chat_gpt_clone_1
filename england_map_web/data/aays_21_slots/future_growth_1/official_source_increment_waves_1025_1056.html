olygons1','https://www.planning.data.gov.uk/dataset/agricultural-land-classification','https://www.gov.uk/guidance/developers-get-environmental-advice-on-your-planning-proposals']},{subs:['Local Nature Reserves 13 Jul 2026 freshness','LNR statutory designation semantics','LNRS areas/responsible authorities 26 Jun 2026','Published-versus-preparation LNRS status','LNRS material-consideration evidence class','Draft LNRS evidential-use guard','Protected species standing advice distinction','LNRS/protected-species exact-site evidence gate'],sources:['https://www.data.gov.uk/dataset/acdf4a9e-a115-41fb-bbe9-603c819aa7f7/local-nature-reserves-england1','https://www.gov.uk/government/publications/local-nature-recovery-strategies-areas-and-responsible-authorities','https://www.gov.uk/government/publications/local-nature-recovery-strategies','https://www.gov.uk/guidance/natural-environment','https://www.gov.uk/guidance/protected-species-and-development-advice-for-local-planning-authorities']},{subs:['Land Use Framework 18 Mar 2026 policy status','Land Use Framework accessible version 6 May 2026','Land Use Framework publications collection 13 Jul 2026','Land-use evidence supports decisions not allocations','Government Estate Nature Plan 22 Jul 2026 version','GENP applies to government land not private-site permission','30by30/soil/ALC evidence publication guard','Land-use strategy versus exact-site consent gate'],sources:['https://www.gov.uk/government/publications/land-use-framework','https://www.gov.uk/government/publications/land-use-framework/the-land-use-framework-for-england-accessible','https://www.gov.uk/government/collections/land-use-framework-publications','https://www.gov.uk/government/publications/government-estate-nature-plan-genp']}];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function getG(w){const idx=w-firstWave;return groups[Math.floor(idx/8)]}function render(w){const idx=w-firstWave,g=getG(w),theme=g.subs[idx%8],s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?g.sources[i%g.sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+theme+' | source='+src+' | guard=inventory_strategy_national_scale_not_exact_site_result | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=1056;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);const initial=m?Math.max(firstWave,Math.min(1056,Number(m[1]))):firstWave;render(initial)</script></body></html>
