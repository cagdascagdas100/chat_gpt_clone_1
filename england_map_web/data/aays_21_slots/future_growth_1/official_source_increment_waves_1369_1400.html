<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 1369-1400</title></head><body><h1>Waves 1369–1400 · Design code, local-plan and consultation status evidence</h1><p>27 Temmuz 2026 resmî internet kanıtı. Current design-code guidance, 2026 consultation drafts, chief-planning-officer letters and new-plan readiness material are kept as separate evidence classes.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=1369,lastWave=1400,firstRow=3055342,rowsPerWave=2340,confidence=99.96;const themes=['National Model Design Code status','NMDC guidance versus national policy distinction','Creating a design code current guidance','Site-specific versus authority-wide design-code detail','Design-code numerical/graphical requirements','Design-code baseline versus exact application decision','Design-code local consultation requirement','Local code adoption/current-version evidence gate','Design and Placemaking PPG Jan 2026 consultation','Consultation draft versus adopted PPG guard','Draft consolidated design guidance evidence class','NPPF consultation cross-reference guard','Chief planning officer letters 22 Jul 2026 index','CPO letter operational guidance versus policy status','2026 letter publication-date audit','Letter-specific applicability evidence gate','Getting ready to prepare a new plan 26 Mar 2026','New-plan readiness guidance explicitly draft','Legacy plan system versus new system guard','Gateway 1 readiness versus plan adoption','30-month plan target versus actual plan status','Project initiation document versus adopted policy','Local-plan current document evidence gate','Design code local plan dependency guard','Office for Place 10 criteria non-policy status','Good-practice tool versus government guidance','Current NMDC 2021 publication-date guard','Consultation status current-date verification','Adopted local code exact-authority evidence required','No site approval inferred from design guidance','Current/draft/good-practice/policy classes separate','Wave1400 plan-design current-date integrity audit'];const sources=['https://www.gov.uk/government/publications/national-model-design-code','https://www.gov.uk/guidance/creating-a-design-code','https://www.gov.uk/guidance/10-criteria-for-effective-design-coding','https://www.gov.uk/government/consultations/design-and-placemaking-planning-practice-guidance','https://www.gov.uk/guidance/planning-guidance-letters-to-chief-planning-officers','https://www.gov.uk/guidance/getting-ready-to-prepare-a-new-plan'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source='+src+' | guard=current_draft_consultation_good_practice_policy_exact_site_classes_separate | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
