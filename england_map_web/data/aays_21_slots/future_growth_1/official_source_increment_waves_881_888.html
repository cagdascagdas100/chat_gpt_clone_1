<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 881-888</title></head><body><h1>Waves 881–888 · Planning practice guidance source integrity</h1><p>27 Temmuz 2026 resmî kaynak denetimi. PPG koleksiyonu farklı tarihlerde güncellenen kategoriler içerir; her alt rehber kendi revision/currentness durumuyla değerlendirilir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=881,firstRow=1913422,rowsPerWave=2340,confidence=99.89;const themes=['PPG collection vs individual guidance revision dates','Plan-making evidence currentness','Housing land availability assessment status','Housing needs assessment status','Housing supply and delivery status','Natural environment status','Flood and climate evidence status','Wave888 PPG source-integrity audit'];const sources=['https://www.gov.uk/government/collections/planning-practice-guidance','https://www.gov.uk/guidance/plan-making','https://www.gov.uk/guidance/housing-and-economic-land-availability-assessment','https://www.gov.uk/guidance/housing-and-economic-development-needs-assessments','https://www.gov.uk/guidance/housing-supply-and-delivery','https://www.gov.uk/guidance/natural-environment','https://www.gov.uk/guidance/flood-risk-assessments-climate-change-allowances'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=collection_page_date_not_substitute_for_individual_guidance_revision | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
