<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 897-904</title></head><body><h1>Waves 897–904 · Current-date cross-source integrity audit</h1><p>27 Temmuz 2026 cross-source audit. Current, draft, consultation, future-effective, strategic, modelled and site-specific evidence classes remain separate; exact parcel/project facts require exact current evidence.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=897,firstRow=1950862,rowsPerWave=2340,confidence=99.97;const themes=['Current housing guidance status audit','1 July 2026 housing-buffer effective-date audit','Current EA flood guidance status audit','Natural-environment/LNRS evidence-class audit','Viability strategic-vs-site audit','Heat-network enacted-vs-future-zoning audit','July 2026 examination/fee proposal status audit','Wave904 exact-site evidence and current-date integrity audit'];const sources=['https://www.gov.uk/guidance/housing-supply-and-delivery','https://www.gov.uk/guidance/national-planning-policy-framework/5-delivering-a-sufficient-supply-of-homes','https://www.gov.uk/guidance/flood-risk-assessments-applying-for-planning-permission','https://www.gov.uk/guidance/natural-environment','https://www.gov.uk/guidance/viability','https://www.gov.uk/guidance/heat-networks','https://www.gov.uk/government/publications/local-plan-examinations-letter-to-the-interim-chief-executive-of-the-planning-inspectorate-july-2026','https://www.gov.uk/government/consultations/fees-for-planning-applications/fees-for-planning-applications','https://www.gov.uk/guidance/planning-guidance-letters-to-chief-planning-officers'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=current_draft_future_strategic_site_specific_classes_kept_separate | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
