<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 1725-1760</title></head><body><h1>Waves 1725–1760 · Heritage, conservation and tree-protection data quality</h1><p>27 Temmuz 2026 resmî internet kanıtı. Point geometry, legal extent, incomplete coverage, duplicates and local-authority rule documents are not conflated.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=1725,lastWave=1760,firstRow=3888382,rowsPerWave=2340,confidence=99.99;const themes=['Listed-building dataset 24 Jul freshness','Listed-building point not legal extent','Listed-building two-provider provenance','Historic England attribution audit','Conservation-area 24 Jul collector freshness','Conservation-area incomplete-coverage guard','Conservation-area duplicate-record guard','Conservation-area MHCLG-origin guard','Conservation-area document 26 Jul freshness','Conservation-area document provider coverage','Tree-preservation-zone 26 Jul freshness','Tree-preservation-zone 79-provider coverage','TPO zone small-group specification guard','TPO zone MHCLG-origin guard','Tree-preservation-order 24 Jul freshness','TPO order versus zone geometry guard','TPO authority document versus dataset row','TPO exact tree/group coverage guard','Locally-listed-building experimental status','Locally-listed one-provider coverage guard','Locally-listed 2025-11-22 source-age guard','National designation versus local-list guard','Point versus polygon evidence guard','Dataset presence versus legal restriction guard','Dataset absence versus no-protection guard','Collector date versus source validity guard','Authoritative-origin versus completeness guard','MHCLG-created versus authoritative replacement guard','OGL licensing/provenance audit','Exact curtilage requires legal/site evidence','Exact rule document required where applicable','No inferred planning-permission status','No inferred candidate promotion','Evidence confidence not parcel accuracy','Current-date cross-source audit','Wave1760 heritage/data-quality integrity'];const sources=['https://www.planning.data.gov.uk/dataset/listed-building','https://www.planning.data.gov.uk/dataset/conservation-area','https://www.planning.data.gov.uk/dataset/conservation-area-document','https://www.planning.data.gov.uk/dataset/tree-preservation-zone','https://www.planning.data.gov.uk/dataset/tree-preservation-order','https://www.planning.data.gov.uk/dataset/locally-listed-building'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source='+src+' | guard=dataset_point_partial_duplicate_experimental_not_legal_extent | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
