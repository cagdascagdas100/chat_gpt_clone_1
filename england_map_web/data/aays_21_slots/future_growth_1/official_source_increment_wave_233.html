<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Wave 233</title><style>body{font-family:Arial;margin:20px}pre{white-space:pre-wrap}</style></head><body><h1>Wave 233 — Hazardous Substances/COMAH</h1><pre id="r">Yükleniyor…</pre><script>fetch('official_source_increment_wave_233_latest.json').then(x=>x.json()).then(p=>{let a=[];p.fixed.slice(0,2).forEach(x=>a.push(x.row+' | control | '+x.status+' | '+x.detail));p.official_sources.forEach(s=>a.push(s[0]+' | official_source | '+s[1]+' | '+s[3]+'/100 | '+s[2]));p.official_measurement_examples.forEach(x=>a.push(x.row+' | official_example | '+x.name+' | '+x.confidence+'/100 | '+x.fact));let row=parseInt(p.rows.matrix_rows.split('-')[0]);for(const g of p.gate_prefixes)for(let c=0;c<p.core_rules.length;c++)for(const q of p.official_sources)a.push((row++)+' | matrix | '+g+'_'+String(c+1).padStart(3,'0')+' | '+q[1]+' | '+p.core_rules[c]);p.official_sources.forEach((z,k)=>a.push((row++)+' | special_control | '+z[1]));a.push(p.fixed[2].row+' | '+p.fixed[2].status);a.push(p.fixed[3].row+' | '+p.fixed[3].status);document.getElementById('r').textContent=a.join('\n')})</script></body></html>
