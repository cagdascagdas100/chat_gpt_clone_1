<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 785-792</title></head><body><h1>Waves 785–792 · Planning Data freshness and authority</h1><p>27 Temmuz 2026 Planning Data readback. Collector/new-data tarihleri, authoritative/work-in-progress/experimental etiketleri ve provider kapsamı korunur; dataset varlığı tek başına exact site kararı değildir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=785,firstRow=1688782,rowsPerWave=2340,confidence=99.86;const themes=['Brownfield land authoritative-source and 23 Jul collector status','Brownfield site experimental dataset freshness guard','Local-plan dataset current/emerging/historical status','Local-plan boundary MHCLG-created origin guard','Local Planning Authority boundary freshness','Conservation-area incomplete and duplicate-data guard','Tree Preservation Order partial-authority origin guard','Tree Preservation Zone coverage and freshness guard'];const sources=['https://www.planning.data.gov.uk/dataset/brownfield-land','https://www.planning.data.gov.uk/dataset/brownfield-site','https://www.planning.data.gov.uk/dataset/local-plan','https://www.planning.data.gov.uk/dataset/local-plan-boundary','https://www.planning.data.gov.uk/dataset/local-planning-authority','https://www.planning.data.gov.uk/dataset/conservation-area','https://www.planning.data.gov.uk/dataset/tree-preservation-order','https://www.planning.data.gov.uk/dataset/tree-preservation-zone','https://www.planning.data.gov.uk/dataset/'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=collector_origin_coverage_and_authority_must_be_preserved | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
