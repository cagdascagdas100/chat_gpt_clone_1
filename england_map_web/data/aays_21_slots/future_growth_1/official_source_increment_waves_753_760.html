<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 753-760</title></head><body><h1>Waves 753–760 · 2026 new local-plan system</h1><p>27 Temmuz 2026 resmî GOV.UK kontrolü. Draft guidance veya sistem-geçiş bilgisi exact parsel/site sonucu değildir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=753,firstRow=1613902,rowsPerWave=2340,confidence=99.9;const themes=['New local-plan system in-force status','Rollout and transition to new plan-making system','Gateway 1 and 30-month preparation start','Gateway 2 assessment and assessor report','Gateway 3 submission readiness','Public engagement requirements','Public availability of local-plan documents','New-style examination and legacy/new dual-running guard'];const sources=['https://www.gov.uk/government/collections/create-or-update-a-local-plan-using-the-new-system','https://www.gov.uk/guidance/gateway-1-for-local-plans-what-you-need-to-do','https://www.gov.uk/guidance/gateway-2-assessment-for-local-plans-what-you-need-to-do','https://www.gov.uk/guidance/gateway-3-for-local-plans-what-you-need-to-do','https://www.gov.uk/guidance/engaging-the-public-when-preparing-a-local-plan','https://www.gov.uk/guidance/making-your-local-plan-documents-publicly-available','https://www.gov.uk/guidance/local-plans-the-examination-process-new-style-local-plan-2026-regulations','https://www.gov.uk/government/collections/local-plans-preparing-and-examining-a-new-style-local-plan-2026-regulations','https://www.gov.uk/government/publications/rollout-of-the-new-local-plan-making-system/rollout-of-the-new-local-plan-making-system','https://www.gov.uk/guidance/plan-making-and-local-government-reorganisation'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=draft_or_system_status_not_exact_site_fact | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
