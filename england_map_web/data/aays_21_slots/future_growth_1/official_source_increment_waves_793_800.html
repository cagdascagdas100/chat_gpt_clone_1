<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 793-800</title></head><body><h1>Waves 793–800 · Heritage/tree/local-plan geometry semantics</h1><p>Planning Data geometry semantics doğrulandı. Nokta, outline, document ve experimental/partial coverage verileri hukuki curtilage veya exact parcel boundary olarak promotion almaz.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=793,firstRow=1707502,rowsPerWave=2340,confidence=99.85;const themes=['Listed-building point is not legal extent','Listed-building outline is indicative and incomplete','Conservation-area document provenance','Conservation-area specification and publishing semantics','Tree-preservation-order specification and geometry split','Local-plan four-dataset specification semantics','National local-plan structured dataset relationships','Title-boundary indicative-extent and stale-collector guard'];const sources=['https://www.planning.data.gov.uk/dataset/listed-building','https://www.planning.data.gov.uk/dataset/listed-building-outline','https://www.planning.data.gov.uk/dataset/conservation-area-document','https://www.planning.data.gov.uk/guidance/specifications/conservation-area','https://www.planning.data.gov.uk/guidance/specifications/tree-preservation-order','https://www.planning.data.gov.uk/guidance/specifications/local-plan','https://www.planning.data.gov.uk/local-plans/','https://www.planning.data.gov.uk/dataset/title-boundary','https://www.planning.data.gov.uk/guidance/specifications/listed-building'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=indicative_geometry_not_legal_curtilage_or_exact_parcel | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
