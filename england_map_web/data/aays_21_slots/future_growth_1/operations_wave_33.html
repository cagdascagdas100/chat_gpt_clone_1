<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave 33 işlemleri</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}.big{font-size:22px;font-weight:700}.notice{padding:12px;background:#fff3cd;border:1px solid #ffe69c}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1;position:sticky;top:0}.PASS{font-weight:700}</style></head><body><h1>future_growth_1 — işlemler 886–935</h1><div class="notice">Bu dalgadaki satırlar doğrulanmış hazırlık, validator ve resmî kaynak işlemleridir. Önceki üç gerçek runtime işi hâlâ pending olduğu için genel sayaç 932/935’tir.</div><div class="cards"><div class="card"><div>Tamamlanan</div><div class="big" id="done">-</div></div><div class="card"><div>Toplam</div><div class="big" id="total">-</div></div><div class="card"><div>Hazırlık</div><div class="big" id="pct">-</div></div><div class="card"><div>Artış</div><div class="big" id="inc">-</div></div><div class="card"><div>Business</div><div class="big">0%</div></div></div><table><thead><tr><th>#</th><th>Durum</th><th>İşlem</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('source_wave_33_progress_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{done.textContent=d.overall_operations_completed;total.textContent=d.overall_operations_total;pct.textContent=d.overall_operations_percent+'%';inc.textContent='+'+d.increase_percentage_points;rows.innerHTML=d.operations.map(o=>`<tr><td>${o.index}</td><td class="${o.status}">${o.status}</td><td>${o.step}</td><td>${o.detail}</td></tr>`).join('')}).catch(e=>{rows.innerHTML=`<tr><td colspan="4">Veri okunamadı: ${e.message}</td></tr>`})</script></body></html>
