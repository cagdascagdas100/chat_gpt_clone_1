<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 2489-2534</title></head><body><h1>Waves 2489–2534 · Flood / water-resource planning integrity</h1><p>27 Temmuz 2026 resmî internet kanıtı. FRA, SFRA, SuDS, WRMP ve su altyapısı stratejik/site-spesifik ayrımları korunur.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=2489,lastWave=2534,firstRow=5676142,rowsPerWave=2340,confidence=99.99;const themes=['EA FRA applicant guidance 28 May 2026','FRA requirement versus planning outcome','SuDS strategy requirement guard','Dataset suitability appraisal guard','Existing model limitations guard','Site-specific EA advice versus decision','EA standing advice 28 May 2026','Flood Zone 1 future-risk treatment guard','Flood Zone 2 consultation routing guard','Flood Zone 3 consultation routing guard','Sequential-test evidence guard','Exception-test evidence guard','SFRA local-authority strategic scope','SFRA not parcel FRA guard','SFRA mapped-risk freshness guard','Climate-change effects in SFRA guard','Flood Map data not certainty proof','Flood-zone class versus probability guard','Flood-risk activity permit separation','Planning permission versus permit separation','WRMP guideline 16 Jun 2026','WRMP five-year statutory planning guard','WRMP annual-review guard','Regional water-resource plan strategic guard','Supply-demand forecast versus connection capacity','Water company plan versus site connection offer','Population-growth forecast guard','Housing-development forecast guard','Climate uncertainty allowance guard','WRMP best-value options guard','NAV water-resource plan guard','Water-resource NPS designated-policy guard','Water NPS versus DCO decision guard','Water infrastructure strategic need guard','Water quality PPG versus site capacity','Wastewater infrastructure strategic-policy guard','Early water-company engagement guard','Sewer-flooding consultation guard','Strategic water supply not exact-site guarantee','Dataset date/purpose/limitations guard','Current guidance versus old planning PPG guard','Current source versus exact engineering study','Exact site drainage evidence required','No inferred permission/business promotion','No absence proof from generic guidance','Wave2534 flood-water integrity audit'];const sources=['EA_FRA_APPLICANT','EA_FRA_STANDING','EA_FRA_LPA','EA_SFRA','WRMP_GUIDELINE','WRMP_OUTCOME','WATER_PPG','WATER_NPS','EA_ENV_ADVICE'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source_key='+src+' | guard=strategic_guidance_dataset_not_exact_site_permission_capacity | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
