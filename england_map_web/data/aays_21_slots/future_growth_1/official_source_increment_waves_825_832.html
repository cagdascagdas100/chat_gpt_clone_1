<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 825-832</title></head><body><h1>Waves 825–832 · Housing need, supply and requirement</h1><p>27 Temmuz 2026 resmî kaynak denetimi. Housing need, housing requirement, 5-year supply ve HELAA aynı şey değildir; exact site/parsel sonucu için site-specific güncel kanıt gerekir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=825,firstRow=1782382,rowsPerWave=2340,confidence=99.92;const themes=['Local housing need vs housing requirement','Publishing local-plan housing requirement','Five-year housing land supply evidence','Housing Delivery Test status','HELAA suitable-available-achievable distinction','Deliverable vs developable sites','Site assessment does not allocate land','Wave832 housing evidence integrity audit'];const sources=['https://www.gov.uk/guidance/housing-and-economic-development-needs-assessments','https://www.gov.uk/guidance/publishing-your-local-plan-housing-requirement','https://www.gov.uk/guidance/housing-supply-and-delivery','https://www.gov.uk/guidance/local-plans-housing-land-supply-evidence-december-2024-framework','https://www.gov.uk/guidance/housing-and-economic-land-availability-assessment'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=strategic_housing_evidence_not_exact_site_permission_or_delivery | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
