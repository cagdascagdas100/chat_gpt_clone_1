<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 1401-1424</title></head><body><h1>Waves 1401–1424 · Water-discharge, EV and final status-integrity evidence</h1><p>27 Temmuz 2026 resmî internet kanıtı. Environmental permits, EV charging scheme/consultation, Planning Data freshness and current-date planning status are separated from exact site permission and parcel conclusions.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=1401,lastWave=1424,firstRow=3130222,rowsPerWave=2340,confidence=99.97;const themes=['Water-discharge permit guidance 20 Apr 2026','Surface-water versus groundwater permit route','Permit need versus planning permission separation','Standard-rules versus bespoke permit status','Water supply asset discharge guidance 23 Jun 2026','Permit risk assessment versus site planning decision','EV strategic charging scheme 26 Jun 2026 consultation','EV charging consultation versus enacted scheme','EV chargepoint relief guidance 6 Jul 2026','Business-rate relief versus planning permission guard','EV grant changes 1 Apr 2026 status','Grant eligibility versus site planning status','EV permitted-development consultation status','Consultation proposal versus current PDR guard','Tree preservation zone 26 Jul 2026 collector audit','TPO partial-authority coverage guard','Flood-risk-zone stale collector audit','Authoritative but stale dataset guard','Brownfield authoritative 23 Jul 2026 collector audit','Brownfield suitability versus planning permission guard','Current-source versus dataset-freshness crosscheck','Permit/grant/consultation/dataset classes separate','Exact-site evidence required for promotion','Wave1424 current-date cross-source integrity audit'];const sources=['https://www.gov.uk/guidance/discharges-to-surface-water-and-groundwater-environmental-permits','https://www.gov.uk/government/collections/water-discharge-and-groundwater-activity-environmental-permits','https://www.gov.uk/government/consultations/electric-vehicles-strategic-charging-infrastructure-scheme','https://www.gov.uk/government/publications/62026-electric-vehicle-charging-point-relief-local-authority-guidance','https://www.gov.uk/guidance/changes-to-electric-vehicle-chargepoint-grant-schemes-from-1-april-2026','https://www.gov.uk/government/consultations/electric-vehicle-charging-changes-to-permitted-development-rights','https://www.planning.data.gov.uk/dataset/tree-preservation-zone','https://www.planning.data.gov.uk/dataset/flood-risk-zone','https://www.planning.data.gov.uk/dataset/brownfield-land'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source='+src+' | guard=permit_grant_consultation_dataset_freshness_not_exact_site_permission | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
