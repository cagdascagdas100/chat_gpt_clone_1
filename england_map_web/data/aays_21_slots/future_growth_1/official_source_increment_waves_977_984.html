<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 977-984</title></head><body><h1>Waves 977–984 · Planning Data specification ve quality integrity</h1><p>Resmî dataset/specification kayıtlarında quality, origin, collector, zero coverage ve experimental status ayrı kanıt sınıflarıdır.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=977,firstRow=2138062,rowsPerWave=2340,confidence=99.94;const themes=['Conservation-area specification two-dataset publication contract','Conservation-area document collector/currentness gate','Tree-preservation order provider/origin coverage guard','Tree-preservation zone type reference taxonomy only','Listed-building grade authoritative taxonomy only','Brownfield authoritative register vs experimental site geometry','Local-plan dataset MHCLG-created quality/origin gate','Local-plan document zero-row/no-attempt non-evidence guard'];const sources=['https://www.planning.data.gov.uk/guidance/specifications/conservation-area','https://www.planning.data.gov.uk/dataset/conservation-area-document','https://www.planning.data.gov.uk/dataset/tree-preservation-order','https://www.planning.data.gov.uk/dataset/tree-preservation-zone-type','https://www.planning.data.gov.uk/dataset/listed-building-grade','https://www.planning.data.gov.uk/dataset/brownfield-land','https://www.planning.data.gov.uk/dataset/brownfield-site','https://www.planning.data.gov.uk/dataset/local-plan','https://www.planning.data.gov.uk/dataset/local-plan-document'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=taxonomy_quality_zero_coverage_not_exact_site_fact | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
