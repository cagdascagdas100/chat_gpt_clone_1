cted-sites-requests/','https://www.gov.uk/guidance/protected-species-and-development-advice-for-local-planning-authorities','https://www.gov.uk/guidance/developers-get-environmental-advice-on-your-planning-proposals']}];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function getG(w){const idx=w-firstWave;return groups[Math.floor(idx/8)]}function render(w){const idx=w-firstWave,g=getG(w),theme=g.subs[idx%8],s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?g.sources[i%g.sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+theme+' | source='+src+' | guard=strategic_model_map_general_guidance_not_exact_site_permission | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=1024;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);const initial=m?Math.max(firstWave,Math.min(1024,Number(m[1]))):firstWave;render(initial)</script></body></html>
