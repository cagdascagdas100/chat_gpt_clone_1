<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 921-928</title></head><body><h1>Waves 921–928 · Planning Data güncellik ve otorite</h1><p>Planning Data collector/origin/coverage alanları exact hukuki parsel gerçeğinden ayrı tutulur.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=921,firstRow=2007022,rowsPerWave=2340,confidence=99.94;const themes=['Article 4 direction collector and authority status','Article 4 direction area geometry/currentness','Brownfield land authoritative register vs permission status','Experimental brownfield-site boundary non-authoritative guard','Conservation-area incomplete and duplicate coverage guard','Listed-building point does not define legal extent','Listed-building outline incomplete/indicative curtilage guard','Tree-preservation zone small-provider and origin guard'];const sources=['https://www.planning.data.gov.uk/dataset/article-4-direction','https://www.planning.data.gov.uk/dataset/article-4-direction-area','https://www.planning.data.gov.uk/dataset/brownfield-land','https://www.planning.data.gov.uk/dataset/brownfield-site','https://www.planning.data.gov.uk/dataset/conservation-area','https://www.planning.data.gov.uk/dataset/listed-building','https://www.planning.data.gov.uk/dataset/listed-building-outline','https://www.planning.data.gov.uk/dataset/tree-preservation-zone'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]
