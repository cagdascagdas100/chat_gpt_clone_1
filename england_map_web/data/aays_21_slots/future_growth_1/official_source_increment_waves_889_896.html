<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 889-896</title></head><body><h1>Waves 889–896 · July 2026 planning governance and fee-status integrity</h1><p>27 Temmuz 2026 resmî kaynak denetimi. Current fee rules, July 2026 consultation proposals and chief-planning-officer letters are separated; proposed fees are not treated as current payable amounts.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=889,firstRow=1932142,rowsPerWave=2340,confidence=99.93;const themes=['Chief planning officer letters current index','22 July 2026 planning guidance update','Current planning fee rules','16 July 2026 fee consultation proposals','National default fee schedule proposal','Local fee-setting proposal','Proposed surcharge vs enacted charge','Wave896 governance/fee status integrity audit'];const sources=['https://www.gov.uk/guidance/planning-guidance-letters-to-chief-planning-officers','https://www.gov.uk/guidance/fees-for-planning-applications','https://www.gov.uk/government/consultations/fees-for-planning-applications/fees-for-planning-applications','https://www.gov.uk/government/consultations/fees-for-planning-applications/outcome/fees-for-planning-applications-government-response'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=consultation_or_proposal_not_current_payable_fee_or_site_fact | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
