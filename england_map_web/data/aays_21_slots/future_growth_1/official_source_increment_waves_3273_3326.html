tById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx%themes.length]+' | source_key='+src+' | guard=eia_flood_suds_water_not_exact_permission_site | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
