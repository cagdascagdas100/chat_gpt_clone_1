ess','NSIP HRA advice non-statutory status guard','HRA process guidance versus project consent','Environmental agency advice 1 Jul 2026 freshness','Environmental advice versus statutory consultation','Environmental permit versus planning permission','EIA advice versus EIA determination guard','Natural England advice versus LPA decision','EA advice form change not policy outcome','Current/future/applicability cross-check','Exact-site evidence required for promotion','Wave2356 biodiversity/nutrient integrity audit'];const sources=['BNG_LPA','BNG_UNDERSTANDING','BNG_ONSITE','BNG_METRIC','BNG_EXEMPT','BNG_LEGAL_AGREEMENT','BNG_NSIP','BNG_NSIP_BASELINE','NUTRIENT_SCHEME','NUTRIENT_CALCULATORS','HRA_GENERAL','NSIP_HRA','ENV_ADVICE'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source_key='+src+' | guard=current_future_catchment_assessment_not_exact_site_permission | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
