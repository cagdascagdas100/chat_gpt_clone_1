<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planning Data yürütme sözleşmesi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:11px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1;position:sticky;top:0}.PASS{font-weight:700}.notice{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}a{color:#0b57d0}</style></head><body><h1>Planning Data yürütme sözleşmesi</h1><div class="notice">Bu sayfa runner-ready sözleşmedir. 19 resmî API isteği henüz yürütülmedi; sonuç, poligon ilişkisi veya skor değildir.</div><p><a href="index.html">Ana özet</a> · <a href="planning_constraint_screen_matrix_rows_1_19.html">133 ekranı aç</a></p><table><thead><tr><th>Alan</th><th>Değer</th></tr></thead><tbody id="body"></tbody></table><h2>Fail-closed kapılar</h2><table><thead><tr><th>#</th><th>Kapı</th><th>Durum</th></tr></thead><tbody id="gates"></tbody></table><script>fetch('planning_constraint_execution_contract_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const rows=[['Resmî docs',d.official_docs.readbacks],['API alanı',d.official_docs.contract_fields],['İstek',d.executor.request_count],['Ekran',d.executor.dataset_screens],['Dataset',d.executor.datasets.length],['Alan',d.executor.required_fields.length],['Gecikme',d.executor.polite_delay_seconds+' sn'],['Retry',d.executor.retries],['Self-test',d.selftest.result],['Gerçek yürütme',d.execution_truth.requests_executed],['Skor',d.execution_truth.scores_emitted]];body.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');gates.innerHTML=d.fail_closed_gates.map((x,i)=>`<tr><td>${i+1}</td><td>${x}</td><td class="PASS">PASS</td></tr>`).join('')})</script></body></html>
