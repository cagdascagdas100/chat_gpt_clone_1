ent stability','Mine-gas record versus site gas measurement','Surface mining legacy versus development refusal','Coalfield map boundary versus ownership boundary','Risk-zone intersection needs exact site geometry','Site investigation result required for engineering claim','Planning condition may require remediation','Environmental assessment versus ground stability separation','Assessment stage versus legal decision separation','Dataset last-updated versus field-currentness guard','Official risk source versus exact parcel fact','No inferred safe/unsafe score from zone alone','No inferred permission from completed assessment','Exact project screening/scoping decision required','Exact ground investigation required before promotion'];const sources=['PPG_EIA','PPG_SEA_SA','SEA_NEIGHBOURHOOD_2026','GOVUK_ENV_IMPACT_GUIDANCE','MRA_HIGH_RISK_DATA','MRA_LOW_RISK_DATA','MRA_PLANNING_ADVICE','MRA_HIGH_RISK_GUIDANCE'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx%themes.length]+' | source_key='+src+' | guard=eia_sea_coalfield_assessment_not_exact_permission_stability | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
