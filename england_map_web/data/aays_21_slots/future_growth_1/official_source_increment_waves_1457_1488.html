ite evidence required for promotion','Wave1488 biodiversity current-date integrity audit'];const sources=['https://www.gov.uk/guidance/biodiversity-net-gain-exempt-developments','https://www.gov.uk/guidance/calculate-biodiversity-value-with-the-statutory-biodiversity-metric','https://www.gov.uk/guidance/understanding-biodiversity-net-gain','https://www.gov.uk/guidance/biodiversity-net-gain-what-local-planning-authorities-should-do','https://www.gov.uk/guidance/protected-species-and-development-advice-for-local-planning-authorities','https://www.gov.uk/guidance/ancient-woodland-ancient-trees-and-veteran-trees-advice-for-making-planning-decisions','https://www.gov.uk/government/publications/nature-restoration-fund-implementation-plan'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source='+src+' | guard=current_future_effective_standing_advice_strategy_not_exact_site_permission | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
