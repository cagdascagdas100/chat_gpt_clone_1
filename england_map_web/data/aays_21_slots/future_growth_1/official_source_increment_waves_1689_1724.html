<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 1689-1724</title></head><body><h1>Waves 1689–1724 · Transport, flood-risk and climate evidence</h1><p>27 Temmuz 2026 resmî internet kanıtı. Guidance, authority-level policy, dataset, site-specific assessment and exact permission evidence are kept distinct.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=1689,lastWave=1724,firstRow=3804142,rowsPerWave=2340,confidence=99.99;const themes=['Travel Plan threshold evidence','Transport Assessment threshold evidence','Transport Statement threshold evidence','Case-by-case movement significance guard','Local-plan transport policy versus site conclusion','Public-transport accessibility versus permission guard','Flood-risk assessment requirement','Sustainable drainage strategy requirement','EA flood standing advice route','Flood Zone 1 decision guard','Flood Zone 2 decision guard','Flood Zone 3/3b decision guard','Sequential-test evidence','Exception-test evidence','EA consultation threshold','Lead local flood authority consultation','Climate-change allowances in FRA','Peak-river-flow allowance evidence','Peak-rainfall allowance evidence','Sea-level-rise allowance evidence','Strategic FRA versus site FRA','Existing flood-model limitation guard','Flood-zone indicator versus certainty guard','Permit/consent separate from planning guard','CPO process guidance 17 Jun 2026','CPO power versus parcel acquisition outcome','CPO compensation versus planning permission','Chief-planning-officer letters current index','22 Jul 2026 CPO-letter collection freshness','National policy versus local decision guard','Guidance date versus application date guard','Current guidance versus superseded text guard','Exact-site evidence required','No inferred candidate promotion','Evidence confidence not business accuracy','Wave1724 transport/flood integrity audit'];const sources=['https://www.gov.uk/guidance/travel-plans-transport-assessments-and-statements','https://www.gov.uk/guidance/flood-risk-assessments-applying-for-planning-permission','https://www.gov.uk/guidance/national-flood-risk-standing-advice-for-local-planning-authorities','https://www.gov.uk/guidance/preparing-a-flood-risk-assessment-standing-advice','https://www.gov.uk/guidance/flood-risk-assessments-climate-change-allowances','https://www.gov.uk/government/publications/compulsory-purchase-process-guidance','https://www.gov.uk/government/publications/compulsory-purchase-process-guidance/guidance-on-the-compulsory-purchase-process','https://www.gov.uk/guidance/planning-guidance-letters-to-chief-planning-officers','https://www.gov.uk/guidance/national-planning-policy-framework'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source='+src+' | guard=guidance_policy_dataset_not_exact_site_permission | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
