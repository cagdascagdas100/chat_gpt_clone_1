<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave 35 işlemleri</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}.big{font-size:22px;font-weight:700}.notice{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1;position:sticky;top:0}.PASS{font-weight:700}</style></head><body><h1>future_growth_1 — işlemler 1000–1074</h1><div class="notice">Bu satırlar hazırlık, offline fail-closed doğrulama ve resmî internet readback işlemleridir. Shared runner, payload, polygon, skor veya business yürütmesi değildir.</div><div class="cards"><div class="card"><div>Tamamlanan</div><div class="big" id="done">-</div></div><div class="card"><div>Toplam</div><div class="big" id="total">-</div></div><div class="card"><div>Hazırlık</div><div class="big" id="pct">-</div></div><div class="card"><div>Artış</div><div class="big" id="inc">-</div></div><div class="card"><div>Business</div><div class="big">0%</div></div></div><table><thead><tr><th>#</th><th>Durum</th><th>İşlem</th><th>Detay</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('source_wave_35_progress_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{done.textContent=d.overall_operations_completed;total.textContent=d.overall_operations_total;pct.textContent=d.overall_operations_percent+'%';inc.textContent='+'+d.increase_percentage_points;rows.innerHTML=d.operations.map(o=>`<tr><td>${o.index}</td><td class="${o.status}">${o.status}</td><td>${o.step}</td><td>${o.detail}</td></tr>`).join('')})</script></body></html>
