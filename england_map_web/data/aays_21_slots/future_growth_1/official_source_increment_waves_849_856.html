<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 849-856</title></head><body><h1>Waves 849–856 · Natural environment, LNRS and ecological evidence</h1><p>27 Temmuz 2026 resmî kaynak denetimi. LNRS, biodiversity duty ve natural-environment guidance stratejik/planlama kanıtıdır; protected species, habitat veya BNG sonucu exact site survey olmadan promotion almaz.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=849,firstRow=1838542,rowsPerWave=2340,confidence=99.90;const themes=['Agricultural land and soil evidence','Green infrastructure evidence','Biodiversity and geodiversity','LNRS plan-making duty','Ecological survey trigger','BNG early design consideration','Landscape and setting evidence','Wave856 natural-environment integrity audit'];const sources=['https://www.gov.uk/guidance/natural-environment','https://www.gov.uk/guidance/plan-making','https://www.gov.uk/guidance/developers-get-environmental-advice-on-your-planning-proposals','https://www.gov.uk/guidance/national-planning-policy-framework/15-conserving-and-enhancing-the-natural-environment'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=strategic_nature_evidence_not_exact_site_ecology_or_bng_result | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
