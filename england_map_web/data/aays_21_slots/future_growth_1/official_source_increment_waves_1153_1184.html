r(let w=firstWave;w<=1184;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(1184,Number(m[1]))):firstWave)</script></body></html>
