itative source versus national completeness','Current policy versus future-effective rule','Guidance versus legislation hierarchy guard','Dataset geometry versus legal extent guard','Strategic framework versus exact project guard','Exact-site source required for promotion','No inferred business accuracy','Cross-source conflict fail-closed guard','Wave2312 27 Jul 2026 final integrity audit'];const sources=['OFGEM_DEMAND_REFORM','OFGEM_CONNECT_UPDATE','PD_BROWNFIELD_LAND','PD_BROWNFIELD_SITE','PD_GREEN_BELT','PD_FLOOD_ZONE','PD_FLOOD_RISK_LEVEL','PD_LOCAL_PLAN','PD_LOCAL_PLAN_DOCUMENT','PD_DEVELOPMENT_PLAN_DOCUMENT','PD_LISTED_BUILDING','PD_LISTED_BUILDING_OUTLINE','PD_CONSERVATION_AREA','PD_TPO_ZONE','PD_LOCALLY_LISTED','PD_BNG_ASSESSMENT'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const idx=w-firstWave,s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[idx]+' | source_key='+src+' | guard=policy_grid_dataset_currentness_not_exact_permission_site | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=firstWave;w<=lastWave;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(firstWave,Math.min(lastWave,Number(m[1]))):firstWave)</script></body></html>
