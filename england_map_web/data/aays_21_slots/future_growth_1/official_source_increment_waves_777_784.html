nt='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=nsip_bng_future_date_and_project_specific_evidence_required | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
