<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 961-968</title></head><body><h1>Waves 961–968 · Planning governance ve committee reform</h1><p>21/22 Temmuz 2026 CPO kaynakları ve committee-reform outcome; niyet, taslak ve gelecek yürürlük tarihi current enacted rule olarak yükseltilmez.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=961,firstRow=2100622,rowsPerWave=2340,confidence=99.94;const themes=['21 Jul 2026 CPO letter source/date integrity','Planning committees update vs current enacted rule','BNG update in CPO communication vs site applicability','Planning-fee update vs current fee schedule','Committee reform consultation outcome status','Final regulations intended in July not assumed made','31 Oct 2026 intended commencement future-effective guard','Mandatory member-training future implementation guard'];const sources=['https://www.gov.uk/guidance/planning-guidance-letters-to-chief-planning-officers','https://www.gov.uk/government/consultations/planning-committee-reform-draft-regulations-and-guidance','https://www.gov.uk/government/consultations/planning-committee-reform-draft-regulations-and-guidance/outcome/planning-committee-reform-statutory-consultation-on-draft-regulations-and-guidance-government-response'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=intention_draft_future_commencement_not_current_enacted_site_rule | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
