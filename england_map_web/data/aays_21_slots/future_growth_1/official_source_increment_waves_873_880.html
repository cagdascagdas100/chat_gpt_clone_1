<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 873-880</title></head><body><h1>Waves 873–880 · July 2026 local-plan examination evidence</h1><p>27 Temmuz 2026 resmî kaynak denetimi. July 2026 ministerial/PINS examination material informs examination approach; it does not by itself prove a site deliverable, viable or allocated.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=873,firstRow=1894702,rowsPerWave=2340,confidence=99.94;const themes=['New-system local-plan examination process','Legacy/new examination route split','15 July 2026 ministerial examination letter','Pragmatic and proportionate viability review','Deliverability across full plan period','December 2026 legacy submission context','Examiner recommendations vs adopted plan status','Wave880 examination-status integrity audit'];const sources=['https://www.gov.uk/guidance/local-plans-the-examination-process-new-style-local-plan-2026-regulations','https://www.gov.uk/government/publications/local-plan-examinations-letter-to-the-interim-chief-executive-of-the-planning-inspectorate-july-2026','https://www.gov.uk/government/news/ministerial-letter-on-local-plan-examinations-welcomed','https://www.gov.uk/guidance/viability'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=examination_approach_not_exact_site_allocation_or_viability | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
