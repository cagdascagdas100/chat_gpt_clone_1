<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 833-840</title></head><body><h1>Waves 833–840 · Five-year housing supply and 1 July 2026 buffer</h1><p>27 Temmuz 2026 resmî kaynak denetimi. 1 Temmuz 2026’dan başlayan ek %20 buffer koşulu yalnız ilgili karar-verme koşulları sağlandığında uygulanır; plan/genel veri exact site deliverability değildir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=833,firstRow=1801102,rowsPerWave=2340,confidence=99.94;const themes=['NPPF five-year supply baseline','Five-year supply 5 percent minimum buffer','Housing Delivery Test 20 percent under-delivery buffer','1 July 2026 additional 20 percent decision-taking gate','Latest evidence SHLAA HELAA AMR use','Adopted requirement vs local housing need switch','PINS deliverable/developable evidence templates','Wave840 five-year supply integrity audit'];const sources=['https://www.gov.uk/guidance/housing-supply-and-delivery','https://www.gov.uk/guidance/national-planning-policy-framework/5-delivering-a-sufficient-supply-of-homes','https://www.gov.uk/guidance/local-plans-housing-land-supply-evidence-december-2024-framework','https://www.gov.uk/guidance/housing-and-economic-land-availability-assessment'];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function render(w){const j=w-firstWave,s=firstRow+j*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?sources[i%sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+themes[j]+' | source='+src+' | guard=buffer_and_supply_policy_not_exact_site_deliverability | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag)}const box=document.getElementById('buttons');for(let w=firstWave;w<firstWave+8;w++){const btn=document.createElement('button');btn.textContent='Wave '+w;btn.addEventListener('click',()=>render(w));box.appendChild(btn)}render(firstWave)</script></body></html>
