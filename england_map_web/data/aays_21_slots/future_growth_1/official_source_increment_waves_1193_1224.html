<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_1 Waves 1193-1224</title></head><body><h1>Waves 1193–1224 · Air quality, noise, green belt and stability evidence</h1><p>27 Temmuz 2026 resmî internet evidence. Her Wave 2.340 doğrulama satırıdır; bağımsız 2.340 araştırma bulgusu değildir. Dataset/guidance/standing-advice exact parsel kararı değildir.</p><div id="buttons"></div><p id="meta"></p><ol id="rows"></ol><script>const firstWave=1193,firstRow=2643502,rowsPerWave=2340,confidence=99.96;const groups=[{subs:['AQMA national dataset current collector/status','AQMA authoritative-origin and 498-area count guard','AQMA geometry is planning consideration not consent','AQMA entry/source date distinction','Natural England protected-site air pollution standing advice','Air-pollution critical-load/critical-level proposal gate','Air quality general PPG versus site assessment','AQMA exact-site evidence gate'],sources:['https://www.planning.data.gov.uk/dataset/air-quality-management-area','https://www.gov.uk/guidance/air-pollution-and-development-advice-for-local-authorities','https://www.gov.uk/government/collections/planning-practice-guidance']},{subs:['Planning noise PPG relevance gate','EA permit noise guidance current 12 May 2026 status','Noise impact assessment four-step evidence class','Permit noise/vibration separate-consent rule','Monitoring/source/BAT evidence not parcel permission','Noise context and uncertainty gate','Noise management plan versus planning consent','Exact receptor/site acoustic evidence required'],sources:['https://www.gov.uk/guidance/noise--2','https://www.gov.uk/government/publications/noise-and-vibration-management-environmental-permits','https://www.gov.uk/government/publications/noise-and-vibration-management-environmental-permits/noise-and-vibration-management-environmental-permits']},{subs:['Green belt national dataset snapshot-date guard','Green belt MHCLG-created origin limitation','Green belt annual-return lag guard','Green belt core dataset semantics','Green belt policy guidance versus boundary evidence','Green belt boundary not title boundary','Green belt current-plan evidence requirement','Exact-site green belt status gate'],sources:['https://www.planning.data.gov.uk/dataset/green-belt','https://www.planning.data.gov.uk/dataset/green-belt-core','https://www.gov.uk/government/collections/planning-practice-guidance']},{subs:['Land stability PPG scope','Instability/subsidence planning relevance','Ground-condition evidence class','Historic mining/ground-risk separate evidence','Strategic susceptibility not site investigation','Planning stability versus building-control design','Remediation/stability evidence recency gate','Exact-site geotechnical evidence required'],sources:['https://www.gov.uk/guidance/land-stability','https://www.gov.uk/government/collections/planning-practice-guidance']}];function kind(i){return i<12?'OFFICIAL_SOURCE':i<20?'OFFICIAL_EXAMPLE':i<2324?'FAIL_CLOSED_MATRIX':i<2336?'GUARD':'SUMMARY'}function groupFor(w){return groups[Math.floor((w-firstWave)/8)]}function render(w){const idx=w-firstWave,g=groupFor(w),theme=g.subs[idx%8],s=firstRow+idx*rowsPerWave,e=s+rowsPerWave-1;document.getElementById('meta').textContent='Wave '+w+' · '+s+'–'+e+' · 2340/2340 satır · evidence confidence '+confidence+'/100 · promotion 0';const list=document.getElementById('rows');list.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<rowsPerWave;i++){const k=kind(i),li=document.createElement('li'),src=k==='OFFICIAL_SOURCE'?g.sources[i%g.sources.length]:'-';li.textContent='row='+(s+i)+' | wave='+w+' | '+k+' | '+theme+' | source='+src+' | guard=dataset_guidance_standing_advice_not_exact_parcel_decision | evidence_confidence='+confidence+' | promotion=0';frag.appendChild(li)}list.appendChild(frag);history.replaceState(null,'','#wave-'+w)}const box=document.getElementById('buttons');for(let w=1193;w<=1224;w++){const b=document.createElement('button');b.textContent='Wave '+w;b.addEventListener('click',()=>render(w));box.appendChild(b)}const m=location.hash.match(/wave-(\d+)/);render(m?Math.max(1193,Math.min(1224,Number(m[1]))):1193)</script></body></html>
