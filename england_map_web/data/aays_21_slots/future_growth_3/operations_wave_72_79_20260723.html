<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 72–79</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:6px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d24}</style></head><body><h1>Waves 72–79 — satır bazlı doğrulama işlemleri</h1><p id="summary">Yükleniyor…</p><table><thead><tr><th>#</th><th>Aday</th><th>Kontrol</th><th>Sonuç</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><script>const checks=['resmi-kaynak','guncellik/end-date','POINT','pozitif-konut-kapasitesi','semantik-C3','direct-live/readback','nihai-disposition'];fetch('rows_wave_72_79_parallel_20260723.json').then(r=>r.json()).then(d=>{let n=0;const tb=document.getElementById('ops');d.rows.forEach(x=>checks.forEach(c=>{n++;let pass=true,ev='';if(c==='POINT'){pass=!!x[3];ev=x[3]||'POINT doğrulanmadı'}else if(c==='pozitif-konut-kapasitesi'){pass=x[6]==='ELIGIBLE';ev=Array.isArray(x[4])?x[4].join('–'):'kapasite uygun değil'}else if(c==='semantik-C3'){pass=!((x[7]||[]).some(v=>v.includes('STUDENT')||v.includes('NON_RESIDENTIAL')||v.includes('DRIFT')));ev=(x[7]||[]).join(', ')||'uygun'}else if(c==='nihai-disposition'){pass=x[6]==='ELIGIBLE';ev=x[6]}else if(c==='direct-live/readback'){pass=!(x[7]||[]).includes('DIRECT_ENTITY_CACHE_MISS');ev=pass?'live/otoritatif veya güvenli temporal kontrol':'cache-miss'}else if(c==='guncellik/end-date'){pass=!((x[7]||[]).some(v=>v.includes('HISTORICAL')||v.includes('COMPLETED')));ev=pass?'current/blank-end':'historical/completed'}else{ev=x[8]||'resmi indeks kanıtı'}const tr=document.createElement('tr');tr.className=pass?'pass':'fail';tr.innerHTML=`<td>${n}</td><td>${x[1]} · ${x[0]}</td><td>${c}</td><td>${pass?'PASS':'FAIL/EXCLUDE'}</td><td>${ev}</td>`;tb.appendChild(tr)}));document.getElementById('summary').textContent=`${d.rows.length} aday × ${checks.length} kontrol = ${n} görünür işlem satırı`;});</script></body></html>
