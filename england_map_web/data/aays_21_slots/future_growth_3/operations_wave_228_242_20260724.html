<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 228-242</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #334155;padding:5px}th{background:#1e293b;position:sticky;top:0}.PASS{background:#123927}.FAIL{background:#4a1d1d}.SKIPPED,.PRE_GATE{background:#3f2d12}.BLOCKED{background:#3b255f}</style></head><body><h1>future_growth_3 — waves 228–242 işlem günlüğü</h1><p>75 araştırma satırı × 7 audit adımı = 525 görünür işlem satırı.</p><table><thead><tr><th>#</th><th>Kayıt</th><th>Otorite</th><th>İşlem</th><th>Sonuç</th><th>Açıklama</th></tr></thead><tbody id="b"></tbody></table><script>const ops=['OFFICIAL_SOURCE_DISCOVERY','DIRECT_LIVE_ENTITY_READBACK','CURRENT_END_DATE_GATE','POINT_CAPTURE','DWELLING_CAPACITY_CAPTURE','SEMANTIC_CONFLICT_GATE','CANONICAL_ASSIGNMENT_GUARD'];function result(reason,op){if(op==='OFFICIAL_SOURCE_DISCOVERY')return['PASS','resmî Planning Data kaydı/negatif kontrol'];if(op==='CANONICAL_ASSIGNMENT_GUARD')return['BLOCKED','canonical shard export yok; parcel assignment yapılmadı'];if(op==='DIRECT_LIVE_ENTITY_READBACK'){if(reason==='ELIGIBLE'||reason.startsWith('DIRECT_PASS_'))return['PASS','direct-live okundu'];if(reason.startsWith('DIRECT_CACHE_MISS'))return['FAIL','direct cache miss; promotion yok'];return['SKIPPED','pre-gate dışlama'];}if(op==='CURRENT_END_DATE_GATE'){if(reason==='HISTORICAL_END_DATE')return['FAIL','historical end date'];if(reason==='ELIGIBLE'||reason.startsWith('DIRECT_PASS_'))return['PASS','blank/current end date'];return['PRE_GATE','önceki kapıda dışlandı'];}if(op==='POINT_CAPTURE'){if(reason==='MISSING_EXACT_POINT')return['FAIL','exact POINT yok'];if(reason==='ELIGIBLE'||reason.startsWith('DIRECT_PASS_'))return['PASS','exact official POINT'];return['PRE_GATE','önceki kapıda dışlandı'];}if(op==='DWELLING_CAPACITY_CAPTURE'){if(reason==='ELIGIBLE')return['PASS','pozitif structured kapasite'];if(reason.includes('STRUCTURED_MINIMUM')||reason==='NOTES_ONLY_CAPACITY')return['FAIL','structured minimum kapısı geçmedi'];return['SKIPPED','önceki kapıda dışlandı'];}if(op==='SEMANTIC_CONFLICT_GATE'){if(reason==='SEMANTIC_CONFLICT_EXPIRED')return['FAIL','expired/semantic conflict'];if(reason==='ELIGIBLE'||reason.startsWith('DIRECT_PASS_'))return['PASS','semantic conflict yok'];return['SKIPPED','önceki kapıda dışlandı'];}return['SKIPPED',''];}fetch('rows_wave_228_242_parallel_20260724.json').then(r=>r.json()).then(d=>{const b=document.getElementById('b');let n=0;d.rows.forEach(x=>{const [a,ref,e,s,reason]=x;ops.forEach(op=>{const [st,msg]=result(reason,op);const tr=document.createElement('tr');tr.className=st;tr.innerHTML=`<td>${++n}</td><td>${ref}</td><td>${a}</td><td>${op}</td><td>${st}</td><td>${msg}</td>`;b.appendChild(tr)})})});</script></body></html>
