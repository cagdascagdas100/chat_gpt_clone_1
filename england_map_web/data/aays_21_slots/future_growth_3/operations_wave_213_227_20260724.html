<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 213-227</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px;text-align:left}th{background:#1e293b;position:sticky;top:0}.pass{background:#123927}.fail{background:#3f1d1d}.guard{background:#3f2d12}</style></head><body><h1>future_growth_3 · 322 işlem satırı</h1><p>Her araştırma satırı için 7 görünür audit işlemi.</p><table><thead><tr><th>#</th><th>Aday</th><th>Otorite</th><th>İşlem</th><th>Sonuç</th><th>Not</th></tr></thead><tbody id="ops"></tbody></table><script>const ops=['OFFICIAL_SOURCE_DISCOVERY','DIRECT_LIVE_ENTITY_READBACK','CURRENT_END_DATE_GATE','POINT_CAPTURE','DWELLING_CAPACITY_CAPTURE','SEMANTIC_CONFLICT_GATE','CANONICAL_ASSIGNMENT_GUARD'];fetch('rows_wave_213_227_parallel_20260724.json').then(r=>r.json()).then(d=>{let n=0;document.getElementById('ops').innerHTML=d.rows.flatMap(x=>ops.map(op=>{n++;let eligible=x.status==='ELIGIBLE';let result='PASS',note='';if(op==='DIRECT_LIVE_ENTITY_READBACK'&&String(x.reason||'').includes('CACHE_MISS')){result='FAIL';note='cache miss after one safe retry'}else if(op==='CURRENT_END_DATE_GATE'&&String(x.reason||'').includes('HISTORICAL')){result='FAIL';note=x.reason}else if(op==='DWELLING_CAPACITY_CAPTURE'&&String(x.reason||'').includes('NOTES_ONLY')){result='FAIL';note='structured positive minimum not proven'}else if(op==='SEMANTIC_CONFLICT_GATE'&&(String(x.reason||'').includes('SEMANTIC')||String(x.reason||'').includes('LAPSED'))){result='FAIL';note=x.reason}else if(op==='CANONICAL_ASSIGNMENT_GUARD'){result='GUARD';note='POINT is not canonical parcel polygon; no parcel assignment'}else if(!eligible&&op!=='OFFICIAL_SOURCE_DISCOVERY'&&op!=='CANONICAL_ASSIGNMENT_GUARD'&&!note){result='FAIL';note=x.reason||'excluded before final gate'}return `<tr class="${result==='PASS'?'pass':result==='GUARD'?'guard':'fail'}"><td>${n}</td><td>${x.reference}</td><td>${x.authority}</td><td>${op}</td><td>${result}</td><td>${note}</td></tr>`})).join('')});</script></body></html>
