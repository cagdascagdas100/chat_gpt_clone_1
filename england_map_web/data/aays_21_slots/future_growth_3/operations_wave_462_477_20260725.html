<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 462–477</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d1d}</style></head><body><h1>future_growth_3 — 280 kalite işlemi</h1><p>40 resmî satır × 7 kapı: DISCOVER · DIRECT_OPEN · END_DATE_GATE · POINT_AND_CAPACITY_GATE · SEMANTIC_GATE · CONFIDENCE_GATE · PROMOTION. Her elenen satır gerçek ilk başarısız kapısından itibaren FAIL/CLOSED gösterilir.</p><table><thead><tr><th>#</th><th>Aday</th><th>Aşama</th><th>Sonuç</th><th>Neden</th></tr></thead><tbody id="r"></tbody></table><script>fetch('rows_wave_462_477_parallel_20260725.json').then(x=>x.json()).then(d=>{const stages=['DISCOVER','DIRECT_OPEN','END_DATE_GATE','POINT_AND_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE','PROMOTION'];const rank=Object.fromEntries(stages.map((s,i)=>[s,i]));let rows=[];for(const x of d.eligible)rows.push({k:`${x[0]} / ${x[1]}`,fail:null,reason:''});for(const x of d.quality_exclusions){const r=x[3];let fail='SEMANTIC_GATE';if(/historical_end_date|completed|completing|under_construction|permission_lapsed/.test(r))fail='END_DATE_GATE';else if(/capacity_mismatch/.test(r))fail='SEMANTIC_GATE';else if(/masterplan|phase/.test(r))fail='SEMANTIC_GATE';rows.push({k:`${x[0]} / ${x[1]}`,fail,reason:r})}let out=[],n=1;for(const x of rows){for(const s of stages){const p=!x.fail||rank[s]<rank[x.fail];out.push(`<tr class="${p?'pass':'fail'}"><td>${n++}</td><td>${x.k}</td><td>${s}</td><td>${p?'PASS':'FAIL/CLOSED'}</td><td>${!p&&s===x.fail?x.reason:''}</td></tr>`)}}document.getElementById('r').innerHTML=out.join('')})</script></body></html>
