<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 462–477</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d1d}</style></head><body><h1>future_growth_3 — 280 kalite işlemi</h1><p>40 resmî satır × 7 kapı: DISCOVER · DIRECT_OPEN · END_DATE_GATE · POINT_AND_CAPACITY_GATE · SEMANTIC_GATE · CONFIDENCE_GATE · PROMOTION.</p><table><thead><tr><th>#</th><th>Aday</th><th>Aşama</th><th>Sonuç</th></tr></thead><tbody id="r"></tbody></table><script>fetch('rows_wave_462_477_parallel_20260725.json').then(x=>x.json()).then(d=>{let rows=[];for(const x of d.eligible)rows.push({k:`${x[0]} / ${x[1]}`,state:'eligible'});for(const x of d.quality_exclusions)rows.push({k:`${x[0]} / ${x[1]}`,state:'quality_fail'});const stages=['DISCOVER','DIRECT_OPEN','END_DATE_GATE','POINT_AND_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE','PROMOTION'];let out=[],n=1;for(const x of rows){let failed=false;for(const s of stages){let p=!failed;if(x.state==='quality_fail'&&s==='END_DATE_GATE')failed=true;if(x.state==='quality_fail'&&['POINT_AND_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE'].includes(s)&&!failed)failed=true;if(x.state==='quality_fail'&&s==='PROMOTION')failed=true;if(s==='DISCOVER'||s==='DIRECT_OPEN')p=true;else p=x.state==='eligible'&&!failed;if(x.state==='quality_fail'&&s!=='DISCOVER'&&s!=='DIRECT_OPEN')p=false;out.push(`<tr class="${p?'pass':'fail'}"><td>${n++}</td><td>${x.k}</td><td>${s}</td><td>${p?'PASS':'FAIL/CLOSED'}</td></tr>`)}}document.getElementById('r').innerHTML=out.join('')})</script></body></html>
