<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 — QA operations 1388–1408</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.PASS{background:#123927}.FAIL{background:#3f1d1d}.CLOSED{background:#334155}a{color:#93c5fd}</style></head><body><h1>future_growth_3 — 147 kalite işlemi</h1><p>21 aday × 7 strict kapı. İlk başarısız kapıdan sonra sonraki kapılar CLOSED; promotion yalnız 7/7 PASS.</p><table><thead><tr><th>Seq</th><th>Ref</th><th>Gate</th><th>Sonuç</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><script>const gates=['OFFICIAL_DISCOVERY','DIRECT_ENTITY_READBACK','TEMPORAL_CURRENTNESS','STRUCTURED_CAPACITY','SEMANTIC_CONSISTENCY','SOURCE_GEOMETRY_CAPTURE','PROMOTION'];function failGate(x){if(x.direct_readback!=='PASS')return 2;if(x.reason.includes('SOURCE_VERSION'))return 3;if(x.reason.includes('STRUCTURED_CAPACITY'))return 4;if(x.reason.includes('SEMANTIC')||x.reason.includes('PLAUSIBILITY'))return 5;return x.status==='ELIGIBLE'?0:5;}fetch('rows_wave_1388_1408_parallel_20260726.json').then(r=>r.json()).then(d=>{let out=[];for(const x of d.rows){const fg=failGate(x);for(let i=1;i<=7;i++){let s='PASS';if(fg&&i===fg)s='FAIL';else if(fg&&i>fg)s='CLOSED';if(i===7&&x.status!=='ELIGIBLE')s='FAIL';const ev=i===1?'official Planning Data':i===2?x.direct_readback:i===6?(x.point||'no direct point'):i===7?x.reason:(s==='PASS'?'gate evidence OK':x.reason);out.push(`<tr class="${s}"><td>${x.seq}</td><td>${x.reference}</td><td>${i} ${gates[i-1]}</td><td>${s}</td><td>${ev}</td></tr>`);}}document.getElementById('ops').innerHTML=out.join('')})</script></body></html>
