<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 284–291</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:6px}th{background:#1e293b;position:sticky;top:0}.ok{background:#123927}.bad{background:#3f1d1d}.skip{background:#2d3748}</style></head><body><h1>future_growth_3 — 378 kontrol satırı</h1><p>54 aday × 7 aşama: DISCOVER, DIRECT_OPEN, TEMPORAL, CAPACITY, POINT, SEMANTIC, PROMOTION.</p><table><thead><tr><th>#</th><th>Aday #</th><th>Otorite</th><th>Referans</th><th>Aşama</th><th>Durum</th><th>Not</th></tr></thead><tbody id="ops"></tbody></table><script>const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stages=['DISCOVER','DIRECT_OPEN','TEMPORAL','CAPACITY','POINT','SEMANTIC','PROMOTION'];function state(x,s){if(s==='DISCOVER')return'PASS';if(s==='DIRECT_OPEN')return x.direct_live==='PASS'?'PASS':'FAIL';if(s==='TEMPORAL')return (x.reason||'').includes('HISTORICAL_END_DATE')?'FAIL':(x.direct_live!=='PASS'?'SKIP':'PASS');if(s==='CAPACITY')return x.min_dwellings==null?'FAIL':(x.direct_live!=='PASS'?'SKIP':'PASS');if(s==='POINT')return !x.point?'FAIL':(x.direct_live!=='PASS'?'SKIP':'PASS');if(s==='SEMANTIC'){let r=x.reason||'';return /(SEMANTIC|BUILT_OUT|DEALLOCATED|COMPLETED)/.test(r)?'FAIL':(x.direct_live!=='PASS'?'SKIP':'PASS')}return x.eligible?'PASS':'FAIL'}fetch('rows_wave_284_291_parallel_20260724.json').then(r=>r.json()).then(d=>{let n=0,out=[];d.rows.forEach((x,i)=>stages.forEach(s=>{let q=state(x,s);n++;out.push(`<tr class="${q==='PASS'?'ok':q==='FAIL'?'bad':'skip'}"><td>${n}</td><td>${i+1}</td><td>${esc(x.authority)}</td><td>${esc(x.reference)}</td><td>${s}</td><td>${q}</td><td>${esc(x.reason||'—')}</td></tr>`)}));document.getElementById('ops').innerHTML=out.join('')}).catch(e=>document.getElementById('ops').innerHTML=`<tr><td colspan="7">Yükleme hatası: ${esc(e)}</td></tr>`);</script></body></html>
