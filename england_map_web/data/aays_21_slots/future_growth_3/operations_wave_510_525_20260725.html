<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 510–525</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d1d}.na{background:#3f2d12}</style></head><body><h1>future_growth_3 — 140 kalite işlemi</h1><p>20 satır × 7 kapı: DISCOVER · DIRECT_OPEN · TEMPORAL_GATE · STRUCTURED_CAPACITY_GATE · SEMANTIC_GATE · CONFIDENCE_GATE · PROMOTION.</p><table><thead><tr><th>#</th><th>Aday</th><th>Aşama</th><th>Sonuç</th><th>Neden</th></tr></thead><tbody id="r"></tbody></table><script>fetch('rows_wave_510_525_parallel_20260725.json').then(x=>x.json()).then(d=>{const stages=['DISCOVER','DIRECT_OPEN','TEMPORAL_GATE','STRUCTURED_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE','PROMOTION'];let rows=[];for(const x of d.eligible)rows.push({...x,state:'eligible',reason:''});for(const x of d.quality_exclusions)rows.push({...x,state:'excluded'});function failStage(x){let r=x.reason||'';if(r.includes('retry_cache_miss'))return 'DIRECT_OPEN';if(r.includes('historical')||r.includes('permission_lapsed')||r.includes('lapsed_permission')||r.includes('development_started')||r.includes('old_entry'))return 'TEMPORAL_GATE';if(r.includes('capacity')||r.includes('maximum_missing'))return 'STRUCTURED_CAPACITY_GATE';if(r.includes('phase')||r.includes('regeneration')||r.includes('multi_phase'))return 'SEMANTIC_GATE';return 'SEMANTIC_GATE'}let out=[],n=1;for(const x of rows){let fs=x.state==='eligible'?null:failStage(x),closed=false;for(const s of stages){let result='PASS',cls='pass',why='';if(closed){result='CLOSED';cls='na';why=x.reason}else if(fs===s){result='FAIL/CLOSED';cls='fail';why=x.reason;closed=true}out.push(`<tr class="${cls}"><td>${n++}</td><td>${x.authority} / ${x.reference} / ${x.entity}</td><td>${s}</td><td>${result}</td><td>${why}</td></tr>`)}}document.getElementById('r').innerHTML=out.join('')})</script></body></html>
