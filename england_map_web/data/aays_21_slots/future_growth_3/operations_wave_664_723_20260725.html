ssignment'}else if(g==='OFFICIAL_SOURCE_GATE'){note='MHCLG Planning Data authoritative source'}else if(g==='SOURCE_GEOMETRY_GATE'){note='official POINT captured; POINT is not canonical parcel polygon'}const tr=document.createElement('tr');tr.className=st;tr.innerHTML=`<td>${k}</td><td>${x.n}</td><td>${x.r}</td><td><a target="_blank" href="${j.source.entity_base+x.e}">${x.e}</a></td><td>${g}</td><td>${st}</td><td>${note}</td>`;b.appendChild(tr)}}if(k!==420){document.body.insertAdjacentHTML('afterbegin',`<p>ERROR operation count ${k}</p>`)}})</script></body></html>
