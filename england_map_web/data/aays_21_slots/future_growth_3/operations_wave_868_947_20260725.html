<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 — 560 kalite işlemi</title><style>body{font-family:Arial;margin:20px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.PASS{background:#123927}.FAIL{background:#531b1b}.CLOSED{background:#3f2d12}</style></head><body><h1>future_growth_3 — waves 868–947 işlem günlüğü</h1><p>80 satır × 7 kalite kapısı = 560 görünür işlem.</p><table><thead><tr><th>#</th><th>Ref</th><th>Entity</th><th>Kapı</th><th>Sonuç</th></tr></thead><tbody id="ops"></tbody></table><script>const gates=['OFFICIAL_SOURCE_GATE','DIRECT_READBACK_GATE','TEMPORAL_GATE','SOURCE_GEOMETRY_GATE','STRUCTURED_CAPACITY_GATE','SEMANTIC_GATE','PROMOTION_GATE'];function failGate(reason,status){if(reason.startsWith('DIRECT'))return 1;if(reason.startsWith('TEMPORAL')||reason.startsWith('QUALITY_FAIL_OLD'))return 2;if(reason.startsWith('STRUCTURED'))return 4;if(reason.startsWith('SEMANTIC')||reason.startsWith('QUALITY_FAIL_'))return 5;return status==='ELIGIBLE'?99:6}fetch('rows_wave_868_947_parallel_20260725.json').then(r=>r.json()).then(d=>{let n=0,s='';d.rows.forEach(x=>{let f=failGate(x[4],x[3]);gates.forEach((g,i)=>{n++;let st=i<f?'PASS':i===f?'FAIL':'CLOSED';if(f===99)st='PASS';s+=`<tr class="${st}"><td>${n}</td><td>${x[0]}</td><td>${x[1]}</td><td>${g}</td><td>${st}</td></tr>`})});document.getElementById('ops').innerHTML=s})</script></body></html>
