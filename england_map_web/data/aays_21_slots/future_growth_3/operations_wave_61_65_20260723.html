<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 61–65</title><style>body{font-family:Arial;background:#0f172a;color:#e2e8f0;margin:18px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #475569;padding:4px}th{background:#1e293b;position:sticky;top:0}.ok{background:#123927}.bad{background:#4c1d1d}</style></head><body><h1>Waves 61–65 — satır satır işlemler</h1><p>64 aday × 7 doğrulama adımı = 448 görünür işlem satırı.</p><table><thead><tr><th>#</th><th>Reference</th><th>Authority</th><th>İşlem</th><th>Sonuç</th><th>Kanıt</th></tr></thead><tbody id="r"></tbody></table><script>const steps=['OFFICIAL_SOURCE_READBACK','CURRENT_END_DATE_GATE','POINT_CAPTURE','CAPACITY_CAPTURE','SEMANTIC_CONFLICT_GATE','ELIGIBILITY_DECISION','CANONICAL_ASSIGNMENT_GUARD'];fetch('rows_wave_61_65_parallel_20260723.json').then(x=>x.json()).then(j=>{let n=0;document.getElementById('r').innerHTML=j.rows.flatMap(x=>steps.map(s=>{n++;let pass=true,ev='';if(s==='OFFICIAL_SOURCE_READBACK'){pass=!x[7].includes('DIRECT_ENTITY_OPEN_CACHE_MISS');ev=x[8]}else if(s==='CURRENT_END_DATE_GATE'){pass=!x[7].some(v=>v.startsWith('HISTORICAL_END_DATE_'));ev=x[7].filter(v=>v.startsWith('HISTORICAL')).join(',')||'CURRENT/NO_END_DATE'}else if(s==='POINT_CAPTURE'){pass=!!x[3];ev=x[3]??'NO_POINT'}else if(s==='CAPACITY_CAPTURE'){pass=!!x[4];ev=JSON.stringify(x[4])}else if(s==='SEMANTIC_CONFLICT_GATE'){pass=true;ev=x[7].join(',')||'NO_EXCEPTION'}else if(s==='ELIGIBILITY_DECISION'){pass=x[6]==='ELIGIBLE';ev=x[6]}else{pass=false;ev='BLOCKED: canonical shard export absent'}return `<tr class="${pass?'ok':'bad'}"><td>${n}</td><td>${x[0]}</td><td>${x[1]}</td><td>${s}</td><td>${pass?'PASS':'HOLD'}</td><td>${ev}</td></tr>`})).join('')})</script></body></html>
