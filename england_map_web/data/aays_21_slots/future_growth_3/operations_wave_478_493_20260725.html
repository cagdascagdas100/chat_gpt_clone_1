<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 478–493</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d1d}</style></head><body><h1>future_growth_3 — 168 kalite işlemi</h1><p>24 satır × 7 kapı: DISCOVER · DIRECT_OPEN · END_DATE_GATE · POINT_AND_CAPACITY_GATE · SEMANTIC_GATE · CONFIDENCE_GATE · PROMOTION.</p><table><thead><tr><th>#</th><th>Aday</th><th>Aşama</th><th>Sonuç</th></tr></thead><tbody id="r"></tbody></table><script>fetch('rows_wave_478_493_parallel_20260725.json').then(x=>x.json()).then(d=>{let rows=[];for(const x of d.eligible)rows.push({k:`${x[0]} / ${x[1]}`,state:'eligible'});for(const x of d.fail_after_retry)rows.push({k:`${x[0]} / ${x[1]}`,state:'direct_fail'});for(const x of d.quality_exclusions)rows.push({k:`${x[0]} / ${x[1]}`,state:'quality_fail'});const stages=['DISCOVER','DIRECT_OPEN','END_DATE_GATE','POINT_AND_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE','PROMOTION'];let out=[],n=1;for(const x of rows){for(const s of stages){let p=false;if(s==='DISCOVER')p=true;else if(x.state==='eligible')p=true;else if(x.state==='direct_fail')p=false;else if(x.state==='quality_fail'&&s==='DIRECT_OPEN')p=true;out.push(`<tr class="${p?'pass':'fail'}"><td>${n++}</td><td>${x.k}</td><td>${s}</td><td>${p?'PASS':'FAIL/CLOSED'}</td></tr>`)}}document.getElementById('r').innerHTML=out.join('')})</script></body></html>
