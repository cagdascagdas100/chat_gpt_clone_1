s=elig==='ELIGIBLE'?'PASS':'FAIL';ev=reason}if(name==='CANONICAL_ASSIGNMENT_GUARD'){s='HOLD';ev='POINT != canonical parcel polygon; export absent'}const tr=document.createElement('tr');tr.className=s==='PASS'?'pass':s==='HOLD'?'hold':'fail';tr.innerHTML=`<td>${n}</td><td>${i+1}</td><td>${a}</td><td>${ref}</td><td>${name}</td><td>${s}</td><td>${ev}</td>`;b.appendChild(tr)})})}).catch(e=>document.body.insertAdjacentHTML('beforeend',`<p>JSON yükleme hatası: ${e}</p>`));</script></body></html>
