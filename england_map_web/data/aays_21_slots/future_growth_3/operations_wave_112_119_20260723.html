<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 Operations 112–119</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.hold{background:#3f2d12}.fail{background:#3f1d1d}</style></head><body><h1>future_growth_3 — 427 satır bazlı denetim işlemi</h1><p>61 kayıt × 7 denetim. Bunlar audit-operation satırlarıdır; 427 ayrı HTTP isteği değildir.</p><table><thead><tr><th>#</th><th>Aday</th><th>İşlem</th><th>Sonuç</th><th>Kanıt/Not</th></tr></thead><tbody id="ops"></tbody></table><script>const names=['OFFICIAL_SOURCE_DISCOVERY','DIRECT_LIVE_ENTITY_READBACK','CURRENT_END_DATE_GATE','POINT_CAPTURE','DWELLING_CAPACITY_CAPTURE','SEMANTIC_CONFLICT_GATE','CANONICAL_ASSIGNMENT_GUARD'];fetch('rows_wave_112_119_parallel_20260723.json').then(r=>r.json()).then(d=>{const t=document.getElementById('ops');let n=0;d.rows.forEach(x=>names.forEach(op=>{n++;let result='PASS',note='';if(op==='DIRECT_LIVE_ENTITY_READBACK'){result=x.direct_live_state==='PASS'?'PASS':x.direct_live_state==='FAIL'?'FAIL':'SKIP';note=x.direct_live_state}if(op==='CURRENT_END_DATE_GATE'&&x.eligibility!=='ELIGIBLE'){result='CHECK';note=x.exclusion_reason||''}if(op==='POINT_CAPTURE'){result=x.point?'PASS':x.eligibility==='ELIGIBLE'?'FAIL':'SKIP';note=x.point||''}if(op==='DWELLING_CAPACITY_CAPTURE'){result=(x.maximum_net_dwellings||x.minimum_net_dwellings)?'PASS':x.eligibility==='ELIGIBLE'?'FAIL':'SKIP';note=[x.minimum_net_dwellings??'',x.maximum_net_dwellings??''].join('–')}if(op==='SEMANTIC_CONFLICT_GATE'){result=x.eligibility==='ELIGIBLE'?'PASS':'FAIL_CLOSED';note=x.exclusion_reason||''}if(op==='CANONICAL_ASSIGNMENT_GUARD'){result='HOLD';note='POINT != canonical parcel polygon; score=null'}const tr=document.createElement('tr');tr.className=result==='PASS'?'pass':result==='HOLD'?'hold':'fail';[n,x.reference,op,result,note].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});t.appendChild(tr)}))}).catch(e=>document.body.append('Yükleme hatası: '+e));</script></body></html>
