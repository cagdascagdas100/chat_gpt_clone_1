<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 88–95</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.PASS{background:#123927}.FAIL{background:#3f2d12}.SKIP{background:#263244}</style></head><body><h1>future_growth_3 — waves 88–95 işlem günlüğü</h1><p>52 × 7 = 364 satır. Her aday için keşif, canlı readback, otorite, tarih, POINT, kapasite ve final karar ayrı görünür.</p><table><thead><tr><th>#</th><th>Ref</th><th>Otorite</th><th>Kontrol</th><th>Sonuç</th><th>Detay</th></tr></thead><tbody id="ops"></tbody></table><script>const checks=['SEARCH_DISCOVERY','DIRECT_LIVE_READBACK','AUTHORITY_MATCH','END_DATE_GATE','POINT_GATE','POSITIVE_CAPACITY_GATE','FINAL_DECISION'];fetch('rows_wave_88_95_parallel_20260723.json').then(r=>r.json()).then(d=>{const tb=document.getElementById('ops');let n=0;d.rows.forEach(x=>{checks.forEach(c=>{n++;let result='PASS',detail='ok';if(c==='DIRECT_LIVE_READBACK'){result=x[9]==='PASS'?'PASS':(x[9]==='FAIL'?'FAIL':'SKIP');detail=x[9]}else if(c==='END_DATE_GATE'&&x[7].some(f=>f.startsWith('HISTORICAL_END_DATE'))){result='FAIL';detail=x[7].find(f=>f.startsWith('HISTORICAL_END_DATE'))}else if(c==='POINT_GATE'&&!x[3]){result='FAIL';detail='POINT yok'}else if(c==='POSITIVE_CAPACITY_GATE'&&!x[4]){result='FAIL';detail='pozitif kapasite yok'}else if(c==='FINAL_DECISION'){result=x[6]==='ELIGIBLE'?'PASS':'FAIL';detail=x[6]}else if(x[9]==='SKIP_PRE_GATE'&&c==='DIRECT_LIVE_READBACK'){result='SKIP';detail='pre-gate dışlama'}const tr=document.createElement('tr');tr.className=result;tr.innerHTML=`<td>${n}</td><td>${x[0]}</td><td>${x[1]}</td><td>${c}</td><td>${result}</td><td>${detail}</td>`;tb.appendChild(tr)})})})</script></body></html>
