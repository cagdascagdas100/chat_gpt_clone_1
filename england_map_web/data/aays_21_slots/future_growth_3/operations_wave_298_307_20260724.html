TIC_GATE'){if(x.reason.startsWith('SEMANTIC')||x.reason.includes('COMPLETED_DWELLINGS'))return['FAIL',x.reason];return['PASS','no contradictory completion/lapse semantic'];}return x.decision==='eligible'?['ELIGIBLE','confidence '+x.confidence]:['EXCLUDED',x.reason];}fetch('rows_wave_298_307_parallel_20260724.json').then(r=>r.json()).then(d=>{const b=document.getElementById('ops');let n=0;for(const x of d.rows){for(const s of stages){n++;const z=stageResult(x,s);const tr=document.createElement('tr');tr.className=z[0];tr.innerHTML=`<td>${n}</td><td>${x.authority} · ${x.reference}</td><td>${x.entity}</td><td>${s}</td><td>${z[0]}</td><td>${z[1]}</td>`;b.appendChild(tr)}}})</script></body></html>
