<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 438–453</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d1d}</style></head><body><h1>future_growth_3 — 924 kalite işlemi</h1><p>Her araştırma satırı için 7 aşama: DISCOVER · DIRECT_OPEN · END_DATE_GATE · POINT_AND_CAPACITY_GATE · SEMANTIC_GATE · CONFIDENCE_GATE · PROMOTION.</p><table><thead><tr><th>#</th><th>Aday</th><th>Aşama</th><th>Sonuç</th></tr></thead><tbody id="r"></tbody></table><script>fetch('rows_wave_438_453_parallel_20260724.json').then(x=>x.json()).then(d=>{let rows=[],id=0;for(const x of d.eligible)rows.push({k:`${x[0]} / ${x[1]}`,ok:true,direct:'PASS'});for(const e of d.fail_after_retry_entities)rows.push({k:`entity ${e}`,ok:false,direct:'FAIL_AFTER_RETRY'});for(const x of d.quality_exclusions)rows.push({k:`${x[0]} / ${x[1]??x[2]}`,ok:false,direct:'PASS'});for(const c of d.discovery_controls)rows.push({k:c,ok:false,direct:'DISCOVERY_ONLY'});const stages=['DISCOVER','DIRECT_OPEN','END_DATE_GATE','POINT_AND_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE','PROMOTION'];let out=[],n=1;for(const x of rows){for(const s of stages){let p=s==='DISCOVER'||(x.ok&&s!=='DISCOVER');if(s==='DIRECT_OPEN')p=x.direct==='PASS';if(x.direct==='DISCOVERY_ONLY'&&s!=='DISCOVER')p=false;out.push(`<tr class="${p?'pass':'fail'}"><td>${n++}</td><td>${x.k}</td><td>${s}</td><td>${p?'PASS':'FAIL/CLOSED'}</td></tr>`)}}document.getElementById('r').innerHTML=out.join('')})</script></body></html>
