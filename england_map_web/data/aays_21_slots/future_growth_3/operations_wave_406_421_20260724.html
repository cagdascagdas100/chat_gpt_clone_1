<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 406–421</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#0f172a;color:#e2e8f0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border:1px solid #334155;text-align:left}th{position:sticky;top:0;background:#1e293b}.pass{background:#123927}.fail{background:#3f1d24}</style></head><body><h1>future_growth_3 — waves 406–421 işlem satırları</h1><p>146 aday × 7 kalite kapısı = 1.022 görünür işlem satırı.</p><table><thead><tr><th>#</th><th>Aday</th><th>Otorite</th><th>Aşama</th><th>Sonuç</th><th>Açıklama</th></tr></thead><tbody id="ops"></tbody></table><script>const stages=['DISCOVER','DIRECT_OPEN','END_DATE_GATE','POINT_AND_CAPACITY_GATE','SEMANTIC_GATE','CONFIDENCE_GATE','PROMOTION'];fetch('rows_wave_406_421_parallel_20260724.json').then(r=>r.json()).then(d=>{const b=document.getElementById('ops');let n=0;d.rows.forEach(x=>{const [a,ref,e,dec,dir,mn,mx,why,c]=x;stages.forEach(s=>{n++;let ok=true,msg='';if(s==='DISCOVER'){msg='official Planning Data candidate retained for audit'}else if(s==='DIRECT_OPEN'){ok=dir==='PASS';msg=dir}else if(s==='END_DATE_GATE'){ok=dec==='ELIGIBLE'||!why.includes('historical_end');msg=ok?'blank/current or not failure reason':'historical end-date'}else if(s==='POINT_AND_CAPACITY_GATE'){ok=dec==='ELIGIBLE'||(!why.includes('minimum')&&!why.includes('POINT'));msg=dec==='ELIGIBLE'?`min=${mn}; max=${mx}`:why}else if(s==='SEMANTIC_GATE'){ok=dec==='ELIGIBLE'||(!why.includes('semantic')&&!why.includes('phase')&&!why.includes('under_construction')&&!why.includes('completed'));msg=why}else if(s==='CONFIDENCE_GATE'){ok=dec==='ELIGIBLE'&&c>=98;msg=c??'not promoted'}else{ok=dec==='ELIGIBLE';msg=dec}const tr=document.createElement('tr');tr.className=ok?'pass':'fail';tr.innerHTML=`<td>${n}</td><td>${ref}</td><td>${a}</td><td>${s}</td><td>${ok?'PASS':'FAIL'}</td><td>${msg}</td>`;b.appendChild(tr)})})});</script></body></html>
