<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 1048–1167</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:6px}th{position:sticky;top:0;background:#1e293b}.PASS{background:#123927}.FAIL{background:#4a1d1d}.SKIP{background:#3f2d12}.CLOSED{opacity:.65}</style></head><body><h1>future_growth_3 — 840 kalite işlemi</h1><p>120 satır × 7 kapı. Her satır/kapı ayrı görünür.</p><table><thead><tr><th>Op</th><th>Ref</th><th>Entity</th><th>Kapı</th><th>Sonuç</th><th>Neden</th></tr></thead><tbody id="b"></tbody></table><script>Promise.all([fetch('quality_wave_1048_1167_parallel_20260725.json').then(r=>r.json()),fetch('rows_wave_1048_1167_parallel_20260725.json').then(r=>r.json())]).then(async([q,m])=>{let all=[];for(const p of m.parts){const d=await fetch(p).then(r=>r.json());all=all.concat(d.rows)}let n=0,b=document.getElementById('b');function g(x){let s=x[3],r=x[4];if(s==='ELIGIBLE')return q.rules.eligible;if(r.includes('AFTER_ONE_SAFE_RETRY'))return q.rules.direct_retry_fail;if(r.includes('INITIAL_CACHE_MISS'))return q.rules.direct_initial_fail;if(r.includes('STRUCTURED'))return q.rules.structured_fail;if(r.includes('SEMANTIC'))return q.rules.semantic_fail;if(r.includes('TEMPORAL')||r.includes('SOURCE_SNAPSHOT'))return q.rules.temporal_fail;return q.rules.discovery_negative}all.forEach(x=>g(x).forEach((s,i)=>{n++;let tr=document.createElement('tr');tr.className=s;tr.innerHTML=`<td>${n}</td><td>${x[0]}</td><td>${x[1]}</td><td>${q.gate_names[i]}</td><td>${s}</td><td>${x[4]}</td>`;b.appendChild(tr)}))})</script></body></html>
