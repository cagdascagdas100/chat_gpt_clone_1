<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 — 224 kalite işlemi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#0f172a;color:#e2e8f0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #334155;padding:6px;text-align:left}th{background:#1e293b;position:sticky;top:0}.PASS{background:#123927}.FAIL{background:#4a1d1d}.CLOSED{background:#3f2d12}a{color:#93c5fd}</style></head><body><h1>future_growth_3 — waves 542–573 kalite işlemleri</h1><p>32 araştırma satırı × 7 kalite kapısı = 224 görünür işlem satırı. Fail-closed satırlarda ilk başarısız kapıdan sonraki kapılar CLOSED olarak gösterilir.</p><table><thead><tr><th>#</th><th>Ref</th><th>Entity</th><th>Kapı</th><th>Durum</th><th>Kanıt / neden</th></tr></thead><tbody id="ops"></tbody></table><script>const gates=['SOURCE_DISCOVERY','OFFICIAL_ENTITY_READBACK','STRUCTURED_CAPACITY','TEMPORAL_VALIDITY','SEMANTIC_CONSISTENCY','SOURCE_GEOMETRY','PROMOTION_DECISION'];function states(x){if(x.eligible)return gates.map(()=>['PASS','strict gate passed']);if(x.reason==='DIRECT_CACHE_MISS_AFTER_ONE_RETRY')return [['PASS','official discovery'],['FAIL','direct entity unavailable after one safe retry'],...Array(5).fill(['CLOSED','fail-closed'])];if(['HISTORICAL_END_DATE','COMPLETED_OUT_OF_DATE'].includes(x.reason))return [['PASS','official discovery'],['PASS','direct entity readback'],['PASS','structured capacity'],['FAIL',x.reason],...Array(3).fill(['CLOSED','fail-closed'])];if(['MASTERPLAN_PHASE_UNCERTAINTY','STALE_PERMISSION_NO_CURRENT_PROGRESS'].includes(x.reason))return [['PASS','official discovery'],['PASS','direct entity readback'],['PASS','structured capacity'],['PASS','temporal fields read'],['FAIL',x.reason],['CLOSED','semantic fail-closed'],['CLOSED','not promoted']];return gates.map((g,i)=>i===6?['FAIL',x.reason]:['PASS','checked']);}fetch('rows_wave_542_573_parallel_20260725.json').then(r=>r.json()).then(d=>{let n=0;document.getElementById('ops').innerHTML=d.rows.flatMap(x=>states(x).map((s,i)=>{n++;return `<tr class="${s[0]}"><td>${n}</td><td>${x.ref}</td><td>${x.entity}</td><td>${gates[i]}</td><td>${s[0]}</td><td>${s[1]}</td></tr>`})).join('')}).catch(e=>document.getElementById('ops').innerHTML='<tr><td colspan="6">JSON okunamadı: '+e+'</td></tr>');</script></body></html>
