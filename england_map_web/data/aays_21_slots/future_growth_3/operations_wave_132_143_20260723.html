<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_3 operations 132-143</title><style>body{font-family:Arial;margin:20px;background:#0f172a;color:#e2e8f0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #334155;padding:5px}th{background:#1e293b;position:sticky;top:0}.pass{background:#123927}.fail{background:#3f1d1d}</style></head><body><h1>Waves 132–143 — işlem satırları</h1><p>Her araştırma satırı için 7 görünür audit adımı = 462 işlem satırı. Bunlar audit işlemleridir; HTTP çağrı sayısı ayrıca 60'tır.</p><table><thead><tr><th>#</th><th>Candidate</th><th>Operation</th><th>Result</th><th>Detail</th></tr></thead><tbody id="b"></tbody></table><script>const ops=['OFFICIAL_SOURCE_DISCOVERY','DIRECT_LIVE_ENTITY_READBACK','CURRENT_END_DATE_GATE','POINT_CAPTURE','DWELLING_CAPACITY_CAPTURE','SEMANTIC_CONFLICT_GATE','CANONICAL_ASSIGNMENT_GUARD'];fetch('rows_wave_132_143_parallel_20260723.json').then(r=>r.json()).then(d=>{let n=0,out=[];d.rows.forEach(x=>ops.forEach(op=>{n++;let res='PASS',detail='verified';if(op==='DIRECT_LIVE_ENTITY_READBACK')res=x.direct==='PASS'?'PASS':(x.direct==='PRE_GATE'?'SKIP':'FAIL');if(op==='CURRENT_END_DATE_GATE'&&x.reason.includes('historical'))res='FAIL';if(op==='DWELLING_CAPACITY_CAPTURE'&&(x.min===null||x.min===0))res='FAIL';if(op==='SEMANTIC_CONFLICT_GATE'&&x.status==='EXCLUDED'&&x.direct==='PASS')res='FAIL';if(op==='CANONICAL_ASSIGNMENT_GUARD'){res='PASS';detail='POINT not promoted to canonical parcel';}out.push(`<tr class="${res==='PASS'?'pass':'fail'}"><td>${n}</td><td>${x.authority} / ${x.reference}</td><td>${op}</td><td>${res}</td><td>${detail}</td></tr>`)}));document.getElementById('b').innerHTML=out.join('')})</script></body></html>
