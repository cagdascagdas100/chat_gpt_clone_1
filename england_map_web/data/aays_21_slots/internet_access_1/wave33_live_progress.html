<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Wave33</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.summary{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}.ok{color:#176b2c;font-weight:700}.block{color:#8a5a00;font-weight:700}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}</style></head><body><h1>internet_access_1 — Wave33 BDUK classification guards</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="summary"></div><h2>İşlem satırları 798–837</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><h2>Sınıflandırma matrisi</h2><table><thead><tr><th>Sınıf</th><th>Anlam</th><th>Currentness</th><th>Ürün aksiyonu</th></tr></thead><tbody id="matrix"></tbody></table><p id="blocker" class="block"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.json()});Promise.all([load('./progress_wave33_latest.json'),load('./operations_wave33_latest.json'),load('./bduk_classification_matrix_wave33_latest.json')]).then(([p,o,m])=>{document.getElementById('warning').textContent='BDUK White/Grey/Black/Under Review ve funding aşamaları current availability için fail-closed ayrıldı. Runtime Ofcom archive hâlâ yok.';const cards=[['Genel program',p.general_program_progress_percent+'%'],['Operasyonel hazırlık',p.operational_progress_percent+'%'],['Artış','+'+p.progress_delta_percent+' puan'],['İşlemler',p.completed_operations+' / '+p.total_operations],['Kaynak / promoted',p.official_source_candidates+' / '+p.promoted_sources],['≥95 güven',p.source_confidence_ge_95_count],['Ort. güven',p.promoted_source_average_confidence_percent+'%'],['QA/context',p.visible_example_rows],['Network/readback',p.visible_network_attempt_rows],['Legacy/proxy',p.legacy_postcode_proxy_rows_all_shards],['Pending/NO_DATA',p.pending_or_no_data_rows_all_shards],['Verified current-r2',p.verified_product_rows+' / '+p.verified_product_target_rows]];document.getElementById('cards').innerHTML=cards.map(x=>'<div class="card">'+e(x[0])+'<br><b>'+e(x[1])+'</b></div>').join('');document.getElementById('ops').innerHTML=(o.operations||[]).map(x=>'<tr><td>'+e(x.operation_no)+'</td><td>'+e(x.name)+'</td><td class="'+(String(x.state).includes('BLOCKER')?'block':'ok')+'">'+e(x.state)+'</td><td>'+e(x.evidence)+'</td></tr>').join('');document.getElementById('matrix').innerHTML=(m.matrix||[]).map(x=>'<tr><td>'+e(x.classification)+'</td><td>'+e(x.meaning)+'</td><td>'+e(x.currentness)+'</td><td>'+e(x.allowed_product_action)+'</td></tr>').join('');document.getElementById('blocker').textContent=(p.blockers||[]).join(' | ');}).catch(err=>document.getElementById('warning').textContent='Veri yüklenemedi: '+err.message);</script></body></html>
