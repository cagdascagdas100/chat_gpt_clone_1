<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Waves113-121</title><style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}code{font-size:11px}</style></head><body>
<h1>internet_access_1 — Waves 113–121</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="cards"></div>
<h2>40 yeni gerçek UPRN QA satırı</h2><table><thead><tr><th>Kaynak</th><th>UPRN</th><th>Postcode</th><th>Current</th><th>Future</th><th>LAD</th><th>GIS</th><th>Voucher</th><th>Rol</th></tr></thead><tbody id="qa"></tbody></table>
<h2>İşlem satırları 8883–10802</h2><table><thead><tr><th>#</th><th>Wave</th><th>Kontrol</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table>
<script>
Promise.all([fetch('./progress_wave121_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research_waves_113_121_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,d])=>{
warning.textContent=`Durum: ${p.authoritative_control_readback.current_task_state}; owner ${p.authoritative_control_readback.ownership_state}. Bu tur ${p.turn_operations_completed}/${p.turn_operations_total}; ${p.qa_example_rows_this_turn} yeni UPRN QA. Exact INSPIRE→UPRN ve 1264 matched_inspire_id completeness fail-closed; ikinci runner yok.`;
let c=[['Genel',p.general_program_progress_percent+'%'],['Genel Δ','+'+p.general_program_progress_delta_points],['Operasyonel',p.operational_progress_percent+'%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted/held',p.official_source_candidates+'/'+p.promoted_sources+'/'+p.held_sources],['Yeni QA',p.qa_example_rows_this_turn]];
cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');
const R=d.qa_examples.rows;qa.innerHTML=R.map(x=>`<tr><td>${x.source_line}</td><td><code>${x.uprn}</code></td><td>${x.postcode}</td><td>${x.current_gigabit}</td><td>${x.future_gigabit}</td><td>${x.lad}</td><td>${x.bduk_gis} ${x.bduk_gis_contract_scope}</td><td>${x.bduk_vouchers_contract_name}</td><td>QA_ONLY_NOT_CANONICAL_PARCEL</td></tr>`).join('');
const pcCount={};R.forEach(x=>pcCount[x.postcode]=(pcCount[x.postcode]||0)+1);
let rows=[],n=8883;
const checks=[
['source_line_exact',x=>`source line=${x.source_line}`],
['uprn_exact',x=>`UPRN=${x.uprn}`],
['struprn_exact',x=>`strUPRN=${x.struprn}`],
['country_exact',x=>`country=${x.country}`],
['postcode_exact',x=>`postcode=${x.postcode}`],
['recognised_exact',x=>`recognised=${x.bduk_recognised_premises}`],
['current_exact',x=>`current=${x.current_gigabit}`],
['future_exact',x=>`future=${x.future_gigabit}`],
['lot_id_exact',x=>`lot_id=${x.lot_id}`],
['lot_name_exact',x=>`lot_name=${x.lot_name}`],
['subsidy_exact',x=>`subsidy=${x.subsidy_control_status}`],
['lad_exact',x=>`LAD=${x.lad}`],
['region_exact',x=>`region=${x.region}`],
['gis_exact',x=>`GIS=${x.bduk_gis}`],
['gis_scope_exact',x=>`GIS scope=${x.bduk_gis_contract_scope}`],
['gis_date_exact',x=>`GIS date=${x.bduk_gis_final_coverage_date}`],
['gis_supplier_exact',x=>`GIS supplier=${x.bduk_gis_supplier}`],
['voucher_exact',x=>`vouchers=${x.bduk_vouchers}`],
['voucher_contract_exact',x=>`voucher contract=${x.bduk_vouchers_contract_name}`],
['voucher_supplier_exact',x=>`voucher supplier=${x.bduk_vouchers_supplier}`],
['unique_uprn',x=>`UPRN occurrences=${R.filter(y=>y.uprn===x.uprn).length}`],
['unique_source_line',x=>`source-line occurrences=${R.filter(y=>y.source_line===x.source_line).length}`],
['postcode_multiplicity_guard',x=>`same-postcode rows=${pcCount[x.postcode]}; postcode never treated as premise ID`],
['semantic_no_inference_guard',x=>`current=${x.current_gigabit}; future=${x.future_gigabit}; recognised=${x.bduk_recognised_premises}; intervention context preserved; QA only; no inference`]
];
R.forEach(x=>checks.forEach(([k,f])=>rows.push([n++,113,`${k}: ${f(x)}`,'complete'])));
for(const w of d.waves.slice(1)){w.facts.forEach(f=>w.validation_stages.forEach(stage=>rows.push([n++,w.wave,`${stage}: ${f}`,'complete'])));}
if(n-1!==10802||rows.length!==1920)throw new Error('operation count mismatch '+rows.length+' end '+(n-1));
ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('');
}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)
</script></body></html>
