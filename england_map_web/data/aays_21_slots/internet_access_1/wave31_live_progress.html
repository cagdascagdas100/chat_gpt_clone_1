d><td class="'+(x.state.includes('BLOCKER')?'block':'ok')+'">'+e(x.state)+'</td><td>'+e(x.evidence)+'</td></tr>').join('')}).catch(err=>document.body.insertAdjacentHTML('beforeend','<p>'+e(err.message)+'</p>'));</script></body></html>
