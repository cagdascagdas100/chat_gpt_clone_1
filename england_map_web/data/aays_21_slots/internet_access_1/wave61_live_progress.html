<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Wave61</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px}</style></head><body><h1>internet_access_1 — Wave61</h1><div class="warn">Resmî web araştırması ve güvenlik QA. ZIP runtime denetimi ve kesin parsel kimlik bağı tamamlanmadan ürün satırı yazılmaz.</div><div id="cards" class="cards"></div><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><script>Promise.all([fetch('./progress_wave61_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./operations_wave61_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,o])=>{let a=[['Genel',p.general_program_progress_percent+'%'],['Operasyonel',p.operational_progress_percent+'%'],['Artış','+'+p.progress_delta_percent+' puan'],['İşlemler',p.completed_operations+'/'+p.total_operations],['Yeni aday',p.wave61_candidate_records],['Yenilenen',p.wave61_sources_refreshed],['Doğruluk',p.wave61_evidence_accuracy_average_percent+'%'],['QA',p.visible_example_rows],['Ürün satırı',p.verified_product_rows+'/'+p.verified_product_target_rows]];cards.innerHTML=a.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');ops.innerHTML=o.operations.map(x=>`<tr><td>${x.operation_no}</td><td>${x.name}</td><td>${x.state}</td><td>${x.evidence}</td></tr>`).join('')})</script></body></html>
