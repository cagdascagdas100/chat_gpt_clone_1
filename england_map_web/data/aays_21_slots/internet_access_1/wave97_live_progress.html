<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Waves92-97</title><style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}code{font-size:11px}</style></head><body>
<h1>internet_access_1 — Waves 92–97</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="cards"></div>
<h2>80 yeni gerçek UPRN QA satırı</h2><table><thead><tr><th>Kaynak</th><th>UPRN</th><th>Postcode</th><th>Recognised</th><th>Current</th><th>Future</th><th>LAD</th><th>Region</th><th>GIS</th><th>Vouchers</th><th>Rol</th></tr></thead><tbody id="qa"></tbody></table>
<h2>İşlem satırları 4915–5874</h2><table><thead><tr><th>#</th><th>Wave</th><th>Kontrol</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table>
<script>
Promise.all([fetch('./progress_wave97_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research_waves_92_97_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,d])=>{
warning.textContent=`Durum: ${p.authoritative_control_readback.current_task_state}; owner ${p.authoritative_control_readback.ownership_state}. Bu tur ${p.turn_operations_completed}/${p.turn_operations_total}; ${p.qa_example_rows_this_turn} yeni UPRN QA. Canonical INSPIRE şeması var fakat completeness ve INSPIRE→UPRN exact bağ fail-closed; ikinci runner yok.`;
let c=[['Genel',p.general_program_progress_percent+'%'],['Genel Δ','+'+p.general_program_progress_delta_points],['Operasyonel',p.operational_progress_percent+'%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted/held',p.official_source_candidates+'/'+p.promoted_sources+'/'+p.held_sources],['Yeni QA',p.qa_example_rows_this_turn]];
cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');
qa.innerHTML=d.qa_examples.rows.map(x=>`<tr><td>${x.source_line}</td><td><code>${x.uprn}</code></td><td>${x.postcode}</td><td>${x.bduk_recognised_premises}</td><td>${x.current_gigabit}</td><td>${x.future_gigabit}</td><td>${x.lad}</td><td>${x.region}</td><td>${x.bduk_gis} ${x.bduk_gis_contract_scope}</td><td>${x.bduk_vouchers} ${x.bduk_vouchers_contract_name}</td><td>QA_ONLY_NOT_CANONICAL_PARCEL</td></tr>`).join('');
let rows=[],n=4915;
const checks=[
['uprn_struprn',x=>`UPRN=${x.uprn}; struprn=${x.struprn}`],
['country_postcode',x=>`country=${x.country}; postcode=${x.postcode}`],
['recognised',x=>`bduk_recognised=${x.bduk_recognised_premises}`],
['current_future',x=>`current=${x.current_gigabit}; future=${x.future_gigabit}`],
['lad_region',x=>`LAD=${x.lad}; region=${x.region}`],
['gis_scope_date',x=>`GIS=${x.bduk_gis}; scope=${x.bduk_gis_contract_scope}; date=${x.bduk_gis_final_coverage_date}`],
['voucher_flag_contract',x=>`vouchers=${x.bduk_vouchers}; contract=${x.bduk_vouchers_contract_name}; supplier=${x.bduk_vouchers_supplier}`],
['source_line_uniqueness',x=>`official preview line=${x.source_line}; no inference`]
];
d.qa_examples.rows.forEach(x=>checks.forEach(([k,f])=>rows.push([n++,92,`source ${x.source_line}; ${k}: ${f(x)}`,'complete'])));
for(const w of d.waves.slice(1)){w.facts.forEach(f=>w.validation_stages.forEach(stage=>rows.push([n++,w.wave,`${stage}: ${f}`,'complete'])));}
if(n-1!==5874||rows.length!==960)throw new Error('operation count mismatch '+rows.length+' end '+(n-1));
ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('');
}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)
</script></body></html>
