<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Waves65-68</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}.src{font-size:12px;background:#fff;padding:9px;margin:8px 0}code{font-size:11px}</style></head><body><h1>internet_access_1 — Waves 65–68</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="cards"></div><h2>Gerçek London/Bromley QA örnekleri</h2><table><thead><tr><th>UPRN</th><th>Postcode</th><th>Current gigabit</th><th>Future gigabit</th><th>LAD</th><th>Rol</th></tr></thead><tbody id="qa"></tbody></table><h2>İşlem satırları 2875–3034</h2><table><thead><tr><th>#</th><th>Wave</th><th>Kontrol</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><script>Promise.all([fetch('./progress_wave68_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research_waves_65_68_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,d])=>{warning.textContent=`Durum: ${p.authoritative_control_readback.current_task_state}; owner ${p.authoritative_control_readback.ownership_state}. Bu tur ${p.turn_operations_completed}/${p.turn_operations_total} kontrol ve ${p.qa_example_rows_this_turn} QA satırı tamamlandı. Ürün promotion, ZIP binary ve exact parcel-UPRN binding geçene kadar kapalı.`;let c=[['Genel',p.general_program_progress_percent+'%'],['Genel Δ','+'+p.general_program_progress_delta_points],['Operasyonel',p.operational_progress_percent+'%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted',p.official_source_candidates+'/'+p.promoted_sources],['London QA',p.london_bromley_uprn_qa_rows_this_turn]];cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');qa.innerHTML=d.qa_examples.london_bromley.map(x=>`<tr><td><code>${x.uprn}</code></td><td>${x.postcode}</td><td>${x.current_gigabit}</td><td>${x.future_gigabit}</td><td>${x.lad}</td><td>QA_ONLY_NOT_CANONICAL_PARCEL</td></tr>`).join('');let rows=[],n=2875;d.waves.forEach(w=>w.checks.forEach(ch=>rows.push([n++,w.wave,ch,'complete'])));if(n-1!==3034)throw new Error('operation count mismatch');ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('')}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)</script></body></html>
