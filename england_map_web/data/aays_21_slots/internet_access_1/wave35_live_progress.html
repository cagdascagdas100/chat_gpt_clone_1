<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA1 Wave35</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7f9;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;font-size:12px}th{background:#eceff1}.ok{color:#176b2c;font-weight:700}.warn{color:#8a5a00;font-weight:700}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;border-radius:6px}</style></head><body><h1>internet_access_1 Wave35</h1><div id="cards" class="cards"></div><p>BDUK sınıflandırma, current/future, In build/RFS ve OMR publication rolleri fail-closed ayrılır.</p><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Promise.all([fetch('./progress_wave35_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./operations_wave35_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,o])=>{document.getElementById('cards').innerHTML=[['Genel',p.general_program_progress_percent+'%'],['Operasyonel',p.operational_progress_percent+'%'],['İşlem',p.completed_operations+' / '+p.total_operations],['Kaynak',p.official_source_candidates+' / '+p.promoted_sources],['≥95',p.source_confidence_ge_95_count],['QA',p.visible_example_rows],['Readback',p.visible_network_attempt_rows],['Current-r2',p.verified_product_rows+' / '+p.verified_product_target_rows]].map(x=>'<div class="card">'+e(x[0])+'<br><b>'+e(x[1])+'</b></div>').join('');document.getElementById('ops').innerHTML=(o.operations||[]).map(x=>'<tr><td>'+e(x.operation_no)+'</td><td>'+e(x.name)+'</td><td class="'+(String(x.state).includes('BLOCKER')?'warn':'ok')+'">'+e(x.state)+'</td><td>'+e(x.evidence)+'</td></tr>').join('')});</script></body></html>
