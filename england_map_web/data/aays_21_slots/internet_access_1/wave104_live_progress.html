<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Waves98-104</title><style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}code{font-size:11px}</style></head><body>
<h1>internet_access_1 — Waves 98–104</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="cards"></div>
<h2>100 yeni gerçek UPRN QA satırı</h2><table><thead><tr><th>Kaynak</th><th>UPRN</th><th>Postcode</th><th>Recognised</th><th>Current</th><th>Future</th><th>LAD</th><th>Region</th><th>Rol</th></tr></thead><tbody id="qa"></tbody></table>
<h2>İşlem satırları 5875–7354</h2><table><thead><tr><th>#</th><th>Wave</th><th>Kontrol</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table>
<script>
Promise.all([fetch('./progress_wave104_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research_waves_98_104_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,d])=>{
warning.textContent=`Durum: ${p.authoritative_control_readback.current_task_state}; owner ${p.authoritative_control_readback.ownership_state}. Bu tur ${p.turn_operations_completed}/${p.turn_operations_total}; ${p.qa_example_rows_this_turn} yeni UPRN QA. matched_inspire_id completeness ve authoritative INSPIRE→UPRN exact bridge fail-closed; ikinci runner yok.`;
let c=[['Genel',p.general_program_progress_percent+'%'],['Genel Δ','+'+p.general_program_progress_delta_points],['Operasyonel',p.operational_progress_percent+'%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted/held',p.official_source_candidates+'/'+p.promoted_sources+'/'+p.held_sources],['Yeni QA',p.qa_example_rows_this_turn]];
cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');
qa.innerHTML=d.qa_examples.rows.map(x=>`<tr><td>${x.source_line}</td><td><code>${x.uprn}</code></td><td>${x.postcode}</td><td>${x.recognised}</td><td>${x.current}</td><td>${x.future}</td><td>${x.lad}</td><td>${x.region}</td><td>QA_ONLY_NOT_CANONICAL_PARCEL</td></tr>`).join('');
let rows=[],n=5875;
const checks=[
['source_line_exact',x=>`official preview line=${x.source_line}`],
['uprn_exact',x=>`UPRN=${x.uprn}`],
['postcode_exact',x=>`postcode=${x.postcode}`],
['recognised_exact',x=>`recognised=${x.recognised}`],
['current_exact',x=>`current=${x.current}`],
['future_exact',x=>`future=${x.future}`],
['lad_exact',x=>`LAD=${x.lad}; region=${x.region}`],
['unique_uprn',x=>`UPRN unique in Wave98=${x.uprn}`],
['unique_source_line',x=>`source line unique=${x.source_line}`],
['qa_role',x=>`role=QA_ONLY_NOT_CANONICAL_PARCEL`]
];
d.qa_examples.rows.forEach(x=>checks.forEach(([k,f])=>rows.push([n++,98,`${k}: ${f(x)}`,'complete'])));
for(const w of d.waves.slice(1)){w.facts.forEach(f=>w.validation_stages.forEach(stage=>rows.push([n++,w.wave,`${stage}: ${f}`,'complete'])));}
if(n-1!==7354||rows.length!==1480)throw new Error('operation count mismatch '+rows.length+' end '+(n-1));
ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('');
}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)
</script></body></html>
