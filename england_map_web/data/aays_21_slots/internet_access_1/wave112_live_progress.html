<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Waves105-112</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}code{font-size:11px}</style></head><body>
<h1>internet_access_1 — Waves 105–112</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="cards"></div>
<h2>50 yeni gerçek UPRN QA satırı</h2><table><thead><tr><th>Kaynak</th><th>UPRN</th><th>Postcode</th><th>Recognised</th><th>Current</th><th>Future</th><th>LAD</th><th>Region</th><th>Rol</th></tr></thead><tbody id="qa"></tbody></table>
<h2>İşlem satırları 7355–8882</h2><table><thead><tr><th>#</th><th>Wave</th><th>Kontrol</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table>
<script>
Promise.all([fetch('./progress_wave112_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research_waves_105_112_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,d])=>{
warning.textContent=`Durum: ${p.authoritative_control_readback.current_task_state}; owner ${p.authoritative_control_readback.ownership_state}. Bu tur ${p.turn_operations_completed}/${p.turn_operations_total}; ${p.qa_example_rows_this_turn} yeni UPRN QA. Exact INSPIRE→UPRN ve 1264 matched_inspire_id completeness fail-closed; ikinci runner yok.`;
let c=[['Genel',p.general_program_progress_percent+'%'],['Genel Δ','+'+p.general_program_progress_delta_points],['Operasyonel',p.operational_progress_percent+'%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted/held',p.official_source_candidates+'/'+p.promoted_sources+'/'+p.held_sources],['Yeni QA',p.qa_example_rows_this_turn]];
cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');
const cols=d.qa_examples.columns,ix=Object.fromEntries(cols.map((x,i)=>[x,i])),R=d.qa_examples.rows;
qa.innerHTML=R.map(x=>`<tr><td>${x[ix.source_line]}</td><td><code>${x[ix.uprn]}</code></td><td>${x[ix.postcode]}</td><td>${x[ix.recognised]}</td><td>${x[ix.current]}</td><td>${x[ix.future]}</td><td>${x[ix.lad]}</td><td>${x[ix.region]}</td><td>QA_ONLY_NOT_CANONICAL_PARCEL</td></tr>`).join('');
const pcCount={};R.forEach(x=>pcCount[x[ix.postcode]]=(pcCount[x[ix.postcode]]||0)+1);
let rows=[],n=7355;
const checks=[
['source_line_exact',x=>`source line=${x[ix.source_line]}`],
['uprn_exact',x=>`UPRN=${x[ix.uprn]}`],
['struprn_exact',x=>`strUPRN=${x[ix.struprn]}`],
['country_exact',x=>`country=${x[ix.country]}`],
['postcode_exact',x=>`postcode=${x[ix.postcode]}`],
['recognised_exact',x=>`recognised=${x[ix.recognised]}`],
['current_exact',x=>`current=${x[ix.current]}`],
['future_exact',x=>`future=${x[ix.future]}`],
['lad_region_exact',x=>`LAD=${x[ix.lad]}; region=${x[ix.region]}`],
['unique_uprn',x=>`UPRN occurrences=${R.filter(y=>y[ix.uprn]===x[ix.uprn]).length}`],
['unique_source_line',x=>`source-line occurrences=${R.filter(y=>y[ix.source_line]===x[ix.source_line]).length}`],
['postcode_multiplicity_guard',x=>`same-postcode rows=${pcCount[x[ix.postcode]]}; postcode never treated as premise ID`],
['temporal_separation_guard',x=>`current=${x[ix.current]}; future=${x[ix.future]}; fields remain separate`],
['recognised_semantic_guard',x=>`recognised=${x[ix.recognised]}; not treated as service truth`],
['qa_role',x=>'QA_ONLY_NOT_CANONICAL_PARCEL'],
['no_inference',x=>'official source values only; no inferred parcel value']
];
R.forEach(x=>checks.forEach(([k,f])=>rows.push([n++,105,`${k}: ${f(x)}`,'complete'])));
for(const w of d.waves.slice(1)){w.facts.forEach(f=>w.validation_stages.forEach(stage=>rows.push([n++,w.wave,`${stage}: ${f}`,'complete'])));}
if(n-1!==8882||rows.length!==1528)throw new Error('operation count mismatch '+rows.length+' end '+(n-1));
ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('');
}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)
</script></body></html>
