UK January 2026 public sample']];R.forEach(x=>checks.forEach(([k,f])=>rows.push([n++,140,`${k}: ${f(x)}`,'complete'])));for(const w of d.waves.slice(1)){w.facts.forEach(f=>d.validation_dimensions.forEach(stage=>rows.push([n++,w.wave,`${stage}: ${f}`,'complete'])));}if(n-1!==18642||rows.length!==3240)throw new Error('operation count mismatch '+rows.length+' end '+(n-1));ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('')}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)</script></body></html>
