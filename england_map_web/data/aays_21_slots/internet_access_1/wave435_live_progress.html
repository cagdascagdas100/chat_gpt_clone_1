st PAGE=250;let pg=0,pages=Math.ceil(rows.length/PAGE);function render(){let a=pg*PAGE,b=Math.min(a+PAGE,rows.length);ops.innerHTML=rows.slice(a,b).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('');page.textContent=`${pg+1}/${pages} — ${rows[a][0]}–${rows[b-1][0]} / ${rows.length}`;prev.disabled=pg===0;next.disabled=pg===pages-1}prev.onclick=()=>{if(pg>0){pg--;render()}};next.onclick=()=>{if(pg<pages-1){pg++;render()}};go.onclick=()=>{let v=+jump.value;if(v>=120583&&v<=126982){pg=Math.floor((v-120583)/PAGE);render();window.scrollTo({top:document.getElementById('ops').parentElement.offsetTop-80,behavior:'smooth'})}};render()}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)</script></body></html>
