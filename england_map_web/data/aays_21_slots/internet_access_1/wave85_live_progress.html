%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted/held',p.official_source_candidates+'/'+p.promoted_sources+'/'+p.held_sources],['Yeni QA',p.qa_example_rows_this_turn]];cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');qa.innerHTML=d.qa_examples.new_rows.map(x=>`<tr><td><code>${x[0]}</code></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]}</td><td>QA_ONLY_NOT_CANONICAL_PARCEL</td></tr>`).join('');let rows=[],n=3715;const w81=d.waves[0];d.qa_examples.new_rows.forEach(x=>rows.push([n++,81,`UPRN ${x[0]} ${x[1]}: current=${x[2]}, future=${x[3]}, recognised=${x[4]}, LAD=${x[5]}`,'complete']));function addWave(w){w.fixed.forEach(x=>rows.push([n++,w.wave,x,'complete']));w.matrix.prefixes.forEach(px=>w.matrix.rules.forEach(r=>rows.push([n++,w.wave,px+': '+r,'complete'])))}addWave(w81);d.waves.slice(1).forEach(addWave);if(n-1!==4214||rows.length!==500)throw new Error('operation count mismatch '+rows.length+' end '+(n-1));ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td></tr>`).join('')}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)</script></body></html>
