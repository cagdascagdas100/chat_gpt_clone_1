<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Wave54</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left}th{background:#eceff1}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:white;border:1px solid #cfd8dc;padding:10px;border-radius:6px}</style></head><body><h1>internet_access_1 — Wave54</h1><div id="cards" class="cards"></div><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><script>Promise.all([fetch('./progress_wave54_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./operations_wave54_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,o])=>{cards.innerHTML=[['Operasyonel',p.operational_progress_percent+'%'],['İşlemler',p.completed_operations+'/'+p.total_operations],['Aday/promoted',p.official_source_candidates+'/'+p.promoted_sources],['≥95',p.source_confidence_ge_95_count],['QA',p.visible_example_rows],['Readback',p.visible_network_attempt_rows],['current-r2',p.verified_product_rows+'/'+p.verified_product_target_rows]].map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');ops.innerHTML=o.operations.map(x=>`<tr><td>${x.operation_no}</td><td>${x.name}</td><td>${x.state}</td><td>${x.evidence}</td></tr>`).join('')})</script></body></html>
