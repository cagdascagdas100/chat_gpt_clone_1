<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>internet_access_1 Waves61-64</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;border-radius:6px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:14px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0;font-size:12px}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}.src{font-size:12px;background:#fff;padding:9px;margin:8px 0}</style></head><body><h1>internet_access_1 — Waves 61–64</h1><div id="warning" class="warn">Yükleniyor…</div><div id="cards" class="cards"></div><div id="sources"></div><h2>İşlem satırları 2555–2874</h2><table><thead><tr><th>#</th><th>Wave</th><th>İşlem</th><th>Durum</th><th>Kanıt kapsamı</th></tr></thead><tbody id="ops"></tbody></table><script>Promise.all([fetch('./progress_wave64_latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research_waves_61_64_latest.json',{cache:'no-store'}).then(r=>r.json())]).then(([p,d])=>{warning.textContent=`Durum: ${p.authoritative_control_readback.current_task_state}; owner ${p.authoritative_control_readback.ownership_state}. Bu tur ${p.turn_operations_completed}/${p.turn_operations_total} kontrol tamamlandı. ZIP binary ve exact canonical-parcel binding fail-closed.`;let c=[['Genel',p.general_program_progress_percent+'%'],['Genel Δ','+'+p.general_program_progress_delta_points],['Operasyonel',p.operational_progress_percent+'%'],['Operasyonel Δ','+'+p.operational_progress_delta_points],['Bu tur',p.turn_operations_completed+'/'+p.turn_operations_total],['Toplam',p.completed_operations+'/'+p.total_operations],['Aday/promoted',p.official_source_candidates+'/'+p.promoted_sources],['Ürün satırı',p.verified_product_rows+'/'+p.verified_product_target_rows]];cards.innerHTML=c.map(x=>`<div class=card>${x[0]}<br><b>${x[1]}</b></div>`).join('');sources.innerHTML=d.waves.map(w=>`<div class=src><b>Wave ${w.wave}</b> — güven %${w.source_confidence_percent}; ${w.source_scope}<br>${w.source_urls.map(u=>`<a href="${u}">${u}</a>`).join('<br>')}</div>`).join('');let rows=[];d.waves.forEach(w=>{let n=w.start_operation;w.fixed.forEach(name=>rows.push([n++,w.wave,name,'complete','official source/control readback']));w.matrix.prefixes.forEach(pre=>w.matrix.rules.forEach(rule=>rows.push([n++,w.wave,pre+' — '+rule,'complete','official source + fail-closed role/identity guard'])));if(n-1!==w.end_operation)throw new Error('operation count mismatch wave '+w.wave)});ops.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class=ok>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}).catch(e=>warning.textContent='Görünüm yüklenemedi: '+e.message)</script></body></html>
