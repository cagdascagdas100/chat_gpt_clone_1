<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Wave87</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8;color:#171717}.summary,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px 12px}input,select{padding:7px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 — Wave87 resmî kanıt satırları</h1><div class="summary"><div class="card">Beklenen: <b>360</b></div><div class="card">Görünen: <b id="visible">—</b></div><div class="card">Kaynak: <b>10</b></div><div class="card">Aktarım doğruluğu: <b>100%</b></div></div><div class="filters"><select id="packet"><option value="">Tüm kaynaklar</option></select><input id="q" placeholder="ID, kategori, varlık veya değer ara"></div><table><thead><tr><th>#</th><th>Kaynak</th><th>ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="10">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const manifest=await fetch('./official_evidence_manifest_wave87_overlay.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest '+r.status);return r.json()});const all=[];for(const p of manifest.packets){const j=await fetch('./'+p[2],{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p[2]+' '+r.status);return r.json()});for(const x of j.rows)all.push({packet:p[1],file:p[2],id:x[0],category:x[1],entity:x[2],year:x[3],metric:x[4],value:x[5],line:x[6],accuracy:j.transcription_accuracy_percent})}const pf=document.getElementById('packet'),q=document.getElementById('q'),tb=document.getElementById('rows');manifest.packets.forEach(p=>pf.add(new Option(p[1],p[2])));function render(){const s=q.value.toLowerCase(),f=all.filter(x=>(!pf.value||x.file===pf.value)&&(!s||JSON.stringify(x).toLowerCase().includes(s)));tb.innerHTML='';f.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.packet,x.id,x.category,x.entity,x.year,x.metric,JSON.stringify(x.value),x.line,x.accuracy+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});document.getElementById('visible').textContent=f.length}pf.onchange=q.oninput=render;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="10">'+String(e)+'</td></tr>');</script></body></html>
