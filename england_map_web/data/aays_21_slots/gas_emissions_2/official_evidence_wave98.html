<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 Wave98</title><style>body{font-family:system-ui;margin:16px;background:#f6f7f8}input,select{padding:7px;margin:4px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:5px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.ok{padding:8px;background:#e9f8ec;border:1px solid #b8dfc1}</style></head><body><h1>Gas Emissions 2 · Wave98</h1><div class="ok">1.938 resmi HTML kanıt satırı · aktarım %100 · URL dedup 8/8 PASS · binary/PDF/XLSX iç değerleri çıkarılmadı · browser gate 66/100 değişmedi.</div><select id="pf"><option value="">Tüm paketler</option></select><input id="q" placeholder="kaynak, yıl, metrik, değer ara"><b id="count"></b><table><thead><tr><th>#</th><th>Paket</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak</th></tr></thead><tbody id="tb"></tbody></table><script>(async()=>{const m=await(await fetch('./official_evidence_manifest_wave98_overlay.json',{cache:'no-store'})).json(),a=[];let n=0;const add=(f,l,c,e,y,k,v,r)=>a.push({f,l,id:'GE2-W98-'+String(++n).padStart(4,'0'),c,e:e||'',y:y||'',k,v,r:r||''});for(const p of m.packets){const [t,l,f]=p,j=await(await fetch('./'+f,{cache:'no-store'})).json();if(j.compact_atomic_schema==='v10_archive'){for(const x of j.lrtap)for(const [k,v] of [['publication_year',x[0]],['title',x[1]],['report_data',x[2]]])add(f,l,'LRTAP_ARCHIVE',x[1],x[0],k,v,j.source_reference);for(const x of j.aq_pivots){for(const [k,v] of [['publication_year',x[0]],['pivot_table_year',x[1]],['title',x[2]],['report_data',x[3]]])add(f,l,'AQ_PIVOT_ARCHIVE',x[2],x[0],k,v,j.source_reference);for(let y=1970;y<=x[1];y++)add(f,l,'AQ_PIVOT_YEAR',x[2],y,'covered_year',y,j.source_reference)}for(const x of j.ghg_pivots){for(const [k,v] of [['publication_year',x[0]],['pivot_table_year',x[1]],['title',x[2]],['report_data',x[3]]])add(f,l,'GHG_PIVOT_ARCHIVE',x[2],x[0],k,v,j.source_reference);if(x[1]!=null)for(let y=1990;y<=x[1];y++)add(f,l,'GHG_PIVOT_YEAR',x[2],y,'covered_year',y,j.source_reference)}for(const name of ['fleet_weighted','primary_no2','nox_speed','fleet_composition','pm_speed','london_fleet'])for(const x of j[name])for(const [k,v] of [['publication_year',x[0]],['title',x[1]],['file',x[2]],['notes',x[3]]])add(f,l,'ROAD_ARCHIVE',x[1],x[0],k,v,j.source_reference);for(const x of j.page_facts)add(f,l,'ARCHIVE_FACT','Data Archive','',x[0],x[1],j.source_reference)}else if(j.compact_atomic_schema==='v11_current_aq_data'){for(const x of j.records){for(const [k,v] of [['publication_year',x[0]],['title',x[1]],['report_data',x[2]],['next_publication',x[3]]])add(f,l,'CURRENT_AQ_DATA',x[1],x[0],k,v,j.source_reference);if(x[4])for(let y=x[4][0];y<=x[4][1];y++)add(f,l,'CURRENT_AQ_YEAR',x[1],y,'covered_year',y,j.source_reference)}for(const x of j.page_facts)add(f,l,'CURRENT_AQ_FACT','Air Pollutant Emissions Data','',x[0],x[1],j.source_reference)}else if(j.compact_atomic_schema==='v12_devolved_aq_reports'){for(const x of j.reports){for(const [k,v] of [['title',x.label],['report_date',x.date],['main_download',x.download],['version_status',x.latest_status]])add(f,l,'REPORT_META',x.label,'',k,v,x.source_reference);for(const v of x.authors)add(f,l,'REPORT_AUTHOR',x.label,'','author',v,x.source_reference);add(f,l,'REPORT_ATTACHMENT',x.label,'','additional_document',x.attachment,x.source_reference);for(let y=x.coverage[0];y<=x.coverage[1];y++)add(f,l,'REPORT_YEAR',x.label,y,'covered_year',y,x.source_reference);for(const v of x.versions){add(f,l,'REPORT_VERSION',x.label,'','linked_version_year',v[0],x.source_reference);add(f,l,'REPORT_VERSION',x.label,'','linked_version_title',v[1],x.source_reference)}}}}if(a.length!==1938)throw Error('Wave98 expansion '+a.length+' != 1938');const pf=document.getElementById('pf'),q=document.getElementById('q'),tb=document.getElementById('tb'),count=document.getElementById('count');m.packets.forEach(p=>pf.add(new Option(p[1],p[2])));function draw(){const s=q.value.toLowerCase(),z=a.filter(x=>(!pf.value||x.f===pf.value)&&(!s||JSON.stringify(x).toLowerCase().includes(s)));tb.innerHTML='';z.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.l,x.c,x.e,x.y,x.k,x.v,x.r].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});count.textContent=' Görünen: '+z.length+' / 1938'}pf.onchange=q.oninput=draw;draw()})().catch(e=>document.getElementById('tb').innerHTML='<tr><td colspan="8">'+String(e)+'</td></tr>');</script></body></html>
