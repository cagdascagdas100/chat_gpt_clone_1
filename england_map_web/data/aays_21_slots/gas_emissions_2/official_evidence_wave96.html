<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 Wave96</title><style>body{font-family:system-ui;margin:18px;background:#f7f7f8;color:#171717}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:white;border:1px solid #ddd;border-radius:7px;padding:8px}input{padding:7px;margin:10px 0;width:min(520px,90%)}table{width:100%;border-collapse:collapse;background:white;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 — Wave96</h1><div class="cards"><div class="card">Satır: <b id="total">-</b></div><div class="card">Görünen: <b id="visible">-</b></div><div class="card">Doğruluk: <b>100%</b></div><div class="card">URL dedup: <b>21/21 PASS</b></div></div><input id="q" placeholder="kaynak, metrik veya değer ara"><table><thead><tr><th>#</th><th>Paket</th><th>Kaynak</th><th>Kategori</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th></tr></thead><tbody id="rows"><tr><td colspan="7">Yükleniyor...</td></tr></tbody></table><script>(async()=>{const files=[['Kirletici profilleri','official_naei_air_pollutant_profiles_wave96_compact_901.json'],['GHGI tarihçesi','official_naei_ghgi_history_wave96_compact_298.json']],all=[];let seq=0;const add=(pkg,src,cat,metric,value,ref)=>all.push({id:++seq,pkg,src,cat,metric,value,ref});for(const [pkg,file] of files){const r=await fetch('./'+file,{cache:'no-store'});if(!r.ok)throw Error(file+' HTTP '+r.status);const j=await r.json();if(j.compact_atomic_schema==='v4'){const [ys,ye]=j.year_range;for(const p of j.profiles){const [label,url,ref,sources,events]=p;add(pkg,label,'META','title',label,ref);add(pkg,label,'META','download_surface','Emission Summary Data',ref);for(let y=ys;y<=ye;y++)add(pkg,label,'YEAR','available_year',y,'L48-L49');for(const s of sources)add(pkg,label,'SOURCE','source_category',s,ref);for(const e of events){for(const [m,v] of [['start_year',e[0]],['end_year',e[1]],['sector',e[2]],['information',e[3]],['impact',e[4]]])add(pkg,label,'EVENT',m,v,ref)}}}else if(j.compact_atomic_schema==='v5_reports'){for(const r of j.reports){const [label,url,metaRef,docsRef,versRef,title,date,main,authors,docs,versions]=r;for(const [m,v] of [['title',title],['report_date',date],['main_download',main],['version_status','not latest']])add(pkg,label,'META',m,v,metaRef);for(const a of authors)add(pkg,label,'AUTHOR','author',a,metaRef);for(const d of docs)add(pkg,label,'ATTACHMENT','additional_document',d,docsRef);for(const [vy,end] of versions){add(pkg,label,'VERSION','linked_version_year',vy,versRef);add(pkg,label,'VERSION','linked_version_title','UK Greenhouse Gas Inventory, 1990 to '+end,versRef)}}}}if(all.length!==1199)throw Error('Expansion '+all.length+' != 1199');const q=document.getElementById('q'),tbody=document.getElementById('rows');function render(){const s=q.value.toLowerCase(),a=all.filter(x=>!s||JSON.stringify(x).toLowerCase().includes(s));tbody.innerHTML='';a.forEach(x=>{const tr=document.createElement('tr');[x.id,x.pkg,x.src,x.cat,x.metric,x.value,x.ref].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tbody.appendChild(tr)});document.getElementById('visible').textContent=a.length}q.oninput=render;document.getElementById('total').textContent=all.length;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="7">'+String(e)+'</td></tr>');</script><p>Wave96: 1.199/1.199 PASS · resmi HTML · binary hücre tahmini yok · browser kabulü 66/100 değişmedi.</p></body></html>
