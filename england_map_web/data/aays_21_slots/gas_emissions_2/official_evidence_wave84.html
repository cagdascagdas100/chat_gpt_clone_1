<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Wave84</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8}table{width:100%;border-collapse:collapse;background:white;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.box{background:white;border:1px solid #ddd;padding:10px;margin-bottom:12px}</style></head><body><h1>Gas Emissions 2 — Wave84</h1><div class="box">304/304 doğrulanmış resmî internet satırı · 11 paket · aktarım doğruluğu %100 · candidate_total 1000 · browser 66/100 · parcel_bound 0 · final_ready=false</div><input id="q" placeholder="Satırlarda ara" style="padding:8px;width:360px;margin-bottom:10px"><table><thead><tr><th>#</th><th>Paket</th><th>Kaynak türü</th><th>Kanıt ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="11">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const m=await fetch('./official_evidence_manifest_wave84_overlay.json',{cache:'no-store'}).then(r=>r.json());const a=[];for(const p of m.packets){const j=await fetch('./'+p[2],{cache:'no-store'}).then(r=>r.json());for(const x of j.rows)a.push({packet:p[1],type:p[0],id:x[0],category:x[1],entity:x[2],year:x[3],metric:x[4],value:x[5],line:x[6],accuracy:j.transcription_accuracy_percent})}const q=document.getElementById('q'),tb=document.getElementById('rows');function render(){const s=q.value.toLowerCase(),f=a.filter(x=>!s||JSON.stringify(x).toLowerCase().includes(s));tb.innerHTML='';f.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.packet,x.type,x.id,x.category,x.entity,x.year,x.metric,JSON.stringify(x.value),x.line,x.accuracy+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)})}q.oninput=render;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="11">'+String(e)+'</td></tr>')</script></body></html>
