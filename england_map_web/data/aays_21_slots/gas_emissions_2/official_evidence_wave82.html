<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Wave82</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8;color:#171717}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:6px;vertical-align:top;text-align:left}th{position:sticky;top:0;background:#eee}.card{display:inline-block;background:#fff;border:1px solid #ddd;border-radius:7px;padding:8px 12px;margin:0 8px 10px 0}input{padding:7px;width:min(520px,95%);margin:8px 0 12px}</style></head><body><h1>Gas Emissions 2 — Wave82 Resmî Kanıt Satırları</h1><div class="card">Satır: <b id="total">—</b></div><div class="card">Görünen: <b id="visible">—</b></div><div class="card">QA: <b>230/230 PASS</b></div><div class="card">Aktarım doğruluğu: <b>100%</b></div><br><input id="q" placeholder="ID, kaynak, kategori, varlık veya metrik ara"><table><thead><tr><th>#</th><th>Paket</th><th>Kanıt ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="10">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const files=['official_uk_ets_aviation_compliance_2026_evidence_60.json','official_uk_ets_hse_status_2026_evidence_40.json','official_ons_measuring_uk_ghg_2026_evidence_50.json','official_uk_ets_country_factor_release_2026_evidence_20.json','official_corsia_compliance_evidence_60.json'];const all=[];for(const f of files){const r=await fetch('./'+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' HTTP '+r.status);const j=await r.json();for(const x of j.rows)all.push({packet:j.document,id:x[0],category:x[1],entity:x[2],year:x[3],metric:x[4],value:x[5],line:x[6],accuracy:j.transcription_accuracy_percent})}const q=document.getElementById('q'),tb=document.getElementById('rows'),vis=document.getElementById('visible');document.getElementById('total').textContent=all.length;function render(){const n=q.value.toLowerCase(),a=all.filter(x=>!n||JSON.stringify(x).toLowerCase().includes(n));tb.innerHTML='';a.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.packet,x.id,x.category,x.entity,x.year,x.metric,JSON.stringify(x.value),x.line,x.accuracy+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});vis.textContent=a.length}q.oninput=render;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="10">'+String(e)+'</td></tr>');</script></body></html>
