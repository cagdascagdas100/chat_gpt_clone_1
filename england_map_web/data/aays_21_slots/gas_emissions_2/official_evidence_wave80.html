<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Wave80</title><style>body{font-family:system-ui;margin:18px;background:#f6f7f8;color:#171717}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ddd;padding:9px;border-radius:7px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}input,select{padding:7px;margin:8px 4px 8px 0}</style></head><body><h1>Gas Emissions 2 — Wave80</h1><div class="cards"><div class="card">Yeni satır: <b>140</b></div><div class="card">Paket: <b>4</b></div><div class="card">QA: <b>140/140 PASS</b></div><div class="card">Aktarım doğruluğu: <b>100%</b></div><div class="card">Birleşik beklenen: <b>5.640</b></div><div class="card">Browser: <b>66/100</b></div></div><select id="p"><option value="">Tüm paketler</option></select><input id="q" placeholder="Satırlarda ara"><table><thead><tr><th>#</th><th>Paket</th><th>ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="b"><tr><td colspan="10">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const m=await fetch('./official_evidence_manifest_wave80_overlay.json',{cache:'no-store'}).then(r=>r.json()),all=[];for(const x of m.packets){document.querySelector('#p').add(new Option(x[1],x[2]));const j=await fetch('./'+x[2],{cache:'no-store'}).then(r=>r.json());for(const r of j.rows)all.push({p:x[2],label:x[1],r,acc:j.transcription_accuracy_percent})}const render=()=>{const pf=document.querySelector('#p').value,q=document.querySelector('#q').value.toLowerCase(),f=all.filter(x=>(!pf||x.p===pf)&&(!q||JSON.stringify(x).toLowerCase().includes(q))),b=document.querySelector('#b');b.innerHTML='';f.forEach((x,i)=>{const r=x.r,tr=document.createElement('tr');[i+1,x.label,r[0],r[1],r[2],r[3],r[4],JSON.stringify(r[5]),r[6],x.acc+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});b.appendChild(tr)})};document.querySelector('#p').onchange=render;document.querySelector('#q').oninput=render;render()})().catch(e=>document.querySelector('#b').innerHTML='<tr><td colspan="10">'+String(e)+'</td></tr>');</script></body></html>
