<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 Wave90</title><style>body{font-family:system-ui;margin:18px;background:#f7f7f8;color:#171717}.note,.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px;margin:6px 0}.summary,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,select{padding:7px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 — Wave90</h1><div class="note">535 yeni resmî NAEI kanıt satırı · 15 yeni URL · 535/535 QA PASS · aktarım doğruluğu %100. Runtime/browser kapısı araştırma tarafından değiştirilmedi.</div><div class="summary"><div class="card">Toplam: <b id="total">-</b></div><div class="card">Görünen: <b id="visible">-</b></div><div class="card">Paket: <b id="packets">15</b></div></div><div class="filters"><select id="pf"><option value="">Tüm paketler</option></select><input id="q" placeholder="ID, kategori, varlık veya metrik ara"></div><table><thead><tr><th>#</th><th>Paket</th><th>ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik / Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="9">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const $=x=>document.getElementById(x);try{const mr=await fetch('./official_evidence_manifest_wave90_overlay.json',{cache:'no-store'});if(!mr.ok)throw new Error('manifest HTTP '+mr.status);const m=await mr.json(),all=[];for(const p of m.packets){const[type,label,file]=p,r=await fetch('./'+file,{cache:'no-store'});if(!r.ok)throw new Error(file+' HTTP '+r.status);const j=await r.json();for(const x of j.rows)all.push({file,label,id:x[0],cat:x[1],entity:x[2],year:x[3]??'',metric:x[4],value:x[5],line:x[6],acc:j.transcription_accuracy_percent})}m.packets.forEach(p=>$('pf').add(new Option(p[1],p[2])));function render(){const s=$('q').value.toLowerCase(),a=all.filter(x=>(!$('pf').value||x.file===$('pf').value)&&(!s||JSON.stringify(x).toLowerCase().includes(s)));$('rows').innerHTML='';a.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.label,x.id,x.cat,x.entity,x.year,JSON.stringify({metric:x.metric,value:x.value}),x.line,x.acc+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)});$('visible').textContent=a.length}$('pf').onchange=$('q').oninput=render;$('total').textContent=all.length;render()}catch(e){$('rows').innerHTML='<tr><td colspan="9">'+String(e)+'</td></tr>'}})();</script></body></html>
