<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Resmî Kanıt Merkezi</title><style>body{font:13px system-ui;margin:18px;background:#f7f7f8;color:#171717}.note,.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px}.note{background:#fff4ce}.cards,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,select{padding:6px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;margin:12px 0}th,td{border:1px solid #ddd;padding:5px;text-align:left;vertical-align:top}th{background:#eee;position:sticky;top:0}</style></head><body><h1>Gas Emissions 2 — Resmî Kanıt ve İşlem Merkezi</h1><div class="note" id="note">Yükleniyor…</div><div class="cards"><div class="card">Kanıt: <b id="total">—</b></div><div class="card">Görünen: <b id="visible">—</b></div><div class="card">Yeni dalga: <b id="latest">—</b></div><div class="card">Doğruluk: <b id="acc">—</b></div><div class="card">İşlem: <b id="opCount">—</b></div><div class="card">Browser: <b id="browser">—</b></div></div><h2>İşlemler — satır satır</h2><table><thead><tr><th>#</th><th>Durum</th><th>İşlem</th><th>Detay</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><h2>Resmî kanıt satırları</h2><div class="filters"><select id="source"><option value="">Tüm kaynaklar</option></select><input id="q" placeholder="ID, varlık, kategori, metrik ara"></div><table><thead><tr><th>#</th><th>Kaynak</th><th>ID</th><th>Belge</th><th>Kategori</th><th>Varlık</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th><th>Parsel</th></tr></thead><tbody id="rows"></tbody></table><div id="footer"></div><script>(async()=>{const $=x=>document.getElementById(x),m=await (await fetch('./official_evidence_manifest_latest.json',{cache:'no-store'})).json();$('note').textContent=m.note;$('latest').textContent='+'+m.latest_wave_rows;$('acc').textContent=m.accuracy_percent+'%';$('browser').textContent=m.browser_accepted+'/'+m.browser_target;const data=await Promise.all(m.sources.map(async s=>[s,await (await fetch('./'+s[2],{cache:'no-store'})).json()]));const logs=await Promise.all(m.op_files.map(async f=>await (await fetch('./'+f,{cache:'no-store'})).json()));const ops=logs.flatMap(x=>x.operations||[]).sort((a,b)=>(a.seq||0)-(b.seq||0));$('opCount').textContent=ops.length;for(const o of ops){let tr=document.createElement('tr');[o.seq,o.state,o.operation,o.detail,JSON.stringify({rows:o.rows_added,checks:o.checks_passed&&[o.checks_passed,o.checks_total]})].forEach(v=>{let td=document.createElement('td');td.textContent=v??'';tr.appendChild(td)});$('ops').appendChild(tr)}let all=[];for(const [s,j] of data){for(const x of j.rows||[]){if(Array.isArray(x)){all.push({s:s[0],l:s[1],id:x[0],doc:j.document||'',cat:'TABLE_ROW',ent:x[1]||'',val:x,line:x[x.length-1]||'',acc:j.transcription_accuracy_percent||100,parcel:'NOT_BOUND'})}else all.push({s:s[0],l:s[1],id:x.evidence_id||'',doc:x.document||j.document||'',cat:x.category||'',ent:x.entity||'',val:x.values??x.metrics??x.metric??'',line:x.source_line_range||'',acc:x.transcription_accuracy_percent??j.transcription_accuracy_percent??'',parcel:x.parcel_binding_status||'NOT_BOUND'})}}const sf=$('source'),q=$('q');[...new Map(m.sources.map(s=>[s[0],s[1]])).entries()].forEach(([v,l])=>sf.add(new Option(l,v)));const render=()=>{let n=q.value.toLowerCase(),f=all.filter(x=>(!sf.value||x.s===sf.value)&&(!n||JSON.stringify(x).toLowerCase().includes(n)));$('rows').innerHTML='';f.forEach((x,i)=>{let tr=document.createElement('tr');[i+1,x.l,x.id,x.doc,x.cat,x.ent,JSON.stringify(x.val),x.line,x.acc+'%',x.parcel].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)});$('visible').textContent=f.length};sf.onchange=q.oninput=render;$('total').textContent=all.length;render();$('footer').textContent=`${m.prepared_rows} hazırlanmış satır · candidate ${m.candidate_rows} · browser ${m.browser_accepted}/${m.browser_target} · parcel ${m.parcel_bound_rows} · core ${m.core_done}/${m.core_total} = ${m.core_percent}% · final_ready=false`;})().catch(e=>{$('note').textContent=String(e)});</script></body></html>
