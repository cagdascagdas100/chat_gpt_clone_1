<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 Wave93</title><style>body{font-family:system-ui;margin:18px;background:#f7f7f8;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px;margin:7px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,select{padding:7px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 · Wave93</h1><div class="card"><b>671/671</b> resmî internet satırı · 6 paket · 9 yeni exact URL · aktarım %100 · binary hücre tahmini yok · browser runtime 66/100 değişmedi.</div><div class="filters"><select id="pf"><option value="">Tüm paketler</option></select><input id="q" placeholder="ID, kategori, varlık, metrik ara"></div><div class="card">Görünen: <b id="visible">-</b> / <b id="total">-</b></div><table><thead><tr><th>#</th><th>Paket</th><th>ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="10">Yükleniyor...</td></tr></tbody></table><script>(async()=>{const $=x=>document.getElementById(x),m=await (await fetch('./official_evidence_manifest_wave93_overlay.json',{cache:'no-store'})).json(),all=[];for(const p of m.packets){const j=await (await fetch('./'+p[2],{cache:'no-store'})).json();$('pf').add(new Option(p[1],p[2]));for(const x of j.rows)all.push({file:p[2],label:p[1],id:x[0],cat:x[1],entity:x[2],year:x[3],metric:x[4],value:x[5],line:x[6],acc:j.transcription_accuracy_percent})}function render(){const s=$('q').value.toLowerCase(),f=$('pf').value,a=all.filter(x=>(!f||x.file===f)&&(!s||JSON.stringify(x).toLowerCase().includes(s)));$('rows').innerHTML='';a.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.label,x.id,x.cat,x.entity,x.year,x.metric,typeof x.value==='object'?JSON.stringify(x.value):x.value,x.line,x.acc+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)});$('visible').textContent=a.length}$('pf').onchange=$('q').oninput=render;$('total').textContent=all.length;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="10">'+String(e)+'</td></tr>');</script></body></html>
