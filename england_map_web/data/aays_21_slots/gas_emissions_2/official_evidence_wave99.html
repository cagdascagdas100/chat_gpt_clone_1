<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 Wave99</title><style>body{font-family:system-ui;margin:18px;background:#f7f7f8}input{padding:7px;width:340px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;margin-top:10px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 — Wave99</h1><p>2.656 resmi NAEI HTML provenance satırı. PDF/DOC/XLSX iç değerleri çıkarılmadı; yalnız resmi landing-page metadata, açık yıl kapsamları, yazarlar, ek belge başlıkları ve sürüm bağlantıları kullanıldı.</p><input id="q" placeholder="satırlarda ara"><b id="n"></b><table><thead><tr><th>#</th><th>Paket</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>(async()=>{const m=await(await fetch('./official_evidence_manifest_wave99_overlay.json',{cache:'no-store'})).json(),a=[];let seq=0;const add=(p,c,e,y,k,v,r)=>a.push({id:'GE2-W99-'+String(++seq).padStart(4,'0'),p,c,e,y:y??'',k,v,r});for(const p of m.packets){const j=await(await fetch('./'+p[2],{cache:'no-store'})).json();for(const x of j.reports){const[label,title,url,ref,date,download,cov,authors,attachments,versions,facts=[]]=x;for(const[k,v]of[['title',title],['report_date',date],['main_download',download],['version_status','not latest'],['coverage_start',cov[0]],['coverage_end',cov[1]]])add(p[1],'META',label,'',k,v,ref);for(let y=cov[0];y<=cov[1];y++)add(p[1],'YEAR',label,y,'covered_year',y,ref);for(const v of authors)add(p[1],'AUTHOR',label,'','author',v,ref);for(const v of attachments)add(p[1],'ATTACHMENT',label,'','additional_document',v,ref);for(const v of versions){add(p[1],'VERSION',label,'','linked_version_year',v[0],ref);add(p[1],'VERSION',label,'','linked_version_title',v[1],ref)}for(const v of facts)add(p[1],'FACT',label,'',v[0],v[1],ref)}}if(a.length!==2656)throw Error('Wave99 expansion '+a.length+' != 2656');const q=document.getElementById('q'),tb=document.getElementById('rows'),n=document.getElementById('n');function render(){const s=q.value.toLowerCase(),z=a.filter(x=>!s||JSON.stringify(x).toLowerCase().includes(s));tb.innerHTML='';z.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.p,x.c,x.e,x.y,x.k,x.v,x.r].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});n.textContent=' '+z.length+' / 2656'}q.oninput=render;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="8">'+String(e)+'</td></tr>');</script></body></html>
