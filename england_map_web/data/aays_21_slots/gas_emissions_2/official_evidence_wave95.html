<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 Wave95</title><style>body{font-family:system-ui;margin:18px;background:#f7f7f8;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px;margin:6px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,select{padding:7px}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 · Wave95</h1><div class="card">989 resmi internet kaniti · 19 yeni exact URL · aktarim %100 · binary hucre degeri tahmini yok · browser runtime 66/100 degismedi.</div><div class="filters"><select id="pf"><option value="">Tum paketler</option></select><input id="q" placeholder="ID, kaynak, metrik veya deger ara"></div><div class="card">Toplam: <b id="total">-</b> · Gorunen: <b id="visible">-</b></div><table><thead><tr><th>#</th><th>Paket</th><th>ID</th><th>Belge</th><th>Kategori</th><th>Varlik</th><th>Yil</th><th>Metrik</th><th>Deger</th><th>Kaynak satiri</th><th>Dogruluk</th><th>Parsel</th></tr></thead><tbody id="rows"><tr><td colspan="12">Yukleniyor...</td></tr></tbody></table><script>(async()=>{const $=x=>document.getElementById(x),all=[];let seq=0;const m=await (await fetch('./official_evidence_manifest_wave95_overlay.json',{cache:'no-store'})).json();function add(file,label,j,cat,entity,year,metric,value,line){seq++;all.push({file,label,id:'GE2-W95-'+String(seq).padStart(4,'0'),doc:j.document||'',cat,entity:entity||'',year:year??'',metric,value,line:line||'',acc:j.transcription_accuracy_percent||'',parcel:'NOT_BOUND'})}for(const p of m.packets){const [,label,file]=p,j=await(await fetch('./'+file,{cache:'no-store'})).json();for(const s of j.meta_sets||[])for(const [k,v] of s.fields||[])add(file,label,j,'COMPACT_HTML_EVIDENCE',s.source_label,'',k,v,s.source_reference);for(const s of j.list_sets||[])for(const v of s.items||[])add(file,label,j,'LIST_PROVENANCE',s.source_label,'',s.metric,v,s.source_reference);for(const s of j.range_sets||[])for(let y=s.start;y<=s.end;y++)add(file,label,j,'YEAR_PROVENANCE',s.source_label,y,s.metric,y,s.source_reference);for(const s of j.event_sets||[])for(const e of s.events||[]){const [a,b,sector,info,impact]=e;for(const [k,v] of [['start_year',a],['end_year',b],['sector',sector],['information',info],['impact',impact]])add(file,label,j,'EVENT_PROVENANCE',s.source_label,'',k,v,s.source_reference)}for(const s of j.version_sets||[])for(const e of s.entries||[]){const [fmt,size,reason,date,time]=e;for(const [k,v] of [['file_format',fmt],['file_size',size],['update_reason',reason],['superseded_date',date],['superseded_time',time]])add(file,label,j,'VERSION_PROVENANCE',s.source_label,'',k,v,s.source_reference)}for(const s of j.pair_sets||[])for(const e of s.entries||[]){add(file,label,j,'PAIR_PROVENANCE',s.source_label,'',s.metric_a,e[0],s.source_reference);add(file,label,j,'PAIR_PROVENANCE',s.source_label,'',s.metric_b,e[1],s.source_reference)}}if(all.length!==989)throw new Error('Wave95 expansion count '+all.length+' != 989');const pf=$('pf'),q=$('q');m.packets.forEach(p=>pf.add(new Option(p[1],p[2])));function render(){const s=q.value.toLowerCase(),a=all.filter(x=>(!pf.value||x.file===pf.value)&&(!s||JSON.stringify(x).toLowerCase().includes(s)));$('rows').innerHTML='';a.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.label,x.id,x.doc,x.cat,x.entity,x.year,x.metric,JSON.stringify(x.value),x.line,x.acc+'%',x.parcel].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)});$('visible').textContent=a.length}$('total').textContent=all.length;pf.onchange=q.oninput=render;render()})().catch(e=>$('rows').innerHTML='<tr><td colspan="12">'+String(e)+'</td></tr>');</script></body></html>
