<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Wave83</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8;color:#171717}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}.card{display:inline-block;background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px 12px;margin:0 8px 12px 0}input,select{padding:7px;margin:0 6px 10px 0}</style></head><body><h1>Gas Emissions 2 — Wave83 Satır Görünümü</h1><div class="card">Wave83: <b>290/290 PASS</b></div><div class="card">Doğruluk: <b>100%</b></div><div class="card">Kaynak: <b>7 resmî URL</b></div><div><select id="packet"><option value="">Tüm paketler</option></select><input id="q" placeholder="Satırlarda ara"></div><table><thead><tr><th>#</th><th>Paket</th><th>Tür</th><th>ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="11">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const m=await (await fetch('./official_evidence_manifest_wave83_overlay.json',{cache:'no-store'})).json(),p=document.getElementById('packet'),q=document.getElementById('q'),tb=document.getElementById('rows'),all=[];for(const x of m.packets){p.add(new Option(x[1],x[2]));const j=await (await fetch('./'+x[2],{cache:'no-store'})).json();for(const r of j.rows)all.push({file:x[2],label:x[1],type:x[0],id:r[0],cat:r[1],entity:r[2],year:r[3],metric:r[4],value:r[5],line:r[6],acc:j.transcription_accuracy_percent})}const render=()=>{const s=q.value.toLowerCase(),f=all.filter(x=>(!p.value||x.file===p.value)&&(!s||JSON.stringify(x).toLowerCase().includes(s)));tb.innerHTML='';f.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.label,x.type,x.id,x.cat,x.entity,x.year,x.metric,JSON.stringify(x.value),x.line,x.acc+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)})};p.onchange=q.oninput=render;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="11">'+String(e)+'</td></tr>');</script></body></html>
