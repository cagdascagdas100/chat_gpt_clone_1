<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 2 — Wave86</title><style>body{font-family:system-ui;margin:20px;background:#f7f7f8;color:#171717}.summary,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{background:white;border:1px solid #ddd;border-radius:7px;padding:9px 12px}input,select{padding:7px}table{width:100%;border-collapse:collapse;background:white;font-size:12px}th,td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#eee}</style></head><body><h1>Gas Emissions 2 — Wave86</h1><div class="summary"><div class="card">Satır: <b id="total">—</b></div><div class="card">Görünen: <b id="visible">—</b></div><div class="card">Paket: <b>6</b></div><div class="card">QA: <b>340/340 PASS</b></div><div class="card">Aktarım doğruluğu: <b>100%</b></div></div><div class="filters"><select id="packet"><option value="">Tüm paketler</option></select><input id="q" placeholder="ID, kategori, varlık, metrik ara"></div><table><thead><tr><th>#</th><th>Paket</th><th>ID</th><th>Kategori</th><th>Varlık</th><th>Yıl</th><th>Metrik</th><th>Değer</th><th>Kaynak satırı</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td colspan="10">Yükleniyor…</td></tr></tbody></table><script>(async()=>{const m=await fetch('./official_evidence_manifest_wave86_overlay.json',{cache:'no-store'}).then(r=>r.json()),all=[],$=x=>document.getElementById(x);for(const p of m.packets){const j=await fetch('./'+p[2],{cache:'no-store'}).then(r=>r.json());$('packet').add(new Option(p[1],p[2]));for(const x of j.rows)all.push({packet:p[2],label:p[1],id:x[0],category:x[1],entity:x[2],year:x[3],metric:x[4],value:x[5],line:x[6],accuracy:j.transcription_accuracy_percent})}const render=()=>{const q=$('q').value.toLowerCase(),p=$('packet').value,f=all.filter(x=>(!p||x.packet===p)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('rows').innerHTML='';f.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.label,x.id,x.category,x.entity,x.year,x.metric,JSON.stringify(x.value),x.line,x.accuracy+'%'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)});$('visible').textContent=f.length};$('packet').onchange=$('q').oninput=render;$('total').textContent=all.length;render()})().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="10">'+String(e)+'</td></tr>');</script></body></html>
