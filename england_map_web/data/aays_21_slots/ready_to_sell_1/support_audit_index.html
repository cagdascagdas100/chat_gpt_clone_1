<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ready_to_sell_1 — Birleşik Destek Denetimi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f8fafc;color:#0f172a}.muted{color:#475569}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px;margin:14px 0}.card,section{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:11px}.value{font-size:23px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left;vertical-align:top}th{background:#e2e8f0}.ok{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fef2f2}a{color:#0369a1;word-break:break-all}.pill{display:inline-block;border:1px solid #94a3b8;border-radius:999px;padding:2px 6px;margin:2px;font-size:10px}</style></head><body><h1>ready_to_sell_1 — Birleşik Satır Satır İnternet Denetimi</h1><div class="muted">10 mevcut aday · 30 hedef internet kontrolü · ana V53 görevi ve ilk doğrulanmamış adım değiştirilmedi</div><div id="app">Veriler yükleniyor…</div><script>const e=v=>String(v??'NO_DATA').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),a=(u,t)=>u?`<a href="${e(u)}" target="_blank" rel="noopener">${e(t)}</a>`:'—';Promise.all(['support_audit_20260722_1717Z.json','support_audit_20260722_1725Z.json'].map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(u+' HTTP '+r.status);return r.json()}))).then(ds=>{const rows=ds.flatMap(d=>d.rows),scores=rows.map(r=>Number(r.candidate_current_identity_confidence)||0),verified=(ds[0].summary.internet_checks_completed||0)+(ds[1].summary.internet_checks_verified||0),attempted=(ds[0].summary.internet_checks_completed||0)+(ds[1].summary.internet_checks_attempted||0),conflicts=ds.reduce((n,d)=>n+(d.summary.identity_conflicts_found||0),0),planningDegraded=ds.reduce((n,d)=>n+(d.summary.official_planning_routes_degraded||0),0),operatorDegraded=ds.reduce((n,d)=>n+(d.summary.official_operator_routes_degraded||0),0),avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10,cards=[['Aday',rows.length],['Kontrol hedefi',attempted],['Doğrulanan kontrol',verified],['Ortalama kimlik güveni',avg+'/100'],['Kimlik çatışması',conflicts],['Planlama bozuk',planningDegraded],['Operator rota eksik',operatorDegraded],['Exact parsel',0],['Yayımlanan parsel değeri',0],['Ana işlem','290/291'],['Ana ilerleme','99.66%'],['Ana artış','+0.00%']];const body=rows.map(r=>`<tr class="${r.status.includes('MANUAL')?'bad':(r.status.includes('DEGRADED')||r.status.includes('NOT_FOUND')||r.status.includes('UNAVAILABLE')?'warn':'ok')}"><td>${e(r.row_reference)}</td><td>${e(r.listing_id)}</td><td>${e(r.address)}</td><td>${e(r.candidate_current_identity_confidence)}/100</td><td>${e(r.parcel_binding_confidence)}/100</td><td>${e(r.status)}</td><td>${r.verified_facts.map(x=>`<div>• ${e(x)}</div>`).join('')}</td><td>${r.blockers.map(x=>`<span class="pill">${e(x)}</span>`).join('')}</td><td>${a(r.primary_url,'ilan')} · ${a(r.operator_url,'operator')} · ${a(r.planning_url,'planlama')}</td></tr>`).join('');document.getElementById('app').innerHTML=`<div class="cards">${cards.map(x=>`<div class="card"><div>${e(x[0])}</div><div class="value">${e(x[1])}</div></div>`).join('')}</div><section><h2>Birleşik satır tablosu</h2><table><thead><tr><th>Satır</th><th>İlan</th><th>Adres</th><th>Kimlik güveni</th><th>Parsel bağlama</th><th>Durum</th><th>Doğrulanan bulgular</th><th>Blockerlar</th><th>Kaynaklar</th></tr></thead><tbody>${body}</tbody></table></section><section class="warn"><b>Ana engel:</b> V53 tarayıcı/DOM kabul görevi hâlâ mevcut yerel shared coordinator tarafından sahiplenilmelidir. İkinci runner açılmamalıdır.</section>`;Object.assign(document.body.dataset,{candidateCount:rows.length,internetChecksAttempted:attempted,internetChecksVerified:verified,averageIdentityConfidence:avg,semanticValid:String(rows.length===10&&attempted===30)})}).catch(x=>{document.getElementById('app').innerHTML=`<section class="bad">BLOCKED: ${e(x)}</section>`;document.body.dataset.semanticValid='false'});</script></body></html>
