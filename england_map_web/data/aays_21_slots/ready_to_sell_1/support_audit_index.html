'+r.status);return r.json()})]).then(([ds,res,m])=>{const rows=ds.flatMap(d=>d.rows||[]),rmap=new Map((res.rows||[]).map(x=>[Number(x.row_reference),x])),amendments=ds.flatMap(d=>d.amendments||[]),cards=[['Aday kapsamı',m.candidate_examples_checked+'/'+m.batch51_candidate_examples_total],['Kapsam',m.batch51_candidate_audit_coverage_percent+'%'],['Toplam kontrol',m.internet_checks_attempted],['Doğrulanan',m.internet_checks_verified],['Doğrulama oranı',m.internet_verification_rate_percent+'%'],['İkinci geçiş',m.second_pass_rows_rechecked+' satır'],['Çözülen çatışma',m.source_identity_conflicts_resolved],['Açık çatışma',m.source_identity_conflicts_open],['Postcode düzeltmesi',m.source_postcode_corrections_published],['Ortalama kimlik güveni',m.average_candidate_current_identity_confidence+'/100'],['Exact parsel',m.examples_promoted_to_exact_parcel],['Parsel değeri',m.published_parcel_value_rows],['Ana işlem',m.main_operations_completed+'/'+m.main_operations_total],['Ana ilerleme',m.main_completion_percent+'%'],['Ana artış','+'+m.main_completion_delta_percent.toFixed(2)+'%']];const body=rows.map(x=>{const r=rmap.get(Number(x.row_reference)),status=r?.resolution_status||x.status,confidence=r?.revised_confidence??x.candidate_current_identity_confidence,facts=r?[r.resolved_fact,...(x.verified_facts||[])]:x.verified_facts||[],blockers=r?.remaining_blockers||x.blockers||[],cls=status.includes('RESOLVED_')?'resolved':status.includes('MANUAL')||status.includes('CONFLICT_CONFIRMED')?'bad':status.includes('DEGRADED')||status.includes('UNRESOLVED')||status.includes('CONFLICT')||status.includes('ADMINISTRATION')?'warn':'ok',sources=r?.sources||[x.primary_url,x.operator_url,x.planning_url].filter(Boolean);return `<tr class="${cls}"><td>${esc(x.row_reference)}</td><td>${esc(x.listing_id)}</td><td>${esc(x.address)}</td><td>${esc(confidence)}/100</td><td>${esc(x.parcel_binding_confidence)}/100</td><td>${esc(status)}</td><td>${facts.map(v=>`<div>• ${esc(v)}</div>`).join('')}</td><td>${
