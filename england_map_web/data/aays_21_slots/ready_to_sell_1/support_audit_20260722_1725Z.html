<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ready_to_sell_1 — Destek Denetimi 2</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f8fafc;color:#0f172a}.muted{color:#475569}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px;margin:14px 0}.card,section{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:11px}.value{font-size:23px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left;vertical-align:top}th{background:#e2e8f0}.ok{background:#ecfdf5}.warn{background:#fff7ed}a{color:#0369a1;word-break:break-all}.pill{display:inline-block;border:1px solid #94a3b8;border-radius:999px;padding:2px 6px;margin:2px;font-size:10px}</style></head><body><h1>ready_to_sell_1 — İkinci Paralel İnternet Denetimi</h1><div class="muted">V53 ana görev korunur · ikinci runner yok · exact parsel yükseltmesi yok</div><div id="app">Veriler yükleniyor…</div><script>const e=v=>String(v??'NO_DATA').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),a=(u,t)=>u?`<a href="${e(u)}" target="_blank" rel="noopener">${e(t)}</a>`:'—';fetch('./support_audit_20260722_1725Z.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const s=d.summary,c=[['Aday',s.candidate_examples_checked],['Kontrol girişimi',s.internet_checks_attempted],['Doğrulanan kontrol',s.internet_checks_verified],['Birincil sayfa',s.primary_pages_verified],['Operator doğrulanan',s.official_operator_routes_verified],['Operator eksik',s.official_operator_routes_degraded],['Planlama canlı',s.official_planning_routes_live],['Ortalama kimlik güveni',s.average_candidate_current_identity_confidence+'/100'],['Exact parsel',s.examples_promoted_to_exact_parcel],['Parsel değeri',s.published_parcel_value_rows],['Ana işlem',s.main_operations_completed+'/'+s.main_operations_total],['Ana ilerleme',s.main_completion_percent+'%']];const rows=d.rows.map(r=>`<tr class="${r.status.includes('UNAVAILABLE')||r.status.includes('NOT_FOUND')?'warn':'ok'}"><td>${e(r.row_reference)}</td><td>${e(r.listing_id)}</td><td>${e(r.address)}</td><td>${e(r.candidate_current_identity_confidence)}/100</td><td>${e(r.status)}</td><td>${r.verified_facts.map(x=>`<div>• ${e(x)}</div>`).join('')}</td><td>${r.blockers.map(x=>`<span class="pill">${e(x)}</span>`).join('')}</td><td>${a(r.primary_url,'ilan')} · ${a(r.operator_url,'operator')} · ${a(r.planning_url,'planlama')}</td></tr>`).join('');document.getElementById('app').innerHTML=`<div class="cards">${c.map(x=>`<div class="card"><div>${e(x[0])}</div><div class="value">${e(x[1])}</div></div>`).join('')}</div><section><h2>Satır satır sonuç</h2><table><thead><tr><th>Satır</th><th>İlan</th><th>Adres</th><th>Güven</th><th>Durum</th><th>Bulgular</th><th>Blocker</th><th>Kaynaklar</th></tr></thead><tbody>${rows}</tbody></table></section>`;document.body.dataset.semanticValid=String(d.rows.length===5&&s.published_parcel_value_rows===0)}).catch(x=>{document.getElementById('app').innerHTML=`<section class="warn">BLOCKED: ${e(x)}</section>`;document.body.dataset.semanticValid='false'});</script></body></html>
