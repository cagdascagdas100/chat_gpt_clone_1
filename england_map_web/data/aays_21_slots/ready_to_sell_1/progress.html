<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ready to Sell 1 — İlerleme</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#f8fafc;color:#0f172a}h1{margin:0 0 8px}.muted{color:#475569}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}.card,section{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:12px}.value{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left;vertical-align:top}th{background:#e2e8f0}.complete,.ok{background:#ecfdf5}.queued,.warn{background:#fff7ed}.blocked,.no{background:#fef2f2}a{color:#0369a1}code{font-size:11px}.bar{height:14px;background:#e2e8f0;border-radius:8px;overflow:hidden}.fill{height:100%;background:#16a34a}</style></head>
<body><h1>Ready to Sell 1 — Satır Satır İlerleme</h1><div class="muted">SLOT_ID=ready_to_sell_1 · parsel 1–30761 · batch 34 dahil · final_ready=false</div><p><a href="../../../geometry_review_3of4_1264_live.html">1.264 geometri satırını aç</a></p><div id="app">Veriler yükleniyor…</div>
<script>
const dated=(prefix,n)=>`${prefix}_batch${n}_${n<=6?'20260720':(n>=27?'20260722':'20260721')}.json`;
const candidateFiles=['verified_candidate_examples_20260720.json',...Array.from({length:33},(_,i)=>dated('verified_candidate_examples',i+2))];
const sourceFiles=['official_source_candidates_20260720.json',...Array.from({length:33},(_,i)=>dated('official_source_candidates',i+2))];
const esc=v=>String(v??'NO_DATA').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const gbp=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(Number(v));
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u} HTTP ${r.status}`);return r.json()}
function price(c){const v=c.ask_price_gbp??c.asking_price_gbp??c.guide_price_gbp;if(v==null||v==='')return esc(c.price_display||'NO_DATA');const a=[];if(c.alternative_price_gbp)a.push(c.alternative_price_gbp);if(Array.isArray(c.alternative_market_prices_gbp))a.push(...c.alternative_market_prices_gbp);if(c.guide_price_upper_gbp)a.push(c.guide_price_upper_gbp);if(c.hammer_price_gbp)a.push(c.hammer_price_gbp);return gbp(v)+(a.length?` / alternatif veya sonuç ${a.map(gbp).join(', ')}`:'')}
function identity(c){return c.matched_inspire_id||c.disclosed_title_number||(Array.isArray(c.disclosed_title_numbers)?c.disclosed_title_numbers.join(', '):null)||c.official_point_wkt||'NO_DATA_NOT_INFERRED'}
function risk(c){const keys=['price_conflict','epc_conflict','epc_position','floor_area_conflict','tenure_conflict','market_status_conflict','postcode_conflict','parking_conflict','tenant_identity_conflict','possession_conflict','possession_position','planning_policy_conflict','auction_history','auction_status','restrictive_covenant_position','overage_position','site_area_status','lease_position','income_position','availability_position','heritage_position','occupation_position','allocation_position','access_position','energy_position','completion_position','rateable_value_position','planning_position','corporate_position','environmental_position'];const p=keys.map(k=>c[k]).filter(Boolean);if(Array.isArray(c.risk_notes))p.push(...c.risk_notes);return p.length?p.join(' · '):'—'}
function count(c){const r=c.internet_readback||{};return(r.independent_market_source_count||0)+(r.official_data_source_count||0)+(r.public_body_corroboration_source_count||0)+(r.primary_corporate_source_count||0)}
function canonicalKey(c){const u=String(c.listing_url||'').trim().toLowerCase().split('?')[0].replace(/\/+$/,'');return u||String(c.listing_id||c.address||'').trim().toLowerCase()}
function dedupe(rows){const kept=new Map(),dupes=[];for(const c of rows){const k=canonicalKey(c);if(kept.has(k)){dupes.push({kept:kept.get(k),excluded:c,key:k})}else kept.set(k,c)}return{rows:[...kept.values()],dupes}}
function candidateRow(c){const refs=Array.isArray(c.planning_references)?c.planning_references.join(', '):(c.planning_reference||'NO_DATA');const rc=risk(c);const conflict=/conflict|uncertain|expired|withdrawn|rescheduled|relisted|post_auction|price_history|reconciliation|under_offer|unsold|sold_stc|sold_at_auction|draft_allocation|holding_over|preapplication|sale_and_leaseback|stale|tender|pending|conditional|topup|sublease|option|guarantee|concurrent|periodic|projected|notice|hmo|short_lease|ground_rent|cva|vacant|landlord_break|rent_free|half_rent|rent_conflict/i.test(c.listing_status||'')||rc!=='—';const active=/on_market|active|available|for_sale|post_auction|new_build|under_offer|unsold|operational|sale_and_leaseback/i.test(c.listing_status||'');return `<tr class="${conflict?'warn':(active?'ok':'')}"><td>${esc(c.row_reference)}</td><td><a href="${esc(c.listing_url)}" target="_blank" rel="noopener">${esc(c.listing_id)}</a></td><td>${esc(c.address)}</td><td>${price(c)}</td><td>${esc(refs)}</td><td>${esc(identity(c))}</td><td>${esc(c.match_score)}/${esc(c.confidence_score)}</td><td>${esc(c.verified_dimension_count)}/${esc(c.target_dimension_count)}</td><td>${count(c)}</td><td>${esc(c.listing_status)}</td><td>${esc(rc)}</td><td>${esc(c.status)}</td></tr>`}
function sourceRow(s){return `<tr><td>${esc(s.source_id)}</td><td>${esc(s.publisher)}</td><td>${esc(s.source_verification_score)}/100</td><td>${esc(s.parcel_binding_score_ceiling)}/100</td><td>${esc(s.binding_limit)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">aç</a></td></tr>`}
function evidenceRow(e){const pubs=Array.isArray(e.publishers)?e.publishers.join(', '):(e.publisher||'NO_DATA');const urls=Array.isArray(e.source_urls)?e.source_urls:[e.source_url];return `<tr class="ok"><td>${esc(e.evidence_reference)}</td><td>${esc(e.candidate_row_reference)}</td><td>${esc(e.address)}</td><td>${esc(e.planning_reference)}</td><td>${esc(pubs)}</td><td>${esc(e.verified_dimension)}</td><td>${esc(e.confidence_note)}</td><td>${urls.filter(Boolean).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">aç</a>`).join(' · ')}</td></tr>`}
function operationRow(o){return `<tr class="${esc(o.status)}"><td>${esc(o.sequence)}</td><td>${esc(o.status)}</td><td><code>${esc(o.operation)}</code></td><td>${esc(o.evidence)}</td></tr>`}
function duplicateRow(d){return `<tr class="warn"><td>${esc(d.excluded.row_reference)}</td><td>${esc(d.excluded.listing_id)}</td><td>${esc(d.kept.row_reference)}</td><td>${esc(d.kept.listing_id)}</td><td>${esc(d.key)}</td></tr>`}
(async()=>{try{const[p,e,...docs]=await Promise.all([get('progress_latest.json'),get('official_planning_corroboration_batch7_20260721.json'),...candidateFiles.map(get),...sourceFiles.map(get)]);const rawCandidates=docs.slice(0,candidateFiles.length).flatMap(d=>d.candidates||[]),sources=docs.slice(candidateFiles.length).flatMap(d=>d.sources||[]),result=dedupe(rawCandidates),candidates=result.rows,duplicates=result.dupes,evidence=e.evidence_rows||[],m=p.metrics;document.body.dataset.rawCandidateCount=String(rawCandidates.length);document.body.dataset.candidateCount=String(candidates.length);document.body.dataset.duplicateCandidateCount=String(duplicates.length);document.body.dataset.officialSourceCount=String(sources.length);document.body.dataset.officialEvidenceCount=String(evidence.length);document.body.dataset.completedOperations=String(p.progress.completed_operations);document.body.dataset.totalOperations=String(p.progress.total_operations);document.body.dataset.semanticValid=String(candidates.length===m.candidate_rows&&sources.length===m.verified_official_sources&&evidence.length===m.official_planning_evidence_rows&&duplicates.length===m.duplicate_candidate_rows_excluded&&m.geometry_rows===1264&&m.published_parcel_value_rows===0);document.getElementById('app').innerHTML=`<div class="cards"><div class="card"><div>Genel ilerleme</div><div class="value">${p.progress.completion_percent}%</div><div class="bar"><div class="fill" style="width:${p.progress.completion_percent}%"></div></div></div><div class="card"><div>İşlem</div><div class="value">${p.progress.completed_operations}/${p.progress.total_operations}</div></div><div class="card"><div>Geometri satırı</div><div class="value">${m.geometry_rows}</div></div><div class="card"><div>Benzersiz aday</div><div class="value">${candidates.length}</div></div><div class="card"><div>Ham aday</div><div class="value">${rawCandidates.length}</div></div><div class="card"><div>Tekilleştirilen</div><div class="value">${duplicates.length}</div></div><div class="card"><div>Resmî kaynak</div><div class="value">${sources.length}</div></div><div class="card"><div>Planlama kanıtı</div><div class="value">${evidence.length}</div></div><div class="card"><div>Exact INSPIRE</div><div class="value">${m.exact_inspire_matches}</div></div></div><section><h2>Operasyonlar</h2><table><thead><tr><th>#</th><th>Durum</th><th>İşlem</th><th>Kanıt</th></tr></thead><tbody>${p.operations.map(operationRow).join('')}</tbody></table></section><section><h2>Duplicate tekilleştirme denetimi</h2><table><thead><tr><th>Hariç satır</th><th>Hariç ilan</th><th>Korunan satır</th><th>Korunan ilan</th><th>Kanonik URL</th></tr></thead><tbody>${duplicates.map(duplicateRow).join('')}</tbody></table></section><section><h2>Adaylar</h2><table><thead><tr><th>Satır</th><th>İlan</th><th>Adres</th><th>Fiyat</th><th>Planlama</th><th>Kimlik/konum kanıtı</th><th>Eşleşme/Güven</th><th>Boyut</th><th>Kaynak</th><th>Pazar durumu</th><th>Risk/çatışma</th><th>Doğrulama durumu</th></tr></thead><tbody>${candidates.map(candidateRow).join('')}</tbody></table></section><section><h2>Resmî planlama doğrulama kanıtları</h2><table><thead><tr><th>Kanıt</th><th>Aday satırı</th><th>Adres</th><th>Referans</th><th>Yayıncı</th><th>Sonuç</th><th>Sınır</th><th>Kaynak</th></tr></thead><tbody>${evidence.map(evidenceRow).join('')}</tbody></table></section><section><h2>Resmî kaynaklar</h2><table><thead><tr><th>Kaynak</th><th>Yayıncı</th><th>Kaynak skoru</th><th>Bağlama tavanı</th><th>Sınır</th><th>URL</th></tr></thead><tbody>${sources.map(sourceRow).join('')}</tbody></table></section><section class="blocked"><h2>Blockerlar</h2><ul>${p.blockers.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul></section>`}catch(e){document.body.dataset.acceptanceError=String(e);document.getElementById('app').innerHTML=`<section class="blocked">BLOCKED: ${esc(e)}</section>`}})();
</script></body></html>
