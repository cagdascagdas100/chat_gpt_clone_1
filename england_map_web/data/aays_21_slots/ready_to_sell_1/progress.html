<script>
const paths={progress:'./progress_latest.json',c1:'./verified_candidate_examples_20260720.json',c2:'./verified_candidate_examples_batch2_20260720.json',c3:'./verified_candidate_examples_batch3_20260720.json',c4:'./verified_candidate_examples_batch4_20260720.json',c5:'./verified_candidate_examples_batch5_20260720.json',c6:'./verified_candidate_examples_batch6_20260720.json',c7:'./verified_candidate_examples_batch7_20260721.json',c8:'./verified_candidate_examples_batch8_20260721.json',c9:'./verified_candidate_examples_batch9_20260721.json',c10:'./verified_candidate_examples_batch10_20260721.json',c11:'./verified_candidate_examples_batch11_20260721.json',c12:'./verified_candidate_examples_batch12_20260721.json',s1:'./official_source_candidates_20260720.json',s2:'./official_source_candidates_batch2_20260720.json',s3:'./official_source_candidates_batch3_20260720.json',s4:'./official_source_candidates_batch4_20260720.json',s5:'./official_source_candidates_batch5_20260720.json',s6:'./official_source_candidates_batch6_20260720.json',s7:'./official_source_candidates_batch7_20260721.json',s8:'./official_source_candidates_batch8_20260721.json',s9:'./official_source_candidates_batch9_20260721.json',s10:'./official_source_candidates_batch10_20260721.json',s11:'./official_source_candidates_batch11_20260721.json',s12:'./official_source_candidates_batch12_20260721.json',e1:'./official_planning_corroboration_batch7_20260721.json'};
const esc=v=>String(v??'NO_DATA').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const gbp=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(Number(v));
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${url} HTTP ${r.status}`);return r.json()}
function candidatePrice(c){const v=c.ask_price_gbp??c.asking_price_gbp??c.guide_price_gbp;if(v===null||v===undefined||v==='')return esc(c.price_display||'NO_DATA');const alts=[];if(c.alternative_price_gbp)alts.push(c.alternative_price_gbp);if(Array.isArray(c.alternative_market_prices_gbp))alts.push(...c.alternative_market_prices_gbp);if(c.guide_price_upper_gbp)alts.push(c.guide_price_upper_gbp);return gbp(v)+(alts.length?` / alternatif ${alts.map(gbp).join(', ')}`:'')}
function candidateIdentity(c){if(c.matched_inspire_id)return c.matched_inspire_id;if(c.disclosed_title_number)return c.disclosed_title_number;if(Array.isArray(c.disclosed_title_numbers))return c.disclosed_title_numbers.join(', ');if(c.official_point_wkt)return c.official_point_wkt;return 'NO_DATA_NOT_INFERRED'}
function candidateRisk(c){const parts=[];if(c.price_conflict)parts.push(c.price_conflict);if(c.epc_conflict)parts.push(c.epc_conflict);if(c.floor_area_conflict)parts.push(c.floor_area_conflict);if(c.possession_conflict)parts.push(c.possession_conflict);if(c.planning_policy_conflict)parts.push(c.planning_policy_conflict);if(c.auction_history)parts.push(c.auction_history);if(Array.isArray(c.risk_notes))parts.push(...c.risk_notes);return parts.length?parts.join(' · '):'—'}
function candidateRow(c){const refs=Array.isArray(c.planning_references)?c.planning_references.join(', '):(c.planning_reference||'NO_DATA');const sourceCount=(c.internet_readback?.independent_market_source_count||0)+(c.internet_readback?.official_data_source_count||0)+(c.internet_readback?.public_body_corroboration_source_count||0);const active=/on_market|online_auction|listing_pages_live|active_private_treaty|active_for_sale|active_online_auction|active_lot|currently_available|currently_trading/i.test(c.listing_status||'');const conflict=/conflict|uncertain|expired|withdrawn_versions/i.test(c.listing_status||'')||c.price_conflict||c.epc_conflict||c.floor_area_conflict||c.possession_conflict||c.planning_policy_conflict||c.auction_history;const rowClass=conflict?'warn':(active?'ok':(/withdrawn|postponed|sold|under_offer/i.test(c.listing_status||'')?'warn':''));return `<tr class="${rowClass}"><td>${esc(c.row_reference)}</td><td><a href="${esc(c.listing_url)}" target="_blank" rel="noopener">${esc(c.listing_id)}</a></td><td>${esc(c.address)}</td><td>${candidatePrice(c)}</td><td>${esc(refs)}</td><td>${esc(candidateIdentity(c))}</td><td>${esc(c.match_score)}/${esc(c.confidence_score)}</td><td>${esc(c.verified_dimension_count)}/${esc(c.target_dimension_count)}</td><td>${sourceCount}</td><td>${esc(c.listing_status)}</td><td>${esc(candidateRisk(c))}</td><td>${esc(c.status)}</td></tr>`}
function sourceRow(s){return `<tr><td>${esc(s.source_id)}</td><td>${esc(s.publisher)}</td><td>${esc(s.source_verification_score)}/100</td><td>${esc(s.parcel_binding_score_ceiling)}/100</td><td>${esc(s.binding_limit)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">aç</a></td></tr>`}
function evidenceRow(e){const publishers=Array.isArray(e.publishers)?e.publishers.join(', '):(e.publisher||'NO_DATA');const urls=Array.isArray(e.source_urls)?e.source_urls:[e.source_url];return `<tr class="ok"><td>${esc(e.evidence_reference)}</td><td>${esc(e.candidate_row_reference)}</td><td>${esc(e.address)}</td><td>${esc(e.planning_reference)}</td><td>${esc(publishers)}</td><td>${esc(e.verified_dimension)}</td><td>${esc(e.confidence_note)}</td><td>${urls.filter(Boolean).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">aç</a>`).join(' · ')}</td></tr>`}
function operationRow(o){return `<tr class="${esc(o.status)}"><td>${esc(o.sequence)}</td><td>${esc(o.status)}</td><td><code>${esc(o.operation)}</code></td><td>${esc(o.evidence)}</td></tr>`}
(async()=>{try{const [p,c1,c2,c3,c4,c5,c6,c7,c8,c9,c10,c11,c12,s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11,s12,e1]=await Promise.all(Object.values(paths).map(get));const candidates=[...(c1.candidates||[]),...(c2.candidates||[]),...(c3.candidates||[]),...(c4.candidates||[]),...(c5.candidates||[]),...(c6.candidates||[]),...(c7.candidates||[]),...(c8.candidates||[]),...(c9.candidates||[]),...(c10.candidates||[]),...(c11.candidates||[]),...(c12.candidates||[])];const sources=[...(s1.sources||[]),...(s2.sources||[]),...(s3.sources||[]),...(s4.sources||[]),...(s5.sources||[]),...(s6.sources||[]),...(s7.sources||[]),...(s8.sources||[]),...(s9.sources||[]),...(s10.sources||[]),...(s11.sources||[]),...(s12.sources||[])];const evidence=e1.evidence_rows||[];const m=p.metrics;document.body.dataset.candidateCount=String(candidates.length);document.body.dataset.officialSourceCount=String(sources.length);document.body.dataset.officialEvidenceCount=String(evidence.length);document.body.dataset.completedOperations=String(p.progress.completed_operations);document.body.dataset.totalOperations=String(p.progress.total_operations);document.body.dataset.semanticValid=String(candidates.length===m.candidate_rows&&sources.length===m.verified_official_sources&&evidence.length===m.official_planning_evidence_rows&&m.geometry_rows===1264&&m.published_parcel_value_rows===0);document.getElementById('app').innerHTML=`

<section class="blocked"><h2>Blockerlar</h2><ul>${p.blockers.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul></section>`}catch(e){document.body.dataset.acceptanceError=String(e);document.getElementById('app').innerHTML=`<section class="blocked">BLOCKED: ${esc(e)}</section>`}})();
</script>
