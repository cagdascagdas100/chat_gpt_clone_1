const progressFile='progress_latest.json',evidenceFile='official_planning_corroboration_batch7_20260721.json';const esc=v=>String(v??'NO_DATA').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const gbp=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(Number(v));async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${url} HTTP ${r.status}`);return r.json()}function candidatePrice(c){const v=c.ask_price_gbp??c.asking_price_gbp??c.guide_price_gbp;if(v===null||v===undefined||v==='')return esc(c.price_display||'NO_DATA');const alts=[];if(c.alternative_price_gbp)alts.push(c.alternative_price_gbp);if(Array.isArray(c.alternative_market_prices_gbp))alts.push(...c.alternative_market_prices_gbp);if(c.guide_price_upper_gbp)alts.push(c.guide_price_upper_gbp);return gbp(v)+(alts.length?` / alternatif ${alts.map(gbp).join(', ')}`:'')}function candidateIdentity(c){if(c.matched_inspire_id)return c.matched_inspire_id;if(c.disclosed_title_number)return c.disclosed_title_number;if(Array.isArray(c.disclosed_title_numbers))return c.disclosed_title_numbers.join(', ');if(c.official_point_wkt)return c.official_point_wkt;return 'NO_DATA_NOT_INFERRED'}function candidateRisk(c){const keys=['price_conflict','epc_conflict','floor_area_conflict','tenure_conflict','market_status_conflict','postcode_conflict','parking_conflict','tenant_identity_conflict','possession_conflict','planning_policy_conflict','auction_history','site_area_status','lease_position','income_position','availability_position','heritage_position'];const parts=keys.map(k=>c[k]).filter(Boolean);if(Array.isArray(c.risk_notes))parts.push(...c.risk_notes);return parts.length?parts.join(' · '):'—'}function sourceCount(c){const r=c.internet_readback||{};return(r.independent_market_source_count||0)+(r.official_data_source_count||0)+(r.public_body_corroboration_source_count||0)+(r.primary_corporate_source_count||0)}function candidateRow(c){const refs=Array.isArray(c.planning_references)?c.planning_references.join(', '):(c.planning_reference||'NO_DATA');const conflict=/conflict|uncertain|expired|withdrawn|rescheduled|relisted|post_auction|price_history|reconciliation|under_offer/i.test(c.listing_status||'')||candidateRisk(c)!=='—';const active=/on_market|active|available|for_sale|post_auction|new_build|under_offer/i.test(c.listing_status||'');const rowClass=conflict?'warn':(active?'ok':'');return `<tr class="${rowClass}"><td>${esc(c.row_reference)}</td><td><a href="${esc(c.listing_url)}" target="_blank" rel="noopener">${esc(c.listing_id)}</a></td><td>${esc(c.address)}</td><td>${candidatePrice(c)}</td><td>${esc(refs)}</td><td>${esc(candidateIdentity(c))}</td><td>${esc(c.match_score)}/${esc(c.confidence_score)}</td><td>${esc(c.verified_dimension_count)}/${esc(c.target_dimension_count)}</td><td>${sourceCount(c)}</td><td>${esc(c.listing_status)}</td><td>${esc(candidateRisk(c))}</td><td>${esc(c.status)}</td></tr>`}function sourceRow(s){return `<tr><td>${esc(s.source_id)}</td><td>${esc(s.publisher)}</td><td>${esc(s.source_verification_score)}/100</td><td>${esc(s.parcel_binding_score_ceiling)}/100</td><td>${esc(s.binding_limit)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">aç</a></td></tr>`}function evidenceRow(e){const publishers=Array.isArray(e.publishers)?e.publishers.join(', '):(e.publisher||'NO_DATA');const urls=Array.isArray(e.source_urls)?e.source_urls:[e.source_url];return `<tr class="ok"><td>${esc(e.evidence_reference)}</td><td>${esc(e.candidate_row_reference)}</td><td>${esc(e.address)}</td><td>${esc(e.planning_reference)}</td><td>${esc(publishers)}</td><td>${esc(e.verified_dimension)}</td><td>${esc(e.confidence_note)}</td><td>${urls.filter(Boolean).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">aç</a>`).join(' · ')}</td></tr>`}function operationRow(o){return `<tr class="${esc(o.status)}"><td>${esc(o.sequence)}</td><td>${esc(o.status)}</td><td><code>${esc(o.operation)}</code></td><td>${esc(o.evidence)}</td></tr>`}
(async()=>{try{const[p,e,...docs]=await Promise.all([get(progressFile),get(evidenceFile),...candidateFiles.map(get),...sourceFiles.map(get)]);const candidateDocs=docs.slice(0,candidateFiles.length),sourceDocs=docs.slice(candidateFiles.length);const candidates=candidateDocs.flatMap(d=>d.candidates||[]),sources=sourceDocs.flatMap(d=>d.sources||[]),evidence=e.evidence_rows||[],m=p.metrics;document.body.dataset.candidateCount=String(candidates.length);document.body.dataset.officialSourceCount=String(sources.length);document.body.dataset.officialEvidenceCount=String(evidence.length);document.body.dataset.completedOperations=String(p.progress.completed_operations);document.body.dataset.totalOperations=String(p.progress.total_operations);document.body.dataset.semanticValid=String(candidates.length===m.candidate_rows&&sources.length===m.verified_official_sources&&evidence.length===m.official_planning_evidence_rows&&m.geometry_rows===1264&&m.published_parcel_value_rows===0);document.getElementById('app').innerHTML=`<div class="cards"><div class="card"><div>Genel ilerleme</div><div class="value">${p.progress.completion_percent}%</div><div class="bar"><div class="fill" style="width:${p.progress.completion_percent}%"></div></div></div><div class="card"><div>İşlem</div><div class="value">${p.progress.completed_operations}/${p.progress.total_operations}</div></div><div class="card"><div>Geometri satırı</div><div class="value">${m.geometry_rows}</div></div><div class="card"><div>Aday</div><div class="value">${candidates.length}</div></div><div class="card"><div>Resmî kaynak</div><div class="value">${sources.length}</div></div><div class="card"><div>Planlama kanıtı</div><div class="value">${evidence.length}</div></div><div class="card"><div>Exact INSPIRE</div><div class="value">${m.exact_inspire_matches}</div></div></div><section><h2>Operasyonlar</h2><table><thead><tr><th>#</th><th>Durum</th><th>İşlem</th><th>Kanıt</th></tr></thead><tbody>${p.operations.map(operationRow).join('')}</tbody></table></section><section><h2>Adaylar</h2><table><thead><tr><th>Satır</th><th>İlan</th><th>Adres</th><th>Fiyat</th><th>Planlama</th><th>Kimlik/konum kanıtı</th><th>Eşleşme/Güven</th><th>Boyut</th><th>Kaynak</th><th>Pazar durumu</th><th>Risk/çatışma</th><th>Doğrulama durumu</th></tr></thead><tbody>${candidates.map(candidateRow).join('')}</tbody></table></section><section><h2>Resmî planlama doğrulama kanıtları</h2><table><thead><tr><th>Kanıt</th><th>Aday satırı</th><th>Adres</th><th>Referans</th><th>Yayıncı</th><th>Sonuç</th><th>Sınır</th><th>Kaynak</th></tr></thead><tbody>${evidence.map(evidenceRow).join('')}</tbody></table></section><section><h2>Resmî kaynaklar</h2><table><thead><tr><th>Kaynak</th><th>Yayıncı</th><th>Kaynak skoru</th><th>Bağlama tavanı</th><th>Sınır</th><th>URL</th></tr></thead><tbody>${sources.map(sourceRow).join('')}</tbody></table></section><section class="blocked"><h2>Blockerlar</h2><ul>${p.blockers.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul></section>`}catch(e){document.body.dataset.acceptanceError=String(e);document.getElementById('app').innerHTML=`<section class="blocked">BLOCKED: ${esc(e)}</section>`}})();
</script></body></html>
