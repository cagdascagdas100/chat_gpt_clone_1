<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD1 19425–19504 satır görünümü</title><style>body{font-family:Arial,sans-serif;margin:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;vertical-align:top}th{position:sticky;top:0;background:#fff}.pass{background:#eef9ee}.blocked{background:#fff2f2}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input{padding:6px;width:160px}button{padding:6px}</style></head><body><h1>height_difference_1 — Wave 19425–19504</h1><p>80 resmî kural × 3 gerçek aday × 8 fail-closed mod = 1.920 logical satır. Planning toplam çelişkisi source-conflict olarak fail-closed tutulur.</p><div class="bar"><button id="prev">← Önceki 200</button><button id="next">Sonraki 200 →</button><input id="jump" type="number" min="443112" max="445031" placeholder="operation no"><button id="go">Operation'a git</button><span id="info"></span></div><table><thead><tr><th>operation</th><th>wave</th><th>source</th><th>rule</th><th>candidate</th><th>mode</th><th>status</th><th>reason</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table><script>let data,page=0;const pageSize=200;function build(){const out=[];let op=data.operation_range.start;for(let r=0;r<data.rules.length;r++){const [id,source,fact]=data.rules[r];const wave=data.waves.start+r;for(const c of data.candidates){for(const mode of data.modes){const blocked=mode==='CANDIDATE_BINDING'||mode==='NUMERIC_PROMOTION';out.push({op:op++,wave,source,id,fact,candidate:c.parcel_id,mode,status:blocked?'BLOCKED':'PASS',reason:blocked?(mode==='CANDIDATE_BINDING'?'Exact candidate-specific official response/identity not read back.':'Exact official candidate numeric terrain value not read back.'):'Official source fact/readback supports this guard; no candidate or numeric promotion implied.',url:data.sources[source]});}}}return out}let all=[];function render(){const s=page*pageSize,e=Math.min(s+pageSize,all.length);rows.innerHTML=all.slice(s,e).map(x=>`<tr class="${x.status.toLowerCase()}"><td>${x.op}</td><td>${x.wave}</td><td>${x.source}</td><td><b>${x.id}</b> ${x.fact}</td><td>${x.candidate}</td><td>${x.mode}</td><td>${x.status}</td><td>${x.reason}</td><td><a href="${x.url}">source</a></td></tr>`).join('');info.textContent=`${s+1}-${e} / ${all.length}`;}fetch('official_reconciliation_api_lineage_guards_waves_19425_19504_20260727.json').then(r=>r.json()).then(d=>{data=d;all=build();render()});prev.onclick=()=>{page=Math.max(0,page-1);render()};next.onclick=()=>{page=Math.min(Math.ceil(all.length/pageSize)-1,page+1);render()};go.onclick=()=>{const n=+jump.value;if(n>=443112&&n<=445031){page=Math.floor((n-443112)/pageSize);render()}}</script></body></html>
