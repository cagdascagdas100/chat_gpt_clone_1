<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD1 235925–285924 işlemleri</title><style>body{font-family:Arial,sans-serif;margin:16px}header{position:sticky;top:0;background:#fff;padding:8px 0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;vertical-align:top}th{background:#eee;position:sticky;top:86px}.PASS{background:#eef9ee}.BLOCKED{background:#fff0f0}input{width:120px}button{margin:2px}code{white-space:nowrap}</style></head><body><header><h1>height_difference_1 — 235925–285924</h1><p><b>1.200.000 satır</b> · 900.000 PASS · 300.000 BLOCKED · 200 satır/sayfa · 6.000 sayfa. Satırlar tarayıcıda istenen sayfa için deterministik üretilir.</p><label>Sayfa <input id="page" type="number" min="1" max="6000" value="1"></label><button onclick="goPage()">Git</button><button onclick="step(-1)">Önceki</button><button onclick="step(1)">Sonraki</button> <label>İşlem <input id="op" type="number" min="5639112" max="6839111" value="5639112"></label><button onclick="jumpOp()">İşleme git</button><span id="summary"></span></header><table><thead><tr><th>İşlem</th><th>Gözlem</th><th>Kaynak</th><th>Olgu</th><th>Boyut</th><th>Aday</th><th>Mod</th><th>Durum</th><th>Neden</th><th>Resmî kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>const START=5639112,TOTAL=1200000,SIZE=200,PAGES=6000,WSTART=235925;const sources=[['Planning Data','https://www.planning.data.gov.uk/docs'],['HM Land Registry','https://www.gov.uk/government/publications/boundary-agreements-and-determined-boundaries-pg40s4'],['Environment Agency','https://environment.data.gov.uk/dataset/13787b9a-26a4-4775-8523-806d13af58fc'],['Ordnance Survey','https://docs.os.uk/os-downloads/products/land-and-terrain-portfolio/os-terrain-50/os-terrain-50-technical-specification/grid-data']];const dims=['authority_query_pagination_and_snapshot','identity_lifecycle_coverage_and_currentness','boundary_exactness_plan_scale_and_registry','lidar_service_lineage_datum_uncertainty_and_nodata','grid_release_metadata_header_axis_and_cell_sampling'];const candidates=['parcel_2759 / 52040420 / TQ2865892535','parcel_2758 / 52213916 / TQ2874792527','parcel_2757 / 52213412 / TQ2872392513'];const modes=['SOURCE_READBACK','AUTHORITY_PROVENANCE_GUARD','CURRENTNESS_LIFECYCLE_GUARD','SCHEMA_FORMAT_GUARD','CROSS_SOURCE_CONSISTENCY','FAIL_CLOSED_QUALITY_GUARD','CANDIDATE_BINDING','NUMERIC_PROMOTION'];function row(op){let r=op-START,mi=r%8,ci=Math.floor(r/8)%3,di=Math.floor(r/24)%5,fi=Math.floor(r/120),si=Math.floor(fi/2500),obs=WSTART+fi*5+di,status=mi<6?'PASS':'BLOCKED',reason=mi<6?'resmî sözleşme ve fail-closed kalite kapısı doğrulandı':mi===6?'kesin aday entity/current INSPIRE ID/determined plan veya polygon baytları yok':'aday raster arşivi/header/NoData maskesi ve hücre değerleri yok';return `<tr class="${status}"><td><code>${op}</code></td><td>${obs}</td><td>${sources[si][0]}</td><td>${fi+1}</td><td>${dims[di]}</td><td>${candidates[ci]}</td><td>${modes[mi]}</td><td>${status}</td><td>${reason}</td><td><a href="${sources[si][1]}">resmî kaynak</a></td></tr>`}function render(p){p=Math.max(1,Math.min(PAGES,Number(p)||1));document.getElementById('page').value=p;let a=START+(p-1)*SIZE,b=Math.min(START+TOTAL,a+SIZE),h='';for(let op=a;op<b;op++)h+=row(op);document.getElementById('rows').innerHTML=h;document.getElementById('summary').textContent=` Sayfa ${p}/${PAGES} · işlemler ${a}–${b-1}`;history.replaceState(null,'','#page='+p)}function goPage(){render(document.getElementById('page').value)}function step(d){render(Number(document.getElementById('page').value)+d)}function jumpOp(){let op=Math.max(START,Math.min(START+TOTAL-1,Number(document.getElementById('op').value)||START));render(Math.floor((op-START)/SIZE)+1);setTimeout(()=>{let i=(op-START)%SIZE,trs=document.querySelectorAll('#rows tr');trs[i]?.scrollIntoView({block:'center'});trs[i]?.style.setProperty('outline','3px solid black')},0)}let q=Number(location.hash.replace('#page=',''));render(q||1);</script></body></html>
