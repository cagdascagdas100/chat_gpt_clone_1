<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD1 20217-20280 satır görünümü</title><style>body{font-family:Arial,sans-serif;margin:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:5px;vertical-align:top}th{position:sticky;top:0;background:#fff}button{margin:4px}.pass{background:#eefaf0}.blocked{background:#fff2f2}a{word-break:break-all}</style></head><body><h1>height_difference_1 — 20217–20280</h1><p>64 resmî kural × 3 gerçek aday × 8 fail-closed mod = <b>1.536 satır</b>. Sayfa başına 200 satır. Exact candidate/numeric kanıt yoksa BLOCKED.</p><label>Operation: <input id="op" type="number" min="462120" max="463655"><button onclick="jump()">Git</button></label><div id="nav"></div><table><thead><tr><th>operation</th><th>wave</th><th>source</th><th>rule</th><th>candidate</th><th>mode</th><th>status</th><th>reason</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table><script>const evidence='official_endpoint_semantics_quality_guards_waves_20217_20280_20260727.json';let all=[],page=0,ps=200;fetch(evidence).then(r=>r.json()).then(d=>{let rules=[];Object.entries(d.rule_groups).forEach(([source,a])=>a.forEach(x=>{let p=x.split('|');rules.push({source,id:p[0],claim:p[1],url:p.slice(2).join('|')})}));let op=d.operation_range.start;rules.forEach((rule,ri)=>d.candidates.forEach(c=>d.modes.forEach(m=>all.push({op:op++,wave:d.wave.start+ri,source:rule.source,rule:rule.id+' — '+rule.claim,candidate:c.candidate+' / '+c.reference,mode:m.mode,status:m.status,reason:m.status==='PASS'?'Official source/contract verified; no candidate-specific value inferred.':'Candidate-specific authoritative identity or measured numeric value not read back.',url:rule.url}))));render(0)});function render(p){page=Math.max(0,Math.min(p,Math.ceil(all.length/ps)-1));let s=page*ps,e=Math.min(s+ps,all.length),tb=document.getElementById('rows');tb.innerHTML=all.slice(s,e).map(x=>`<tr class="${x.status.toLowerCase()}"><td>${x.op}</td><td>${x.wave}</td><td>${x.source}</td><td>${x.rule}</td><td>${x.candidate}</td><td>${x.mode}</td><td>${x.status}</td><td>${x.reason}</td><td><a href="${x.url}">${x.url}</a></td></tr>`).join('');document.getElementById('nav').innerHTML=`<button onclick="render(${page-1})">Önceki</button> Sayfa ${page+1}/${Math.ceil(all.length/ps)} — satır ${s+1}-${e} <button onclick="render(${page+1})">Sonraki</button>`}function jump(){let v=+document.getElementById('op').value,i=all.findIndex(x=>x.op===v);if(i>=0)render(Math.floor(i/ps))}</script></body></html>
