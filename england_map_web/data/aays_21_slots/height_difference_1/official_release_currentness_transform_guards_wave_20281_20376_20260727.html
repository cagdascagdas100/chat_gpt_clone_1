<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD1 20281–20376 satır görünümü</title><style>body{font-family:Arial,sans-serif;margin:20px;line-height:1.35}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:5px;vertical-align:top}th{position:sticky;top:0;background:#fff}.controls{position:sticky;top:0;background:#fff;padding:8px 0;z-index:2}.blocked{font-weight:700}a{word-break:break-all}</style></head><body><h1>height_difference_1 — wave 20281–20376</h1><p>96 resmî observation × 3 gerçek aday × 8 fail-closed mod = 2.304 satır. 1.728 PASS / 576 BLOCKED. Exact kimlik veya sayısal yükseklik uydurulmaz.</p><div class="controls">Operation: <input id="jump" type="number" min="463656" max="465959" value="463656"> <button onclick="jumpOp()">Git</button> &nbsp; <button onclick="prev()">←</button> <span id="pg"></span> <button onclick="next()">→</button></div><table><thead><tr><th>operation</th><th>wave</th><th>source</th><th>rule</th><th>candidate</th><th>mode</th><th>status</th><th>reason / claim</th><th>official URL</th></tr></thead><tbody id="body"></tbody></table><script>const DATA='official_release_currentness_transform_guards_waves_20281_20376_20260727.json';const PAGE=200;let rows=[],page=0;fetch(DATA).then(r=>r.json()).then(d=>{let op=463656;d.observations.forEach(o=>d.candidates.forEach(c=>d.modes.forEach(m=>rows.push({operation:op++,wave:`${d.wave.start}–${d.wave.end}`,source:o.source_family,rule:o.rule,candidate:c.candidate,mode:m.mode,status:m.status,reason:m.status==='PASS'?o.claim:m.reason,url:o.official_url}))));render();});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){let a=page*PAGE,b=Math.min(rows.length,a+PAGE);document.getElementById('pg').textContent=`${a+1}–${b} / ${rows.length}`;document.getElementById('body').innerHTML=rows.slice(a,b).map(x=>`<tr class="${x.status==='BLOCKED'?'blocked':''}"><td>${x.operation}</td><td>${x.wave}</td><td>${esc(x.source)}</td><td>${esc(x.rule)}</td><td>${esc(x.candidate)}</td><td>${esc(x.mode)}</td><td>${x.status}</td><td>${esc(x.reason)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></td></tr>`).join('');}function next(){if((page+1)*PAGE<rows.length){page++;render();}}function prev(){if(page>0){page--;render();}}function jumpOp(){let n=Number(document.getElementById('jump').value);let i=rows.findIndex(x=>x.operation===n);if(i>=0){page=Math.floor(i/PAGE);render();setTimeout(()=>{let r=[...document.querySelectorAll('#body tr')][i%PAGE];if(r)r.scrollIntoView({block:'center'});},0);}}</script></body></html>
