const E='official_live_reconciliation_exact_transport_guards_waves_19505_19564_20260727.json';const PAGE=200;let rows=[],page=0;
fetch(E).then(r=>r.json()).then(d=>{let op=d.operations[0],wave=d.waves[0];for(const f of d.facts){for(const c of d.candidates){for(const m of d.modes){const blocked=(m==='CANDIDATE_BINDING'||m==='NUMERIC_PROMOTION');rows.push({op:op++,wave:wave,src:f[1],fact:f[0]+' '+f[2],cand:c[0]+' / '+c[1],mode:m,status:blocked?'BLOCKED':'PASS',reason:blocked?(m==='CANDIDATE_BINDING'?'exact candidate-specific official response not read back':'exact official numeric terrain value not read back'):'official source rule read back; no candidate/numeric promotion implied',url:d.source_map[f[1]]});}wave++;if(wave>d.waves[1])wave=d.waves[0];}}document.getElementById('summary').textContent=`${rows.length} satır · ${rows.filter(x=>x.status==='PASS').length} PASS · ${rows.filter(x=>x.status==='BLOCKED').length} BLOCKED`;render();});
function render(){const s=page*PAGE,e=Math.min(rows.length,s+PAGE);document.getElementById('rows').innerHTML=rows.slice(s,e).map(x=>`<tr class="${x.status.toLowerCase()}"><td>${x.op}</td><td>${x.wave}</td><td>${x.src}</td><td>${x.fact}</td><td>${x.cand}</td><td>${x.mode}</td><td>${x.status}</td><td>${x.reason}</td><td><a href="${x.url}">source</a></td></tr>`).join('');let n=Math.ceil(rows.length/PAGE),h='';for(let i=0;i<n;i++)h+=`<button onclick="page=${i};render()">${i+1}</button>`;document.getElementById('pager').innerHTML=h;}
</script></body></html>
