(1,Math.min(totalPages,page));document.getElementById('page').value=page;document.getElementById('info').textContent=`Sayfa ${page}/${totalPages}`;let html='';const first=(page-1)*pageSize,last=Math.min(totalRows,first+pageSize);for(let row=first;row<last;row++){let x=row;const mi=x%8;x=Math.floor(x/8);const ci=x%3;x=Math.floor(x/3);const di=x%5;x=Math.floor(x/5);const fi=x;const f=facts[fi],m=modes[mi],c=candidates[ci],op=startOperation+row;html+=`<tr class="${m[1].toLowerCase()}"><td>${op}</td><td>${esc(f.observation)}</td><td>${esc(f.source)}</td><td>${esc(f.fact)}</td><td>${esc(f.variant)}</td><td>${esc(dimensions[di])}</td><td>${esc(c.join(' / '))}</td><td>${esc(m[0])}</td><td>${esc(m[1])}</td><td>${esc(m[2])}</td><td><a target="_blank" rel="noopener" href="${esc(f.url)}">${esc(f.url)}</a></td></tr>`}document.getElementById('rows').innerHTML=html}Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(`${f}: ${r.status}`);return r.json()}))).then(ds=>{facts=ds.flatMap(normalize);if(facts.length!==560)throw Error(`Beklenen 560 olgu, bulunan ${facts.length}`);render()}).catch(e=>document.getElementById('rows').innerHTML=`<tr><td colspan="11">Yükleme hatası: ${esc(e.message)}</td></tr>`);document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};document.getElementById('goPage').onclick=()=>{page=Number(document.getElementById('page').value)||1;render()};document.getElementById('goOperation').onclick=()=>{const op=Number(document.getElementById('operation').value);if(op>=startOperation&&op<startOperation+totalRows){page=Math.floor((op-startOperation)/pageSize)+1;render()}};</script></body></html>
