),cl=r[6]==='PASS'?'pass':'blocked';s+=`<tr class="${cl}">`+r.map((x,j)=>j===8?`<td><a href="${x}" target="_blank">${x}</a></td>`:`<td>${x}</td>`).join('')+'</tr>';}document.getElementById('rows').innerHTML=s;document.getElementById('page').textContent=` Sayfa ${page+1}/${maxp} · satır ${a+1}-${b}`;}document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};document.getElementById('go').onclick=()=>{let op=Number(document.getElementById('jump').value);page=Math.floor(Math.max(0,Math.min(totalRows()-1,op-START))/PAGE);render()};init();</script></body></html>
