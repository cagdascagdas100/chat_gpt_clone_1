<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMS V005 geri çekilmiş başvuru sözleşmesi</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;color:#17202a}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #ccd1d1;padding:7px;vertical-align:top}th{background:#f4f6f7;position:sticky;top:0}.meta{margin:12px 0;padding:10px;border-left:4px solid #2c3e50;background:#f8f9f9}.ok{font-weight:700}</style></head><body><h1>RMS V005 geri çekilmiş başvuru sözleşmesi</h1><p>Resmî Environment Agency başvuru ilanı ve Companies House kimlik bağlamı; current permit veya yıllık emisyon değeri değildir.</p><div id="meta" class="meta">Yükleniyor…</div><table><thead><tr><th>Satır</th><th>Varlık</th><th>Grup</th><th>Alan</th><th>Değer</th><th>Güven</th><th>Semantik</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('rms_v005_withdrawn_contract_latest.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{const c=d.counts||{};document.getElementById('meta').innerHTML='<span class="ok">'+esc(d.status)+'</span> · satır '+esc(c.new_evidence_rows)+' · ≥99 '+esc(c.confidence_ge_99)+' · 100 '+esc(c.confidence_100)+' · ortalama '+esc(c.confidence_average);document.getElementById('rows').innerHTML=(d.rows||[]).map(x=>'<tr><td>'+esc(x.line)+'</td><td>'+esc(x.entity)+'</td><td>'+esc(x.group)+'</td><td>'+esc(x.field)+'</td><td>'+esc(x.value)+'</td><td>'+esc(x.confidence)+'</td><td>'+esc(x.semantics)+'</td><td>'+esc(x.source_id)+'</td></tr>').join('')}).catch(e=>document.getElementById('meta').textContent='HATA: '+e.message);</script></body></html>
