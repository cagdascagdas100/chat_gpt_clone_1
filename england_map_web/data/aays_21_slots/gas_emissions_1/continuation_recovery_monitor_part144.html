144_twelve_pi_apr_audit_held_20260729.json';const e=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part144 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.main_progress,c=[];const add=(g,s,x,r)=>c.push([c.length+1,g,s,x,r]);const addN=(g,s,k,x,r)=>{for(let i=1;i<=k;i++)add(g,s,x+' '+String(i).padStart(3,'0'),r)};addN('canonical_recovery','gas_emissions_1',8,'contract/owner/manual/heartbeat/queue/status/recovery/validation','RECORDED_BLOCKER_OPEN');d.candidate_audit.forEach(x=>add('scope_continuity',x.facility+' / '+x.permit,'Part138-Part143 candidate continuity','PASS_REVALIDATION_NOT_NEW_ROW'));d.candidate_audit.forEach(x=>addN('official_identity',x.facility+' / '+x.permit,6,'operator/permit/site/status/version/source checkpoint','PASS_OFFICIAL_IDENTITY'));d.candidate_audit.forEach(x=>addN('pi_row_integrity',x.facility+' / '+x.permit,7,'year/route/substance/value/method/provenance/permit checkpoint','PASS_PI_ROW'));d.candidate_audit.forEach(x=>addN('apr_retrieval',x.facility+' / '+x.permit,6,'file/year/value/unit/method/status checkpoint',x.apr_kg==null?'FAIL_CLOSED_'+x.apr_status:'PASS_APR_'+x.apr_status));d.candidate_audit.filter(x=>x.apr_kg!=null).forEach(x=>addN('pi_apr_agreement',x.facility+' / '+x.permit,6,'unit/year/delta/absolute-percent/tolerance/result checkpoint',x.result.startsWith('PASS')?'PASS_WITHIN_0_1_PERCENT':'OVER_TOLERANCE_QUARANTINED'));d.candidate_audit.filter(x=>x.apr_kg==null).forEach(x=>addN('unresolved_fail_closed',x.facility+' / '+x.permit,3,'no-inference/retry-bound/hold checkpoint','HELD_FAIL_CLOSED'));d.candidate_audit.forEach(x=>addN('candidate_hold_gate',x.facility+' / '+x.permit,5,'direct-EA/registry-duplicate/confidence/business-write/parcel checkpoint','HELD_NO_PROMOTION'));d.repository_searches.forEach(x=>add('repository_duplicate',x[0],'grouped GitHub indexed search',x[1]));add('canonical_registry_locator','457 satırlık kayıt','exact registry locator',d.registry_locator);addN('official_dataset','EA 2024 PI',8,'resource/file-id/download/no-retry/direct-row/licence/gate/checkpoint','DIRECT_ROW_ACCESS_BLOCKED');addN('quality','Part144',18,'fail-closed consistency checkpoint','PASS');document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part144</p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat_at)}. Uzun PENDING sürüyor; ikinci runner veya görev açılmadı.</div><div class="info"><b>Denetim:</b> 12 HELD tesisin 2024 PI değeri ile aynı yıl APR Annual CO₂ Mass değeri karşılaştırıldı. APR sayısı ${m.apr_numeric_rows_extracted}; mutabakat ${m.agreement_pass}; tolerans dışı ${m.agreement_over_tolerance}; fail-closed ${m.apr_unresolved_or_anomalous}.</div><div class="bad"><b>Karantina:</b> Newhurst %32,5384 ve Runcorn %0,3269 farkla %0,1 toleransını aştı. Doğrudan dosya adjudication olmadan hiçbir değer yükseltilmedi.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part144 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Kaynak ↑ ${m.source_upgrades}; yükseltilen satır ${m.promoted_candidates}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part144 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Denetlenen',m.facilities_audited],['APR çıkarılan',m.apr_numeric_rows_extracted],['Mutabakat',m.agreement_pass],['Tolerans dışı',m.agreement_over_tolerance],['Fail-closed',m.apr_unresolved_or_anomalous],['HELD',m.held_candidates],['Kaynak ↑',m.source_upgrades],['Yükseltilen satır',m.promoted_candidates],['Güven','%94–99'],['Direct PI',m.direct_pi],['Parsel',m.parcel_bindings]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td>${e(z[3])}</td><td class="${z[4].startsWith('PASS')?'ok':z[4].startsWith('OVER')||z[4].startsWith('FAIL')?'fail':'held'}">${e(z[4])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.candidate_rows.map(x=>`<tr><td>${e(x.facility)} / EPR-${e(x.permit)}</td><td>${n(x.pi_kg)}</td><td>${n(x.apr_kg)}</td><td>${n(x.delta_kg)}</td><td>${x.abs_delta_pct==null?'—':e(x.abs_delta_pct)+'%'}</td><td>${e(x.apr_status)}</td><td>${e(x.confidence)}%</td><td class="${x.result.startsWith('PASS')?'ok':x.result.startsWith('OVER')?'fail':'held'}">${e(x.result)}</td><td><a href="${e(x.identity_url)}" target="_blank" rel="noopener">resmî kimlik</a> · <a href="${e(x.numeric_url)}" target="_blank" rel="noopener">PI/APR kaynağı</a></td></tr>`).join('');if(c.length!==401||d.support_progress.after!==161878||d.candidate_rows.length!==12||m.facilities_audited!==12||m.apr_numeric_rows_extracted!==6||m.agreement_pass!==4||m.agreement_over_tolerance!==2||m.apr_unresolved_or_anomalous!==6||m.source_upgrades!==6||m.promoted_candidates!==0||m.rows!==0||m.direct_pi!==0||m.parcel_bindings!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
