<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 1 - Public Register Dağıtım Kanalları</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}.note{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}</style></head><body><h1>Public Register resmî dağıtım kanalları</h1><div class="note">Bu denetim erişim yollarını doğrular. CSV/binary byte, SHA-256, header ve satır sayısı doğrulanmadığı için emisyon veya parsel değeri üretilmez.</div><p id="meta">Yükleniyor…</p><table><thead><tr><th>Sıra</th><th>Kanal</th><th>Yayıncı</th><th>Durum</th><th>Kullanım</th></tr></thead><tbody id="body"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('official_public_register_distribution_audit_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{meta.textContent=`Resmî kanal: ${d.channel_pass}/${d.channel_count} · Byte: ${d.downloaded_bytes} · SHA-256: ${d.sha256_pass} · Şema: ${d.schema_header_pass} · Satır: ${d.verified_row_count}`;body.innerHTML=d.channels.map(x=>`<tr><td>${x.sequence}</td><td><a href="${esc(x.official_url)}" target="_blank" rel="noreferrer">${esc(x.channel)}</a></td><td>${esc(x.publisher)}</td><td class="ok">${esc(x.status)}</td><td>${esc(x.use)}</td></tr>`).join('')}).catch(()=>meta.textContent='Dağıtım audit JSON okunamadı');</script></body></html>
