ons_1_part149_ten_cross_year_control_expansion_held_20260729.json';const e=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part149 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.main_progress,c=[];Object.entries(d.support_progress.groups).forEach(([g,k])=>{for(let i=1;i<=k;i++){const result=g.includes('agreement')?'PASS_OR_QUARANTINE_RECORDED':g.includes('unavailable')?'HELD_FAIL_CLOSED':g.includes('hold')?'HELD_NO_PROMOTION':g.includes('dataset')?'DIRECT_ROW_ACCESS_BLOCKED':'PASS';c.push([c.length+1,g,'checkpoint '+String(i).padStart(3,'0'),result])}});document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part149</p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat_at)}. Uzun PENDING sürüyor; ikinci runner veya görev açılmadı.</div><div class="info"><b>Çapraz-yıl:</b> ${m.facilities_audited} tesis, ${m.year_slots_reviewed} yıl hücresi, ${m.year_pairs_compared} karşılaştırma. Tolerans içi ${m.agreement_pass}; tolerans dışı ${m.agreement_over_tolerance}; fail-closed ${m.year_pairs_unavailable}.</div><div class="bad"><b>Karantina:</b> Slough 2025 PI 514.409.728 kg ile APR 506.194.730 kg arasında %1,59698 fark var. Coventry 2025 PI değeri birim-ölçek anomalisi nedeniyle düzeltilmeden fail-closed tutuldu.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part149 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Kaynak ↑ ${m.source_upgrades}; yükseltilen satır ${m.promoted_candidates}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part149 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Tesis',m.facilities_audited],['Yıl hücresi',m.year_slots_reviewed],['Karşılaştırma',m.year_pairs_compared],['Mutabakat',m.agreement_pass],['Tolerans dışı',m.agreement_over_tolerance],['Fail-closed',m.year_pairs_unavailable],['İki-yıl kontrol',m.stable_two_year_controls],['2024-only kontrol',m.year_2024_only_controls],['Kaynak ↑',m.source_upgrades],['Yükseltilen satır',m.promoted_candidates],['Güven','%96–99']];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td class="${z[3].startsWith('PASS')?'ok':z[3].startsWith('DIRECT')?'fail':'held'}">${e(z[3])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.candidate_audit.map(x=>{const a=x.y2024,b=x.y2025,cls=(a.result.startsWith('PASS')&&b.result.startsWith('PASS'))?'ok':(a.result.startsWith('OVER')||b.result.startsWith('OVER'))?'fail':'held';return `<tr><td>${e(x.facility)} / EPR-${e(x.permit)}</td><td>${n(a.pi_kg)} / ${n(a.apr_kg)}</td><td>${a.abs_delta_pct==null?'—':e(a.abs_delta_pct)}</td><td>${n(b.pi_kg)} / ${n(b.apr_kg)}</td><td>${b.abs_delta_pct==null?'—':e(b.abs_delta_pct)}</td><td>${e(x.confidence)}%</td><td class="${cls}">${e(x.classification)}</td><td><a href="${e(x.identity_url)}" target="_blank" rel="noopener">resmî kimlik</a> · <a href="${e(x.numeric_url)}" target="_blank" rel="noopener">PI/APR kaynağı</a></td></tr>`}).join('');if(c.length!==620||d.support_progress.after!==164651||d.candidate_audit.length!==10||m.facilities_audited!==10||m.year_slots_reviewed!==20||m.year_pairs_compared!==15||m.agreement_pass!==14||m.agreement_over_tolerance!==1||m.year_pairs_unavailable!==5||m.source_upgrades!==10||m.promoted_candidates!==0||m.rows!==0||m.direct_pi!==0||m.parcel_bindings!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
