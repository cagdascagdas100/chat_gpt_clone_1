replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part165 HTTP '+r.status);return r.json()}).then(d=>{const m=d.m,p=d.progress,c=[];Object.entries(d.ops[3]).forEach(([g,k])=>{for(let i=1;i<=k;i++){let z='PASS';if(g.includes('no_annual')||g.includes('hold'))z='HELD_NO_EMISSION_PROMOTION';else if(g.includes('dataset'))z='DIRECT_ROW_ACCESS_BLOCKED';else if(g.includes('recovery'))z='RECORDED_BLOCKER_OPEN';else if(g.includes('integrity')||g.includes('retrieval')||g.includes('routing')||g.includes('availability'))z='PASS_OFFICIAL_COLLECTION_ROW';c.push([c.length+1,g,'checkpoint '+String(i).padStart(4,'0'),z])}});document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.at)}</code> · Part165 · HEAD <code>${e(d.head)}</code></p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat)}. Uzun PENDING sürüyor; ikinci runner veya görev açılmadı.</div><div class="info"><b>Kapsam:</b> ${m.audit} resmî 2025 IED kararı; koleksiyon başına 13 kayıt. ${m.permit} permit/variation, ${m.surrender} surrender, ${m.combined} birleşik; ${m.decision} Decision ve ${m.notice} Notice.</div><div class="good"><b>İlerleme:</b> ${p[0]}/${p[1]} = ${p[2]}% (Δ +${p[3]}). Part165 <b>${n(d.ops[1])}</b> işlem; kümülatif ${n(d.ops[2])}. Resmî kaynak ↑ ${m.upgrades}; CO₂ satırı ${m.rows}.</div>`;const cards=[['Genel',p[2]+'%'],['Ana işlem',p[0]+' / '+p[1]],['Part165 işlem',n(d.ops[1])],['Kümülatif',n(d.ops[2])],['Karar',m.audit],['A–F',m.af],['G–L',m.gl],['M–R',m.mr],['S–Z',m.sz],['Permit/variation',m.permit],['Surrender',m.surrender],['Birleşik',m.combined],['Decision',m.decision],['Notice',m.notice],['Resmî kaynak ↑',m.upgrades],['CO₂ satırı',m.rows],['Güven','%99']];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td class="${z[3].startsWith('PASS')?'ok':'held'}">${e(z[3])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.rows52.map(x=>`<tr><td>${e(x[1])} / ${e(x[2])}</td><td>${e(x[3])}</td><td>${e(x[4])}</td><td>${e(x[5])}</td><td>${e(x[6])}</td><td>${e(x[0])}</td><td>${e(x[7])}%</td><td class="held">HELD_NO_ANNUAL_EMISSION_ROW</td><td><a href="${e(x[8])}" target="_blank" rel="noopener">resmî kaynak</a></td></tr>`).join('');if(c.length!==4000||d.ops[2]!==193281||d.rows52.length!==52||m.audit!==52||m.af!==13||m.gl!==13||m.mr!==13||m.sz!==13||m.permit!==43||m.surrender!==8||m.combined!==1||m.decision!==28||m.notice!==24||m.upgrades!==52||m.no_emission!==52||m.promoted!==0||m.rows!==0||m.pi!==0||m.parcel!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
