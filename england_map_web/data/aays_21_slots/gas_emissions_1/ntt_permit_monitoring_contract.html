<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NTT V003 izleme sözleşmesi</title><style>body{font-family:system-ui;margin:24px;color:#17202a}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccd1d1;padding:8px;vertical-align:top}th{background:#f4f6f7}.ok{color:#196f3d}.warn{border-left:4px solid #c0392b;padding:10px;background:#fdf2e9}</style></head><body><h1>NTT Dagenham V003 permit, izleme ve performans sözleşmesi</h1><p class="warn">Kapasite, konsantrasyon limiti, izleme aralığı, yakıt/AdBlue tüketimi ve çalışma saati yıllık kirletici salım kütlesi değildir.</p><div id="summary">Yükleniyor…</div><table><thead><tr><th>Satır</th><th>Grup</th><th>Alan</th><th>Değer</th><th>Semantik</th><th>Kaynak bölümü</th><th>Güven</th></tr></thead><tbody id="rows"></tbody></table><script>fetch("ntt_permit_monitoring_contract_latest.json").then(r=>r.json()).then(d=>{document.getElementById("summary").innerHTML=`<strong>${d.counts.new_evidence_rows}</strong> satır · <strong>${d.counts.confidence_ge_99}/${d.counts.new_evidence_rows}</strong> ≥99 · gerçek tesis/parsel emisyonu 0/0`;document.getElementById("rows").innerHTML=d.rows.map(x=>`<tr><td>${x.line}</td><td>${x.group}</td><td>${x.field}</td><td>${x.value}</td><td>${x.semantics}</td><td>${x.source_ref}</td><td class="ok">${x.confidence}</td></tr>`).join("");document.body.dataset.acceptanceStatus=d.rows.length===40?"PASS":"FAIL"}).catch(e=>{document.getElementById("summary").textContent="Yükleme hatası: "+e;document.body.dataset.acceptanceStatus="FAIL"});</script></body></html>
