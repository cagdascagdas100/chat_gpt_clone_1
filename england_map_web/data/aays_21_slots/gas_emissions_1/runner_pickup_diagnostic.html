<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 1 - Runner Pickup Tanısı</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.card{background:#fff;border:1px solid #cfd8dc;padding:12px;min-width:170px}.big{font-size:25px;font-weight:700}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left;vertical-align:top}th{background:#eceff1}.notice{padding:12px;background:#f8d7da;border:1px solid #f1aeb5;margin:12px 0}.pass{font-weight:700}.fail{font-weight:700}.warn{font-weight:700}</style></head><body><h1>gas_emissions_1 — Runner pickup tanısı</h1><div class="notice">Kuyruk dosyaları mevcut ancak canonical runner heartbeat, claim veya output üretmiyor. Beklemek tek başına ilerleme sağlamaz.</div><div class="cards"><div class="card"><div>Kuyruk</div><div class="big" id="queued">4</div></div><div class="card"><div>Pickup</div><div class="big" id="pickup">0</div></div><div class="card"><div>Heartbeat</div><div class="big" id="heartbeat">0</div></div><div class="card"><div>Runner output</div><div class="big" id="output">0</div></div><div class="card"><div>Şimdi bekleme</div><div class="big" id="wait">0 dk</div></div><div class="card"><div>Runner açıldıktan sonra kontrol</div><div class="big" id="check">5 dk</div></div></div><p id="action"></p><table><thead><tr><th>#</th><th>Kontrol</th><th>Sonuç</th><th>Açıklama</th></tr></thead><tbody id="body"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('runner_pickup_diagnostic_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{queued.textContent=d.queued_task_count;pickup.textContent=d.pickup_evidence_count;heartbeat.textContent=d.heartbeat_count;output.textContent=d.runner_output_count;wait.textContent=d.recommended_wait_before_next_continue_minutes+' dk';check.textContent=d.recommended_check_interval_after_confirming_single_runner_active_minutes+' dk';action.textContent=d.operator_action;body.innerHTML=d.checks.map(x=>`<tr><td>${x.sequence}</td><td>${esc(x.check)}</td><td class="${String(x.result).toLowerCase()}">${esc(x.result)}</td><td>${esc(x.detail)}</td></tr>`).join('')}).catch(()=>{body.innerHTML='<tr><td colspan="4">Tanı verisi okunamadı</td></tr>'})</script></body></html>
