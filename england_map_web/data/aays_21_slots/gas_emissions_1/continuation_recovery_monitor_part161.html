<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gas_emissions_1 Part161</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;border-radius:7px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:11px;margin:12px 0}.good{background:#e8f5e9;border:1px solid #a5d6a7;padding:11px;margin:12px 0}.info{background:#e8f4fd;border:1px solid #9fc9e8;padding:11px;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0;font-size:12px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.held{color:#9a6700;font-weight:bold}.ok{color:#176b2c;font-weight:bold}.pager{display:flex;gap:8px;align-items:center;margin:10px 0}.pager button{padding:6px 10px}code,a{word-break:break-all}</style></head><body><h1>gas_emissions_1 — Part161 satır satır izleme</h1><div id="summary"></div><div id="cards" class="cards"></div><h2>2.300 doğrulama işlemi</h2><div class="pager"><button id="prev">← Önceki 50</button><span id="pageInfo"></span><button id="next">Sonraki 50 →</button></div><table><thead><tr><th>#</th><th>Grup</th><th>Kontrol</th><th>Sonuç</th></tr></thead><tbody id="checks"></tbody></table><h2>34 resmî Haziran 2026 kurulum kararı</h2><table><thead><tr><th>Başvuru</th><th>Başvuru sahibi</th><th>Adres</th><th>Tarih</th><th>EA bölgesi</th><th>Durum</th><th>Sayfa</th><th>Güven</th><th>Sonuç</th></tr></thead><tbody id="candidates"></tbody></table><script>const U='https://raw.githubusercontent.com/cagdascagdas100/chat_gpt_clone_1/codex/aays-single-runner-v5-20260706/docs/chatgpt_status/gas_emissions/shards/gas_emissions_1/reports/gas_emissions_1_part161_thirty_four_june_2026_installations_decision_audit_held_20260730.json';const e=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part161 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.main_progress,c=[];Object.entries(d.support_progress.groups).forEach(([g,k])=>{for(let i=1;i<=k;i++){let z='PASS';if(g.includes('no_emission')||g.includes('hold'))z='HELD_NO_EMISSION_PROMOTION';else if(g.includes('dataset'))z='DIRECT_ROW_ACCESS_BLOCKED';else if(g.includes('recovery'))z='RECORDED_BLOCKER_OPEN';else if(g.includes('screenshot')||g.includes('transcription')||g.includes('integrity'))z='PASS_OFFICIAL_PDF_ROW';c.push([c.length+1,g,'checkpoint '+String(i).padStart(4,'0'),z])}});document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part161 · HEAD <code>${e(d.source_head)}</code></p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat_at)}. Uzun PENDING sürüyor; ikinci runner veya görev açılmadı.</div><div class="info"><b>Kapsam:</b> ${m.audit_records} resmî karar satırı; ${m.issued_status_rows} Issued. PDF'nin ${m.pdf_pages_checked} sayfası hem metin hem görsel olarak kontrol edildi. Suffix dağılımı V=${m.v_suffix_rows}, C=${m.c_suffix_rows}, S=${m.s_suffix_rows}; suffix anlamı çıkarılmadı.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part161 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Resmî kaynak ↑ ${m.source_upgrades}; CO₂ satırı ${m.rows}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part161 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Karar satırı',m.audit_records],['Issued',m.issued_status_rows],['V suffix',m.v_suffix_rows],['C suffix',m.c_suffix_rows],['S suffix',m.s_suffix_rows],['PDF sayfası',m.pdf_pages_checked],['Resmî kaynak ↑',m.source_upgrades],['CO₂ satırı',m.rows],['Yükseltilen satır',m.promoted_candidates],['Güven','%100']];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td class="${z[3].startsWith('PASS')?'ok':'held'}">${e(z[3])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.candidate_audit.map(x=>`<tr><td>${e(x.app_ref)}</td><td>${e(x.applicant)}</td><td>${e(x.address)}</td><td>${e(x.determined_date)}</td><td>${e(x.ea_area)}</td><td class="ok">${e(x.status)}</td><td><a href="${e(d.official_source.source_url)}#page=${e(x.pdf_page)}" target="_blank" rel="noopener">${e(x.pdf_page)}</a></td><td>${e(x.confidence)}%</td><td class="held">${e(x.result)}</td></tr>`).join('');if(c.length!==2300||d.support_progress.after!==179681||d.candidate_audit.length!==34||m.audit_records!==34||m.issued_status_rows!==34||m.v_suffix_rows!==30||m.c_suffix_rows!==1||m.s_suffix_rows!==3||m.pdf_pages_checked!==4||m.official_primary_source_upgrades!==34||m.no_annual_emission_rows!==34||m.promoted_candidates!==0||m.rows!==0||m.direct_pi!==0||m.parcel_bindings!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
