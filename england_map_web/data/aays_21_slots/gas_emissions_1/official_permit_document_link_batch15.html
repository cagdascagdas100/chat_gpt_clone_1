<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 1 - Batch15 Belge Bağlantısı Denetimi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{font-weight:700}.blocked{font-weight:700}.note{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}</style></head><body><h1>Batch15 permit belge-link kapsamı</h1><div class="note">Yalnız exact Public Register permit sayfasında görünür resmî belge bağlantısı denetlenir. PDF içerikleri indirilmemiş veya emisyon verisi olarak ayrıştırılmamıştır.</div><p id="meta">Yükleniyor…</p><table><thead><tr><th>Permit</th><th>Tesis</th><th>Exact permit sayfası</th><th>IED belge linki</th><th>Belge içeriği</th><th>Sonuç</th></tr></thead><tbody id="body"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('official_permit_location_examples_batch15_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.candidates||[],pass=a.filter(x=>x.permit_document_link_visible).length;meta.textContent=`Permit sayfası: ${a.length}/${a.length} · Görünür IED belge linki: ${pass}/${a.length} · İndirilen belge: 0`;body.innerHTML=a.map(x=>`<tr><td>${esc(x.permit_number)}</td><td>${esc(x.site_name)}</td><td class="ok"><a href="${esc(x.source_url)}" target="_blank" rel="noreferrer">PASS</a></td><td class="${x.permit_document_link_visible?'ok':'blocked'}">${x.permit_document_link_visible?'PASS':'YOK'}</td><td>İndirilmedi</td><td>${x.permit_document_link_visible?'LINK_PASS':'PRIMARY_ONLY'}</td></tr>`).join('')}).catch(()=>meta.textContent='Batch15 JSON okunamadı');</script></body></html>
