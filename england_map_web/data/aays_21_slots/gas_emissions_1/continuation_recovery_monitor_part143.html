','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part143 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.main_progress,c=[];const add=(g,s,x,r)=>c.push([c.length+1,g,s,x,r]);const addN=(g,s,k,x,r)=>{for(let i=1;i<=k;i++)add(g,s,x+' '+String(i).padStart(3,'0'),r)};addN('canonical_recovery','gas_emissions_1',8,'contract/owner/manual/heartbeat/queue/status/recovery/validation','RECORDED_BLOCKER_OPEN');d.candidate_audit.forEach(x=>addN('official_identity',x.facility+' / '+x.permit,8,'operator/permit/site/status/activity/date/version/source checkpoint','PASS_OFFICIAL_IDENTITY'));d.candidate_audit.forEach(x=>addN('pi_row_integrity',x.facility+' / '+x.permit,7,'year/route/substance/value/method/provenance/permit checkpoint','PASS_PI_ROW'));d.candidate_audit.forEach(x=>addN('apr_row_integrity',x.facility+' / '+x.permit,7,'year/entry/tonnes/conversion/method/provenance/permit checkpoint','PASS_APR_ROW'));d.candidate_audit.forEach(x=>addN('pi_apr_agreement',x.facility+' / '+x.permit,6,'unit/year/delta/absolute-percent/tolerance/result checkpoint','PASS_WITHIN_0_1_PERCENT'));d.candidate_audit.forEach(x=>addN('candidate_hold_gate',x.facility+' / '+x.permit,5,'direct-EA/registry-duplicate/confidence/business-write/parcel checkpoint','HELD_NO_PROMOTION'));d.candidate_audit.forEach(x=>add('prior_scope_exclusion',x.facility+' / '+x.permit,'Part136-Part142 candidate identity continuity','PASS_REVALIDATION_NOT_NEW_ROW'));addN('official_dataset','EA 2024 PI',8,'resource/file-id/download/no-retry/direct-row/licence/gate/checkpoint','DIRECT_ROW_ACCESS_BLOCKED');d.repository_searches.forEach(x=>add('repository_duplicate',x[0],'grouped GitHub indexed search',x[1]));add('canonical_registry_locator','457 satırlık kayıt','exact registry locator',d.registry_locator);addN('quality','Part143',18,'fail-closed consistency checkpoint','PASS');document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part143</p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat_at)}. Uzun PENDING sürüyor; ikinci runner veya görev açılmadı.</div><div class="info"><b>Doğruluk:</b> 10 mevcut HELD adayın 2024 PI kg değeri, aynı yıl APR Annual CO₂ Mass ton değeri ×1.000 ile karşılaştırıldı. 10/10 sonuç %0,1 tolerans içinde; en büyük fark ${e(m.max_abs_delta_facility)} için %${e(m.max_abs_delta_pct)}.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part143 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Yeniden doğrulanan ${m.revalidated_candidates}; kaynak ↑ ${m.source_upgrades}; yükseltilen satır ${m.promoted_candidates}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part143 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Yeniden doğrulanan',m.revalidated_candidates],['Mutabakat',m.dual_source_agreement_pass+' / '+m.revalidated_candidates],['Tolerans dışı',m.dual_source_over_tolerance],['HELD aday',m.held_candidates],['Yükseltilen satır',m.promoted_candidates],['Kaynak ↑',m.source_upgrades],['Resmî kimlik',m.official_identity_refreshes],['2024 PI satırı',m.secondary_pi_rows],['2024 APR satırı',m.secondary_apr_rows],['Güven','%97–99'],['Direct PI',m.direct_pi],['Parsel',m.parcel_bindings]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td>${e(z[3])}</td><td class="${z[4].startsWith('PASS')?'ok':'held'}">${e(z[4])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.candidate_rows.map(x=>`<tr><td>${e(x.facility)} / EPR-${e(x.permit)}</td><td>${n(x.pi_kg)}</td><td>${n(x.apr_kg)}</td><td>${n(x.delta_kg)}</td><td>${e(x.abs_delta_pct)}%</td><td>${e(x.confidence)}%</td><td class="held">${e(x.state)}</td><td><a href="${e(x.identity_url)}" target="_blank" rel="noopener">resmî kimlik</a> · <a href="${e(x.numeric_url)}" target="_blank" rel="noopener">PI+APR kaynağı</a></td></tr>`).join('');if(c.length!==385||d.support_progress.after!==161477||d.candidate_rows.length!==10||m.revalidated_candidates!==10||m.dual_source_agreement_pass!==10||m.dual_source_over_tolerance!==0||m.source_upgrades!==10||m.promoted_candidates!==0||m.rows!==0||m.direct_pi!==0||m.parcel_bindings!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
