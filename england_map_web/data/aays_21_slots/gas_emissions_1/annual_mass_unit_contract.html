<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yıllık kütle birimi sözleşmesi</title><style>body{font-family:system-ui;margin:24px;color:#17202a}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #ccd1d1;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f4f6f7}.ok{font-weight:700}small{color:#566573}</style></head><body><h1>PRTR/PI yıllık kütle birimi kapısı V3</h1><p>Resmî havaya yıllık salım kayıtları için birim kabulü, normalizasyon, NO_DATA ve parsel bağlama kuralları.</p><p id="summary">Yükleniyor…</p><table><thead><tr><th>Satır</th><th>Grup</th><th>Bulgu</th><th>Doğruluk</th><th>Semantik</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('annual_mass_unit_contract_latest.json').then(r=>r.json()).then(d=>{summary.textContent=`${d.counts.new_evidence_rows} satır · ≥99: ${d.counts.confidence_ge_99} · 100: ${d.counts.confidence_100} · ortalama ${d.counts.confidence_average}`;rows.innerHTML=d.rows.map(x=>`<tr><td>${x.line}</td><td>${x.group}</td><td>${x.finding}</td><td class="ok">${x.confidence}</td><td><small>${x.semantics}</small></td></tr>`).join('')}).catch(e=>summary.textContent='Veri yüklenemedi: '+e);</script></body></html>
