.replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(R,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part172 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.progress,o=d.operations,c=[];Object.entries(o.breakdown).forEach(([g,k])=>{for(let i=1;i<=k;i++){let z='PASS';if(g.includes('no_annual')||g.includes('hold'))z='HELD_NO_EMISSION_PROMOTION';else if(g.includes('recovery'))z='RECORDED_BLOCKER_OPEN';else if(g.includes('accessibility'))z='PASS_OFFICIAL_SOURCE';else if(g.includes('transcription'))z='PASS_EXACT_FIELD_TRANSCRIPTION';c.push([c.length+1,g,'checkpoint '+String(i).padStart(4,'0'),z])}});document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.created_at)}</code> · Part172 · HEAD <code>${e(d.source_head)}</code></p><div class="warn"><b>Runner:</b> ${e(d.runner_recovery.queue_status)}; son heartbeat ${e(d.runner_recovery.shared_runner_last_heartbeat_at)}. Uzun PENDING sürüyor; ikinci runner veya mantıksal görev açılmadı.</div><div class="info"><b>Kapsam:</b> ${m.candidates} resmî 2026 IED adayı; ${m.permit_or_variation} permit/variation, ${m.surrender} surrender. Her satırda posta kodu, işletmeci, permit, tarih, işlem, belge ve kaynak birebir kontrol edildi.</div><div class="good"><b>İlerleme:</b> ${p.completed_operations}/${p.total_operations} = ${p.evidence_gated_percent}% (Δ +${p.increase_percentage_points_this_pass}). Part172 <b>${n(o.this_pass)}</b> işlem; kümülatif ${n(o.cumulative)}. Resmî kaynak ↑ ${m.official_source_upgrades}; aday ${m.candidates}; yıllık emisyon satırı ${m.business_rows_written}.</div>`;const cards=[['Genel',p.evidence_gated_percent+'%'],['Ana işlem',p.completed_operations+' / '+p.total_operations],['Part172 işlem',n(o.this_pass)],['Kümülatif',n(o.cumulative)],['Aday',m.candidates],['Permit/variation',m.permit_or_variation],['Surrender',m.surrender],['Decision',m.decision_documents],['Notice',m.notice_documents],['Açık permit ref',m.explicit_permit_references],['Resmî kaynak ↑',m.official_source_upgrades],['HELD',m.held_no_annual_emission_row],['Promote',m.promoted_candidates],['İş satırı',m.business_rows_written],['Güven','%'+m.confidence_min],['Engellenen güvensiz',m.unsafe_promotions_prevented]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td class="${z[3].startsWith('PASS')?'ok':'held'}">${e(z[3])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.rows.map(x=>`<tr><td>${e(x.postcode)}</td><td>${e(x.operator)}</td><td>${e(x.permit_ref)}</td><td>${e(x.date)}</td><td>${e(x.action)}</td><td>${e(x.document)}</td><td>${e(x.confidence)}%</td><td class="held">${e(x.outcome)}</td><td><a href="${e(d.sources[x.source_key])}" target="_blank" rel="noopener">resmî kaynak</a></td></tr>`).join('');if(c.length!==350||o.this_pass!==350||o.cumulative!==226731||d.rows.length!==16||m.candidates!==16||m.permit_or_variation!==9||m.surrender!==7||m.decision_documents!==9||m.notice_documents!==7||m.explicit_permit_references!==16||m.official_source_upgrades!==6||m.held_no_annual_emission_row!==16||m.promoted_candidates!==0||m.business_rows_written!==0||m.direct_official_annual_rows_read!==0||m.parcel_bindings!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.messa
