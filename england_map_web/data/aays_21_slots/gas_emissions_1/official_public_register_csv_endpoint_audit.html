<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 1 - Public Register CSV Denetimi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left}th{background:#eceff1}.ok{font-weight:700}.blocked{font-weight:700}.note{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}</style></head><body><h1>Public Register CSV endpoint denetimi</h1><div class="note">Endpoint doğrulanmıştır; iki ayrı turdaki web ve container denemelerine rağmen dosya byte'ları, header şeması ve satır sayısı alınamamıştır. Bu nedenle emisyon veya parsel verisi üretilmez.</div><p id="meta">Yükleniyor…</p><table><thead><tr><th>Sıra</th><th>Kontrol</th><th>Durum</th><th>Kanıt / sonuç</th></tr></thead><tbody id="body"></tbody></table><script>fetch('official_public_register_csv_endpoint_audit_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const rows=[['1','Sonuç sayfasında CSV indirme bağlantısı',d.result_page_download_link_verified,'Download results [csv] bağlantısı görüldü'],['2','Kesin CSV endpoint',d.exact_csv_endpoint_verified,d.csv_endpoint_url],['3','Yayıncı',d.publisher_verified,'Environment Agency / Defra Data Services Platform'],['4','Lisans',d.conditional_licence_visible,'Environment Agency Conditional Licence'],['5','Web fetch denemeleri',false,`${d.web_fetch_attempt_count||1} deneme · ${d.web_fetch_result}`],['6','Container download denemeleri',false,`${d.container_fetch_attempt_count||1} deneme · ${d.container_download_result||d.container_fetch_result}`],['7','Container HTTP/DNS',false,d.container_http_result||d.container_fetch_result],['8','İndirilen byte / SHA-256',false,`${d.downloaded_bytes} byte · SHA-256 doğrulanmadı`],['9','Header / satır / permit üyeliği',false,`${d.verified_header_count} header · ${d.verified_row_count} satır · ${d.permit_membership_checks_completed} üyelik kontrolü`],['10','Güvenli kullanım kararı',false,d.safe_use_status]];meta.textContent=`Endpoint: doğrulandı · Retry: ${d.web_fetch_attempt_count||1}/${d.container_fetch_attempt_count||1} · Byte: ${d.downloaded_bytes} · Şema: doğrulanmadı`;body.innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="${x[2]?'ok':'blocked'}">${x[2]?'PASS':'BLOCKED'}</td><td>${x[3]}</td></tr>`).join('')}).catch(()=>meta.textContent='CSV audit JSON okunamadı');</script></body></html>
