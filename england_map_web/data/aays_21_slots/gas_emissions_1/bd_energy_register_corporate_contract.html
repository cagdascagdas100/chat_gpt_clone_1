<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B&D Energy resmî kayıt ve şirket kanıtı</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;color:#17202a}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccd1d1;padding:8px;text-align:left;vertical-align:top}th{background:#f4f6f7}.ok{padding:10px;border-left:4px solid #1e8449;background:#eafaf1}.warn{padding:10px;border-left:4px solid #b9770e;background:#fef9e7}</style></head><body><h1>B&D Energy — resmî permit, şirket ve venue zinciri</h1><p class="warn">Permit, şirket, PSC, officer, filing ve venue yönetimi satırları kimlik kanıtıdır; yıllık kirletici salımı, permit transferi veya parsel geometrisi değildir.</p><p id="summary">Yükleniyor…</p><table><thead><tr><th>Satır</th><th>Grup</th><th>Alan</th><th>Değer</th><th>Güven</th><th>Kaynak</th><th>Semantik</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('bd_energy_register_corporate_contract_latest.json').then(r=>r.json()).then(d=>{const b=document.getElementById('rows');for(const x of d.rows){const tr=document.createElement('tr');for(const v of [x.line,x.group,x.field,x.value,x.confidence,x.source_id,x.semantics]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}b.appendChild(tr)}document.getElementById('summary').className='ok';document.getElementById('summary').textContent=`${d.counts.new_evidence_rows} satır · ≥99: ${d.counts.confidence_ge_99} · 100: ${d.counts.confidence_100} · ortalama ${d.counts.confidence_average}`;document.body.dataset.acceptanceStatus=d.rows.length===40?'PASS':'FAIL'}).catch(e=>{document.getElementById('summary').textContent='Yükleme hatası: '+e;document.body.dataset.acceptanceStatus='FAIL'})</script></body></html>
