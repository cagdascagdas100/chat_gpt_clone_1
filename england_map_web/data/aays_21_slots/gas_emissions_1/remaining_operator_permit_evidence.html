<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalan operatör ve izin kanıtı</title><style>body{font-family:system-ui;margin:24px;color:#17202a}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #ccd1d1;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f4f6f7}.ok{font-weight:700}small{color:#566573}</style></head><body><h1>Ford, WasteCare, E.ON ve Biffa/Jenkins Lane</h1><p>Resmî permit ve Companies House kimlik zinciri. Bu satırlar emisyon ölçümü veya parsel geometrisi değildir.</p><p id="summary">Yükleniyor…</p><table><thead><tr><th>Satır</th><th>Varlık</th><th>Alan</th><th>Değer</th><th>Doğruluk</th><th>Kaynak kodu</th><th>Semantik</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('remaining_operator_permit_evidence_latest.json').then(r=>r.json()).then(d=>{summary.textContent=`${d.counts.new_evidence_rows} satır · ≥99: ${d.counts.confidence_ge_99} · 100: ${d.counts.confidence_100} · ortalama ${d.counts.confidence_average}`;rows.innerHTML=d.rows.map(x=>`<tr><td>${x.line}</td><td>${x.entity}</td><td>${x.field}</td><td>${x.value}</td><td class="ok">${x.confidence}</td><td>${x.source}</td><td><small>${x.semantics}</small></td></tr>`).join('')}).catch(e=>summary.textContent='Veri yüklenemedi: '+e);</script></body></html>
