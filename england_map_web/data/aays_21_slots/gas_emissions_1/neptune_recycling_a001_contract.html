<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neptune Recycling A001 issued-permit sözleşmesi</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;color:#17202a}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #ccd1d1;padding:8px;text-align:left;vertical-align:top}th{background:#f4f6f7;position:sticky;top:0}.ok{border-left:4px solid #1e8449;padding:10px;background:#eafaf1}.warn{border-left:4px solid #b9770e;padding:10px;background:#fef9e7}code{white-space:normal}</style></head><body><h1>Neptune Recycling A001 issued-permit sözleşmesi</h1><p>Resmî Environment Agency permit ve Companies House kimlik kanıtı; kapasite, throughput ve raporlama verileri yıllık kirletici salımı değildir.</p><div id="summary">Yükleniyor…</div><table><thead><tr><th>Satır</th><th>Varlık</th><th>Grup</th><th>Alan</th><th>Değer</th><th>Doğruluk</th><th>Semantik</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><script>fetch("neptune_recycling_a001_contract_latest.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{const c=d.counts||{};document.getElementById("summary").innerHTML=`<p class="ok"><strong>${c.new_evidence_rows||0} satır</strong> · ≥99: ${c.confidence_ge_99||0} · 100: ${c.confidence_100||0} · ortalama: ${c.confidence_average||0}</p><p class="warn">${d.quality_gate||""}</p>`;document.getElementById("rows").innerHTML=(d.rows||[]).map(x=>`<tr><td>${x.line}</td><td>${x.entity}</td><td>${x.group}</td><td>${x.field}</td><td>${x.value}</td><td>${x.confidence}</td><td><code>${x.semantics}</code></td><td>${x.source_id}</td></tr>`).join("")}).catch(e=>{document.getElementById("summary").textContent="Yükleme hatası: "+e.message});</script></body></html>
