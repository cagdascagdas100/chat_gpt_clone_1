<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gas Emissions 1 - Permit Kalite Denetimi</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.card{background:#fff;border:1px solid #cfd8dc;padding:12px;min-width:170px}.big{font-size:26px;font-weight:700}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left}th{background:#eceff1}.notice{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}.ok{font-weight:700}</style></head>
<body><h1>gas_emissions_1 — Permit kalite denetimi</h1>
<div class="notice">Bu denetim konum ve kaynak bütünlüğünü kontrol eder; emisyon değeri veya parsel ölçümü değildir.</div>
<div class="cards"><div class="card"><div>Satır</div><div class="big" id="rows">18</div></div><div class="card"><div>Tekil permit</div><div class="big" id="permit">18/18</div></div><div class="card"><div>Tekil grid</div><div class="big" id="grid">18/18</div></div><div class="card"><div>Koordinat</div><div class="big" id="coord">18/18</div></div><div class="card"><div>Resmî kaynak</div><div class="big" id="official">18/18</div></div><div class="card"><div>Emisyon/parsel</div><div class="big">0 / 0</div></div></div>
<table><thead><tr><th>Kontrol</th><th>Başarılı</th><th>Toplam</th><th>Durum</th></tr></thead><tbody id="body"></tbody></table>
<script>fetch('official_permit_quality_audit_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const c=d.checks;const checks=[['Tekil permit ID',c.unique_permit_id_pass],['Tekil OS Grid',c.unique_os_grid_reference_pass],['Etkin permit',c.effective_status_pass],['Environment Agency resmî alan adı',c.official_environment_data_domain_pass],['Easting aralığı',c.easting_range_pass],['Northing aralığı',c.northing_range_pass],['Enlem aralığı',c.latitude_range_pass],['Boylam aralığı',c.longitude_range_pass],['Konum kanıtı 4/4',c.location_evidence_score_4_of_4_pass],['Emisyon boş güvenliği',c.emission_value_null_safety_pass],['Parsel boş güvenliği',c.parcel_id_null_safety_pass]];document.querySelector('#rows').textContent=d.row_count;document.querySelector('#permit').textContent=`${c.unique_permit_id_pass}/${d.row_count}`;document.querySelector('#grid').textContent=`${c.unique_os_grid_reference_pass}/${d.row_count}`;document.querySelector('#coord').textContent=`${Math.min(c.easting_range_pass,c.northing_range_pass,c.latitude_range_pass,c.longitude_range_pass)}/${d.row_count}`;document.querySelector('#official').textContent=`${c.official_environment_data_domain_pass}/${d.row_count}`;document.querySelector('#body').innerHTML=checks.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${d.row_count}</td><td class="ok">${x[1]===d.row_count?'PASS':'BLOCKED'}</td></tr>`).join('');}).catch(()=>{document.querySelector('#body').innerHTML='<tr><td colspan="4">Kalite JSON okunamadı</td></tr>'});</script></body></html>
