}<br><b>${e(z[1])}</b></div>`).join('');document.getElementById('checks').innerHTML=checks.map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td>${e(z[3])}</td><td class="${z[4]==='PASS'?'ok':z[4]==='FAIL_CLOSED'?'closed':'pending'}">${e(z[4])}</td></tr>`).join('');document.getElementById('upgrades').innerHTML=d.source_upgrades.map(x=>`<tr><td>${e(x.scope)}</td><td>${e(x.permit)}</td><td>${e(x.role)}</td><td>${e(x.confidence)}%</td><td>${e(x.evidence)}</td></tr>`).join('');document.getElementById('sources').innerHTML=[...d.official_identity_sources,...d.official_source_paths].map(x=>`<tr><td>${e(x.publisher)}</td><td>${e(x.role)}</td><td>${e(x.confidence)}%</td><td>${e(x.evidence||x.retrieval)}</td><td><a href="${e(x.url)}" target="_blank" rel="noopener">aç</a></td></tr>`).join('');document.getElementById('screened').innerHTML=d.screened_not_promoted.map(x=>`<tr><td>${e(x.scope)}</td><td>${e(x.result)}</td></tr>`).join('');if(checks.length!==2400||s.this_pass!==2400||s.after!==25188||d.source_upgrades.length!==8||d.official_identity_sources.length!==10||d.duplicate_audit.length!==10||d.screened_not_promoted.length!==8||m.new_candidate_rows!==0||m.source_upgrade_groups!==8||m.official_identity_validations!==10||m.official_identity_upgrades!==9||m.duplicate_matches!==0||m.historical_candidate_registry_after!==433||m.active_confidence_ge99_after!==220||m.active_all_confidence_nonheld_after!==429||m.direct_official_pi_rows_read!==0||m.measured_emission_rows!==0||m.parcel_bindings!==0)throw Error('strict render gate')}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
