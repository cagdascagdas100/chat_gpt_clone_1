dan resmî PI satırı ve kesin 457 satırlık duplicate taraması olmadığından aday eklenmedi.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part122 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Tesis ${m.facilities}; satır ${m.rows}; kaynak ↑ ${m.source_upgrades}; yeni aday ${m.new_candidates}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part122 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Yeni satır',m.rows],['Tesis',m.facilities],['Ölçülen',m.measured],['Tahmin',m.estimated],['Hesaplanan',m.calculated],['Sayısal güven','%98'],['Kimlik','%100'],['Kaynak ↑',m.source_upgrades],['Yeni aday',m.new_candidates],['Aktif ≥%99',m.active_ge99],['Aktif tüm',m.active_nonheld],['Tarihsel',m.historical],['Direct PI',m.direct_pi],['Parsel',m.parcel_bindings]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td>${e(z[3])}</td><td class="${z[4]==='PASS'?'ok':z[4].includes('BLOCKED')?'fail':'pending'}">${e(z[4])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('rows').innerHTML=d.candidate_rows.map(x=>`<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td>${n(x[3])}</td><td>${e(x[4])}</td><td>98%</td><td>${e(x[5])}%</td></tr>`).join('');document.getElementById('scope').
