Id('pageInfo').textContent=`${a+1}-${b} / ${checks.length} · sayfa ${page+1}/${Math.ceil(checks.length/sz)}`;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=b>=checks.length};document.getElementById('prev').onclick=()=>{if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{if((page+1)*sz<checks.length){page++;render()}};render();document.getElementById('audit').innerHTML=d.scope_audit.map(x=>`<tr><td>${e(x.scope)}</td><td>${e(x.result)}</td><td>${e(x.evidence)}</td></tr>`).join('');document.getElementById('sources').innerHTML=d.source_evidence.map(x=>`<tr><td>${e(x.publisher)}</td><td>${e(x.role)}</td><td>${e(x.confidence)}%</td><td><a href="${e(x.url)}" target="_blank" rel="noopener">aç</a></td></tr>`).join('');document.getElementById('screened').innerHTML=d.screened_not_promoted.map(x=>`<tr><td>${e(x.scope)}</td><td>${e(x.result)}</td></tr>`).join('');const official=d.source_evidence.filter(x=>x.role.includes('OFFICIAL_FACILITY_PERMIT')||x.role.includes('OFFICIAL_PERMIT_APPLICATION')).length;if(checks.length!==15000||s.this_pass!==15000||s.after!==134788||d.scope_audit.length!==10||d.screened_not_promoted.length!==8||d.new_candidates.length!==0||m.new_candidate_rows!==0||m.scope_validations!==10||m.internet_source_rechecks!==9||m.no_data_semantic_guards!==8||official!==6||m.official_identity_refreshes!==6||m.official_source_path_revalidations!==1||m.historical_candidate_registry_after!==457||m.active_confidence_ge99_after!==220||m.active_all_confidence_nonheld_after!==453||m.direct_official_pi_rows_read!==0||m.measured_emission_rows!==0||m.parcel_bindings!==0)throw Error('strict render gate')}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
