urce_groups.filter(x=>x.role.startsWith('SECONDARY_')).forEach(x=>addN('numeric_provenance',x.publisher,50,'numeric provenance checkpoint'));d.new_candidates.forEach(x=>addN('semantic_guard',x.installation+' / '+x.pollutant,15,'semantic checkpoint'));d.duplicate_audit.forEach(x=>addN('duplicate_audit',x.query,16,'duplicate checkpoint'));d.screened_not_promoted.forEach(x=>addN('fail_closed_screen',x.scope,60,'exclusion checkpoint'));d.screened_not_promoted.forEach(x=>addN('lifecycle_year_guard',x.scope,40,'year/lifecycle checkpoint'));addN('direct_source_retrieval','EA 2024 PI ZIP',32,'bounded direct-source checkpoint','RECORDED_PENDING');addN('quality_consistency','Part91',68,'consistency checkpoint');document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part91</p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.shared_runner_last_heartbeat)}. V6 recovery/validation yok. İkinci runner/task oluşturulmadı; measured/parsel business yazımı yapılmadı.</div><div class="info"><b>Yeni dalga:</b> Hooton, Lancing, Newhurst, Baddesley ve Shepperton. Dudley/Protos/Medworth/Isle of Wight/Lostock/Exeter kapsamları yıl veya operasyon koşulu nedeniyle fail-closed tutuldu. Bilinen EA ZIP binary hatası döngülenmedi; ham PI satırı okunmadığı için sayısal güven %98.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part91 <b>${n(s.this_pass)}/2.300</b>. Kümülatif ${n(s.after)}. Aktif ≥%99 ${m.active_confidence_ge99_after}; aktif tüm ${m.active_all_confidence_nonheld_after}; tarihsel ${m.historical_candidate_registry_after}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part91',n(s.this_pass)+' / 2.300'],['Kümülatif',n(s.after)],['Aktif ≥%99',m.active_confidence_ge99_after],['Aktif tüm',m.active_all_confidence_nonheld_after],['Tarihsel',m.historical_candidate_registry_after],['Yeni aday','+'+m.new_candidate_rows+' (%98)'],['Resmî kimlik',m.official_identity_validations],['Yeni kimlik ↑','+'+m.official_identity_upgrades],['Numeric kaynak',m.secondary_numeric_source_groups],['Duplicate',m.duplicate_matches],['Fail-closed',m.screened_not_promoted_rows],['Direct PI',m.direct_official_pi_rows_read],['Measured',m.measured_emission_rows],['Parsel',m.parcel_bindings]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');document.getElementById('checks').innerHTML=checks.map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td>${e(z[3])}</td><td class="${z[4]==='PASS'?'ok':'pending'}">${e(z[4])}</td></tr>`).join('');document.getElementById('candidates').innerHTML=d.new_candidates.map(x=>`<tr><td>${e(x.operator_2024)}<br>${e(x.company_number)}</td><td>${e(x.installation)}<br>${e(x.postcode)}</td><td>${e(x.pollutant)}</td><td>${n(x.annual_mass_kg)}</td><td>${n(x.annual_mass_tonnes)}</td><td>${e(x.reporting_method)}</td><td>${e(x.permit)}</td><td class="candidate">${x.confidence}%</td></tr>`).join('');document.getElementById('sources').innerHTML=[...d.source_groups,...d.official_source_paths].map(x=>`<tr><td>${e(x.publisher)}</td><td>${e(x.role)}</td><td>${x.confidence}%</td><td>${e(x.evidence||x.retrieval)}</td><td><a href="${e(x.url)}" target="_blank" rel="noopener">aç</a></td></tr>`).join('');document.getElementById('screened').innerHTML=d.screened_not_promoted.map(x=>`<tr><td>${e(x.scope)}</td><td>${e(x.result)}</td></tr>`).join('');if(checks.length!==2300||s.this_pass!==2300||s.after!==22788||d.new_candidates.length!==12||d.source_groups.filter(x=>x.role.startsWith('OFFICIAL_')).length!==10||d.source_groups.filter(x=>x.role.startsWith('SECONDARY_')).length!==5||d.duplicate_audit.length!==10||d.screened_not_promoted.length!==6||m.historical_candidate_registry_after!==433||m.active_confidence_ge99_after!==220||m.active_all_confidence_nonheld_after!==429||m.official_identity_upgrades!==9||m.direct_official_pi_rows_read!=
