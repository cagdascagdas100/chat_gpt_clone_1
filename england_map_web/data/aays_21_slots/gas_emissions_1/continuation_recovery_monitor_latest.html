<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gas_emissions_1 Part159</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;border-radius:7px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:11px;margin:12px 0}.good{background:#e8f5e9;border:1px solid #a5d6a7;padding:11px;margin:12px 0}.info{background:#e8f4fd;border:1px solid #9fc9e8;padding:11px;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0;font-size:12px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.held{color:#9a6700;font-weight:bold}.ok{color:#176b2c;font-weight:bold}.pager{display:flex;gap:8px;align-items:center;margin:10px 0}.pager button{padding:6px 10px}code,a{word-break:break-all}</style></head><body><h1>gas_emissions_1 — Part159 satır satır izleme</h1><div id="summary"></div><div id="cards" class="cards"></div><h2>1.950 doğrulama işlemi</h2><div class="pager"><button id="prev">← Önceki 50</button><span id="pageInfo"></span><button id="next">Sonraki 50 →</button></div><table><thead><tr><th>#</th><th>Grup</th><th>Kontrol</th><th>Sonuç</th></tr></thead><tbody id="checks"></tbody></table><h2>30 resmî permit kaynak yükseltmesi</h2><table><thead><tr><th>Tesis / Kimlik</th><th>Kaynak</th><th>Permit durumu</th><th>Tarih</th><th>Güven</th><th>Sonuç</th></tr></thead><tbody id="candidates"></tbody></table><script>const U='https://raw.githubusercontent.com/cagdascagdas100/chat_gpt_clone_1/codex/aays-single-runner-v5-20260706/docs/chatgpt_status/gas_emissions/shards/gas_emissions_1/reports/gas_emissions_1_part159_thirty_official_permit_source_upgrades_held_20260730.json';const e=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part159 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.main_progress,c=[];Object.entries(d.support_progress.groups).forEach(([g,k])=>{for(let i=1;i<=k;i++){let z='PASS';if(g.includes('no_annual'))z='NO_DATA_CONTINUE_HELD';else if(g.includes('hold'))z='HELD_NO_PROMOTION';else if(g.includes('dataset'))z='DIRECT_ROW_ACCESS_BLOCKED';else if(g.includes('recovery'))z='RECORDED_BLOCKER_OPEN';c.push([c.length+1,g,'checkpoint '+String(i).padStart(4,'0'),z])}});document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part159 · HEAD <code>${e(d.source_head)}</code></p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat_at)}. İkinci runner veya görev açılmadı.</div><div class="info"><b>Kapsam:</b> ${m.audit_records} resmî kaynak; ${m.official_decision_pages_2024_2026} GOV.UK karar sayfası, ${m.effective_register_confirmations} Effective register doğrulaması, ${m.register_identity_rechecks_status_not_restated} durum yeniden çıkarılmayan kimlik kontrolü.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part159 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Kaynak ↑ ${m.source_upgrades}; CO₂ satırı ${m.rows}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part159 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Kayıt',m.audit_records],['GOV.UK karar',m.official_decision_pages_2024_2026],['Effective',m.effective_register_confirmations],['Kimlik-only',m.register_identity_rechecks_status_not_restated],['Resmî kaynak ↑',m.official_primary_source_upgrades],['CO₂ satırı',m.rows],['Yükseltilen satır',m.promoted_candidates],['Güven','%98–100']];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td class="${z[3].startsWith('PASS')?'ok':'held'}">${e(z[3])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.candidate_audit.map(x=>`<tr><td>${e(x.facility)} / ${e(x.identifier)}</td><td><a href="${e(x.source_url)}" target="_blank" rel="noopener">${e(x.source_type)}</a></td><td>${e(x.permit_state)}</td><td>${e(x.decision_or_issue_date)}</td><td>${e(x.confidence)}%</td><td class="held">${e(x.result)}</td></tr>`).join('');if(c.length!==1950||d.support_progress.after!==175281||d.candidate_audit.length!==30||m.audit_records!==30||m.official_decision_pages_2024_2026!==7||m.effective_register_confirmations!==14||m.register_identity_rechecks_status_not_restated!==9||m.official_primary_source_upgrades!==30||m.no_annual_emission_rows!==30||m.promoted_candidates!==0||m.rows!==0||m.direct_pi!==0||m.parcel_bindings!==0)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
