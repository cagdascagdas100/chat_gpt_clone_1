_route_recheck_20260726.json";const e=x=>String(x??"—").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const n=x=>x==null?"—":Number(x).toLocaleString("tr-TR");fetch(U,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Part67 HTTP "+r.status);return r.json()}).then(d=>{const p=d.main_progress,s=d.support_progress,m=d.metrics;document.getElementById("summary").innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part67</p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat bayat. Kök neden: <code>${e(d.recovery.root_cause)}</code>. İkinci runner/task oluşturulmadı.</div><div class="info"><b>Resmî veri rotası:</b> Environment Agency ETSWAP kaynaklı 2013–2020 yıllık regulated-installation CO₂e XLSX bulundu. İndirme endpoint'i çözüldü; mevcut ortamda DNS/binary erişimi bloklu olduğundan tesis satırı okunmadan %99/measured yükseltmesi yapılmadı.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part67 <b>${s.this_pass}/110</b> kontrol. Kümülatif ${s.after}. Aktif ≥%99 ${m.active_confidence_ge99_after}; aktif tüm güvenler ${m.active_all_confidence_nonheld_after}; tarihsel aday ${m.historical_candidate_registry_after}; HOLD ${m.held_facilities_total}.</div>`;const cards=[["Genel",p.percent+"%"],["Ana işlem",p.done+" / "+p.total],["Part67 destek",s.this_pass+" / 110"],["Kümülatif destek",s.after],["Aktif ≥%99",m.active_confidence_ge99_after],["Aktif tüm güvenler",m.active_all_confidence_nonheld_after],["Tarihsel aday",m.historical_candidate_registry_after],["Yeni aday","+"+m.new_candidate_rows],["Aday recheck",m.candidate_rechecks],["HOLD",m.held_facilities_total],["Kaynak","+"+m.new_source_upgrades],["Resmî dataset rota",m.official_dataset_routes_added],["Measured",m.measured_emission_rows],["Parsel",m.parcel_bindings],["Karantina",m.remaining_part44_quarantined_rows]];document.getElementById("cards").innerHTML=cards.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join("");document.getElementById("checks").innerHTML=s.checks.map(v=>{const x=v.split("|");return `<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td class="${/FAIL|NO_DATA|ABSENT|FORBIDDEN|TECHNICAL_BLOCKED/.test(x[3])?"bad":"ok"}">${e(x[3])}</td></tr>`}).join("");document.getElementById("rechecks").innerHTML=d.candidate_rechecks.map(x=>`<tr><td>${e(x.installation)}</td><td>${n(x.annual_mass_tonnes)} t</td><td class="candidate">${x.confidence}%</td><td>${e(x.state)}</td></tr>`).join("");document.getElementById("screened").innerHTML=d.screened_not_promoted.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.site)}</td><td>${x.source_value_tonnes!=null?n(x.source_value_tonnes)+" t":x.source_value_tonnes_approx!=null?"≈"+n(x.source_value_tonnes_approx)+" t":"—"}</td><td>${e((x.source_year||"—")+(x.scope?" / "+x.scope:""))}</td><td>${e(x.result)}</td></tr>`).join("");document.getElementById("sources").innerHTML=d.source_upgrades.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${x[2]}%</td><td><a href="${e(x[3])}" target="_blank" rel="noopener">kaynak</a></td></tr>`).join("");if(s.checks.length!==110||d.candidate_rechecks.length!==3||d.screened_not_promoted.length!==3||d.source_upgrades.length!==10||m.historical_candidate_registry_after!==216||m.active_confidence_ge99_after!==206||m.active_all_confidence_nonheld_after!==212||m.held_facilities_total!==4||m.measured_emission_rows!==0||m.parcel_bindings!==0)throw Error("strict render gate");}).catch(err=>document.body.insertAdjacentHTML("beforeend",`<div class="warn bad">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
