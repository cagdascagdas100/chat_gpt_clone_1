ellafield_2019_refrigerant_gases_20260726.json";const e=x=>String(x??"—").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const n=x=>x==null?"—":Number(x).toLocaleString("tr-TR",{maximumFractionDigits:6});fetch(U,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Part69 HTTP "+r.status);return r.json()}).then(d=>{const p=d.main_progress,s=d.support_progress,m=d.metrics;document.getElementById("summary").innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part69</p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat bayat. Kök neden: <code>${e(d.recovery.root_cause)}</code>. İkinci runner/task oluşturulmadı.</div><div class="info"><b>Yeni gaz örnekleri:</b> Sellafield 2019 refrigerant salımları: R22 4 kg, R134A 1.000 kg, R407C 50 kg, R404A 3,6 kg, R410A 82 kg. Beşi de %99 candidate-only; salımlar top-up miktarlarından tahmin edildiği için measured yapılmadı. Fellside PM10 230 kg güçlü kanıt olsa da partikül olduğu için gaz adayı yapılmadı.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part69 <b>${s.this_pass}/148</b> kontrol. Kümülatif ${s.after}. Aktif ≥%99 ${m.active_confidence_ge99_after}; aktif tüm güvenler ${m.active_all_confidence_nonheld_after}; tarihsel aday ${m.historical_candidate_registry_after}; HOLD ${m.held_facilities_total}.</div>`;const cards=[["Genel",p.percent+"%"],["Ana işlem",p.done+" / "+p.total],["Part69 destek",s.this_pass+" / 148"],["Kümülatif destek",s.after],["Aktif ≥%99",m.active_confidence_ge99_after],["Aktif tüm güvenler",m.active_all_confidence_nonheld_after],["Tarihsel aday",m.historical_candidate_registry_after],["Yeni aday","+"+m.new_candidate_rows+" (%99)"],["Screened",m.screened_not_promoted_rows],["HOLD",m.held_facilities_total],["Kaynak","+"+m.new_source_upgrades],["Cross-validation",m.official_numeric_cross_validations],["Measured",m.measured_emission_rows],["Parsel",m.parcel_bindings],["Karantina",m.remaining_part44_quarantined_rows]];document.getElementById("cards").innerHTML=cards.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join("");document.getElementById("checks").innerHTML=s.checks.map(v=>{const x=v.split("|");return `<tr><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${e(x[2])}</td><td class="${/FAIL|NO_DATA|ABSENT|FORBIDDEN|TECHNICAL_BLOCKED|CONFLICT/.test(x[3])?"bad":"ok"}">${e(x[3])}</td></tr>`}).join("");document.getElementById("candidates").innerHTML=d.new_candidates.map(x=>`<tr><td>${e(x.operator)} / ${e(x.installation)}</td><td>${e(x.pollutant)}</td><td>${x.year}</td><td>${n(x.annual_mass_kg)}</td><td>${n(x.annual_mass_tonnes)}</td><td class="candidate">${x.confidence}%</td><td>${e(x.state)}</td></tr>`).join("");document.getElementById("screened").innerHTML=d.screened_not_promoted.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.site+(x.pollutant?" / "+x.pollutant:""))}</td><td>${x.source_value_kg!=null?n(x.source_value_kg)+" kg":"—"}</td><td>${e(x.result)}</td></tr>`).join("");document.getElementById("sources").innerHTML=d.source_upgrades.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x[0])}</td><td>${e(x[1])}</td><td>${x[2]}%</td><td><a href="${e(x[3])}" target="_blank" rel="noopener">kaynak</a></td></tr>`).join("");if(s.checks.length!==148||d.new_candidates.length!==5||d.screened_not_promoted.length!==3||d.source_upgrades.length!==5||m.historical_candidate_registry_after!==224||m.active_confidence_ge99_after!==214||m.active_all_confidence_nonheld_after!==220||m.held_facilities_total!==4||m.measured_emission_rows!==0||m.parcel_bindings!==0)throw Error("strict render gate");}).catch(err=>document.body.insertAdjacentHTML("beforeend",`<div class="warn bad">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
