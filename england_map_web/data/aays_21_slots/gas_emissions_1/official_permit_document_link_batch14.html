<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Emissions 1 - Batch14 Belge Linki Denetimi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left}th{background:#eceff1}.ok,.blocked{font-weight:700}.note{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}</style></head><body><h1>Batch14 resmî permit belge-link kapsamı</h1><div class="note">Bu tablo yalnız exact Public Register sayfasında IED permit belge bağlantısının görünürlüğünü denetler. PDF içeriği indirilmedi veya emisyon verisi olarak yorumlanmadı.</div><p id="meta">Yükleniyor…</p><table><thead><tr><th>Permit</th><th>Tesis</th><th>Exact sayfa</th><th>IED belge linki</th><th>Belge içeriği</th></tr></thead><tbody id="body"></tbody></table><script>fetch('official_permit_document_link_batch14_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{meta.textContent=`Exact sayfa: ${d.candidate_rows}/${d.candidate_rows} · IED belge linki: ${d.ied_document_link_visible_pass}/${d.candidate_rows} · İndirilen belge: ${d.document_content_downloaded_rows}`;body.innerHTML=d.checks.map(x=>`<tr><td>${x.permit_number}</td><td>${x.site_name}</td><td class="ok">PASS</td><td class="${x.ied_document_link_visible?'ok':'blocked'}">${x.ied_document_link_visible?'PASS':'YAYINLANMAMIŞ'}</td><td>İndirilmedi</td></tr>`).join('')}).catch(()=>meta.textContent='Belge-link audit JSON okunamadı');</script></body></html>
