<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gas_emissions_1 Part156</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;border-radius:7px;padding:10px;min-width:145px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:11px;margin:12px 0}.good{background:#e8f5e9;border:1px solid #a5d6a7;padding:11px;margin:12px 0}.info{background:#e8f4fd;border:1px solid #9fc9e8;padding:11px;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0;font-size:12px}th,td{border:1px solid #ccd6dd;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.held{color:#9a6700;font-weight:bold}.ok{color:#176b2c;font-weight:bold}.fail{color:#8b1e1e;font-weight:bold}.pager{display:flex;gap:8px;align-items:center;margin:10px 0}.pager button{padding:6px 10px}code,a{word-break:break-all}</style></head><body><h1>gas_emissions_1 — Part156 satır satır izleme</h1><div id="summary"></div><div id="cards" class="cards"></div><h2>1.200 doğrulama işlemi</h2><div class="pager"><button id="prev">← Önceki 50</button><span id="pageInfo"></span><button id="next">Sonraki 50 →</button></div><table><thead><tr><th>#</th><th>Grup</th><th>Kontrol</th><th>Sonuç</th></tr></thead><tbody id="checks"></tbody></table><h2>23 tesis + 1 kaynak-süreklilik koruma kaydı</h2><table><thead><tr><th>Tesis / Permit</th><th>2024 PI kg</th><th>Yöntem</th><th>Güven</th><th>Sonuç</th><th>Kaynaklar</th></tr></thead><tbody id="candidates"></tbody></table><script>const U='https://raw.githubusercontent.com/cagdascagdas100/chat_gpt_clone_1/codex/aays-single-runner-v5-20260706/docs/chatgpt_status/gas_emissions/shards/gas_emissions_1/reports/gas_emissions_1_part156_twenty_four_2024_pi_row_and_apr_chronology_audit_held_20260729.json';const e=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const n=x=>x==null?'—':Number(x).toLocaleString('tr-TR');fetch(U,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Part156 HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,p=d.main_progress,c=[];Object.entries(d.support_progress.groups).forEach(([g,k])=>{for(let i=1;i<=k;i++){let z='PASS';if(g.includes('no_data'))z='NO_DATA_CONTINUE_HELD';else if(g.includes('hold'))z='HELD_NO_PROMOTION';else if(g.includes('dataset'))z='DIRECT_ROW_ACCESS_BLOCKED';else if(g.includes('recovery'))z='RECORDED_BLOCKER_OPEN';else if(g.includes('integrity'))z='PASS_ROW_INTEGRITY';c.push([c.length+1,g,'checkpoint '+String(i).padStart(4,'0'),z])}});document.getElementById('summary').innerHTML=`<p>Güncelleme <code>${e(d.generated_at)}</code> · Part156 · HEAD <code>${e(d.source_head)}</code></p><div class="warn"><b>Runner:</b> ${e(d.recovery.queue)}; heartbeat ${e(d.recovery.heartbeat_at)}. Uzun PENDING sürüyor; ikinci runner veya görev açılmadı.</div><div class="info"><b>Kapsam:</b> 23 benzersiz tesis ve 1 kaynak-süreklilik koruma kaydı. ${m.visible_2024_pi_rows} görünür 2024 PI CO₂ satırı; ${m.no_data_or_lifecycle_only} NO_DATA/lifecycle kaydı. APR bağlantılarından hücre değeri türetilmedi.</div><div class="good"><b>İlerleme:</b> ${p.done}/${p.total} = ${p.percent}% (Δ +${p.delta_pp}). Part156 <b>${n(d.support_progress.this_pass)}</b> işlem; kümülatif ${n(d.support_progress.after)}. Görünür PI toplamı ${n(m.visible_2024_pi_kg_total)} kg; kaynak ↑ ${m.source_upgrades}; yükseltilen satır ${m.promoted_candidates}.</div>`;const cards=[['Genel',p.percent+'%'],['Ana işlem',p.done+' / '+p.total],['Part156 işlem',n(d.support_progress.this_pass)],['Kümülatif',n(d.support_progress.after)],['Denetim kaydı',m.facilities_audited],['Benzersiz tesis',23],['Görünür PI satırı',m.visible_2024_pi_rows],['NO_DATA/lifecycle',m.no_data_or_lifecycle_only],['Ölçülmüş',m.measured_2024_pi_rows],['Hesaplanmış',m.calculated_2024_pi_rows],['Kaynak ↑',m.source_upgrades],['Yükseltilen satır',m.promoted_candidates],['Güven','%95–99'],['Direct PI',m.direct_pi]];document.getElementById('cards').innerHTML=cards.map(z=>`<div class="card">${e(z[0])}<br><b>${e(z[1])}</b></div>`).join('');let page=0,sz=50,prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo');const render=()=>{const a=page*sz,b=Math.min(a+sz,c.length);document.getElementById('checks').innerHTML=c.slice(a,b).map(z=>`<tr><td>${z[0]}</td><td>${e(z[1])}</td><td>${e(z[2])}</td><td class="${z[3].startsWith('PASS')?'ok':z[3].startsWith('DIRECT')?'fail':'held'}">${e(z[3])}</td></tr>`).join('');pageInfo.textContent=`${a+1}-${b} / ${c.length} · sayfa ${page+1}/${Math.ceil(c.length/sz)}`;prev.disabled=page===0;next.disabled=b>=c.length};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if((page+1)*sz<c.length){page++;render()}};render();document.getElementById('candidates').innerHTML=d.candidate_audit.map(x=>{const cls=x.pi_2024_kg!=null?'ok':'held';return `<tr><td>${e(x.facility)} / ${e(x.permit)}</td><td>${n(x.pi_2024_kg)}</td><td>${e(x.method)}</td><td>${e(x.confidence)}%</td><td class="${cls}">${e(x.result)}</td><td><a href="${e(x.identity_url)}" target="_blank" rel="noopener">resmî kimlik</a> · <a href="${e(x.numeric_url)}" target="_blank" rel="noopener">PI/APR kanıtı</a></td></tr>`}).join('');if(c.length!==1200||d.support_progress.after!==170301||d.candidate_audit.length!==24||m.facilities_audited!==24||m.visible_2024_pi_rows!==13||m.no_data_or_lifecycle_only!==11||m.measured_2024_pi_rows!==11||m.calculated_2024_pi_rows!==2||m.source_upgrades!==24||m.promoted_candidates!==0||m.rows!==0||m.direct_pi!==0||m.parcel_bindings!==0||m.visible_2024_pi_kg_total!==3789615326)throw Error('strict render gate');}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<div class="warn">Rapor yüklenemedi: ${e(err.message)}</div>`));</script></body></html>
