<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch16 Permit Belge Bağlantıları</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa;color:#17202a}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cfd8dc;padding:8px;text-align:left}th{background:#eceff1}.ok{font-weight:700}.blocked{font-weight:700}.note{padding:12px;background:#fff3cd;border:1px solid #ffe69c;margin:12px 0}</style></head><body><h1>gas_emissions_1 — Batch16 resmî permit belge-link denetimi</h1><div class="note">Bu denetim yalnız exact permit sayfasında IED belge bağlantısının görünürlüğünü kontrol eder. PDF içeriği indirilmemiş ve emisyon değeri çıkarılmamıştır.</div><p id="meta">Yükleniyor…</p><table><thead><tr><th>Sıra</th><th>Permit</th><th>Tesis</th><th>Exact permit sayfası</th><th>IED belge bağlantısı</th><th>PDF içeriği</th></tr></thead><tbody id="body"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('official_permit_location_examples_batch16_latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.candidates||[],v=a.filter(x=>x.permit_document_link_visible).length;meta.textContent=`Exact sayfa: ${a.length}/${a.length} · IED belge bağlantısı: ${v}/${a.length} · İndirilen PDF: 0`;body.innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.permit_number)}</td><td>${esc(x.site_name)}</td><td class="ok"><a href="${esc(x.source_url)}" target="_blank" rel="noreferrer">PASS</a></td><td class="${x.permit_document_link_visible?'ok':'blocked'}">${x.permit_document_link_visible?'PASS':'YOK'}</td><td>İndirilmedi</td></tr>`).join('')}).catch(()=>meta.textContent='Batch16 JSON okunamadı');</script></body></html>
