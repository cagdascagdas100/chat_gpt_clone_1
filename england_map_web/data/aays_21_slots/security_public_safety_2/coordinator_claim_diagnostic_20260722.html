<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — coordinator claim diagnostic</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.PASS{font-weight:700}.PENDING{font-weight:700}</style></head><body><h1>security_public_safety_2 — shared coordinator sahiplenme tanısı</h1><div id="notice" class="notice"></div><div id="cards" class="cards"></div><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./coordinator_claim_diagnostic_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('notice').textContent=d.diagnostic_conclusion;const c=[['Eski attempt',d.old_queue_attempt_id+' / '+d.old_queue_status],['Sözleşme hatası',d.old_contract_error],['Yeni attempt',d.new_queue_attempt_id+' / '+d.new_queue_status],['Current task',d.current_task_attempt_id+' / '+d.current_task_status],['Ownership',d.ownership_state],['Heartbeat',d.heartbeat_attempt_id+' / '+d.heartbeat_state],['Kaynak URL',d.retry4_contract.source_urls_count],['Çıktı mevcut',d.expected_output_exists],['İşlem',d.operations_completed+'/'+d.operations_total]];document.getElementById('cards').innerHTML=c.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('ops').innerHTML=(d.operations||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td class="${e(x.state)}">${e(x.state)}</td><td>${e(x.evidence)}</td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
