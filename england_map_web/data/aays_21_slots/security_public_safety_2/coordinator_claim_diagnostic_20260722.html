<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — runner tanısı</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px;max-width:300px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.PASS{font-weight:700}.PENDING{font-weight:700}code{word-break:break-all}</style></head><body><h1>security_public_safety_2 — runner, guardian ve pending tanısı</h1><div id="notice" class="notice"></div><div id="cards" class="cards"></div><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./coordinator_claim_diagnostic_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('notice').textContent=d.diagnostic_conclusion;const c=[['Eski attempt',d.old_queue_attempt_id+' / '+d.old_queue_status],['Eski hata',d.old_contract_error],['Aktif attempt',d.new_queue_attempt_id+' / '+d.new_queue_status],['Öncelik',d.new_queue_priority],['Current task',d.current_task_attempt_id+' / '+d.current_task_status],['Ownership',d.ownership_state],['Heartbeat',d.heartbeat_attempt_id+' / '+d.heartbeat_state],['Canonical motor',d.canonical_launcher_chain.engine],['Legacy uyum',d.legacy_runner_contract.compatible],['Adaptive uyum',d.adaptive_coordinator_contract.compatible],['PowerShell köprü',d.legacy_runner_contract.powershell_bridge_present],['Kaynak URL',d.retry5_contract.source_urls_count],['Hedef satır',d.retry5_contract.sample_rows],['Queue blob',d.retry5_contract.queue_blob_sha],['Bridge blob',d.retry5_contract.bridge_blob_sha],['Hardened Python',d.retry5_contract.python_entry_blob_sha],['Preflight blob',d.guarded_recovery.preflight_blob_sha],['Runtime dirty korunuyor',d.guarded_recovery.runtime_dirty_paths_preserved],['Non-runtime dirty blok',d.guarded_recovery.non_runtime_dirty_paths_blocked],['Reset/rebase yasak',d.guarded_recovery.local_head_reset_or_rebase_forbidden],['Remote blob kapısı',d.guarded_recovery.remote_contract_blob_count],['Controller blob kapısı',d.guarded_recovery.local_controller_blob_count],['Remote request consumer',d.guardian_code_findings.request_file_consumer_present],['Guardian heartbeat yaş kontrolü',d.guardian_code_findings.valid_owner_path_checks_heartbeat_age],['Guardian valid owner sonucu',d.guardian_code_findings.valid_owner_path_returns_runner_healthy],['Gerekli recovery',d.guardian_code_findings.required_execution_path],['Çıktı mevcut',d.expected_output_exists],['İşlem',d.operations_completed+'/'+d.operations_total]];document.getElementById('cards').innerHTML=c.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('ops').innerHTML=(d.operations||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td class="${e(x.state)}">${e(x.state)}</td><td>${e(x.evidence)}</td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
