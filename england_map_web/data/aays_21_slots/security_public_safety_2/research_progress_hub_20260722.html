<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — ilerleme merkezi</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{padding:12px;background:#fff3cd;border:1px solid #ffe69c}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin:14px 0}th,td{border:1px solid #cfd8dc;padding:7px;text-align:left}th{background:#eceff1}a{font-weight:700}.PUBLISHED{font-weight:700}.RUNNER_PENDING{font-weight:700}</style></head><body><h1>security_public_safety_2 — ilerleme merkezi</h1><div class="notice">Resmî kaynak ve QA sayfaları yayımlandı. 96 parcel aday görevi shared runner tarafından sahiplenilene kadar business skorları null kalır.</div><div id="cards" class="cards"></div><h2>Sayfalar</h2><table><thead><tr><th>Sayfa</th><th>Satır</th><th>Durum</th></tr></thead><tbody id="pages"></tbody></table><h2>Gerçek engel</h2><p id="blocker"></p><p id="error"></p><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./research_progress_hub_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{const cards=[['Ana ilerleme',d.main_workflow_progress_percent+'%'],['Artış','+'+d.main_workflow_delta_percent+'%'],['Ana işlem',d.main_operations_completed+'/'+d.main_operations_total],['Kaynak satırı',d.official_source_rows],['Yükseltilen',d.promoted_source_rows],['≥95 güven',d.confidence_ge_95_source_rows],['QA işlem',d.research_qa_operations_completed+'/'+d.research_qa_operations_total],['Aday kuyruğu',d.priority_candidate_rows_queued],['Paralel satır',d.parallel_row_checks],['Business satırı',d.business_rows_written]];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card">${esc(x[0])}<br><b>${esc(x[1])}</b></div>`).join('');document.getElementById('pages').innerHTML=d.pages.map(x=>`<tr><td><a href="${esc(x.path)}">${esc(x.label)}</a></td><td>${esc(x.rows)}</td><td class="${esc(x.state)}">${esc(x.state)}</td></tr>`).join('');document.getElementById('blocker').textContent=d.blocker}).catch(e=>document.getElementById('error').textContent=e.message);</script></body></html>
