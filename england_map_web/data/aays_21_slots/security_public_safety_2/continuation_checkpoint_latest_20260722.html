<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — devam checkpoint</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px;max-width:280px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}code,a{word-break:break-all}</style></head><body><h1>security_public_safety_2 — devam checkpoint</h1><div id="notice" class="notice"></div><div id="cards" class="cards"></div><h2>Destek bileşenleri</h2><table><thead><tr><th>Bileşen</th><th>Tamamlanan</th><th>Toplam</th></tr></thead><tbody id="support"></tbody></table><h2>Yeni satır-satır sayfalar</h2><table><thead><tr><th>Sayfa</th><th>Durum</th></tr></thead><tbody id="pages"></tbody></table><h2>Validator</h2><table><tbody id="validator"></tbody></table><h2>Aktif retry zinciri</h2><table><tbody id="retry"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./continuation_checkpoint_latest_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('notice').textContent=d.blocker;const s=d.sources,c=d.candidates,w=d.web,m=d.main_workflow,p=d.support_workflow,r=d.active_retry,v=d.validator;const cards=[['Genel ilerleme',m.progress_percent+'%'],['Artış','+'+m.delta_percent+'%'],['Ana işlem',m.operations_completed+'/'+m.operations_total],['Destek işlem',p.operations_completed+'/'+p.operations_total],['Runner kaynak',s.runner_reviewed],['Runner yükseltilen',s.runner_promoted_for_role],['Runner ≥95',s.runner_confidence_ge_95],['Runner ≥98',s.runner_confidence_ge_98],['Araştırma/QA',s.research_qa_reviewed],['QA rol yükseltme',s.research_qa_promoted_for_role],['Batch18 ≥98',s.batch18_confidence_ge_98],['Doğrudan konum rota',s.batch18_direct_identity_routes],['Koşullu geometri',s.batch18_conditional_geometry_routes],['Hazır aday',c.prepared_rows],['Aktif hedef',c.active_wave_target_rows],['Gated aday',c.dependency_gated_rows],['Joined',c.officially_joined_rows],['≥95 aday',c.confidence_ge_95_rows],['Business',c.business_rows_written],['Validator hedef',c.wave1_validator_target_rows],['Validator kontrol/satır',c.wave1_validator_checks_per_row],['Web artifact',w.artifact_rows],['Artifact çift',w.artifact_pairs],['Static kırık',w.static_broken_reference_count],['Ownership',r.ownership_state],['Lease',r.lease_version],['Çıktı',r.expected_output_exists]];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('support').innerHTML=Object.entries(p.components).map(([k,x])=>`<tr><td>${e(k)}</td><td>${e(x.completed)}</td><td>${e(x.total)}</td></tr>`).join('');document.getElementById('pages').innerHTML=(w.new_pages||[]).map(x=>`<tr><td><a href="${e(x)}">${e(x)}</a></td><td>PUBLISHED</td></tr>`).join('');document.getElementById('validator').innerHTML=Object.entries(v).map(([k,x])=>`<tr><th>${e(k)}</th><td><code>${e(x)}</code></td></tr>`).join('');document.getElementById('retry').innerHTML=Object.entries(r).map(([k,x])=>`<tr><th>${e(k)}</th><td><code>${e(x)}</code></td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
