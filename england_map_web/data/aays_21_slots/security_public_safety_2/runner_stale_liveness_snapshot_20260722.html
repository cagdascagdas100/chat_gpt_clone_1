<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — stale runner canlılık tanısı</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px;max-width:290px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.PASS{font-weight:700}.PENDING{font-weight:700}code{word-break:break-all}</style></head><body><h1>security_public_safety_2 — stale runner canlılık tanısı</h1><div id="notice" class="notice"></div><div id="cards" class="cards"></div><h2>Daemon kanıtı</h2><table><tbody id="daemon"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./runner_stale_liveness_snapshot_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('notice').textContent=d.blocker;const x=d.daemon,g=d.guardian;const c=[['Attempt',d.attempt_id],['Görev durumu',d.task_status],['Ownership',d.ownership_state],['Lease',d.lease_version],['Çıktı mevcut',d.expected_output_exists],['Heartbeat yaşı',x.heartbeat_age_minutes+' dk'],['Eşik',x.stale_threshold_minutes+' dk'],['Eşik katı',x.threshold_multiple],['Güncel canlılık',x.remote_process_liveness_current],['Preflight çıktısı',d.recovery_preflight_output_exists],['Helper çıktısı',d.recovery_helper_output_exists],['Yeni runner',g.new_runner_created],['Paralel runner',g.parallel_runner_created],['İşlem',d.operations_completed+'/'+d.operations_total]];document.getElementById('cards').innerHTML=c.map(v=>`<div class="card">${e(v[0])}<br><b>${e(v[1])}</b></div>`).join('');document.getElementById('daemon').innerHTML=Object.entries(x).map(([k,v])=>`<tr><th>${e(k)}</th><td><code>${e(v)}</code></td></tr>`).join('');document.getElementById('ops').innerHTML=d.operations.map(v=>`<tr><td>${e(v.row)}</td><td>${e(v.operation)}</td><td class="${e(v.state)}">${e(v.state)}</td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
