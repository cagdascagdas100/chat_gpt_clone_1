<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — Canonical blob hedef çıkarımı</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:160px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.PASS{font-weight:700}.PENDING{font-weight:700}</style></head><body><h1>Canonical blob hedef çıkarım readback</h1><div id="notice" class="notice"></div><div id="cards" class="cards"></div><h2>Hedef kimlikler</h2><p id="targets"></p><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th>Kanıt</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./canonical_blob_target_extraction_readback_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('notice').textContent=d.next_required_action;const c=[['Blob SHA',d.canonical_blob_sha],['Canonical özellik',d.canonical_feature_count],['Hedef satır',d.target_count],['Çıkarılan satır',d.extraction_result_rows],['Uydurulan koordinat',d.fabricated_coordinates],['İşlem',d.operations_completed+'/'+d.operations_total]];document.getElementById('cards').innerHTML=c.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('targets').textContent=(d.target_ids||[]).join(', ');document.getElementById('ops').innerHTML=(d.operations||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td class="${e(x.state)}">${e(x.state)}</td><td>${e(x.evidence)}</td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
