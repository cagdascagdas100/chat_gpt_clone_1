<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>security_public_safety_2 — 96 hazırlanmış aday</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}h1{margin-bottom:8px}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;font-size:12px;margin-top:14px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left}th{background:#eceff1;position:sticky;top:0}.pending{font-weight:700}code{font-size:10px}
</style>
</head>
<body>
<h1>security_public_safety_2 — 96 hazırlanmış aday satırı</h1>
<div class="notice">Bu satırlar yalnız iş sırasını ve gereken resmî kanıtları gösterir. ONS LSOA, Police.uk ay/SHA256 ve IoD 2025 tam birleşimi olmadan skor, doğruluk veya business promotion yazılmaz.</div>
<div id="cards" class="cards"></div>
<table><thead><tr><th>#</th><th>Parsel</th><th>Durum</th><th>Gerekli kanıt</th><th>Aday %</th><th>Doğruluk</th><th>Business skor</th><th>Yükseltme</th></tr></thead><tbody id="rows"></tbody></table>
<p id="error"></p>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('./prepared_96row_candidate_manifest_20260722.json',{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
.then(d=>{
 const s=d.summary||{};
 const cards=[['Hazırlanmış satır',s.prepared_candidate_rows],['Resmî birleşim',s.officially_joined_rows],['≥95 doğruluk',s.accuracy_ge_95_rows],['Yükseltilen',s.promoted_rows],['Kaynak paralelliği',s.parallel_source_probes_target],['Satır paralelliği',s.parallel_row_checks_target]];
 document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card">${esc(x[0])}<br><b>${esc(x[1])}</b></div>`).join('');
 const t=d.row_template||{};
 document.getElementById('rows').innerHTML=(d.candidate_ids||[]).map((id,i)=>`<tr><td>${i+1}</td><td><code>${esc(id)}</code></td><td class="pending">${esc(t.candidate_state)}</td><td>${esc((t.required_evidence||[]).join(' • '))}</td><td>—</td><td>${esc(t.candidate_accuracy_percent)}%</td><td>—</td><td>${t.promotion_allowed?'EVET':'HAYIR'}</td></tr>`).join('');
})
.catch(e=>document.getElementById('error').textContent='Veri yüklenemedi: '+e.message);
</script>
</body>
</html>
