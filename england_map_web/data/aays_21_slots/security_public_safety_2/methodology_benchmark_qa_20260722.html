<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>security_public_safety_2 — metodoloji benchmark QA</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{padding:12px;background:#fff3cd;border:1px solid #ffe69c}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;font-size:11px;margin:14px 0}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1;position:sticky;top:0}.PASS,.PROMOTED_FOR_QA_ROLE{font-weight:700}.PENDING{font-weight:700}</style></head>
<body><h1>security_public_safety_2 — resmî metodoloji benchmark QA</h1>
<div class="notice">Bu sayfa ulusal, PFA, CSP ve LSOA benchmark kaynaklarını gösterir. Hiçbir satır parcel business skoru değildir.</div>
<div id="cards" class="cards"></div>
<h2>Kaynak satırları</h2><table><thead><tr><th>#</th><th>Yayıncı</th><th>Kaynak</th><th>Güncel kanıt</th><th>Seviye</th><th>Rol</th><th>Kullanım sınırı</th><th>Güven</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table>
<h2>İşlem satırları</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p>
<script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./methodology_benchmark_qa_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{const cards=[['Kaynak',d.rows_reviewed],['Yükseltilen',d.promoted_for_qa_role],['≥95 güven',d.confidence_ge_95_rows],['İşlem',d.completed_operations+'/'+d.total_operations],['Business satırı',d.business_rows_written],['Güncel ulusal yayın',d.current_national_release_date]];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card">${esc(x[0])}<br><b>${esc(x[1])}</b></div>`).join('');document.getElementById('rows').innerHTML=d.qa_rows.map(x=>`<tr><td>${x.row}</td><td>${esc(x.publisher)}</td><td>${esc(x.source)}</td><td>${esc(x.current_evidence)}</td><td>${esc(x.measurement_level)}</td><td>${esc(x.role)}</td><td>${esc(x.usage_limit)}</td><td>${x.confidence_percent}%</td><td class="${esc(x.status)}">${esc(x.status)}</td></tr>`).join('');document.getElementById('ops').innerHTML=d.operations.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.operation)}</td><td class="${esc(x.state)}">${esc(x.state)}</td></tr>`).join('')}).catch(e=>document.getElementById('error').textContent=e.message);</script></body></html>
