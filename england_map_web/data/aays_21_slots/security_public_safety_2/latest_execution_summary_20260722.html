<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — son işlem özeti</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.PASS{font-weight:700}.PENDING,.waiting_dependency,.pending_ready_for_claim{font-weight:700}a{word-break:break-all}</style></head><body><h1>security_public_safety_2 — son işlem özeti</h1><div id="notice" class="notice"></div><div id="cards" class="cards"></div><h2>Görev sırası</h2><table><thead><tr><th>Görev</th><th>Aday</th><th>Durum</th><th>Bağımlılık</th></tr></thead><tbody id="queue"></tbody></table><h2>Web sayfaları</h2><table><thead><tr><th>Sayfa</th><th>Satır</th><th>Durum</th></tr></thead><tbody id="pages"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./latest_execution_summary_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('notice').textContent=d.blocker;const c=[['Genel ilerleme',d.main_workflow_progress_percent+'%'],['Artış','+'+d.main_workflow_delta_percent+'%'],['Ana işlem',d.main_operations_completed+'/'+d.main_operations_total],['Destek işlem',d.support_operations_completed+'/'+d.support_operations_total],['Runner kaynak',d.official_source_rows],['Runner yükseltilen',d.promoted_source_rows],['Runner bekletilen',d.held_source_rows],['Runner ≥95',d.confidence_ge_95_source_rows],['Araştırma/QA kaynak',d.research_qa_source_rows],['QA rol yükseltme',d.research_qa_promoted_for_defined_role],['Hazır aday',d.prepared_candidate_rows],['Aktif dalga',d.active_wave_candidate_target],['Paralel kaynak',d.parallel_source_probes_active_wave],['Paralel veri indirme',d.parallel_dataset_downloads_active_wave],['Paralel satır',d.parallel_row_checks_active_wave],['Resmî birleşim',d.officially_joined_candidate_rows],['≥95 aday',d.confidence_ge_95_candidate_rows],['Business satırı',d.business_rows_written]];document.getElementById('cards').innerHTML=c.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('queue').innerHTML=(d.queue_orchestration||[]).map(x=>`<tr><td>${e(x.task_id)}</td><td>${e(x.candidate_rows)}</td><td class="${e(x.status)}">${e(x.status)}</td><td>${e(x.dependency)}</td></tr>`).join('');document.getElementById('pages').innerHTML=(d.pages||[]).map(x=>`<tr><td><a href="${e(x.path)}">${e(x.label)}</a></td><td>${e(x.rows)}</td><td>${e(x.state)}</td></tr>`).join('');document.getElementById('ops').innerHTML=(d.operations||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td class="${e(x.state)}">${e(x.state)}</td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
