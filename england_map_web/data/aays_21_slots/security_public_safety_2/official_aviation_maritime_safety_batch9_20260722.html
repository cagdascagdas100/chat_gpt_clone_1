<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resmî havacılık ve denizcilik güvenliği — Batch 9</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#e8f4fd;border:1px solid #9ac7e3;padding:12px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}a{word-break:break-all}.PASS{font-weight:700}.PENDING{font-weight:700}</style></head><body><h1>Resmî havacılık ve denizcilik güvenliği — Batch 9</h1><div class="notice">Bu satırlar yalnız tanımlı kaynak rolleri için yükseltilmiştir. Parcel veya business skoru yazılmaz.</div><h2>Kaynaklar</h2><table><thead><tr><th>#</th><th>Kaynak</th><th>Yayıncı</th><th>Tarih</th><th>Coğrafya</th><th>Rol</th><th>Kullanım sınırı</th><th>Güven</th><th>Durum</th></tr></thead><tbody id="sources"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><p id="err"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./official_aviation_maritime_safety_batch9_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('sources').innerHTML=(d.sources||[]).map(x=>`<tr><td>${e(x.row)}</td><td><a href="${e(x.url)}">${e(x.name)}</a></td><td>${e(x.publisher)}</td><td>${e(x.published_or_current)}</td><td>${e(x.geography)}</td><td>${e(x.role)}</td><td>${e(x.usage_limit)}</td><td>${e(x.source_role_confidence_percent)}%</td><td>${e(x.status)}</td></tr>`).join('');document.getElementById('ops').innerHTML=(d.operations||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td class="${e(x.state)}">${e(x.state)}</td></tr>`).join('')}).catch(x=>document.getElementById('err').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
