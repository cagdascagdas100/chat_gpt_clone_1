<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>security_public_safety_2 — enerji ve su dayanıklılığı batch 10</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px;margin:12px 0}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:145px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.PASS,.PROMOTED_FOR_ROLE{font-weight:700}.PENDING{font-weight:700}a{word-break:break-all}</style></head><body><h1>Enerji ve su dayanıklılığı — Batch 10</h1><div class="notice">Kaynaklar yalnız tanımlı metodoloji, kalite, düzenleme ve dayanıklılık rolleri için yükseltilmiştir. Parcel veya business skoru üretilmemiştir.</div><div id="cards" class="cards"></div><h2>Resmî kaynak satırları</h2><table><thead><tr><th>#</th><th>Yayıncı / Kaynak</th><th>Tarih</th><th>Coğrafya</th><th>Rol</th><th>Kullanım sınırı</th><th>Güven</th><th>Durum</th></tr></thead><tbody id="sources"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><p id="error"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./official_energy_water_resilience_batch10_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{const c=[['İncelenen',d.sources_reviewed],['Rol için yükseltilen',d.promoted_for_defined_role],['≥95 güven',d.confidence_ge_95],['≥98 güven',d.confidence_ge_98],['Business satırı',d.business_rows_written],['İşlem',d.operations_completed+'/'+d.operations_total]];document.getElementById('cards').innerHTML=c.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('sources').innerHTML=(d.sources||[]).map(x=>`<tr><td>${e(x.row)}</td><td><b>${e(x.publisher)}</b><br><a href="${e(x.url)}">${e(x.name)}</a></td><td>${e(x.published_or_current)}</td><td>${e(x.geography)}</td><td>${e(x.role)}</td><td>${e(x.usage_limit)}</td><td>${e(x.source_role_confidence_percent)}%</td><td class="${e(x.status)}">${e(x.status)}</td></tr>`).join('');document.getElementById('ops').innerHTML=(d.operations||[]).map(x=>`<tr><td>${e(x.row)}</td><td>${e(x.operation)}</td><td class="${e(x.state)}">${e(x.state)}</td></tr>`).join('')}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
