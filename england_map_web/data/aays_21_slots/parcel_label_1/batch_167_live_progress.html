<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 167</title><style>body{font:14px system-ui;margin:20px;background:#f6f7f9;color:#172033}main{max-width:1900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.c,table{background:#fff;border:1px solid #d9dee8}.c{padding:10px;border-radius:8px}.n{font-size:22px;font-weight:700}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}th,td{border:1px solid #d9dee8;padding:6px;text-align:left;vertical-align:top}th{background:#eef2f7}.g{color:#176b32}.b{color:#9b1c1c}a{color:#1659a7}</style></head><body><main><h1>parcel_label_1 — Batch 167</h1><p>Essex, East Anglia, Kent, Sussex ve Surrey resmî HMCTS revalidation. Kanonik parsel/UPRN/title/geometri bağlaması yok.</p><div id="cards" class="cards"></div><h2>Satır sonuçları</h2><table><thead><tr><th>ID</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><h2>Rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th></tr></thead><tbody id="routes"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>ID</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><p id="err" class="b"></p><script>const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));fetch('batch_167_evidence_latest.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const m=d.metrics,c=d.cumulative;const cards=[[m.official_pages,'Resmî sayfa'],[m.source_route_attempts_fail_closed,'Rota fail-closed'],[m.revalidated,'Revalidate'],[m.fail_closed,'Fail-closed'],[m.average_confidence+'%','Ortalama güven'],[c.research_operation_progress_percent+'%','Genel ilerleme']];document.querySelector('#cards').innerHTML=cards.map(x=>`<div class=c><div class=n>${E(x[0])}</div>${E(x[1])}</div>`).join('');document.querySelector('#rows').innerHTML=d.rows.map(r=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td><td class=${r[3]=='REVALIDATED_EXISTING'?'g':'b'}>${E(r[3])}</td><td>${E(r[4])}%</td><td>${E(r[5])}</td><td><a href="${E(r[2])}">HMCTS</a></td></tr>`).join('');document.querySelector('#routes').innerHTML=d.source_route_attempts.map((r,i)=>`<tr><td>${i+1}</td><td>${E(r[0])}</td><td class=b>${E(r[2])}</td><td><a href="${E(r[1])}">HMCTS</a></td></tr>`).join('');document.querySelector('#ops').innerHTML=d.operations.map(o=>`<tr><td>${E(o.id)}</td><td>${E(o.name)}</td><td>${E(o.state)}</td></tr>`).join('')}).catch(e=>document.querySelector('#err').textContent='Kanıt JSON yüklenemedi: '+e.message);</script></main></body></html>
