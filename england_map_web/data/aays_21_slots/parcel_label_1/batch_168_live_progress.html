<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 168</title><style>body{font:14px system-ui;margin:24px;background:#f6f7f9;color:#172033}main{max-width:1800px;margin:auto}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd3dd;padding:10px;border-radius:8px;min-width:145px}.n{font-size:20px;font-weight:700}table{border-collapse:collapse;width:100%;background:#fff;margin:14px 0}th,td{border:1px solid #ccd3dd;padding:6px;text-align:left;vertical-align:top}th{background:#eef1f5}.good{color:#176b32}.bad{color:#9b1c1c}</style></head><body><main><h1>parcel_label_1 — Batch 168</h1><p>North West England resmî HMCTS revalidation. Kanonik parsel, UPRN, title veya geometri bağlaması yapılmadı.</p><div id="cards" class="cards"></div><h2>Satır sonuçları</h2><table><thead><tr><th>ID</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><h2>Rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th></tr></thead><tbody id="routes"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>ID</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><h2>Kümülatif</h2><p id="cum"></p><script>const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('batch_168_evidence_latest.json').then(r=>r.json()).then(d=>{const m=d.metrics,c=d.cumulative;document.querySelector('#cards').innerHTML=[[m.official_pages,'Resmî sayfa'],[m.revalidated,'Revalidate'],[m.fail_closed,'Fail-closed'],[m.source_route_attempts_fail_closed,'Rota fail-closed'],[m.average_confidence+'%','Ortalama güven'],[c.research_operation_progress_percent+'%','Genel ilerleme']].map(x=>`<div class="card"><div class="n">${e(x[0])}</div>${e(x[1])}</div>`).join('');document.querySelector('#rows').innerHTML=d.rows.map(a=>`<tr><td>${e(a[0])}</td><td>${e(a[1])}</td><td class="${a[3].startsWith('REVALIDATED')?'good':'bad'}">${e(a[3])}</td><td>${e(a[4])}%</td><td>${e(a[5])}</td><td><a href="${e(a[2])}">HMCTS</a></td></tr>`).join('');document.querySelector('#routes').innerHTML=d.source_route_attempts.map((a,i)=>`<tr><td>${i+1}</td><td>${e(a[0])}</td><td class="bad">${e(a[2])}</td><td><a href="${e(a[1])}">HMCTS</a></td></tr>`).join('');document.querySelector('#ops').innerHTML=d.operations.map(a=>`<tr><td>${e(a.id)}</td><td>${e(a.name)}</td><td>${e(a.state)}</td></tr>`).join('');document.querySelector('#cum').textContent=`${c.visible_research_candidate_rows} aday · ${c.official_sources_upgraded} kaynak yükseltmesi · %${c.classification_accuracy_weighted_average_percent} ağırlıklı doğruluk · ${c.completed_or_fail_closed_operations} / ${c.visible_operation_rows} tamam/fail-closed · +${c.research_operation_progress_delta_percent} yüzde puan`;}).catch(x=>document.body.insertAdjacentHTML('beforeend','<p class="bad">Evidence yüklenemedi: '+e(x)+'</p>'));</script></main></body></html>
