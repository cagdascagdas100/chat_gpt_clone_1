<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 166</title><style>body{font-family:system-ui;margin:24px;background:#f7f8fa;color:#172033}main{max-width:1900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card,table{background:#fff;border:1px solid #d9dee8}.card{padding:12px;border-radius:10px}.n{font-size:1.5rem;font-weight:700}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}th,td{border:1px solid #d9dee8;padding:7px;text-align:left;vertical-align:top}th{background:#eef2f7;position:sticky;top:0}.bad{color:#9b1c1c}.good{color:#176b32}</style></head><body><main><h1>parcel_label_1 — Batch 166</h1><p>Yorkshire, Humber, North East England ve Cumbria resmî HMCTS taraması. Kanonik parsel/UPRN/title/geometri bağlaması yok.</p><div id="cards" class="cards"></div><h2>Satır satır sonuçlar</h2><table><thead><tr><th>Satır</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><h2>Rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th></tr></thead><tbody id="routes"></tbody></table><h2>İşlem satırları</h2><table><thead><tr><th>İşlem</th><th>Açıklama</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><h2>Kümülatif</h2><table><tbody id="cum"></tbody></table><script>
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('batch_166_evidence_latest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{
const m=d.metrics,c=d.cumulative;
document.getElementById('cards').innerHTML=[[m.official_pages,'Resmî sayfa'],[m.source_route_attempts_fail_closed,'Rota fail-closed'],[m.revalidated,'Revalidate'],[m.fail_closed,'Fail-closed'],[m.average_confidence+'%','Ortalama güven'],[c.progress+'%','Genel ilerleme']].map(x=>`<div class="card"><div class="n">${e(x[0])}</div>${e(x[1])}</div>`).join('');
document.getElementById('rows').innerHTML=d.rows.map(r=>`<tr><td>${e(r[0])}</td><td>${e(r[1])}</td><td class="${r[3]==='REVALIDATED_EXISTING'?'good':'bad'}">${e(r[3])}</td><td>${e(r[4])}%</td><td>${e(r[5])}</td><td><a href="${e(r[2])}">HMCTS</a></td></tr>`).join('');
document.getElementById('routes').innerHTML=d.source_route_attempts.map((r,i)=>`<tr><td>${i+1}</td><td>${e(r[0])}</td><td class="bad">${e(r[2])}</td><td><a href="${e(r[1])}">HMCTS</a></td></tr>`).join('');
document.getElementById('ops').innerHTML=d.operations.map(o=>`<tr><td>${e(o.id)}</td><td>${e(o.name)}</td><td>${e(o.state)}</td></tr>`).join('');
document.getElementById('cum').innerHTML=`<tr><th>Aday</th><td>${c.candidates}</td><th>Yükseltilen kaynak</th><td>${c.source_upgrades}</td></tr><tr><th>Ağırlıklı doğruluk</th><td>${c.weighted_accuracy}%</td><th>Adres revalidasyonu</th><td>${c.direct_address_revalidated}</td></tr><tr><th>Tamam / toplam</th><td>${c.operations_completed} / ${c.operations_total}</td><th>Artış</th><td>+${c.progress_delta} yüzde puan</td></tr>`;
}).catch(err=>document.body.insertAdjacentHTML('beforeend',`<p class="bad">Veri yüklenemedi: ${e(err.message)}</p>`));
</script></main></body></html>
