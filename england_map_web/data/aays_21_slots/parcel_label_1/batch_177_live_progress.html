<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 177</title><style>body{font-family:system-ui;margin:20px;background:#f7f8fa;color:#172033}main{max-width:1900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.card,table{background:#fff;border:1px solid #d9dee8}.card{padding:10px;border-radius:8px}.n{font-size:1.4rem;font-weight:700}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}th,td{border:1px solid #d9dee8;padding:6px;text-align:left;vertical-align:top}th{background:#eef2f7}.good{color:#176b32}.bad{color:#9b1c1c}</style></head><body><main><h1>parcel_label_1 — Batch 177</h1><p>Kuzey Batı İngiltere ve Cumbria resmî HMCTS revalidation. UPRN/title/polygon/canonical binding yok.</p><div id="cards" class="cards"></div><h2>Satır satır sonuçlar</h2><table><thead><tr><th>Satır</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th><th>Kanıt</th></tr></thead><tbody id="rows"></tbody></table><h2>Rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th><th>Kanıt</th></tr></thead><tbody id="routes"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>İşlem</th><th>Açıklama</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('batch_177_evidence_latest.json').then(r=>r.json()).then(d=>{
const m=d.metrics,c=d.cumulative;document.getElementById('cards').innerHTML=[[m.official_pages,'Resmî sayfa'],[m.source_route_attempts_fail_closed,'Rota fail-closed'],[m.revalidated,'Revalidate'],[m.fail_closed,'Fail-closed'],[m.average_confidence+'%','Ortalama güven'],[c.research_operation_progress_percent+'%','Genel ilerleme']].map(x=>`<div class=card><div class=n>${esc(x[0])}</div>${esc(x[1])}</div>`).join('');
document.getElementById('rows').innerHTML=d.rows.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class=${x[3]==='REVALIDATED_EXISTING'?'good':'bad'}>${esc(x[3])}</td><td>${esc(x[4])}%</td><td>${esc(x[5])}</td><td><a href="${esc(x[2])}">HMCTS</a></td><td>${esc(x[6])}</td></tr>`).join('');
document.getElementById('routes').innerHTML=d.source_route_attempts.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td class=bad>${esc(x[2])}</td><td><a href="${esc(x[1])}">HMCTS</a></td><td>${esc(x[3])}</td></tr>`).join('');
document.getElementById('ops').innerHTML=d.operations.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.state)}</td></tr>`).join('');
}).catch(e=>document.body.insertAdjacentHTML('beforeend','<p class=bad>Evidence yüklenemedi: '+esc(e)+'</p>'));
</script></main></body></html>
