<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 172</title><style>body{font-family:system-ui;margin:24px;background:#f7f8fa;color:#172033}main{max-width:1900px;margin:auto}table{width:100%;border-collapse:collapse;background:#fff;margin:14px 0;font-size:13px}th,td{border:1px solid #d9dee8;padding:7px;text-align:left;vertical-align:top}th{background:#eef2f7}.bad{color:#9b1c1c}.good{color:#176b32}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #d9dee8;border-radius:10px;padding:12px;min-width:150px}</style></head><body><main><h1>parcel_label_1 — Batch 172</h1><div id="app">Yükleniyor…</div></main><script>fetch('batch_172_evidence_latest.json').then(r=>r.json()).then(d=>{const m=d.metrics,c=d.cumulative;let h=`<div class=cards><div class=card>${m.official_pages}<br>Resmî sayfa</div><div class=card>${m.revalidated}<br>Revalidate</div><div class=card>${m.fail_closed}<br>Fail-closed</div><div class=card>${m.average_confidence}%<br>Ortalama güven</div><div class=card>${c.research_operation_progress_percent}%<br>Genel ilerleme</div></div><h2>Satırlar</h2><table><tr><th>ID</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th></tr>`;for(const r of d.rows)h+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td class=${r[3]=='REVALIDATED_EXISTING'?'good':'bad'}>${r[3]}</td><td>${r[4]}%</td><td>${r[5]}</td><td><a href="${r[2]}">HMCTS</a></td></tr>`;h+='</table><h2>Rota denemeleri</h2><table><tr><th>Rota</th><th>Durum</th><th>Kaynak</th></tr>';for(const r of d.source_route_attempts)h+=`<tr><td>${r[0]}</td><td class=bad>${r[2]}</td><td><a href="${r[1]}">HMCTS</a></td></tr>`;h+='</table><h2>İşlemler</h2><table><tr><th>ID</th><th>İşlem</th><th>Durum</th></tr>';for(const o of d.operations)h+=`<tr><td>${o.id}</td><td>${o.name}</td><td>${o.state}</td></tr>`;h+='</table>';document.getElementById('app').innerHTML=h}).catch(e=>document.getElementById('app').textContent='Evidence yüklenemedi: '+e);</script></body></html>
