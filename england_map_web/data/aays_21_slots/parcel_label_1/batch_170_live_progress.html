<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 170</title><style>body{font-family:system-ui;margin:24px;background:#f7f8fa;color:#172033}main{max-width:1900px;margin:auto}table{width:100%;border-collapse:collapse;background:#fff;margin:14px 0;font-size:13px}th,td{border:1px solid #d9dee8;padding:7px;text-align:left;vertical-align:top}th{background:#eef2f7}.bad{color:#9b1c1c}.good{color:#176b32}</style></head><body><main><h1>parcel_label_1 — Batch 170</h1><div id="summary">Yükleniyor…</div><h2>Satır satır sonuçlar</h2><table><thead><tr><th>Satır</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><h2>Rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th></tr></thead><tbody id="routes"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>İşlem</th><th>Açıklama</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><script>fetch('batch_170_evidence_latest.json').then(r=>r.json()).then(d=>{const m=d.metrics,c=d.cumulative;summary.textContent=`Resmî sayfa ${m.official_pages}; revalidate ${m.revalidated}; fail-closed ${m.fail_closed}; rota ${m.source_route_attempts_fail_closed}; güven %${m.average_confidence}; işlem ${m.operations_completed}/${m.operations_total}; genel %${c.research_operation_progress_percent}.`;rows.innerHTML=d.rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="${x[3]==='REVALIDATED_EXISTING'?'good':'bad'}">${x[3]}</td><td>${x[4]}%</td><td>${x[5]}</td><td><a href="${x[2]}">HMCTS</a></td></tr>`).join('');routes.innerHTML=d.source_route_attempts.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td class="bad">${x[2]}</td><td><a href="${x[1]}">HMCTS</a></td></tr>`).join('');ops.innerHTML=d.operations.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.state}</td></tr>`).join('')}).catch(e=>summary.textContent='Kanıt JSON yüklenemedi: '+e);</script></main></body></html>
