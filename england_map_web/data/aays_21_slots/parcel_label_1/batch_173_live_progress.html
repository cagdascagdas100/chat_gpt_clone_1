<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 173</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f7f8fa;color:#172033}main{max-width:1900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}.card{background:#fff;border:1px solid #d9dee8;border-radius:10px;padding:12px}.n{font-size:1.5rem;font-weight:700}table{width:100%;border-collapse:collapse;background:#fff;margin:14px 0;font-size:13px}th,td{border:1px solid #d9dee8;padding:7px;vertical-align:top;text-align:left}th{background:#eef2f7;position:sticky;top:0}.bad{color:#9b1c1c}.good{color:#176b32}.error{padding:16px;background:#fee;border:1px solid #c66}</style></head><body><main><h1>parcel_label_1 — Batch 173 resmî HMCTS revalidation</h1><p>Kent, Surrey, Sussex ve Essex resmî HMCTS sayfaları fail-closed kurallarıyla tarandı. Kanonik parsel, UPRN, title veya geometri bağlaması yapılmadı.</p><div id="app">Yükleniyor…</div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const td=v=>`<td>${e(v)}</td>`;fetch('batch_173_evidence_latest.json').then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{const m=d.metrics,c=d.cumulative;const cards=[[m.official_pages,'Resmî sayfa'],[m.source_route_attempts_fail_closed,'Rota fail-closed'],[m.revalidated,'Revalidate'],[m.fail_closed,'Fail-closed'],[m.average_confidence+'%','Ortalama güven'],[c.research_operation_progress_percent+'%','Genel ilerleme']].map(x=>`<div class="card"><div class="n">${e(x[0])}</div>${e(x[1])}</div>`).join('');const rows=d.rows.map(r=>`<tr>${td(r[0])}${td(r[1])}<td class="${r[3]==='REVALIDATED_EXISTING'?'good':'bad'}">${e(r[3])}</td>${td(r[4]+'%')}${td(r[5])}<td><a href="${e(r[2])}">HMCTS</a></td>${td(r[6])}</tr>`).join('');const routes=d.source_route_attempts.map((r,i)=>`<tr>${td(i+1)}${td(r[0])}<td class="bad">${e(r[2])}</td><td><a href="${e(r[1])}">HMCTS</a></td>${td(r[3])}</tr>`).join('');const ops=d.operations.map(o=>`<tr>${td(o.id)}${td(o.name)}${td(o.state)}</tr>`).join('');document.querySelector('#app').innerHTML=`<div class="cards">${cards}</div><h2>Satır satır sonuçlar</h2><table><thead><tr><th>Satır</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th><th>Web kanıtı</th></tr></thead><tbody>${rows}</tbody></table><h2>Kaynak rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th><th>Web kanıtı</th></tr></thead><tbody>${routes}</tbody></table><h2>İşlem satırları</h2><table><thead><tr><th>İşlem</th><th>Açıklama</th><th>Durum</th></tr></thead><tbody>${ops}</tbody></table><h2>Kümülatif</h2><table><tbody><tr><th>Aday</th>${td(c.visible_research_candidate_rows)}<th>Yükseltilen kaynak</th>${td(c.official_sources_upgraded)}</tr><tr><th>Ağırlıklı doğruluk</th>${td(c.classification_accuracy_weighted_average_percent+'%')}<th>Adres revalidasyonu</th>${td(c.direct_address_revalidated_rows)}</tr><tr><th>Tamam / toplam</th>${td(c.completed_or_fail_closed_operations+' / '+c.visible_operation_rows)}<th>Artış</th>${td('+'+c.research_operation_progress_delta_percent+' yüzde puan')}</tr></tbody></table>`}).catch(err=>document.querySelector('#app').innerHTML=`<div class="error">Veri yüklenemedi: ${e(err.message)}</div>`);</script></body></html>
