<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 Batch 171</title><style>body{font-family:system-ui;margin:24px;background:#f7f8fa;color:#172033}main{max-width:1800px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card,table{background:#fff;border:1px solid #d9dee8}.card{padding:12px;border-radius:10px}.n{font-size:1.5rem;font-weight:700}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}th,td{border:1px solid #d9dee8;padding:7px;text-align:left;vertical-align:top}th{background:#eef2f7}.good{color:#176b32}.bad{color:#9b1c1c}</style></head><body><main><h1>parcel_label_1 — Batch 171</h1><p>Thames Valley, Oxfordshire, Buckinghamshire, Hertfordshire ve Bedfordshire resmî HMCTS revalidation görünümü.</p><div id="cards" class="cards"></div><h2>Satır satır sonuçlar</h2><table><thead><tr><th>ID</th><th>Tesis</th><th>Karar</th><th>Güven</th><th>Gerekçe</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table><h2>Rota denemeleri</h2><table><thead><tr><th>#</th><th>Rota</th><th>Durum</th><th>Kaynak</th></tr></thead><tbody id="routes"></tbody></table><h2>İşlemler</h2><table><thead><tr><th>ID</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="ops"></tbody></table><script>const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('batch_171_evidence_latest.json').then(r=>r.json()).then(d=>{const m=d.metrics,c=[['Resmî sayfa',m.official_pages],['Rota fail-closed',m.source_route_attempts_fail_closed],['Revalidate',m.revalidated],['Fail-closed',m.fail_closed],['Ortalama güven',m.average_confidence+'%'],['Genel ilerleme',d.cumulative.research_operation_progress_percent+'%']];document.querySelector('#cards').innerHTML=c.map(x=>`<div class="card"><div class="n">${e(x[1])}</div>${e(x[0])}</div>`).join('');document.querySelector('#rows').innerHTML=d.rows.map(r=>`<tr><td>${e(r[0])}</td><td>${e(r[1])}</td><td class="${r[3]==='REVALIDATED_EXISTING'?'good':'bad'}">${e(r[3])}</td><td>${e(r[4])}%</td><td>${e(r[5])}</td><td><a href="${e(r[2])}">HMCTS</a></td></tr>`).join('');document.querySelector('#routes').innerHTML=d.source_route_attempts.map((r,i)=>`<tr><td>${i+1}</td><td>${e(r[0])}</td><td class="bad">${e(r[2])}</td><td><a href="${e(r[1])}">HMCTS</a></td></tr>`).join('');document.querySelector('#ops').innerHTML=d.operations.map(o=>`<tr><td>${e(o.id)}</td><td>${e(o.name)}</td><td>${e(o.state)}</td></tr>`).join('')}).catch(err=>document.body.insertAdjacentHTML('beforeend','<p class="bad">Veri yüklenemedi: '+e(err)+'</p>'));</script></main></body></html>
