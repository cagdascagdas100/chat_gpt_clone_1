<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 — Araştırma İlerlemesi</title><style>body{font-family:Arial,sans-serif;margin:18px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6dd;padding:10px;min-width:155px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:13px}th,td{border:1px solid #ccd6dd;padding:7px;text-align:left}th{background:#edf1f3}.BLOCKED{font-weight:700}</style></head><body><h1>parcel_label_1 — Araştırma İlerlemesi</h1><p>Bu görünüm yalnız doğrulanmış araştırma ve işlem sayaçlarını gösterir; canonical parcel bağlaması tamamlanmış sayılmaz.</p><div id="cards" class="cards"></div><table><thead><tr><th>Alan</th><th>Değer</th></tr></thead><tbody id="details"></tbody></table><h2>Son batch bağlantıları</h2><p id="links"></p><p id="runner"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('research_progress_latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const b=d.latest_batch,c=d.cumulative;cards.innerHTML=[['Son batch',d.latest_batch_id],['Aday',b.candidate_rows],['Dışlanan',b.excluded_rows],['Kaynak',b.official_sources_upgraded],['Batch doğruluk','%'+b.accuracy_average_percent],['Genel doğruluk','%'+c.classification_accuracy_weighted_average_percent],['İşlem',c.completed_or_fail_closed_operations+'/'+c.visible_operation_rows],['Genel ilerleme','%'+c.research_operation_progress_percent],['Yüzde artışı','+'+c.research_operation_progress_delta_percent+' puan']].map(x=>`<div class="card"><b>${e(x[0])}</b><br>${e(x[1])}</div>`).join('');[['Görünür aday',c.visible_research_candidate_rows],['Yükseltilen resmî kaynak',c.official_sources_upgraded],['%97+ doğruluk satırı',c.classification_accuracy_ge_97_count],['Bloklu işlem',c.blocked_operations],['Aday görünürlüğü','%'+c.candidate_visibility_percent_of_slot],['Canonical reconciled satır',c.canonical_reconciled_rows],['Exact geometry satır',c.exact_geometry_rows],['Property binding',c.property_bindings],['Yayın durumu',d.publish_state]].forEach(x=>details.insertAdjacentHTML('beforeend',`<tr><td>${e(x[0])}</td><td>${e(x[1])}</td></tr>`));links.innerHTML=`<a href="${e(b.web_progress_path)}">${e(d.latest_batch_id)} satır bazlı görünüm</a> · <a href="${e(b.evidence_path)}">evidence JSON</a>`;runner.className='BLOCKED';runner.textContent='Runner gate: '+d.runner_gate.state+'; historical audit output='+d.runner_gate.historical_audit_output_present+'; host liveness='+d.runner_gate.shared_runner_host_liveness_confirmed}).catch(err=>document.body.insertAdjacentHTML('beforeend','<p class="BLOCKED">'+e(err)+'</p>'));</script></body></html>
