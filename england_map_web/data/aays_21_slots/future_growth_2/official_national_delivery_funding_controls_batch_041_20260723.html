<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_2 Batch 041</title><style>body{font:13px Arial;margin:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:6px;vertical-align:top}th{background:#eee}</style></head><body><h1>future_growth_2 — Batch 041 ulusal teslimat / fonlama kontrolleri</h1><p>45/45 işlem. Başvuru, uygunluk veya fon programı parcel award sayılmaz; exact parcel + hash+UTC olmadan skor yok.</p><table><thead><tr><th>#</th><th>İşlem</th><th>Kaynak / aday</th><th>Durum</th><th>Not</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('official_national_delivery_funding_controls_batch_041_20260723.json').then(r=>r.json()).then(d=>{let a=[],n=0;d.sources.forEach(s=>{['OFFICIAL_SOURCE','AUTHORITY_GATE','APPLICATION_STATUS_GATE','AWARD_LIMITATION_GATE'].forEach(f=>{n++;a.push('<tr><td>'+n+'</td><td>'+f+'</td><td><a href="'+s.url+'">'+s.code+'</a></td><td>VERIFIED_SOURCE_ONLY</td><td>'+s.verified_claim+'</td></tr>')})});d.sample_candidates.forEach(c=>{['CONTEXT_LINK','GEOGRAPHY_GATE','PARCEL_BINDING_GATE','SCORE_GUARD'].forEach(f=>{n++;a.push('<tr><td>'+n+'</td><td>'+f+'</td><td>'+c.row_no+' '+c.parcel_id+' '+c.lpa+'</td><td>'+(f==='PARCEL_BINDING_GATE'?'PENDING_HASHED_EXACT_INTERSECTION':'FAIL_CLOSED')+'</td><td>Fon/program bağlamı exact parcel award değildir.</td></tr>')})});n++;a.push('<tr><td>'+n+'</td><td>BATCH_INTEGRITY</td><td>Batch 041</td><td>PASS</td><td>45/45; exact binding=0; score=null.</td></tr>');document.getElementById('rows').innerHTML=a.join('')})</script></body></html>
