<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>future_growth_2 — resmî kaynak adayları</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #cfd8dc;padding:10px;min-width:150px}table{border-collapse:collapse;width:100%;background:#fff;margin-top:14px;font-size:12px}th,td{border:1px solid #cfd8dc;padding:6px;text-align:left;vertical-align:top}th{background:#eceff1}.ok{color:#176b2c;font-weight:bold}.pending{color:#8a5a00;font-weight:bold}code,a{word-break:break-all}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px}</style></head>
<body><h1>future_growth_2 — satır bazlı resmî kaynak adayları</h1>
<div class="notice">Puan yalnız doğrulanmış parsel/site poligon eşleşmesinden sonra üretilir. Eşleşme yoksa skor null, güven 0 ve NO_DATA korunur.</div>
<div id="cards" class="cards"></div>
<table><thead><tr><th>Satır</th><th>Parsel</th><th>Belediye</th><th>Konum</th><th>Resmî kaynaklar</th><th>Kaynak otoritesi</th><th>Parsel bağlama</th><th>FG skor</th><th>Güven</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table>
<p id="meta"></p><p id="error"></p>
<script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./official_source_candidates_batch_001_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{const cards=[['Aday satır',d.row_count],['Resmî kaynak',d.unique_official_source_count],['%100 kaynak otoritesi',d.source_authority_100_rows],['Parsel eşleşen',d.parcel_bound_rows],['Skorlu business satırı',d.scored_business_rows],['Aday kapsamı',d.candidate_coverage_pct+'%'],['Business kapsamı',d.business_coverage_pct+'%']];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');document.getElementById('rows').innerHTML=d.rows.map(x=>`<tr><td>${e(x.row_no)}</td><td>${e(x.program_parcel_id)}</td><td>${e(x.lpa_name)}</td><td>${e(x.latitude)}, ${e(x.longitude)}</td><td>${x.official_sources.map(s=>`<a href="${e(s.url)}" target="_blank" rel="noopener">${e(s.title)}</a><br><small>${e(s.role)}</small>`).join('<hr>')}</td><td class="ok">${e(x.source_authority_pct)}%</td><td class="pending">${e(x.parcel_binding_method)} (${e(x.parcel_binding_confidence_pct)}%)</td><td>${x.future_growth_score===null?'null':e(x.future_growth_score)}</td><td>${e(x.confidence_pct)}%</td><td>${e(x.data_status)} / ${e(x.candidate_status)}</td></tr>`).join('');document.getElementById('meta').innerHTML=`Continuation: <code>${e(d.continuation_key)}</code><br>Kaynak HEAD: <code>${e(d.source_head)}</code><br>Üretim: ${e(d.generated_at)}`}).catch(x=>document.getElementById('error').textContent='Veri yüklenemedi: '+x.message);</script></body></html>
