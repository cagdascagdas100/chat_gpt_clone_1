<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_2 Batch 050</title><style>body{font:13px Arial;margin:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:6px;vertical-align:top}th{background:#eee}</style></head><body><h1>future_growth_2 — Batch 050</h1><p>45/45 işlem. Adopted/emerging/evidence-age ayrımı ve borough sınırı korunur; exact parcel binding olmadan skor yok.</p><table><thead><tr><th>#</th><th>İşlem</th><th>Kaynak / aday</th><th>Durum</th><th>Not</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('official_plan_evidence_status_boundaries_batch_050_20260723.json').then(r=>r.json()).then(d=>{let a=[],n=0;d.sources.forEach(s=>['OFFICIAL_SOURCE','AUTHORITY_GATE','ADOPTED_EMERGING_OR_EVIDENCE_AGE_GATE','BOROUGH_SCOPE_LIMITATION_GATE'].forEach(f=>{n++;a.push(`<tr><td>${n}</td><td>${f}</td><td><a href="${s.url}">${s.code}</a></td><td>VERIFIED_SOURCE_ONLY</td><td>${s.verified_claim}</td></tr>`)}));d.sample_candidates.forEach(c=>['PLAN_EVIDENCE_CONTEXT_LINK','GEOGRAPHY_SCOPE_GATE','PARCEL_BINDING_GATE','SCORE_GUARD'].forEach(f=>{n++;a.push(`<tr><td>${n}</td><td>${f}</td><td>${c.row_no} ${c.parcel_id} ${c.lpa} — ${(c.source_codes||[]).join(', ')}</td><td>${f==='PARCEL_BINDING_GATE'?'PENDING_HASHED_EXACT_INTERSECTION':'FAIL_CLOSED'}</td><td>Adopted/emerging/evidence context exact parcel outcome değildir.</td></tr>`)}));n++;a.push(`<tr><td>${n}</td><td>BATCH_INTEGRITY</td><td>Batch 050</td><td>PASS</td><td>45/45; borough scope guard PASS; exact binding=0; score=null.</td></tr>`);rows.innerHTML=a.join('')})</script></body></html>
