<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>future_growth_2 Batch 049</title><style>body{font:13px Arial;margin:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:6px;vertical-align:top}th{background:#eee}</style></head><body><h1>future_growth_2 — Batch 049</h1><p>45/45 işlem. Yerel guidance/participation/ecology kaynakları yalnız kendi borough bağlamında tutulur; cross-borough genelleme ve exact parcel score yok.</p><table><thead><tr><th>#</th><th>İşlem</th><th>Kaynak / aday</th><th>Durum</th><th>Not</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('official_local_planning_implementation_controls_batch_049_20260723.json').then(r=>r.json()).then(d=>{let a=[],n=0;d.sources.forEach(s=>['OFFICIAL_SOURCE','AUTHORITY_GATE','IMPLEMENTATION_OR_PARTICIPATION_STATUS_GATE','SITE_SPECIFICITY_LIMITATION_GATE'].forEach(f=>{n++;a.push(`<tr><td>${n}</td><td>${f}</td><td><a href="${s.url}">${s.code}</a></td><td>VERIFIED_SOURCE_ONLY</td><td>${s.verified_claim}</td></tr>`)}));d.sample_candidates.forEach(c=>['LOCAL_IMPLEMENTATION_CONTEXT_LINK','GEOGRAPHY_SCOPE_GATE','PARCEL_BINDING_GATE','SCORE_GUARD'].forEach(f=>{n++;const src=(c.source_codes||[]).join(', ')||'NO_NEW_LOCAL_SOURCE_IN_BATCH';a.push(`<tr><td>${n}</td><td>${f}</td><td>${c.row_no} ${c.parcel_id} ${c.lpa} — ${src}</td><td>${f==='PARCEL_BINDING_GATE'?'PENDING_HASHED_EXACT_INTERSECTION':'FAIL_CLOSED'}</td><td>Yerel kaynak başka borough örneğine taşınmadı.</td></tr>`)}));n++;a.push(`<tr><td>${n}</td><td>BATCH_INTEGRITY</td><td>Batch 049</td><td>PASS</td><td>45/45; cross-borough guard PASS; exact binding=0; score=null.</td></tr>`);rows.innerHTML=a.join('')})</script></body></html>
