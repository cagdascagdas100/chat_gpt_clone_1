<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>future_growth_2 — exact query ledger batch 010</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8;color:#17202a}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd;padding:9px;min-width:145px}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:12px}.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}select,input{padding:6px}table{border-collapse:collapse;width:100%;background:#fff;font-size:11px}th,td{border:1px solid #ccd;padding:5px;vertical-align:top;text-align:left}th{position:sticky;top:0;background:#eef}.ok{color:#176b2c;font-weight:bold}.pending{color:#8a5a00;font-weight:bold}a,code{word-break:break-all}</style></head><body><h1>future_growth_2 — satır satır exact-query kanıt defteri / batch 010</h1><div class="notice">Sorgu şablonu canlı yanıt değildir. Ham resmî yanıt, UTC zaman damgası, SHA-256 ve birincil kaynak çapraz kontrolü olmadan kesin bağ, skor veya güven üretilmez.</div><div id="cards" class="cards"></div><div class="filters"><select id="lpa"><option value="">Tümü</option><option>Enfield</option><option>Havering</option><option>Lambeth</option><option>REGIONAL</option><option>England</option><option>—</option></select><input id="q" placeholder="İşlem, kaynak veya sonuç ara"></div><table><thead><tr><th>#</th><th>Satır</th><th>Parsel</th><th>Belediye</th><th>İşlem</th><th>Konu</th><th>Kaynak</th><th>Sonuç</th><th>Kanıt</th><th>Kaynak</th><th>Bağ</th><th>Skor</th><th>Güven</th><th>Not</th></tr></thead><tbody id="ops"></tbody></table><p id="meta"></p><p id="err"></p><script>
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d,ops=[];function add(x){ops.push({operation_no:ops.length+1,source_authority_pct:100,parcel_binding_pct:0,future_growth_score:null,confidence_pct:0,data_status:'NO_DATA',...x})}function enc(o){return new URLSearchParams(o).toString()}function arc(r,id,base=r.service){return `${base}/${id}/query?${enc({f:'json',where:'1=1',geometry:`${r.lon},${r.lat}`,geometryType:'esriGeometryPoint',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'*',returnGeometry:'false'})}`}function pd(r,ds){const p=new URLSearchParams();p.set('latitude',r.lat);p.set('longitude',r.lon);p.set('dataset',ds);['name','dataset','reference','entity','quality'].forEach(x=>p.append('field',x));p.set('limit','100');return 'https://www.planning.data.gov.uk/entity.json?'+p}function build(){ops=[];const canon='https://github.com/cagdascagdas100/chat_gpt_clone_1/blob/codex/aays-single-runner-v5-20260706/england_map_web/data/aays_21_slots/height_difference_2/canonical_points_runtime_032.json';d.rows.forEach(r=>add({row_no:r.row_no,parcel_id:r.parcel_id,lpa:r.lpa,operation:'CANONICAL_POINT_IDENTITY',subject:`${r.lon},${r.lat}`,source:canon,result:'VERIFIED_CANONICAL_POINT',evidence_class:'CANONICAL_ROW_POINT',note:'Canonical WGS84 sample point revalidated; parcel polygon is not asserted.'}));d.rows.forEach(r=>r.layers.forEach(z=>add({row_no:r.row_no,parcel_id:r.parcel_id,lpa:r.lpa,operation:'EXACT_ARCGIS_POINT_QUERY_JOB',subject:`${z[1]} (layer ${z[0]})`,source:arc(r,z[0]),result:'READY_EXECUTION_PENDING',evidence_class:'OFFICIAL_EXACT_QUERY_TEMPLATE',note:'Raw response, timestamp and SHA-256 must be committed before applicability.'})));d.rows.forEach(r=>d.planning_datasets.forEach(ds=>add({row_no:r.row_no,parcel_id:r.parcel_id,lpa:r.lpa,operation:'PLANNING_DATA_POINT_QUERY_JOB',subject:ds,source:pd(r,ds),result:'READY_EXECUTION_PENDING',evidence_class:'OFFICIAL_COORDINATE_QUERY_TEMPLATE',note:'Absence is dataset-specific and not proof of no constraints.'})));d.rows.forEach(r=>{add({row_no:r.row_no,parcel_id:r.parcel_id,lpa:r.lpa,operation:'GLA_OPPORTUNITY_AREA_QUERY_JOB',subject:'Opportunity Areas layer 103',source:arc(r,103,'https://gis2.london.gov.uk/server/rest/services/apps/planning_data_map_02/MapServer'),result:'READY_EXECUTION_PENDING',evidence_class:'REGIONAL_INDICATIVE_POLYGON_QUERY',note:'Borough confirmation required.'});add({row_no:r.row_no,parcel_id:r.parcel_id,lpa:r.lpa,operation:'LAMBETH_BROWNFIELD_QUERY_JOB',subject:'Lambeth Brownfield layer 2',source:arc(r,2,'https://gis.lambeth.gov.uk/arcgis/rest/services/LambethBrownfieldLandRegister/MapServer'),result:'READY_EXECUTION_PENDING',evidence_class:'PRIMARY_COUNCIL_POLYGON_QUERY',note:'Non-Lambeth rows are control queries.'})});d.rows.forEach(r=>d.response_preconditions.forEach(x=>add({row_no:r.row_no,parcel_id:r.parcel_id,lpa:r.lpa,operation:'RESPONSE_EVIDENCE_PRECONDITION',subject:x.code,source:d.validator_path,result:'REQUIRED_BEFORE_BINDING',evidence_class:'EVIDENCE_LEDGER_GATE',note:x.note})));d.current_sources.forEach(x=>add({row_no:x.row_no,parcel_id:x.parcel_id,lpa:x.lpa,operation:'CURRENT_OFFICIAL_SOURCE',subject:x.subject,source:x.source,result:'VERIFIED_CURRENT_SOURCE',evidence_class:'CURRENT_OFFICIAL_POLICY_OR_MONITORING',note:x.note}));d.national_dataset_status.forEach(x=>add({row_no:'NATIONAL',parcel_id:'—',lpa:'England',operation:'NATIONAL_DATASET_STATUS',subject:x.subject,source:x.source,result:'VERIFIED_OFFICIAL_DATASET_PAGE',evidence_class:'NATIONAL_DATASET_FRESHNESS_OR_QUALITY',note:x.note}));d.scoring_gates.forEach(x=>add({row_no:'SYSTEM',parcel_id:'—',lpa:'—',operation:'SCORING_GOVERNANCE_GATE',subject:x.code,source:d.validator_path,result:'REQUIRED_BEFORE_SCORE',evidence_class:'SCORE_SAFETY_GATE',note:x.note}));d.crosschecks.forEach(x=>add({row_no:x.row_no,parcel_id:x.parcel_id,lpa:x.lpa,operation:'CROSS_SOURCE_CONSISTENCY',subject:x.code,source:x.source,result:'PASS_FAIL_CLOSED',evidence_class:'CONSISTENCY_GATE',note:x.note}));d.system_validations.forEach(x=>add({row_no:'SYSTEM',parcel_id:'—',lpa:'—',operation:'SYSTEM_VALIDATION',subject:x.code,source:d.validator_path,result:x.result,evidence_class:'SYSTEM_VALIDATION',note:x.note}));if(ops.length!==180)throw Error(`İşlem sayısı ${ops.length}/180`)}function render(){const l=document.getElementById('lpa').value,q=document.getElementById('q').value.toLowerCase();const a=ops.filter(x=>(!l||String(x.lpa)===l)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById('ops').innerHTML=a.map(x=>`<tr><td>${e(x.operation_no)}</td><td>${e(x.row_no)}</td><td>${e(x.parcel_id)}</td><td>${e(x.lpa)}</td><td>${e(x.operation)}</td><td>${e(x.subject)}</td><td><a href="${e(x.source)}" target="_blank" rel="noopener">${e(x.source)}</a></td><td class="${String(x.result).includes('PENDING')||String(x.result).includes('REQUIRED')?'pending':'ok'}">${e(x.result)}</td><td>${e(x.evidence_class)}</td><td class="ok">100%</td><td class="pending">0%</td><td>null</td><td>0%</td><td>${e(x.note)}</td></tr>`).join('')}fetch('./official_exact_query_evidence_ledger_batch_010_20260722.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(async x=>{const ps=await Promise.all(x.parts.map(p=>fetch('./'+p.path,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p.path+' HTTP '+r.status);return r.json()})));ps.forEach(p=>Object.assign(x,p));d=x;build();const c=[['Batch',d.batch_operations_completed+'/'+d.batch_operations_total],['Kümülatif',d.cumulative_operations_completed],['Aday',d.candidate_rows_cumulative],['Kaynak',d.cumulative_unique_official_source_pages],['Yeni kaynak',d.new_unique_official_source_pages],['Exact sorgu',d.exact_query_jobs],['Yanıt kapısı',d.response_evidence_precondition_rows],['Güncel kaynak',d.current_official_source_rows],['Dataset durum',d.national_dataset_status_rows],['Skor kapısı',d.scoring_governance_gate_rows],['Kesin bağ',d.exact_parcel_bound_rows],['Ledger ilerleme',d.exact_query_ledger_progress_pct+'%'],['Business',d.business_coverage_pct+'%']];document.getElementById('cards').innerHTML=c.map(v=>`<div class="card">${e(v[0])}<br><b>${e(v[1])}</b></div>`).join('');document.getElementById('meta').innerHTML=`Continuation: <code>${e(d.continuation_key)}</code><br>Toplam satır: ${e(ops.length)}`;document.getElementById('lpa').onchange=render;document.getElementById('q').oninput=render;render()}).catch(x=>document.getElementById('err').textContent=x.message)
</script></body></html>
