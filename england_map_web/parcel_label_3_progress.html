<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>parcel_label_3 ilerleme</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;line-height:1.45;color:#111;background:#f7f8fa}
    h1{margin-bottom:6px}.muted{color:#555}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:18px 0}
    .card{border:1px solid #bbb;border-radius:8px;padding:12px;background:#fff}.value{font-size:21px;font-weight:700}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;margin-bottom:28px}
    th,td{border:1px solid #bbb;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#fff}.ok{font-weight:700}.warn{font-weight:700}.bad{font-weight:700;color:#a00}code{white-space:nowrap}.audit-link{margin:12px 0 18px}.blockers{background:#fff;border:1px solid #bbb;border-radius:8px;padding:10px;margin-bottom:20px}
  </style>
</head>
<body>
  <h1>parcel_label_3</h1>
  <div class="muted">61523–92283 · resmî kaynak adayları · canonical geometri bağlaması bekliyor</div>
  <div class="audit-link"><a href="parcel_label_3_historical_audit.html">198 satırlık tarihsel artifact audit tablosunu aç</a></div>
  <div class="summary" id="summary"></div>
  <div id="blockers"></div>
  <h2>İşlem satırları</h2>
  <table><thead><tr><th>#</th><th>İşlem</th><th>Kapsam</th><th>Durum</th><th>Sonuç</th></tr></thead><tbody id="operations"><tr><td colspan="5">Yükleniyor…</td></tr></tbody></table>
  <h2>Aday satırları</h2>
  <table>
    <thead><tr><th>#</th><th>Batch</th><th>Aday ID</th><th>Yer</th><th>Sınıf</th><th>Doğruluk</th><th>Kaynak</th><th>Kanıt özeti</th><th>Resmî kapsam</th><th>Geometri</th><th>Bloker</th></tr></thead>
    <tbody id="rows"><tr><td colspan="11">Yükleniyor…</td></tr></tbody>
  </table>
<script>
const base='data/distance_property_types/';
const files=[
 ['B1-2','parcel_label_3_candidates.json'],['B3','parcel_label_3_candidates_batch_3.json'],['B4','parcel_label_3_candidates_batch_4.json'],['B5','parcel_label_3_candidates_batch_5.json'],['B6','parcel_label_3_candidates_batch_6.json'],['B7','parcel_label_3_candidates_batch_7.json']
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(path){const r=await fetch(base+path,{cache:'no-store'});if(!r.ok)throw new Error(path+' HTTP '+r.status);return r.json()}
function card(label,value){return `<div class="card"><div class="muted">${esc(label)}</div><div class="value">${esc(value)}</div></div>`}
Promise.all([load('parcel_label_3_progress_latest.json'),load('parcel_label_3_operations_latest.json'),Promise.all(files.map(([label,path])=>load(path).then(data=>({label,data}))))])
 .then(([p,o,batches])=>{
   const rows=batches.flatMap(({label,data})=>(data.candidates||[]).map(c=>({...c,batch_label:label})));
   document.getElementById('summary').innerHTML=[
    ['Genel ilerleme','%'+Number(p.workflow_percent).toFixed(2)],['Yüzde artışı','+'+Number(p.workflow_percent_delta).toFixed(2)],['İşlemler',p.completed_operations+' / '+p.total_operations],
    ['Görünür aday',rows.length],['Yükseltilen kaynak',p.promoted_sources],['≥97 doğruluk',p.source_authority_accuracy_ge_97_count],['Ortalama doğruluk','%'+Number(p.classification_accuracy_average_percent).toFixed(2)],
    ['Tarihsel artifact',p.historical_artifact_rows],['Örnek ayrıştırılan',p.historical_sample_rows_parsed],['Canonical slot satırı',p.verified_slot_rows],['Exact geometri',p.exact_geometry_rows]
   ].map(x=>card(x[0],x[1])).join('');
   document.getElementById('blockers').innerHTML='<div class="blockers"><b>Aktif engeller</b><ul>'+p.blockers.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
   document.getElementById('operations').innerHTML=(o.rows||[]).map(r=>`<tr><td>${esc(r.line)}</td><td>${esc(r.operation)}</td><td>${esc(r.scope)}</td><td class="${r.status==='COMPLETE'?'ok':r.status==='BLOCKED'?'bad':'warn'}">${esc(r.status)}</td><td>${esc(r.result)}</td></tr>`).join('');
   document.getElementById('rows').innerHTML=rows.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.batch_label)}</td><td><code>${esc(c.parcel_id)}</code></td><td>${esc(c.parcel_ref)}</td><td>${esc(c.selected_property_type)}</td><td>%${esc(c.accuracy_percent)}</td><td><a href="${esc(c.source_url)}" target="_blank" rel="noopener">resmî kaynak</a></td><td>${esc(c.fresh_evidence)}</td><td>${esc(c.official_scope)}</td><td class="warn">${esc(c.geometry_status)}</td><td>${esc(c.conflict_status)}</td></tr>`).join('');
 }).catch(e=>{document.getElementById('rows').innerHTML=`<tr><td colspan="11">${esc(e.message)}</td></tr>`;document.getElementById('operations').innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`});
setInterval(()=>location.reload(),60000);
</script>
</body>
</html>
