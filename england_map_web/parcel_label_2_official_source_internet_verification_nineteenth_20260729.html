<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paket 19 — Resmî Kaynak Doğrulaması</title><style>body{font:14px Arial;margin:24px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:9px;flex-wrap:wrap}.card{background:#fff;border:1px solid #ccd6e0;padding:11px}table{width:100%;border-collapse:collapse;background:#fff;margin-top:14px}th,td{border:1px solid #d5d8dc;padding:8px;text-align:left}th{background:#edf2f7}.pass{color:#176b32;font-weight:bold}.bad{color:#991b1b}</style></head><body><h1>Paket 19 — Resmî Kaynak Doğrulaması</h1><div id="cards" class="cards"></div><table><thead><tr><th>#</th><th>Kaynak</th><th>Sonuç</th><th>Destek</th></tr></thead><tbody id="rows"></tbody></table><p id="err" class="bad"></p><script>const e=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));fetch('../docs/chatgpt_status/_shared/slots_21/parcel_label_2/recovery/official_source_internet_verification_nineteenth_20260729.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{cards.innerHTML=[['Kaynak',d.scope.sources_passed+'/'+d.scope.sources_total],['Aday',d.scope.candidates_supported],['Satır',d.scope.activity_rows_supported]].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');rows.innerHTML=d.sources.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.publisher)} — ${e(x.official_domain)}</td><td class="pass">${e(x.current_internet_verification)}</td><td>${x.candidate_count} aday / ${x.supported_activity_rows} satır</td></tr>`).join('')}).catch(x=>err.textContent=x.message);</script></body></html>
