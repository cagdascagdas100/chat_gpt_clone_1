<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_2 — Batch 1121-1160 geçici duplicate audit</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:#fff;border:1px solid #d5d8dc;padding:12px;min-width:155px}table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px;font-size:13px}th,td{border:1px solid #d5d8dc;padding:8px;text-align:left;vertical-align:top}th{background:#edf2f7}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px}.bad{color:#991b1b}code,a{word-break:break-all}</style></head><body>
<h1>parcel_label_2 — Batch 1121-1160 geçici duplicate audit</h1>
<div class="warn">Bu sayfa düzeltme öncesi audit geçmişini görünür kılar. Aday adları güncel düzeltilmiş dosyalardan gelir; audit sonucu düzeltme öncesi sürümü tanımlar ve son kaynak düzeltme raporu tarafından superseded edilmiştir.</div>
<div id="cards" class="cards"></div>
<table><thead><tr><th>Sıra</th><th>Aday ID</th><th>Sınıf</th><th>İşlem</th><th>Sonuç</th></tr></thead><tbody id="activity"></tbody></table><p id="error" class="bad"></p>
<script>
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const files=[
"./data/distance_property_types/parcel_label_2_candidates_batches1121_1160_retail.json",
"./data/distance_property_types/parcel_label_2_candidates_batches1121_1160_office.json",
"./data/distance_property_types/parcel_label_2_candidates_batches1121_1160_mixed.json",
"./data/distance_property_types/parcel_label_2_candidates_batches1121_1160_apartment.json",
"./data/distance_property_types/parcel_label_2_candidates_batches1121_1160_detached.json",
"./data/distance_property_types/parcel_label_2_candidates_batches1121_1160_industrial.json"];
const norm=d=>Array.isArray(d.candidates)?d.candidates.map(r=>Object.assign({},d.defaults,Object.fromEntries(d.columns.map((k,i)=>[k,r[i]])),{class_name:d.class_name})):d.names.map((name,i)=>({parcel_id:`SOURCE_PL2_B${d.research_batch_start+i}_${d.id_code}`,parcel_ref:name,class_name:d.class_name}));
Promise.all(files.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()}))).then(ds=>{
 const cs=ds.flatMap(norm);
 const steps=[
 ['PROVISIONAL_AUDIT_ROW_LOADED','Aday ID düzeltme öncesi audit kapsamına bağlandı'],
 ['EXACT_REF_DUPLICATE_CHECK_RECORDED','Geçici audit en az 114 kesin tekrar saptadı'],
 ['SEMANTIC_REUSE_REVIEW_RECORDED','76 satır manuel/semantik tekrar incelemesine ayrıldı'],
 ['AUDIT_SUPERSEDED_BY_SOURCE_CORRECTION','Bu audit düzeltme öncesi dosyaları tanımlar ve son düzeltmeyle superseded edildi'],
 ['AUDIT_HISTORY_WEB_ROW_PUBLISHED','Tarihsel audit satırı web görünürlüğüne eklendi']];
 cards.innerHTML=[['Batch','1121-1160 provisional'],['Denetlenen aday ID',cs.length],['Audit satırı',cs.length*5],['Kesin tekrar minimum',114],['Yüksek güven minimum',50],['Manuel/semantik inceleme',76],['Durum','SUPERSEDED'],['Kanonik satır',0]].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');
 let seq=36229,rows=[];
 for(const x of cs)for(const s of steps)rows.push(`<tr><td>${seq++}</td><td><code>${e(x.parcel_id)}</code></td><td>${e(x.class_name)}</td><td><code>${e(s[0])}</code></td><td>${e(s[1])}</td></tr>`);
 activity.innerHTML=rows.join('');
}).catch(x=>error.textContent='Veri yüklenemedi: '+x.message);
</script></body></html>
