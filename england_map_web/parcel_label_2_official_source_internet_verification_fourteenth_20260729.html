<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_2 — On Dördüncü Paket Kaynak Denetimi</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.card,section{background:#fff;border:1px solid #d5d8dc;padding:12px;min-width:150px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px}table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px;font-size:13px}th,td{border:1px solid #d5d8dc;padding:8px;text-align:left;vertical-align:top}th{background:#edf2f7}code,a{word-break:break-all}.pass{color:#176b32;font-weight:700}.hold{color:#9a6700;font-weight:700}.bad{color:#991b1b}</style></head><body><h1>parcel_label_2 — On Dördüncü Paket Resmî İnternet Kaynak Denetimi</h1><div class="warn">Bu sayfa kaynak-yapı sınıfı denetimini gösterir. Kanonik parsel kimliği ve geometri NOT_BOUND kalır.</div><div id="cards" class="cards"></div><table><thead><tr><th>Satır</th><th>Kod</th><th>Yayıncı</th><th>Alan adı</th><th>Sınıf</th><th>Aday</th><th>Kanıt</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table><p id="error" class="bad"></p><script>const source='../docs/chatgpt_status/_shared/slots_21/parcel_label_2/recovery/official_source_internet_verification_fourteenth_20260729.json';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{cards.innerHTML=[['Resmî kaynak',d.scope.official_sources_passed+'/'+d.scope.official_sources_total],['Aday desteği',d.scope.candidate_rows_supported],['İşlem satırı',d.scope.activity_rows_supported],['Minimum doğruluk',d.scope.minimum_accuracy_percent+'%'],['Kanonik bağ',d.quality_gates.canonical_binding]].map(x=>`<div class="card">${e(x[0])}<br><b>${e(x[1])}</b></div>`).join('');rows.innerHTML=d.rows.map(r=>`<tr><td>${e(r.row)}</td><td><code>${e(r.source_code)}</code></td><td>${e(r.publisher)}</td><td>${e(r.official_domain)}</td><td>${e(r.class_name)}</td><td>${e(r.candidate_count)}</td><td>${e(r.evidence)}</td><td class="pass">${e(r.result)}</td></tr>`).join('')}).catch(x=>error.textContent='Kaynak denetimi yüklenemedi: '+x.message);</script></body></html>
