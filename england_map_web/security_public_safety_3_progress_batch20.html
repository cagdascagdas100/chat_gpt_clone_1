<!doctype html><html><head><meta charset="utf-8"><title>security_public_safety_3 Batch20 Progress</title><style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:24px;background:#f7f7f8;color:#1f2328}
h1{margin:0 0 8px} .meta{margin:0 0 16px;color:#555}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid #d0d7de;padding:7px;vertical-align:top;text-align:left}
th{position:sticky;top:0;background:#f0f3f6}
.status{padding:10px;margin:12px 0;border:1px solid #d0d7de;background:#fff}
.err{color:#b42318;font-weight:700}.ok{color:#067647;font-weight:700}
a{word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0} .card{background:#fff;border:1px solid #d0d7de;padding:12px} .v{font-size:24px;font-weight:700}
</style></head><body><h1>security_public_safety_3 — Batch20 progress</h1>
<p class="meta">Fail-closed 8-second loader · runtime acceptance remains separate</p><div id="status" class="status">Loading…</div><div id="cards" class="cards"></div>
<table><thead><tr><th>Gate</th><th>Value</th></tr></thead><tbody id="gates"></tbody></table>
<script>
async function fetchJson(url){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch(url,{cache:'no-store',signal:c.signal}); if(!r.ok) throw new Error(`${r.status} ${r.statusText}`); return await r.json();}
  finally{clearTimeout(t)}
}
(async()=>{const st=document.getElementById('status'),cards=document.getElementById('cards'),g=document.getElementById('gates');
try{const p=await fetchJson('data/security_public_safety/security_public_safety_3_progress_batch20_continue_20260723.json');
const items=[['Overall',p.overall_progress_percent+'%'],['Precise',p.precise_progress_percent+'%'],['Delta','+'+p.progress_delta_percent+'%'],['Operations',p.completed_operations+' / '+p.total_operations],['Unique sources',p.official_source_candidates],['Promoted',p.promoted_sources],['Held',p.held_sources],['Visible rows',p.visible_total_line_rows]];
for(const [k,v] of items){cards.innerHTML+=`<div class="card"><div>${k}</div><div class="v">${v}</div></div>`}
const gates=[['Accuracy ≥90',p.source_authority_accuracy_ge_90_count],['Accuracy ≥95',p.source_authority_accuracy_ge_95_count],['Runtime checks passed',p.smoke_runtime_checks_passed],['Runtime checks pending',p.smoke_runtime_checks_pending],['Final hashes',p.final_artifact_hash_present_count+' / '+p.final_artifact_hash_expected_count],['Verified rows',p.accuracy_score_4_rows],['Actual rows written',p.actual_slot_rows_written],['Manual action',p.manual_action_state],['final_ready',p.final_ready]];
for(const [k,v] of gates){g.innerHTML+=`<tr><td>${k}</td><td>${v}</td></tr>`}
st.className='status ok';st.textContent='Progress JSON loaded. Research package published; runner acceptance is still blocked.';
}catch(e){st.className='status err';st.textContent='FAIL-CLOSED: '+e.message;cards.innerHTML='';g.innerHTML='';}})();
</script></body></html>
