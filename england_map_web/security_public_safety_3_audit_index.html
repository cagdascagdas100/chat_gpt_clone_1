<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 Audit Index</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}th{background:#eef1f4}.muted{color:#666}a{color:#075985}</style></head><body><h1>security_public_safety_3 denetim indeksi</h1><div class="muted">Bütün görünür kalite ve örnek denetimleri · 60 saniyede yenilenir</div><div id="summary" class="grid"></div><div id="table"></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(l,v,c='')=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></div>`;async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json()}async function main(){try{const base='data/security_public_safety/';const[p,q,pre,m,r]=await Promise.all([j(base+'security_public_safety_3_progress_latest.json'),j(base+'security_public_safety_3_source_quality_audit_latest.json'),j(base+'security_public_safety_3_sample_preflight_latest.json'),j(base+'security_public_safety_3_sample_method_audit_latest.json'),j(base+'security_public_safety_3_sample_response_contract_latest.json')]);const rows=[['Ana ilerleme',p.visible_operation_rows||0,'security_public_safety_3_progress.html','runtime ve işlem geçmişi'],['Kaynak kalite',q.row_count||q.rows.length,'security_public_safety_3_quality_audit.html','resmî kaynak doğruluğu ve kullanım sınırları'],['Örnek preflight',pre.row_count||pre.rows.length,'security_public_safety_3_sample_preflight.html','koordinat ve API hazırlık kapıları'],['Örnek yöntem',m.row_count||m.rows.length,'security_public_safety_3_sample_method_audit.html','tazelik, kapsam ve veri karantinası'],['Yanıt sözleşmesi',r.row_count||r.rows.length,'security_public_safety_3_sample_response_contract.html','kimlik, nullable alan ve hata semantiği']];const total=rows.reduce((a,x)=>a+Number(x[1]||0),0);document.getElementById('summary').innerHTML=card('Genel ilerleme','%'+p.overall_progress_percent,'ok')+card('Tamamlanan',p.completed_operations+' / '+p.total_operations)+card('Kaynak',p.official_source_candidates,'ok')+card('Denetim bölümü',rows.length)+card('İndekslenen satır',total)+card('Yayımlanan skor',p.published_score_row_count||0,'warn');document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>Bölüm</th><th>Satır sayısı</th><th>Sayfa</th><th>Kapsam</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td><a href="${esc(x[2])}">${esc(x[2])}</a></td><td>${esc(x[3])}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('table').textContent=e.stack||e}}main();setInterval(main,60000);</script></body></html>
