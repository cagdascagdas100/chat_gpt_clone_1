<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 Dört Kapı Kanıtı</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#f6f7f9;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.value{font-size:24px;font-weight:700}.ok{color:#16794b}.warn{color:#a05a00}.bad{color:#b42318}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px;vertical-align:top}th{background:#eef1f4}.muted{color:#666}</style></head><body><h1>security_public_safety_3 · dört kapı kanıt eşleme</h1><div class="muted">Üç örnek parsel · 60 saniyede yenilenir · skorlar runtime ve manifest geçmeden null</div><div id="summary" class="grid"></div><div id="table"></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(l,v,c='')=>`<div class="card"><div class="muted">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></div>`;async function main(){try{const r=await fetch('data/security_public_safety/security_public_safety_3_sample_four_gate_evidence_latest.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('summary').innerHTML=card('Toplam satır',d.row_count)+card('Hazır koruma',d.pass_or_guard_ready_count,'ok')+card('Runtime bekleyen',d.ready_not_executed_count,'warn')+card('Bloklu',d.blocked_runtime_count,'bad')+card('Yazılan skor',d.actual_slot_rows_written||0)+card('Yayımlanan skor',d.published_score_rows||0);document.getElementById('table').innerHTML=`<table><thead><tr><th>Satır</th><th>Parsel</th><th>Kapı</th><th>Durum</th><th>Gözlem</th><th>Kaynak</th><th>Yayın etkisi</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td>${x.line}</td><td>${esc(x.parcel_id)}</td><td>${esc(x.gate)}</td><td>${esc(x.status)}</td><td>${esc(x.observed)}</td><td>${esc(x.source)}</td><td>${esc(x.release_effect)}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('table').textContent=e.stack||e}}main();setInterval(main,60000);</script></body></html>
