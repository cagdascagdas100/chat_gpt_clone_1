<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Public Safety 3 — Batch6 Kaynakları</title><style>body{font-family:system-ui;margin:24px;background:#f6f7f9;color:#111}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #d6d9dd;padding:8px;vertical-align:top;font-size:13px}th{background:#eef1f4;position:sticky;top:0}.ok{color:#16794b}.hold{color:#9a5b00}.muted{color:#666}.cards{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:12px}</style></head><body><h1>Security/Public Safety — Batch6 resmî kaynak adayları</h1><div class="muted">Kaynak doğrulaması parsel kanıtı değildir. Kişi verisi tutulmaz; future release satırları yayımlanana kadar held kalır.</div><div id="cards" class="cards"></div><table><thead><tr><th>Satır</th><th>ID</th><th>Kaynak</th><th>Yayıncı</th><th>Tarih</th><th>Karar</th><th>Güven</th><th>Semantik sınır</th><th>Resmî sayfa</th></tr></thead><tbody id="rows"></tbody></table><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('data/security_public_safety/security_public_safety_3_source_candidates_batch6_20260722.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{cards.innerHTML=[['Kaynak',d.candidate_count],['≥95',d.authority_accuracy_ge_95_count],['Promoted context',d.promoted_context_sources],['Held',d.held_separate_or_future_sources],['Ortalama',d.average_authority_accuracy],['Parsel yükseltme',d.parcel_rows_promoted]].map(x=>`<div class="card"><b>${esc(x[0])}</b><div>${esc(x[1])}</div></div>`).join('');rows.innerHTML=d.rows.map(x=>`<tr><td>${x.line}</td><td>${esc(x.source_id)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.publisher)}</td><td>${esc(x.evidence_date)}</td><td class="${x.decision.startsWith('promoted')?'ok':'hold'}">${esc(x.decision)}</td><td>${x.authority_accuracy}/100</td><td>${esc(x.semantic_limit)}</td><td><a href="${esc(x.official_url)}" target="_blank" rel="noopener">aç</a></td></tr>`).join('')}).catch(e=>document.body.insertAdjacentHTML('beforeend',`<p>Yükleme hatası: ${esc(e.message)}</p>`));</script></body></html>
