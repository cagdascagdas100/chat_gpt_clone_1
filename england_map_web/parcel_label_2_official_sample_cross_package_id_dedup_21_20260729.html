<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_2 — 21. Paket Exact-ID Denetimi</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fa;color:#17202a}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.card,section{background:#fff;border:1px solid #d5d8dc;padding:12px;min-width:150px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px}table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px;font-size:13px}th,td{border:1px solid #d5d8dc;padding:8px;text-align:left;vertical-align:top}th{background:#edf2f7}code,a{word-break:break-all}.pass{color:#176b32;font-weight:700}.hold{color:#9a6700;font-weight:700}.bad{color:#991b1b}</style></head><body><h1>parcel_label_2 — 21. Paket Exact-ID Denetimi</h1><div id="cards" class="cards"></div><div class="warn">Bu denetim exact candidate_id içindir; farklı batchlerdeki semantik isim eşdeğerliği tamamlandı olarak gösterilmez.</div><table><thead><tr><th>#</th><th>Seçilen exact ID</th><th>Sonuç</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('../docs/chatgpt_status/_shared/slots_21/parcel_label_2/recovery/official_sample_cross_package_id_dedup_21_20260729.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{cards.innerHTML=[['Önceki paket',d.scope.previous_packages_scanned],['Önceki aday',d.scope.previous_candidate_occurrences],['Kontrol',d.scope.proposed_candidate_ids_checked],['Çakışma',d.scope.exact_id_collisions]].map(x=>`<div class="card">${x[0]}<br><b>${x[1]}</b></div>`).join('');rows.innerHTML=d.selected_candidate_ids.map((x,i)=>`<tr><td>${i+1}</td><td><code>${x}</code></td><td class="pass">PASS</td></tr>`).join('')})</script></body></html>
