<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>AAYS 1264 3/4 + AI Foto Parsel Kanıtı</title>
<style>
body{font-family:Arial;margin:18px;background:#f8fafc;color:#111827}.summary{border:1px solid #22c55e;background:#ecfdf5;padding:12px;border-radius:10px;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-size:12px;background:white}th,td{border:1px solid #cbd5e1;padding:6px;vertical-align:top}th{background:#dcfce7;position:sticky;top:0}.good{background:#f0fdf4}.pending{background:#fff7ed}.mismatch{background:#fee2e2}.cellbox{max-height:150px;overflow:auto;white-space:pre-wrap}.geom svg{width:240px;height:150px;border:1px solid #94a3b8;background:#fff;border-radius:8px}.score{font-weight:bold;color:#166534}.ai{font-weight:bold;color:#7c2d12}.badge{display:inline-block;padding:2px 6px;border-radius:999px;font-weight:bold}.b-ok{background:#dcfce7;color:#166534}.b-wait{background:#ffedd5;color:#9a3412}.b-bad{background:#fee2e2;color:#991b1b}.thumblink{display:inline-block;margin-top:4px}.small{font-size:11px;color:#475569}.thumb{display:block;width:240px;max-height:170px;object-fit:cover;border:1px solid #94a3b8;border-radius:8px;background:#fff;margin-top:6px}.compare{display:grid;grid-template-columns:250px 250px;gap:8px;align-items:start}.compare-title{font-weight:bold;font-size:11px;color:#334155;margin:3px 0}
</style>
</head>
<body>
<h1>AAYS / 1264 Satır 3/4 Parsel Geometri + AI Fotoğraf Kanıtı</h1>
<div class="summary" id="status">Veri yükleniyor...</div>
<table><thead><tr><th>#</th><th>Source URL</th><th>Evidence</th><th>Doğruluk</th><th>AI Fotoğraf Kanıtı</th><th>Foto-Polygon Uyum</th><th>Yeni Güven</th><th>AI Geometri Kararı</th><th>Parsel Ref / Inspire</th><th>Kenarlar</th><th>Noktalar</th><th>Foto + Parsel Karşılaştırma</th><th>Sonraki iş</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const DATA='../docs/chatgpt_status/aays1/geometry_review_3of4/all_1264_real_geometry_3of4.geojson';
const AI='data/geometry_review_3of4/photo_ai_boundary_review_results.json';
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function getRing(f){try{return f.geometry.coordinates[0][0]||[]}catch(e){return []}}
function dist(a,b){const dx=(a[0]-b[0])*111320*Math.cos((a[1]+b[1])*0.008726646);const dy=(a[1]-b[1])*110540;return Math.sqrt(dx*dx+dy*dy)}
function edgeText(p){let out=[];for(let i=0;i<Math.min(8,p.length-1);i++){out.push(String.fromCharCode(65+i)+'='+dist(p[i],p[i+1]).toFixed(2)+' m')}return out.join('\n')}
function pointText(p){return p.slice(0,12).map((x,i)=>'Nokta_'+(i+1)+'('+x[0]+','+x[1]+')').join('\n')}
function svg(p){if(p.length<3)return 'geometri noktası eksik';let xs=p.map(x=>x[0]),ys=p.map(x=>x[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);let pp=p.slice(0,80).map(x=>{let X=10+(x[0]-minx)/(maxx-minx||1)*220;let Y=140-(x[1]-miny)/(maxy-miny||1)*120;return X.toFixed(1)+','+Y.toFixed(1)}).join(' ');return '<svg viewBox="0 0 240 150"><polygon points="'+pp+'" fill="#dcfce7" stroke="#166534" stroke-width="3"/><text x="10" y="145" font-size="10">existing real parcel polygon</text></svg>'}
function aiByRow(j){let m={};(j.results||[]).forEach(x=>{m[String(x.row_id)]=x});return m}
function classFor(a){if(!a)return 'pending'; if(a.geometry_mismatch_flag===true)return 'mismatch'; if(a.confidence_after==='3.5/4'||a.confidence_after==='3.75/4')return 'good'; return 'pending'}
function badge(text,cls){return '<span class="badge '+cls+'">'+esc(text)+'</span>'}
function photoUrl(a){return a?(a.best_boundary_photo||((a.photo_urls||[])[0])):null}
function photoCell(a){if(!a)return badge('AI bekliyor','b-wait');let u=photoUrl(a);let parts=[];parts.push('<div>'+esc(a.photo_evidence_status||'pending')+'</div>');parts.push('<div class="small">boundary_visible: '+esc(a.photo_boundary_visible)+'</div>');parts.push('<div class="small">photo_shape: '+esc(a.photo_shape_type)+'</div>');parts.push('<div class="small">boundary_type: '+esc(a.photo_boundary_type||'pending')+'</div>');if(u)parts.push('<a class="thumblink" target="_blank" rel="noopener" href="'+esc(u)+'">foto adayı aç</a>');return parts.join('')}
function matchCell(a){if(!a)return badge('bekliyor','b-wait');if(a.geometry_mismatch_flag===true)return badge('MISMATCH','b-bad')+'<br>score: '+esc(a.visual_match_score);if(a.visual_match_score!=null)return badge('UYUM','b-ok')+'<br>score: '+esc(a.visual_match_score);return badge('vision bekliyor','b-wait')}
function decisionCell(a){if(!a)return 'Foto indir + polygon render + Vision compare bekliyor';let out=[];out.push('existing_shape: '+esc(a.existing_polygon_shape_type));out.push('candidate_photo_geometry: '+esc(a.candidate_photo_geometry||'pending'));out.push('mismatch: '+esc(a.geometry_mismatch_flag));out.push('notes: '+esc(a.ai_notes));return '<div class="cellbox">'+out.join('\n')+'</div>'}
function compareCell(a,ring){let u=photoUrl(a);let left=u?'<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" onerror="this.replaceWith(document.createTextNode(\'foto yüklenemedi; linki aç\'))">':'foto bekliyor';return '<div class="compare"><div><div class="compare-title">İlan fotoğraf adayı</div>'+left+'</div><div><div class="compare-title">Mevcut parsel polygonu</div>'+svg(ring)+'</div></div><div class="small">AI görevi: fotoğraftaki sınır çizgisi/çit/yol/ağaç hattı/harita overlay ile mevcut polygon şeklini karşılaştır.</div>'}
function nextCell(a){if(!a)return 'foto kaynakları indirilecek + AI vision karşılaştırma';if(a.geometry_mismatch_flag===true)return 'manuel/ek kaynak geometri recovery';if(a.confidence_after==='3.5/4')return '3.5/4 doğrulandı; sonraki batch';if(a.photo_boundary_visible===true&&a.visual_match_score==null)return 'polygon render + visual match score bekliyor';return 'AI foto kanıtı işlendi veya bekliyor'}
Promise.all([fetch(DATA).then(r=>r.json()),fetch(AI).then(r=>r.json()).catch(()=>({results:[]}))]).then(([j,ai])=>{let data=(j.features||[]).slice(0,1264),am=aiByRow(ai);let upgraded=(ai.results||[]).filter(x=>x.confidence_after==='3.5/4'||x.confidence_after==='3.75/4').length;let mism=(ai.results||[]).filter(x=>x.geometry_mismatch_flag===true).length;document.getElementById('status').textContent='OK: '+data.length+'/1264 satır. AI sonuç: '+(ai.results||[]).length+'. 3.5+ yükselen: '+upgraded+'. mismatch: '+mism+'.';document.getElementById('rows').innerHTML=data.map((f,i)=>{let p=f.properties||{},ring=getRing(f),rowKey=String(i+1),a=am[rowKey]||am[p.row_id]||null;let conf=a?esc(a.confidence_after):'3/4';return '<tr class="'+classFor(a)+'"><td>'+(i+1)+'</td><td>'+esc(p.listing_url)+'</td><td>official_export_20260425 + metadata_inspire_exact + pipeline_verified_source_geometry</td><td class="score">3/4</td><td class="ai">'+photoCell(a)+'</td><td>'+matchCell(a)+'</td><td class="score">'+conf+'</td><td>'+decisionCell(a)+'</td><td>'+esc(p.matched_parcel_ref)+'<br>'+esc(p.matched_inspire_id)+'</td><td><div class="cellbox">'+esc(edgeText(ring))+'</div></td><td><div class="cellbox">'+esc(pointText(ring))+'</div></td><td class="geom">'+compareCell(a,ring)+'<br>REAL_MULTIPOLYGON</td><td>'+nextCell(a)+'</td></tr>'}).join('')}).catch(e=>{document.getElementById('status').textContent='Hata: '+e.message});
</script>
</body></html>
