<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>parcel_label_1 ilerleme</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;line-height:1.45}h1{margin-bottom:6px}.muted{color:#555}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{border:1px solid #bbb;border-radius:8px;padding:12px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #bbb;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#fff}.ok{font-weight:700}.warn{font-weight:700}code{white-space:nowrap}</style></head><body><h1>parcel_label_1</h1><div class="muted">1–30761 · yalnız resmî kaynak araştırma adayları · canonical geometri bağlaması bekliyor</div><p><a href="parcel_label_1_historical_audit.html">198 satırlık tarihsel artifact audit sayfasını aç</a></p><div class="summary" id="summary"></div><table><thead><tr><th>#</th><th>Aday ID</th><th>Yer</th><th>Sınıf</th><th>Doğruluk</th><th>Kaynak</th><th>Kanıt özeti</th><th>Geometri</th><th>Bloker</th></tr></thead><tbody id="rows"><tr><td colspan="9">Yükleniyor…</td></tr></tbody></table><script>
const FILES=['data/distance_property_types/parcel_label_1_candidates.json','data/distance_property_types/parcel_label_1_candidates_batch_5.json'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
Promise.all(FILES.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.json()}))).then(parts=>{const candidates=parts.flatMap(d=>Array.isArray(d.candidates)?d.candidates:[]);const avg=candidates.length?candidates.reduce((s,c)=>s+Number(c.accuracy_percent||0),0)/candidates.length:0;const ge97=candidates.filter(c=>Number(c.accuracy_percent)>=97).length;const cards=[['Görünür aday',candidates.length],['Sınıflandırma doğruluğu','%'+avg.toFixed(2)],['%97+ aday',ge97],['Canonical slot satırı',0],['Exact geometri',0]];document.getElementById('summary').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${esc(x[0])}</div><div class="ok">${esc(x[1])}</div></div>`).join('');document.getElementById('rows').innerHTML=candidates.map((c,i)=>`<tr><td>${i+1}</td><td><code>${esc(c.parcel_id)}</code></td><td>${esc(c.parcel_ref)}</td><td>${esc(c.selected_property_type)}</td><td>%${esc(c.accuracy_percent)}</td><td><a href="${esc(c.source_url)}" target="_blank" rel="noopener">resmî kaynak</a></td><td>${esc(c.fresh_evidence)}</td><td class="warn">${esc(c.geometry_status)}</td><td>${esc(c.conflict_status)}</td></tr>`).join('')}).catch(e=>{document.getElementById('rows').innerHTML=`<tr><td colspan="9">${esc(e.message)}</td></tr>`});
</script></body></html>
