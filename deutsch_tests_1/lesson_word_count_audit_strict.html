body{font-family:Arial,sans-serif;margin:20px;background:#f6f4ef;color:#111827}h1{font-family:Georgia,serif}.box{background:#fff;border:1px solid #ddd6ca;border-radius:14px;padding:14px;margin:12px 0}button{border:0;border-radius:10px;background:#183642;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}th,td{border:1px solid #ddd6ca;padding:8px;vertical-align:top}th{background:#183642;color:#fff;position:sticky;top:0}.ok{background:#ecfdf5}.low{background:#fff7ed}.miss{background:#fee2e2}.num{text-align:right;font-weight:700}.small{font-size:13px;color:#6b7280}.mono{font-family:ui-monospace,Consolas,monospace}pre{white-space:pre-wrap;background:#f3f4f6;padding:10px;border-radius:8px;max-height:260px;overflow:auto}.hidden{display:none}

<body>
<h1>STRICT Güncel Uzun Konu Anlatımı Kelime Sayımı</h1>
<div class="box"><p><b>Eşik: 1400 kelime.</b> 1400 ve üstü OK sayılır; 1400 altı yükseltilmesi gereken içeriktir. Bu sürüm tablo boş kalmasın diye sabit ID fallback listesi kullanır.</p><p class="small">Versiyon: strict-2026-06-15-1400-nonempty-rows-v6.</p><button onclick="startAudit()">Yeniden hesapla</button> <button onclick="downloadCsv()">CSV indir</button><span id="summary" class="small"></span></div>
<div id="result" class="box">Hazır.</div>
<div class="hidden" aria-hidden="true"><div id="testList"></div><div id="modeControls"></div><div id="hist"></div><div id="quiz"></div><div id="lesson"></div><div id="hang"></div><div id="shared"></div><button id="btnLessonShort"></button><button id="btnLessonMedium"></button><button id="btnLessonLong"></button><button id="btnShort"></button><button id="btnMedium"></button><button id="btnLong"></button><button id="btnHang"></button><button id="btnGrade"></button><button id="btnDownload"></button><button id="btnBack"></button><button id="btnLessonBack"></button><button id="btnCheckHang"></button><button id="btnNextHang"></button><button id="btnBack2"></button><button id="btnClearLocal"></button><span id="dbs"></span><span id="pt"></span><span id="pb"></span><span id="ttl"></span><span id="meta"></span><span id="wb"></span><span id="qs"></span><span id="rep"></span><span id="outDummy"></span><span id="lessonTitle"></span><span id="lessonMeta"></span><span id="lessonContent"></span><span id="ht"></span><span id="hh"></span><span id="hm"></span><input id="hi"><span id="hr"></span><span id="so"></span></div>
<script>
const TARGET=1400;let rows=[],loaded=[],errors=[];window.onerror=(m,s,l)=>{errors.push(`${m} @ ${s}:${l}`);return true};
const KNOWN_IDS=['t1','t2','t3','t4','t5','t6','t7','t8','t9','t10','t11','t12','t13','t14','t15','t16','t17','t18','t19','t20','t21','t22','t23','t24','t25','t26','t27','t28','t29','t30','t31','t32','t33','t34','t35','t36','t37','t38'];
const fallbackScripts=['data.js?v=10','data_extra.js?v=1','data_extra2.js?v=1','data_extra3.js?v=1','data_extra4.js?v=1','data_extra5.js?v=1','data_extra6.js?v=1','data_extra7.js?v=1','data_extra8.js?v=1','data_grammar.js?v=2','data_grammar_satzmuster1.js?v=1','data_nvv.js?v=1','data_bevor_schreiben.js?v=3','data_bevor_ebooks.js?v=4','data_bevor_ebooks_nachteile.js?v=4','data_bevor_massentourismus.js?v=1','data_bevor_massentourismus_nachteile.js?v=1','data_bevor_studium_ausland_nachteile.js?v=2','data_bevor_mehrsprachiges_aufwachsen_nachteile.js?v=1','mindestlohn_nachteile_neu.js?v=2','data_bevor_teamarbeit_nachteile.js?v=1','data_bevor_individualitaet_nachteile.js?v=1','data_bevor_lebenslanges_lernen_nachteile.js?v=1','lesson_data.js?v=1','lesson_extra2.js?v=1','lesson_rich.js?v=1','lesson_extra3.js?v=1','lesson_extra4.js?v=1','lesson_extra5.js?v=1','lesson_extra6.js?v=1','lesson_extra7.js?v=1','lesson_extra8.js?v=1','lesson_grammar.js?v=2','lesson_nvv.js?v=1','lesson_bevor_schreiben.js?v=4','lesson_bevor_ebooks.js?v=1','lesson_bevor_ebooks_nachteile.js?v=4','lesson_bevor_massentourismus.js?v=1','lesson_bevor_massentourismus_nachteile.js?v=1','app_instant.js?v=2','difficulty_upgrade.js?v=1','difficulty_upgrade_v2.js?v=1','category_override.js?v=3','hang_letters.js?v=1','lesson_mode.js?v=6','lesson_examples.js?v=3','ui_cleanup.js?v=2','theme_controls.js?v=3','ebook_nachteile_audio.js?v=7','lesson_final_fix.js?v=2','mindestlohn_force_kalip_render.js?v=1','teamarbeit_word_full_lesson.js?v=1','teamarbeit_lesson_force.js?v=4','individualitaet_hard_capture.js?v=1','individualitaet_final_fix.js?v=1','individualitaet_super_override.js?v=1','lebenslanges_lernen_final_fix.js?v=2','lebenslanges_lernen_super_override.js?v=1','werbung_nachteile_final_fix.js?v=2','werbung_nachteile_long_full_override.js?v=1','werbung_medien_nachteile_final_fix.js?v=1','fertiggerichte_vorteile_bevor_fix.js?v=4','fertiggerichte_vorteile_word_long_override.js?v=1','fertiggerichte_nachteile_bevor.js?v=3','fertiggerichte_nachteile_visible_fix.js?v=1','data_bevor_online_studium_vorteile.js?v=1','online_studium_vorteile_long_full_override.js?v=1','lesson_long_1500_overrides_batch1.js?v=1','lesson_long_1500_overrides_batch2.js?v=1','lesson_long_1500_overrides_batch3.js?v=1','lesson_long_1500_completion_booster.js?v=1','online_studium_vorteile_word_full_override.js?v=2','online_studium_vorteile_word_tables_override.js?v=1','data_grammar_satzmuster1.js?v=2'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function txt(html){const d=document.createElement('div');d.innerHTML=String(html||'').replace(/<style[\s\S]*?<\/style>/gi,' ');return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}
function wc(html){const m=txt(html).match(/[A-Za-zÄÖÜäöüßÀ-ÿ0-9]+(?:[-’'][A-Za-zÄÖÜäöüßÀ-ÿ0-9]+)*/g);return m?m.length:0;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function readHtml(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' alınamadı: '+r.status);return await r.text();}
async function scriptList(){let h='';try{h=await readHtml('test.html?auditStrict='+Date.now());}catch(e1){errors.push('Yerel test.html uyarısı: '+e1.message);try{h=await readHtml('https://raw.githubusercontent.com/cagdascagdas100/chat_gpt_clone_1/main/deutsch_tests_1/test.html?auditStrict='+Date.now());}catch(e2){errors.push('GitHub raw test.html uyarısı: '+e2.message);errors.push('Fallback script listesi kullanılıyor.');return fallbackScripts.slice();}}const doc=new DOMParser().parseFromString(h,'text/html');const list=[...doc.querySelectorAll('script[src]')].map(s=>s.getAttribute('src')).filter(Boolean);if(!list.length){errors.push('script listesi boş; fallback kullanılıyor');return fallbackScripts.slice();}return list;}
function load(src){return new Promise(res=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(!done){done=true;errors.push('timeout: '+src);res();}},9000);s.onload=()=>{if(!done){done=true;clearTimeout(timer);loaded.push(src);res();}};s.onerror=()=>{if(!done){done=true;clearTimeout(timer);errors.push('yüklenemedi: '+src);res();}};s.src=src+(src.includes('?')?'&':'?')+'strict='+Date.now();document.head.appendChild(s);});}
function longFields(o){return[o.long,o.lessonLong,o.longLesson,o.contentLong,o.html,o.content].filter(Boolean)}
function bestLesson(id,field){const a=(window.DEUTSCH_LESSONS||{})[id]||{},b=(window.LESSONS||{})[id]||{},t=(window.DEUTSCH_TESTS||{})[id]||{};let vals=[a[field],b[field],t[field]].filter(Boolean);if(field==='long')vals=vals.concat(longFields(a),longFields(b),longFields(t));vals.sort((x,y)=>wc(y)-wc(x));const top=vals[0]||'';return{count:wc(top),src:top?'FINAL_BEST':''};}
function title(id){const t=(window.DEUTSCH_TESTS||{})[id]||{},a=(window.DEUTSCH_LESSONS||{})[id]||{},b=(window.LESSONS||{})[id]||{};return t.title||t.baslik||a.title||a.baslik||b.title||b.baslik||id;}
function cat(id){const t=(window.DEUTSCH_TESTS||{})[id]||{},a=(window.DEUTSCH_LESSONS||{})[id]||{},b=(window.LESSONS||{})[id]||{};return t.category||t.cat||a.category||a.cat||b.category||b.cat||'';}
function status(n){return !n?'EKSİK':(n<TARGET?'1400 ALTI':'OK')}function cls(n){return !n?'miss':(n<TARGET?'low':'ok')}
function runGuards(){try{if(typeof window.__ensureAllLongLessons1500==='function')window.__ensureAllLongLessons1500();}catch(e){}try{if(typeof window.__ensureAllLongLessons1500Final==='function')window.__ensureAllLongLessons1500Final();}catch(e){}try{if(typeof window.__forceLongLessons1500Final==='function')window.__forceLongLessons1500Final();}catch(e){}try{if(typeof window.__boostSatzmuster2Source==='function')window.__boostSatzmuster2Source();}catch(e){}}
function makeRows(){const ids={};KNOWN_IDS.forEach(k=>ids[k]=1);[window.DEUTSCH_TESTS,window.DEUTSCH_LESSONS,window.LESSONS].forEach(o=>Object.keys(o||{}).forEach(k=>ids[k]=1));rows=Object.keys(ids).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(id=>{const sh=bestLesson(id,'short'),med=bestLesson(id,'medium'),lo=bestLesson(id,'long');return{id,category:cat(id),title:title(id),short:sh.count,medium:med.count,long:lo.count,longStatus:status(lo.count),longSource:lo.src};});}
function render(){const ok=rows.filter(r=>r.long>=TARGET).length,low=rows.filter(r=>r.long>0&&r.long<TARGET).length,miss=rows.filter(r=>!r.long).length;summary.textContent=` Toplam: ${rows.length} · OK ${TARGET}+: ${ok} · ${TARGET} altı: ${low} · eksik: ${miss} · script: ${loaded.length} · hata/uyarı: ${errors.length}`;const sorted=rows.slice().sort((a,b)=>a.long-b.long);result.innerHTML='<table><thead><tr><th>ID</th><th>Kategori</th><th>Başlık</th><th>Kısa</th><th>Orta</th><th>Uzun</th><th>Durum</th><th>Kaynak</th></tr></thead><tbody>'+sorted.map(r=>`<tr class="${cls(r.long)}"><td class="mono">${esc(r.id)}</td><td>${esc(r.category)}</td><td>${esc(r.title)}</td><td class="num">${r.short}</td><td class="num">${r.medium}</td><td class="num">${r.long}</td><td>${r.longStatus}</td><td>${esc(r.longSource)}</td></tr>`).join('')+'</tbody></table>'+(errors.length?`<details open><summary>Uyarılar</summary><pre>${esc(errors.join('\n'))}</pre></details>`:'');}
async function startAudit(){errors=[];loaded=[];rows=[];result.textContent='Scriptler yükleniyor...';let list=await scriptList();for(let i=0;i<list.length;i++){summary.textContent=` Yükleniyor: ${i+1}/${list.length} ${list[i]}`;await load(list[i]);}for(const extra of ['data_grammar_satzmuster2_full.js?v=4','t37_satzmuster2_source_boost.js?v=2','data_bevor_online_studium_nachteile.js?v=6','lesson_long_1500_final_guard.js?v=3']){await load(extra);}runGuards();await sleep(1800);runGuards();await sleep(700);runGuards();makeRows();render();}
function downloadCsv(){const lines=['ID,Kategori,Baslik,Kisa,Orta,Uzun,UzunDurum,UzunKaynak'].concat(rows.map(r=>[r.id,r.category,r.title,r.short,r.medium,r.long,r.longStatus,r.longSource].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')));const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lesson_word_count_audit_strict_1400.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
startAudit();
</script>
