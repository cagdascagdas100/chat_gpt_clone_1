<script>
const lessons=[
{id:'t40',cat:'Bevor Schreiben',title:'Selbstoptimierung durch Vorbilder – Vorteile · C1/C2 Vorteilsabsatz',source:'Selbstoptimierung_durch_Vorbilder_Vorteile_4_C1_C2_15_20(1).docx',short:'Vorbilder können Motivation geben, Ziele sichtbar machen und konkrete Wege zur persönlichen Weiterentwicklung zeigen.',medium:'Eine sinnvolle Selbstoptimierung durch Vorbilder bedeutet nicht blinde Nachahmung, sondern bewusste Orientierung. Nützlich sind Vorbilder vor allem dann, wenn sie Motivation wecken, Strategien zeigen, Selbstvertrauen stärken und positive Gewohnheiten fördern.',long:`<h3>Selbstoptimierung durch Vorbilder – Vorteile</h3><p><b>Grundthese:</b> Vorbilder können einen wichtigen Beitrag zur Selbstoptimierung leisten, weil sie Motivation geben, konkrete Wege zeigen und Menschen dazu ermutigen, ihre Fähigkeiten Schritt für Schritt weiterzuentwickeln.</p><table><tr><th>Vorteil</th><th>Kernidee</th></tr><tr><td>Motivation und Zielorientierung</td><td>Vorbilder machen Ziele greifbar und geben neuen Antrieb.</td></tr><tr><td>Lernen durch Beispiele</td><td>Menschen können Strategien, Routinen und Erfahrungen anderer nutzen.</td></tr><tr><td>Selbstvertrauen</td><td>Erfolge anderer zeigen, dass Veränderung möglich ist.</td></tr><tr><td>Positive Gewohnheiten</td><td>Disziplin, Routinen und Alltagstruktur werden sichtbar.</td></tr></table><h4>Prüfungswörter und NVV</h4><p>die Zielorientierung, der Antrieb, die Eigeninitiative, das Durchhaltevermögen, die Selbstwirksamkeit, die Veränderungsbereitschaft; sich an einem Vorbild orientieren, Motivation wecken, Ziele klarer formulieren, aus Erfahrungen anderer lernen, gute Gewohnheiten übernehmen, Verantwortung für die eigene Entwicklung übernehmen.</p><h4>Musterabsatz</h4><p>Ein wesentlicher Vorteil der Selbstoptimierung durch Vorbilder liegt darin, dass sie Motivation und Zielorientierung fördern kann. Viele Menschen haben zwar Wünsche, wissen aber nicht genau, wie sie diese erreichen sollen. Ein Vorbild macht sichtbar, dass Entwicklung möglich ist, wenn man regelmäßig übt, Rückschläge akzeptiert und eigene Ziele schrittweise verfolgt. Dadurch entsteht neuer Antrieb. Besonders in Schule, Studium, Beruf oder Sport können positive Beispiele helfen, eigene Fähigkeiten bewusster auszubauen.</p>`},
{id:'t41',cat:'Bevor Schreiben',title:'Selbstoptimierung durch Vorbilder – Nachteile · C1/C2 Nachteilsabsatz',source:'Selbstoptimierung_durch_Vorbilder_Nachteile_4_C1_C2_15_20(1).docx',short:'Vorbilder können Druck, Vergleich und unrealistische Erwartungen erzeugen.',medium:'Problematisch wird Selbstoptimierung durch Vorbilder, wenn Menschen sich ständig vergleichen, fremde Maßstäbe übernehmen, Perfektion anstreben oder ihre eigene Individualität verlieren.',long:`<h3>Selbstoptimierung durch Vorbilder – Nachteile</h3><p><b>Grundthese:</b> Selbstoptimierung durch Vorbilder kann zwar motivierend wirken, führt jedoch häufig zu Vergleichsdruck, unrealistischen Erwartungen, Verlust der eigenen Individualität und einer Abhängigkeit von äußerer Anerkennung.</p><table><tr><th>Nachteil</th><th>Kernidee</th></tr><tr><td>Vergleichsdruck</td><td>Das eigene Leben wird mit idealisierten Darstellungen verglichen.</td></tr><tr><td>Perfektionsdruck</td><td>Menschen glauben, immer produktiv und erfolgreich sein zu müssen.</td></tr><tr><td>Verlust der Individualität</td><td>Fremde Ziele ersetzen eigene Bedürfnisse.</td></tr><tr><td>Konsumdruck</td><td>Produkte, Likes und Anerkennung werden zu Maßstäben.</td></tr></table><h4>Prüfungswörter und NVV</h4><p>der Vergleichsdruck, das Selbstwertgefühl, der Perfektionsdruck, die Überforderung, die Fremdbestimmung, die Anerkennungssuche; sich ständig vergleichen, unter Druck geraten, unrealistische Erwartungen wecken, eigene Ziele aus den Augen verlieren, fremde Maßstäbe übernehmen, nach Anerkennung streben.</p><h4>Musterabsatz</h4><p>Ein wesentlicher Nachteil der Selbstoptimierung durch Vorbilder liegt im Vergleichsdruck. Besonders in sozialen Medien werden oft nur Erfolge, schöne Körper und perfekte Routinen gezeigt. Schwierigkeiten, Rückschläge und normale Alltagsprobleme bleiben dagegen unsichtbar. Dadurch entsteht ein verzerrtes Bild von Erfolg. Wer sein normales Leben ständig mit idealisierten Darstellungen vergleicht, kann schnell unzufrieden werden. Langfristig kann dies das Selbstwertgefühl schwächen und psychischen Druck verstärken.</p>`},
{id:'t42',cat:'Bevor Schreiben',title:'Freizeit planen – Vorteile · C1/C2 Vorteilsabsatz',source:'Freizeit_planen_Vorteile_4_C1_C2_15_20(1).docx / Freizeitplanung_Vorteile_4_C1_C2_15_20_pruefungsnah(1).docx',short:'Freizeitplanung kann Erholung sichern, Stress reduzieren und freie Zeit bewusster nutzbar machen.',medium:'Eine bewusste Freizeitplanung hilft, Pflichten, Hobbys, Erholung und soziale Kontakte besser zu verbinden. Sie bedeutet nicht starre Kontrolle, sondern Orientierung im Alltag.',long:`<h3>Freizeit planen – Vorteile</h3><p><b>Grundthese:</b> Eine bewusste Planung der Freizeit kann dazu beitragen, Pflichten und persönliche Interessen besser zu vereinbaren, Stress zu reduzieren und die freie Zeit sinnvoller zu nutzen.</p><table><tr><th>Vorteil</th><th>Kernidee</th></tr><tr><td>Bessere Vereinbarkeit von Pflichten und Hobbys</td><td>Pflichten, Hobbys und persönliche Interessen werden besser verbunden.</td></tr><tr><td>Bessere Erholung und weniger Stress</td><td>Pausen und Erholungsphasen bekommen einen festen Platz.</td></tr><tr><td>Sinnvollere Nutzung der freien Zeit</td><td>Freizeit wird nicht nur passiv verbracht, sondern bewusst gestaltet.</td></tr><tr><td>Stärkere soziale Beziehungen</td><td>Familie, Freunde und gemeinsame Aktivitäten werden verlässlicher gepflegt.</td></tr></table><h4>1. Bessere Vereinbarkeit von Pflichten und Hobbys</h4><p>Ein wichtiger Vorteil besteht darin, dass Freizeitplanung verschiedene Lebensbereiche miteinander verbindet. Viele Menschen haben Schule, Studium, Beruf, Haushalt oder familiäre Aufgaben. Ohne Planung werden Hobbys und persönliche Interessen leicht verschoben. Wer den Alltag strukturiert, erkennt freie Zeitfenster und kann Sport, Musik, Lesen oder Erholung bewusst einplanen. Dadurch entsteht weniger Terminchaos und mehr Planungssicherheit.</p><h4>2. Bessere Erholung und weniger Stress</h4><p>Freizeitplanung sorgt dafür, dass Erholung nicht dem Zufall überlassen wird. Geplante Pausen, Spaziergänge, Sport oder ruhige Abende helfen, Abstand von Pflichten zu gewinnen. Besonders in Prüfungsphasen oder bei hoher Arbeitsbelastung kann dies Stress reduzieren und die Work-Life-Balance verbessern.</p><h4>3. Sinnvolle Zeitnutzung</h4><p>Ohne klare Idee vergeht freie Zeit häufig am Handy, vor Serien oder mit zufälligen Tätigkeiten. Planung hilft, Prioritäten zu setzen und Aktivitäten auszuwählen, die wirklich guttun. Dadurch bekommt Freizeit mehr Qualität und führt langfristig zu mehr Zufriedenheit.</p><h4>4. Soziale Beziehungen</h4><p>Freunde und Familie kommen in einem vollen Alltag oft zu kurz. Wenn Treffen, Familienzeit oder gemeinsame Aktivitäten geplant werden, entsteht mehr Verlässlichkeit. Gemeinsame Erlebnisse stärken das Zugehörigkeitsgefühl und erhöhen die Lebensqualität.</p><h4>Wortbank und Satzbausteine</h4><p>die Freizeitplanung, die Alltagsorganisation, die Zeitstruktur, die Vereinbarkeit, die Erholung, die Work-Life-Balance, die Planungssicherheit, die Lebensqualität; Freizeit bewusst planen, Prioritäten setzen, Pausen einplanen, Stress reduzieren, soziale Kontakte stärken, den Alltag strukturieren, Erholungsphasen sichern. Ein wesentlicher Vorteil liegt darin, dass ... Dies lässt sich damit begründen, dass ... Langfristig betrachtet kann dies dazu führen, dass ...</p><h4>Musterabsatz</h4><p>Ein wesentlicher Vorteil der Freizeitplanung liegt darin, dass Pflichten und Hobbys besser miteinander vereinbart werden können. Viele Menschen haben im Alltag zahlreiche Verpflichtungen und merken oft erst spät, dass persönliche Interessen zu kurz kommen. Durch eine bewusste Planung erkennt man leichter, wann Zeit für Sport, Freunde, Familie oder Ruhe bleibt. Dadurch wird Freizeit nicht als zufälliger Rest des Tages behandelt, sondern als wichtiger Bestandteil eines ausgeglichenen Lebens. Langfristig kann dies zu mehr Zufriedenheit, besserer Erholung und höherer Lebensqualität führen.</p>`}
];
let current=null,quizItems=[],hangTerms=[],hangIndex=0;
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function render(){testList.innerHTML='<h3>Bevor Schreiben</h3>'+lessons.map((l,i)=>`<button onclick="choose(${i})">${esc(l.title)}</button>`).join(' ')}
function choose(i){current=lessons[i];modeControls.classList.remove('hide');document.getElementById('dbs').textContent='Seçili: '+current.title}
function hideAll(){start.classList.add('hide');lesson.classList.add('hide');quiz.classList.add('hide');hang.classList.add('hide')}
function back(){hideAll();start.classList.remove('hide')}
function showLesson(kind){if(!current)return;hideAll();lesson.classList.remove('hide');lessonTitle.textContent=current.title;lessonMeta.textContent='Kaynak: '+current.source;lessonContent.innerHTML=current[kind]}
function makeQuiz(l){return[{q:'Welche Nomen-Verb-Verbindung passt?',o:['Stress reduzieren','Stress machen','Stress bekommen machen','Stress sein'],a:0},{q:'Welche Formulierung ist prüfungsnah?',o:['Ein wesentlicher Vorteil liegt darin, dass ...','Das ist sehr gut und fertig.','Ich denke Freizeit ist schön.','Man macht Freizeit.'],a:0},{q:'Welche Präposition passt? Zeit ___ Hobbys einplanen.',o:['für','bei','aus','gegen'],a:0},{q:'Welcher Konnektor zeigt eine Folge?',o:['infolgedessen','obwohl','während','trotz'],a:0},{q:'Welche Aussage passt zum Thema?',o:[l.title.includes('Nachteile')?'Vorbilder können Vergleichsdruck erzeugen.':'Freizeitplanung kann Lebensqualität erhöhen.','Dieses Thema hat keine Alltagbeispiele.','Satzbausteine sind unwichtig.','C1/C2 braucht keine NVV.'],a:0}]}
function startQuiz(){if(!current)return;hideAll();quiz.classList.remove('hide');quizTitle.textContent=current.title+' · Test';quizItems=makeQuiz(current);qs.innerHTML=quizItems.map((x,i)=>`<div class="q"><b>${i+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('');out.innerHTML=''}
function grade(){let ok=0;quizItems.forEach((x,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`);if(v&&+v.value===x.a)ok++});out.innerHTML='<h3>Sonuç: '+ok+'/'+quizItems.length+'</h3>'}
function startHang(){if(!current)return;hideAll();hang.classList.remove('hide');hangTitle.textContent=current.title+' · Harf kutucukları';hangTerms=(current.title.includes('Freizeit')?['Freizeitplanung','Prioritäten setzen','Pausen einplanen','Stress reduzieren','Lebensqualität erhöhen']:current.title.includes('Nachteile')?['Vergleichsdruck','Perfektionsdruck','fremde Maßstäbe übernehmen','nach Anerkennung streben','Selbstwertgefühl schwächen']:['Zielorientierung','Motivation wecken','Durchhaltevermögen stärken','positive Gewohnheiten','Verantwortung übernehmen']);hangIndex=0;nextHang()}
function mask(t){return t.replace(/[A-Za-zÄÖÜäöüß]/g,'_')}
function nextHang(){hangInput.value='';hangOut.innerHTML='';let t=hangTerms[hangIndex%hangTerms.length];hangHint.textContent='Begriff '+(hangIndex+1)+'/'+hangTerms.length;hangMask.textContent=mask(t);hangIndex++}
function checkHang(){let t=hangTerms[(hangIndex-1+hangTerms.length)%hangTerms.length].toLowerCase();let v=hangInput.value.trim().toLowerCase();hangOut.innerHTML=v===t?'<p class="ok">Richtig.</p>':'<p class="no">Doğru cevap: '+esc(t)+'</p>'}
render();
</script>
