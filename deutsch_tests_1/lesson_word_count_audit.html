<body>
<h1>Konu Anlatımı Kelime Sayımı</h1>
<div class="box">
<p>Bu sayfa uygulamadaki ders verilerini okur ve her test için <b>kısa / orta / uzun konu anlatımı</b> kelime sayısını hesaplar.</p>
<p class="small">Eşikler: kısa &lt; 80 = düşük, orta &lt; 250 = düşük, uzun &lt; 800 = düşük. Eksik içerik 0 olarak görünür.</p>
<button onclick="runAudit()">Tekrar hesapla</button>
<button onclick="downloadCsv()">CSV indir</button>
<span id="summary" class="small"></span>
</div>
<div id="out" class="box">Yükleniyor...</div>

<div class="hidden">
  <div id="testList"></div><div id="modeControls" class="hide"></div><div id="hist"></div><div id="quiz"></div><div id="lesson"></div><div id="hang"></div><div id="shared"></div>
  <button id="btnLessonShort"></button><button id="btnLessonMedium"></button><button id="btnLessonLong"></button><button id="btnShort"></button><button id="btnMedium"></button><button id="btnLong"></button><button id="btnHang"></button><button id="btnGrade"></button><button id="btnDownload"></button><button id="btnBack"></button><button id="btnLessonBack"></button><button id="btnCheckHang"></button><button id="btnNextHang"></button><button id="btnBack2"></button><button id="btnClearLocal"></button>
  <span id="dbs"></span><span id="pt"></span><span id="pb"></span><span id="ttl"></span><span id="meta"></span><span id="wb"></span><span id="qs"></span><span id="rep"></span><span id="out2"></span><span id="lessonTitle"></span><span id="lessonMeta"></span><span id="lessonContent"></span><span id="ht"></span><span id="hh"></span><span id="hm"></span><input id="hi"><span id="hr"></span><span id="so"></span>
</div>

window.onerror=function(msg,src,line,col,err){window.__auditErrors.push(String(msg||'')+' @ '+String(src||'')+':'+String(line||''));return true;};
</script>
<script src="data.js?v=10"></script><script src="data_extra.js?v=1"></script><script src="data_extra2.js?v=1"></script><script src="data_extra3.js?v=1"></script><script src="data_extra4.js?v=1"></script><script src="data_extra5.js?v=1"></script><script src="data_extra6.js?v=1"></script><script src="data_extra7.js?v=1"></script><script src="data_extra8.js?v=1"></script><script src="data_grammar.js?v=2"></script><script src="data_nvv.js?v=1"></script><script src="data_bevor_schreiben.js?v=3"></script><script src="data_bevor_ebooks.js?v=4"></script><script src="data_bevor_ebooks_nachteile.js?v=4"></script><script src="data_bevor_massentourismus.js?v=1"></script><script src="data_bevor_massentourismus_nachteile.js?v=1"></script><script src="data_bevor_studium_ausland_nachteile.js?v=2"></script><script src="data_bevor_mehrsprachiges_aufwachsen_nachteile.js?v=1"></script><script src="mindestlohn_nachteile_neu.js?v=2"></script><script src="mindestlohn_kalip_ornek_update.js?v=1"></script><script src="data_bevor_teamarbeit_nachteile.js?v=1"></script><script src="data_bevor_individualitaet_nachteile.js?v=1"></script><script src="data_bevor_lebenslanges_lernen_nachteile.js?v=1"></script><script src="lesson_data.js?v=1"></script><script src="lesson_extra2.js?v=1"></script><script src="lesson_rich.js?v=1"></script><script src="lesson_extra3.js?v=1"></script><script src="lesson_extra4.js?v=1"></script><script src="lesson_extra5.js?v=1"></script><script src="lesson_extra6.js?v=1"></script><script src="lesson_extra7.js?v=1"></script><script src="lesson_extra8.js?v=1"></script><script src="lesson_grammar.js?v=2"></script><script src="lesson_nvv.js?v=1"></script><script src="lesson_bevor_schreiben.js?v=4"></script><script src="lesson_bevor_ebooks.js?v=1"></script><script src="lesson_bevor_ebooks_nachteile.js?v=4"></script><script src="lesson_bevor_massentourismus.js?v=1"></script><script src="lesson_bevor_massentourismus_nachteile.js?v=1"></script><script src="app_instant.js?v=2"></script><script src="difficulty_upgrade.js?v=1"></script><script src="difficulty_upgrade_v2.js?v=1"></script><script src="category_override.js?v=3"></script><script src="hang_letters.js?v=1"></script><script src="lesson_mode.js?v=6"></script><script src="lesson_examples.js?v=3"></script><script src="ui_cleanup.js?v=2"></script><script src="theme_controls.js?v=3"></script><script src="ebook_nachteile_audio.js?v=7"></script><script src="lesson_final_fix.js?v=2"></script><script src="mindestlohn_force_kalip_render.js?v=1"></script><script src="teamarbeit_word_full_lesson.js?v=1"></script><script src="teamarbeit_lesson_force.js?v=4"></script><script src="individualitaet_hard_capture.js?v=1"></script><script src="individualitaet_final_fix.js?v=1"></script><script src="individualitaet_super_override.js?v=1"></script><script src="lebenslanges_lernen_final_fix.js?v=2"></script><script src="lebenslanges_lernen_super_override.js?v=1"></script><script src="werbung_nachteile_final_fix.js?v=2"></script><script src="werbung_nachteile_long_full_override.js?v=1"></script><script src="werbung_medien_nachteile_final_fix.js?v=1"></script><script src="fertiggerichte_vorteile_bevor_fix.js?v=4"></script><script src="fertiggerichte_vorteile_word_long_override.js?v=1"></script><script src="fertiggerichte_nachteile_bevor.js?v=3"></script><script src="fertiggerichte_nachteile_visible_fix.js?v=1"></script>
<script>
var AUDIT_ROWS=[];
function decodeHtml(s){var d=document.createElement('div');d.innerHTML=String(s||'');return d.textContent||d.innerText||'';}
function plainText(s){return decodeHtml(String(s||'').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ')).replace(/\s+/g,' ').trim();}
function wordCount(s){var t=plainText(s);if(!t)return 0;var m=t.match(/[A-Za-zÄÖÜäöüßÀ-ÿ0-9]+(?:[-’'][A-Za-zÄÖÜäöüßÀ-ÿ0-9]+)*/g);return m?m.length:0;}
function lessonFor(key){var d=window.DEUTSCH_LESSONS||{};var l=window.LESSONS||{};return d[key]||l[key]||{};}
function testFor(key){return (window.DEUTSCH_TESTS||{})[key]||{};}
function classify(mode,n){if(!n)return 'EKSİK';if(mode==='short'&&n<80)return 'DÜŞÜK';if(mode==='medium'&&n<250)return 'DÜŞÜK';if(mode==='long'&&n<800)return 'DÜŞÜK';return 'OK';}
function rowClass(r){if(r.shortStatus==='EKSİK'||r.mediumStatus==='EKSİK'||r.longStatus==='EKSİK')return 'bad';if(r.shortStatus==='DÜŞÜK'||r.mediumStatus==='DÜŞÜK'||r.longStatus==='DÜŞÜK')return 'warn';return 'ok';}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function runAudit(){
  var keys={};
  Object.keys(window.DEUTSCH_TESTS||{}).forEach(function(k){keys[k]=1;});
  Object.keys(window.DEUTSCH_LESSONS||{}).forEach(function(k){keys[k]=1;});
  Object.keys(window.LESSONS||{}).forEach(function(k){keys[k]=1;});
  var rows=Object.keys(keys).sort(function(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true});}).map(function(k){
    var t=testFor(k), les=lessonFor(k);
    var sw=wordCount(les.short), mw=wordCount(les.medium), lw=wordCount(les.long);
    return {key:k,category:t.category||t.cat||'',title:t.title||les.title||k,short:sw,medium:mw,long:lw,shortStatus:classify('short',sw),mediumStatus:classify('medium',mw),longStatus:classify('long',lw)};
  });
  AUDIT_ROWS=rows;
  var bad=rows.filter(function(r){return rowClass(r)!=='ok';}).length;
  document.getElementById('summary').textContent='Toplam '+rows.length+' kayıt; sorunlu/şüpheli '+bad+' kayıt.'+(window.__auditErrors.length?' Script uyarısı: '+window.__auditErrors.length:'');
  var html='<table><thead><tr><th>ID</th><th>Kategori</th><th>Başlık</th><th>Kısa</th><th>Orta</th><th>Uzun</th><th>Durum</th></tr></thead><tbody>';
  rows.forEach(function(r){html+='<tr class="'+rowClass(r)+'"><td class="mono">'+esc(r.key)+'</td><td>'+esc(r.category)+'</td><td>'+esc(r.title)+'</td><td>'+r.short+' <span class="small">'+r.shortStatus+'</span></td><td>'+r.medium+' <span class="small">'+r.mediumStatus+'</span></td><td>'+r.long+' <span class="small">'+r.longStatus+'</span></td><td>'+esc([r.shortStatus,r.mediumStatus,r.longStatus].join(' / '))+'</td></tr>';});
  html+='</tbody></table>';
  if(window.__auditErrors.length){html+='<details><summary>Script uyarıları</summary><pre>'+esc(window.__auditErrors.join('\n'))+'</pre></details>';}
  document.getElementById('out').innerHTML=html;
}
function downloadCsv(){
  var lines=['ID,Kategori,Baslik,Kisa,Orta,Uzun,KisaDurum,OrtaDurum,UzunDurum'];
  AUDIT_ROWS.forEach(function(r){lines.push([r.key,r.category,r.title,r.short,r.medium,r.long,r.shortStatus,r.mediumStatus,r.longStatus].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(','));});
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lesson_word_count_audit.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
setTimeout(runAudit,900);
</script>
